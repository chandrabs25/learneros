[project]
name = "ai-tutor-backend"
version = "0.1.0"
description = "AI Tutor — FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "neo4j>=5.27.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "firebase-admin>=6.6.0",
    "groq>=0.15.0",
    "google-genai>=1.64.0",
    "openai>=1.0.0",
    "langgraph>=0.2.62",
    "mlflow[genai]>=2.20.0",
    "hdbscan>=0.8.40",
]

[project.scripts]
dev = "uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
