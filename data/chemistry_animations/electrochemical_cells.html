<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead-Acid Battery Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        text {
            user-select: none;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
        }

        /* Macro Animation Timings (24s Loop)
           0% - 41.67% (10s): Discharge
           41.67% - 50% (2s): Transition to Charge
           50% - 91.67% (10s): Charge
           91.67% - 100% (2s): Transition to Reset
        */

        /* Electrolyte Concentration */
        .electrolyte {
            animation: electrolyte-anim 24s infinite;
        }
        @keyframes electrolyte-anim {
            0%, 100% { fill-opacity: 0.4; }
            41.67%, 50% { fill-opacity: 0.15; }
        }

        /* PbSO4 Crust */
        .crust {
            animation: crust-anim 24s infinite;
        }
        @keyframes crust-anim {
            0%, 100% { opacity: 0; }
            41.67%, 50% { opacity: 0.85; }
            91.67% { opacity: 0; }
        }

        /* Ion Translations */
        .anode-so4 {
            animation: anode-so4-anim 24s infinite;
        }
        @keyframes anode-so4-anim {
            0%, 100% { transform: translate(0, 0); opacity: 1; }
            38% { transform: translate(-50px, 0); opacity: 1; }
            41.67%, 50% { transform: translate(-50px, 0); opacity: 0; }
            53% { transform: translate(-50px, 0); opacity: 1; }
            91.67% { transform: translate(0, 0); opacity: 1; }
        }

        .cathode-ion {
            animation: cathode-ion-anim 24s infinite;
        }
        @keyframes cathode-ion-anim {
            0%, 100% { transform: translate(0, 0); opacity: 1; }
            38% { transform: translate(50px, 0); opacity: 1; }
            41.67%, 50% { transform: translate(50px, 0); opacity: 0; }
            53% { transform: translate(50px, 0); opacity: 1; }
            91.67% { transform: translate(0, 0); opacity: 1; }
        }

        .cathode-h2o {
            animation: cathode-h2o-anim 24s infinite;
        }
        @keyframes cathode-h2o-anim {
            0%, 100% { transform: translate(50px, 0); opacity: 0; }
            5% { transform: translate(50px, 0); opacity: 1; }
            41.67%, 50% { transform: translate(0, 0); opacity: 1; }
            86% { transform: translate(50px, 0); opacity: 1; }
            91.67% { transform: translate(50px, 0); opacity: 0; }
        }

        /* Circuit Components */
        .lightbulb-group {
            animation: bulb-group-anim 24s infinite;
        }
        @keyframes bulb-group-anim {
            0%, 41.67% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }

        .lightbulb-glow {
            animation: bulb-glow-anim 24s infinite;
        }
        @keyframes bulb-glow-anim {
            0%, 41.67% { fill: #FFFF00; filter: drop-shadow(0 0 12px #FFFF00); }
            42%, 100% { fill: #e0e0e0; filter: none; }
        }

        .charger-group {
            animation: charger-group-anim 24s infinite;
        }
        @keyframes charger-group-anim {
            0%, 45% { opacity: 0; }
            50%, 91.67% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        
        .charger-light {
            animation: charger-light-anim 24s infinite;
        }
        @keyframes charger-light-anim {
            0%, 49% { fill: #555; filter: none; }
            50%, 91.67% { fill: #44CC44; filter: drop-shadow(0 0 8px #44CC44); }
            92%, 100% { fill: #555; filter: none; }
        }

        /* Electron Flow */
        .electron-path {
            stroke: #F77F00;
            stroke-width: 5;
            stroke-dasharray: 8, 24;
            fill: none;
            filter: drop-shadow(0 0 6px #F77F00);
        }

        .electron-discharge {
            animation: flow-right 1s linear infinite, macro-discharge 24s infinite;
        }
        .electron-charge {
            animation: flow-left 1s linear infinite, macro-charge 24s infinite;
        }

        @keyframes flow-right {
            to { stroke-dashoffset: -32; }
        }
        @keyframes flow-left {
            to { stroke-dashoffset: 32; }
        }

        @keyframes macro-discharge {
            0%, 41.67% { opacity: 1; }
            41.68%, 100% { opacity: 0; }
        }
        @keyframes macro-charge {
            0%, 49.99% { opacity: 0; }
            50%, 91.67% { opacity: 1; }
            91.68%, 100% { opacity: 0; }
        }

        /* Dynamic Equations & Status */
        .eq-discharge, .status-discharge {
            animation: macro-discharge 24s infinite;
        }
        .eq-charge, .status-charge {
            animation: macro-charge 24s infinite;
        }

        /* Migration Arrows */
        .arrow-discharge {
            animation: macro-discharge 24s infinite;
        }
        .arrow-charge {
            animation: macro-charge 24s infinite;
        }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="pb-grad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#556677" />
            <stop offset="50%" stop-color="#778899" />
            <stop offset="100%" stop-color="#556677" />
        </linearGradient>
        
        <linearGradient id="pbo2-base" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#333333" />
            <stop offset="50%" stop-color="#4D4D4D" />
            <stop offset="100%" stop-color="#333333" />
        </linearGradient>

        <!-- Patterns -->
        <pattern id="pbo2-pattern" width="12" height="12" patternUnits="userSpaceOnUse">
            <rect width="12" height="12" fill="url(#pbo2-base)" />
            <circle cx="3" cy="3" r="1.5" fill="#FF4444" opacity="0.8"/>
            <circle cx="9" cy="8" r="2" fill="#FF4444" opacity="0.6"/>
            <circle cx="4" cy="10" r="1" fill="#FF4444" opacity="0.7"/>
        </pattern>

        <pattern id="crust-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
            <rect width="20" height="20" fill="#F0F0F0" />
            <path d="M 0 10 Q 5 5 10 10 T 20 10" fill="none" stroke="#E0E0E0" stroke-width="1"/>
            <circle cx="5" cy="15" r="1" fill="#D0D0D0"/>
            <circle cx="15" cy="5" r="1.5" fill="#D0D0D0"/>
        </pattern>

        <!-- Markers -->
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
        </marker>

        <!-- Chemical Symbols -->
        <symbol id="sulfate" viewBox="-15 -15 30 30">
            <circle cx="0" cy="-8" r="4" fill="#FF4444"/>
            <circle cx="-8" cy="6" r="4" fill="#FF4444"/>
            <circle cx="8" cy="6" r="4" fill="#FF4444"/>
            <circle cx="0" cy="0" r="4" fill="#FF4444"/>
            <circle cx="0" cy="0" r="5" fill="#FFCC00"/>
            <text x="0" y="2" font-size="6" font-family="Inter" font-weight="bold" text-anchor="middle" fill="#000">S</text>
        </symbol>

        <symbol id="water" viewBox="-10 -10 20 20">
            <circle cx="-6" cy="4" r="3" fill="#FFFFFF" stroke="#CCC" stroke-width="0.5"/>
            <circle cx="6" cy="4" r="3" fill="#FFFFFF" stroke="#CCC" stroke-width="0.5"/>
            <circle cx="0" cy="-2" r="5" fill="#FF4444"/>
        </symbol>

        <symbol id="hydrogen" viewBox="-6 -6 12 12">
            <circle cx="0" cy="0" r="4" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="1"/>
            <text x="0" y="2" font-size="6" font-family="Inter" font-weight="bold" text-anchor="middle" fill="#333">+</text>
        </symbol>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- Title & Legend -->
    <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Secondary Cell: Lead-Acid Battery Cycle</text>
    
    <g transform="translate(630, 20)" font-size="10" fill="#444">
        <rect x="0" y="0" width="150" height="95" rx="5" fill="#FFF" stroke="#DDD" stroke-width="1"/>
        <text x="75" y="15" text-anchor="middle" font-weight="600">Legend</text>
        
        <rect x="10" y="25" width="12" height="12" fill="url(#pb-grad)" stroke="#333" stroke-width="0.5"/>
        <text x="30" y="35">Pb (Lead)</text>
        
        <rect x="10" y="45" width="12" height="12" fill="url(#pbo2-pattern)" stroke="#333" stroke-width="0.5"/>
        <text x="30" y="55">PbO₂ (Lead Dioxide)</text>
        
        <rect x="10" y="65" width="12" height="12" fill="url(#crust-pattern)" stroke="#999" stroke-width="0.5"/>
        <text x="30" y="75">PbSO₄ (Lead Sulfate)</text>
    </g>

    <!-- Beaker & Electrolyte -->
    <g id="container">
        <!-- Liquid -->
        <rect x="160" y="200" width="480" height="260" rx="5" fill="#add8e6" class="electrolyte" />
        <!-- Beaker Outline -->
        <path d="M 150 160 L 150 465 Q 150 475 160 475 L 640 475 Q 650 475 650 465 L 650 160" fill="none" stroke="#B0C4DE" stroke-width="6" stroke-linecap="round"/>
        <text x="170" y="460" font-size="14" font-weight="600" fill="#557" opacity="0.7" class="formula">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>SO<tspan baseline-shift="sub" font-size="0.7em">4</tspan>(aq)</text>
    </g>

    <!-- Electrodes -->
    <g id="electrodes">
        <!-- Anode (Pb) -->
        <rect x="220" y="180" width="60" height="260" rx="2" fill="url(#pb-grad)" stroke="#445566" stroke-width="2"/>
        <!-- Anode Crust -->
        <rect x="217" y="177" width="66" height="266" rx="4" fill="url(#crust-pattern)" class="crust" stroke="#CCC" stroke-width="1"/>
        
        <!-- Cathode (PbO2) -->
        <rect x="520" y="180" width="60" height="260" rx="2" fill="url(#pbo2-pattern)" stroke="#222" stroke-width="2"/>
        <!-- Cathode Crust -->
        <rect x="517" y="177" width="66" height="266" rx="4" fill="url(#crust-pattern)" class="crust" stroke="#CCC" stroke-width="1"/>
    </g>

    <!-- Circuit & Wires -->
    <g id="circuit">
        <!-- Base Wire -->
        <path d="M 250 180 L 250 90 Q 250 80 260 80 L 540 80 Q 550 80 550 90 L 550 180" fill="none" stroke="#555" stroke-width="4" stroke-linecap="round"/>
        
        <!-- Electron Flow Paths -->
        <path d="M 250 180 L 250 90 Q 250 80 260 80 L 540 80 Q 550 80 550 90 L 550 180" class="electron-path electron-discharge" />
        <path d="M 250 180 L 250 90 Q 250 80 260 80 L 540 80 Q 550 80 550 90 L 550 180" class="electron-path electron-charge" />

        <!-- Status Text -->
        <text x="400" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#F77F00" class="status-discharge">DISCHARGING</text>
        <text x="400" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#44CC44" class="status-charge">CHARGING</text>
        
        <!-- Electron Labels -->
        <text x="300" y="70" font-size="14" font-weight="bold" fill="#F77F00" class="status-discharge">e⁻ →</text>
        <text x="480" y="70" font-size="14" font-weight="bold" fill="#F77F00" class="status-charge">← e⁻</text>

        <!-- Lightbulb (Discharge) -->
        <g class="lightbulb-group">
            <rect x="390" y="80" width="20" height="15" fill="#888" rx="2"/>
            <path d="M 395 80 L 395 95 M 405 80 L 405 95" stroke="#555" stroke-width="2"/>
            <circle cx="400" cy="62" r="18" class="lightbulb-glow"/>
            <path d="M 392 62 Q 400 50 408 62" fill="none" stroke="#555" stroke-width="2"/>
            <text x="400" y="35" text-anchor="middle" font-size="12" font-weight="600" fill="#555">External Load</text>
        </g>

        <!-- DC Power Source (Charge) -->
        <g class="charger-group">
            <rect x="360" y="55" width="80" height="50" rx="6" fill="#333" stroke="#222" stroke-width="2"/>
            <rect x="365" y="60" width="70" height="40" rx="4" fill="#1A1A1A"/>
            <text x="400" y="85" text-anchor="middle" font-size="16" font-weight="700" fill="#FFF">DC IN</text>
            <circle cx="375" cy="70" r="4" class="charger-light"/>
            <text x="400" y="45" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Power Supply</text>
        </g>
    </g>

    <!-- Ions in Solution -->
    <g id="ions">
        <!-- Anode SO4 (Moves Left) -->
        <g class="anode-so4">
            <use href="#sulfate" x="330" y="250" />
            <use href="#sulfate" x="350" y="330" />
            <use href="#sulfate" x="320" y="410" />
        </g>

        <!-- Cathode SO4 (Moves Right) -->
        <g class="cathode-ion">
            <use href="#sulfate" x="450" y="270" />
            <use href="#sulfate" x="430" y="380" />
        </g>

        <!-- Cathode H+ (Moves Right) -->
        <g class="cathode-ion">
            <use href="#hydrogen" x="440" y="230" />
            <use href="#hydrogen" x="470" y="310" />
            <use href="#hydrogen" x="420" y="340" />
            <use href="#hydrogen" x="460" y="420" />
        </g>

        <!-- Cathode H2O (Moves Left from Cathode) -->
        <g class="cathode-h2o">
            <use href="#water" x="440" y="250" />
            <use href="#water" x="460" y="350" />
            <use href="#water" x="430" y="430" />
        </g>

        <!-- Static Labels for Ions -->
        <text x="360" y="240" font-size="12" font-weight="bold" fill="#D90429" class="formula">SO<tspan baseline-shift="sub" font-size="0.7em">4</tspan><tspan baseline-shift="super" font-size="0.7em">2-</tspan></text>
        <text x="410" y="220" font-size="12" font-weight="bold" fill="#555" class="formula">H<tspan baseline-shift="super" font-size="0.7em">+</tspan></text>
        
        <!-- Migration Arrows (Discharge) -->
        <path d="M 320 290 L 290 290" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)" class="arrow-discharge" />
        <path d="M 460 290 L 490 290" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)" class="arrow-discharge" />
        
        <!-- Migration Arrows (Charge) -->
        <path d="M 290 310 L 320 310" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)" class="arrow-charge" />
        <path d="M 490 310 L 460 310" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)" class="arrow-charge" />
    </g>

    <!-- Electrode Labels & Equations -->
    <g id="labels">
        <!-- Anode Label -->
        <rect x="180" y="450" width="140" height="30" rx="4" fill="#FFF" stroke="#CCC" stroke-width="1" opacity="0.9"/>
        <text x="250" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Negative Plate: Pb(s)</text>
        
        <!-- Cathode Label -->
        <rect x="480" y="450" width="140" height="30" rx="4" fill="#FFF" stroke="#CCC" stroke-width="1" opacity="0.9"/>
        <text x="550" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Positive Plate: PbO<tspan baseline-shift="sub" font-size="0.7em">2</tspan>(s)</text>

        <!-- Discharge Equation -->
        <g class="eq-discharge">
            <rect x="200" y="485" width="400" height="30" rx="5" fill="#FFF" stroke="#F77F00" stroke-width="2"/>
            <text x="400" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#222" class="formula">
                Pb + PbO<tspan baseline-shift="sub" font-size="0.7em">2</tspan> + 2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>SO<tspan baseline-shift="sub" font-size="0.7em">4</tspan> → 2PbSO<tspan baseline-shift="sub" font-size="0.7em">4</tspan> + 2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O
            </text>
        </g>

        <!-- Charge Equation -->
        <g class="eq-charge">
            <rect x="200" y="485" width="400" height="30" rx="5" fill="#FFF" stroke="#44CC44" stroke-width="2"/>
            <text x="400" y="505" text-anchor="middle" font-size="14" font-weight="600" fill="#222" class="formula">
                2PbSO<tspan baseline-shift="sub" font-size="0.7em">4</tspan> + 2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O → Pb + PbO<tspan baseline-shift="sub" font-size="0.7em">2</tspan> + 2H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>SO<tspan baseline-shift="sub" font-size="0.7em">4</tspan>
            </text>
        </g>
    </g>

</svg>

</body>
</html>
