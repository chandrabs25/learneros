<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Gas Law & PV Work</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Particle Gradient -->
            <radialGradient id="particleGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#CCCCCC" />
            </radialGradient>
            
            <!-- Arrow Markers -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>
        </defs>

        <!-- Title & Subtitle -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#333333">Thermodynamics: PV Work &amp; The Ideal Gas Law</text>
        <text x="400" y="65" text-anchor="middle" font-size="14" fill="#666666">Isothermal Compression and Expansion (n = 1.0 mol, T = const)</text>

        <!-- ================= LEFT SIDE: CYLINDER & PISTON ================= -->
        
        <!-- Volume Markers -->
        <line x1="250" y1="150" x2="280" y2="150" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
        <text x="285" y="154" font-size="13" fill="#555555" font-weight="600">V<tspan dy="3" font-size="10">i</tspan><tspan dy="-3" font-weight="400"> (Max)</tspan></text>

        <line x1="250" y1="300" x2="280" y2="300" stroke="#888888" stroke-width="2" stroke-dasharray="4,4" />
        <text x="285" y="304" font-size="13" fill="#555555" font-weight="600">V<tspan dy="3" font-size="10">f</tspan><tspan dy="-3" font-weight="400"> (Min)</tspan></text>

        <!-- Cylinder Background -->
        <rect x="103" y="130" width="144" height="270" fill="#fcfcfc" />

        <!-- Gas Particles Container (Dynamic Height for Bouncing) -->
        <svg id="gas-box" x="103" y="150" width="144" height="250">
            <animate attributeName="y" values="150; 150; 300; 300; 150; 150" keyTimes="0; 0.1; 0.4; 0.5; 0.8; 1" dur="10s" repeatCount="indefinite" />
            <animate attributeName="height" values="250; 250; 100; 100; 250; 250" keyTimes="0; 0.1; 0.4; 0.5; 0.8; 1" dur="10s" repeatCount="indefinite" />
            
            <!-- 20 Gas Particles with pseudo-random Lissajous paths -->
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="10%;90%;10%" dur="2.3s" repeatCount="indefinite"/><animate attributeName="cy" values="20%;80%;20%" dur="1.7s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="85%;15%;85%" dur="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="75%;25%;75%" dur="1.9s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="30%;70%;30%" dur="1.8s" repeatCount="indefinite"/><animate attributeName="cy" values="10%;90%;10%" dur="2.5s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="60%;40%;60%" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="90%;10%;90%" dur="2.2s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="15%;85%;15%" dur="2.7s" repeatCount="indefinite"/><animate attributeName="cy" values="40%;60%;40%" dur="1.6s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="75%;25%;75%" dur="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="60%;40%;60%" dur="2.8s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="40%;60%;40%" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="85%;15%;85%" dur="2.1s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="90%;10%;90%" dur="2.6s" repeatCount="indefinite"/><animate attributeName="cy" values="30%;70%;30%" dur="2.4s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="20%;80%;20%" dur="1.7s" repeatCount="indefinite"/><animate attributeName="cy" values="50%;90%;50%" dur="2.9s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="50%;10%;50%" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="25%;75%;25%" dur="2.3s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="65%;35%;65%" dur="2.0s" repeatCount="indefinite"/><animate attributeName="cy" values="15%;85%;15%" dur="2.7s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="35%;65%;35%" dur="2.8s" repeatCount="indefinite"/><animate attributeName="cy" values="80%;20%;80%" dur="1.8s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="5%;95%;5%" dur="3.1s" repeatCount="indefinite"/><animate attributeName="cy" values="45%;55%;45%" dur="2.0s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="95%;5%;95%" dur="2.9s" repeatCount="indefinite"/><animate attributeName="cy" values="55%;45%;55%" dur="2.6s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="45%;55%;45%" dur="1.6s" repeatCount="indefinite"/><animate attributeName="cy" values="5%;95%;5%" dur="3.0s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="55%;45%;55%" dur="2.1s" repeatCount="indefinite"/><animate attributeName="cy" values="95%;5%;95%" dur="3.2s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="25%;75%;25%" dur="2.4s" repeatCount="indefinite"/><animate attributeName="cy" values="35%;65%;35%" dur="2.1s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="70%;30%;70%" dur="1.9s" repeatCount="indefinite"/><animate attributeName="cy" values="65%;35%;65%" dur="2.5s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="80%;20%;80%" dur="2.2s" repeatCount="indefinite"/><animate attributeName="cy" values="10%;90%;10%" dur="1.7s" repeatCount="indefinite"/></circle>
            <circle r="4" fill="url(#particleGrad)"><animate attributeName="cx" values="10%;90%;10%" dur="2.5s" repeatCount="indefinite"/><animate attributeName="cy" values="90%;10%;90%" dur="2.3s" repeatCount="indefinite"/></circle>
        </svg>

        <!-- Cylinder Walls -->
        <path d="M 100 110 L 100 400 A 10 10 0 0 0 110 410 L 240 410 A 10 10 0 0 0 250 400 L 250 110" fill="none" stroke="#404040" stroke-width="6" stroke-linecap="round"/>

        <!-- Moving Piston Group -->
        <g>
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 150; 0 150; 0 0; 0 0" keyTimes="0; 0.1; 0.4; 0.5; 0.8; 1" dur="10s" repeatCount="indefinite" />
            
            <!-- Piston Rod -->
            <rect x="170" y="-20" width="10" height="150" fill="#888888" />
            
            <!-- Piston Head -->
            <rect x="103" y="130" width="144" height="20" fill="#606060" rx="2" />
            
            <!-- External Force Arrow -->
            <path d="M 175 60 L 175 110" stroke="#F77F00" stroke-width="4" marker-end="url(#arrow-orange)" />
            <text x="188" y="90" fill="#F77F00" font-size="16" font-weight="700">P<tspan dy="4" font-size="11">ex</tspan></text>
        </g>

        <!-- Dynamic Formula / Work Indicator -->
        <rect x="250" y="210" width="160" height="60" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
        <text x="260" y="235" class="math" font-size="16" fill="#333333" font-weight="700">w = -P<tspan dy="4" font-size="11">ex</tspan><tspan dy="-4"> ΔV</tspan></text>
        
        <!-- Work ON System (Compression) -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.09; 0.1; 0.4; 0.41; 1" dur="10s" repeatCount="indefinite" />
            <text x="260" y="255" font-size="12" fill="#F77F00" font-weight="700">Work ON gas (w &gt; 0)</text>
        </g>
        
        <!-- Work BY System (Expansion) -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.49; 0.5; 0.8; 0.81; 1" dur="10s" repeatCount="indefinite" />
            <text x="260" y="255" font-size="12" fill="#7209B7" font-weight="700">Work BY gas (w &lt; 0)</text>
        </g>


        <!-- ================= RIGHT SIDE: P-V GRAPH ================= -->
        
        <!-- Graph Grid -->
        <g stroke="#eeeeee" stroke-width="1">
            <line x1="450" y1="130" x2="750" y2="130" />
            <line x1="450" y1="180" x2="750" y2="180" />
            <line x1="450" y1="230" x2="750" y2="230" />
            <line x1="450" y1="280" x2="750" y2="280" />
            <line x1="450" y1="330" x2="750" y2="330" />
            <line x1="500" y1="100" x2="500" y2="380" />
            <line x1="550" y1="100" x2="550" y2="380" />
            <line x1="600" y1="100" x2="600" y2="380" />
            <line x1="650" y1="100" x2="650" y2="380" />
            <line x1="700" y1="100" x2="700" y2="380" />
        </g>

        <!-- Axes -->
        <path d="M 450 100 L 450 380 L 760 380" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#arrow-purple)" />
        <path d="M 450 380 L 450 90" fill="none" stroke="#333333" stroke-width="3" marker-end="url(#arrow-purple)" />

        <!-- Axes Labels -->
        <text x="440" y="80" font-size="14" fill="#333333" font-weight="700">Pressure (P)</text>
        <text x="760" y="410" text-anchor="end" font-size="14" fill="#333333" font-weight="700">Volume (V)</text>

        <!-- Ticks and State Labels -->
        <line x1="550" y1="380" x2="550" y2="386" stroke="#333333" stroke-width="2"/>
        <text x="550" y="402" text-anchor="middle" font-size="13" font-weight="600" fill="#555555">V<tspan dy="3" font-size="10">f</tspan></text>

        <line x1="700" y1="380" x2="700" y2="386" stroke="#333333" stroke-width="2"/>
        <text x="700" y="402" text-anchor="middle" font-size="13" font-weight="600" fill="#555555">V<tspan dy="3" font-size="10">i</tspan></text>

        <line x1="444" y1="280" x2="450" y2="280" stroke="#333333" stroke-width="2"/>
        <text x="438" y="284" text-anchor="end" font-size="13" font-weight="600" fill="#555555">P<tspan dy="3" font-size="10">i</tspan></text>

        <line x1="444" y1="130" x2="450" y2="130" stroke="#333333" stroke-width="2"/>
        <text x="438" y="134" text-anchor="end" font-size="13" font-weight="600" fill="#555555">P<tspan dy="3" font-size="10">f</tspan></text>

        <!-- Isothermal Curve (P = k/V) -->
        <polyline points="550,130 575,180 600,213.3 625,237.2 650,255 675,268.9 700,280" fill="none" stroke="#888888" stroke-width="2" stroke-dasharray="6,4" stroke-linejoin="round" />

        <!-- Moving State Point (Red Dot) -->
        <circle r="7" fill="#FF4444">
            <animate attributeName="cx" 
                     values="700; 700; 675; 650; 625; 600; 575; 550; 550; 575; 600; 625; 650; 675; 700; 700" 
                     keyTimes="0; 0.1; 0.15; 0.2; 0.25; 0.3; 0.35; 0.4; 0.5; 0.55; 0.6; 0.65; 0.7; 0.75; 0.8; 1" 
                     dur="10s" repeatCount="indefinite" />
            <animate attributeName="cy" 
                     values="280; 280; 268.9; 255; 237.2; 213.3; 180; 130; 130; 180; 213.3; 237.2; 255; 268.9; 280; 280" 
                     keyTimes="0; 0.1; 0.15; 0.2; 0.25; 0.3; 0.35; 0.4; 0.5; 0.55; 0.6; 0.65; 0.7; 0.75; 0.8; 1" 
                     dur="10s" repeatCount="indefinite" />
        </circle>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(100, 460)" font-size="12" fill="#555555" font-weight="600">
            <circle cx="10" cy="-4" r="5" fill="url(#particleGrad)" />
            <text x="22" y="0">Ideal Gas (He)</text>

            <line x1="130" y1="-4" x2="155" y2="-4" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)" />
            <text x="170" y="0">Force / Work</text>

            <circle cx="270" cy="-4" r="5" fill="#FF4444" />
            <text x="282" y="0">State Point</text>

            <line x1="370" y1="-4" x2="400" y2="-4" stroke="#888888" stroke-width="2" stroke-dasharray="4,3" />
            <text x="410" y="0">Isotherm (T=const)</text>
        </g>

    </svg>
</div>

</body>
</html>
