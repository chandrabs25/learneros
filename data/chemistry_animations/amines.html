<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amine Basicity: Protonation of Methylamine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 12px;
            overflow: hidden;
            margin: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        @keyframes pulseLP {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.06); }
        }

        @keyframes lonePairFade {
            0%, 37.5% { opacity: 1; }
            50%, 87.5% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        @keyframes protonMove {
            0%, 5% { transform: translate(540px, 100px); opacity: 0; }
            10%, 37.5% { transform: translate(540px, 100px); opacity: 1; }
            50%, 87.5% { transform: translate(460px, 200px); opacity: 1; }
            92%, 98% { transform: translate(460px, 200px); opacity: 0; }
            99%, 100% { transform: translate(540px, 100px); opacity: 0; }
        }

        @keyframes arrowDraw {
            0%, 25% { stroke-dashoffset: 160; opacity: 0; }
            26% { opacity: 1; }
            37.5% { stroke-dashoffset: 0; opacity: 1; }
            45% { opacity: 0; }
            100% { stroke-dashoffset: 160; opacity: 0; }
        }

        @keyframes bondDraw {
            0%, 37.5% { stroke-dashoffset: 100; opacity: 0; }
            38% { opacity: 1; }
            50%, 87.5% { stroke-dashoffset: 0; opacity: 1; }
            92%, 100% { stroke-dashoffset: 100; opacity: 0; }
        }

        @keyframes rotateC {
            0%, 40% { transform: rotate(0deg); }
            55%, 87.5% { transform: rotate(-10deg); }
            95%, 100% { transform: rotate(0deg); }
        }

        @keyframes rotateH2 {
            0%, 40% { transform: rotate(0deg); }
            55%, 87.5% { transform: rotate(10deg); }
            95%, 100% { transform: rotate(0deg); }
        }

        @keyframes chargeFade {
            0%, 50% { opacity: 0; transform: scale(0.5); }
            60%, 87.5% { opacity: 1; transform: scale(1); }
            92%, 100% { opacity: 0; transform: scale(0.5); }
        }

        @keyframes labelFade1 {
            0%, 40% { opacity: 1; }
            48%, 90% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        @keyframes labelFade2 {
            0%, 45% { opacity: 0; }
            55%, 87.5% { opacity: 1; }
            92%, 100% { opacity: 0; }
        }

        /* Apply animations */
        .anim-lp-pulse { animation: pulseLP 2s infinite ease-in-out; transform-origin: 400px 280px; }
        .anim-lp-fade { animation: lonePairFade 8s infinite ease-in-out; }
        .anim-proton { animation: protonMove 8s infinite ease-in-out; }
        .anim-arrow { animation: arrowDraw 8s infinite ease-in-out; }
        .anim-bond { animation: bondDraw 8s infinite ease-in-out; }
        .anim-rot-c { animation: rotateC 8s infinite ease-in-out; transform-origin: 400px 280px; }
        .anim-rot-h2 { animation: rotateH2 8s infinite ease-in-out; transform-origin: 400px 280px; }
        .anim-charge { animation: chargeFade 8s infinite ease-in-out; transform-origin: 425px 240px; }
        .anim-label1 { animation: labelFade1 8s infinite ease-in-out; }
        .anim-label2 { animation: labelFade2 8s infinite ease-in-out; }

        .formula { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 20px; fill: #333; }
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #222; }
        .subtitle { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: #666; }
        .annotation { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #555; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated mechanism showing a methylamine molecule picking up a proton to become a methylammonium ion.</title>
        <desc>The basicity of amines demonstrated by the protonation of Methylamine to Methylammonium, highlighting the lone pair and geometry shift.</desc>

        <!-- Definitions for Gradients and Markers -->
        <defs>
            <radialGradient id="gradN" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#8888FF" />
                <stop offset="100%" stop-color="#4444FF" />
            </radialGradient>
            <radialGradient id="gradC" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777777" />
                <stop offset="100%" stop-color="#404040" />
            </radialGradient>
            <radialGradient id="gradH" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#CCCCCC" />
            </radialGradient>
            <radialGradient id="gradHPlus" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFE066" />
                <stop offset="100%" stop-color="#FFCC00" />
            </radialGradient>
            <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#f0f4f8" stop-opacity="1" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            </radialGradient>

            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Background Glow -->
        <circle cx="400" cy="280" r="250" fill="url(#bgGlow)" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" class="title">The Basicity of Amines</text>
        <text x="400" y="65" text-anchor="middle" class="subtitle">Protonation of Methylamine</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="130" height="135" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
            <text x="15" y="25" font-size="13" font-weight="700" fill="#333">Legend</text>
            
            <circle cx="20" cy="45" r="7" fill="url(#gradN)" />
            <text x="35" y="49" font-size="12" fill="#555">Nitrogen (N)</text>
            
            <circle cx="20" cy="67" r="7" fill="url(#gradC)" />
            <text x="35" y="71" font-size="12" fill="#555">Carbon (C)</text>
            
            <circle cx="20" cy="89" r="7" fill="url(#gradH)" />
            <text x="35" y="93" font-size="12" fill="#555">Hydrogen (H)</text>
            
            <circle cx="20" cy="111" r="7" fill="url(#gradHPlus)" />
            <text x="35" y="115" font-size="12" fill="#555">Proton (H⁺)</text>
        </g>

        <!-- Molecule Group -->
        <g id="molecule">
            
            <!-- Methyl Group (C and 3 H's) -->
            <g class="anim-rot-c">
                <!-- C-H Bonds -->
                <line x1="260" y1="300" x2="220" y2="250" stroke="#666" stroke-width="4" stroke-linecap="round" />
                <line x1="260" y1="300" x2="200" y2="310" stroke="#666" stroke-width="4" stroke-linecap="round" />
                <line x1="260" y1="300" x2="250" y2="360" stroke="#666" stroke-width="4" stroke-linecap="round" />
                
                <!-- N-C Bond -->
                <line x1="400" y1="280" x2="260" y2="300" stroke="#666" stroke-width="6" stroke-linecap="round" />
                
                <!-- Atoms -->
                <circle cx="220" cy="250" r="10" fill="url(#gradH)" />
                <circle cx="200" cy="310" r="10" fill="url(#gradH)" />
                <circle cx="250" cy="360" r="10" fill="url(#gradH)" />
                <circle cx="260" cy="300" r="20" fill="url(#gradC)" />
            </g>

            <!-- Hydrogen 1 (Bottom Left) - Stays relatively still as the anchor -->
            <g>
                <line x1="400" y1="280" x2="350" y2="366" stroke="#666" stroke-width="6" stroke-linecap="round" />
                <circle cx="350" cy="366" r="12" fill="url(#gradH)" />
            </g>

            <!-- Hydrogen 2 (Bottom Right) -->
            <g class="anim-rot-h2">
                <line x1="400" y1="280" x2="486" y2="330" stroke="#666" stroke-width="6" stroke-linecap="round" />
                <circle cx="486" cy="330" r="12" fill="url(#gradH)" />
            </g>

            <!-- New Bond (N-H3) -->
            <line x1="400" y1="280" x2="460" y2="200" stroke="#666" stroke-width="6" stroke-linecap="round" stroke-dasharray="100" class="anim-bond" />

            <!-- Central Nitrogen -->
            <circle cx="400" cy="280" r="22" fill="url(#gradN)" />

            <!-- Lone Pair -->
            <g class="anim-lp-fade">
                <g class="anim-lp-pulse">
                    <g transform="translate(400, 280) rotate(45)">
                        <!-- Lobe shape -->
                        <path d="M 0 0 C -25 -60, -20 -100, 0 -100 C 20 -100, 25 -60, 0 0" fill="rgba(68, 68, 255, 0.25)" stroke="#4444FF" stroke-width="1.5" />
                        <!-- Electrons -->
                        <circle cx="-6" cy="-70" r="3" fill="#4444FF" />
                        <circle cx="6" cy="-70" r="3" fill="#4444FF" />
                    </g>
                </g>
            </g>

            <!-- Formal Charge on Nitrogen -->
            <g class="anim-charge">
                <circle cx="425" cy="240" r="11" fill="#ffffff" stroke="#4444FF" stroke-width="2" />
                <text x="425" y="241" text-anchor="middle" dominant-baseline="middle" font-family="Inter" font-size="16" font-weight="700" fill="#4444FF">+</text>
            </g>

        </g>

        <!-- Incoming Proton -->
        <g class="anim-proton">
            <circle cx="0" cy="0" r="14" fill="url(#gradHPlus)" />
            <text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-family="Inter" font-size="14" font-weight="700" fill="#B38F00">+</text>
        </g>

        <!-- Mechanism Arrow -->
        <path d="M 430 220 Q 480 150, 520 115" fill="none" stroke="#F77F00" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrowhead)" stroke-dasharray="160" class="anim-arrow" />

        <!-- Dynamic Labels -->
        
        <!-- State 1 Labels -->
        <g class="anim-label1">
            <!-- Lone Pair Annotation -->
            <path d="M 280 160 L 410 195" stroke="#999" stroke-width="1.5" stroke-dasharray="4" fill="none" />
            <text x="270" y="155" text-anchor="end" class="annotation">Lone Pair (Nucleophilic site)</text>
            
            <!-- Geometry Label -->
            <text x="400" y="420" text-anchor="middle" class="annotation" font-weight="600" fill="#4444FF">Trigonal Pyramidal Geometry</text>
            
            <!-- Chemical Formula -->
            <text x="400" y="465" text-anchor="middle" class="formula">
                CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan>NH<tspan baseline-shift="sub" font-size="0.7em">2</tspan> + H<tspan baseline-shift="super" font-size="0.7em">+</tspan>
            </text>
        </g>

        <!-- State 2 Labels -->
        <g class="anim-label2">
            <!-- Geometry Label -->
            <text x="400" y="420" text-anchor="middle" class="annotation" font-weight="600" fill="#4444FF">Tetrahedral Geometry</text>
            
            <!-- Chemical Formula -->
            <text x="400" y="465" text-anchor="middle" class="formula">
                [CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan>NH<tspan baseline-shift="sub" font-size="0.7em">3</tspan>]<tspan baseline-shift="super" font-size="0.7em">+</tspan>
            </text>
        </g>

    </svg>
</div>

</body>
</html>
