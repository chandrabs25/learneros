<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dipole Moment in Ethers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        text {
            user-select: none;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            fill: #333;
        }

        /* --- Animations --- */
        /* 12 Second Global Loop */

        .anim-ether { animation: ether-in 12s infinite; }
        @keyframes ether-in {
            0% { opacity: 0; }
            4%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-angle { animation: angle-in 12s infinite; }
        @keyframes angle-in {
            0%, 4% { opacity: 0; }
            8%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-charge-minus { animation: charge-pulse-minus 12s infinite; transform-origin: 400px 115px; }
        @keyframes charge-pulse-minus {
            0%, 16% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            24%, 90% { opacity: 1; transform: scale(1); }
            95%, 100% { opacity: 0; }
        }

        .anim-charge-plus-l { animation: charge-pulse-plus-l 12s infinite; transform-origin: 290px 240px; }
        @keyframes charge-pulse-plus-l {
            0%, 16% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            24%, 90% { opacity: 1; transform: scale(1); }
            95%, 100% { opacity: 0; }
        }

        .anim-charge-plus-r { animation: charge-pulse-plus-r 12s infinite; transform-origin: 510px 240px; }
        @keyframes charge-pulse-plus-r {
            0%, 16% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.2); }
            24%, 90% { opacity: 1; transform: scale(1); }
            95%, 100% { opacity: 0; }
        }

        .anim-electron-vis { animation: electron-vis 12s infinite; }
        @keyframes electron-vis {
            0%, 16% { opacity: 0; }
            20%, 41% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }

        .anim-electron-move-l { animation: electron-move-l 1.5s infinite linear; }
        @keyframes electron-move-l {
            0% { transform: translate(0, 0); opacity: 0; }
            20%, 80% { opacity: 1; }
            100% { transform: translate(57px, -40px); opacity: 0; }
        }

        .anim-electron-move-r { animation: electron-move-r 1.5s infinite linear; }
        @keyframes electron-move-r {
            0% { transform: translate(0, 0); opacity: 0; }
            20%, 80% { opacity: 1; }
            100% { transform: translate(-57px, -40px); opacity: 0; }
        }

        .delay-1 { animation-delay: 0.5s; }
        .delay-2 { animation-delay: 1.0s; }

        .anim-bond-dipoles { animation: bond-dipoles-in 12s infinite; }
        @keyframes bond-dipoles-in {
            0%, 41% { opacity: 0; }
            45%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-ghost-l { animation: ghost-l-slide 12s infinite; }
        @keyframes ghost-l-slide {
            0%, 45% { opacity: 0; transform: translate(0, 0); }
            48% { opacity: 0.35; transform: translate(0, 0); }
            56%, 90% { opacity: 0.35; transform: translate(72px, 7px); }
            95%, 100% { opacity: 0; }
        }

        .anim-ghost-r { animation: ghost-r-slide 12s infinite; }
        @keyframes ghost-r-slide {
            0%, 45% { opacity: 0; transform: translate(0, 0); }
            48% { opacity: 0.35; transform: translate(0, 0); }
            56%, 90% { opacity: 0.35; transform: translate(-15px, -33px); }
            95%, 100% { opacity: 0; }
        }

        .anim-net-dipole-group { animation: net-dipole-fade 12s infinite; }
        @keyframes net-dipole-fade {
            0%, 56% { opacity: 0; }
            58%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-clip {
            animation: clip-reveal 12s infinite;
            transform-origin: 400px 217px;
        }
        @keyframes clip-reveal {
            0%, 56% { transform: scaleY(0); }
            64%, 90% { transform: scaleY(1); }
            95%, 100% { transform: scaleY(0); }
        }

        .anim-propane { animation: propane-in 12s infinite; }
        @keyframes propane-in {
            0%, 66% { opacity: 0; }
            70%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-mu { animation: mu-in 12s infinite; }
        @keyframes mu-in {
            0%, 70% { opacity: 0; }
            74%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 620" xmlns="http://www.w3.org/2000/svg">
    <title>Dipole Moment in Ethers Animation</title>
    <desc>An animated chemical diagram showing the bent geometry of dimethyl ether, the resulting bond dipoles, their vector addition into a net dipole, and a comparison with non-polar propane.</desc>

    <defs>
        <!-- Atom Gradients -->
        <radialGradient id="grad-O" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FF8888" />
            <stop offset="100%" stop-color="#CC0000" />
        </radialGradient>
        <radialGradient id="grad-C" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#666666" />
            <stop offset="100%" stop-color="#222222" />
        </radialGradient>
        <radialGradient id="grad-H" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#AAAAAA" />
        </radialGradient>

        <!-- Arrow Markers -->
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#F77F00" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M 0 1 L 8 5 L 0 9 z" fill="#7209B7" />
        </marker>

        <!-- Clip Path for Net Dipole Growth -->
        <clipPath id="net-dipole-clip">
            <rect x="370" y="120" width="60" height="100" class="anim-clip" />
        </clipPath>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- Static Elements -->
    <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#222">Dipole Moment in Ethers (R-O-R)</text>
    
    <!-- Legend -->
    <g transform="translate(20, 20)" filter="url(#shadow)">
        <rect x="0" y="0" width="160" height="115" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
        <text x="10" y="20" font-size="12" font-weight="600" fill="#555">Legend</text>
        
        <circle cx="18" cy="38" r="6" fill="url(#grad-O)" />
        <text x="32" y="42" font-size="12" fill="#444">Oxygen (O)</text>
        
        <circle cx="18" cy="58" r="6" fill="url(#grad-C)" />
        <text x="32" y="62" font-size="12" fill="#444">Carbon (C)</text>
        
        <circle cx="18" cy="78" r="6" fill="url(#grad-H)" />
        <text x="32" y="82" font-size="12" fill="#444">Hydrogen (H)</text>
        
        <line x1="10" y1="100" x2="26" y2="100" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)" />
        <text x="32" y="104" font-size="12" fill="#444">Dipole Vector</text>
    </g>

    <!-- ========================================== -->
    <!-- DIMETHYL ETHER MOLECULE                    -->
    <!-- ========================================== -->
    <g class="anim-ether">
        <!-- Bonds -->
        <g stroke="#555555" stroke-width="5" stroke-linecap="round">
            <!-- C-O Bonds -->
            <line x1="318" y1="217" x2="400" y2="160" />
            <line x1="482" y1="217" x2="400" y2="160" />
            <!-- C-H Bonds (Left) -->
            <line x1="318" y1="217" x2="270" y2="190" />
            <line x1="318" y1="217" x2="300" y2="265" />
            <line x1="318" y1="217" x2="350" y2="255" />
            <!-- C-H Bonds (Right) -->
            <line x1="482" y1="217" x2="530" y2="190" />
            <line x1="482" y1="217" x2="500" y2="265" />
            <line x1="482" y1="217" x2="450" y2="255" />
        </g>

        <!-- Lone Pairs on Oxygen -->
        <g fill="#A0C4FF" opacity="0.6">
            <ellipse cx="385" cy="135" rx="12" ry="18" transform="rotate(-35 385 135)" />
            <ellipse cx="415" cy="135" rx="12" ry="18" transform="rotate(35 415 135)" />
        </g>

        <!-- Atoms -->
        <g stroke="#ffffff" stroke-width="1.5">
            <!-- Hydrogens Left -->
            <circle cx="270" cy="190" r="10" fill="url(#grad-H)" />
            <circle cx="300" cy="265" r="10" fill="url(#grad-H)" />
            <circle cx="350" cy="255" r="10" fill="url(#grad-H)" />
            <!-- Hydrogens Right -->
            <circle cx="530" cy="190" r="10" fill="url(#grad-H)" />
            <circle cx="500" cy="265" r="10" fill="url(#grad-H)" />
            <circle cx="450" cy="255" r="10" fill="url(#grad-H)" />
            <!-- Carbons -->
            <circle cx="318" cy="217" r="15" fill="url(#grad-C)" />
            <circle cx="482" cy="217" r="15" fill="url(#grad-C)" />
            <!-- Oxygen -->
            <circle cx="400" cy="160" r="20" fill="url(#grad-O)" />
        </g>

        <!-- Formula -->
        <text x="400" y="320" text-anchor="middle" class="formula">CH<tspan dy="5" font-size="14">3</tspan><tspan dy="-5">-O-CH</tspan><tspan dy="5" font-size="14">3</tspan></text>
        <text x="400" y="340" text-anchor="middle" font-size="14" fill="#666">Dimethyl Ether</text>
    </g>

    <!-- Angle Highlight -->
    <g class="anim-angle">
        <path d="M 375 195 A 35 35 0 0 0 425 195" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 4" />
        <text x="400" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#555">111.7°</text>
    </g>

    <!-- Partial Charges -->
    <text x="400" y="115" text-anchor="middle" font-size="20" font-style="italic" font-weight="600" fill="#FF4444" class="anim-charge-minus">δ<tspan dy="-8" font-size="14">-</tspan></text>
    <text x="290" y="240" text-anchor="middle" font-size="20" font-style="italic" font-weight="600" fill="#404040" class="anim-charge-plus-l">δ<tspan dy="-8" font-size="14">+</tspan></text>
    <text x="510" y="240" text-anchor="middle" font-size="20" font-style="italic" font-weight="600" fill="#404040" class="anim-charge-plus-r">δ<tspan dy="-8" font-size="14">+</tspan></text>

    <!-- Electron Flow -->
    <g class="anim-electron-vis" fill="#FFD166" filter="url(#shadow)">
        <!-- Left Bond Electrons -->
        <circle cx="328" cy="210" r="3" class="anim-electron-move-l" />
        <circle cx="328" cy="210" r="3" class="anim-electron-move-l delay-1" />
        <circle cx="328" cy="210" r="3" class="anim-electron-move-l delay-2" />
        <!-- Right Bond Electrons -->
        <circle cx="472" cy="210" r="3" class="anim-electron-move-r" />
        <circle cx="472" cy="210" r="3" class="anim-electron-move-r delay-1" />
        <circle cx="472" cy="210" r="3" class="anim-electron-move-r delay-2" />
    </g>

    <!-- ========================================== -->
    <!-- DIPOLE VECTORS                             -->
    <!-- ========================================== -->
    
    <!-- Original Bond Dipoles -->
    <g class="anim-bond-dipoles" stroke="#F77F00" stroke-width="4" stroke-linecap="round">
        <!-- Left Dipole -->
        <g>
            <line x1="328" y1="210" x2="385" y2="170" marker-end="url(#arrow-orange)" />
            <line x1="324" y1="204" x2="332" y2="216" /> <!-- Cross -->
            <text x="335" y="175" stroke="none" fill="#F77F00" font-size="14" font-weight="600" font-style="italic">μ<tspan dy="4" font-size="10" font-style="normal">bond</tspan></text>
        </g>
        <!-- Right Dipole -->
        <g>
            <line x1="472" y1="210" x2="415" y2="170" marker-end="url(#arrow-orange)" />
            <line x1="468" y1="216" x2="476" y2="204" /> <!-- Cross -->
            <text x="465" y="175" stroke="none" fill="#F77F00" font-size="14" font-weight="600" font-style="italic">μ<tspan dy="4" font-size="10" font-style="normal">bond</tspan></text>
        </g>
    </g>

    <!-- Ghost Dipoles for Vector Addition -->
    <g stroke="#F77F00" stroke-width="4" stroke-linecap="round">
        <g class="anim-ghost-l">
            <line x1="328" y1="210" x2="385" y2="170" marker-end="url(#arrow-orange)" />
            <line x1="324" y1="204" x2="332" y2="216" />
        </g>
        <g class="anim-ghost-r">
            <line x1="472" y1="210" x2="415" y2="170" marker-end="url(#arrow-orange)" />
            <line x1="468" y1="216" x2="476" y2="204" />
        </g>
    </g>

    <!-- Net Dipole -->
    <g class="anim-net-dipole-group" clip-path="url(#net-dipole-clip)">
        <line x1="400" y1="217" x2="400" y2="137" stroke="#7209B7" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-purple)" />
        <line x1="390" y1="217" x2="410" y2="217" stroke="#7209B7" stroke-width="4" stroke-linecap="round" /> <!-- Cross -->
        <text x="415" y="150" fill="#7209B7" font-size="16" font-weight="700" font-style="italic">μ<tspan dy="4" font-size="11" font-style="normal">net</tspan></text>
    </g>

    <!-- Dipole Value Label (Ether) -->
    <text x="400" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#7209B7" class="anim-mu">μ = 1.3 D</text>

    <!-- ========================================== -->
    <!-- PROPANE COMPARISON MOLECULE                -->
    <!-- ========================================== -->
    <g class="anim-propane">
        <!-- Bonds -->
        <g stroke="#555555" stroke-width="5" stroke-linecap="round">
            <!-- C-C Bonds -->
            <line x1="318" y1="477" x2="400" y2="420" />
            <line x1="482" y1="477" x2="400" y2="420" />
            <!-- C-H Bonds (Center) -->
            <line x1="400" y1="420" x2="380" y2="380" />
            <line x1="400" y1="420" x2="420" y2="380" />
            <!-- C-H Bonds (Left) -->
            <line x1="318" y1="477" x2="270" y2="450" />
            <line x1="318" y1="477" x2="300" y2="525" />
            <line x1="318" y1="477" x2="350" y2="515" />
            <!-- C-H Bonds (Right) -->
            <line x1="482" y1="477" x2="530" y2="450" />
            <line x1="482" y1="477" x2="500" y2="525" />
            <line x1="482" y1="477" x2="450" y2="515" />
        </g>

        <!-- Atoms -->
        <g stroke="#ffffff" stroke-width="1.5">
            <!-- Hydrogens Center -->
            <circle cx="380" cy="380" r="10" fill="url(#grad-H)" />
            <circle cx="420" cy="380" r="10" fill="url(#grad-H)" />
            <!-- Hydrogens Left -->
            <circle cx="270" cy="450" r="10" fill="url(#grad-H)" />
            <circle cx="300" cy="525" r="10" fill="url(#grad-H)" />
            <circle cx="350" cy="515" r="10" fill="url(#grad-H)" />
            <!-- Hydrogens Right -->
            <circle cx="530" cy="450" r="10" fill="url(#grad-H)" />
            <circle cx="500" cy="525" r="10" fill="url(#grad-H)" />
            <circle cx="450" cy="515" r="10" fill="url(#grad-H)" />
            <!-- Carbons -->
            <circle cx="400" cy="420" r="15" fill="url(#grad-C)" />
            <circle cx="318" cy="477" r="15" fill="url(#grad-C)" />
            <circle cx="482" cy="477" r="15" fill="url(#grad-C)" />
        </g>

        <!-- Formula -->
        <text x="400" y="560" text-anchor="middle" class="formula">CH<tspan dy="5" font-size="14">3</tspan><tspan dy="-5">-CH</tspan><tspan dy="5" font-size="14">2</tspan><tspan dy="-5">-CH</tspan><tspan dy="5" font-size="14">3</tspan></text>
        <text x="400" y="580" text-anchor="middle" font-size="14" fill="#666">Propane (Non-polar analog)</text>
    </g>

    <!-- Dipole Value Label (Propane) -->
    <text x="400" y="605" text-anchor="middle" font-size="16" font-weight="700" fill="#555" class="anim-mu">μ ≈ 0 D</text>

    <!-- Context Note -->
    <text x="400" y="80" text-anchor="middle" font-size="15" font-weight="600" fill="#444" class="anim-mu" filter="url(#shadow)">Bent geometry prevents bond dipoles from canceling.</text>

</svg>

</body>
</html>
