<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chromate-Dichromate Equilibrium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Animations */
        .left-chromate {
            animation: leftChromateAnim 12s infinite ease-in-out;
        }
        .right-chromate {
            animation: rightChromateAnim 12s infinite ease-in-out;
        }
        .water-molecule {
            animation: waterAnim 12s infinite ease-in-out;
        }
        .protons-anim {
            animation: protonsAnim 12s infinite ease-in-out;
        }
        .bg-rect {
            animation: bgAnim 12s infinite ease-in-out;
        }
        .alkaline-text {
            animation: alkalineTextAnim 12s infinite ease-in-out;
        }
        .acidic-text {
            animation: acidicTextAnim 12s infinite ease-in-out;
        }
        .yellow-glow-anim {
            animation: yellowGlowAnim 12s infinite ease-in-out;
        }
        .orange-glow-anim {
            animation: orangeGlowAnim 12s infinite ease-in-out;
        }
        .arrow-right {
            animation: arrowRightAnim 12s infinite ease-in-out;
        }
        .arrow-left {
            animation: arrowLeftAnim 12s infinite ease-in-out;
        }

        /* Keyframes */
        @keyframes leftChromateAnim {
            0%, 20% { transform: translate(250px, 240px); }
            40%, 75% { transform: translate(330px, 240px); }
            90%, 100% { transform: translate(250px, 240px); }
        }

        @keyframes rightChromateAnim {
            0%, 20% { transform: translate(550px, 240px); }
            40%, 75% { transform: translate(470px, 240px); }
            90%, 100% { transform: translate(550px, 240px); }
        }

        @keyframes waterAnim {
            0%, 20% { transform: translate(480px, 200px); opacity: 1; }
            40%, 75% { transform: translate(550px, 80px); opacity: 0; }
            90%, 100% { transform: translate(480px, 200px); opacity: 1; }
        }

        @keyframes protonsAnim {
            0%, 5% { transform: translate(50px, -100px); opacity: 0; }
            15%, 90% { transform: translate(0px, 0px); opacity: 1; }
            100% { transform: translate(50px, -100px); opacity: 0; }
        }

        @keyframes bgAnim {
            0%, 20% { fill: #FFF9C4; }
            40%, 75% { fill: #FFE0B2; }
            90%, 100% { fill: #FFF9C4; }
        }

        @keyframes alkalineTextAnim {
            0%, 20% { opacity: 1; }
            40%, 75% { opacity: 0; }
            90%, 100% { opacity: 1; }
        }

        @keyframes acidicTextAnim {
            0%, 20% { opacity: 0; }
            40%, 75% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes yellowGlowAnim {
            0%, 20% { opacity: 1; }
            40%, 75% { opacity: 0; }
            90%, 100% { opacity: 1; }
        }

        @keyframes orangeGlowAnim {
            0%, 20% { opacity: 0; }
            40%, 75% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes arrowRightAnim {
            0%, 15% { stroke: #7209B7; stroke-width: 4; filter: none; }
            20%, 40% { stroke: #F77F00; stroke-width: 6; filter: drop-shadow(0 0 4px #F77F00); }
            45%, 100% { stroke: #7209B7; stroke-width: 4; filter: none; }
        }

        @keyframes arrowLeftAnim {
            0%, 70% { stroke: #7209B7; stroke-width: 4; filter: none; }
            75%, 95% { stroke: #F77F00; stroke-width: 6; filter: drop-shadow(0 0 4px #F77F00); }
            100% { stroke: #7209B7; stroke-width: 4; filter: none; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- 3D Gradients for Atoms -->
            <radialGradient id="cr-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#E8E8E8"/>
                <stop offset="50%" stop-color="#A8A8A8"/>
                <stop offset="100%" stop-color="#707070"/>
            </radialGradient>
            
            <radialGradient id="o-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FF8888"/>
                <stop offset="50%" stop-color="#FF4444"/>
                <stop offset="100%" stop-color="#CC0000"/>
            </radialGradient>

            <radialGradient id="h-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="70%" stop-color="#CCCCCC"/>
                <stop offset="100%" stop-color="#999999"/>
            </radialGradient>

            <!-- Glow Gradients -->
            <radialGradient id="yellow-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFEB3B" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#FFEB3B" stop-opacity="0"/>
            </radialGradient>

            <radialGradient id="orange-glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF9800" stop-opacity="0.7"/>
                <stop offset="100%" stop-color="#FF9800" stop-opacity="0"/>
            </radialGradient>

            <!-- Drop Shadow Filter -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
            </filter>
        </defs>

        <!-- Main Reaction Container -->
        <rect x="40" y="90" width="720" height="300" rx="20" class="bg-rect" stroke="#E0E0E0" stroke-width="2"/>

        <!-- Titles -->
        <text x="400" y="45" font-family="Inter" font-size="26" font-weight="700" fill="#222" text-anchor="middle">The Chromate-Dichromate Equilibrium</text>
        <text x="400" y="70" font-family="Inter" font-size="15" font-weight="600" fill="#666" text-anchor="middle">A Study in D-Block Oxoanions</text>

        <!-- State Labels -->
        <text x="400" y="130" font-family="Inter" font-size="20" font-weight="700" fill="#F57F17" text-anchor="middle" class="alkaline-text">Alkaline Medium (pH &gt; 7)</text>
        <text x="400" y="130" font-family="Inter" font-size="20" font-weight="700" fill="#E65100" text-anchor="middle" class="acidic-text">Acidic Medium (pH &lt; 7)</text>

        <!-- Legend -->
        <g transform="translate(60, 290)">
            <rect x="0" y="0" width="125" height="85" rx="8" fill="rgba(255,255,255,0.85)" stroke="#D0D0D0" stroke-width="1"/>
            <circle cx="15" cy="18" r="7" fill="url(#cr-grad)"/>
            <text x="30" y="22" font-family="Inter" font-size="11" font-weight="600" fill="#444">Chromium (Cr)</text>
            
            <circle cx="15" cy="40" r="7" fill="url(#o-grad)"/>
            <text x="30" y="44" font-family="Inter" font-size="11" font-weight="600" fill="#444">Oxygen (O)</text>
            
            <circle cx="15" cy="62" r="7" fill="url(#h-grad)"/>
            <text x="30" y="66" font-family="Inter" font-size="11" font-weight="600" fill="#444">Proton (H⁺)</text>
        </g>

        <!-- Equilibrium Arrows -->
        <g transform="translate(400, 340)">
            <!-- Forward Reaction Arrow (Top) -->
            <path d="M-45,-8 L45,-8 L30,-20 M45,-8 L30,4" class="arrow-right" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <!-- Reverse Reaction Arrow (Bottom) -->
            <path d="M45,8 L-45,8 L-30,-4 M-45,8 L-30,20" class="arrow-left" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Reaction Equation -->
        <rect x="100" y="415" width="600" height="60" rx="12" fill="#ffffff" stroke="#E0E0E0" stroke-width="2" filter="url(#shadow)"/>
        <text x="400" y="452" font-family="Roboto Mono" font-size="22" fill="#333" text-anchor="middle">
            <tspan fill="#D4A017" font-weight="700">2CrO₄²⁻</tspan> + 2H⁺ 
            <tspan fill="#7209B7" font-weight="700"> ⇌ </tspan> 
            <tspan fill="#D84315" font-weight="700">Cr₂O₇²⁻</tspan> + H₂O
        </text>

        <!-- MOLECULES -->
        
        <!-- Right Chromate (Rendered first so it sits behind the bridge O when merged) -->
        <g class="right-chromate">
            <!-- Glows -->
            <circle cx="0" cy="0" r="80" fill="url(#yellow-glow)" class="yellow-glow-anim"/>
            <circle cx="0" cy="0" r="80" fill="url(#orange-glow)" class="orange-glow-anim"/>
            
            <!-- Bonds -->
            <line x1="0" y1="0" x2="-70" y2="-40" stroke="#404040" stroke-width="7" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="-30" y2="45" stroke="#404040" stroke-width="7" stroke-linecap="round"/>
            <!-- Double bond top -->
            <line x1="-4" y1="-3" x2="36" y2="-53" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <line x1="4" y1="3" x2="44" y2="-47" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <!-- Double bond bottom -->
            <line x1="-4" y1="1" x2="16" y2="61" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <line x1="4" y1="-1" x2="24" y2="59" stroke="#404040" stroke-width="6" stroke-linecap="round"/>

            <!-- Atoms -->
            <circle cx="40" cy="-50" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
            <circle cx="20" cy="60" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
            <circle cx="-30" cy="45" r="18" fill="url(#o-grad)" filter="url(#shadow)"/>
            <circle cx="0" cy="0" r="24" fill="url(#cr-grad)" filter="url(#shadow)"/>
            <text x="0" y="-32" font-family="Inter" font-size="13" font-weight="700" fill="#333" text-anchor="middle">+6</text>
        </g>

        <!-- Left Chromate (Contains the bridging Oxygen) -->
        <g class="left-chromate">
            <!-- Glows -->
            <circle cx="0" cy="0" r="80" fill="url(#yellow-glow)" class="yellow-glow-anim"/>
            <circle cx="0" cy="0" r="80" fill="url(#orange-glow)" class="orange-glow-anim"/>

            <!-- Bonds -->
            <line x1="0" y1="0" x2="70" y2="-40" stroke="#404040" stroke-width="7" stroke-linecap="round"/>
            <line x1="0" y1="0" x2="30" y2="45" stroke="#404040" stroke-width="7" stroke-linecap="round"/>
            <!-- Double bond top -->
            <line x1="-4" y1="3" x2="-44" y2="-47" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <line x1="4" y1="-3" x2="-36" y2="-53" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <!-- Double bond bottom -->
            <line x1="-4" y1="-1" x2="-24" y2="59" stroke="#404040" stroke-width="6" stroke-linecap="round"/>
            <line x1="4" y1="1" x2="-16" y2="61" stroke="#404040" stroke-width="6" stroke-linecap="round"/>

            <!-- Atoms -->
            <circle cx="-40" cy="-50" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
            <circle cx="-20" cy="60" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
            <circle cx="30" cy="45" r="18" fill="url(#o-grad)" filter="url(#shadow)"/>
            <!-- Bridging Oxygen -->
            <circle cx="70" cy="-40" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
            
            <circle cx="0" cy="0" r="24" fill="url(#cr-grad)" filter="url(#shadow)"/>
            <text x="0" y="-32" font-family="Inter" font-size="13" font-weight="700" fill="#333" text-anchor="middle">+6</text>
        </g>

        <!-- Leaving Water Molecule (Oxygen + 2 Protons) -->
        <g class="water-molecule">
            <g class="protons-anim">
                <!-- Hydrogen Bonds / Attachments -->
                <line x1="0" y1="0" x2="-14" y2="-18" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="14" y2="-18" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Hydrogen Atoms -->
                <circle cx="-14" cy="-18" r="9" fill="url(#h-grad)" filter="url(#shadow)"/>
                <text x="-14" y="-30" font-family="Inter" font-size="11" font-weight="700" fill="#555" text-anchor="middle">H⁺</text>
                
                <circle cx="14" cy="-18" r="9" fill="url(#h-grad)" filter="url(#shadow)"/>
                <text x="14" y="-30" font-family="Inter" font-size="11" font-weight="700" fill="#555" text-anchor="middle">H⁺</text>
            </g>
            
            <!-- Leaving Oxygen -->
            <circle cx="0" cy="0" r="16" fill="url(#o-grad)" filter="url(#shadow)"/>
        </g>

    </svg>
</div>

</body>
</html>
