<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Number & Moseley's Law</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #495057; }
        .label { font-size: 12px; font-weight: 600; fill: #495057; }
        .math { font-family: 'Roboto Mono', monospace; }
        
        /* Identity Card */
        .card-z { font-size: 14px; font-weight: 700; fill: #7209B7; }
        .card-sym { font-size: 48px; font-weight: 700; fill: #212529; }
        .card-name { font-size: 16px; font-weight: 600; fill: #495057; }
        .card-mass { font-size: 12px; font-weight: 400; fill: #868e96; }

        /* Animations */
        .show-H { animation: anim-H 12s infinite; }
        .show-He { animation: anim-He 12s infinite; }
        .show-Li { animation: anim-Li 12s infinite; }
        .show-He-Li { animation: anim-He-Li 12s infinite; }
        
        .fly-He { animation: fly-He 12s infinite; }
        .fly-Li { animation: fly-Li 12s infinite; }
        
        .draw-trendline {
            stroke-dasharray: 400;
            animation: draw-line 12s infinite;
        }

        .arrow-anim { animation: arrow-bounce 12s infinite; }

        /* Keyframes */
        @keyframes anim-H {
            0%, 25% { opacity: 1; }
            33.3%, 91.6% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes anim-He {
            0%, 25% { opacity: 0; }
            33.3%, 58.3% { opacity: 1; }
            66.6%, 100% { opacity: 0; }
        }

        @keyframes anim-Li {
            0%, 58.3% { opacity: 0; }
            66.6%, 91.6% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes anim-He-Li {
            0%, 25% { opacity: 0; }
            33.3%, 91.6% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fly-He {
            0%, 25% { opacity: 0; transform: translate(-80px, -60px); }
            33.3%, 91.6% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; transform: translate(0, 0); }
        }

        @keyframes fly-Li {
            0%, 58.3% { opacity: 0; transform: translate(80px, -60px); }
            66.6%, 91.6% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; transform: translate(0, 0); }
        }

        @keyframes draw-line {
            0%, 66.6% { stroke-dashoffset: 400; opacity: 0; }
            66.7% { opacity: 1; stroke-dashoffset: 400; }
            75%, 91.6% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 400; opacity: 0; }
        }

        @keyframes arrow-bounce {
            0%, 20% { opacity: 0; transform: translate(-10px, -10px); }
            25%, 30% { opacity: 1; transform: translate(0, 0); }
            33.3%, 53% { opacity: 0; transform: translate(-10px, -10px); }
            58.3%, 63% { opacity: 1; transform: translate(0, 0); }
            66.6%, 100% { opacity: 0; }
        }

        @keyframes rotate-inner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes rotate-outer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Particle Gradients -->
            <radialGradient id="protonGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF8888"/>
                <stop offset="100%" stop-color="#FF4444"/>
            </radialGradient>
            <radialGradient id="neutronGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#EEEEEE"/>
                <stop offset="100%" stop-color="#CCCCCC"/>
            </radialGradient>
            <radialGradient id="electronGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#8888FF"/>
                <stop offset="100%" stop-color="#4444FF"/>
            </radialGradient>

            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
            </filter>

            <!-- Arrowhead -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Header -->
        <text x="400" y="35" text-anchor="middle" class="title">Atomic Number (Z): The Fundamental Property</text>
        <text x="400" y="55" text-anchor="middle" class="subtitle">Moseley's Law proves that Z, not atomic mass, determines element identity.</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: ATOMIC STRUCTURE               -->
        <!-- ========================================== -->
        
        <!-- Identity Card Base -->
        <g filter="url(#shadow)">
            <rect x="140" y="80" width="120" height="130" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
        </g>

        <!-- Identity Card: Hydrogen -->
        <g class="show-H">
            <text x="150" y="100" class="card-z">Z = 1</text>
            <text x="200" y="150" text-anchor="middle" class="card-sym">H</text>
            <text x="200" y="175" text-anchor="middle" class="card-name">Hydrogen</text>
            <text x="200" y="195" text-anchor="middle" class="card-mass">1.008 u</text>
        </g>

        <!-- Identity Card: Helium -->
        <g class="show-He">
            <text x="150" y="100" class="card-z">Z = 2</text>
            <text x="200" y="150" text-anchor="middle" class="card-sym">He</text>
            <text x="200" y="175" text-anchor="middle" class="card-name">Helium</text>
            <text x="200" y="195" text-anchor="middle" class="card-mass">4.002 u</text>
        </g>

        <!-- Identity Card: Lithium -->
        <g class="show-Li">
            <text x="150" y="100" class="card-z">Z = 3</text>
            <text x="200" y="150" text-anchor="middle" class="card-sym">Li</text>
            <text x="200" y="175" text-anchor="middle" class="card-name">Lithium</text>
            <text x="200" y="195" text-anchor="middle" class="card-mass">6.94 u</text>
        </g>

        <!-- Electron Shells -->
        <circle cx="200" cy="360" r="50" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4 4"/>
        <circle cx="200" cy="360" r="90" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="4 4" class="show-Li"/>

        <!-- Electrons (Rotating Groups) -->
        <g style="transform-origin: 200px 360px; animation: rotate-inner 3s linear infinite;">
            <!-- e1 (H, He, Li) -->
            <circle cx="200" cy="310" r="5" fill="url(#electronGrad)" filter="url(#glow)"/>
            <!-- e2 (He, Li) -->
            <circle cx="200" cy="410" r="5" fill="url(#electronGrad)" filter="url(#glow)" class="show-He-Li"/>
        </g>
        
        <g style="transform-origin: 200px 360px; animation: rotate-outer 6s linear infinite;">
            <!-- e3 (Li) -->
            <circle cx="290" cy="360" r="5" fill="url(#electronGrad)" filter="url(#glow)" class="show-Li"/>
        </g>

        <!-- Nucleus Group -->
        <g transform="translate(200, 360)" filter="url(#shadow)">
            <!-- H Nucleus (Always visible) -->
            <circle cx="0" cy="0" r="7" fill="url(#protonGrad)"/>
            
            <!-- He Additional Particles -->
            <g class="fly-He">
                <circle cx="9" cy="7" r="7" fill="url(#protonGrad)"/>
                <circle cx="-9" cy="5" r="7" fill="url(#neutronGrad)"/>
                <circle cx="3" cy="-9" r="7" fill="url(#neutronGrad)"/>
            </g>

            <!-- Li Additional Particles -->
            <g class="fly-Li">
                <circle cx="-7" cy="-7" r="7" fill="url(#protonGrad)"/>
                <circle cx="11" cy="-5" r="7" fill="url(#neutronGrad)"/>
                <circle cx="-2" cy="11" r="7" fill="url(#neutronGrad)"/>
                <circle cx="-11" cy="-3" r="7" fill="url(#neutronGrad)"/>
            </g>
        </g>

        <!-- Transition Arrow -->
        <path d="M 120 280 Q 150 280 175 330" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="arrow-anim"/>
        <text x="110" y="270" class="label arrow-anim" fill="#F77F00">Adding Protons...</text>

        <!-- Legend -->
        <g transform="translate(20, 440)">
            <rect x="0" y="0" width="130" height="50" rx="4" fill="#fff" stroke="#e9ecef"/>
            <circle cx="15" cy="15" r="4" fill="url(#protonGrad)"/>
            <text x="25" y="19" class="label" font-size="10">Proton (p⁺)</text>
            
            <circle cx="15" cy="35" r="4" fill="url(#neutronGrad)"/>
            <text x="25" y="39" class="label" font-size="10">Neutron (n⁰)</text>
            
            <circle cx="80" cy="15" r="4" fill="url(#electronGrad)"/>
            <text x="90" y="19" class="label" font-size="10">Electron (e⁻)</text>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT PANEL: MOSELEY'S GRAPH               -->
        <!-- ========================================== -->

        <!-- Graph Background / Grid -->
        <rect x="480" y="130" width="280" height="300" fill="#ffffff" stroke="none" rx="4" filter="url(#shadow)"/>
        
        <!-- Gridlines -->
        <line x1="480" y1="350" x2="760" y2="350" stroke="#f1f3f5" stroke-width="1"/>
        <line x1="480" y1="270" x2="760" y2="270" stroke="#f1f3f5" stroke-width="1"/>
        <line x1="480" y1="190" x2="760" y2="190" stroke="#f1f3f5" stroke-width="1"/>
        
        <line x1="540" y1="130" x2="540" y2="430" stroke="#f1f3f5" stroke-width="1"/>
        <line x1="620" y1="130" x2="620" y2="430" stroke="#f1f3f5" stroke-width="1"/>
        <line x1="700" y1="130" x2="700" y2="430" stroke="#f1f3f5" stroke-width="1"/>

        <!-- Axes -->
        <path d="M 480 130 L 480 430 L 760 430" fill="none" stroke="#343a40" stroke-width="2"/>
        
        <!-- Axis Labels -->
        <text x="620" y="465" text-anchor="middle" class="label">Atomic Number (Z)</text>
        <text x="-280" y="450" transform="rotate(-90)" text-anchor="middle" class="label">√ν (Square Root of Frequency)</text>

        <!-- X-Axis Ticks -->
        <text x="540" y="448" text-anchor="middle" class="label math">1</text>
        <text x="620" y="448" text-anchor="middle" class="label math">2</text>
        <text x="700" y="448" text-anchor="middle" class="label math">3</text>

        <!-- Connecting Drop Lines -->
        <line x1="540" y1="370" x2="540" y2="430" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5"/>
        <line x1="620" y1="290" x2="620" y2="430" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5" class="show-He-Li"/>
        <line x1="700" y1="210" x2="700" y2="430" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5" class="show-Li"/>

        <!-- Trendline -->
        <!-- Equation: y = -x + 910. Passes through (480, 430) and (740, 170) -->
        <line x1="480" y1="430" x2="740" y2="170" stroke="#7209B7" stroke-width="3" class="draw-trendline"/>

        <!-- Data Points -->
        <!-- Point 1 (H) -->
        <circle cx="540" cy="370" r="6" fill="#F77F00" filter="url(#glow)"/>
        <text x="555" y="374" class="label math" fill="#F77F00">H</text>

        <!-- Point 2 (He) -->
        <g class="show-He-Li">
            <circle cx="620" cy="290" r="6" fill="#F77F00" filter="url(#glow)"/>
            <text x="635" y="294" class="label math" fill="#F77F00">He</text>
        </g>

        <!-- Point 3 (Li) -->
        <g class="show-Li">
            <circle cx="700" cy="210" r="6" fill="#F77F00" filter="url(#glow)"/>
            <text x="715" y="214" class="label math" fill="#F77F00">Li</text>
        </g>

        <!-- Formula Box -->
        <g transform="translate(540, 80)" filter="url(#shadow)">
            <rect x="0" y="0" width="180" height="40" rx="6" fill="#f8f9fa" stroke="#7209B7" stroke-width="2"/>
            <text x="90" y="25" text-anchor="middle" class="math" font-size="16" font-weight="700" fill="#7209B7">√ν = a(Z - b)</text>
        </g>

    </svg>
</div>

</body>
</html>
