<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrhenius Equation and Collision Theory</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 800; fill: #333; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 24px; font-weight: 700; }
        .axis-label { font-size: 14px; font-weight: 600; fill: #555; }
        .annotation { font-size: 14px; font-weight: 600; fill: #404040; }
        .small-text { font-size: 11px; fill: #666; }
        
        /* Animations */
        .h2-move { animation: moveH2 8s linear infinite; }
        .i2-move { animation: moveI2 8s linear infinite; }
        .hi-left-move { animation: moveHILeft 8s linear infinite; }
        .hi-right-move { animation: moveHIRight 8s linear infinite; }
        
        .reactants-fade { animation: fadeOut 8s linear infinite; }
        .products-fade { animation: fadeInOut 8s linear infinite; }
        
        .reactant-bond { animation: dashReactants 8s linear infinite; }
        .ts-bonds { animation: tsBonds 8s linear infinite; }
        
        .ea-label { animation: pulseEa 8s linear infinite; transform-origin: 235px 190px; }
        .aura { animation: auraGlow 8s linear infinite; }

        @keyframes moveH2 {
            0%, 5% { transform: translateX(-140px); }
            25%, 37.5% { transform: translateX(0px); }
            37.51%, 100% { transform: translateX(0px); }
        }

        @keyframes moveI2 {
            0%, 5% { transform: translateX(140px); }
            25%, 37.5% { transform: translateX(0px); }
            37.51%, 100% { transform: translateX(0px); }
        }

        @keyframes moveHILeft {
            0%, 37.5% { transform: translateX(0px); }
            62.5%, 85% { transform: translateX(-140px); }
            85.01%, 100% { transform: translateX(-140px); }
        }

        @keyframes moveHIRight {
            0%, 37.5% { transform: translateX(0px); }
            62.5%, 85% { transform: translateX(140px); }
            85.01%, 100% { transform: translateX(140px); }
        }

        @keyframes fadeOut {
            0%, 37.5% { opacity: 1; }
            37.51%, 100% { opacity: 0; }
        }

        @keyframes fadeInOut {
            0%, 37.5% { opacity: 0; }
            37.51%, 85% { opacity: 1; }
            85.01%, 100% { opacity: 0; }
        }

        @keyframes dashReactants {
            0%, 20% { stroke-dasharray: 60; opacity: 1; }
            25%, 37.5% { stroke-dasharray: 6 6; opacity: 0.5; }
            37.51%, 100% { opacity: 0; }
        }

        @keyframes tsBonds {
            0%, 20% { opacity: 0; }
            25%, 37.5% { opacity: 0.6; stroke-dasharray: 6 6; }
            37.51%, 100% { opacity: 0; }
        }

        @keyframes pulseEa {
            0%, 20% { transform: scale(1); fill: #FF4444; }
            25%, 35% { transform: scale(1.15); fill: #FF0000; font-weight: 800; }
            40%, 100% { transform: scale(1); fill: #FF4444; }
        }

        @keyframes auraGlow {
            0%, 15% { r: 0; opacity: 0; }
            25%, 37.5% { r: 75; opacity: 0.15; fill: #FF8800; }
            45%, 100% { r: 0; opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <title>Arrhenius Equation and Activation Energy</title>
    <desc>An animation showing the reaction coordinate diagram and molecular collision for an exothermic reaction.</desc>

    <defs>
        <!-- Arrowheads -->
        <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF4444" />
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4444FF" />
        </marker>
        <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#404040" />
        </marker>

        <!-- Gradients for 3D Spheres -->
        <radialGradient id="h-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#CCCCCC" />
        </radialGradient>
        <radialGradient id="i-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#DDAAFF" />
            <stop offset="100%" stop-color="#9933FF" />
        </radialGradient>
        <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF8800" stop-opacity="1" />
            <stop offset="100%" stop-color="#FF8800" stop-opacity="0" />
        </radialGradient>

        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25" />
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <!-- Reaction Coordinate Path -->
        <path id="curvePath" d="M 80 260 C 150 260, 170 120, 220 120 C 270 120, 290 360, 360 360" fill="none" />
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />

    <!-- Header / Title -->
    <text x="400" y="45" text-anchor="middle" class="title">
        Arrhenius Equation: 
        <tspan class="formula">k = A e<tspan dy="-12" font-size="16">-<tspan fill="#FF4444">E</tspan><tspan dy="4" font-size="12" fill="#FF4444">a</tspan><tspan dy="-4" fill="#333">/RT</tspan></tspan></tspan>
    </text>

    <!-- Divider Line -->
    <line x1="410" y1="80" x2="410" y2="460" stroke="#ddd" stroke-width="2" stroke-dasharray="6 6" />

    <!-- ========================================== -->
    <!-- LEFT PANE: REACTION COORDINATE DIAGRAM     -->
    <!-- ========================================== -->
    <g id="graph-pane">
        <!-- Grid Lines -->
        <line x1="60" y1="120" x2="380" y2="120" stroke="#eee" stroke-width="1" />
        <line x1="60" y1="260" x2="380" y2="260" stroke="#eee" stroke-width="1" />
        <line x1="60" y1="360" x2="380" y2="360" stroke="#eee" stroke-width="1" />

        <!-- Axes -->
        <line x1="60" y1="420" x2="380" y2="420" stroke="#404040" stroke-width="2" marker-end="url(#arrow-black)" />
        <line x1="60" y1="420" x2="60" y2="80" stroke="#404040" stroke-width="2" marker-end="url(#arrow-black)" />
        
        <text x="220" y="445" text-anchor="middle" class="axis-label">Reaction Coordinate</text>
        <text x="-250" y="40" transform="rotate(-90)" text-anchor="middle" class="axis-label">Potential Energy (E)</text>

        <!-- Energy Levels (Dashed) -->
        <line x1="60" y1="260" x2="220" y2="260" stroke="#404040" stroke-width="2" stroke-dasharray="5 5" />
        <line x1="220" y1="360" x2="380" y2="360" stroke="#404040" stroke-width="2" stroke-dasharray="5 5" />

        <!-- The Energy Curve -->
        <use href="#curvePath" stroke="#404040" stroke-width="4" stroke-linecap="round" />

        <!-- Activation Energy (Ea) Arrow -->
        <line x1="220" y1="255" x2="220" y2="125" stroke="#FF4444" stroke-width="3" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)" />
        <text x="235" y="190" class="annotation ea-label">E<tspan dy="4" font-size="10">a</tspan></text>

        <!-- Enthalpy (dH) Arrow -->
        <line x1="340" y1="265" x2="340" y2="355" stroke="#4444FF" stroke-width="3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)" />
        <text x="355" y="315" class="annotation" fill="#4444FF">ΔH</text>

        <!-- Labels -->
        <text x="100" y="245" class="annotation">Reactants</text>
        <text x="100" y="280" class="annotation" font-family="'Roboto Mono', monospace">H₂ + I₂</text>
        
        <text x="300" y="345" class="annotation">Products</text>
        <text x="300" y="385" class="annotation" font-family="'Roboto Mono', monospace">2HI</text>

        <text x="220" y="105" text-anchor="middle" class="annotation">Transition State</text>
        <text x="220" y="85" text-anchor="middle" class="annotation" font-family="'Roboto Mono', monospace">[H₂···I₂]<tspan dy="-5" font-size="12">‡</tspan></text>

        <!-- Animated Reaction Progress Marker -->
        <circle r="7" fill="#FF8800" filter="url(#glow)">
            <animateMotion dur="8s" repeatCount="indefinite" keyPoints="0; 0.42; 0.42; 1; 1; 0; 0" keyTimes="0; 0.25; 0.375; 0.625; 0.85; 0.851; 1" calcMode="linear">
                <mpath href="#curvePath" />
            </animateMotion>
        </circle>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT PANE: MOLECULAR COLLISION            -->
    <!-- ========================================== -->
    <g id="collision-pane" transform="translate(600, 240)">
        
        <!-- Kinetic Energy Aura -->
        <circle class="aura" cx="0" cy="0" r="0" />

        <!-- Transition State Bonds (Vertical) -->
        <g class="ts-bonds">
            <line x1="-25" y1="-35" x2="-25" y2="35" stroke="#888" stroke-width="4" stroke-linecap="round" />
            <line x1="25" y1="-35" x2="25" y2="35" stroke="#888" stroke-width="4" stroke-linecap="round" />
        </g>

        <!-- REACTANTS GROUP (Fades out after TS) -->
        <g class="reactants-fade">
            <!-- H2 Molecule (Moves from Left) -->
            <g class="h2-move">
                <line class="reactant-bond" x1="-25" y1="-35" x2="25" y2="-35" stroke="#333" stroke-width="5" stroke-linecap="round" />
                <circle cx="-25" cy="-35" r="14" fill="url(#h-grad)" filter="url(#shadow)" />
                <circle cx="25" cy="-35" r="14" fill="url(#h-grad)" filter="url(#shadow)" />
            </g>
            
            <!-- I2 Molecule (Moves from Right) -->
            <g class="i2-move">
                <line class="reactant-bond" x1="-25" y1="35" x2="25" y2="35" stroke="#333" stroke-width="5" stroke-linecap="round" />
                <circle cx="-25" cy="35" r="24" fill="url(#i-grad)" filter="url(#shadow)" />
                <circle cx="25" cy="35" r="24" fill="url(#i-grad)" filter="url(#shadow)" />
            </g>
        </g>

        <!-- PRODUCTS GROUP (Fades in after TS) -->
        <g class="products-fade">
            <!-- Left HI Molecule (Moves to Left) -->
            <g class="hi-left-move">
                <line x1="-25" y1="-35" x2="-25" y2="35" stroke="#333" stroke-width="5" stroke-linecap="round" />
                <circle cx="-25" cy="-35" r="14" fill="url(#h-grad)" filter="url(#shadow)" />
                <circle cx="-25" cy="35" r="24" fill="url(#i-grad)" filter="url(#shadow)" />
            </g>
            
            <!-- Right HI Molecule (Moves to Right) -->
            <g class="hi-right-move">
                <line x1="25" y1="-35" x2="25" y2="35" stroke="#333" stroke-width="5" stroke-linecap="round" />
                <circle cx="25" cy="-35" r="14" fill="url(#h-grad)" filter="url(#shadow)" />
                <circle cx="25" cy="35" r="24" fill="url(#i-grad)" filter="url(#shadow)" />
            </g>
        </g>
    </g>

    <!-- Dynamic Text / Legend Box -->
    <rect x="450" y="390" width="310" height="70" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="2" filter="url(#shadow)" />
    <text x="605" y="418" text-anchor="middle" class="annotation" font-size="16">If Temperature (T) ↑, then k ↑</text>
    <text x="605" y="442" text-anchor="middle" class="small-text">(More molecules have enough energy to cross E<tspan dy="3" font-size="9">a</tspan><tspan dy="-3"> barrier)</tspan></text>

</svg>

</body>
</html>
