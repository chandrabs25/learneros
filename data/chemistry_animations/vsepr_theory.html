<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSEPR Theory: Geometry of Alcohols</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .ch3-group {
            transform-origin: 400px 220px;
            animation: rotate-ch3 12s ease-in-out infinite;
        }

        .oh-group {
            transform-origin: 400px 220px;
            animation: rotate-oh 12s ease-in-out infinite;
        }

        .lp-group {
            transform-origin: 400px 220px;
            animation: pulse-lp 12s ease-in-out infinite;
        }

        .arrow-left {
            animation: arrow-fade-left 12s ease-in-out infinite;
        }

        .arrow-right {
            animation: arrow-fade-right 12s ease-in-out infinite;
        }

        .angle-arc {
            transform-origin: 400px 220px;
            animation: compress-arc 12s ease-in-out infinite;
        }

        .label-109 {
            animation: fade-out-109 12s ease-in-out infinite;
        }

        .label-108 {
            opacity: 0;
            animation: fade-in-108 12s ease-in-out infinite;
        }

        .repulsion-text {
            opacity: 0;
            animation: fade-in-text 12s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes rotate-ch3 {
            0%, 40% { transform: rotate(0deg); }
            65%, 85% { transform: rotate(-3deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes rotate-oh {
            0%, 40% { transform: rotate(0deg); }
            65%, 85% { transform: rotate(3deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse-lp {
            0%, 20% { opacity: 0; transform: scale(0.8); }
            35%, 45% { opacity: 0.8; transform: scale(1); }
            65%, 85% { opacity: 1; transform: scale(1.15); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        @keyframes arrow-fade-left {
            0%, 40% { opacity: 0; transform: translate(15px, -15px); }
            50%, 85% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; transform: translate(15px, -15px); }
        }

        @keyframes arrow-fade-right {
            0%, 40% { opacity: 0; transform: translate(-15px, -15px); }
            50%, 85% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; transform: translate(-15px, -15px); }
        }

        @keyframes compress-arc {
            0%, 40% { transform: scale(1); stroke: #555; }
            65%, 85% { transform: scale(0.92); stroke: #CC0000; }
            100% { transform: scale(1); stroke: #555; }
        }

        @keyframes fade-out-109 {
            0%, 55% { opacity: 1; transform: translateY(0); }
            65%, 85% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fade-in-108 {
            0%, 55% { opacity: 0; transform: translateY(5px); }
            65%, 85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(5px); }
        }

        @keyframes fade-in-text {
            0%, 60% { opacity: 0; transform: translateY(10px); }
            70%, 85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Atom Gradients -->
            <radialGradient id="gradO" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF8888"/>
                <stop offset="100%" stop-color="#CC0000"/>
            </radialGradient>
            
            <radialGradient id="gradC" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777777"/>
                <stop offset="100%" stop-color="#222222"/>
            </radialGradient>
            
            <radialGradient id="gradH" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#AAAAAA"/>
            </radialGradient>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15"/>
            </filter>

            <!-- Arrowhead Marker -->
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#222">
            VSEPR Theory: Geometry of Alcohols (CH<tspan dy="5" font-size="16">3</tspan><tspan dy="-5">OH)</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(30, 390)">
            <rect width="130" height="80" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)" />
            <circle cx="20" cy="20" r="6" fill="url(#gradO)" />
            <text x="35" y="24" font-family="Inter" font-size="12" fill="#444">Oxygen (O)</text>
            <circle cx="20" cy="40" r="6" fill="url(#gradC)" />
            <text x="35" y="44" font-family="Inter" font-size="12" fill="#444">Carbon (C)</text>
            <circle cx="20" cy="60" r="6" fill="url(#gradH)" />
            <text x="35" y="64" font-family="Inter" font-size="12" fill="#444">Hydrogen (H)</text>
        </g>

        <!-- Chemical Formula -->
        <text x="760" y="460" text-anchor="end" font-family="Roboto Mono" font-size="28" font-weight="700" fill="#bbb">
            CH<tspan dy="8" font-size="20">3</tspan><tspan dy="-8">OH</tspan>
        </text>

        <!-- Repulsion Annotation -->
        <text x="400" y="450" text-anchor="middle" font-family="Inter" font-size="18" font-weight="600" fill="#F77F00" class="repulsion-text">
            Lone pair - lone pair repulsion compresses the bond angle.
        </text>

        <!-- MOLECULE STRUCTURE -->
        
        <!-- Lone Pairs -->
        <g class="lp-group">
            <!-- Left Lone Pair -->
            <path d="M 0,0 C -25,-40 -25,-75 0,-75 C 25,-75 25,-40 0,0" 
                  transform="translate(400, 220) rotate(-50)" 
                  fill="rgba(255, 215, 0, 0.4)" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,4" />
            <!-- Right Lone Pair -->
            <path d="M 0,0 C -25,-40 -25,-75 0,-75 C 25,-75 25,-40 0,0" 
                  transform="translate(400, 220) rotate(50)" 
                  fill="rgba(255, 215, 0, 0.4)" stroke="#FFD700" stroke-width="2" stroke-dasharray="4,4" />
        </g>

        <!-- Repulsion Arrows -->
        <g>
            <path d="M 340 150 Q 290 190 320 250" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="arrow-left" />
            <path d="M 460 150 Q 510 190 480 250" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="arrow-right" />
        </g>

        <!-- Angle Arc -->
        <path d="M 351.1 254.7 A 60 60 0 0 0 448.9 254.7" fill="none" stroke-width="2.5" class="angle-arc" />

        <!-- Dynamic Angle Labels -->
        <text x="400" y="292" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#555" class="label-109">109.5°</text>
        <text x="400" y="292" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#CC0000" class="label-108">108.9°</text>

        <!-- CH3 Group (Rotates as a unit) -->
        <g class="ch3-group">
            <!-- C-O Bond -->
            <line x1="286" y1="301" x2="400" y2="220" stroke="#555" stroke-width="6" />
            
            <!-- C-H Bonds -->
            <!-- Solid (Left) -->
            <line x1="286" y1="301" x2="206" y2="301" stroke="#555" stroke-width="4" />
            <!-- Dash (Up-Left) -->
            <line x1="286" y1="301" x2="246" y2="241" stroke="#555" stroke-width="4" stroke-dasharray="6,5" />
            <!-- Wedge (Down-Left) -->
            <polygon points="286,301 260.4,366.6 249.6,361.4" fill="#555" />

            <!-- Atoms -->
            <circle cx="206" cy="301" r="14" fill="url(#gradH)" filter="url(#shadow)" />
            <circle cx="246" cy="241" r="14" fill="url(#gradH)" filter="url(#shadow)" />
            <circle cx="255" cy="364" r="14" fill="url(#gradH)" filter="url(#shadow)" />
            <circle cx="286" cy="301" r="22" fill="url(#gradC)" filter="url(#shadow)" />

            <!-- sp3 Callout for Carbon -->
            <line x1="286" y1="323" x2="286" y2="370" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" />
            <text x="286" y="388" text-anchor="middle" font-family="Inter" font-size="13" font-weight="600" fill="#666">sp³ hybridized</text>
        </g>

        <!-- OH Group (Rotates as a unit) -->
        <g class="oh-group">
            <!-- O-H Bond -->
            <line x1="400" y1="220" x2="514" y2="301" stroke="#555" stroke-width="6" />
            
            <!-- H Atom -->
            <circle cx="514" cy="301" r="14" fill="url(#gradH)" filter="url(#shadow)" />
        </g>

        <!-- Central Oxygen Atom (Static, drawn last to be on top) -->
        <circle cx="400" cy="220" r="26" fill="url(#gradO)" filter="url(#shadow)" />

        <!-- sp3 Callout for Oxygen -->
        <line x1="426" y1="220" x2="480" y2="220" stroke="#888" stroke-width="1.5" stroke-dasharray="3,3" />
        <text x="485" y="224" font-family="Inter" font-size="13" font-weight="600" fill="#666">sp³ hybridized</text>

    </svg>
</div>

</body>
</html>
