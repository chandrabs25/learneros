<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrophilic Aromatic Substitution: Chlorination</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        h1 {
            text-align: center;
            color: #333;
            font-size: 24px;
            margin: 20px 0 10px 0;
            font-weight: 700;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* CSS Animations - 12s Loop */
        .cl-left { animation: cl-left-anim 12s ease-in-out infinite; }
        .cl-right { animation: cl-right-anim 12s ease-in-out infinite; }
        .fecl3-group { animation: fecl3-anim 12s ease-in-out infinite; }
        .h1-atom { animation: h1-anim 12s ease-in-out infinite; }
        
        .pi-circle { animation: pi-circle-anim 12s ease-in-out infinite; }
        .horseshoe { animation: horseshoe-anim 12s ease-in-out infinite; }
        .cl-plus-charge { animation: cl-plus-charge 12s ease-in-out infinite; }
        .fecl4-charge { animation: fecl4-charge 12s ease-in-out infinite; }
        
        .bond-cl-cl { animation: bond-cl-cl 12s ease-in-out infinite; }
        .bond-fe-cl { animation: bond-fe-cl 12s ease-in-out infinite; }
        .bond-h1-straight { animation: bond-h1-straight 12s ease-in-out infinite; }
        .bond-h1-tilted { animation: bond-h1-tilted 12s ease-in-out infinite; }
        .bond-cl-tilted { animation: bond-cl-tilted 12s ease-in-out infinite; }
        .bond-cl-straight { animation: bond-cl-straight 12s ease-in-out infinite; }
        
        .arrow1 { animation: arrow1 12s ease-in-out infinite; }
        .arrow2 { animation: arrow2 12s ease-in-out infinite; }
        .arrow3 { animation: arrow3 12s ease-in-out infinite; }
        .arrow4 { animation: arrow4 12s ease-in-out infinite; }
        
        .energy-dot { animation: energy-dot-anim 12s ease-in-out infinite; }
        
        .step1 { animation: step1 12s ease-in-out infinite; }
        .step2 { animation: step2 12s ease-in-out infinite; }
        .step3 { animation: step3 12s ease-in-out infinite; }
        .step4 { animation: step4 12s ease-in-out infinite; }

        /* Keyframes */
        @keyframes cl-left-anim {
            0%, 5% { transform: translate(0,0); opacity: 1; }
            10%, 20% { transform: translate(80px, 0); opacity: 1; }
            25%, 30% { transform: translate(-130px, -50px); opacity: 1; }
            35%, 75% { transform: translate(-165px, -6px); opacity: 1; }
            76%, 95% { transform: translate(-180px, -10px); opacity: 1; }
            96%, 100% { opacity: 0; transform: translate(-180px, -10px); }
        }
        @keyframes cl-right-anim {
            0%, 5% { transform: translate(0,0); opacity: 1; }
            10%, 50% { transform: translate(80px, 0); opacity: 1; }
            60%, 65% { transform: translate(-170px, -50px); opacity: 1; }
            70%, 75% { transform: translate(-170px, -50px); opacity: 1; }
            80%, 95% { transform: translate(-70px, -100px); opacity: 1; }
            96%, 100% { opacity: 0; transform: translate(-70px, -100px); }
        }
        @keyframes fecl3-anim {
            0%, 50% { transform: translate(0,0); }
            60%, 75% { transform: translate(-250px, -50px); }
            80%, 100% { transform: translate(0,0); }
        }
        @keyframes h1-anim {
            0%, 34% { transform: translate(0,0); opacity: 1; }
            35%, 65% { transform: translate(-15px, 4px); opacity: 1; }
            70%, 75% { transform: translate(50px, -40px); opacity: 1; }
            80%, 95% { transform: translate(150px, -90px); opacity: 1; }
            96%, 100% { opacity: 0; transform: translate(150px, -90px); }
        }
        
        @keyframes pi-circle-anim {
            0%, 30% { opacity: 1; }
            35%, 70% { opacity: 0; }
            75%, 100% { opacity: 1; }
        }
        @keyframes horseshoe-anim {
            0%, 30% { opacity: 0; }
            35%, 70% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }
        @keyframes cl-plus-charge {
            0%, 20% { opacity: 0; }
            21%, 30% { opacity: 1; }
            31%, 100% { opacity: 0; }
        }
        @keyframes fecl4-charge {
            0%, 9% { opacity: 0; }
            10%, 75% { opacity: 1; }
            76%, 100% { opacity: 0; }
        }
        
        @keyframes bond-cl-cl { 0%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
        @keyframes bond-fe-cl { 0%, 9% { opacity: 0; } 10%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
        @keyframes bond-h1-straight { 0%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
        @keyframes bond-h1-tilted { 0%, 34% { opacity: 0; } 35%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }
        @keyframes bond-cl-tilted { 0%, 34% { opacity: 0; } 35%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
        @keyframes bond-cl-straight { 0%, 75% { opacity: 0; } 76%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }

        @keyframes arrow1 {
            0%, 8% { stroke-dashoffset: 120; opacity: 1; }
            12%, 18% { stroke-dashoffset: 0; opacity: 1; }
            19%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes arrow2 {
            0%, 23% { stroke-dashoffset: 100; opacity: 0; }
            24% { opacity: 1; stroke-dashoffset: 100; }
            28%, 33% { stroke-dashoffset: 0; opacity: 1; }
            34%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes arrow3 {
            0%, 53% { stroke-dashoffset: 100; opacity: 0; }
            54% { opacity: 1; stroke-dashoffset: 100; }
            58%, 63% { stroke-dashoffset: 0; opacity: 1; }
            64%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes arrow4 {
            0%, 58% { stroke-dashoffset: 50; opacity: 0; }
            59% { opacity: 1; stroke-dashoffset: 50; }
            63%, 68% { stroke-dashoffset: 0; opacity: 1; }
            69%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes energy-dot-anim {
            0%, 5% { transform: translate(580px, 430px); opacity: 1; }
            15% { transform: translate(625px, 360px); opacity: 1; }
            25%, 55% { transform: translate(645px, 400px); opacity: 1; }
            65% { transform: translate(670px, 380px); opacity: 1; }
            75%, 95% { transform: translate(740px, 440px); opacity: 1; }
            96%, 100% { opacity: 0; transform: translate(740px, 440px); }
        }

        @keyframes step1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes step2 { 0%, 24% { opacity: 0; } 25%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes step3 { 0%, 49% { opacity: 0; } 50%, 74% { opacity: 1; } 75%, 100% { opacity: 0; } }
        @keyframes step4 { 0%, 74% { opacity: 0; } 75%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }

    </style>
</head>
<body>
    <div class="container">
        <h1>Electrophilic Aromatic Substitution: Chlorination</h1>
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Animated mechanism of benzene chlorination</title>
            <desc>Shows the formation of a sigma complex and regeneration of the iron chloride catalyst.</desc>
            
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
                </marker>
            </defs>

            <!-- Reaction Paths (Subtle Dashed Lines) -->
            <path d="M 460 200 Q 350 150 215 194" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" opacity="0.2"/>
            <path d="M 250 150 Q 300 100 350 100" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" opacity="0.2"/>

            <!-- Mechanism Step Labels -->
            <g font-family="Inter" font-size="18" font-weight="600" fill="#333">
                <text x="40" y="60" class="step1">Phase 1: Generation of Electrophile (Cl⁺)</text>
                <text x="40" y="60" class="step2">Phase 2: Electrophilic Attack (Sigma Complex)</text>
                <text x="40" y="60" class="step3">Phase 3: Deprotonation by [FeCl₄]⁻</text>
                <text x="40" y="60" class="step4">Phase 4: Catalyst Regeneration & Products</text>
            </g>

            <!-- Benzene Ring Base -->
            <g id="benzene-ring">
                <!-- Hexagon -->
                <polygon points="200,220 252,250 252,310 200,340 148,310 148,250" fill="none" stroke="#404040" stroke-width="3" stroke-linejoin="round"/>
                
                <!-- Pi System (Circle / Horseshoe) -->
                <circle cx="200" cy="280" r="40" fill="none" stroke="#404040" stroke-width="2" stroke-dasharray="6,4" class="pi-circle"/>
                <path d="M 165.4 260 A 40 40 0 1 0 234.6 260" fill="none" stroke="#404040" stroke-width="2" stroke-dasharray="6,4" class="horseshoe"/>
                <text x="200" y="288" text-anchor="middle" fill="#FF4444" font-weight="bold" font-size="24" class="horseshoe">+</text>

                <!-- Static Hydrogens & Bonds -->
                <line x1="252" y1="250" x2="278" y2="235" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <circle cx="278" cy="235" r="8" fill="#CCCCCC"/>
                <text x="278" y="239" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>

                <line x1="252" y1="310" x2="278" y2="325" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <circle cx="278" cy="325" r="8" fill="#CCCCCC"/>
                <text x="278" y="329" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>

                <line x1="200" y1="340" x2="200" y2="370" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <circle cx="200" cy="370" r="8" fill="#CCCCCC"/>
                <text x="200" y="374" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>

                <line x1="148" y1="310" x2="122" y2="325" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <circle cx="122" cy="325" r="8" fill="#CCCCCC"/>
                <text x="122" y="329" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>

                <line x1="148" y1="250" x2="122" y2="235" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <circle cx="122" cy="235" r="8" fill="#CCCCCC"/>
                <text x="122" y="239" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>

                <!-- Dynamic C1 Bonds -->
                <line x1="200" y1="220" x2="200" y2="190" stroke="#333" stroke-width="2" stroke-linecap="round" class="bond-h1-straight"/>
                <line x1="200" y1="220" x2="185" y2="194" stroke="#333" stroke-width="2" stroke-linecap="round" class="bond-h1-tilted"/>
                
                <line x1="200" y1="220" x2="215" y2="194" stroke="#333" stroke-width="2" stroke-linecap="round" class="bond-cl-tilted"/>
                <line x1="200" y1="220" x2="200" y2="190" stroke="#333" stroke-width="2" stroke-linecap="round" class="bond-cl-straight"/>
                
                <text x="200" y="400" text-anchor="middle" font-family="Roboto Mono" font-size="14" fill="#666">C₆H₆</text>
            </g>

            <!-- Dynamic H1 Atom -->
            <g class="h1-atom">
                <circle cx="200" cy="190" r="8" fill="#CCCCCC"/>
                <text x="200" y="194" font-family="Inter" font-size="10" text-anchor="middle" fill="#333">H</text>
            </g>

            <!-- Cl2 Molecule -->
            <line x1="380" y1="200" x2="420" y2="200" stroke="#333" stroke-width="2" class="bond-cl-cl"/>
            
            <g class="cl-left">
                <circle cx="380" cy="200" r="12" fill="#44CC44"/>
                <text x="380" y="204" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Cl</text>
                <text x="365" y="185" fill="#FF4444" font-weight="bold" font-size="18" class="cl-plus-charge">+</text>
            </g>
            
            <g class="cl-right">
                <circle cx="420" cy="200" r="12" fill="#44CC44"/>
                <text x="420" y="204" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Cl</text>
            </g>

            <!-- FeCl3 Catalyst -->
            <g class="fecl3-group">
                <!-- Bonds -->
                <line x1="550" y1="200" x2="590" y2="200" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <line x1="550" y1="200" x2="530" y2="235" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <line x1="550" y1="200" x2="530" y2="165" stroke="#333" stroke-width="2" stroke-linecap="round"/>
                <!-- Dynamic bond to Cl_right -->
                <line x1="550" y1="200" x2="500" y2="200" stroke="#333" stroke-width="2" stroke-linecap="round" class="bond-fe-cl"/>

                <!-- Atoms -->
                <circle cx="590" cy="200" r="12" fill="#44CC44"/>
                <text x="590" y="204" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Cl</text>

                <circle cx="530" cy="235" r="12" fill="#44CC44"/>
                <text x="530" y="239" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Cl</text>

                <circle cx="530" cy="165" r="12" fill="#44CC44"/>
                <text x="530" y="169" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Cl</text>

                <circle cx="550" cy="200" r="14" fill="#B7410E"/>
                <text x="550" y="204" font-family="Inter" font-size="12" text-anchor="middle" fill="#fff">Fe</text>

                <text x="550" y="170" fill="#4444FF" font-weight="bold" font-size="20" class="fecl4-charge">-</text>
                <text x="550" y="270" text-anchor="middle" font-family="Roboto Mono" font-size="14" fill="#666">FeCl₃</text>
            </g>

            <!-- Electron Flow Arrows (Orange) -->
            <path d="M 400 190 Q 450 150 490 190" fill="none" stroke="#F77F00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="120" marker-end="url(#arrowhead)" class="arrow1"/>
            <path d="M 200 240 Q 240 200 245 160" fill="none" stroke="#F77F00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100" marker-end="url(#arrowhead)" class="arrow2"/>
            <path d="M 250 150 Q 220 130 190 185" fill="none" stroke="#F77F00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="100" marker-end="url(#arrowhead)" class="arrow3"/>
            <path d="M 192 207 Q 210 220 200 240" fill="none" stroke="#F77F00" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="50" marker-end="url(#arrowhead)" class="arrow4"/>

            <!-- Energy Coordinate Graph -->
            <g id="energy-graph">
                <rect x="550" y="320" width="220" height="150" fill="#ffffff" stroke="#e0e0e0" rx="8" shadow="sm"/>
                <text x="660" y="340" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#333">Reaction Coordinate</text>
                
                <!-- Axes -->
                <polyline points="570,350 570,450 750,450" fill="none" stroke="#888" stroke-width="2"/>
                <text x="565" y="400" text-anchor="middle" font-family="Inter" font-size="10" fill="#666" transform="rotate(-90 565 400)">Energy</text>
                
                <!-- Curve Path -->
                <path d="M 580 430 C 600 430, 610 360, 625 360 C 635 360, 635 400, 645 400 C 655 400, 660 380, 670 380 C 685 380, 710 440, 740 440" fill="none" stroke="#7209B7" stroke-width="2" stroke-linecap="round"/>
                
                <!-- Labels -->
                <text x="580" y="445" font-family="Inter" font-size="9" fill="#666" text-anchor="middle">Reactants</text>
                <text x="625" y="352" font-family="Inter" font-size="9" fill="#666" text-anchor="middle">TS1</text>
                <text x="645" y="415" font-family="Inter" font-size="9" fill="#666" text-anchor="middle">Int.</text>
                <text x="670" y="372" font-family="Inter" font-size="9" fill="#666" text-anchor="middle">TS2</text>
                <text x="740" y="455" font-family="Inter" font-size="9" fill="#666" text-anchor="middle">Products</text>

                <!-- Moving Dot -->
                <circle r="5" fill="#FF4444" class="energy-dot"/>
            </g>

            <!-- Legend -->
            <g id="legend" transform="translate(30, 420)">
                <rect x="0" y="0" width="160" height="60" fill="#ffffff" stroke="#e0e0e0" rx="5"/>
                <circle cx="15" cy="15" r="5" fill="#404040"/>
                <text x="25" y="19" font-family="Inter" font-size="10" fill="#333">Carbon (C)</text>
                
                <circle cx="15" cy="30" r="5" fill="#44CC44"/>
                <text x="25" y="34" font-family="Inter" font-size="10" fill="#333">Chlorine (Cl)</text>
                
                <circle cx="15" cy="45" r="5" fill="#B7410E"/>
                <text x="25" y="49" font-family="Inter" font-size="10" fill="#333">Iron (Fe)</text>

                <line x1="85" y1="15" x2="105" y2="15" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
                <text x="110" y="19" font-family="Inter" font-size="10" fill="#333">e⁻ Flow</text>
                
                <line x1="85" y1="30" x2="105" y2="30" stroke="#7209B7" stroke-width="2" stroke-dasharray="2,2"/>
                <text x="110" y="34" font-family="Inter" font-size="10" fill="#333">Path</text>
            </g>

        </svg>
    </div>
</body>
</html>
