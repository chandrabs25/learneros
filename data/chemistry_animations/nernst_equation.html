<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nernst Equation: Effect of Concentration on Electrode Potential</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #f8f9fa;
            box-shadow: 0 12px 32px rgba(0,0,0,0.15);
            border-radius: 16px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Glow Filter for Ions and Electrons -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <!-- Subtle Drop Shadow for Panels -->
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>

                <!-- Arrowhead Marker -->
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#333" />
                </marker>
            </defs>

            <!-- Background -->
            <rect width="800" height="500" fill="#f8f9fa"/>

            <!-- Title -->
            <text x="400" y="35" font-size="20" font-weight="700" fill="#333" text-anchor="middle">Nernst Equation: Effect of Concentration on Electrode Potential</text>

            <!-- ========================================== -->
            <!-- LEFT PANEL: MOLECULAR INTERFACE            -->
            <!-- ========================================== -->
            
            <!-- Electrolyte Solution Background -->
            <rect x="20" y="60" width="360" height="380" fill="#E3F2FD" rx="12" filter="url(#shadow)"/>
            
            <!-- Zinc Electrode Base -->
            <rect x="20" y="60" width="80" height="380" fill="#A9A9A9" rx="12"/>
            
            <!-- Zinc Electrode Lattice (Right Edge) -->
            <g stroke="#808080" stroke-width="1">
                <!-- Static Atoms -->
                <circle cx="110" cy="80" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="105" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="130" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="155" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="180" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="205" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="230" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="280" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="305" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="330" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="355" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="380" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="405" r="11" fill="#A9A9A9"/>
                <circle cx="110" cy="430" r="11" fill="#A9A9A9"/>
                
                <!-- Animated Popping Atom (Phase 3: Low Conc) -->
                <circle cx="110" cy="255" r="11" fill="#A9A9A9">
                    <animate attributeName="opacity" values="1; 1; 0; 0; 1; 1" keyTimes="0; 0.53; 0.54; 0.86; 0.87; 1" dur="15s" repeatCount="indefinite"/>
                </circle>
            </g>

            <!-- Popping Ion & Electrons Animation -->
            <g opacity="0">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.53; 0.54; 0.86; 0.87; 1" dur="15s" repeatCount="indefinite"/>
                <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0; 0,0; 0,0" keyTimes="0; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                <circle cx="110" cy="255" r="12" fill="#4361EE" filter="url(#glow)"/>
                <text x="110" y="259" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
            </g>
            <!-- Electrons left behind -->
            <g opacity="0">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                <circle cx="105" cy="248" r="4" fill="#F9C74F" filter="url(#glow)"/>
                <text x="105" y="251" fill="#333" font-size="8" font-weight="700" text-anchor="middle">-</text>
                <circle cx="105" cy="262" r="4" fill="#F9C74F" filter="url(#glow)"/>
                <text x="105" y="265" fill="#333" font-size="8" font-weight="700" text-anchor="middle">-</text>
            </g>

            <!-- Solution Ions -->
            <!-- Group A: Always Visible (2 ions) -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,0; 10,-15; -5,5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite"/>
                <circle cx="200" cy="150" r="12" fill="#4361EE" filter="url(#glow)"/>
                <text x="200" y="154" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
            </g>
            <g>
                <animateTransform attributeName="transform" type="translate" values="0,0; -10,10; 15,-5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="7s" repeatCount="indefinite"/>
                <circle cx="300" cy="350" r="12" fill="#4361EE" filter="url(#glow)"/>
                <text x="300" y="354" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
            </g>

            <!-- Group B: Standard & High Conc (3 ions) -->
            <g>
                <animate attributeName="opacity" values="1; 1; 1; 1; 0; 0; 1; 1" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 15,15; -10,-10; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="5s" repeatCount="indefinite"/>
                    <circle cx="250" cy="250" r="12" fill="#4361EE" filter="url(#glow)"/>
                    <text x="250" y="254" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
                </g>
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0; -15,-5; 10,15; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="6.5s" repeatCount="indefinite"/>
                    <circle cx="180" cy="320" r="12" fill="#4361EE" filter="url(#glow)"/>
                    <text x="180" y="324" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
                </g>
                <g>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 5,-15; -15,5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="5.5s" repeatCount="indefinite"/>
                    <circle cx="320" cy="120" r="12" fill="#4361EE" filter="url(#glow)"/>
                    <text x="320" y="124" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text>
                </g>
            </g>

            <!-- Group C: High Conc Only (7 ions) -->
            <g>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                <!-- Push back effect -->
                <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; -20,0; -20,0; 0,0; 0,0; 0,0; 0,0" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                
                <g><animateTransform attributeName="transform" type="translate" values="0,0; 10,-10; -5,5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="4s" repeatCount="indefinite"/>
                    <circle cx="160" cy="100" r="12" fill="#4361EE" filter="url(#glow)"/><text x="160" y="104" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; -10,10; 10,-5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="5s" repeatCount="indefinite"/>
                    <circle cx="220" cy="80" r="12" fill="#4361EE" filter="url(#glow)"/><text x="220" y="84" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; 15,5; -10,-15; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="6s" repeatCount="indefinite"/>
                    <circle cx="280" cy="180" r="12" fill="#4361EE" filter="url(#glow)"/><text x="280" y="184" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; -5,-15; 15,10; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="4.5s" repeatCount="indefinite"/>
                    <circle cx="340" cy="220" r="12" fill="#4361EE" filter="url(#glow)"/><text x="340" y="224" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; 10,15; -15,-5; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="5.5s" repeatCount="indefinite"/>
                    <circle cx="170" cy="200" r="12" fill="#4361EE" filter="url(#glow)"/><text x="170" y="204" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; -15,5; 10,-10; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="6.5s" repeatCount="indefinite"/>
                    <circle cx="240" cy="380" r="12" fill="#4361EE" filter="url(#glow)"/><text x="240" y="384" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
                <g><animateTransform attributeName="transform" type="translate" values="0,0; 5,-10; -10,15; 0,0" keyTimes="0; 0.33; 0.66; 1" dur="4.8s" repeatCount="indefinite"/>
                    <circle cx="330" cy="290" r="12" fill="#4361EE" filter="url(#glow)"/><text x="330" y="294" fill="white" font-size="10" font-weight="700" text-anchor="middle">Zn²⁺</text></g>
            </g>

            <!-- Reaction Equation & Le Chatelier Arrows -->
            <rect x="120" y="405" width="240" height="30" fill="white" fill-opacity="0.8" rx="5"/>
            <text x="145" y="425" font-size="14" font-weight="600" fill="#333">Zn(s)</text>
            
            <!-- Forward Arrow (Favored in Low Conc) -->
            <path d="M 190 418 L 225 418 L 220 413" stroke="#7209B7" stroke-width="2" fill="none">
                <animate attributeName="stroke-width" values="2; 2; 1; 1; 4; 4; 2; 2" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
            </path>
            <!-- Reverse Arrow (Favored in High Conc) -->
            <path d="M 225 424 L 190 424 L 195 429" stroke="#7209B7" stroke-width="2" fill="none">
                <animate attributeName="stroke-width" values="2; 2; 4; 4; 1; 1; 2; 2" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
            </path>
            
            <text x="235" y="425" font-size="14" font-weight="600" fill="#333">Zn²⁺(aq) + 2e⁻</text>

            <!-- Legend -->
            <rect x="260" y="70" width="110" height="55" fill="white" fill-opacity="0.9" rx="6" stroke="#e0e0e0"/>
            <circle cx="275" cy="85" r="6" fill="#4361EE"/>
            <text x="290" y="89" font-size="11" fill="#333">Zn²⁺ Ion</text>
            <circle cx="275" cy="105" r="4" fill="#F9C74F"/>
            <text x="290" y="109" font-size="11" fill="#333">Electron (e⁻)</text>


            <!-- ========================================== -->
            <!-- RIGHT PANEL: NERNST EQUATION & GRAPH       -->
            <!-- ========================================== -->

            <!-- Equation Box -->
            <rect x="410" y="60" width="370" height="90" fill="#ffffff" rx="12" stroke="#e0e0e0" stroke-width="2" filter="url(#shadow)"/>
            
            <text x="425" y="112" font-family="'Roboto Mono', monospace" font-size="18" fill="#333">
                E<tspan baseline-shift="sub" font-size="12">cell</tspan> = E<tspan baseline-shift="super" font-size="12">°</tspan> -
            </text>
            
            <!-- Fraction 1 -->
            <text x="535" y="102" font-family="'Roboto Mono', monospace" font-size="15" fill="#333">0.0591</text>
            <line x1="530" y1="108" x2="595" y2="108" stroke="#333" stroke-width="2"/>
            <text x="558" y="125" font-family="'Roboto Mono', monospace" font-size="15" fill="#333">2</text>
            
            <text x="605" y="112" font-family="'Roboto Mono', monospace" font-size="18" fill="#333">log</text>
            
            <!-- Fraction 2 -->
            <text x="675" y="102" font-family="'Roboto Mono', monospace" font-size="15" fill="#333">1</text>
            <line x1="655" y1="108" x2="705" y2="108" stroke="#333" stroke-width="2"/>
            
            <!-- Animated Denominator -->
            <text x="655" y="125" font-family="'Roboto Mono', monospace" font-size="15" font-weight="700">
                <tspan fill="#333">[</tspan>
                <tspan fill="#4361EE">
                    Zn<tspan baseline-shift="super" font-size="11">2+</tspan>
                    <animate attributeName="fill" values="#4361EE; #4361EE; #F72585; #F72585; #4361EE; #4361EE; #4361EE; #4361EE" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                </tspan>
                <tspan fill="#333">]</tspan>
            </text>

            <!-- Graph Box -->
            <rect x="410" y="165" width="370" height="275" fill="#ffffff" rx="12" stroke="#e0e0e0" stroke-width="2" filter="url(#shadow)"/>
            
            <!-- State Indicator Text -->
            <text x="595" y="190" font-size="14" font-weight="700" fill="#F72585" text-anchor="middle">
                <tspan opacity="1">
                    <animate attributeName="opacity" values="1; 1; 0; 0; 0; 0; 1; 1" keyTimes="0; 0.2; 0.25; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                    Standard State (1.0 M)
                </tspan>
                <tspan x="595" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0" keyTimes="0; 0.28; 0.33; 0.53; 0.58; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                    High Concentration (&gt; 1.0 M)
                </tspan>
                <tspan x="595" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.33; 0.61; 0.66; 0.86; 0.91; 1" dur="15s" repeatCount="indefinite"/>
                    Low Concentration (&lt; 1.0 M)
                </tspan>
            </text>

            <!-- Graph Axes -->
            <line x1="470" y1="400" x2="470" y2="200" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            <line x1="470" y1="400" x2="750" y2="400" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            
            <!-- Axis Labels -->
            <text x="440" y="300" font-size="13" font-weight="600" fill="#333" transform="rotate(-90, 440, 300)" text-anchor="middle">Electrode Potential E (V)</text>
            <text x="610" y="435" font-size="13" font-weight="600" fill="#333" text-anchor="middle">log[Zn²⁺]</text>

            <!-- Grid Lines -->
            <line x1="470" y1="220" x2="710" y2="220" stroke="#e0e0e0" stroke-dasharray="4"/>
            <line x1="710" y1="400" x2="710" y2="220" stroke="#e0e0e0" stroke-dasharray="4"/>
            
            <line x1="470" y1="290" x2="610" y2="290" stroke="#e0e0e0" stroke-dasharray="4"/>
            <line x1="610" y1="400" x2="610" y2="290" stroke="#e0e0e0" stroke-dasharray="4"/>
            
            <line x1="470" y1="360" x2="510" y2="360" stroke="#e0e0e0" stroke-dasharray="4"/>
            <line x1="510" y1="400" x2="510" y2="360" stroke="#e0e0e0" stroke-dasharray="4"/>

            <!-- Tick Labels Y -->
            <text x="460" y="224" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="end">-0.70</text>
            <text x="460" y="294" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="end">-0.76</text>
            <text x="460" y="364" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="end">-0.82</text>

            <!-- Tick Labels X -->
            <text x="510" y="418" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="middle">-2</text>
            <text x="610" y="418" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="middle">0</text>
            <text x="710" y="418" font-family="'Roboto Mono', monospace" font-size="11" fill="#666" text-anchor="middle">+2</text>

            <!-- Graph Line -->
            <line x1="480" y1="381" x2="730" y2="206" stroke="#F72585" stroke-width="3"/>

            <!-- Animated Indicator Dot & Value -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="610,290; 610,290; 710,220; 710,220; 510,360; 510,360; 610,290; 610,290" keyTimes="0; 0.2; 0.33; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                
                <!-- Pulse Ring -->
                <circle r="6" fill="none" stroke="#F72585" stroke-width="2">
                    <animate attributeName="r" values="6; 16; 6" dur="1.5s" repeatCount="indefinite"/>
                    <animate attributeName="opacity" values="1; 0; 1" dur="1.5s" repeatCount="indefinite"/>
                </circle>
                
                <!-- Solid Dot -->
                <circle r="7" fill="#F72585" filter="url(#glow)"/>
                
                <!-- Dynamic Value Text -->
                <text x="-15" y="-15" font-family="'Roboto Mono', monospace" font-size="14" font-weight="700" fill="#F72585" text-anchor="end">
                    <tspan opacity="1">
                        <animate attributeName="opacity" values="1; 1; 0; 0; 0; 0; 1; 1" keyTimes="0; 0.2; 0.25; 0.53; 0.66; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                        -0.76 V
                    </tspan>
                    <tspan x="-15" opacity="0">
                        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0" keyTimes="0; 0.28; 0.33; 0.53; 0.58; 0.86; 0.93; 1" dur="15s" repeatCount="indefinite"/>
                        -0.70 V
                    </tspan>
                    <tspan x="-15" opacity="0">
                        <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.33; 0.61; 0.66; 0.86; 0.91; 1" dur="15s" repeatCount="indefinite"/>
                        -0.82 V
                    </tspan>
                </text>
            </g>

        </svg>
    </div>
</body>
</html>
