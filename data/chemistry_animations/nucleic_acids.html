<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formation of Phosphodiester Linkage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        
        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #333; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #666; }
        .atom-text { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #fff; dominant-baseline: central; text-anchor: middle; }
        .atom-text-dark { fill: #333; }
        .carbon-num { font-family: 'Roboto Mono', monospace; font-size: 11px; fill: #555; font-weight: 500; }
        .label-text { font-size: 13px; font-weight: 600; fill: #444; }
        .label-line { stroke: #aaa; stroke-width: 1.5; stroke-dasharray: 3,3; }
        
        /* Animations */
        .scene { animation: sceneFade 12s infinite ease-in-out; }
        
        .glow-pulse {
            transform-origin: center;
            animation: pulseSite 12s infinite ease-in-out;
        }
        
        .arrow-path {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: arrowDraw 12s infinite ease-in-out;
        }
        
        .arrow-head {
            opacity: 0;
            animation: arrowHeadFade 12s infinite ease-in-out;
        }
        
        .water-h1 { animation: moveH1 12s infinite ease-in-out; }
        .water-o2 { animation: moveO2 12s infinite ease-in-out; }
        .water-h2 { animation: moveH2 12s infinite ease-in-out; }
        
        .new-bond {
            stroke-dasharray: 80;
            stroke-dashoffset: 80;
            animation: bondDraw 12s infinite ease-in-out;
        }
        
        .highlight-group {
            opacity: 0;
            animation: highlightFade 12s infinite ease-in-out;
        }

        /* Keyframes */
        @keyframes sceneFade {
            0%, 5% { opacity: 0; }
            10%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes pulseSite {
            0%, 20%, 35%, 100% { opacity: 0; transform: scale(0.8); }
            25% { opacity: 0.6; transform: scale(1.3); }
            30% { opacity: 0; transform: scale(1); }
        }

        @keyframes arrowDraw {
            0%, 35% { stroke-dashoffset: 150; opacity: 0; }
            36% { opacity: 1; }
            45%, 55% { stroke-dashoffset: 0; opacity: 1; }
            56%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes arrowHeadFade {
            0%, 43% { opacity: 0; }
            44%, 55% { opacity: 1; }
            56%, 100% { opacity: 0; }
        }

        @keyframes moveH1 {
            0%, 45% { transform: translate(0,0); opacity: 1; }
            55% { transform: translate(60px, 15px); opacity: 1; }
            65%, 100% { transform: translate(110px, -25px); opacity: 0; }
        }

        @keyframes moveO2 {
            0%, 45% { transform: translate(0,0); opacity: 1; }
            55% { transform: translate(70px, -25px); opacity: 1; }
            65%, 100% { transform: translate(120px, -65px); opacity: 0; }
        }

        @keyframes moveH2 {
            0%, 45% { transform: translate(0,0); opacity: 1; }
            55% { transform: translate(80px, -15px); opacity: 1; }
            65%, 100% { transform: translate(130px, -55px); opacity: 0; }
        }

        @keyframes bondDraw {
            0%, 55% { stroke-dashoffset: 80; opacity: 0; }
            56% { opacity: 1; }
            65%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }

        @keyframes highlightFade {
            0%, 70% { opacity: 0; transform: translateY(10px); }
            75%, 100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Formation of Phosphodiester Linkage in DNA</title>
    <desc>Animated diagram showing the condensation reaction between the 3'-OH group of one nucleotide and the 5'-phosphate group of another, forming a phosphodiester bond and releasing water.</desc>

    <defs>
        <!-- Atom Gradients -->
        <radialGradient id="grad-C" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#777777"/>
            <stop offset="100%" stop-color="#404040"/>
        </radialGradient>
        <radialGradient id="grad-O" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FF8888"/>
            <stop offset="100%" stop-color="#FF4444"/>
        </radialGradient>
        <radialGradient id="grad-N" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#8888FF"/>
            <stop offset="100%" stop-color="#4444FF"/>
        </radialGradient>
        <radialGradient id="grad-P" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFCC66"/>
            <stop offset="100%" stop-color="#FF8800"/>
        </radialGradient>
        <radialGradient id="grad-H" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#CCCCCC"/>
        </radialGradient>
        
        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Static Background Elements -->
    <text x="400" y="40" text-anchor="middle" class="title">Formation of Phosphodiester Linkage in DNA</text>
    <text x="400" y="60" text-anchor="middle" class="subtitle">Condensation reaction between two deoxyribonucleotides</text>

    <!-- Legend -->
    <g transform="translate(30, 450)">
        <rect x="0" y="0" width="380" height="30" rx="15" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
        <circle cx="20" cy="15" r="6" fill="url(#grad-C)"/><text x="32" y="15" class="atom-text-dark" font-size="11" dominant-baseline="central">Carbon</text>
        <circle cx="85" cy="15" r="6" fill="url(#grad-O)"/><text x="97" y="15" class="atom-text-dark" font-size="11" dominant-baseline="central">Oxygen</text>
        <circle cx="155" cy="15" r="6" fill="url(#grad-N)"/><text x="167" y="15" class="atom-text-dark" font-size="11" dominant-baseline="central">Nitrogen</text>
        <circle cx="235" cy="15" r="6" fill="url(#grad-P)"/><text x="247" y="15" class="atom-text-dark" font-size="11" dominant-baseline="central">Phosphorus</text>
        <circle cx="325" cy="15" r="6" fill="url(#grad-H)"/><text x="337" y="15" class="atom-text-dark" font-size="11" dominant-baseline="central">Hydrogen</text>
    </g>

    <!-- Main Animated Scene -->
    <g class="scene">
        
        <!-- Reaction Site Glows -->
        <circle cx="380" cy="250" r="22" fill="#F77F00" class="glow-pulse" style="transform-origin: 380px 250px;" />
        <circle cx="380" cy="350" r="24" fill="#F77F00" class="glow-pulse" style="transform-origin: 380px 350px;" />

        <!-- Static Bonds Nucleotide 1 (Top) -->
        <g stroke="#333" stroke-width="3" stroke-linecap="round">
            <!-- Sugar 1 -->
            <line x1="400" y1="160" x2="430" y2="180" />
            <line x1="430" y1="180" x2="420" y2="210" />
            <line x1="420" y1="210" x2="380" y2="210" />
            <line x1="380" y1="210" x2="370" y2="180" />
            <line x1="370" y1="180" x2="400" y2="160" />
            <!-- C5' and Phosphate 1 -->
            <line x1="370" y1="180" x2="330" y2="160" />
            <line x1="330" y1="160" x2="300" y2="140" />
            <line x1="300" y1="140" x2="260" y2="140" />
            <line x1="256" y1="140" x2="256" y2="100" stroke="#555" /> <!-- Double bond P=O -->
            <line x1="264" y1="140" x2="264" y2="100" stroke="#555" />
            <line x1="260" y1="140" x2="220" y2="140" />
            <line x1="260" y1="140" x2="260" y2="180" />
            <!-- Base 1 (Adenine) -->
            <line x1="430" y1="180" x2="470" y2="180" />
            <line x1="470" y1="180" x2="490" y2="155" />
            <line x1="490" y1="155" x2="515" y2="165" />
            <line x1="515" y1="165" x2="510" y2="190" />
            <line x1="510" y1="190" x2="485" y2="200" />
            <line x1="485" y1="200" x2="470" y2="180" />
            <line x1="510" y1="190" x2="535" y2="210" />
            <line x1="535" y1="210" x2="525" y2="240" />
            <line x1="525" y1="240" x2="500" y2="245" />
            <line x1="500" y1="245" x2="475" y2="230" />
            <line x1="475" y1="230" x2="485" y2="200" />
            <line x1="535" y1="210" x2="565" y2="205" />
            <!-- 3' OH -->
            <line x1="380" y1="210" x2="380" y2="250" />
            <!-- C2' Hydrogens -->
            <line x1="420" y1="210" x2="410" y2="230" stroke-width="2" stroke="#666" />
            <line x1="420" y1="210" x2="435" y2="225" stroke-width="2" stroke="#666" />
        </g>

        <!-- Static Bonds Nucleotide 2 (Bottom) -->
        <g stroke="#333" stroke-width="3" stroke-linecap="round">
            <!-- Phosphate 2 -->
            <line x1="380" y1="350" x2="340" y2="350" stroke="#555" /> <!-- Double bond P=O -->
            <line x1="380" y1="346" x2="340" y2="346" stroke="#555" />
            <line x1="380" y1="350" x2="380" y2="390" />
            <line x1="380" y1="350" x2="420" y2="350" />
            <!-- C5' and Sugar 2 -->
            <line x1="420" y1="350" x2="460" y2="350" />
            <line x1="460" y1="350" x2="490" y2="370" />
            <line x1="490" y1="370" x2="520" y2="350" />
            <line x1="520" y1="350" x2="550" y2="370" />
            <line x1="550" y1="370" x2="540" y2="400" />
            <line x1="540" y1="400" x2="500" y2="400" />
            <line x1="500" y1="400" x2="490" y2="370" />
            <!-- Base 2 (Pyrimidine) -->
            <line x1="550" y1="370" x2="590" y2="370" />
            <line x1="590" y1="370" x2="615" y2="350" />
            <line x1="615" y1="350" x2="645" y2="360" />
            <line x1="645" y1="360" x2="650" y2="390" />
            <line x1="650" y1="390" x2="625" y2="410" />
            <line x1="625" y1="410" x2="595" y2="400" />
            <line x1="595" y1="400" x2="590" y2="370" />
            <line x1="611" y1="350" x2="606" y2="320" stroke="#555" /> <!-- C=O -->
            <line x1="619" y1="350" x2="614" y2="320" stroke="#555" />
            <line x1="650" y1="390" x2="680" y2="400" stroke="#555" /> <!-- C=O -->
            <line x1="648" y1="383" x2="678" y2="393" stroke="#555" />
            <line x1="625" y1="410" x2="635" y2="445" /> <!-- CH3 -->
            <!-- 3' OH -->
            <line x1="500" y1="400" x2="500" y2="440" />
            <line x1="500" y1="440" x2="500" y2="460" />
            <!-- C2' Hydrogens -->
            <line x1="540" y1="400" x2="530" y2="420" stroke-width="2" stroke="#666" />
            <line x1="540" y1="400" x2="555" y2="415" stroke-width="2" stroke="#666" />
        </g>

        <!-- New Phosphodiester Bond (Animated) -->
        <line x1="380" y1="250" x2="380" y2="350" stroke="#333" stroke-width="4" stroke-linecap="round" class="new-bond" />

        <!-- Dynamic Water Bonds -->
        <line x1="380" y1="250" x2="380" y2="270" stroke="#333" stroke-width="3" class="water-h1" />
        <line x1="380" y1="350" x2="380" y2="320" stroke="#333" stroke-width="3" class="water-o2" />
        <line x1="380" y1="320" x2="380" y2="300" stroke="#333" stroke-width="3" class="water-h2" />

        <!-- Atoms Nucleotide 1 -->
        <g filter="url(#shadow)">
            <!-- Sugar 1 -->
            <circle cx="400" cy="160" r="12" fill="url(#grad-O)"/><text x="400" y="160" class="atom-text">O</text>
            <circle cx="430" cy="180" r="12" fill="url(#grad-C)"/><text x="430" y="180" class="atom-text">C</text>
            <circle cx="420" cy="210" r="12" fill="url(#grad-C)"/><text x="420" y="210" class="atom-text">C</text>
            <circle cx="380" cy="210" r="12" fill="url(#grad-C)"/><text x="380" y="210" class="atom-text">C</text>
            <circle cx="370" cy="180" r="12" fill="url(#grad-C)"/><text x="370" y="180" class="atom-text">C</text>
            <!-- C2' Hydrogens -->
            <circle cx="410" cy="230" r="8" fill="url(#grad-H)"/><text x="410" y="230" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            <circle cx="435" cy="225" r="8" fill="url(#grad-H)"/><text x="435" y="225" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            <!-- C5' & Phosphate 1 -->
            <circle cx="330" cy="160" r="12" fill="url(#grad-C)"/><text x="330" y="160" class="atom-text">C</text>
            <circle cx="300" cy="140" r="12" fill="url(#grad-O)"/><text x="300" y="140" class="atom-text">O</text>
            <circle cx="260" cy="140" r="14" fill="url(#grad-P)"/><text x="260" y="140" class="atom-text">P</text>
            <circle cx="260" cy="100" r="12" fill="url(#grad-O)"/><text x="260" y="100" class="atom-text">O</text>
            <circle cx="220" cy="140" r="12" fill="url(#grad-O)"/><text x="220" y="140" class="atom-text">O</text>
            <circle cx="260" cy="180" r="12" fill="url(#grad-O)"/><text x="260" y="180" class="atom-text">O</text>
            <!-- Base 1 -->
            <circle cx="470" cy="180" r="12" fill="url(#grad-N)"/><text x="470" y="180" class="atom-text">N</text>
            <circle cx="490" cy="155" r="12" fill="url(#grad-C)"/><text x="490" y="155" class="atom-text">C</text>
            <circle cx="515" cy="165" r="12" fill="url(#grad-N)"/><text x="515" y="165" class="atom-text">N</text>
            <circle cx="510" cy="190" r="12" fill="url(#grad-C)"/><text x="510" y="190" class="atom-text">C</text>
            <circle cx="485" cy="200" r="12" fill="url(#grad-C)"/><text x="485" y="200" class="atom-text">C</text>
            <circle cx="535" cy="210" r="12" fill="url(#grad-C)"/><text x="535" y="210" class="atom-text">C</text>
            <circle cx="525" cy="240" r="12" fill="url(#grad-N)"/><text x="525" y="240" class="atom-text">N</text>
            <circle cx="500" cy="245" r="12" fill="url(#grad-C)"/><text x="500" y="245" class="atom-text">C</text>
            <circle cx="475" cy="230" r="12" fill="url(#grad-N)"/><text x="475" y="230" class="atom-text">N</text>
            <circle cx="565" cy="205" r="12" fill="url(#grad-N)"/><text x="565" y="205" class="atom-text">N</text>
            <!-- 3' OH (O stays, H leaves) -->
            <circle cx="380" cy="250" r="12" fill="url(#grad-O)"/><text x="380" y="250" class="atom-text">O</text>
        </g>

        <!-- Atoms Nucleotide 2 -->
        <g filter="url(#shadow)">
            <!-- Phosphate 2 -->
            <circle cx="380" cy="350" r="14" fill="url(#grad-P)"/><text x="380" y="350" class="atom-text">P</text>
            <circle cx="340" cy="350" r="12" fill="url(#grad-O)"/><text x="340" y="350" class="atom-text">O</text>
            <circle cx="380" cy="390" r="12" fill="url(#grad-O)"/><text x="380" y="390" class="atom-text">O</text>
            <circle cx="420" cy="350" r="12" fill="url(#grad-O)"/><text x="420" y="350" class="atom-text">O</text>
            <!-- C5' & Sugar 2 -->
            <circle cx="460" cy="350" r="12" fill="url(#grad-C)"/><text x="460" y="350" class="atom-text">C</text>
            <circle cx="490" cy="370" r="12" fill="url(#grad-C)"/><text x="490" y="370" class="atom-text">C</text>
            <circle cx="520" cy="350" r="12" fill="url(#grad-O)"/><text x="520" y="350" class="atom-text">O</text>
            <circle cx="550" cy="370" r="12" fill="url(#grad-C)"/><text x="550" y="370" class="atom-text">C</text>
            <circle cx="540" cy="400" r="12" fill="url(#grad-C)"/><text x="540" y="400" class="atom-text">C</text>
            <circle cx="500" cy="400" r="12" fill="url(#grad-C)"/><text x="500" y="400" class="atom-text">C</text>
            <!-- C2' Hydrogens -->
            <circle cx="530" cy="420" r="8" fill="url(#grad-H)"/><text x="530" y="420" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            <circle cx="555" cy="415" r="8" fill="url(#grad-H)"/><text x="555" y="415" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            <!-- Base 2 -->
            <circle cx="590" cy="370" r="12" fill="url(#grad-N)"/><text x="590" y="370" class="atom-text">N</text>
            <circle cx="615" cy="350" r="12" fill="url(#grad-C)"/><text x="615" y="350" class="atom-text">C</text>
            <circle cx="645" cy="360" r="12" fill="url(#grad-N)"/><text x="645" y="360" class="atom-text">N</text>
            <circle cx="650" cy="390" r="12" fill="url(#grad-C)"/><text x="650" y="390" class="atom-text">C</text>
            <circle cx="625" cy="410" r="12" fill="url(#grad-C)"/><text x="625" y="410" class="atom-text">C</text>
            <circle cx="595" cy="400" r="12" fill="url(#grad-C)"/><text x="595" y="400" class="atom-text">C</text>
            <circle cx="610" cy="320" r="12" fill="url(#grad-O)"/><text x="610" y="320" class="atom-text">O</text>
            <circle cx="680" cy="400" r="12" fill="url(#grad-O)"/><text x="680" y="400" class="atom-text">O</text>
            <circle cx="635" cy="445" r="12" fill="url(#grad-C)"/><text x="635" y="445" class="atom-text">C</text>
            <!-- 3' OH -->
            <circle cx="500" cy="440" r="12" fill="url(#grad-O)"/><text x="500" y="440" class="atom-text">O</text>
            <circle cx="500" cy="460" r="8" fill="url(#grad-H)"/><text x="500" y="460" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
        </g>

        <!-- Dynamic Water Atoms -->
        <g filter="url(#shadow)">
            <g class="water-h1">
                <circle cx="380" cy="270" r="8" fill="url(#grad-H)"/><text x="380" y="270" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            </g>
            <g class="water-o2">
                <circle cx="380" cy="320" r="12" fill="url(#grad-O)"/><text x="380" y="320" class="atom-text">O</text>
            </g>
            <g class="water-h2">
                <circle cx="380" cy="300" r="8" fill="url(#grad-H)"/><text x="380" y="300" class="atom-text-dark" font-size="9" dominant-baseline="central" text-anchor="middle">H</text>
            </g>
        </g>

        <!-- Nucleophilic Attack Arrow -->
        <path d="M 395 250 C 450 260, 450 340, 400 345" fill="none" stroke="#F77F00" stroke-width="3" class="arrow-path" />
        <polygon points="400,345 410,338 405,352" fill="#F77F00" class="arrow-head" />

        <!-- Carbon Numbering -->
        <text x="445" y="175" class="carbon-num">1'</text>
        <text x="435" y="225" class="carbon-num">2'</text>
        <text x="365" y="225" class="carbon-num">3'</text>
        <text x="355" y="175" class="carbon-num">4'</text>
        <text x="330" y="145" class="carbon-num">5'</text>

        <text x="565" y="365" class="carbon-num">1'</text>
        <text x="555" y="415" class="carbon-num">2'</text>
        <text x="485" y="415" class="carbon-num">3'</text>
        <text x="475" y="365" class="carbon-num">4'</text>
        <text x="460" y="335" class="carbon-num">5'</text>

        <!-- Directionality Labels -->
        <text x="220" y="90" class="label-text" fill="#7209B7">5' End</text>
        <text x="520" y="465" class="label-text" fill="#7209B7">3' End</text>

        <!-- Component Annotations -->
        <line x1="510" y1="190" x2="620" y2="150" class="label-line" />
        <text x="625" y="145" class="label-text">Nitrogenous Base</text>
        <text x="625" y="160" class="carbon-num">(Purine)</text>

        <line x1="370" y1="180" x2="220" y2="220" class="label-line" />
        <text x="215" y="225" class="label-text" text-anchor="end">β-D-2-deoxyribose</text>

        <line x1="260" y1="140" x2="160" y2="140" class="label-line" />
        <text x="155" y="145" class="label-text" text-anchor="end">Phosphate Group</text>

        <!-- Final Structure Highlight -->
        <g class="highlight-group">
            <rect x="350" y="235" width="60" height="130" rx="15" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="6,4" />
            <rect x="420" y="280" width="220" height="30" rx="6" fill="#7209B7" />
            <text x="530" y="295" fill="#ffffff" font-family="Inter" font-size="13" font-weight="600" dominant-baseline="central" text-anchor="middle">3'-5' Phosphodiester Linkage</text>
            <polygon points="420,295 430,290 430,300" fill="#7209B7" />
        </g>

    </g>
</svg>

</body>
</html>
