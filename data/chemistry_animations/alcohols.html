<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oxidation of Primary Alcohols</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        .title { font-size: 24px; font-weight: 700; fill: #333; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #666; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; fill: #404040; }
        .name { font-size: 14px; font-weight: 600; fill: #666; }
        .reagent { font-size: 14px; font-weight: 700; fill: #7209B7; }
        .reagent-sub { font-size: 12px; font-weight: 600; fill: #FF4444; }
        .legend-text { font-size: 12px; fill: #555; }
        
        .bond { stroke: #666666; stroke-width: 3; stroke-linecap: round; }
        .atom-text { font-size: 14px; font-weight: 600; fill: #ffffff; pointer-events: none; }
        .atom-text-dark { font-size: 11px; font-weight: 700; fill: #333333; pointer-events: none; }
        .hybrid-label { font-size: 12px; font-weight: 700; fill: #7209B7; }

        /* Animations */
        #active-molecule {
            animation: translate-mol 12s infinite ease-in-out;
        }

        #group-o1 { animation: move-o1 12s infinite ease-in-out; }
        #group-h1 { animation: move-h1 12s infinite ease-in-out; }
        #group-h2 { animation: move-h2 12s infinite ease-in-out; }
        #group-h3 { animation: move-h3 12s infinite ease-in-out; }
        #group-o2 { animation: move-o2 12s infinite ease-in-out; }

        #bond-c1-o1 { animation: bond-c1-o1 12s infinite ease-in-out; }
        #bond-pi { animation: bond-pi 12s infinite ease-in-out; }
        #bond-o1-h1 { animation: bond-o1-h1 12s infinite ease-in-out; }
        #bond-c1-h2 { animation: bond-c1-h2 12s infinite ease-in-out; }
        #bond-c1-h3 { animation: bond-c1-h3 12s infinite ease-in-out; }
        #bond-c1-o2 { animation: bond-c1-o2 12s infinite ease-in-out; }
        #bond-o2-h3 { animation: bond-o2-h3 12s infinite ease-in-out; }

        #label-sp3 { animation: fade-out-sp3 12s infinite ease-in-out; }
        #label-sp2 { animation: fade-in-sp2 12s infinite ease-in-out; }
        
        #curly1 { animation: show-curly-1 12s infinite ease-in-out; }
        #curly2 { animation: show-curly-2 12s infinite ease-in-out; }

        /* Keyframes */
        @keyframes translate-mol {
            0%, 33.3% { transform: translate(150px, 250px); opacity: 1; }
            41.6%, 66.6% { transform: translate(400px, 250px); opacity: 1; }
            75%, 95% { transform: translate(650px, 250px); opacity: 1; }
            98% { transform: translate(650px, 250px); opacity: 0; }
            99% { transform: translate(150px, 250px); opacity: 0; }
            100% { transform: translate(150px, 250px); opacity: 1; }
        }

        @keyframes move-o1 {
            0%, 33.3% { transform: translate(50px, 0px); }
            41.6%, 100% { transform: translate(35px, -45px); }
        }

        @keyframes move-h1 {
            0%, 25% { transform: translate(85px, 0px); opacity: 1; }
            33.3%, 100% { transform: translate(25px, -60px); opacity: 0; }
        }

        @keyframes move-h2 {
            0%, 25% { transform: translate(0px, -50px); opacity: 1; }
            33.3%, 100% { transform: translate(15px, -60px); opacity: 0; }
        }

        @keyframes move-h3 {
            0%, 33.3% { transform: translate(0px, 50px); }
            41.6%, 58.3% { transform: translate(35px, 45px); }
            66.6%, 100% { transform: translate(65px, 45px); }
        }

        @keyframes move-o2 {
            0%, 58.3% { transform: translate(35px, 80px); opacity: 0; }
            60% { opacity: 1; }
            66.6%, 100% { transform: translate(35px, 45px); opacity: 1; }
        }

        @keyframes bond-c1-o1 {
            0%, 33.3% { x2: 50px; y2: 0px; }
            41.6%, 100% { x2: 35px; y2: -45px; }
        }

        @keyframes bond-pi {
            0%, 33.3% { x1: 0px; y1: 0px; x2: 50px; y2: 0px; opacity: 0; }
            33.4% { opacity: 1; }
            41.6%, 100% { x1: -4px; y1: 3px; x2: 31px; y2: -42px; opacity: 1; }
        }

        @keyframes bond-o1-h1 {
            0%, 25% { x1: 50px; y1: 0px; x2: 85px; y2: 0px; opacity: 1; }
            33.3%, 100% { x1: 50px; y1: 0px; x2: 25px; y2: -60px; opacity: 0; }
        }

        @keyframes bond-c1-h2 {
            0%, 25% { x2: 0px; y2: -50px; opacity: 1; }
            33.3%, 100% { x2: 15px; y2: -60px; opacity: 0; }
        }

        @keyframes bond-c1-h3 {
            0%, 33.3% { x2: 0px; y2: 50px; opacity: 1; }
            41.6%, 58.3% { x2: 35px; y2: 45px; opacity: 1; }
            66.6%, 100% { x2: 65px; y2: 45px; opacity: 0; }
        }

        @keyframes bond-c1-o2 {
            0%, 58.3% { opacity: 0; }
            66.6%, 100% { opacity: 1; }
        }

        @keyframes bond-o2-h3 {
            0%, 58.3% { x2: 35px; y2: 45px; opacity: 0; }
            66.6%, 100% { x2: 65px; y2: 45px; opacity: 1; }
        }

        @keyframes fade-out-sp3 {
            0%, 25% { opacity: 1; }
            33.3%, 100% { opacity: 0; }
        }

        @keyframes fade-in-sp2 {
            0%, 25% { opacity: 0; }
            33.3%, 100% { opacity: 1; }
        }

        @keyframes show-curly-1 {
            0%, 20% { opacity: 0; }
            24%, 28% { opacity: 1; }
            32%, 100% { opacity: 0; }
        }

        @keyframes show-curly-2 {
            0%, 56% { opacity: 0; }
            59%, 63% { opacity: 1; }
            66%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" aria-label="Oxidation of Ethanol to Ethanoic Acid Animation">
        <title>Oxidation of Primary Alcohols</title>
        <desc>An animated diagram showing the chemical transformation of a primary alcohol (Ethanol) into an aldehyde (Ethanal) and then a carboxylic acid (Ethanoic Acid) through the loss of hydrogen and gain of oxygen.</desc>

        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#7209B7" />
            </marker>
            <marker id="curly-arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Header -->
        <text x="400" y="40" text-anchor="middle" class="title">Oxidation of Primary Alcohols</text>
        <text x="400" y="65" text-anchor="middle" class="subtitle">Step-by-step transformation: Ethanol → Ethanal → Ethanoic Acid</text>

        <!-- Reaction Pathway Arrows & Labels -->
        <g id="reaction-pathway">
            <!-- Arrow 1 -->
            <line x1="230" y1="250" x2="310" y2="250" stroke="#7209B7" stroke-width="4" marker-end="url(#arrowhead)" />
            <text x="270" y="235" text-anchor="middle" class="reagent">K₂Cr₂O₇ / H⁺</text>
            <text x="270" y="275" text-anchor="middle" class="reagent-sub">- 2[H]</text>

            <!-- Arrow 2 -->
            <line x1="480" y1="250" x2="560" y2="250" stroke="#7209B7" stroke-width="4" marker-end="url(#arrowhead)" />
            <text x="520" y="235" text-anchor="middle" class="reagent">[O]</text>

            <!-- Molecule Labels -->
            <text x="150" y="380" text-anchor="middle" class="formula">CH₃CH₂OH</text>
            <text x="150" y="400" text-anchor="middle" class="name">Ethanol (1° Alcohol)</text>

            <text x="400" y="380" text-anchor="middle" class="formula">CH₃CHO</text>
            <text x="400" y="400" text-anchor="middle" class="name">Ethanal (Aldehyde)</text>

            <text x="650" y="380" text-anchor="middle" class="formula">CH₃COOH</text>
            <text x="650" y="400" text-anchor="middle" class="name">Ethanoic Acid (Carboxylic Acid)</text>
        </g>

        <!-- Ghost Molecules (Static Background Trace) -->
        <g opacity="0.12">
            <!-- Ghost 1: Ethanol -->
            <g transform="translate(150, 250)">
                <line x1="0" y1="0" x2="-60" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-95" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="-35" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="35" class="bond"/>
                <line x1="0" y1="0" x2="50" y2="0" class="bond"/>
                <line x1="50" y1="0" x2="85" y2="0" class="bond"/>
                <line x1="0" y1="0" x2="0" y2="-50" class="bond"/>
                <line x1="0" y1="0" x2="0" y2="50" class="bond"/>
                <circle cx="0" cy="0" r="14" fill="#404040"/>
                <circle cx="-60" cy="0" r="14" fill="#404040"/>
                <circle cx="50" cy="0" r="14" fill="#FF4444"/>
                <circle cx="-95" cy="0" r="10" fill="#CCC"/>
                <circle cx="-60" cy="-35" r="10" fill="#CCC"/>
                <circle cx="-60" cy="35" r="10" fill="#CCC"/>
                <circle cx="85" cy="0" r="10" fill="#CCC"/>
                <circle cx="0" cy="-50" r="10" fill="#CCC"/>
                <circle cx="0" cy="50" r="10" fill="#CCC"/>
            </g>

            <!-- Ghost 2: Ethanal -->
            <g transform="translate(400, 250)">
                <line x1="0" y1="0" x2="-60" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-95" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="-35" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="35" class="bond"/>
                <line x1="0" y1="0" x2="35" y2="-45" class="bond"/>
                <line x1="-4" y1="3" x2="31" y2="-42" class="bond"/>
                <line x1="0" y1="0" x2="35" y2="45" class="bond"/>
                <circle cx="0" cy="0" r="14" fill="#404040"/>
                <circle cx="-60" cy="0" r="14" fill="#404040"/>
                <circle cx="35" cy="-45" r="14" fill="#FF4444"/>
                <circle cx="-95" cy="0" r="10" fill="#CCC"/>
                <circle cx="-60" cy="-35" r="10" fill="#CCC"/>
                <circle cx="-60" cy="35" r="10" fill="#CCC"/>
                <circle cx="35" cy="45" r="10" fill="#CCC"/>
            </g>

            <!-- Ghost 3: Ethanoic Acid -->
            <g transform="translate(650, 250)">
                <line x1="0" y1="0" x2="-60" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-95" y2="0" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="-35" class="bond"/>
                <line x1="-60" y1="0" x2="-60" y2="35" class="bond"/>
                <line x1="0" y1="0" x2="35" y2="-45" class="bond"/>
                <line x1="-4" y1="3" x2="31" y2="-42" class="bond"/>
                <line x1="0" y1="0" x2="35" y2="45" class="bond"/>
                <line x1="35" y1="45" x2="65" y2="45" class="bond"/>
                <circle cx="0" cy="0" r="14" fill="#404040"/>
                <circle cx="-60" cy="0" r="14" fill="#404040"/>
                <circle cx="35" cy="-45" r="14" fill="#FF4444"/>
                <circle cx="35" cy="45" r="14" fill="#FF4444"/>
                <circle cx="-95" cy="0" r="10" fill="#CCC"/>
                <circle cx="-60" cy="-35" r="10" fill="#CCC"/>
                <circle cx="-60" cy="35" r="10" fill="#CCC"/>
                <circle cx="65" cy="45" r="10" fill="#CCC"/>
            </g>
        </g>

        <!-- Active Animated Molecule -->
        <g id="active-molecule">
            
            <!-- Electron Flow Arrows (Curly) -->
            <path id="curly1" d="M 67 -5 Q 60 -25 25 -5" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#curly-arrowhead)"/>
            <path id="curly2" d="M 45 70 Q 60 60 20 30" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#curly-arrowhead)"/>

            <!-- Static Methyl Group -->
            <g id="methyl-group">
                <line x1="0" y1="0" x2="-60" y2="0" class="bond" />
                <line x1="-60" y1="0" x2="-95" y2="0" class="bond" />
                <line x1="-60" y1="0" x2="-60" y2="-35" class="bond" />
                <line x1="-60" y1="0" x2="-60" y2="35" class="bond" />
                
                <circle cx="-60" cy="0" r="14" fill="#404040" />
                <text x="-60" y="5" class="atom-text" text-anchor="middle">C</text>
                
                <circle cx="-95" cy="0" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="-95" y="4" class="atom-text-dark" text-anchor="middle">H</text>
                
                <circle cx="-60" cy="-35" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="-60" y="-31" class="atom-text-dark" text-anchor="middle">H</text>
                
                <circle cx="-60" cy="35" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="-60" y="39" class="atom-text-dark" text-anchor="middle">H</text>
            </g>

            <!-- Dynamic Bonds -->
            <line id="bond-c1-o1" x1="0" y1="0" x2="50" y2="0" class="bond" />
            <line id="bond-pi" x1="0" y1="0" x2="50" y2="0" class="bond" />
            <line id="bond-o1-h1" x1="50" y1="0" x2="85" y2="0" class="bond" />
            <line id="bond-c1-h2" x1="0" y1="0" x2="0" y2="-50" class="bond" />
            <line id="bond-c1-h3" x1="0" y1="0" x2="0" y2="50" class="bond" />
            <line id="bond-c1-o2" x1="0" y1="0" x2="35" y2="45" class="bond" />
            <line id="bond-o2-h3" x1="35" y1="45" x2="35" y2="45" class="bond" />

            <!-- Dynamic Atoms -->
            <g id="group-c1">
                <circle cx="0" cy="0" r="14" fill="#404040" />
                <text x="0" y="5" class="atom-text" text-anchor="middle">C</text>
                <text id="label-sp3" x="18" y="-15" class="hybrid-label">sp³</text>
                <text id="label-sp2" x="18" y="-15" class="hybrid-label">sp²</text>
            </g>

            <g id="group-o1">
                <circle cx="0" cy="0" r="14" fill="#FF4444" />
                <text x="0" y="5" class="atom-text" text-anchor="middle">O</text>
            </g>

            <g id="group-h1">
                <circle cx="0" cy="0" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="0" y="4" class="atom-text-dark" text-anchor="middle">H</text>
            </g>

            <g id="group-h2">
                <circle cx="0" cy="0" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="0" y="4" class="atom-text-dark" text-anchor="middle">H</text>
            </g>

            <g id="group-h3">
                <circle cx="0" cy="0" r="10" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
                <text x="0" y="4" class="atom-text-dark" text-anchor="middle">H</text>
            </g>

            <g id="group-o2">
                <circle cx="0" cy="0" r="14" fill="#FF4444" />
                <text x="0" y="5" class="atom-text" text-anchor="middle">O</text>
            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(130, 440)">
            <rect x="0" y="0" width="540" height="40" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
            
            <circle cx="25" cy="20" r="8" fill="#404040" />
            <text x="40" y="24" class="legend-text">Carbon</text>
            
            <circle cx="105" cy="20" r="8" fill="#FF4444" />
            <text x="120" y="24" class="legend-text">Oxygen</text>
            
            <circle cx="185" cy="20" r="8" fill="#CCCCCC" stroke="#999999" stroke-width="1" />
            <text x="200" y="24" class="legend-text">Hydrogen</text>
            
            <line x1="280" y1="20" x2="310" y2="20" stroke="#7209B7" stroke-width="3" marker-end="url(#arrowhead)" />
            <text x="325" y="24" class="legend-text">Reaction Direction</text>
            
            <path d="M 445 25 Q 455 10 465 25" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#curly-arrowhead)" />
            <text x="480" y="24" class="legend-text">Electron Flow</text>
        </g>

    </svg>

</body>
</html>
