<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nucleophilic Addition Mechanism</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

    body {
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
    }

    .svg-container {
        width: 100%;
        max-width: 1000px;
        height: auto;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        background-color: #ffffff;
        border-radius: 12px;
        overflow: hidden;
    }

    svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* CSS Animations */
    .master-group {
        animation: globalFade 10s infinite;
    }

    .nu-group {
        animation: nuMove 10s infinite ease-in-out;
    }

    .arrow-1 {
        stroke-dasharray: 300;
        animation: arrow1Draw 10s infinite ease-in-out;
    }

    .arrow-2 {
        stroke-dasharray: 100;
        animation: arrow2Draw 10s infinite ease-in-out;
    }

    .group-o {
        transform-origin: 400px 250px;
        animation: rotateO 10s infinite ease-in-out;
    }

    .group-ch3 {
        transform-origin: 400px 250px;
        animation: rotateCH3 10s infinite ease-in-out;
    }

    .group-h {
        transform-origin: 400px 250px;
        animation: rotateH 10s infinite ease-in-out;
    }

    .pi-bond {
        animation: piBond 10s infinite ease-in-out;
    }

    .forming-bond {
        animation: formingBond 10s infinite ease-in-out;
    }

    .o-charge {
        animation: oCharge 10s infinite ease-in-out;
    }

    .nu-charge {
        animation: nuCharge 10s infinite ease-in-out;
    }

    .ts-bracket {
        animation: tsBracket 10s infinite ease-in-out;
    }

    .energy-dot {
        offset-path: path('M 560 420 C 600 420, 620 350, 650 350 C 680 350, 700 450, 740 450');
        animation: energyDot 10s infinite ease-in-out;
    }

    .text-sp2 {
        animation: textSp2 10s infinite ease-in-out;
    }

    .text-sp3 {
        animation: textSp3 10s infinite ease-in-out;
    }

    .partial-charge {
        animation: partialCharge 10s infinite ease-in-out;
    }

    /* Keyframes */
    @keyframes globalFade {
        0%, 85% { opacity: 1; }
        88%, 92% { opacity: 0; }
        95%, 100% { opacity: 1; }
    }

    @keyframes nuMove {
        0%, 20% { transform: translate(200px, 480px); }
        45%, 85% { transform: translate(365px, 364px); }
        100% { transform: translate(200px, 480px); }
    }

    @keyframes arrow1Draw {
        0%, 20% { stroke-dashoffset: 300; opacity: 0; }
        22% { opacity: 1; stroke-dashoffset: 300; }
        35% { stroke-dashoffset: 0; opacity: 1; }
        40%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }

    @keyframes arrow2Draw {
        0%, 25% { stroke-dashoffset: 100; opacity: 0; }
        27% { opacity: 1; stroke-dashoffset: 100; }
        38% { stroke-dashoffset: 0; opacity: 1; }
        45%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }

    @keyframes rotateO {
        0%, 30% { transform: rotate(0deg); }
        50%, 85% { transform: rotate(-30deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes rotateCH3 {
        0%, 30% { transform: rotate(0deg); }
        50%, 85% { transform: rotate(40deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes rotateH {
        0%, 30% { transform: rotate(0deg); }
        50%, 85% { transform: rotate(30deg); }
        100% { transform: rotate(0deg); }
    }

    @keyframes piBond {
        0%, 35% { opacity: 1; stroke-dasharray: none; }
        40%, 48% { opacity: 0.5; stroke-dasharray: 5, 5; }
        52%, 85% { opacity: 0; }
        100% { opacity: 1; stroke-dasharray: none; }
    }

    @keyframes formingBond {
        0%, 35% { opacity: 0; stroke-dasharray: 5, 5; }
        40%, 48% { opacity: 1; stroke-dasharray: 5, 5; }
        52%, 85% { opacity: 1; stroke-dasharray: none; }
        100% { opacity: 0; stroke-dasharray: 5, 5; }
    }

    @keyframes oCharge {
        0%, 45% { opacity: 0; }
        52%, 85% { opacity: 1; }
        100% { opacity: 0; }
    }

    @keyframes nuCharge {
        0%, 40% { opacity: 1; }
        52%, 85% { opacity: 0; }
        100% { opacity: 1; }
    }

    @keyframes tsBracket {
        0%, 38% { opacity: 0; }
        42%, 48% { opacity: 1; }
        52%, 100% { opacity: 0; }
    }

    @keyframes energyDot {
        0%, 20% { offset-distance: 0%; }
        45% { offset-distance: 50%; }
        60%, 85% { offset-distance: 100%; }
        100% { offset-distance: 0%; }
    }

    @keyframes textSp2 {
        0%, 35% { opacity: 1; }
        45%, 100% { opacity: 0; }
    }

    @keyframes textSp3 {
        0%, 40% { opacity: 0; }
        50%, 85% { opacity: 1; }
        100% { opacity: 0; }
    }

    @keyframes partialCharge {
        0%, 35% { opacity: 1; }
        45%, 100% { opacity: 0; }
    }
</style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Nucleophilic Addition Mechanism</title>
        <desc id="svgDesc">Animation showing the nucleophilic attack of a cyanide ion on acetaldehyde, demonstrating the Bürgi-Dunitz trajectory, hybridization change from sp2 to sp3, and the corresponding energy profile.</desc>

        <defs>
            <!-- Arrowhead for electron flow -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00"/>
            </marker>
        </defs>

        <!-- Static Background Elements -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#222">Nucleophilic Addition: CN⁻ attack on Acetaldehyde</text>
        
        <!-- Legend -->
        <g transform="translate(20, 370)">
            <rect x="0" y="0" width="140" height="110" fill="#ffffff" stroke="#e0e0e0" rx="6" shadow="sm"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#333">Legend</text>
            
            <circle cx="15" cy="35" r="5" fill="#404040"/>
            <text x="28" y="39" font-size="11" fill="#555">Carbon (C)</text>
            
            <circle cx="15" cy="50" r="5" fill="#FF4444"/>
            <text x="28" y="54" font-size="11" fill="#555">Oxygen (O)</text>
            
            <circle cx="15" cy="65" r="5" fill="#4444FF"/>
            <text x="28" y="69" font-size="11" fill="#555">Nitrogen (N)</text>
            
            <circle cx="15" cy="80" r="5" fill="#CCCCCC"/>
            <text x="28" y="84" font-size="11" fill="#555">Hydrogen (H)</text>
            
            <line x1="10" y1="95" x2="20" y2="95" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="28" y="99" font-size="11" fill="#555">Electron Flow</text>
        </g>

        <!-- Energy Profile Graph -->
        <g transform="translate(0, 0)">
            <text x="650" y="310" text-anchor="middle" font-size="14" font-weight="600" fill="#333">Energy Profile</text>
            <!-- Axes -->
            <line x1="550" y1="330" x2="550" y2="460" stroke="#888" stroke-width="2"/>
            <line x1="550" y1="460" x2="760" y2="460" stroke="#888" stroke-width="2"/>
            <text x="540" y="340" font-size="12" fill="#666" transform="rotate(-90 540 340)">Energy (E)</text>
            <text x="650" y="480" text-anchor="middle" font-size="12" fill="#666">Reaction Progress</text>
            
            <!-- Curve -->
            <path id="energy-curve" d="M 560 420 C 600 420, 620 350, 650 350 C 680 350, 700 450, 740 450" stroke="#555" stroke-width="3" fill="none"/>
            
            <!-- Moving Dot -->
            <circle r="6" fill="#F77F00" class="energy-dot"/>
        </g>

        <!-- Master Group for Global Fade -->
        <g class="master-group">
            
            <!-- Transition State Bracket -->
            <g class="ts-bracket">
                <path d="M 270 120 L 250 120 L 250 380 L 270 380 M 530 120 L 550 120 L 550 380 L 530 380" stroke="#333" stroke-width="2" fill="none"/>
                <text x="560" y="140" font-size="28" fill="#333">‡</text>
                <text x="400" y="110" text-anchor="middle" font-size="14" font-weight="600" fill="#7209B7">Transition State</text>
            </g>

            <!-- Hybridization Labels -->
            <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#404040" class="text-sp2">sp² hybridized, Planar</text>
            <text x="400" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#404040" class="text-sp3">sp³ hybridized, Tetrahedral</text>

            <!-- Acetaldehyde Molecule -->
            <g id="acetaldehyde">
                <!-- Central Carbon -->
                <circle cx="400" cy="250" r="16" fill="#404040"/>
                <text x="400" y="255" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" fill="#ffffff">C</text>
                
                <!-- Partial Charge on C -->
                <text x="390" y="225" font-size="14" font-weight="600" fill="#4444FF" class="partial-charge">δ+</text>

                <!-- Oxygen Group (Rotates) -->
                <g class="group-o">
                    <!-- Sigma Bond -->
                    <line x1="400" y1="250" x2="520" y2="250" stroke="#333" stroke-width="5"/>
                    <!-- Pi Bond -->
                    <path d="M 400 240 Q 460 230 520 240" stroke="#555" stroke-width="4" fill="none" class="pi-bond"/>
                    
                    <!-- Oxygen Atom -->
                    <circle cx="520" cy="250" r="16" fill="#FF4444"/>
                    <text x="520" y="255" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" fill="#ffffff">O</text>
                    
                    <!-- Partial Charge on O -->
                    <text x="535" y="235" font-size="14" font-weight="600" fill="#FF4444" class="partial-charge">δ-</text>

                    <!-- Formal Negative Charge on O -->
                    <g class="o-charge">
                        <circle cx="540" cy="230" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
                        <text x="540" y="234" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">-</text>
                    </g>
                </g>

                <!-- CH3 Group (Rotates) -->
                <g class="group-ch3">
                    <!-- Bond to CH3 (Angle 210 deg in SVG -> Top-Left) -->
                    <line x1="400" y1="250" x2="296" y2="190" stroke="#333" stroke-width="5"/>
                    <!-- CH3 Cluster Representation -->
                    <circle cx="296" cy="190" r="16" fill="#404040"/>
                    <text x="296" y="195" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="13" fill="#ffffff">CH₃</text>
                </g>

                <!-- H Group (Rotates) -->
                <g class="group-h">
                    <!-- Bond to H (Angle 150 deg in SVG -> Bottom-Left) -->
                    <line x1="400" y1="250" x2="314" y2="300" stroke="#333" stroke-width="5"/>
                    <circle cx="314" cy="300" r="11" fill="#CCCCCC"/>
                    <text x="314" y="304" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="12" fill="#333">H</text>
                </g>
            </g>

            <!-- Nucleophile (Cyanide Ion) -->
            <g class="nu-group">
                <!-- Forming Bond (Inside Nu group so it points correctly as it moves) -->
                <!-- Vector from Nu final (365, 364) to C (400, 250) is dx=35, dy=-114 -->
                <line x1="0" y1="0" x2="35" y2="-114" stroke="#333" stroke-width="5" class="forming-bond"/>

                <!-- C2 Atom -->
                <circle cx="0" cy="0" r="16" fill="#404040"/>
                <text x="0" y="5" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" fill="#ffffff">C</text>
                
                <!-- Triple Bond to N (Angle 135 deg -> Bottom-Left relative to C2) -->
                <line x1="-4" y1="4" x2="-24" y2="24" stroke="#333" stroke-width="2.5"/>
                <line x1="0" y1="0" x2="-20" y2="20" stroke="#333" stroke-width="2.5"/>
                <line x1="4" y1="-4" x2="-16" y2="16" stroke="#333" stroke-width="2.5"/>

                <!-- N Atom -->
                <circle cx="-25" cy="25" r="16" fill="#4444FF"/>
                <text x="-25" y="30" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" fill="#ffffff">N</text>

                <!-- Lone Pair on C2 (Pointing towards attack vector) -->
                <circle cx="10" cy="-12" r="2.5" fill="#FFCC00"/>
                <circle cx="16" cy="-6" r="2.5" fill="#FFCC00"/>

                <!-- Formal Negative Charge on C2 -->
                <g class="nu-charge">
                    <circle cx="-18" cy="-15" r="9" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
                    <text x="-18" y="-11" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">-</text>
                </g>
                
                <!-- Label -->
                <text x="-40" y="55" font-size="12" font-weight="600" fill="#4444FF">Cyanide (CN⁻)</text>
            </g>

            <!-- Electron Flow Curly Arrows -->
            <!-- Arrow 1: Nu lone pair to Carbonyl C -->
            <!-- Starts near initial Nu position (200, 480), ends at C (400, 250) -->
            <path d="M 220 460 Q 330 430 390 265" stroke="#F77F00" stroke-width="3" fill="none" marker-end="url(#arrowhead)" class="arrow-1"/>
            
            <!-- Arrow 2: Pi bond to Oxygen -->
            <!-- Starts at Pi bond (460, 235), ends at O (520, 230) -->
            <path d="M 460 235 Q 490 190 520 235" stroke="#F77F00" stroke-width="3" fill="none" marker-end="url(#arrowhead)" class="arrow-2"/>

        </g>
    </svg>
</div>

</body>
</html>
