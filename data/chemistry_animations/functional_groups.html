<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Group Transformations</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
        }

        .pulse-cloud {
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(0.85); opacity: 0.4; }
            50% { transform: scale(1.15); opacity: 0.7; }
            100% { transform: scale(0.85); opacity: 0.4; }
        }

        /* Mechanistic Arrow Animations */
        .mech-arrow {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            opacity: 0;
        }

        .arrow-t1 { animation: drawArrow1 16s infinite; }
        @keyframes drawArrow1 {
            0%, 14% { opacity: 0; stroke-dashoffset: 150; }
            15% { opacity: 1; stroke-dashoffset: 150; }
            20% { opacity: 1; stroke-dashoffset: 0; }
            24% { opacity: 1; stroke-dashoffset: 0; }
            25%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .arrow-t2 { animation: drawArrow2 16s infinite; }
        @keyframes drawArrow2 {
            0%, 39% { opacity: 0; stroke-dashoffset: 150; }
            40% { opacity: 1; stroke-dashoffset: 150; }
            45% { opacity: 1; stroke-dashoffset: 0; }
            49% { opacity: 1; stroke-dashoffset: 0; }
            50%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .arrow-t3 { animation: drawArrow3 16s infinite; }
        @keyframes drawArrow3 {
            0%, 64% { opacity: 0; stroke-dashoffset: 150; }
            65% { opacity: 1; stroke-dashoffset: 150; }
            70% { opacity: 1; stroke-dashoffset: 0; }
            74% { opacity: 1; stroke-dashoffset: 0; }
            75%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
    </style>
</head>

                0.65 - 0.75: Transition 3
                0.75 - 0.90: State 4 (Ethanoic Acid)

                <animateTransform attributeName="transform" type="translate" values="460,320; 460,320; 460,320; 460,320; 470,336; 470,336; 550,330; 550,330; 460,320" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <circle r="12" fill="url(#grad-H)" stroke="#CCC" />
                <text x="0" y="4" fill="#666" font-size="12" text-anchor="middle" font-weight="bold">H</text>
            </g>

            <!-- H_right -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="490,250; 490,250; 560,250; 560,250; 570,50; 570,50; 570,50; 570,50; 490,250" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="opacity" values="1; 1; 1; 1; 0; 0; 0; 0; 1" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <circle r="12" fill="url(#grad-H)" stroke="#CCC" />
                <text x="0" y="4" fill="#666" font-size="12" text-anchor="middle" font-weight="bold">H</text>
            </g>

            <!-- O_main -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="490,100; 490,100; 500,250; 500,250; 480,146; 480,146; 480,146; 480,146; 490,100" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="opacity" values="0; 0; 1; 1; 1; 1; 1; 1; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <circle r="35" fill="url(#grad-density)" class="pulse-cloud" />
                <circle r="20" fill="url(#grad-O)" />
                <text x="0" y="6" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">O</text>
                <text x="25" y="-15" fill="#FF4444" font-size="14" font-weight="bold">δ⁻</text>
            </g>

            <!-- O_sub -->
            <g>
                <animateTransform attributeName="transform" type="translate" values="490,450; 490,450; 490,450; 490,450; 490,450; 490,450; 490,330; 490,330; 490,450" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <animate attributeName="opacity" values="0; 0; 0; 0; 0; 0; 1; 1; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"/>
                <circle r="35" fill="url(#grad-density)" class="pulse-cloud" />
                <circle r="20" fill="url(#grad-O)" />
                <text x="0" y="6" fill="#fff" font-size="16" text-anchor="middle" font-weight="bold">O</text>
                <text x="25" y="25" fill="#FF4444" font-size="14" font-weight="bold">δ⁻</text>
            </g>
        </g>

        <!-- Mechanistic Arrows -->
        <!-- Arrow 1: O attacks C -->
        <path class="mech-arrow arrow-t1" d="M 490 120 Q 440 150 425 230" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>
        <!-- Arrow 2: C-H bond breaks to form C=O -->
        <path class="mech-arrow arrow-t2" d="M 440 215 Q 460 190 450 220" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>
        <!-- Arrow 3: O_sub attacks C -->
        <path class="mech-arrow arrow-t3" d="M 490 430 Q 440 380 425 270" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>

        <!-- Labels and Annotations -->
        <g id="annotations">
            <!-- Hybridization Labels -->
            <g font-size="12" fill="#666" font-style="italic">
                <text x="420" y="190" text-anchor="end">
                    <tspan class="formula">sp³</tspan> hybridized (tetrahedral)
                    <animate attributeName="opacity" values="1; 1; 1; 1; 0; 0; 0; 0; 1" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
                <text x="400" y="190" text-anchor="end">
                    <tspan class="formula">sp²</tspan> hybridized (trigonal planar)
                    <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 1; 1; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
            </g>

            <!-- Callouts -->
            <g font-size="14" font-weight="bold" fill="#FF4444">
                <!-- Hydroxyl -->
                <g>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                    <path d="M 620 180 L 530 230" fill="none" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <text x="625" y="175">Hydroxyl Group</text>
                </g>
                <!-- Carbonyl -->
                <g>
                    <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0; 0; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                    <path d="M 620 80 L 500 130" fill="none" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <text x="625" y="75">Carbonyl Group</text>
                </g>
                <!-- Carboxyl -->
                <g>
                    <animate attributeName="opacity" values="0; 0; 0; 0; 0; 0; 1; 1; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                    <path d="M 620 380 L 520 330" fill="none" stroke="#FF4444" stroke-width="1.5" stroke-dasharray="4,4"/>
                    <text x="625" y="385">Carboxyl Group</text>
                </g>
            </g>

            <!-- Dynamic Bottom Labels -->
            <g transform="translate(400, 460)" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">
                <text>
                    Ethane (Alkane) — <tspan class="formula">R-CH₃</tspan>
                    <animate attributeName="opacity" values="1; 1; 0; 0; 0; 0; 0; 0; 1" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
                <text>
                    Ethanol (Alcohol) — <tspan class="formula">R-OH</tspan>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
                <text>
                    Ethanal (Aldehyde) — <tspan class="formula">R-CHO</tspan>
                    <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0; 0; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
                <text>
                    Ethanoic Acid (Carboxylic Acid) — <tspan class="formula">R-COOH</tspan>
                    <animate attributeName="opacity" values="0; 0; 0; 0; 0; 0; 1; 1; 0" keyTimes="0; 0.15; 0.25; 0.40; 0.50; 0.65; 0.75; 0.90; 1" dur="16s" repeatCount="indefinite"/>
                </text>
            </g>
        </g>
    </svg>
