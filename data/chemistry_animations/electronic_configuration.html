<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronic Configuration Anomalies: Cr & Cu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            overflow: hidden;
            margin: 20px;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Base Phase Visibility */
        .cr-phase { animation: crPhase 16s infinite; }
        .cu-phase { animation: cuPhase 16s infinite; }

        @keyframes crPhase {
            0%, 46.875% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes cuPhase {
            0%, 46.875% { opacity: 0; }
            50%, 96.875% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Moving Electron: Chromium */
        .moving-cr { animation: moveCr 16s infinite ease-in-out; }
        @keyframes moveCr {
            0%, 12.5% { transform: translate(225px, 350px); opacity: 1; }
            17.18% { transform: translate(375px, 230px); opacity: 1; }
            21.875%, 46.875% { transform: translate(525px, 280px); opacity: 1; }
            46.876%, 100% { transform: translate(225px, 350px); opacity: 0; }
        }

        .cr-down { animation: crDownFade 16s infinite; }
        @keyframes crDownFade {
            0%, 17% { opacity: 1; }
            17.1%, 100% { opacity: 0; }
        }

        .cr-up { animation: crUpFade 16s infinite; }
        @keyframes crUpFade {
            0%, 17% { opacity: 0; }
            17.1%, 100% { opacity: 1; }
        }

        /* Moving Electron: Copper */
        .moving-cu { animation: moveCu 16s infinite ease-in-out; }
        @keyframes moveCu {
            0%, 49.999% { opacity: 0; }
            50%, 96.875% { opacity: 1; }
            96.876%, 100% { opacity: 0; }
            
            50%, 62.5% { transform: translate(225px, 350px); }
            67.18% { transform: translate(380px, 230px); }
            71.875%, 96.875% { transform: translate(535px, 280px); }
        }

        /* Text Animations */
        .cr-expected { animation: crExp 16s infinite; }
        @keyframes crExp {
            0%, 12.5% { opacity: 1; }
            15%, 100% { opacity: 0; }
        }
        .cr-actual { animation: crAct 16s infinite; }
        @keyframes crAct {
            0%, 20% { opacity: 0; }
            21.875%, 46.875% { opacity: 1; }
            48%, 100% { opacity: 0; }
        }

        .cu-expected { animation: cuExp 16s infinite; }
        @keyframes cuExp {
            0%, 48% { opacity: 0; }
            50%, 62.5% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }
        .cu-actual { animation: cuAct 16s infinite; }
        @keyframes cuAct {
            0%, 70% { opacity: 0; }
            71.875%, 96.875% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        /* Glow Effects */
        .glow-cr { animation: glowCr 16s infinite; }
        @keyframes glowCr {
            0%, 20% { opacity: 0; }
            21.875%, 46.875% { opacity: 1; }
            48%, 100% { opacity: 0; }
        }
        .glow-cu { animation: glowCu 16s infinite; }
        @keyframes glowCu {
            0%, 70% { opacity: 0; }
            71.875%, 96.875% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        /* Stability Note */
        .stability-note { animation: stabNote 16s infinite; }
        @keyframes stabNote {
            0%, 20% { opacity: 0; }
            21.875%, 46.875% { opacity: 1; }
            48%, 70% { opacity: 0; }
            71.875%, 96.875% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Glow Filter for Stability -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Arrowhead for Energy Axis -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
            </marker>

            <!-- Electron Half-Arrows -->
            <g id="up-arrow">
                <path d="M 0 15 L 0 -15 M 0 -15 L 5 -7" stroke="#F77F00" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
            <g id="down-arrow">
                <path d="M 0 -15 L 0 15 M 0 15 L 5 7" stroke="#7209B7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </defs>

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#2b2b2b">Electronic Configuration Anomalies: Cr (Z=24) &amp; Cu (Z=29)</text>

        <!-- Legend -->
        <g transform="translate(610, 20)">
            <rect x="0" y="0" width="160" height="65" rx="6" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
            <g transform="translate(20, 20) scale(0.8)"><use href="#up-arrow"/></g>
            <text x="35" y="24" font-size="12" fill="#404040">Spin-up (e⁻)</text>
            <g transform="translate(20, 45) scale(0.8)"><use href="#down-arrow"/></g>
            <text x="35" y="49" font-size="12" fill="#404040">Spin-down (e⁻)</text>
        </g>

        <!-- Energy Axis -->
        <line x1="80" y1="420" x2="80" y2="160" stroke="#000000" stroke-width="2" marker-end="url(#arrowhead)"/>
        <text x="-290" y="55" transform="rotate(-90)" font-size="16" font-weight="600" fill="#000000" letter-spacing="1">Energy (E)</text>

        <!-- Configuration Texts -->
        <g font-family="'Roboto Mono', monospace" font-size="20" fill="#404040" text-anchor="middle">
            <!-- Chromium Texts -->
            <text x="400" y="100" class="cr-expected">Expected: [Ar] 3d<tspan dy="-8" font-size="14">4</tspan><tspan dy="8" dx="4">4s</tspan><tspan dy="-8" font-size="14">2</tspan></text>
            <text x="400" y="100" class="cr-actual">Actual: [Ar] 3d<tspan dy="-8" font-size="14">5</tspan><tspan dy="8" dx="4">4s</tspan><tspan dy="-8" font-size="14">1</tspan><tspan dy="8" dx="12" font-family="Inter" font-weight="600" fill="#2ECC71" font-size="16">(Stable Half-filled)</tspan></text>
            
            <!-- Copper Texts -->
            <text x="400" y="100" class="cu-expected">Expected: [Ar] 3d<tspan dy="-8" font-size="14">9</tspan><tspan dy="8" dx="4">4s</tspan><tspan dy="-8" font-size="14">2</tspan></text>
            <text x="400" y="100" class="cu-actual">Actual: [Ar] 3d<tspan dy="-8" font-size="14">10</tspan><tspan dy="8" dx="4">4s</tspan><tspan dy="-8" font-size="14">1</tspan><tspan dy="8" dx="12" font-family="Inter" font-weight="600" fill="#2ECC71" font-size="16">(Stable Fully-filled)</tspan></text>
        </g>

        <!-- Stability Note -->
        <text x="400" y="460" text-anchor="middle" font-size="16" font-style="italic" fill="#2ECC71" font-weight="600" class="stability-note">Increased stability due to symmetrical distribution and exchange energy.</text>

        <!-- Glow Effects (Behind Orbitals) -->
        <rect class="glow-cr" x="348" y="258" width="204" height="44" rx="4" stroke="#2ECC71" stroke-width="4" fill="none" filter="url(#glow)"/>
        <rect class="glow-cu" x="348" y="258" width="204" height="44" rx="4" stroke="#2ECC71" stroke-width="4" fill="none" filter="url(#glow)"/>

        <!-- Orbital Boxes -->
        <!-- 4s Orbital -->
        <rect x="200" y="330" width="40" height="40" stroke="#404040" stroke-width="2" fill="#F8F9FA"/>
        <text x="220" y="395" text-anchor="middle" font-size="18" font-weight="600" fill="#404040">4s</text>

        <!-- 3d Orbitals -->
        <g stroke="#404040" stroke-width="2" fill="#F8F9FA">
            <rect x="350" y="260" width="40" height="40"/>
            <rect x="390" y="260" width="40" height="40"/>
            <rect x="430" y="260" width="40" height="40"/>
            <rect x="470" y="260" width="40" height="40"/>
            <rect x="510" y="260" width="40" height="40"/>
        </g>
        <text x="450" y="325" text-anchor="middle" font-size="18" font-weight="600" fill="#404040">3d</text>

        <!-- Electrons -->
        <!-- Shared Base Electrons (Always visible) -->
        <use href="#up-arrow" x="215" y="350" /> <!-- 4s Up -->
        <use href="#up-arrow" x="365" y="280" /> <!-- 3d1 Up -->
        <use href="#up-arrow" x="405" y="280" /> <!-- 3d2 Up -->
        <use href="#up-arrow" x="445" y="280" /> <!-- 3d3 Up -->
        <use href="#up-arrow" x="485" y="280" /> <!-- 3d4 Up -->

        <!-- Copper Specific Base Electrons -->
        <g class="cu-phase">
            <use href="#down-arrow" x="375" y="280" /> <!-- 3d1 Down -->
            <use href="#down-arrow" x="415" y="280" /> <!-- 3d2 Down -->
            <use href="#down-arrow" x="455" y="280" /> <!-- 3d3 Down -->
            <use href="#down-arrow" x="495" y="280" /> <!-- 3d4 Down -->
            <use href="#up-arrow" x="525" y="280" />   <!-- 3d5 Up -->
        </g>

        <!-- Moving Electron: Chromium (Flips spin) -->
        <g class="moving-cr">
            <use href="#down-arrow" class="cr-down" x="0" y="0" />
            <use href="#up-arrow" class="cr-up" x="0" y="0" />
        </g>

        <!-- Moving Electron: Copper (Stays spin-down) -->
        <g class="moving-cu">
            <use href="#down-arrow" x="0" y="0" />
        </g>

    </svg>
</div>

</body>
</html>
