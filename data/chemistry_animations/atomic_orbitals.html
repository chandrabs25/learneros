<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carbon sp³ Hybridization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title {
            font-size: 24px;
            font-weight: 700;
            fill: #333;
            text-anchor: middle;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            fill: #555;
            text-anchor: middle;
        }

        .axis-label {
            font-size: 14px;
            font-weight: 600;
            fill: #404040;
            text-anchor: middle;
        }

        .level-label {
            font-size: 14px;
            font-weight: 600;
            text-anchor: end;
        }

        .legend-text {
            font-size: 12px;
            fill: #555;
        }

        .highlight-orange {
            fill: #F77F00;
            font-weight: bold;
        }

        .highlight-purple {
            fill: #7209B7;
            font-weight: bold;
        }

        /* Animations */
        .e1-trans {
            animation: e1-trans 12s infinite ease-in-out;
        }

        .e2-trans {
            animation: e2-trans 12s infinite ease-in-out;
        }

        .e2-spin {
            animation: e2-spin 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .e3-trans {
            animation: e3-trans 12s infinite ease-in-out;
        }

        .e4-trans {
            animation: e4-trans 12s infinite ease-in-out;
        }

        .line-2s {
            animation: line-2s 12s infinite ease-in-out;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .line-2p {
            animation: line-2p 12s infinite ease-in-out;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .label-ground {
            animation: fade-out 12s infinite ease-in-out;
        }

        .label-hybrid {
            animation: fade-in 12s infinite ease-in-out;
        }

        .spatial-s {
            animation: spatial-s 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .spatial-p {
            animation: spatial-p 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .spatial-pz {
            animation: spatial-pz 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .spatial-sp3 {
            animation: spatial-sp3 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .jump-arrow {
            animation: jump-arrow 12s infinite ease-in-out;
        }

        .reaction-arrow {
            animation: reaction-arrow 12s infinite ease-in-out;
        }

        .sparkles {
            animation: sparkles 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        /* Keyframes */
        @keyframes e1-trans {

            0%,
            41.66% {
                transform: translate(110px, 350px);
            }

            66.66%,
            83.33% {
                transform: translate(120px, 200px);
            }

            100% {
                transform: translate(110px, 350px);
            }
        }

        @keyframes e2-trans {

            0%,
            25% {
                transform: translate(130px, 350px);
            }

            41.66% {
                transform: translate(300px, 150px);
            }

            66.66%,
            83.33% {
                transform: translate(300px, 200px);
            }

            100% {
                transform: translate(130px, 350px);
            }
        }

        @keyframes e2-spin {

            0%,
            25% {
                transform: scaleY(-1);
            }

            41.66%,
            83.33% {
                transform: scaleY(1);
            }

            100% {
                transform: scaleY(-1);
            }
        }

        @keyframes e3-trans {

            0%,
            41.66% {
                transform: translate(180px, 150px);
            }

            66.66%,
            83.33% {
                transform: translate(180px, 200px);
            }

            100% {
                transform: translate(180px, 150px);
            }
        }

        @keyframes e4-trans {

            0%,
            41.66% {
                transform: translate(240px, 150px);
            }

            66.66%,
            83.33% {
                transform: translate(240px, 200px);
            }

            100% {
                transform: translate(240px, 150px);
            }
        }

        @keyframes line-2s {

            0%,
            41.66% {
                transform: translateY(350px);
                stroke: #4A90E2;
            }

            66.66%,
            83.33% {
                transform: translateY(200px);
                stroke: #7209B7;
            }

            100% {
                transform: translateY(350px);
                stroke: #4A90E2;
            }
        }

        @keyframes line-2p {

            0%,
            41.66% {
                transform: translateY(150px);
                stroke: #FF4444;
            }

            66.66%,
            83.33% {
                transform: translateY(200px);
                stroke: #7209B7;
            }

            100% {
                transform: translateY(150px);
                stroke: #FF4444;
            }
        }

        @keyframes fade-out {

            0%,
            41.66% {
                opacity: 1;
            }

            54%,
            83.33% {
                opacity: 0;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes fade-in {

            0%,
            41.66% {
                opacity: 0;
            }

            66.66%,
            83.33% {
                opacity: 1;
            }

            100% {
                opacity: 0;
            }
        }

        @keyframes spatial-s {

            0%,
            41.66% {
                transform: scale(1);
                opacity: 0.6;
                filter: blur(0px);
            }

            54% {
                transform: scale(1.3);
                opacity: 0.3;
                filter: blur(8px);
            }

            66.66%,
            83.33% {
                transform: scale(0);
                opacity: 0;
                filter: blur(12px);
            }

            100% {
                transform: scale(1);
                opacity: 0.6;
                filter: blur(0px);
            }
        }

        @keyframes spatial-p {

            0%,
            41.66% {
                transform: scale(1);
                opacity: 0.6;
                filter: blur(0px);
            }

            54% {
                transform: scale(1.3);
                opacity: 0.3;
                filter: blur(8px);
            }

            66.66%,
            83.33% {
                transform: scale(0);
                opacity: 0;
                filter: blur(12px);
            }

            100% {
                transform: scale(1);
                opacity: 0.6;
                filter: blur(0px);
            }
        }

        @keyframes spatial-pz {

            0%,
            20% {
                transform: scale(0.8);
                opacity: 0;
                filter: blur(0px);
            }

            41.66% {
                transform: scale(1);
                opacity: 0.6;
                filter: blur(0px);
            }

            54% {
                transform: scale(1.3);
                opacity: 0.3;
                filter: blur(8px);
            }

            66.66%,
            83.33% {
                transform: scale(0);
                opacity: 0;
                filter: blur(12px);
            }

            100% {
                transform: scale(0.8);
                opacity: 0;
                filter: blur(0px);
            }
        }

        @keyframes spatial-sp3 {

            0%,
            41.66% {
                transform: scale(0.2);
                opacity: 0;
                filter: blur(12px);
            }

            66.66%,
            83.33% {
                transform: scale(1);
                opacity: 0.85;
                filter: blur(0px);
            }

            100% {
                transform: scale(0.2);
                opacity: 0;
                filter: blur(12px);
            }
        }

        @keyframes jump-arrow {

            0%,
            24% {
                opacity: 0;
                stroke-dashoffset: 200;
            }

            25% {
                opacity: 1;
                stroke-dashoffset: 200;
            }

            41.66% {
                opacity: 1;
                stroke-dashoffset: 0;
            }

            42%,
            100% {
                opacity: 0;
            }
        }

        @keyframes reaction-arrow {

            0%,
            41.66% {
                opacity: 0;
                transform: translateX(-15px);
            }

            54% {
                opacity: 1;
                transform: translateX(0px);
            }

            66.66%,
            100% {
                opacity: 0;
                transform: translateX(15px);
            }
        }

        @keyframes sparkles {

            0%,
            41.66% {
                opacity: 0;
                transform: scale(0.5) rotate(0deg);
            }

            54% {
                opacity: 1;
                transform: scale(1.2) rotate(90deg);
            }

            66.66%,
            100% {
                opacity: 0;
                transform: scale(2) rotate(180deg);
            }
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Gradients for Orbitals -->
            <radialGradient id="grad-s" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#A0D2EB" />
                <stop offset="100%" stop-color="#4A90E2" />
            </radialGradient>
            <radialGradient id="grad-px" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF8888" />
                <stop offset="100%" stop-color="#FF4444" />
            </radialGradient>
            <radialGradient id="grad-py" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#88FF88" />
                <stop offset="100%" stop-color="#44CC44" />
            </radialGradient>
            <radialGradient id="grad-pz" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#8888FF" />
                <stop offset="100%" stop-color="#4444FF" />
            </radialGradient>
            <radialGradient id="grad-sp3" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#B066D8" />
                <stop offset="100%" stop-color="#7209B7" />
            </radialGradient>

            <!-- Markers -->
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"
                orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#404040" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"
                orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"
                orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#7209B7" />
            </marker>

            <!-- Reusable Electron -->
            <g id="electron">
                <circle cx="0" cy="0" r="7" fill="#FFD700" stroke="#D4AF37" stroke-width="1.5" />
                <path d="M 0,3 L 0,-3 M -2,-1 L 0,-3 L 2,-1" stroke="#000" stroke-width="1.5" fill="none"
                    stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <!-- Reusable p-orbital lobe (symmetric dumbbell) -->
            <path id="lobe-p"
                d="M 0,0 C 45,-35 100,-35 100,0 C 100,35 45,35 0,0 M 0,0 C -45,-35 -100,-35 -100,0 C -100,35 -45,35 0,0" />

            <!-- Reusable sp3-orbital lobe (teardrop + back lobe) -->
            <path id="lobe-sp3"
                d="M 0,0 C -35,-50 -25,-110 0,-110 C 25,-110 35,-50 0,0 M 0,0 C -10,15 -5,25 0,25 C 5,25 10,15 0,0" />
        </defs>

        <!-- Divider Line -->
        <line x1="380" y1="80" x2="380" y2="420" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="6 6" />

        <!-- Header & Footer Text -->
        <text x="400" y="40" class="title">The Quantum Morph: Carbon sp³ Hybridization</text>
        <text x="400" y="475" class="formula">
            C: 1s² 2s² 2p² <tspan class="highlight-orange">→ C*: 1s² 2s¹ 2p³</tspan>
            <tspan class="highlight-purple">→ sp³</tspan>
        </text>

        <!-- ========================================== -->
        <!-- LEFT SIDE: ENERGY LEVEL DIAGRAM            -->
        <!-- ========================================== -->

        <!-- Energy Axis -->
        <line x1="60" y1="420" x2="60" y2="100" stroke="#404040" stroke-width="2" marker-end="url(#arrow-axis)" />
        <text x="40" y="260" class="axis-label" transform="rotate(-90, 40, 260)">Energy</text>

        <!-- Transition State / Median Energy Line -->
        <g class="label-hybrid">
            <line x1="70" y1="200" x2="340" y2="200" stroke="#44CC44" stroke-width="2" stroke-dasharray="5 5" />
            <text x="75" y="190" font-size="12" fill="#44CC44" font-weight="bold">Weighted Average Energy</text>
            <text x="75" y="205" class="level-label highlight-purple" text-anchor="start">4 × sp³</text>
        </g>

        <!-- Energy Levels (Lines) -->
        <g class="line-2s">
            <line x1="100" y1="0" x2="140" y2="0" />
            <text x="90" y="5" class="level-label label-ground" fill="#4A90E2">2s</text>
        </g>
        <g class="line-2p">
            <line x1="160" y1="0" x2="200" y2="0" />
            <line x1="220" y1="0" x2="260" y2="0" />
            <line x1="280" y1="0" x2="320" y2="0" />
            <text x="150" y="5" class="level-label label-ground" fill="#FF4444">2p</text>
        </g>

        <!-- Excitation Jump Arrow -->
        <path d="M 140,340 Q 220,200 290,160" fill="none" stroke="#F77F00" stroke-width="2" stroke-dasharray="6 6"
            marker-end="url(#arrow-orange)" class="jump-arrow" />

        <!-- Electrons -->
        <g class="e1-trans">
            <use href="#electron" />
        </g>
        <g class="e2-trans">
            <g class="e2-spin">
                <use href="#electron" />
            </g>
        </g>
        <g class="e3-trans">
            <use href="#electron" />
        </g>
        <g class="e4-trans">
            <use href="#electron" />
        </g>

        <!-- Reaction Flow Arrow -->
        <g class="reaction-arrow">
            <line x1="340" y1="250" x2="420" y2="250" stroke="#7209B7" stroke-width="3"
                marker-end="url(#arrow-purple)" />
            <text x="380" y="235" font-size="13" font-weight="bold" fill="#7209B7" text-anchor="middle">Hybridize</text>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: SPATIAL ORBITAL DIAGRAM        -->
        <!-- ========================================== -->

        <!-- Labels for Spatial Diagram -->
        <g class="label-hybrid">
            <text x="580" y="100" font-size="16" font-weight="bold" fill="#7209B7" text-anchor="middle">Tetrahedral
                Geometry</text>

            <!-- 109.5 Degree Arc & Label -->
            <g transform="translate(580, 250)">
                <!-- Arc from Up (0) to Bottom Right (109.5) -->
                <path d="M 0,-50 A 50,50 0 0,1 47.1,16.7" fill="none" stroke="#7209B7" stroke-width="2"
                    stroke-dasharray="4 4" />
                <text x="35" y="-20" font-size="13" font-weight="bold" fill="#7209B7">109.5°</text>
            </g>
        </g>

        <!-- Orbitals Group -->
        <g transform="translate(580, 250)">

            <!-- Ground State Orbitals (s, px, py, pz) -->
            <circle r="60" fill="url(#grad-s)" class="spatial-s" />
            <use href="#lobe-p" fill="url(#grad-px)" class="spatial-p" />
            <g transform="rotate(90)">
                <use href="#lobe-p" fill="url(#grad-py)" class="spatial-p" />
            </g>
            <g transform="rotate(45)">
                <use href="#lobe-p" fill="url(#grad-pz)" class="spatial-pz" />
            </g>

            <!-- Hybridized Orbitals (sp3) -->
            <g class="spatial-sp3">
                <!-- Back Lobe (Pointing Away) -->
                <use href="#lobe-sp3" transform="rotate(180) scale(0.7)" filter="brightness(0.6)" />
                <!-- Bottom Left -->
                <use href="#lobe-sp3" transform="rotate(250.5)" />
                <!-- Bottom Right -->
                <use href="#lobe-sp3" transform="rotate(109.5)" />
                <!-- Top -->
                <use href="#lobe-sp3" transform="rotate(0)" />
            </g>

            <!-- Nucleus -->
            <circle r="4" fill="#404040" />

            <!-- Magic Sparkles during transition -->
            <g class="sparkles">
                <path d="M0,-15 L3,-3 L15,0 L3,3 L0,15 L-3,3 L-15,0 L-3,-3 Z" fill="#F77F00" />
                <path d="M20,20 L22,12 L30,10 L22,8 L20,0 L18,8 L10,10 L18,12 Z" fill="#7209B7"
                    transform="scale(0.6)" />
                <circle cx="-25" cy="-20" r="3" fill="#FFD700" />
                <circle cx="25" cy="-15" r="2" fill="#4A90E2" />
                <circle cx="-15" cy="25" r="2.5" fill="#44CC44" />
            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(640, 380)">
            <rect x="0" y="0" width="130" height="90" fill="#ffffff" stroke="#e0e0e0" rx="6" ry="6" opacity="0.9" />
            <circle cx="15" cy="20" r="6" fill="#4A90E2" />
            <text x="30" y="24" class="legend-text">s orbital</text>

            <circle cx="15" cy="45" r="6" fill="#FF4444" />
            <text x="30" y="49" class="legend-text">p orbitals</text>

            <circle cx="15" cy="70" r="6" fill="#7209B7" />
            <text x="30" y="74" class="legend-text">sp³ hybrid</text>
        </g>

    </svg>

</body>

</html>
