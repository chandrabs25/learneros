<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equilibrium of Forces in a Fluid (Pascal's Law)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #1A202C;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CSS Animations --- */
        
        /* Global Pause Class */
        svg.paused * {
            animation-play-state: paused !important;
        }

        /* Stage 1: Prism & Areas (0-2s) */
        .fade-in-1 { animation: alpha-1 15s infinite ease-in-out; }
        @keyframes alpha-1 {
            0%, 100% { opacity: 0; }
            3.3%, 93.3% { opacity: 1; }
        }

        /* Stage 2: Forces Grow (2-5s) */
        .clip-fb { animation: grow-fb 15s infinite ease-in-out; }
        @keyframes grow-fb { 0%, 13.3% { r: 0; } 33.3%, 93.3% { r: 60px; } 100% { r: 0; } }
        
        .clip-fa { animation: grow-fa 15s infinite ease-in-out; }
        @keyframes grow-fa { 0%, 13.3% { r: 0; } 33.3%, 93.3% { r: 90px; } 100% { r: 0; } }
        
        .clip-fc { animation: grow-fc 15s infinite ease-in-out; }
        @keyframes grow-fc { 0%, 13.3% { r: 0; } 33.3%, 93.3% { r: 110px; } 100% { r: 0; } }

        /* Force Labels (2-11s, fade out at 11s) */
        .fade-in-2 { animation: alpha-2 15s infinite ease-in-out; }
        @keyframes alpha-2 {
            0%, 13.3%, 73.3%, 100% { opacity: 0; }
            20%, 66.6% { opacity: 1; }
        }

        /* Stage 3: Components Grow (5-8s) */
        .clip-fcx { animation: grow-fcx 15s infinite ease-in-out; }
        @keyframes grow-fcx { 0%, 33.3% { r: 0; } 53.3%, 93.3% { r: 60px; } 100% { r: 0; } }
        
        .clip-fcy { animation: grow-fcy 15s infinite ease-in-out; }
        @keyframes grow-fcy { 0%, 33.3% { r: 0; } 53.3%, 93.3% { r: 90px; } 100% { r: 0; } }

        /* Stage 4: Eq 1 & 2 (8s+) */
        .fade-in-3 { animation: alpha-3 15s infinite ease-in-out; }
        @keyframes alpha-3 { 0%, 53.3%, 100% { opacity: 0; } 60%, 93.3% { opacity: 1; } }

        /* Stage 4.5: Eq 3 & 4 (9s+) */
        .fade-in-4 { animation: alpha-4 15s infinite ease-in-out; }
        @keyframes alpha-4 { 0%, 60%, 100% { opacity: 0; } 66.6%, 93.3% { opacity: 1; } }

        /* Stage 5: Pressure Labels & Eq 5 & 6 (11s+) */
        .fade-in-5 { animation: alpha-5 15s infinite ease-in-out; }
        @keyframes alpha-5 { 0%, 73.3%, 100% { opacity: 0; } 80%, 93.3% { opacity: 1; } }

        /* Stage 6: Final Conclusion (12s+) */
        .fade-in-6 { animation: alpha-6 15s infinite ease-in-out; }
        @keyframes alpha-6 { 0%, 80%, 100% { opacity: 0; } 86.6%, 93.3% { opacity: 1; } }

        /* Hover effects */
        .btn-hover:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <h1>Equilibrium of Forces in a Fluid (Pascal's Law)</h1>

    <div class="svg-container">
        <svg id="pascal-diagram" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Pascal's Law Proof Diagram</title>
            <desc>Animated diagram showing the equilibrium of a prismatic fluid element to prove Pascal's Law.</desc>

            <!-- Definitions for Arrowheads and Clip Paths -->
            <defs>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
                </marker>
                <marker id="arrow-red-dash" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
                </marker>

                <!-- Clip paths for animating vectors from their tails -->
                <clipPath id="clip-fb-path"><circle cx="200" cy="200" class="clip-fb" /></clipPath>
                <clipPath id="clip-fa-path"><circle cx="400" cy="375" class="clip-fa" /></clipPath>
                <clipPath id="clip-fc-path"><circle cx="450" cy="125" class="clip-fc" /></clipPath>
                <clipPath id="clip-fcx-path"><circle cx="400" cy="200" class="clip-fcx" /></clipPath>
                <clipPath id="clip-fcy-path"><circle cx="400" cy="200" class="clip-fcy" /></clipPath>
            </defs>

            <!-- Background Fluid Container -->
            <rect x="40" y="40" width="540" height="420" fill="#E0F2FE" rx="12" />
            <line x1="40" y1="60" x2="580" y2="60" stroke="#00B4D8" stroke-width="3" stroke-dasharray="10, 5" opacity="0.6"/>
            <text x="60" y="85" font-family="Inter" font-size="14" fill="#00B4D8" font-weight="600" opacity="0.8">Fluid at Rest</text>

            <!-- ================= STAGE 1: Prism & Areas ================= -->
            <g class="fade-in-1">
                <!-- Prismatic Element (Right Triangle) -->
                <!-- Vertices: Top(250,100), Bottom-Left(250,300), Bottom-Right(550,300) -->
                <polygon points="250,100 250,300 550,300" fill="#4361EE" fill-opacity="0.15" stroke="#4361EE" stroke-width="2" stroke-linejoin="round"/>
                
                <!-- Right Angle Indicator -->
                <polyline points="250,285 265,285 265,300" fill="none" stroke="#4361EE" stroke-width="1.5"/>

                <!-- Angle Theta at Vertex B (550, 300) -->
                <!-- Angle is atan(200/300) = 33.69 degrees -->
                <path d="M 510 300 A 40 40 0 0 1 516.72 277.81" fill="none" stroke="#4A5568" stroke-width="2"/>
                <text x="495" y="292" font-family="Inter" font-size="16" fill="#4A5568" font-style="italic">θ</text>

                <!-- Area Labels -->
                <text x="220" y="205" font-family="Inter" font-size="16" fill="#4A5568" font-weight="600" text-anchor="end">A<tspan baseline-shift="sub" font-size="0.7em">b</tspan></text>
                <text x="400" y="325" font-family="Inter" font-size="16" fill="#4A5568" font-weight="600" text-anchor="middle">A<tspan baseline-shift="sub" font-size="0.7em">a</tspan></text>
                <text x="425" y="180" font-family="Inter" font-size="16" fill="#4A5568" font-weight="600">A<tspan baseline-shift="sub" font-size="0.7em">c</tspan></text>
            </g>

            <!-- ================= STAGE 2: Force Vectors ================= -->
            <!-- Fb (Horizontal, pushing right) -->
            <g clip-path="url(#clip-fb-path)">
                <line x1="200" y1="200" x2="246" y2="200" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            </g>
            
            <!-- Fa (Vertical, pushing up) -->
            <g clip-path="url(#clip-fa-path)">
                <line x1="400" y1="375" x2="400" y2="304" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            </g>
            
            <!-- Fc (Inclined, pushing normal to hypotenuse) -->
            <g clip-path="url(#clip-fc-path)">
                <line x1="450" y1="125" x2="402.5" y2="196.25" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            </g>

            <!-- Force Labels (Fade out when pressure labels appear) -->
            <g class="fade-in-2" font-family="Inter" font-size="16" font-weight="bold" fill="#FF3366">
                <text x="175" y="205" text-anchor="end">F<tspan baseline-shift="sub" font-size="0.7em">b</tspan></text>
                <text x="410" y="390">F<tspan baseline-shift="sub" font-size="0.7em">a</tspan></text>
                <text x="460" y="120">F<tspan baseline-shift="sub" font-size="0.7em">c</tspan></text>
            </g>

            <!-- ================= STAGE 3: Force Components ================= -->
            <!-- Fcx (Horizontal component of Fc, pushing left) -->
            <g clip-path="url(#clip-fcx-path)">
                <line x1="400" y1="200" x2="354" y2="200" stroke="#FF3366" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-red-dash)"/>
            </g>
            
            <!-- Fcy (Vertical component of Fc, pushing down) -->
            <g clip-path="url(#clip-fcy-path)">
                <line x1="400" y1="200" x2="400" y2="271" stroke="#FF3366" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-red-dash)"/>
            </g>

            <!-- ================= STAGE 4 & 5: Equations Sidebar ================= -->
            <!-- Sidebar Background -->
            <rect x="595" y="40" width="185" height="420" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" rx="8" />
            
            <!-- Block 1: Equilibrium -->
            <text class="fade-in-3" font-family="Roboto Mono" font-size="13" fill="#1A202C">
                <tspan x="605" y="70" font-family="Inter" font-weight="bold" fill="#4361EE">1. Equilibrium</tspan>
                <tspan x="605" y="95">ΣF<tspan dy="3" font-size="10">x</tspan><tspan dy="-3"> = 0</tspan></tspan>
                <tspan x="605" y="115">⇒ F<tspan dy="3" font-size="10">b</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">·sin(θ)</tspan></tspan>
                
                <tspan x="605" y="145">ΣF<tspan dy="3" font-size="10">y</tspan><tspan dy="-3"> = 0</tspan></tspan>
                <tspan x="605" y="165">⇒ F<tspan dy="3" font-size="10">a</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">·cos(θ)</tspan></tspan>
            </text>

            <!-- Block 2: Geometry -->
            <text class="fade-in-4" font-family="Roboto Mono" font-size="13" fill="#1A202C">
                <tspan x="605" y="205" font-family="Inter" font-weight="bold" fill="#4361EE">2. Geometry</tspan>
                <tspan x="605" y="230">sin(θ) = A<tspan dy="3" font-size="10">b</tspan><tspan dy="-3"> / A</tspan><tspan dy="3" font-size="10">c</tspan></tspan>
                <tspan x="605" y="255">cos(θ) = A<tspan dy="3" font-size="10">a</tspan><tspan dy="-3"> / A</tspan><tspan dy="3" font-size="10">c</tspan></tspan>
            </text>

            <!-- Block 3: Substitution & Pressure -->
            <text class="fade-in-5" font-family="Roboto Mono" font-size="13" fill="#1A202C">
                <tspan x="605" y="295" font-family="Inter" font-weight="bold" fill="#4361EE">3. Substitution</tspan>
                <tspan x="605" y="320">F<tspan dy="3" font-size="10">b</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">·(A</tspan><tspan dy="3" font-size="10">b</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">)</tspan></tspan>
                <tspan x="605" y="340">F<tspan dy="3" font-size="10">b</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">b</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3"> ⇒ P</tspan><tspan dy="3" font-size="10">b</tspan><tspan dy="-3"> = P</tspan><tspan dy="3" font-size="10">c</tspan></tspan>
                
                <tspan x="605" y="375">F<tspan dy="3" font-size="10">a</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">·(A</tspan><tspan dy="3" font-size="10">a</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">)</tspan></tspan>
                <tspan x="605" y="395">F<tspan dy="3" font-size="10">a</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">a</tspan><tspan dy="-3"> = F</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3">/A</tspan><tspan dy="3" font-size="10">c</tspan><tspan dy="-3"> ⇒ P</tspan><tspan dy="3" font-size="10">a</tspan><tspan dy="-3"> = P</tspan><tspan dy="3" font-size="10">c</tspan></tspan>
            </text>

            <!-- Pressure Labels (Replaces Force Labels) -->
            <g class="fade-in-5" font-family="Inter" font-size="16" font-weight="bold" fill="#7209B7">
                <text x="175" y="205" text-anchor="end">P<tspan baseline-shift="sub" font-size="0.7em">b</tspan>·A<tspan baseline-shift="sub" font-size="0.7em">b</tspan></text>
                <text x="410" y="390">P<tspan baseline-shift="sub" font-size="0.7em">a</tspan>·A<tspan baseline-shift="sub" font-size="0.7em">a</tspan></text>
                <text x="460" y="120">P<tspan baseline-shift="sub" font-size="0.7em">c</tspan>·A<tspan baseline-shift="sub" font-size="0.7em">c</tspan></text>
            </g>

            <!-- ================= STAGE 6: Final Conclusion ================= -->
            <g class="fade-in-6">
                <rect x="270" y="215" width="160" height="45" rx="8" fill="#ffffff" stroke="#7209B7" stroke-width="2" />
                <text x="350" y="244" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#7209B7">
                    P<tspan dy="4" font-size="12">a</tspan><tspan dy="-4"> = P</tspan><tspan dy="4" font-size="12">b</tspan><tspan dy="-4"> = P</tspan><tspan dy="4" font-size="12">c</tspan>
                </text>
            </g>

            <!-- ================= LEGEND & CONTROLS ================= -->
            <!-- Legend Box -->
            <rect x="55" y="375" width="180" height="70" fill="#ffffff" fill-opacity="0.9" rx="6" stroke="#e2e8f0"/>
            <line x1="65" y1="395" x2="95" y2="395" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            <text x="110" y="400" font-family="Inter" font-size="12" fill="#4A5568">Applied Force</text>
            
            <line x1="65" y1="425" x2="95" y2="425" stroke="#FF3366" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow-red-dash)"/>
            <text x="110" y="430" font-family="Inter" font-size="12" fill="#4A5568">Force Component</text>

            <!-- Play/Pause Button -->
            <g class="btn-hover" cursor="pointer" onclick="toggleAnimation()">
                <rect x="440" y="415" width="120" height="32" rx="16" fill="#4361EE" />
                <text x="500" y="436" text-anchor="middle" font-family="Inter" font-size="13" font-weight="600" fill="#ffffff">Pause / Play</text>
            </g>

        </svg>
    </div>

    <script>
        function toggleAnimation() {
            const svg = document.getElementById('pascal-diagram');
            svg.classList.toggle('paused');
        }
    </script>
</body>
</html>
