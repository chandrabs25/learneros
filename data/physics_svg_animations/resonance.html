<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance in Series LCR Circuit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .title {
            font-weight: 700;
            font-size: 22px;
            fill: #212529;
            text-anchor: middle;
        }

        .panel-title {
            font-weight: 600;
            font-size: 14px;
            fill: #495057;
            text-anchor: middle;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        .axis-label {
            font-size: 12px;
            fill: #495057;
        }

        .component-label {
            font-size: 16px;
            font-weight: 600;
            fill: #212529;
        }

        .dynamic-text {
            font-weight: 700;
            font-size: 13px;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <defs>
        <!-- Arrowhead Markers -->
        <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 z" fill="#FF3366" />
        </marker>
        <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 z" fill="#4361EE" />
        </marker>
        <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 z" fill="#06D6A0" />
        </marker>
        <marker id="arrowYellow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 z" fill="#FFD166" />
        </marker>
        <marker id="arrowBlack" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
            <path d="M 0 0 L 8 4 L 0 8 z" fill="#212529" />
        </marker>

        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.05" />
        </filter>
    </defs>

    <!-- Main Title -->
    <text x="400" y="40" class="title">Resonance in Series LCR Circuit</text>

    <!-- Panel Backgrounds -->
    <rect x="30" y="70" width="220" height="360" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
    <rect x="270" y="70" width="250" height="360" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />
    <rect x="540" y="70" width="230" height="360" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)" />

    <!-- Panel Titles -->
    <text x="140" y="100" class="panel-title">Circuit Schematic</text>
    <text x="395" y="100" class="panel-title">Phasor Diagram</text>
    <text x="655" y="100" class="panel-title">Resonance Curve</text>

    <!-- ========================================== -->
    <!-- PANEL A: CIRCUIT SCHEMATIC                 -->
    <!-- ========================================== -->
    <g transform="translate(-10, 0)">
        <!-- AC Source -->
        <circle cx="140" cy="300" r="20" fill="none" stroke="#6C757D" stroke-width="3" />
        <path d="M 128 300 Q 134 290 140 300 T 152 300" fill="none" stroke="#6C757D" stroke-width="2" />
        <text x="105" y="305" class="component-label" text-anchor="end">~</text>

        <!-- Wires and Components -->
        <!-- Wire Up -->
        <line x1="140" y1="280" x2="140" y2="160" stroke="#6C757D" stroke-width="3" />
        <line x1="140" y1="160" x2="155" y2="160" stroke="#6C757D" stroke-width="3" />
        
        <!-- Inductor (L) -->
        <path d="M 155 160 a 9 9 0 1 1 18 0 a 9 9 0 1 1 18 0 a 9 9 0 1 1 18 0" fill="none" stroke="#6C757D" stroke-width="3" />
        <text x="182" y="140" class="component-label" text-anchor="middle">L</text>
        
        <!-- Wire to Capacitor -->
        <line x1="209" y1="160" x2="230" y2="160" stroke="#6C757D" stroke-width="3" />
        <line x1="230" y1="160" x2="230" y2="210" stroke="#6C757D" stroke-width="3" />
        
        <!-- Capacitor (C) -->
        <line x1="215" y1="210" x2="245" y2="210" stroke="#6C757D" stroke-width="3" />
        <line x1="215" y1="220" x2="245" y2="220" stroke="#6C757D" stroke-width="3" />
        <text x="255" y="220" class="component-label">C</text>
        
        <!-- Wire to Resistor -->
        <line x1="230" y1="220" x2="230" y2="260" stroke="#6C757D" stroke-width="3" />
        <line x1="230" y1="260" x2="210" y2="260" stroke="#6C757D" stroke-width="3" />
        
        <!-- Resistor (R) -->
        <path d="M 210 260 l -5 -10 l -10 20 l -10 -20 l -10 20 l -10 -20 l -5 10" fill="none" stroke="#6C757D" stroke-width="3" stroke-linejoin="round" />
        <text x="180" y="295" class="component-label" text-anchor="middle">R</text>
        
        <!-- Wire back to Source -->
        <line x1="160" y1="260" x2="140" y2="260" stroke="#6C757D" stroke-width="3" />
        <line x1="140" y1="260" x2="140" y2="280" stroke="#6C757D" stroke-width="3" />
    </g>

    <!-- ========================================== -->
    <!-- PANEL B: PHASOR DIAGRAM                    -->
    <!-- ========================================== -->
    <!-- Axes -->
    <line x1="290" y1="260" x2="500" y2="260" stroke="#e9ecef" stroke-width="2" />
    <line x1="395" y1="130" x2="395" y2="390" stroke="#e9ecef" stroke-width="2" />

    <!-- Dynamic Text Box -->
    <rect x="315" y="115" width="160" height="26" rx="4" fill="#f8f9fa" stroke="#e9ecef" />
    
    <!-- Capacitive State Text -->
    <text x="395" y="133" class="math-text dynamic-text" fill="#4361EE" text-anchor="middle">
        X<tspan baseline-shift="sub" font-size="0.7em">C</tspan> &gt; X<tspan baseline-shift="sub" font-size="0.7em">L</tspan> (Capacitive)
        <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.44; 0.45; 1" dur="10s" repeatCount="indefinite" />
    </text>
    
    <!-- Resonance State Text -->
    <text x="395" y="133" class="math-text dynamic-text" fill="#06D6A0" text-anchor="middle" opacity="0">
        X<tspan baseline-shift="sub" font-size="0.7em">C</tspan> = X<tspan baseline-shift="sub" font-size="0.7em">L</tspan> (Resonance)
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.44; 0.45; 0.55; 0.56; 1" dur="10s" repeatCount="indefinite" />
    </text>
    
    <!-- Inductive State Text -->
    <text x="395" y="133" class="math-text dynamic-text" fill="#FF3366" text-anchor="middle" opacity="0">
        X<tspan baseline-shift="sub" font-size="0.7em">L</tspan> &gt; X<tspan baseline-shift="sub" font-size="0.7em">C</tspan> (Inductive)
        <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.55; 0.56; 1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- Phasor Vectors -->
    <!-- VR (Green) -->
    <line x1="395" y1="260" x2="428" y2="260" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrowGreen)">
        <animate attributeName="x2" values="423; 445; 484; 515; 515; 484; 445; 423" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </line>
    
    <!-- Current I (Yellow Dashed) -->
    <line x1="395" y1="260" x2="428" y2="260" stroke="#FFD166" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowYellow)">
        <animate attributeName="x2" values="423; 445; 484; 515; 515; 484; 445; 423" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </line>

    <!-- VL (Red) -->
    <line x1="395" y1="260" x2="395" y2="239" stroke="#FF3366" stroke-width="4" marker-end="url(#arrowRed)">
        <animate attributeName="y2" values="249; 230; 189; 140; 140; 149; 176; 191" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </line>

    <!-- VC (Blue) -->
    <line x1="395" y1="260" x2="395" y2="319" stroke="#4361EE" stroke-width="4" marker-end="url(#arrowBlue)">
        <animate attributeName="y2" values="329; 344; 371; 380; 380; 331; 290; 271" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </line>

    <!-- Phasor Labels -->
    <text x="375" y="239" font-size="14" font-weight="600" fill="#FF3366">
        V<tspan baseline-shift="sub" font-size="0.7em">L</tspan>
        <animate attributeName="y" values="239; 220; 179; 130; 130; 139; 166; 181" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </text>

    <text x="375" y="319" font-size="14" font-weight="600" fill="#4361EE">
        V<tspan baseline-shift="sub" font-size="0.7em">C</tspan>
        <animate attributeName="y" values="349; 364; 391; 400; 400; 351; 310; 291" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </text>

    <text x="428" y="250" font-size="14" font-weight="600" fill="#06D6A0">
        V<tspan baseline-shift="sub" font-size="0.7em">R</tspan>
        <animate attributeName="x" values="433; 455; 494; 525; 525; 494; 455; 433" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </text>

    <text x="428" y="275" font-size="14" font-weight="600" fill="#FFD166">
        I
        <animate attributeName="x" values="433; 455; 494; 525; 525; 494; 455; 433" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </text>

    <!-- ========================================== -->
    <!-- PANEL C: RESONANCE CURVE                   -->
    <!-- ========================================== -->
    <!-- Axes -->
    <line x1="560" y1="380" x2="750" y2="380" stroke="#212529" stroke-width="2" marker-end="url(#arrowBlack)" />
    <line x1="560" y1="380" x2="560" y2="140" stroke="#212529" stroke-width="2" marker-end="url(#arrowBlack)" />

    <!-- Axis Labels -->
    <text x="655" y="415" class="axis-label" text-anchor="middle">Angular Frequency ω</text>
    <text x="545" y="260" class="axis-label" text-anchor="middle" transform="rotate(-90 545 260)">Current I<tspan baseline-shift="sub" font-size="0.7em">rms</tspan></text>

    <!-- Peak Line -->
    <line x1="655" y1="380" x2="655" y2="160" stroke="#adb5bd" stroke-dasharray="4" stroke-width="2" />
    <text x="655" y="130" class="math-text" font-size="12" fill="#495057" text-anchor="middle">ω₀ = 1/√(LC)</text>

    <!-- Resonance Curve Path -->
    <path d="M 560 334 C 580 310, 600 240, 621 212 C 635 190, 643 160, 655 160 C 667 160, 675 190, 689 212 C 710 240, 730 310, 750 334" fill="none" stroke="#7209B7" stroke-width="3" stroke-linecap="round" />

    <!-- Moving Indicator Dot -->
    <circle cx="560" cy="334" r="6" fill="#FF3366">
        <animate attributeName="cx" values="560; 591; 621; 655; 655; 689; 720; 750" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
        <animate attributeName="cy" values="334; 296; 212; 160; 160; 212; 296; 334" keyTimes="0; 0.15; 0.3; 0.45; 0.55; 0.7; 0.85; 1" dur="10s" repeatCount="indefinite" />
    </circle>

    <!-- ========================================== -->
    <!-- LEGEND                                     -->
    <!-- ========================================== -->
    <g transform="translate(110, 460)">
        <!-- VL -->
        <line x1="0" y1="0" x2="20" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)" />
        <text x="35" y="4" font-size="12" fill="#495057">V<tspan baseline-shift="sub" font-size="0.7em">L</tspan> (Inductive)</text>
        
        <!-- VC -->
        <line x1="140" y1="0" x2="160" y2="0" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)" />
        <text x="175" y="4" font-size="12" fill="#495057">V<tspan baseline-shift="sub" font-size="0.7em">C</tspan> (Capacitive)</text>
        
        <!-- VR -->
        <line x1="290" y1="0" x2="310" y2="0" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)" />
        <text x="325" y="4" font-size="12" fill="#495057">V<tspan baseline-shift="sub" font-size="0.7em">R</tspan> (Resistive)</text>
        
        <!-- Current -->
        <line x1="430" y1="0" x2="450" y2="0" stroke="#FFD166" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrowYellow)" />
        <text x="465" y="4" font-size="12" fill="#495057">Current (I)</text>
    </g>

</svg>

</body>
</html>
