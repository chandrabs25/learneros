<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ohm's Law: Linearity, Limitations, and AC Phase</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        text {
            fill: #212529;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        @keyframes electron-drift {
            0% { transform: translateX(0); animation-timing-function: ease-in; }
            33.33% { transform: translateX(-100px); animation-timing-function: linear; }
            58.33% { transform: translateX(-250px); animation-timing-function: ease-in-out; }
            62.5% { transform: translateX(-270px); animation-timing-function: ease-in-out; }
            70.83% { transform: translateX(-230px); animation-timing-function: ease-in-out; }
            79.16% { transform: translateX(-270px); animation-timing-function: ease-in-out; }
            87.5% { transform: translateX(-230px); animation-timing-function: ease-in-out; }
            95.83% { transform: translateX(-270px); animation-timing-function: ease-in-out; }
            100% { transform: translateX(-250px); }
        }

        @keyframes e-field-grow {
            0% { transform: scaleX(0); }
            33.33% { transform: scaleX(1); }
            58.33% { transform: scaleX(1.75); }
            62.5% { transform: scaleX(1); }
            70.83% { transform: scaleX(-1); }
            79.16% { transform: scaleX(1); }
            87.5% { transform: scaleX(-1); }
            95.83% { transform: scaleX(1); }
            100% { transform: scaleX(0); }
        }

        @keyframes draw-vi {
            0% { stroke-dashoffset: 450; }
            33.33% { stroke-dashoffset: 183.33; }
            58.33% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes draw-ac-wave {
            0%, 58.33% { stroke-dashoffset: 350; opacity: 0; }
            58.34% { opacity: 1; stroke-dashoffset: 350; }
            80%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }

        @keyframes fade-dc {
            0%, 50% { opacity: 1; }
            58.33%, 100% { opacity: 0.15; }
        }

        @keyframes fade-ac {
            0%, 55% { opacity: 0.15; }
            58.33%, 100% { opacity: 1; }
        }

        @keyframes ion-heat {
            0%, 33.33% { fill: #4361EE; }
            58.33%, 100% { fill: #FF3366; }
        }

        @keyframes ion-vibrate {
            0% { transform: translate(0, 0); }
            25% { transform: translate(0.5px, -0.5px); }
            50% { transform: translate(-0.5px, 0.5px); }
            75% { transform: translate(0.5px, 0.5px); }
            100% { transform: translate(0, 0); }
        }

        @keyframes show-phase1 { 0%, 33.33% { opacity: 1; } 34%, 100% { opacity: 0; } }
        @keyframes show-phase2 { 0%, 33.33% { opacity: 0; } 34%, 58.33% { opacity: 1; } 59%, 100% { opacity: 0; } }
        @keyframes show-phase3 { 0%, 58.33% { opacity: 0; } 59%, 100% { opacity: 1; } }

        /* Class Assignments */
        .electron-group { animation: electron-drift 12s infinite; }
        .e-field { animation: e-field-grow 12s infinite; transform-origin: 200px 220px; }
        .vi-curve { animation: draw-vi 12s infinite linear; stroke-dasharray: 450; }
        .ac-wave { animation: draw-ac-wave 12s infinite linear; stroke-dasharray: 350; }
        .dc-element { animation: fade-dc 12s infinite; }
        .ac-element { animation: fade-ac 12s infinite; }
        .ion { animation: ion-heat 12s infinite, ion-vibrate 0.1s infinite linear; }
        
        .label-p1 { animation: show-phase1 12s infinite; }
        .label-p2 { animation: show-phase2 12s infinite; }
        .label-p3 { animation: show-phase3 12s infinite; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions -->
    <defs>
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
        </marker>
        <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#212529" />
        </marker>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
        </marker>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dee2e6" stroke-width="1"/>
        </pattern>
        <clipPath id="wire-clip">
            <rect x="40" y="70" width="320" height="120" rx="8" />
        </clipPath>
    </defs>

    <!-- Background Grids -->
    <rect x="420" y="60" width="340" height="400" fill="url(#grid)" class="dc-element" />
    <rect x="40" y="270" width="320" height="200" fill="url(#grid)" class="ac-element" />

    <!-- Dividers -->
    <line x1="400" y1="60" x2="400" y2="480" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,6" />
    <line x1="20" y1="250" x2="380" y2="250" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,6" />

    <!-- Title -->
    <text x="400" y="35" font-size="22" font-weight="700" text-anchor="middle">Ohm's Law: Linearity, Limitations, and AC Phase</text>

    <!-- ========================================== -->
    <!-- ZONE A: Microscopic Conductor (Top Left)   -->
    <!-- ========================================== -->
    <g transform="translate(0, 0)">
        <text x="40" y="60" font-size="14" font-weight="600">Microscopic View: Electron Drift</text>
        
        <!-- Wire Outline -->
        <rect x="40" y="70" width="320" height="120" fill="#f8f9fa" stroke="#adb5bd" stroke-width="3" rx="8" />
        
        <!-- Ions & Electrons (Clipped to wire) -->
        <g clip-path="url(#wire-clip)">
            <!-- Electrons (Moving Group) -->
            <g class="electron-group">
                <!-- Scattered electrons from x=40 to x=680 to allow continuous flow when shifted left -->
                <circle cx="70" cy="85" r="3.5" fill="#06D6A0" />
                <circle cx="110" cy="115" r="3.5" fill="#06D6A0" />
                <circle cx="150" cy="90" r="3.5" fill="#06D6A0" />
                <circle cx="190" cy="135" r="3.5" fill="#06D6A0" />
                <circle cx="230" cy="80" r="3.5" fill="#06D6A0" />
                <circle cx="270" cy="125" r="3.5" fill="#06D6A0" />
                <circle cx="310" cy="100" r="3.5" fill="#06D6A0" />
                <circle cx="350" cy="145" r="3.5" fill="#06D6A0" />
                <circle cx="390" cy="85" r="3.5" fill="#06D6A0" />
                <circle cx="430" cy="115" r="3.5" fill="#06D6A0" />
                <circle cx="470" cy="90" r="3.5" fill="#06D6A0" />
                <circle cx="510" cy="135" r="3.5" fill="#06D6A0" />
                <circle cx="550" cy="80" r="3.5" fill="#06D6A0" />
                <circle cx="590" cy="125" r="3.5" fill="#06D6A0" />
                <circle cx="630" cy="100" r="3.5" fill="#06D6A0" />
                <circle cx="670" cy="145" r="3.5" fill="#06D6A0" />
                
                <circle cx="90" cy="160" r="3.5" fill="#06D6A0" />
                <circle cx="130" cy="175" r="3.5" fill="#06D6A0" />
                <circle cx="170" cy="155" r="3.5" fill="#06D6A0" />
                <circle cx="210" cy="180" r="3.5" fill="#06D6A0" />
                <circle cx="250" cy="165" r="3.5" fill="#06D6A0" />
                <circle cx="290" cy="150" r="3.5" fill="#06D6A0" />
                <circle cx="330" cy="170" r="3.5" fill="#06D6A0" />
                <circle cx="370" cy="160" r="3.5" fill="#06D6A0" />
                <circle cx="410" cy="175" r="3.5" fill="#06D6A0" />
                <circle cx="450" cy="155" r="3.5" fill="#06D6A0" />
                <circle cx="490" cy="180" r="3.5" fill="#06D6A0" />
                <circle cx="530" cy="165" r="3.5" fill="#06D6A0" />
                <circle cx="570" cy="150" r="3.5" fill="#06D6A0" />
                <circle cx="610" cy="170" r="3.5" fill="#06D6A0" />
                <circle cx="650" cy="160" r="3.5" fill="#06D6A0" />
            </g>

            <!-- Fixed Ion Lattice -->
            <g>
                <!-- Row 1 -->
                <circle cx="60" cy="90" r="8" class="ion" />
                <circle cx="100" cy="90" r="8" class="ion" />
                <circle cx="140" cy="90" r="8" class="ion" />
                <circle cx="180" cy="90" r="8" class="ion" />
                <circle cx="220" cy="90" r="8" class="ion" />
                <circle cx="260" cy="90" r="8" class="ion" />
                <circle cx="300" cy="90" r="8" class="ion" />
                <circle cx="340" cy="90" r="8" class="ion" />
                <!-- Row 2 -->
                <circle cx="60" cy="130" r="8" class="ion" />
                <circle cx="100" cy="130" r="8" class="ion" />
                <circle cx="140" cy="130" r="8" class="ion" />
                <circle cx="180" cy="130" r="8" class="ion" />
                <circle cx="220" cy="130" r="8" class="ion" />
                <circle cx="260" cy="130" r="8" class="ion" />
                <circle cx="300" cy="130" r="8" class="ion" />
                <circle cx="340" cy="130" r="8" class="ion" />
                <!-- Row 3 -->
                <circle cx="60" cy="170" r="8" class="ion" />
                <circle cx="100" cy="170" r="8" class="ion" />
                <circle cx="140" cy="170" r="8" class="ion" />
                <circle cx="180" cy="170" r="8" class="ion" />
                <circle cx="220" cy="170" r="8" class="ion" />
                <circle cx="260" cy="170" r="8" class="ion" />
                <circle cx="300" cy="170" r="8" class="ion" />
                <circle cx="340" cy="170" r="8" class="ion" />
            </g>
        </g>

        <!-- Vectors -->
        <path d="M 120 220 L 280 220" stroke="#F77F00" stroke-width="4" marker-end="url(#arrow-orange)" class="e-field" />
        <text x="200" y="210" font-size="16" font-weight="700" fill="#F77F00" text-anchor="middle" class="math">E-Field (V)</text>
        
        <path d="M 280 240 L 120 240" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)" class="dc-element" />
        <text x="200" y="255" font-size="14" font-weight="700" fill="#06D6A0" text-anchor="middle" class="math dc-element">Electron Flow</text>

        <!-- Legend A -->
        <rect x="250" y="5" width="130" height="55" fill="#ffffff" stroke="#dee2e6" rx="4" />
        <circle cx="265" cy="20" r="5" fill="#4361EE" />
        <text x="280" y="24" font-size="11">Ion Lattice</text>
        <circle cx="265" cy="40" r="3.5" fill="#06D6A0" />
        <text x="280" y="44" font-size="11">Electron (e⁻)</text>
    </g>

    <!-- ========================================== -->
    <!-- ZONE B: Dynamic V-I Graph (Right Side)     -->
    <!-- ========================================== -->
    <g transform="translate(0, 0)" class="dc-element">
        <text x="420" y="60" font-size="14" font-weight="600">Macroscopic View: V-I Relationship</text>
        
        <!-- Axes -->
        <path d="M 460 60 L 460 440 L 760 440" fill="none" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)" marker-start="url(#arrow-black)" />
        <text x="440" y="70" font-size="14" font-weight="700" class="math">V</text>
        <text x="750" y="465" font-size="14" font-weight="700" class="math">I</text>
        
        <!-- Ideal Ohm's Law Line -->
        <path d="M 460 440 L 700 120" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8,4" />
        <text x="680" y="110" font-size="12" fill="#6c757d" class="math">Ideal (V=IR)</text>

        <!-- Real V-I Curve -->
        <!-- Line from 460,440 to 620,226.66 (Length ~266.66) -->
        <!-- Curve from 620,226.66 to 690,60 via 660,173.33 (Length ~180) -->
        <path d="M 460 440 L 620 226.66 Q 660 173.33 690 60" fill="none" stroke="#FF3366" stroke-width="4" stroke-linecap="round" class="vi-curve" />

        <!-- Dynamic Labels -->
        <g transform="translate(480, 120)">
            <rect x="0" y="0" width="240" height="60" fill="#ffffff" stroke="#dee2e6" rx="6" opacity="0.9"/>
            
            <!-- Phase 1 Text -->
            <g class="label-p1">
                <text x="120" y="25" font-size="14" font-weight="700" fill="#06D6A0" text-anchor="middle">Phase 1: Linear Region</text>
                <text x="120" y="45" font-size="13" class="math" text-anchor="middle">V ∝ I (R is constant)</text>
            </g>
            
            <!-- Phase 2 Text -->
            <g class="label-p2">
                <text x="120" y="25" font-size="14" font-weight="700" fill="#FF3366" text-anchor="middle">Phase 2: Thermal Limit</text>
                <text x="120" y="45" font-size="13" class="math" text-anchor="middle">Heat increases R</text>
            </g>
        </g>
    </g>

    <!-- ========================================== -->
    <!-- ZONE C: AC Phase Relationship (Bottom L)   -->
    <!-- ========================================== -->
    <g transform="translate(0, 0)" class="ac-element">
        <text x="40" y="290" font-size="14" font-weight="600">AC Phase: Voltage &amp; Current</text>
        
        <!-- Axes -->
        <path d="M 40 290 L 40 450" fill="none" stroke="#212529" stroke-width="2" marker-start="url(#arrow-black)" />
        <path d="M 40 370 L 360 370" fill="none" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)" />
        <text x="25" y="300" font-size="12" font-weight="700" class="math">Mag</text>
        <text x="350" y="390" font-size="12" font-weight="700" class="math">t</text>

        <!-- Sine Waves -->
        <!-- Voltage Wave (Orange) Amp=70, W=75 -->
        <path d="M 40 370 c 25 -93.3, 50 -93.3, 75 0 c 25 93.3, 50 93.3, 75 0 c 25 -93.3, 50 -93.3, 75 0 c 25 93.3, 50 93.3, 75 0" 
              fill="none" stroke="#F77F00" stroke-width="3" class="ac-wave" />
              
        <!-- Current Wave (Green) Amp=40, W=75 -->
        <path d="M 40 370 c 25 -53.3, 50 -53.3, 75 0 c 25 53.3, 50 53.3, 75 0 c 25 -53.3, 50 -53.3, 75 0 c 25 53.3, 50 53.3, 75 0" 
              fill="none" stroke="#06D6A0" stroke-width="3" class="ac-wave" />

        <!-- Zero Phase Shift Marker -->
        <line x1="115" y1="290" x2="115" y2="450" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4,4" />
        <line x1="190" y1="290" x2="190" y2="450" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4,4" />
        <text x="195" y="445" font-size="11" fill="#495057" class="math">Δφ = 0°</text>

        <!-- Legend C -->
        <rect x="220" y="275" width="130" height="55" fill="#ffffff" stroke="#dee2e6" rx="4" />
        <line x1="230" y1="290" x2="250" y2="290" stroke="#F77F00" stroke-width="3" />
        <text x="260" y="294" font-size="11" class="math">v(t) = V_m sin(ωt)</text>
        <line x1="230" y1="310" x2="250" y2="310" stroke="#06D6A0" stroke-width="3" />
        <text x="260" y="314" font-size="11" class="math">i(t) = I_m sin(ωt)</text>
    </g>

    <!-- Global Phase 3 Label in Center Right -->
    <g transform="translate(480, 240)" class="label-p3">
        <rect x="0" y="0" width="240" height="60" fill="#ffffff" stroke="#dee2e6" rx="6" opacity="0.9"/>
        <text x="120" y="25" font-size="14" font-weight="700" fill="#7209B7" text-anchor="middle">Phase 3: AC Mode</text>
        <text x="120" y="45" font-size="13" class="math" text-anchor="middle">V and I remain in phase</text>
    </g>

</svg>

</body>
</html>
