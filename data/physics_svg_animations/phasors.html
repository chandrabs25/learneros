<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phasor Representation of AC</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono&display=swap');

        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            background-color: #f8f9fa;
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* CSS Animations */
        @keyframes rotate-ccw {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes rotate-cw {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotate-ccw-half {
            from { transform: rotate(0deg); }
            to { transform: rotate(-180deg); }
        }

        @keyframes rotate-cw-half {
            from { transform: rotate(0deg); }
            to { transform: rotate(180deg); }
        }

        @keyframes scroll-left {
            from { transform: translateX(0); }
            to { transform: translateX(-300px); }
        }

        @keyframes draw-arc {
            from { stroke-dashoffset: 188.5; }
            to { stroke-dashoffset: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#94A3B8" />
            </marker>

            <!-- Clip Paths -->
            <clipPath id="graph-window">
                <rect x="400" y="0" width="350" height="500" />
            </clipPath>
            <clipPath id="proj-window">
                <rect x="0" y="0" width="400" height="500" />
            </clipPath>
        </defs>

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#0F172A">Phasor Representation of Alternating Current</text>

        <!-- Grid Lines for Graph -->
        <g stroke="#E2E8F0" stroke-width="1" stroke-dasharray="2,2">
            <line x1="400" y1="130" x2="750" y2="130" />
            <line x1="400" y1="370" x2="750" y2="370" />
            <line x1="475" y1="100" x2="475" y2="400" />
            <line x1="550" y1="100" x2="550" y2="400" />
            <line x1="625" y1="100" x2="625" y2="400" />
            <line x1="700" y1="100" x2="700" y2="400" />
        </g>

        <!-- Axes -->
        <g stroke="#94A3B8" stroke-width="1.5">
            <!-- Phasor Plane Axes -->
            <line x1="50" y1="250" x2="350" y2="250" marker-end="url(#arrow-axis)" />
            <line x1="200" y1="400" x2="200" y2="100" marker-end="url(#arrow-axis)" />
            <!-- Time Domain Axes -->
            <line x1="400" y1="250" x2="750" y2="250" marker-end="url(#arrow-axis)" />
            <line x1="400" y1="400" x2="400" y2="100" marker-end="url(#arrow-axis)" />
        </g>

        <!-- Axis Labels -->
        <text x="340" y="240" font-size="12" fill="#64748B" font-style="italic">Re</text>
        <text x="210" y="110" font-size="12" fill="#64748B" font-style="italic">Im</text>
        <text x="740" y="270" font-size="14" fill="#64748B" class="math">ωt</text>
        <text x="410" y="110" font-size="14" fill="#64748B" class="math">v, i</text>

        <!-- Phasor Trajectory Circles -->
        <circle cx="200" cy="250" r="120" fill="none" stroke="#FF3366" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />
        <circle cx="200" cy="250" r="80" fill="none" stroke="#4361EE" stroke-width="1" stroke-dasharray="4,4" opacity="0.2" />

        <!-- Sine Waves (Clipped to Graph Window) -->
        <g clip-path="url(#graph-window)">
            <g style="animation: scroll-left 4s linear infinite;">
                <path id="wave-v" stroke="#FF3366" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                <path id="wave-i" stroke="#4361EE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </g>

        <!-- Projection Lines (Clipped to Left Side) -->
        <g clip-path="url(#proj-window)">
            <!-- Voltage Projection -->
            <g style="transform-origin: 200px 250px; animation: rotate-ccw 4s linear infinite;">
                <g style="transform: translate(320px, 250px);">
                    <line x1="0" y1="0" x2="400" y2="0" stroke="#FF3366" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" style="animation: rotate-cw 4s linear infinite; transform-origin: 0 0;" />
                </g>
            </g>
            <!-- Current Projection -->
            <g style="transform-origin: 200px 250px; animation: rotate-ccw 4s linear infinite;">
                <g style="transform: translate(280px, 250px);">
                    <line x1="0" y1="0" x2="400" y2="0" stroke="#4361EE" stroke-width="1" stroke-dasharray="5,5" opacity="0.5" style="animation: rotate-cw 4s linear infinite; transform-origin: 0 0;" />
                </g>
            </g>
        </g>

        <!-- Phasors -->
        <g style="transform-origin: 200px 250px; animation: rotate-ccw 4s linear infinite;">
            <!-- Voltage Phasor -->
            <line x1="200" y1="250" x2="320" y2="250" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-v)" />
            <!-- Current Phasor -->
            <line x1="200" y1="250" x2="280" y2="250" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-i)" />
        </g>

        <!-- Phasor Labels (Counter-rotating to stay upright) -->
        <!-- Voltage Label -->
        <g style="transform-origin: 200px 250px; animation: rotate-ccw 4s linear infinite;">
            <g style="transform: translate(320px, 250px);">
                <g style="animation: rotate-cw 4s linear infinite; transform-origin: 0 0;">
                    <text x="12" y="-12" fill="#FF3366" font-weight="bold" font-size="16" class="math">V<tspan dy="4" font-size="0.7em">m</tspan></text>
                </g>
            </g>
        </g>
        <!-- Current Label -->
        <g style="transform-origin: 200px 250px; animation: rotate-ccw 4s linear infinite;">
            <g style="transform: translate(280px, 250px);">
                <g style="animation: rotate-cw 4s linear infinite; transform-origin: 0 0;">
                    <text x="12" y="24" fill="#4361EE" font-weight="bold" font-size="16" class="math">I<tspan dy="4" font-size="0.7em">m</tspan></text>
                </g>
            </g>
        </g>

        <!-- Angle Arc and Label -->
        <circle cx="200" cy="250" r="30" fill="none" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="188.5" style="transform-origin: 200px 250px; transform: scaleY(-1); animation: draw-arc 4s linear infinite;" />
        <g style="transform-origin: 200px 250px; animation: rotate-ccw-half 4s linear infinite;">
            <g style="transform: translate(245px, 250px);">
                <g style="animation: rotate-cw-half 4s linear infinite; transform-origin: 0 0;">
                    <text x="0" y="5" font-size="14" fill="#1E293B" class="math" text-anchor="middle">ωt</text>
                </g>
            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(50, 410)">
            <rect x="0" y="0" width="120" height="60" fill="#ffffff" rx="6" stroke="#E2E8F0" />
            <line x1="15" y1="20" x2="35" y2="20" stroke="#FF3366" stroke-width="3" />
            <text x="45" y="24" font-size="12" fill="#1E293B">Voltage (v)</text>
            <line x1="15" y1="40" x2="35" y2="40" stroke="#4361EE" stroke-width="3" />
            <text x="45" y="44" font-size="12" fill="#1E293B">Current (i)</text>
        </g>

        <!-- Equations Box -->
        <g transform="translate(560, 400)">
            <rect x="0" y="0" width="190" height="70" fill="#ffffff" rx="6" stroke="#E2E8F0" />
            <text x="15" y="28" fill="#FF3366" font-size="15" class="math">v = V<tspan dy="4" font-size="0.7em">m</tspan><tspan dy="-4"> sin(ωt)</tspan></text>
            <text x="15" y="53" fill="#4361EE" font-size="15" class="math">i = I<tspan dy="4" font-size="0.7em">m</tspan><tspan dy="-4"> sin(ωt)</tspan></text>
        </g>

    </svg>
</div>

<script>
    // Generate the static sine wave paths mathematically for perfect accuracy
    // The CSS animation will handle the scrolling to create the real-time generation effect
    const waveV = document.getElementById('wave-v');
    const waveI = document.getElementById('wave-i');
    
    function generateSineWavePath(amplitude, wavelength, startX, endX, startY) {
        let path = `M ${startX} ${startY}`;
        // Draw enough wave to cover the visible area plus one full wavelength for seamless scrolling
        for(let x = startX; x <= endX; x += 2) {
            // y = startY - A * sin(k * x)
            // Negative sign because SVG y-axis points downwards
            let y = startY - amplitude * Math.sin((2 * Math.PI / wavelength) * (x - startX));
            path += ` L ${x} ${y}`;
        }
        return path;
    }

    // Wavelength = 300px (matches the CSS scroll-left animation distance)
    // StartX = 400px, EndX = 1100px (covers the 350px window + 300px buffer for scrolling)
    waveV.setAttribute('d', generateSineWavePath(120, 300, 400, 1100, 250));
    waveI.setAttribute('d', generateSineWavePath(80, 300, 400, 1100, 250));
</script>

</body>
</html>
