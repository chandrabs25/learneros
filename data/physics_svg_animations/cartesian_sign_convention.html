<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartesian Sign Convention in Ray Optics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        :root {
            --bg: #f8f9fa;
            --surface: #ffffff;
            --text: #212529;
            --axis: #495057;
            --lens-fill: rgba(0, 180, 216, 0.15);
            --lens-stroke: #00B4D8;
            --obj: #4361EE;      /* Blue */
            --img: #FF3366;      /* Red */
            --ray: #F77F00;      /* Orange */
            --pos: #06D6A0;      /* Green */
            --neg: #FF3366;      /* Red */
            --focus: #7209B7;    /* Purple */
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--surface);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--text);
            margin-top: 0;
            margin-bottom: 5px;
            font-size: 24px;
        }

        p.subtitle {
            text-align: center;
            color: var(--axis);
            margin-bottom: 20px;
            font-size: 14px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
            background-color: var(--surface);
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        /* Typography */
        .math {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
        
        .label-bg {
            text-shadow: 2px 2px 0px var(--surface), -2px -2px 0px var(--surface), 
                         2px -2px 0px var(--surface), -2px 2px 0px var(--surface);
        }

        /* Interactive Elements */
        .lens {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .lens:hover {
            fill: rgba(0, 180, 216, 0.3);
            filter: drop-shadow(0 0 8px rgba(0, 180, 216, 0.5));
        }
        .focal-point {
            transition: all 0.3s ease;
            transform-box: fill-box;
            transform-origin: center;
        }
        .lens:hover ~ .focal-point {
            fill: var(--ray);
            transform: scale(1.8);
        }

        /* --- Animations (12s Loop) --- */
        
        /* Phase 1: Setup (0-16.6%) */
        .setup-group { animation: fadeCycle 12s infinite; }
        .incident-group { animation: slideFadeCycle 12s infinite; }
        
        /* Phase 2: Object & Ray (16.6-41.6%) */
        .object, .object-label { 
            animation: growUpCycle 12s infinite; 
            transform-origin: 200px 250px; 
        }
        .image, .image-label { 
            animation: growDownCycle 12s infinite; 
            transform-origin: 600px 250px; 
        }
        .ray { 
            stroke-dasharray: 600; 
            animation: drawRayCycle 12s infinite; 
        }

        /* Phase 3: Horizontal Convention (41.6-66.6%) */
        .arrow-u { stroke-dasharray: 210; animation: drawUCycle 12s infinite; }
        .label-u { animation: fadeUCycle 12s infinite; }
        .arrow-v { stroke-dasharray: 210; animation: drawVCycle 12s infinite; }
        .label-v { animation: fadeVCycle 12s infinite; }

        /* Phase 4: Vertical Convention (66.6-91.6%) */
        .arrow-ho { stroke-dasharray: 110; animation: drawHoCycle 12s infinite; }
        .label-ho { animation: fadeHoCycle 12s infinite; }
        .arrow-hi { stroke-dasharray: 110; animation: drawHiCycle 12s infinite; }
        .label-hi { animation: fadeHiCycle 12s infinite; }

        /* Floating Signs */
        .sign-neg-x { animation: pulseNegX 12s infinite; transform-box: fill-box; transform-origin: center; }
        .sign-pos-x { animation: pulsePosX 12s infinite; transform-box: fill-box; transform-origin: center; }
        .sign-pos-y { animation: pulsePosY 12s infinite; transform-box: fill-box; transform-origin: center; }
        .sign-neg-y { animation: pulseNegY 12s infinite; transform-box: fill-box; transform-origin: center; }

        /* Keyframes */
        @keyframes fadeCycle {
            0%, 100% { opacity: 0; }
            4%, 92% { opacity: 1; }
            96% { opacity: 0; }
        }
        @keyframes slideFadeCycle {
            0%, 4% { opacity: 0; transform: translateX(-30px); }
            10%, 92% { opacity: 1; transform: translateX(0); }
            96%, 100% { opacity: 0; }
        }
        @keyframes growUpCycle {
            0%, 16% { opacity: 0; transform: scaleY(0); }
            20%, 92% { opacity: 1; transform: scaleY(1); }
            96%, 100% { opacity: 0; }
        }
        @keyframes drawRayCycle {
            0%, 20% { opacity: 0; stroke-dashoffset: 600; }
            21% { opacity: 1; }
            35%, 92% { opacity: 1; stroke-dashoffset: 0; }
            96%, 100% { opacity: 0; }
        }
        @keyframes growDownCycle {
            0%, 35% { opacity: 0; transform: scaleY(0); }
            40%, 92% { opacity: 1; transform: scaleY(1); }
            96%, 100% { opacity: 0; }
        }
        @keyframes drawUCycle {
            0%, 41% { opacity: 0; stroke-dashoffset: 210; }
            42% { opacity: 1; }
            46%, 92% { opacity: 1; stroke-dashoffset: 0; }
            96%, 100% { opacity: 0; }
        }
        @keyframes fadeUCycle {
            0%, 46% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
            54%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; }
        }
        @keyframes drawVCycle {
            0%, 54% { opacity: 0; stroke-dashoffset: 210; }
            55% { opacity: 1; }
            59%, 92% { opacity: 1; stroke-dashoffset: 0; }
            96%, 100% { opacity: 0; }
        }
        @keyframes fadeVCycle {
            0%, 59% { opacity: 0; transform: scale(0.8); }
            63% { opacity: 1; transform: scale(1.2); }
            66%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; }
        }
        @keyframes drawHoCycle {
            0%, 66% { opacity: 0; stroke-dashoffset: 110; }
            67% { opacity: 1; }
            71%, 92% { opacity: 1; stroke-dashoffset: 0; }
            96%, 100% { opacity: 0; }
        }
        @keyframes fadeHoCycle {
            0%, 71% { opacity: 0; transform: scale(0.8); }
            75% { opacity: 1; transform: scale(1.2); }
            79%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; }
        }
        @keyframes drawHiCycle {
            0%, 79% { opacity: 0; stroke-dashoffset: 110; }
            80% { opacity: 1; }
            84%, 92% { opacity: 1; stroke-dashoffset: 0; }
            96%, 100% { opacity: 0; }
        }
        @keyframes fadeHiCycle {
            0%, 84% { opacity: 0; transform: scale(0.8); }
            88% { opacity: 1; transform: scale(1.2); }
            92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; }
        }
        
        /* Floating Signs Pulses */
        @keyframes pulseNegX {
            0%, 41% { opacity: 0.05; transform: scale(1); }
            46%, 54% { opacity: 0.6; transform: scale(1.3); }
            58%, 100% { opacity: 0.05; transform: scale(1); }
        }
        @keyframes pulsePosX {
            0%, 54% { opacity: 0.05; transform: scale(1); }
            59%, 66% { opacity: 0.6; transform: scale(1.3); }
            70%, 100% { opacity: 0.05; transform: scale(1); }
        }
        @keyframes pulsePosY {
            0%, 66% { opacity: 0.05; transform: scale(1); }
            71%, 79% { opacity: 0.6; transform: scale(1.3); }
            83%, 100% { opacity: 0.05; transform: scale(1); }
        }
        @keyframes pulseNegY {
            0%, 79% { opacity: 0.05; transform: scale(1); }
            84%, 92% { opacity: 0.6; transform: scale(1.3); }
            96%, 100% { opacity: 0.05; transform: scale(1); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cartesian Sign Convention</h1>
    <p class="subtitle">Measurements follow the direction of incident light and the Cartesian coordinate system.</p>
    
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Cartesian Sign Convention Diagram</title>
        <desc id="svgDesc">Animated diagram showing the Cartesian sign convention for a convex lens where left is negative, right is positive, up is positive, and down is negative.</desc>

        <defs>
            <!-- Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f3f5" stroke-width="1"/>
            </pattern>

            <!-- Arrowheads -->
            <marker id="arrow-obj" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--obj)" />
            </marker>
            <marker id="arrow-img" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--img)" />
            </marker>
            <marker id="arrow-pos" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--pos)" />
            </marker>
            <marker id="arrow-neg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--neg)" />
            </marker>
            <marker id="arrow-axis" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--axis)" />
            </marker>
            <marker id="arrow-ray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 0 0 L 8 4 L 0 8 z" fill="var(--ray)" />
            </marker>

            <!-- Glow Filter for Rays -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Floating Quadrant Signs -->
        <g class="floating-signs" font-family="Inter" font-weight="700" font-size="60">
            <text x="250" y="235" fill="var(--neg)" class="sign-neg-x" text-anchor="middle">−</text>
            <text x="550" y="235" fill="var(--pos)" class="sign-pos-x" text-anchor="middle">+</text>
            <text x="380" y="150" fill="var(--pos)" class="sign-pos-y" text-anchor="middle">+</text>
            <text x="380" y="360" fill="var(--neg)" class="sign-neg-y" text-anchor="middle">−</text>
        </g>

        <!-- Setup Group: Axes, Lens, Origin -->
        <g class="setup-group">
            <!-- X Axis (Principal Axis) -->
            <line x1="40" y1="250" x2="760" y2="250" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="6,4" />
            <!-- Y Axis -->
            <line x1="400" y1="40" x2="400" y2="460" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="6,4" />
            
            <!-- Biconvex Lens -->
            <path d="M 400 70 Q 440 250 400 430 Q 360 250 400 70" fill="var(--lens-fill)" stroke="var(--lens-stroke)" stroke-width="2" class="lens" />
            
            <!-- Focal Points -->
            <circle cx="300" cy="250" r="4" fill="var(--focus)" class="focal-point" />
            <text x="295" y="270" font-family="Inter" font-size="12" fill="var(--focus)" font-weight="600" class="label-bg focal-point">F₁</text>
            
            <circle cx="500" cy="250" r="4" fill="var(--focus)" class="focal-point" />
            <text x="495" y="270" font-family="Inter" font-size="12" fill="var(--focus)" font-weight="600" class="label-bg focal-point">F₂</text>

            <!-- Origin Label -->
            <circle cx="400" cy="250" r="3" fill="var(--axis)" />
            <text x="410" y="240" font-family="Inter" font-size="14" fill="var(--axis)" font-weight="600" class="label-bg">O (0,0)</text>
        </g>

        <!-- Incident Light Direction -->
        <g class="incident-group">
            <line x1="80" y1="60" x2="260" y2="60" stroke="var(--axis)" stroke-width="2" marker-end="url(#arrow-axis)" />
            <text x="80" y="50" font-family="Inter" font-size="13" fill="var(--axis)" font-weight="600">Direction of Incident Light (+)</text>
        </g>

        <!-- Rays -->
        <g class="rays">
            <!-- Ray 1: Parallel to axis, refracts through F2 -->
            <path d="M 200 150 L 400 150 L 600 350" fill="none" stroke="var(--ray)" stroke-width="2.5" filter="url(#glow)" class="ray" />
            <!-- Ray 2: Through optical center -->
            <path d="M 200 150 L 600 350" fill="none" stroke="var(--ray)" stroke-width="2.5" filter="url(#glow)" class="ray" />
        </g>

        <!-- Object and Image -->
        <g class="objects">
            <!-- Object (O) -->
            <line x1="200" y1="250" x2="200" y2="150" stroke="var(--obj)" stroke-width="4" marker-end="url(#arrow-obj)" class="object" />
            <text x="180" y="145" font-family="Inter" font-size="16" fill="var(--obj)" font-weight="700" class="object-label label-bg">O</text>

            <!-- Image (I) -->
            <line x1="600" y1="250" x2="600" y2="350" stroke="var(--img)" stroke-width="4" marker-end="url(#arrow-img)" class="image" />
            <text x="615" y="365" font-family="Inter" font-size="16" fill="var(--img)" font-weight="700" class="image-label label-bg">I</text>
        </g>

        <!-- Measurement Vectors -->
        <g class="measurements">
            <!-- u: Object Distance (Negative) -->
            <line x1="400" y1="290" x2="200" y2="290" stroke="var(--neg)" stroke-width="2.5" marker-end="url(#arrow-neg)" class="arrow-u" />
            <text x="290" y="315" fill="var(--neg)" font-size="16" class="math label-u label-bg" text-anchor="middle">−u</text>

            <!-- v: Image Distance (Positive) -->
            <line x1="400" y1="290" x2="600" y2="290" stroke="var(--pos)" stroke-width="2.5" marker-end="url(#arrow-pos)" class="arrow-v" />
            <text x="500" y="315" fill="var(--pos)" font-size="16" class="math label-v label-bg" text-anchor="middle">+v</text>

            <!-- ho: Object Height (Positive) -->
            <line x1="160" y1="250" x2="160" y2="150" stroke="var(--pos)" stroke-width="2.5" marker-end="url(#arrow-pos)" class="arrow-ho" />
            <text x="145" y="205" fill="var(--pos)" font-size="16" class="math label-ho label-bg" text-anchor="end">+h₀</text>

            <!-- hi: Image Height (Negative) -->
            <line x1="640" y1="250" x2="640" y2="350" stroke="var(--neg)" stroke-width="2.5" marker-end="url(#arrow-neg)" class="arrow-hi" />
            <text x="655" y="305" fill="var(--neg)" font-size="16" class="math label-hi label-bg" text-anchor="start">−hᵢ</text>
        </g>

        <!-- Legend -->
        <g class="legend" transform="translate(630, 30)">
            <rect x="0" y="0" width="140" height="75" fill="var(--surface)" stroke="#dee2e6" stroke-width="1" rx="6" />
            <text x="15" y="22" font-family="Inter" font-size="12" font-weight="700" fill="var(--text)">Sign Convention</text>
            
            <line x1="15" y1="40" x2="35" y2="40" stroke="var(--pos)" stroke-width="3" />
            <text x="45" y="44" font-family="Inter" font-size="12" fill="var(--text)" font-weight="600">Positive (+)</text>
            
            <line x1="15" y1="60" x2="35" y2="60" stroke="var(--neg)" stroke-width="3" />
            <text x="45" y="64" font-family="Inter" font-size="12" fill="var(--text)" font-weight="600">Negative (−)</text>
        </g>

    </svg>
</div>

</body>
</html>
