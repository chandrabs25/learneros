<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluid Statics: Pascal's Law</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Animations */
        .left-piston-group {
            animation: moveLeft 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .right-piston-group {
            animation: moveRight 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .fluid-left {
            transform-origin: 220px 350px;
            animation: scaleLeftFluid 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .fluid-right {
            transform-origin: 540px 350px;
            animation: scaleRightFluid 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f1-line {
            transform-origin: 220px 140px;
            animation: scaleF1Line 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f1-head {
            animation: moveF1Head 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f1-label {
            animation: fadeF1 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f2-line {
            transform-origin: 540px 195px;
            animation: scaleF2Line 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f2-head {
            animation: moveF2Head 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .f2-label {
            animation: fadeF2 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .h1-group {
            animation: scaleH1 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .h2-group {
            animation: scaleH2 10s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .pressure-dot {
            animation: pulseDot 10s ease-out infinite;
        }

        /* Keyframes */
        @keyframes moveLeft {
            0%, 15% { transform: translateY(0); }
            40%, 80% { transform: translateY(60px); }
            100% { transform: translateY(0); }
        }
        @keyframes moveRight {
            0%, 15% { transform: translateY(0); }
            40%, 80% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        @keyframes scaleLeftFluid {
            0%, 15% { transform: scaleY(1); }
            40%, 80% { transform: scaleY(0.571428); }
            100% { transform: scaleY(1); }
        }
        @keyframes scaleRightFluid {
            0%, 15% { transform: scaleY(1); }
            40%, 80% { transform: scaleY(1.142857); }
            100% { transform: scaleY(1); }
        }
        @keyframes scaleF1Line {
            0%, 5% { transform: scaleY(0); opacity: 0; }
            15%, 75% { transform: scaleY(1); opacity: 1; }
            80%, 100% { transform: scaleY(0); opacity: 0; }
        }
        @keyframes moveF1Head {
            0%, 5% { transform: translateY(-45px); opacity: 0; }
            15%, 75% { transform: translateY(0); opacity: 1; }
            80%, 100% { transform: translateY(-45px); opacity: 0; }
        }
        @keyframes fadeF1 {
            0%, 5% { opacity: 0; }
            15%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        @keyframes scaleF2Line {
            0%, 40% { transform: scaleY(0); opacity: 0; }
            50%, 75% { transform: scaleY(1); opacity: 1; }
            80%, 100% { transform: scaleY(0); opacity: 0; }
        }
        @keyframes moveF2Head {
            0%, 40% { transform: translateY(165px); opacity: 0; }
            50%, 75% { transform: translateY(0); opacity: 1; }
            80%, 100% { transform: translateY(165px); opacity: 0; }
        }
        @keyframes fadeF2 {
            0%, 40% { opacity: 0; }
            50%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        @keyframes scaleH1 {
            0%, 15% { transform: scaleY(0); opacity: 0; }
            40%, 80% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0); opacity: 0; }
        }
        @keyframes scaleH2 {
            0%, 15% { transform: scaleY(0); opacity: 0; }
            40%, 80% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0); opacity: 0; }
        }
        @keyframes pulseDot {
            0%, 38% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1.8); }
            44%, 100% { opacity: 0; transform: scale(0.5); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Background Pattern -->
            <pattern id="dot-grid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="2" cy="2" r="1" fill="#8D99AE" opacity="0.15"/>
            </pattern>
            
            <!-- Glow Filter for Pressure Dots -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Piston Gradient -->
            <linearGradient id="piston-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#555555" />
                <stop offset="100%" stop-color="#222222" />
            </linearGradient>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="url(#dot-grid)" />

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#2B2D42">Fluid Statics: Pascal's Law</text>
        <text x="400" y="70" text-anchor="middle" font-size="14" font-weight="400" fill="#8D99AE">Principle of Hydraulic Leverage</text>

        <!-- Legend Box -->
        <g transform="translate(610, 370)">
            <rect width="160" height="100" rx="8" fill="#ffffff" stroke="#8D99AE" stroke-width="1" opacity="0.9"/>
            <text x="15" y="22" font-size="12" font-weight="700" fill="#2B2D42">Legend</text>
            
            <circle cx="20" cy="40" r="5" fill="#FF3366"/>
            <text x="35" y="44" font-size="11" fill="#2B2D42">Force Vectors</text>
            
            <circle cx="20" cy="60" r="5" fill="#4361EE"/>
            <text x="35" y="64" font-size="11" fill="#2B2D42">Incompressible Fluid</text>
            
            <circle cx="20" cy="80" r="5" fill="#00B4D8"/>
            <text x="35" y="84" font-size="11" fill="#2B2D42">Pressure Wave</text>
        </g>

        <!-- Annotation Card -->
        <g transform="translate(30, 370)">
            <rect width="240" height="100" rx="8" fill="#ffffff" stroke="#8D99AE" stroke-width="1" opacity="0.9"/>
            <foreignObject x="10" y="10" width="220" height="80">
                <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: 'Inter', sans-serif; font-size: 12px; color: #2B2D42; line-height: 1.5;">
                    <strong>Pascal's Principle:</strong><br/>A change in pressure applied to an enclosed fluid is transmitted undiminished to every portion of the fluid and the walls of its container.
                </div>
            </foreignObject>
        </g>

        <!-- Formula Box -->
        <g transform="translate(300, 410)">
            <rect width="200" height="60" rx="8" fill="#ffffff" stroke="#8D99AE" stroke-width="1" opacity="0.9"/>
            <g transform="translate(100, 30)">
                <text x="-65" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="18" fill="#2B2D42">P =</text>
                
                <!-- F1 / A1 -->
                <text x="-20" y="-6" text-anchor="middle" font-family="Roboto Mono" font-size="15" fill="#FF3366" font-weight="600">F₁</text>
                <text x="-20" y="18" text-anchor="middle" font-family="Roboto Mono" font-size="15" fill="#2B2D42">A₁</text>
                <line x1="-35" y1="4" x2="-5" y2="4" stroke="#2B2D42" stroke-width="2"/>
                
                <text x="12" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="18" fill="#2B2D42">=</text>
                
                <!-- F2 / A2 -->
                <text x="45" y="-6" text-anchor="middle" font-family="Roboto Mono" font-size="15" fill="#FF3366" font-weight="600">F₂</text>
                <text x="45" y="18" text-anchor="middle" font-family="Roboto Mono" font-size="15" fill="#2B2D42">A₂</text>
                <line x1="30" y1="4" x2="60" y2="4" stroke="#2B2D42" stroke-width="2"/>
            </g>
        </g>

        <!-- Container Background (Glass effect) -->
        <path d="M 200 100 L 200 390 L 600 390 L 600 100 L 480 100 L 480 350 L 240 350 L 240 100 Z" fill="#e9ecef" opacity="0.5" />

        <!-- Fluid Elements -->
        <g id="fluid-system">
            <rect class="fluid-left" x="200" y="210" width="40" height="140" fill="#4361EE" />
            <rect class="fluid-right" x="480" y="210" width="120" height="140" fill="#4361EE" />
            <rect x="200" y="350" width="400" height="40" fill="#4361EE" />
            
            <!-- Static Pressure Label -->
            <text x="400" y="375" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" opacity="0.9">
                P<tspan dy="4" font-size="10">static</tspan>
            </text>
        </g>

        <!-- Pressure Transmission Dots -->
        <g filter="url(#glow)">
            <circle class="pressure-dot" cx="220" cy="280" r="6" fill="#00B4D8" style="transform-origin: 220px 280px; animation-delay: 0s;" />
            <circle class="pressure-dot" cx="220" cy="370" r="6" fill="#00B4D8" style="transform-origin: 220px 370px; animation-delay: 0.2s;" />
            <circle class="pressure-dot" cx="340" cy="370" r="6" fill="#00B4D8" style="transform-origin: 340px 370px; animation-delay: 0.4s;" />
            <circle class="pressure-dot" cx="460" cy="370" r="6" fill="#00B4D8" style="transform-origin: 460px 370px; animation-delay: 0.6s;" />
            <circle class="pressure-dot" cx="540" cy="370" r="6" fill="#00B4D8" style="transform-origin: 540px 370px; animation-delay: 0.8s;" />
            <circle class="pressure-dot" cx="540" cy="280" r="6" fill="#00B4D8" style="transform-origin: 540px 280px; animation-delay: 1.0s;" />
        </g>

        <!-- Container Outline (Glass Walls) -->
        <path d="M 200 100 L 200 390 L 600 390 L 600 100" fill="none" stroke="#8D99AE" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M 240 100 L 240 350 L 480 350 L 480 100" fill="none" stroke="#8D99AE" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Area Labels -->
        <g fill="#2B2D42" font-size="14" font-weight="600">
            <text x="165" y="280">A₁</text>
            <line x1="185" y1="275" x2="195" y2="275" stroke="#2B2D42" stroke-width="2" />
            
            <text x="635" y="280">A₂ = 3A₁</text>
            <line x1="605" y1="275" x2="625" y2="275" stroke="#2B2D42" stroke-width="2" />
        </g>

        <!-- Left Side: Piston, Force F1, Displacement h1 -->
        <g class="left-piston-group">
            <!-- Piston -->
            <rect x="200" y="200" width="40" height="10" fill="url(#piston-grad)" rx="2" />
            
            <!-- Force F1 Vector -->
            <g class="f1-group">
                <line class="f1-line" x1="220" y1="140" x2="220" y2="185" stroke="#FF3366" stroke-width="4" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                <polygon class="f1-head" points="214,185 226,185 220,200" fill="#FF3366" />
                <text class="f1-label" x="235" y="165" fill="#FF3366" font-size="16" font-weight="700">F₁</text>
            </g>
        </g>

        <!-- Displacement h1 Indicator (Green) -->
        <g class="h1-group" style="transform-origin: 180px 200px;">
            <line x1="180" y1="200" x2="180" y2="255" stroke="#06D6A0" stroke-width="2" stroke-dasharray="4" />
            <polygon points="176,255 184,255 180,260" fill="#06D6A0" />
            <text x="155" y="235" fill="#06D6A0" font-size="13" font-weight="600" class="f1-label">h₁</text>
        </g>

        <!-- Right Side: Piston, Force F2, Displacement h2 -->
        <g class="right-piston-group">
            <!-- Piston -->
            <rect x="480" y="200" width="120" height="10" fill="url(#piston-grad)" rx="2" />
            
            <!-- Force F2 Vector -->
            <g class="f2-group">
                <line class="f2-line" x1="540" y1="195" x2="540" y2="30" stroke="#FF3366" stroke-width="8" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
                <polygon class="f2-head" points="528,30 552,30 540,10" fill="#FF3366" />
                <text class="f2-label" x="560" y="110" fill="#FF3366" font-size="20" font-weight="700">F₂ = 3F₁</text>
            </g>
        </g>

        <!-- Displacement h2 Indicator (Green) -->
        <g class="h2-group" style="transform-origin: 620px 200px;">
            <line x1="620" y1="200" x2="620" y2="185" stroke="#06D6A0" stroke-width="2" stroke-dasharray="4" />
            <polygon points="616,185 624,185 620,180" fill="#06D6A0" />
            <text x="630" y="195" fill="#06D6A0" font-size="13" font-weight="600" class="f2-label">h₂ = h₁/3</text>
        </g>

    </svg>
</div>

</body>
</html>
