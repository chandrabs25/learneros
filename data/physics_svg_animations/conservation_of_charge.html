<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation of Charge: Kirchhoff's Junction Rule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #e9ecef;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.15);
            overflow: hidden;
            width: 100%;
            max-width: 800px;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
            background-color: #f8f9fa;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 30px;
            background: #ffffff;
            border-top: 1px solid #dee2e6;
        }
        button {
            background: #212529;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-family: 'Inter', sans-serif;
        }
        button:hover {
            background: #343a40;
        }
        button:active {
            transform: scale(0.97);
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
        }
        input[type=range] {
            accent-color: #06D6A0;
            cursor: pointer;
            width: 120px;
        }
        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <svg id="circuit-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Conservation of Charge: Kirchhoff's Junction Rule</title>
        <desc>An animated circuit junction showing 2 Amperes and 3 Amperes of current entering a node, combining to form 5 Amperes leaving the node. The number of charge carriers is perfectly conserved.</desc>

        <defs>
            <!-- Arrowhead Markers -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>

            <!-- Drop Shadow for Boxes -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08" />
            </filter>

            <!-- Glow for Charge Particles -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="1.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#212529">Conservation of Charge: Kirchhoff's Junction Rule</text>

        <!-- Legend -->
        <g id="legend" transform="translate(20, 15)">
            <rect x="0" y="0" width="150" height="65" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" filter="url(#shadow)" />
            <circle cx="20" cy="20" r="4.5" fill="#FFD166" filter="url(#glow)" />
            <text x="35" y="24" font-family="Inter" font-size="12" font-weight="600" fill="#495057">Charge Carrier (q)</text>
            <path d="M 12 45 L 28 45" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <text x="40" y="49" font-family="Inter" font-size="12" font-weight="600" fill="#495057">Current Vector (I)</text>
        </g>

        <!-- Wires -->
        <g id="wires">
            <path id="wire1" d="M 100 100 L 400 250" stroke="#495057" stroke-width="7" stroke-linecap="round" fill="none" />
            <path id="wire2" d="M 100 400 L 400 250" stroke="#495057" stroke-width="7" stroke-linecap="round" fill="none" />
            <path id="wire3" d="M 400 250 L 735.4 250" stroke="#495057" stroke-width="7" stroke-linecap="round" fill="none" />
        </g>

        <!-- Current Vectors -->
        <g id="vectors">
            <!-- Wire 1 Vector (Red) -->
            <path d="M 180 120 L 260 160" stroke="#FF3366" stroke-width="4" fill="none" marker-end="url(#arrow-red)" />
            <!-- Wire 2 Vector (Blue) -->
            <path d="M 180 380 L 260 340" stroke="#4361EE" stroke-width="4" fill="none" marker-end="url(#arrow-blue)" />
            <!-- Wire 3 Vector (Green) -->
            <path d="M 500 220 L 580 220" stroke="#06D6A0" stroke-width="4" fill="none" marker-end="url(#arrow-green)" />
        </g>

        <!-- Current Labels -->
        <g id="labels">
            <text x="165" y="105" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#FF3366" id="label-i1">I₁ = 2A</text>
            <text x="165" y="415" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#4361EE" id="label-i2">I₂ = 3A</text>
            <text x="490" y="205" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#06D6A0" id="label-i3">I₃ = 5A</text>
        </g>

        <!-- Principle Box -->
        <g transform="translate(30, 410)">
            <rect x="0" y="0" width="310" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)" />
            <text x="15" y="25" font-family="Inter" font-size="13" font-weight="600" fill="#495057">
                <tspan x="15" dy="0">The total charge entering a junction</tspan>
                <tspan x="15" dy="18">per unit time exactly equals the</tspan>
                <tspan x="15" dy="18">total charge leaving it.</tspan>
            </text>
        </g>

        <!-- Equation Box -->
        <g transform="translate(470, 410)">
            <rect x="0" y="0" width="300" height="70" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)" />
            <text x="150" y="28" text-anchor="middle" font-family="Inter" font-size="16" font-weight="700" fill="#495057">Σ I_in = Σ I_out</text>
            <text x="150" y="52" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#212529">
                <tspan id="eq-i1" fill="#FF3366">2A</tspan> + <tspan id="eq-i2" fill="#4361EE">3A</tspan> = <tspan id="eq-i3" fill="#06D6A0">5A</tspan>
            </text>
        </g>

        <!-- Particles Group -->
        <g id="particles"></g>

        <!-- Junction Node -->
        <circle id="junction-node" cx="400" cy="250" r="7" fill="#212529" style="transform-origin: 400px 250px; transition: transform 0.08s cubic-bezier(0.175, 0.885, 0.32, 1.275), fill 0.08s ease-out;" />

    </svg>

    <div class="controls">
        <button id="play-btn">Pause Animation</button>
        <div class="slider-group">
            <label for="current-slider">Current Magnitude:</label>
            <input type="range" id="current-slider" min="1" max="3" step="1" value="1">
            <span id="mult-val" class="math-text">1x</span>
        </div>
    </div>
</div>

<script>
    const svg = document.getElementById('circuit-svg');
    const particlesGroup = document.getElementById('particles');
    const node = document.getElementById('junction-node');
    
    const D = 2.0; // Base duration for a particle to travel the full wire length
    let w3Times = [];
    let isPlaying = true;

    // Initialize the simulation
    function generateParticles(M) {
        particlesGroup.innerHTML = '';
        w3Times = [];

        const w1Times = [];
        const w2Times = [];

        // Calculate emission times based on multiplier M
        // I1 = 2*M particles per 2 seconds (since D=2.0)
        // I2 = 3*M particles per 2 seconds
        for(let i = 0; i < 4 * M; i++) {
            w1Times.push(i * D / (4 * M));
        }
        for(let i = 0; i < 6 * M; i++) {
            // Slight offset to prevent perfect overlap at the node
            w2Times.push((i * D / (6 * M)) + 0.03);
        }

        // The output wire (W3) must emit exactly when particles from W1 and W2 arrive.
        // Since travel time is exactly D, arrival times modulo D are equal to emission times modulo D.
        w3Times = [...w1Times, ...w2Times].map(t => t % D).sort((a, b) => a - b);

        // Create SVG elements for each particle
        w1Times.forEach(t => createParticle('wire1', t));
        w2Times.forEach(t => createParticle('wire2', t));
        w3Times.forEach(t => createParticle('wire3', t));
    }

    function createParticle(pathId, beginTime) {
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('cx', '0');
        circle.setAttribute('cy', '0');
        circle.setAttribute('r', '4.5');
        circle.setAttribute('fill', '#FFD166');
        circle.setAttribute('filter', 'url(#glow)');

        const animateMotion = document.createElementNS('http://www.w3.org/2000/svg', 'animateMotion');
        animateMotion.setAttribute('dur', `${D}s`);
        // Negative begin time ensures the wires are fully populated on load
        animateMotion.setAttribute('begin', `${beginTime - D}s`);
        animateMotion.setAttribute('repeatCount', 'indefinite');
        animateMotion.setAttribute('calcMode', 'linear');

        const mpath = document.createElementNS('http://www.w3.org/2000/svg', 'mpath');
        mpath.setAttribute('href', `#${pathId}`);

        animateMotion.appendChild(mpath);
        circle.appendChild(animateMotion);
        particlesGroup.appendChild(circle);
    }

    // Node Pulsing Logic
    function animateNode() {
        if (!isPlaying) {
            requestAnimationFrame(animateNode);
            return;
        }
        
        let t = svg.getCurrentTime() % D;
        
        // Check if current time is very close to any particle arrival time
        let isHit = w3Times.some(hitT => {
            let diff = Math.abs(t - hitT);
            return diff < 0.06 || diff > (D - 0.06);
        });

        if (isHit) {
            node.style.transform = 'scale(1.4)';
            node.style.fill = '#FF3366'; // Flash red on hit
        } else {
            node.style.transform = 'scale(1)';
            node.style.fill = '#212529';
        }

        requestAnimationFrame(animateNode);
    }

    // Event Listeners
    document.getElementById('play-btn').addEventListener('click', (e) => {
        if (isPlaying) {
            svg.pauseAnimations();
            e.target.textContent = 'Play Animation';
        } else {
            svg.unpauseAnimations();
            e.target.textContent = 'Pause Animation';
        }
        isPlaying = !isPlaying;
    });

    document.getElementById('current-slider').addEventListener('input', (e) => {
        const M = parseInt(e.target.value);
        
        // Update UI Labels
        document.getElementById('mult-val').textContent = M + 'x';
        document.getElementById('label-i1').textContent = `I₁ = ${2*M}A`;
        document.getElementById('label-i2').textContent = `I₂ = ${3*M}A`;
        document.getElementById('label-i3').textContent = `I₃ = ${5*M}A`;
        
        document.getElementById('eq-i1').textContent = `${2*M}A`;
        document.getElementById('eq-i2').textContent = `${3*M}A`;
        document.getElementById('eq-i3').textContent = `${5*M}A`;
        
        // Regenerate particles with new frequencies
        generateParticles(M);
        
        // If paused, force the new particles to pause immediately
        if (!isPlaying) {
            svg.pauseAnimations();
        }
    });

    // Boot up
    generateParticles(1);
    requestAnimationFrame(animateNode);

</script>
</body>
</html>
