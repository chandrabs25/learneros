<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenz's Law Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --magnet-n: #FF3366;
            --magnet-s: #444444;
            --loop-color: #F77F00;
            --b-ext: #7209B7;
            --b-ind: #00B4D8;
            --v-and-i: #06D6A0;
            --f-mag: #4361EE;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 900px;
            width: 100%;
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            color: var(--text-main);
            font-size: 28px;
            font-weight: 700;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 22px;
            color: var(--text-main);
            margin-top: 5px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }

        button {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background-color: #1a1b28;
        }

        .svg-container {
            width: 100%;
            height: auto;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            background-color: #ffffff;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* CSS Animations */
        .magnet-group {
            animation: magnetMove 12s ease-in-out infinite;
        }

        .approach-only {
            animation: fadeApproach 12s ease-in-out infinite;
        }

        .recess-only {
            animation: fadeRecess 12s ease-in-out infinite;
        }

        .status-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            text-anchor: middle;
        }

        .status-1 { animation: status1 12s infinite; fill: var(--magnet-n); }
        .status-2 { animation: status2 12s infinite; fill: #6c757d; }
        .status-3 { animation: status3 12s infinite; fill: var(--b-ind); }
        .status-4 { animation: status4 12s infinite; fill: #6c757d; }

        .paused * {
            animation-play-state: paused !important;
        }

        /* Keyframes */
        @keyframes magnetMove {
            0% { transform: translate(180px, 250px); }
            30% { transform: translate(450px, 250px); }
            33.33% { transform: translate(450px, 250px); }
            41.66% { transform: translate(450px, 250px); }
            71.66% { transform: translate(180px, 250px); }
            100% { transform: translate(180px, 250px); }
        }

        @keyframes fadeApproach {
            0% { opacity: 0; }
            5% { opacity: 1; }
            28% { opacity: 1; }
            33.33% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes fadeRecess {
            0% { opacity: 0; }
            41.66% { opacity: 0; }
            46.66% { opacity: 1; }
            66.66% { opacity: 1; }
            71.66% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes status1 {
            0% { opacity: 1; }
            33.33% { opacity: 1; }
            33.34% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes status2 {
            0% { opacity: 0; }
            33.33% { opacity: 0; }
            33.34% { opacity: 1; }
            41.66% { opacity: 1; }
            41.67% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes status3 {
            0% { opacity: 0; }
            41.66% { opacity: 0; }
            41.67% { opacity: 1; }
            71.66% { opacity: 1; }
            71.67% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes status4 {
            0% { opacity: 0; }
            71.66% { opacity: 0; }
            71.67% { opacity: 1; }
            100% { opacity: 1; }
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Lenz's Law of Electromagnetic Induction</h1>
        <div class="formula">ε = - dΦ<sub>B</sub> / dt</div>
    </div>

    <div class="controls">
        <button id="playPauseBtn" onclick="toggleAnimation()">
            <svg id="icon-pause" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            <svg id="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
            <span id="btnText">Pause Animation</span>
        </button>
    </div>

    <div class="svg-container" id="animation-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
                </marker>
                <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
                </marker>

                <!-- Gradients -->
                <linearGradient id="copper-back" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#C75B00" />
                    <stop offset="100%" stop-color="#9E4800" />
                </linearGradient>
                <linearGradient id="copper-front" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FF9E40" />
                    <stop offset="50%" stop-color="#F77F00" />
                    <stop offset="100%" stop-color="#D96A00" />
                </linearGradient>
                
                <!-- Drop Shadow for Legend -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Legend -->
            <g transform="translate(20, 20)" filter="url(#shadow)">
                <rect width="230" height="135" fill="white" rx="8" stroke="#e9ecef" stroke-width="1"/>
                <text x="15" y="25" font-family="Inter" font-weight="700" font-size="14" fill="#2b2d42">Legend</text>
                
                <line x1="15" y1="45" x2="40" y2="45" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)"/>
                <text x="50" y="49" font-family="Inter" font-size="12" fill="#495057">External B-Field (B<tspan baseline-shift="sub" font-size="9">ext</tspan>)</text>
                
                <line x1="15" y1="65" x2="40" y2="65" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
                <text x="50" y="69" font-family="Inter" font-size="12" fill="#495057">Induced B-Field (B<tspan baseline-shift="sub" font-size="9">ind</tspan>)</text>
                
                <line x1="15" y1="85" x2="40" y2="85" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
                <text x="50" y="89" font-family="Inter" font-size="12" fill="#495057">Velocity (v) &amp; Current (I)</text>
                
                <line x1="15" y1="105" x2="40" y2="105" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="50" y="109" font-family="Inter" font-size="12" fill="#495057">Magnetic Force (F<tspan baseline-shift="sub" font-size="9">mag</tspan>)</text>
            </g>

            <!-- Loop System (Back Half) -->
            <g transform="translate(600, 250)">
                <!-- Back half of the loop (drawn first so magnet appears in front of it) -->
                <path d="M 0 -120 A 40 120 0 0 1 0 120" stroke="url(#copper-back)" stroke-width="14" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Magnet System (Animated Translation) -->
            <g class="magnet-group">
                <!-- External Magnetic Field Lines (Attached to Magnet) -->
                <g stroke="#7209B7" stroke-width="3" fill="none" opacity="0.8">
                    <!-- Center lines -->
                    <path d="M 80 0 L 260 0" marker-end="url(#arrow-purple)" />
                    <path d="M 80 -10 C 160 -10, 220 -30, 260 -50" marker-end="url(#arrow-purple)" />
                    <path d="M 80 10 C 160 10, 220 30, 260 50" marker-end="url(#arrow-purple)" />
                    
                    <!-- Looping lines -->
                    <path d="M 80 -20 C 150 -40, 200 -120, 100 -160 C 0 -200, -100 -120, -80 -20" marker-mid="url(#arrow-purple)" />
                    <path d="M 80 20 C 150 40, 200 120, 100 160 C 0 200, -100 120, -80 20" marker-mid="url(#arrow-purple)" />
                    
                    <!-- Extra field line arrows for clarity -->
                    <path d="M 120 -100 L 119 -100" marker-end="url(#arrow-purple)" />
                    <path d="M 120 100 L 119 100" marker-end="url(#arrow-purple)" />
                </g>

                <!-- Magnet Body -->
                <rect x="-80" y="-35" width="80" height="70" fill="var(--magnet-s)" rx="4" />
                <rect x="0" y="-35" width="80" height="70" fill="var(--magnet-n)" rx="4" />
                <text x="-40" y="8" fill="white" text-anchor="middle" font-family="Roboto Mono" font-size="24" font-weight="700">S</text>
                <text x="40" y="8" fill="white" text-anchor="middle" font-family="Roboto Mono" font-size="24" font-weight="700">N</text>

                <!-- Velocity & Force Vectors (Approach Phase) -->
                <g class="approach-only">
                    <!-- Velocity (Green, Right) -->
                    <path d="M 0 -65 L 70 -65" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <text x="35" y="-75" fill="var(--v-and-i)" class="math-text" font-size="18" text-anchor="middle">v</text>
                    
                    <!-- Force (Blue, Left) -->
                    <path d="M 0 65 L -70 65" stroke="var(--f-mag)" stroke-width="5" fill="none" marker-end="url(#arrow-blue)" />
                    <text x="-35" y="90" fill="var(--f-mag)" class="math-text" font-size="18" text-anchor="middle">F<tspan baseline-shift="sub" font-size="12">mag</tspan></text>
                </g>

                <!-- Velocity & Force Vectors (Recession Phase) -->
                <g class="recess-only">
                    <!-- Velocity (Green, Left) -->
                    <path d="M 0 -65 L -70 -65" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <text x="-35" y="-75" fill="var(--v-and-i)" class="math-text" font-size="18" text-anchor="middle">v</text>
                    
                    <!-- Force (Blue, Right) -->
                    <path d="M 0 65 L 70 65" stroke="var(--f-mag)" stroke-width="5" fill="none" marker-end="url(#arrow-blue)" />
                    <text x="35" y="90" fill="var(--f-mag)" class="math-text" font-size="18" text-anchor="middle">F<tspan baseline-shift="sub" font-size="12">mag</tspan></text>
                </g>
            </g>

            <!-- Loop System (Front Half & Induced Effects) -->
            <g transform="translate(600, 250)">
                <!-- Front half of the loop (drawn last to appear in front of magnet's field) -->
                <path d="M 0 120 A 40 120 0 0 1 0 -120" stroke="url(#copper-front)" stroke-width="14" fill="none" stroke-linecap="round"/>
                
                <!-- Approach Phase Induced Effects (CCW Current, Left B-field) -->
                <g class="approach-only">
                    <!-- Induced B-Field (Cyan, pointing Left) -->
                    <path d="M 80 0 L -70 0" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <path d="M 70 -50 L -60 -50" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <path d="M 70 50 L -60 50" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <text x="-80" y="-15" fill="var(--b-ind)" class="math-text" font-size="16" text-anchor="end">B<tspan baseline-shift="sub" font-size="12">ind</tspan></text>

                    <!-- Induced Current Arrows (Green) -->
                    <!-- Front edge (closest to viewer) goes UP -->
                    <path d="M -40 20 L -40 -20" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <!-- Top edge goes LEFT -->
                    <path d="M 20 -120 L -20 -120" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <!-- Bottom edge goes RIGHT -->
                    <path d="M -20 120 L 20 120" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <text x="-30" y="-135" fill="var(--v-and-i)" class="math-text" font-size="18" text-anchor="middle">I<tspan baseline-shift="sub" font-size="12">ind</tspan></text>
                </g>

                <!-- Recession Phase Induced Effects (CW Current, Right B-field) -->
                <g class="recess-only">
                    <!-- Induced B-Field (Cyan, pointing Right) -->
                    <path d="M -70 0 L 80 0" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <path d="M -60 -50 L 70 -50" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <path d="M -60 50 L 70 50" stroke="var(--b-ind)" stroke-width="4" fill="none" marker-end="url(#arrow-cyan)" />
                    <text x="90" y="-15" fill="var(--b-ind)" class="math-text" font-size="16" text-anchor="start">B<tspan baseline-shift="sub" font-size="12">ind</tspan></text>

                    <!-- Induced Current Arrows (Green) -->
                    <!-- Front edge (closest to viewer) goes DOWN -->
                    <path d="M -40 -20 L -40 20" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <!-- Top edge goes RIGHT -->
                    <path d="M -20 -120 L 20 -120" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <!-- Bottom edge goes LEFT -->
                    <path d="M 20 120 L -20 120" stroke="var(--v-and-i)" stroke-width="5" fill="none" marker-end="url(#arrow-green)" />
                    <text x="30" y="-135" fill="var(--v-and-i)" class="math-text" font-size="18" text-anchor="middle">I<tspan baseline-shift="sub" font-size="12">ind</tspan></text>
                </g>
            </g>

            <!-- Dynamic Status Text -->
            <g transform="translate(400, 460)">
                <text class="status-text status-1">Flux (Φ<tspan baseline-shift="sub" font-size="12">B</tspan>) Increasing → Opposing Field Created</text>
                <text class="status-text status-2">Flux Constant (dΦ<tspan baseline-shift="sub" font-size="12">B</tspan>/dt = 0) → No Induction</text>
                <text class="status-text status-3">Flux (Φ<tspan baseline-shift="sub" font-size="12">B</tspan>) Decreasing → Attractive Field Created</text>
                <text class="status-text status-4">System at Rest → No Induction</text>
            </g>
        </svg>
    </div>
</div>

<script>
    let isPaused = false;
    function toggleAnimation() {
        const container = document.getElementById('animation-container');
        const btnText = document.getElementById('btnText');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        
        isPaused = !isPaused;
        
        if (isPaused) {
            container.classList.add('paused');
            btnText.textContent = 'Play Animation';
            iconPause.style.display = 'none';
            iconPlay.style.display = 'block';
        } else {
            container.classList.remove('paused');
            btnText.textContent = 'Pause Animation';
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        }
    }
</script>

</body>
</html>
