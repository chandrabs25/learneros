<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potential Energy & Surface Tension</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        svg {
            max-width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }

        button {
            background-color: #4361EE;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #304ffe;
        }

        button.reset-btn {
            background-color: #6c757d;
        }

        button.reset-btn:hover {
            background-color: #5a6268;
        }

        /* --- Animations --- */
        
        .paused *, .paused {
            animation-play-state: paused !important;
        }

        #test-molecule-system {
            animation: moveMolecule 10s ease-in-out infinite;
        }

        #bonds-top {
            animation: fadeTopBonds 10s ease-in-out infinite;
        }

        #f-net-group {
            transform-origin: 0px 15px;
            animation: growFNet 10s ease-in-out infinite;
        }

        #w-ext-group {
            transform-origin: 0px -15px;
            animation: growWExt 10s ease-in-out infinite;
        }

        #pe-bar {
            transform-origin: 0px 450px;
            animation: growPEBar 10s ease-in-out infinite;
        }

        #test-circle {
            animation: flashKE 10s ease-in-out infinite;
        }

        #ke-text {
            animation: showKEText 10s ease-in-out infinite;
        }

        #surface-text {
            animation: showSurfaceText 10s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes moveMolecule {
            0%, 15% { transform: translate(275px, 350px); }
            45%, 65% { transform: translate(275px, 200px); }
            75%, 100% { transform: translate(275px, 350px); }
        }

        @keyframes fadeTopBonds {
            0%, 30% { opacity: 1; }
            45%, 65% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }

        @keyframes growFNet {
            0%, 30% { transform: scaleY(0); opacity: 0; }
            45%, 65% { transform: scaleY(1); opacity: 1; }
            70%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes growWExt {
            0%, 10% { transform: scaleY(0); opacity: 0; }
            15%, 65% { transform: scaleY(1); opacity: 1; }
            68%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes growPEBar {
            0%, 15% { transform: scaleY(0.2); } /* 50px / 250px */
            45%, 65% { transform: scaleY(1); }
            75%, 100% { transform: scaleY(0.2); }
        }

        @keyframes flashKE {
            0%, 65% { fill: #FF3366; filter: none; }
            70% { fill: #06D6A0; filter: drop-shadow(0 0 8px #06D6A0); }
            75%, 100% { fill: #FF3366; filter: none; }
        }

        @keyframes showKEText {
            0%, 65% { opacity: 0; transform: translate(0, 0) scale(0.8); }
            70% { opacity: 1; transform: translate(15px, -15px) scale(1.2); }
            75%, 100% { opacity: 0; transform: translate(20px, -20px) scale(1); }
        }

        @keyframes showSurfaceText {
            0%, 40% { opacity: 0; transform: translateY(10px); }
            45%, 65% { opacity: 1; transform: translateY(0); }
            70%, 100% { opacity: 0; transform: translateY(-10px); }
        }

    </style>
</head>
<body>

<div class="container">
    <svg id="main-svg" viewBox="0 0 800 500" width="800" height="500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
            </marker>
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
            </marker>
            
            <!-- Gradients -->
            <linearGradient id="liquid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#CAF0F8" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#90E0EF" stop-opacity="0.8" />
            </linearGradient>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />

        <!-- Titles -->
        <text x="400" y="35" font-family="Inter" font-size="22" font-weight="700" text-anchor="middle" fill="#111">Potential Energy: Work in Conservative Fields</text>
        <text x="400" y="55" font-family="Inter" font-size="13" text-anchor="middle" fill="#555">Moving a molecule to the surface requires work against inward cohesive forces, increasing Potential Energy.</text>

        <!-- Dynamic Text Overlay -->
        <text x="400" y="100" font-family="Inter" font-size="16" font-weight="700" fill="#7209B7" text-anchor="middle" id="surface-text">Work done against inward forces = Increased Potential Energy</text>

        <!-- Liquid Bulk -->
        <g id="liquid-container">
            <rect x="50" y="200" width="450" height="250" fill="url(#liquid-grad)" stroke="#48CAE4" stroke-width="2" rx="4" />
            <!-- Surface Line -->
            <line x1="50" y1="200" x2="500" y2="200" stroke="#0077B6" stroke-width="2" stroke-dasharray="8 4" />
            <text x="60" y="220" font-family="Inter" font-size="12" font-weight="600" fill="#0077B6">Liquid Bulk</text>
        </g>

        <!-- Connection to Graph -->
        <line x1="500" y1="200" x2="630" y2="200" stroke="#7209B7" stroke-width="2" stroke-dasharray="5 5" opacity="0.4" />
        <text x="565" y="190" font-family="Inter" font-size="11" fill="#7209B7" text-anchor="middle" font-weight="600">Surface Level</text>

        <!-- Static Molecules Grid -->
        <g id="bulk-molecules" fill="#4361EE">
            <!-- Row 1 (y=200) -->
            <circle cx="75" cy="200" r="8"/><circle cx="125" cy="200" r="8"/><circle cx="175" cy="200" r="8"/><circle cx="225" cy="200" r="8"/>
            <!-- Skip 275 (Test molecule destination) -->
            <circle cx="325" cy="200" r="8"/><circle cx="375" cy="200" r="8"/><circle cx="425" cy="200" r="8"/><circle cx="475" cy="200" r="8"/>
            
            <!-- Row 2 (y=250) -->
            <circle cx="75" cy="250" r="8"/><circle cx="125" cy="250" r="8"/><circle cx="175" cy="250" r="8"/><circle cx="225" cy="250" r="8"/>
            <circle cx="275" cy="250" r="8"/><circle cx="325" cy="250" r="8"/><circle cx="375" cy="250" r="8"/><circle cx="425" cy="250" r="8"/><circle cx="475" cy="250" r="8"/>
            
            <!-- Row 3 (y=300) -->
            <circle cx="75" cy="300" r="8"/><circle cx="125" cy="300" r="8"/><circle cx="175" cy="300" r="8"/><circle cx="225" cy="300" r="8"/>
            <circle cx="275" cy="300" r="8"/><circle cx="325" cy="300" r="8"/><circle cx="375" cy="300" r="8"/><circle cx="425" cy="300" r="8"/><circle cx="475" cy="300" r="8"/>
            
            <!-- Row 4 (y=350) -->
            <circle cx="75" cy="350" r="8"/><circle cx="125" cy="350" r="8"/><circle cx="175" cy="350" r="8"/><circle cx="225" cy="350" r="8"/>
            <!-- Skip 275 (Test molecule origin) -->
            <circle cx="325" cy="350" r="8"/><circle cx="375" cy="350" r="8"/><circle cx="425" cy="350" r="8"/><circle cx="475" cy="350" r="8"/>
            
            <!-- Row 5 (y=400) -->
            <circle cx="75" cy="400" r="8"/><circle cx="125" cy="400" r="8"/><circle cx="175" cy="400" r="8"/><circle cx="225" cy="400" r="8"/>
            <circle cx="275" cy="400" r="8"/><circle cx="325" cy="400" r="8"/><circle cx="375" cy="400" r="8"/><circle cx="425" cy="400" r="8"/><circle cx="475" cy="400" r="8"/>
        </g>

        <!-- Moving System (Test Molecule + Forces) -->
        <g id="test-molecule-system">
            
            <!-- Cohesive Bonds (Top) - These fade out at the surface -->
            <g id="bonds-top">
                <line x1="0" y1="-15" x2="0" y2="-40" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="-10" y1="-10" x2="-35" y2="-35" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="10" y1="-10" x2="35" y2="-35" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
            </g>

            <!-- Cohesive Bonds (Bottom & Sides) - These remain constant -->
            <g id="bonds-bottom">
                <line x1="0" y1="15" x2="0" y2="40" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="-10" y1="10" x2="-35" y2="35" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="10" y1="10" x2="35" y2="35" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="-15" y1="0" x2="-40" y2="0" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
                <line x1="15" y1="0" x2="40" y2="0" stroke="#00B4D8" stroke-width="2.5" marker-end="url(#arrow-cyan)" />
            </g>

            <!-- External Work Arrow (Points Up) -->
            <g id="w-ext-group">
                <line x1="0" y1="-15" x2="0" y2="-75" stroke="#F77F00" stroke-width="4" marker-end="url(#arrow-orange)" />
                <text x="10" y="-55" fill="#F77F00" font-family="Roboto Mono" font-weight="700" font-size="14">F_ext</text>
            </g>

            <!-- Net Force Arrow (Points Down) -->
            <g id="f-net-group">
                <line x1="0" y1="15" x2="0" y2="75" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
                <text x="10" y="65" fill="#FF3366" font-family="Roboto Mono" font-weight="700" font-size="14">F_net</text>
            </g>

            <!-- The Test Molecule -->
            <circle cx="0" cy="0" r="12" fill="#FF3366" id="test-circle" />
            
            <!-- Kinetic Energy Flash Text -->
            <text id="ke-text" x="0" y="0" fill="#06D6A0" font-family="Roboto Mono" font-weight="700" font-size="16">KE!</text>
        </g>

        <!-- Energy Bar Graph -->
        <g id="energy-graph" transform="translate(650, 0)">
            <!-- Axis -->
            <line x1="0" y1="450" x2="0" y2="130" stroke="#333" stroke-width="2" marker-end="url(#arrow-axis)" />
            
            <!-- Ticks -->
            <line x1="-10" y1="400" x2="10" y2="400" stroke="#333" stroke-width="2" />
            <line x1="-10" y1="200" x2="10" y2="200" stroke="#333" stroke-width="2" />
            
            <!-- Labels -->
            <text x="15" y="404" font-family="Inter" font-size="12" fill="#333">Bulk (Lowest U)</text>
            <text x="15" y="204" font-family="Inter" font-size="12" fill="#333">Surface (Higher U)</text>
            <text x="0" y="110" font-family="Inter" font-size="14" font-weight="700" text-anchor="middle" fill="#111">Potential Energy (U)</text>
            
            <!-- Bar Background -->
            <rect x="-30" y="200" width="20" height="250" fill="#E0F2FE" rx="2" />
            
            <!-- Dynamic Bar -->
            <rect x="-30" y="200" width="20" height="250" fill="#4361EE" id="pe-bar" rx="2" />
        </g>

        <!-- Legend -->
        <g id="legend" transform="translate(20, 80)">
            <rect x="0" y="0" width="180" height="110" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" opacity="0.9" />
            <text x="90" y="18" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Legend</text>
            
            <circle cx="15" cy="35" r="5" fill="#FF3366" />
            <text x="28" y="39" font-family="Inter" font-size="11" fill="#333">Test Molecule</text>
            
            <circle cx="15" cy="55" r="5" fill="#4361EE" />
            <text x="28" y="59" font-family="Inter" font-size="11" fill="#333">Bulk Molecule</text>
            
            <line x1="10" y1="75" x2="20" y2="75" stroke="#00B4D8" stroke-width="2" marker-end="url(#arrow-cyan)" />
            <text x="28" y="79" font-family="Inter" font-size="11" fill="#333">Cohesive Force</text>
            
            <line x1="10" y1="95" x2="20" y2="95" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)" />
            <text x="28" y="99" font-family="Inter" font-size="11" fill="#333">Net Inward Force</text>
        </g>

        <!-- Formula Overlay -->
        <g id="formula-overlay" transform="translate(250, 450)">
            <rect x="0" y="0" width="300" height="36" fill="#ffffff" stroke="#ced4da" stroke-width="1.5" rx="18" />
            <text x="150" y="23" font-family="Roboto Mono" font-size="15" font-weight="700" text-anchor="middle" fill="#111">
                ΔU = -W<tspan baseline-shift="sub" font-size="11">conservative</tspan> = W<tspan baseline-shift="sub" font-size="11">ext</tspan>
            </text>
        </g>

    </svg>

    <div class="controls">
        <button onclick="togglePlay()">Play / Pause</button>
        <button class="reset-btn" onclick="resetAnim()">Restart</button>
    </div>
</div>

<script>
    function togglePlay() {
        const svg = document.getElementById('main-svg');
        svg.classList.toggle('paused');
    }

    function resetAnim() {
        const svg = document.getElementById('main-svg');
        svg.classList.remove('paused');
        
        // Clone and replace to restart CSS animations
        const clone = svg.cloneNode(true);
        svg.parentNode.replaceChild(clone, svg);
    }
</script>

</body>
</html>
