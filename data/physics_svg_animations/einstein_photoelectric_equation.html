<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Einstein Photoelectric Equation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .photon-group {
            animation: photon-move 6s infinite;
        }

        .photon-wave {
            stroke-dasharray: 150;
            animation: wave-draw 6s infinite linear;
        }

        .pulse {
            transform-origin: 400px 300px;
            animation: pulse-anim 6s infinite;
        }

        .electron-group {
            animation: electron-move 6s infinite;
        }

        .energy-bar {
            transform-origin: 385px 315px;
            animation: energy-cost 6s infinite;
        }

        .energy-text {
            animation: energy-text-anim 6s infinite;
        }

        .ke-vector-group {
            transform-origin: 0 0;
            animation: vector-grow 6s infinite;
        }

        /* Keyframes based on 6s cycle */
        /* 0-1.5s (0-25%): Photon arrives */
        /* 1.5-1.7s (25-28.33%): Interaction / Pulse */
        /* 1.7-2.5s (28.33-41.66%): Emission & Work Function */
        /* 2.5-5.0s (41.66-83.33%): Kinetic Escape */
        /* 5.0-6.0s (83.33-100%): Reset */

        @keyframes photon-move {
            0% { transform: translate(400px, 300px) rotate(45deg) translate(-424px, 0); opacity: 0; }
            5% { opacity: 1; }
            25% { transform: translate(400px, 300px) rotate(45deg) translate(0, 0); opacity: 1; }
            25.1%, 100% { transform: translate(400px, 300px) rotate(45deg) translate(0, 0); opacity: 0; }
        }

        @keyframes wave-draw {
            0% { stroke-dashoffset: 150; }
            25%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes pulse-anim {
            0%, 24.9% { transform: scale(0); opacity: 0; }
            25% { transform: scale(0.5); opacity: 0.6; }
            28.33% { transform: scale(3); opacity: 0; }
            100% { transform: scale(3); opacity: 0; }
        }

        @keyframes electron-move {
            0%, 28.33% { transform: translate(400px, 315px); opacity: 1; animation-timing-function: ease-out; }
            41.66% { transform: translate(400px, 300px); opacity: 1; animation-timing-function: linear; }
            83.33% { transform: translate(650px, 50px); opacity: 1; }
            83.4%, 100% { transform: translate(650px, 50px); opacity: 0; }
        }

        @keyframes energy-cost {
            0%, 28.33% { transform: scaleY(0); opacity: 0; }
            28.4% { opacity: 1; }
            41.66% { transform: scaleY(1); opacity: 1; }
            83.33% { transform: scaleY(1); opacity: 1; }
            83.4%, 100% { opacity: 0; }
        }

        @keyframes energy-text-anim {
            0%, 28.33% { opacity: 0; transform: translateX(-10px); }
            35%, 83.33% { opacity: 1; transform: translateX(0); }
            83.4%, 100% { opacity: 0; }
        }

        @keyframes vector-grow {
            0%, 41.66% { transform: scale(0); opacity: 0; }
            41.7% { opacity: 1; }
            58.33% { transform: scale(1); opacity: 1; }
            83.33% { transform: scale(1); opacity: 1; }
            83.4%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Einstein's Photoelectric Effect Animation</title>
            <desc id="svg-desc">An animation showing a photon hitting a metal surface, overcoming the work function barrier, and emitting an electron with kinetic energy.</desc>

            <defs>
                <!-- Metal Gradient -->
                <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#E2E8F0"/>
                    <stop offset="15%" stop-color="#F8FAFC"/>
                    <stop offset="100%" stop-color="#CBD5E1"/>
                </linearGradient>

                <!-- Arrowheads -->
                <marker id="arrow-photon" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
                </marker>
                <marker id="arrow-ke" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
                </marker>

                <!-- Glow Filter -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#ffffff"/>

            <!-- Title and Equation -->
            <text x="400" y="50" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#1A1A1A">Einstein's Photoelectric Equation</text>
            
            <text x="400" y="90" text-anchor="middle" font-family="Roboto Mono" font-size="22" font-weight="700">
                <tspan fill="#7209B7">hν</tspan> 
                <tspan fill="#1A1A1A"> = </tspan> 
                <tspan fill="#F77F00">Φ<tspan baseline-shift="sub" font-size="0.7em">0</tspan></tspan> 
                <tspan fill="#1A1A1A"> + </tspan> 
                <tspan fill="#06D6A0">K<tspan baseline-shift="sub" font-size="0.7em">max</tspan></tspan>
            </text>

            <!-- Metal Plate -->
            <rect x="100" y="300" width="600" height="150" fill="url(#metalGrad)" rx="4"/>
            <line x1="100" y1="300" x2="700" y2="300" stroke="#ffffff" stroke-width="3" opacity="0.8"/>
            <text x="400" y="425" text-anchor="middle" font-family="Inter" font-size="16" fill="#64748B" font-weight="600" letter-spacing="1">METAL SURFACE</text>

            <!-- Background Sea of Electrons -->
            <g opacity="0.3">
                <circle cx="150" cy="350" r="6" fill="#00B4D8"/>
                <circle cx="250" cy="400" r="6" fill="#00B4D8"/>
                <circle cx="350" cy="360" r="6" fill="#00B4D8"/>
                <circle cx="450" cy="410" r="6" fill="#00B4D8"/>
                <circle cx="550" cy="340" r="6" fill="#00B4D8"/>
                <circle cx="650" cy="380" r="6" fill="#00B4D8"/>
                <circle cx="200" cy="320" r="6" fill="#00B4D8"/>
                <circle cx="500" cy="330" r="6" fill="#00B4D8"/>
                <circle cx="600" cy="420" r="6" fill="#00B4D8"/>
                <circle cx="300" cy="430" r="6" fill="#00B4D8"/>
            </g>

            <!-- Work Function Barrier -->
            <line x1="100" y1="300" x2="700" y2="300" stroke="#F77F00" stroke-width="2" stroke-dasharray="8,6"/>
            <text x="110" y="288" fill="#F77F00" font-family="Inter" font-size="14" font-weight="600">Work Function (Φ<tspan baseline-shift="sub" font-size="0.7em">0</tspan>)</text>

            <!-- Energy Cost Bar (Red) -->
            <rect x="385" y="300" width="6" height="15" fill="#FF3366" class="energy-bar" rx="2"/>
            <text x="375" y="312" fill="#FF3366" font-family="Roboto Mono" font-size="14" font-weight="700" text-anchor="end" class="energy-text">Φ<tspan baseline-shift="sub" font-size="0.7em">0</tspan></text>

            <!-- Impact Pulse -->
            <circle cx="400" cy="300" r="10" fill="#7209B7" class="pulse"/>

            <!-- Electron Group -->
            <g class="electron-group">
                <!-- Kinetic Energy Vector -->
                <g class="ke-vector-group">
                    <line x1="0" y1="0" x2="74" y2="-74" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-ke)"/>
                    <text x="85" y="-80" fill="#06D6A0" font-family="Roboto Mono" font-size="14" font-weight="700">
                        K<tspan baseline-shift="sub" font-size="0.7em">max</tspan> = ½mv²
                    </text>
                </g>
                <!-- The Electron -->
                <circle cx="0" cy="0" r="6" fill="#00B4D8" filter="url(#glow)" stroke="#007790" stroke-width="1"/>
            </g>

            <!-- Photon Group -->
            <g class="photon-group">
                <path class="photon-wave" d="M -120 0 Q -105 -25, -90 0 T -60 0 T -30 0 T 0 0" fill="none" stroke="#7209B7" stroke-width="4" marker-end="url(#arrow-photon)" filter="url(#glow)"/>
                <text x="-85" y="-30" fill="#7209B7" font-family="Roboto Mono" font-size="16" font-weight="700">E = hν</text>
            </g>

            <!-- Legend -->
            <g transform="translate(580, 360)" font-family="Inter" font-size="12" fill="#1A1A1A">
                <rect x="0" y="0" width="190" height="120" fill="#ffffff" stroke="#CBD5E1" rx="6" opacity="0.95" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
                <text x="15" y="22" font-weight="700" font-size="13">Legend</text>
                
                <line x1="15" y1="40" x2="35" y2="40" stroke="#7209B7" stroke-width="3"/>
                <text x="45" y="44">Photon (E = hν)</text>
                
                <line x1="15" y1="62" x2="35" y2="62" stroke="#F77F00" stroke-width="2" stroke-dasharray="4,2"/>
                <text x="45" y="66">Work Function (Φ<tspan baseline-shift="sub" font-size="0.7em">0</tspan>)</text>
                
                <line x1="15" y1="84" x2="35" y2="84" stroke="#06D6A0" stroke-width="3"/>
                <text x="45" y="88">Kinetic Energy (K<tspan baseline-shift="sub" font-size="0.7em">max</tspan>)</text>
                
                <circle cx="25" cy="104" r="5" fill="#00B4D8"/>
                <text x="45" y="108">Electron</text>
            </g>

        </svg>
    </div>
</body>
</html>
