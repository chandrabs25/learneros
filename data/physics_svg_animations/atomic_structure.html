<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Origin of Electric Charge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #f8f9fa;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        @keyframes jitter {
            0% { transform: translate(0, 0); }
            25% { transform: translate(0.5px, -0.5px); }
            50% { transform: translate(-0.5px, 0.5px); }
            75% { transform: translate(-0.5px, -0.5px); }
            100% { transform: translate(0, 0); }
        }
        #nucleus {
            animation: jitter 0.15s infinite linear;
        }
        .label-title {
            font-size: 24px;
            font-weight: 700;
            fill: #212529;
        }
        .label-subtitle {
            font-size: 14px;
            font-weight: 400;
            fill: #6C757D;
        }
        .legend-text {
            font-size: 13px;
            fill: #495057;
        }
        .panel-text {
            font-size: 14px;
            fill: #495057;
            font-weight: 600;
        }
        .panel-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }
        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            fill: #F77F00;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-field" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            
            <!-- Glow Filters -->
            <filter id="glow-electron" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="shadow-panel" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.05" />
            </filter>
        </defs>

        <!-- Titles -->
        <text x="400" y="45" text-anchor="middle" class="label-title">Atomic Structure: The Origin of Charge</text>
        <text x="400" y="65" text-anchor="middle" class="label-subtitle">Ionization via Friction (Triboelectric Effect)</text>

        <!-- Electric Field Lines (Hidden initially) -->
        <g id="field-lines" stroke="#F77F00" stroke-width="2" opacity="0">
            <g transform="rotate(0 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(45 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(90 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(135 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(180 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(225 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(270 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
            <g transform="rotate(315 400 250)"><line x1="445" y1="250" x2="650" y2="250" marker-end="url(#arrow-field)"/></g>
        </g>

        <!-- Orbits -->
        <ellipse cx="400" cy="250" rx="60" ry="40" fill="none" stroke="#DEE2E6" stroke-width="1.5" stroke-dasharray="4 4" />
        <ellipse cx="400" cy="250" rx="160" ry="100" fill="none" stroke="#DEE2E6" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- Silk Cloth -->
        <g id="cloth" transform="translate(850, 140)">
            <rect id="cloth-rect" x="0" y="0" width="140" height="220" rx="12" fill="#FFF3BF" stroke="#FFE066" stroke-width="3" stroke-dasharray="6 4" />
            <text x="70" y="115" text-anchor="middle" font-family="Inter" font-weight="700" fill="#D4A373" font-size="16">Silk Cloth</text>
        </g>

        <!-- Force Vector -->
        <line id="force-vector" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-force)" />
        <text id="force-label" class="math-text">F<tspan dy="4" font-size="10">e</tspan></text>

        <!-- Nucleus -->
        <g id="nucleus">
            <!-- Neutrons (Grey) -->
            <circle cx="405" cy="235" r="8" fill="#ADB5BD" />
            <circle cx="388" cy="250" r="8" fill="#ADB5BD" />
            <circle cx="410" cy="257" r="8" fill="#ADB5BD" />
            <circle cx="390" cy="262" r="8" fill="#ADB5BD" />
            <!-- Protons (Red) -->
            <circle cx="395" cy="242" r="8" fill="#FF3366" />
            <circle cx="408" cy="246" r="8" fill="#FF3366" />
            <circle cx="398" cy="258" r="8" fill="#FF3366" />
        </g>

        <!-- Electrons -->
        <circle id="e1" class="electron" r="6" fill="#4361EE" filter="url(#glow-electron)" />
        <circle id="e2" class="electron" r="6" fill="#4361EE" filter="url(#glow-electron)" />
        <circle id="e3" class="electron" r="6" fill="#4361EE" filter="url(#glow-electron)" />

        <!-- Legend Panel -->
        <rect x="20" y="20" width="140" height="95" rx="8" fill="#ffffff" stroke="#DEE2E6" filter="url(#shadow-panel)" />
        <circle cx="35" cy="40" r="6" fill="#FF3366" />
        <text x="50" y="44" class="legend-text">Proton (p⁺)</text>
        <circle cx="35" cy="65" r="6" fill="#ADB5BD" />
        <text x="50" y="69" class="legend-text">Neutron (n⁰)</text>
        <circle cx="35" cy="90" r="6" fill="#4361EE" />
        <text x="50" y="94" class="legend-text">Electron (e⁻)</text>

        <!-- Dynamic State Panel -->
        <rect x="20" y="360" width="280" height="120" rx="8" fill="#ffffff" stroke="#DEE2E6" filter="url(#shadow-panel)" />
        <text x="35" y="385" class="panel-text">State: <tspan id="ion-label" fill="#4361EE">Neutral Atom (Li)</tspan></text>
        <line x1="20" y1="395" x2="300" y2="395" stroke="#E9ECEF" stroke-width="1" />
        <text x="35" y="415" class="panel-text">Protons: <tspan class="panel-value" fill="#FF3366">3</tspan></text>
        <text x="35" y="440" class="panel-text">Electrons: <tspan id="e-count" class="panel-value" fill="#4361EE">3</tspan></text>
        <text x="35" y="465" class="panel-text">Net Charge: <tspan id="charge-val" class="panel-value" fill="#212529">0</tspan></text>

    </svg>
</div>

<script>
    const e1 = document.getElementById('e1');
    const e2 = document.getElementById('e2');
    const e3 = document.getElementById('e3');
    const cloth = document.getElementById('cloth');
    const clothRect = document.getElementById('cloth-rect');
    const forceVector = document.getElementById('force-vector');
    const forceLabel = document.getElementById('force-label');
    const fieldLines = document.getElementById('field-lines');
    
    const eCountLabel = document.getElementById('e-count');
    const chargeValLabel = document.getElementById('charge-val');
    const ionLabel = document.getElementById('ion-label');

    const duration = 12000; // 12 seconds loop
    let startTime = null;

    function animate(time) {
        if (!startTime) startTime = time;
        let t = (time - startTime) % duration;

        // Inner electrons orbit continuously (period = 2s)
        let theta1 = (t / 2000) * 2 * Math.PI;
        let theta2 = theta1 + Math.PI;
        e1.setAttribute('cx', 400 + 60 * Math.cos(theta1));
        e1.setAttribute('cy', 250 + 40 * Math.sin(theta1));
        e2.setAttribute('cx', 400 + 60 * Math.cos(theta2));
        e2.setAttribute('cy', 250 + 40 * Math.sin(theta2));

        let e3x, e3y, clothX, clothY;
        let forceOp = 1, fieldOp = 0, clothGlow = 0;
        let netCharge = 0, eCount = 3;

        // Phase 1: Equilibrium (0 - 4s)
        if (t < 4000) {
            let theta3 = (t / 6000) * 2 * Math.PI;
            e3x = 400 + 160 * Math.cos(theta3);
            e3y = 250 + 100 * Math.sin(theta3);
            clothX = 850;
            clothY = 140;
        } 
        // Phase 2: Friction Interaction - Cloth slides in (4 - 5s)
        else if (t < 5000) {
            let theta3 = (t / 6000) * 2 * Math.PI;
            e3x = 400 + 160 * Math.cos(theta3);
            e3y = 250 + 100 * Math.sin(theta3);
            
            let progress = (t - 4000) / 1000;
            progress = 1 - Math.pow(1 - progress, 3); // ease-out cubic
            clothX = 850 - 300 * progress; // slides to 550
            clothY = 140;
        } 
        // Phase 2: Friction Interaction - Rubbing (5 - 6s)
        else if (t < 6000) {
            let theta3 = (t / 6000) * 2 * Math.PI;
            e3x = 400 + 160 * Math.cos(theta3);
            e3y = 250 + 100 * Math.sin(theta3);
            clothX = 550;
            clothY = 140 + 30 * Math.sin((t - 5000) * 0.04); // oscillate
        } 
        // Phase 3: Electron Transfer (6 - 7s)
        else if (t < 7000) {
            let progress = (t - 6000) / 1000;
            let ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2; // ease-in-out
            
            e3x = 560 + 60 * ease; // moves from orbit edge (560) to cloth center (620)
            e3y = 250;
            clothX = 550;
            clothY = 140;
            forceOp = 1 - progress; // force vector snaps/fades
        } 
        // Phase 4: Ionization State (7 - 10s)
        else if (t < 10000) {
            e3x = 620;
            e3y = 250;
            clothX = 550;
            clothY = 140;
            forceOp = 0;
            
            let fadeProgress = Math.min(1, (t - 7000) / 500);
            fieldOp = fadeProgress * 0.3;
            clothGlow = fadeProgress;
            
            netCharge = 1;
            eCount = 2;
        } 
        // Phase 5: Cloth leaves (10 - 11.5s)
        else if (t < 11500) {
            let progress = (t - 10000) / 1500;
            let ease = progress * progress; // ease-in
            
            clothX = 550 + 350 * ease; // slides off-screen
            e3x = 620 + 350 * ease;
            e3y = 250;
            clothY = 140;
            forceOp = 0;
            
            fieldOp = 0.3 * (1 - progress);
            clothGlow = 1;
            netCharge = 1;
            eCount = 2;
        } 
        // Phase 6: Resetting (11.5 - 12s)
        else {
            e3x = 850; // hidden offscreen
            clothX = 850;
            forceOp = 0;
            fieldOp = 0;
            netCharge = 0;
            eCount = 3;
        }

        // Apply positions
        e3.setAttribute('cx', e3x);
        e3.setAttribute('cy', e3y);
        cloth.setAttribute('transform', `translate(${clothX}, ${clothY})`);

        // Handle Electron Fade-in at start of loop for smooth transition
        if (t < 500) {
            e3.style.opacity = t / 500;
        } else if (t < 11500) {
            e3.style.opacity = 1;
        } else {
            e3.style.opacity = 0;
        }

        // Force Vector Logic
        if (forceOp > 0) {
            let dx = 400 - e3x;
            let dy = 250 - e3y;
            let dist = Math.sqrt(dx*dx + dy*dy);
            if (dist > 0) {
                let ux = dx / dist;
                let uy = dy / dist;
                
                // Vector starts at electron, ends just before nucleus
                let startX = e3x + ux * 6;
                let startY = e3y + uy * 6;
                let endX = 400 - ux * 28;
                let endY = 250 - uy * 28;
                
                forceVector.setAttribute('x1', startX);
                forceVector.setAttribute('y1', startY);
                forceVector.setAttribute('x2', endX);
                forceVector.setAttribute('y2', endY);
                forceVector.style.opacity = forceOp;

                // Position the F_e label halfway along the vector
                forceLabel.setAttribute('x', (startX + endX) / 2 + 5);
                forceLabel.setAttribute('y', (startY + endY) / 2 - 10);
                forceLabel.style.opacity = forceOp;
            }
        } else {
            forceVector.style.opacity = 0;
            forceLabel.style.opacity = 0;
        }

        // Field Lines & Cloth Glow
        fieldLines.style.opacity = fieldOp;
        if (clothGlow > 0) {
            clothRect.style.filter = `drop-shadow(0 0 ${12 * clothGlow}px rgba(67, 97, 238, 0.6))`;
        } else {
            clothRect.style.filter = 'none';
        }

        // Update Labels
        eCountLabel.textContent = eCount;
        if (netCharge === 0) {
            chargeValLabel.textContent = '0';
            chargeValLabel.style.fill = '#212529';
            ionLabel.textContent = 'Neutral Atom (Li)';
            ionLabel.style.fill = '#4361EE';
        } else {
            chargeValLabel.textContent = '+1.6 × 10⁻¹⁹ C (+1e)';
            chargeValLabel.style.fill = '#FF3366';
            ionLabel.textContent = 'Positive Ion (Li⁺)';
            ionLabel.style.fill = '#FF3366';
        }

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>

</body>
</html>
