<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symmetry in Electromagnetism: The Infinitely Long Line Charge</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #e9ecef;
        font-family: 'Inter', sans-serif;
    }

    .svg-container {
        width: 100%;
        max-width: 1000px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        background-color: #f8f9fa;
        border-radius: 8px;
        overflow: hidden;
    }

    svg {
        display: block;
        width: 100%;
        height: auto;
    }

    /* CSS Variables for Animation */
    :root {
        --duration: 12s;
        --color-e: #F77F00;
        --color-gauss: #00B4D8;
        --color-norm: #4361EE;
        --color-red: #FF3366;
        --color-green: #06D6A0;
        --color-dark: #212529;
    }

    /* Keyframes */
    @keyframes p1-text {
        0%, 23% { opacity: 1; }
        25%, 100% { opacity: 0; }
    }
    @keyframes p2-text {
        0%, 24% { opacity: 0; }
        25%, 48% { opacity: 1; }
        50%, 100% { opacity: 0; }
    }
    @keyframes p3-text {
        0%, 49% { opacity: 0; }
        50%, 73% { opacity: 1; }
        75%, 100% { opacity: 0; }
    }
    @keyframes p4-text {
        0%, 74% { opacity: 0; }
        75%, 98% { opacity: 1; }
        100% { opacity: 0; }
    }

    @keyframes charge-move {
        0% { transform: translateY(0) scaleX(1); }
        25% { transform: translateY(-60px) scaleX(1); }
        25.001% { transform: translateY(0) scaleX(1); }
        31.25% { transform: translateY(0) scaleX(-1); }
        37.5% { transform: translateY(0) scaleX(1); }
        43.75% { transform: translateY(0) scaleX(-1); }
        50% { transform: translateY(0) scaleX(1); }
        100% { transform: translateY(0) scaleX(1); }
    }

    @keyframes e-field-fade {
        0%, 49% { opacity: 0; }
        50%, 100% { opacity: 1; }
    }

    @keyframes surface-fade {
        0%, 49% { opacity: 0; }
        50%, 100% { opacity: 1; }
    }

    @keyframes cap-flash {
        0%, 74% { fill: rgba(0, 180, 216, 0.1); stroke: rgba(0, 180, 216, 0.5); }
        78%, 86% { fill: rgba(255, 51, 102, 0.4); stroke: #FF3366; }
        90%, 100% { fill: rgba(0, 180, 216, 0.1); stroke: rgba(0, 180, 216, 0.5); }
    }

    @keyframes curve-flash {
        0%, 74% { fill: rgba(0, 180, 216, 0.15); }
        78%, 86% { fill: rgba(6, 214, 160, 0.4); }
        90%, 100% { fill: rgba(0, 180, 216, 0.15); }
    }

    /* Class Assignments */
    .phase1 { animation: p1-text var(--duration) infinite; }
    .phase2 { animation: p2-text var(--duration) infinite; }
    .phase3 { animation: p3-text var(--duration) infinite; }
    .phase4 { animation: p4-text var(--duration) infinite; }
    
    .charges-group {
        animation: charge-move var(--duration) infinite linear;
        transform-origin: 400px 250px;
    }
    
    .e-field { animation: e-field-fade var(--duration) infinite; }
    .gaussian-surface { animation: surface-fade var(--duration) infinite; }
    .cap { animation: cap-flash var(--duration) infinite; }
    .curve { animation: curve-flash var(--duration) infinite; }
    
    .e-arrow {
        stroke: var(--color-e);
        stroke-width: 3;
        marker-end: url(#arrow-orange);
    }
    .e-arrow-back { opacity: 0.25; }
    
    .text-box { font-size: 15px; fill: var(--color-dark); text-anchor: middle; }
    .bold { font-weight: 700; }
    .italic { font-style: italic; }
    .mono { font-family: 'Roboto Mono', monospace; }
</style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead Markers -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-dark" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#212529" />
            </marker>

            <!-- Charge Pattern -->
            <pattern id="charge-pattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 5 10 h 10 M 10 5 v 10" stroke="#FFF" stroke-width="2" stroke-linecap="round" />
            </pattern>

            <!-- Fade Mask for Infinite Wire -->
            <linearGradient id="maskGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#000"/>
                <stop offset="15%" stop-color="#FFF"/>
                <stop offset="85%" stop-color="#FFF"/>
                <stop offset="100%" stop-color="#000"/>
            </linearGradient>
            <mask id="fade-mask">
                <rect x="0" y="0" width="800" height="500" fill="url(#maskGrad)" />
            </mask>
        </defs>

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Symmetry &amp; Gauss's Law: Line Charge</text>

        <!-- Legend -->
        <g transform="translate(630, 15)">
            <rect x="0" y="0" width="150" height="85" rx="6" fill="#FFF" stroke="#dee2e6" stroke-width="1.5" />
            <line x1="10" y1="20" x2="35" y2="20" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-orange)" />
            <text x="45" y="24" font-size="12" fill="#212529">Electric Field (<tspan class="bold italic">E</tspan>)</text>
            
            <rect x="10" y="35" width="25" height="12" fill="#00B4D8" opacity="0.3" stroke="#00B4D8" stroke-width="1" />
            <text x="45" y="45" font-size="12" fill="#212529">Gaussian Surface</text>
            
            <line x1="10" y1="65" x2="35" y2="65" stroke="#4361EE" stroke-width="2" marker-end="url(#arrow-blue)" />
            <text x="45" y="69" font-size="12" fill="#212529">Area Normal (<tspan class="bold">n̂</tspan>)</text>
        </g>

        <!-- Annotations Box -->
        <rect x="60" y="55" width="680" height="55" rx="8" fill="#FFF" stroke="#00B4D8" stroke-width="2" />
        
        <g class="text-box phase1">
            <text x="400" y="75"><tspan class="bold">Translational Symmetry:</tspan> Shifting the wire vertically does not change</text>
            <text x="400" y="95">the charge distribution, so the field <tspan class="italic bold">E</tspan> cannot depend on height <tspan class="italic">z</tspan>.</text>
        </g>
        <g class="text-box phase2">
            <text x="400" y="75"><tspan class="bold">Rotational Symmetry:</tspan> Rotating the wire around its axis does not</text>
            <text x="400" y="95">change the system, so the field <tspan class="italic bold">E</tspan> cannot depend on the angle <tspan class="italic">φ</tspan>.</text>
        </g>
        <g class="text-box phase3">
            <text x="400" y="75"><tspan class="bold">Gaussian Surface:</tspan> Because of these symmetries, at a fixed radius <tspan class="italic">r</tspan>,</text>
            <text x="400" y="95">the electric field <tspan class="italic bold">E</tspan> must be purely radial and constant in magnitude.</text>
        </g>
        <g class="text-box phase4">
            <text x="400" y="75"><tspan class="bold">Flux Analysis:</tspan> <tspan class="italic bold">E</tspan> is parallel to the curved surface normal (green) and</text>
            <text x="400" y="95">perpendicular to the caps (red). Flux exists only through the curved surface.</text>
        </g>

        <!-- Central Wire and Charges (Masked for infinite fade effect) -->
        <g mask="url(#fade-mask)">
            <!-- Wire -->
            <rect x="396" y="0" width="8" height="500" fill="#333" />
            <!-- Charges -->
            <rect x="390" y="-100" width="20" height="700" fill="url(#charge-pattern)" class="charges-group" />
        </g>
        
        <!-- Charge Density Label -->
        <text x="415" y="140" font-size="18" fill="#212529" class="italic bold">λ</text>

        <!-- Symmetry Indicators -->
        <g class="phase1">
            <line x1="350" y1="200" x2="350" y2="300" stroke="#212529" stroke-width="2" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)" />
            <text x="340" y="255" text-anchor="end" font-size="14" fill="#212529" class="italic">Translate</text>
        </g>
        <g class="phase2">
            <path d="M 360 250 A 40 12 0 0 1 440 250" fill="none" stroke="#212529" stroke-width="2" stroke-dasharray="4,4" />
            <path d="M 440 250 A 40 12 0 0 1 360 250" fill="none" stroke="#212529" stroke-width="2" marker-end="url(#arrow-dark)" />
            <text x="340" y="255" text-anchor="end" font-size="14" fill="#212529" class="italic">Rotate</text>
        </g>

        <!-- Electric Field Vectors (Appear at Phase 3) -->
        <g class="e-field">
            <!-- Row 1: y = 180 -->
            <line x1="410" y1="175.7" x2="480" y2="145" class="e-arrow e-arrow-back" />
            <line x1="390" y1="175.7" x2="320" y2="145" class="e-arrow e-arrow-back" />
            <line x1="420" y1="180" x2="560" y2="180" class="e-arrow" />
            <line x1="380" y1="180" x2="240" y2="180" class="e-arrow" />
            <line x1="410" y1="184.3" x2="480" y2="215" class="e-arrow" />
            <line x1="390" y1="184.3" x2="320" y2="215" class="e-arrow" />

            <!-- Row 2: y = 250 -->
            <line x1="410" y1="245.7" x2="480" y2="215" class="e-arrow e-arrow-back" />
            <line x1="390" y1="245.7" x2="320" y2="215" class="e-arrow e-arrow-back" />
            <line x1="420" y1="250" x2="560" y2="250" class="e-arrow" />
            <line x1="380" y1="250" x2="240" y2="250" class="e-arrow" />
            <line x1="410" y1="254.3" x2="480" y2="285" class="e-arrow" />
            <line x1="390" y1="254.3" x2="320" y2="285" class="e-arrow" />

            <!-- Row 3: y = 320 -->
            <line x1="410" y1="315.7" x2="480" y2="285" class="e-arrow e-arrow-back" />
            <line x1="390" y1="315.7" x2="320" y2="285" class="e-arrow e-arrow-back" />
            <line x1="420" y1="320" x2="560" y2="320" class="e-arrow" />
            <line x1="380" y1="320" x2="240" y2="320" class="e-arrow" />
            <line x1="410" y1="324.3" x2="480" y2="355" class="e-arrow" />
            <line x1="390" y1="324.3" x2="320" y2="355" class="e-arrow" />

            <!-- E-Field Label -->
            <g transform="translate(565, 245)">
                <text fill="#F77F00" font-size="16" class="italic bold">E</text>
                <path d="M 0 -12 h 8 l -2 -2 m 2 2 l -2 2" fill="none" stroke="#F77F00" stroke-width="1.5" />
                <text x="12" fill="#F77F00" font-size="16">(r)</text>
            </g>
        </g>

        <!-- Gaussian Surface (Appears at Phase 3) -->
        <g class="gaussian-surface">
            <!-- Radius Dimension Line -->
            <line x1="400" y1="150" x2="520" y2="150" stroke="#212529" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="460" y="145" font-size="14" fill="#212529" class="italic">r</text>

            <!-- Back Curve of Top Cap -->
            <path d="M 280 150 A 120 30 0 0 1 520 150" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="5,5" />
            
            <!-- Top Cap Fill -->
            <path d="M 280 150 A 120 30 0 0 0 520 150 A 120 30 0 0 0 280 150 Z" class="cap" stroke-width="1.5" />
            
            <!-- Bottom Cap Fill -->
            <ellipse cx="400" cy="350" rx="120" ry="30" class="cap" stroke-width="1.5" />
            
            <!-- Front Curve of Top Cap (Solid Outline) -->
            <path d="M 280 150 A 120 30 0 0 0 520 150" fill="none" stroke="#00B4D8" stroke-width="1.5" />

            <!-- Body Fill (Front Half) -->
            <path d="M 280 150 A 120 30 0 0 0 520 150 L 520 350 A 120 30 0 0 1 280 350 Z" class="curve" />
            
            <!-- Body Outlines -->
            <line x1="280" y1="150" x2="280" y2="350" stroke="#00B4D8" stroke-width="1.5" />
            <line x1="520" y1="150" x2="520" y2="350" stroke="#00B4D8" stroke-width="1.5" />

            <!-- Normals and Flux Analysis (Appear at Phase 4) -->
            <g class="phase4">
                <!-- Top Normal -->
                <line x1="400" y1="150" x2="400" y2="80" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)" />
                <text x="410" y="95" fill="#4361EE" font-size="16" class="bold">n̂</text>
                <text x="430" y="95" fill="#FF3366" font-size="14" class="bold">E · n̂ = 0</text>

                <!-- Bottom Normal -->
                <line x1="400" y1="350" x2="400" y2="420" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)" />
                <text x="410" y="415" fill="#4361EE" font-size="16" class="bold">n̂</text>
                <text x="430" y="415" fill="#FF3366" font-size="14" class="bold">E · n̂ = 0</text>

                <!-- Side Normal -->
                <line x1="520" y1="250" x2="590" y2="250" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)" />
                <g transform="translate(595, 255)">
                    <text fill="#4361EE" font-size="16" class="italic">d<tspan class="bold">A</tspan></text>
                    <path d="M 8 -12 h 10 l -2 -2 m 2 2 l -2 2" fill="none" stroke="#4361EE" stroke-width="1.5" />
                </g>
                <text x="530" y="235" fill="#06D6A0" font-size="14" class="bold">E ∥ dA</text>
            </g>
        </g>

        <!-- Formula Overlay -->
        <rect x="150" y="430" width="500" height="50" rx="8" fill="#FFF" stroke="#00B4D8" stroke-width="2" />
        <text x="400" y="462" text-anchor="middle" font-size="18" fill="#212529" class="mono">
            ∮ <tspan fill="#F77F00" class="bold">E</tspan> · <tspan fill="#4361EE" class="bold">dA</tspan> = q<tspan dy="5" font-size="12">encl</tspan><tspan dy="-5"> / ε</tspan><tspan dy="5" font-size="12">0</tspan><tspan dy="-5">  ⇒  </tspan><tspan fill="#F77F00" class="bold">E</tspan>(2πrl) = λl / ε<tspan dy="5" font-size="12">0</tspan>
        </text>

    </svg>
</div>

</body>
</html>
