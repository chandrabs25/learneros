<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry of Paraxial Rays</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .svg-container {
      width: 100%;
      max-width: 1000px;
      height: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      background-color: #ffffff;
      border-radius: 12px;
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* CSS Animations */
    .incident {
      stroke-dasharray: 600;
      animation: anim-incident 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .normal {
      stroke-dasharray: 400;
      animation: anim-normal 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .reflected {
      stroke-dasharray: 1200;
      animation: anim-reflected 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .point-m {
      animation: anim-M 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arrow-inc {
      animation: anim-arrow-inc 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .arrow-ref {
      animation: anim-arrow-ref 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .angles-group {
      animation: anim-angles 10s infinite;
    }
    .ghost path {
      stroke-dasharray: 600;
      animation: anim-ghost-path 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }
    .ghost text, .ghost circle {
      animation: anim-ghost-text 10s infinite;
    }
    .formula {
      transform-origin: 80px 445px;
      animation: anim-formula 10s infinite;
    }

    /* Keyframes */
    @keyframes anim-incident {
      0% { stroke-dashoffset: 600; d: path('M 100 130 L 681.58 130'); opacity: 1; }
      10% { stroke-dashoffset: 0; d: path('M 100 130 L 681.58 130'); opacity: 1; }
      70% { stroke-dashoffset: 0; d: path('M 100 130 L 681.58 130'); opacity: 1; }
      85% { stroke-dashoffset: 0; d: path('M 100 230 L 699.50 230'); opacity: 1; }
      95% { stroke-dashoffset: 0; d: path('M 100 230 L 699.50 230'); opacity: 1; }
      100% { stroke-dashoffset: 0; d: path('M 100 230 L 699.50 230'); opacity: 0; }
    }

    @keyframes anim-normal {
      0%, 10% { stroke-dashoffset: 400; d: path('M 300 250 L 681.58 130'); opacity: 0; }
      10.1% { opacity: 1; stroke-dashoffset: 400; d: path('M 300 250 L 681.58 130'); }
      20% { stroke-dashoffset: 0; d: path('M 300 250 L 681.58 130'); opacity: 1; }
      70% { stroke-dashoffset: 0; d: path('M 300 250 L 681.58 130'); opacity: 1; }
      85% { stroke-dashoffset: 0; d: path('M 300 250 L 699.50 230'); opacity: 1; }
      95% { stroke-dashoffset: 0; d: path('M 300 250 L 699.50 230'); opacity: 1; }
      100% { stroke-dashoffset: 0; d: path('M 300 250 L 699.50 230'); opacity: 0; }
    }

    @keyframes anim-reflected {
      0%, 20% { stroke-dashoffset: 1200; d: path('M 681.58 130 L 366.35 350'); opacity: 0; }
      20.1% { opacity: 1; stroke-dashoffset: 1200; d: path('M 681.58 130 L 366.35 350'); }
      30% { stroke-dashoffset: 0; d: path('M 681.58 130 L 366.35 350'); opacity: 1; }
      70% { stroke-dashoffset: 0; d: path('M 681.58 130 L 366.35 350'); opacity: 1; }
      85% { stroke-dashoffset: 0; d: path('M 699.50 230 L -495.7 350'); opacity: 1; }
      95% { stroke-dashoffset: 0; d: path('M 699.50 230 L -495.7 350'); opacity: 1; }
      100% { stroke-dashoffset: 0; d: path('M 699.50 230 L -495.7 350'); opacity: 0; }
    }

    @keyframes anim-M {
      0%, 10% { opacity: 0; transform: translate(681.58px, 130px); }
      10.1%, 70% { opacity: 1; transform: translate(681.58px, 130px); }
      85%, 95% { opacity: 1; transform: translate(699.50px, 230px); }
      100% { opacity: 0; transform: translate(699.50px, 230px); }
    }

    @keyframes anim-arrow-inc {
      0%, 5% { opacity: 0; transform: translate(400px, 130px); }
      10%, 70% { opacity: 1; transform: translate(400px, 130px); }
      85%, 95% { opacity: 1; transform: translate(400px, 230px); }
      100% { opacity: 0; transform: translate(400px, 230px); }
    }

    @keyframes anim-arrow-ref {
      0%, 25% { opacity: 0; transform: translate(509.64px, 250px) rotate(145.08deg); }
      30%, 70% { opacity: 1; transform: translate(509.64px, 250px) rotate(145.08deg); }
      85%, 95% { opacity: 1; transform: translate(500.30px, 250px) rotate(174.27deg); }
      100% { opacity: 0; transform: translate(500.30px, 250px) rotate(174.27deg); }
    }

    @keyframes anim-angles {
      0%, 30% { opacity: 0; }
      35%, 65% { opacity: 1; }
      70%, 100% { opacity: 0; }
    }

    @keyframes anim-ghost-path {
      0%, 40% { opacity: 0; stroke-dashoffset: 600; }
      45%, 55% { opacity: 0.4; stroke-dashoffset: 0; }
      60%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }

    @keyframes anim-ghost-text {
      0%, 40% { opacity: 0; }
      45%, 55% { opacity: 1; }
      60%, 100% { opacity: 0; }
    }

    @keyframes anim-formula {
      0%, 85% { fill: #495057; transform: scale(1); }
      88%, 92% { fill: #06D6A0; transform: scale(1.15); }
      95%, 100% { fill: #495057; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
      <title id="svg-title">Geometry of Paraxial Rays: Deriving the Focal Length</title>
      <desc id="svg-desc">Animated diagram showing the geometric derivation of focal length for a concave mirror, demonstrating how paraxial rays converge at f = R/2.</desc>

      <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="4" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
      </defs>

      <!-- Background -->
      <rect width="100%" height="100%" fill="#f8f9fa"/>

      <!-- Title & Legend -->
      <text x="40" y="50" font-family="Inter" font-size="22" font-weight="700" fill="#212529">Geometry of Spherical Mirrors: f = R/2</text>
      
      <g font-family="Inter" font-size="13" fill="#6C757D">
        <circle cx="45" cy="75" r="5" fill="#00B4D8"/>
        <text x="55" y="79">Incident Ray</text>
        
        <circle cx="155" cy="75" r="5" fill="#FF3366"/>
        <text x="165" y="79">Reflected Ray</text>
        
        <line x1="265" y1="75" x2="280" y2="75" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="285" y="79">Normal (Radius)</text>
      </g>

      <!-- Dimensions (R and f) -->
      <g class="dimensions">
        <!-- R Bracket -->
        <line x1="300" y1="290" x2="700" y2="290" stroke="#ADB5BD" stroke-width="2"/>
        <line x1="300" y1="285" x2="300" y2="295" stroke="#ADB5BD" stroke-width="2"/>
        <line x1="700" y1="285" x2="700" y2="295" stroke="#ADB5BD" stroke-width="2"/>
        <rect x="485" y="280" width="30" height="20" fill="#f8f9fa"/>
        <text x="500" y="295" font-family="Inter" font-size="14" font-style="italic" font-weight="600" fill="#6C757D" text-anchor="middle">R</text>

        <!-- f Bracket -->
        <line x1="500" y1="265" x2="700" y2="265" stroke="#ADB5BD" stroke-width="2"/>
        <line x1="500" y1="260" x2="500" y2="270" stroke="#ADB5BD" stroke-width="2"/>
        <rect x="590" y="255" width="20" height="20" fill="#f8f9fa"/>
        <text x="600" y="270" font-family="Inter" font-size="14" font-style="italic" font-weight="600" fill="#6C757D" text-anchor="middle">f</text>
      </g>

      <!-- Principal Axis -->
      <line x1="40" y1="250" x2="760" y2="250" stroke="#495057" stroke-width="1.5" stroke-dasharray="8,4"/>

      <!-- Mirror -->
      <path d="M 627.66 20.57 A 400 400 0 0 1 627.66 479.43" fill="none" stroke="#ADB5BD" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M 627.66 20.57 A 400 400 0 0 1 627.66 479.43" fill="none" stroke="#CED4DA" stroke-width="2" stroke-linecap="round"/>

      <!-- Ghost Ray (Spherical Aberration) -->
      <g class="ghost">
        <path d="M 100 50 L 646.41 50" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
        <path d="M 646.41 50 L 473.2 350" fill="none" stroke="#FF3366" stroke-width="2" stroke-linecap="round"/>
        <circle cx="646.41" cy="50" r="4" fill="#ADB5BD"/>
        <text x="480" y="40" font-family="Inter" font-size="12" font-weight="600" fill="#FF3366">Spherical Aberration (non-paraxial)</text>
      </g>

      <!-- Triangle Highlight & Angles -->
      <g class="angles-group">
        <path d="M 300 250 L 681.58 130 L 509.64 250 Z" fill="#06D6A0" fill-opacity="0.15"/>
        
        <!-- Angle at C -->
        <path d="M 340 250 A 40 40 0 0 0 338.16 238.00" fill="none" stroke="#06D6A0" stroke-width="2"/>
        <text x="348" y="242" font-family="Inter" font-size="14" font-style="italic" fill="#06D6A0">θ</text>
        
        <!-- Angle of Incidence -->
        <path d="M 641.58 130 A 40 40 0 0 0 643.42 142.00" fill="none" stroke="#06D6A0" stroke-width="2"/>
        <text x="628" y="128" font-family="Inter" font-size="14" font-style="italic" fill="#06D6A0">θ</text>
        
        <!-- Angle of Reflection -->
        <path d="M 643.42 142.00 A 40 40 0 0 0 648.78 152.88" fill="none" stroke="#06D6A0" stroke-width="2"/>
        <text x="632" y="158" font-family="Inter" font-size="14" font-style="italic" fill="#06D6A0">θ</text>
      </g>

      <!-- Main Rays -->
      <path class="normal" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>
      <path class="incident" fill="none" stroke="#00B4D8" stroke-width="3" stroke-linecap="round"/>
      <path class="reflected" fill="none" stroke="#FF3366" stroke-width="3" stroke-linecap="round"/>

      <!-- Arrowheads -->
      <path class="arrow-inc" d="M -12 -6 L 0 0 L -12 6 Z" fill="#00B4D8"/>
      <path class="arrow-ref" d="M -12 -6 L 0 0 L -12 6 Z" fill="#FF3366"/>

      <!-- Points -->
      <circle cx="300" cy="250" r="5" fill="#495057"/>
      <text x="295" y="272" font-family="Inter" font-size="16" font-weight="600" fill="#495057" text-anchor="end">C</text>

      <circle cx="500" cy="250" r="5" fill="#495057"/>
      <text x="495" y="272" font-family="Inter" font-size="16" font-weight="600" fill="#495057" text-anchor="end">F</text>

      <circle cx="700" cy="250" r="5" fill="#495057"/>
      <text x="712" y="272" font-family="Inter" font-size="16" font-weight="600" fill="#495057">P</text>

      <g class="point-m">
        <circle cx="0" cy="0" r="5" fill="#212529"/>
        <text x="10" y="-10" font-family="Inter" font-size="16" font-weight="600" fill="#212529">M</text>
      </g>

      <!-- Formula Box -->
      <g transform="translate(40, 310)">
        <rect x="0" y="0" width="240" height="160" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
        <text x="20" y="30" font-family="Roboto Mono" font-size="14" fill="#495057">∠i = ∠r = θ</text>
        <text x="20" y="55" font-family="Roboto Mono" font-size="14" fill="#495057">∠MCP = θ <tspan font-family="Inter" font-size="11" fill="#ADB5BD">(Alt. Int.)</tspan></text>
        <text x="20" y="80" font-family="Roboto Mono" font-size="14" fill="#495057">∴ CF = FM <tspan font-family="Inter" font-size="11" fill="#ADB5BD">(Isosceles)</tspan></text>
        <text x="20" y="110" font-family="Roboto Mono" font-size="14" fill="#495057">As M → P, FM → f</text>
        <text x="20" y="140" font-family="Roboto Mono" font-size="20" font-weight="700" fill="#495057" class="formula">f ≈ R/2</text>
      </g>

    </svg>
  </div>
</body>
</html>
