<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton's Second Law: Circular Motion to SHM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: block;
        }
        .title { font-size: 24px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #495057; text-anchor: middle; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 14px; fill: #212529; }
        .math-bold { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; fill: #212529; }
        .math-large { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .label { font-size: 14px; font-weight: 600; font-style: italic; }
        .legend-text { font-size: 13px; font-weight: 600; fill: #495057; alignment-baseline: middle; }
        
        /* SVG Elements */
        .axis { stroke: #ced4da; stroke-width: 2; stroke-dasharray: 6 6; }
        .orbit { stroke: #ced4da; stroke-width: 2; stroke-dasharray: 8 4; fill: none; }
        .surface { stroke: #adb5bd; stroke-width: 4; stroke-linecap: round; }
        .wall { fill: #adb5bd; }
        .spring { stroke: #868e96; stroke-width: 3; fill: none; stroke-linejoin: round; stroke-linecap: round; }
        .block { fill: #f8f9fa; stroke: #4361EE; stroke-width: 3; }
        .particle { fill: #212529; }
        .ghost-particle { fill: #adb5bd; }
        .shadow-line { stroke: #adb5bd; stroke-width: 2; stroke-dasharray: 4 4; }
        
        /* Vectors */
        .vec-f { stroke: #FF3366; stroke-width: 4; stroke-linecap: round; }
        .vec-v { stroke: #06D6A0; stroke-width: 4; stroke-linecap: round; }
        .vec-r { stroke: #4361EE; stroke-width: 4; stroke-linecap: round; }
        
        /* Text Colors */
        .fill-f { fill: #FF3366; }
        .fill-v { fill: #06D6A0; }
        .fill-r { fill: #4361EE; }
        
        /* Dashboard */
        .dash-box { fill: #f8f9fa; stroke: #e9ecef; stroke-width: 2; rx: 8; }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 900 600" id="physics-sim">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-f" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-v" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-r" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#4361EE" />
            </marker>
        </defs>

        <!-- Titles -->
        <text x="450" y="40" class="title">Newton’s Second Law: F = ma in Periodic Systems</text>
        <text x="230" y="80" class="subtitle">Uniform Circular Motion (UCM)</text>
        <text x="670" y="80" class="subtitle">Simple Harmonic Motion (SHM)</text>

        <!-- Legend -->
        <g transform="translate(320, 90)">
            <line x1="0" y1="0" x2="30" y2="0" class="vec-f" marker-end="url(#arrow-f)" />
            <text x="38" y="1" class="legend-text">Force (F)</text>
            
            <line x1="110" y1="0" x2="140" y2="0" class="vec-v" marker-end="url(#arrow-v)" />
            <text x="148" y="1" class="legend-text">Velocity (v)</text>
            
            <line x1="235" y1="0" x2="265" y2="0" class="vec-r" marker-end="url(#arrow-r)" />
            <text x="273" y="1" class="legend-text">Displacement (r, x)</text>
        </g>

        <!-- ================= UCM SYSTEM (LEFT) ================= -->
        <g id="ucm-system">
            <!-- Axes & Orbit -->
            <line x1="50" y1="280" x2="410" y2="280" class="axis" />
            <line x1="230" y1="100" x2="230" y2="460" class="axis" />
            <circle cx="230" cy="280" r="150" class="orbit" />
            <text x="215" y="295" class="math" fill="#adb5bd">O</text>

            <!-- Shadow Projection -->
            <line id="ucm-shadow" x1="230" y1="280" x2="230" y2="280" class="shadow-line" />
            <circle id="ucm-ghost" cx="230" cy="280" r="6" class="ghost-particle" />

            <!-- Vectors -->
            <line id="ucm-r" class="vec-r" marker-end="url(#arrow-r)" />
            <line id="ucm-v" class="vec-v" marker-end="url(#arrow-v)" />
            <line id="ucm-f" class="vec-f" marker-end="url(#arrow-f)" />

            <!-- Particle -->
            <circle id="ucm-particle" cx="380" cy="280" r="10" class="particle" />

            <!-- Labels -->
            <text id="lbl-ucm-r" class="label fill-r">r</text>
            <text id="lbl-ucm-v" class="label fill-v">v<tspan dy="4" font-size="10">tan</tspan></text>
            <text id="lbl-ucm-f" class="label fill-f">F<tspan dy="4" font-size="10">c</tspan></text>
        </g>

        <!-- ================= SHM SYSTEM (RIGHT) ================= -->
        <g id="shm-system">
            <!-- Surface & Wall -->
            <line x1="450" y1="310" x2="850" y2="310" class="surface" />
            <rect x="450" y="230" width="20" height="100" class="wall" rx="3" />
            
            <!-- Equilibrium Line & Markers -->
            <line x1="670" y1="150" x2="670" y2="380" class="axis" />
            <text x="665" y="330" class="math" fill="#adb5bd">0</text>
            <line x1="820" y1="300" x2="820" y2="320" class="axis" stroke-dasharray="none" />
            <text x="810" y="335" class="math" fill="#adb5bd">+A</text>
            <line x1="520" y1="300" x2="520" y2="320" class="axis" stroke-dasharray="none" />
            <text x="510" y="335" class="math" fill="#adb5bd">-A</text>

            <!-- Spring -->
            <path id="shm-spring" class="spring" d="" />

            <!-- Vectors -->
            <line id="shm-r" class="vec-r" marker-end="url(#arrow-r)" />
            <line id="shm-v" class="vec-v" marker-end="url(#arrow-v)" />
            <line id="shm-f" class="vec-f" marker-end="url(#arrow-f)" />

            <!-- Block -->
            <rect id="shm-block" x="645" y="260" width="50" height="50" rx="6" class="block" />
            <circle id="shm-dot" cx="670" cy="285" r="4" class="particle" />

            <!-- Labels -->
            <text id="lbl-shm-r" class="label fill-r">x</text>
            <text id="lbl-shm-v" class="label fill-v">v<tspan dy="4" font-size="10">x</tspan></text>
            <text id="lbl-shm-f" class="label fill-f">F<tspan dy="4" font-size="10">s</tspan></text>
        </g>

        <!-- ================= FORMULAS & DASHBOARD ================= -->
        <!-- UCM Formulas -->
        <text x="230" y="500" class="math-large">F_c = m\omega^2 r</text>
        <text x="230" y="530" class="math">|v| = \omega r = \text{const}</text>
        <text x="230" y="555" class="math">|F_c| = \text{const}</text>

        <!-- SHM Formulas -->
        <text x="670" y="500" class="math-large">F_s(t) = -m\omega^2 x(t)</text>
        <text x="670" y="530" class="math">v_x(t) = -v_{max} \sin(\omega t)</text>
        <text x="670" y="555" class="math">F_s(t) = -k \cdot x(t)</text>

        <!-- Real-time Dashboard -->
        <rect x="380" y="470" width="140" height="95" class="dash-box" />
        <text x="450" y="495" class="math-bold" text-anchor="middle" fill="#4361EE">x = <tspan id="val-x">0.00</tspan> A</text>
        <text x="450" y="520" class="math-bold" text-anchor="middle" fill="#06D6A0">v = <tspan id="val-v">0.00</tspan> v<tspan dy="3" font-size="10">max</tspan></text>
        <text x="450" y="545" class="math-bold" text-anchor="middle" fill="#FF3366">F = <tspan id="val-f">0.00</tspan> F<tspan dy="3" font-size="10">max</tspan></text>

    </svg>
</div>

<script>
    // Physics Constants
    const R = 150;            // Radius and Amplitude
    const CX = 230;           // UCM Center X
    const CY = 280;           // UCM Center Y
    const SX = 670;           // SHM Center X
    const SY = 285;           // SHM Center Y (Block center)
    const V_MAX = 90;         // Max velocity vector length
    const F_MAX = 90;         // Max force vector length
    const PERIOD = 8000;      // 8 seconds per revolution (ms)
    const OMEGA = 2 * Math.PI / PERIOD;

    // DOM Elements
    const els = {
        ucmParticle: document.getElementById('ucm-particle'),
        ucmGhost: document.getElementById('ucm-ghost'),
        ucmShadow: document.getElementById('ucm-shadow'),
        ucmR: document.getElementById('ucm-r'),
        ucmV: document.getElementById('ucm-v'),
        ucmF: document.getElementById('ucm-f'),
        
        shmBlock: document.getElementById('shm-block'),
        shmDot: document.getElementById('shm-dot'),
        shmSpring: document.getElementById('shm-spring'),
        shmR: document.getElementById('shm-r'),
        shmV: document.getElementById('shm-v'),
        shmF: document.getElementById('shm-f'),
        
        lblUcmR: document.getElementById('lbl-ucm-r'),
        lblUcmV: document.getElementById('lbl-ucm-v'),
        lblUcmF: document.getElementById('lbl-ucm-f'),
        lblShmR: document.getElementById('lbl-shm-r'),
        lblShmV: document.getElementById('lbl-shm-v'),
        lblShmF: document.getElementById('lbl-shm-f'),
        
        valX: document.getElementById('val-x'),
        valV: document.getElementById('val-v'),
        valF: document.getElementById('val-f')
    };

    // Helper to draw a realistic spring
    function drawSpring(startX, endX, y) {
        const coils = 10;
        const width = endX - startX;
        if (width < 10) return `M ${startX} ${y} L ${endX} ${y}`;
        
        const coilWidth = (width - 20) / coils;
        let d = `M ${startX} ${y} L ${startX + 10} ${y}`;
        
        for (let i = 0; i < coils; i++) {
            const cx = startX + 10 + i * coilWidth;
            d += ` L ${cx + coilWidth * 0.25} ${y - 12}`;
            d += ` L ${cx + coilWidth * 0.75} ${y + 12}`;
            if (i === coils - 1) {
                d += ` L ${cx + coilWidth} ${y}`;
            }
        }
        d += ` L ${endX} ${y}`;
        return d;
    }

    // Helper to update vector safely (hides if length is ~0 to avoid marker artifacts)
    function updateVector(el, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        if (Math.abs(dx) < 1 && Math.abs(dy) < 1) {
            el.setAttribute('display', 'none');
        } else {
            el.setAttribute('display', 'inline');
            el.setAttribute('x1', x1);
            el.setAttribute('y1', y1);
            el.setAttribute('x2', x2);
            el.setAttribute('y2', y2);
        }
    }

    // Main Animation Loop
    function animate(timestamp) {
        // Calculate physics state
        const theta = -OMEGA * timestamp; // Negative for counter-clockwise
        const cos = Math.cos(theta);
        const sin = Math.sin(theta);

        // --- UCM Calculations ---
        const px = CX + R * cos;
        const py = CY - R * sin; // SVG Y is inverted
        
        const vx_ucm = -V_MAX * sin;
        const vy_ucm = -V_MAX * cos;
        
        const fx_ucm = -F_MAX * cos;
        const fy_ucm = F_MAX * sin;

        // Update UCM Particle & Shadow
        els.ucmParticle.setAttribute('cx', px);
        els.ucmParticle.setAttribute('cy', py);
        
        els.ucmGhost.setAttribute('cx', px);
        
        els.ucmShadow.setAttribute('x1', px);
        els.ucmShadow.setAttribute('y1', py);
        els.ucmShadow.setAttribute('x2', px);
        els.ucmShadow.setAttribute('y2', CY);

        // Update UCM Vectors
        updateVector(els.ucmR, CX, CY, px, py);
        updateVector(els.ucmV, px, py, px + vx_ucm, py + vy_ucm);
        updateVector(els.ucmF, px, py, px + fx_ucm, py + fy_ucm);

        // Update UCM Labels
        els.lblUcmR.setAttribute('x', CX + (px - CX)/2 - 10);
        els.lblUcmR.setAttribute('y', CY + (py - CY)/2 - 10);
        
        els.lblUcmV.setAttribute('x', px + vx_ucm + 10);
        els.lblUcmV.setAttribute('y', py + vy_ucm + 10);
        
        els.lblUcmF.setAttribute('x', px + fx_ucm/2 - 15);
        els.lblUcmF.setAttribute('y', py + fy_ucm/2 - 15);


        // --- SHM Calculations ---
        const bx = SX + R * cos; // Block center X
        const blockLeft = bx - 25;
        
        const vx_shm = -V_MAX * sin;
        const fx_shm = -F_MAX * cos;

        // Update SHM Block & Spring
        els.shmBlock.setAttribute('x', blockLeft);
        els.shmDot.setAttribute('cx', bx);
        els.shmSpring.setAttribute('d', drawSpring(470, blockLeft, SY));

        // Update SHM Vectors
        // Displacement (offset Y to 340)
        updateVector(els.shmR, SX, 340, bx, 340);
        // Velocity (offset Y to 210)
        updateVector(els.shmV, bx, 210, bx + vx_shm, 210);
        // Force (centered on block Y = 285)
        updateVector(els.shmF, bx, SY, bx + fx_shm, SY);

        // Update SHM Labels
        els.lblShmR.setAttribute('x', SX + (bx - SX)/2 - 5);
        els.lblShmR.setAttribute('y', 360);
        
        els.lblShmV.setAttribute('x', bx + vx_shm/2 - 5);
        els.lblShmV.setAttribute('y', 200);
        
        els.lblShmF.setAttribute('x', bx + fx_shm/2 - 5);
        els.lblShmF.setAttribute('y', SY - 15);

        // --- Dashboard Updates ---
        // Format with + sign for positive values
        const fmt = (val) => (val >= 0 ? '+' : '') + val.toFixed(2);
        
        els.valX.textContent = fmt(cos);
        els.valV.textContent = fmt(-sin);
        els.valF.textContent = fmt(-cos);

        // Loop
        requestAnimationFrame(animate);
    }

    // Start animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
