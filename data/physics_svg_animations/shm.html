<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Harmonic Motion: Dynamics & Kinematics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Core SHM Timing Function */
        :root {
            --shm-ease: cubic-bezier(0.45, 0, 0.55, 1);
        }

        /* Animations */
        @keyframes oscillate {
            0% { transform: translateX(80px); animation-timing-function: var(--shm-ease); }
            50% { transform: translateX(-80px); animation-timing-function: var(--shm-ease); }
            100% { transform: translateX(80px); }
        }

        @keyframes springScale {
            0% { transform: scaleX(1.4); animation-timing-function: var(--shm-ease); }
            50% { transform: scaleX(0.6); animation-timing-function: var(--shm-ease); }
            100% { transform: scaleX(1.4); }
        }

        @keyframes scaleV {
            0% { transform: scaleX(0); animation-timing-function: ease-out; }
            25% { transform: scaleX(-1); animation-timing-function: ease-in; }
            50% { transform: scaleX(0); animation-timing-function: ease-out; }
            75% { transform: scaleX(1); animation-timing-function: ease-in; }
            100% { transform: scaleX(0); }
        }

        @keyframes scaleF {
            0% { transform: scaleX(-1); animation-timing-function: var(--shm-ease); }
            50% { transform: scaleX(1); animation-timing-function: var(--shm-ease); }
            100% { transform: scaleX(-1); }
        }

        @keyframes scaleX_vec {
            0% { transform: scaleX(1); animation-timing-function: var(--shm-ease); }
            50% { transform: scaleX(-1); animation-timing-function: var(--shm-ease); }
            100% { transform: scaleX(1); }
        }

        @keyframes scrollWave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200px); }
        }

        @keyframes dotY {
            0% { transform: translateY(-60px); animation-timing-function: var(--shm-ease); }
            50% { transform: translateY(60px); animation-timing-function: var(--shm-ease); }
            100% { transform: translateY(-60px); }
        }

        @keyframes peHeight {
            0%, 100% { transform: scaleY(1); animation-timing-function: ease-in-out; }
            25% { transform: scaleY(0); animation-timing-function: ease-in-out; }
            50% { transform: scaleY(1); animation-timing-function: ease-in-out; }
            75% { transform: scaleY(0); animation-timing-function: ease-in-out; }
        }

        @keyframes keHeight {
            0%, 100% { transform: scaleY(0); animation-timing-function: ease-in-out; }
            25% { transform: scaleY(1); animation-timing-function: ease-in-out; }
            50% { transform: scaleY(0); animation-timing-function: ease-in-out; }
            75% { transform: scaleY(1); animation-timing-function: ease-in-out; }
        }

        /* Applied Classes */
        .mass-group { animation: oscillate 4s infinite; }
        .spring { animation: springScale 4s infinite; transform-origin: 350px 180px; }
        .vec-v { animation: scaleV 4s infinite; transform-origin: 0px 0px; }
        .vec-f { animation: scaleF 4s infinite; transform-origin: 0px 0px; }
        .vec-x { animation: scaleX_vec 4s infinite; transform-origin: 550px 180px; }
        .wave-path { animation: scrollWave 4s linear infinite; }
        .tracking-dot { animation: dotY 4s infinite; transform-origin: 550px 400px; }
        .proj-line { animation: oscillate 4s infinite; }
        .bar-pe { animation: peHeight 4s infinite; transform-origin: 700px 240px; }
        .bar-ke { animation: keHeight 4s infinite; transform-origin: 730px 240px; }

        .math-text { font-family: 'Roboto Mono', monospace; font-size: 14px; }
        .label-text { font-size: 12px; fill: #6C757D; }
        .title-text { font-size: 22px; font-weight: 600; fill: #212529; }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated Simple Harmonic Motion</title>
        <desc>An interactive physics diagram showing the relationship between uniform circular motion, a mass-spring system, and a displacement-time graph.</desc>

        <!-- Definitions for Clip Paths -->
        <defs>
            <clipPath id="graph-clip">
                <rect x="100" y="300" width="450" height="200" />
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" class="title-text">Simple Harmonic Motion: Dynamics &amp; Kinematics</text>

        <!-- ==========================================
             ZONE A: REFERENCE CIRCLE (LEFT)
             ========================================== -->
        <g id="zone-a">
            <!-- Axes -->
            <line x1="60" y1="180" x2="260" y2="180" stroke="#DEE2E6" stroke-width="2" />
            <line x1="160" y1="80" x2="160" y2="280" stroke="#DEE2E6" stroke-width="2" />
            
            <!-- Circle Path -->
            <circle cx="160" cy="180" r="80" fill="none" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="6,6" />
            
            <!-- Rotating Phasor -->
            <g>
                <animateTransform attributeName="transform" type="rotate" from="0 160 180" to="-360 160 180" dur="4s" repeatCount="indefinite" />
                <line x1="160" y1="180" x2="240" y2="180" stroke="#495057" stroke-width="3" />
                <circle cx="240" cy="180" r="6" fill="#4361EE" />
            </g>

            <!-- Vertical Projection Line (Tracks X coordinate) -->
            <line x1="160" y1="90" x2="160" y2="270" stroke="#4361EE" stroke-width="2" stroke-dasharray="4,4" class="proj-line" opacity="0.6" />
            
            <text x="160" y="295" text-anchor="middle" class="label-text">Reference Circle</text>
        </g>

        <!-- ==========================================
             ZONE B: MASS-SPRING SYSTEM (CENTER)
             ========================================== -->
        <g id="zone-b">
            <!-- Floor and Wall -->
            <line x1="350" y1="205" x2="700" y2="205" stroke="#495057" stroke-width="3" stroke-linecap="round" />
            <line x1="350" y1="130" x2="350" y2="205" stroke="#495057" stroke-width="5" stroke-linecap="round" />
            
            <!-- Equilibrium & Amplitude Markers -->
            <line x1="550" y1="205" x2="550" y2="215" stroke="#ADB5BD" stroke-width="2" />
            <text x="550" y="230" text-anchor="middle" class="math-text" fill="#6C757D">0</text>
            
            <line x1="630" y1="205" x2="630" y2="215" stroke="#ADB5BD" stroke-width="2" />
            <text x="630" y="230" text-anchor="middle" class="math-text" fill="#6C757D">+A</text>
            
            <line x1="470" y1="205" x2="470" y2="215" stroke="#ADB5BD" stroke-width="2" />
            <text x="470" y="230" text-anchor="middle" class="math-text" fill="#6C757D">-A</text>

            <!-- Spring -->
            <path d="M 350 180 L 365 180 L 375 165 L 395 195 L 415 165 L 435 195 L 455 165 L 475 195 L 495 165 L 515 195 L 535 180 L 550 180" 
                  fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linejoin="round" class="spring" vector-effect="non-scaling-stroke" />

            <!-- Displacement Vector (Fixed origin at equilibrium) -->
            <g class="vec-x">
                <line x1="0" y1="0" x2="80" y2="0" stroke="#4361EE" stroke-width="3" vector-effect="non-scaling-stroke" />
                <polygon points="72,-5 82,0 72,5" fill="#4361EE" />
            </g>

            <!-- Moving Mass and its Vectors -->
            <g class="mass-group">
                <!-- The Block -->
                <rect x="530" y="155" width="40" height="50" fill="#495057" rx="4" />
                <circle cx="550" cy="180" r="3" fill="#f8f9fa" />

                <!-- Velocity Vector (Green) -->
                <g class="vec-v" transform="translate(550, 150)">
                    <line x1="0" y1="0" x2="60" y2="0" stroke="#06D6A0" stroke-width="3" vector-effect="non-scaling-stroke" />
                    <polygon points="52,-5 62,0 52,5" fill="#06D6A0" />
                </g>

                <!-- Force Vector (Red) -->
                <g class="vec-f" transform="translate(550, 180)">
                    <line x1="0" y1="0" x2="80" y2="0" stroke="#FF3366" stroke-width="3" vector-effect="non-scaling-stroke" />
                    <polygon points="72,-5 82,0 72,5" fill="#FF3366" />
                </g>

                <!-- Floating Labels for Vectors -->
                <text x="550" y="140" text-anchor="middle" class="math-text" fill="#06D6A0" font-weight="bold">v</text>
                <text x="550" y="200" text-anchor="middle" class="math-text" fill="#FF3366" font-weight="bold">F</text>
            </g>
            
            <!-- Formula Annotation -->
            <text x="400" y="110" class="math-text" fill="#FF3366">F = -kx</text>
        </g>

        <!-- ==========================================
             ZONE C: REAL-TIME GRAPH (BOTTOM)
             ========================================== -->
        <g id="zone-c">
            <!-- Graph Grid & Axes -->
            <line x1="100" y1="400" x2="600" y2="400" stroke="#DEE2E6" stroke-width="2" />
            <line x1="550" y1="320" x2="550" y2="480" stroke="#DEE2E6" stroke-width="2" />
            
            <line x1="100" y1="340" x2="600" y2="340" stroke="#E9ECEF" stroke-width="1" stroke-dasharray="4,4" />
            <line x1="100" y1="460" x2="600" y2="460" stroke="#E9ECEF" stroke-width="1" stroke-dasharray="4,4" />

            <text x="560" y="330" class="math-text" fill="#6C757D">+A</text>
            <text x="560" y="475" class="math-text" fill="#6C757D">-A</text>
            <text x="605" y="405" class="math-text" fill="#6C757D">t</text>

            <!-- Scrolling Wave Path -->
            <g clip-path="url(#graph-clip)">
                <!-- Path spans from x=150 to x=950. Period = 200px. Amplitude = 60px. -->
                <path d="M 150 340 Q 175 340, 200 400 T 250 460 T 300 400 T 350 340 T 400 400 T 450 460 T 500 400 T 550 340 T 600 400 T 650 460 T 700 400 T 750 340 T 800 400 T 850 460 T 900 400 T 950 340" 
                      fill="none" stroke="#ADB5BD" stroke-width="3" class="wave-path" />
            </g>

            <!-- Tracking Dot (Synchronized with Mass) -->
            <circle cx="550" cy="400" r="6" fill="#4361EE" class="tracking-dot" />
            
            <!-- Graph Formula -->
            <text x="120" y="325" class="math-text" fill="#4361EE">x(t) = A cos(ωt)</text>
        </g>

        <!-- ==========================================
             ZONE D: ENERGY BAR CHART (RIGHT)
             ========================================== -->
        <g id="zone-d">
            <!-- Chart Box -->
            <rect x="680" y="120" width="100" height="140" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" rx="6" />
            <text x="730" y="110" text-anchor="middle" class="label-text" font-weight="bold">Energy</text>
            
            <!-- Background Bars -->
            <rect x="695" y="140" width="15" height="100" fill="#E9ECEF" rx="2" />
            <rect x="725" y="140" width="15" height="100" fill="#E9ECEF" rx="2" />
            <rect x="755" y="140" width="15" height="100" fill="#E9ECEF" rx="2" />

            <!-- Animated Bars -->
            <rect x="695" y="140" width="15" height="100" fill="#4361EE" rx="2" class="bar-pe" />
            <rect x="725" y="140" width="15" height="100" fill="#FF3366" rx="2" class="bar-ke" />
            <rect x="755" y="140" width="15" height="100" fill="#7209B7" rx="2" /> <!-- Total Energy (Constant) -->

            <!-- Labels -->
            <text x="702.5" y="255" text-anchor="middle" class="math-text" font-size="11" fill="#4361EE">PE</text>
            <text x="732.5" y="255" text-anchor="middle" class="math-text" font-size="11" fill="#FF3366">KE</text>
            <text x="762.5" y="255" text-anchor="middle" class="math-text" font-size="11" fill="#7209B7">TE</text>
        </g>

        <!-- ==========================================
             LEGEND (BOTTOM LEFT)
             ========================================== -->
        <g id="legend" transform="translate(30, 420)">
            <rect x="0" y="0" width="12" height="12" fill="#4361EE" rx="2" />
            <text x="20" y="10" class="label-text">Displacement (x) / Potential Energy</text>
            
            <rect x="0" y="20" width="12" height="12" fill="#06D6A0" rx="2" />
            <text x="20" y="30" class="label-text">Velocity (v)</text>
            
            <rect x="0" y="40" width="12" height="12" fill="#FF3366" rx="2" />
            <text x="20" y="50" class="label-text">Restoring Force (F) / Kinetic Energy</text>
        </g>

    </svg>

</body>
</html>
