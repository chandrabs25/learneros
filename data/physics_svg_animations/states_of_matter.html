<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopic States of Matter</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --speed-mult: 1;
            --solid-color: #4361EE;
            --liquid-color: #00B4D8;
            --gas-color: #FF3366;
            --vector-color: #06D6A0;
            --lattice-color: #ced4da;
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-main: #212529;
            --text-muted: #495057;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            text-align: center;
            font-size: 28px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .controls {
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #dee2e6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .controls label {
            font-weight: 600;
            color: var(--text-main);
        }

        input[type=range] {
            width: 200px;
            accent-color: var(--gas-color);
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 70vh;
            background: var(--bg-color);
            border-radius: 12px;
        }

        /* Solid Animations */
        @keyframes vib-1 {
            0% { transform: translate(0, 0); }
            25% { transform: translate(1.5px, -1.5px); }
            50% { transform: translate(-1.5px, 1.5px); }
            75% { transform: translate(-1.5px, -1.5px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes vib-2 {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-1.5px, 1.5px); }
            50% { transform: translate(1.5px, -1.5px); }
            75% { transform: translate(1.5px, 1.5px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes vib-3 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(0, 2px); }
            66% { transform: translate(0, -2px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes vib-4 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(2px, 0); }
            66% { transform: translate(-2px, 0); }
            100% { transform: translate(0, 0); }
        }

        .solid-p.v1 { animation: vib-1 calc(0.3s / var(--speed-mult)) infinite alternate ease-in-out; }
        .solid-p.v2 { animation: vib-2 calc(0.35s / var(--speed-mult)) infinite alternate ease-in-out; }
        .solid-p.v3 { animation: vib-3 calc(0.25s / var(--speed-mult)) infinite alternate ease-in-out; }
        .solid-p.v4 { animation: vib-4 calc(0.4s / var(--speed-mult)) infinite alternate ease-in-out; }

        /* Liquid Animations */
        @keyframes flow-1 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(12px, 8px); }
            66% { transform: translate(-6px, 14px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes flow-2 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(-12px, 6px); }
            66% { transform: translate(8px, -10px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes flow-3 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(8px, -12px); }
            66% { transform: translate(-10px, -6px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes flow-4 {
            0% { transform: translate(0, 0); }
            33% { transform: translate(-8px, -8px); }
            66% { transform: translate(12px, 6px); }
            100% { transform: translate(0, 0); }
        }

        .liquid-p.f1 { animation: flow-1 calc(4s / var(--speed-mult)) infinite ease-in-out; }
        .liquid-p.f2 { animation: flow-2 calc(4.5s / var(--speed-mult)) infinite ease-in-out; }
        .liquid-p.f3 { animation: flow-3 calc(3.8s / var(--speed-mult)) infinite ease-in-out; }
        .liquid-p.f4 { animation: flow-4 calc(4.2s / var(--speed-mult)) infinite ease-in-out; }

        /* Gas Animations (Translations) */
        @keyframes gas-1 { 0% { transform: translate(20px, 40px); } 50% { transform: translate(180px, 100px); } 100% { transform: translate(20px, 40px); } }
        @keyframes gas-2 { 0% { transform: translate(180px, 240px); } 50% { transform: translate(40px, 180px); } 100% { transform: translate(180px, 240px); } }
        @keyframes gas-3 { 0% { transform: translate(100px, 20px); } 50% { transform: translate(100px, 260px); } 100% { transform: translate(100px, 20px); } }
        @keyframes gas-4 { 0% { transform: translate(20px, 260px); } 50% { transform: translate(180px, 20px); } 100% { transform: translate(20px, 260px); } }
        @keyframes gas-5 { 0% { transform: translate(40px, 40px); } 25% { transform: translate(160px, 120px); } 50% { transform: translate(60px, 240px); } 75% { transform: translate(140px, 200px); } 100% { transform: translate(40px, 40px); } }
        @keyframes gas-6 { 0% { transform: translate(150px, 150px); } 50% { transform: translate(20px, 150px); } 100% { transform: translate(150px, 150px); } }
        @keyframes gas-7 { 0% { transform: translate(80px, 260px); } 50% { transform: translate(160px, 20px); } 100% { transform: translate(80px, 260px); } }
        @keyframes gas-8 { 0% { transform: translate(20px, 100px); } 50% { transform: translate(180px, 200px); } 100% { transform: translate(20px, 100px); } }

        .g1 { animation: gas-1 calc(2.2s / var(--speed-mult)) linear infinite; }
        .g2 { animation: gas-2 calc(2.5s / var(--speed-mult)) linear infinite; }
        .g3 { animation: gas-3 calc(2.0s / var(--speed-mult)) linear infinite; }
        .g4 { animation: gas-4 calc(2.8s / var(--speed-mult)) linear infinite; }
        .g5 { animation: gas-5 calc(4.0s / var(--speed-mult)) linear infinite; }
        .g6 { animation: gas-6 calc(1.8s / var(--speed-mult)) linear infinite; }
        .g7 { animation: gas-7 calc(2.6s / var(--speed-mult)) linear infinite; }
        .g8 { animation: gas-8 calc(2.4s / var(--speed-mult)) linear infinite; }
        
        /* Reusing paths with negative delays for the other 8 particles */
        .g9 { animation: gas-1 calc(2.2s / var(--speed-mult)) linear infinite -1.1s; }
        .g10 { animation: gas-2 calc(2.5s / var(--speed-mult)) linear infinite -1.25s; }
        .g11 { animation: gas-3 calc(2.0s / var(--speed-mult)) linear infinite -1.0s; }
        .g12 { animation: gas-4 calc(2.8s / var(--speed-mult)) linear infinite -1.4s; }
        .g13 { animation: gas-6 calc(1.8s / var(--speed-mult)) linear infinite -0.9s; }
        .g14 { animation: gas-7 calc(2.6s / var(--speed-mult)) linear infinite -1.3s; }
        .g15 { animation: gas-8 calc(2.4s / var(--speed-mult)) linear infinite -1.2s; }
        .g16 { animation: gas-1 calc(2.7s / var(--speed-mult)) linear infinite -0.5s; }

        /* Gas Vector Rotations (Matching Translations) */
        @keyframes rot-1 { 0%, 49.9% { transform: rotate(20.5deg); } 50%, 100% { transform: rotate(200.5deg); } }
        @keyframes rot-3 { 0%, 49.9% { transform: rotate(90deg); } 50%, 100% { transform: rotate(270deg); } }
        @keyframes rot-4 { 0%, 49.9% { transform: rotate(-56.3deg); } 50%, 100% { transform: rotate(123.7deg); } }
        @keyframes rot-5 { 
            0%, 24.9% { transform: rotate(33.7deg); } 
            25%, 49.9% { transform: rotate(129.8deg); } 
            50%, 74.9% { transform: rotate(-26.6deg); } 
            75%, 100% { transform: rotate(-122deg); } 
        }

        .r1 { animation: rot-1 calc(2.2s / var(--speed-mult)) linear infinite; }
        .r3 { animation: rot-3 calc(2.0s / var(--speed-mult)) linear infinite; }
        .r4 { animation: rot-4 calc(2.8s / var(--speed-mult)) linear infinite; }
        .r5 { animation: rot-5 calc(4.0s / var(--speed-mult)) linear infinite; }

    </style>
</head>
<body>

<div class="container">
    <h1>Microscopic States of Matter</h1>
    <p class="subtitle">Kinetic Theory & Thermal Equilibrium</p>

    <div class="controls">
        <label for="tempSlider">Temperature (T) / Kinetic Energy:</label>
        <input type="range" id="tempSlider" min="0.2" max="3" step="0.1" value="1" oninput="updateSpeed(this.value)">
        <span id="temp-val" style="font-family: 'Roboto Mono', monospace; font-weight: bold; color: var(--gas-color);">1.0x</span>
    </div>

    <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Velocity Vectors -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--vector-color)" />
            </marker>

            <!-- Particle Symbols -->
            <symbol id="solid-particle" viewBox="-10 -10 20 20">
                <circle cx="0" cy="0" r="8" fill="var(--solid-color)" />
            </symbol>
            <symbol id="liquid-particle" viewBox="-10 -10 20 20">
                <circle cx="0" cy="0" r="7" fill="var(--liquid-color)" />
            </symbol>
            <symbol id="gas-particle" viewBox="-10 -10 20 20">
                <circle cx="0" cy="0" r="6" fill="var(--gas-color)" />
            </symbol>
        </defs>

        <!-- Panel Backgrounds -->
        <rect x="40" y="100" width="200" height="280" fill="var(--panel-bg)" stroke="#dee2e6" stroke-width="2" rx="8"/>
        <rect x="300" y="100" width="200" height="280" fill="var(--panel-bg)" stroke="#dee2e6" stroke-width="2" rx="8"/>
        <rect x="560" y="100" width="200" height="280" fill="var(--panel-bg)" stroke="#dee2e6" stroke-width="2" rx="8"/>

        <!-- Panel Headers -->
        <text x="140" y="80" text-anchor="middle" font-weight="700" font-size="18" fill="var(--text-muted)">SOLID</text>
        <text x="400" y="80" text-anchor="middle" font-weight="700" font-size="18" fill="var(--text-muted)">LIQUID</text>
        <text x="660" y="80" text-anchor="middle" font-weight="700" font-size="18" fill="var(--text-muted)">GAS</text>

        <!-- ========================================== -->
        <!-- SOLID PANEL -->
        <!-- ========================================== -->
        <g transform="translate(40, 100)">
            <!-- Lattice Lines -->
            <g stroke="var(--lattice-color)" stroke-width="2">
                <!-- Horizontal -->
                <line x1="40" y1="80" x2="160" y2="80"/>
                <line x1="40" y1="120" x2="160" y2="120"/>
                <line x1="40" y1="160" x2="160" y2="160"/>
                <line x1="40" y1="200" x2="160" y2="200"/>
                <!-- Vertical -->
                <line x1="40" y1="80" x2="40" y2="200"/>
                <line x1="80" y1="80" x2="80" y2="200"/>
                <line x1="120" y1="80" x2="120" y2="200"/>
                <line x1="160" y1="80" x2="160" y2="200"/>
            </g>

            <!-- Particles (4x4 Grid) -->
            <use href="#solid-particle" x="40" y="80" class="solid-p v1"/>
            <use href="#solid-particle" x="80" y="80" class="solid-p v2"/>
            <use href="#solid-particle" x="120" y="80" class="solid-p v3"/>
            <use href="#solid-particle" x="160" y="80" class="solid-p v4"/>

            <use href="#solid-particle" x="40" y="120" class="solid-p v3"/>
            <use href="#solid-particle" x="80" y="120" class="solid-p v4"/>
            <use href="#solid-particle" x="120" y="120" class="solid-p v1"/>
            <use href="#solid-particle" x="160" y="120" class="solid-p v2"/>

            <use href="#solid-particle" x="40" y="160" class="solid-p v2"/>
            <use href="#solid-particle" x="80" y="160" class="solid-p v1"/>
            <use href="#solid-particle" x="120" y="160" class="solid-p v4"/>
            <use href="#solid-particle" x="160" y="160" class="solid-p v3"/>

            <use href="#solid-particle" x="40" y="200" class="solid-p v4"/>
            <use href="#solid-particle" x="80" y="200" class="solid-p v3"/>
            <use href="#solid-particle" x="120" y="200" class="solid-p v2"/>
            <use href="#solid-particle" x="160" y="200" class="solid-p v1"/>
        </g>

        <!-- ========================================== -->
        <!-- LIQUID PANEL -->
        <!-- ========================================== -->
        <g transform="translate(300, 100)">
            <!-- Particles (Packed at bottom, irregular) -->
            <use href="#liquid-particle" x="35" y="260" class="liquid-p f1"/>
            <use href="#liquid-particle" x="75" y="265" class="liquid-p f2"/>
            <use href="#liquid-particle" x="115" y="258" class="liquid-p f3"/>
            <use href="#liquid-particle" x="155" y="262" class="liquid-p f4"/>

            <use href="#liquid-particle" x="55" y="240" class="liquid-p f3"/>
            <use href="#liquid-particle" x="95" y="245" class="liquid-p f4"/>
            <use href="#liquid-particle" x="135" y="238" class="liquid-p f1"/>
            <use href="#liquid-particle" x="170" y="245" class="liquid-p f2"/>

            <use href="#liquid-particle" x="40" y="220" class="liquid-p f2"/>
            <use href="#liquid-particle" x="80" y="225" class="liquid-p f1"/>
            <use href="#liquid-particle" x="120" y="218" class="liquid-p f4"/>
            <use href="#liquid-particle" x="160" y="222" class="liquid-p f3"/>

            <use href="#liquid-particle" x="60" y="200" class="liquid-p f4"/>
            <use href="#liquid-particle" x="100" y="205" class="liquid-p f3"/>
            <use href="#liquid-particle" x="140" y="198" class="liquid-p f2"/>
            
            <use href="#liquid-particle" x="85" y="180" class="liquid-p f1"/>
        </g>

        <!-- ========================================== -->
        <!-- GAS PANEL -->
        <!-- ========================================== -->
        <g transform="translate(560, 100)">
            <!-- Mean Free Path Trace -->
            <path d="M 40,40 L 160,120 L 60,240 L 140,200 Z" fill="none" stroke="var(--gas-color)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
            <text x="105" y="70" fill="var(--gas-color)" font-weight="bold" font-style="italic" font-size="14">λ</text>

            <!-- Particles with Vectors -->
            <g class="g1">
                <use href="#gas-particle" x="0" y="0"/>
                <g class="r1"><line x1="0" y1="0" x2="22" y2="0" stroke="var(--vector-color)" stroke-width="2" marker-end="url(#arrow)"/></g>
            </g>
            <g class="g3">
                <use href="#gas-particle" x="0" y="0"/>
                <g class="r3"><line x1="0" y1="0" x2="22" y2="0" stroke="var(--vector-color)" stroke-width="2" marker-end="url(#arrow)"/></g>
            </g>
            <g class="g4">
                <use href="#gas-particle" x="0" y="0"/>
                <g class="r4"><line x1="0" y1="0" x2="22" y2="0" stroke="var(--vector-color)" stroke-width="2" marker-end="url(#arrow)"/></g>
            </g>
            <!-- Highlighted Particle (Mean Free Path) -->
            <g class="g5">
                <circle cx="0" cy="0" r="7" fill="var(--gas-color)" stroke="#fff" stroke-width="2"/>
                <g class="r5"><line x1="0" y1="0" x2="28" y2="0" stroke="var(--vector-color)" stroke-width="2.5" marker-end="url(#arrow)"/></g>
            </g>

            <!-- Particles without Vectors (Background Gas) -->
            <use href="#gas-particle" x="0" y="0" class="g2"/>
            <use href="#gas-particle" x="0" y="0" class="g6"/>
            <use href="#gas-particle" x="0" y="0" class="g7"/>
            <use href="#gas-particle" x="0" y="0" class="g8"/>
            <use href="#gas-particle" x="0" y="0" class="g9"/>
            <use href="#gas-particle" x="0" y="0" class="g10"/>
            <use href="#gas-particle" x="0" y="0" class="g11"/>
            <use href="#gas-particle" x="0" y="0" class="g12"/>
            <use href="#gas-particle" x="0" y="0" class="g13"/>
            <use href="#gas-particle" x="0" y="0" class="g14"/>
            <use href="#gas-particle" x="0" y="0" class="g15"/>
            <use href="#gas-particle" x="0" y="0" class="g16"/>
        </g>

        <!-- ========================================== -->
        <!-- ANNOTATIONS -->
        <!-- ========================================== -->
        <!-- Solid Annotations -->
        <text x="140" y="410" text-anchor="middle" font-weight="600" fill="var(--solid-color)">Strong F<tspan baseline-shift="sub" font-size="10">inter</tspan></text>
        <text x="140" y="435" text-anchor="middle" font-weight="600" fill="var(--solid-color)">Low E<tspan baseline-shift="sub" font-size="10">k</tspan></text>

        <!-- Liquid Annotations -->
        <text x="400" y="410" text-anchor="middle" font-weight="600" fill="var(--liquid-color)">Fixed Volume</text>
        <text x="400" y="435" text-anchor="middle" font-weight="600" fill="var(--liquid-color)">Variable Shape</text>

        <!-- Gas Annotations -->
        <text x="660" y="410" text-anchor="middle" font-weight="600" fill="var(--gas-color)">Mean Free Path (λ)</text>
        <text x="660" y="435" text-anchor="middle" font-weight="600" fill="var(--gas-color)">High E<tspan baseline-shift="sub" font-size="10">k</tspan></text>

        <!-- ========================================== -->
        <!-- FORMULA OVERLAY & LEGEND -->
        <!-- ========================================== -->
        <!-- Legend -->
        <rect x="40" y="460" width="180" height="75" fill="var(--panel-bg)" stroke="#dee2e6" rx="6"/>
        <circle cx="55" cy="475" r="5" fill="var(--solid-color)"/>
        <text x="68" y="479" font-size="12" fill="var(--text-main)">Solid / Liquid</text>
        
        <circle cx="55" cy="495" r="5" fill="var(--gas-color)"/>
        <text x="68" y="499" font-size="12" fill="var(--text-main)">Gas Particle</text>

        <line x1="50" y1="515" x2="65" y2="515" stroke="var(--vector-color)" stroke-width="2" marker-end="url(#arrow)"/>
        <text x="75" y="519" font-size="12" fill="var(--text-main)">Velocity Vector</text>

        <!-- Formula -->
        <g transform="translate(340, 500)" font-family="'Roboto Mono', monospace" font-size="18" fill="var(--text-main)">
            <text x="0" y="0">v</text>
            <text x="11" y="5" font-size="12">rms</text>
            <text x="42" y="0">=</text>
            
            <!-- Square Root Symbol -->
            <path d="M 60,-2 L 64,4 L 70,-22 L 125,-22" fill="none" stroke="var(--text-main)" stroke-width="2"/>
            
            <!-- Numerator -->
            <text x="75" y="-10" font-size="14">3k</text>
            <text x="93" y="-6" font-size="10">B</text>
            <text x="102" y="-10" font-size="14">T</text>
            
            <!-- Fraction Line -->
            <line x1="72" y1="-4" x2="120" y2="-4" stroke="var(--text-main)" stroke-width="1.5"/>
            
            <!-- Denominator -->
            <text x="90" y="10" font-size="14">m</text>
        </g>
        
        <text x="560" y="495" font-size="12" fill="var(--text-muted)" font-style="italic">v<tspan baseline-shift="sub" font-size="9">rms</tspan> = Root Mean Square Speed</text>
        <text x="560" y="515" font-size="12" fill="var(--text-muted)" font-style="italic">T = Absolute Temperature</text>

    </svg>
</div>

<script>
    function updateSpeed(val) {
        // Update CSS variable for animation speed
        document.documentElement.style.setProperty('--speed-mult', val);
        // Update text display
        document.getElementById('temp-val').textContent = parseFloat(val).toFixed(1) + 'x';
    }
</script>

</body>
</html>
