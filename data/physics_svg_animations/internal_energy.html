<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Energy vs. Macroscopic Kinetic Energy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #2b2d42;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Particle Jiggle Animations (Thermal Motion) */
        @keyframes jiggle1 {
            0% { transform: translate(0,0) rotate(0deg); }
            25% { transform: translate(12px, -8px) rotate(90deg); }
            50% { transform: translate(-5px, 12px) rotate(180deg); }
            75% { transform: translate(-10px, -5px) rotate(270deg); }
            100% { transform: translate(0,0) rotate(360deg); }
        }
        @keyframes jiggle2 {
            0% { transform: translate(0,0) rotate(45deg); }
            25% { transform: translate(-10px, 10px) rotate(-45deg); }
            50% { transform: translate(8px, 5px) rotate(-135deg); }
            75% { transform: translate(5px, -12px) rotate(-225deg); }
            100% { transform: translate(0,0) rotate(-315deg); }
        }
        @keyframes jiggle3 {
            0% { transform: translate(0,0) rotate(120deg); }
            25% { transform: translate(8px, 8px) rotate(200deg); }
            50% { transform: translate(-12px, -4px) rotate(280deg); }
            75% { transform: translate(4px, -10px) rotate(360deg); }
            100% { transform: translate(0,0) rotate(480deg); }
        }
        @keyframes jiggle4 {
            0% { transform: translate(0,0) rotate(200deg); }
            25% { transform: translate(-8px, -10px) rotate(120deg); }
            50% { transform: translate(-5px, 10px) rotate(40deg); }
            75% { transform: translate(12px, 2px) rotate(-40deg); }
            100% { transform: translate(0,0) rotate(-160deg); }
        }
        @keyframes jiggle5 {
            0% { transform: translate(0,0) rotate(300deg); }
            25% { transform: translate(10px, 0px) rotate(390deg); }
            50% { transform: translate(0px, 12px) rotate(480deg); }
            75% { transform: translate(-10px, 0px) rotate(570deg); }
            100% { transform: translate(0,0) rotate(660deg); }
        }

        .p1 { animation: jiggle1 0.5s infinite linear; }
        .p2 { animation: jiggle2 0.6s infinite linear; }
        .p3 { animation: jiggle3 0.45s infinite linear; }
        .p4 { animation: jiggle4 0.7s infinite linear; }
        .p5 { animation: jiggle5 0.55s infinite linear; }
        .p6 { animation: jiggle1 0.65s infinite reverse linear; }
        .p7 { animation: jiggle2 0.5s infinite reverse linear; }
        .p8 { animation: jiggle3 0.75s infinite reverse linear; }
        .p9 { animation: jiggle4 0.4s infinite reverse linear; }
        .p10 { animation: jiggle5 0.6s infinite reverse linear; }

        /* System B Bulk Motion Animations */
        @keyframes moveSystemB {
            0%, 20% { transform: translateX(0); opacity: 1; animation-timing-function: ease-in; }
            40% { transform: translateX(80px); opacity: 1; animation-timing-function: linear; }
            80% { transform: translateX(240px); opacity: 1; animation-timing-function: linear; }
            90% { transform: translateX(280px); opacity: 0; }
            91%, 100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes scaleLine {
            0%, 20% { transform: scaleX(0); opacity: 0; }
            25% { opacity: 1; }
            40%, 80% { transform: scaleX(1); opacity: 1; }
            90%, 100% { transform: scaleX(0); opacity: 0; }
        }

        @keyframes moveHead {
            0%, 20% { transform: translateX(0); opacity: 0; }
            25% { opacity: 1; }
            40%, 80% { transform: translateX(80px); opacity: 1; }
            90%, 100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes riseKE {
            0%, 20% { height: 0px; y: 180px; }
            40%, 80% { height: 120px; y: 60px; }
            90%, 100% { height: 0px; y: 180px; }
        }

        .moving-system { animation: moveSystemB 10s infinite; }
        .vcm-line { animation: scaleLine 10s infinite; transform-origin: 0 0; }
        .vcm-head-group { animation: moveHead 10s infinite; }
        .k-bar { animation: riseKE 10s infinite; }

    </style>
</head>
<body>

<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
    <title>Internal Energy vs. Macroscopic Kinetic Energy</title>
    <desc>Diagram showing two gas containers. One is stationary, one is moving. Both have the same internal energy because their particles have the same random motion relative to the container.</desc>

    <defs>
        <!-- Marker for microscopic velocity vectors -->
        <marker id="green-arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Title and Subtitle -->
    <text x="450" y="40" font-size="22" font-weight="700" text-anchor="middle">Internal Energy (U) vs. Macroscopic Kinetic Energy (K)</text>
    <text x="450" y="65" font-size="14" fill="#6c757d" text-anchor="middle">Temperature depends only on random microscopic motion relative to the center of mass.</text>

    <!-- SYSTEM A (Stationary) -->
    <g id="system-a" transform="translate(40, 120)">
        <rect x="0" y="0" width="180" height="180" rx="12" fill="#f8f9fa" stroke="#4361EE" stroke-width="2"/>
        <text x="90" y="-15" font-size="16" font-weight="600" fill="#4361EE" text-anchor="middle">System A: V<tspan dy="4" font-size="0.7em">CM</tspan><tspan dy="-4"> = 0</tspan></text>
        
        <!-- Particles for System A -->
        <g transform="translate(30, 40)" class="p1">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(80, 30)" class="p2">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(140, 50)" class="p3">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(40, 90)" class="p4">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(100, 100)" class="p5">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(150, 110)" class="p6">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(50, 150)" class="p7">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(90, 160)" class="p8">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(130, 150)" class="p9">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(160, 160)" class="p10">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
    </g>

    <!-- SYSTEM B (Moving) -->
    <g id="system-b" class="moving-system" transform="translate(260, 120)">
        <rect x="0" y="0" width="180" height="180" rx="12" fill="#f8f9fa" stroke="#4361EE" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="90" y="-15" font-size="16" font-weight="600" fill="#FF3366" text-anchor="middle">System B: V<tspan dy="4" font-size="0.7em">CM</tspan><tspan dy="-4"> &gt; 0</tspan></text>
        
        <!-- Particles for System B (Identical initial relative positions and animations to System A) -->
        <g transform="translate(30, 40)" class="p1">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(80, 30)" class="p2">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(140, 50)" class="p3">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(40, 90)" class="p4">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(100, 100)" class="p5">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(150, 110)" class="p6">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(50, 150)" class="p7">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(90, 160)" class="p8">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(130, 150)" class="p9">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>
        <g transform="translate(160, 160)" class="p10">
            <circle cx="0" cy="0" r="4" fill="#4361EE"/><line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        </g>

        <!-- Macroscopic Velocity Vector (V_CM) -->
        <g transform="translate(90, 90)">
            <line x1="0" y1="0" x2="80" y2="0" stroke="#FF3366" stroke-width="5" class="vcm-line"/>
            <g class="vcm-head-group">
                <polygon points="0,0 -14,-7 -14,7" fill="#FF3366"/>
                <text x="8" y="-12" fill="#FF3366" font-size="16" font-weight="700" font-style="italic">V<tspan dy="4" font-size="0.7em">CM</tspan></text>
            </g>
        </g>
    </g>

    <!-- ENERGY GAUGES (Far Right) -->
    <g id="gauges" transform="translate(740, 100)">
        <text x="45" y="-15" font-size="16" font-weight="600" text-anchor="middle">System B Energy</text>
        
        <!-- Internal Energy (U) Gauge -->
        <rect x="10" y="10" width="30" height="180" fill="#e9ecef" rx="4"/>
        <rect x="10" y="50" width="30" height="140" fill="#4361EE" rx="4"/>
        <text x="25" y="215" font-size="14" font-weight="600" fill="#4361EE" text-anchor="middle">U</text>
        
        <!-- Bulk Kinetic Energy (K_CM) Gauge -->
        <rect x="60" y="10" width="30" height="180" fill="#e9ecef" rx="4"/>
        <rect x="60" y="180" width="30" height="0" fill="#FF3366" rx="4" class="k-bar"/>
        <text x="75" y="215" font-size="14" font-weight="600" fill="#FF3366" text-anchor="middle">K<tspan dy="4" font-size="0.7em">CM</tspan></text>
    </g>

    <!-- LEGEND -->
    <g id="legend" transform="translate(40, 360)">
        <rect x="0" y="0" width="180" height="100" fill="#f8f9fa" stroke="#dee2e6" rx="8"/>
        <text x="90" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#6c757d">LEGEND</text>
        
        <circle cx="20" cy="40" r="4" fill="#4361EE"/>
        <text x="35" y="44" font-size="13">Gas Particle (mass m)</text>
        
        <line x1="15" y1="65" x2="25" y2="65" stroke="#06D6A0" stroke-width="2" marker-end="url(#green-arrow)"/>
        <text x="35" y="69" font-size="13" font-style="italic">v<tspan dy="3" font-size="0.7em">i</tspan><tspan dy="-3"> - V</tspan><tspan dy="3" font-size="0.7em">CM</tspan><tspan dy="-3"> (Thermal)</tspan></text>
        
        <line x1="15" y1="85" x2="25" y2="85" stroke="#FF3366" stroke-width="3"/>
        <polygon points="25,85 20,82 20,88" fill="#FF3366"/>
        <text x="35" y="89" font-size="13" font-style="italic">V<tspan dy="3" font-size="0.7em">CM</tspan><tspan dy="-3"> (Bulk Motion)</tspan></text>
    </g>

    <!-- FORMULAS -->
    <g id="formulas" transform="translate(500, 390)" text-anchor="middle" class="math">
        <rect x="-220" y="-30" width="440" height="90" fill="#f8f9fa" stroke="#dee2e6" rx="8"/>
        
        <!-- Internal Energy Formula -->
        <text x="0" y="0" font-size="18" fill="#4361EE" font-weight="700">
            U = Σ ½m(v<tspan dy="5" font-size="0.7em">i</tspan><tspan dy="-5"> - V</tspan><tspan dy="5" font-size="0.7em">CM</tspan><tspan dy="-5">)</tspan><tspan dy="-8" font-size="0.7em">2</tspan>
        </text>
        
        <!-- Total Kinetic Energy Formula -->
        <text x="0" y="35" font-size="18" fill="#FF3366" font-weight="700">
            K<tspan dy="5" font-size="0.7em">total</tspan><tspan dy="-5"> = U + ½MV</tspan><tspan dy="5" font-size="0.7em">CM</tspan><tspan dy="-13" font-size="0.7em">2</tspan>
        </text>
    </g>

</svg>

</body>
</html>
