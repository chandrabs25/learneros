<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self Inductance in an AC Circuit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-bg: #f8f9fa;
            --color-text: #333333;
            --color-voltage: #FF3366;
            --color-current: #06D6A0;
            --color-emf: #4361EE;
            --color-mag: #7209B7;
            --color-inductor: #444444;
            --color-grid: #e9ecef;
            --play-state: running;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
        }

        .title {
            font-size: 22px;
            font-weight: 600;
            fill: var(--color-text);
            text-anchor: middle;
        }

        .subtitle {
            font-size: 14px;
            fill: #666;
            text-anchor: middle;
        }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        button {
            background: var(--color-text);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #555;
        }

        /* Animations */
        .animated {
            animation-play-state: var(--play-state) !important;
        }

        /* Vector Scaling (Sine Wave Approximation) */
        @keyframes scale-v {
            0% { transform: scaleY(0); }
            12.5% { transform: scaleY(0.707); }
            25% { transform: scaleY(1); }
            37.5% { transform: scaleY(0.707); }
            50% { transform: scaleY(0); }
            62.5% { transform: scaleY(-0.707); }
            75% { transform: scaleY(-1); }
            87.5% { transform: scaleY(-0.707); }
            100% { transform: scaleY(0); }
        }

        @keyframes scale-e {
            0% { transform: scaleY(0); }
            12.5% { transform: scaleY(-0.707); }
            25% { transform: scaleY(-1); }
            37.5% { transform: scaleY(-0.707); }
            50% { transform: scaleY(0); }
            62.5% { transform: scaleY(0.707); }
            75% { transform: scaleY(1); }
            87.5% { transform: scaleY(0.707); }
            100% { transform: scaleY(0); }
        }

        .vector-v-group {
            animation: scale-v 10s linear infinite;
        }

        .vector-e-group {
            animation: scale-e 10s linear infinite;
        }

        /* Vector Text Tracking */
        @keyframes text-v-y {
            0% { transform: translateY(0); }
            12.5% { transform: translateY(-63.6px); }
            25% { transform: translateY(-90px); }
            37.5% { transform: translateY(-63.6px); }
            50% { transform: translateY(0); }
            62.5% { transform: translateY(63.6px); }
            75% { transform: translateY(90px); }
            87.5% { transform: translateY(63.6px); }
            100% { transform: translateY(0); }
        }

        @keyframes text-e-y {
            0% { transform: translateY(0); }
            12.5% { transform: translateY(63.6px); }
            25% { transform: translateY(90px); }
            37.5% { transform: translateY(63.6px); }
            50% { transform: translateY(0); }
            62.5% { transform: translateY(-63.6px); }
            75% { transform: translateY(-90px); }
            87.5% { transform: translateY(-63.6px); }
            100% { transform: translateY(0); }
        }

        .label-v { animation: text-v-y 10s linear infinite; }
        .label-e { animation: text-e-y 10s linear infinite; }

        /* Current Flow (Dashed Line Offset) */
        @keyframes current-flow {
            0% { stroke-dashoffset: 0; }
            12.5% { stroke-dashoffset: -35.35px; }
            25% { stroke-dashoffset: -50px; }
            37.5% { stroke-dashoffset: -35.35px; }
            50% { stroke-dashoffset: 0; }
            62.5% { stroke-dashoffset: 35.35px; }
            75% { stroke-dashoffset: 50px; }
            87.5% { stroke-dashoffset: 35.35px; }
            100% { stroke-dashoffset: 0; }
        }

        .current-wire {
            animation: current-flow 10s linear infinite;
        }

        /* Magnetic Field Pulsing */
        @keyframes mag-pos {
            0% { opacity: 0; transform: scale(0.8); }
            25% { opacity: 0; transform: scale(0.8); }
            37.5% { opacity: 0.707; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
            62.5% { opacity: 0.707; transform: scale(0.9); }
            75% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        @keyframes mag-neg {
            0% { opacity: 1; transform: scale(1); }
            12.5% { opacity: 0.707; transform: scale(0.9); }
            25% { opacity: 0; transform: scale(0.8); }
            75% { opacity: 0; transform: scale(0.8); }
            87.5% { opacity: 0.707; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .mag-field-pos {
            animation: mag-pos 10s linear infinite;
            transform-origin: 300px 255px;
        }

        .mag-field-neg {
            animation: mag-neg 10s linear infinite;
            transform-origin: 300px 255px;
        }

        /* Graph Indicator Scanning */
        @keyframes scan {
            0% { transform: translateX(0); }
            100% { transform: translateX(300px); }
        }

        .indicator-group {
            animation: scan 10s linear infinite;
        }

        /* Graph Dots Y-Tracking */
        @keyframes dot-v-y {
            0% { transform: translateY(0); }
            12.5% { transform: translateY(-56.56px); }
            25% { transform: translateY(-80px); }
            37.5% { transform: translateY(-56.56px); }
            50% { transform: translateY(0); }
            62.5% { transform: translateY(56.56px); }
            75% { transform: translateY(80px); }
            87.5% { transform: translateY(56.56px); }
            100% { transform: translateY(0); }
        }

        @keyframes dot-i-y {
            0% { transform: translateY(80px); }
            12.5% { transform: translateY(56.56px); }
            25% { transform: translateY(0); }
            37.5% { transform: translateY(-56.56px); }
            50% { transform: translateY(-80px); }
            62.5% { transform: translateY(-56.56px); }
            75% { transform: translateY(0); }
            87.5% { transform: translateY(56.56px); }
            100% { transform: translateY(80px); }
        }

        .dot-v { animation: dot-v-y 10s linear infinite; }
        .dot-i { animation: dot-i-y 10s linear infinite; }

    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="playPauseBtn">⏸ Pause</button>
    </div>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for Markers -->
        <defs>
            <marker id="arrow-v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <polygon points="0,1 10,5 0,9" fill="var(--color-voltage)"/>
            </marker>
            <marker id="arrow-e" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <polygon points="0,1 10,5 0,9" fill="var(--color-emf)"/>
            </marker>
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <polygon points="0,1 10,5 0,9" fill="#888"/>
            </marker>
        </defs>

        <!-- Title & Headers -->
        <text x="400" y="35" class="title">Self Inductance in an AC Circuit</text>
        <text x="400" y="60" class="subtitle">Current lags Voltage by 90° (π/2 rad) due to Back-EMF opposing the change in current</text>

        <!-- ========================================== -->
        <!-- LEFT SIDE: PHYSICAL CIRCUIT                -->
        <!-- ========================================== -->
        
        <!-- Circuit Wires -->
        <path d="M 100 220 L 100 150 L 300 150 L 300 180" fill="none" stroke="#ccc" stroke-width="4"/>
        <path d="M 300 330 L 300 350 L 100 350 L 100 280" fill="none" stroke="#ccc" stroke-width="4"/>

        <!-- Current Flow (Moving Green Dots) -->
        <path d="M 100 220 L 100 150 L 300 150 L 300 180" fill="none" stroke="var(--color-current)" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" class="current-wire animated"/>
        <path d="M 300 330 L 300 350 L 100 350 L 100 280" fill="none" stroke="var(--color-current)" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" class="current-wire animated"/>

        <!-- AC Source -->
        <circle cx="100" cy="250" r="30" fill="#fff" stroke="#444" stroke-width="3"/>
        <path d="M 80 250 Q 90 230, 100 250 T 120 250" fill="none" stroke="#444" stroke-width="2"/>
        <text x="100" y="305" text-anchor="middle" class="math-text" fill="var(--color-voltage)">v = V_m sin(ωt)</text>

        <!-- Inductor (Solenoid) -->
        <path d="M 300 180 C 345 180, 345 210, 300 210 C 345 210, 345 240, 300 240 C 345 240, 345 270, 300 270 C 345 270, 345 300, 300 300 C 345 300, 345 330, 300 330" fill="none" stroke="var(--color-inductor)" stroke-width="4" stroke-linecap="round"/>
        <text x="300" y="380" text-anchor="middle" class="math-text" fill="var(--color-current)">i = I_m sin(ωt - π/2)</text>

        <!-- Magnetic Field Lines (Positive Current / Clockwise Flow) -->
        <g class="mag-field-pos animated">
            <ellipse cx="300" cy="255" rx="30" ry="85" fill="none" stroke="var(--color-mag)" stroke-width="2" stroke-dasharray="6 6"/>
            <ellipse cx="300" cy="255" rx="55" ry="110" fill="none" stroke="var(--color-mag)" stroke-width="2" stroke-dasharray="6 6"/>
            <!-- Arrows -->
            <polygon points="245,245 240,255 250,255" fill="var(--color-mag)"/>
            <polygon points="355,245 350,255 360,255" fill="var(--color-mag)"/>
            <polygon points="300,265 295,255 305,255" fill="var(--color-mag)"/>
        </g>

        <!-- Magnetic Field Lines (Negative Current / Counter-Clockwise Flow) -->
        <g class="mag-field-neg animated">
            <ellipse cx="300" cy="255" rx="30" ry="85" fill="none" stroke="var(--color-mag)" stroke-width="2" stroke-dasharray="6 6"/>
            <ellipse cx="300" cy="255" rx="55" ry="110" fill="none" stroke="var(--color-mag)" stroke-width="2" stroke-dasharray="6 6"/>
            <!-- Arrows -->
            <polygon points="245,265 240,255 250,255" fill="var(--color-mag)"/>
            <polygon points="355,265 350,255 360,255" fill="var(--color-mag)"/>
            <polygon points="300,245 295,255 305,255" fill="var(--color-mag)"/>
        </g>

        <!-- Voltage Vector (v) -->
        <g class="vector-v-group animated" style="transform-origin: 60px 250px;">
            <line x1="60" y1="250" x2="60" y2="170" stroke="var(--color-voltage)" stroke-width="4" marker-end="url(#arrow-v)"/>
        </g>
        <text x="45" y="255" class="math-text label-v animated" fill="var(--color-voltage)" font-weight="bold">v</text>

        <!-- Back-EMF Vector (e) -->
        <g class="vector-e-group animated" style="transform-origin: 340px 250px;">
            <line x1="340" y1="250" x2="340" y2="170" stroke="var(--color-emf)" stroke-width="4" marker-end="url(#arrow-e)"/>
        </g>
        <text x="355" y="255" class="math-text label-e animated" fill="var(--color-emf)" font-weight="bold">e</text>
        <text x="340" y="130" text-anchor="middle" class="math-text" fill="var(--color-emf)">e = -L(di/dt)</text>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: DYNAMIC PHASE GRAPH            -->
        <!-- ========================================== -->

        <!-- Graph Background & Grid -->
        <rect x="450" y="130" width="300" height="240" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
        <line x1="450" y1="170" x2="750" y2="170" stroke="var(--color-grid)" stroke-width="1"/>
        <line x1="450" y1="250" x2="750" y2="250" stroke="var(--color-grid)" stroke-width="1"/>
        <line x1="450" y1="330" x2="750" y2="330" stroke="var(--color-grid)" stroke-width="1"/>
        
        <line x1="525" y1="130" x2="525" y2="370" stroke="var(--color-grid)" stroke-width="1"/>
        <line x1="600" y1="130" x2="600" y2="370" stroke="var(--color-grid)" stroke-width="1"/>
        <line x1="675" y1="130" x2="675" y2="370" stroke="var(--color-grid)" stroke-width="1"/>

        <!-- Axes -->
        <line x1="450" y1="250" x2="770" y2="250" stroke="#888" stroke-width="2" marker-end="url(#arrow-axis)"/>
        <line x1="450" y1="380" x2="450" y2="110" stroke="#888" stroke-width="2" marker-end="url(#arrow-axis)"/>
        <text x="765" y="270" font-size="12" fill="#888" font-family="Inter">Time (t)</text>
        <text x="420" y="120" font-size="12" fill="#888" font-family="Inter">Magnitude</text>

        <!-- Voltage Wave (Red Sine) -->
        <path d="M 450 250 C 487.5 250, 487.5 170, 525 170 C 562.5 170, 562.5 250, 600 250 C 637.5 250, 637.5 330, 675 330 C 712.5 330, 712.5 250, 750 250" fill="none" stroke="var(--color-voltage)" stroke-width="3"/>
        
        <!-- Current Wave (Green Cosine, starts at -1 -> y=330) -->
        <path d="M 450 330 C 487.5 330, 487.5 250, 525 250 C 562.5 250, 562.5 170, 600 170 C 637.5 170, 637.5 250, 675 250 C 712.5 250, 712.5 330, 750 330" fill="none" stroke="var(--color-current)" stroke-width="3"/>

        <!-- Moving Indicator -->
        <g class="indicator-group animated">
            <line x1="450" y1="130" x2="450" y2="370" stroke="#444" stroke-width="2" stroke-dasharray="4 4"/>
            <circle cx="450" cy="250" r="6" fill="var(--color-voltage)" class="dot-v animated"/>
            <circle cx="450" cy="250" r="6" fill="var(--color-current)" class="dot-i animated"/>
        </g>

        <!-- Phase Labels on Graph -->
        <text x="525" y="385" text-anchor="middle" font-size="12" fill="#888">π/2</text>
        <text x="600" y="385" text-anchor="middle" font-size="12" fill="#888">π</text>
        <text x="675" y="385" text-anchor="middle" font-size="12" fill="#888">3π/2</text>
        <text x="750" y="385" text-anchor="middle" font-size="12" fill="#888">2π</text>

        <!-- Legend -->
        <rect x="450" y="410" width="300" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="4"/>
        
        <line x1="465" y1="425" x2="485" y2="425" stroke="var(--color-voltage)" stroke-width="3"/>
        <text x="495" y="430" font-size="12" fill="#333">Applied Voltage (v)</text>

        <line x1="465" y1="445" x2="485" y2="445" stroke="var(--color-current)" stroke-width="3"/>
        <text x="495" y="450" font-size="12" fill="#333">Current (i)</text>

        <line x1="625" y1="425" x2="645" y2="425" stroke="var(--color-emf)" stroke-width="3"/>
        <text x="655" y="430" font-size="12" fill="#333">Back-EMF (e)</text>

        <line x1="625" y1="445" x2="645" y2="445" stroke="var(--color-mag)" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="655" y="450" font-size="12" fill="#333">Magnetic Field (B)</text>

        <text x="600" y="470" text-anchor="middle" font-size="12" font-weight="600" fill="#555">v + e = 0 (Kirchhoff's Loop Rule)</text>

    </svg>
</div>

<script>
    const btn = document.getElementById('playPauseBtn');
    let isPlaying = true;

    btn.addEventListener('click', () => {
        if (isPlaying) {
            document.documentElement.style.setProperty('--play-state', 'paused');
            btn.textContent = '▶ Play';
        } else {
            document.documentElement.style.setProperty('--play-state', 'running');
            btn.textContent = '⏸ Pause';
        }
        isPlaying = !isPlaying;
    });
</script>

</body>
</html>
