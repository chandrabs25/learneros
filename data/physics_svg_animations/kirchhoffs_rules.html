<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff's Circuit Laws</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #212529;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            padding: 20px;
            box-sizing: border-box;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #212529;
        }
        p.subtitle {
            margin: 0;
            color: #6c757d;
            font-size: 15px;
        }
        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            background: #4361EE;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(67, 97, 238, 0.2);
        }
        button:hover {
            background: #324fc7;
            transform: translateY(-1px);
        }
        button.active {
            background: #06D6A0;
            color: #111;
            box-shadow: 0 2px 4px rgba(6, 214, 160, 0.3);
        }
        button#btn-play.paused {
            background: #FF3366;
            box-shadow: 0 2px 4px rgba(255, 51, 102, 0.3);
        }
        
        /* SVG Styles */
        svg {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
        
        /* Current Animation */
        .current-fast {
            stroke: #06D6A0;
            stroke-width: 6;
            stroke-dasharray: 6 24;
            stroke-linecap: round;
            animation: flow 0.5s linear infinite;
        }
        .current-slow {
            stroke: #06D6A0;
            stroke-width: 6;
            stroke-dasharray: 6 24;
            stroke-linecap: round;
            animation: flow 1s linear infinite;
        }
        @keyframes flow {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: 0; }
        }

        /* Voltage Probe Animation */
        .probe-circle {
            animation: probe-color 16s linear infinite;
        }
        @keyframes probe-color {
            0%, 18% { stroke: #4361EE; r: 8px; }
            19%, 43% { stroke: #FF3366; r: 12px; }
            44%, 55% { stroke: #4361EE; r: 8px; }
            56%, 68% { stroke: #FF3366; r: 12px; }
            69%, 80% { stroke: #7209B7; r: 10px; }
            81%, 100% { stroke: #4361EE; r: 8px; }
        }

        /* Dynamic Text Popups */
        .popup {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 16px;
            opacity: 0;
            animation-duration: 16s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            paint-order: stroke;
            stroke: #f8f9fa;
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .pop-bat { animation-name: pop-bat; fill: #FF3366; }
        .pop-r1-down { animation-name: pop-r1-down; fill: #4361EE; }
        .pop-r1-up { animation-name: pop-r1-up; fill: #FF3366; }
        .pop-r3 { animation-name: pop-r3; fill: #7209B7; }
        .pop-r2 { animation-name: pop-r2; fill: #4361EE; }

        @keyframes pop-bat { 17%, 21% { opacity: 1; } }
        @keyframes pop-r1-down { 42%, 46% { opacity: 1; } }
        @keyframes pop-r1-up { 55%, 59% { opacity: 1; } }
        @keyframes pop-r3 { 67%, 71% { opacity: 1; } }
        @keyframes pop-r2 { 80%, 84% { opacity: 1; } }

        /* Loop Highlighting */
        .left-loop, .right-loop, .shared {
            transition: opacity 0.3s ease;
        }
        svg.show-loop1 .right-loop { opacity: 0.15; }
        svg.show-loop2 .left-loop { opacity: 0.15; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kirchhoff's Circuit Laws</h1>
        <p class="subtitle">Conservation of Charge (Junction Rule) & Conservation of Energy (Loop Rule)</p>
    </header>

    <div class="controls">
        <button id="btn-play">Pause Animation</button>
        <button id="btn-loop1">Highlight Left Loop</button>
        <button id="btn-loop2">Highlight Right Loop</button>
        <button id="btn-all" class="active">Show All</button>
    </div>

    <svg id="circuit-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated Kirchhoff's Circuit Diagram</title>
        <desc>A two-loop circuit demonstrating Kirchhoff's rules. Particles show current splitting at junctions. A probe measures voltage drops and gains around the loops.</desc>

        <!-- 1. POTENTIAL GLOWS (Background) -->
        <!-- Left Loop High Potential (12V) -->
        <path class="left-loop shared" d="M 150 275 L 150 150 L 400 150 L 400 250" fill="none" stroke="#FF3366" stroke-width="16" opacity="0.15" stroke-linecap="round"/>
        <!-- Right Loop Mid Potential (6V) -->
        <path class="right-loop" d="M 400 150 L 650 150 L 650 250" fill="none" stroke="#7209B7" stroke-width="16" opacity="0.15" stroke-linecap="round"/>
        <!-- Low Potential (0V) -->
        <path class="left-loop shared right-loop" d="M 150 275 L 150 400 L 650 400 L 650 275 M 400 300 L 400 400" fill="none" stroke="#4361EE" stroke-width="16" opacity="0.15" stroke-linecap="round"/>

        <!-- 2. CIRCUIT WIRES -->
        <path class="left-loop" d="M 400 400 L 150 400 L 150 150 L 400 150" fill="none" stroke="#333" stroke-width="3"/>
        <path class="shared" d="M 400 150 L 400 400" fill="none" stroke="#333" stroke-width="3"/>
        <path class="right-loop" d="M 400 150 L 650 150 L 650 400 L 400 400" fill="none" stroke="#333" stroke-width="3"/>

        <!-- 3. CURRENT PARTICLES -->
        <!-- I1 (6A) - Fast -->
        <path class="left-loop current-fast" d="M 400 400 L 150 400 L 150 150 L 400 150" fill="none"/>
        <!-- I2 (3A) - Slow -->
        <path class="shared current-slow" d="M 400 150 L 400 400" fill="none"/>
        <!-- I3 (3A) - Slow -->
        <path class="right-loop current-slow" d="M 400 150 L 650 150 L 650 400 L 400 400" fill="none"/>

        <!-- 4. COMPONENT OVERLAYS (Hides wires & particles underneath) -->
        <rect class="left-loop" x="120" y="245" width="60" height="60" fill="#f8f9fa"/>
        <rect class="shared" x="380" y="245" width="40" height="60" fill="#f8f9fa"/>
        <rect class="right-loop" x="630" y="245" width="40" height="60" fill="#f8f9fa"/>
        <rect class="right-loop" x="495" y="130" width="60" height="40" fill="#f8f9fa"/>

        <!-- 5. COMPONENTS -->
        <!-- Battery V1 -->
        <g class="left-loop">
            <line x1="125" y1="265" x2="175" y2="265" stroke="#FF3366" stroke-width="5" stroke-linecap="round"/>
            <line x1="135" y1="285" x2="165" y2="285" stroke="#333" stroke-width="5" stroke-linecap="round"/>
            <text x="110" y="270" font-size="16" fill="#FF3366" font-weight="bold" text-anchor="end">+</text>
            <text x="110" y="290" font-size="20" fill="#333" font-weight="bold" text-anchor="end">-</text>
            <text x="80" y="280" font-size="16" class="math" fill="#212529">V₁=12V</text>
        </g>

        <!-- Resistor R1 -->
        <g class="shared">
            <path d="M 400 250 l -12 5 l 24 10 l -24 10 l 24 10 l -24 10 l 12 5" fill="none" stroke="#4361EE" stroke-width="3" stroke-linejoin="round"/>
            <text x="435" y="280" font-size="16" class="math" fill="#212529">R₁=4Ω</text>
        </g>

        <!-- Resistor R2 -->
        <g class="right-loop">
            <path d="M 650 250 l -12 5 l 24 10 l -24 10 l 24 10 l -24 10 l 12 5" fill="none" stroke="#4361EE" stroke-width="3" stroke-linejoin="round"/>
            <text x="685" y="280" font-size="16" class="math" fill="#212529">R₂=2Ω</text>
        </g>

        <!-- Resistor R3 -->
        <g class="right-loop">
            <path d="M 500 150 l 5 -12 l 10 24 l 10 -24 l 10 24 l 10 -24 l 5 12" fill="none" stroke="#4361EE" stroke-width="3" stroke-linejoin="round"/>
            <text x="525" y="120" font-size="16" class="math" fill="#212529" text-anchor="middle">R₃=2Ω</text>
        </g>

        <!-- 6. JUNCTIONS -->
        <circle class="shared" cx="400" cy="150" r="6" fill="#212529"/>
        <circle class="shared" cx="400" cy="400" r="6" fill="#212529"/>

        <!-- 7. LABELS & ARROWS -->
        <!-- Current Arrows -->
        <g class="left-loop">
            <path d="M 260 144 L 272 150 L 260 156 Z" fill="#06D6A0"/>
            <text x="266" y="135" font-size="15" class="math" fill="#06D6A0" text-anchor="middle">I₁=6A</text>
        </g>
        <g class="shared">
            <path d="M 394 200 L 400 212 L 406 200 Z" fill="#06D6A0"/>
            <text x="420" y="210" font-size="15" class="math" fill="#06D6A0">I₂=3A</text>
        </g>
        <g class="right-loop">
            <path d="M 450 144 L 462 150 L 450 156 Z" fill="#06D6A0"/>
            <text x="456" y="135" font-size="15" class="math" fill="#06D6A0" text-anchor="middle">I₃=3A</text>
        </g>

        <!-- Equations -->
        <g class="shared">
            <rect x="290" y="55" width="220" height="50" rx="8" fill="#fff" stroke="#06D6A0" stroke-width="2" opacity="0.9"/>
            <text x="400" y="75" font-size="14" class="math" fill="#06D6A0" text-anchor="middle">Σ I_in = Σ I_out</text>
            <text x="400" y="95" font-size="14" class="math" fill="#06D6A0" text-anchor="middle">I₁ = I₂ + I₃</text>
        </g>

        <text class="left-loop math" x="275" y="280" font-size="18" fill="#FF3366" text-anchor="middle" opacity="0.6">Σ ΔV = 0</text>
        <text class="right-loop math" x="525" y="280" font-size="18" fill="#7209B7" text-anchor="middle" opacity="0.6">Σ ΔV = 0</text>

        <!-- 8. VOLTAGE PROBE & POPUPS -->
        <text class="popup pop-bat" x="185" y="260">+12V</text>
        <text class="popup pop-r1-down" x="435" y="250">-12V</text>
        <text class="popup pop-r1-up" x="325" y="250">+12V</text>
        <text class="popup pop-r3" x="525" y="100" text-anchor="middle">-6V</text>
        <text class="popup pop-r2" x="685" y="250">-6V</text>

        <g id="probe-group">
            <animateMotion dur="16s" repeatCount="indefinite" path="M 400 400 L 150 400 L 150 150 L 400 150 L 400 400 L 400 150 L 650 150 L 650 400 L 400 400"/>
            <circle class="probe-circle" cx="0" cy="0" r="8" fill="#ffffff" stroke-width="4"/>
        </g>

        <!-- 9. LEGEND -->
        <g transform="translate(20, 400)">
            <rect x="0" y="0" width="165" height="85" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
            <circle cx="15" cy="20" r="4" fill="#06D6A0"/>
            <text x="28" y="24" font-size="12" fill="#495057">Current Flow (I)</text>
            
            <line x1="10" y1="40" x2="20" y2="40" stroke="#FF3366" stroke-width="4" stroke-linecap="round"/>
            <text x="28" y="44" font-size="12" fill="#495057">High Potential (12V)</text>
            
            <line x1="10" y1="60" x2="20" y2="60" stroke="#7209B7" stroke-width="4" stroke-linecap="round"/>
            <text x="28" y="64" font-size="12" fill="#495057">Mid Potential (6V)</text>

            <line x1="10" y1="80" x2="20" y2="80" stroke="#4361EE" stroke-width="4" stroke-linecap="round"/>
            <text x="28" y="84" font-size="12" fill="#495057">Low Potential (0V)</text>
        </g>
    </svg>
</div>

<script>
    const svg = document.getElementById('circuit-svg');
    const btnPlay = document.getElementById('btn-play');
    const btnLoop1 = document.getElementById('btn-loop1');
    const btnLoop2 = document.getElementById('btn-loop2');
    const btnAll = document.getElementById('btn-all');
    const buttons = [btnLoop1, btnLoop2, btnAll];
    let isPaused = false;

    // Play/Pause functionality
    btnPlay.addEventListener('click', () => {
        isPaused = !isPaused;
        if (isPaused) {
            svg.pauseAnimations();
            btnPlay.textContent = 'Play Animation';
            btnPlay.classList.add('paused');
            // Pause CSS animations as well
            document.querySelectorAll('.current-fast, .current-slow, .probe-circle, .popup').forEach(el => {
                el.style.animationPlayState = 'paused';
            });
        } else {
            svg.unpauseAnimations();
            btnPlay.textContent = 'Pause Animation';
            btnPlay.classList.remove('paused');
            // Resume CSS animations
            document.querySelectorAll('.current-fast, .current-slow, .probe-circle, .popup').forEach(el => {
                el.style.animationPlayState = 'running';
            });
        }
    });

    // Loop Highlighting functionality
    function setActiveButton(activeBtn) {
        buttons.forEach(btn => btn.classList.remove('active'));
        activeBtn.classList.add('active');
    }

    btnLoop1.addEventListener('click', () => {
        svg.classList.remove('show-loop2');
        svg.classList.add('show-loop1');
        setActiveButton(btnLoop1);
    });

    btnLoop2.addEventListener('click', () => {
        svg.classList.remove('show-loop1');
        svg.classList.add('show-loop2');
        setActiveButton(btnLoop2);
    });

    btnAll.addEventListener('click', () => {
        svg.classList.remove('show-loop1', 'show-loop2');
        setActiveButton(btnAll);
    });
</script>

</body>
</html>
