<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specific Heat Capacity Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Text Styles */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #212529; }
        .subtitle { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #6c757d; }
        .label-bold { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; }
        .formula { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; }
        .math-text { font-family: 'Roboto Mono', monospace; font-weight: 400; font-size: 14px; fill: #495057; }
        .temp-text { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; fill: #F77F00; }

        /* Jitter Animations (Continuous) */
        @keyframes jx {
            0% { transform: translateX(-15px); }
            100% { transform: translateX(15px); }
        }
        @keyframes jy {
            0% { transform: translateY(-15px); }
            100% { transform: translateY(15px); }
        }

        .jx { animation: jx 0.13s infinite alternate ease-in-out; }
        .jy { animation: jy 0.17s infinite alternate ease-in-out; }

        /* Amplitude Scaling (10s Loop) */
        /* Water: Low amplitude change */
        @keyframes scale-water {
            0%, 20% { transform: scale(0.08); }
            70%, 80% { transform: scale(0.20); }
            100% { transform: scale(0.08); }
        }
        @keyframes inv-scale-water {
            0%, 20% { transform: scale(12.5); }
            70%, 80% { transform: scale(5.0); }
            100% { transform: scale(12.5); }
        }

        /* Metal: High amplitude change */
        @keyframes scale-metal {
            0%, 20% { transform: scale(0.08); }
            70%, 80% { transform: scale(0.85); }
            100% { transform: scale(0.08); }
        }
        @keyframes inv-scale-metal {
            0%, 20% { transform: scale(12.5); }
            70%, 80% { transform: scale(1.17); }
            100% { transform: scale(12.5); }
        }

        .scale-container-water { animation: scale-water 10s infinite ease-in-out; }
        .inverse-scale-water { animation: inv-scale-water 10s infinite ease-in-out; }
        
        .scale-container-metal { animation: scale-metal 10s infinite ease-in-out; }
        .inverse-scale-metal { animation: inv-scale-metal 10s infinite ease-in-out; }

        /* Thermometer Animations */
        @keyframes thermo-water {
            0%, 20% { height: 45px; y: 255px; }
            70%, 80% { height: 81px; y: 219px; }
            100% { height: 45px; y: 255px; }
        }
        @keyframes thermo-metal {
            0%, 20% { height: 45px; y: 255px; }
            70%, 80% { height: 162px; y: 138px; }
            100% { height: 45px; y: 255px; }
        }

        .thermo-water-liquid { animation: thermo-water 10s infinite ease-in-out; }
        .thermo-metal-liquid { animation: thermo-metal 10s infinite ease-in-out; }

        /* Heat Source Animations */
        @keyframes flame-env {
            0%, 20% { opacity: 0.15; transform: scaleY(0.3); }
            25%, 65% { opacity: 1; transform: scaleY(1); }
            70%, 100% { opacity: 0.15; transform: scaleY(0.3); }
        }
        @keyframes flame-flicker {
            0% { transform: scaleX(0.95) scaleY(0.95); }
            100% { transform: scaleX(1.05) scaleY(1.05); }
        }
        .flame-wrapper { animation: flame-env 10s infinite ease-in-out; transform-origin: 50% 360px; }
        .flame-inner { animation: flame-flicker 0.1s infinite alternate ease-in-out; transform-origin: 50% 360px; }

        /* Heat Arrows (Q) Animations */
        @keyframes arrow-env {
            0%, 20% { opacity: 0; }
            25%, 65% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }
        @keyframes arrow-flow {
            0% { opacity: 0; transform: translateY(10px); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-25px); }
        }
        .arrow-env { animation: arrow-env 10s infinite ease-in-out; }
        .arrow-1 { animation: arrow-flow 1.2s infinite linear; }
        .arrow-2 { animation: arrow-flow 1.2s infinite linear -0.4s; }
        .arrow-3 { animation: arrow-flow 1.2s infinite linear -0.8s; }

        /* Temperature Text Counter Animations */
        @keyframes t1 { 0%, 20% { opacity: 1; } 21%, 89% { opacity: 0; } 90%, 100% { opacity: 1; } }
        @keyframes t2 { 0%, 20% { opacity: 0; } 21%, 35% { opacity: 1; } 36%, 100% { opacity: 0; } }
        @keyframes t3 { 0%, 35% { opacity: 0; } 36%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
        @keyframes t4 { 0%, 55% { opacity: 0; } 56%, 89% { opacity: 1; } 90%, 100% { opacity: 0; } }
        
        .t1 { animation: t1 10s infinite; }
        .t2 { animation: t2 10s infinite; }
        .t3 { animation: t3 10s infinite; }
        .t4 { animation: t4 10s infinite; }
    </style>
</head>
