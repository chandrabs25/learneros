<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Broglie Hypothesis: Quantization of Orbits</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --allowed-color: #4361EE;
            --forbidden-color: #FF3366;
            --velocity-color: #06D6A0;
            --nucleus-color: #F77F00;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
            --orbit-line: #ced4da;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 8 / 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* UI Controls */
        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            background: #ffffff;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            padding: 8px 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background: var(--text-main);
            color: #ffffff;
        }

        /* CSS Animations */
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .rotating {
            transform-origin: 400px 270px;
            animation: rotate 4s linear infinite;
        }

        /* State Management via CSS */
        .wave-allowed, .label-allowed, .bracket-group { transition: opacity 0.5s ease; }
        .wave-forbidden, .label-forbidden { transition: opacity 0.5s ease; }
        .particle-group { transition: opacity 0.5s ease; }

        /* AUTO STATE */
        body[data-state="auto"] .wave-allowed,
        body[data-state="auto"] .bracket-group {
            animation: auto-allowed 12s infinite;
        }
        body[data-state="auto"] .label-allowed {
            animation: auto-allowed 12s infinite;
        }
        body[data-state="auto"] .wave-forbidden,
        body[data-state="auto"] .label-forbidden {
            animation: auto-forbidden 12s infinite;
        }
        body[data-state="auto"] .particle-group {
            animation: auto-particle 12s infinite;
        }

        /* ALLOWED STATE (MANUAL) */
        body[data-state="allowed"] .wave-allowed,
        body[data-state="allowed"] .label-allowed,
        body[data-state="allowed"] .bracket-group { opacity: 1; }
        body[data-state="allowed"] .wave-forbidden,
        body[data-state="allowed"] .label-forbidden { opacity: 0; }
        body[data-state="allowed"] .particle-group { opacity: 0; }

        /* FORBIDDEN STATE (MANUAL) */
        body[data-state="forbidden"] .wave-allowed,
        body[data-state="forbidden"] .label-allowed,
        body[data-state="forbidden"] .bracket-group { opacity: 0; }
        body[data-state="forbidden"] .wave-forbidden,
        body[data-state="forbidden"] .label-forbidden { opacity: 1; }
        body[data-state="forbidden"] .particle-group { opacity: 0; }

        /* Auto Sequence Keyframes */
        @keyframes auto-allowed {
            0% { opacity: 0; }
            8% { opacity: 1; }   /* 1s: Fade in */
            50% { opacity: 1; }  /* 6s: Hold */
            58% { opacity: 0; }  /* 7s: Fade out */
            100% { opacity: 0; }
        }

        @keyframes auto-forbidden {
            0% { opacity: 0; }
            50% { opacity: 0; }  /* 6s: Wait */
            58% { opacity: 1; }  /* 7s: Fade in */
            92% { opacity: 1; }  /* 11s: Hold */
            100% { opacity: 0; } /* 12s: Fade out */
        }

        @keyframes auto-particle {
            0% { opacity: 1; }
            16% { opacity: 0; }  /* 2s: Fade out as wave forms */
            100% { opacity: 0; }
        }

    </style>
</head>
<body data-state="auto">

    <div class="container">
        <div class="controls">
            <button id="btn-toggle" onclick="toggleState()">Mode: AUTO SEQUENCE</button>
        </div>

        <svg viewBox="0 0 800 550" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Glow Filters -->
                <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Arrowheads -->
                <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
                </marker>
                <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#333" />
                </marker>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f8f9fa" />

            <!-- Title -->
            <text x="400" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="var(--text-main)">De Broglie Hypothesis: Quantization of Orbits</text>
            <text x="400" y="70" text-anchor="middle" font-size="14" font-weight="400" fill="var(--text-muted)">Bohr's Second Postulate via Standing Electron Waves</text>

            <!-- Formula Display -->
            <rect x="300" y="490" width="200" height="40" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="1" />
            <text x="400" y="516" text-anchor="middle" font-size="18" font-weight="700" fill="var(--text-main)" class="math">2πr<tspan dy="4" font-size="12">n</tspan><tspan dy="-4"> = nλ</tspan></text>

            <!-- Legend -->
            <g transform="translate(610, 20)">
                <rect width="170" height="100" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="1" opacity="0.9"/>
                <text x="10" y="20" font-size="12" font-weight="700" fill="var(--text-main)">Legend</text>
                
                <line x1="10" y1="35" x2="30" y2="35" stroke="var(--allowed-color)" stroke-width="3" />
                <text x="40" y="39" font-size="11" fill="var(--text-main)">Allowed (n ∈ ℤ)</text>

                <line x1="10" y1="55" x2="30" y2="55" stroke="var(--forbidden-color)" stroke-width="3" />
                <text x="40" y="59" font-size="11" fill="var(--text-main)">Forbidden (n ∉ ℤ)</text>

                <line x1="10" y1="75" x2="30" y2="75" stroke="var(--velocity-color)" stroke-width="2" marker-end="url(#arrow-green)" />
                <text x="40" y="79" font-size="11" fill="var(--text-main)">Velocity (v)</text>
            </g>

            <!-- Main Diagram Area -->
            <g id="diagram-center">
                <!-- Orbit Path (Dashed) -->
                <circle cx="400" cy="270" r="140" fill="none" stroke="var(--orbit-line)" stroke-width="2" stroke-dasharray="6,6" />

                <!-- Radius Line -->
                <line x1="400" y1="270" x2="515" y2="350" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3" />
                <text x="465" y="305" font-size="14" font-style="italic" fill="#333" class="math">r<tspan dy="3" font-size="10">n</tspan></text>

                <!-- Dynamic Labels -->
                <text id="lbl-allowed" class="label-allowed" x="400" y="460" text-anchor="middle" font-size="16" font-weight="600" fill="var(--allowed-color)">Constructive Interference: Allowed Orbit (n = 4)</text>
                <text id="lbl-forbidden" class="label-forbidden" x="400" y="460" text-anchor="middle" font-size="16" font-weight="600" fill="var(--forbidden-color)">Destructive Interference: Forbidden Orbit (n = 4.4)</text>

                <!-- Wavelength Bracket (Allowed State) -->
                <g class="bracket-group">
                    <path id="lambda-arc" fill="none" stroke="#333" stroke-width="1.5" marker-start="url(#arrow-dark)" marker-end="url(#arrow-dark)" />
                    <text x="400" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#333" class="math">λ = h/mv</text>
                </g>

                <!-- FORBIDDEN WAVE (Traveling/Mismatch) -->
                <g class="rotating wave-forbidden">
                    <path id="path-forbidden" fill="rgba(255, 51, 102, 0.08)" stroke="var(--forbidden-color)" stroke-width="3" filter="url(#glow-red)" stroke-linecap="round" />
                </g>

                <!-- ALLOWED WAVE (Standing Wave) -->
                <g class="wave-allowed">
                    <path id="path-allowed" fill="rgba(67, 97, 238, 0.12)" stroke="var(--allowed-color)" stroke-width="3" filter="url(#glow-blue)">
                        <!-- SMIL Animation for Breathing Standing Wave -->
                        <animate id="anim-allowed" attributeName="d" dur="2.5s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" values="" />
                    </path>
                </g>

                <!-- PARTICLE & VELOCITY VECTOR -->
                <g class="particle-group rotating">
                    <circle cx="540" cy="270" r="7" fill="var(--allowed-color)" />
                    <path d="M 540 270 L 540 190" stroke="var(--velocity-color)" stroke-width="3" marker-end="url(#arrow-green)" />
                    <text x="550" y="200" font-size="14" font-weight="700" fill="var(--velocity-color)" class="math" transform="rotate(90 550 200)">v</text>
                </g>

                <!-- Nucleus -->
                <circle cx="400" cy="270" r="16" fill="var(--nucleus-color)" />
                <text x="400" y="275" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">+</text>
            </g>
        </svg>
    </div>

    <script>
        // Configuration
        const CX = 400;
        const CY = 270;
        const R = 140;
        const A = 22; // Wave amplitude
        const STEPS = 250;

        // Generate SVG Path Data for Sine Waves around a circle
        function generateWavePath(n, amplitude, closePath) {
            let path = "";
            for (let i = 0; i <= STEPS; i++) {
                let theta = (i / STEPS) * 2 * Math.PI;
                let r = R + amplitude * Math.sin(n * theta);
                let x = CX + r * Math.cos(theta);
                let y = CY + r * Math.sin(theta);
                
                if (i === 0) {
                    path += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                } else {
                    path += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                }
            }
            if (closePath) path += "Z";
            return path;
        }

        // Generate Wavelength Bracket Arc
        function generateBracketArc() {
            // n=4 means 1 wavelength is 90 degrees. Top centered: -135 to -45 deg.
            const rArc = R + 40;
            const startAngle = -3 * Math.PI / 4;
            const endAngle = -Math.PI / 4;
            
            const x1 = CX + rArc * Math.cos(startAngle);
            const y1 = CY + rArc * Math.sin(startAngle);
            const x2 = CX + rArc * Math.cos(endAngle);
            const y2 = CY + rArc * Math.sin(endAngle);
            
            return `M ${x1.toFixed(2)} ${y1.toFixed(2)} A ${rArc} ${rArc} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
        }

        // Initialize Paths
        document.addEventListener("DOMContentLoaded", () => {
            // Allowed Wave (Standing Wave Extremes)
            const pathAllowedOut = generateWavePath(4, A, true);
            const pathAllowedIn = generateWavePath(4, -A, true);
            
            // Forbidden Wave (Traveling Wave, n=4.4 creates a visible mismatch gap)
            const pathForbidden = generateWavePath(4.4, A, false);

            // Set SMIL Animation Values
            const animEl = document.getElementById('anim-allowed');
            animEl.setAttribute('values', `${pathAllowedOut}; ${pathAllowedIn}; ${pathAllowedOut}`);

            // Set Forbidden Path
            document.getElementById('path-forbidden').setAttribute('d', pathForbidden);

            // Set Bracket Arc
            document.getElementById('lambda-arc').setAttribute('d', generateBracketArc());
        });

        // State Management
        const states = ['auto', 'allowed', 'forbidden'];
        const stateLabels = ['AUTO SEQUENCE', 'ALLOWED (n=4)', 'FORBIDDEN (n=4.4)'];
        let currentStateIdx = 0;

        function toggleState() {
            currentStateIdx = (currentStateIdx + 1) % states.length;
            const newState = states[currentStateIdx];
            
            // Update DOM
            document.body.setAttribute('data-state', newState);
            document.getElementById('btn-toggle').innerText = `Mode: ${stateLabels[currentStateIdx]}`;

            // Reset SMIL animation to keep it synced when switching back
            if (newState === 'allowed' || newState === 'auto') {
                const animEl = document.getElementById('anim-allowed');
                animEl.beginElement();
            }
        }
    </script>
</body>
</html>
