<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snell's Law and Wave Refraction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 12px;
            background-color: #ffffff;
        }
        
        .label { font-family: 'Inter', sans-serif; }
        .math { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram showing Snell's Law and wave refraction">
        <title>Snell's Law and Wave Theory of Refraction</title>
        <desc>An animation demonstrating how light rays bend and wavefronts compress when passing from a less dense medium (air) to a more dense medium (glass).</desc>

        <defs>
            <!-- Clip paths to keep wavefronts strictly within their respective mediums -->
            <clipPath id="clip-m1">
                <rect x="0" y="0" width="800" height="250" />
            </clipPath>
            <clipPath id="clip-m2">
                <rect x="0" y="250" width="800" height="250" />
            </clipPath>
            
            <!-- Arrowhead marker for the light rays -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
        </defs>
        
        <!-- Medium Backgrounds -->
        <rect x="0" y="0" width="800" height="250" fill="#f8f9fa" />
        <rect x="0" y="250" width="800" height="250" fill="#E0F7FA" />
        
        <!-- Wavefronts (Generated via JS) -->
        <path id="wavefronts1" stroke="#ADB5BD" stroke-width="2" opacity="0.8" fill="none" clip-path="url(#clip-m1)" />
        <path id="wavefronts2" stroke="#ADB5BD" stroke-width="2" opacity="0.8" fill="none" clip-path="url(#clip-m2)" />
        
        <!-- Interface and Normal Lines -->
        <line x1="0" y1="250" x2="800" y2="250" stroke="#212529" stroke-width="2" />
        <line x1="400" y1="0" x2="400" y2="500" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="5,5" />
        
        <!-- Light Rays -->
        <g id="rays" stroke="#FF3366" stroke-width="3" fill="none">
            <line id="ray1-part1" marker-end="url(#arrow)" />
            <line id="ray1-part2" />
            <line id="ray2-part1" marker-end="url(#arrow)" />
            <line id="ray2-part2" />
        </g>
        
        <!-- Angle Arcs -->
        <path id="arc1" stroke="#4361EE" stroke-width="2" fill="none" />
        <path id="arc2" stroke="#4361EE" stroke-width="2" fill="none" />
        
        <!-- Dynamic Angle Texts -->
        <text id="text-th1" class="math" fill="#4361EE" font-size="14" font-weight="bold" text-anchor="middle"></text>
        <text id="text-th2" class="math" fill="#4361EE" font-size="14" font-weight="bold" text-anchor="middle"></text>
        
        <!-- Static Labels -->
        <text x="20" y="35" class="label" font-size="20" font-weight="bold" fill="#212529">Snell's Law &amp; Wave Refraction</text>
        <text x="20" y="65" class="label" font-size="15" fill="#495057" font-weight="600">Medium 1 (Air, n₁ = 1.0)</text>
        <text x="20" y="475" class="label" font-size="15" fill="#495057" font-weight="600">Medium 2 (Glass, n₂ = 1.5)</text>
        
        <!-- Legend -->
        <g transform="translate(650, 25)">
            <rect x="-10" y="-15" width="140" height="55" fill="#ffffff" stroke="#e9ecef" stroke-width="1" rx="6" opacity="0.9"/>
            <line x1="0" y1="0" x2="20" y2="0" stroke="#FF3366" stroke-width="3"/>
            <text x="28" y="4" class="label" font-size="12" fill="#495057" font-weight="600">Light Ray</text>
            
            <line x1="0" y1="22" x2="20" y2="22" stroke="#ADB5BD" stroke-width="2"/>
            <text x="28" y="26" class="label" font-size="12" fill="#495057" font-weight="600">Wavefront</text>
        </g>

        <!-- Real-time Formula Box -->
        <g transform="translate(560, 330)">
            <rect x="0" y="0" width="220" height="150" fill="#ffffff" stroke="#7209B7" stroke-width="2" rx="8" opacity="0.95"/>
            <text x="15" y="25" class="math" font-size="13" fill="#212529" font-weight="bold">n₁ = 1.00, n₂ = 1.50</text>
            <line x1="15" y1="35" x2="205" y2="35" stroke="#e9ecef" stroke-width="1"/>
            <text id="calc-sin1" x="15" y="55" class="math" font-size="13" fill="#4361EE"></text>
            <text id="calc-sin2" x="15" y="75" class="math" font-size="13" fill="#4361EE"></text>
            <line x1="15" y1="88" x2="205" y2="88" stroke="#e9ecef" stroke-width="1"/>
            <text id="calc-snell1" x="15" y="110" class="math" font-size="14" fill="#7209B7" font-weight="bold"></text>
            <text id="calc-snell2" x="15" y="135" class="math" font-size="14" fill="#7209B7" font-weight="bold"></text>
        </g>
    </svg>

    <script>
        // Physics Constants
        const n1 = 1.0;
        const n2 = 1.5;
        const lambda1 = 30;           // Wavelength in Medium 1
        const lambda2 = lambda1 / n2; // Wavelength in Medium 2 (compressed)
        const f = 1.5;                // Frequency (Hz) - remains constant across boundary

        // DOM Elements
        const wave1 = document.getElementById('wavefronts1');
        const wave2 = document.getElementById('wavefronts2');
        const ray1p1 = document.getElementById('ray1-part1');
        const ray1p2 = document.getElementById('ray1-part2');
        const ray2p1 = document.getElementById('ray2-part1');
        const ray2p2 = document.getElementById('ray2-part2');
        const arc1 = document.getElementById('arc1');
        const arc2 = document.getElementById('arc2');
        const textTh1 = document.getElementById('text-th1');
        const textTh2 = document.getElementById('text-th2');
        const calcSin1 = document.getElementById('calc-sin1');
        const calcSin2 = document.getElementById('calc-sin2');
        const calcSnell1 = document.getElementById('calc-snell1');
        const calcSnell2 = document.getElementById('calc-snell2');

        // Animation Loop
        function update(time) {
            let t = time / 1000; // Time in seconds
            
            // 1. Calculate the sweeping angle (10-second cycle)
            let phase = (t % 10) / 10;
            let th1_deg = 0;
            
            // Piecewise timing for smooth sweep and pauses
            if (phase < 0.1) {
                th1_deg = 0; // Pause at 0 degrees
            } else if (phase < 0.5) {
                let p = (phase - 0.1) / 0.4;
                th1_deg = 75 * p * p * (3 - 2 * p); // Smoothstep 0 -> 75
            } else if (phase < 0.6) {
                th1_deg = 75; // Pause at 75 degrees
            } else {
                let p = (phase - 0.6) / 0.4;
                th1_deg = 75 * (1 - p * p * (3 - 2 * p)); // Smoothstep 75 -> 0
            }
            
            // Convert to radians and apply Snell's Law
            let th1 = th1_deg * Math.PI / 180;
            let th2 = Math.asin(Math.sin(th1) * n1 / n2);
            let th2_deg = th2 * 180 / Math.PI;

            // 2. Update Light Rays
            const r_mid = 180; // Distance for arrowhead placement
            const r_far = 800; // Distance to extend off-screen
            
            // Incident Ray (Top Left -> Center)
            ray1p1.setAttribute('x1', 400 - r_far * Math.sin(th1));
            ray1p1.setAttribute('y1', 250 - r_far * Math.cos(th1));
            ray1p1.setAttribute('x2', 400 - r_mid * Math.sin(th1));
            ray1p1.setAttribute('y2', 250 - r_mid * Math.cos(th1));
            
            ray1p2.setAttribute('x1', 400 - r_mid * Math.sin(th1));
            ray1p2.setAttribute('y1', 250 - r_mid * Math.cos(th1));
            ray1p2.setAttribute('x2', 400);
            ray1p2.setAttribute('y2', 250);

            // Refracted Ray (Center -> Bottom Right)
            ray2p1.setAttribute('x1', 400);
            ray2p1.setAttribute('y1', 250);
            ray2p1.setAttribute('x2', 400 + r_mid * Math.sin(th2));
            ray2p1.setAttribute('y2', 250 + r_mid * Math.cos(th2));
            
            ray2p2.setAttribute('x1', 400 + r_mid * Math.sin(th2));
            ray2p2.setAttribute('y1', 250 + r_mid * Math.cos(th2));
            ray2p2.setAttribute('x2', 400 + r_far * Math.sin(th2));
            ray2p2.setAttribute('y2', 250 + r_far * Math.cos(th2));

            // 3. Update Arcs and Angle Labels
            const arcRad = 50;
            const txtRad = 75;
            
            if (th1_deg > 0.5) {
                arc1.setAttribute('d', `M 400 ${250 - arcRad} A ${arcRad} ${arcRad} 0 0 0 ${400 - arcRad * Math.sin(th1)} ${250 - arcRad * Math.cos(th1)}`);
                arc1.style.display = 'block';
                textTh1.setAttribute('x', 400 - txtRad * Math.sin(th1/2));
                textTh1.setAttribute('y', 250 - txtRad * Math.cos(th1/2));
                textTh1.textContent = `θ₁=${th1_deg.toFixed(1)}°`;
            } else {
                arc1.style.display = 'none';
                textTh1.textContent = '';
            }
            
            if (th2_deg > 0.5) {
                arc2.setAttribute('d', `M 400 ${250 + arcRad} A ${arcRad} ${arcRad} 0 0 0 ${400 + arcRad * Math.sin(th2)} ${250 + arcRad * Math.cos(th2)}`);
                arc2.style.display = 'block';
                textTh2.setAttribute('x', 400 + txtRad * Math.sin(th2/2));
                textTh2.setAttribute('y', 250 + txtRad * Math.cos(th2/2) + 12);
                textTh2.textContent = `θ₂=${th2_deg.toFixed(1)}°`;
            } else {
                arc2.style.display = 'none';
                textTh2.textContent = '';
            }

            // 4. Update Formula Box
            let s1 = Math.sin(th1);
            let s2 = Math.sin(th2);
            calcSin1.textContent = `sin(θ₁) = ${s1.toFixed(3)}`;
            calcSin2.textContent = `sin(θ₂) = ${s2.toFixed(3)}`;
            calcSnell1.textContent = `n₁·sin(θ₁) = ${(n1 * s1).toFixed(3)}`;
            calcSnell2.textContent = `n₂·sin(θ₂) = ${(n2 * s2).toFixed(3)}`;

            // 5. Update Wavefronts (Phase Continuity Logic)
            let C = t * f;       // Total cycles elapsed
            let cMod = C % 1;    // Fractional phase
            
            // Generate Incident Wavefront Lines
            let d1 = "";
            for (let k = -25; k <= 5; k++) {
                let D = (k - cMod) * lambda1; // Distance from origin along ray
                let cx = 400 - D * Math.sin(th1);
                let cy = 250 - D * Math.cos(th1);
                let dx = 600 * Math.cos(th1); // Perpendicular vector
                let dy = -600 * Math.sin(th1);
                d1 += `M ${cx + dx} ${cy + dy} L ${cx - dx} ${cy - dy} `;
            }
            wave1.setAttribute('d', d1);

            // Generate Refracted Wavefront Lines
            let d2 = "";
            for (let k = -5; k <= 35; k++) {
                let D = (k + cMod) * lambda2; // Distance from origin along ray
                let cx = 400 + D * Math.sin(th2);
                let cy = 250 + D * Math.cos(th2);
                let dx = 600 * Math.cos(th2); // Perpendicular vector
                let dy = -600 * Math.sin(th2);
                d2 += `M ${cx + dx} ${cy + dy} L ${cx - dx} ${cy - dy} `;
            }
            wave2.setAttribute('d', d2);

            // Loop
            requestAnimationFrame(update);
        }

        // Start animation
        requestAnimationFrame(update);
    </script>
</body>
</html>
