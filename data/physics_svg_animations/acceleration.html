<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamics of Acceleration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9ecef" stroke-width="1"/>
            </pattern>

            <!-- Arrow Markers -->
            <marker id="arrow-v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFD166" />
            </marker>
            <marker id="arrow-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            
            <!-- Glow Filter for Vectors -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background & Grid -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        <rect width="100%" height="250" y="60" fill="url(#grid)" />

        <!-- Header / Title -->
        <text x="30" y="40" font-size="22" font-weight="700" fill="#2B2D42">Dynamics of Acceleration</text>
        <text x="310" y="40" font-size="20" font-weight="600" fill="#2B2D42" class="math-text">a&#x20D7; = Δv&#x20D7; / Δt</text>

        <!-- Phase Indicator -->
        <rect x="250" y="70" width="300" height="34" rx="17" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
        <text id="phase-text" x="400" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#7209B7">Phase 1: Constant Acceleration</text>

        <!-- Real-time Readout -->
        <rect x="620" y="20" width="150" height="65" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
        <text id="readout-v" x="635" y="43" font-size="14" fill="#06D6A0" class="math-text font-weight-bold">v = 0.0 m/s</text>
        <text id="readout-a" x="635" y="68" font-size="14" fill="#FFD166" class="math-text font-weight-bold">a = 0.0 m/s²</text>

        <!-- Legend -->
        <g transform="translate(30, 75)" font-size="12" font-weight="600">
            <rect x="0" y="0" width="12" height="12" rx="2" fill="#FF3366" />
            <text x="18" y="10" fill="#2B2D42">Force (F)</text>
            
            <rect x="0" y="20" width="12" height="12" rx="2" fill="#FFD166" />
            <text x="18" y="30" fill="#2B2D42">Acceleration (a)</text>
            
            <rect x="0" y="40" width="12" height="12" rx="2" fill="#06D6A0" />
            <text x="18" y="50" fill="#2B2D42">Velocity (v)</text>
        </g>

        <!-- Ground -->
        <line x1="0" y1="250" x2="800" y2="250" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>

        <!-- Motion Trails (Ghost Circles) -->
        <g id="trails"></g>

        <!-- The Mass (Block) -->
        <rect id="block" x="100" y="210" width="60" height="40" rx="6" fill="#2B2D42" />
        <text id="mass-label" x="130" y="235" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff" class="math-text">m</text>

        <!-- Vectors -->
        <!-- Force Vector -->
        <line id="vec-f" x1="40" y1="230" x2="95" y2="230" stroke="#FF3366" stroke-width="5" marker-end="url(#arrow-f)" filter="url(#glow)" />
        <text id="label-f" x="60" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#FF3366" class="math-text">F&#x20D7;</text>

        <!-- Acceleration Vector -->
        <line id="vec-a" x1="130" y1="180" x2="180" y2="180" stroke="#FFD166" stroke-width="4" marker-end="url(#arrow-a)" filter="url(#glow)" />
        <text id="label-a" x="155" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#FFD166" class="math-text">a&#x20D7;</text>

        <!-- Velocity Vector -->
        <line id="vec-v" x1="130" y1="230" x2="180" y2="230" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-v)" filter="url(#glow)" />
        <text id="label-v" x="155" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#06D6A0" class="math-text">v&#x20D7;</text>

        <!-- Graph Section (v vs t) -->
        <g transform="translate(0, 20)">
            <rect x="80" y="280" width="640" height="180" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            
            <!-- Graph Grid Lines -->
            <line x1="120" y1="320" x2="680" y2="320" stroke="#e9ecef" stroke-width="1" stroke-dasharray="4 4" />
            <line x1="120" y1="380" x2="680" y2="380" stroke="#e9ecef" stroke-width="1" stroke-dasharray="4 4" />
            
            <line x1="320" y1="290" x2="320" y2="440" stroke="#e9ecef" stroke-width="1" stroke-dasharray="4 4" />
            <line x1="500" y1="290" x2="500" y2="440" stroke="#e9ecef" stroke-width="1" stroke-dasharray="4 4" />

            <!-- Axes -->
            <line x1="120" y1="440" x2="700" y2="440" stroke="#2B2D42" stroke-width="2" marker-end="url(#arrow-a)" />
            <line x1="120" y1="440" x2="120" y2="290" stroke="#2B2D42" stroke-width="2" marker-end="url(#arrow-a)" />
            
            <!-- Axis Labels -->
            <text x="100" y="285" font-size="12" font-weight="600" fill="#2B2D42" class="math-text">v (m/s)</text>
            <text x="710" y="445" font-size="12" font-weight="600" fill="#2B2D42" class="math-text">t (s)</text>

            <!-- Ticks -->
            <text x="105" y="325" font-size="10" fill="#6c757d" class="math-text">9.0</text>
            <text x="105" y="385" font-size="10" fill="#6c757d" class="math-text">4.5</text>
            
            <text x="315" y="455" font-size="10" fill="#6c757d" class="math-text">4.0</text>
            <text x="495" y="455" font-size="10" fill="#6c757d" class="math-text">7.0</text>
            <text x="670" y="455" font-size="10" fill="#6c757d" class="math-text">10.0</text>

            <!-- Live Graph Line -->
            <path id="graph-line" fill="none" stroke="#06D6A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
            
            <!-- Graph Current Point Indicator -->
            <circle id="graph-point" cx="120" cy="440" r="5" fill="#FFD166" />
        </g>
    </svg>
</div>

<script>
    // Physics & Animation Configuration
    const DURATION = 10000; // 10 seconds loop
    const FPS = 60;
    
    // Scale factors for visual representation
    const SCALE_A = 22.5; // px/s^2 for Phase 1
    const SCALE_V_MAX = 90; // px/s
    const GRAPH_X_START = 120;
    const GRAPH_Y_START = 460; // 440 + 20 offset from group
    const GRAPH_X_SCALE = 56; // 560px / 10s
    const GRAPH_Y_SCALE = 1.333; // 120px / 90v

    // DOM Elements
    const block = document.getElementById('block');
    const massLabel = document.getElementById('mass-label');
    const vecV = document.getElementById('vec-v');
    const vecA = document.getElementById('vec-a');
    const vecF = document.getElementById('vec-f');
    const labelV = document.getElementById('label-v');
    const labelA = document.getElementById('label-a');
    const labelF = document.getElementById('label-f');
    const graphLine = document.getElementById('graph-line');
    const graphPoint = document.getElementById('graph-point');
    const readoutV = document.getElementById('readout-v');
    const readoutA = document.getElementById('readout-a');
    const phaseText = document.getElementById('phase-text');
    const trailsGroup = document.getElementById('trails');

    // Initialize Ghost Trails
    const trails = [];
    for(let i = 0.5; i <= 9.5; i += 0.5) {
        let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        circle.setAttribute("r", "6");
        circle.setAttribute("cy", "230");
        circle.setAttribute("fill", "#06D6A0");
        circle.setAttribute("opacity", "0");
        trailsGroup.appendChild(circle);
        trails.push({ t: i, el: circle });
    }

    // Kinematics Function to get exact X position
    function getKinematics(t) {
        let a, v, x;
        if (t < 4) {
            a = SCALE_A;
            v = a * t;
            x = 100 + 0.5 * a * t * t;
        } else if (t < 7) {
            a = 0;
            v = SCALE_V_MAX;
            x = 100 + 180 + v * (t - 4);
        } else {
            a = -30; // Deceleration to reach 0 in 3s
            v = SCALE_V_MAX + a * (t - 7);
            if (v < 0) v = 0; // Prevent negative velocity due to float precision
            x = 100 + 450 + SCALE_V_MAX * (t - 7) + 0.5 * a * (t - 7) * (t - 7);
        }
        return { a, v, x };
    }

    let startTime = performance.now();

    function updateFrame(currentTime) {
        let elapsed = (currentTime - startTime) % DURATION;
        let t = elapsed / 1000; // Time in seconds (0 to 10)

        // Get current physics state
        let { a, v, x } = getKinematics(t);
        let blockCenter = x + 30;

        // 1. Update Block Position
        block.setAttribute('x', x);
        massLabel.setAttribute('x', blockCenter);

        // 2. Update Velocity Vector (Green)
        if (v > 1) {
            vecV.setAttribute('x1', blockCenter);
            vecV.setAttribute('x2', blockCenter + v);
            vecV.style.opacity = 1;
            labelV.setAttribute('x', blockCenter + v / 2);
            labelV.style.opacity = 1;
        } else {
            vecV.style.opacity = 0;
            labelV.style.opacity = 0;
        }

        // 3. Update Acceleration Vector (Orange)
        if (Math.abs(a) > 0.1) {
            vecA.setAttribute('x1', blockCenter);
            vecA.setAttribute('x2', blockCenter + a * 2); // Scale for visibility
            vecA.style.opacity = 1;
            labelA.setAttribute('x', blockCenter + a);
            labelA.style.opacity = 1;
        } else {
            vecA.style.opacity = 0;
            labelA.style.opacity = 0;
        }

        // 4. Update Force Vector (Red)
        if (a > 0) {
            let fLen = a * 2.5;
            vecF.setAttribute('x1', x - fLen);
            vecF.setAttribute('x2', x - 5);
            vecF.style.opacity = 1;
            labelF.setAttribute('x', x - fLen / 2);
            labelF.style.opacity = 1;
            phaseText.textContent = "Phase 1: Constant Acceleration (F > 0)";
            phaseText.setAttribute("fill", "#FF3366");
        } else if (a < 0) {
            let fLen = Math.abs(a) * 2.5;
            vecF.setAttribute('x1', x + 60 + fLen);
            vecF.setAttribute('x2', x + 65);
            vecF.style.opacity = 1;
            labelF.setAttribute('x', x + 60 + fLen / 2);
            labelF.style.opacity = 1;
            phaseText.textContent = "Phase 3: Deceleration (F < 0)";
            phaseText.setAttribute("fill", "#FF3366");
        } else {
            vecF.style.opacity = 0;
            labelF.style.opacity = 0;
            phaseText.textContent = "Phase 2: Constant Velocity (F = 0)";
            phaseText.setAttribute("fill", "#06D6A0");
        }

        // 5. Update Readouts (Scaled to realistic numbers, e.g., v/10)
        readoutV.textContent = `v = ${(v / 10).toFixed(1)} m/s`;
        readoutA.textContent = `a = ${(a / 10).toFixed(1)} m/s²`;

        // 6. Update Graph
        let d = `M ${GRAPH_X_START} ${GRAPH_Y_START} `;
        if (t <= 4) {
            d += `L ${GRAPH_X_START + t * GRAPH_X_SCALE} ${GRAPH_Y_START - (SCALE_A * t) * GRAPH_Y_SCALE}`;
        } else if (t <= 7) {
            d += `L ${GRAPH_X_START + 4 * GRAPH_X_SCALE} ${GRAPH_Y_START - SCALE_V_MAX * GRAPH_Y_SCALE} `;
            d += `L ${GRAPH_X_START + t * GRAPH_X_SCALE} ${GRAPH_Y_START - SCALE_V_MAX * GRAPH_Y_SCALE}`;
        } else {
            d += `L ${GRAPH_X_START + 4 * GRAPH_X_SCALE} ${GRAPH_Y_START - SCALE_V_MAX * GRAPH_Y_SCALE} `;
            d += `L ${GRAPH_X_START + 7 * GRAPH_X_SCALE} ${GRAPH_Y_START - SCALE_V_MAX * GRAPH_Y_SCALE} `;
            d += `L ${GRAPH_X_START + t * GRAPH_X_SCALE} ${GRAPH_Y_START - v * GRAPH_Y_SCALE}`;
        }
        graphLine.setAttribute('d', d);
        
        // Update Graph Point
        graphPoint.setAttribute('cx', GRAPH_X_START + t * GRAPH_X_SCALE);
        graphPoint.setAttribute('cy', GRAPH_Y_START - v * GRAPH_Y_SCALE);

        // 7. Update Ghost Trails
        trails.forEach(trail => {
            if (t > trail.t) {
                let pastState = getKinematics(trail.t);
                trail.el.setAttribute("cx", pastState.x + 30);
                // Fade out slightly over time, but keep visible
                let age = t - trail.t;
                let opacity = Math.max(0.15, 0.4 - age * 0.05);
                trail.el.setAttribute("opacity", opacity.toString());
            } else {
                trail.el.setAttribute("opacity", "0");
            }
        });

        requestAnimationFrame(updateFrame);
    }

    // Start Animation Loop
    requestAnimationFrame(updateFrame);
</script>

</body>
</html>
