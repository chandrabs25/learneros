<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biot-Savart Law Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        #canvas-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .vector-label {
            font-weight: 700;
            font-size: 14px;
            user-select: none;
        }
        .title {
            font-weight: 700;
            font-size: 20px;
            fill: #111;
        }
        .subtitle {
            font-weight: 400;
            font-size: 14px;
            fill: #555;
        }
        #play-btn {
            cursor: pointer;
        }
        #play-btn:hover rect {
            fill: #e9ecef;
        }
        .dynamic-element {
            transition: opacity 0.1s linear;
        }
    </style>
</head>
<body>

<div id="canvas-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" id="main-svg">
        <defs>
            <!-- Arrowhead Markers -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            
            <!-- Drop Shadow for vectors -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2"/>
            </filter>
        </defs>

        <!-- Static Background Elements -->
        <text x="30" y="40" class="title">Biot-Savart Law</text>
        <text x="30" y="60" class="subtitle">Magnetic Field of a Current Element</text>

        <!-- Formula -->
        <g transform="translate(400, 460)" text-anchor="middle" class="math" font-size="18">
            <text x="-90" y="5" fill="#7209B7" font-weight="bold">d<tspan font-family="Inter">B</tspan></text>
            <text x="-60" y="5" fill="#333">=</text>
            
            <!-- First Fraction -->
            <text x="-25" y="-8" fill="#333">μ<tspan baseline-shift="sub" font-size="12">0</tspan></text>
            <line x1="-40" y1="-2" x2="-10" y2="-2" stroke="#333" stroke-width="2"/>
            <text x="-25" y="14" fill="#333">4π</text>
            
            <!-- Second Fraction -->
            <text x="45" y="-8" fill="#333">
                <tspan fill="#06D6A0">I d</tspan><tspan fill="#06D6A0" font-family="Inter" font-weight="bold">l</tspan> 
                × <tspan fill="#00B4D8" font-family="Inter" font-weight="bold">r̂</tspan>
            </text>
            <line x1="10" y1="-2" x2="80" y2="-2" stroke="#333" stroke-width="2"/>
            <text x="45" y="14" fill="#333">r<tspan baseline-shift="super" font-size="12">2</tspan></text>
        </g>

        <!-- Right Hand Rule Legend -->
        <g transform="translate(650, 380)">
            <rect x="0" y="0" width="130" height="100" rx="8" fill="#fff" stroke="#e9ecef" stroke-width="2"/>
            <text x="65" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Right-Hand Rule</text>
            
            <!-- Axes -->
            <line x1="30" y1="70" x2="80" y2="70" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
            <line x1="30" y1="70" x2="55" y2="40" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrow-cyan)"/>
            <line x1="30" y1="70" x2="30" y2="30" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)"/>
            
            <!-- Curl Arrow -->
            <path d="M 60 65 Q 65 55 50 45" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-orange)"/>
            
            <!-- Labels -->
            <text x="85" y="74" class="math vector-label" fill="#06D6A0" font-size="10">Idl</text>
            <text x="60" y="38" class="math vector-label" fill="#00B4D8" font-size="10">r</text>
            <text x="28" y="25" class="math vector-label" fill="#7209B7" font-size="10">dB</text>
        </g>

        <!-- Play/Pause Button -->
        <g id="play-btn" transform="translate(700, 20)">
            <rect x="0" y="0" width="70" height="30" rx="15" fill="#fff" stroke="#ccc" stroke-width="1"/>
            <text id="play-text" x="35" y="19" text-anchor="middle" font-size="12" font-weight="600" fill="#333">Pause</text>
        </g>

        <!-- 3D Scene Container -->
        <g id="scene">
            <!-- The Plane -->
            <polygon id="plane" points="0,0 0,0 0,0 0,0" fill="#CAF0F8" opacity="0.4" stroke="#90E0EF" stroke-width="1" class="dynamic-element"/>
            
            <!-- The Wire -->
            <path id="wire" d="" fill="none" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Current Pulse -->
            <circle id="pulse" cx="0" cy="0" r="6" fill="#06D6A0" opacity="0" filter="url(#shadow)"/>

            <!-- Dynamic Elements Group -->
            <g id="dynamic-group" class="dynamic-element" opacity="0">
                <!-- Angle Theta -->
                <path id="theta-arc" d="" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-orange)"/>
                <text id="theta-label" x="0" y="0" class="math vector-label" fill="#F77F00">θ</text>

                <!-- Vector r -->
                <line id="r-vec" x1="0" y1="0" x2="0" y2="0" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-cyan)"/>
                <text id="r-label" x="0" y="0" class="math vector-label" fill="#00B4D8">r</text>

                <!-- Current Element Idl -->
                <line id="dl-vec" x1="0" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="5" marker-end="url(#arrow-green)" filter="url(#shadow)"/>
                <text id="dl-label" x="0" y="0" class="math vector-label" fill="#06D6A0">I d<tspan font-family="Inter">l</tspan></text>

                <!-- Magnetic Field dB -->
                <line id="db-vec" x1="0" y1="0" x2="0" y2="0" stroke="#7209B7" stroke-width="5" marker-end="url(#arrow-purple)" filter="url(#shadow)"/>
                <text id="db-label" x="0" y="0" class="math vector-label" fill="#7209B7">d<tspan font-family="Inter">B</tspan></text>
            </g>

            <!-- Observation Point P -->
            <circle id="point-p" cx="0" cy="0" r="5" fill="#111" filter="url(#shadow)"/>
            <text id="p-label" x="0" y="0" font-weight="700" font-size="14" fill="#111">P</text>
        </g>
    </svg>
</div>

<script>
    // --- 3D Projection Engine ---
    const CX = 400; // Center X
    const CY = 280; // Center Y
    
    // Isometric-style projection
    function project(x, y, z) {
        return {
            x: CX + x * 0.8 - z * 0.4,
            y: CY - y + x * 0.2 + z * 0.3
        };
    }

    // --- Physics & Geometry Setup ---
    // Wire is a semicircle in the X-Z plane (y=0)
    const WIRE_RADIUS = 200;
    
    function getWirePos(t) {
        return {
            x: -WIRE_RADIUS * Math.cos(Math.PI * t),
            y: 0,
            z: WIRE_RADIUS * Math.sin(Math.PI * t)
        };
    }

    function getWireTangent(t) {
        return {
            x: WIRE_RADIUS * Math.PI * Math.sin(Math.PI * t),
            y: 0,
            z: WIRE_RADIUS * Math.PI * Math.cos(Math.PI * t)
        };
    }

    // Observation Point P
    const PointP = { x: 100, y: 180, z: -100 };
    const projP = project(PointP.x, PointP.y, PointP.z);

    // Initialize Static Elements
    document.getElementById('point-p').setAttribute('cx', projP.x);
    document.getElementById('point-p').setAttribute('cy', projP.y);
    document.getElementById('p-label').setAttribute('x', projP.x + 10);
    document.getElementById('p-label').setAttribute('y', projP.y - 10);

    // Draw Wire Path
    let wirePathD = "";
    for (let i = 0; i <= 100; i++) {
        let pos = getWirePos(i / 100);
        let proj = project(pos.x, pos.y, pos.z);
        wirePathD += (i === 0 ? "M " : " L ") + proj.x + " " + proj.y;
    }
    document.getElementById('wire').setAttribute('d', wirePathD);

    // --- Animation Loop ---
    let isPlaying = true;
    let animTime = 0;
    let lastTime = Date.now();
    const LOOP_DURATION = 10000; // 10 seconds

    function updateScene(time) {
        let phaseTime = time / LOOP_DURATION;
        let t = 0;
        let opacity = 0;
        let pulseT = -1;

        // Phase Logic
        if (phaseTime < 0.2) {
            // Setup (0-2s)
            t = 0;
            opacity = phaseTime / 0.1; // Fade in over 1s
            if (opacity > 1) opacity = 1;
            pulseT = phaseTime / 0.2; // Pulse travels 0 to 1
        } else if (phaseTime < 0.8) {
            // Slide & Calculate (2-8s)
            t = (phaseTime - 0.2) / 0.6;
            opacity = 1;
        } else {
            // Reset (8-10s)
            t = 1;
            opacity = 1 - (phaseTime - 0.8) / 0.1; // Fade out over 1s
            if (opacity < 0) opacity = 0;
        }

        const dynGroup = document.getElementById('dynamic-group');
        const plane = document.getElementById('plane');
        const pulse = document.getElementById('pulse');

        dynGroup.setAttribute('opacity', opacity);
        plane.setAttribute('opacity', opacity * 0.4);

        // Pulse Animation
        if (pulseT >= 0 && pulseT <= 1) {
            let pPos = getWirePos(pulseT);
            let pProj = project(pPos.x, pPos.y, pPos.z);
            pulse.setAttribute('cx', pProj.x);
            pulse.setAttribute('cy', pProj.y);
            pulse.setAttribute('opacity', Math.sin(pulseT * Math.PI)); // Fade in/out
        } else {
            pulse.setAttribute('opacity', 0);
        }

        if (opacity === 0) return; // Skip heavy math if invisible

        // Calculate Vectors
        const pos = getWirePos(t);
        const tan = getWireTangent(t);

        // Normalize tangent for visual dl
        const tanMag = Math.sqrt(tan.x*tan.x + tan.y*tan.y + tan.z*tan.z);
        const VIS_DL_LEN = 70;
        const dlVis = {
            x: (tan.x / tanMag) * VIS_DL_LEN,
            y: (tan.y / tanMag) * VIS_DL_LEN,
            z: (tan.z / tanMag) * VIS_DL_LEN
        };

        // Vector r (from element to P)
        const rVec = {
            x: PointP.x - pos.x,
            y: PointP.y - pos.y,
            z: PointP.z - pos.z
        };
        const rMagSq = rVec.x*rVec.x + rVec.y*rVec.y + rVec.z*rVec.z;
        const rMag = Math.sqrt(rMagSq);

        // Cross Product dB = dl x r
        // Using normalized dl for direction, then scaling by 1/r^2
        const nDl = { x: tan.x/tanMag, y: tan.y/tanMag, z: tan.z/tanMag };
        const dbMath = {
            x: nDl.y * rVec.z - nDl.z * rVec.y,
            y: nDl.z * rVec.x - nDl.x * rVec.z,
            z: nDl.x * rVec.y - nDl.y * rVec.x
        };

        // Scale dB for display (proportional to 1/r^2)
        // dbMath magnitude is r * sin(theta). We want display length ~ sin(theta)/r^2.
        // So we multiply by K / r^3.
        const K = 12000000; 
        const dbVis = {
            x: K * dbMath.x / (rMagSq * rMag),
            y: K * dbMath.y / (rMagSq * rMag),
            z: K * dbMath.z / (rMagSq * rMag)
        };

        // --- Projections & DOM Updates ---
        const pWire = project(pos.x, pos.y, pos.z);
        const pDlEnd = project(pos.x + dlVis.x, pos.y + dlVis.y, pos.z + dlVis.z);
        const pDbEnd = project(PointP.x + dbVis.x, PointP.y + dbVis.y, PointP.z + dbVis.z);

        // Update Idl
        document.getElementById('dl-vec').setAttribute('x1', pWire.x);
        document.getElementById('dl-vec').setAttribute('y1', pWire.y);
        document.getElementById('dl-vec').setAttribute('x2', pDlEnd.x);
        document.getElementById('dl-vec').setAttribute('y2', pDlEnd.y);
        
        const pDlLabel = project(pos.x + dlVis.x * 1.3, pos.y + dlVis.y * 1.3, pos.z + dlVis.z * 1.3);
        document.getElementById('dl-label').setAttribute('x', pDlLabel.x);
        document.getElementById('dl-label').setAttribute('y', pDlLabel.y);

        // Update r
        document.getElementById('r-vec').setAttribute('x1', pWire.x);
        document.getElementById('r-vec').setAttribute('y1', pWire.y);
        document.getElementById('r-vec').setAttribute('x2', projP.x);
        document.getElementById('r-vec').setAttribute('y2', projP.y);

        const pRLabel = project(pos.x + rVec.x * 0.5, pos.y + rVec.y * 0.5, pos.z + rVec.z * 0.5);
        document.getElementById('r-label').setAttribute('x', pRLabel.x - 10);
        document.getElementById('r-label').setAttribute('y', pRLabel.y - 10);

        // Update dB
        document.getElementById('db-vec').setAttribute('x1', projP.x);
        document.getElementById('db-vec').setAttribute('y1', projP.y);
        document.getElementById('db-vec').setAttribute('x2', pDbEnd.x);
        document.getElementById('db-vec').setAttribute('y2', pDbEnd.y);

        const pDbLabel = project(PointP.x + dbVis.x * 1.2, PointP.y + dbVis.y * 1.2, PointP.z + dbVis.z * 1.2);
        document.getElementById('db-label').setAttribute('x', pDbLabel.x);
        document.getElementById('db-label').setAttribute('y', pDbLabel.y);

        // Update Plane (Parallelogram formed by dl and r)
        const pPlane3 = project(pos.x + rVec.x + dlVis.x, pos.y + rVec.y + dlVis.y, pos.z + rVec.z + dlVis.z);
        plane.setAttribute('points', `${pWire.x},${pWire.y} ${pDlEnd.x},${pDlEnd.y} ${pPlane3.x},${pPlane3.y} ${projP.x},${projP.y}`);

        // Update Theta Arc
        const nR = { x: rVec.x/rMag, y: rVec.y/rMag, z: rVec.z/rMag };
        const ARC_DIST = 35;
        const ptA = project(pos.x + nDl.x * ARC_DIST, pos.y + nDl.y * ARC_DIST, pos.z + nDl.z * ARC_DIST);
        const ptB = project(pos.x + nR.x * ARC_DIST, pos.y + nR.y * ARC_DIST, pos.z + nR.z * ARC_DIST);
        const ptCtrl = project(pos.x + (nDl.x + nR.x) * ARC_DIST * 0.6, pos.y + (nDl.y + nR.y) * ARC_DIST * 0.6, pos.z + (nDl.z + nR.z) * ARC_DIST * 0.6);
        
        document.getElementById('theta-arc').setAttribute('d', `M ${ptA.x} ${ptA.y} Q ${ptCtrl.x} ${ptCtrl.y} ${ptB.x} ${ptB.y}`);
        
        const pThetaLabel = project(pos.x + (nDl.x + nR.x) * ARC_DIST * 0.8, pos.y + (nDl.y + nR.y) * ARC_DIST * 0.8, pos.z + (nDl.z + nR.z) * ARC_DIST * 0.8);
        document.getElementById('theta-label').setAttribute('x', pThetaLabel.x - 5);
        document.getElementById('theta-label').setAttribute('y', pThetaLabel.y + 5);
    }

    function loop() {
        let now = Date.now();
        let dt = now - lastTime;
        lastTime = now;
        
        if (isPlaying) {
            animTime = (animTime + dt) % LOOP_DURATION;
            updateScene(animTime);
        }
        requestAnimationFrame(loop);
    }

    // Interactivity
    document.getElementById('play-btn').addEventListener('click', () => {
        isPlaying = !isPlaying;
        document.getElementById('play-text').textContent = isPlaying ? "Pause" : "Play";
        if (isPlaying) lastTime = Date.now();
    });

    // Start
    updateScene(0);
    requestAnimationFrame(loop);
</script>

</body>
</html>
