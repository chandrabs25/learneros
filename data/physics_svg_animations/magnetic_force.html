<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Force on a Moving Charge</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,600&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .draw-mask {
            stroke-dasharray: 1193;
            stroke-dashoffset: 1193;
            animation: drawPath 8s linear infinite;
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 1193; }
            100% { stroke-dashoffset: 0; }
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Velocity -->
            <marker id="arrow-v" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#06D6A0" />
            </marker>

            <!-- Arrowhead for Force -->
            <marker id="arrow-f" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF3366" />
            </marker>

            <!-- Magnetic Field Pattern (X symbol) -->
            <pattern id="b-field" width="90" height="90" patternUnits="userSpaceOnUse">
                <g stroke="#7209B7" stroke-width="2" stroke-linecap="round" opacity="0.35">
                    <circle cx="45" cy="45" r="12" fill="none"/>
                    <path d="M 37 37 L 53 53 M 53 37 L 37 53"/>
                </g>
            </pattern>

            <!-- Tube Gradient -->
            <linearGradient id="tubeGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#CED4DA"/>
                <stop offset="20%" stop-color="#F8F9FA"/>
                <stop offset="100%" stop-color="#ADB5BD"/>
            </linearGradient>

            <!-- Shadow Filter -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.08"/>
            </filter>

            <!-- Glow Filter for Particle -->
            <filter id="glow">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Mask for animated trajectory drawing -->
            <mask id="pathMask">
                <path d="M 0 350 L 250 350 A 150 150 0 0 0 250 50 A 150 150 0 0 0 250 350" fill="none" stroke="white" stroke-width="6" class="draw-mask"/>
            </mask>

            <!-- The actual path geometry to be referenced by animateMotion -->
            <path id="particlePath" d="M 0 350 L 250 350 A 150 150 0 0 0 250 50 A 150 150 0 0 0 250 350" fill="none"/>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Title and Subtitle -->
        <text x="30" y="45" font-size="22" font-weight="700" fill="#212529">Magnetic Force on a Moving Charge</text>
        <text x="30" y="75" font-size="16" fill="#495057" class="math-text">Lorentz Force: <tspan fill="#FF3366" font-weight="700">F</tspan> = q(<tspan fill="#06D6A0" font-weight="700">v</tspan> × <tspan fill="#7209B7" font-weight="700">B</tspan>)</text>

        <!-- Magnetic Field Region -->
        <rect x="80" y="20" width="540" height="360" fill="url(#b-field)" />
        
        <!-- Field Label -->
        <rect x="490" y="25" width="220" height="32" rx="6" fill="#F3E8FF" stroke="#7209B7" stroke-width="1.5" opacity="0.9"/>
        <text x="502" y="46" font-size="14" fill="#7209B7" font-weight="600">Uniform B-Field (into page)</text>

        <!-- Shielded Injector Tube -->
        <g>
            <rect x="0" y="330" width="250" height="40" fill="url(#tubeGrad)" stroke="#6C757D" stroke-width="1.5"/>
            <ellipse cx="250" cy="350" rx="8" ry="20" fill="#343A40"/>
            <ellipse cx="250" cy="350" rx="6" ry="18" fill="#212529"/>
            <line x1="0" y1="350" x2="245" y2="350" stroke="#6C757D" stroke-dasharray="4,4" stroke-width="1.5"/>
            <text x="15" y="320" font-size="13" fill="#6C757D" font-weight="600">Shielded Injector (B = 0)</text>
        </g>

        <!-- Trajectory Path (Dashed, revealed by mask) -->
        <path d="M 0 350 L 250 350 A 150 150 0 0 0 250 50 A 150 150 0 0 0 250 350" fill="none" stroke="#ADB5BD" stroke-width="3" stroke-dasharray="8,6" mask="url(#pathMask)"/>

        <!-- Legend -->
        <g transform="translate(30, 415)">
            <rect x="0" y="0" width="190" height="65" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="20" cy="20" r="6" fill="#06D6A0"/>
            <text x="35" y="25" font-size="13" font-weight="600" fill="#495057">Velocity Vector (<tspan font-style="italic">v</tspan>)</text>
            <circle cx="20" cy="45" r="6" fill="#FF3366"/>
            <text x="35" y="50" font-size="13" font-weight="600" fill="#495057">Magnetic Force (<tspan font-style="italic">F<tspan baseline-shift="sub" font-size="10">m</tspan></tspan>)</text>
        </g>

        <!-- Formula Card -->
        <g transform="translate(520, 385)">
            <rect x="0" y="0" width="250" height="95" rx="8" fill="#FFFFFF" stroke="#DEE2E6" stroke-width="2" filter="url(#shadow)"/>
            <text x="15" y="25" font-size="14" fill="#212529" font-weight="700">Magnitude &amp; Path</text>
            <line x1="15" y1="35" x2="235" y2="35" stroke="#E9ECEF" stroke-width="2"/>
            <text x="15" y="55" font-size="13" fill="#495057" class="math-text">|F| = qvB·sin(θ)</text>
            <text x="15" y="78" font-size="13" fill="#495057" class="math-text">θ = 90° ⇒ <tspan fill="#FF3366" font-weight="700">F = qvB</tspan></text>
        </g>

        <!-- Moving Particle Group -->
        <g>
            <!-- Fade in at start, fade out at end -->
            <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.02; 0.98; 1" dur="8s" repeatCount="indefinite"/>
            
            <!-- Motion along the path -->
            <animateMotion dur="8s" repeatCount="indefinite" calcMode="paced" rotate="auto">
                <mpath href="#particlePath"/>
            </animateMotion>

            <!-- Velocity Vector (Always visible, points along local +x due to rotate="auto") -->
            <g>
                <line x1="15" y1="0" x2="70" y2="0" stroke="#06D6A0" stroke-width="3.5" marker-end="url(#arrow-v)"/>
                <text x="55" y="-12" font-size="16" font-weight="700" font-style="italic" fill="#06D6A0">v</text>
            </g>

            <!-- Magnetic Force Vector (Visible only in B-field, points to center which is local -y) -->
            <g opacity="0">
                <!-- Appears exactly when particle exits injector (at 20.96% of the 8s loop) -->
                <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.2096; 0.21; 0.99; 1" dur="8s" repeatCount="indefinite"/>
                <line x1="0" y1="-15" x2="0" y2="-75" stroke="#FF3366" stroke-width="3.5" marker-end="url(#arrow-f)"/>
                <text x="10" y="-60" font-size="16" font-weight="700" font-style="italic" fill="#FF3366">F<tspan baseline-shift="sub" font-size="12">m</tspan></text>
            </g>

            <!-- The Particle (+q) -->
            <circle cx="0" cy="0" r="12" fill="#FFD700" stroke="#212529" stroke-width="2.5" filter="url(#glow)"/>
            <!-- Plus Sign -->
            <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#212529" stroke-width="2.5" stroke-linecap="round"/>
        </g>
    </svg>
</div>

</body>
</html>
