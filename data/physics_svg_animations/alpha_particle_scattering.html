<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Particle Scattering</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6C757D;
            --force-color: #FF3366;
            --vel-color: #00B4D8;
            --alpha-color: #06D6A0;
            --ui-border: #DEE2E6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #ffffff;
            border: 2px solid var(--ui-border);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:hover {
            border-color: var(--text-muted);
            background-color: #f1f3f5;
        }

        button.active-toggle {
            background-color: var(--text-main);
            color: #ffffff;
            border-color: var(--text-main);
        }

        .svg-container {
            width: 100%;
            aspect-ratio: 8 / 5;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid var(--ui-border);
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Toggle Classes */
        .hide-vectors .vector {
            opacity: 0;
        }
        
        .vector {
            transition: opacity 0.3s ease;
        }

        /* Nucleus Pulse Animation */
        @keyframes pulseGlow {
            0% { filter: drop-shadow(0 0 8px rgba(247, 127, 0, 0.4)); }
            50% { filter: drop-shadow(0 0 20px rgba(247, 127, 0, 0.8)); }
            100% { filter: drop-shadow(0 0 8px rgba(247, 127, 0, 0.4)); }
        }

        .nucleus-group {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Alpha Particle Scattering & The Nucleus</h1>
        <div class="controls">
            <button id="play-btn" onclick="togglePlay()">⏸ Pause</button>
            <button id="vector-btn" class="active-toggle" onclick="toggleVectors()">Show Vectors</button>
        </div>
    </div>

    <div class="svg-container">
        <svg id="sim-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients -->
                <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#FFD700" />
                    <stop offset="70%" stop-color="#F77F00" />
                    <stop offset="100%" stop-color="#D96500" />
                </radialGradient>
                
                <radialGradient id="alphaGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#48F0C0" />
                    <stop offset="100%" stop-color="#06D6A0" />
                </radialGradient>

                <!-- Arrowhead Markers -->
                <marker id="arrowForce" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
                </marker>
                <marker id="arrowVel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#00B4D8" />
                </marker>
                <marker id="arrowDim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                    <path d="M 0 2 L 10 5 L 0 8 z" fill="#495057" />
                </marker>

                <!-- Trajectory Paths -->
                <!-- P1: Large b (130), minimal deflection -->
                <path id="path1" d="M 0 120 Q 500 120, 800 60" fill="none" />
                <!-- P2: Medium b (60), ~60 deg deflection -->
                <path id="path2" d="M 0 190 Q 480 190, 650 -50" fill="none" />
                <!-- P3: Small b (-30), ~120 deg deflection -->
                <path id="path3" d="M 0 280 Q 450 280, 250 650" fill="none" />
                <!-- P4: Head-on b (0), 180 deg reflection -->
                <path id="path4" d="M 0 250 L 380 250 L 0 250" fill="none" />
            </defs>

            <!-- Background Grid / Axes -->
            <line x1="0" y1="250" x2="800" y2="250" stroke="#E9ECEF" stroke-width="2" stroke-dasharray="8,8" />
            <line x1="500" y1="0" x2="500" y2="500" stroke="#E9ECEF" stroke-width="2" stroke-dasharray="8,8" />

            <!-- Initial Straight Paths (Dashed) -->
            <path d="M 0 120 L 800 120" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5,5" fill="none" opacity="0.6" />
            <path d="M 0 190 L 800 190" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5,5" fill="none" opacity="0.6" />
            <path d="M 0 280 L 800 280" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="5,5" fill="none" opacity="0.6" />

            <!-- Actual Hyperbolic Paths (Solid) -->
            <use href="#path1" stroke="#DEE2E6" stroke-width="2" />
            <use href="#path2" stroke="#DEE2E6" stroke-width="2" />
            <use href="#path3" stroke="#DEE2E6" stroke-width="2" />
            <use href="#path4" stroke="#DEE2E6" stroke-width="2" />

            <!-- Annotations & Labels -->
            <!-- Impact Parameter (b) -->
            <line x1="80" y1="120" x2="80" y2="250" stroke="#495057" stroke-width="1.5" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)" />
            <text x="65" y="190" font-family="Inter" font-style="italic" font-size="14" fill="#495057">b</text>

            <!-- Scattering Angle (theta) -->
            <path d="M 540 190 A 60 60 0 0 0 515 140" stroke="#495057" stroke-width="1.5" fill="none" marker-end="url(#arrowDim)" />
            <text x="550" y="160" font-family="Inter" font-style="italic" font-size="14" fill="#495057">θ</text>

            <!-- Distance of Closest Approach (d) -->
            <line x1="380" y1="265" x2="460" y2="265" stroke="#495057" stroke-width="1.5" marker-start="url(#arrowDim)" marker-end="url(#arrowDim)" />
            <line x1="380" y1="240" x2="380" y2="275" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="3,3" />
            <text x="420" y="285" font-family="Inter" font-style="italic" font-size="14" fill="#495057" text-anchor="middle">d</text>

            <!-- Nucleus -->
            <g class="nucleus-group">
                <circle cx="500" cy="250" r="40" fill="url(#goldGrad)" stroke="#D96500" stroke-width="1" />
                <!-- Plus Sign -->
                <path d="M 490 250 L 510 250 M 500 240 L 500 260" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
            </g>
            <text x="500" y="315" font-family="Inter" font-size="14" font-weight="600" text-anchor="middle" fill="#212529">Gold Nucleus (Z=79)</text>

            <!-- ========================================== -->
            <!-- ANIMATED PARTICLES & VECTORS               -->
            <!-- ========================================== -->

            <!-- Particle 1 (Large b) -->
            <g>
                <!-- Particle and Force Vector (No auto-rotate) -->
                <g>
                    <animateMotion dur="6s" repeatCount="indefinite" begin="0s" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0.5 0.5 0.5">
                        <mpath href="#path1"/>
                    </animateMotion>
                    
                    <circle r="6" fill="url(#alphaGrad)" />
                    
                    <!-- Force Vector -->
                    <g class="vector">
                        <animateTransform attributeName="transform" type="rotate" values="194; 207; 270; 313; 327" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="0s" />
                        <g>
                            <animateTransform attributeName="transform" type="scale" values="0.1; 0.2; 0.6; 0.2; 0.1" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="0s" />
                            <line x1="8" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowForce)" stroke-linecap="round" />
                        </g>
                    </g>
                </g>
                <!-- Velocity Vector (Auto-rotate) -->
                <g class="vector">
                    <animateMotion dur="6s" repeatCount="indefinite" begin="0s" calcMode="spline" keyTimes="0; 1" keySplines="0.5 0.5 0.5 0.5" rotate="auto">
                        <mpath href="#path1"/>
                    </animateMotion>
                    <g>
                        <animateTransform attributeName="transform" type="scale" values="1; 0.85; 1" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" begin="0s" />
                        <line x1="8" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowVel)" stroke-linecap="round" />
                    </g>
                </g>
            </g>

            <!-- Particle 2 (Medium b) -->
            <g>
                <g>
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-1.5s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.2 0.6 0.6 1; 0.4 0 0.8 0.4">
                        <mpath href="#path2"/>
                    </animateMotion>
                    
                    <circle r="6" fill="url(#alphaGrad)" />
                    
                    <!-- Force Vector -->
                    <g class="vector">
                        <animateTransform attributeName="transform" type="rotate" values="186; 196; 251; 289; 296" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="-1.5s" />
                        <g>
                            <animateTransform attributeName="transform" type="scale" values="0.1; 0.3; 1.4; 0.3; 0.1" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="-1.5s" />
                            <line x1="8" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowForce)" stroke-linecap="round" />
                        </g>
                    </g>
                </g>
                <!-- Velocity Vector -->
                <g class="vector">
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-1.5s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.2 0.6 0.6 1; 0.4 0 0.8 0.4" rotate="auto">
                        <mpath href="#path2"/>
                    </animateMotion>
                    <g>
                        <animateTransform attributeName="transform" type="scale" values="1; 0.5; 1" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" begin="-1.5s" />
                        <line x1="8" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowVel)" stroke-linecap="round" />
                    </g>
                </g>
            </g>

            <!-- Particle 3 (Small b) -->
            <g>
                <g>
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-3s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.1 0.7 0.5 1; 0.5 0 0.9 0.3">
                        <mpath href="#path3"/>
                    </animateMotion>
                    
                    <circle r="6" fill="url(#alphaGrad)" />
                    
                    <!-- Force Vector -->
                    <g class="vector">
                        <animateTransform attributeName="transform" type="rotate" values="176; 171; 149; 124; 122" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="-3s" />
                        <g>
                            <animateTransform attributeName="transform" type="scale" values="0.1; 0.4; 2.2; 0.4; 0.1" keyTimes="0; 0.25; 0.5; 0.75; 1" dur="6s" repeatCount="indefinite" begin="-3s" />
                            <line x1="8" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowForce)" stroke-linecap="round" />
                        </g>
                    </g>
                </g>
                <!-- Velocity Vector -->
                <g class="vector">
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-3s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.1 0.7 0.5 1; 0.5 0 0.9 0.3" rotate="auto">
                        <mpath href="#path3"/>
                    </animateMotion>
                    <g>
                        <animateTransform attributeName="transform" type="scale" values="1; 0.25; 1" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" begin="-3s" />
                        <line x1="8" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowVel)" stroke-linecap="round" />
                    </g>
                </g>
            </g>

            <!-- Particle 4 (Head-on, b=0) -->
            <g>
                <g>
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-4.5s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.1 0.8 0.4 1; 0.6 0 0.9 0.2">
                        <mpath href="#path4"/>
                    </animateMotion>
                    
                    <circle r="6" fill="url(#alphaGrad)" />
                    
                    <!-- Force Vector -->
                    <g class="vector">
                        <!-- Always points left (180 deg) -->
                        <g transform="rotate(180)">
                            <animateTransform attributeName="transform" type="scale" values="0.1; 3; 0.1" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" begin="-4.5s" />
                            <line x1="8" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowForce)" stroke-linecap="round" />
                        </g>
                    </g>
                </g>
                <!-- Velocity Vector -->
                <g class="vector">
                    <animateMotion dur="6s" repeatCount="indefinite" begin="-4.5s" calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.1 0.8 0.4 1; 0.6 0 0.9 0.2" rotate="auto">
                        <mpath href="#path4"/>
                    </animateMotion>
                    <g>
                        <animateTransform attributeName="transform" type="scale" values="1; 0; 1" keyTimes="0; 0.5; 1" dur="6s" repeatCount="indefinite" begin="-4.5s" />
                        <line x1="8" y1="0" x2="50" y2="0" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowVel)" stroke-linecap="round" />
                    </g>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- UI OVERLAYS (Legend & Formula)             -->
            <!-- ========================================== -->

            <!-- Legend Box -->
            <rect x="20" y="370" width="210" height="110" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5" />
            <text x="35" y="395" font-family="Inter" font-size="14" font-weight="600" fill="#212529">Legend</text>
            
            <circle cx="45" cy="415" r="6" fill="#06D6A0" />
            <text x="65" y="420" font-family="Inter" font-size="13" fill="#495057">Alpha Particle (He²⁺)</text>
            
            <line x1="35" y1="440" x2="55" y2="440" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowForce)" />
            <text x="65" y="444" font-family="Inter" font-size="13" fill="#495057">Coulomb Force (F_c)</text>
            
            <line x1="35" y1="464" x2="55" y2="464" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowVel)" />
            <text x="65" y="468" font-family="Inter" font-size="13" fill="#495057">Velocity (v)</text>

            <!-- Formula Box -->
            <rect x="540" y="390" width="240" height="90" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5" />
            <text x="660" y="415" font-family="Inter" font-size="14" font-weight="600" text-anchor="middle" fill="#212529">Coulomb's Law</text>
            <text x="660" y="445" class="math" font-size="16" text-anchor="middle" fill="#FF3366">F = k · (q₁q₂ / r²)</text>
            <text x="660" y="465" font-family="Inter" font-size="12" text-anchor="middle" fill="#6C757D">Force scales with 1/r²</text>

        </svg>
    </div>
</div>

<script>
    let isPlaying = true;
    let vectorsVisible = true;

    function togglePlay() {
        const svg = document.getElementById('sim-svg');
        const btn = document.getElementById('play-btn');
        if (isPlaying) {
            svg.pauseAnimations();
            btn.innerHTML = '▶ Play';
            btn.classList.remove('active-toggle');
        } else {
            svg.unpauseAnimations();
            btn.innerHTML = '⏸ Pause';
            btn.classList.add('active-toggle');
        }
        isPlaying = !isPlaying;
    }

    function toggleVectors() {
        const svg = document.getElementById('sim-svg');
        const btn = document.getElementById('vector-btn');
        if (vectorsVisible) {
            svg.classList.add('hide-vectors');
            btn.classList.remove('active-toggle');
        } else {
            svg.classList.remove('hide-vectors');
            btn.classList.add('active-toggle');
        }
        vectorsVisible = !vectorsVisible;
    }
</script>

</body>
</html>
