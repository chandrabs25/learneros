<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friction & Aristotle's Fallacy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 10px;
        }

        text {
            user-select: none;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* --- Animations --- */
        
        /* Block Translation with exact kinematic easing */
        @keyframes slideBlock {
            0% {
                transform: translateX(0px);
                animation-timing-function: cubic-bezier(0.333, 0, 0.667, 0.333); /* Quadratic Ease-In (Acceleration) */
            }
            25% {
                transform: translateX(150px);
                animation-timing-function: linear; /* Constant Velocity */
            }
            50% {
                transform: translateX(450px);
                animation-timing-function: cubic-bezier(0.333, 0.667, 0.667, 1); /* Quadratic Ease-Out (Deceleration) */
            }
            75% {
                transform: translateX(600px);
                opacity: 1;
                animation-timing-function: linear;
            }
            85% {
                transform: translateX(600px);
                opacity: 0;
            }
            95% {
                transform: translateX(0px);
                opacity: 0;
            }
            100% {
                transform: translateX(0px);
                opacity: 1;
            }
        }

        /* Velocity Vector Growth (Linear) */
        @keyframes growVelocity {
            0% { x2: 160px; opacity: 0; }
            1% { opacity: 1; }
            25% { x2: 260px; opacity: 1; }
            50% { x2: 260px; opacity: 1; }
            74.9% { opacity: 1; }
            75% { x2: 160px; opacity: 0; }
            100% { x2: 160px; opacity: 0; }
        }

        /* Velocity Text Position */
        @keyframes moveVelText {
            0% { x: 170px; opacity: 0; }
            1% { opacity: 1; }
            25% { x: 270px; opacity: 1; }
            50% { x: 270px; opacity: 1; }
            74.9% { opacity: 1; }
            75% { x: 170px; opacity: 0; }
            100% { x: 170px; opacity: 0; }
        }

        /* Applied Force Vector (Step changes) */
        @keyframes animateAppliedForce {
            0%, 24.9% { x2: 220px; opacity: 1; }
            25%, 49.9% { x2: 160px; opacity: 1; }
            50%, 100% { x2: 160px; opacity: 0; }
        }

        /* Friction Vector (Constant while moving) */
        @keyframes animateFriction {
            0% { opacity: 0; }
            0.1%, 74.9% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        /* Annotations */
        @keyframes showNewton {
            0%, 24.9% { opacity: 0; transform: translateY(10px); }
            25%, 49.9% { opacity: 1; transform: translateY(0px); }
            50%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        @keyframes showAristotle {
            0%, 49.9% { opacity: 0; transform: translateY(10px); }
            50%, 75% { opacity: 1; transform: translateY(0px); }
            75.1%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Data Overlay Toggles */
        @keyframes dataPhase1 { 0%, 24.9% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes dataPhase2 { 0%, 24.9% { opacity: 0; } 25%, 49.9% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes dataPhase3 { 0%, 49.9% { opacity: 0; } 50%, 75% { opacity: 1; } 75.1%, 100% { opacity: 0; } }

        /* Apply Animations */
        .block-group { animation: slideBlock 12s infinite; }
        .vel-line { animation: growVelocity 12s linear infinite; }
        .vel-text { animation: moveVelText 12s linear infinite; }
        .app-force-line { animation: animateAppliedForce 12s linear infinite; }
        .fric-force-line { animation: animateFriction 12s linear infinite; }
        
        .anno-newton { animation: showNewton 12s ease-in-out infinite; }
        .anno-aristotle { animation: showAristotle 12s ease-in-out infinite; }
        
        .data-p1 { animation: dataPhase1 12s step-end infinite; }
        .data-p2 { animation: dataPhase2 12s step-end infinite; }
        .data-p3 { animation: dataPhase3 12s step-end infinite; }

        /* Interactive Microscopic View */
        .micro-view {
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 120px 420px;
            cursor: pointer;
        }
        .micro-view:hover {
            transform: scale(1.6);
        }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead Markers -->
        <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,1 L9,5 L0,9 z" fill="#FF3366" />
        </marker>
        <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,1 L9,5 L0,9 z" fill="#4361EE" />
        </marker>
        <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,1 L9,5 L0,9 z" fill="#06D6A0" />
        </marker>
        <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
            <path d="M0,1 L9,5 L0,9 z" fill="#00B4D8" />
        </marker>

        <!-- Surface Gradient -->
        <linearGradient id="surfaceGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#adb5bd"/>
            <stop offset="100%" stop-color="#495057"/>
        </linearGradient>

        <!-- Background Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9ecef" stroke-width="1"/>
        </pattern>

        <!-- Drop Shadow for Annotations -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.1"/>
        </filter>

        <!-- Clip Path for Microscopic View -->
        <clipPath id="microClip">
            <circle cx="120" cy="420" r="45"/>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Header / Title -->
    <text x="400" y="40" font-size="26" font-weight="bold" text-anchor="middle" fill="#343a40">Friction &amp; Aristotle’s Fallacy</text>
    <text x="400" y="65" font-size="14" text-anchor="middle" fill="#6c757d">Why objects don't "naturally" stop: The hidden force of kinetic friction</text>

    <!-- Surface -->
    <line x1="0" y1="350" x2="800" y2="350" stroke="url(#surfaceGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Microscopic View (Bottom Left) -->
    <g class="micro-view">
        <circle cx="120" cy="420" r="45" fill="#fff" stroke="#343a40" stroke-width="3" filter="url(#shadow)"/>
        <g clip-path="url(#microClip)">
            <!-- Block Bottom Surface -->
            <path d="M70,415 l10,8 l12,-6 l14,12 l10,-10 l15,8 l15,-12 l10,10 v-40 h-100 z" fill="#e9ecef" stroke="#343a40" stroke-width="2"/>
            <!-- Floor Top Surface -->
            <path d="M70,420 l10,8 l12,-6 l14,12 l10,-10 l15,8 l15,-12 l10,10 v40 h-100 z" fill="#adb5bd" stroke="#343a40" stroke-width="2"/>
        </g>
        <circle cx="120" cy="420" r="45" fill="none" stroke="#343a40" stroke-width="3"/>
        <line x1="155" y1="390" x2="200" y2="355" stroke="#343a40" stroke-width="2" stroke-dasharray="4 4"/>
        <text x="120" y="485" font-size="12" font-weight="bold" text-anchor="middle" fill="#343a40">Microscopic Contact</text>
        <text x="120" y="500" font-size="12" font-family="Roboto Mono" text-anchor="middle" fill="#4361EE">f<tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> = μ</tspan><tspan dy="3" font-size="9">k</tspan><tspan dy="-3"> N</tspan></text>
    </g>

    <!-- Legend (Bottom Right) -->
    <g transform="translate(620, 410)">
        <rect x="0" y="0" width="150" height="75" rx="5" fill="#fff" stroke="#ced4da" stroke-width="1" filter="url(#shadow)"/>
        <text x="75" y="18" font-size="11" font-weight="bold" text-anchor="middle" fill="#343a40">Vector Legend</text>
        <line x1="10" y1="30" x2="30" y2="30" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
        <text x="40" y="34" font-size="11" fill="#343a40">Applied Force</text>
        <line x1="10" y1="48" x2="30" y2="48" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
        <text x="40" y="52" font-size="11" fill="#343a40">Kinetic Friction</text>
        <line x1="10" y1="66" x2="30" y2="66" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
        <text x="40" y="70" font-size="11" fill="#343a40">Velocity</text>
    </g>

    <!-- Data Overlay (Top Right) -->
    <g transform="translate(600, 20)">
        <rect x="0" y="0" width="180" height="100" rx="6" fill="#fff" stroke="#7209B7" stroke-width="2" filter="url(#shadow)"/>
        <text x="90" y="22" font-size="13" font-weight="bold" text-anchor="middle" fill="#7209B7">Kinematics Data</text>
        <line x1="10" y1="30" x2="170" y2="30" stroke="#e9ecef" stroke-width="1"/>
        
        <!-- Phase 1 Data -->
        <g class="data-p1 math">
            <text x="15" y="50" font-size="12" fill="#343a40">a = +33.3 px/s²</text>
            <text x="15" y="68" font-size="12" fill="#06D6A0">v = increasing</text>
            <text x="15" y="86" font-size="12" fill="#FF3366">F<tspan dy="2" font-size="9">net</tspan><tspan dy="-2"> &gt; 0</tspan></text>
        </g>
        <!-- Phase 2 Data -->
        <g class="data-p2 math">
            <text x="15" y="50" font-size="12" fill="#343a40">a = 0.0 px/s²</text>
            <text x="15" y="68" font-size="12" fill="#06D6A0">v = 100 px/s (const)</text>
            <text x="15" y="86" font-size="12" fill="#343a40">F<tspan dy="2" font-size="9">net</tspan><tspan dy="-2"> = 0</tspan></text>
        </g>
        <!-- Phase 3 Data -->
        <g class="data-p3 math">
            <text x="15" y="50" font-size="12" fill="#343a40">a = -33.3 px/s²</text>
            <text x="15" y="68" font-size="12" fill="#06D6A0">v = decreasing</text>
            <text x="15" y="86" font-size="12" fill="#4361EE">F<tspan dy="2" font-size="9">net</tspan><tspan dy="-2"> &lt; 0</tspan></text>
        </g>
    </g>

    <!-- Dynamic Annotations (Center Top) -->
    <g class="anno-newton" transform="translate(300, 100)">
        <rect x="0" y="0" width="200" height="40" rx="20" fill="#e0fbfc" stroke="#00B4D8" stroke-width="2" filter="url(#shadow)"/>
        <text x="100" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#03045e">Newton: ΣF = 0 ⇒ Δv = 0</text>
    </g>

    <g class="anno-aristotle" transform="translate(225, 100)">
        <rect x="0" y="0" width="350" height="40" rx="20" fill="#ffe5d9" stroke="#F77F00" stroke-width="2" filter="url(#shadow)"/>
        <text x="175" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#9d0208">Aristotle's Error: He missed the force of friction!</text>
    </g>

    <!-- ========================================== -->
    <!-- THE MOVING SYSTEM (Block + Vectors)        -->
    <!-- ========================================== -->
    <g class="block-group">
        
        <!-- The Block (Mass m) -->
        <rect x="100" y="270" width="120" height="80" rx="8" fill="#e9ecef" stroke="#343a40" stroke-width="3" filter="url(#shadow)"/>
        <text x="160" y="315" font-size="18" font-weight="bold" font-family="Roboto Mono" text-anchor="middle" fill="#343a40">m</text>

        <!-- Normal Force (N) -->
        <line x1="160" y1="270" x2="160" y2="210" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowCyan)"/>
        <text x="170" y="220" font-size="14" font-weight="bold" font-family="Roboto Mono" fill="#00B4D8">N</text>

        <!-- Weight (mg) -->
        <line x1="160" y1="310" x2="160" y2="370" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrowCyan)"/>
        <text x="170" y="365" font-size="14" font-weight="bold" font-family="Roboto Mono" fill="#00B4D8">mg</text>

        <!-- Velocity Vector (v) -->
        <line class="vel-line" x1="160" y1="240" x2="160" y2="240" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrowGreen)"/>
        <text class="vel-text" x="170" y="235" font-size="16" font-weight="bold" font-family="Roboto Mono" font-style="italic" fill="#06D6A0">v</text>

        <!-- Applied Force (F_app) -->
        <line class="app-force-line" x1="100" y1="310" x2="220" y2="310" stroke="#FF3366" stroke-width="4" marker-end="url(#arrowRed)"/>
        <text x="65" y="305" font-size="14" font-weight="bold" font-family="Roboto Mono" fill="#FF3366">F<tspan dy="3" font-size="10">app</tspan></text>

        <!-- Kinetic Friction (f_k) -->
        <line class="fric-force-line" x1="160" y1="350" x2="100" y2="350" stroke="#4361EE" stroke-width="4" marker-end="url(#arrowBlue)"/>
        <text x="160" y="375" font-size="14" font-weight="bold" font-family="Roboto Mono" text-anchor="middle" fill="#4361EE">f<tspan dy="3" font-size="10">k</tspan></text>

    </g>

</svg>

</body>
</html>
