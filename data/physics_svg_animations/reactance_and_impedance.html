<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Phase Relationships: Reactance & Impedance</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --v-color: #FF3366;
            --i-color: #4361EE;
            --r-color: #06D6A0;
            --l-color: #7209B7;
            --c-color: #F77F00;
            --z-color: #2B2D42;
            --bg-color: #f8f9fa;
            --grid-color: #e9ecef;
            --text-color: #343a40;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--bg-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            color: var(--text-color);
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #e2e8f0;
            color: #475569;
        }

        button:hover {
            background: #cbd5e1;
        }

        button.active-R { background: var(--r-color); color: white; box-shadow: 0 4px 12px rgba(6, 214, 160, 0.3); }
        button.active-L { background: var(--l-color); color: white; box-shadow: 0 4px 12px rgba(114, 9, 183, 0.3); }
        button.active-C { background: var(--c-color); color: white; box-shadow: 0 4px 12px rgba(247, 127, 0, 0.3); }

        svg {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            
            /* State Variables */
            --phase-angle: 0deg;
            --wave-shift: 0px;
            --x-rot: -90deg;
            --x-scale: 0;
            --x-color: transparent;
            --z-rot: 0deg;
            --z-scale: 1;
        }

        /* SVG State Transitions */
        svg.state-R {
            --phase-angle: 0deg;
            --wave-shift: 0px;
            --x-rot: -90deg;
            --x-scale: 0;
            --x-color: transparent;
            --z-rot: 0deg;
            --z-scale: 1;
        }

        svg.state-L {
            --phase-angle: 90deg;
            --wave-shift: 50px;
            --x-rot: -90deg;
            --x-scale: 1;
            --x-color: var(--l-color);
            --z-rot: -45deg;
            --z-scale: 1.414;
        }

        svg.state-C {
            --phase-angle: -90deg;
            --wave-shift: -50px;
            --x-rot: 90deg;
            --x-scale: 1;
            --x-color: var(--c-color);
            --z-rot: 45deg;
            --z-scale: 1.414;
        }

        /* Animations */
        @keyframes rot-ccw {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes rot-cw {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes wave-shift {
            0% { transform: translateX(0); }
            100% { transform: translateX(-200px); }
        }

        .anim-ccw { animation: rot-ccw 4s linear infinite; }
        .anim-cw { animation: rot-cw 4s linear infinite; }
        .anim-wave { animation: wave-shift 4s linear infinite; }

        /* Dynamic Elements */
        .phase-shift {
            transform: rotate(var(--phase-angle));
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .inverse-phase-shift {
            transform: rotate(calc(-1 * var(--phase-angle)));
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .wave-phase-shift {
            transform: translateX(var(--wave-shift));
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tri-x {
            transform: rotate(var(--x-rot)) scale(var(--x-scale));
            transform-origin: 60px 0px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            stroke: var(--x-color);
        }

        .tri-z {
            transform: rotate(var(--z-rot)) scaleX(var(--z-scale));
            transform-origin: 0px 0px;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .show-R, .show-L, .show-C { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
        svg.state-R .show-R { opacity: 1; }
        svg.state-L .show-L { opacity: 1; }
        svg.state-C .show-C { opacity: 1; }

        text { font-family: 'Inter', sans-serif; fill: var(--text-color); }
        .math { font-family: 'Roboto Mono', monospace; }
        .bold { font-weight: 600; }
        .small { font-size: 12px; }
        
        .legend-box { fill: white; stroke: #e2e8f0; rx: 6; }
    </style>
</head>
<body>

<div class="container">
    <h1>AC Phase Relationships: Reactance & Impedance</h1>
    
    <svg id="ac-viz" class="state-R" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-V" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--v-color)" />
            </marker>
            <marker id="arrow-I" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--i-color)" />
            </marker>
            <marker id="arrow-R" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--r-color)" />
            </marker>
            <marker id="arrow-X" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor" />
            </marker>
            <marker id="arrow-Z" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--z-color)" />
            </marker>

            <!-- Clip Paths -->
            <clipPath id="wave-clip" clipPathUnits="userSpaceOnUse">
                <rect x="400" y="0" width="380" height="350" />
            </clipPath>
            <clipPath id="proj-clip" clipPathUnits="userSpaceOnUse">
                <rect x="200" y="0" width="200" height="350" />
            </clipPath>
        </defs>

        <!-- ================= BACKGROUND GRIDS ================= -->
        <g stroke="var(--grid-color)" stroke-width="1">
            <!-- Phasor Grid -->
            <circle cx="200" cy="180" r="100" fill="none" stroke-dasharray="4 4" />
            <line x1="80" y1="180" x2="320" y2="180" />
            <line x1="200" y1="60" x2="200" y2="300" />
            
            <!-- Oscilloscope Grid -->
            <line x1="400" y1="180" x2="780" y2="180" stroke="#ced4da" stroke-width="2" /> <!-- Centerline -->
            <line x1="400" y1="80" x2="780" y2="80" stroke-dasharray="2 4" />
            <line x1="400" y1="280" x2="780" y2="280" stroke-dasharray="2 4" />
            
            <!-- Vertical Grid Lines (pi/2 intervals = 50px) -->
            <line x1="450" y1="60" x2="450" y2="300" stroke-dasharray="2 4" />
            <line x1="500" y1="60" x2="500" y2="300" stroke-dasharray="2 4" />
            <line x1="550" y1="60" x2="550" y2="300" stroke-dasharray="2 4" />
            <line x1="600" y1="60" x2="600" y2="300" stroke-dasharray="2 4" />
            <line x1="650" y1="60" x2="650" y2="300" stroke-dasharray="2 4" />
            <line x1="700" y1="60" x2="700" y2="300" stroke-dasharray="2 4" />
            <line x1="750" y1="60" x2="750" y2="300" stroke-dasharray="2 4" />
        </g>

        <!-- Grid Labels -->
        <g class="small" fill="#adb5bd" text-anchor="middle">
            <text x="450" y="315">π/2</text>
            <text x="500" y="315">π</text>
            <text x="550" y="315">3π/2</text>
            <text x="600" y="315">2π</text>
            <text x="700" y="315">4π</text>
            
            <text x="200" y="50">Im</text>
            <text x="335" y="184">Re</text>
        </g>

        <!-- ================= RIGHT PANEL: OSCILLOSCOPE ================= -->
        <g clip-path="url(#wave-clip)">
            <g transform="translate(400, 180)">
                <!-- Voltage Wave -->
                <g class="anim-wave">
                    <path d="M -200 0 C -163.58 -100, -136.42 -100, -100 0 C -63.58 100, -36.42 100, 0 0 C 36.42 -100, 63.58 -100, 100 0 C 136.42 100, 163.58 100, 200 0 C 236.42 -100, 263.58 -100, 300 0 C 336.42 100, 363.58 100, 400 0 C 436.42 -100, 463.58 -100, 500 0 C 536.42 100, 563.58 100, 600 0 C 636.42 -100, 663.58 -100, 700 0 C 736.42 100, 763.58 100, 800 0" 
                          fill="none" stroke="var(--v-color)" stroke-width="3" />
                </g>
                
                <!-- Current Wave (with phase shift) -->
                <g class="wave-phase-shift">
                    <g class="anim-wave">
                        <path d="M -200 0 C -163.58 -70, -136.42 -70, -100 0 C -63.58 70, -36.42 70, 0 0 C 36.42 -70, 63.58 -70, 100 0 C 136.42 70, 163.58 70, 200 0 C 236.42 -70, 263.58 -70, 300 0 C 336.42 70, 363.58 70, 400 0 C 436.42 -70, 463.58 -70, 500 0 C 536.42 70, 563.58 70, 600 0 C 636.42 -70, 663.58 -70, 700 0 C 736.42 70, 763.58 70, 800 0" 
                              fill="none" stroke="var(--i-color)" stroke-width="2" />
                    </g>
                </g>
            </g>
        </g>

        <!-- ================= LEFT PANEL: PHASORS ================= -->
        <g transform="translate(200, 180)">
            
            <!-- Voltage Phasor Group -->
            <g class="anim-ccw">
                <!-- Phase Arcs (Visible based on state) -->
                <path class="show-L" d="M 25 0 A 25 25 0 0 1 0 25" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-X)" style="color: #adb5bd;" />
                <path class="show-C" d="M 25 0 A 25 25 0 0 0 0 -25" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#arrow-X)" style="color: #adb5bd;" />
                
                <!-- V Arrow -->
                <line x1="0" y1="0" x2="100" y2="0" stroke="var(--v-color)" stroke-width="3" marker-end="url(#arrow-V)" />
                <text x="110" y="5" fill="var(--v-color)" class="math bold" transform="rotate(0) scale(1, -1) scale(1, -1)">V</text>
                
                <!-- V Projection Line -->
                <g transform="translate(100, 0)">
                    <g class="anim-cw">
                        <line x1="0" y1="0" x2="400" y2="0" stroke="var(--v-color)" stroke-width="1.5" stroke-dasharray="4 4" clip-path="url(#proj-clip)" />
                    </g>
                </g>
            </g>

            <!-- Current Phasor Group -->
            <g class="anim-ccw">
                <g class="phase-shift">
                    <!-- I Arrow -->
                    <line x1="0" y1="0" x2="70" y2="0" stroke="var(--i-color)" stroke-width="2" marker-end="url(#arrow-I)" />
                    <text x="80" y="5" fill="var(--i-color)" class="math bold">I</text>
                    
                    <!-- I Projection Line -->
                    <g transform="translate(70, 0)">
                        <g class="inverse-phase-shift">
                            <g class="anim-cw">
                                <line x1="0" y1="0" x2="400" y2="0" stroke="var(--i-color)" stroke-width="1.5" stroke-dasharray="4 4" clip-path="url(#proj-clip)" />
                            </g>
                        </g>
                    </g>
                </g>
            </g>
        </g>

        <!-- ================= BOTTOM LEFT: IMPEDANCE TRIANGLE ================= -->
        <g transform="translate(120, 420)">
            <text x="30" y="-80" class="bold" text-anchor="middle" fill="#6c757d">Impedance</text>
            
            <!-- Z Vector (Hypotenuse) -->
            <line class="tri-z" x1="0" y1="0" x2="60" y2="0" stroke="var(--z-color)" stroke-width="3" marker-end="url(#arrow-Z)" />
            
            <!-- R Vector (Base) -->
            <line x1="0" y1="0" x2="60" y2="0" stroke="var(--r-color)" stroke-width="3" marker-end="url(#arrow-R)" />
            
            <!-- X Vector (Vertical) -->
            <g class="tri-x">
                <line x1="60" y1="0" x2="120" y2="0" stroke-width="3" marker-end="url(#arrow-X)" />
            </g>

            <!-- Triangle Labels -->
            <text x="30" y="20" fill="var(--r-color)" class="math bold" text-anchor="middle">R</text>
            
            <g class="show-L">
                <text x="75" y="-30" fill="var(--l-color)" class="math bold">X_L</text>
                <text x="20" y="-35" fill="var(--z-color)" class="math bold">Z</text>
            </g>
            
            <g class="show-C">
                <text x="75" y="35" fill="var(--c-color)" class="math bold">X_C</text>
                <text x="20" y="45" fill="var(--z-color)" class="math bold">Z</text>
            </g>
            
            <g class="show-R">
                <text x="30" y="-10" fill="var(--z-color)" class="math bold" text-anchor="middle">Z = R</text>
            </g>
        </g>

        <!-- ================= BOTTOM RIGHT: INFO PANEL ================= -->
        <g transform="translate(350, 380)">
            <rect x="0" y="0" width="400" height="90" class="legend-box" />
            
            <!-- Static Text -->
            <text x="20" y="30" class="bold">Phase Difference (φ):</text>
            <text x="20" y="65" class="bold">Opposition to AC:</text>

            <!-- Dynamic Text: Resistor -->
            <g class="show-R">
                <text x="200" y="30" class="math">0° (In Phase)</text>
                <text x="200" y="65" class="math" fill="var(--r-color)">Resistance (R)</text>
                <!-- Resistor Symbol -->
                <path d="M 330 45 L 340 45 L 343 35 L 349 55 L 355 35 L 361 55 L 367 35 L 370 45 L 380 45" fill="none" stroke="var(--r-color)" stroke-width="2" />
            </g>

            <!-- Dynamic Text: Inductor -->
            <g class="show-L">
                <text x="200" y="30" class="math">90° (V leads I)</text>
                <text x="200" y="65" class="math" fill="var(--l-color)">X_L = ωL</text>
                <!-- Inductor Symbol -->
                <path d="M 330 45 L 340 45 A 5 5 0 0 1 350 45 A 5 5 0 0 1 360 45 A 5 5 0 0 1 370 45 L 380 45" fill="none" stroke="var(--l-color)" stroke-width="2" />
            </g>

            <!-- Dynamic Text: Capacitor -->
            <g class="show-C">
                <text x="200" y="30" class="math">-90° (I leads V)</text>
                <text x="200" y="65" class="math" fill="var(--c-color)">X_C = 1 / ωC</text>
                <!-- Capacitor Symbol -->
                <path d="M 330 45 L 350 45 M 350 30 L 350 60 M 360 30 L 360 60 M 360 45 L 380 45" fill="none" stroke="var(--c-color)" stroke-width="2" />
            </g>
        </g>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(620, 20)">
            <rect x="0" y="0" width="160" height="60" class="legend-box" />
            <line x1="10" y1="20" x2="30" y2="20" stroke="var(--v-color)" stroke-width="3" />
            <text x="40" y="24" class="small math">v(t) = V_m sin(ωt)</text>
            
            <line x1="10" y1="40" x2="30" y2="40" stroke="var(--i-color)" stroke-width="2" />
            <text x="40" y="44" class="small math">i(t) = I_m sin(ωt±φ)</text>
        </g>
    </svg>

    <div class="controls">
        <button id="btn-R" class="active-R" onclick="setState('R')">Pure Resistor (R)</button>
        <button id="btn-L" onclick="setState('L')">Pure Inductor (L)</button>
        <button id="btn-C" onclick="setState('C')">Pure Capacitor (C)</button>
    </div>
</div>

<script>
    function setState(state) {
        // Update SVG class for CSS transitions
        const svg = document.getElementById('ac-viz');
        svg.setAttribute('class', 'state-' + state);
        
        // Update button styles
        document.getElementById('btn-R').className = '';
        document.getElementById('btn-L').className = '';
        document.getElementById('btn-C').className = '';
        document.getElementById('btn-' + state).className = 'active-' + state;
    }
</script>

</body>
</html>
