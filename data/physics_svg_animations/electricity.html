<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oersted's Discovery: The Electromagnetic Link</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        /* CSS Animations */
        .current-element {
            animation: fadeInOut 10s ease-in-out infinite;
        }

        .electron-flow {
            stroke-dasharray: 6 26;
            animation: flow 1s linear infinite;
        }

        .field-front {
            stroke-dasharray: 100;
            animation: drawField 10s ease-in-out infinite;
        }

        .field-back {
            animation: fadeFieldBack 10s ease-in-out infinite;
        }

        .compass-needle {
            transform-origin: 0px 0px;
            animation: deflect 10s ease-in-out infinite;
        }

        .pulse-glow {
            animation: pulse 10s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 10% { opacity: 0; }
            30%, 80% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes flow {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: 32; }
        }

        @keyframes drawField {
            0%, 20% { stroke-dashoffset: 100; opacity: 0; }
            21% { opacity: 1; }
            40%, 80% { stroke-dashoffset: 0; opacity: 1; }
            90%, 100% { stroke-dashoffset: 100; opacity: 0; }
        }

        @keyframes fadeFieldBack {
            0%, 20% { opacity: 0; }
            40%, 80% { opacity: 0.25; }
            90%, 100% { opacity: 0; }
        }

        @keyframes deflect {
            0%, 30% { transform: rotate(0deg); }
            50%, 80% { transform: rotate(90deg); }
            90%, 100% { transform: rotate(0deg); }
        }

        @keyframes pulse {
            0%, 40% { filter: drop-shadow(0 0 0px rgba(114,9,183,0)); }
            60%, 70% { filter: drop-shadow(0 0 6px rgba(114,9,183,0.6)); }
            80%, 100% { filter: drop-shadow(0 0 0px rgba(114,9,183,0)); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Oersted's Experiment: Current-Induced Magnetism</title>
        <desc>An animated diagram showing how an electric current generates a magnetic field, deflecting a compass needle according to the Right-Hand Rule.</desc>

        <defs>
            <!-- Arrowhead for Current (I) -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            
            <!-- Arrowhead for Magnetic Field (B) -->
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Arrowhead for RHR Guide -->
            <marker id="arrow-purple-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>
        </defs>

        <!-- Background / Grid (Optional subtle lines) -->
        <rect width="100%" height="100%" fill="#ffffff" rx="12" />
        <line x1="0" y1="250" x2="800" y2="250" stroke="#f0f0f0" stroke-width="1" />
        <line x1="400" y1="0" x2="400" y2="500" stroke="#f0f0f0" stroke-width="1" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#2b2d42">Oersted's Experiment: Current-Induced Magnetism</text>

        <!-- Legend -->
        <g transform="translate(30, 30)">
            <rect x="0" y="0" width="160" height="95" rx="6" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1" />
            <circle cx="15" cy="20" r="5" fill="#06D6A0" />
            <text x="30" y="24" font-family="Inter" font-size="12" fill="#4a4e69">Conventional Current</text>
            
            <circle cx="15" cy="45" r="5" fill="#00B4D8" />
            <text x="30" y="49" font-family="Inter" font-size="12" fill="#4a4e69">Electron Flow</text>
            
            <circle cx="15" cy="70" r="5" fill="#7209B7" />
            <text x="30" y="74" font-family="Inter" font-size="12" fill="#4a4e69">Magnetic Field (B)</text>
        </g>

        <!-- Main Scene Group -->
        <g id="scene">
            
            <!-- Back Magnetic Field Lines (Dashed, drawn behind wire) -->
            <g class="field-back">
                <path d="M 400 310 A 25 60 0 0 0 400 190" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 4" />
                <path d="M 400 360 A 45 110 0 0 0 400 140" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 4" />
                <path d="M 400 430 A 75 180 0 0 0 400 70" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 4" />
            </g>

            <!-- The Conductor (Wire) -->
            <line x1="100" y1="250" x2="700" y2="250" stroke="#4A4E69" stroke-width="12" stroke-linecap="round" />
            
            <!-- Moving Electrons -->
            <g class="current-element">
                <line x1="100" y1="250" x2="700" y2="250" stroke="#00B4D8" stroke-width="4" stroke-linecap="round" class="electron-flow" />
            </g>

            <!-- Front Magnetic Field Lines (Solid, drawn in front of wire) -->
            <!-- Using marker-mid on a 3-point path places the arrow exactly at the equator pointing DOWN -->
            <g class="pulse-glow">
                <path d="M 400 190 A 25 60 0 0 0 375 250 A 25 60 0 0 0 400 310" fill="none" stroke="#7209B7" stroke-width="2.5" pathLength="100" class="field-front" marker-mid="url(#arrow-purple)" />
                <path d="M 400 140 A 45 110 0 0 0 355 250 A 45 110 0 0 0 400 360" fill="none" stroke="#7209B7" stroke-width="2.5" pathLength="100" class="field-front" marker-mid="url(#arrow-purple)" />
                <path d="M 400 70 A 75 180 0 0 0 325 250 A 75 180 0 0 0 400 430" fill="none" stroke="#7209B7" stroke-width="2.5" pathLength="100" class="field-front" marker-mid="url(#arrow-purple)" />
            </g>

            <!-- Compass Assembly -->
            <!-- Positioned below the wire. Initial: North points Right. Deflected: North points Down (aligning with B-field) -->
            <g id="compass" transform="translate(400, 380)">
                <!-- Compass Base -->
                <circle cx="0" cy="0" r="45" fill="#f8f9fa" stroke="#ced4da" stroke-width="2" />
                <text x="0" y="-32" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#adb5bd">W</text>
                <text x="32" y="4" text-anchor="start" font-family="Inter" font-size="10" font-weight="600" fill="#adb5bd">N</text>
                <text x="0" y="40" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#adb5bd">E</text>
                <text x="-32" y="4" text-anchor="end" font-family="Inter" font-size="10" font-weight="600" fill="#adb5bd">S</text>
                
                <!-- Rotating Needle -->
                <g class="compass-needle">
                    <!-- South Pole (Blue) -->
                    <polygon points="0,-6 -35,0 0,6" fill="#4361EE" />
                    <!-- North Pole (Red) -->
                    <polygon points="0,-6 35,0 0,6" fill="#FF3366" />
                    <!-- Pivot -->
                    <circle cx="0" cy="0" r="4" fill="#2b2d42" />
                    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />
                </g>
            </g>

            <!-- Current Vector Label (I) -->
            <g class="current-element">
                <path d="M 180 210 L 280 210" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" />
                <text x="230" y="195" text-anchor="middle" font-family="Roboto Mono" font-size="22" font-weight="700" fill="#06D6A0">I</text>
            </g>

            <!-- Magnetic Field Vector Label (B) -->
            <g class="current-element">
                <text x="460" y="110" font-family="Roboto Mono" font-size="22" font-weight="700" fill="#7209B7">B</text>
                <path d="M 460 88 L 475 88" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple-small)" />
            </g>

        </g>

        <!-- Right-Hand Rule Guide -->
        <g id="rhr-guide" transform="translate(30, 370)">
            <rect x="0" y="0" width="130" height="100" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <text x="65" y="20" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#4a4e69">Right-Hand Rule</text>
            
            <g transform="translate(35, 45)">
                <!-- Hand base -->
                <circle cx="20" cy="25" r="14" fill="#FFD6BA" />
                <!-- Thumb -->
                <path d="M 20 15 L 45 15" stroke="#FFD6BA" stroke-width="10" stroke-linecap="round" />
                <!-- Thumb Arrow (I) -->
                <path d="M 20 15 L 60 15" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <!-- Curling Fingers -->
                <path d="M 32 25 A 10 10 0 1 1 32 45" stroke="#FFD6BA" stroke-width="7" fill="none" stroke-linecap="round" />
                <!-- Curl Arrow (B) -->
                <path d="M 32 20 C 50 20, 50 50, 32 50" stroke="#7209B7" stroke-width="2" fill="none" marker-end="url(#arrow-purple-small)" />
            </g>
        </g>

        <!-- Formula Box -->
        <g id="formula" transform="translate(600, 380)">
            <rect x="0" y="0" width="170" height="90" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <text x="20" y="52" font-family="Roboto Mono" font-size="20" fill="#2b2d42">B = </text>
            <text x="75" y="38" font-family="Roboto Mono" font-size="18" fill="#2b2d42">μ<tspan font-size="12" dy="5">0</tspan><tspan font-size="18" dy="-5">I</tspan></text>
            <line x1="70" y1="48" x2="115" y2="48" stroke="#2b2d42" stroke-width="2" />
            <text x="75" y="68" font-family="Roboto Mono" font-size="18" fill="#2b2d42">2πr</text>
        </g>

    </svg>
</div>

</body>
</html>
