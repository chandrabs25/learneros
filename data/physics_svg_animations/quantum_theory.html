<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Stability Paradox of the Atom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .text-title { font-size: 24px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .text-subtitle { font-size: 16px; font-weight: 600; text-anchor: middle; }
        .text-math { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .text-legend { font-size: 10px; fill: #6c757d; text-anchor: middle; }
        .text-small { font-size: 10px; font-family: 'Roboto Mono', monospace; fill: #495057; text-anchor: middle; }
        
        .box-bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; rx: 6px; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Quantum Revolution: Atomic Stability</title>
        <desc>An animated comparison between the unstable classical atom, which spirals into the nucleus while emitting continuous radiation, and the stable Bohr model, which features quantized orbits and discrete photon emission.</desc>

        <defs>
            <!-- Glow Filters -->
            <filter id="glow-gold" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
            <filter id="glow-orange" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>

            <!-- EM Wave Paths (Classical) -->
            <path id="wave-long" d="M0,0 Q10,-10 20,0 T40,0 T60,0 T80,0" fill="none" stroke="#F77F00" stroke-width="2" filter="url(#glow-orange)"/>
            <path id="wave-med" d="M0,0 Q7.5,-7.5 15,0 T30,0 T45,0 T60,0" fill="none" stroke="#F77F00" stroke-width="2" filter="url(#glow-orange)"/>
            <path id="wave-short" d="M0,0 Q5,-5 10,0 T20,0 T30,0 T40,0" fill="none" stroke="#F77F00" stroke-width="2" filter="url(#glow-orange)"/>
            <path id="wave-micro" d="M0,0 Q3,-3 6,0 T12,0 T18,0 T24,0" fill="none" stroke="#F77F00" stroke-width="2" filter="url(#glow-orange)"/>

            <!-- Photon Wave Packet (Bohr) -->
            <path id="photon-wave" d="M0,0 Q5,-10 10,0 T20,0 T30,0 T40,0 L35,-5 M40,0 L35,5" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow-orange)"/>
        </defs>

        <!-- Background Elements -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        <line x1="400" y1="70" x2="400" y2="440" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6 6" />

        <!-- Titles -->
        <text x="400" y="40" class="text-title">The Quantum Revolution: Atomic Stability</text>
        <text x="200" y="460" class="text-subtitle" fill="#FF3366">Classical Theory: Continuous Collapse</text>
        <text x="600" y="460" class="text-subtitle" fill="#06D6A0">Bohr Model: Quantized Orbits</text>

        <!-- Center Formula Box -->
        <rect x="340" y="230" width="120" height="40" class="box-bg" />
        <text x="400" y="255" class="text-math" font-size="16" fill="#7209B7" text-anchor="middle">L = nℏ</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: CLASSICAL COLLAPSE             -->
        <!-- ========================================== -->
        <g id="classical-panel">
            <!-- Spiral Path -->
            <path d="M 200 150 A 95 95 0 0 1 200 340 A 85 85 0 0 1 200 170 A 75 75 0 0 1 200 320 A 65 65 0 0 1 200 190 A 55 55 0 0 1 200 300 A 45 45 0 0 1 200 210 A 35 35 0 0 1 200 280 A 25 25 0 0 1 200 230 A 15 15 0 0 1 200 260 A 5 5 0 0 1 200 250" fill="none" stroke="#ced4da" stroke-width="1" />

            <!-- Nucleus -->
            <circle cx="200" cy="250" r="12" fill="#FFD700" filter="url(#glow-gold)" />
            <text x="200" y="254" class="text-math" font-size="12" fill="#212529" text-anchor="middle">+Ze</text>

            <!-- Continuous Radiation Emitters -->
            <!-- Wave 1 (Long, Low Freq) -->
            <g transform="translate(200, 340) rotate(90)">
                <use href="#wave-long" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.15; 0.16; 0.35; 1" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0" keyTimes="0; 0.15; 0.35; 1" dur="5s" repeatCount="indefinite"/>
                </use>
            </g>
            <!-- Wave 2 (Medium Freq) -->
            <g transform="translate(200, 170) rotate(-90)">
                <use href="#wave-med" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.35; 0.36; 0.55; 1" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0" keyTimes="0; 0.35; 0.55; 1" dur="5s" repeatCount="indefinite"/>
                </use>
            </g>
            <!-- Wave 3 (Short Freq) -->
            <g transform="translate(200, 320) rotate(90)">
                <use href="#wave-short" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.55; 0.56; 0.75; 1" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0" keyTimes="0; 0.55; 0.75; 1" dur="5s" repeatCount="indefinite"/>
                </use>
            </g>
            <!-- Wave 4 (Micro Freq) -->
            <g transform="translate(200, 190) rotate(-90)">
                <use href="#wave-micro" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.75; 0.76; 0.85; 1" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0" keyTimes="0; 0.75; 0.85; 1" dur="5s" repeatCount="indefinite"/>
                </use>
            </g>
            <!-- Wave 5 (Micro Freq, Final) -->
            <g transform="translate(200, 280) rotate(90)">
                <use href="#wave-micro" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.85; 0.86; 0.95; 1" dur="5s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 50,0; 50,0" keyTimes="0; 0.85; 0.95; 1" dur="5s" repeatCount="indefinite"/>
                </use>
            </g>

            <!-- Spiraling Electron -->
            <g>
                <animateMotion dur="5s" repeatCount="indefinite" path="M 200 150 A 95 95 0 0 1 200 340 A 85 85 0 0 1 200 170 A 75 75 0 0 1 200 320 A 65 65 0 0 1 200 190 A 55 55 0 0 1 200 300 A 45 45 0 0 1 200 210 A 35 35 0 0 1 200 280 A 25 25 0 0 1 200 230 A 15 15 0 0 1 200 260 A 5 5 0 0 1 200 250" keyPoints="0; 0.2; 0.4; 0.6; 0.8; 1; 1" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" calcMode="linear" rotate="auto" />
                
                <!-- Electron Particle -->
                <circle cx="0" cy="0" r="6" fill="#4361EE" />
                <text x="0" y="-10" class="text-math" font-size="10" fill="#4361EE" text-anchor="middle">e⁻</text>

                <!-- Velocity Vector (Green, +X axis) -->
                <line x1="0" y1="0" x2="15" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)">
                    <animate attributeName="x2" values="15; 20; 30; 45; 60; 0; 0" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" dur="5s" repeatCount="indefinite" />
                </line>
                
                <!-- Force Vector (Red, +Y axis pointing to center) -->
                <line x1="0" y1="0" x2="0" y2="10" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)">
                    <animate attributeName="y2" values="10; 15; 25; 40; 60; 0; 0" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" dur="5s" repeatCount="indefinite" />
                </line>
            </g>

            <!-- Collision Flash -->
            <circle cx="200" cy="250" r="0" fill="#FF3366" opacity="0">
                <animate attributeName="r" values="0; 0; 60; 0" keyTimes="0; 0.88; 0.92; 1" dur="5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0; 0.8; 0" keyTimes="0; 0.88; 0.92; 1" dur="5s" repeatCount="indefinite"/>
            </circle>

            <!-- Energy Bar Chart (Classical) -->
            <rect x="30" y="260" width="70" height="150" class="box-bg" />
            <text x="65" y="275" class="text-small">Energy</text>
            <line x1="30" y1="370" x2="100" y2="370" stroke="#dee2e6" stroke-width="1" />
            
            <!-- Kinetic (Red) -->
            <rect x="40" y="370" width="12" height="10" fill="#FF3366" transform="scale(1,-1) translate(0, -740)">
                <animate attributeName="height" values="10; 15; 25; 40; 60; 0; 0" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" dur="5s" repeatCount="indefinite" />
            </rect>
            <text x="46" y="400" class="text-small">K</text>

            <!-- Potential (Blue) -->
            <rect x="58" y="370" width="12" height="20" fill="#4361EE">
                <animate attributeName="height" values="20; 30; 50; 80; 120; 0; 0" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" dur="5s" repeatCount="indefinite" />
            </rect>
            <text x="64" y="400" class="text-small">U</text>

            <!-- Total (Green) -->
            <rect x="76" y="370" width="12" height="10" fill="#06D6A0">
                <animate attributeName="height" values="10; 15; 25; 40; 60; 0; 0" keyTimes="0; 0.3; 0.55; 0.75; 0.85; 0.9; 1" dur="5s" repeatCount="indefinite" />
            </rect>
            <text x="82" y="400" class="text-small">E</text>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT PANEL: BOHR MODEL                    -->
        <!-- ========================================== -->
        <g id="bohr-panel">
            <!-- Quantized Orbits -->
            <circle cx="600" cy="250" r="40" fill="none" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="4 4" />
            <circle cx="600" cy="250" r="80" fill="none" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="4 4" />
            <circle cx="600" cy="250" r="120" fill="none" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="4 4" />
            
            <text x="600" y="205" class="text-math" font-size="10" fill="#06D6A0" text-anchor="middle">n=1</text>
            <text x="600" y="165" class="text-math" font-size="10" fill="#06D6A0" text-anchor="middle">n=2</text>
            <text x="600" y="125" class="text-math" font-size="10" fill="#06D6A0" text-anchor="middle">n=3</text>

            <!-- Nucleus -->
            <circle cx="600" cy="250" r="12" fill="#FFD700" filter="url(#glow-gold)" />
            <text x="600" y="254" class="text-math" font-size="12" fill="#212529" text-anchor="middle">+Ze</text>

            <!-- Photon Emission (Downward Transition at 7s) -->
            <g transform="translate(600, 250) rotate(-30)">
                <use href="#photon-wave" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.7; 0.71; 0.8; 1" dur="10s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="0,0; 0,0; 120,0; 120,0" keyTimes="0; 0.7; 0.8; 1" dur="10s" repeatCount="indefinite"/>
                </use>
            </g>
            <text x="700" y="180" class="text-math" font-size="12" fill="#F77F00" opacity="0">
                ΔE = E₂ - E₁
                <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.7; 0.75; 0.85; 1" dur="10s" repeatCount="indefinite"/>
            </text>

            <!-- Photon Absorption (Upward Transition at 9s) -->
            <g transform="translate(600, 250) rotate(150)">
                <use href="#photon-wave" opacity="0">
                    <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.8; 0.81; 0.9; 1" dur="10s" repeatCount="indefinite"/>
                    <animateTransform attributeName="transform" type="translate" values="120,0; 120,0; 0,0; 0,0" keyTimes="0; 0.8; 0.9; 1" dur="10s" repeatCount="indefinite"/>
                </use>
            </g>
            <text x="480" y="320" class="text-math" font-size="12" fill="#F77F00" opacity="0">
                E = hν
                <animate attributeName="opacity" values="0; 0; 1; 0; 0" keyTimes="0; 0.8; 0.85; 0.95; 1" dur="10s" repeatCount="indefinite"/>
            </text>

            <!-- Orbiting Electron -->
            <g transform="translate(600, 250)">
                <!-- Continuous Rotation -->
                <animateTransform attributeName="transform" type="rotate" values="0; 360" keyTimes="0; 1" dur="4s" repeatCount="indefinite"/>
                
                <g>
                    <!-- Instantaneous Quantum Jumps -->
                    <animateTransform attributeName="transform" type="translate" values="0,-80; 0,-80; 0,-40; 0,-40; 0,-80; 0,-80" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite"/>
                    
                    <!-- Electron Particle -->
                    <circle cx="0" cy="0" r="6" fill="#4361EE" />
                    <text x="0" y="-10" class="text-math" font-size="10" fill="#4361EE" text-anchor="middle">e⁻</text>

                    <!-- Velocity Vector (Green, Tangential +X) -->
                    <line x1="0" y1="0" x2="20" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)">
                        <animate attributeName="x2" values="20; 20; 40; 40; 20; 20" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite"/>
                    </line>
                    
                    <!-- Force Vector (Red, Radial +Y towards center) -->
                    <line x1="0" y1="0" x2="0" y2="15" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)">
                        <animate attributeName="y2" values="15; 15; 60; 60; 15; 15" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite"/>
                    </line>
                </g>
            </g>

            <!-- Energy Bar Chart (Bohr) -->
            <rect x="700" y="260" width="70" height="150" class="box-bg" />
            <text x="735" y="275" class="text-small">Energy</text>
            <line x1="700" y1="370" x2="770" y2="370" stroke="#dee2e6" stroke-width="1" />
            
            <!-- Kinetic (Red) -->
            <rect x="710" y="370" width="12" height="15" fill="#FF3366" transform="scale(1,-1) translate(0, -740)">
                <animate attributeName="height" values="15; 15; 60; 60; 15; 15" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite" />
            </rect>
            <text x="716" y="400" class="text-small">K</text>

            <!-- Potential (Blue) -->
            <rect x="728" y="370" width="12" height="30" fill="#4361EE">
                <animate attributeName="height" values="30; 30; 120; 120; 30; 30" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite" />
            </rect>
            <text x="734" y="400" class="text-small">U</text>

            <!-- Total (Green) -->
            <rect x="746" y="370" width="12" height="15" fill="#06D6A0">
                <animate attributeName="height" values="15; 15; 60; 60; 15; 15" keyTimes="0; 0.7; 0.7001; 0.9; 0.9001; 1" dur="10s" repeatCount="indefinite" />
            </rect>
            <text x="752" y="400" class="text-small">E</text>
        </g>

        <!-- Global Legend -->
        <text x="400" y="485" class="text-legend">
            Vectors: <tspan fill="#06D6A0" font-weight="bold">Velocity (v)</tspan>, <tspan fill="#FF3366" font-weight="bold">Force (F)</tspan> | 
            Energy Bars: <tspan fill="#FF3366" font-weight="bold">Kinetic (K)</tspan>, <tspan fill="#4361EE" font-weight="bold">Potential (U)</tspan>, <tspan fill="#06D6A0" font-weight="bold">Total (E)</tspan>
        </text>

    </svg>
</div>

</body>
</html>
