<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rigid Body vs. Real Body Physics Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6C757D;
            --force-color: #FF3366;
            --rigid-body: #ADB5BD;
            --real-body: #6C757D;
            --particle: #495057;
            --bond-rigid: #DEE2E6;
            --bond-elastic: #00B4D8;
            --divider: #CED4DA;
            --anim-duration: 8s;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background-color: var(--bg-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animation Play State Control */
        * {
            animation-play-state: var(--play-state, running) !important;
        }

        /* --- Keyframes --- */

        /* Rigid Body Translation */
        @keyframes rigid-translate {
            0%, 12.5% { transform: translateX(0); }
            37.5%, 62.5% { transform: translateX(40px); }
            87.5%, 100% { transform: translateX(0); }
        }

        /* Real Body Elastic Deformation (Columns) */
        @keyframes real-c1 {
            0%, 12.5% { transform: translateX(0); }
            25% { transform: translateX(0px); }
            37.5%, 62.5% { transform: translateX(10px); }
            68% { transform: translateX(-2px); }
            75% { transform: translateX(1px); }
            87.5%, 100% { transform: translateX(0); }
        }

        @keyframes real-c2 {
            0%, 12.5% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            37.5%, 62.5% { transform: translateX(20px); }
            68% { transform: translateX(-5px); }
            75% { transform: translateX(2px); }
            87.5%, 100% { transform: translateX(0); }
        }

        @keyframes real-c3 {
            0%, 12.5% { transform: translateX(0); }
            25% { transform: translateX(15px); }
            37.5%, 62.5% { transform: translateX(30px); }
            68% { transform: translateX(-8px); }
            75% { transform: translateX(4px); }
            87.5%, 100% { transform: translateX(0); }
        }

        @keyframes real-c4 {
            0%, 12.5% { transform: translateX(0); }
            25% { transform: translateX(25px); }
            37.5%, 62.5% { transform: translateX(40px); }
            68% { transform: translateX(-10px); }
            75% { transform: translateX(5px); }
            87.5%, 100% { transform: translateX(0); }
        }

        /* Real Body Springs Scaling */
        @keyframes real-springs {
            0%, 12.5% { transform: translateX(0) scaleX(1); }
            25% { transform: translateX(0px) scaleX(1.208); }
            37.5%, 62.5% { transform: translateX(10px) scaleX(1.25); }
            68% { transform: translateX(-2px) scaleX(0.933); }
            75% { transform: translateX(1px) scaleX(1.033); }
            87.5%, 100% { transform: translateX(0) scaleX(1); }
        }

        /* Real Body Background Scaling */
        @keyframes real-bg {
            0%, 12.5% { transform: translateX(0) scaleX(1); }
            25% { transform: translateX(0px) scaleX(1.156); }
            37.5%, 62.5% { transform: translateX(10px) scaleX(1.1875); }
            68% { transform: translateX(-2px) scaleX(0.95); }
            75% { transform: translateX(1px) scaleX(1.025); }
            87.5%, 100% { transform: translateX(0) scaleX(1); }
        }

        /* Force Arrows */
        @keyframes force-arrow-anim {
            0%, 10% { opacity: 0; transform: scaleX(0.1); }
            15%, 60% { opacity: 1; transform: scaleX(1); }
            65%, 100% { opacity: 0; transform: scaleX(0.1); }
        }

        /* Delta L Indicator */
        @keyframes fade-in-out {
            0%, 25% { opacity: 0; }
            37.5%, 62.5% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        /* Status Texts */
        @keyframes status-1 {
            0%, 10%, 90%, 100% { opacity: 1; }
            12.5%, 87.5% { opacity: 0; }
        }
        @keyframes status-2 {
            12.5%, 35% { opacity: 1; }
            0%, 10%, 37.5%, 100% { opacity: 0; }
        }
        @keyframes status-3 {
            37.5%, 60% { opacity: 1; }
            0%, 35%, 62.5%, 100% { opacity: 0; }
        }
        @keyframes status-4 {
            62.5%, 87.5% { opacity: 1; }
            0%, 60%, 90%, 100% { opacity: 0; }
        }

        /* Apply Animations */
        .anim-rigid { animation: rigid-translate var(--anim-duration) ease-in-out infinite; }
        .anim-real-c1 { animation: real-c1 var(--anim-duration) ease-in-out infinite; }
        .anim-real-c2 { animation: real-c2 var(--anim-duration) ease-in-out infinite; }
        .anim-real-c3 { animation: real-c3 var(--anim-duration) ease-in-out infinite; }
        .anim-real-c4 { animation: real-c4 var(--anim-duration) ease-in-out infinite; }
        .anim-real-springs { animation: real-springs var(--anim-duration) ease-in-out infinite; }
        .anim-real-bg { animation: real-bg var(--anim-duration) ease-in-out infinite; }
        .anim-force { animation: force-arrow-anim var(--anim-duration) ease-in-out infinite; }
        .anim-fade { animation: fade-in-out var(--anim-duration) ease-in-out infinite; }
        
        .s1 { animation: status-1 var(--anim-duration) ease-in-out infinite; }
        .s2 { animation: status-2 var(--anim-duration) ease-in-out infinite; }
        .s3 { animation: status-3 var(--anim-duration) ease-in-out infinite; }
        .s4 { animation: status-4 var(--anim-duration) ease-in-out infinite; }

        /* Controls */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        button {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #495057;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="playPauseBtn">Pause</button>
    </div>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Force Vectors -->
            <marker id="arrow-force" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <!-- Arrowhead for Dimension Lines -->
            <marker id="arrow-dim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#495057" />
            </marker>
            <marker id="arrow-dim-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 10 2 L 2 5 L 10 8 z" fill="#495057" />
            </marker>
        </defs>

        <!-- Background & Layout -->
        <rect width="800" height="500" fill="#f8f9fa" />
        <line x1="400" y1="80" x2="400" y2="420" stroke="#CED4DA" stroke-width="2" stroke-dasharray="6,6" />
        
        <!-- Ground Lines -->
        <line x1="40" y1="290" x2="360" y2="290" stroke="#DEE2E6" stroke-width="4" stroke-linecap="round"/>
        <line x1="440" y1="290" x2="760" y2="290" stroke="#DEE2E6" stroke-width="4" stroke-linecap="round"/>

        <!-- Titles -->
        <text x="400" y="45" font-size="24" font-weight="700" fill="#212529" text-anchor="middle">Rigid Body vs. Real Body</text>
        <text x="200" y="85" font-size="18" font-weight="600" fill="#495057" text-anchor="middle">Ideal Rigid Body</text>
        <text x="600" y="85" font-size="18" font-weight="600" fill="#495057" text-anchor="middle">Real (Elastic) Body</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: IDEAL RIGID BODY               -->
        <!-- ========================================== -->
        <g class="anim-rigid">
            <!-- Body Background -->
            <rect x="100" y="170" width="160" height="120" rx="8" fill="#ADB5BD" stroke="#495057" stroke-width="2" />
            
            <!-- Rigid Bonds (Horizontal) -->
            <path d="M 120 190 L 240 190 M 120 230 L 240 230 M 120 270 L 240 270" stroke="#DEE2E6" stroke-width="2" />
            <!-- Rigid Bonds (Vertical) -->
            <path d="M 120 190 L 120 270 M 160 190 L 160 270 M 200 190 L 200 270 M 240 190 L 240 270" stroke="#DEE2E6" stroke-width="2" />

            <!-- Particles -->
            <g fill="#495057">
                <!-- Col 1 -->
                <circle cx="120" cy="190" r="4"/><circle cx="120" cy="230" r="4"/><circle cx="120" cy="270" r="4"/>
                <!-- Col 2 -->
                <circle cx="160" cy="190" r="4"/><circle cx="160" cy="230" r="4"/><circle cx="160" cy="270" r="4"/>
                <!-- Col 3 -->
                <circle cx="200" cy="190" r="4"/><circle cx="200" cy="230" r="4"/><circle cx="200" cy="270" r="4"/>
                <!-- Col 4 -->
                <circle cx="240" cy="190" r="4"/><circle cx="240" cy="230" r="4"/><circle cx="240" cy="270" r="4"/>
            </g>

            <!-- Internal Distance Marker -->
            <line x1="160" y1="178" x2="200" y2="178" stroke="#495057" stroke-width="1.5" marker-start="url(#arrow-dim-start)" marker-end="url(#arrow-dim)" />
            <text x="180" y="170" font-size="12" class="math" fill="#212529" text-anchor="middle">d</text>

            <!-- Applied Force Vector -->
            <path class="anim-force" style="transform-origin: 40px 230px;" d="M 40 230 L 95 230" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-force)" />
            <text x="65" y="220" font-size="16" font-weight="600" class="math anim-force" style="transform-origin: 40px 230px;" fill="#FF3366" text-anchor="middle">F<tspan baseline-shift="sub" font-size="0.7em">ext</tspan></text>
        </g>

        <!-- Rigid Body Math Label -->
        <text x="200" y="340" font-size="16" class="math" fill="#212529" text-anchor="middle">r<tspan baseline-shift="sub" font-size="0.7em">ij</tspan> = const</text>
        <text x="200" y="365" font-size="13" fill="#6C757D" text-anchor="middle">No internal deformation</text>


        <!-- ========================================== -->
        <!-- RIGHT PANEL: REAL (ELASTIC) BODY           -->
        <!-- ========================================== -->
        
        <!-- Elastic Body Background -->
        <rect class="anim-real-bg" style="transform-origin: 500px 230px;" x="500" y="170" width="160" height="120" rx="8" fill="#6C757D" stroke="#495057" stroke-width="2" vector-effect="non-scaling-stroke" />

        <!-- Horizontal Elastic Springs -->
        <g class="anim-real-springs" style="transform-origin: 520px 230px;" stroke="#00B4D8" stroke-width="1.5" fill="none" vector-effect="non-scaling-stroke">
            <path d="M 520 190 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5" />
            <path d="M 520 230 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5" />
            <path d="M 520 270 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5 l 4 -5 l 8 10 l 8 -10 l 8 10 l 8 -10 l 4 5" />
        </g>

        <!-- Column 1 (Trailing Edge) -->
        <g class="anim-real-c1">
            <path d="M 520 190 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4" stroke="#00B4D8" stroke-width="1.5" fill="none" />
            <circle cx="520" cy="190" r="4" fill="#495057"/><circle cx="520" cy="230" r="4" fill="#495057"/><circle cx="520" cy="270" r="4" fill="#495057"/>
            
            <!-- Applied Force Vector (Moves with Col 1) -->
            <path class="anim-force" style="transform-origin: 440px 230px;" d="M 440 230 L 495 230" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-force)" />
            <text x="465" y="220" font-size="16" font-weight="600" class="math anim-force" style="transform-origin: 440px 230px;" fill="#FF3366" text-anchor="middle">F<tspan baseline-shift="sub" font-size="0.7em">ext</tspan></text>
        </g>

        <!-- Column 2 -->
        <g class="anim-real-c2">
            <path d="M 560 190 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4" stroke="#00B4D8" stroke-width="1.5" fill="none" />
            <circle cx="560" cy="190" r="4" fill="#495057"/><circle cx="560" cy="230" r="4" fill="#495057"/><circle cx="560" cy="270" r="4" fill="#495057"/>
        </g>

        <!-- Column 3 -->
        <g class="anim-real-c3">
            <path d="M 600 190 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4" stroke="#00B4D8" stroke-width="1.5" fill="none" />
            <circle cx="600" cy="190" r="4" fill="#495057"/><circle cx="600" cy="230" r="4" fill="#495057"/><circle cx="600" cy="270" r="4" fill="#495057"/>
        </g>

        <!-- Column 4 (Leading Edge) -->
        <g class="anim-real-c4">
            <path d="M 640 190 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4 l -5 4 l 10 8 l -10 8 l 10 8 l -10 8 l 5 4" stroke="#00B4D8" stroke-width="1.5" fill="none" />
            <circle cx="640" cy="190" r="4" fill="#495057"/><circle cx="640" cy="230" r="4" fill="#495057"/><circle cx="640" cy="270" r="4" fill="#495057"/>
        </g>

        <!-- Deformation Indicators -->
        <line x1="660" y1="160" x2="660" y2="330" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="4,4" />
        <g class="anim-fade">
            <line x1="660" y1="315" x2="695" y2="315" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-force)" />
            <text x="680" y="305" font-size="14" font-weight="600" class="math" fill="#FF3366" text-anchor="middle">ΔL</text>
        </g>

        <!-- Real Body Math Label -->
        <text x="600" y="340" font-size="16" class="math" fill="#212529" text-anchor="middle">r<tspan baseline-shift="sub" font-size="0.7em">ij</tspan> ≠ const</text>
        <text x="600" y="365" font-size="13" fill="#6C757D" text-anchor="middle">Strain and elastic recovery</text>


        <!-- ========================================== -->
        <!-- UI ELEMENTS: LEGEND & STATUS               -->
        <!-- ========================================== -->
        
        <!-- Legend -->
        <rect x="20" y="410" width="140" height="75" rx="6" fill="#ffffff" stroke="#DEE2E6" stroke-width="1.5" />
        <line x1="30" y1="428" x2="55" y2="428" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-force)" />
        <text x="68" y="432" font-size="12" fill="#495057">Applied Force</text>
        
        <path d="M 30 450 l 3 -4 l 6 8 l 6 -8 l 6 8 l 4 -4" stroke="#00B4D8" stroke-width="1.5" fill="none" />
        <text x="68" y="454" font-size="12" fill="#495057">Elastic Bond</text>
        
        <line x1="30" y1="472" x2="55" y2="472" stroke="#DEE2E6" stroke-width="2" />
        <text x="68" y="476" font-size="12" fill="#495057">Rigid Bond</text>

        <!-- Status Indicator -->
        <rect x="300" y="435" width="200" height="36" rx="18" fill="#E9ECEF" stroke="#CED4DA" stroke-width="1" />
        <text x="400" y="458" font-size="14" font-weight="600" fill="#495057" text-anchor="middle" class="s1">System at Rest</text>
        <text x="400" y="458" font-size="14" font-weight="600" fill="#FF3366" text-anchor="middle" class="s2">Applying Stress...</text>
        <text x="400" y="458" font-size="14" font-weight="600" fill="#7209B7" text-anchor="middle" class="s3">Strain Observed</text>
        <text x="400" y="458" font-size="14" font-weight="600" fill="#06D6A0" text-anchor="middle" class="s4">Elastic Recovery</text>

    </svg>
</div>

<script>
    const btn = document.getElementById('playPauseBtn');
    let isPlaying = true;

    btn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        document.documentElement.style.setProperty('--play-state', isPlaying ? 'running' : 'paused');
        btn.textContent = isPlaying ? 'Pause' : 'Play';
        btn.style.backgroundColor = isPlaying ? '#212529' : '#FF3366';
    });
</script>

</body>
</html>
