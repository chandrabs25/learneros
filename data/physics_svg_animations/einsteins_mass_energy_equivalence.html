<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass-Energy Equivalence: The Mass Defect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #animation-container {
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 8 / 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Pause on hover */
        svg:hover * {
            animation-play-state: paused !important;
        }

        .hover-text {
            font-size: 12px;
            fill: #adb5bd;
            font-weight: 600;
            opacity: 0.7;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2b2d42; text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #6c757d; text-anchor: middle; }
        .math { font-family: 'Roboto Mono', monospace; }
        .formula-large { font-size: 32px; font-weight: 700; fill: #F77F00; text-anchor: middle; }
        .label { font-size: 14px; font-weight: 600; fill: #495057; text-anchor: middle; }
        .legend-text { font-size: 13px; fill: #495057; alignment-baseline: middle; }

        /* Keyframes */
        @keyframes beam-rotate {
            0%, 20% { transform: rotate(-8deg); }
            25%, 50% { transform: rotate(0deg); }
            55%, 90% { transform: rotate(-4deg); }
            95%, 100% { transform: rotate(-8deg); }
        }

        @keyframes counter-rotate {
            0%, 20% { transform: rotate(8deg); }
            25%, 50% { transform: rotate(0deg); }
            55%, 90% { transform: rotate(4deg); }
            95%, 100% { transform: rotate(8deg); }
        }

        @keyframes set-a-opacity {
            0%, 24.9% { opacity: 1; }
            25%, 47.9% { opacity: 0; }
            48%, 90% { opacity: 0.3; }
            95%, 100% { opacity: 1; }
        }

        @keyframes ghost-label-anim {
            0%, 47.9% { opacity: 0; }
            48%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes set-b-opacity {
            0%, 24.9% { opacity: 0; }
            25%, 47.9% { opacity: 1; }
            48%, 100% { opacity: 0; }
        }

        @keyframes set-c-opacity {
            0%, 47.9% { opacity: 0; }
            48%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes set-b-move {
            0%, 24.9% { transform: translate(200px, 368px); }
            25% { transform: translate(200px, 368px); }
            32%, 40% { transform: translate(400px, 150px); }
            48%, 100% { transform: translate(600px, 368px); }
        }

        @keyframes nucleon-snap-p1 {
            0%, 32% { transform: translate(-14px, -12px); }
            35%, 100% { transform: translate(-10px, -10px); }
        }
        @keyframes nucleon-snap-n1 {
            0%, 32% { transform: translate(14px, -12px); }
            35%, 100% { transform: translate(10px, -10px); }
        }
        @keyframes nucleon-snap-n2 {
            0%, 32% { transform: translate(-14px, -36px); }
            35%, 100% { transform: translate(-10px, 14px); }
        }
        @keyframes nucleon-snap-p2 {
            0%, 32% { transform: translate(14px, -36px); }
            35%, 100% { transform: translate(10px, 14px); }
        }

        @keyframes flash-anim {
            0%, 34% { opacity: 0; transform: scale(0); }
            35% { opacity: 1; transform: scale(1.5); }
            40%, 100% { opacity: 0; transform: scale(2.5); }
        }

        @keyframes mass-defect-fade {
            0%, 55% { opacity: 0; transform: translateY(0) scale(1); }
            56%, 60% { opacity: 0.9; transform: translateY(-15px) scale(1.2); }
            65%, 100% { opacity: 0; transform: translateY(-40px) scale(0); }
        }

        @keyframes energy-wave-anim {
            0%, 60% { stroke-dashoffset: 160; opacity: 0; }
            61% { opacity: 1; }
            75% { stroke-dashoffset: 0; opacity: 1; }
            85%, 100% { stroke-dashoffset: -160; opacity: 0; }
        }

        @keyframes formula-anim {
            0%, 60% { opacity: 0; transform: translateY(20px); }
            65%, 85% { opacity: 1; transform: translateY(0); text-shadow: 0 0 15px rgba(247,127,0,0.5); }
            90%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Apply Animations */
        .beam-group { animation: beam-rotate 12s infinite ease-in-out; transform-origin: 400px 300px; }
        .tray-group { animation: counter-rotate 12s infinite ease-in-out; }
        .left-tray { transform-origin: 200px 300px; }
        .right-tray { transform-origin: 600px 300px; }
        
        .set-a { animation: set-a-opacity 12s infinite ease-in-out; }
        .ghost-label { animation: ghost-label-anim 12s infinite ease-in-out; }
        .set-b { animation: set-b-opacity 12s infinite ease-in-out, set-b-move 12s infinite ease-in-out; }
        .set-c { animation: set-c-opacity 12s infinite ease-in-out; }
        
        .b-p1 { animation: nucleon-snap-p1 12s infinite ease-in-out; }
        .b-n1 { animation: nucleon-snap-n1 12s infinite ease-in-out; }
        .b-n2 { animation: nucleon-snap-n2 12s infinite ease-in-out; }
        .b-p2 { animation: nucleon-snap-p2 12s infinite ease-in-out; }

        .flash { animation: flash-anim 12s infinite ease-out; transform-origin: 400px 150px; }
        .mass-defect { animation: mass-defect-fade 12s infinite ease-in-out; transform-origin: 0px 0px; }
        
        .wave { 
            stroke-dasharray: 160; 
            animation: energy-wave-anim 12s infinite linear; 
        }
        
        .formula-container { animation: formula-anim 12s infinite ease-in-out; transform-origin: 600px 120px; }

    </style>
</head>
<body>

<div id="animation-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Mass-Energy Equivalence and Mass Defect</title>
        <desc>Animation showing 4 individual nucleons fusing into a Helium-4 nucleus. The assembled nucleus is lighter than the sum of its parts, and the missing mass (mass defect) is converted into energy according to E=mc².</desc>

        <defs>
            <!-- Gradients -->
            <radialGradient id="grad-proton" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ff8fa3" />
                <stop offset="100%" stop-color="#FF3366" />
            </radialGradient>
            
            <radialGradient id="grad-neutron" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#8093f1" />
                <stop offset="100%" stop-color="#4361EE" />
            </radialGradient>

            <linearGradient id="grad-energy" x1="0%" y1="100%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#FFD166" />
                <stop offset="100%" stop-color="#F77F00" />
            </linearGradient>

            <radialGradient id="grad-flash" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
                <stop offset="40%" stop-color="#FFD166" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#F77F00" stop-opacity="0" />
            </radialGradient>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
            </filter>

            <!-- Particle Templates -->
            <g id="proton">
                <circle r="12" fill="url(#grad-proton)" filter="url(#shadow)"/>
                <path d="M-5,0 L5,0 M0,-5 L0,5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <g id="neutron">
                <circle r="12" fill="url(#grad-neutron)" filter="url(#shadow)"/>
            </g>
        </defs>

        <!-- Static Background Elements -->
        <text x="400" y="40" class="title">Mass-Energy Equivalence: The Mass Defect</text>
        <text x="400" y="65" class="subtitle">Fusing nucleons releases energy because the assembled nucleus is lighter than its parts.</text>
        <text x="780" y="30" class="hover-text" text-anchor="end">Hover to Pause</text>

        <!-- Legend -->
        <g transform="translate(280, 90)">
            <use href="#proton" x="0" y="0" transform="scale(0.7)"/>
            <text x="15" y="1" class="legend-text">Proton (m<tspan baseline-shift="sub" font-size="10">p</tspan>)</text>
            
            <use href="#neutron" x="120" y="0" transform="scale(0.7)"/>
            <text x="135" y="1" class="legend-text">Neutron (m<tspan baseline-shift="sub" font-size="10">n</tspan>)</text>
        </g>

        <!-- Scale Base -->
        <g id="scale-base">
            <rect x="392" y="300" width="16" height="150" fill="#adb5bd" rx="4"/>
            <path d="M 330 460 L 470 460 L 450 440 L 350 440 Z" fill="#6c757d"/>
            <circle cx="400" cy="300" r="6" fill="#495057"/>
        </g>

        <!-- Dynamic Scale System -->
        <g class="beam-group">
            <!-- Beam -->
            <line x1="200" y1="300" x2="600" y2="300" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
            
            <!-- Left Tray -->
            <g class="tray-group left-tray" transform="translate(200, 300)">
                <line x1="0" y1="0" x2="-40" y2="80" stroke="#ced4da" stroke-width="2"/>
                <line x1="0" y1="0" x2="40" y2="80" stroke="#ced4da" stroke-width="2"/>
                <path d="M -50 80 L 50 80 L 40 90 L -40 90 Z" fill="#6c757d"/>
                
                <!-- Set A: Individual Nucleons (Resting on Left Tray) -->
                <g class="set-a" transform="translate(0, 68)">
                    <use href="#proton" x="-14" y="-12"/>
                    <use href="#neutron" x="14" y="-12"/>
                    <use href="#neutron" x="-14" y="-36"/>
                    <use href="#proton" x="14" y="-36"/>
                </g>
                <text x="0" y="115" class="label">4 Individual Nucleons</text>
                <text x="0" y="135" class="label ghost-label" fill="#FF3366" font-size="12">(Original Mass Reference)</text>
            </g>

            <!-- Right Tray -->
            <g class="tray-group right-tray" transform="translate(600, 300)">
                <line x1="0" y1="0" x2="-40" y2="80" stroke="#ced4da" stroke-width="2"/>
                <line x1="0" y1="0" x2="40" y2="80" stroke="#ced4da" stroke-width="2"/>
                <path d="M -50 80 L 50 80 L 40 90 L -40 90 Z" fill="#6c757d"/>
                
                <!-- Set C: Assembled Nucleus (Resting on Right Tray) -->
                <g class="set-c" transform="translate(0, 68)">
                    <!-- Energy Waves (Radiating from Nucleus) -->
                    <g class="waves">
                        <path class="wave" d="M 0 0 Q 15 -20 0 -40 T 0 -80 T 0 -120" fill="none" stroke="url(#grad-energy)" stroke-width="4" stroke-linecap="round"/>
                        <path class="wave" d="M 0 0 Q 15 -20 0 -40 T 0 -80 T 0 -120" fill="none" stroke="url(#grad-energy)" stroke-width="4" stroke-linecap="round" transform="rotate(-35)"/>
                        <path class="wave" d="M 0 0 Q 15 -20 0 -40 T 0 -80 T 0 -120" fill="none" stroke="url(#grad-energy)" stroke-width="4" stroke-linecap="round" transform="rotate(35)"/>
                    </g>

                    <!-- The Nucleus -->
                    <use href="#proton" x="-10" y="-10"/>
                    <use href="#neutron" x="10" y="-10"/>
                    <use href="#neutron" x="-10" y="14"/>
                    <use href="#proton" x="10" y="14"/>
                    
                    <!-- Mass Defect Fragment -->
                    <circle class="mass-defect" cx="0" cy="0" r="10" fill="#FFD166" filter="blur(1px)"/>
                </g>
                <text x="0" y="115" class="label set-c">Helium-4 Nucleus</text>
            </g>
        </g>

        <!-- Global Animations (Independent of Scale Rotation) -->
        
        <!-- Flash Effect -->
        <circle class="flash" cx="400" cy="150" r="60" fill="url(#grad-flash)"/>

        <!-- Set B: Animating Nucleons (Moves from Left to Center to Right) -->
        <g class="set-b">
            <g class="b-p1"><use href="#proton"/></g>
            <g class="b-n1"><use href="#neutron"/></g>
            <g class="b-n2"><use href="#neutron"/></g>
            <g class="b-p2"><use href="#proton"/></g>
        </g>

        <!-- Formula -->
        <g class="formula-container" transform="translate(600, 120)">
            <text x="0" y="0" class="math formula-large">E = Δmc²</text>
            <text x="0" y="25" class="label" fill="#F77F00">Energy Released</text>
        </g>

        <!-- Bottom Equation -->
        <text x="400" y="485" class="math" font-size="16" fill="#495057" text-anchor="middle">
            Mass Defect: Δm = (2m<tspan baseline-shift="sub" font-size="11">p</tspan> + 2m<tspan baseline-shift="sub" font-size="11">n</tspan>) - M<tspan baseline-shift="sub" font-size="11">nucleus</tspan> > 0
        </text>

    </svg>
</div>

</body>
</html>
