<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excess Pressure in Drops and Bubbles</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #2B2D42;
            --tension-color: #FF3366;
            --pressure-color: #4361EE;
            --work-color: #06D6A0;
            --drop-fill: rgba(0, 180, 216, 0.15);
            --bubble-fill: rgba(0, 180, 216, 0.08);
            --film-color: rgba(248, 249, 250, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-group {
            text-align: left;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        p.subtitle {
            font-size: 14px;
            color: #6c757d;
        }

        .toggle-btn {
            background-color: var(--text-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .toggle-btn:hover {
            background-color: #1a1b28;
        }

        .toggle-btn:active {
            transform: scale(0.98);
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography inside SVG */
        text {
            font-family: 'Inter', sans-serif;
            fill: var(--text-color);
        }

        .math {
            font-family: 'Roboto Mono', monospace;
            font-weight: 600;
        }

        .math-title {
            font-size: 22px;
            font-weight: 700;
        }

        .math-sub {
            font-size: 14px;
        }

        /* Mode Toggling Logic */
        .mode-drop .bubble-only { display: none; }
        .mode-bubble .drop-only { display: none; }

        /* Animations */
        @keyframes pulse-arrow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .pulsing {
            transform-origin: center;
            animation: pulse-arrow 2s ease-in-out infinite;
        }

        /* Phase 1 & 2: Left Scene Scale */
        @keyframes left-scale {
            0%, 25% { transform: scale(1); }
            35%, 55% { transform: scale(1.15); }
            65%, 100% { transform: scale(1); }
        }

        .scale-group {
            transform-origin: 280px 340px;
            animation: left-scale 10s ease-in-out infinite;
        }

        /* Phase 2: Expansion Elements Fade */
        @keyframes phase2-fade {
            0%, 25% { opacity: 0; }
            35%, 55% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }

        .phase2-elements {
            animation: phase2-fade 10s ease-in-out infinite;
        }

        /* Phase 3: Left Scene Opacity (Ghosting) */
        @keyframes left-opacity {
            0%, 55% { opacity: 1; }
            60%, 85% { opacity: 0.15; }
            90%, 100% { opacity: 1; }
        }

        .left-scene-fade {
            animation: left-opacity 10s ease-in-out infinite;
        }

        /* Phase 3: Cut Line Animation */
        @keyframes cut-line-anim {
            0%, 55% { opacity: 0; stroke-dashoffset: 400; }
            60%, 85% { opacity: 1; stroke-dashoffset: 0; }
            90%, 100% { opacity: 0; stroke-dashoffset: 400; }
        }

        .cut-line {
            stroke-dasharray: 10, 10;
            animation: cut-line-anim 10s ease-in-out infinite;
        }

        /* Phase 3: Right Scene (Hemisphere) Fade & Slide */
        @keyframes phase3-fade-slide {
            0%, 55% { opacity: 0; transform: translateX(30px); }
            60%, 85% { opacity: 1; transform: translateX(0); }
            90%, 100% { opacity: 0; transform: translateX(30px); }
        }

        .phase3-elements {
            animation: phase3-fade-slide 10s ease-in-out infinite;
        }

        /* Dashed line rotation */
        @keyframes rotate-dash {
            to { stroke-dashoffset: -20; }
        }

        .rotating-dash {
            stroke-dasharray: 6, 6;
            animation: rotate-dash 2s linear infinite;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Physics of Excess Pressure (<tspan class="math">ΔP</tspan>)</h1>
            <p class="subtitle">Force balance between Surface Tension and Internal Pressure</p>
        </div>
        <button class="toggle-btn" id="modeToggle" onclick="toggleMode()">Switch to Soap Bubble</button>
    </header>

    <div class="svg-container">
        <svg viewBox="0 0 1000 600" id="main-svg" class="mode-drop" aria-label="Animated diagram showing excess pressure in drops and bubbles">
            
            <defs>
                <!-- Arrowheads -->
                <marker id="arrow-blue" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
                    <path d="M0,0 L6,3 L0,6 Z" fill="var(--pressure-color)"/>
                </marker>
                <marker id="arrow-blue-rev" orient="auto" markerWidth="6" markerHeight="6" refX="1" refY="3">
                    <path d="M6,0 L0,3 L6,6 Z" fill="var(--pressure-color)"/>
                </marker>
                <marker id="arrow-red" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
                    <path d="M0,0 L6,3 L0,6 Z" fill="var(--tension-color)"/>
                </marker>
                <marker id="arrow-green" orient="auto" markerWidth="6" markerHeight="6" refX="5" refY="3">
                    <path d="M0,0 L6,3 L0,6 Z" fill="var(--work-color)"/>
                </marker>
                <marker id="arrow-green-rev" orient="auto" markerWidth="6" markerHeight="6" refX="1" refY="3">
                    <path d="M6,0 L0,3 L6,6 Z" fill="var(--work-color)"/>
                </marker>

                <!-- Hatch Pattern for Cross Section -->
                <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="8" stroke="var(--pressure-color)" stroke-width="1" opacity="0.2"/>
                </pattern>

                <!-- Drop Shadow -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Background -->
            <rect width="1000" height="600" fill="var(--bg-color)" />

            <!-- ========================================== -->
            <!-- STATIC UI ELEMENTS & LEGEND                -->
            <!-- ========================================== -->
            
            <!-- Main Formulas -->
            <g transform="translate(40, 50)">
                <text class="math math-title" x="0" y="0">
                    ΔP = P<tspan baseline-shift="sub" font-size="0.6em">in</tspan> - P<tspan baseline-shift="sub" font-size="0.6em">out</tspan> = 
                    <tspan class="drop-only" fill="var(--tension-color)">2T</tspan>
                    <tspan class="bubble-only" fill="var(--tension-color)">4T</tspan> / R
                </text>
                <text class="drop-only" x="0" y="25" font-size="14" fill="#6c757d">Liquid Drop (1 surface interface)</text>
                <text class="bubble-only" x="0" y="25" font-size="14" fill="#6c757d">Soap Bubble (2 surface interfaces: inner & outer)</text>
            </g>

            <!-- Legend -->
            <g transform="translate(40, 500)" font-size="13">
                <rect x="0" y="0" width="180" height="80" rx="6" fill="white" stroke="#e9ecef" />
                <line x1="15" y1="20" x2="35" y2="20" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="45" y="24">Surface Tension (T)</text>
                
                <line x1="15" y1="40" x2="35" y2="40" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)"/>
                <text x="45" y="44">Pressure (P)</text>
                
                <line x1="15" y1="60" x2="35" y2="60" stroke="var(--work-color)" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-green)"/>
                <text x="45" y="64">Virtual Expansion (dR)</text>
            </g>

            <!-- ========================================== -->
            <!-- LEFT SCENE: FULL DROP / BUBBLE             -->
            <!-- ========================================== -->
            <g id="left-scene" class="left-scene-fade">
                
                <!-- External Pressure Arrows (Static, pointing inward) -->
                <g transform="translate(280, 340)" class="pulsing">
                    <!-- 8 arrows -->
                    <g transform="rotate(0)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(45)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(90)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(135)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(180)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(225)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(270)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <g transform="rotate(315)"><line x1="200" y1="0" x2="165" y2="0" stroke="var(--pressure-color)" stroke-width="2" marker-end="url(#arrow-blue)" opacity="0.6"/></g>
                    <text x="180" y="-15" fill="var(--pressure-color)" font-size="14" font-weight="600" opacity="0.8">P<tspan baseline-shift="sub" font-size="0.7em">out</tspan></text>
                </g>

                <!-- Phase 2 Expansion Elements -->
                <g class="phase2-elements" transform="translate(280, 340)">
                    <!-- Dashed Expanded Circle -->
                    <circle cx="0" cy="0" r="161" fill="none" stroke="var(--work-color)" stroke-width="2" class="rotating-dash"/>
                    
                    <!-- dR indicator -->
                    <line x1="140" y1="-80" x2="161" y2="-92" stroke="var(--work-color)" stroke-width="2" marker-start="url(#arrow-green-rev)" marker-end="url(#arrow-green)"/>
                    <text x="165" y="-95" fill="var(--work-color)" font-size="16" font-weight="bold" class="math">dR</text>

                    <!-- Work Equations -->
                    <g transform="translate(-140, -220)">
                        <rect x="-10" y="-20" width="280" height="60" fill="white" rx="8" opacity="0.9" stroke="var(--work-color)"/>
                        <text x="130" y="0" text-anchor="middle" font-size="14" class="math" fill="var(--pressure-color)">Work by Pressure: W = P·dV</text>
                        <text x="130" y="25" text-anchor="middle" font-size="14" class="math" fill="var(--tension-color)">Surface Energy: dU = T·dA</text>
                    </g>
                </g>

                <!-- Scalable Drop Core -->
                <g class="scale-group">
                    <!-- Liquid Drop Shape -->
                    <circle class="drop-only" cx="280" cy="340" r="140" fill="var(--drop-fill)" stroke="var(--pressure-color)" stroke-width="2" vector-effect="non-scaling-stroke" filter="url(#shadow)"/>
                    
                    <!-- Soap Bubble Shape -->
                    <circle class="bubble-only" cx="280" cy="340" r="140" fill="var(--bubble-fill)" stroke="var(--pressure-color)" stroke-width="2" vector-effect="non-scaling-stroke" filter="url(#shadow)"/>
                    <circle class="bubble-only" cx="280" cy="340" r="132" fill="var(--film-color)" stroke="var(--pressure-color)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>

                    <!-- Internal Pressure Arrows (P_in) -->
                    <g transform="translate(280, 340)" class="pulsing">
                        <g transform="rotate(0)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(45)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(90)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(135)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(180)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(225)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(270)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(315)"><line x1="30" y1="0" x2="110" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)" vector-effect="non-scaling-stroke"/></g>
                        
                        <text x="40" y="-15" fill="var(--pressure-color)" font-size="16" font-weight="bold">P<tspan baseline-shift="sub" font-size="0.7em">in</tspan></text>
                    </g>

                    <!-- Surface Tension Arrows (T) - Pointing inward from perimeter -->
                    <g transform="translate(280, 340)" class="pulsing">
                        <g transform="rotate(22.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(67.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(112.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(157.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(202.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(247.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(292.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        <g transform="rotate(337.5)"><line x1="140" y1="0" x2="115" y2="0" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)" vector-effect="non-scaling-stroke"/></g>
                        
                        <text x="145" y="-30" fill="var(--tension-color)" font-size="16" font-weight="bold">T</text>
                    </g>
                </g>

                <!-- Phase 3 Cut Line -->
                <line class="cut-line" x1="280" y1="160" x2="280" y2="520" stroke="#2B2D42" stroke-width="3" opacity="0"/>
            </g>

            <!-- ========================================== -->
            <!-- RIGHT SCENE: HEMISPHERE (FORCE BALANCE)    -->
            <!-- ========================================== -->
            <g id="right-scene" class="phase3-elements">
                
                <text x="750" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="var(--text-color)">Force Balance on Hemisphere</text>

                <g transform="translate(750, 340)">
                    
                    <!-- DOME (Right half) -->
                    <!-- Drop Dome -->
                    <path class="drop-only" d="M 0 -140 A 140 140 0 0 1 0 140" fill="var(--drop-fill)" stroke="var(--pressure-color)" stroke-width="2" filter="url(#shadow)"/>
                    
                    <!-- Bubble Dome (Outer & Inner) -->
                    <path class="bubble-only" d="M 0 -140 A 140 140 0 0 1 0 140" fill="var(--bubble-fill)" stroke="var(--pressure-color)" stroke-width="2" filter="url(#shadow)"/>
                    <path class="bubble-only" d="M 0 -132 A 132 132 0 0 1 0 132" fill="var(--film-color)" stroke="var(--pressure-color)" stroke-width="1.5"/>

                    <!-- FLAT FACE (Cross Section) -->
                    <!-- Drop Face -->
                    <ellipse class="drop-only" cx="0" cy="0" rx="35" ry="140" fill="url(#hatch)" stroke="var(--pressure-color)" stroke-width="2"/>
                    
                    <!-- Bubble Face -->
                    <ellipse class="bubble-only" cx="0" cy="0" rx="35" ry="140" fill="none" stroke="var(--pressure-color)" stroke-width="2"/>
                    <ellipse class="bubble-only" cx="0" cy="0" rx="33" ry="132" fill="none" stroke="var(--pressure-color)" stroke-width="1.5"/>
                    <!-- Fill between ellipses for bubble -->
                    <path class="bubble-only" d="M 0 -140 A 35 140 0 0 1 0 140 A 35 140 0 0 1 0 -140 Z M 0 -132 A 33 132 0 0 0 0 132 A 33 132 0 0 0 0 -132 Z" fill="url(#hatch)"/>

                    <!-- FORCE ARROWS -->
                    <!-- Pressure Force (Pushing Right on the flat face) -->
                    <g class="pulsing">
                        <line x1="-15" y1="-70" x2="45" y2="-70" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)"/>
                        <line x1="-20" y1="0" x2="50" y2="0" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)"/>
                        <line x1="-15" y1="70" x2="45" y2="70" stroke="var(--pressure-color)" stroke-width="3" marker-end="url(#arrow-blue)"/>
                    </g>

                    <!-- Tension Force (Pulling Left from the rim) -->
                    <g class="pulsing">
                        <line x1="0" y1="-140" x2="-60" y2="-140" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)"/>
                        <line x1="0" y1="140" x2="-60" y2="140" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)"/>
                        <!-- Perspective arrows along the rim -->
                        <line x1="-30" y1="-80" x2="-80" y2="-80" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)"/>
                        <line x1="-30" y1="80" x2="-80" y2="80" stroke="var(--tension-color)" stroke-width="3" marker-end="url(#arrow-red)"/>
                    </g>

                    <!-- Force Labels & Equations -->
                    <g transform="translate(0, 200)">
                        <text x="0" y="0" text-anchor="middle" font-size="16" class="math" fill="var(--pressure-color)">
                            F<tspan baseline-shift="sub" font-size="0.7em">pressure</tspan> = ΔP · (πR²)
                        </text>
                        <text x="0" y="25" text-anchor="middle" font-size="16" class="math" fill="var(--tension-color)">
                            F<tspan baseline-shift="sub" font-size="0.7em">tension</tspan> = 
                            <tspan class="drop-only">T · (2πR)</tspan>
                            <tspan class="bubble-only">T · (2πR) × 2 surfaces</tspan>
                        </text>
                    </g>
                </g>
            </g>

        </svg>
    </div>

    <script>
        let isDrop = true;
        function toggleMode() {
            isDrop = !isDrop;
            const svg = document.getElementById('main-svg');
            const btn = document.getElementById('modeToggle');
            
            if (isDrop) {
                svg.classList.remove('mode-bubble');
                svg.classList.add('mode-drop');
                btn.textContent = "Switch to Soap Bubble";
            } else {
                svg.classList.remove('mode-drop');
                svg.classList.add('mode-bubble');
                btn.textContent = "Switch to Liquid Drop";
            }
        }
    </script>
</body>
</html>
