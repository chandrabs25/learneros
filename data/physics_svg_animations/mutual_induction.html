<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutual Induction: Transformer Principle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .label { font-size: 16px; font-weight: 600; }
        .label-small { font-size: 12px; font-weight: 600; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 500; fill: #4A4E69; text-anchor: middle; }

        /* Hover Interactivity */
        .transformer-group:hover .flux-line {
            stroke-width: 5px;
            filter: drop-shadow(0 0 6px #7209B7);
        }
        .transformer-group:hover .coil-front {
            filter: drop-shadow(0 0 4px #D9480F);
        }
        .flux-line, .coil-front {
            transition: all 0.3s ease;
        }

        /* Animations */
        @keyframes flux-flow {
            0% { stroke-dashoffset: 150; }
            100% { stroke-dashoffset: 0; }
        }

        .flux-line {
            fill: none;
            stroke: #7209B7;
            stroke-width: 3;
            stroke-dasharray: 10 5;
            animation: flux-flow 4s infinite alternate ease-in-out;
        }

        /* Waveform Animations */
        @keyframes reveal {
            0% { clip-path: inset(0 100% 0 0); -webkit-clip-path: inset(0 100% 0 0); }
            100% { clip-path: inset(0 0 0 0); -webkit-clip-path: inset(0 0 0 0); }
        }

        @keyframes scan {
            0% { transform: translateX(0px); }
            100% { transform: translateX(200px); }
        }

        .wave-reveal {
            animation: reveal 8s infinite linear;
        }

        .scan-line {
            animation: scan 8s infinite linear;
        }

        /* Current Indicator Animations */
        .sphere {
            fill: #00B4D8;
            filter: drop-shadow(0 0 4px #00B4D8);
        }

        .sphere-p {
            offset-path: path('M 230 170 C 340 170, 340 180, 280 180 C 220 180, 220 190, 280 190 C 340 190, 340 200, 280 200 C 220 200, 220 210, 280 210 C 340 210, 340 220, 280 220 C 220 220, 220 230, 280 230 C 340 230, 340 240, 280 240 C 220 240, 220 250, 280 250 C 340 250, 340 260, 280 260 C 220 260, 220 270, 230 270');
        }

        .sphere-s {
            offset-path: path('M 570 140 C 460 140, 460 148, 520 148 C 580 148, 580 156, 520 156 C 460 156, 460 164, 520 164 C 580 164, 580 172, 520 172 C 460 172, 460 180, 520 180 C 580 180, 580 188, 520 188 C 460 188, 460 196, 520 196 C 580 196, 580 204, 520 204 C 460 204, 460 212, 520 212 C 580 212, 580 220, 520 220 C 460 220, 460 228, 520 228 C 580 228, 580 236, 520 236 C 460 236, 460 244, 520 244 C 580 244, 580 252, 520 252 C 460 252, 460 260, 520 260 C 580 260, 580 268, 520 268 C 460 268, 460 276, 520 276 C 580 276, 580 284, 520 284 C 460 284, 460 292, 520 292 C 580 292, 580 300, 570 300');
        }

        @keyframes move-p1 { 0% { offset-distance: 10%; } 100% { offset-distance: 50%; } }
        @keyframes move-p2 { 0% { offset-distance: 30%; } 100% { offset-distance: 70%; } }
        @keyframes move-p3 { 0% { offset-distance: 50%; } 100% { offset-distance: 90%; } }

        @keyframes move-s1 { 0% { offset-distance: 0%; } 100% { offset-distance: 80%; } }
        @keyframes move-s2 { 0% { offset-distance: 10%; } 100% { offset-distance: 90%; } }
        @keyframes move-s3 { 0% { offset-distance: 20%; } 100% { offset-distance: 100%; } }

        .p1 { animation: move-p1 4s infinite alternate ease-in-out; }
        .p2 { animation: move-p2 4s infinite alternate ease-in-out; }
        .p3 { animation: move-p3 4s infinite alternate ease-in-out; }

        .s1 { animation: move-s1 4s infinite alternate ease-in-out; }
        .s2 { animation: move-s2 4s infinite alternate ease-in-out; }
        .s3 { animation: move-s3 4s infinite alternate ease-in-out; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Title -->
        <text x="400" y="40" class="title">Mutual Induction: Transformer Principle</text>

        <!-- Legend -->
        <g transform="translate(30, 70)">
            <rect x="-10" y="-15" width="140" height="50" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
            <circle cx="0" cy="0" r="4" class="sphere"/>
            <text x="12" y="4" class="label-small" fill="#4A4E69">AC Charge/Current</text>
            <line x1="-6" y1="18" x2="6" y2="18" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="12" y="22" class="label-small" fill="#4A4E69">Magnetic Flux (Φ)</text>
        </g>

        <!-- Interactive Transformer Group -->
        <g class="transformer-group">
            
            <!-- Soft Iron Core -->
            <path d="M 250 120 h 300 a 20 20 0 0 1 20 20 v 160 a 20 20 0 0 1 -20 20 h -300 a 20 20 0 0 1 -20 -20 v -160 a 20 20 0 0 1 20 -20 Z M 310 180 a 10 10 0 0 0 -10 10 v 60 a 10 10 0 0 0 10 10 h 180 a 10 10 0 0 0 10 -10 v -60 a 10 10 0 0 0 -10 -10 Z" fill="#4A4E69" fill-rule="evenodd"/>

            <!-- Back Coils (Hidden behind core limbs to create 3D effect) -->
            <!-- Primary Back -->
            <path d="M 280 180 C 220 180, 220 190, 280 190 M 280 200 C 220 200, 220 210, 280 210 M 280 220 C 220 220, 220 230, 280 230 M 280 240 C 220 240, 220 250, 280 250 M 280 260 C 220 260, 220 270, 230 270" fill="none" stroke="#B03A0B" stroke-width="6" stroke-linecap="round"/>
            <!-- Secondary Back -->
            <path d="M 520 148 C 580 148, 580 156, 520 156 M 520 164 C 580 164, 580 172, 520 172 M 520 180 C 580 180, 580 188, 520 188 M 520 196 C 580 196, 580 204, 520 204 M 520 212 C 580 212, 580 220, 520 220 M 520 228 C 580 228, 580 236, 520 236 M 520 244 C 580 244, 580 252, 520 252 M 520 260 C 580 260, 580 268, 520 268 M 520 276 C 580 276, 580 284, 520 284 M 520 292 C 580 292, 580 300, 570 300" fill="none" stroke="#B03A0B" stroke-width="6" stroke-linecap="round"/>

            <!-- Magnetic Flux Lines -->
            <rect x="280" y="150" width="240" height="140" rx="15" class="flux-line" />
            <rect x="295" y="165" width="210" height="110" rx="10" class="flux-line" opacity="0.5" />
            <rect x="265" y="135" width="270" height="170" rx="20" class="flux-line" opacity="0.5" />

            <!-- Front Coils -->
            <!-- Primary Front (5 Turns) -->
            <path class="coil-front" d="M 230 170 C 340 170, 340 180, 280 180 M 280 190 C 340 190, 340 200, 280 200 M 280 210 C 340 210, 340 220, 280 220 M 280 230 C 340 230, 340 240, 280 240 M 280 250 C 340 250, 340 260, 280 260" fill="none" stroke="#D9480F" stroke-width="6" stroke-linecap="round"/>
            <!-- Secondary Front (10 Turns) -->
            <path class="coil-front" d="M 570 140 C 460 140, 460 148, 520 148 M 520 156 C 460 156, 460 164, 520 164 M 520 172 C 460 172, 460 180, 520 180 M 520 188 C 460 188, 460 196, 520 196 M 520 204 C 460 204, 460 212, 520 212 M 520 220 C 460 220, 460 228, 520 228 M 520 236 C 460 236, 460 244, 520 244 M 520 252 C 460 252, 460 260, 520 260 M 520 268 C 460 268, 460 276, 520 276 M 520 284 C 460 284, 460 292, 520 292" fill="none" stroke="#D9480F" stroke-width="6" stroke-linecap="round"/>

            <!-- Current Indicators (Cyan Spheres) -->
            <!-- Primary Spheres -->
            <circle r="4.5" class="sphere sphere-p p1" />
            <circle r="4.5" class="sphere sphere-p p2" />
            <circle r="4.5" class="sphere sphere-p p3" />
            <!-- Secondary Spheres -->
            <circle r="4.5" class="sphere sphere-s s1" />
            <circle r="4.5" class="sphere sphere-s s2" />
            <circle r="4.5" class="sphere sphere-s s3" />
            
        </g>

        <!-- Labels -->
        <text x="120" y="210" class="label" fill="#F77F00" text-anchor="end">V<tspan dy="4" font-size="12">p</tspan><tspan dy="-4"> (Input AC)</tspan></text>
        <text x="120" y="235" class="label" fill="#D9480F" text-anchor="end">N<tspan dy="4" font-size="12">p</tspan><tspan dy="-4"> = 5 Turns</tspan></text>

        <text x="680" y="210" class="label" fill="#4361EE" text-anchor="start">V<tspan dy="4" font-size="12">s</tspan><tspan dy="-4"> (Output AC)</tspan></text>
        <text x="680" y="235" class="label" fill="#D9480F" text-anchor="start">N<tspan dy="4" font-size="12">s</tspan><tspan dy="-4"> = 10 Turns</tspan></text>

        <text x="400" y="225" class="label" fill="#7209B7" text-anchor="middle">Magnetic Flux (Φ<tspan dy="4" font-size="12">B</tspan><tspan dy="-4">)</tspan></text>

        <!-- Formula -->
        <g transform="translate(400, 435)">
            <rect x="-85" y="-30" width="170" height="60" rx="8" fill="#ffffff" stroke="#ced4da" stroke-width="2"/>
            <text x="-40" y="-5" class="formula">V<tspan dy="2" font-size="12">s</tspan></text>
            <line x1="-55" y1="2" x2="-25" y2="2" stroke="#4A4E69" stroke-width="2"/>
            <text x="-40" y="18" class="formula">V<tspan dy="2" font-size="12">p</tspan></text>
            
            <text x="0" y="7" class="formula">=</text>
            
            <text x="40" y="-5" class="formula">N<tspan dy="2" font-size="12">s</tspan></text>
            <line x1="25" y1="2" x2="55" y2="2" stroke="#4A4E69" stroke-width="2"/>
            <text x="40" y="18" class="formula">N<tspan dy="2" font-size="12">p</tspan></text>
        </g>

        <!-- Waveforms -->
        <!-- Primary Voltage Waveform -->
        <g transform="translate(0, 0)">
            <text x="120" y="340" class="label-small" fill="#F77F00">Primary Voltage (V<tspan dy="3" font-size="10">p</tspan><tspan dy="-3">)</tspan></text>
            <!-- Axes -->
            <line x1="120" y1="420" x2="320" y2="420" stroke="#adb5bd" stroke-width="2"/>
            <line x1="120" y1="350" x2="120" y2="490" stroke="#adb5bd" stroke-width="2"/>
            <!-- Background Wave -->
            <path d="M 120 420 Q 170 370, 220 420 T 320 420" fill="none" stroke="#F77F00" stroke-width="3" opacity="0.2"/>
            <!-- Animated Revealed Wave -->
            <path d="M 120 420 Q 170 370, 220 420 T 320 420" fill="none" stroke="#F77F00" stroke-width="3" class="wave-reveal"/>
            <!-- Scanning Line -->
            <line x1="120" y1="350" x2="120" y2="490" stroke="#212529" stroke-width="2" stroke-dasharray="4 4" class="scan-line"/>
        </g>

        <!-- Secondary Voltage Waveform -->
        <g transform="translate(0, 0)">
            <text x="480" y="340" class="label-small" fill="#4361EE">Secondary Voltage (V<tspan dy="3" font-size="10">s</tspan><tspan dy="-3">)</tspan></text>
            <!-- Axes -->
            <line x1="480" y1="420" x2="680" y2="420" stroke="#adb5bd" stroke-width="2"/>
            <line x1="480" y1="350" x2="480" y2="490" stroke="#adb5bd" stroke-width="2"/>
            <!-- Background Wave (Double Amplitude) -->
            <path d="M 480 420 Q 530 320, 580 420 T 680 420" fill="none" stroke="#4361EE" stroke-width="3" opacity="0.2"/>
            <!-- Animated Revealed Wave -->
            <path d="M 480 420 Q 530 320, 580 420 T 680 420" fill="none" stroke="#4361EE" stroke-width="3" class="wave-reveal"/>
            <!-- Scanning Line -->
            <line x1="480" y1="350" x2="480" y2="490" stroke="#212529" stroke-width="2" stroke-dasharray="4 4" class="scan-line"/>
        </g>

    </svg>
</div>

</body>
</html>
