<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromotive Force (EMF) & Potential Gradient</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        :root {
            --bg-color: #f8f9fa;
            --panel-bg: #ffffff;
            --text-main: #2B2D42;
            --force-chem: #FF3366;
            --force-elec: #4361EE;
            --velocity: #06D6A0;
            --field-elec: #F77F00;
            --battery: #7209B7;
            --potential: #00B4D8;
            --charge: #FFD166;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 24px;
            max-width: 900px;
            width: 100%;
        }

        h1 {
            margin: 0 0 16px 0;
            font-size: 1.5rem;
            text-align: center;
            color: var(--battery);
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
        }

        button {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #4a4e69;
        }

        label {
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .svg-container {
            width: 100%;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* CSS Animations */
        @keyframes show-forces {
            0%, 7.5% { opacity: 1; }
            7.7%, 100% { opacity: 0; }
        }

        @keyframes pulse-red {
            0%, 100% { transform: scaleX(1); }
            50% { transform: scaleX(1.4); }
        }

        /* State Classes */
        body.paused * {
            animation-play-state: paused !important;
        }

        body.hide-forces .force-vector {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Electromotive Force (&epsilon;) and Potential Gradient</h1>
    
    <div class="controls">
        <button id="playPauseBtn">Pause Animation</button>
        <label>
            <input type="checkbox" id="toggleForcesBtn" checked>
            Show Force Vectors
        </label>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 600" id="mainSvg">
            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366"/>
                </marker>
                <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE"/>
                </marker>
                <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
                </marker>
                <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
                </marker>
                <marker id="arrowBlack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B2D42"/>
                </marker>

                <!-- Glow Filter for Charges -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Potential Hill Gradient -->
                <linearGradient id="potGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.5"/>
                    <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.05"/>
                </linearGradient>
            </defs>

            <!-- ========================================== -->
            <!-- TOP HALF: CIRCUIT VIEW                     -->
            <!-- ========================================== -->
            
            <!-- Base Wires (Drawn with gaps for components) -->
            <path d="M 500 100 L 635 100 A 15 15 0 0 1 650 115 L 650 235 A 15 15 0 0 1 635 250 L 500 250" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>
            <path d="M 300 250 L 165 250 A 15 15 0 0 1 150 235 L 150 115 A 15 15 0 0 1 165 100 L 300 100" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linecap="round"/>

            <!-- External Resistor R -->
            <path d="M 500 250 L 483 235 L 450 265 L 417 235 L 383 265 L 350 235 L 317 265 L 300 250" fill="none" stroke="#2B2D42" stroke-width="4" stroke-linejoin="round"/>
            <text x="400" y="295" text-anchor="middle" font-size="16" font-weight="bold" fill="#2B2D42">External Resistor (R)</text>

            <!-- Battery Box -->
            <rect x="280" y="50" width="240" height="100" rx="10" fill="#f8f9fa" stroke="#7209B7" stroke-width="3" stroke-dasharray="6,4"/>
            <text x="400" y="40" text-anchor="middle" font-size="14" font-weight="bold" fill="#7209B7">Source of EMF (<tspan class="math">&epsilon;</tspan>)</text>

            <!-- Battery Internal Components -->
            <!-- Terminals -->
            <line x1="300" y1="75" x2="300" y2="125" stroke="#2B2D42" stroke-width="6" stroke-linecap="round"/>
            <text x="285" y="105" font-size="20" font-weight="bold" fill="#2B2D42">-</text>
            
            <line x1="500" y1="65" x2="500" y2="135" stroke="#2B2D42" stroke-width="3" stroke-linecap="round"/>
            <text x="515" y="105" font-size="20" font-weight="bold" fill="#2B2D42">+</text>

            <!-- Chemical Pump Area -->
            <rect x="300" y="80" width="100" height="40" fill="#FF3366" fill-opacity="0.1"/>
            <text x="350" y="140" text-anchor="middle" font-size="12" fill="#FF3366" font-weight="bold">Chemical Pump</text>

            <!-- Internal Resistor r -->
            <path d="M 400 100 L 410 85 L 430 115 L 450 85 L 470 115 L 490 85 L 500 100" fill="none" stroke="#2B2D42" stroke-width="3" stroke-linejoin="round"/>
            <text x="450" y="140" text-anchor="middle" font-size="14" font-style="italic" font-weight="bold" fill="#2B2D42">r</text>

            <!-- Electric Field Lines (Orange) -->
            <!-- Inside Battery -->
            <path d="M 480 70 L 320 70" stroke="#F77F00" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowOrange)"/>
            <text x="400" y="65" text-anchor="middle" font-size="12" fill="#F77F00" font-weight="bold">E-Field</text>
            
            <!-- Outside Battery -->
            <path d="M 550 80 L 600 80" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowOrange)"/>
            <path d="M 670 150 L 670 200" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowOrange)"/>
            <path d="M 250 270 L 200 270" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowOrange)"/>
            <path d="M 130 200 L 130 150" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowOrange)"/>

            <!-- Kirchhoff's Loop Rule Box -->
            <rect x="300" y="145" width="200" height="70" rx="8" fill="#ffffff" stroke="#00B4D8" stroke-width="2"/>
            <text x="400" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#00B4D8">Kirchhoff's Loop Rule</text>
            <text x="400" y="185" text-anchor="middle" font-size="14" class="math" fill="#2B2D42">&Sigma; &Delta;V = 0</text>
            <text x="400" y="205" text-anchor="middle" font-size="14" class="math" fill="#2B2D42">&epsilon; - Ir - IR = 0</text>

            <!-- Legend -->
            <rect x="640" y="10" width="150" height="95" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1"/>
            <text x="645" y="25" font-size="11" font-weight="bold">Legend:</text>
            <path d="M 645 35 L 665 35" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
            <text x="675" y="39" font-size="11">Chem Force (F<tspan dy="2" font-size="9">n</tspan><tspan dy="-2">)</tspan></text>
            <path d="M 645 55 L 665 55" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
            <text x="675" y="59" font-size="11">Elec Force (F<tspan dy="2" font-size="9">e</tspan><tspan dy="-2">)</tspan></text>
            <path d="M 645 75 L 665 75" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
            <text x="675" y="79" font-size="11">Velocity (v)</text>
            <path d="M 645 95 L 665 95" stroke="#F77F00" stroke-width="2" stroke-dasharray="4,2"/>
            <text x="675" y="99" font-size="11">Electric Field</text>

            <!-- Circuit Position Markers -->
            <circle cx="300" cy="100" r="4" fill="#2B2D42"/>
            <text x="290" y="90" font-size="14" font-weight="bold" fill="#2B2D42">A</text>
            
            <circle cx="400" cy="100" r="4" fill="#2B2D42"/>
            <text x="390" y="90" font-size="14" font-weight="bold" fill="#2B2D42">B</text>
            
            <circle cx="500" cy="100" r="4" fill="#2B2D42"/>
            <text x="510" y="90" font-size="14" font-weight="bold" fill="#2B2D42">C</text>
            
            <circle cx="500" cy="250" r="4" fill="#2B2D42"/>
            <text x="510" y="240" font-size="14" font-weight="bold" fill="#2B2D42">F</text>
            
            <circle cx="300" cy="250" r="4" fill="#2B2D42"/>
            <text x="290" y="240" font-size="14" font-weight="bold" fill="#2B2D42">G</text>


            <!-- ========================================== -->
            <!-- BOTTOM HALF: POTENTIAL HILL VIEW           -->
            <!-- ========================================== -->

            <!-- Axes -->
            <path d="M 75 540 L 750 540" stroke="#2B2D42" stroke-width="2" marker-end="url(#arrowBlack)"/>
            <path d="M 75 540 L 75 340" stroke="#2B2D42" stroke-width="2" marker-end="url(#arrowBlack)"/>
            
            <!-- Axis Labels -->
            <text x="412" y="575" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">Distance along circuit (Unrolled)</text>
            <text x="50" y="440" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42" transform="rotate(-90, 50, 440)">Electric Potential V</text>

            <!-- Graph Guide Lines -->
            <path d="M 75 380 L 125 380" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>
            <path d="M 75 410 L 400 410" stroke="#ccc" stroke-width="1" stroke-dasharray="4,4"/>

            <!-- Potential Area & Line -->
            <path d="M 75 540 L 125 380 L 175 410 L 400 410 L 500 540 L 725 540 L 725 540 L 75 540 Z" fill="url(#potGrad)"/>
            <path d="M 75 540 L 125 380 L 175 410 L 400 410 L 500 540 L 725 540" fill="none" stroke="#4361EE" stroke-width="3" stroke-linejoin="round"/>

            <!-- Graph Position Markers (Matching Circuit) -->
            <circle cx="75" cy="540" r="4" fill="#2B2D42"/>
            <text x="75" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">A</text>
            
            <circle cx="125" cy="380" r="4" fill="#2B2D42"/>
            <text x="125" y="370" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">B</text>
            
            <circle cx="175" cy="410" r="4" fill="#2B2D42"/>
            <text x="175" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">C</text>
            
            <circle cx="400" cy="410" r="4" fill="#2B2D42"/>
            <text x="400" y="400" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">F</text>
            
            <circle cx="500" cy="540" r="4" fill="#2B2D42"/>
            <text x="500" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">G</text>

            <circle cx="725" cy="540" r="4" fill="#2B2D42"/>
            <text x="725" y="558" text-anchor="middle" font-size="14" font-weight="bold" fill="#2B2D42">A'</text>

            <!-- Dimension Lines for Potential Drops -->
            <!-- EMF Rise -->
            <path d="M 105 535 L 105 385" stroke="#FF3366" stroke-width="2" marker-end="url(#arrowRed)"/>
            <text x="95" y="465" text-anchor="end" font-size="14" font-weight="bold" class="math" fill="#FF3366">+&epsilon;</text>

            <!-- Internal Drop Ir -->
            <path d="M 195 385 L 195 405" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowBlue)"/>
            <text x="205" y="400" font-size="14" font-weight="bold" class="math" fill="#4361EE">-Ir</text>

            <!-- Terminal Voltage Label -->
            <text x="287" y="395" text-anchor="middle" font-size="14" font-weight="bold" class="math" fill="#7209B7">Terminal Voltage V = &epsilon; - Ir</text>

            <!-- External Drop IR -->
            <path d="M 470 415 L 470 535" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowBlue)"/>
            <text x="460" y="480" text-anchor="end" font-size="14" font-weight="bold" class="math" fill="#4361EE">-IR</text>


            <!-- ========================================== -->
            <!-- ANIMATED CHARGES                           -->
            <!-- ========================================== -->

            <!-- Template for a single moving charge system -->
            <!-- We duplicate this 4 times with different begin times to create a steady current -->
            
            <!-- Charge 1 -->
            <g>
                <!-- Circuit Charge Motion -->
                <animateMotion dur="10s" repeatCount="indefinite" path="M 300 100 L 500 100 L 650 100 L 650 250 L 150 250 L 150 100 Z" calcMode="paced" begin="0s" rotate="auto"/>
                
                <!-- The Particle -->
                <circle cx="0" cy="0" r="8" fill="var(--charge)" filter="url(#glow)"/>
                <text x="-4" y="4" font-size="12" font-weight="bold" fill="#2B2D42">+</text>
                
                <!-- Velocity Vector (Always points forward due to rotate="auto") -->
                <path d="M 12 0 L 28 0" stroke="var(--velocity)" stroke-width="3" marker-end="url(#arrowGreen)"/>
                
                <!-- Force Vectors (Only visible inside the chemical pump: 0 to 7.69% of animation) -->
                <g class="force-vector" style="animation: show-forces 10s infinite linear; animation-delay: 0s;">
                    <!-- Chemical Force (Pulsing) -->
                    <path d="M 0 0 L 40 0" stroke="var(--force-chem)" stroke-width="3" marker-end="url(#arrowRed)" style="animation: pulse-red 0.5s infinite linear; transform-origin: 0 0;"/>
                    <!-- Electric Force (Opposing) -->
                    <path d="M 0 0 L -25 0" stroke="var(--force-elec)" stroke-width="3" marker-end="url(#arrowBlue)"/>
                </g>
            </g>
            <!-- Graph Charge 1 -->
            <circle r="6" fill="var(--charge)" filter="url(#glow)">
                <animate attributeName="cx" values="75; 125; 175; 250; 325; 400; 500; 575; 650; 725" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
                <animate attributeName="cy" values="540; 380; 410; 410; 410; 410; 540; 540; 540; 540" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="0s" calcMode="linear"/>
            </circle>

            <!-- Charge 2 (Offset by -2.5s) -->
            <g>
                <animateMotion dur="10s" repeatCount="indefinite" path="M 300 100 L 500 100 L 650 100 L 650 250 L 150 250 L 150 100 Z" calcMode="paced" begin="-2.5s" rotate="auto"/>
                <circle cx="0" cy="0" r="8" fill="var(--charge)" filter="url(#glow)"/>
                <text x="-4" y="4" font-size="12" font-weight="bold" fill="#2B2D42">+</text>
                <path d="M 12 0 L 28 0" stroke="var(--velocity)" stroke-width="3" marker-end="url(#arrowGreen)"/>
                <g class="force-vector" style="animation: show-forces 10s infinite linear; animation-delay: -2.5s;">
                    <path d="M 0 0 L 40 0" stroke="var(--force-chem)" stroke-width="3" marker-end="url(#arrowRed)" style="animation: pulse-red 0.5s infinite linear; transform-origin: 0 0;"/>
                    <path d="M 0 0 L -25 0" stroke="var(--force-elec)" stroke-width="3" marker-end="url(#arrowBlue)"/>
                </g>
            </g>
            <!-- Graph Charge 2 -->
            <circle r="6" fill="var(--charge)" filter="url(#glow)">
                <animate attributeName="cx" values="75; 125; 175; 250; 325; 400; 500; 575; 650; 725" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-2.5s" calcMode="linear"/>
                <animate attributeName="cy" values="540; 380; 410; 410; 410; 410; 540; 540; 540; 540" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-2.5s" calcMode="linear"/>
            </circle>

            <!-- Charge 3 (Offset by -5.0s) -->
            <g>
                <animateMotion dur="10s" repeatCount="indefinite" path="M 300 100 L 500 100 L 650 100 L 650 250 L 150 250 L 150 100 Z" calcMode="paced" begin="-5s" rotate="auto"/>
                <circle cx="0" cy="0" r="8" fill="var(--charge)" filter="url(#glow)"/>
                <text x="-4" y="4" font-size="12" font-weight="bold" fill="#2B2D42">+</text>
                <path d="M 12 0 L 28 0" stroke="var(--velocity)" stroke-width="3" marker-end="url(#arrowGreen)"/>
                <g class="force-vector" style="animation: show-forces 10s infinite linear; animation-delay: -5s;">
                    <path d="M 0 0 L 40 0" stroke="var(--force-chem)" stroke-width="3" marker-end="url(#arrowRed)" style="animation: pulse-red 0.5s infinite linear; transform-origin: 0 0;"/>
                    <path d="M 0 0 L -25 0" stroke="var(--force-elec)" stroke-width="3" marker-end="url(#arrowBlue)"/>
                </g>
            </g>
            <!-- Graph Charge 3 -->
            <circle r="6" fill="var(--charge)" filter="url(#glow)">
                <animate attributeName="cx" values="75; 125; 175; 250; 325; 400; 500; 575; 650; 725" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-5s" calcMode="linear"/>
                <animate attributeName="cy" values="540; 380; 410; 410; 410; 410; 540; 540; 540; 540" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-5s" calcMode="linear"/>
            </circle>

            <!-- Charge 4 (Offset by -7.5s) -->
            <g>
                <animateMotion dur="10s" repeatCount="indefinite" path="M 300 100 L 500 100 L 650 100 L 650 250 L 150 250 L 150 100 Z" calcMode="paced" begin="-7.5s" rotate="auto"/>
                <circle cx="0" cy="0" r="8" fill="var(--charge)" filter="url(#glow)"/>
                <text x="-4" y="4" font-size="12" font-weight="bold" fill="#2B2D42">+</text>
                <path d="M 12 0 L 28 0" stroke="var(--velocity)" stroke-width="3" marker-end="url(#arrowGreen)"/>
                <g class="force-vector" style="animation: show-forces 10s infinite linear; animation-delay: -7.5s;">
                    <path d="M 0 0 L 40 0" stroke="var(--force-chem)" stroke-width="3" marker-end="url(#arrowRed)" style="animation: pulse-red 0.5s infinite linear; transform-origin: 0 0;"/>
                    <path d="M 0 0 L -25 0" stroke="var(--force-elec)" stroke-width="3" marker-end="url(#arrowBlue)"/>
                </g>
            </g>
            <!-- Graph Charge 4 -->
            <circle r="6" fill="var(--charge)" filter="url(#glow)">
                <animate attributeName="cx" values="75; 125; 175; 250; 325; 400; 500; 575; 650; 725" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-7.5s" calcMode="linear"/>
                <animate attributeName="cy" values="540; 380; 410; 410; 410; 410; 540; 540; 540; 540" keyTimes="0; 0.0769; 0.1538; 0.2692; 0.3846; 0.5; 0.6538; 0.7692; 0.8846; 1" dur="10s" repeatCount="indefinite" begin="-7.5s" calcMode="linear"/>
            </circle>

        </svg>
    </div>
</div>

<script>
    const svg = document.getElementById('mainSvg');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const toggleForcesBtn = document.getElementById('toggleForcesBtn');
    let isPlaying = true;

    // Play/Pause Logic
    playPauseBtn.addEventListener('click', () => {
        if (isPlaying) {
            svg.pauseAnimations();
            document.body.classList.add('paused');
            playPauseBtn.textContent = 'Play Animation';
        } else {
            svg.unpauseAnimations();
            document.body.classList.remove('paused');
            playPauseBtn.textContent = 'Pause Animation';
        }
        isPlaying = !isPlaying;
    });

    // Toggle Forces Logic
    toggleForcesBtn.addEventListener('change', (e) => {
        if (e.target.checked) {
            document.body.classList.remove('hide-forces');
        } else {
            document.body.classList.add('hide-forces');
        }
    });
</script>

</body>
</html>
