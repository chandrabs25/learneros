<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Dipole: Field Structure and Torque Dynamics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Pause animation on hover */
        svg:hover * {
            animation-play-state: paused !important;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #495057; }
        .math-text { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; }
        .label-text { font-size: 14px; font-weight: 600; fill: #212529; }
        .instruction { font-size: 12px; fill: #868E96; font-style: italic; }
        .legend-text { font-size: 12px; fill: #495057; }

        /* Animations */
        .move-pos-charge { animation: movePosCharge 11s infinite ease-in-out; }
        .move-neg-charge { animation: moveNegCharge 11s infinite ease-in-out; }
        .grow-p { animation: growP 11s infinite ease-in-out; transform-origin: 0 0; }
        .draw-field { 
            stroke-dasharray: 800; 
            stroke-dashoffset: 800; 
            animation: drawField 11s infinite ease-in-out; 
        }
        .pulse-equi { animation: pulseEqui 11s infinite ease-in-out; opacity: 0; }
        .fade-right { animation: fadeRight 11s infinite ease-in-out; opacity: 0; }
        .rotate-dipole { 
            transform-origin: 600px 250px; 
            animation: rotateDipole 11s infinite ease-in-out; 
        }
        .counter-rotate { animation: counterRotate 11s infinite ease-in-out; }
        .fade-torque { animation: fadeTorque 11s infinite ease-in-out; opacity: 0; }

        /* Keyframes */
        @keyframes movePosCharge {
            0%, 5% { transform: translate(200px, 250px); opacity: 0; }
            10% { opacity: 1; }
            18%, 95% { transform: translate(250px, 250px); opacity: 1; }
            100% { transform: translate(250px, 250px); opacity: 0; }
        }

        @keyframes moveNegCharge {
            0%, 5% { transform: translate(200px, 250px); opacity: 0; }
            10% { opacity: 1; }
            18%, 95% { transform: translate(150px, 250px); opacity: 1; }
            100% { transform: translate(150px, 250px); opacity: 0; }
        }

        @keyframes growP {
            0%, 15% { transform: scaleX(0); opacity: 0; }
            20%, 95% { transform: scaleX(1); opacity: 1; }
            100% { transform: scaleX(1); opacity: 0; }
        }

        @keyframes drawField {
            0%, 18% { stroke-dashoffset: 800; opacity: 1; }
            35%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes pulseEqui {
            0%, 35% { opacity: 0; }
            40% { opacity: 0.8; }
            50% { opacity: 0.3; }
            60% { opacity: 0.8; }
            70% { opacity: 0.3; }
            80% { opacity: 0.8; }
            90% { opacity: 0.3; }
            95%, 100% { opacity: 0; }
        }

        @keyframes fadeRight {
            0%, 45% { opacity: 0; }
            50%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes rotateDipole {
            0%, 45% { transform: rotate(-60deg); }
            55% { transform: rotate(-60deg); }
            65% { transform: rotate(15deg); }
            72% { transform: rotate(-8deg); }
            78% { transform: rotate(3deg); }
            85%, 100% { transform: rotate(0deg); }
        }

        @keyframes counterRotate {
            0%, 45% { transform: rotate(60deg); }
            55% { transform: rotate(60deg); }
            65% { transform: rotate(-15deg); }
            72% { transform: rotate(8deg); }
            78% { transform: rotate(-3deg); }
            85%, 100% { transform: rotate(0deg); }
        }

        @keyframes fadeTorque {
            0%, 55% { opacity: 0; }
            60% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Electric Dipole: Field Structure and Torque Dynamics</title>
        <desc>An animated physics diagram showing the electric field lines of a dipole and its rotation due to torque in a uniform external electric field.</desc>

        <defs>
            <!-- Arrowhead for Dipole Moment (Purple) -->
            <marker id="arrow-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Arrowhead for Electric Field Lines (Orange) - Shifted back to not overlap charge -->
            <marker id="arrow-e-dipole" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>

            <!-- Arrowhead for Uniform Electric Field (Orange) -->
            <marker id="arrow-e-uniform" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>

            <!-- Arrowhead for Torque (Green) -->
            <marker id="arrow-t" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>

            <!-- Arrowhead for Positive Force (Red) -->
            <marker id="arrow-f-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>

            <!-- Arrowhead for Negative Force (Blue) -->
            <marker id="arrow-f-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
        </defs>

        <!-- Background & UI Structure -->
        <rect width="800" height="500" fill="#ffffff" />
        <line x1="400" y1="60" x2="400" y2="440" stroke="#DEE2E6" stroke-width="2" stroke-dasharray="6 6" />
        
        <text x="400" y="35" text-anchor="middle" class="title">Electric Dipole: Field &amp; Torque</text>
        <text x="400" y="55" text-anchor="middle" class="instruction">Hover over the diagram to pause the animation</text>
        
        <text x="200" y="85" text-anchor="middle" class="subtitle">Internal Field Structure</text>
        <text x="600" y="85" text-anchor="middle" class="subtitle">External Field Interaction</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: Static Dipole Field Formation  -->
        <!-- ========================================== -->
        
        <!-- Equipotential Lines -->
        <g class="pulse-equi">
            <!-- Around +q -->
            <ellipse cx="255" cy="250" rx="18" ry="24" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
            <ellipse cx="262" cy="250" rx="30" ry="42" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
            <ellipse cx="272" cy="250" rx="45" ry="65" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
            <!-- Around -q -->
            <ellipse cx="145" cy="250" rx="18" ry="24" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
            <ellipse cx="138" cy="250" rx="30" ry="42" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
            <ellipse cx="128" cy="250" rx="45" ry="65" fill="none" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="4 4"/>
        </g>

        <!-- Electric Field Lines (Drawn from +q to -q) -->
        <g fill="none" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e-dipole)">
            <path d="M 250 250 C 225 180, 175 180, 150 250" class="draw-field" />
            <path d="M 250 250 C 230 100, 170 100, 150 250" class="draw-field" />
            <path d="M 250 250 C 240 0, 160 0, 150 250" class="draw-field" />
            <path d="M 250 250 C 250 -100, 150 -100, 150 250" class="draw-field" />
            
            <path d="M 250 250 C 225 320, 175 320, 150 250" class="draw-field" />
            <path d="M 250 250 C 230 400, 170 400, 150 250" class="draw-field" />
            <path d="M 250 250 C 240 500, 160 500, 150 250" class="draw-field" />
            <path d="M 250 250 C 250 600, 150 600, 150 250" class="draw-field" />
        </g>
        
        <!-- Outward/Inward Field Lines -->
        <g fill="none" stroke="#F77F00" stroke-width="1.5">
            <path d="M 250 250 L 380 250" class="draw-field" marker-end="url(#arrow-e-uniform)" />
            <path d="M 20 250 L 150 250" class="draw-field" marker-end="url(#arrow-e-dipole)" />
        </g>

        <!-- Dipole Axis (Left) -->
        <line x1="150" y1="250" x2="250" y2="250" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4" />

        <!-- Dipole Moment Vector p (Left) -->
        <g transform="translate(150, 250)">
            <line x1="0" y1="0" x2="90" y2="0" stroke="#7209B7" stroke-width="4" marker-end="url(#arrow-p)" class="grow-p" />
            <text x="50" y="-10" text-anchor="middle" class="math-text grow-p" fill="#7209B7">p⃗</text>
        </g>

        <!-- Distance Bracket 2a -->
        <g class="pulse-equi">
            <path d="M 150 275 L 150 280 L 250 280 L 250 275" fill="none" stroke="#868E96" stroke-width="1.5" />
            <text x="200" y="295" text-anchor="middle" class="math-text" fill="#868E96">2a</text>
        </g>

        <!-- Charges (Left) -->
        <g class="move-neg-charge">
            <circle cx="0" cy="0" r="12" fill="#4361EE" />
            <text x="0" y="4" text-anchor="middle" fill="white" font-weight="bold">−</text>
            <text x="0" y="-20" text-anchor="middle" class="label-text" fill="#4361EE">−q</text>
        </g>
        <g class="move-pos-charge">
            <circle cx="0" cy="0" r="12" fill="#FF3366" />
            <text x="0" y="4" text-anchor="middle" fill="white" font-weight="bold">+</text>
            <text x="0" y="-20" text-anchor="middle" class="label-text" fill="#FF3366">+q</text>
        </g>

        <!-- Formula (Left) -->
        <text x="200" y="420" text-anchor="middle" class="math-text" fill="#7209B7">p⃗ = q · 2a⃗</text>


        <!-- ========================================== -->
        <!-- RIGHT PANEL: Torque in Uniform Field       -->
        <!-- ========================================== -->
        
        <g class="fade-right">
            <!-- Uniform External Electric Field -->
            <g stroke="#F77F00" stroke-width="2" opacity="0.6">
                <line x1="430" y1="120" x2="770" y2="120" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="160" x2="770" y2="160" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="200" x2="770" y2="200" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="250" x2="770" y2="250" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="300" x2="770" y2="300" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="340" x2="770" y2="340" marker-end="url(#arrow-e-uniform)" />
                <line x1="430" y1="380" x2="770" y2="380" marker-end="url(#arrow-e-uniform)" />
            </g>
            <text x="750" y="110" text-anchor="middle" class="math-text" fill="#F77F00">E⃗_ext</text>

            <!-- Torque Arc -->
            <g class="fade-torque">
                <path d="M 615 210 A 45 45 0 0 1 642 235" fill="none" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-t)" />
                <text x="635" y="210" class="math-text" fill="#06D6A0">τ⃗</text>
            </g>

            <!-- Rotating Dipole Group -->
            <g class="rotate-dipole">
                <!-- Axis -->
                <line x1="550" y1="250" x2="650" y2="250" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4" />
                
                <!-- Dipole Moment Vector p -->
                <line x1="550" y1="250" x2="640" y2="250" stroke="#7209B7" stroke-width="4" marker-end="url(#arrow-p)" />
                <text x="600" y="240" text-anchor="middle" class="math-text" fill="#7209B7">p⃗</text>

                <!-- Negative Charge (-q) -->
                <g transform="translate(550, 250)">
                    <circle cx="0" cy="0" r="12" fill="#4361EE" />
                    <text x="0" y="4" text-anchor="middle" fill="white" font-weight="bold">−</text>
                    <!-- Counter-rotating Force Vector -->
                    <g class="counter-rotate">
                        <line x1="-15" y1="0" x2="-55" y2="0" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-f-blue)" />
                        <text x="-35" y="-10" text-anchor="middle" class="math-text" fill="#4361EE">F⃗_</text>
                    </g>
                </g>

                <!-- Positive Charge (+q) -->
                <g transform="translate(650, 250)">
                    <circle cx="0" cy="0" r="12" fill="#FF3366" />
                    <text x="0" y="4" text-anchor="middle" fill="white" font-weight="bold">+</text>
                    <!-- Counter-rotating Force Vector -->
                    <g class="counter-rotate">
                        <line x1="15" y1="0" x2="55" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-f-red)" />
                        <text x="35" y="-10" text-anchor="middle" class="math-text" fill="#FF3366">F⃗₊</text>
                    </g>
                </g>
            </g>

            <!-- Formulas (Right) -->
            <text x="600" y="420" text-anchor="middle" class="math-text" fill="#06D6A0">τ⃗ = p⃗ × E⃗</text>
            <text x="600" y="445" text-anchor="middle" class="math-text" fill="#495057">|τ| = pE sin(θ)</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(130, 475)">
            <circle cx="0" cy="-4" r="5" fill="#FF3366"/>
            <text x="10" y="0" class="legend-text">+ Charge / Force</text>
            
            <circle cx="120" cy="-4" r="5" fill="#4361EE"/>
            <text x="130" y="0" class="legend-text">- Charge / Force</text>
            
            <line x1="240" y1="-4" x2="255" y2="-4" stroke="#7209B7" stroke-width="3"/>
            <text x="260" y="0" class="legend-text">Dipole Moment (p)</text>
            
            <line x1="380" y1="-4" x2="395" y2="-4" stroke="#F77F00" stroke-width="2"/>
            <text x="400" y="0" class="legend-text">Electric Field (E)</text>

            <line x1="510" y1="-4" x2="525" y2="-4" stroke="#00B4D8" stroke-width="2" stroke-dasharray="2 2"/>
            <text x="530" y="0" class="legend-text">Equipotential</text>
        </g>

    </svg>
</div>

</body>
</html>
