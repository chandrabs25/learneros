<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Image Formation in Space</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Animations */
        .anim-global {
            animation: fadeInOut 12s ease-in-out infinite;
        }

        .anim-object {
            transform-origin: 250px 250px;
            animation: growUp 12s ease-in-out infinite;
        }

        .anim-image {
            transform-origin: 700px 250px;
            animation: growDown 12s ease-in-out infinite;
        }

        .anim-ray1 {
            stroke-dasharray: 581;
            stroke-dashoffset: 581;
            animation: drawRay1 12s linear infinite;
        }

        .anim-ray2 {
            stroke-dasharray: 570;
            stroke-dashoffset: 570;
            animation: drawRay2 12s linear infinite;
        }

        .anim-ray3 {
            stroke-dasharray: 593;
            stroke-dashoffset: 593;
            animation: drawRay3 12s linear infinite;
        }

        .anim-pulse1 {
            offset-path: path('M 250 210 L 400 210 L 700 330 L 800 370');
            animation: pulseTravel1 12s linear infinite;
        }

        .anim-pulse2 {
            offset-path: path('M 250 210 L 400 250 L 700 330 L 800 356.67');
            animation: pulseTravel2 12s linear infinite;
        }

        .anim-pulse3 {
            offset-path: path('M 250 210 L 400 330 L 700 330 L 800 330');
            animation: pulseTravel3 12s linear infinite;
        }

        .anim-screen {
            transform-origin: bottom;
            animation: slideScreen 12s ease-in-out infinite;
        }

        .anim-text1 {
            animation: text1Fade 12s ease-in-out infinite;
        }

        .anim-text2 {
            animation: text2Fade 12s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes fadeInOut {
            0%, 2% { opacity: 0; }
            5%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes growUp {
            0%, 5% { transform: scaleY(0); opacity: 0; }
            10%, 90% { transform: scaleY(1); opacity: 1; }
            95%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes growDown {
            0%, 41.6% { transform: scaleY(0); opacity: 0; filter: drop-shadow(0 0 0px rgba(67,97,238,0)); }
            45%, 50% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(67,97,238,0)); }
            55%, 75% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 12px rgba(67,97,238,0.8)); }
            80%, 90% { transform: scaleY(1); opacity: 1; filter: drop-shadow(0 0 0px rgba(67,97,238,0)); }
            95%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes drawRay1 {
            0%, 16.6% { stroke-dashoffset: 581; opacity: 1; }
            41.6%, 58.3% { stroke-dashoffset: 108; opacity: 1; }
            75%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes drawRay2 {
            0%, 16.6% { stroke-dashoffset: 570; opacity: 1; }
            41.6%, 58.3% { stroke-dashoffset: 104; opacity: 1; }
            75%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes drawRay3 {
            0%, 16.6% { stroke-dashoffset: 593; opacity: 1; }
            41.6%, 58.3% { stroke-dashoffset: 100; opacity: 1; }
            75%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes pulseTravel1 {
            0%, 16.5% { offset-distance: 0%; opacity: 0; }
            16.6% { offset-distance: 0%; opacity: 1; }
            41.6% { offset-distance: 81.5%; opacity: 1; }
            41.7%, 58.2% { offset-distance: 81.5%; opacity: 0; }
            58.3% { offset-distance: 81.5%; opacity: 1; }
            75% { offset-distance: 100%; opacity: 1; }
            75.1%, 100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes pulseTravel2 {
            0%, 16.5% { offset-distance: 0%; opacity: 0; }
            16.6% { offset-distance: 0%; opacity: 1; }
            41.6% { offset-distance: 81.8%; opacity: 1; }
            41.7%, 58.2% { offset-distance: 81.8%; opacity: 0; }
            58.3% { offset-distance: 81.8%; opacity: 1; }
            75% { offset-distance: 100%; opacity: 1; }
            75.1%, 100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes pulseTravel3 {
            0%, 16.5% { offset-distance: 0%; opacity: 0; }
            16.6% { offset-distance: 0%; opacity: 1; }
            41.6% { offset-distance: 83.1%; opacity: 1; }
            41.7%, 58.2% { offset-distance: 83.1%; opacity: 0; }
            58.3% { offset-distance: 83.1%; opacity: 1; }
            75% { offset-distance: 100%; opacity: 1; }
            75.1%, 100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes slideScreen {
            0%, 50% { transform: translateY(150px); opacity: 0; }
            55%, 75% { transform: translateY(0); opacity: 1; }
            80%, 100% { transform: translateY(150px); opacity: 0; }
        }

        @keyframes text1Fade {
            0%, 35% { opacity: 0; transform: translateY(10px); }
            40%, 90% { opacity: 1; transform: translateY(0); }
            95%, 100% { opacity: 0; transform: translateY(10px); }
        }

        @keyframes text2Fade {
            0%, 65% { opacity: 0; transform: translateY(10px); }
            70%, 90% { opacity: 1; transform: translateY(0); }
            95%, 100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Real Image Formation by a Convex Lens</title>
        <desc id="svg-desc">An animated ray optics diagram showing light rays from an object passing through a convex lens, converging to form a real image, and continuing into space to demonstrate the image exists without a screen.</desc>

        <defs>
            <!-- Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f3f5" stroke-width="1"/>
            </pattern>

            <!-- Arrowheads -->
            <marker id="arrowObj" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrowImg" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>

            <!-- Glow Filter for Rays -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FFD700" flood-opacity="0.6"/>
            </filter>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Static Setup Elements (Fades in at start) -->
        <g class="anim-global">
            <!-- Title & Formula -->
            <text x="400" y="45" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#212529">Optical Instruments: Real Image in Space</text>
            <text x="400" y="75" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="16" fill="#6C757D">1/f = 1/v - 1/u</text>

            <!-- Legend -->
            <rect x="630" y="20" width="150" height="85" fill="#ffffff" stroke="#e9ecef" stroke-width="1" rx="6" shadow="sm" />
            <line x1="645" y1="40" x2="665" y2="40" stroke="#FF3366" stroke-width="3" />
            <text x="675" y="44" font-family="Inter" font-size="12" fill="#495057">Object</text>
            
            <line x1="645" y1="62" x2="665" y2="62" stroke="#4361EE" stroke-width="3" />
            <text x="675" y="66" font-family="Inter" font-size="12" fill="#495057">Real Image</text>
            
            <line x1="645" y1="84" x2="665" y2="84" stroke="#FFD700" stroke-width="3" />
            <text x="675" y="88" font-family="Inter" font-size="12" fill="#495057">Light Rays</text>

            <!-- Principal Axis -->
            <line x1="0" y1="250" x2="800" y2="250" stroke="#ADB5BD" stroke-width="2" />

            <!-- Focal Points Ticks -->
            <path d="M 200 244 L 200 256 M 300 244 L 300 256 M 500 244 L 500 256 M 600 244 L 600 256" stroke="#6C757D" stroke-width="2" />
            
            <!-- Focal Points Labels -->
            <text x="200" y="275" text-anchor="middle" font-family="Inter" font-size="14" fill="#495057" font-weight="600">2F₁</text>
            <text x="300" y="275" text-anchor="middle" font-family="Inter" font-size="14" fill="#495057" font-weight="600">F₁</text>
            <text x="500" y="275" text-anchor="middle" font-family="Inter" font-size="14" fill="#495057" font-weight="600">F₂</text>
            <text x="600" y="275" text-anchor="middle" font-family="Inter" font-size="14" fill="#495057" font-weight="600">2F₂</text>

            <!-- Lens -->
            <path d="M 400 120 Q 440 250 400 380 Q 360 250 400 120 Z" fill="rgba(202, 240, 248, 0.5)" stroke="#00B4D8" stroke-width="2" />
            <line x1="400" y1="100" x2="400" y2="400" stroke="#00B4D8" stroke-width="1.5" stroke-dasharray="6,6" />
            <text x="400" y="110" text-anchor="middle" font-family="Inter" font-size="14" fill="#00B4D8" font-weight="600">Lens</text>

            <!-- Object Label -->
            <text x="235" y="205" font-family="Inter" font-size="16" fill="#FF3366" font-style="italic" font-weight="600">O</text>
            <!-- Image Label -->
            <text x="715" y="345" font-family="Inter" font-size="16" fill="#4361EE" font-style="italic" font-weight="600">I'</text>
        </g>

        <!-- Dynamic Elements -->
        <g>
            <!-- Screen (Slides up and down) -->
            <rect x="695" y="130" width="10" height="240" fill="rgba(173, 181, 189, 0.25)" stroke="#6C757D" stroke-width="1.5" rx="3" class="anim-screen" />
            
            <!-- Object Arrow -->
            <line x1="250" y1="250" x2="250" y2="212" stroke="#FF3366" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowObj)" class="anim-object" />

            <!-- Light Rays -->
            <g filter="url(#glow)">
                <!-- Ray 1: Parallel -->
                <path id="ray1" d="M 250 210 L 400 210 L 700 330 L 800 370" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anim-ray1" />
                <!-- Ray 2: Chief -->
                <path id="ray2" d="M 250 210 L 400 250 L 700 330 L 800 356.67" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anim-ray2" />
                <!-- Ray 3: Focal -->
                <path id="ray3" d="M 250 210 L 400 330 L 700 330 L 800 330" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="anim-ray3" />
            </g>

            <!-- Traveling Pulses on Rays -->
            <circle r="4" fill="#FFFFFF" stroke="#FF7F00" stroke-width="2" class="anim-pulse1" />
            <circle r="4" fill="#FFFFFF" stroke="#FF7F00" stroke-width="2" class="anim-pulse2" />
            <circle r="4" fill="#FFFFFF" stroke="#FF7F00" stroke-width="2" class="anim-pulse3" />

            <!-- Image Arrow -->
            <line x1="700" y1="250" x2="700" y2="328" stroke="#4361EE" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowImg)" class="anim-image" />

            <!-- Dynamic Educational Text -->
            <text x="400" y="445" text-anchor="middle" font-family="Inter" font-size="16" fill="#495057" class="anim-text1">A real image is formed by the actual convergence of light rays.</text>
            <text x="400" y="470" text-anchor="middle" font-family="Inter" font-size="16" fill="#4361EE" font-weight="600" class="anim-text2">It exists in space whether the screen is present or not.</text>
        </g>
    </svg>
</div>

</body>
</html>
