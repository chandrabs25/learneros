<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass Defect Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #6c757d; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 14px; fill: #495057; }
        .math-bold { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; }
        .legend-text { font-size: 13px; fill: #495057; }

        /* Animations */
        .beam {
            transform-origin: 400px 300px;
            animation: beamTilt 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .left-pan {
            transform-origin: 200px 300px;
            animation: panCounterTilt 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .right-pan {
            transform-origin: 600px 300px;
            animation: panCounterTilt 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .moving-nucleons {
            animation: flyNucleons 12s ease-in-out infinite;
        }

        .nucleus-container {
            animation: showNucleus 12s ease-in-out infinite;
        }

        .nucleus-vibrate {
            animation: vibrate 0.2s linear infinite;
        }

        .energy-ring-1 {
            transform-origin: 0px -19px;
            animation: flashRing1 12s ease-out infinite;
        }

        .energy-ring-2 {
            transform-origin: 0px -19px;
            animation: flashRing2 12s ease-out infinite;
        }

        .energy-label {
            animation: flyText 12s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
        }

        .annotations {
            animation: showAnnotations 12s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes beamTilt {
            0%, 35% { transform: rotate(-15deg); }
            40%, 85% { transform: rotate(-5deg); }
            95%, 100% { transform: rotate(-15deg); }
        }

        @keyframes panCounterTilt {
            0%, 35% { transform: rotate(15deg); }
            40%, 85% { transform: rotate(5deg); }
            95%, 100% { transform: rotate(15deg); }
        }

        @keyframes flyNucleons {
            0%, 20% { transform: translate(207px, 407px); opacity: 0; }
            22% { opacity: 0.9; }
            32% { transform: translate(593px, 309px); opacity: 0.9; }
            33%, 100% { opacity: 0; transform: translate(593px, 309px); }
        }

        @keyframes showNucleus {
            0%, 31% { opacity: 0; transform: scale(1.5); }
            33% { opacity: 1; transform: scale(1); }
            85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(1px, -0.5px); }
            50% { transform: translate(-0.5px, 1px); }
            75% { transform: translate(-1px, -1px); }
        }

        @keyframes flashRing1 {
            0%, 32% { transform: scale(0.1); opacity: 0; stroke-width: 8px; }
            33% { opacity: 1; }
            40% { transform: scale(3.5); opacity: 0; stroke-width: 1px; }
            41%, 100% { opacity: 0; }
        }

        @keyframes flashRing2 {
            0%, 33% { transform: scale(0.1); opacity: 0; stroke-width: 8px; }
            34% { opacity: 1; }
            42% { transform: scale(4.5); opacity: 0; stroke-width: 1px; }
            43%, 100% { opacity: 0; }
        }

        @keyframes flyText {
            0%, 33% { opacity: 0; transform: translate(600px, 280px) scale(0.5); }
            38% { opacity: 1; transform: translate(660px, 210px) scale(1.1); }
            42%, 85% { opacity: 1; transform: translate(660px, 210px) scale(1); }
            90%, 100% { opacity: 0; }
        }

        @keyframes showAnnotations {
            0%, 40% { opacity: 0; }
            45%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Shadows -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.15"/>
            </filter>
            <filter id="light-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.1"/>
            </filter>

            <!-- Nucleons -->
            <g id="proton">
                <circle cx="0" cy="0" r="12" fill="#FF3366" filter="url(#shadow)"/>
                <path d="M-6,0 H6 M0,-6 V6" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            <g id="neutron">
                <circle cx="0" cy="0" r="13" fill="#4361EE" filter="url(#shadow)"/>
            </g>

            <!-- Loose Nucleons (Left Pan & Moving) -->
            <g id="loose-nucleons">
                <use href="#proton" x="-18" y="-12"/>
                <use href="#neutron" x="18" y="-13"/>
                <use href="#proton" x="-8" y="-35"/>
                <use href="#neutron" x="12" y="-36"/>
            </g>

            <!-- Packed Nucleus (Right Pan) -->
            <g id="packed-nucleus">
                <use href="#neutron" x="-10" y="-28"/>
                <use href="#proton" x="10" y="-28"/>
                <use href="#proton" x="-10" y="-10"/>
                <use href="#neutron" x="10" y="-10"/>
            </g>

            <!-- Pan Structure -->
            <g id="pan-structure">
                <line x1="0" y1="0" x2="-40" y2="80" stroke="#adb5bd" stroke-width="2"/>
                <line x1="0" y1="0" x2="40" y2="80" stroke="#adb5bd" stroke-width="2"/>
                <path d="M -50 80 Q 0 100 50 80 Z" fill="#e9ecef" stroke="#ced4da" stroke-width="2" filter="url(#light-shadow)"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- Header & Legend -->
        <text x="400" y="50" text-anchor="middle" class="title">Mass Defect (Δm) in Nuclei</text>
        <text x="400" y="75" text-anchor="middle" class="subtitle">The mass of a nucleus is less than the sum of its constituent nucleons.</text>

        <g transform="translate(680, 35)">
            <rect x="-15" y="-15" width="110" height="60" rx="6" fill="#f8f9fa" stroke="#e9ecef"/>
            <use href="#proton" x="0" y="0" transform="scale(0.7)"/>
            <text x="15" y="4" class="legend-text">Proton</text>
            <use href="#neutron" x="0" y="25" transform="scale(0.7)"/>
            <text x="15" y="29" class="legend-text">Neutron</text>
        </g>

        <!-- Static Labels -->
        <text x="200" y="140" text-anchor="middle" class="math">∑m = Z·m_p + (A-Z)·m_n</text>
        <text x="600" y="140" text-anchor="middle" class="math">M_nucleus</text>

        <!-- Scale Base -->
        <path d="M 380 440 L 420 440 L 405 300 L 395 300 Z" fill="#6c757d" filter="url(#shadow)"/>
        <rect x="340" y="440" width="120" height="12" rx="6" fill="#495057" filter="url(#shadow)"/>
        <circle cx="400" cy="300" r="6" fill="#212529"/>

        <!-- Dynamic Scale Assembly -->
        <g class="beam">
            <!-- Balance Beam -->
            <line x1="200" y1="300" x2="600" y2="300" stroke="#495057" stroke-width="8" stroke-linecap="round" filter="url(#shadow)"/>
            
            <!-- Left Pan -->
            <g class="left-pan">
                <g transform="translate(200, 300)">
                    <use href="#pan-structure"/>
                    <g transform="translate(0, 80)">
                        <use href="#loose-nucleons"/>
                    </g>
                </g>
            </g>

            <!-- Right Pan -->
            <g class="right-pan">
                <g transform="translate(600, 300)">
                    <use href="#pan-structure"/>
                    <g transform="translate(0, 80)">
                        <!-- Assembled Nucleus -->
                        <g class="nucleus-container">
                            <g class="nucleus-vibrate">
                                <use href="#packed-nucleus"/>
                            </g>
                        </g>
                        <!-- Energy Flash Rings -->
                        <circle cx="0" cy="-19" r="20" stroke="#F77F00" fill="none" class="energy-ring-1"/>
                        <circle cx="0" cy="-19" r="20" stroke="#F77F00" fill="none" class="energy-ring-2"/>
                    </g>
                </g>
            </g>
        </g>

        <!-- Moving Nucleons (Global Space) -->
        <g class="moving-nucleons">
            <use href="#loose-nucleons"/>
        </g>

        <!-- Annotations (Appear in Phase 3) -->
        <g class="annotations">
            <!-- Mass Defect Indicator Lines -->
            <line x1="201" y1="397" x2="400" y2="397" stroke="#FF3366" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
            <line x1="599" y1="363" x2="400" y2="363" stroke="#4361EE" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>
            
            <!-- Delta m Bracket -->
            <path d="M 385 397 L 400 397 L 400 363 L 385 363" fill="none" stroke="#06D6A0" stroke-width="3" stroke-linejoin="round"/>
            <text x="410" y="384" class="math-bold" fill="#06D6A0">Δm</text>

            <!-- Bottom Equation -->
            <rect x="250" y="460" width="300" height="30" rx="4" fill="#e9ecef" opacity="0.8"/>
            <text x="400" y="480" text-anchor="middle" class="math-bold" fill="#212529">Δm = ∑m - M_nucleus > 0</text>
        </g>

        <!-- Energy Formula (Flies out with flash) -->
        <g class="energy-label">
            <rect x="-10" y="-18" width="120" height="28" rx="4" fill="#fff3e0" stroke="#F77F00" stroke-width="1"/>
            <text x="50" y="2" text-anchor="middle" class="math-bold" fill="#F77F00">E_b = Δmc²</text>
        </g>

    </svg>
</div>

</body>
</html>
