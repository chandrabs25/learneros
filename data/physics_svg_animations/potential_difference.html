<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Potential Hill: Visualizing Kirchhoff's Loop Rule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        
        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        text {
            user-select: none;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        /* Circuit Charge Animation */
        @keyframes circMotion {
            0%      { transform: translate(100px, 200px); }
            3.47%   { transform: translate(100px, 150px); }
            4.86%   { transform: translate(100px, 130px); }
            8.33%   { transform: translate(100px, 80px); }
            18.75%  { transform: translate(250px, 80px); }
            25.69%  { transform: translate(350px, 80px); }
            36.11%  { transform: translate(500px, 80px); }
            43.06%  { transform: translate(600px, 80px); }
            50.00%  { transform: translate(700px, 80px); }
            58.33%  { transform: translate(700px, 200px); }
            100%    { transform: translate(100px, 200px); }
        }

        /* Graph Charge Animation */
        @keyframes graphMotion {
            0%      { transform: translate(100px, 450px); }
            3.47%   { transform: translate(100px, 450px); }
            4.86%   { transform: translate(100px, 300px); }
            8.33%   { transform: translate(100px, 300px); }
            18.75%  { transform: translate(250px, 300px); }
            25.69%  { transform: translate(350px, 350px); }
            36.11%  { transform: translate(500px, 350px); }
            43.06%  { transform: translate(600px, 450px); }
            50.00%  { transform: translate(700px, 450px); }
            58.33%  { transform: translate(700px, 450px); }
            100%    { transform: translate(100px, 450px); }
        }

        .circ-charge {
            animation: circMotion 10s linear infinite;
        }

        .graph-charge {
            animation: graphMotion 10s linear infinite;
        }

        .glow-effect {
            filter: drop-shadow(0px 0px 6px rgba(67, 97, 238, 0.6));
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Electric Field -->
            <marker id="arrow-efield" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            
            <!-- Arrowhead for Current -->
            <marker id="arrow-current" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>

            <!-- Arrowhead for Axes -->
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="30" y="35" font-family="Inter" font-weight="700" font-size="22" fill="#212529">Potential Difference &amp; Energy Conservation</text>
        <text x="30" y="55" font-family="Inter" font-weight="400" font-size="14" fill="#6c757d">Visualizing Kirchhoff's Loop Rule</text>

        <!-- Legend -->
        <g transform="translate(610, 15)">
            <rect width="170" height="100" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
            <text x="10" y="20" font-family="Inter" font-weight="600" font-size="12" fill="#212529">Legend</text>
            
            <circle cx="20" cy="40" r="5" fill="#FF3366" />
            <text x="35" y="44" font-family="Inter" font-size="12" fill="#495057">Positive Charge (q⁺)</text>
            
            <line x1="12" y1="60" x2="28" y2="60" stroke="#4361EE" stroke-width="3" />
            <text x="35" y="64" font-family="Inter" font-size="12" fill="#495057">Electric Potential (V)</text>
            
            <line x1="12" y1="80" x2="28" y2="80" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-efield)" />
            <text x="35" y="84" font-family="Inter" font-size="12" fill="#495057">Electric Field (E)</text>
        </g>

        <!-- ==================== ALIGNMENT GUIDES ==================== -->
        <g stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4">
            <line x1="100" y1="220" x2="100" y2="450" />
            <line x1="250" y1="100" x2="250" y2="300" />
            <line x1="350" y1="100" x2="350" y2="350" />
            <line x1="500" y1="100" x2="500" y2="350" />
            <line x1="600" y1="100" x2="600" y2="450" />
            <line x1="700" y1="220" x2="700" y2="450" />
        </g>

        <!-- ==================== GRAPH SECTION (BOTTOM) ==================== -->
        <!-- Graph Grid Lines -->
        <g stroke="#f1f3f5" stroke-width="1">
            <line x1="80" y1="300" x2="720" y2="300" />
            <line x1="80" y1="350" x2="720" y2="350" />
            <line x1="80" y1="400" x2="720" y2="400" />
        </g>

        <!-- Graph Area Fill -->
        <path d="M 100 450 L 100 300 L 250 300 L 350 350 L 500 350 L 600 450 L 700 450 Z" fill="#4361EE" opacity="0.08" />

        <!-- Graph Axes -->
        <line x1="80" y1="450" x2="740" y2="450" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow-axis)" />
        <line x1="100" y1="470" x2="100" y2="260" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow-axis)" />
        
        <!-- Axes Labels -->
        <text x="400" y="485" font-family="Inter" font-size="14" fill="#495057" text-anchor="middle">Position in Circuit (x)</text>
        <text x="-360" y="60" font-family="Inter" font-size="14" fill="#495057" text-anchor="middle" transform="rotate(-90)">Electric Potential (V)</text>

        <!-- Potential Line (The Hill) -->
        <path d="M 100 450 L 100 300 L 250 300 L 350 350 L 500 350 L 600 450 L 700 450" fill="none" stroke="#4361EE" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="glow-effect" />

        <!-- Graph Annotations -->
        <text x="75" y="305" font-family="Roboto Mono" font-size="14" fill="#4361EE" font-weight="bold">V<tspan dy="3" font-size="10">max</tspan></text>
        <text x="80" y="445" font-family="Roboto Mono" font-size="14" fill="#6c757d">0V</text>
        
        <text x="50" y="375" font-family="Roboto Mono" font-size="14" fill="#FF3366" font-weight="bold">+V</text>
        <text x="300" y="340" font-family="Roboto Mono" font-size="14" fill="#212529" text-anchor="middle">&Delta;V<tspan dy="3" font-size="10">1</tspan><tspan dy="-3"> = -IR</tspan><tspan dy="3" font-size="10">1</tspan></text>
        <text x="550" y="415" font-family="Roboto Mono" font-size="14" fill="#212529" text-anchor="middle">&Delta;V<tspan dy="3" font-size="10">2</tspan><tspan dy="-3"> = -IR</tspan><tspan dy="3" font-size="10">2</tspan></text>

        <!-- ==================== CIRCUIT SECTION (TOP) ==================== -->
        
        <!-- Circuit Wires -->
        <path d="M 100 150 L 100 200 L 700 200 L 700 80 L 600 80" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 500 80 L 350 80" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 250 80 L 100 80 L 100 130" fill="none" stroke="#212529" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Resistor 1 -->
        <path d="M 250 80 L 258.3 65 L 275 95 L 291.6 65 L 308.3 95 L 325 65 L 341.6 95 L 350 80" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" />
        
        <!-- Resistor 2 -->
        <path d="M 500 80 L 508.3 65 L 525 95 L 541.6 65 L 558.3 95 L 575 65 L 591.6 95 L 600 80" fill="none" stroke="#212529" stroke-width="3" stroke-linejoin="round" />

        <!-- Battery -->
        <line x1="75" y1="130" x2="125" y2="130" stroke="#212529" stroke-width="3" stroke-linecap="round" />
        <line x1="85" y1="150" x2="115" y2="150" stroke="#212529" stroke-width="7" stroke-linecap="round" />
        <text x="60" y="135" font-family="Inter" font-size="16" font-weight="bold" fill="#FF3366">+</text>
        <text x="62" y="155" font-family="Inter" font-size="16" font-weight="bold" fill="#4361EE">-</text>

        <!-- Circuit Labels -->
        <text x="45" y="145" font-family="Roboto Mono" font-size="16" fill="#212529" font-weight="bold">V<tspan dy="3" font-size="11">s</tspan></text>
        <text x="300" y="115" font-family="Roboto Mono" font-size="16" fill="#212529" font-weight="bold" text-anchor="middle">R<tspan dy="3" font-size="11">1</tspan></text>
        <text x="550" y="115" font-family="Roboto Mono" font-size="16" fill="#212529" font-weight="bold" text-anchor="middle">R<tspan dy="3" font-size="11">2</tspan></text>

        <!-- Nodes -->
        <circle cx="100" cy="80" r="4" fill="#212529" />
        <text x="85" y="75" font-family="Inter" font-size="14" font-weight="bold" fill="#212529">a</text>
        
        <circle cx="425" cy="80" r="4" fill="#212529" />
        <text x="420" y="70" font-family="Inter" font-size="14" font-weight="bold" fill="#212529">b</text>
        
        <circle cx="700" cy="80" r="4" fill="#212529" />
        <text x="710" y="75" font-family="Inter" font-size="14" font-weight="bold" fill="#212529">c</text>
        
        <circle cx="100" cy="200" r="4" fill="#212529" />
        <text x="85" y="215" font-family="Inter" font-size="14" font-weight="bold" fill="#212529">d</text>

        <!-- Electric Field Vectors -->
        <line x1="280" y1="50" x2="320" y2="50" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-efield)" />
        <text x="300" y="42" font-family="Inter" font-size="14" font-weight="bold" fill="#F77F00" text-anchor="middle">E</text>

        <line x1="530" y1="50" x2="570" y2="50" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-efield)" />
        <text x="550" y="42" font-family="Inter" font-size="14" font-weight="bold" fill="#F77F00" text-anchor="middle">E</text>

        <!-- Current Indicator -->
        <line x1="150" y1="80" x2="190" y2="80" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-current)" />
        <text x="170" y="70" font-family="Inter" font-size="14" font-weight="bold" fill="#06D6A0" text-anchor="middle">I</text>

        <!-- Kirchhoff's Loop Rule Formula -->
        <g transform="translate(400, 150)">
            <rect x="-140" y="-25" width="280" height="40" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1" />
            <text x="0" y="0" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#212529" text-anchor="middle">
                &Sigma; &Delta;V = V<tspan dy="5" font-size="12">s</tspan><tspan dy="-5"> - IR</tspan><tspan dy="5" font-size="12">1</tspan><tspan dy="-5"> - IR</tspan><tspan dy="5" font-size="12">2</tspan><tspan dy="-5"> = 0</tspan>
            </text>
        </g>

        <!-- ==================== ANIMATED CHARGES ==================== -->
        
        <!-- Charge 1 -->
        <circle cx="0" cy="0" r="6" fill="#FF3366" class="circ-charge" style="animation-delay: 0s;" />
        <circle cx="0" cy="0" r="6" fill="#FF3366" stroke="#ffffff" stroke-width="2" class="graph-charge" style="animation-delay: 0s;" />

        <!-- Charge 2 -->
        <circle cx="0" cy="0" r="6" fill="#FF3366" class="circ-charge" style="animation-delay: -2s;" />
        <circle cx="0" cy="0" r="6" fill="#FF3366" stroke="#ffffff" stroke-width="2" class="graph-charge" style="animation-delay: -2s;" />

        <!-- Charge 3 -->
        <circle cx="0" cy="0" r="6" fill="#FF3366" class="circ-charge" style="animation-delay: -4s;" />
        <circle cx="0" cy="0" r="6" fill="#FF3366" stroke="#ffffff" stroke-width="2" class="graph-charge" style="animation-delay: -4s;" />

        <!-- Charge 4 -->
        <circle cx="0" cy="0" r="6" fill="#FF3366" class="circ-charge" style="animation-delay: -6s;" />
        <circle cx="0" cy="0" r="6" fill="#FF3366" stroke="#ffffff" stroke-width="2" class="graph-charge" style="animation-delay: -6s;" />

        <!-- Charge 5 -->
        <circle cx="0" cy="0" r="6" fill="#FF3366" class="circ-charge" style="animation-delay: -8s;" />
        <circle cx="0" cy="0" r="6" fill="#FF3366" stroke="#ffffff" stroke-width="2" class="graph-charge" style="animation-delay: -8s;" />

    </svg>
</div>

</body>
</html>
