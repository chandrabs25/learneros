<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oersted's Discovery & The Right-Hand Rule</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 750px;
        }

        /* Animations */
        @keyframes fadeUpAnim {
            0%, 15% { opacity: 0; }
            18%, 39% { opacity: 1; }
            42%, 100% { opacity: 0; }
        }

        @keyframes fadeDownAnim {
            0%, 56% { opacity: 0; }
            59%, 81% { opacity: 1; }
            84%, 100% { opacity: 0; }
        }

        @keyframes fadeBAnim {
            0%, 15% { opacity: 0; }
            18%, 39% { opacity: 1; }
            42%, 56% { opacity: 0; }
            59%, 81% { opacity: 1; }
            84%, 100% { opacity: 0; }
        }

        @keyframes fadeNeutralAnim {
            0%, 15% { opacity: 1; }
            18%, 39% { opacity: 0; }
            42%, 56% { opacity: 1; }
            59%, 81% { opacity: 0; }
            84%, 100% { opacity: 1; }
        }

        @keyframes compassRotate {
            0%, 15% { transform: rotate(-45deg); }
            18%, 39% { transform: rotate(0deg); }
            42%, 56% { transform: rotate(-45deg); }
            59%, 81% { transform: rotate(-180deg); }
            84%, 100% { transform: rotate(-45deg); }
        }

        @keyframes flowDots {
            0% { stroke-dashoffset: 60; }
            100% { stroke-dashoffset: 0; }
        }

        /* Classes */
        .fade-up { animation: fadeUpAnim 12s infinite ease-in-out; }
        .fade-down { animation: fadeDownAnim 12s infinite ease-in-out; }
        .fade-b { animation: fadeBAnim 12s infinite ease-in-out; }
        .fade-neutral { animation: fadeNeutralAnim 12s infinite ease-in-out; }
        
        .compass-needle {
            animation: compassRotate 12s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .current-flow {
            animation: flowDots 1.5s infinite linear;
        }

        .b-field-line {
            stroke-dasharray: 8 6;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Glow Filter for Current -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrowhead for B-Field -->
            <polygon id="arrow-head" points="-6,-5 6,0 -6,5" fill="#7209B7"/>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" font-family="Inter" font-size="22" font-weight="700" fill="#212529" text-anchor="middle">
            Magnetism: Oersted's Discovery &amp; Field of a Straight Wire
        </text>

        <!-- Legend -->
        <g transform="translate(630, 20)" font-family="Inter" font-size="12" fill="#495057">
            <rect x="-10" y="-10" width="150" height="85" fill="#ffffff" rx="6" stroke="#dee2e6" stroke-width="1.5"/>
            <circle cx="0" cy="10" r="5" fill="#06D6A0"/>
            <text x="15" y="14" font-weight="600">Current (I)</text>
            <line x1="-5" y1="30" x2="5" y2="30" stroke="#7209B7" stroke-width="2" stroke-dasharray="2 2"/>
            <text x="15" y="34" font-weight="600">Magnetic Field (B)</text>
            <polygon points="-5,55 0,45 5,55" fill="#FF3366"/>
            <polygon points="-5,55 0,65 5,55" fill="#4361EE"/>
            <text x="15" y="54" font-weight="600">Compass (N/S)</text>
        </g>

        <!-- BOTTOM LAYER: Wire and Current below the plane -->
        <line x1="400" y1="280" x2="400" y2="460" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
        
        <!-- Current Up (Bottom) -->
        <line x1="400" y1="460" x2="400" y2="280" class="current-up current-flow fade-up" stroke="#06D6A0" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Current Down (Bottom) -->
        <line x1="400" y1="280" x2="400" y2="460" class="current-down current-flow fade-down" stroke="#06D6A0" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" filter="url(#glow)"/>

        <!-- MIDDLE LAYER: 3D Plane and B-Field -->
        <g transform="translate(400, 280)">
            <!-- Translucent Plane -->
            <polygon points="-220,-120 220,-120 320,120 -320,120" fill="#e9ecef" stroke="#ced4da" stroke-width="2" opacity="0.85"/>
            
            <!-- Scaled group for 3D perspective of circles -->
            <g transform="scale(1, 0.4)">
                
                <!-- B-Field Concentric Circles -->
                <g class="fade-b">
                    <circle cx="0" cy="0" r="40" fill="none" stroke="#7209B7" stroke-width="2" class="b-field-line" opacity="0.9"/>
                    <circle cx="0" cy="0" r="70" fill="none" stroke="#7209B7" stroke-width="2" class="b-field-line" opacity="0.7"/>
                    <circle cx="0" cy="0" r="110" fill="none" stroke="#7209B7" stroke-width="2" class="b-field-line" opacity="0.5"/>
                    <circle cx="0" cy="0" r="160" fill="none" stroke="#7209B7" stroke-width="2" class="b-field-line" opacity="0.3"/>
                </g>

                <!-- B-Field Arrows (Counter-Clockwise / UP) -->
                <g class="fade-up">
                    <!-- r=70 -->
                    <use href="#arrow-head" x="0" y="-70" transform="rotate(180, 0, -70)"/>
                    <use href="#arrow-head" x="0" y="70" transform="rotate(0, 0, 70)"/>
                    <use href="#arrow-head" x="-70" y="0" transform="rotate(90, -70, 0)"/>
                    <use href="#arrow-head" x="70" y="0" transform="rotate(-90, 70, 0)"/>
                    <!-- r=160 -->
                    <use href="#arrow-head" x="0" y="-160" transform="rotate(180, 0, -160)"/>
                    <use href="#arrow-head" x="0" y="160" transform="rotate(0, 0, 160)"/>
                    <use href="#arrow-head" x="-160" y="0" transform="rotate(90, -160, 0)"/>
                    <use href="#arrow-head" x="160" y="0" transform="rotate(-90, 160, 0)"/>
                </g>

                <!-- B-Field Arrows (Clockwise / DOWN) -->
                <g class="fade-down">
                    <!-- r=70 -->
                    <use href="#arrow-head" x="0" y="-70" transform="rotate(0, 0, -70)"/>
                    <use href="#arrow-head" x="0" y="70" transform="rotate(180, 0, 70)"/>
                    <use href="#arrow-head" x="-70" y="0" transform="rotate(-90, -70, 0)"/>
                    <use href="#arrow-head" x="70" y="0" transform="rotate(90, 70, 0)"/>
                    <!-- r=160 -->
                    <use href="#arrow-head" x="0" y="-160" transform="rotate(0, 0, -160)"/>
                    <use href="#arrow-head" x="0" y="160" transform="rotate(180, 0, 160)"/>
                    <use href="#arrow-head" x="-160" y="0" transform="rotate(-90, -160, 0)"/>
                    <use href="#arrow-head" x="160" y="0" transform="rotate(90, 160, 0)"/>
                </g>

                <!-- Compass -->
                <g transform="translate(110, 0)">
                    <g class="compass-needle">
                        <!-- North Pole -->
                        <polygon points="0,-28 -7,0 0,7 7,0" fill="#FF3366"/>
                        <!-- South Pole -->
                        <polygon points="0,28 -7,0 0,-7 7,0" fill="#4361EE"/>
                        <!-- Center Pin -->
                        <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
                        <!-- Labels -->
                        <text x="0" y="-14" font-family="Inter" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">N</text>
                        <text x="0" y="22" font-family="Inter" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="700">S</text>
                    </g>
                </g>
            </g>
        </g>

        <!-- TOP LAYER: Wire and Current above the plane -->
        <line x1="400" y1="80" x2="400" y2="280" stroke="#495057" stroke-width="8" stroke-linecap="round"/>
        
        <!-- Current Up (Top) -->
        <line x1="400" y1="280" x2="400" y2="80" class="current-up current-flow fade-up" stroke="#06D6A0" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" filter="url(#glow)"/>
        <!-- Current Down (Top) -->
        <line x1="400" y1="80" x2="400" y2="280" class="current-down current-flow fade-down" stroke="#06D6A0" stroke-width="6" stroke-dasharray="0 30" stroke-linecap="round" filter="url(#glow)"/>

        <!-- Right-Hand Rule Overlay (UP) -->
        <g class="fade-up" transform="translate(410, 150)">
            <g fill="#fca311" opacity="0.85">
                <!-- Palm -->
                <rect x="10" y="-15" width="20" height="30" rx="5"/>
                <!-- Fingers wrapping around wire -->
                <rect x="-15" y="-10" width="25" height="8" rx="4"/>
                <rect x="-18" y="0" width="28" height="8" rx="4"/>
                <rect x="-15" y="10" width="25" height="8" rx="4"/>
                <!-- Thumb pointing UP -->
                <path d="M 15,-10 L 15,-35 A 6,6 0 0,1 27,-35 L 27,-10 Z"/>
            </g>
            <text x="45" y="0" font-family="Inter" font-size="13" fill="#e85d04" font-weight="700">Right-Hand Rule</text>
        </g>

        <!-- Right-Hand Rule Overlay (DOWN) -->
        <g class="fade-down" transform="translate(390, 350)">
            <g fill="#fca311" opacity="0.85" transform="rotate(180)">
                <!-- Palm -->
                <rect x="10" y="-15" width="20" height="30" rx="5"/>
                <!-- Fingers wrapping around wire -->
                <rect x="-15" y="-10" width="25" height="8" rx="4"/>
                <rect x="-18" y="0" width="28" height="8" rx="4"/>
                <rect x="-15" y="10" width="25" height="8" rx="4"/>
                <!-- Thumb pointing DOWN (relative to rotated group) -->
                <path d="M 15,-10 L 15,-35 A 6,6 0 0,1 27,-35 L 27,-10 Z"/>
            </g>
            <text x="-145" y="0" font-family="Inter" font-size="13" fill="#e85d04" font-weight="700">Right-Hand Rule</text>
        </g>

        <!-- Labels and Annotations -->
        
        <!-- Current Label (UP) -->
        <g class="fade-up">
            <text x="365" y="150" font-family="Inter" font-size="22" font-style="italic" fill="#06D6A0" font-weight="700">I</text>
            <path d="M 370,125 L 370,95 M 363,105 L 370,95 L 377,105" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Current Label (DOWN) -->
        <g class="fade-down">
            <text x="365" y="380" font-family="Inter" font-size="22" font-style="italic" fill="#06D6A0" font-weight="700">I</text>
            <path d="M 370,390 L 370,420 M 363,410 L 370,420 L 377,410" stroke="#06D6A0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- B-Field Label -->
        <g class="fade-b">
            <text x="580" y="265" font-family="Inter" font-size="22" font-style="italic" fill="#7209B7" font-weight="700">B</text>
            <path d="M 580,245 L 594,245 M 589,241 L 594,245 L 589,249" stroke="#7209B7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Formula Box -->
        <g transform="translate(620, 410)">
            <rect x="0" y="0" width="150" height="65" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1.5"/>
            <text x="20" y="38" font-family="'Roboto Mono', monospace" font-size="18" fill="#212529" font-weight="600">
                <tspan x="15" y="38">B = </tspan>
                <tspan x="65" y="25">μ₀I</tspan>
                <tspan x="60" y="50">2πr</tspan>
            </text>
            <line x1="55" y1="32" x2="105" y2="32" stroke="#212529" stroke-width="2"/>
        </g>

        <!-- Instructional Text Box -->
        <g transform="translate(30, 415)">
            <rect x="0" y="0" width="320" height="60" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1.5"/>
            
            <!-- Neutral State Text -->
            <text x="160" y="35" font-family="Inter" font-size="15" fill="#6c757d" text-anchor="middle" class="fade-neutral" font-weight="600">
                No Current → No Magnetic Field
            </text>
            
            <!-- Up State Text -->
            <text x="160" y="35" font-family="Inter" font-size="15" fill="#06D6A0" text-anchor="middle" class="fade-up" font-weight="700">
                Current Up → B-field Counter-clockwise
            </text>
            
            <!-- Down State Text -->
            <text x="160" y="35" font-family="Inter" font-size="15" fill="#06D6A0" text-anchor="middle" class="fade-down" font-weight="700">
                Current Down → B-field Clockwise
            </text>
        </g>

    </svg>
</body>
</html>
