<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Heat Engine Diagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .label { font-size: 16px; font-weight: 600; fill: #ffffff; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 600; }
        .note { font-size: 13px; fill: #6C757D; font-style: italic; }
        .legend-text { font-size: 12px; fill: #495057; font-weight: 600; }

        /* Animations */
        @keyframes flow-qh {
            0% { stroke-dashoffset: 0; opacity: 0; }
            5% { opacity: 1; }
            20% { opacity: 1; }
            25% { stroke-dashoffset: -120; opacity: 0; }
            100% { stroke-dashoffset: -120; opacity: 0; }
        }

        @keyframes flow-w {
            0%, 25% { stroke-dashoffset: 0; opacity: 0; }
            30% { opacity: 1; }
            45% { opacity: 1; }
            50% { stroke-dashoffset: -120; opacity: 0; }
            100% { stroke-dashoffset: -120; opacity: 0; }
        }

        @keyframes flow-ql {
            0%, 50% { stroke-dashoffset: 0; opacity: 0; }
            55% { opacity: 1; }
            70% { opacity: 1; }
            75% { stroke-dashoffset: -120; opacity: 0; }
            100% { stroke-dashoffset: -120; opacity: 0; }
        }

        @keyframes piston-move {
            0%, 25% { transform: translateX(0); }
            50% { transform: translateX(60px); }
            100% { transform: translateX(0); }
        }

        @keyframes gas-expand {
            0%, 25% { width: 5px; opacity: 0.2; }
            50% { width: 65px; opacity: 0.4; }
            100% { width: 5px; opacity: 0.2; }
        }

        @keyframes engine-glow {
            0%, 100% { fill: url(#gradEngine); filter: drop-shadow(0 0 0px rgba(255, 209, 102, 0)); }
            12.5% { fill: #FFE082; filter: drop-shadow(0 0 15px rgba(255, 51, 102, 0.6)); }
            37.5% { fill: #FFE082; filter: drop-shadow(0 0 15px rgba(6, 214, 160, 0.6)); }
            62.5% { fill: #FFE082; filter: drop-shadow(0 0 15px rgba(67, 97, 238, 0.6)); }
            75% { fill: url(#gradEngine); filter: drop-shadow(0 0 0px rgba(255, 209, 102, 0)); }
        }

        @keyframes w-pulse {
            0%, 25%, 50%, 100% { stroke-width: 8; }
            37.5% { stroke-width: 12; }
        }

        /* Apply Animations */
        .anim-qh { animation: flow-qh 4s linear infinite; }
        .anim-w { animation: flow-w 4s linear infinite; }
        .anim-ql { animation: flow-ql 4s linear infinite; }
        .anim-piston { animation: piston-move 4s ease-in-out infinite; }
        .anim-gas { animation: gas-expand 4s ease-in-out infinite; }
        .anim-engine { animation: engine-glow 4s linear infinite; }
        .anim-w-arrow { animation: w-pulse 4s ease-in-out infinite; }

        /* Interactivity */
        .interactive-group { cursor: pointer; }
        
        .eff-box rect {
            transition: all 0.3s ease;
        }
        .eff-box text {
            transition: all 0.3s ease;
        }

        .interactive-group:hover ~ .eff-box rect {
            stroke: #FFD166;
            stroke-width: 3px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }
        .interactive-group:hover ~ .eff-box text.highlight {
            fill: #E60039;
            font-weight: 700;
        }

        svg:has(.interactive-group:hover) * {
            animation-play-state: paused !important;
        }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Animated Heat Engine Diagram</title>
        <desc id="svgDesc">An animated thermodynamic diagram showing energy flowing from a hot reservoir to a cold reservoir through an engine, which extracts a portion of the energy to do mechanical work on a piston.</desc>

        <defs>
            <!-- Gradients -->
            <linearGradient id="gradHot" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FF4D79" />
                <stop offset="100%" stop-color="#E60039" />
            </linearGradient>
            <linearGradient id="gradCold" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#5C7CFA" />
                <stop offset="100%" stop-color="#364FC7" />
            </linearGradient>
            <linearGradient id="gradEngine" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE066" />
                <stop offset="100%" stop-color="#F5B700" />
            </linearGradient>

            <!-- Arrowheads -->
            <marker id="arrowRed" markerWidth="24" markerHeight="24" refX="20" refY="12" orient="auto" markerUnits="userSpaceOnUse">
                <polygon points="0 0, 24 12, 0 24" fill="#FF3366" />
            </marker>
            <marker id="arrowBlue" markerWidth="20" markerHeight="20" refX="16" refY="10" orient="auto" markerUnits="userSpaceOnUse">
                <polygon points="0 0, 20 10, 0 20" fill="#4361EE" />
            </marker>
            <marker id="arrowGreen" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse">
                <polygon points="0 0, 18 9, 0 18" fill="#06D6A0" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" class="title">Heat Engine: Energy Flow &amp; Second Law</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect width="160" height="90" rx="6" fill="#ffffff" stroke="#CED4DA" stroke-width="1.5" />
            <circle cx="20" cy="25" r="5" fill="#FF3366" />
            <text x="35" y="29" class="legend-text">Heat Input (Q<tspan baseline-shift="sub" font-size="0.7em">H</tspan>)</text>
            <circle cx="20" cy="45" r="5" fill="#06D6A0" />
            <text x="35" y="49" class="legend-text">Work Output (W)</text>
            <circle cx="20" cy="65" r="5" fill="#4361EE" />
            <text x="35" y="69" class="legend-text">Waste Heat (Q<tspan baseline-shift="sub" font-size="0.7em">L</tspan>)</text>
        </g>

        <!-- Static Base Elements -->
        <!-- Hot Reservoir -->
        <rect x="280" y="60" width="240" height="60" rx="12" fill="url(#gradHot)" stroke="#C9002B" stroke-width="2" />
        <text x="400" y="96" text-anchor="middle" class="label">Hot Reservoir (T<tspan baseline-shift="sub" font-size="0.7em">H</tspan>)</text>

        <!-- Cold Reservoir -->
        <rect x="280" y="380" width="240" height="60" rx="12" fill="url(#gradCold)" stroke="#2B3A9C" stroke-width="2" />
        <text x="400" y="416" text-anchor="middle" class="label">Cold Reservoir (T<tspan baseline-shift="sub" font-size="0.7em">L</tspan>)</text>

        <!-- Piston Cylinder -->
        <path d="M 760 210 L 620 210 L 620 290 L 760 290" fill="#ffffff" stroke="#CED4DA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Expanding Gas -->
        <rect x="623" y="213" width="5" height="74" fill="#06D6A0" class="anim-gas" />

        <!-- Piston Moving Parts -->
        <g class="anim-piston">
            <rect x="628" y="213" width="20" height="74" rx="2" fill="#6C757D" />
            <line x1="648" y1="250" x2="750" y2="250" stroke="#6C757D" stroke-width="10" stroke-linecap="round" />
            <!-- Piston Rings -->
            <line x1="634" y1="213" x2="634" y2="287" stroke="#495057" stroke-width="2" />
            <line x1="642" y1="213" x2="642" y2="287" stroke="#495057" stroke-width="2" />
        </g>

        <!-- Energy Flow Arrows (Semi-transparent shafts) -->
        <!-- QH Arrow (Width 20) -->
        <line x1="400" y1="120" x2="400" y2="175" stroke="rgba(255, 51, 102, 0.25)" stroke-width="20" marker-end="url(#arrowRed)" />
        <!-- QL Arrow (Width 12) -->
        <line x1="400" y1="300" x2="400" y2="355" stroke="rgba(67, 97, 238, 0.25)" stroke-width="12" marker-end="url(#arrowBlue)" />
        <!-- W Arrow (Width 8) -->
        <line x1="450" y1="250" x2="585" y2="250" stroke="rgba(6, 214, 160, 0.3)" class="anim-w-arrow" marker-end="url(#arrowGreen)" />

        <!-- Flowing Particles -->
        <!-- QH Particles -->
        <line x1="400" y1="110" x2="400" y2="200" stroke="#FF3366" stroke-width="6" stroke-dasharray="0 15" stroke-linecap="round" class="anim-qh" />
        <!-- W Particles -->
        <line x1="450" y1="250" x2="600" y2="250" stroke="#06D6A0" stroke-width="6" stroke-dasharray="0 15" stroke-linecap="round" class="anim-w" />
        <!-- QL Particles -->
        <line x1="400" y1="300" x2="400" y2="380" stroke="#4361EE" stroke-width="6" stroke-dasharray="0 15" stroke-linecap="round" class="anim-ql" />

        <!-- Engine & Interactivity Group -->
        <g class="interactive-group">
            <!-- Engine Circle -->
            <circle cx="400" cy="250" r="50" class="anim-engine" stroke="#E0A800" stroke-width="4" />
            <text x="400" y="255" text-anchor="middle" font-size="16" font-weight="700" fill="#212529">Engine</text>
            <!-- Invisible Hitbox for Hover -->
            <circle cx="400" cy="250" r="70" fill="transparent" />
        </g>

        <!-- Efficiency Formula Box (Reacts to Engine Hover) -->
        <g class="eff-box" transform="translate(20, 350)">
            <rect width="210" height="90" rx="8" fill="#ffffff" stroke="#CED4DA" stroke-width="1.5" />
            <text x="105" y="25" text-anchor="middle" class="math highlight" font-size="14">Thermal Efficiency</text>
            <text x="105" y="50" text-anchor="middle" class="math" fill="#333333">η = W / Q<tspan baseline-shift="sub" font-size="0.7em">H</tspan></text>
            <text x="105" y="75" text-anchor="middle" class="math" fill="#333333">= 1 - Q<tspan baseline-shift="sub" font-size="0.7em">L</tspan> / Q<tspan baseline-shift="sub" font-size="0.7em">H</tspan></text>
        </g>

        <!-- Energy Labels -->
        <text x="375" y="155" text-anchor="end" class="math" fill="#E60039">Q<tspan baseline-shift="sub" font-size="0.7em">H</tspan> (Input Heat)</text>
        <text x="380" y="345" text-anchor="end" class="math" fill="#2B3A9C">Q<tspan baseline-shift="sub" font-size="0.7em">L</tspan> (Waste Heat)</text>
        <text x="520" y="230" text-anchor="middle" class="math" fill="#05A67B">W = Q<tspan baseline-shift="sub" font-size="0.7em">H</tspan> - Q<tspan baseline-shift="sub" font-size="0.7em">L</tspan></text>
        <text x="520" y="210" text-anchor="middle" class="math" fill="#05A67B" font-size="12">(Work Done)</text>

        <!-- Physics Note -->
        <text x="400" y="480" text-anchor="middle" class="note">Note: Q<tspan baseline-shift="sub" font-size="0.7em">L</tspan> &gt; 0 as per the Kelvin-Planck Statement of the Second Law.</text>

    </svg>
</div>

</body>
</html>
