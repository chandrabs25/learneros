<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bernoulli's Principle & Magnus Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #212529;
        }

        .header {
            text-align: center;
            padding: 2rem 1rem 1rem;
            max-width: 800px;
        }

        .header h1 {
            margin: 0 0 0.5rem 0;
            font-size: 2rem;
            color: #212529;
        }

        .header p {
            margin: 0;
            color: #6c757d;
            font-size: 1.1rem;
            line-height: 1.5;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            padding: 1rem;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }

        /* Typography */
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        .bold { font-weight: 700; }

        /* Streamline Animations */
        .streamline {
            fill: none;
            stroke: #4361EE;
            stroke-width: 2.5;
            opacity: 0.5;
            stroke-linecap: round;
            stroke-dasharray: 120 40;
            animation: flow 0.8s linear infinite;
        }

        @keyframes flow {
            to { stroke-dashoffset: -160; }
        }

        #path1 { animation: flow 0.8s linear infinite, morph1 12s ease-in-out infinite; }
        #path2 { animation: flow 0.8s linear infinite, morph2 12s ease-in-out infinite; }
        #path3 { animation: flow 0.8s linear infinite, morph3 12s ease-in-out infinite; }
        #path4 { animation: flow 0.8s linear infinite, morph4 12s ease-in-out infinite; }
        #path5 { animation: flow 0.8s linear infinite, morph5 12s ease-in-out infinite; }
        #path6 { animation: flow 0.8s linear infinite, morph6 12s ease-in-out infinite; }
        #path7 { animation: flow 0.8s linear infinite, morph7 12s ease-in-out infinite; }
        #path8 { animation: flow 0.8s linear infinite, morph8 12s ease-in-out infinite; }
        #path9 { animation: flow 0.8s linear infinite, morph9 12s ease-in-out infinite; }
        #path10 { animation: flow 0.8s linear infinite, morph10 12s ease-in-out infinite; }

        @keyframes morph1 {
            0%, 33.33%, 100% { d: path('M 0 70 C 250 70, 350 70, 400 70 C 450 70, 550 70, 800 70'); }
            50%, 83.33% { d: path('M 0 70 C 250 70, 350 90, 400 90 C 450 90, 550 110, 800 110'); }
        }
        @keyframes morph2 {
            0%, 33.33%, 100% { d: path('M 0 110 C 250 110, 320 100, 400 100 C 480 100, 550 110, 800 110'); }
            50%, 83.33% { d: path('M 0 110 C 250 110, 320 120, 400 120 C 480 120, 550 140, 800 140'); }
        }
        @keyframes morph3 {
            0%, 33.33%, 100% { d: path('M 0 150 C 250 150, 300 130, 400 130 C 500 130, 550 150, 800 150'); }
            50%, 83.33% { d: path('M 0 150 C 250 150, 300 145, 400 145 C 500 145, 550 170, 800 170'); }
        }
        @keyframes morph4 {
            0%, 33.33%, 100% { d: path('M 0 190 C 200 190, 280 160, 400 160 C 520 160, 600 190, 800 190'); }
            50%, 83.33% { d: path('M 0 190 C 200 190, 280 165, 400 165 C 520 165, 600 200, 800 200'); }
        }
        @keyframes morph5 {
            0%, 33.33%, 100% { d: path('M 0 230 C 150 230, 250 185, 400 185 C 550 185, 650 230, 800 230'); }
            50%, 83.33% { d: path('M 0 230 C 150 230, 250 180, 400 180 C 550 180, 650 230, 800 240'); }
        }
        @keyframes morph6 {
            0%, 33.33%, 100% { d: path('M 0 270 C 150 270, 250 315, 400 315 C 550 315, 650 270, 800 270'); }
            50%, 83.33% { d: path('M 0 270 C 150 270, 250 330, 400 330 C 550 330, 650 300, 800 310'); }
        }
        @keyframes morph7 {
            0%, 33.33%, 100% { d: path('M 0 310 C 200 310, 280 340, 400 340 C 520 340, 600 310, 800 310'); }
            50%, 83.33% { d: path('M 0 310 C 200 310, 280 365, 400 365 C 520 365, 600 345, 800 355'); }
        }
        @keyframes morph8 {
            0%, 33.33%, 100% { d: path('M 0 350 C 250 350, 300 370, 400 370 C 500 370, 550 350, 800 350'); }
            50%, 83.33% { d: path('M 0 350 C 250 350, 300 400, 400 400 C 500 400, 550 380, 800 395'); }
        }
        @keyframes morph9 {
            0%, 33.33%, 100% { d: path('M 0 390 C 250 390, 320 400, 400 400 C 480 400, 550 390, 800 390'); }
            50%, 83.33% { d: path('M 0 390 C 250 390, 320 430, 400 430 C 480 430, 550 415, 800 430'); }
        }
        @keyframes morph10 {
            0%, 33.33%, 100% { d: path('M 0 430 C 250 430, 350 430, 400 430 C 450 430, 550 430, 800 430'); }
            50%, 83.33% { d: path('M 0 430 C 250 430, 350 460, 400 460 C 450 460, 550 450, 800 465'); }
        }

        /* Spin Indicator Animations */
        .spin-group {
            transform-origin: 400px 250px;
            animation: spinRotate 1.5s linear infinite, spinOpacity 12s ease-in-out infinite;
        }
        @keyframes spinRotate {
            100% { transform: rotate(360deg); }
        }
        @keyframes spinOpacity {
            0%, 33.33% { opacity: 0; }
            40%, 83.33% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        /* Velocity Vector Animations */
        .v-top-shaft {
            transform-origin: 400px 175px;
            animation: vTopShaft 12s ease-in-out infinite;
        }
        .v-top-head { animation: vTopHead 12s ease-in-out infinite; }
        .v-bot-shaft {
            transform-origin: 400px 325px;
            animation: vBotShaft 12s ease-in-out infinite;
        }
        .v-bot-head { animation: vBotHead 12s ease-in-out infinite; }

        @keyframes vTopShaft {
            0%, 33.33%, 100% { transform: scaleX(1); }
            50%, 83.33% { transform: scaleX(1.8); }
        }
        @keyframes vTopHead {
            0%, 33.33%, 100% { transform: translateX(0); }
            50%, 83.33% { transform: translateX(64px); }
        }
        @keyframes vBotShaft {
            0%, 33.33%, 100% { transform: scaleX(1); }
            50%, 83.33% { transform: scaleX(0.3); }
        }
        @keyframes vBotHead {
            0%, 33.33%, 100% { transform: translateX(0); }
            50%, 83.33% { transform: translateX(-56px); }
        }

        /* Velocity Text Animations */
        .v-top-text { animation: vTopText 12s ease-in-out infinite; }
        .v-bot-text { animation: vBotText 12s ease-in-out infinite; }
        @keyframes vTopText {
            0%, 33.33%, 100% { transform: translateX(0); }
            50%, 83.33% { transform: translateX(32px); }
        }
        @keyframes vBotText {
            0%, 33.33%, 100% { transform: translateX(0); }
            50%, 83.33% { transform: translateX(-28px); }
        }

        /* Lift Force Animations */
        .lift-shaft {
            transform-origin: 400px 250px;
            animation: liftShaft 12s ease-in-out infinite;
        }
        .lift-head { animation: liftHead 12s ease-in-out infinite; }
        .lift-label { animation: liftLabel 12s ease-in-out infinite; }

        @keyframes liftShaft {
            0%, 33.33%, 100% { transform: scaleY(0); opacity: 0; }
            50%, 83.33% { transform: scaleY(1); opacity: 1; }
        }
        @keyframes liftHead {
            0%, 33.33%, 100% { transform: translateY(120px) scale(0); opacity: 0; }
            50%, 83.33% { transform: translateY(0) scale(1); opacity: 1; }
        }
        @keyframes liftLabel {
            0%, 33.33%, 100% { opacity: 0; transform: translateY(30px); }
            50%, 83.33% { opacity: 1; transform: translateY(0); }
        }

        /* Pressure & Phase Labels Animations */
        .p-label { animation: pLabel 12s ease-in-out infinite; }
        @keyframes pLabel {
            0%, 35%, 100% { opacity: 0; }
            45%, 83.33% { opacity: 1; }
        }

        .phase-text-1 { animation: phase1 12s ease-in-out infinite; }
        .phase-text-2 { animation: phase2 12s ease-in-out infinite; }
        @keyframes phase1 {
            0%, 33.33% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }
        @keyframes phase2 {
            0%, 33.33% { opacity: 0; }
            40%, 83.33% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Bernoulli's Principle & The Magnus Effect</h1>
        <p>Observe how a spinning object alters fluid flow. The spin increases air velocity on top and decreases it on the bottom, creating a pressure differential that generates an upward <strong>dynamic lift</strong>.</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Ball Gradient -->
                <radialGradient id="ballGrad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#6c757d" />
                    <stop offset="100%" stop-color="#212529" />
                </radialGradient>
                
                <!-- Drop Shadow -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="8" stdDeviation="6" flood-opacity="0.15"/>
                </filter>

                <!-- Arrowhead for Spin Indicator -->
                <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#212529" />
                </marker>
            </defs>

            <!-- Streamlines -->
            <g id="streamlines">
                <path id="path1" class="streamline" d="M 0 70 C 250 70, 350 70, 400 70 C 450 70, 550 70, 800 70" />
                <path id="path2" class="streamline" d="M 0 110 C 250 110, 320 100, 400 100 C 480 100, 550 110, 800 110" />
                <path id="path3" class="streamline" d="M 0 150 C 250 150, 300 130, 400 130 C 500 130, 550 150, 800 150" />
                <path id="path4" class="streamline" d="M 0 190 C 200 190, 280 160, 400 160 C 520 160, 600 190, 800 190" />
                <path id="path5" class="streamline" d="M 0 230 C 150 230, 250 185, 400 185 C 550 185, 650 230, 800 230" />
                <path id="path6" class="streamline" d="M 0 270 C 150 270, 250 315, 400 315 C 550 315, 650 270, 800 270" />
                <path id="path7" class="streamline" d="M 0 310 C 200 310, 280 340, 400 340 C 520 340, 600 310, 800 310" />
                <path id="path8" class="streamline" d="M 0 350 C 250 350, 300 370, 400 370 C 500 370, 550 350, 800 350" />
                <path id="path9" class="streamline" d="M 0 390 C 250 390, 320 400, 400 400 C 480 400, 550 390, 800 390" />
                <path id="path10" class="streamline" d="M 0 430 C 250 430, 350 430, 400 430 C 450 430, 550 430, 800 430" />
            </g>

            <!-- Lift Force Vector (Red) -->
            <g id="lift-vector">
                <line x1="400" y1="250" x2="400" y2="100" stroke="#FF3366" stroke-width="6" class="lift-shaft" />
                <polygon points="392,100 400,80 408,100" fill="#FF3366" class="lift-head" />
                <text x="415" y="130" class="lift-label font-inter bold" fill="#FF3366" font-size="18">
                    F<tspan baseline-shift="sub" font-size="12">L</tspan> (Lift)
                </text>
            </g>

            <!-- The Ball -->
            <circle cx="400" cy="250" r="60" fill="url(#ballGrad)" filter="url(#shadow)" />

            <!-- Spin Indicator -->
            <g class="spin-group">
                <!-- Top Arc -->
                <path d="M 347 197 A 75 75 0 0 1 453 197" fill="none" stroke="#212529" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowDark)" />
                <!-- Bottom Arc -->
                <path d="M 453 303 A 75 75 0 0 1 347 303" fill="none" stroke="#212529" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrowDark)" />
            </g>

            <!-- Velocity Vectors (Green) -->
            <g id="velocity-vectors">
                <!-- Top Velocity -->
                <line x1="400" y1="175" x2="480" y2="175" stroke="#06D6A0" stroke-width="4" class="v-top-shaft" />
                <polygon points="480,170 492,175 480,180" fill="#06D6A0" class="v-top-head" />
                <text x="440" y="165" class="v-top-text font-inter bold" fill="#06D6A0" font-size="14" text-anchor="middle">
                    v<tspan baseline-shift="sub" font-size="10">top</tspan>
                </text>

                <!-- Bottom Velocity -->
                <line x1="400" y1="325" x2="480" y2="325" stroke="#06D6A0" stroke-width="4" class="v-bot-shaft" />
                <polygon points="480,320 492,325 480,330" fill="#06D6A0" class="v-bot-head" />
                <text x="440" y="345" class="v-bot-text font-inter bold" fill="#06D6A0" font-size="14" text-anchor="middle">
                    v<tspan baseline-shift="sub" font-size="10">bottom</tspan>
                </text>
            </g>

            <!-- Pressure Labels -->
            <text x="400" y="60" class="p-label font-mono bold" fill="#4361EE" font-size="16" text-anchor="middle">
                P<tspan baseline-shift="sub" font-size="12">low</tspan> (Lower Pressure)
            </text>
            <text x="400" y="460" class="p-label font-mono bold" fill="#4361EE" font-size="16" text-anchor="middle">
                P<tspan baseline-shift="sub" font-size="12">high</tspan> (Higher Pressure)
            </text>

            <!-- UI Overlays -->
            
            <!-- Top Left: Formula -->
            <rect x="20" y="20" width="240" height="70" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" opacity="0.95" filter="url(#shadow)" />
            <text x="35" y="45" class="font-mono bold" font-size="15" fill="#4361EE">P + ½ρv² = const</text>
            <text x="35" y="68" class="font-inter" font-size="12" fill="#6c757d">Bernoulli's Equation</text>

            <!-- Top Right: Phase Indicator -->
            <rect x="540" y="20" width="240" height="50" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" opacity="0.95" filter="url(#shadow)" />
            <text x="660" y="50" class="phase-text-1 font-inter bold" font-size="15" fill="#6c757d" text-anchor="middle">Symmetric Flow (No Spin)</text>
            <text x="660" y="50" class="phase-text-2 font-inter bold" font-size="15" fill="#FF3366" text-anchor="middle">Magnus Effect (Spinning)</text>

            <!-- Bottom Left: Legend -->
            <rect x="20" y="390" width="160" height="90" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" opacity="0.95" filter="url(#shadow)" />
            <line x1="35" y1="415" x2="55" y2="415" stroke="#4361EE" stroke-width="3" stroke-dasharray="6 3" />
            <text x="65" y="419" class="font-inter" font-size="12" fill="#212529">Streamlines</text>
            
            <line x1="35" y1="440" x2="55" y2="440" stroke="#06D6A0" stroke-width="3" />
            <polygon points="55,436 61,440 55,444" fill="#06D6A0" />
            <text x="65" y="444" class="font-inter" font-size="12" fill="#212529">Velocity (v)</text>
            
            <line x1="35" y1="465" x2="55" y2="465" stroke="#FF3366" stroke-width="3" />
            <polygon points="55,461 61,465 55,469" fill="#FF3366" />
            <text x="65" y="469" class="font-inter" font-size="12" fill="#212529">Lift Force</text>

            <!-- Bottom Center: Dynamic Equation -->
            <rect x="230" y="420" width="340" height="40" rx="20" fill="#ffffff" stroke="#e9ecef" stroke-width="2" class="p-label" opacity="0.95" filter="url(#shadow)" />
            <text x="400" y="445" class="p-label font-mono bold" font-size="14" fill="#212529" text-anchor="middle">
                v<tspan baseline-shift="sub" font-size="10">top</tspan> &gt; v<tspan baseline-shift="sub" font-size="10">bottom</tspan> &implies; P<tspan baseline-shift="sub" font-size="10">top</tspan> &lt; P<tspan baseline-shift="sub" font-size="10">bottom</tspan>
            </text>

        </svg>
    </div>

</body>
</html>
