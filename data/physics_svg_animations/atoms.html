<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Atomic Hypothesis: Matter in Perpetual Motion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:ital@0;1&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #333333;
            --text-muted: #666666;
            --atom-color: #00B4D8;
            --vel-color: #06D6A0;
            --repel-color: #FF3366;
            --attract-color: #4361EE;
            --pressure-color: #F77F00;
            --box-stroke: #2b2d42;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .diagram-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
            font-style: italic;
        }

        /* Controls */
        .controls {
            margin-top: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }

        .controls label {
            font-weight: 600;
            color: var(--text-main);
            font-size: 14px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 150px;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--repel-color);
            cursor: pointer;
            margin-top: -6px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #dee2e6;
            border-radius: 2px;
        }

        /* Animations */
        
        /* Wall Flashes (Pressure) */
        @keyframes flashTop { 0%, 90% { opacity: 0; } 95% { opacity: 0.8; } 100% { opacity: 0; } }
        @keyframes flashBottom { 0%, 85% { opacity: 0; } 90% { opacity: 0.8; } 100% { opacity: 0; } }
        @keyframes flashLeft { 0%, 80% { opacity: 0; } 85% { opacity: 0.8; } 100% { opacity: 0; } }
        @keyframes flashRight { 0%, 75% { opacity: 0; } 80% { opacity: 0.8; } 100% { opacity: 0; } }

        .wall-top { animation: flashTop 1.7s infinite; }
        .wall-bottom { animation: flashBottom 2.1s infinite; }
        .wall-left { animation: flashLeft 1.3s infinite; }
        .wall-right { animation: flashRight 1.9s infinite; }

        /* Focus Atoms (A1 & A2) */
        @keyframes pathA1 {
            0% { transform: translate(62px, 255px); animation-timing-function: linear; }
            37.5% { transform: translate(200px, 255px); animation-timing-function: ease-in; }
            50% { transform: translate(263px, 255px); animation-timing-function: ease-out; }
            62.5% { transform: translate(200px, 255px); animation-timing-function: linear; }
            100% { transform: translate(62px, 255px); }
        }
        @keyframes vecA1 {
            0% { transform: rotate(0deg); }
            50% { transform: rotate(180deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pathA2 {
            0% { transform: translate(488px, 255px); animation-timing-function: linear; }
            37.5% { transform: translate(350px, 255px); animation-timing-function: ease-in; }
            50% { transform: translate(287px, 255px); animation-timing-function: ease-out; }
            62.5% { transform: translate(350px, 255px); animation-timing-function: linear; }
            100% { transform: translate(488px, 255px); }
        }
        @keyframes vecA2 {
            0% { transform: rotate(180deg); }
            50% { transform: rotate(0deg); }
            100% { transform: rotate(180deg); }
        }

        /* Interaction Elements */
        @keyframes attractLine {
            0%, 30% { opacity: 0; transform: translate(275px, 255px) scaleX(200); }
            37.5% { opacity: 1; transform: translate(275px, 255px) scaleX(150); stroke: var(--attract-color); stroke-width: 2; stroke-dasharray: 4 4; }
            49% { opacity: 1; transform: translate(275px, 255px) scaleX(24); stroke: var(--attract-color); stroke-width: 2; stroke-dasharray: 4 4; }
            50% { opacity: 1; transform: translate(275px, 255px) scaleX(24); stroke: var(--repel-color); stroke-width: 6; stroke-dasharray: none; }
            51% { opacity: 1; transform: translate(275px, 255px) scaleX(24); stroke: var(--attract-color); stroke-width: 2; stroke-dasharray: 4 4; }
            62.5% { opacity: 1; transform: translate(275px, 255px) scaleX(150); stroke: var(--attract-color); stroke-width: 2; stroke-dasharray: 4 4; }
            70%, 100% { opacity: 0; transform: translate(275px, 255px) scaleX(200); }
        }

        @keyframes textAttract {
            0%, 35%, 65%, 100% { opacity: 0; }
            37.5%, 48%, 52%, 62.5% { opacity: 1; }
            49%, 51% { opacity: 0; }
        }
        @keyframes textRepel {
            0%, 49%, 51%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        @keyframes dotMove {
            0%, 100% { transform: translate(730px, 320px); }
            37.5% { transform: translate(660px, 320px); }
            41% { transform: translate(630px, 360px); }
            45% { transform: translate(600px, 380px); }
            50% { transform: translate(565px, 250px); }
            55% { transform: translate(600px, 380px); }
            59% { transform: translate(630px, 360px); }
            62.5% { transform: translate(660px, 320px); }
        }

        /* Background Atoms (3 to 12) */
        @keyframes p3 { 0%, 100% { transform: translate(62px, 120px); } 50% { transform: translate(488px, 120px); } }
        @keyframes v3 { 0% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } 100% { transform: rotate(0deg); } }

        @keyframes p4 { 0%, 100% { transform: translate(400px, 92px); } 50% { transform: translate(400px, 418px); } }
        @keyframes v4 { 0% { transform: rotate(90deg); } 50% { transform: rotate(-90deg); } 100% { transform: rotate(90deg); } }

        @keyframes p5 { 0%, 100% { transform: translate(488px, 380px); } 50% { transform: translate(62px, 380px); } }
        @keyframes v5 { 0% { transform: rotate(180deg); } 50% { transform: rotate(0deg); } 100% { transform: rotate(180deg); } }

        @keyframes p6 { 0%, 100% { transform: translate(100px, 418px); } 50% { transform: translate(100px, 92px); } }
        @keyframes v6 { 0% { transform: rotate(-90deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(-90deg); } }

        @keyframes p7 { 0%, 100% { transform: translate(100px, 150px); } 33% { transform: translate(300px, 92px); } 66% { transform: translate(488px, 250px); } }
        @keyframes v7 { 0% { transform: rotate(-16deg); } 33% { transform: rotate(40deg); } 66% { transform: rotate(-165deg); } 100% { transform: rotate(-16deg); } }

        @keyframes p8 { 0%, 100% { transform: translate(400px, 350px); } 25% { transform: translate(488px, 418px); } 58% { transform: translate(200px, 418px); } }
        @keyframes v8 { 0% { transform: rotate(37deg); } 25% { transform: rotate(180deg); } 58% { transform: rotate(-19deg); } 100% { transform: rotate(37deg); } }

        @keyframes p9 { 0%, 100% { transform: translate(200px, 300px); } 33% { transform: translate(62px, 150px); } 66% { transform: translate(250px, 92px); } }
        @keyframes v9 { 0% { transform: rotate(-132deg); } 33% { transform: rotate(-17deg); } 66% { transform: rotate(103deg); } 100% { transform: rotate(-132deg); } }

        @keyframes p10 { 0%, 100% { transform: translate(350px, 150px); } 41% { transform: translate(488px, 250px); } 75% { transform: translate(300px, 418px); } }
        @keyframes v10 { 0% { transform: rotate(36deg); } 41% { transform: rotate(138deg); } 75% { transform: rotate(-79deg); } 100% { transform: rotate(36deg); } }

        @keyframes p11 { 0%, 100% { transform: translate(250px, 200px); } 25% { transform: translate(62px, 300px); } 58% { transform: translate(150px, 418px); } }
        @keyframes v11 { 0% { transform: rotate(152deg); } 25% { transform: rotate(53deg); } 58% { transform: rotate(-65deg); } 100% { transform: rotate(152deg); } }

        @keyframes p12 { 0%, 100% { transform: translate(150px, 350px); } 33% { transform: translate(62px, 418px); } 66% { transform: translate(250px, 418px); } }
        @keyframes v12 { 0% { transform: rotate(142deg); } 33% { transform: rotate(0deg); } 66% { transform: rotate(-145deg); } 100% { transform: rotate(142deg); } }

        /* Apply Animations */
        .atom-a1 { animation: pathA1 4s infinite; }
        .vec-a1 { animation: vecA1 4s step-end infinite; }
        .atom-a2 { animation: pathA2 4s infinite; }
        .vec-a2 { animation: vecA2 4s step-end infinite; }
        
        .line-attract { animation: attractLine 4s infinite; }
        .lbl-attract { animation: textAttract 4s infinite; }
        .lbl-repel { animation: textRepel 4s infinite; }
        .pe-dot { animation: dotMove 4s linear infinite; }

        .atom-3 { animation: p3 12s linear infinite; } .vec-3 { animation: v3 12s step-end infinite; }
        .atom-4 { animation: p4 12s linear infinite; } .vec-4 { animation: v4 12s step-end infinite; }
        .atom-5 { animation: p5 12s linear infinite; } .vec-5 { animation: v5 12s step-end infinite; }
        .atom-6 { animation: p6 12s linear infinite; } .vec-6 { animation: v6 12s step-end infinite; }
        .atom-7 { animation: p7 12s linear infinite; } .vec-7 { animation: v7 12s step-end infinite; }
        .atom-8 { animation: p8 12s linear infinite; } .vec-8 { animation: v8 12s step-end infinite; }
        .atom-9 { animation: p9 12s linear infinite; } .vec-9 { animation: v9 12s step-end infinite; }
        .atom-10 { animation: p10 12s linear infinite; } .vec-10 { animation: v10 12s step-end infinite; }
        .atom-11 { animation: p11 12s linear infinite; } .vec-11 { animation: v11 12s step-end infinite; }
        .atom-12 { animation: p12 12s linear infinite; } .vec-12 { animation: v12 12s step-end infinite; }

    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Atomic Hypothesis</title>
        <desc>An animated diagram showing 12 atoms in perpetual motion, demonstrating elastic collisions, kinetic energy, and the Lennard-Jones potential (attraction and repulsion).</desc>

        <defs>
            <!-- Atom Gradient -->
            <radialGradient id="atomGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#90E0EF" />
                <stop offset="100%" stop-color="#00B4D8" />
            </radialGradient>
            
            <!-- Focus Atom Glow -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
        </defs>

        <!-- Background & Title -->
        <rect width="800" height="500" fill="var(--bg-color)" rx="12" />
        <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="var(--text-main)">The Atomic Hypothesis</text>
        <text x="400" y="480" font-size="14" font-style="italic" text-anchor="middle" fill="var(--text-muted)">"Atoms: Little particles that move around in perpetual motion..."</text>

        <!-- Container Box -->
        <g transform="translate(50, 80)">
            <rect width="450" height="350" fill="#ffffff" stroke="var(--box-stroke)" stroke-width="3" rx="8" />
            
            <!-- Pressure Flashes -->
            <line x1="0" y1="0" x2="450" y2="0" stroke="var(--pressure-color)" stroke-width="6" class="wall-top" />
            <line x1="0" y1="350" x2="450" y2="350" stroke="var(--pressure-color)" stroke-width="6" class="wall-bottom" />
            <line x1="0" y1="0" x2="0" y2="350" stroke="var(--pressure-color)" stroke-width="6" class="wall-left" />
            <line x1="450" y1="0" x2="450" y2="350" stroke="var(--pressure-color)" stroke-width="6" class="wall-right" />
        </g>

        <!-- Legend -->
        <g transform="translate(530, 80)">
            <rect width="220" height="110" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" />
            <text x="10" y="20" font-size="12" font-weight="bold" fill="var(--text-main)">Legend</text>
            
            <line x1="10" y1="40" x2="35" y2="40" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
            <text x="45" y="44" font-size="12" fill="var(--text-main)">Velocity (<tspan class="math">v&#8407;</tspan>)</text>
            
            <line x1="10" y1="65" x2="35" y2="65" stroke="var(--attract-color)" stroke-width="2" stroke-dasharray="4 4" />
            <text x="45" y="69" font-size="12" fill="var(--text-main)">Attraction (<tspan class="math">F&#8407;</tspan><tspan font-size="9" dy="4">att</tspan><tspan dy="-4">)</tspan></text>
            
            <line x1="10" y1="90" x2="35" y2="90" stroke="var(--repel-color)" stroke-width="3" />
            <text x="45" y="94" font-size="12" fill="var(--text-main)">Repulsion (<tspan class="math">F&#8407;</tspan><tspan font-size="9" dy="4">rep</tspan><tspan dy="-4">)</tspan></text>
        </g>

        <!-- Potential Energy Curve (Inset) -->
        <g transform="translate(530, 210)">
            <rect width="220" height="220" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" />
            <text x="110" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="var(--text-main)">Lennard-Jones Potential</text>
            
            <!-- Axes -->
            <line x1="20" y1="110" x2="200" y2="110" stroke="#ccc" stroke-width="1" />
            <line x1="20" y1="30" x2="20" y2="190" stroke="#ccc" stroke-width="1" />
            <text x="200" y="125" font-size="10" class="math" fill="var(--text-muted)">r</text>
            <text x="5" y="40" font-size="10" class="math" fill="var(--text-muted)">E</text>

            <!-- Curve -->
            <path d="M 35,40 C 40,140 50,170 70,170 C 100,170 130,110 200,110" fill="none" stroke="var(--attract-color)" stroke-width="2" />
            
            <!-- Zero Energy Line -->
            <text x="25" y="105" font-size="9" fill="#999">0</text>
        </g>
        <!-- Moving PE Dot (Absolute coordinates to match global keyframes) -->
        <circle r="5" fill="var(--repel-color)" class="pe-dot" />

        <!-- Interaction Line & Labels (Focus Atoms) -->
        <line x1="-0.5" y1="0" x2="0.5" y2="0" vector-effect="non-scaling-stroke" class="line-attract" />
        <text x="275" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="var(--attract-color)" class="lbl-attract">Attraction</text>
        <text x="275" y="230" font-size="14" font-weight="bold" text-anchor="middle" fill="var(--repel-color)" class="lbl-repel">Repulsion!</text>

        <!-- Atoms -->
        
        <!-- Background Atoms (10) -->
        <g class="atom-3"><g class="vec-3">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>
        
        <g class="atom-4"><g class="vec-4">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-5"><g class="vec-5">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-6"><g class="vec-6">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-7"><g class="vec-7">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-8"><g class="vec-8">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-9"><g class="vec-9">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-10"><g class="vec-10">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-11"><g class="vec-11">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <g class="atom-12"><g class="vec-12">
            <circle r="12" fill="url(#atomGrad)" />
            <line x1="0" y1="0" x2="25" y2="0" stroke="var(--vel-color)" stroke-width="2" marker-end="url(#arrowGreen)" />
        </g></g>

        <!-- Focus Atoms (A1 & A2) -->
        <g class="atom-a1">
            <g class="vec-a1">
                <circle r="12" fill="url(#atomGrad)" filter="url(#glow)" />
                <line x1="0" y1="0" x2="30" y2="0" stroke="var(--vel-color)" stroke-width="2.5" marker-end="url(#arrowGreen)" />
            </g>
            <text x="0" y="-18" font-size="12" font-weight="bold" text-anchor="middle" fill="var(--text-main)">A1</text>
        </g>

        <g class="atom-a2">
            <g class="vec-a2">
                <circle r="12" fill="url(#atomGrad)" filter="url(#glow)" />
                <line x1="0" y1="0" x2="30" y2="0" stroke="var(--vel-color)" stroke-width="2.5" marker-end="url(#arrowGreen)" />
            </g>
            <text x="0" y="-18" font-size="12" font-weight="bold" text-anchor="middle" fill="var(--text-main)">A2</text>
        </g>

    </svg>

    <!-- Interactivity -->
    <div class="controls">
        <label for="tempSlider">Temperature (Kinetic Energy):</label>
        <input type="range" id="tempSlider" min="0.2" max="3" step="0.1" value="1">
    </div>
</div>

<script>
    // Minimal JS to handle the Temperature slider (adjusts animation playback rate)
    document.getElementById('tempSlider').addEventListener('input', function(e) {
        const speed = parseFloat(e.target.value);
        // Apply playback rate to all CSS animations on the page
        document.getAnimations().forEach(anim => {
            anim.playbackRate = speed;
        });
    });
</script>

</body>
</html>
