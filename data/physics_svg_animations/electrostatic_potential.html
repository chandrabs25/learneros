<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrostatic Potential: Work, Field, and Energy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        #simulation-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            user-select: none;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 22px;
            fill: #212529;
        }
    </style>
</head>
<body>

<div id="simulation-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead Markers -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366"/>
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE"/>
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
            </marker>
            <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
                <circle cx="5" cy="5" r="5" fill="#6c757d"/>
            </marker>

            <!-- Drop Shadow for Depth -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
            </filter>
            
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Reusable Field Line -->
            <line id="f-line" x1="25" y1="0" x2="800" y2="0" stroke="#F77F00" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.25"/>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="12"/>

        <!-- Title -->
        <text x="24" y="40" class="title">Electrostatic Potential &amp; Work Done</text>
        <text x="24" y="60" class="label" font-size="14" fill="#6c757d" font-weight="400">Moving a test charge +q against the electric field of +Q</text>

        <!-- Legend -->
        <g transform="translate(520, 20)">
            <rect width="190" height="95" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" filter="url(#shadow)"/>
            <text x="12" y="22" class="label" font-size="12" fill="#343a40">Force &amp; Energy Legend</text>
            
            <line x1="12" y1="40" x2="36" y2="40" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            <text x="48" y="44" class="label" font-size="11" fill="#495057">Electrostatic Force (F<tspan dy="2" font-size="8">e</tspan><tspan dy="-2">)</tspan></text>
            
            <line x1="12" y1="60" x2="36" y2="60" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
            <text x="48" y="64" class="label" font-size="11" fill="#495057">External Force (F<tspan dy="2" font-size="8">ext</tspan><tspan dy="-2">)</tspan></text>
            
            <line x1="12" y1="80" x2="36" y2="80" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
            <text x="48" y="84" class="label" font-size="11" fill="#495057">Velocity (Kinetic Energy)</text>
        </g>

        <!-- Electric Field Lines -->
        <g transform="translate(200, 250)">
            <use href="#f-line" transform="rotate(0)"/>
            <use href="#f-line" transform="rotate(30)"/>
            <use href="#f-line" transform="rotate(60)"/>
            <use href="#f-line" transform="rotate(90)"/>
            <use href="#f-line" transform="rotate(120)"/>
            <use href="#f-line" transform="rotate(150)"/>
            <use href="#f-line" transform="rotate(180)"/>
            <use href="#f-line" transform="rotate(210)"/>
            <use href="#f-line" transform="rotate(240)"/>
            <use href="#f-line" transform="rotate(270)"/>
            <use href="#f-line" transform="rotate(300)"/>
            <use href="#f-line" transform="rotate(330)"/>
        </g>

        <!-- Equipotential Surfaces -->
        <circle cx="200" cy="250" r="100" fill="none" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.3"/>
        <circle cx="200" cy="250" r="200" fill="none" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.2"/>
        <circle cx="200" cy="250" r="300" fill="none" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.1"/>

        <!-- Equipotential Labels -->
        <text x="286" y="200" class="label" font-size="12" fill="#7209B7" opacity="0.7">V₁</text>
        <text x="373" y="150" class="label" font-size="12" fill="#7209B7" opacity="0.5">V₂</text>
        <text x="459" y="100" class="label" font-size="12" fill="#7209B7" opacity="0.4">V₃</text>

        <!-- Work Path -->
        <line x1="300" y1="250" x2="650" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 4"/>

        <!-- Distance Indicator -->
        <path id="r-line" stroke="#6c757d" stroke-width="1.5" stroke-dasharray="2 2" marker-start="url(#dot)" marker-end="url(#dot)"/>
        <text id="r-val" class="math" font-size="14" fill="#495057" text-anchor="middle" y="295">r = 4.50 m</text>

        <!-- Source Charge +Q -->
        <g transform="translate(200, 250)">
            <circle r="25" fill="#F77F00" filter="url(#shadow)"/>
            <text y="6" text-anchor="middle" class="label" font-size="18" fill="#ffffff">+Q</text>
        </g>

        <!-- Flash Text for Energy Storage -->
        <text id="flash-text" x="300" y="180" text-anchor="middle" class="label" font-size="16" fill="#7209B7" opacity="0" filter="url(#glow)">
            Work Converted to Potential Energy!
        </text>

        <!-- Test Charge +q and Vectors -->
        <g id="test-charge" transform="translate(650, 250)">
            <!-- Vectors -->
            <line id="fext-arrow" x1="-12" y1="0" x2="-50" y2="0" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
            <line id="fe-arrow" x1="12" y1="0" x2="50" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            <line id="v-arrow" x1="12" y1="0" x2="50" y2="0" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" display="none"/>
            
            <!-- Particle -->
            <circle r="10" fill="#4361EE" filter="url(#shadow)"/>
            <text y="-18" text-anchor="middle" class="label" font-size="14" fill="#4361EE">+q</text>
            
            <!-- Vector Labels -->
            <text id="fext-label" x="-50" y="-10" text-anchor="end" class="label" font-size="12" fill="#4361EE">F<tspan dy="2" font-size="9">ext</tspan></text>
            <text id="fe-label" x="50" y="-10" text-anchor="start" class="label" font-size="12" fill="#FF3366">F<tspan dy="2" font-size="9">e</tspan></text>
            <text id="v-label" x="50" y="-10" text-anchor="start" class="label" font-size="12" fill="#06D6A0" display="none">v</text>
        </g>

        <!-- Energy Bar Gauge -->
        <g transform="translate(730, 130)">
            <rect width="36" height="300" fill="#ffffff" stroke="#ced4da" stroke-width="2" rx="4" filter="url(#shadow)"/>
            
            <!-- Grid lines for energy bar -->
            <line x1="0" y1="75" x2="36" y2="75" stroke="#e9ecef" stroke-width="1"/>
            <line x1="0" y1="150" x2="36" y2="150" stroke="#e9ecef" stroke-width="1"/>
            <line x1="0" y1="225" x2="36" y2="225" stroke="#e9ecef" stroke-width="1"/>

            <rect id="energy-fill" x="2" y="300" width="32" height="0" fill="#4361EE" rx="2"/>
            
            <text x="18" y="-15" text-anchor="middle" class="label" font-size="14" fill="#4361EE">Energy (U)</text>
            <text id="u-val" x="18" y="325" text-anchor="middle" class="math" font-size="14" fill="#4361EE" font-weight="bold">0 J</text>
        </g>

        <!-- Formula Overlay -->
        <g transform="translate(24, 400)">
            <rect width="310" height="76" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="8" filter="url(#shadow)"/>
            <text x="16" y="30" class="math" font-size="15" fill="#212529">
                V = W<tspan dy="4" font-size="11">∞→P</tspan><tspan dy="-4"> / q = </tspan>
                <tspan fill="#F77F00">kQ</tspan> / <tspan fill="#6c757d">r</tspan>
            </text>
            <text x="16" y="58" class="math" font-size="15" fill="#212529">
                ΔU = qV = <tspan fill="#F77F00">kQq</tspan> / <tspan fill="#6c757d">r</tspan>
            </text>
        </g>
    </svg>
</div>

<script>
    /**
     * Physics Animation Logic
     * 
     * Mathematical Model:
     * - Source charge +Q is at x=200.
     * - Test charge +q moves along the x-axis.
     * - Distance r = x_test - 200.
     * - Electrostatic Force (Fe) scales as 1/r^2.
     * - Potential Energy (U) scales as 1/r.
     * - Kinetic Energy (K) is derived from energy conservation during recoil.
     */

    const duration = 10000; // 10 seconds per loop
    
    // DOM Elements
    const testCharge = document.getElementById('test-charge');
    const feArrow = document.getElementById('fe-arrow');
    const fextArrow = document.getElementById('fext-arrow');
    const vArrow = document.getElementById('v-arrow');
    const feLabel = document.getElementById('fe-label');
    const fextLabel = document.getElementById('fext-label');
    const vLabel = document.getElementById('v-label');
    const energyFill = document.getElementById('energy-fill');
    const uVal = document.getElementById('u-val');
    const rLine = document.getElementById('r-line');
    const rVal = document.getElementById('r-val');
    const flashText = document.getElementById('flash-text');

    // Physics Constants (scaled for visual representation)
    const kF = 1500000; // Force constant for 1/r^2
    const kU = 30000;   // Energy constant for 1/r
    const rStart = 450; // Initial distance (x=650)
    const rEnd = 100;   // Final distance (x=300)

    function animate(time) {
        const t = (time % duration) / 1000; // Time in seconds (0 to 10)
        
        let r, fe, fext, v, opacity = 1, flash = 0;
        let showFext = true, showV = false;

        if (t < 5) {
            // Phase 1: Approach (0s - 5s)
            // Constant velocity approach to demonstrate quasi-static work
            const p = t / 5; // Progress 0 to 1
            r = rStart - (rStart - rEnd) * p;
            fe = kF / (r * r);
            fext = fe; // External force exactly balances electrostatic force
            v = 0;
        } else if (t < 6) {
            // Phase 2: Pause & Store Energy (5s - 6s)
            r = rEnd;
            fe = kF / (r * r);
            fext = fe;
            v = 0;
            // Flash effect for the label
            flash = Math.sin((t - 5) * Math.PI * 5) > 0 ? 1 : 0;
        } else if (t < 8) {
            // Phase 3: Release & Recoil (6s - 8s)
            const p = (t - 6) / 2; // Progress 0 to 1
            // Phenomenological approximation for accelerating outward
            // Acceleration decreases as 1/r^2, so position grows as ~ p^1.5
            r = rEnd + (rStart - rEnd) * Math.pow(p, 1.5);
            fe = kF / (r * r);
            fext = 0; // External force removed
            showFext = false;
            showV = true;
            
            // Velocity derived from Conservation of Energy: K = U_initial - U_current
            const uInitial = kU / rEnd;
            const uCurrent = kU / r;
            const K = Math.max(0, uInitial - uCurrent);
            // v is proportional to sqrt(K). Scaled for visual arrow length.
            v = 9.5 * Math.sqrt(K); 
        } else {
            // Phase 4: Reset & Fade (8s - 10s)
            r = rStart;
            fe = kF / (r * r);
            fext = 0;
            showFext = false;
            v = 0;
            
            // Fade out and fade back in
            const p = (t - 8) / 2; // Progress 0 to 1
            opacity = p < 0.5 ? 1 - 2 * p : 2 * p - 1;
        }

        // Update Positions
        const x = 200 + r;
        testCharge.setAttribute('transform', `translate(${x}, 250)`);
        testCharge.setAttribute('opacity', opacity);

        // Update Electrostatic Force Arrow (Red)
        feArrow.setAttribute('x2', 12 + fe);
        feLabel.setAttribute('x', 18 + fe);

        // Update External Force Arrow (Blue)
        if (showFext) {
            fextArrow.setAttribute('display', 'inline');
            fextLabel.setAttribute('display', 'inline');
            fextArrow.setAttribute('x2', -12 - fext);
            fextLabel.setAttribute('x', -18 - fext);
        } else {
            fextArrow.setAttribute('display', 'none');
            fextLabel.setAttribute('display', 'none');
        }

        // Update Velocity Arrow (Green)
        if (showV) {
            vArrow.setAttribute('display', 'inline');
            vLabel.setAttribute('display', 'inline');
            vArrow.setAttribute('x2', 12 + v);
            vLabel.setAttribute('x', 18 + v);
        } else {
            vArrow.setAttribute('display', 'none');
            vLabel.setAttribute('display', 'none');
        }

        // Update Energy Bar Gauge (1/r scaling)
        const uHeight = kU / r;
        energyFill.setAttribute('y', 298 - uHeight);
        energyFill.setAttribute('height', uHeight);
        uVal.textContent = Math.round(uHeight) + ' J';

        // Update Distance Indicators
        rLine.setAttribute('d', `M 200 280 L ${x} 280`);
        rVal.setAttribute('x', 200 + r / 2);
        rVal.textContent = `r = ${(r / 100).toFixed(2)} m`;

        // Update Flash Text
        flashText.setAttribute('opacity', flash);

        // Loop
        requestAnimationFrame(animate);
    }

    // Start Animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
