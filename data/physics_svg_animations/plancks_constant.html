<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planck's Constant & The Photoelectric Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animations */
        @keyframes photon1 {
            0% { transform: translate(40px, 200px) rotate(63.4deg); opacity: 0; }
            2% { opacity: 1; }
            16.6% { transform: translate(120px, 360px) rotate(63.4deg); opacity: 1; }
            16.7% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes photon2 {
            0%, 25% { transform: translate(80px, 200px) rotate(63.4deg); opacity: 0; }
            27% { opacity: 1; }
            41.6% { transform: translate(160px, 360px) rotate(63.4deg); opacity: 1; }
            41.7% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes photon3 {
            0%, 50% { transform: translate(120px, 200px) rotate(63.4deg); opacity: 0; }
            52% { opacity: 1; }
            66.6% { transform: translate(200px, 360px) rotate(63.4deg); opacity: 1; }
            66.7% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes bound-e1 {
            0%, 16.5% { transform: translate(0, 0); }
            18% { transform: translate(-2px, 2px); }
            20% { transform: translate(2px, -2px); }
            22% { transform: translate(-1px, 1px); }
            24% { transform: translate(0, 0); }
            100% { transform: translate(0, 0); }
        }

        @keyframes bound-e2 {
            0%, 41.5% { opacity: 1; }
            41.6%, 100% { opacity: 0; }
        }

        @keyframes bound-e3 {
            0%, 66.5% { opacity: 1; }
            66.6%, 100% { opacity: 0; }
        }

        @keyframes eject-e2 {
            0%, 41.5% { transform: translate(160px, 360px); opacity: 0; }
            41.6% { transform: translate(160px, 360px); opacity: 1; }
            58.3% { transform: translate(200px, 280px); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes eject-e3 {
            0%, 66.5% { transform: translate(200px, 360px); opacity: 0; }
            66.6% { transform: translate(200px, 360px); opacity: 1; }
            83.3% { transform: translate(280px, 200px); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes graph-tracker {
            0% { transform: translate(500px, 400px); opacity: 0; }
            2% { transform: translate(500px, 400px); opacity: 1; }
            33.3% { transform: translate(550px, 400px); opacity: 1; }
            83.3% { transform: translate(700px, 150px); opacity: 1; }
            85% { opacity: 0; }
            100% { transform: translate(500px, 400px); opacity: 0; }
        }

        @keyframes graph-point-color {
            0%, 33.3% { fill: #FF3366; }
            33.4%, 50% { fill: #F77F00; }
            50.1%, 100% { fill: #7209B7; }
        }

        .photon1 { animation: photon1 12s linear infinite; }
        .photon2 { animation: photon2 12s linear infinite; }
        .photon3 { animation: photon3 12s linear infinite; }
        
        .bound-e1 { animation: bound-e1 12s linear infinite; }
        .bound-e2 { animation: bound-e2 12s linear infinite; }
        .bound-e3 { animation: bound-e3 12s linear infinite; }
        
        .eject-e2 { animation: eject-e2 12s linear infinite; }
        .eject-e3 { animation: eject-e3 12s linear infinite; }
        
        .graph-tracker { animation: graph-tracker 12s linear infinite; }
        .graph-point { animation: graph-point-color 12s linear infinite; }

        .math { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-dark" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2d42" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
        </defs>

        <!-- Title and Equation -->
        <text x="400" y="40" font-size="24" font-weight="600" fill="#2b2d42" text-anchor="middle">Planck's Constant (h) in the Photoelectric Effect</text>
        <text x="400" y="80" font-size="20" fill="#2b2d42" text-anchor="middle" class="math">
            K<tspan baseline-shift="sub" font-size="14">max</tspan> = <tspan fill="#FF3366" font-weight="700">h</tspan>ν - φ<tspan baseline-shift="sub" font-size="14">0</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(40, 40)">
            <rect x="0" y="0" width="180" height="105" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#2b2d42">Legend</text>
            
            <path d="M 10 35 L 30 35" stroke="#FF3366" stroke-width="3"/>
            <text x="40" y="39" font-size="11" fill="#495057">Low Freq (ν &lt; ν<tspan baseline-shift="sub" font-size="8">0</tspan>)</text>
            
            <path d="M 10 55 L 30 55" stroke="#F77F00" stroke-width="3"/>
            <text x="40" y="59" font-size="11" fill="#495057">Threshold (ν ≈ ν<tspan baseline-shift="sub" font-size="8">0</tspan>)</text>
            
            <path d="M 10 75 L 30 75" stroke="#7209B7" stroke-width="3"/>
            <text x="40" y="79" font-size="11" fill="#495057">High Freq (ν &gt; ν<tspan baseline-shift="sub" font-size="8">0</tspan>)</text>
            
            <circle cx="20" cy="95" r="4" fill="#06D6A0"/>
            <text x="40" y="99" font-size="11" fill="#495057">Photoelectron</text>
        </g>

        <!-- PHYSICAL MODEL (Left Side) -->
        
        <!-- Metal Surface -->
        <rect x="60" y="350" width="280" height="100" fill="#e9ecef" stroke="#ced4da" stroke-width="4" rx="4"/>
        <line x1="60" y1="365" x2="340" y2="365" stroke="#F77F00" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="200" y="390" font-size="13" fill="#F77F00" text-anchor="middle" font-weight="600">Work Function Barrier (φ<tspan baseline-shift="sub" font-size="10">0</tspan>)</text>
        <text x="200" y="420" font-size="14" fill="#adb5bd" text-anchor="middle" font-weight="600">Potassium Metal</text>

        <!-- Incoming Photons (Wave-packets) -->
        <g class="photon1">
            <path d="M -90 0 Q -75 -20 -60 0 T -30 0 T 0 0" fill="none" stroke="#FF3366" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="photon2">
            <path d="M -80 0 Q -70 -20 -60 0 T -40 0 T -20 0 T 0 0" fill="none" stroke="#F77F00" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="photon3">
            <path d="M -72 0 Q -66 -20 -60 0 T -48 0 T -36 0 T -24 0 T -12 0 T 0 0" fill="none" stroke="#7209B7" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Bound Electrons -->
        <circle cx="120" cy="365" r="6" fill="#06D6A0" class="bound-e1"/>
        <circle cx="160" cy="365" r="6" fill="#06D6A0" class="bound-e2"/>
        <circle cx="200" cy="365" r="6" fill="#06D6A0" class="bound-e3"/>

        <!-- Ejected Electrons (with velocity vectors) -->
        <g class="eject-e2">
            <circle cx="0" cy="0" r="6" fill="#06D6A0"/>
            <line x1="0" y1="0" x2="20" y2="-40" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
            <text x="15" y="-45" font-size="12" fill="#06D6A0" class="math" font-weight="600">v</text>
        </g>
        <g class="eject-e3">
            <circle cx="0" cy="0" r="6" fill="#06D6A0"/>
            <line x1="0" y1="0" x2="40" y2="-80" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
            <text x="30" y="-85" font-size="12" fill="#06D6A0" class="math" font-weight="600">2v</text>
        </g>


        <!-- GRAPH (Right Side) -->
        
        <!-- Graph Grid -->
        <g stroke="#f1f3f5" stroke-width="1">
            <line x1="500" y1="350" x2="750" y2="350"/>
            <line x1="500" y1="300" x2="750" y2="300"/>
            <line x1="500" y1="250" x2="750" y2="250"/>
            <line x1="500" y1="200" x2="750" y2="200"/>
            <line x1="500" y1="150" x2="750" y2="150"/>
            <line x1="550" y1="400" x2="550" y2="150"/>
            <line x1="600" y1="400" x2="600" y2="150"/>
            <line x1="650" y1="400" x2="650" y2="150"/>
            <line x1="700" y1="400" x2="700" y2="150"/>
        </g>

        <!-- Axes -->
        <line x1="480" y1="400" x2="760" y2="400" stroke="#2b2d42" stroke-width="2" marker-end="url(#arrow-dark)"/>
        <line x1="500" y1="490" x2="500" y2="130" stroke="#2b2d42" stroke-width="2" marker-end="url(#arrow-dark)"/>

        <!-- Axis Labels -->
        <text x="750" y="425" font-size="14" fill="#2b2d42" text-anchor="end" font-weight="600">Frequency ν (Hz)</text>
        <text x="490" y="140" font-size="14" fill="#2b2d42" text-anchor="end" font-weight="600">K<tspan baseline-shift="sub" font-size="10">max</tspan> (eV)</text>
        
        <!-- Origin and Intercepts -->
        <text x="485" y="415" font-size="12" fill="#2b2d42" class="math">0</text>
        <text x="550" y="425" font-size="14" fill="#2b2d42" text-anchor="middle" font-weight="600" class="math">ν<tspan baseline-shift="sub" font-size="10">0</tspan></text>
        <text x="490" y="488" font-size="14" fill="#F77F00" text-anchor="end" font-weight="600" class="math">-φ<tspan baseline-shift="sub" font-size="10">0</tspan></text>

        <!-- Slope Lines -->
        <line x1="550" y1="400" x2="700" y2="150" stroke="#FF3366" stroke-width="3" stroke-linecap="round"/>
        <line x1="500" y1="483.3" x2="550" y2="400" stroke="#FF3366" stroke-width="2" stroke-dasharray="6,4"/>

        <!-- Slope Label -->
        <text x="640" y="240" font-size="14" fill="#FF3366" font-weight="600" transform="rotate(-59, 640, 240)">Slope = Planck's Constant (h)</text>

        <!-- Moving Graph Point -->
        <g class="graph-tracker">
            <circle cx="0" cy="0" r="7" class="graph-point"/>
            <circle cx="0" cy="0" r="12" fill="none" stroke="#2b2d42" stroke-width="1" opacity="0.3"/>
            <text x="0" y="-18" font-size="12" fill="#2b2d42" text-anchor="middle" font-weight="600">Current ν</text>
        </g>

    </svg>

</body>
</html>
