<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation of Linear Momentum: Elastic Collision</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #animation-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animation Classes */
        .play .anim-m1 { animation: move-m1 6s linear infinite; }
        .play .anim-m2 { animation: move-m2 6s linear infinite; }
        .play .anim-fade-out { animation: fade-out 6s linear infinite; }
        .play .anim-fade-in { animation: fade-in 6s linear infinite; }
        .play .anim-flash { animation: flash 6s linear infinite; }
        .play .anim-bar-m1 { animation: bar-m1 6s linear infinite; }
        .play .anim-bar-m2 { animation: bar-m2 6s linear infinite; }
        .play .anim-bar-text-m1 { animation: bar-text-m1 6s linear infinite; }
        .play .anim-state-before { animation: fade-out 6s linear infinite; }
        .play .anim-state-impact { animation: state-impact 6s linear infinite; }
        .play .anim-state-after { animation: fade-in 6s linear infinite; }

        /* Keyframes */
        @keyframes move-m1 {
            0% { transform: translateX(100px); opacity: 1; }
            33.33% { transform: translateX(370px); opacity: 1; }
            36.66% { transform: translateX(370px); opacity: 1; }
            83.33% { transform: translateX(496px); opacity: 1; }
            85% { transform: translateX(496px); opacity: 0; }
            95% { transform: translateX(100px); opacity: 0; }
            100% { transform: translateX(100px); opacity: 1; }
        }

        @keyframes move-m2 {
            0% { transform: translateX(420px); opacity: 1; }
            33.33% { transform: translateX(420px); opacity: 1; }
            36.66% { transform: translateX(420px); opacity: 1; }
            83.33% { transform: translateX(924px); opacity: 1; }
            85% { transform: translateX(924px); opacity: 0; }
            95% { transform: translateX(420px); opacity: 0; }
            100% { transform: translateX(420px); opacity: 1; }
        }

        @keyframes fade-out {
            0%, 33.32% { opacity: 1; }
            33.33%, 100% { opacity: 0; }
        }

        @keyframes fade-in {
            0%, 36.65% { opacity: 0; }
            36.66%, 83.33% { opacity: 1; }
            83.34%, 100% { opacity: 0; }
        }

        @keyframes state-impact {
            0%, 33.32% { opacity: 0; }
            33.33%, 36.66% { opacity: 1; }
            36.67%, 100% { opacity: 0; }
        }

        @keyframes flash {
            0%, 33.32% { opacity: 0; transform: scale(0) rotate(0deg); }
            33.33% { opacity: 1; transform: scale(1.5) rotate(45deg); }
            36.66% { opacity: 0; transform: scale(2) rotate(90deg); }
            36.67%, 100% { opacity: 0; }
        }

        @keyframes bar-m1 {
            0%, 33.32% { width: 300px; }
            36.66%, 85% { width: 100px; }
            85.01%, 100% { width: 300px; }
        }

        @keyframes bar-m2 {
            0%, 33.32% { width: 0px; x: 550px; }
            36.66%, 85% { width: 200px; x: 350px; }
            85.01%, 100% { width: 0px; x: 550px; }
        }

        @keyframes bar-text-m1 {
            0%, 33.32% { transform: translateX(0px); }
            36.66%, 85% { transform: translateX(-100px); }
            85.01%, 100% { transform: translateX(0px); }
        }

        .replay-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: #4361EE;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(67, 97, 238, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        .replay-btn:hover {
            background: #3651d4;
        }

        .replay-btn:active {
            transform: scale(0.95);
        }

        .math-font {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div id="animation-container" class="play">
    <svg viewBox="0 0 800 500" aria-label="Animated diagram showing a 2kg mass colliding with a 1kg mass, demonstrating conservation of momentum.">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-red-left" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 10 0 L 0 5 L 10 10 z" fill="#FF3366" />
            </marker>
            
            <!-- Grid Pattern -->
            <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                <line x1="50" y1="0" x2="50" y2="50" stroke="#e9ecef" stroke-width="1"/>
            </pattern>
        </defs>

        <!-- Background & Grid -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        <rect x="50" y="150" width="700" height="200" fill="url(#grid)" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Conservation of Linear Momentum: Elastic Collision</text>

        <!-- Legend -->
        <g transform="translate(30, 60)">
            <rect x="0" y="0" width="140" height="75" fill="white" stroke="#dee2e6" rx="4" />
            <line x1="10" y1="20" x2="30" y2="20" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <text x="40" y="24" font-size="12" fill="#495057">Velocity (v)</text>
            
            <line x1="10" y1="40" x2="30" y2="40" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
            <text x="40" y="44" font-size="12" fill="#495057">Momentum (p)</text>

            <line x1="10" y1="60" x2="30" y2="60" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)" />
            <text x="40" y="64" font-size="12" fill="#495057">Force (F)</text>
        </g>

        <!-- State Indicators -->
        <text class="anim-state-before" x="400" y="85" text-anchor="middle" font-size="18" font-weight="600" fill="#6c757d">Phase 1: Approach</text>
        <text class="anim-state-impact" x="400" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#FF3366" opacity="0">Phase 2: Impact (Internal Forces)</text>
        <text class="anim-state-after" x="400" y="85" text-anchor="middle" font-size="18" font-weight="600" fill="#6c757d" opacity="0">Phase 3: Separation</text>

        <!-- Live Formula Display -->
        <g class="math-font" font-size="15" text-anchor="middle">
            <text class="anim-state-before" x="400" y="115" fill="#343a40">
                <tspan fill="#4361EE" font-weight="bold">m₁v₁</tspan> + <tspan fill="#F77F00" font-weight="bold">m₂v₂</tspan> = <tspan fill="#4361EE">(2)(3)</tspan> + <tspan fill="#F77F00">(1)(0)</tspan> = <tspan font-weight="bold">6 kg·m/s</tspan>
            </text>
            <text class="anim-state-after" x="400" y="115" fill="#343a40" opacity="0">
                <tspan fill="#4361EE" font-weight="bold">m₁v₁</tspan> + <tspan fill="#F77F00" font-weight="bold">m₂v₂</tspan> = <tspan fill="#4361EE">(2)(1)</tspan> + <tspan fill="#F77F00">(1)(4)</tspan> = <tspan font-weight="bold">6 kg·m/s</tspan>
            </text>
        </g>

        <!-- Floor -->
        <line x1="50" y1="350" x2="750" y2="350" stroke="#adb5bd" stroke-width="4" stroke-linecap="round" />
        
        <!-- Distance Markers -->
        <g fill="#adb5bd" font-size="10" text-anchor="middle" class="math-font">
            <text x="100" y="365">x=100</text>
            <text x="400" y="365">x=400</text>
            <text x="700" y="365">x=700</text>
            <line x1="100" y1="350" x2="100" y2="355" stroke="#adb5bd" stroke-width="2" />
            <line x1="400" y1="350" x2="400" y2="355" stroke="#adb5bd" stroke-width="2" />
            <line x1="700" y1="350" x2="700" y2="355" stroke="#adb5bd" stroke-width="2" />
        </g>

        <!-- MASS 1 (Blue) -->
        <g class="anim-m1">
            <!-- Momentum Before (p1 = 6) -->
            <g class="anim-fade-out">
                <line x1="0" y1="270" x2="85" y2="270" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
                <text x="45" y="260" fill="#FF3366" font-size="13" font-weight="600" text-anchor="middle">p₁ = 6</text>
            </g>
            <!-- Momentum After (p1 = 2) -->
            <g class="anim-fade-in" opacity="0">
                <line x1="0" y1="270" x2="25" y2="270" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
                <text x="15" y="260" fill="#FF3366" font-size="13" font-weight="600" text-anchor="middle">p₁ = 2</text>
            </g>

            <!-- Sphere -->
            <circle cx="0" cy="320" r="30" fill="#4361EE" />
            <text x="0" y="324" text-anchor="middle" fill="white" font-size="13" font-weight="600">2 kg</text>
            <text x="0" y="342" text-anchor="middle" fill="#e0e0e0" font-size="10">m₁</text>

            <!-- Velocity Before (v1 = 3) -->
            <g class="anim-fade-out">
                <line x1="30" y1="320" x2="85" y2="320" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <text x="65" y="312" fill="#06D6A0" font-size="13" font-weight="600" text-anchor="middle">v₁ = 3</text>
            </g>
            <!-- Velocity After (v1 = 1) -->
            <g class="anim-fade-in" opacity="0">
                <line x1="30" y1="320" x2="45" y2="320" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <text x="45" y="312" fill="#06D6A0" font-size="13" font-weight="600" text-anchor="middle">v₁ = 1</text>
            </g>
        </g>

        <!-- MASS 2 (Orange) -->
        <g class="anim-m2">
            <!-- Momentum After (p2 = 4) -->
            <g class="anim-fade-in" opacity="0">
                <line x1="0" y1="290" x2="55" y2="290" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
                <text x="30" y="280" fill="#FF3366" font-size="13" font-weight="600" text-anchor="middle">p₂ = 4</text>
            </g>

            <!-- Sphere -->
            <circle cx="0" cy="330" r="20" fill="#F77F00" />
            <text x="0" y="334" text-anchor="middle" fill="white" font-size="11" font-weight="600">1 kg</text>
            <text x="0" y="346" text-anchor="middle" fill="#ffe0b2" font-size="9">m₂</text>

            <!-- Velocity After (v2 = 4) -->
            <g class="anim-fade-in" opacity="0">
                <line x1="20" y1="330" x2="95" y2="330" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <text x="65" y="322" fill="#06D6A0" font-size="13" font-weight="600" text-anchor="middle">v₂ = 4</text>
            </g>
        </g>

        <!-- Impact Forces & Flash -->
        <g class="anim-state-impact" opacity="0">
            <!-- Force F12 (on m2 by m1) -->
            <line x1="400" y1="325" x2="450" y2="325" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
            <text x="430" y="315" fill="#FF3366" font-size="14" font-weight="bold" text-anchor="middle">F₁₂</text>
            
            <!-- Force F21 (on m1 by m2) -->
            <line x1="400" y1="325" x2="350" y2="325" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red-left)" />
            <text x="370" y="315" fill="#FF3366" font-size="14" font-weight="bold" text-anchor="middle">F₂₁</text>
        </g>

        <!-- Impact Flash (Star) -->
        <g style="transform-origin: 400px 325px;" class="anim-flash" opacity="0">
            <path d="M 400 305 L 405 315 L 415 315 L 407 322 L 410 332 L 400 326 L 390 332 L 393 322 L 385 315 L 395 315 Z" fill="#FFD166" />
        </g>

        <!-- Momentum Conservation Bar -->
        <g transform="translate(0, 420)">
            <text x="400" y="0" text-anchor="middle" font-size="15" font-weight="600" fill="#495057">Total Momentum P = 6 kg·m/s (Constant)</text>
            
            <!-- Bar Outline -->
            <rect x="250" y="15" width="300" height="24" fill="#e9ecef" stroke="#adb5bd" stroke-width="2" rx="4" />
            
            <!-- m1 Momentum Bar (Blue) -->
            <rect class="anim-bar-m1" x="250" y="15" width="300" height="24" fill="#4361EE" rx="4" />
            
            <!-- m2 Momentum Bar (Orange) -->
            <rect class="anim-bar-m2" x="550" y="15" width="0" height="24" fill="#F77F00" rx="4" />
            
            <!-- Bar Labels -->
            <text class="anim-bar-text-m1" x="400" y="32" fill="white" font-size="13" font-weight="bold" text-anchor="middle">p₁</text>
            <text class="anim-fade-in" x="450" y="32" fill="white" font-size="13" font-weight="bold" text-anchor="middle" opacity="0">p₂</text>
            
            <!-- Scale markers -->
            <g fill="#adb5bd" font-size="10" text-anchor="middle" class="math-font">
                <text x="250" y="55">0</text>
                <text x="300" y="55">1</text>
                <text x="350" y="55">2</text>
                <text x="400" y="55">3</text>
                <text x="450" y="55">4</text>
                <text x="500" y="55">5</text>
                <text x="550" y="55">6</text>
                <line x1="250" y1="40" x2="250" y2="45" stroke="#adb5bd" />
                <line x1="300" y1="40" x2="300" y2="45" stroke="#adb5bd" />
                <line x1="350" y1="40" x2="350" y2="45" stroke="#adb5bd" />
                <line x1="400" y1="40" x2="400" y2="45" stroke="#adb5bd" />
                <line x1="450" y1="40" x2="450" y2="45" stroke="#adb5bd" />
                <line x1="500" y1="40" x2="500" y2="45" stroke="#adb5bd" />
                <line x1="550" y1="40" x2="550" y2="45" stroke="#adb5bd" />
            </g>
        </g>
    </svg>
    
    <button class="replay-btn" onclick="replayAnimation()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 6px;">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
        Replay
    </button>
</div>

<script>
    function replayAnimation() {
        const container = document.getElementById('animation-container');
        container.classList.remove('play');
        // Trigger reflow to restart animation
        void container.offsetWidth;
        container.classList.add('play');
    }
</script>

</body>
</html>
