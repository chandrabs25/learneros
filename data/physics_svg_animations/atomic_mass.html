<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Mass: Definition & Isotopic Measurement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-radius: 8px;
        }
        .font-inter { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'Roboto Mono', monospace; }
        .title { font-weight: 700; font-size: 22px; fill: #212529; }
        .subtitle { font-weight: 600; font-size: 16px; fill: #495057; }
        .label { font-size: 13px; fill: #495057; }
        .math { font-size: 14px; fill: #212529; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Diagram showing the definition of atomic mass unit using Carbon-12 and the separation of isotopes in a mass spectrometer.</title>
    <desc>An animated physics diagram. On the left, a Carbon-12 nucleus defines the 1u standard. On the right, a mass spectrometer uses a magnetic field to separate Neon-20 and Neon-22 isotopes based on their mass-to-charge ratio.</desc>

    <!-- Definitions -->
    <defs>
        <!-- Arrowhead for Velocity (Green) -->
        <marker id="arrow-v" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
        </marker>
        
        <!-- Arrowhead for Magnetic Force (Red) -->
        <marker id="arrow-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366"/>
        </marker>

        <!-- Glow Filter for the 1u Standard -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComponentTransfer in="blur" result="glow">
                <feFuncA type="linear" slope="1.5"/>
            </feComponentTransfer>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Magnetic Field Pattern (Purple X's indicating field into page) -->
        <pattern id="b-field" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 15 15 L 25 25 M 25 15 L 15 25" stroke="#7209B7" stroke-width="2" opacity="0.4"/>
        </pattern>
    </defs>

    <!-- Global Background -->
    <rect width="800" height="500" fill="#f8f9fa"/>

    <!-- Header -->
    <text x="400" y="35" text-anchor="middle" class="font-inter title">Atomic Mass: Definition &amp; Isotopic Measurement</text>
    <line x1="40" y1="50" x2="760" y2="50" stroke="#dee2e6" stroke-width="2"/>

    <!-- Divider Line -->
    <line x1="320" y1="60" x2="320" y2="480" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6,6"/>

    <!-- ========================================== -->
    <!-- ZONE 1: DEFINITION OF ATOMIC MASS UNIT     -->
    <!-- ========================================== -->
    <text x="160" y="80" text-anchor="middle" class="font-inter subtitle">1. The Standard (¹²C)</text>
    
    <!-- Label for 1u -->
    <text x="160" y="115" text-anchor="middle" class="font-inter label" fill="#212529">
        <tspan font-weight="bold" fill="#4361EE">1 u</tspan> = 1/12 mass of <tspan baseline-shift="super" font-size="10">12</tspan>C
    </text>
    <text x="160" y="135" text-anchor="middle" class="font-mono math" font-size="12" fill="#6c757d">
        ≈ 1.66 × 10⁻²⁷ kg
    </text>

    <!-- Rotating Carbon-12 Nucleus (11 nucleons + 1 detached) -->
    <g>
        <animateTransform attributeName="transform" type="rotate" from="0 160 250" to="360 160 250" dur="15s" repeatCount="indefinite"/>
        <!-- Protons (Red) -->
        <circle cx="152" cy="240" r="10" fill="#FF3366"/>
        <circle cx="168" cy="245" r="10" fill="#FF3366"/>
        <circle cx="155" cy="260" r="10" fill="#FF3366"/>
        <circle cx="165" cy="230" r="10" fill="#FF3366"/>
        <circle cx="145" cy="250" r="10" fill="#FF3366"/>
        <circle cx="175" cy="255" r="10" fill="#FF3366"/>
        <!-- Neutrons (Blue) -->
        <circle cx="160" cy="245" r="10" fill="#4361EE"/>
        <circle cx="148" cy="230" r="10" fill="#4361EE"/>
        <circle cx="172" cy="235" r="10" fill="#4361EE"/>
        <circle cx="162" cy="260" r="10" fill="#4361EE"/>
        <circle cx="150" cy="270" r="10" fill="#4361EE"/>
    </g>

    <!-- The Detached 1u Nucleon (Animated) -->
    <circle cx="160" cy="250" r="10" fill="#4361EE" filter="url(#glow)">
        <animate attributeName="cy" values="250; 250; 160; 160; 250" keyTimes="0; 0.05; 0.15; 0.95; 1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="r" values="10; 10; 14; 10; 14; 10; 14; 10; 14; 10; 10" keyTimes="0; 0.15; 0.25; 0.35; 0.45; 0.55; 0.65; 0.75; 0.85; 0.95; 1" dur="20s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Balance Scale Graphic -->
    <g transform="translate(10, 20)">
        <!-- Base -->
        <path d="M 130 440 L 170 440 L 150 360 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
        <!-- Beam -->
        <line x1="80" y1="360" x2="220" y2="360" stroke="#6c757d" stroke-width="4"/>
        <!-- Left Pan -->
        <line x1="60" y1="410" x2="100" y2="410" stroke="#6c757d" stroke-width="2"/>
        <line x1="80" y1="360" x2="60" y2="410" stroke="#adb5bd" stroke-width="1"/>
        <line x1="80" y1="360" x2="100" y2="410" stroke="#adb5bd" stroke-width="1"/>
        <!-- Right Pan -->
        <line x1="200" y1="410" x2="240" y2="410" stroke="#6c757d" stroke-width="2"/>
        <line x1="220" y1="360" x2="200" y2="410" stroke="#adb5bd" stroke-width="1"/>
        <line x1="220" y1="360" x2="240" y2="410" stroke="#adb5bd" stroke-width="1"/>
        
        <!-- Mini 12C on Left Pan -->
        <circle cx="75" cy="405" r="4" fill="#FF3366"/>
        <circle cx="85" cy="405" r="4" fill="#4361EE"/>
        <circle cx="80" cy="400" r="4" fill="#FF3366"/>
        <circle cx="72" cy="398" r="4" fill="#4361EE"/>
        <circle cx="88" cy="398" r="4" fill="#FF3366"/>
        <circle cx="80" cy="393" r="4" fill="#4361EE"/>
        
        <!-- 12 Individual Nucleons on Right Pan -->
        <circle cx="205" cy="405" r="2.5" fill="#4361EE"/>
        <circle cx="212" cy="405" r="2.5" fill="#FF3366"/>
        <circle cx="219" cy="405" r="2.5" fill="#4361EE"/>
        <circle cx="226" cy="405" r="2.5" fill="#FF3366"/>
        <circle cx="233" cy="405" r="2.5" fill="#4361EE"/>
        <circle cx="208" cy="400" r="2.5" fill="#FF3366"/>
        <circle cx="215" cy="400" r="2.5" fill="#4361EE"/>
        <circle cx="222" cy="400" r="2.5" fill="#FF3366"/>
        <circle cx="229" cy="400" r="2.5" fill="#4361EE"/>
        <circle cx="212" cy="395" r="2.5" fill="#4361EE"/>
        <circle cx="219" cy="395" r="2.5" fill="#FF3366"/>
        <circle cx="226" cy="395" r="2.5" fill="#4361EE"/>
    </g>


    <!-- ========================================== -->
    <!-- ZONE 2: MASS SPECTROMETER (MEASUREMENT)    -->
    <!-- ========================================== -->
    <text x="560" y="80" text-anchor="middle" class="font-inter subtitle">2. Isotopic Separation (Mass Spectrometer)</text>

    <!-- Magnetic Field Region -->
    <rect x="420" y="100" width="340" height="250" fill="url(#b-field)"/>
    <rect x="420" y="100" width="340" height="250" fill="none" stroke="#7209B7" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
    <text x="590" y="125" text-anchor="middle" class="font-inter label" fill="#7209B7" font-weight="600">Magnetic Field (B) into page</text>

    <!-- Formulas -->
    <rect x="630" y="140" width="110" height="30" rx="4" fill="#ffffff" stroke="#dee2e6"/>
    <text x="685" y="160" text-anchor="middle" class="font-mono math" fill="#7209B7" font-weight="bold">r = mv / qB</text>
    
    <text x="540" y="240" class="font-mono math" font-size="16" fill="#F77F00" font-weight="bold">r ∝ m</text>
    <text x="540" y="260" class="font-inter label" font-size="11" fill="#6c757d">(Heavier ion = larger radius)</text>

    <!-- Detectors Wall -->
    <rect x="440" y="345" width="100" height="10" fill="#495057" rx="2"/>
    <text x="430" y="354" text-anchor="end" class="font-inter label" font-weight="600">Detector</text>

    <!-- Ion Source -->
    <rect x="680" y="440" width="40" height="40" fill="#ced4da" rx="4" stroke="#6c757d" stroke-width="2"/>
    <text x="700" y="495" text-anchor="middle" class="font-inter label" font-weight="600">Ion Source</text>
    <path d="M 700 440 L 700 420" stroke="#adb5bd" stroke-width="2" stroke-dasharray="2,2"/>

    <!-- Trajectory Paths (Dashed) -->
    <!-- Path 1: 20Ne (r=100) -->
    <path d="M 700 440 L 700 350 A 100 100 0 0 0 500 350" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,5"/>
    <!-- Path 2: 22Ne (r=115) -->
    <path d="M 700 440 L 700 350 A 115 115 0 0 0 470 350" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,5"/>

    <!-- ========================================== -->
    <!-- ANIMATED IONS & VECTORS                    -->
    <!-- ========================================== -->

    <!-- ION 1: 20Ne -->
    <!-- Graphic and Vectors (Rotates with path) -->
    <g>
        <!-- Motion Path: Straight = 90px, Arc = 314px. Total = 404px. -->
        <!-- keyTimes: 0s(0), 5s(0.25), 6.5s(0.325), 11s(0.55), 20s(1) -->
        <animateMotion dur="20s" repeatCount="indefinite" path="M 700 440 L 700 350 A 100 100 0 0 0 500 350" keyPoints="0; 0; 0.223; 1; 1" keyTimes="0; 0.25; 0.325; 0.55; 1" calcMode="linear" rotate="auto"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.249;0.25;0.55;0.551;1" dur="20s" repeatCount="indefinite"/>
        
        <circle cx="0" cy="0" r="6" fill="#F77F00"/>
        
        <!-- Velocity Vector (Tangent, local +x) -->
        <path d="M 0 0 L 35 0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-v)"/>
        
        <!-- Magnetic Force Vector (Centripetal, local -y) -->
        <path d="M 0 0 L 0 -35" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-f)">
            <!-- Force only exists inside B-field (after 6.5s / 0.325) -->
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.324;0.325;0.55;0.551;1" dur="20s" repeatCount="indefinite"/>
        </path>
    </g>
    <!-- Label for Ion 1 (Does not rotate) -->
    <g>
        <animateMotion dur="20s" repeatCount="indefinite" path="M 700 440 L 700 350 A 100 100 0 0 0 500 350" keyPoints="0; 0; 0.223; 1; 1" keyTimes="0; 0.25; 0.325; 0.55; 1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.249;0.25;0.55;0.551;1" dur="20s" repeatCount="indefinite"/>
        <text x="12" y="15" class="font-inter" font-size="12" font-weight="bold" fill="#F77F00">²⁰Ne</text>
    </g>

    <!-- ION 2: 22Ne -->
    <!-- Graphic and Vectors (Rotates with path) -->
    <g>
        <!-- Motion Path: Straight = 90px, Arc = 361px. Total = 451px. -->
        <!-- keyTimes: 0s(0), 5s(0.25), 6.5s(0.325), 11.5s(0.575), 20s(1) -->
        <animateMotion dur="20s" repeatCount="indefinite" path="M 700 440 L 700 350 A 115 115 0 0 0 470 350" keyPoints="0; 0; 0.2; 1; 1" keyTimes="0; 0.25; 0.325; 0.575; 1" calcMode="linear" rotate="auto"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.249;0.25;0.575;0.576;1" dur="20s" repeatCount="indefinite"/>
        
        <circle cx="0" cy="0" r="7.5" fill="#F77F00"/>
        
        <!-- Velocity Vector -->
        <path d="M 0 0 L 35 0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-v)"/>
        
        <!-- Magnetic Force Vector -->
        <path d="M 0 0 L 0 -35" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-f)">
            <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.324;0.325;0.575;0.576;1" dur="20s" repeatCount="indefinite"/>
        </path>
    </g>
    <!-- Label for Ion 2 (Does not rotate) -->
    <g>
        <animateMotion dur="20s" repeatCount="indefinite" path="M 700 440 L 700 350 A 115 115 0 0 0 470 350" keyPoints="0; 0; 0.2; 1; 1" keyTimes="0; 0.25; 0.325; 0.575; 1" calcMode="linear"/>
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.249;0.25;0.575;0.576;1" dur="20s" repeatCount="indefinite"/>
        <text x="14" y="-10" class="font-inter" font-size="12" font-weight="bold" fill="#F77F00">²²Ne</text>
    </g>

    <!-- ========================================== -->
    <!-- DETECTOR FLASHES & READOUTS                -->
    <!-- ========================================== -->

    <!-- Flash & Readout for 20Ne (Hits at 11s / 0.55) -->
    <circle cx="500" cy="350" r="15" fill="#F77F00">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.549;0.55;0.6;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;25;35;5" keyTimes="0;0.549;0.55;0.6;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect x="465" y="315" width="70" height="22" rx="3" fill="#ffffff" stroke="#F77F00" stroke-width="1.5">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.549;0.55;0.85;0.9;1" dur="20s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="331" text-anchor="middle" class="font-mono math" font-size="13" font-weight="bold" fill="#F77F00">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.549;0.55;0.85;0.9;1" dur="20s" repeatCount="indefinite"/>
        19.99 u
    </text>

    <!-- Flash & Readout for 22Ne (Hits at 11.5s / 0.575) -->
    <circle cx="470" cy="350" r="15" fill="#F77F00">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.574;0.575;0.625;1" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="r" values="5;5;25;35;5" keyTimes="0;0.574;0.575;0.625;1" dur="20s" repeatCount="indefinite"/>
    </circle>
    <rect x="435" y="285" width="70" height="22" rx="3" fill="#ffffff" stroke="#F77F00" stroke-width="1.5">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.574;0.575;0.85;0.9;1" dur="20s" repeatCount="indefinite"/>
    </rect>
    <text x="470" y="301" text-anchor="middle" class="font-mono math" font-size="13" font-weight="bold" fill="#F77F00">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.574;0.575;0.85;0.9;1" dur="20s" repeatCount="indefinite"/>
        21.99 u
    </text>

    <!-- ========================================== -->
    <!-- LEGEND                                     -->
    <!-- ========================================== -->
    <rect x="20" y="440" width="240" height="45" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
    
    <circle cx="35" cy="452" r="5" fill="#FF3366"/> 
    <text x="45" y="456" font-size="11" class="font-inter label">Proton</text>
    
    <circle cx="105" cy="452" r="5" fill="#4361EE"/> 
    <text x="115" y="456" font-size="11" class="font-inter label">Neutron</text>
    
    <circle cx="175" cy="452" r="5" fill="#F77F00"/> 
    <text x="185" y="456" font-size="11" class="font-inter label">Neon Ion</text>

    <path d="M 30 472 L 45 472" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-v)"/> 
    <text x="55" y="476" font-size="11" class="font-inter label">Velocity (v)</text>
    
    <path d="M 130 472 L 145 472" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-f)"/> 
    <text x="155" y="476" font-size="11" class="font-inter label">Force (F<tspan baseline-shift="sub" font-size="9">B</tspan>)</text>

</svg>

</body>
</html>
