<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power: The Rate of Doing Work</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            user-select: none;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        .block-b { animation: moveB 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        .block-a { animation: moveA 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        
        .work-b { 
            animation: fillB 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
            transform-origin: 795px 250px; 
        }
        .work-a { 
            animation: fillA 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
            transform-origin: 795px 450px; 
        }
        
        .needle-b { 
            animation: dialB 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
            transform-origin: 680px 230px; 
        }
        .needle-a { 
            animation: dialA 7s cubic-bezier(0.4, 0, 0.6, 1) infinite; 
            transform-origin: 680px 430px; 
        }
        
        .comp-text { animation: fadeInOut 7s linear infinite; }

        /* Keyframes for 7 second loop */
        /* 0-1s: Idle | 1-2s: B moves | 1-4s: A moves | 4-6s: Finish | 6-7s: Reset */
        
        @keyframes moveB {
            0%, 14.28% { transform: translateX(0); opacity: 1; }
            28.57%, 85.71% { transform: translateX(400px); opacity: 1; }
            92.85% { transform: translateX(400px); opacity: 0; }
            92.86% { transform: translateX(0); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes moveA {
            0%, 14.28% { transform: translateX(0); opacity: 1; }
            57.14%, 85.71% { transform: translateX(400px); opacity: 1; }
            92.85% { transform: translateX(400px); opacity: 0; }
            92.86% { transform: translateX(0); opacity: 0; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes fillB {
            0%, 14.28% { transform: scaleY(0); opacity: 1; }
            28.57%, 85.71% { transform: scaleY(1); opacity: 1; }
            92.85% { transform: scaleY(1); opacity: 0; }
            92.86% { transform: scaleY(0); opacity: 0; }
            100% { transform: scaleY(0); opacity: 1; }
        }

        @keyframes fillA {
            0%, 14.28% { transform: scaleY(0); opacity: 1; }
            57.14%, 85.71% { transform: scaleY(1); opacity: 1; }
            92.85% { transform: scaleY(1); opacity: 0; }
            92.86% { transform: scaleY(0); opacity: 0; }
            100% { transform: scaleY(0); opacity: 1; }
        }

        @keyframes dialB {
            0%, 14.28% { transform: rotate(-90deg); }
            15.5%, 28.57% { transform: rotate(60deg); }
            30%, 100% { transform: rotate(-90deg); }
        }

        @keyframes dialA {
            0%, 14.28% { transform: rotate(-90deg); }
            15.5%, 57.14% { transform: rotate(-40deg); }
            58.5%, 100% { transform: rotate(-90deg); }
        }

        @keyframes fadeInOut {
            0%, 57.14% { opacity: 0; }
            60%, 85.71% { opacity: 1; }
            92.85%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg">
    <title>Power: The Rate of Doing Work</title>
    <desc>Animation comparing two blocks moving at different speeds to demonstrate that power is the rate of work.</desc>

    <defs>
        <!-- Arrowhead Markers -->
        <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366"/>
        </marker>
        <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
        </marker>
        <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE"/>
        </marker>

        <!-- Work Bar Gradient -->
        <linearGradient id="workGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#FFD166"/>
            <stop offset="100%" stop-color="#F77F00"/>
        </linearGradient>
    </defs>

    <!-- Header & Title -->
    <text x="450" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#212529">Power: The Rate of Doing Work</text>
    <text x="450" y="80" text-anchor="middle" font-size="22" font-weight="700" fill="#495057" class="math">P = dW/dt = F · v</text>

    <!-- Legend -->
    <g transform="translate(180, 115)">
        <line x1="0" y1="0" x2="30" y2="0" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
        <text x="40" y="5" font-size="14" fill="#495057" font-weight="600">Applied Force (F)</text>
        
        <line x1="190" y1="0" x2="220" y2="0" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
        <text x="230" y="5" font-size="14" fill="#495057" font-weight="600">Velocity (v)</text>
        
        <line x1="350" y1="0" x2="320" y2="0" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
        <text x="360" y="5" font-size="14" fill="#495057" font-weight="600">Friction (f_k)</text>
    </g>

    <!-- ========================================== -->
    <!-- SCENARIO B: HIGH POWER (FAST)              -->
    <!-- ========================================== -->
    <text x="50" y="170" font-weight="700" font-size="16" fill="#212529">Scenario B: High Power (Fast)</text>
    
    <!-- Track B -->
    <line x1="30" y1="250" x2="550" y2="250" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/>
    <line x1="475" y1="180" x2="475" y2="260" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="475" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#868e96">FINISH</text>

    <!-- Block B Group (Animated) -->
    <g class="block-b">
        <!-- Block -->
        <rect x="50" y="200" width="50" height="50" fill="#495057" rx="4"/>
        <text x="75" y="230" text-anchor="middle" fill="#f8f9fa" font-weight="700" font-size="16">m</text>
        
        <!-- Velocity Vector (Green, 3x length) -->
        <line x1="75" y1="185" x2="165" y2="185" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
        <text x="175" y="190" fill="#06D6A0" font-size="16" font-weight="700" class="math">3v</text>
        
        <!-- Force Vector (Red) -->
        <line x1="75" y1="225" x2="135" y2="225" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
        <text x="145" y="230" fill="#FF3366" font-size="16" font-weight="700" class="math">F</text>
        
        <!-- Friction Vector (Blue) -->
        <line x1="75" y1="225" x2="15" y2="225" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
        <text x="5" y="230" fill="#4361EE" font-size="16" font-weight="700" class="math" text-anchor="end">f_k</text>
        
        <!-- Label -->
        <text x="75" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" class="math">v = 3 m/s</text>
    </g>

    <!-- Power Dial B -->
    <g transform="translate(0, 0)">
        <text x="680" y="165" text-anchor="middle" font-weight="700" font-size="14" fill="#212529">Power (P = F·3v)</text>
        <path d="M 630 230 A 50 50 0 0 1 730 230" fill="none" stroke="#dee2e6" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Dial Ticks -->
        <g stroke="#adb5bd" stroke-width="2" stroke-linecap="round">
            <line x1="630" y1="230" x2="640" y2="230"/> <!-- -90 deg -->
            <line x1="730" y1="230" x2="720" y2="230"/> <!-- 90 deg -->
            <line x1="680" y1="180" x2="680" y2="190"/> <!-- 0 deg -->
            <line x1="644.6" y1="194.6" x2="651.7" y2="201.7"/> <!-- -45 deg -->
            <line x1="715.4" y1="194.6" x2="708.3" y2="201.7"/> <!-- 45 deg -->
        </g>
        
        <!-- Needle -->
        <line x1="680" y1="230" x2="680" y2="180" stroke="#FF3366" stroke-width="4" stroke-linecap="round" class="needle-b"/>
        <circle cx="680" cy="230" r="6" fill="#212529"/>
    </g>

    <!-- Work Bar B -->
    <g transform="translate(0, 0)">
        <text x="795" y="135" text-anchor="middle" font-weight="700" font-size="14" fill="#212529">Work Done</text>
        <rect x="780" y="150" width="30" height="100" fill="#e9ecef" rx="4" stroke="#ced4da" stroke-width="1"/>
        <rect x="780" y="150" width="30" height="100" fill="url(#workGrad)" rx="4" class="work-b"/>
        <text x="795" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" class="math">W = F·d</text>
    </g>


    <!-- ========================================== -->
    <!-- SCENARIO A: LOW POWER (SLOW)               -->
    <!-- ========================================== -->
    <text x="50" y="370" font-weight="700" font-size="16" fill="#212529">Scenario A: Low Power (Slow)</text>
    
    <!-- Track A -->
    <line x1="30" y1="450" x2="550" y2="450" stroke="#adb5bd" stroke-width="4" stroke-linecap="round"/>
    <line x1="475" y1="380" x2="475" y2="460" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="475" y="370" text-anchor="middle" font-size="12" font-weight="600" fill="#868e96">FINISH</text>

    <!-- Block A Group (Animated) -->
    <g class="block-a">
        <!-- Block -->
        <rect x="50" y="400" width="50" height="50" fill="#495057" rx="4"/>
        <text x="75" y="430" text-anchor="middle" fill="#f8f9fa" font-weight="700" font-size="16">m</text>
        
        <!-- Velocity Vector (Green, 1x length) -->
        <line x1="75" y1="385" x2="105" y2="385" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
        <text x="115" y="390" fill="#06D6A0" font-size="16" font-weight="700" class="math">v</text>
        
        <!-- Force Vector (Red) -->
        <line x1="75" y1="425" x2="135" y2="425" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
        <text x="145" y="430" fill="#FF3366" font-size="16" font-weight="700" class="math">F</text>
        
        <!-- Friction Vector (Blue) -->
        <line x1="75" y1="425" x2="15" y2="425" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
        <text x="5" y="430" fill="#4361EE" font-size="16" font-weight="700" class="math" text-anchor="end">f_k</text>
        
        <!-- Label -->
        <text x="75" y="470" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" class="math">v = 1 m/s</text>
    </g>

    <!-- Power Dial A -->
    <g transform="translate(0, 200)">
        <text x="680" y="165" text-anchor="middle" font-weight="700" font-size="14" fill="#212529">Power (P = F·v)</text>
        <path d="M 630 230 A 50 50 0 0 1 730 230" fill="none" stroke="#dee2e6" stroke-width="12" stroke-linecap="round"/>
        
        <!-- Dial Ticks -->
        <g stroke="#adb5bd" stroke-width="2" stroke-linecap="round">
            <line x1="630" y1="230" x2="640" y2="230"/> <!-- -90 deg -->
            <line x1="730" y1="230" x2="720" y2="230"/> <!-- 90 deg -->
            <line x1="680" y1="180" x2="680" y2="190"/> <!-- 0 deg -->
            <line x1="644.6" y1="194.6" x2="651.7" y2="201.7"/> <!-- -45 deg -->
            <line x1="715.4" y1="194.6" x2="708.3" y2="201.7"/> <!-- 45 deg -->
        </g>
        
        <!-- Needle -->
        <line x1="680" y1="230" x2="680" y2="180" stroke="#FF3366" stroke-width="4" stroke-linecap="round" class="needle-a"/>
        <circle cx="680" cy="230" r="6" fill="#212529"/>
    </g>

    <!-- Work Bar A -->
    <g transform="translate(0, 200)">
        <text x="795" y="135" text-anchor="middle" font-weight="700" font-size="14" fill="#212529">Work Done</text>
        <rect x="780" y="150" width="30" height="100" fill="#e9ecef" rx="4" stroke="#ced4da" stroke-width="1"/>
        <rect x="780" y="150" width="30" height="100" fill="url(#workGrad)" rx="4" class="work-a"/>
        <text x="795" y="270" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" class="math">W = F·d</text>
    </g>

    <!-- ========================================== -->
    <!-- CONCLUSION TEXT (Animated)                 -->
    <!-- ========================================== -->
    <g class="comp-text">
        <rect x="150" y="500" width="600" height="70" fill="#ffffff" stroke="#7209B7" stroke-width="3" rx="8" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.1))"/>
        <text x="450" y="530" text-anchor="middle" font-weight="700" font-size="20" fill="#7209B7">Same Work, Different Time = Different Power</text>
        <text x="450" y="555" text-anchor="middle" font-size="15" font-weight="600" fill="#495057">Block B does the work in 1/3 the time, developing 3x the power.</text>
    </g>

</svg>

</body>
</html>
