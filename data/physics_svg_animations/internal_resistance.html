<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Resistance Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --play-state: running;
            --color-bg: #f8f9fa;
            --color-emf: #F77F00;
            --color-r: #FF3366;
            --color-R-ext: #4361EE;
            --color-current: #06D6A0;
            --color-potential: #7209B7;
            --color-wire: #495057;
            --color-text: #212529;
            --color-grid: #dee2e6;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--color-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        /* Global Animation State */
        * {
            animation-play-state: var(--play-state) !important;
        }

        /* Typography */
        .title { font-weight: 600; font-size: 22px; fill: var(--color-text); }
        .label { font-weight: 600; font-size: 12px; fill: var(--color-text); }
        .math { font-family: 'Roboto Mono', monospace; font-size: 14px; }
        .math-large { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; }
        .math-small { font-family: 'Roboto Mono', monospace; font-size: 11px; }

        /* Circuit Elements */
        .wire { fill: none; stroke: var(--color-wire); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .wire-thin { fill: none; stroke: var(--color-wire); stroke-width: 1.5; stroke-dasharray: 4 4; }
        .component-emf { fill: none; stroke: var(--color-emf); stroke-linecap: round; }
        .component-r { fill: none; stroke: var(--color-r); stroke-width: 3; stroke-linejoin: round; }
        .component-R-ext { fill: none; stroke: var(--color-R-ext); stroke-width: 3; stroke-linejoin: round; }
        
        /* Graph Elements */
        .graph-axis { fill: none; stroke: var(--color-wire); stroke-width: 2; }
        .graph-grid { fill: none; stroke: var(--color-grid); stroke-width: 1; stroke-dasharray: 4 4; }
        .graph-line { fill: none; stroke: var(--color-potential); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
        .graph-area { fill: var(--color-r); opacity: 0.2; }

        /* Animations */
        @keyframes graph-morph {
            0%, 22%, 88%, 100% { d: path('M 450 380 L 470 380 L 470 180 L 500 180 L 540 180 L 600 180 L 680 180 L 700 180 L 700 380 L 740 380'); }
            25%, 52% { d: path('M 450 380 L 470 380 L 470 180 L 500 180 L 540 213.3 L 600 213.3 L 680 380 L 700 380 L 700 380 L 740 380'); }
            55%, 85% { d: path('M 450 380 L 470 380 L 470 180 L 500 180 L 540 280 L 600 280 L 680 380 L 700 380 L 700 380 L 740 380'); }
        }

        @keyframes area-morph {
            0%, 22%, 88%, 100% { d: path('M 500 180 L 540 180 L 540 180 Z'); }
            25%, 52% { d: path('M 500 180 L 540 180 L 540 213.3 Z'); }
            55%, 85% { d: path('M 500 180 L 540 180 L 540 280 Z'); }
        }

        @keyframes switch-toggle {
            0%, 22%, 88%, 100% { transform: rotate(-45deg); }
            25%, 85% { transform: rotate(0deg); }
        }

        @keyframes resistor-shrink {
            0%, 52%, 88%, 100% { transform: scaleY(1); }
            55%, 85% { transform: scaleY(0.3); }
        }

        @keyframes resistor-glow {
            0%, 22%, 88%, 100% { filter: drop-shadow(0 0 0px var(--color-r)); }
            25%, 52% { filter: drop-shadow(0 0 4px var(--color-r)); }
            55%, 85% { filter: drop-shadow(0 0 12px var(--color-r)); }
        }

        @keyframes fade-phase1 {
            0%, 22%, 88%, 100% { opacity: 1; }
            25%, 85% { opacity: 0; }
        }

        @keyframes fade-phase2 {
            0%, 22%, 55%, 100% { opacity: 0; }
            25%, 52% { opacity: 1; }
        }

        @keyframes fade-phase3 {
            0%, 52%, 88%, 100% { opacity: 0; }
            55%, 85% { opacity: 1; }
        }

        @keyframes move-particles {
            to { stroke-dashoffset: -400; }
        }

        /* Apply Animations */
        .anim-graph { animation: graph-morph 12s ease-in-out infinite; }
        .anim-area { animation: area-morph 12s ease-in-out infinite; }
        .anim-switch { animation: switch-toggle 12s ease-in-out infinite; transform-origin: 60px 250px; }
        .anim-resistor-ext { animation: resistor-shrink 12s ease-in-out infinite; transform-origin: 200px 350px; }
        .anim-resistor-int { animation: resistor-glow 12s ease-in-out infinite; }
        
        .phase1 { animation: fade-phase1 12s ease-in-out infinite; }
        .phase2 { animation: fade-phase2 12s ease-in-out infinite; }
        .phase3 { animation: fade-phase3 12s ease-in-out infinite; }

        .particles {
            fill: none;
            stroke: var(--color-current);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 0 40;
            clip-path: url(#wire-clip);
        }
        .particles-fast { animation: move-particles 1s linear infinite; }
        .particles-med { animation: move-particles 3s linear infinite; }

        /* UI Button */
        .btn { cursor: pointer; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Clip path to hide particles in the switch gap -->
            <clipPath id="wire-clip">
                <path d="M 0 0 L 800 0 L 800 500 L 0 500 Z M 40 200 L 80 200 L 80 250 L 40 250 Z" fill-rule="evenodd"/>
            </clipPath>
            
            <!-- Arrowhead for annotations -->
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-text)" />
            </marker>
        </defs>

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" class="title">Internal Resistance: Terminal Voltage vs. EMF</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="10" height="10" fill="var(--color-emf)" rx="2"/>
            <text x="16" y="9" class="label">EMF (E)</text>
            
            <rect x="80" y="0" width="10" height="10" fill="var(--color-r)" rx="2"/>
            <text x="96" y="9" class="label">Internal Res. (r)</text>
            
            <rect x="210" y="0" width="10" height="10" fill="var(--color-R-ext)" rx="2"/>
            <text x="226" y="9" class="label">Load (R)</text>
            
            <rect x="290" y="0" width="10" height="10" fill="var(--color-potential)" rx="2"/>
            <text x="306" y="9" class="label">Potential (V)</text>
            
            <circle cx="405" cy="5" r="5" fill="var(--color-current)"/>
            <text x="416" y="9" class="label">Current (I)</text>
        </g>

        <!-- Play/Pause Button -->
        <g id="play-pause-btn" class="btn" transform="translate(690, 15)">
            <rect width="90" height="28" rx="14" fill="#e9ecef" stroke="#ced4da" stroke-width="1.5"/>
            <text x="45" y="19" text-anchor="middle" class="label" fill="#495057">Play / Pause</text>
        </g>

        <!-- ========================================== -->
        <!-- LEFT PANEL: CIRCUIT VIEW                   -->
        <!-- ========================================== -->

        <!-- Real Battery Box -->
        <rect x="90" y="100" width="180" height="90" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="6 4" stroke-width="2" rx="8"/>
        <text x="180" y="120" text-anchor="middle" class="label" fill="#6c757d">Real Battery</text>

        <!-- Circuit Wires -->
        <path d="M 130 150 L 260 150 L 320 150 L 320 350 L 260 350" class="wire" rx="10"/>
        <path d="M 140 350 L 60 350 L 60 250" class="wire" rx="10"/>
        <path d="M 60 200 L 60 150 L 120 150" class="wire" rx="10"/>

        <!-- Switch -->
        <circle cx="60" cy="250" r="4" fill="var(--color-wire)"/>
        <circle cx="60" cy="200" r="4" fill="var(--color-wire)"/>
        <line x1="60" y1="250" x2="60" y2="200" class="wire anim-switch"/>
        <text x="30" y="230" class="label" fill="#6c757d" transform="rotate(-90 30 230)">Switch</text>

        <!-- EMF Source (E) -->
        <line x1="120" y1="135" x2="120" y2="165" class="component-emf" stroke-width="4"/>
        <line x1="130" y1="125" x2="130" y2="175" class="component-emf" stroke-width="2"/>
        <text x="125" y="190" text-anchor="middle" class="math" fill="var(--color-emf)">E</text>

        <!-- Internal Resistor (r) -->
        <path d="M 180 150 L 185 135 L 195 165 L 205 135 L 215 165 L 225 135 L 235 165 L 240 150" class="component-r anim-resistor-int"/>
        <text x="210" y="190" text-anchor="middle" class="math" fill="var(--color-r)">r</text>

        <!-- Terminals A & B -->
        <circle cx="90" cy="150" r="5" fill="#343a40"/>
        <text x="80" y="140" class="math-small" fill="#343a40">A</text>
        <circle cx="270" cy="150" r="5" fill="#343a40"/>
        <text x="280" y="140" class="math-small" fill="#343a40">B</text>

        <!-- External Load Resistor (R) -->
        <g class="anim-resistor-ext">
            <path d="M 260 350 L 250 330 L 230 370 L 210 330 L 190 370 L 170 330 L 150 370 L 140 350" class="component-R-ext"/>
        </g>
        <text x="200" y="395" text-anchor="middle" class="math" fill="var(--color-R-ext)">Load (R)</text>

        <!-- Voltmeter -->
        <path d="M 90 150 L 90 70 L 140 70" class="wire-thin"/>
        <path d="M 270 150 L 270 70 L 220 70" class="wire-thin"/>
        <rect x="140" y="50" width="80" height="40" rx="6" fill="#212529" stroke="#adb5bd" stroke-width="2"/>
        <text x="180" y="65" text-anchor="middle" class="label" fill="#adb5bd" font-size="10">VOLTMETER</text>
        <!-- Voltmeter Readings -->
        <text x="180" y="82" text-anchor="middle" class="math-large phase1" fill="var(--color-current)">12.0 V</text>
        <text x="180" y="82" text-anchor="middle" class="math-large phase2" fill="var(--color-current)">10.0 V</text>
        <text x="180" y="82" text-anchor="middle" class="math-large phase3" fill="var(--color-current)"> 6.0 V</text>

        <!-- Charge Carriers (Particles) -->
        <!-- Base path for reference: M 125 150 L 260 150 L 320 150 L 320 350 L 60 350 L 60 150 L 125 150 -->
        <rect x="60" y="150" width="260" height="200" rx="10" class="particles phase1" stroke-dashoffset="0"/>
        <rect x="60" y="150" width="260" height="200" rx="10" class="particles particles-med phase2"/>
        <rect x="60" y="150" width="260" height="200" rx="10" class="particles particles-fast phase3"/>


        <!-- ========================================== -->
        <!-- RIGHT PANEL: GRAPH VIEW                    -->
        <!-- ========================================== -->

        <!-- Graph Background & Grid -->
        <rect x="420" y="100" width="350" height="320" fill="#ffffff" rx="8" stroke="#e9ecef" stroke-width="2"/>
        
        <!-- Horizontal Grid Lines (Voltages) -->
        <line x1="450" y1="180" x2="750" y2="180" class="graph-grid"/> <!-- 12V -->
        <text x="445" y="184" text-anchor="end" class="math-small" fill="#6c757d">12V</text>
        
        <line x1="450" y1="213.3" x2="750" y2="213.3" class="graph-grid"/> <!-- 10V -->
        <text x="445" y="217.3" text-anchor="end" class="math-small phase2" fill="#6c757d">10V</text>
        
        <line x1="450" y1="280" x2="750" y2="280" class="graph-grid"/> <!-- 6V -->
        <text x="445" y="284" text-anchor="end" class="math-small phase3" fill="#6c757d">6V</text>
        
        <line x1="450" y1="380" x2="750" y2="380" class="graph-grid"/> <!-- 0V -->
        <text x="445" y="384" text-anchor="end" class="math-small" fill="#6c757d">0V</text>

        <!-- Vertical Grid Lines (Components) -->
        <line x1="470" y1="180" x2="470" y2="380" class="graph-grid"/>
        <line x1="500" y1="180" x2="500" y2="380" class="graph-grid"/>
        <line x1="540" y1="180" x2="540" y2="380" class="graph-grid"/>
        <line x1="600" y1="180" x2="600" y2="380" class="graph-grid"/>
        <line x1="680" y1="180" x2="680" y2="380" class="graph-grid"/>

        <!-- X-Axis Labels -->
        <text x="470" y="400" text-anchor="middle" class="math-small" fill="var(--color-emf)">E</text>
        <text x="520" y="400" text-anchor="middle" class="math-small" fill="var(--color-r)">r</text>
        <text x="570" y="400" text-anchor="middle" class="math-small" fill="#6c757d">Wire</text>
        <text x="640" y="400" text-anchor="middle" class="math-small" fill="var(--color-R-ext)">R</text>
        <text x="720" y="400" text-anchor="middle" class="math-small" fill="#6c757d">Switch</text>

        <!-- Axes -->
        <line x1="450" y1="380" x2="760" y2="380" class="graph-axis" marker-end="url(#arrow)"/>
        <line x1="450" y1="380" x2="450" y2="120" class="graph-axis" marker-end="url(#arrow)"/>
        <text x="450" y="110" text-anchor="middle" class="label">Potential (V)</text>
        <text x="760" y="415" text-anchor="end" class="label">Circuit Path</text>

        <!-- Ideal EMF Line (Dashed Orange) -->
        <line x1="470" y1="180" x2="750" y2="180" stroke="var(--color-emf)" stroke-width="2" stroke-dasharray="6 4" opacity="0.5"/>

        <!-- Lost Volts Area -->
        <path class="graph-area anim-area"/>

        <!-- Main Graph Line -->
        <path class="graph-line anim-graph"/>

        <!-- Graph Annotations -->
        <text x="520" y="170" text-anchor="middle" class="label phase2" fill="var(--color-r)">Lost Volts: 2V</text>
        <text x="520" y="170" text-anchor="middle" class="label phase3" fill="var(--color-r)">Lost Volts: 6V</text>
        
        <text x="640" y="205" text-anchor="middle" class="label phase2" fill="var(--color-potential)">Terminal V: 10V</text>
        <text x="640" y="270" text-anchor="middle" class="label phase3" fill="var(--color-potential)">Terminal V: 6V</text>


        <!-- ========================================== -->
        <!-- BOTTOM PANEL: LIVE MATH                    -->
        <!-- ========================================== -->
        <rect x="100" y="430" width="600" height="50" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
        
        <!-- Base Equation -->
        <text x="400" y="450" text-anchor="middle" class="math-small" fill="#6c757d">Terminal Voltage (V) = EMF (E) - [ Current (I) × Internal Res. (r) ]</text>

        <!-- Phase 1 Math -->
        <g class="phase1">
            <text x="400" y="470" text-anchor="middle" class="math-large">
                <tspan fill="var(--color-potential)">12.0V</tspan> = 
                <tspan fill="var(--color-emf)">12.0V</tspan> - ( 
                <tspan fill="var(--color-current)">0.0A</tspan> × 
                <tspan fill="var(--color-r)">2.0Ω</tspan> )
            </text>
        </g>

        <!-- Phase 2 Math -->
        <g class="phase2">
            <text x="400" y="470" text-anchor="middle" class="math-large">
                <tspan fill="var(--color-potential)">10.0V</tspan> = 
                <tspan fill="var(--color-emf)">12.0V</tspan> - ( 
                <tspan fill="var(--color-current)">1.0A</tspan> × 
                <tspan fill="var(--color-r)">2.0Ω</tspan> )
            </text>
        </g>

        <!-- Phase 3 Math -->
        <g class="phase3">
            <text x="400" y="470" text-anchor="middle" class="math-large">
                <tspan fill="var(--color-potential)"> 6.0V</tspan> = 
                <tspan fill="var(--color-emf)">12.0V</tspan> - ( 
                <tspan fill="var(--color-current)">3.0A</tspan> × 
                <tspan fill="var(--color-r)">2.0Ω</tspan> )
            </text>
        </g>

    </svg>

    <script>
        // Minimal JS for Play/Pause Interactivity
        const btn = document.getElementById('play-pause-btn');
        let isPaused = false;

        btn.addEventListener('click', () => {
            isPaused = !isPaused;
            document.documentElement.style.setProperty('--play-state', isPaused ? 'paused' : 'running');
            
            // Visual feedback on button
            const rect = btn.querySelector('rect');
            const text = btn.querySelector('text');
            if (isPaused) {
                rect.setAttribute('fill', '#ffe3e3');
                rect.setAttribute('stroke', '#ff8787');
                text.textContent = 'Paused';
                text.setAttribute('fill', '#c92a2a');
            } else {
                rect.setAttribute('fill', '#e9ecef');
                rect.setAttribute('stroke', '#ced4da');
                text.textContent = 'Play / Pause';
                text.setAttribute('fill', '#495057');
            }
        });
    </script>
</body>
</html>
