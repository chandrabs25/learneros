<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elastic Behavior: Stress and Strain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            height: auto;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Animations */
        .anim-load {
            animation: load-drop 8s ease-in-out infinite;
            transform-origin: 250px 290px;
        }

        .anim-rope {
            animation: rope-stretch 8s ease-in-out infinite;
            transform-origin: 250px 90px;
        }

        .anim-force-red {
            animation: force-red-grow 8s ease-in-out infinite;
            transform-origin: 250px 325px;
        }

        .anim-force-blue {
            animation: force-blue-grow 8s ease-in-out infinite;
            transform-origin: 250px 290px;
        }

        .anim-dl {
            animation: dl-fade 8s ease-in-out infinite;
        }

        .anim-micro-bonds {
            animation: micro-bonds-stretch 8s ease-in-out infinite;
            transform-origin: 620px 100px;
        }

        .anim-micro-row1 { animation: micro-row1 8s ease-in-out infinite; }
        .anim-micro-row2 { animation: micro-row2 8s ease-in-out infinite; }
        .anim-micro-row3 { animation: micro-row3 8s ease-in-out infinite; }
        .anim-micro-row4 { animation: micro-row4 8s ease-in-out infinite; }

        @keyframes load-drop {
            0% { opacity: 0; transform: translateY(0); }
            1% { opacity: 1; transform: translateY(0); }
            20%, 60% { opacity: 1; transform: translateY(30px); }
            61% { opacity: 0; transform: translateY(30px); }
            80%, 100% { opacity: 0; transform: translateY(0); }
        }

        @keyframes rope-stretch {
            0%, 1% { transform: scaleY(1); }
            20%, 60% { transform: scaleY(1.15); }
            80%, 100% { transform: scaleY(1); }
        }

        @keyframes force-red-grow {
            0% { transform: scaleY(0); opacity: 0; }
            1% { transform: scaleY(0); opacity: 1; }
            20%, 60% { transform: scaleY(1); opacity: 1; }
            61%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes force-blue-grow {
            0%, 20% { transform: scaleY(0); opacity: 0; }
            30%, 60% { transform: scaleY(1); opacity: 1; }
            61%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes dl-fade {
            0%, 20% { opacity: 0; }
            30%, 60% { opacity: 1; }
            61%, 100% { opacity: 0; }
        }

        @keyframes micro-bonds-stretch {
            0%, 1% { transform: scaleY(1); }
            20%, 60% { transform: scaleY(1.1333); }
            80%, 100% { transform: scaleY(1); }
        }

        @keyframes micro-row1 {
            0%, 1% { transform: translateY(0); }
            20%, 60% { transform: translateY(4px); }
            80%, 100% { transform: translateY(0); }
        }
        @keyframes micro-row2 {
            0%, 1% { transform: translateY(0); }
            20%, 60% { transform: translateY(8px); }
            80%, 100% { transform: translateY(0); }
        }
        @keyframes micro-row3 {
            0%, 1% { transform: translateY(0); }
            20%, 60% { transform: translateY(12px); }
            80%, 100% { transform: translateY(0); }
        }
        @keyframes micro-row4 {
            0%, 1% { transform: translateY(0); }
            20%, 60% { transform: translateY(16px); }
            80%, 100% { transform: translateY(0); }
        }

        /* Interactive Hover Effects */
        .formula {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .formula rect {
            transition: all 0.3s ease;
        }
        .formula:hover rect {
            fill: #f1f3f5;
            stroke: #DEE2E6;
        }

        /* Cross-highlighting using :has() */
        svg:has(.formula-stress:hover) .force-red {
            filter: drop-shadow(0 0 6px #FF3366);
            stroke-width: 7px;
        }
        svg:has(.formula-stress:hover) .rope {
            stroke: #FF3366;
            filter: drop-shadow(0 0 4px #FF3366);
        }
        svg:has(.formula-strain:hover) .dl-element {
            filter: drop-shadow(0 0 4px #06D6A0);
            stroke-width: 3px;
        }
        svg:has(.formula-strain:hover) .rope {
            stroke: #06D6A0;
            filter: drop-shadow(0 0 4px #06D6A0);
        }
        svg:has(.formula-youngs:hover) .micro-bonds-v line,
        svg:has(.formula-youngs:hover) .micro-row line {
            stroke: #7209B7;
        }
        svg:has(.formula-youngs:hover) .micro-row circle {
            fill: #7209B7;
        }

        .rope { transition: stroke 0.3s ease; }
        .force-red { transition: stroke-width 0.3s ease, filter 0.3s ease; }
        .dl-element { transition: stroke-width 0.3s ease, filter 0.3s ease; }
        .micro-bonds-v line, .micro-row line, .micro-row circle { transition: all 0.3s ease; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions -->
    <defs>
        <!-- Background Grid -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9ecef" stroke-width="1"/>
        </pattern>

        <!-- Arrow Markers -->
        <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE"/>
        </marker>

        <!-- Microscopic Clip Path -->
        <clipPath id="micro-clip">
            <circle cx="620" cy="160" r="108"/>
        </clipPath>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="url(#grid)"/>

    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#212529">
        Elastic Behavior: Stress and Strain in a Crane Cable
    </text>

    <!-- ========================================== -->
    <!-- MACROSCOPIC VIEW (LEFT)                    -->
    <!-- ========================================== -->

    <!-- Crane Arm -->
    <rect x="50" y="70" width="350" height="20" fill="#495057" rx="4"/>
    <path d="M 230 90 L 270 90 L 260 100 L 240 100 Z" fill="#343a40"/>

    <!-- Original Length Label (L) -->
    <path d="M 180 100 L 170 100 L 170 290 L 180 290" fill="none" stroke="#6C757D" stroke-width="2"/>
    <text x="155" y="200" text-anchor="end" font-family="Roboto Mono" font-size="16" fill="#495057">L</text>

    <!-- Rope -->
    <line x1="250" y1="100" x2="250" y2="290" stroke="#6C757D" stroke-width="6" class="rope anim-rope" vector-effect="non-scaling-stroke"/>

    <!-- Load and Forces Group (Translates together) -->
    <g class="anim-load">
        <!-- Elongation Label (Delta L) -->
        <g class="anim-dl">
            <path d="M 180 290 L 170 290 L 170 320 L 180 320" fill="none" stroke="#06D6A0" stroke-width="2" class="dl-element"/>
            <text x="155" y="310" text-anchor="end" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#06D6A0" class="dl-element">ΔL</text>
            <line x1="190" y1="290" x2="310" y2="290" stroke="#06D6A0" stroke-width="2" stroke-dasharray="5 5" class="dl-element"/>
        </g>

        <!-- Load Mass -->
        <path d="M 240 290 C 240 275, 260 275, 260 290" fill="none" stroke="#343a40" stroke-width="4"/>
        <rect x="200" y="290" width="100" height="70" fill="#343a40" rx="6"/>
        <text x="250" y="335" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#ffffff">M</text>

        <!-- Applied Force (Weight) -->
        <line x1="250" y1="325" x2="250" y2="425" stroke="#FF3366" stroke-width="5" marker-end="url(#arrow-red)" class="force-red anim-force-red"/>
        <text x="265" y="415" fill="#FF3366" font-family="Roboto Mono" font-size="16" font-weight="700" class="anim-force-red">
            F<tspan baseline-shift="sub" font-size="12">g</tspan> = Mg
        </text>

        <!-- Restoring Force (Tension) -->
        <line x1="250" y1="290" x2="250" y2="190" stroke="#4361EE" stroke-width="5" marker-end="url(#arrow-blue)" class="force-blue anim-force-blue"/>
        <text x="265" y="210" fill="#4361EE" font-family="Roboto Mono" font-size="16" font-weight="700" class="anim-force-blue">
            F<tspan baseline-shift="sub" font-size="12">int</tspan> = T
        </text>
    </g>

    <text x="250" y="475" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#6C757D">Macroscopic View</text>


    <!-- ========================================== -->
    <!-- MICROSCOPIC VIEW (RIGHT TOP)               -->
    <!-- ========================================== -->

    <!-- Connecting Lines -->
    <path d="M 255 150 L 520 110" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4" fill="none"/>
    <path d="M 255 250 L 520 210" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

    <!-- Magnifying Glass Background -->
    <circle cx="620" cy="160" r="110" fill="#ffffff" stroke="#DEE2E6" stroke-width="4"/>
    
    <!-- Atomic Lattice (Clipped) -->
    <g clip-path="url(#micro-clip)">
        <rect x="510" y="50" width="220" height="220" fill="#f8f9fa"/>
        
        <!-- Vertical Bonds (Stretch) -->
        <g class="anim-micro-bonds micro-bonds-v">
            <line x1="540" y1="100" x2="540" y2="220" stroke="#ADB5BD" stroke-width="3"/>
            <line x1="580" y1="100" x2="580" y2="220" stroke="#ADB5BD" stroke-width="3"/>
            <line x1="620" y1="100" x2="620" y2="220" stroke="#ADB5BD" stroke-width="3"/>
            <line x1="660" y1="100" x2="660" y2="220" stroke="#ADB5BD" stroke-width="3"/>
            <line x1="700" y1="100" x2="700" y2="220" stroke="#ADB5BD" stroke-width="3"/>
        </g>

        <!-- Horizontal Rows (Translate) -->
        <!-- Row 0 (Fixed) -->
        <g class="micro-row">
            <line x1="540" y1="100" x2="700" y2="100" stroke="#ADB5BD" stroke-width="3"/>
            <circle cx="540" cy="100" r="6" fill="#6C757D"/><circle cx="580" cy="100" r="6" fill="#6C757D"/>
            <circle cx="620" cy="100" r="6" fill="#6C757D"/><circle cx="660" cy="100" r="6" fill="#6C757D"/>
            <circle cx="700" cy="100" r="6" fill="#6C757D"/>
        </g>
        <!-- Row 1 -->
        <g class="anim-micro-row1 micro-row">
            <line x1="540" y1="130" x2="700" y2="130" stroke="#ADB5BD" stroke-width="3"/>
            <circle cx="540" cy="130" r="6" fill="#6C757D"/><circle cx="580" cy="130" r="6" fill="#6C757D"/>
            <circle cx="620" cy="130" r="6" fill="#6C757D"/><circle cx="660" cy="130" r="6" fill="#6C757D"/>
            <circle cx="700" cy="130" r="6" fill="#6C757D"/>
        </g>
        <!-- Row 2 -->
        <g class="anim-micro-row2 micro-row">
            <line x1="540" y1="160" x2="700" y2="160" stroke="#ADB5BD" stroke-width="3"/>
            <circle cx="540" cy="160" r="6" fill="#6C757D"/><circle cx="580" cy="160" r="6" fill="#6C757D"/>
            <circle cx="620" cy="160" r="6" fill="#6C757D"/><circle cx="660" cy="160" r="6" fill="#6C757D"/>
            <circle cx="700" cy="160" r="6" fill="#6C757D"/>
        </g>
        <!-- Row 3 -->
        <g class="anim-micro-row3 micro-row">
            <line x1="540" y1="190" x2="700" y2="190" stroke="#ADB5BD" stroke-width="3"/>
            <circle cx="540" cy="190" r="6" fill="#6C757D"/><circle cx="580" cy="190" r="6" fill="#6C757D"/>
            <circle cx="620" cy="190" r="6" fill="#6C757D"/><circle cx="660" cy="190" r="6" fill="#6C757D"/>
            <circle cx="700" cy="190" r="6" fill="#6C757D"/>
        </g>
        <!-- Row 4 -->
        <g class="anim-micro-row4 micro-row">
            <line x1="540" y1="220" x2="700" y2="220" stroke="#ADB5BD" stroke-width="3"/>
            <circle cx="540" cy="220" r="6" fill="#6C757D"/><circle cx="580" cy="220" r="6" fill="#6C757D"/>
            <circle cx="620" cy="220" r="6" fill="#6C757D"/><circle cx="660" cy="220" r="6" fill="#6C757D"/>
            <circle cx="700" cy="220" r="6" fill="#6C757D"/>
        </g>
    </g>

    <!-- Magnifying Glass Border & Handle -->
    <circle cx="620" cy="160" r="110" fill="none" stroke="#495057" stroke-width="6"/>
    <line x1="698" y1="238" x2="730" y2="270" stroke="#495057" stroke-width="12" stroke-linecap="round"/>
    
    <text x="620" y="295" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#6C757D">Microscopic Lattice</text>


    <!-- ========================================== -->
    <!-- FORMULA BOX (RIGHT BOTTOM)                 -->
    <!-- ========================================== -->

    <rect x="480" y="320" width="280" height="150" fill="#ffffff" stroke="#DEE2E6" stroke-width="2" rx="8"/>
    <text x="620" y="345" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#495057">Mathematical Relations</text>
    
    <!-- Stress Formula -->
    <g class="formula formula-stress">
        <rect x="490" y="355" width="260" height="30" fill="transparent" rx="4"/>
        <text x="500" y="375" font-family="Roboto Mono" font-size="14" fill="#212529">
            Stress (σ) = <tspan fill="#FF3366" font-weight="bold">F</tspan> / A
        </text>
    </g>

    <!-- Strain Formula -->
    <g class="formula formula-strain">
        <rect x="490" y="390" width="260" height="30" fill="transparent" rx="4"/>
        <text x="500" y="410" font-family="Roboto Mono" font-size="14" fill="#212529">
            Strain (ε) = <tspan fill="#06D6A0" font-weight="bold">ΔL</tspan> / L
        </text>
    </g>

    <!-- Young's Modulus Formula -->
    <g class="formula formula-youngs">
        <rect x="490" y="425" width="260" height="30" fill="transparent" rx="4"/>
        <text x="500" y="445" font-family="Roboto Mono" font-size="14" fill="#212529">
            Young's Modulus (Y) = σ / ε
        </text>
    </g>


    <!-- ========================================== -->
    <!-- LEGEND (LEFT BOTTOM)                       -->
    <!-- ========================================== -->

    <rect x="30" y="390" width="190" height="80" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" rx="4"/>
    
    <circle cx="45" cy="410" r="5" fill="#FF3366"/>
    <text x="60" y="414" font-family="Inter" font-size="12" fill="#495057">Applied Force (Weight)</text>
    
    <circle cx="45" cy="430" r="5" fill="#4361EE"/>
    <text x="60" y="434" font-family="Inter" font-size="12" fill="#495057">Reaction Force (Tension)</text>
    
    <circle cx="45" cy="450" r="5" fill="#06D6A0"/>
    <text x="60" y="454" font-family="Inter" font-size="12" fill="#495057">Elongation (Strain)</text>

</svg>

</body>
</html>
