<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculus of Work: Integration as a Limit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        
        .svg-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Hardware acceleration for smooth animation */
        g, path, rect, text {
            will-change: opacity;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 520" id="main-svg" xmlns="http://www.w3.org/2000/svg">
        <title>Calculus of Work: Integration as a Limit</title>
        <desc>Animated diagram showing how the area under a force-displacement curve is calculated using calculus by shrinking the width of rectangles to zero.</desc>
        
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            
            <!-- Drop Shadow for Formula Panel -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
            </filter>
        </defs>

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#2B2D42">Calculus in Physics: Work as an Integral</text>

        <!-- Legend -->
        <g id="legend" transform="translate(630, 20)" font-size="12" font-weight="600" fill="#2B2D42">
            <rect x="0" y="0" width="14" height="14" rx="2" fill="#4361EE" opacity="0.6"/>
            <text x="22" y="11.5">Approximation</text>
            
            <rect x="0" y="22" width="14" height="14" rx="2" fill="#FF3366" opacity="0.8"/>
            <text x="22" y="33.5">Error</text>
            
            <rect x="0" y="44" width="14" height="14" rx="2" fill="#06D6A0" opacity="0.4"/>
            <text x="22" y="55.5">Exact Work</text>
        </g>

        <!-- Grid Lines -->
        <g stroke="#e9ecef" stroke-width="1" stroke-dasharray="4,4">
            <line x1="100" y1="100" x2="700" y2="100"/>
            <line x1="100" y1="200" x2="700" y2="200"/>
            <line x1="100" y1="300" x2="700" y2="300"/>
        </g>

        <!-- Axes -->
        <g id="axes">
            <path d="M 80 400 L 720 400" stroke="#000000" stroke-width="2" marker-end="url(#arrow-black)"/>
            <path d="M 100 420 L 100 80" stroke="#000000" stroke-width="2" marker-end="url(#arrow-black)"/>
            
            <text x="-240" y="60" transform="rotate(-90)" font-size="15" font-weight="600" fill="#000000">Force F(x) (N)</text>
            <text x="700" y="440" text-anchor="end" font-size="15" font-weight="600" fill="#000000">Displacement x (m)</text>
            
            <!-- Ticks -->
            <line x1="150" y1="394" x2="150" y2="406" stroke="#000000" stroke-width="2"/>
            <text x="150" y="425" text-anchor="middle" class="math" font-size="15" font-weight="700" fill="#000000">x_i</text>
            
            <line x1="650" y1="394" x2="650" y2="406" stroke="#000000" stroke-width="2"/>
            <text x="650" y="425" text-anchor="middle" class="math" font-size="15" font-weight="700" fill="#000000">x_f</text>
        </g>

        <!-- Dynamic Graph Elements -->
        <g id="integral-group" opacity="0">
            <path id="integral-path" fill="#06D6A0" opacity="0.4"/>
        </g>
        
        <g id="rect-group"></g>
        <g id="error-group"></g>
        
        <!-- Main Function Curve -->
        <path id="curve-path" fill="none" stroke="#2B2D42" stroke-width="3.5" stroke-linecap="round"/>

        <!-- Delta x Indicator -->
        <g id="dx-indicator" opacity="1">
            <path id="dx-bracket" fill="none" stroke="#2B2D42" stroke-width="2"/>
            <text id="dx-text" text-anchor="middle" class="math" font-size="14" font-weight="700" fill="#2B2D42">Δx</text>
        </g>

        <!-- Instantaneous Force Vector (Limit State) -->
        <g id="instantaneous-force" opacity="0">
            <line id="inst-vector" stroke="#FF3366" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
            <circle id="inst-dot" r="5" fill="#FF3366"/>
            <text id="inst-text" class="math" font-size="15" font-weight="700" fill="#FF3366">F(x)</text>
        </g>

        <!-- Formula Panel -->
        <rect x="225" y="445" width="350" height="65" rx="8" fill="#ffffff" filter="url(#shadow)"/>
        
        <g id="formula-sum" opacity="1">
            <text x="400" y="470" text-anchor="middle" class="math" font-size="20" font-weight="700" fill="#4361EE">W ≈ Σ F(x) Δx</text>
            <text x="400" y="495" text-anchor="middle" font-size="14" font-weight="600" fill="#FF3366">Δx is large (High Error)</text>
        </g>
        
        <g id="formula-int" opacity="0">
            <text x="400" y="470" text-anchor="middle" class="math" font-size="20" font-weight="700" fill="#06D6A0">W = ∫ F(x) dx</text>
            <text x="400" y="495" text-anchor="middle" font-size="14" font-weight="600" fill="#06D6A0">Δx → 0 (Exact Area)</text>
        </g>

    </svg>
</div>

<script>
    // Mathematical function for the curve
    function f(x) {
        // x ranges from 150 to 650. Map to t in [0, 1]
        let t = (x - 150) / 500;
        // Base height 100, peaks around 250
        return 100 + 150 * Math.sin(t * Math.PI) + 50 * Math.sin(t * Math.PI * 2);
    }

    // Convert function value to SVG Y coordinate
    function getY(x) {
        return 400 - f(x);
    }

    // Initialize static paths
    function initPaths() {
        let curveD = `M 150 ${getY(150)}`;
        let integralD = `M 150 400 L 150 ${getY(150)}`;
        
        for(let x = 150; x <= 650; x += 2) {
            curveD += ` L ${x} ${getY(x)}`;
            integralD += ` L ${x} ${getY(x)}`;
        }
        integralD += ` L 650 400 Z`;
        
        document.getElementById('curve-path').setAttribute('d', curveD);
        document.getElementById('integral-path').setAttribute('d', integralD);
    }

    // DOM Elements
    const rectGroup = document.getElementById('rect-group');
    const errorGroup = document.getElementById('error-group');
    const dxIndicator = document.getElementById('dx-indicator');
    const dxBracket = document.getElementById('dx-bracket');
    const dxText = document.getElementById('dx-text');
    const formulaSum = document.getElementById('formula-sum');
    const formulaInt = document.getElementById('formula-int');
    const integralGroup = document.getElementById('integral-group');
    const instForce = document.getElementById('instantaneous-force');
    const instVector = document.getElementById('inst-vector');
    const instDot = document.getElementById('inst-dot');
    const instText = document.getElementById('inst-text');

    // Easing function for smooth animation
    function easeInOutCubic(x) {
        return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    // Draw rectangles and error polygons for a given number of subdivisions (n)
    function drawRects(n) {
        let dx = 500 / n;
        let rectsHTML = '';
        let errorsHTML = '';
        
        for(let i = 0; i < n; i++) {
            let x_k = 150 + i * dx;
            let x_k1 = x_k + dx;
            let y_rect = getY(x_k); // Left Riemann sum
            let height = 400 - y_rect;
            
            // Rectangle
            rectsHTML += `<rect x="${x_k}" y="${y_rect}" width="${dx}" height="${height}" fill="rgba(67, 97, 238, 0.6)" stroke="#2740A0" stroke-width="1"/>`;
            
            // Error Polygon (perfectly bounds the gap between rectangle top and curve)
            let errD = `M ${x_k} ${y_rect} L ${x_k1} ${y_rect}`;
            
            // Trace curve backwards to ensure perfect fit
            for(let px = x_k1; px >= x_k; px -= 2) {
                errD += ` L ${px} ${getY(px)}`;
            }
            errD += ` L ${x_k} ${getY(x_k)} Z`;
            
            errorsHTML += `<path d="${errD}" fill="#FF3366" opacity="0.85"/>`;
        }
        
        rectGroup.innerHTML = rectsHTML;
        errorGroup.innerHTML = errorsHTML;

        // Update Delta x indicator
        if (n < 20) {
            let opacity = 1 - (n - 4) / 16;
            dxIndicator.style.opacity = opacity;
            let bx = 150;
            let bw = dx;
            let by = 412;
            dxBracket.setAttribute('d', `M ${bx} ${by-6} L ${bx} ${by} L ${bx+bw} ${by} L ${bx+bw} ${by-6}`);
            dxText.setAttribute('x', bx + bw/2);
            dxText.setAttribute('y', by + 18);
        } else {
            dxIndicator.style.opacity = 0;
        }
    }

    // Main Animation Loop
    function animate(time) {
        // 10-second cyclic timeline
        let t = time % 10000;
        
        if (t < 2000) {
            // State 1: Coarse Approximation (Hold n=4)
            drawRects(4);
            formulaSum.style.opacity = 1;
            formulaInt.style.opacity = 0;
            integralGroup.style.opacity = 0;
            rectGroup.style.opacity = 1;
            errorGroup.style.opacity = 1;
            instForce.style.opacity = 0;
            
        } else if (t < 4500) {
            // State 2: Refinement (Animate n from 4 to 60)
            let progress = (t - 2000) / 2500;
            let n = 4 + 56 * easeInOutCubic(progress);
            drawRects(Math.floor(n));
            
            formulaSum.style.opacity = 1;
            formulaInt.style.opacity = 0;
            integralGroup.style.opacity = 0;
            rectGroup.style.opacity = 1;
            errorGroup.style.opacity = 1;
            instForce.style.opacity = 0;
            
        } else if (t < 5500) {
            // Transition: Fade Rectangles out, Integral Area in
            drawRects(60);
            let progress = (t - 4500) / 1000;
            
            formulaSum.style.opacity = 1 - progress;
            formulaInt.style.opacity = progress;
            integralGroup.style.opacity = progress;
            rectGroup.style.opacity = 1 - progress;
            errorGroup.style.opacity = 1 - progress;
            instForce.style.opacity = 0;
            
        } else if (t < 8000) {
            // State 3: The Limit (Hold Integral, Scan Instantaneous Force)
            drawRects(60);
            formulaSum.style.opacity = 0;
            formulaInt.style.opacity = 1;
            integralGroup.style.opacity = 1;
            rectGroup.style.opacity = 0;
            errorGroup.style.opacity = 0;
            
            // Scanning Vector Animation
            instForce.style.opacity = 1;
            let scanProgress = (t - 5500) / 2500;
            let scanX = 150 + 500 * scanProgress;
            let scanY = getY(scanX);
            
            instVector.setAttribute('x1', scanX);
            instVector.setAttribute('y1', 400);
            instVector.setAttribute('x2', scanX);
            instVector.setAttribute('y2', scanY);
            
            instDot.setAttribute('cx', scanX);
            instDot.setAttribute('cy', scanY);
            
            instText.setAttribute('x', scanX + 12);
            instText.setAttribute('y', scanY + 15);
            
        } else if (t < 8500) {
            // Transition: Fade back to n=60 Rectangles
            drawRects(60);
            let progress = (t - 8000) / 500;
            
            formulaSum.style.opacity = progress;
            formulaInt.style.opacity = 1 - progress;
            integralGroup.style.opacity = 1 - progress;
            rectGroup.style.opacity = progress;
            errorGroup.style.opacity = progress;
            instForce.style.opacity = 1 - progress;
            
        } else {
            // Reset: Animate n from 60 back to 4
            let progress = (t - 8500) / 1500;
            let n = 60 - 56 * easeInOutCubic(progress);
            drawRects(Math.floor(n));
            
            formulaSum.style.opacity = 1;
            formulaInt.style.opacity = 0;
            integralGroup.style.opacity = 0;
            rectGroup.style.opacity = 1;
            errorGroup.style.opacity = 1;
            instForce.style.opacity = 0;
        }
        
        requestAnimationFrame(animate);
    }

    // Initialization
    initPaths();
    requestAnimationFrame(animate);

</script>
</body>
</html>
