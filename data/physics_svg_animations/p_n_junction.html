<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-N Junction: Diffusion & Equilibrium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
        }

        /* UI Button */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }

        button {
            background: #4361EE;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 2px 5px rgba(67, 97, 238, 0.3);
        }

        button:hover {
            background: #3651D4;
        }

        /* CSS Animations */
        .scene-wrapper { animation: sceneReset 12s infinite; }
        .p-block { animation: snapP 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .n-block { animation: snapN 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        
        .hole-diffuse-1 { animation: diffuseH1 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .hole-diffuse-2 { animation: diffuseH2 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .electron-diffuse-1 { animation: diffuseE1 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .electron-diffuse-2 { animation: diffuseE2 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        
        .ion-depletion { animation: ionGlow 12s infinite; }
        .ion-static { opacity: 0.15; }
        
        .fade-in { animation: fadeIn 12s infinite; }
        .fade-in-late { animation: fadeInLate 12s infinite; }
        .e-field-group { animation: fadeInField 12s infinite; }
        .potential-curve { animation: drawGraph 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        /* Pause State */
        .paused * { animation-play-state: paused !important; }

        /* Keyframes */
        @keyframes sceneReset {
            0%, 92% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        @keyframes snapP {
            0%, 12% { transform: translateX(-40px); }
            18%, 95% { transform: translateX(0); }
            100% { transform: translateX(-40px); }
        }

        @keyframes snapN {
            0%, 12% { transform: translateX(40px); }
            18%, 95% { transform: translateX(0); }
            100% { transform: translateX(40px); }
        }

        @keyframes diffuseH1 {
            0%, 20% { transform: translateX(0); opacity: 1; }
            35% { transform: translateX(75px); opacity: 1; }
            40%, 95% { transform: translateX(75px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes diffuseH2 {
            0%, 20% { transform: translateX(0); opacity: 1; }
            35% { transform: translateX(25px); opacity: 1; }
            40%, 95% { transform: translateX(25px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes diffuseE1 {
            0%, 20% { transform: translateX(0); opacity: 1; }
            35% { transform: translateX(-25px); opacity: 1; }
            40%, 95% { transform: translateX(-25px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes diffuseE2 {
            0%, 20% { transform: translateX(0); opacity: 1; }
            35% { transform: translateX(-75px); opacity: 1; }
            40%, 95% { transform: translateX(-75px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes ionGlow {
            0%, 38% { opacity: 0.15; filter: none; }
            45%, 95% { opacity: 1; filter: drop-shadow(0px 0px 3px rgba(0,0,0,0.4)); }
            100% { opacity: 0.15; filter: none; }
        }

        @keyframes fadeIn {
            0%, 45% { opacity: 0; }
            55%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fadeInField {
            0%, 50% { opacity: 0; transform: translateX(20px); }
            60%, 95% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; transform: translateX(20px); }
        }

        @keyframes drawGraph {
            0%, 50% { stroke-dashoffset: 650; opacity: 0; }
            51% { opacity: 1; }
            65%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 650; opacity: 0; }
        }

        @keyframes fadeInLate {
            0%, 70% { opacity: 0; transform: translateY(10px); }
            80%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="playPauseBtn" onclick="togglePlay()">Pause Animation</button>
    </div>

    <svg id="pn-svg" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated P-N Junction Formation</title>
        <desc>Animation showing the diffusion of holes and electrons across a P-N junction, forming a depletion region, internal electric field, and potential barrier.</desc>

        <defs>
            <!-- Acceptor Ion (Negative, P-side) -->
            <g id="acceptor">
                <circle r="10" fill="#E3F2FD" stroke="#4361EE" stroke-width="2"/>
                <text x="0" y="4" font-family="Inter" font-weight="bold" font-size="14" text-anchor="middle" fill="#4361EE">-</text>
            </g>
            
            <!-- Donor Ion (Positive, N-side) -->
            <g id="donor">
                <circle r="10" fill="#FFEBEE" stroke="#FF3366" stroke-width="2"/>
                <text x="0" y="4" font-family="Inter" font-weight="bold" font-size="14" text-anchor="middle" fill="#FF3366">+</text>
            </g>

            <!-- Mobile Carriers -->
            <circle id="hole" r="5" fill="#ffffff" stroke="#4361EE" stroke-width="2"/>
            <circle id="electron" r="5" fill="#2D3436"/>

            <!-- Arrow Markers -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrow-grey-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
            </marker>
            <marker id="arrow-grey-end" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
            </marker>

            <!-- Column Groups for easy instantiation -->
            <g id="p-col-ion">
                <use href="#acceptor" x="0" y="110"/><use href="#acceptor" x="0" y="150"/>
                <use href="#acceptor" x="0" y="190"/><use href="#acceptor" x="0" y="230"/>
                <use href="#acceptor" x="0" y="270"/>
            </g>
            <g id="p-col-hole">
                <use href="#hole" x="0" y="110"/><use href="#hole" x="0" y="150"/>
                <use href="#hole" x="0" y="190"/><use href="#hole" x="0" y="230"/>
                <use href="#hole" x="0" y="270"/>
            </g>

            <g id="n-col-ion">
                <use href="#donor" x="0" y="110"/><use href="#donor" x="0" y="150"/>
                <use href="#donor" x="0" y="190"/><use href="#donor" x="0" y="230"/>
                <use href="#donor" x="0" y="270"/>
            </g>
            <g id="n-col-electron">
                <use href="#electron" x="0" y="110"/><use href="#electron" x="0" y="150"/>
                <use href="#electron" x="0" y="190"/><use href="#electron" x="0" y="230"/>
                <use href="#electron" x="0" y="270"/>
            </g>
        </defs>

        <!-- Title -->
        <text x="400" y="35" font-family="Inter" font-weight="700" font-size="22" text-anchor="middle" fill="#111">P-N Junction: Diffusion &amp; Equilibrium</text>

        <g class="scene-wrapper">
            <!-- P-Type Block (Left) -->
            <g class="p-block">
                <rect x="100" y="80" width="300" height="210" fill="#E3F2FD" rx="4"/>
                <text x="250" y="70" font-family="Inter" font-size="16" font-weight="600" text-anchor="middle" fill="#4361EE"><i>p</i>-type</text>
                
                <!-- Static P-side Columns -->
                <g class="ion-static">
                    <use href="#p-col-ion" x="125" y="0"/><use href="#p-col-ion" x="175" y="0"/>
                    <use href="#p-col-ion" x="225" y="0"/><use href="#p-col-ion" x="275" y="0"/>
                </g>
                <g>
                    <use href="#p-col-hole" x="125" y="0"/><use href="#p-col-hole" x="175" y="0"/>
                    <use href="#p-col-hole" x="225" y="0"/><use href="#p-col-hole" x="275" y="0"/>
                </g>

                <!-- Diffusing P-side Columns (Depletion Region) -->
                <use href="#p-col-ion" x="325" y="0" class="ion-depletion"/>
                <use href="#p-col-ion" x="375" y="0" class="ion-depletion"/>
                
                <use href="#p-col-hole" x="325" y="0" class="hole-diffuse-1"/>
                <use href="#p-col-hole" x="375" y="0" class="hole-diffuse-2"/>
            </g>

            <!-- N-Type Block (Right) -->
            <g class="n-block">
                <rect x="400" y="80" width="300" height="210" fill="#FFEBEE" rx="4"/>
                <text x="550" y="70" font-family="Inter" font-size="16" font-weight="600" text-anchor="middle" fill="#FF3366"><i>n</i>-type</text>

                <!-- Static N-side Columns -->
                <g class="ion-static">
                    <use href="#n-col-ion" x="525" y="0"/><use href="#n-col-ion" x="575" y="0"/>
                    <use href="#n-col-ion" x="625" y="0"/><use href="#n-col-ion" x="675" y="0"/>
                </g>
                <g>
                    <use href="#n-col-electron" x="525" y="0"/><use href="#n-col-electron" x="575" y="0"/>
                    <use href="#n-col-electron" x="625" y="0"/><use href="#n-col-electron" x="675" y="0"/>
                </g>

                <!-- Diffusing N-side Columns (Depletion Region) -->
                <use href="#n-col-ion" x="425" y="0" class="ion-depletion"/>
                <use href="#n-col-ion" x="475" y="0" class="ion-depletion"/>

                <use href="#n-col-electron" x="425" y="0" class="electron-diffuse-1"/>
                <use href="#n-col-electron" x="475" y="0" class="electron-diffuse-2"/>
            </g>

            <!-- Depletion Region Overlays -->
            <g class="fade-in">
                <!-- Dashed Boundary -->
                <rect x="300" y="80" width="200" height="210" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
                
                <!-- Top Label -->
                <line x1="300" y1="55" x2="500" y2="55" stroke="#555" stroke-width="1.5" marker-start="url(#arrow-grey-start)" marker-end="url(#arrow-grey-end)"/>
                <rect x="340" y="45" width="120" height="20" fill="#ffffff"/>
                <text x="400" y="60" font-family="Inter" font-size="13" font-weight="600" text-anchor="middle" fill="#555">Depletion Region</text>
            </g>

            <!-- Internal Electric Field -->
            <g class="e-field-group">
                <line x1="480" y1="130" x2="320" y2="130" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
                <line x1="480" y1="170" x2="320" y2="170" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
                <line x1="480" y1="210" x2="320" y2="210" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
                <line x1="480" y1="250" x2="320" y2="250" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
                
                <rect x="385" y="118" width="30" height="24" fill="#ffffff" opacity="0.8" rx="4"/>
                <text x="400" y="135" font-family="Inter" font-weight="700" font-size="16" text-anchor="middle" fill="#F77F00">E<tspan dy="4" font-size="11">int</tspan></text>
            </g>

            <!-- Potential Barrier Graph -->
            <g class="potential-graph">
                <!-- Axes -->
                <line x1="100" y1="420" x2="700" y2="420" stroke="#ccc" stroke-width="2"/>
                <line x1="400" y1="320" x2="400" y2="430" stroke="#aaa" stroke-width="1.5" stroke-dasharray="4"/>
                
                <!-- Curve -->
                <path d="M 100 400 L 300 400 C 350 400, 450 340, 500 340 L 700 340" fill="none" stroke="#7209B7" stroke-width="4" stroke-dasharray="650" class="potential-curve"/>
                
                <!-- Graph Labels -->
                <g class="fade-in">
                    <text x="710" y="345" font-family="Inter" font-style="italic" font-weight="600" font-size="14" fill="#7209B7">V(x)</text>
                    <line x1="500" y1="400" x2="500" y2="340" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4"/>
                    <text x="510" y="375" font-family="Inter" font-weight="600" font-size="14" fill="#7209B7">V<tspan dy="3" font-size="10">B</tspan></text>
                </g>
            </g>

            <!-- Equilibrium Formula Overlay -->
            <g class="fade-in-late">
                <rect x="250" y="445" width="300" height="36" rx="6" fill="#E3F2FD" stroke="#4361EE" stroke-width="1.5"/>
                <text x="400" y="468" font-family="'Roboto Mono', monospace" font-size="15" font-weight="700" text-anchor="middle" fill="#4361EE">
                    Equilibrium: I<tspan dy="4" font-size="11">diffusion</tspan><tspan dy="-4"> = I</tspan><tspan dy="4" font-size="11">drift</tspan>
                </text>
            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(130, 485)" font-family="Inter" font-size="13" font-weight="600" fill="#444">
            <use href="#hole" x="0" y="-4"/> <text x="15" y="0">Hole</text>
            <use href="#electron" x="80" y="-4"/> <text x="95" y="0">Electron</text>
            <use href="#acceptor" x="180" y="-4"/> <text x="195" y="0">Acceptor Ion (-)</text>
            <use href="#donor" x="330" y="-4"/> <text x="345" y="0">Donor Ion (+)</text>
            
            <line x1="460" y1="-4" x2="480" y2="-4" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)"/>
            <text x="490" y="0">Electric Field</text>
        </g>

    </svg>
</div>

<script>
    function togglePlay() {
        const svg = document.getElementById('pn-svg');
        const btn = document.getElementById('playPauseBtn');
        if (svg.classList.contains('paused')) {
            svg.classList.remove('paused');
            btn.innerText = 'Pause Animation';
        } else {
            svg.classList.add('paused');
            btn.innerText = 'Play Animation';
        }
    }
</script>

</body>
</html>
