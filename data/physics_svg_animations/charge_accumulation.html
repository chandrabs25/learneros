<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff’s Junction Rule Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8f9fa;
            --wire-border: #333333;
            --wire-fill: #E5E5E5;
            --charge: #FF3366;
            --current: #06D6A0;
            --efield: #F77F00;
            --node-neutral: #ADB5BD;
            --text: #2B2D42;
            --panel-bg: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        p.subtitle {
            font-size: 1rem;
            color: #495057;
            max-width: 700px;
            margin: 0 auto;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            background: var(--panel-bg);
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
            width: fit-content;
            margin: 0 auto;
        }

        /* Toggle Switch CSS */
        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--current);
            transition: .4s;
            border-radius: 28px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--efield);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        #toggle-label {
            font-weight: 600;
            font-size: 1.1rem;
            min-width: 180px;
        }

        .svg-wrapper {
            width: 100%;
            background: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* SVG Animation States */
        #steady-particles, #accum-particles, #barriers, #e-field, #junction-node {
            transition: all 0.8s ease-in-out;
        }

        #accum-particles { opacity: 0; }
        #barriers { opacity: 0; transform: scale(0.8); transform-origin: 430px 250px; }
        
        #e-field {
            opacity: 0;
            transform-origin: 400px 250px;
            transform: scale(0.2) rotate(-15deg);
        }

        /* Active Accumulation State */
        .state-accum #steady-particles { opacity: 0; }
        .state-accum #accum-particles { opacity: 1; }
        .state-accum #barriers { opacity: 1; transform: scale(1); }
        .state-accum #junction-node { fill: var(--charge); }
        .state-accum #e-field {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }
        
        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

    </style>
</head>
<body>

<div class="app-container" id="app">
    <header>
        <h1>Kirchhoff’s First Law: Conservation of Charge</h1>
        <p class="subtitle">In a steady-state conductor, the sum of currents entering a junction equals the sum of currents leaving. If exit paths are blocked, charge accumulates, creating a repulsive electric field.</p>
    </header>

    <div class="controls">
        <label class="switch" aria-label="Toggle between Steady State and Accumulation">
            <input type="checkbox" id="state-toggle">
            <span class="slider"></span>
        </label>
        <span id="toggle-label">Mode: Steady State</span>
    </div>

    <div class="svg-wrapper">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Circuit Junction Animation</title>
            <desc>An animated diagram showing positive charges flowing through a T-junction. Toggling the state shows charge accumulation and the resulting electric field.</desc>

            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
                </pattern>

                <!-- Glow Filter for Charges -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Drop Shadow for UI Boxes -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.08"/>
                </filter>

                <!-- Arrow Markers -->
                <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--current)" />
                </marker>
                <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 8 5 L 0 9 z" fill="var(--efield)" />
                </marker>

                <!-- Motion Paths for Steady State -->
                <path id="p-in-top" d="M 100 250 L 400 250 L 700 100" />
                <path id="p-in-bot" d="M 100 250 L 400 250 L 700 400" />

                <!-- Single E-Field Line Template -->
                <line id="e-line" x1="435" y1="250" x2="495" y2="250" stroke="var(--efield)" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)" />
            </defs>

            <!-- Background Grid -->
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- Wires -->
            <g id="wires">
                <!-- Outer Border -->
                <path d="M 100 250 L 400 250 L 700 100 M 400 250 L 700 400" stroke="var(--wire-border)" stroke-width="46" fill="none" stroke-linecap="round" stroke-linejoin="round" />
                <!-- Inner Fill -->
                <path d="M 100 250 L 400 250 L 700 100 M 400 250 L 700 400" stroke="var(--wire-fill)" stroke-width="40" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>

            <!-- Blockades (Visible only in Accumulation State) -->
            <g id="barriers">
                <line x1="420" y1="215" x2="440" y2="255" stroke="var(--charge)" stroke-width="6" stroke-linecap="round" />
                <line x1="420" y1="285" x2="440" y2="245" stroke="var(--charge)" stroke-width="6" stroke-linecap="round" />
            </g>

            <!-- Current Vectors (Green Arrows) -->
            <g id="current-vectors">
                <!-- I_in (Length ~100px) -->
                <line x1="150" y1="200" x2="250" y2="200" stroke="var(--current)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />
                <text x="200" y="185" fill="var(--current)" font-weight="bold" font-size="18" text-anchor="middle" class="math-text">
                    I<tspan baseline-shift="sub" font-size="0.7em">in</tspan>
                </text>

                <!-- I_1 (Length ~67px, 2/3 of I_in) -->
                <line x1="450" y1="175" x2="510" y2="145" stroke="var(--current)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />
                <text x="480" y="140" fill="var(--current)" font-weight="bold" font-size="18" text-anchor="middle" class="math-text">
                    I<tspan baseline-shift="sub" font-size="0.7em">1</tspan>
                </text>

                <!-- I_2 (Length ~33px, 1/3 of I_in) -->
                <line x1="450" y1="325" x2="480" y2="340" stroke="var(--current)" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />
                <text x="465" y="365" fill="var(--current)" font-weight="bold" font-size="18" text-anchor="middle" class="math-text">
                    I<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
                </text>
            </g>

            <!-- Electric Field Lines (Orange Arrows, visible in Accumulation State) -->
            <g id="e-field">
                <use href="#e-line" transform="rotate(0 400 250)" />
                <use href="#e-line" transform="rotate(45 400 250)" />
                <use href="#e-line" transform="rotate(90 400 250)" />
                <use href="#e-line" transform="rotate(135 400 250)" />
                <use href="#e-line" transform="rotate(180 400 250)" />
                <use href="#e-line" transform="rotate(225 400 250)" />
                <use href="#e-line" transform="rotate(270 400 250)" />
                <use href="#e-line" transform="rotate(315 400 250)" />
            </g>

            <!-- Junction Node -->
            <g id="node">
                <circle cx="400" cy="250" r="26" fill="var(--wire-border)" />
                <circle id="junction-node" cx="400" cy="250" r="23" fill="var(--node-neutral)" />
            </g>

            <!-- Steady State Particles (Flowing continuously) -->
            <g id="steady-particles" fill="var(--charge)" filter="url(#glow)">
                <!-- 6 particles per 4s loop. Exact 2:1 split ratio -->
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p-in-top"/></animateMotion></circle>
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.666s"><mpath href="#p-in-top"/></animateMotion></circle>
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.333s"><mpath href="#p-in-bot"/></animateMotion></circle>
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="-2s"><mpath href="#p-in-top"/></animateMotion></circle>
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.666s"><mpath href="#p-in-top"/></animateMotion></circle>
                <circle r="6"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.333s"><mpath href="#p-in-bot"/></animateMotion></circle>
            </g>

            <!-- Accumulation State Particles (Piling up at the junction) -->
            <!-- They share the exact same begin times and initial path as steady state to allow seamless crossfading -->
            <g id="accum-particles" fill="var(--charge)" filter="url(#glow)">
                <!-- P1 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 405; 405" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="0s" />
                    <animate attributeName="cy" values="250; 250; 245; 245" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="0s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="0s" />
                </circle>
                <!-- P2 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 395; 395" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-0.666s" />
                    <animate attributeName="cy" values="250; 250; 255; 255" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-0.666s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="-0.666s" />
                </circle>
                <!-- P3 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 408; 408" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-1.333s" />
                    <animate attributeName="cy" values="250; 250; 252; 252" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-1.333s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="-1.333s" />
                </circle>
                <!-- P4 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 392; 392" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-2s" />
                    <animate attributeName="cy" values="250; 250; 248; 248" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-2s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="-2s" />
                </circle>
                <!-- P5 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 400; 400" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-2.666s" />
                    <animate attributeName="cy" values="250; 250; 258; 258" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-2.666s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="-2.666s" />
                </circle>
                <!-- P6 -->
                <circle r="6">
                    <animate attributeName="cx" values="100; 400; 398; 398" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-3.333s" />
                    <animate attributeName="cy" values="250; 250; 242; 242" keyTimes="0; 0.472; 0.5; 1" dur="4s" repeatCount="indefinite" begin="-3.333s" />
                    <animate attributeName="opacity" values="1; 1; 1; 0; 0" keyTimes="0; 0.472; 0.8; 0.9; 1" dur="4s" repeatCount="indefinite" begin="-3.333s" />
                </circle>
            </g>

            <!-- Formula Box (Bottom Left) -->
            <g id="formula-box" transform="translate(40, 360)">
                <rect width="220" height="90" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#shadow)" />
                <text x="110" y="35" font-size="22" font-weight="bold" fill="var(--text)" text-anchor="middle" class="math-text">
                    ΣI = 0
                </text>
                <text x="110" y="68" font-size="18" fill="var(--text)" text-anchor="middle" class="math-text">
                    I<tspan baseline-shift="sub" font-size="0.7em">in</tspan> = I<tspan baseline-shift="sub" font-size="0.7em">1</tspan> + I<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
                </text>
            </g>

            <!-- Legend Box (Bottom Right) -->
            <g id="legend-box" transform="translate(560, 360)">
                <rect width="200" height="100" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#shadow)" />
                
                <circle cx="25" cy="25" r="6" fill="var(--charge)" filter="url(#glow)" />
                <text x="45" y="30" font-size="14" fill="var(--text)">Charge (+)</text>

                <line x1="15" y1="50" x2="35" y2="50" stroke="var(--current)" stroke-width="3" marker-end="url(#arrow-green)" />
                <text x="45" y="55" font-size="14" fill="var(--text)">Current Vector</text>

                <line x1="15" y1="75" x2="35" y2="75" stroke="var(--efield)" stroke-width="3" marker-end="url(#arrow-orange)" />
                <text x="45" y="80" font-size="14" fill="var(--text)">Electric Field</text>
            </g>

            <!-- Dynamic Status Note (Bottom Center) -->
            <g id="status-note" transform="translate(400, 470)">
                <rect id="status-bg" x="-130" y="-22" width="260" height="32" rx="16" fill="var(--current)" opacity="0.15" />
                <text id="status-text" x="0" y="0" font-size="15" font-weight="bold" fill="var(--current)" text-anchor="middle" class="math-text">
                    Steady State: dQ/dt = 0
                </text>
            </g>

        </svg>
    </div>
</div>

<script>
    const toggle = document.getElementById('state-toggle');
    const container = document.getElementById('app');
    const toggleLabel = document.getElementById('toggle-label');
    const statusText = document.getElementById('status-text');
    const statusBg = document.getElementById('status-bg');

    toggle.addEventListener('change', (e) => {
        if(e.target.checked) {
            container.classList.add('state-accum');
            toggleLabel.textContent = 'Mode: Accumulation';
            statusText.textContent = 'Accumulation: dQ/dt > 0';
            statusText.setAttribute('fill', 'var(--efield)');
            statusBg.setAttribute('fill', 'var(--efield)');
        } else {
            container.classList.remove('state-accum');
            toggleLabel.textContent = 'Mode: Steady State';
            statusText.textContent = 'Steady State: dQ/dt = 0';
            statusText.setAttribute('fill', 'var(--current)');
            statusBg.setAttribute('fill', 'var(--current)');
        }
    });
</script>

</body>
</html>
