<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gauss's Law Animated Visualization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hover to pause functionality */
        svg:hover * {
            animation-play-state: paused !important;
        }

        /* Animations */
        .gaussian-surface {
            animation: radius-anim 12s linear infinite;
        }

        .field-line {
            animation: field-line-anim 12s linear infinite;
            transform-origin: 0px 0px;
        }

        .field-head {
            animation: field-head-anim 12s linear infinite;
        }

        .graph-dot {
            animation: dot-anim 12s linear infinite;
        }

        .r-gauge {
            animation: r-gauge-anim 12s linear infinite;
        }

        .e-gauge {
            animation: e-gauge-anim 12s linear infinite;
        }

        /* Keyframes for Gaussian Surface Radius */
        @keyframes radius-anim {
            0% { r: 180px; }
            41.66% { r: 60px; }
            66.66% { r: 0px; }
            100% { r: 180px; }
        }

        /* Keyframes for Electric Field Vector Length (scaleX) */
        @keyframes field-line-anim {
            0% { transform: scaleX(0.111); opacity: 1; }
            8.33% { transform: scaleX(0.148); opacity: 1; }
            16.66% { transform: scaleX(0.206); opacity: 1; }
            25.00% { transform: scaleX(0.308); opacity: 1; }
            33.33% { transform: scaleX(0.510); opacity: 1; }
            41.66% { transform: scaleX(1); opacity: 1; }
            41.67% { transform: scaleX(0); opacity: 0; }
            66.66% { transform: scaleX(0); opacity: 0; }
            77.77% { transform: scaleX(0); opacity: 0; }
            77.78% { transform: scaleX(1); opacity: 1; }
            83.33% { transform: scaleX(0.444); opacity: 1; }
            91.66% { transform: scaleX(0.197); opacity: 1; }
            100% { transform: scaleX(0.111); opacity: 1; }
        }

        /* Keyframes for Electric Field Arrowhead Position (translateX) */
        @keyframes field-head-anim {
            0% { transform: translateX(8.8px); opacity: 1; }
            8.33% { transform: translateX(11.8px); opacity: 1; }
            16.66% { transform: translateX(16.5px); opacity: 1; }
            25.00% { transform: translateX(24.6px); opacity: 1; }
            33.33% { transform: translateX(40.8px); opacity: 1; }
            41.66% { transform: translateX(80px); opacity: 1; }
            41.67% { transform: translateX(0px); opacity: 0; }
            66.66% { transform: translateX(0px); opacity: 0; }
            77.77% { transform: translateX(0px); opacity: 0; }
            77.78% { transform: translateX(80px); opacity: 1; }
            83.33% { transform: translateX(35.5px); opacity: 1; }
            91.66% { transform: translateX(15.7px); opacity: 1; }
            100% { transform: translateX(8.8px); opacity: 1; }
        }

        /* Keyframes for Graph Dot Position */
        @keyframes dot-anim {
            0% { transform: translate(720px, 327.8px); }
            8.33% { transform: translate(684px, 320.4px); }
            16.66% { transform: translate(648px, 308.7px); }
            25.00% { transform: translate(612px, 288.3px); }
            33.33% { transform: translate(576px, 248.0px); }
            41.66% { transform: translate(540px, 150px); }
            41.67% { transform: translate(540px, 350px); }
            66.66% { transform: translate(450px, 350px); }
            77.77% { transform: translate(540px, 350px); }
            77.78% { transform: translate(540px, 150px); }
            83.33% { transform: translate(585px, 261.1px); }
            91.66% { transform: translate(652.5px, 310.5px); }
            100% { transform: translate(720px, 327.8px); }
        }

        /* Keyframes for r Gauge */
        @keyframes r-gauge-anim {
            0% { width: 120px; }
            41.66% { width: 40px; }
            66.66% { width: 0px; }
            77.77% { width: 40px; }
            100% { width: 120px; }
        }

        /* Keyframes for E Gauge */
        @keyframes e-gauge-anim {
            0% { width: 13.3px; }
            8.33% { width: 17.8px; }
            16.66% { width: 24.7px; }
            25.00% { width: 37.0px; }
            33.33% { width: 61.2px; }
            41.66% { width: 120px; }
            41.67% { width: 0px; }
            66.66% { width: 0px; }
            77.77% { width: 0px; }
            77.78% { width: 120px; }
            83.33% { width: 53.3px; }
            91.66% { width: 23.6px; }
            100% { width: 13.3px; }
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
            fill: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <!-- Background -->
            <rect width="800" height="500" fill="#f8f9fa"/>

            <!-- Title & Instructions -->
            <text x="400" y="35" text-anchor="middle" font-weight="bold" font-size="22" fill="#111">Gauss's Law: Uniformly Charged Spherical Shell</text>
            <text x="780" y="25" text-anchor="end" font-size="12" fill="#888">Hover to Pause Animation</text>

            <!-- ========================================== -->
            <!-- LEFT SIDE: PHYSICAL MODEL                  -->
            <!-- ========================================== -->
            <g transform="translate(200, 260)">
                
                <!-- Electric Field Vectors -->
                <g id="electric-fields">
                    <!-- 0 degrees -->
                    <g transform="rotate(0)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 45 degrees -->
                    <g transform="rotate(45)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 90 degrees -->
                    <g transform="rotate(90)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 135 degrees -->
                    <g transform="rotate(135)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 180 degrees -->
                    <g transform="rotate(180)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 225 degrees -->
                    <g transform="rotate(225)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 270 degrees -->
                    <g transform="rotate(270)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                    <!-- 315 degrees -->
                    <g transform="rotate(315)">
                        <g transform="translate(60, 0)">
                            <line x1="0" y1="0" x2="80" y2="0" stroke="#F77F00" stroke-width="2.5" class="field-line" />
                            <polygon points="-2,-4 8,0 -2,4" fill="#F77F00" class="field-head" />
                        </g>
                    </g>
                </g>

                <!-- Gaussian Surface (Animated) -->
                <circle cx="0" cy="0" r="180" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6,6" fill="none" class="gaussian-surface" />

                <!-- Charged Spherical Shell -->
                <circle cx="0" cy="0" r="60" stroke="#F77F00" stroke-width="4" fill="#F77F00" fill-opacity="0.1" />

                <!-- Positive Charges on Shell -->
                <g fill="#FF3366" font-weight="bold" font-size="16" text-anchor="middle">
                    <g transform="rotate(0)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(30)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(60)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(90)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(120)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(150)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(180)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(210)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(240)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(270)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(300)"><text x="52" y="5">+</text></g>
                    <g transform="rotate(330)"><text x="52" y="5">+</text></g>
                </g>

                <!-- Center Dot -->
                <circle cx="0" cy="0" r="3" fill="#333" />
                <line x1="0" y1="0" x2="42" y2="-42" stroke="#333" stroke-width="1" stroke-dasharray="2,2"/>
                <text x="20" y="-25" font-size="12" font-style="italic" fill="#333">R</text>
            </g>

            <!-- Legend -->
            <g transform="translate(20, 410)" font-size="12" fill="#555">
                <rect x="0" y="0" width="14" height="14" fill="#F77F00" fill-opacity="0.2" stroke="#F77F00" stroke-width="2" rx="2"/>
                <text x="22" y="11.5">Charged Shell</text>
                
                <line x1="0" y1="26" x2="14" y2="26" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4,3"/>
                <text x="22" y="30.5">Gaussian Surface</text>
                
                <line x1="0" y1="44" x2="14" y2="44" stroke="#F77F00" stroke-width="2"/>
                <polygon points="10,41 16,44 10,47" fill="#F77F00"/>
                <text x="22" y="48.5">Electric Field (E)</text>
                
                <circle cx="7" cy="63" r="5" fill="#FF3366"/>
                <text x="22" y="67.5">Positive Charge</text>
            </g>

            <!-- ========================================== -->
            <!-- RIGHT SIDE: GRAPH & DATA                   -->
            <!-- ========================================== -->
            
            <!-- Dynamic Gauges -->
            <g transform="translate(450, 60)">
                <text x="0" y="10" class="math-text" font-size="14">r:</text>
                <rect x="25" y="0" width="120" height="12" fill="#e9ecef" rx="6"/>
                <rect x="25" y="0" height="12" fill="#00B4D8" rx="6" class="r-gauge"/>
                <text x="155" y="10" class="math-text" font-size="12" fill="#888">3R</text>

                <text x="0" y="35" class="math-text" font-size="14">E:</text>
                <rect x="25" y="25" width="120" height="12" fill="#e9ecef" rx="6"/>
                <rect x="25" y="25" height="12" fill="#F77F00" rx="6" class="e-gauge"/>
                <text x="155" y="35" class="math-text" font-size="12" fill="#888">E_max</text>
            </g>

            <!-- Graph Area -->
            <g id="graph">
                <!-- Grid / Guides -->
                <line x1="450" y1="150" x2="740" y2="150" stroke="#e9ecef" stroke-width="1" />
                <text x="410" y="154" class="math-text" font-size="12" fill="#888">E_max</text>

                <!-- Discontinuity Line -->
                <line x1="540" y1="350" x2="540" y2="150" stroke="#F77F00" stroke-width="2" stroke-dasharray="4,4" />

                <!-- E=0 Line (Inside Shell) -->
                <line x1="450" y1="350" x2="540" y2="350" stroke="#F77F00" stroke-width="3" />

                <!-- 1/r^2 Curve (Outside Shell) -->
                <polyline points="540,150 555,203.1 570,237.5 585,261.1 600,278 615,291.3 630,300 645,307.7 660,313.6 675,318 690,321.9 705,325.1 720,327.8 740,330.6" fill="none" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Axes -->
                <line x1="450" y1="350" x2="750" y2="350" stroke="#333" stroke-width="2" />
                <polygon points="750,346 758,350 750,354" fill="#333" />
                
                <line x1="450" y1="350" x2="450" y2="110" stroke="#333" stroke-width="2" />
                <polygon points="446,110 450,102 454,110" fill="#333" />

                <!-- Axis Labels -->
                <text x="435" y="110" class="math-text" font-size="16" font-weight="bold">E</text>
                <text x="750" y="375" class="math-text" font-size="16" font-weight="bold">r</text>

                <!-- X-Axis Ticks -->
                <line x1="540" y1="350" x2="540" y2="355" stroke="#333" stroke-width="2" />
                <text x="540" y="370" class="math-text" font-size="14" text-anchor="middle">R</text>

                <line x1="720" y1="350" x2="720" y2="355" stroke="#333" stroke-width="2" />
                <text x="720" y="370" class="math-text" font-size="14" text-anchor="middle">3R</text>

                <!-- Animated Graph Dot -->
                <circle cx="0" cy="0" r="6" fill="#00B4D8" class="graph-dot" />
            </g>

            <!-- Formulas -->
            <g transform="translate(450, 410)">
                <text x="0" y="0" class="math-text" font-size="15">
                    <tspan font-size="18">∮</tspan> E · dA = Q<tspan dy="4" font-size="11">encl</tspan><tspan dy="-4"> / ε</tspan><tspan dy="4" font-size="11">0</tspan>
                </text>
                
                <text x="0" y="35" class="math-text" font-size="14">
                    r ≥ R : E = (1/4πε<tspan dy="4" font-size="10">0</tspan><tspan dy="-4">) (q/r</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="5">)</tspan>
                </text>
                
                <text x="0" y="65" class="math-text" font-size="14">
                    r &lt; R : E = 0
                </text>
            </g>

        </svg>
    </div>
</body>
</html>
