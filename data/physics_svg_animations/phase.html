<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phase and Wave Speed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        @keyframes wave-move {
            0% { transform: translateX(-400px); }
            100% { transform: translateX(0px); }
        }

        @keyframes dot-move {
            0% { transform: translateX(100px); }
            100% { transform: translateX(500px); }
        }

        @keyframes scale-x {
            0% { transform: scaleX(1); }
            100% { transform: scaleX(5); }
        }

        @keyframes arrow-move {
            0% { transform: translate(100px, -170px); }
            100% { transform: translate(500px, -170px); }
        }

        /* Particle Y Oscillation (Mathematically accurate Sine approximation) */
        @keyframes particle-y {
            0%   { transform: translateY(0); animation-timing-function: ease-out; }
            25%  { transform: translateY(-100px); animation-timing-function: ease-in; }
            50%  { transform: translateY(0); animation-timing-function: ease-out; }
            75%  { transform: translateY(100px); animation-timing-function: ease-in; }
            100% { transform: translateY(0); }
        }

        /* Particle Velocity Vector Scaling (Derivative of Sine) */
        @keyframes particle-v {
            0%   { transform: scaleY(1); animation-timing-function: ease-in; }
            25%  { transform: scaleY(0); animation-timing-function: ease-out; }
            50%  { transform: scaleY(-1); animation-timing-function: ease-in; }
            75%  { transform: scaleY(0); animation-timing-function: ease-out; }
            100% { transform: scaleY(1); }
        }

        /* Global Pause Class */
        .paused * {
            animation-play-state: paused !important;
        }

        .btn-hover:hover rect {
            fill: #324fc7;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Grid Pattern -->
            <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#f1f3f5" stroke-width="1"/>
            </pattern>

            <!-- Arrowheads -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#212529" />
            </marker>
        </defs>

        <!-- Background Grid -->
        <rect width="800" height="500" fill="url(#grid)" />

        <!-- Title -->
        <text x="30" y="45" font-size="22" font-weight="700" fill="#212529">Phase and Wave Speed</text>
        <text x="30" y="75" font-size="16" font-family="Roboto Mono" fill="#4361EE" font-weight="600">v = ω / k = Δx / Δt</text>

        <!-- Play/Pause Button -->
        <g id="play-btn" class="btn-hover" transform="translate(730, 25)" cursor="pointer">
            <rect width="40" height="40" rx="8" fill="#4361EE" transition="fill 0.2s" />
            <path id="pause-icon" d="M 14 12 h 4 v 16 h -4 z M 22 12 h 4 v 16 h -4 z" fill="#ffffff" />
            <path id="play-icon" d="M 15 12 L 15 28 L 28 20 Z" fill="#ffffff" display="none" />
        </g>

        <!-- Main Physics Group (Origin at x=100, y=300) -->
        <g transform="translate(100, 300)">
            
            <!-- Amplitude Bounds -->
            <line x1="0" y1="-100" x2="650" y2="-100" stroke="#dee2e6" stroke-dasharray="6,6" stroke-width="1.5" />
            <line x1="0" y1="100" x2="650" y2="100" stroke="#dee2e6" stroke-dasharray="6,6" stroke-width="1.5" />
            <text x="-10" y="-95" text-anchor="end" class="math-text" font-size="12" fill="#adb5bd">+A</text>
            <text x="-10" y="105" text-anchor="end" class="math-text" font-size="12" fill="#adb5bd">-A</text>

            <!-- Axes -->
            <line x1="0" y1="0" x2="650" y2="0" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow-black)" />
            <line x1="0" y1="-220" x2="0" y2="150" stroke="#212529" stroke-width="1.5" marker-end="url(#arrow-black)" />
            <text x="640" y="-15" font-size="14" class="math-text" font-weight="bold" fill="#212529">x</text>
            <text x="-15" y="-210" font-size="14" class="math-text" font-weight="bold" fill="#212529">y</text>

            <!-- Wave Profile -->
            <g>
                <path d="M -400 0 
                         C -336.34 -100, -263.66 -100, -200 0 
                         C -136.34 100, -63.66 100, 0 0 
                         C 63.66 -100, 136.34 -100, 200 0 
                         C 263.66 100, 336.34 100, 400 0 
                         C 463.66 -100, 536.34 -100, 600 0 
                         C 663.66 100, 736.34 100, 800 0
                         C 863.66 -100, 936.34 -100, 1000 0
                         C 1063.66 100, 1136.34 100, 1200 0" 
                      fill="none" stroke="#4361EE" stroke-width="3.5" stroke-linecap="round"
                      style="animation: wave-move 4s linear infinite;" />
            </g>

            <!-- Constant Phase Point (Red Dot) & Tracking Elements -->
            <g style="animation: dot-move 4s linear infinite;">
                <!-- Vertical Tracking Line -->
                <line x1="0" y1="-100" x2="0" y2="0" stroke="#6c757d" stroke-dasharray="5,5" stroke-width="1.5" />
                
                <!-- The Red Dot -->
                <circle cx="0" cy="-100" r="7" fill="#FF3366" />
                
                <!-- Wave Speed Vector -->
                <line x1="12" y1="-100" x2="65" y2="-100" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
                <text x="40" y="-110" text-anchor="middle" class="math-text" font-size="16" font-weight="bold" font-style="italic" fill="#FF3366">v</text>
                <!-- Vector arrow over 'v' -->
                <path d="M 35 -124 L 45 -124 L 42 -127 M 45 -124 L 42 -121" fill="none" stroke="#FF3366" stroke-width="1.5" />

                <!-- Phase Equation Call-out -->
                <g transform="translate(0, -140)">
                    <line x1="0" y1="40" x2="0" y2="15" stroke="#7209B7" stroke-width="1.5" />
                    <rect x="-95" y="-15" width="190" height="30" rx="6" fill="#ffffff" stroke="#7209B7" stroke-width="1.5" opacity="0.95" />
                    <text x="0" y="5" text-anchor="middle" class="math-text" font-size="13" font-weight="600" fill="#7209B7">ϕ = kx - ωt = const</text>
                </g>
            </g>

            <!-- Horizontal Displacement Marker (Delta x) -->
            <g>
                <line x1="0" y1="-170" x2="100" y2="-170" stroke="#06D6A0" stroke-width="2.5" style="transform-origin: 0 0; animation: scale-x 4s linear infinite;" />
                <line x1="0" y1="-178" x2="0" y2="-162" stroke="#06D6A0" stroke-width="2.5" />
            </g>
            
            <!-- Delta x Arrowhead & Label -->
            <g style="animation: arrow-move 4s linear infinite;">
                <polygon points="0,0 -12,-6 -12,6" fill="#06D6A0" />
                <text x="-18" y="-10" text-anchor="end" class="math-text" font-size="15" font-weight="bold" fill="#06D6A0">Δx</text>
            </g>

            <!-- Timer Display -->
            <rect x="510" y="-205" width="130" height="34" rx="6" fill="#212529" />
            <text id="timer-text" x="575" y="-182" text-anchor="middle" class="math-text" font-size="15" font-weight="bold" fill="#06D6A0">Δt = 0.00 s</text>

            <!-- Medium Particles (Green Dots) -->
            <!-- Particle 1: x=200 -->
            <g transform="translate(200, 0)">
                <g style="animation: particle-y 4s infinite; animation-delay: 0s;">
                    <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                    <g style="animation: particle-v 4s infinite; animation-delay: 0s;">
                        <line x1="0" y1="0" x2="0" y2="-45" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                    </g>
                    <text x="12" y="-15" class="math-text" font-size="13" font-weight="bold" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">p</tspan></text>
                </g>
            </g>

            <!-- Particle 2: x=300 -->
            <g transform="translate(300, 0)">
                <g style="animation: particle-y 4s infinite; animation-delay: -3s;">
                    <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                    <g style="animation: particle-v 4s infinite; animation-delay: -3s;">
                        <line x1="0" y1="0" x2="0" y2="-45" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                    </g>
                </g>
            </g>

            <!-- Particle 3: x=400 -->
            <g transform="translate(400, 0)">
                <g style="animation: particle-y 4s infinite; animation-delay: -2s;">
                    <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                    <g style="animation: particle-v 4s infinite; animation-delay: -2s;">
                        <line x1="0" y1="0" x2="0" y2="-45" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                    </g>
                </g>
            </g>

            <!-- Particle 4: x=500 -->
            <g transform="translate(500, 0)">
                <g style="animation: particle-y 4s infinite; animation-delay: -1s;">
                    <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                    <g style="animation: particle-v 4s infinite; animation-delay: -1s;">
                        <line x1="0" y1="0" x2="0" y2="-45" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                    </g>
                </g>
            </g>

            <!-- Particle 5: x=600 -->
            <g transform="translate(600, 0)">
                <g style="animation: particle-y 4s infinite; animation-delay: 0s;">
                    <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                    <g style="animation: particle-v 4s infinite; animation-delay: 0s;">
                        <line x1="0" y1="0" x2="0" y2="-45" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                    </g>
                </g>
            </g>

        </g>

        <!-- Legend -->
        <g transform="translate(560, 370)">
            <rect x="0" y="0" width="210" height="100" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" />
            <text x="15" y="22" font-size="13" font-weight="700" fill="#495057">Legend</text>
            
            <circle cx="20" cy="42" r="5" fill="#FF3366" />
            <text x="35" y="46" font-size="12" fill="#495057">Constant Phase Point</text>
            
            <circle cx="20" cy="64" r="5" fill="#06D6A0" />
            <text x="35" y="68" font-size="12" fill="#495057">Medium Particle (Transverse)</text>
            
            <line x1="12" y1="86" x2="28" y2="86" stroke="#4361EE" stroke-width="3" stroke-linecap="round" />
            <text x="35" y="90" font-size="12" fill="#495057">Wave Profile y(x,t)</text>
        </g>

    </svg>
</div>

<script>
    const timerText = document.getElementById('timer-text');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    
    const duration = 4000; // 4 seconds per cycle
    let startTime = null;
    let pausedTime = 0;
    let isPaused = false;
    let animFrame;

    function updateTimer(timestamp) {
        if (isPaused) return;
        if (!startTime) startTime = timestamp - pausedTime;
        
        let elapsed = timestamp - startTime;
        let t = (elapsed % duration) / 1000;
        
        timerText.textContent = `Δt = ${t.toFixed(2)} s`;
        animFrame = requestAnimationFrame(updateTimer);
    }

    // Start the timer loop
    animFrame = requestAnimationFrame(updateTimer);

    // Play/Pause Interaction
    playBtn.addEventListener('click', () => {
        isPaused = !isPaused;
        document.body.classList.toggle('paused', isPaused);
        
        if (isPaused) {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            cancelAnimationFrame(animFrame);
            pausedTime = performance.now() - startTime;
        } else {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            startTime = performance.now() - pausedTime;
            animFrame = requestAnimationFrame(updateTimer);
        }
    });
</script>

</body>
</html>
