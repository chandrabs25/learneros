<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macroscopic Variables: PV = nRT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }
        .particle {
            animation: jitter 12s infinite;
        }
        @keyframes jitter {
            0%, 41.6% { transform: translate(0, 0); }
            45% { transform: translate(5px, -5px); }
            50% { transform: translate(-6px, 4px); }
            55% { transform: translate(7px, 6px); }
            60% { transform: translate(-5px, -7px); }
            65% { transform: translate(6px, 3px); }
            70% { transform: translate(-4px, 6px); }
            75%, 100% { transform: translate(0, 0); }
        }
        .formula-p { animation: scale-p 12s infinite; }
        .formula-v { animation: scale-v 12s infinite; }
        .formula-t { animation: scale-t 12s infinite; }
        
        @keyframes scale-p {
            0%, 16.6% { font-size: 36px; }
            41.6%, 75% { font-size: 48px; }
            100% { font-size: 36px; }
        }
        @keyframes scale-v {
            0%, 16.6% { font-size: 36px; }
            41.6% { font-size: 24px; }
            75% { font-size: 48px; }
            100% { font-size: 36px; }
        }
        @keyframes scale-t {
            0%, 41.6% { font-size: 36px; }
            75% { font-size: 48px; }
            100% { font-size: 36px; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead for Pressure (Red) -->
        <marker id="arrow-p" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
        </marker>
        <!-- Arrowhead for Volume (Blue) -->
        <marker id="arrow-v" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
        </marker>
        <!-- Glow Filter for Burner -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <!-- Thermometer Gradient -->
        <linearGradient id="tempGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#4361EE"/>
            <stop offset="100%" stop-color="#F77F00"/>
        </linearGradient>
    </defs>

    <!-- Title & Phase Indicators -->
    <text x="400" y="40" text-anchor="middle" font-family="Inter" font-size="24" font-weight="700" fill="#212529">Macroscopic State Variables: PV = nRT</text>
    
    <text x="400" y="70" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#6C757D" opacity="0">
        Equilibrium
        <animate attributeName="opacity" values="1; 1; 0; 0; 0; 0; 0; 0; 1" keyTimes="0; 0.15; 0.166; 0.4; 0.416; 0.73; 0.75; 0.98; 1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="70" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#FF3366" opacity="0">
        Isothermal Compression (Constant T)
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 0; 0; 0" keyTimes="0; 0.15; 0.166; 0.4; 0.416; 0.73; 0.75; 0.98; 1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="70" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#F77F00" opacity="0">
        Isobaric Expansion (Constant P)
        <animate attributeName="opacity" values="0; 0; 0; 0; 1; 1; 0; 0; 0" keyTimes="0; 0.15; 0.166; 0.4; 0.416; 0.73; 0.75; 0.98; 1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="400" y="70" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#4361EE" opacity="0">
        Cooling & Reset
        <animate attributeName="opacity" values="0; 0; 0; 0; 0; 0; 1; 1; 0" keyTimes="0; 0.15; 0.166; 0.4; 0.416; 0.73; 0.75; 0.98; 1" dur="12s" repeatCount="indefinite"/>
    </text>

    <!-- Legend -->
    <g transform="translate(30, 100)" font-family="Inter" font-size="13" font-weight="600" fill="#495057">
        <rect x="0" y="0" width="140" height="120" fill="#f8f9fa" stroke="#DEE2E6" stroke-width="2" rx="6"/>
        <line x1="10" y1="25" x2="30" y2="25" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-p)"/>
        <text x="45" y="30">Pressure (P)</text>
        <line x1="10" y1="55" x2="30" y2="55" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-v)"/>
        <text x="45" y="60">Volume (V)</text>
        <rect x="10" y="78" width="20" height="10" fill="#F77F00" rx="2"/>
        <text x="45" y="88">Temperature (T)</text>
        <circle cx="20" cy="105" r="5" fill="#00B4D8"/>
        <text x="45" y="110">Gas Particles</text>
    </g>

    <!-- Formula Display -->
    <rect x="520" y="100" width="240" height="90" rx="8" fill="#f8f9fa" stroke="#DEE2E6" stroke-width="2"/>
    <text x="640" y="145" text-anchor="middle" dominant-baseline="middle" font-family="'Roboto Mono', monospace" font-weight="700">
        <tspan class="formula-p" fill="#FF3366">P</tspan><tspan class="formula-v" fill="#4361EE">V</tspan><tspan fill="#212529" font-size="36px"> = nR</tspan><tspan class="formula-t" fill="#F77F00">T</tspan>
    </text>

    <!-- Thermometer (Temperature Gauge) -->
    <text x="630" y="475" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#F77F00">T (Temperature)</text>
    <rect x="620" y="240" width="20" height="200" rx="10" fill="#e9ecef" stroke="#DEE2E6" stroke-width="2"/>
    <rect x="620" width="20" rx="10" fill="url(#tempGrad)">
        <animate attributeName="y" values="390; 390; 390; 240; 390" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="height" values="50; 50; 50; 200; 50" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- Thermometer markings -->
    <line x1="645" y1="260" x2="655" y2="260" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="645" y1="300" x2="655" y2="300" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="645" y1="340" x2="655" y2="340" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="645" y1="380" x2="655" y2="380" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="645" y1="420" x2="655" y2="420" stroke="#ADB5BD" stroke-width="2"/>

    <!-- Volume Indicator -->
    <text x="130" y="440" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#4361EE">V (Volume)</text>
    <line x1="130" x2="130" y2="400" stroke="#4361EE" stroke-width="3" marker-start="url(#arrow-v)" marker-end="url(#arrow-v)">
        <animate attributeName="y1" values="260; 260; 335; 110; 260" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>
    <line x1="120" x2="140" y1="400" y2="400" stroke="#4361EE" stroke-width="3"/>
    <line x1="120" x2="140" stroke="#4361EE" stroke-width="3">
        <animate attributeName="y1" values="260; 260; 335; 110; 260" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="260; 260; 335; 110; 260" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- Cylinder Container -->
    <path d="M 170 80 L 170 400 L 330 400 L 330 80" fill="none" stroke="#DEE2E6" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Pressure Label -->
    <text x="250" y="65" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#FF3366">P (Pressure)</text>

    <!-- Pressure Vectors (P) -->
    <!-- Left Wall Arrow -->
    <line x1="170" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-p)">
        <animate attributeName="x2" values="130; 130; 90; 90; 130" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="325; 325; 362.5; 250; 325" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="325; 325; 362.5; 250; 325" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>
    <!-- Right Wall Arrow -->
    <line x1="330" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-p)">
        <animate attributeName="x2" values="370; 370; 410; 410; 370" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y1" values="325; 325; 362.5; 250; 325" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="325; 325; 362.5; 250; 325" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>
    <!-- Top Arrow (Pushing Piston) -->
    <line x1="250" x2="250" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-p)">
        <animate attributeName="y1" values="270; 270; 345; 120; 270" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="230; 230; 265; 40; 230" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>
    <!-- Bottom Arrow (Pushing Floor) -->
    <line x1="250" x2="250" y1="400" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-p)">
        <animate attributeName="y2" values="440; 440; 480; 480; 440" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </line>

    <!-- Gas Particles (Dynamic Volume) -->
    <svg x="173" width="154" y="250" height="150">
        <animate attributeName="y" values="250; 250; 325; 100; 250" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="height" values="150; 150; 75; 300; 150" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        
        <!-- 15 Particles with chaotic Lissajous paths -->
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="15%; 85%; 35%; 75%; 15%" dur="2.1s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="25%; 75%; 15%; 85%; 25%" dur="2.3s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="80%; 20%; 90%; 10%; 80%" dur="2.5s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="10%; 90%; 30%; 70%; 10%" dur="2.7s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="50%; 90%; 10%; 50%; 50%" dur="2.9s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="80%; 20%; 80%; 20%; 80%" dur="3.1s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="20%; 60%; 80%; 40%; 20%" dur="3.3s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="50%; 10%; 90%; 50%; 50%" dur="3.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="90%; 10%; 90%; 10%; 90%" dur="3.7s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="90%; 10%; 50%; 10%; 90%" dur="3.9s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="30%; 70%; 20%; 80%; 30%" dur="4.1s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="70%; 30%; 80%; 20%; 70%" dur="4.3s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="75%; 25%; 65%; 35%; 75%" dur="2.2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="35%; 65%; 25%; 75%; 35%" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="10%; 50%; 90%; 50%; 10%" dur="2.6s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="60%; 90%; 60%; 10%; 60%" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="60%; 10%; 60%; 90%; 60%" dur="3.0s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="10%; 50%; 90%; 50%; 10%" dur="3.2s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="40%; 80%; 20%; 60%; 40%" dur="3.4s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="40%; 20%; 80%; 60%; 40%" dur="3.6s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="85%; 15%; 75%; 25%; 85%" dur="3.8s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="85%; 15%; 75%; 25%; 85%" dur="4.0s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="25%; 75%; 15%; 85%; 25%" dur="4.2s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="75%; 25%; 85%; 15%; 75%" dur="4.4s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="55%; 95%; 5%; 45%; 55%" dur="2.3s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="45%; 5%; 95%; 55%; 45%" dur="2.5s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="95%; 5%; 95%; 5%; 95%" dur="2.7s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="5%; 95%; 5%; 95%; 5%" dur="2.9s" repeatCount="indefinite"/>
        </circle>
        <circle r="4" fill="#00B4D8" class="particle">
            <animate attributeName="cx" values="5%; 95%; 45%; 55%; 5%" dur="3.1s" repeatCount="indefinite"/>
            <animate attributeName="cy" values="95%; 5%; 55%; 45%; 95%" dur="3.3s" repeatCount="indefinite"/>
        </circle>
    </svg>

    <!-- Piston -->
    <rect x="173" width="154" height="20" fill="#6C757D" rx="2">
        <animate attributeName="y" values="230; 230; 305; 80; 230" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </rect>
    <!-- Piston Rod -->
    <rect x="246" width="8" height="150" fill="#ADB5BD">
        <animate attributeName="y" values="80; 80; 155; -70; 80" keyTimes="0; 0.1667; 0.4167; 0.75; 1" dur="12s" repeatCount="indefinite"/>
    </rect>

    <!-- Heat Source (Burner) -->
    <g transform="translate(210, 405)">
        <!-- Outer Flame (Glow) -->
        <path d="M 25 0 Q 40 -40 40 -50 Q 40 -40 55 0 Z" fill="#FFD166" filter="url(#glow)">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.416; 0.45; 0.70; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        </path>
        <!-- Inner Flame -->
        <path d="M 32 0 Q 40 -25 40 -30 Q 40 -25 48 0 Z" fill="#FF9F1C">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.416; 0.45; 0.70; 0.75; 1" dur="12s" repeatCount="indefinite"/>
        </path>
        <!-- Burner Base -->
        <rect x="0" y="10" width="80" height="12" fill="#6C757D" rx="4"/>
        <rect x="25" y="0" width="30" height="10" fill="#495057"/>
    </g>

</svg>

</body>
</html>
