<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semiconductor Dynamics: From Intrinsic to Extrinsic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #2b2d42;
            --text-muted: #6c757d;
            --si-color: #4361EE;
            --p-color: #F77F00;
            --b-color: #7209B7;
            --e-color: #00B4D8;
            --h-color: #FF3366;
            --bond-color: #CED4DA;
            --ec-color: #00B4D8;
            --ev-color: #4361EE;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            font-weight: 700;
        }

        p.subtitle {
            margin: 0;
            color: var(--text-muted);
            font-size: 16px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        button {
            padding: 10px 24px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 8px;
            background-color: #e9ecef;
            color: #495057;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: #dee2e6;
        }

        button.active {
            background-color: var(--si-color);
            color: white;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* State Management */
        .state-el {
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        [data-state="intrinsic"] .show-intrinsic { opacity: 1; }
        [data-state="ntype"] .show-ntype { opacity: 1; }
        [data-state="ptype"] .show-ptype { opacity: 1; }

        [data-state="intrinsic"] .hide-intrinsic { display: none; }
        [data-state="ntype"] .hide-ntype { display: none; }
        [data-state="ptype"] .hide-ptype { display: none; }

        /* Animations */
        @keyframes vibrate {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(0.5px, -0.5px); }
            50% { transform: translate(-0.5px, 0.5px); }
            75% { transform: translate(0.5px, 0.5px); }
        }
        .atom { animation: vibrate 0.4s infinite linear; }

        /* Intrinsic Animations */
        @keyframes int-lat-e-free {
            0%, 10% { transform: translate(0, 0); opacity: 1; }
            20% { transform: translate(35px, -25px); }
            40% { transform: translate(60px, 15px); }
            60% { transform: translate(-25px, 35px); }
            80% { transform: translate(-15px, -15px); }
            90%, 100% { transform: translate(0, 0); opacity: 0; }
        }
        @keyframes int-lat-h {
            0%, 9% { opacity: 0; transform: translate(0,0); }
            10%, 40% { opacity: 1; transform: translate(0,0); }
            50%, 85% { opacity: 1; transform: translate(0, 20px); }
            90%, 100% { opacity: 0; transform: translate(0,0); }
        }
        @keyframes int-lat-e2 {
            0%, 40% { transform: translate(0, 0); }
            50%, 85% { transform: translate(0, -20px); }
            90%, 100% { transform: translate(0, 0); }
        }
        @keyframes int-band-e {
            0%, 10% { transform: translateY(340px); opacity: 1; }
            20%, 80% { transform: translateY(140px); opacity: 1; }
            90%, 100% { transform: translateY(340px); opacity: 0; }
        }
        @keyframes int-band-h {
            0%, 9% { opacity: 0; }
            10%, 89% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        .anim-int-e-free { animation: int-lat-e-free 8s infinite ease-in-out; }
        .anim-int-h { animation: int-lat-h 8s infinite ease-in-out; }
        .anim-int-e2 { animation: int-lat-e2 8s infinite ease-in-out; }
        .anim-int-band-e { animation: int-band-e 8s infinite ease-in-out; }
        .anim-int-band-h { animation: int-band-h 8s infinite ease-in-out; }

        /* N-Type Animations */
        @keyframes ntype-lat-e {
            0%, 10% { transform: translate(0, 0); }
            25% { transform: translate(30px, -20px); }
            50% { transform: translate(50px, 40px); }
            75% { transform: translate(-40px, 30px); }
            90%, 100% { transform: translate(0, 0); }
        }
        @keyframes ntype-band-jump {
            0%, 15% { transform: translateY(0); }
            30%, 80% { transform: translateY(-45px); }
            95%, 100% { transform: translateY(0); }
        }

        .anim-ntype-e-free { animation: ntype-lat-e 5s infinite ease-in-out; }
        .anim-ntype-jump { animation: ntype-band-jump 4s infinite ease-in-out; }
        .delay-1 { animation-delay: 0s; }
        .delay-2 { animation-delay: 1.3s; }
        .delay-3 { animation-delay: 2.6s; }

        /* P-Type Animations */
        @keyframes ptype-lat-e1 {
            0%, 20% { transform: translate(0, 0); }
            30%, 90% { transform: translate(0, -20px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes ptype-lat-e2 {
            0%, 50% { transform: translate(0, 0); }
            60%, 90% { transform: translate(30px, -30px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes ptype-lat-h-chain {
            0%, 20% { transform: translate(0, 0); }
            30%, 50% { transform: translate(0, 20px); }
            60%, 90% { transform: translate(-30px, 50px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes ptype-band-jump {
            0%, 15% { transform: translateY(0); opacity: 1; }
            30%, 80% { transform: translateY(-35px); opacity: 1; }
            95%, 100% { transform: translateY(0); opacity: 0; }
        }
        @keyframes ptype-band-h {
            0%, 14% { opacity: 0; }
            15%, 94% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .anim-ptype-e1 { animation: ptype-lat-e1 6s infinite ease-in-out; }
        .anim-ptype-e2 { animation: ptype-lat-e2 6s infinite ease-in-out; }
        .anim-ptype-h-chain { animation: ptype-lat-h-chain 6s infinite ease-in-out; }
        .anim-ptype-jump { animation: ptype-band-jump 4s infinite ease-in-out; }
        .anim-ptype-h { animation: ptype-band-h 4s infinite ease-in-out; }

        /* Static Styles */
        .hole {
            fill: #ffffff;
            stroke: var(--h-color);
            stroke-width: 2;
            stroke-dasharray: 2, 2;
        }
        .electron {
            fill: var(--e-color);
            filter: url(#glow);
        }
        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            fill: var(--text-main);
        }
        .label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: var(--text-muted);
        }
        .title-label {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            fill: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Semiconductor Carrier Dynamics</h1>
        <p class="subtitle">Microscopic lattice behavior and corresponding energy band structures</p>
    </div>

    <div class="controls">
        <button id="btn-intrinsic" class="active" onclick="setState('intrinsic')">Intrinsic (Pure Si)</button>
        <button id="btn-ntype" onclick="setState('ntype')">N-Type (Phosphorus Doped)</button>
        <button id="btn-ptype" onclick="setState('ptype')">P-Type (Boron Doped)</button>
    </div>

    <div class="svg-container" id="app" data-state="intrinsic">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Glow Filter for Electrons -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <!-- Energy Band Gradients -->
                <linearGradient id="ec-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.02" />
                </linearGradient>
                <linearGradient id="ev-grad" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="#4361EE" stop-opacity="0.25" />
                    <stop offset="100%" stop-color="#4361EE" stop-opacity="0.02" />
                </linearGradient>
            </defs>

            <!-- Divider Line -->
            <line x1="400" y1="60" x2="400" y2="440" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6,6" />

            <!-- Section Titles -->
            <text x="200" y="40" class="title-label" text-anchor="middle">Atomic Lattice Model</text>
            <text x="600" y="40" class="title-label" text-anchor="middle">Energy Band Diagram</text>

            <!-- ========================================== -->
            <!-- LEFT SIDE: ATOMIC LATTICE                  -->
            <!-- ========================================== -->
            <g id="lattice">
                <!-- Covalent Bonds (Double Lines) -->
                <g stroke="var(--bond-color)" stroke-width="3">
                    <!-- Horizontal Bonds -->
                    <line x1="120" y1="166" x2="280" y2="166" /><line x1="120" y1="174" x2="280" y2="174" />
                    <line x1="120" y1="246" x2="280" y2="246" /><line x1="120" y1="254" x2="280" y2="254" />
                    <line x1="120" y1="326" x2="280" y2="326" /><line x1="120" y1="334" x2="280" y2="334" />
                    <!-- Vertical Bonds -->
                    <line x1="116" y1="170" x2="116" y2="330" /><line x1="124" y1="170" x2="124" y2="330" />
                    <line x1="196" y1="170" x2="196" y2="330" /><line x1="204" y1="170" x2="204" y2="330" />
                    <line x1="276" y1="170" x2="276" y2="330" /><line x1="284" y1="170" x2="284" y2="330" />
                </g>

                <!-- Static Electrons in Bonds -->
                <g class="electron">
                    <!-- H-Top -->
                    <circle cx="150" cy="170" r="3.5" /><circle cx="170" cy="170" r="3.5" />
                    <circle cx="230" cy="170" r="3.5" /><circle cx="250" cy="170" r="3.5" />
                    <!-- H-Mid -->
                    <circle cx="150" cy="250" r="3.5" /><circle cx="170" cy="250" r="3.5" />
                    <circle cx="230" cy="250" r="3.5" /><circle cx="250" cy="250" r="3.5" />
                    <!-- H-Bot -->
                    <circle cx="150" cy="330" r="3.5" /><circle cx="170" cy="330" r="3.5" />
                    <circle cx="230" cy="330" r="3.5" /><circle cx="250" cy="330" r="3.5" />
                    <!-- V-Left -->
                    <circle cx="120" cy="200" r="3.5" /><circle cx="120" cy="220" r="3.5" />
                    <circle cx="120" cy="280" r="3.5" /><circle cx="120" cy="300" r="3.5" />
                    <!-- V-Mid -->
                    <circle cx="200" cy="200" r="3.5" class="hide-intrinsic hide-ptype" /> <!-- Hidden in Intrinsic/P-Type -->
                    <circle cx="200" cy="220" r="3.5" class="hide-intrinsic hide-ptype" /> <!-- Hidden in Intrinsic/P-Type -->
                    <circle cx="200" cy="280" r="3.5" />
                    <circle cx="200" cy="300" r="3.5" />
                    <!-- V-Right -->
                    <circle cx="280" cy="200" r="3.5" />
                    <circle cx="280" cy="220" r="3.5" />
                    <circle cx="280" cy="280" r="3.5" />
                    <circle cx="280" cy="300" r="3.5" />
                    <!-- Specific static electron hidden in P-Type for the chain reaction -->
                    <circle cx="170" cy="250" r="3.5" class="hide-ptype" />
                </g>

                <!-- Atoms -->
                <g class="atom">
                    <!-- Top Row -->
                    <circle cx="120" cy="170" r="14" fill="var(--si-color)" />
                    <text x="120" y="174" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    <circle cx="200" cy="170" r="14" fill="var(--si-color)" />
                    <text x="200" y="174" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    <circle cx="280" cy="170" r="14" fill="var(--si-color)" />
                    <text x="280" y="174" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    
                    <!-- Mid Row (Left & Right) -->
                    <circle cx="120" cy="250" r="14" fill="var(--si-color)" />
                    <text x="120" y="254" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    <circle cx="280" cy="250" r="14" fill="var(--si-color)" />
                    <text x="280" y="254" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    
                    <!-- Bot Row -->
                    <circle cx="120" cy="330" r="14" fill="var(--si-color)" />
                    <text x="120" y="334" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    <circle cx="200" cy="330" r="14" fill="var(--si-color)" />
                    <text x="200" y="334" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    <circle cx="280" cy="330" r="14" fill="var(--si-color)" />
                    <text x="280" y="334" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>

                    <!-- Center Atom (Dynamic based on state) -->
                    <g class="state-el show-intrinsic">
                        <circle cx="200" cy="250" r="14" fill="var(--si-color)" />
                        <text x="200" y="254" fill="white" font-size="11" font-weight="bold" text-anchor="middle">Si</text>
                    </g>
                    <g class="state-el show-ntype">
                        <circle cx="200" cy="250" r="16" fill="var(--p-color)" />
                        <text x="200" y="255" fill="white" font-size="12" font-weight="bold" text-anchor="middle">P</text>
                    </g>
                    <g class="state-el show-ptype">
                        <circle cx="200" cy="250" r="16" fill="var(--b-color)" />
                        <text x="200" y="255" fill="white" font-size="12" font-weight="bold" text-anchor="middle">B</text>
                    </g>
                </g>

                <!-- Dynamic Lattice Elements (Intrinsic) -->
                <g class="state-el show-intrinsic">
                    <!-- Hole appears and jumps -->
                    <circle cx="200" cy="200" r="4.5" class="hole anim-int-h" />
                    <!-- Electron 1 breaks free -->
                    <circle cx="200" cy="200" r="3.5" class="electron anim-int-e-free" />
                    <!-- Electron 2 fills the hole -->
                    <circle cx="200" cy="220" r="3.5" class="electron anim-int-e2" />
                </g>

                <!-- Dynamic Lattice Elements (N-Type) -->
                <g class="state-el show-ntype">
                    <!-- Extra 5th electron wandering -->
                    <circle cx="218" cy="232" r="3.5" class="electron anim-ntype-e-free" />
                </g>

                <!-- Dynamic Lattice Elements (P-Type) -->
                <g class="state-el show-ptype">
                    <!-- The moving hole (chain reaction) -->
                    <circle cx="200" cy="200" r="4.5" class="hole anim-ptype-h-chain" />
                    <!-- Electron 1 jumps to fill initial hole -->
                    <circle cx="200" cy="220" r="3.5" class="electron anim-ptype-e1" />
                    <!-- Electron 2 jumps to fill second hole -->
                    <circle cx="170" cy="250" r="3.5" class="electron anim-ptype-e2" />
                </g>
            </g>

            <!-- ========================================== -->
            <!-- RIGHT SIDE: ENERGY BAND DIAGRAM            -->
            <!-- ========================================== -->
            <g id="bands">
                <!-- Conduction Band -->
                <rect x="450" y="80" width="300" height="80" fill="url(#ec-grad)" rx="4" />
                <line x1="450" y1="160" x2="750" y2="160" stroke="var(--ec-color)" stroke-width="3" />
                <text x="600" y="125" class="label" fill="var(--ec-color)" text-anchor="middle">Conduction Band (E<tspan dy="3" font-size="10">C</tspan><tspan dy="-3">)</tspan></text>

                <!-- Valence Band -->
                <rect x="450" y="340" width="300" height="80" fill="url(#ev-grad)" rx="4" />
                <line x1="450" y1="340" x2="750" y2="340" stroke="var(--ev-color)" stroke-width="3" />
                <text x="600" y="385" class="label" fill="var(--ev-color)" text-anchor="middle">Valence Band (E<tspan dy="3" font-size="10">V</tspan><tspan dy="-3">)</tspan></text>

                <!-- Band Gap Label -->
                <text x="600" y="255" class="label" text-anchor="middle">Band Gap (E<tspan dy="3" font-size="10">g</tspan><tspan dy="-3"> ≈ 1.1 eV)</tspan></text>
                <path d="M 470 165 L 470 335" stroke="var(--text-muted)" stroke-width="1" marker-start="url(#arrow-up)" marker-end="url(#arrow-down)" />
                
                <defs>
                    <marker id="arrow-up" viewBox="0 0 10 10" refX="5" refY="0" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 10 L 5 0 L 10 10 z" fill="var(--text-muted)" />
                    </marker>
                    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="10" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 5 10 L 10 0 z" fill="var(--text-muted)" />
                    </marker>
                </defs>

                <!-- Dynamic Band Elements (Intrinsic) -->
                <g class="state-el show-intrinsic">
                    <circle cx="600" cy="0" r="4.5" class="electron anim-int-band-e" />
                    <circle cx="600" cy="340" r="5.5" class="hole anim-int-band-h" />
                    <!-- Formula -->
                    <rect x="530" y="200" width="140" height="40" fill="white" rx="8" stroke="#e9ecef" />
                    <text x="600" y="226" class="formula" text-anchor="middle">n<tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = n</tspan><tspan dy="4" font-size="12">h</tspan></text>
                </g>

                <!-- Dynamic Band Elements (N-Type) -->
                <g class="state-el show-ntype">
                    <!-- Donor Level -->
                    <line x1="450" y1="195" x2="750" y2="195" stroke="var(--p-color)" stroke-width="2" stroke-dasharray="8,4" />
                    <text x="760" y="200" class="label" fill="var(--p-color)" font-size="12">E<tspan dy="3" font-size="10">D</tspan></text>
                    
                    <!-- Jumping Electrons -->
                    <circle cx="520" cy="195" r="4.5" class="electron anim-ntype-jump delay-1" />
                    <circle cx="600" cy="195" r="4.5" class="electron anim-ntype-jump delay-2" />
                    <circle cx="680" cy="195" r="4.5" class="electron anim-ntype-jump delay-3" />

                    <!-- Formula -->
                    <rect x="530" y="220" width="140" height="40" fill="white" rx="8" stroke="#e9ecef" />
                    <text x="600" y="246" class="formula" text-anchor="middle">n<tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> ≫ n</tspan><tspan dy="4" font-size="12">h</tspan></text>
                </g>

                <!-- Dynamic Band Elements (P-Type) -->
                <g class="state-el show-ptype">
                    <!-- Acceptor Level -->
                    <line x1="450" y1="305" x2="750" y2="305" stroke="var(--b-color)" stroke-width="2" stroke-dasharray="8,4" />
                    <text x="760" y="310" class="label" fill="var(--b-color)" font-size="12">E<tspan dy="3" font-size="10">A</tspan></text>
                    
                    <!-- Jumping Electrons & Holes Left Behind -->
                    <g class="delay-1">
                        <circle cx="520" cy="340" r="4.5" class="electron anim-ptype-jump" />
                        <circle cx="520" cy="340" r="5.5" class="hole anim-ptype-h" />
                    </g>
                    <g class="delay-2">
                        <circle cx="600" cy="340" r="4.5" class="electron anim-ptype-jump" />
                        <circle cx="600" cy="340" r="5.5" class="hole anim-ptype-h" />
                    </g>
                    <g class="delay-3">
                        <circle cx="680" cy="340" r="4.5" class="electron anim-ptype-jump" />
                        <circle cx="680" cy="340" r="5.5" class="hole anim-ptype-h" />
                    </g>

                    <!-- Formula -->
                    <rect x="530" y="240" width="140" height="40" fill="white" rx="8" stroke="#e9ecef" />
                    <text x="600" y="266" class="formula" text-anchor="middle">n<tspan dy="4" font-size="12">h</tspan><tspan dy="-4"> ≫ n</tspan><tspan dy="4" font-size="12">e</tspan></text>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g id="legend" transform="translate(60, 460)">
                <rect x="0" y="0" width="680" height="30" fill="white" rx="15" stroke="#e9ecef" />
                
                <circle cx="30" cy="15" r="8" fill="var(--si-color)" />
                <text x="45" y="20" class="label">Silicon (Si)</text>

                <circle cx="140" cy="15" r="8" fill="var(--p-color)" />
                <text x="155" y="20" class="label">Phosphorus (P)</text>

                <circle cx="285" cy="15" r="8" fill="var(--b-color)" />
                <text x="300" y="20" class="label">Boron (B)</text>

                <circle cx="400" cy="15" r="4.5" class="electron" />
                <text x="415" y="20" class="label">Electron (e⁻)</text>

                <circle cx="530" cy="15" r="5.5" class="hole" />
                <text x="545" y="20" class="label">Hole (h⁺)</text>
            </g>
        </svg>
    </div>

    <script>
        function setState(state) {
            // Update data attribute for CSS control
            document.getElementById('app').setAttribute('data-state', state);
            
            // Update button active states
            document.getElementById('btn-intrinsic').classList.remove('active');
            document.getElementById('btn-ntype').classList.remove('active');
            document.getElementById('btn-ptype').classList.remove('active');
            
            document.getElementById('btn-' + state).classList.add('active');
        }
    </script>
</body>
</html>
