<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics of Dissipative Motion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            display: block;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        .axis-label {
            font-size: 13px;
            font-weight: 600;
        }

        .title {
            font-size: 18px;
            font-weight: 700;
            fill: #2B2D42;
        }
    </style>
</head>
<body>

<div class="container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
            </marker>
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#8D99AE" />
            </marker>

            <!-- Gradients -->
            <radialGradient id="ball-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#6B708D" />
                <stop offset="100%" stop-color="#2B2D42" />
            </radialGradient>

            <!-- Clip Path for Graph Animation -->
            <clipPath id="graph-clip">
                <rect id="clip-rect" x="380" y="0" width="0" height="500" />
            </clipPath>
        </defs>

        <!-- Title -->
        <text x="400" y="30" text-anchor="middle" class="title">Kinematics: Motion under Gravity with Energy Loss</text>

        <!-- Divider -->
        <line x1="340" y1="60" x2="340" y2="460" stroke="#e9ecef" stroke-width="2" stroke-dasharray="6,6"/>

        <!-- ========================================== -->
        <!-- LEFT PANEL: PHYSICAL STAGE                 -->
        <!-- ========================================== -->
        
        <!-- Surface -->
        <line x1="40" y1="450" x2="300" y2="450" stroke="#4361EE" stroke-width="6" stroke-linecap="round"/>
        <line x1="40" y1="456" x2="300" y2="456" stroke="#4361EE" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

        <!-- Gravity Vector (Constant) -->
        <line x1="280" y1="120" x2="280" y2="180" stroke="#00B4D8" stroke-width="4" marker-end="url(#arrow-cyan)"/>
        <text x="292" y="155" fill="#00B4D8" font-weight="bold" font-style="italic" font-size="16">g</text>

        <!-- Ball Shadow -->
        <ellipse id="ball-shadow" cx="160" cy="450" rx="12" ry="3" fill="#000000" opacity="0.2"/>

        <!-- Velocity Vector (Dynamic) -->
        <line id="v-vector" x1="160" y1="100" x2="160" y2="100" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)"/>
        <text id="v-label" x="175" y="100" fill="#06D6A0" font-weight="bold" font-style="italic" font-size="16">v</text>

        <!-- The Ball -->
        <circle id="ball" cx="160" cy="100" r="12" fill="url(#ball-grad)"/>

        <!-- Legend -->
        <g transform="translate(20, 470)">
            <rect x="0" y="0" width="300" height="22" rx="4" fill="#f8f9fa" stroke="#e9ecef"/>
            <line x1="10" y1="11" x2="20" y2="11" stroke="#06D6A0" stroke-width="3"/>
            <text x="25" y="15" font-size="11" fill="#4A4E69" font-weight="600">Velocity</text>
            
            <line x1="80" y1="11" x2="90" y2="11" stroke="#00B4D8" stroke-width="3"/>
            <text x="95" y="15" font-size="11" fill="#4A4E69" font-weight="600">Gravity</text>
            
            <line x1="145" y1="11" x2="155" y2="11" stroke="#7209B7" stroke-width="3"/>
            <text x="160" y="15" font-size="11" fill="#4A4E69" font-weight="600">y-t Graph</text>
            
            <line x1="225" y1="11" x2="235" y2="11" stroke="#FF3366" stroke-width="3"/>
            <text x="240" y="15" font-size="11" fill="#4A4E69" font-weight="600">v-t Graph</text>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT PANEL: GRAPHICAL ANALYSIS            -->
        <!-- ========================================== -->

        <!-- Y-T Graph Grid & Axes -->
        <g id="yt-axes">
            <line x1="380" y1="50" x2="760" y2="50" stroke="#e9ecef" stroke-width="1.5" stroke-dasharray="4,4"/>
            <line x1="380" y1="135" x2="760" y2="135" stroke="#e9ecef" stroke-width="1.5" stroke-dasharray="4,4"/>
            
            <line x1="380" y1="220" x2="770" y2="220" stroke="#8D99AE" stroke-width="2" marker-end="url(#arrow-axis)"/>
            <line x1="380" y1="220" x2="380" y2="40" stroke="#8D99AE" stroke-width="2" marker-end="url(#arrow-axis)"/>
            
            <text x="388" y="55" fill="#7209B7" class="axis-label">y (m)</text>
            <text x="750" y="210" fill="#8D99AE" class="axis-label">t (s)</text>
        </g>

        <!-- V-T Graph Grid & Axes -->
        <g id="vt-axes">
            <line x1="380" y1="280" x2="760" y2="280" stroke="#e9ecef" stroke-width="1.5" stroke-dasharray="4,4"/>
            <line x1="380" y1="450" x2="760" y2="450" stroke="#e9ecef" stroke-width="1.5" stroke-dasharray="4,4"/>
            
            <line x1="380" y1="365" x2="770" y2="365" stroke="#8D99AE" stroke-width="2" marker-end="url(#arrow-axis)"/>
            <line x1="380" y1="460" x2="380" y2="260" stroke="#8D99AE" stroke-width="2" marker-end="url(#arrow-axis)"/>
            
            <text x="388" y="275" fill="#FF3366" class="axis-label">v (m/s)</text>
            <text x="750" y="355" fill="#8D99AE" class="axis-label">t (s)</text>
        </g>

        <!-- Graph Paths (Clipped for animation) -->
        <path id="yt-path" fill="none" stroke="#7209B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#graph-clip)"/>
        <path id="vt-path" fill="none" stroke="#FF3366" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" clip-path="url(#graph-clip)"/>

        <!-- Time Indicator -->
        <line id="t-indicator" x1="380" y1="40" x2="380" y2="470" stroke="#2B2D42" stroke-width="2" stroke-dasharray="5,5" opacity="0.4"/>

        <!-- Dynamic Readouts -->
        <text id="readout-y" x="760" y="55" text-anchor="end" class="math-text" fill="#7209B7" font-size="14" font-weight="600">y = 0.00 m</text>
        <text id="readout-v" x="760" y="275" text-anchor="end" class="math-text" fill="#FF3366" font-size="14" font-weight="600">v = 0.00 m/s</text>

    </svg>
</div>

<script>
    // Physics Constants & Setup
    const g = 600;           // Acceleration due to gravity (px/s^2)
    const e = 0.7;           // Coefficient of restitution
    const y_initial = 340;   // Initial height (px)
    const duration = 5.0;    // Active simulation duration (s)
    const total_cycle = 6.5; // Total loop duration including pause (s)
    
    // Pre-calculate bounce intervals for exact analytical kinematics
    let bounces = [];
    let current_t = 0;
    let current_v = 0;
    let current_y = y_initial;
    
    // First drop
    let t_fall = Math.sqrt(2 * current_y / g);
    bounces.push({ t_start: current_t, t_end: current_t + t_fall, y0: current_y, v0: current_v });
    current_t += t_fall;
    current_v = g * t_fall * e; // Velocity just after impact
    
    // Subsequent bounces
    while (current_t < duration && current_v > 1) {
        let t_flight = 2 * current_v / g;
        bounces.push({ t_start: current_t, t_end: current_t + t_flight, y0: 0, v0: current_v });
        current_t += t_flight;
        current_v = current_v * e;
    }
    
    // Kinematic State Function
    function getState(t) {
        if (t < 0) return { y: y_initial, v: 0 };
        for (let b of bounces) {
            if (t >= b.t_start && t <= b.t_end) {
                let dt = t - b.t_start;
                let y = b.y0 + b.v0 * dt - 0.5 * g * dt * dt;
                let v = b.v0 - g * dt;
                return { y: Math.max(0, y), v: v };
            }
        }
        return { y: 0, v: 0 }; // Resting state
    }
    
    // Generate Static Graph Paths
    const yt_path = document.getElementById('yt-path');
    const vt_path = document.getElementById('vt-path');
    
    // Generate Y-T Path (Parabolas)
    let d_yt = `M 380 ${220 - y_initial * 0.5}`;
    for (let t = 0; t <= duration; t += 0.02) {
        let state = getState(t);
        let x = 380 + (t / duration) * 370;
        let y = 220 - state.y * 0.5;
        d_yt += ` L ${x} ${y}`;
    }
    yt_path.setAttribute('d', d_yt);
    
    // Generate V-T Path (Sawtooth with vertical jumps)
    let d_vt = `M 380 365`;
    for (let b of bounces) {
        if (b.t_start > duration) break;
        
        // Start of segment
        let x_start = 380 + (b.t_start / duration) * 370;
        let y_start = 365 - b.v0 * (85/700);
        d_vt += ` L ${x_start} ${y_start}`;
        
        // End of segment
        let t_end = Math.min(b.t_end, duration);
        let x_end = 380 + (t_end / duration) * 370;
        let v_end = b.v0 - g * (t_end - b.t_start);
        let y_end = 365 - v_end * (85/700);
        d_vt += ` L ${x_end} ${y_end}`;
    }
    // Extend to end of graph if resting
    let last_b = bounces[bounces.length-1];
    if (last_b.t_end < duration) {
        let x_end = 380 + (last_b.t_end / duration) * 370;
        d_vt += ` L ${x_end} 365 L 750 365`;
    }
    vt_path.setAttribute('d', d_vt);
    
    // Animation Loop Variables
    const ball = document.getElementById('ball');
    const ball_shadow = document.getElementById('ball-shadow');
    const v_vector = document.getElementById('v-vector');
    const v_label = document.getElementById('v-label');
    const clip_rect = document.getElementById('clip-rect');
    const t_indicator = document.getElementById('t-indicator');
    const readout_y = document.getElementById('readout-y');
    const readout_v = document.getElementById('readout-v');
    
    let start_time = Date.now();
    
    function animate() {
        let elapsed = (Date.now() - start_time) / 1000;
        let t_sim = elapsed % total_cycle;
        
        // Hold simulation at final state during pause
        let t_calc = Math.min(t_sim, duration);
        let state = getState(t_calc);
        
        // Update Ball Position
        let cy = 440 - state.y;
        ball.setAttribute('cy', cy);
        
        // Update Ball Shadow
        let shadow_scale = Math.max(0.2, 1 - state.y / y_initial);
        let shadow_opacity = Math.max(0.05, 0.25 - (state.y / y_initial) * 0.2);
        ball_shadow.setAttribute('rx', 12 * shadow_scale);
        ball_shadow.setAttribute('opacity', shadow_opacity);
        
        // Update Velocity Vector
        if (Math.abs(state.v) < 5 || t_calc === duration) {
            v_vector.setAttribute('display', 'none');
            v_label.setAttribute('display', 'none');
        } else {
            v_vector.setAttribute('display', 'inline');
            v_label.setAttribute('display', 'inline');
            
            let v_len = state.v * 0.15; // Scale velocity for visual length
            v_vector.setAttribute('y1', cy);
            v_vector.setAttribute('y2', cy - v_len);
            
            // Position label dynamically
            v_label.setAttribute('y', cy - v_len + (state.v > 0 ? -12 : 22));
        }
        
        // Update Graph Clip Path & Time Indicator
        let x_graph = 380 + (t_calc / duration) * 370;
        clip_rect.setAttribute('width', x_graph - 380);
        t_indicator.setAttribute('x1', x_graph);
        t_indicator.setAttribute('x2', x_graph);
        
        // Update Readouts (Convert to SI units for display: 10m max height)
        let display_y = state.y * (10 / y_initial);
        let display_v = state.v * (14 / 638.7); // 14 m/s max velocity
        
        readout_y.textContent = `y = ${display_y.toFixed(2).padStart(5, ' ')} m`;
        readout_v.textContent = `v = ${display_v.toFixed(2).padStart(6, ' ')} m/s`;
        
        requestAnimationFrame(animate);
    }
    
    // Start Animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
