<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Physical Significance of the Electric Field</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #FF3366;
            --orange: #F77F00;
            --blue: #4361EE;
            --purple: #7209B7;
            --cyan: #00B4D8;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --gray: #8d99ae;
            --grid: #e9ecef;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: var(--text); text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: var(--gray); text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 18px; fill: var(--text); font-weight: 700; }
        .status { font-size: 16px; font-weight: 600; text-anchor: middle; }
        .label { font-size: 16px; font-weight: 700; fill: var(--text); text-anchor: middle; }
        .force-label { font-size: 16px; font-weight: 700; fill: var(--red); text-anchor: middle; }
        .legend-text { font-size: 12px; font-weight: 500; fill: var(--text); }

        /* Animation Classes */
        .force-line-1 {
            transform-box: fill-box;
            transform-origin: right center;
        }
        .force-line-2 {
            transform-box: fill-box;
            transform-origin: left center;
        }
        .q2-field-lines {
            transform-box: fill-box;
            transform-origin: center center;
        }

        /* Keyframes */
        .is-playing .q1-group { animation: move-q1 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .is-playing .force-line-1 { animation: scale-f12 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .is-playing .force-line-2 { animation: scale-f21 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .is-playing .ripple { animation: propagate 10s linear infinite; }
        .is-playing .dist-line { animation: dist-line 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .is-playing .dist-text { animation: dist-text 10s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .is-playing .status-1 { animation: fade-1 10s infinite; }
        .is-playing .status-2 { animation: fade-2 10s infinite; }
        .is-playing .status-3 { animation: fade-3 10s infinite; }
        .is-playing .formula-r { animation: highlight-r 10s infinite; }
        .is-playing .q2-field-lines { animation: pulse-q2 10s infinite; }

        @keyframes move-q1 {
            0%, 20% { transform: translate(200px, 250px); }
            30%, 80% { transform: translate(100px, 250px); }
            90%, 100% { transform: translate(200px, 250px); }
        }

        @keyframes scale-f12 {
            0%, 20% { transform: scaleX(1); }
            30%, 80% { transform: scaleX(0.64); }
            90%, 100% { transform: scaleX(1); }
        }

        @keyframes propagate {
            0%, 30% { r: 0; opacity: 0; stroke-width: 4px; }
            30.1% { r: 0; opacity: 1; stroke-width: 4px; }
            50% { r: 500px; opacity: 0.8; stroke-width: 1.5px; }
            50.1%, 100% { r: 500px; opacity: 0; stroke-width: 1px; }
        }

        @keyframes scale-f21 {
            0%, 50% { transform: scaleX(1); }
            52%, 80% { transform: scaleX(0.64); }
            90%, 100% { transform: scaleX(1); }
        }

        @keyframes pulse-q2 {
            0%, 50% { transform: scale(1); opacity: 0.6; }
            51% { transform: scale(1.1); opacity: 1; stroke: var(--red); }
            55%, 100% { transform: scale(1); opacity: 0.6; stroke: var(--orange); }
        }

        @keyframes dist-line {
            0%, 20% { x1: 200px; }
            30%, 80% { x1: 100px; }
            90%, 100% { x1: 200px; }
        }

        @keyframes dist-text {
            0%, 20% { transform: translateX(0); }
            30%, 80% { transform: translateX(-50px); }
            90%, 100% { transform: translateX(0); }
        }

        @keyframes fade-1 {
            0%, 19% { opacity: 1; }
            20%, 79% { opacity: 0; }
            80%, 100% { opacity: 1; }
        }

        @keyframes fade-2 {
            0%, 19% { opacity: 0; }
            20%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes fade-3 {
            0%, 49% { opacity: 0; }
            50%, 79% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        @keyframes highlight-r {
            0%, 20% { fill: var(--text); }
            20.1%, 80% { fill: var(--red); }
            80.1%, 100% { fill: var(--text); }
        }

        /* Controls */
        .controls {
            margin-top: 10px;
            display: flex;
            gap: 15px;
        }

        button {
            background: var(--blue);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
        }

        button:hover {
            background: #304ffe;
        }

        button:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 800 500" id="sim-svg" class="is-playing">
            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="var(--grid)" stroke-width="1"/>
                </pattern>

                <!-- Arrowheads -->
                <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--red)" />
                </marker>
                <marker id="arrow-dist" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--gray)" />
                </marker>

                <!-- Shadows -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
                </filter>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>

            <!-- Background Grid -->
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- Title Area -->
            <text x="400" y="40" class="title">The Physical Significance of the Electric Field</text>
            <text x="400" y="62" class="subtitle">Demonstrating the finite propagation speed of electromagnetic interactions</text>

            <!-- Legend -->
            <g transform="translate(20, 20)">
                <rect x="0" y="0" width="165" height="85" rx="6" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
                <line x1="15" y1="20" x2="35" y2="20" stroke="var(--red)" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="50" y="24" class="legend-text">Force Vector</text>
                
                <line x1="15" y1="45" x2="35" y2="45" stroke="var(--orange)" stroke-width="2" opacity="0.8"/>
                <text x="50" y="49" class="legend-text">Electric Field Line</text>
                
                <line x1="15" y1="70" x2="35" y2="70" stroke="var(--orange)" stroke-width="2" stroke-dasharray="4 3"/>
                <text x="50" y="74" class="legend-text">Information Wave</text>
            </g>

            <!-- Formula Box -->
            <g transform="translate(610, 20)">
                <rect x="0" y="0" width="170" height="50" rx="6" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
                <text x="85" y="32" class="formula" text-anchor="middle">F = k(q₁q₂) / <tspan class="formula-r">r</tspan>²</text>
            </g>

            <!-- Distance Indicator -->
            <g class="distance-group">
                <line class="dist-line" x1="200" y1="340" x2="600" y2="340" stroke="var(--gray)" stroke-width="2" marker-start="url(#arrow-dist)" marker-end="url(#arrow-dist)" />
                <rect class="dist-text" x="385" y="328" width="30" height="24" fill="var(--bg)" rx="4" />
                <text class="dist-text" x="400" y="346" text-anchor="middle" fill="var(--gray)" font-family="Roboto Mono" font-weight="700" font-style="italic">r</text>
            </g>

            <!-- Propagation Ripple -->
            <circle class="ripple" cx="100" cy="250" r="0" fill="none" stroke="var(--orange)" stroke-width="2" stroke-dasharray="8 8" opacity="0" />

            <!-- Charge 2 (Test Charge - Stationary) -->
            <g class="q2-group" transform="translate(600, 250)">
                <!-- Field Lines -->
                <g class="q2-field-lines" stroke="var(--orange)" stroke-width="1.5" opacity="0.6">
                    <line x1="15" y1="0" x2="70" y2="0" />
                    <line x1="13" y1="7.5" x2="60.6" y2="35" />
                    <line x1="7.5" y1="13" x2="35" y2="60.6" />
                    <line x1="0" y1="15" x2="0" y2="70" />
                    <line x1="-7.5" y1="13" x2="-35" y2="60.6" />
                    <line x1="-13" y1="7.5" x2="-60.6" y2="35" />
                    <line x1="-15" y1="0" x2="-70" y2="0" />
                    <line x1="-13" y1="-7.5" x2="-60.6" y2="-35" />
                    <line x1="-7.5" y1="-13" x2="-35" y2="-60.6" />
                    <line x1="0" y1="-15" x2="0" y2="-70" />
                    <line x1="7.5" y1="-13" x2="35" y2="-60.6" />
                    <line x1="13" y1="-7.5" x2="60.6" y2="-35" />
                </g>
                
                <!-- Force Vector F21 -->
                <g class="f21-group">
                    <line class="force-line-2" x1="20" y1="0" x2="120" y2="0" stroke="var(--red)" stroke-width="4" marker-end="url(#arrow-red)" />
                    <text x="70" y="-15" class="force-label">F<tspan dy="5" font-size="11">21</tspan></text>
                </g>

                <!-- Particle -->
                <circle cx="0" cy="0" r="16" fill="var(--red)" filter="url(#shadow)" />
                <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <text x="0" y="45" class="label">q<tspan dy="5" font-size="12">2</tspan></text>
            </g>

            <!-- Charge 1 (Source Charge - Moving) -->
            <g class="q1-group" transform="translate(200, 250)">
                <!-- Field Lines -->
                <g stroke="var(--orange)" stroke-width="1.5" opacity="0.6">
                    <line x1="15" y1="0" x2="70" y2="0" />
                    <line x1="13" y1="7.5" x2="60.6" y2="35" />
                    <line x1="7.5" y1="13" x2="35" y2="60.6" />
                    <line x1="0" y1="15" x2="0" y2="70" />
                    <line x1="-7.5" y1="13" x2="-35" y2="60.6" />
                    <line x1="-13" y1="7.5" x2="-60.6" y2="35" />
                    <line x1="-15" y1="0" x2="-70" y2="0" />
                    <line x1="-13" y1="-7.5" x2="-60.6" y2="-35" />
                    <line x1="-7.5" y1="-13" x2="-35" y2="-60.6" />
                    <line x1="0" y1="-15" x2="0" y2="-70" />
                    <line x1="7.5" y1="-13" x2="35" y2="-60.6" />
                    <line x1="13" y1="-7.5" x2="60.6" y2="-35" />
                </g>

                <!-- Force Vector F12 -->
                <g class="f12-group">
                    <line class="force-line-1" x1="-20" y1="0" x2="-120" y2="0" stroke="var(--red)" stroke-width="4" marker-end="url(#arrow-red)" />
                    <text x="-70" y="-15" class="force-label">F<tspan dy="5" font-size="11">12</tspan></text>
                </g>

                <!-- Particle -->
                <circle cx="0" cy="0" r="16" fill="var(--red)" filter="url(#shadow)" />
                <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="white" stroke-width="2.5" stroke-linecap="round" />
                <text x="0" y="45" class="label">q<tspan dy="5" font-size="12">1</tspan></text>
            </g>

            <!-- Status Text Box -->
            <g transform="translate(100, 420)">
                <rect x="0" y="0" width="600" height="54" rx="10" fill="white" stroke="#e2e8f0" filter="url(#shadow)"/>
                
                <text x="300" y="32" class="status status-1" fill="var(--text)">
                    Static Equilibrium: Field is uniform, forces are equal and opposite.
                </text>
                
                <text x="300" y="32" class="status status-2" fill="var(--orange)">
                    Source Moves: Disturbance in the field propagates outward at speed <tspan font-family="Roboto Mono" font-style="italic">c</tspan>.
                </text>
                
                <text x="300" y="32" class="status status-3" fill="var(--red)">
                    Delayed Reaction: q₂ feels the change only after time Δt = Δr/<tspan font-family="Roboto Mono" font-style="italic">c</tspan>.
                </text>
            </g>

        </svg>
        
        <div class="controls">
            <button id="playBtn">Restart Animation</button>
        </div>
    </div>

    <script>
        const svg = document.getElementById('sim-svg');
        const btn = document.getElementById('playBtn');
        
        btn.addEventListener('click', () => {
            // Remove class to reset animations
            svg.classList.remove('is-playing');
            
            // Trigger reflow to restart CSS animations
            void svg.offsetWidth; 
            
            // Add class back to start playing
            svg.classList.add('is-playing');
        });
    </script>
</body>
</html>
