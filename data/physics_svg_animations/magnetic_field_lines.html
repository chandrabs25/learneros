<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Field of a Solenoid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Animations */
        @keyframes flow-fast {
            to { stroke-dashoffset: -30; }
        }

        @keyframes flow-slow {
            to { stroke-dashoffset: -30; }
        }

        @keyframes energize {
            0%, 100% { stroke-width: 1.5px; filter: drop-shadow(0 0 2px rgba(184,115,51,0.3)); }
            50% { stroke-width: 3px; filter: drop-shadow(0 0 6px rgba(184,115,51,0.9)); }
        }

        @keyframes fade-pulse {
            0%, 100% { opacity: 0; transform: scale(0.9); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .b-field-internal {
            stroke-dasharray: 15 15;
            animation: flow-fast 0.8s linear infinite;
        }

        .b-field-external {
            stroke-dasharray: 15 15;
            animation: flow-slow 2.4s linear infinite;
        }

        .wire-stroke {
            animation: energize 2s ease-in-out infinite;
        }

        .cancel-pulse {
            animation: fade-pulse 1.5s ease-in-out infinite;
            transform-origin: center;
        }

        /* Hover Interactivity */
        .cancellation-ui {
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
            transform: translateY(5px);
            pointer-events: none;
        }

        .cancellation-container:hover .cancellation-ui {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-target {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Magnetic Field of a Finite Solenoid</title>
        <desc id="svg-desc">An animated diagram showing the magnetic field lines inside and outside a solenoid, with current entering the top wires and exiting the bottom wires.</desc>

        <defs>
            <!-- Markers for Current Arrows -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>

            <!-- Markers for Cancellation Pulses -->
            <marker id="arrow-purple-small" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                <path d="M 0 2 L 10 5 L 0 8 z" fill="#7209B7" />
            </marker>

            <!-- Wire Templates -->
            <g id="wire-top">
                <circle cx="0" cy="0" r="12" fill="#333" stroke="#B87333" class="wire-stroke"/>
                <!-- Current Into Page (Cross) -->
                <line x1="-6" y1="-6" x2="6" y2="6" stroke="#B87333" stroke-width="2"/>
                <line x1="6" y1="-6" x2="-6" y2="6" stroke="#B87333" stroke-width="2"/>
            </g>

            <g id="wire-bottom">
                <circle cx="0" cy="0" r="12" fill="#333" stroke="#B87333" class="wire-stroke"/>
                <!-- Current Out of Page (Dot) -->
                <circle cx="0" cy="0" r="3" fill="#B87333"/>
            </g>

            <!-- Cancellation Pulse Pairs -->
            <g id="cancel-pair-top" class="cancel-pulse">
                <!-- Left wire field (down), Right wire field (up) -->
                <path d="M -4 -12 L -4 12" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple-small)"/>
                <path d="M 4 12 L 4 -12" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple-small)"/>
            </g>

            <g id="cancel-pair-bottom" class="cancel-pulse">
                <!-- Left wire field (up), Right wire field (down) -->
                <path d="M -4 12 L -4 -12" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple-small)"/>
                <path d="M 4 -12 L 4 12" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple-small)"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Title -->
        <text x="400" y="45" font-family="Inter" font-size="24" font-weight="700" fill="#212529" text-anchor="middle">Magnetic Field of a Finite Solenoid</text>

        <!-- Poles Labels -->
        <text x="70" y="260" font-family="Inter" font-size="32" font-weight="700" fill="#FF3366" text-anchor="middle">N</text>
        <text x="730" y="260" font-family="Inter" font-size="32" font-weight="700" fill="#4361EE" text-anchor="middle">S</text>

        <!-- ================= MAGNETIC FIELD LINES ================= -->
        <g fill="none" stroke="#7209B7" stroke-width="2">
            
            <!-- External Field Lines (Slow, Left to Right) -->
            <!-- Top Outer Loop -->
            <path d="M 120 190 A 280 120 0 0 1 680 190" class="b-field-external"/>
            <!-- Top Inner Loop -->
            <path d="M 150 220 A 250 80 0 0 1 650 220" class="b-field-external"/>
            <!-- Bottom Inner Loop -->
            <path d="M 150 280 A 250 80 0 0 0 650 280" class="b-field-external"/>
            <!-- Bottom Outer Loop -->
            <path d="M 120 310 A 280 120 0 0 0 680 310" class="b-field-external"/>

            <!-- Internal Field Lines (Fast, Right to Left) -->
            <path d="M 680 190 L 120 190" class="b-field-internal"/>
            <path d="M 650 220 L 150 220" class="b-field-internal"/>
            <path d="M 750 250 L 50 250" class="b-field-internal"/> <!-- Center Line -->
            <path d="M 650 280 L 150 280" class="b-field-internal"/>
            <path d="M 680 310 L 120 310" class="b-field-internal"/>
        </g>

        <!-- Static Arrowheads for Field Direction -->
        <g fill="#7209B7">
            <!-- Internal Arrows (Pointing Left) -->
            <polygon points="405,186 395,190 405,194" />
            <polygon points="405,216 395,220 405,224" />
            <polygon points="405,246 395,250 405,254" />
            <polygon points="405,276 395,280 405,284" />
            <polygon points="405,306 395,310 405,314" />

            <!-- External Arrows (Pointing Right) -->
            <polygon points="395,66 405,70 395,74" />   <!-- Top Outer -->
            <polygon points="395,136 405,140 395,144" /> <!-- Top Inner -->
            <polygon points="395,356 405,360 395,364" /> <!-- Bottom Inner -->
            <polygon points="395,426 405,430 395,434" /> <!-- Bottom Outer -->
        </g>

        <!-- Central B-Vector Label -->
        <text x="400" y="240" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#7209B7" text-anchor="middle">B</text>
        <path d="M 395 226 L 405 226 L 402 223 M 405 226 L 402 229" fill="none" stroke="#7209B7" stroke-width="1.5"/>

        <!-- ================= CANCELLATION PULSES ================= -->
        <!-- Top Row Gaps -->
        <use href="#cancel-pair-top" x="240" y="170"/>
        <use href="#cancel-pair-top" x="280" y="170"/>
        <use href="#cancel-pair-top" x="320" y="170"/>
        <use href="#cancel-pair-top" x="360" y="170"/>
        <use href="#cancel-pair-top" x="440" y="170"/>
        <use href="#cancel-pair-top" x="480" y="170"/>
        <use href="#cancel-pair-top" x="520" y="170"/>
        <use href="#cancel-pair-top" x="560" y="170"/>

        <!-- Bottom Row Gaps -->
        <use href="#cancel-pair-bottom" x="240" y="330"/>
        <use href="#cancel-pair-bottom" x="280" y="330"/>
        <use href="#cancel-pair-bottom" x="320" y="330"/>
        <use href="#cancel-pair-bottom" x="360" y="330"/>
        <use href="#cancel-pair-bottom" x="400" y="330"/>
        <use href="#cancel-pair-bottom" x="440" y="330"/>
        <use href="#cancel-pair-bottom" x="480" y="330"/>
        <use href="#cancel-pair-bottom" x="520" y="330"/>
        <use href="#cancel-pair-bottom" x="560" y="330"/>

        <!-- ================= SOLENOID WIRES ================= -->
        <!-- Top Row (Current In) -->
        <use href="#wire-top" x="220" y="170"/>
        <use href="#wire-top" x="260" y="170"/>
        <use href="#wire-top" x="300" y="170"/>
        <use href="#wire-top" x="340" y="170"/>
        <use href="#wire-top" x="380" y="170"/>
        <use href="#wire-top" x="420" y="170"/>
        <use href="#wire-top" x="460" y="170"/>
        <use href="#wire-top" x="500" y="170"/>
        <use href="#wire-top" x="540" y="170"/>
        <use href="#wire-top" x="580" y="170"/>

        <!-- Bottom Row (Current Out) -->
        <use href="#wire-bottom" x="220" y="330"/>
        <use href="#wire-bottom" x="260" y="330"/>
        <use href="#wire-bottom" x="300" y="330"/>
        <use href="#wire-bottom" x="340" y="330"/>
        <use href="#wire-bottom" x="380" y="330"/>
        <use href="#wire-bottom" x="420" y="330"/>
        <use href="#wire-bottom" x="460" y="330"/>
        <use href="#wire-bottom" x="500" y="330"/>
        <use href="#wire-bottom" x="540" y="330"/>
        <use href="#wire-bottom" x="580" y="330"/>

        <!-- ================= CURRENT INDICATORS ================= -->
        <!-- Top Left Wire (Clockwise) -->
        <path d="M 205 170 A 15 15 0 1 1 220 185" fill="none" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
        <!-- Top Right Wire (Clockwise) -->
        <path d="M 565 170 A 15 15 0 1 1 580 185" fill="none" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
        
        <!-- Bottom Left Wire (Counter-Clockwise) -->
        <path d="M 235 330 A 15 15 0 1 0 220 315" fill="none" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
        <!-- Bottom Right Wire (Counter-Clockwise) -->
        <path d="M 595 330 A 15 15 0 1 0 580 315" fill="none" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>

        <!-- Current Labels -->
        <text x="175" y="175" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#06D6A0" text-anchor="end">I_in</text>
        <text x="175" y="335" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#06D6A0" text-anchor="end">I_out</text>

        <!-- ================= INTERACTIVE CANCELLATION ZONE ================= -->
        <g class="cancellation-container">
            <!-- UI Elements -->
            <g class="cancellation-ui">
                <!-- Highlight Circle -->
                <circle cx="400" cy="170" r="24" fill="none" stroke="#FF3366" stroke-width="2" stroke-dasharray="4 4"/>
                <!-- Connecting Line -->
                <line x1="400" y1="146" x2="400" y2="120" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="2 2"/>
                <!-- Callout Box -->
                <rect x="320" y="90" width="160" height="30" rx="6" fill="#212529" opacity="0.95"/>
                <text x="400" y="110" font-family="Inter" font-size="12" font-weight="600" fill="#f8f9fa" text-anchor="middle">Vertical fields cancel</text>
            </g>
            <!-- Central Cancellation Pulse (Always active, part of the hover group) -->
            <use href="#cancel-pair-top" x="400" y="170"/>
            <!-- Invisible Hover Target -->
            <rect x="370" y="140" width="60" height="60" fill="transparent" class="hover-target"/>
        </g>

        <!-- ================= LEGEND & FORMULA ================= -->
        <!-- Legend Box -->
        <rect x="20" y="400" width="180" height="80" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
        <text x="35" y="425" font-family="Inter" font-size="13" font-weight="700" fill="#212529">Legend</text>
        
        <line x1="35" y1="445" x2="55" y2="445" stroke="#7209B7" stroke-width="3"/>
        <text x="65" y="449" font-family="Inter" font-size="12" fill="#495057">Magnetic Field (B)</text>
        
        <line x1="35" y1="465" x2="55" y2="465" stroke="#06D6A0" stroke-width="3"/>
        <text x="65" y="469" font-family="Inter" font-size="12" fill="#495057">Current (I)</text>

        <!-- Formula -->
        <text x="760" y="445" font-family="Roboto Mono" font-size="22" font-weight="700" fill="#7209B7" text-anchor="end">B = μ₀ n I</text>
        <text x="760" y="465" font-family="Inter" font-size="13" fill="#6c757d" text-anchor="end">Ideal Solenoid Equation</text>

    </svg>
</div>

</body>
</html>
