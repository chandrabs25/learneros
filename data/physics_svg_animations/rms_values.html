<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMS Value: The Heating Effect Equivalence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        text {
            font-family: 'Inter', sans-serif;
            fill: #333;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .title {
            font-size: 22px;
            font-weight: 700;
            fill: #111;
        }
        .axis-label {
            font-size: 13px;
            font-weight: 600;
            fill: #6c757d;
        }
        .legend-text {
            font-size: 12px;
            font-weight: 500;
        }

        /* Animations */
        #blue-wave {
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: drawBlue 12s infinite linear;
        }
        @keyframes drawBlue {
            0%, 2% { stroke-dashoffset: 800; opacity: 1; }
            16.6%, 91.6% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        #blue-label {
            opacity: 0;
            animation: fadeBlueLabel 12s infinite linear;
        }
        @keyframes fadeBlueLabel {
            0%, 8% { opacity: 0; }
            16.6%, 91.6% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        #red-wave {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: drawRed 12s infinite linear;
        }
        @keyframes drawRed {
            0%, 16.6% { stroke-dashoffset: 1000; opacity: 0; }
            16.7% { opacity: 1; stroke-dashoffset: 1000; }
            33.3%, 91.6% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        #red-label {
            opacity: 0;
            animation: fadeRedLabel 12s infinite linear;
        }
        @keyframes fadeRedLabel {
            0%, 25% { opacity: 0; }
            33.3%, 91.6% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        #red-area {
            opacity: 0;
            animation: fadeRedArea 12s infinite linear;
        }
        @keyframes fadeRedArea {
            0%, 33.3% { opacity: 0; }
            41.6%, 45% { opacity: 0.15; }
            50%, 100% { opacity: 0; }
        }

        #green-rect {
            opacity: 0;
            animation: animGreenRect 12s infinite ease-in-out;
        }
        @keyframes animGreenRect {
            0%, 45% { opacity: 0; height: 120px; y: 230px; }
            50%, 58.3% { opacity: 0.15; height: 120px; y: 230px; }
            75%, 91.6% { opacity: 0.15; height: 84.84px; y: 265.16px; }
            95%, 100% { opacity: 0; }
        }

        #mean-line-group {
            opacity: 0;
            animation: animMeanLine 12s infinite ease-in-out;
        }
        @keyframes animMeanLine {
            0%, 45% { opacity: 0; transform: translateY(0); }
            50%, 58.3% { opacity: 1; transform: translateY(0); }
            75%, 91.6% { opacity: 1; transform: translateY(35.16px); }
            95%, 100% { opacity: 0; }
        }

        .mean-label {
            opacity: 0;
            animation: fadeMeanLabel 12s infinite linear;
        }
        @keyframes fadeMeanLabel {
            0%, 45% { opacity: 0; }
            50%, 58.3% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }

        .rms-label {
            opacity: 0;
            animation: fadeRMSLabel 12s infinite linear;
        }
        @keyframes fadeRMSLabel {
            0%, 65% { opacity: 0; }
            75%, 91.6% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* Resistor Animations */
        .electron {
            animation: oscillate 2s infinite ease-in-out;
        }
        @keyframes oscillate {
            0% { transform: translateY(0); }
            25% { transform: translateY(-35px); }
            50% { transform: translateY(0); }
            75% { transform: translateY(35px); }
            100% { transform: translateY(0); }
        }

        .resistor-glow {
            animation: pulseGlow 1s infinite ease-in-out;
        }
        @keyframes pulseGlow {
            0% { opacity: 0; }
            25% { opacity: 0.8; }
            50% { opacity: 0; }
            75% { opacity: 0.8; }
            100% { opacity: 0; }
        }

        /* Interactive Hover Effects */
        .rms-hover-group {
            cursor: pointer;
        }
        .rms-hover-text {
            opacity: 0;
            transition: opacity 0.2s ease;
            pointer-events: none;
        }
        .rms-line-visible {
            transition: stroke-width 0.2s ease;
        }
        .rms-hover-group:hover .rms-hover-text {
            opacity: 1;
        }
        .rms-hover-group:hover .rms-line-visible {
            stroke-width: 4px;
        }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-end" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c757d" />
            </marker>
            <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
                <path d="M 10 0 L 0 5 L 10 10 z" fill="#6c757d" />
            </marker>

            <!-- Glow Gradient -->
            <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF3366" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#FF3366" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Title -->
        <text x="400" y="40" class="title" text-anchor="middle">RMS Value: The Heating Effect Equivalence</text>

        <!-- Legend -->
        <g transform="translate(600, 30)">
            <rect x="0" y="0" width="170" height="90" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
            <line x1="15" y1="20" x2="40" y2="20" stroke="#4361EE" stroke-width="3"/>
            <text x="50" y="24" class="legend-text">Current (i)</text>
            
            <line x1="15" y1="45" x2="40" y2="45" stroke="#FF3366" stroke-width="3"/>
            <text x="50" y="49" class="legend-text">Power ∝ i²</text>
            
            <line x1="15" y1="70" x2="40" y2="70" stroke="#06D6A0" stroke-width="2" stroke-dasharray="5,3"/>
            <text x="50" y="74" class="legend-text">RMS Equivalent</text>
        </g>

        <!-- Graph Grid & Axes -->
        <g id="grid-lines" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4,4">
            <line x1="80" y1="110" x2="560" y2="110" /> <!-- Peak i^2 -->
            <line x1="80" y1="230" x2="560" y2="230" /> <!-- Peak i / Mean -->
            <line x1="80" y1="470" x2="560" y2="470" /> <!-- Trough i -->
        </g>

        <!-- Y Axis -->
        <line x1="80" y1="480" x2="80" y2="80" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow-end)" />
        <!-- X Axis -->
        <line x1="80" y1="350" x2="580" y2="350" stroke="#6c757d" stroke-width="2" marker-end="url(#arrow-end)" />

        <!-- Axis Labels -->
        <text x="70" y="114" class="axis-label math" text-anchor="end" fill="#FF3366">I₀²</text>
        <text x="70" y="234" class="axis-label math" text-anchor="end" fill="#4361EE">I₀</text>
        <text x="70" y="354" class="axis-label math" text-anchor="end">0</text>
        <text x="70" y="474" class="axis-label math" text-anchor="end" fill="#4361EE">-I₀</text>
        <text x="570" y="370" class="axis-label math" text-anchor="end">Time (t)</text>

        <!-- Animated Areas -->
        <!-- Area under i^2 -->
        <path id="red-area" d="M 80 350 C 110 350, 110 110, 140 110 C 170 110, 170 350, 200 350 C 230 350, 230 110, 260 110 C 290 110, 290 350, 320 350 C 350 350, 350 110, 380 110 C 410 110, 410 350, 440 350 C 470 350, 470 110, 500 110 C 530 110, 530 350, 560 350 L 560 350 L 80 350 Z" fill="#FF3366" />
        
        <!-- Green Rectangle (Mean Area) -->
        <rect id="green-rect" x="80" y="230" width="480" height="120" fill="#06D6A0" />

        <!-- Animated Waves -->
        <!-- Blue Wave (i) -->
        <path id="blue-wave" d="M 80 350 C 123.7 230, 156.3 230, 200 350 C 243.7 470, 276.3 470, 320 350 C 363.7 230, 396.3 230, 440 350 C 483.7 470, 516.3 470, 560 350" fill="none" stroke="#4361EE" stroke-width="3" stroke-linecap="round" />
        
        <!-- Red Wave (i^2) -->
        <path id="red-wave" d="M 80 350 C 110 350, 110 110, 140 110 C 170 110, 170 350, 200 350 C 230 350, 230 110, 260 110 C 290 110, 290 350, 320 350 C 350 350, 350 110, 380 110 C 410 110, 410 350, 440 350 C 470 350, 470 110, 500 110 C 530 110, 530 350, 560 350" fill="none" stroke="#FF3366" stroke-width="3" stroke-linecap="round" />

        <!-- Wave Equations -->
        <text id="blue-label" x="320" y="450" class="math" fill="#4361EE" font-weight="600">i(t) = I₀ sin(ωt)</text>
        <text id="red-label" x="320" y="90" class="math" fill="#FF3366" font-weight="600">i²(t) = I₀² sin²(ωt)</text>

        <!-- Mean / RMS Line Group -->
        <g id="mean-line-group">
            <g class="rms-hover-group">
                <!-- Invisible thick line for easier hovering -->
                <line x1="80" y1="230" x2="560" y2="230" stroke="transparent" stroke-width="20" class="rms-line-hitbox" />
                <!-- Visible dashed line -->
                <line x1="80" y1="230" x2="560" y2="230" stroke="#06D6A0" stroke-width="2" stroke-dasharray="8,4" class="rms-line-visible" />
                
                <!-- Labels -->
                <text x="350" y="220" class="math mean-label" fill="#06D6A0" font-weight="700">Mean = I₀² / 2</text>
                <text x="350" y="220" class="math rms-label" fill="#06D6A0" font-weight="700">I<tspan dy="3" font-size="10">rms</tspan><tspan dy="-3"> = I₀ / √2</tspan></text>
                
                <!-- Hover Text -->
                <text x="490" y="220" class="math rms-hover-text" fill="#00B4D8" font-weight="700">≈ 0.707 I₀</text>
            </g>
        </g>

        <!-- Physical Resistor Circuit -->
        <g transform="translate(0, 0)">
            <!-- Wire -->
            <line x1="680" y1="150" x2="680" y2="210" stroke="#333" stroke-width="2" />
            <line x1="680" y1="290" x2="680" y2="350" stroke="#333" stroke-width="2" />
            
            <!-- Resistor Box -->
            <rect x="660" y="210" width="40" height="80" rx="3" fill="#fff" stroke="#333" stroke-width="2" />
            <!-- Zigzag inside resistor -->
            <path d="M 665 220 L 695 230 L 665 240 L 695 250 L 665 260 L 695 270 L 665 280" fill="none" stroke="#6c757d" stroke-width="1.5" stroke-linejoin="round"/>
            
            <text x="710" y="255" font-family="Inter" font-weight="700" font-size="16" fill="#333">R</text>
            
            <!-- Glow Effect -->
            <circle cx="680" cy="250" r="55" fill="url(#glowGrad)" class="resistor-glow" />
            
            <!-- Electron Particle -->
            <circle cx="680" cy="250" r="6" fill="#4361EE" class="electron" />
            
            <!-- Label -->
            <text x="680" y="380" font-family="Inter" font-weight="600" font-size="14" fill="#FF3366" text-anchor="middle">Heating Effect</text>
            <text x="680" y="400" font-family="Inter" font-size="12" fill="#6c757d" text-anchor="middle">Same as DC I<tspan dy="3" font-size="9">rms</tspan></text>
        </g>

    </svg>
</div>

</body>
</html>
