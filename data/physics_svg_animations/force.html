<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamics of Force: Restoring Force and Potential Energy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        h1 {
            color: #212529;
            font-size: 24px;
            margin-bottom: 10px;
            text-align: center;
        }

        p.subtitle {
            color: #6c757d;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            max-width: 800px;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography inside SVG */
        .label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            fill: #495057;
        }
        
        .math {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 15px;
        }

        .math-small {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
        }

        /* Animation Classes */
        .animatable {
            animation-duration: 4s;
            animation-iteration-count: infinite;
        }

        /* 
         * SHM Timing Approximation:
         * 0-25%: ease-out (fast to slow, moving away from equilibrium)
         * 25-50%: ease-in (slow to fast, returning to equilibrium)
         * 50-75%: ease-out (fast to slow, moving away from equilibrium)
         * 75-100%: ease-in (slow to fast, returning to equilibrium)
         */

        @keyframes massMove {
            0%   { transform: translateY(0); animation-timing-function: ease-out; }
            25%  { transform: translateY(100px); animation-timing-function: ease-in; }
            50%  { transform: translateY(0); animation-timing-function: ease-out; }
            75%  { transform: translateY(-100px); animation-timing-function: ease-in; }
            100% { transform: translateY(0); }
        }

        @keyframes springStretch {
            0%   { d: path('M 300,50 L 300,60 L 320,78.75 L 280,116.25 L 320,153.75 L 280,191.25 L 300,210 L 300,220'); animation-timing-function: ease-out; }
            25%  { d: path('M 300,50 L 300,60 L 320,91.25 L 280,153.75 L 320,216.25 L 280,278.75 L 300,310 L 300,320'); animation-timing-function: ease-in; }
            50%  { d: path('M 300,50 L 300,60 L 320,78.75 L 280,116.25 L 320,153.75 L 280,191.25 L 300,210 L 300,220'); animation-timing-function: ease-out; }
            75%  { d: path('M 300,50 L 300,60 L 320,66.25 L 280,78.75 L 320,91.25 L 280,103.75 L 300,110 L 300,120'); animation-timing-function: ease-in; }
            100% { d: path('M 300,50 L 300,60 L 320,78.75 L 280,116.25 L 320,153.75 L 280,191.25 L 300,210 L 300,220'); }
        }

        @keyframes forceRestoring {
            0%   { d: path('M 320,250 L 320,249.9'); animation-timing-function: ease-out; }
            25%  { d: path('M 320,250 L 320,150'); animation-timing-function: ease-in; }
            50%  { d: path('M 320,250 L 320,250.1'); animation-timing-function: ease-out; }
            75%  { d: path('M 320,250 L 320,350'); animation-timing-function: ease-in; }
            100% { d: path('M 320,250 L 320,249.9'); }
        }

        @keyframes velocityVector {
            0%   { d: path('M 300,250 L 300,330'); animation-timing-function: ease-out; }
            25%  { d: path('M 300,250 L 300,250.1'); animation-timing-function: ease-in; }
            50%  { d: path('M 300,250 L 300,170'); animation-timing-function: ease-out; }
            75%  { d: path('M 300,250 L 300,249.9'); animation-timing-function: ease-in; }
            100% { d: path('M 300,250 L 300,330'); }
        }

        @keyframes displacementLine {
            0%   { d: path('M 240,250 L 240,250.1'); animation-timing-function: ease-out; }
            25%  { d: path('M 240,250 L 240,350'); animation-timing-function: ease-in; }
            50%  { d: path('M 240,250 L 240,250.1'); animation-timing-function: ease-out; }
            75%  { d: path('M 240,250 L 240,150'); animation-timing-function: ease-in; }
            100% { d: path('M 240,250 L 240,250.1'); }
        }

        @keyframes peBar {
            0%   { transform: scaleY(0); animation-timing-function: ease-out; }
            25%  { transform: scaleY(1); animation-timing-function: ease-in; }
            50%  { transform: scaleY(0); animation-timing-function: ease-out; }
            75%  { transform: scaleY(1); animation-timing-function: ease-in; }
            100% { transform: scaleY(0); }
        }

        @keyframes keBar {
            0%   { transform: scaleY(1); animation-timing-function: ease-out; }
            25%  { transform: scaleY(0); animation-timing-function: ease-in; }
            50%  { transform: scaleY(1); animation-timing-function: ease-out; }
            75%  { transform: scaleY(0); animation-timing-function: ease-in; }
            100% { transform: scaleY(1); }
        }

        /* Apply animations */
        #mass-group { animation-name: massMove; }
        #spring { animation-name: springStretch; }
        #force-s { animation-name: forceRestoring; }
        #velocity { animation-name: velocityVector; }
        #disp-line { animation-name: displacementLine; }
        .pe-bar { animation-name: peBar; transform-origin: 570px 400px; }
        .ke-bar { animation-name: keBar; transform-origin: 640px 400px; }

        /* Interactivity */
        #mass-hitbox:hover {
            cursor: pointer;
        }
        
        #tooltip {
            transition: opacity 0.2s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <h1>Dynamics of Force: Restoring Force and Potential Energy</h1>
    <p class="subtitle">Hover over the mass to pause the animation and view instantaneous physics values.</p>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Force, Restoring Force, and Energy</title>
            <desc id="svg-desc">An animated diagram showing a mass on a vertical spring undergoing simple harmonic motion. It visualizes the constant gravitational force, the variable restoring force, the velocity, and the continuous conversion between kinetic and potential energy.</desc>

            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0,1 L 10,5 L 0,9 z" fill="#FF3366" />
                </marker>
                <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0,1 L 10,5 L 0,9 z" fill="#4361EE" />
                </marker>
                <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0,1 L 10,5 L 0,9 z" fill="#06D6A0" />
                </marker>
                <marker id="arrow-cyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0,1 L 10,5 L 0,9 z" fill="#00B4D8" />
                </marker>
            </defs>

            <!-- Background Grid (Subtle) -->
            <g stroke="#f1f3f5" stroke-width="1">
                <line x1="0" y1="150" x2="800" y2="150" />
                <line x1="0" y1="250" x2="800" y2="250" />
                <line x1="0" y1="350" x2="800" y2="350" />
            </g>

            <!-- Top Support -->
            <rect x="230" y="30" width="140" height="20" fill="#adb5bd" rx="4" />
            <path d="M 240,30 L 250,20 M 260,30 L 270,20 M 280,30 L 290,20 M 300,30 L 310,20 M 320,30 L 330,20 M 340,30 L 350,20 M 360,30 L 370,20" stroke="#6c757d" stroke-width="2" />

            <!-- Equilibrium Reference Line -->
            <line x1="100" y1="250" x2="480" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,6" />
            <text x="100" y="240" class="label" fill="#6c757d">Equilibrium (x = 0)</text>

            <!-- Displacement Line (x) -->
            <path id="disp-line" class="animatable" stroke="#00B4D8" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arrow-cyan)" />
            <text x="215" y="255" class="math" fill="#00B4D8">x</text>

            <!-- The Spring -->
            <path id="spring" class="animatable" fill="none" stroke="#6c757d" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" />

            <!-- The Mass and Forces Group -->
            <g id="mass-group" class="animatable">
                <!-- Mass Box -->
                <rect x="270" y="220" width="60" height="60" rx="8" fill="#ced4da" stroke="#495057" stroke-width="3" />
                <text x="300" y="255" class="math" fill="#495057" text-anchor="middle">m</text>

                <!-- Gravitational Force (Constant Downward) -->
                <path d="M 280,250 L 280,310" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
                <text x="215" y="305" class="math" fill="#FF3366">F_g = mg</text>

                <!-- Velocity Vector (Green) -->
                <path id="velocity" class="animatable" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <text x="305" y="335" class="math" fill="#06D6A0">v</text>

                <!-- Restoring Force (Proportional to -x) -->
                <path id="force-s" class="animatable" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)" />
                <text x="330" y="200" class="math" fill="#4361EE">F_s = -kx</text>

                <!-- Invisible Hitbox for Hover Interaction -->
                <rect id="mass-hitbox" x="250" y="200" width="100" height="100" fill="transparent" />
            </g>

            <!-- Energy Bar Chart Section -->
            <g transform="translate(500, 100)">
                <!-- Chart Background & Axes -->
                <rect x="0" y="0" width="250" height="340" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8" />
                <text x="125" y="30" class="label" font-weight="bold" text-anchor="middle">Energy Conservation</text>
                
                <line x1="30" y1="300" x2="220" y2="300" stroke="#adb5bd" stroke-width="2" />
                
                <!-- Potential Energy (U) -->
                <rect x="50" y="150" width="40" height="150" fill="#4361EE" class="animatable pe-bar" />
                <text x="70" y="320" class="math" text-anchor="middle" fill="#4361EE">U</text>
                <text x="70" y="335" class="math-small" text-anchor="middle" fill="#4361EE">Potential</text>

                <!-- Kinetic Energy (K) -->
                <rect x="120" y="150" width="40" height="150" fill="#FF3366" class="animatable ke-bar" />
                <text x="140" y="320" class="math" text-anchor="middle" fill="#FF3366">K</text>
                <text x="140" y="335" class="math-small" text-anchor="middle" fill="#FF3366">Kinetic</text>

                <!-- Total Energy (E) -->
                <rect x="190" y="150" width="40" height="150" fill="#06D6A0" />
                <text x="210" y="320" class="math" text-anchor="middle" fill="#06D6A0">E</text>
                <text x="210" y="335" class="math-small" text-anchor="middle" fill="#06D6A0">Total</text>
            </g>

            <!-- Formula Overlay -->
            <g transform="translate(30, 400)">
                <rect x="0" y="0" width="340" height="60" rx="6" fill="#ffffff" stroke="#ced4da" stroke-width="2" />
                <text x="170" y="35" class="math" font-size="18" text-anchor="middle" fill="#212529">
                    E<tspan dy="5" font-size="12">total</tspan><tspan dy="-5"> = </tspan>
                    <tspan fill="#FF3366">½mv²</tspan> + <tspan fill="#4361EE">½kx²</tspan>
                </text>
            </g>

            <!-- Interactive Tooltip -->
            <g id="tooltip" opacity="0" transform="translate(350, 80)">
                <rect width="140" height="85" rx="6" fill="rgba(33, 37, 41, 0.9)" />
                <text x="10" y="25" fill="#00B4D8" class="math-small" id="val-x">x = 0.00 m</text>
                <text x="10" y="45" fill="#4361EE" class="math-small" id="val-fs">Fs = 0.00 N</text>
                <text x="10" y="65" fill="#06D6A0" class="math-small" id="val-v">Speed = 0.00 m/s</text>
            </g>

        </svg>
    </div>

    <script>
        const hitbox = document.getElementById('mass-hitbox');
        const tooltip = document.getElementById('tooltip');
        const animatables = document.querySelectorAll('.animatable');
        const valX = document.getElementById('val-x');
        const valFs = document.getElementById('val-fs');
        const valV = document.getElementById('val-v');
        const massGroup = document.getElementById('mass-group');

        hitbox.addEventListener('mouseenter', () => {
            // Pause all animations
            animatables.forEach(el => el.style.animationPlayState = 'paused');
            tooltip.setAttribute('opacity', '1');
            updateTooltip();
        });

        hitbox.addEventListener('mouseleave', () => {
            // Resume all animations
            animatables.forEach(el => el.style.animationPlayState = 'running');
            tooltip.setAttribute('opacity', '0');
        });

        function updateTooltip() {
            const transform = window.getComputedStyle(massGroup).getPropertyValue('transform');
            let y = 0;
            
            if (transform !== 'none') {
                // Extract translateY from matrix(1, 0, 0, 1, 0, Y)
                const matrix = transform.match(/matrix.*\((.+)\)/)[1].split(', ');
                y = parseFloat(matrix[5]);
            }

            // Map pixel displacement (-100 to 100) to physical meters (-1.0 to 1.0)
            const x_meters = (y / 100);
            
            // Spring constant k = 10 N/m for demonstration
            const k = 10;
            const fs_newtons = -k * x_meters;
            
            // Speed based on energy conservation: v = sqrt(1 - x^2) (normalized max speed 1.0 m/s)
            const speed = Math.sqrt(Math.max(0, 1 - x_meters * x_meters));

            // Format and update text
            valX.textContent = `x  = ${x_meters > 0 ? '+' : ''}${x_meters.toFixed(2)} m`;
            valFs.textContent = `Fs = ${fs_newtons > 0 ? '+' : ''}${fs_newtons.toFixed(2)} N`;
            valV.textContent = `|v| = ${speed.toFixed(2)} m/s`;
        }
    </script>
</body>
</html>
