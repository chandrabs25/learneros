<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile Motion Dynamics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e9ecef;
            --panel-bg: #ffffff;
            --svg-bg: #f8f9fa;
            --text-main: #212529;
            --text-muted: #495057;
            --border-color: #dee2e6;
            --color-red: #FF3366;
            --color-green: #06D6A0;
            --color-cyan: #00B4D8;
            --color-grey: #6C757D;
            --color-dark: #343A40;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 900px;
            width: 100%;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
        }

        p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .svg-container {
            position: relative;
            width: 100%;
            background: var(--svg-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #ffffff;
            border-top: 1px solid var(--border-color);
        }

        button {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #4361EE;
            color: white;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:hover {
            background: #364fc7;
        }

        button:active {
            transform: scale(0.97);
        }

        button#btn-reset {
            background: var(--color-grey);
        }

        button#btn-reset:hover {
            background: #495057;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Projectile Motion: Independent Kinematics</h1>
        <p>Observe how the horizontal velocity (<strong>v<sub>x</sub></strong>) remains constant while the vertical velocity (<strong>v<sub>y</sub></strong>) changes linearly due to constant downward gravitational acceleration (<strong>g</strong>). The resultant velocity (<strong>v</strong>) is always tangent to the parabolic trajectory.</p>
    </header>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Projectile Motion Dynamics Simulation</title>
            <desc>An animated simulation showing a projectile fired at an angle, illustrating the constant horizontal velocity and linearly changing vertical velocity due to gravity.</desc>

            <defs>
                <!-- Arrowhead Markers -->
                <marker id="arrow-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M 0 0 L 6 3 L 0 6 Z" fill="#FF3366"/>
                </marker>
                <marker id="arrow-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M 0 0 L 6 3 L 0 6 Z" fill="#06D6A0"/>
                </marker>
                <marker id="arrow-cyan" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M 0 0 L 6 3 L 0 6 Z" fill="#00B4D8"/>
                </marker>
                <marker id="arrow-axis" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                    <path d="M 0 0 L 6 3 L 0 6 Z" fill="#6C757D"/>
                </marker>

                <!-- Trajectory Clip Path -->
                <clipPath id="traj-clip">
                    <rect id="traj-clip-rect" x="50" y="0" width="0" height="500"/>
                </clipPath>

                <!-- Grid Pattern -->
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#DEE2E6" stroke-width="1"/>
                </pattern>
            </defs>

            <!-- Background & Grid -->
            <rect width="100%" height="100%" fill="#f8f9fa"/>
            <rect width="100%" height="100%" fill="url(#grid)"/>

            <!-- Axes -->
            <g stroke="#6C757D" stroke-width="2">
                <line x1="50" y1="450" x2="760" y2="450" marker-end="url(#arrow-axis)"/>
                <line x1="50" y1="450" x2="50" y2="40" marker-end="url(#arrow-axis)"/>
            </g>
            
            <!-- Axis Ticks -->
            <path d="M 100 450 v 5 M 150 450 v 5 M 200 450 v 5 M 250 450 v 5 M 300 450 v 5 M 350 450 v 5 M 400 450 v 5 M 450 450 v 5 M 500 450 v 5 M 550 450 v 5 M 600 450 v 5 M 650 450 v 5 M 700 450 v 5" stroke="#6C757D" stroke-width="1.5" fill="none"/>
            <path d="M 50 400 h -5 M 50 350 h -5 M 50 300 h -5 M 50 250 h -5 M 50 200 h -5 M 50 150 h -5 M 50 100 h -5" stroke="#6C757D" stroke-width="1.5" fill="none"/>

            <!-- Axis Labels -->
            <text x="745" y="435" font-family="Inter" font-size="14" fill="#6C757D" font-style="italic">x (m)</text>
            <text x="60" y="55" font-family="Inter" font-size="14" fill="#6C757D" font-style="italic">y (m)</text>

            <!-- Angle Marker -->
            <path d="M 100 450 A 50 50 0 0 0 71 404.6" fill="none" stroke="#6C757D" stroke-width="1.5"/>
            <text x="82" y="432" font-family="Inter" font-style="italic" font-size="14" fill="#6C757D">θ</text>

            <!-- Trajectory Path -->
            <path id="trajectory" d="M 50 450 Q 375 -250 700 450" fill="none" stroke="#6C757D" stroke-width="2" stroke-dasharray="8 6" clip-path="url(#traj-clip)"/>

            <!-- Legend -->
            <g transform="translate(20, 20)">
                <rect width="210" height="115" fill="rgba(255,255,255,0.9)" stroke="#DEE2E6" rx="6"/>
                <text x="15" y="25" font-family="Inter" font-weight="700" font-size="13" fill="#212529">Vectors Key</text>
                
                <line x1="15" y1="45" x2="40" y2="45" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)"/>
                <text x="55" y="49" font-family="Inter" font-size="12" fill="#495057">Resultant Velocity (<tspan font-style="italic" font-weight="bold">v</tspan>)</text>
                
                <line x1="15" y1="65" x2="40" y2="65" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
                <text x="55" y="69" font-family="Inter" font-size="12" fill="#495057">Components (<tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="9">x</tspan>, <tspan font-style="italic">v</tspan><tspan baseline-shift="sub" font-size="9">y</tspan>)</text>
                
                <line x1="15" y1="85" x2="40" y2="85" stroke="#00B4D8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
                <text x="55" y="89" font-family="Inter" font-size="12" fill="#495057">Gravity (<tspan font-style="italic" font-weight="bold">g</tspan>)</text>

                <line x1="15" y1="105" x2="40" y2="105" stroke="#6C757D" stroke-width="2" stroke-dasharray="4 3"/>
                <text x="55" y="109" font-family="Inter" font-size="12" fill="#495057">Trajectory Path</text>
            </g>

            <!-- Data Overlay -->
            <g transform="translate(610, 20)">
                <rect width="170" height="95" fill="rgba(255,255,255,0.9)" stroke="#DEE2E6" rx="6"/>
                <text x="15" y="25" font-family="Inter" font-weight="700" font-size="12" fill="#6C757D" text-transform="uppercase" letter-spacing="1">Live Data</text>
                
                <text x="15" y="48" class="math-text" font-size="13" fill="#212529">t  = <tspan id="val-t">0.00</tspan> s</text>
                <text x="15" y="68" class="math-text" font-size="13" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">x</tspan> = <tspan id="val-vx">15.0</tspan> m/s</text>
                <text x="15" y="88" class="math-text" font-size="13" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">y</tspan> = <tspan id="val-vy">24.5</tspan> m/s</text>
            </g>

            <!-- Projectile & Vectors Group -->
            <g id="projectile" transform="translate(50, 450)">
                <!-- Projection Lines -->
                <line id="proj-x" x1="0" y1="0" x2="0" y2="0" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="3 3"/>
                <line id="proj-y" x1="0" y1="0" x2="0" y2="0" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="3 3"/>

                <!-- Gravity Vector -->
                <line x1="0" y1="0" x2="0" y2="60" stroke="#00B4D8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
                <g transform="translate(10, 45)">
                    <text font-family="Inter" font-style="italic" font-weight="bold" font-size="14" fill="#00B4D8">g</text>
                    <path d="M 0 -12 L 8 -12 L 5 -15 M 8 -12 L 5 -9" stroke="#00B4D8" stroke-width="1.5" fill="none"/>
                </g>

                <!-- Velocity Components -->
                <line id="vec-vx" x1="0" y1="0" x2="45.5" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)"/>
                <line id="vec-vy" x1="0" y1="0" x2="0" y2="-98" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)"/>

                <!-- Resultant Velocity -->
                <line id="vec-v" x1="0" y1="0" x2="45.5" y2="-98" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-red)"/>

                <!-- Projectile Mass -->
                <circle cx="0" cy="0" r="7" fill="#343A40"/>

                <!-- Vector Labels -->
                <text id="lbl-vx" x="22.75" y="18" font-family="Inter" font-style="italic" font-size="14" fill="#06D6A0" text-anchor="middle">v<tspan baseline-shift="sub" font-size="10">x</tspan></text>
                <text id="lbl-vy" x="-12" y="-49" font-family="Inter" font-style="italic" font-size="14" fill="#06D6A0" text-anchor="end" dominant-baseline="middle">v<tspan baseline-shift="sub" font-size="10">y</tspan></text>
                
                <g id="lbl-v" transform="translate(60, -110)" fill="#FF3366">
                    <text font-family="Inter" font-style="italic" font-weight="bold" font-size="15">v</text>
                    <path d="M 0 -13 L 8 -13 L 5 -16 M 8 -13 L 5 -10" stroke="#FF3366" stroke-width="1.5" fill="none"/>
                </g>
            </g>
        </svg>

        <div class="controls">
            <button id="btn-play">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="icon-playpause"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                <span id="text-playpause">Pause</span>
            </button>
            <button id="btn-reset">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>
                Restart
            </button>
        </div>
    </div>
</div>

<script>
    // Physics Constants (SVG coordinate space)
    const X0 = 50;
    const Y0 = 450;
    const V_X0 = 130;
    const V_Y0 = -280;
    const G = 112;
    
    // Display Constants (Real-world metric equivalents for the overlay)
    const REAL_VX = 15.0;
    const REAL_G = 9.8;
    const REAL_VY0 = 24.5; // 9.8 * 2.5s

    // Animation Timing
    const T_FLIGHT = 5.0;
    const T_PAUSE = 1.5;
    const T_TOTAL = T_FLIGHT + T_PAUSE;
    const VISUAL_SCALE = 0.35; // Scales vector lengths for SVG

    // DOM Elements
    const projectile = document.getElementById('projectile');
    const vecVx = document.getElementById('vec-vx');
    const vecVy = document.getElementById('vec-vy');
    const vecV = document.getElementById('vec-v');
    const projX = document.getElementById('proj-x');
    const projY = document.getElementById('proj-y');
    const lblVx = document.getElementById('lbl-vx');
    const lblVy = document.getElementById('lbl-vy');
    const lblV = document.getElementById('lbl-v');
    const clipRect = document.getElementById('traj-clip-rect');
    
    const valT = document.getElementById('val-t');
    const valVx = document.getElementById('val-vx');
    const valVy = document.getElementById('val-vy');
    
    const btnPlay = document.getElementById('btn-play');
    const btnReset = document.getElementById('btn-reset');
    const iconPlayPause = document.getElementById('icon-playpause');
    const textPlayPause = document.getElementById('text-playpause');

    // State
    let animationTime = 0;
    let lastTimestamp = 0;
    let isPlaying = true;
    let reqId;

    function updatePhysics(t) {
        // Calculate physics state
        let x = X0 + V_X0 * t;
        let y = Y0 + V_Y0 * t + 0.5 * G * t * t;
        let vx = V_X0;
        let vy = V_Y0 + G * t;

        // Update Projectile Position
        projectile.setAttribute('transform', `translate(${x}, ${y})`);
        clipRect.setAttribute('width', Math.max(0, x - X0));

        // Scale vectors for visual display
        let vx_scaled = vx * VISUAL_SCALE;
        let vy_scaled = vy * VISUAL_SCALE;

        // Update Vector Lines
        vecVx.setAttribute('x2', vx_scaled);
        vecVy.setAttribute('y2', vy_scaled);
        vecV.setAttribute('x2', vx_scaled);
        vecV.setAttribute('y2', vy_scaled);

        // Update Projection Lines (Rectangle completion)
        projX.setAttribute('x1', vx_scaled);
        projX.setAttribute('x2', vx_scaled);
        projX.setAttribute('y2', vy_scaled);
        
        projY.setAttribute('y1', vy_scaled);
        projY.setAttribute('x2', vx_scaled);
        projY.setAttribute('y2', vy_scaled);

        // Handle visibility near apex to prevent visual artifacts
        const nearApex = Math.abs(vy_scaled) < 2;
        vecVy.style.opacity = nearApex ? '0' : '1';
        projX.style.opacity = nearApex ? '0' : '1';
        projY.style.opacity = nearApex ? '0' : '1';
        lblVy.style.opacity = nearApex ? '0' : '1';

        // Update Labels Positions
        lblVx.setAttribute('x', vx_scaled / 2);
        lblVy.setAttribute('y', vy_scaled / 2);

        // Position Resultant Vector Label
        let v_mag = Math.sqrt(vx_scaled*vx_scaled + vy_scaled*vy_scaled);
        let ux = vx_scaled / v_mag;
        let uy = vy_scaled / v_mag;
        lblV.setAttribute('transform', `translate(${vx_scaled + ux * 18}, ${vy_scaled + uy * 18})`);

        // Update Data Overlay (Real-world metric values)
        let real_vy = REAL_VY0 - REAL_G * t;
        
        valT.textContent = t.toFixed(2);
        valVx.textContent = REAL_VX.toFixed(1);
        // Format vy to avoid "-0.0"
        let display_vy = Math.abs(real_vy) < 0.05 ? "0.0" : real_vy.toFixed(1);
        valVy.textContent = display_vy;
    }

    function step(timestamp) {
        if (!lastTimestamp) lastTimestamp = timestamp;
        let dt = timestamp - lastTimestamp;
        lastTimestamp = timestamp;

        if (isPlaying) {
            animationTime += dt;
            let t_cycle = (animationTime % (T_TOTAL * 1000)) / 1000;
            
            // Clamp time during the pause phase
            let currentT = t_cycle > T_FLIGHT ? T_FLIGHT : t_cycle;
            
            updatePhysics(currentT);
        }
        reqId = requestAnimationFrame(step);
    }

    // Interactivity Controls
    btnPlay.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            textPlayPause.textContent = 'Pause';
            iconPlayPause.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
            lastTimestamp = performance.now();
        } else {
            textPlayPause.textContent = 'Play';
            iconPlayPause.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"></polygon>';
        }
    });

    btnReset.addEventListener('click', () => {
        animationTime = 0;
        if (!isPlaying) {
            updatePhysics(0);
        }
    });

    // Start Animation Loop
    reqId = requestAnimationFrame(step);
</script>

</body>
</html>
