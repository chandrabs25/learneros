<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity: Projectile Motion & Field Dynamics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
            margin: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            position: absolute;
            bottom: 24px;
            left: 24px;
            display: flex;
            gap: 12px;
        }

        button {
            padding: 10px 18px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            background: #4361EE;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(67, 97, 238, 0.2);
        }

        button:hover {
            background: #304ffe;
            transform: translateY(-1px);
        }

        button.toggle-active {
            background: #06D6A0;
            box-shadow: 0 4px 6px rgba(6, 214, 160, 0.2);
        }

        button.toggle-active:hover {
            background: #05b586;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 600;
            paint-order: stroke;
            stroke: rgba(255, 255, 255, 0.9);
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .data-box-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            fill: #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <svg viewBox="0 0 800 500" id="main-svg">
            <defs>
                <!-- Arrowheads -->
                <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
                </marker>
                <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
                </marker>
                <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
                </marker>
                <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155" />
                </marker>

                <!-- Planet Gradient -->
                <radialGradient id="planet-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
                    <stop offset="0%" stop-color="#e0fbfc" />
                    <stop offset="100%" stop-color="#90e0ef" />
                </radialGradient>

                <!-- Grid Pattern -->
                <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                    <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e2e8f0" stroke-width="1" opacity="0.5"/>
                </pattern>
            </defs>

            <!-- Background & Grid -->
            <rect width="800" height="500" fill="#f8f9fa" />
            <rect width="550" height="500" fill="url(#grid)" />
            
            <!-- MAIN STAGE (Projectile Motion) -->
            <g id="main-stage">
                <!-- Ground -->
                <rect x="0" y="400" width="550" height="100" fill="#e2e8f0" />
                <line x1="0" y1="400" x2="550" y2="400" stroke="#94a3b8" stroke-width="3" />
                
                <!-- Trajectory Path -->
                <path d="M 50 400 Q 250 -200 450 400" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
                
                <!-- Coordinate Axes -->
                <g transform="translate(50, 400)" opacity="0.7">
                    <line x1="0" y1="0" x2="0" y2="-60" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-black)" />
                    <line x1="0" y1="0" x2="60" y2="0" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow-black)" />
                    <text x="-15" y="-50" font-family="Inter" font-style="italic" font-size="14" fill="#334155">y</text>
                    <text x="50" y="20" font-family="Inter" font-style="italic" font-size="14" fill="#334155">x</text>
                </g>

                <!-- Projectile Group -->
                <g id="projectile-group" transform="translate(50, 400)">
                    <!-- Vectors Layer -->
                    <g id="vectors">
                        <!-- Component Guides -->
                        <line id="guide-vx" x1="0" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />
                        <line id="guide-vy" x1="0" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6" />

                        <!-- Velocity Vectors -->
                        <line id="vec-vx" x1="0" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                        <line id="vec-vy" x1="0" y1="0" x2="0" y2="-120" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)" />
                        <line id="vec-v" x1="0" y1="0" x2="40" y2="-120" stroke="#06D6A0" stroke-width="3.5" marker-end="url(#arrow-green)" />
                        
                        <!-- Force Vector -->
                        <line id="vec-fg" x1="0" y1="0" x2="0" y2="60" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
                        
                        <!-- Vector Math Labels -->
                        <text id="lbl-vx-math" class="math-text" font-size="12" fill="#06D6A0">
                            v<tspan baseline-shift="sub" font-size="9">x</tspan> = v<tspan baseline-shift="sub" font-size="9">0</tspan> cos θ
                        </text>
                        <text id="lbl-vy-math" class="math-text" font-size="12" fill="#06D6A0" text-anchor="end">
                            v<tspan baseline-shift="sub" font-size="9">y</tspan> = v<tspan baseline-shift="sub" font-size="9">0</tspan> sin θ - gt
                        </text>
                        <text id="lbl-v-math" class="math-text" font-size="14" fill="#06D6A0" font-style="italic" font-weight="bold">v</text>
                        <text id="lbl-fg-math" class="math-text" font-size="12" fill="#FF3366">
                            F<tspan baseline-shift="sub" font-size="9">g</tspan> = mg
                        </text>
                    </g>
                    <!-- The Particle -->
                    <circle cx="0" cy="0" r="8" fill="#1e293b" />
                </g>
            </g>

            <!-- SIDE PANEL (Gravitational Field) -->
            <g id="side-panel" transform="translate(550, 0)">
                <!-- Divider -->
                <line x1="0" y1="0" x2="0" y2="500" stroke="#cbd5e1" stroke-width="2" />
                <rect x="1" y="0" width="249" height="500" fill="#ffffff" />
                
                <!-- Panel Title -->
                <text x="125" y="35" font-family="Inter" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1">GRAVITATIONAL FIELD</text>

                <!-- Planet -->
                <g transform="translate(125, 700)">
                    <!-- Radial Field Lines -->
                    <g stroke="#00B4D8" stroke-width="1.5" opacity="0.5">
                        <!-- Angles: 90 (up), 75, 105, 60, 120 -->
                        <line x1="0" y1="-600" x2="0" y2="-320" marker-end="url(#arrow-cyan)" />
                        <line x1="0" y1="-600" x2="0" y2="-320" transform="rotate(15)" marker-end="url(#arrow-cyan)" />
                        <line x1="0" y1="-600" x2="0" y2="-320" transform="rotate(-15)" marker-end="url(#arrow-cyan)" />
                        <line x1="0" y1="-600" x2="0" y2="-320" transform="rotate(30)" marker-end="url(#arrow-cyan)" />
                        <line x1="0" y1="-600" x2="0" y2="-320" transform="rotate(-30)" marker-end="url(#arrow-cyan)" />
                    </g>
                    <!-- Planet Body -->
                    <circle cx="0" cy="0" r="300" fill="url(#planet-grad)" stroke="#00B4D8" stroke-width="2" />
                    <text x="0" y="-270" text-anchor="middle" font-family="Inter" font-weight="700" font-size="14" fill="#0077b6" opacity="0.8">PLANET MASS (M)</text>
                </g>

                <!-- Altitude Axis -->
                <line x1="125" y1="400" x2="125" y2="80" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,4" />
                <text x="135" y="90" font-family="Inter" font-size="11" fill="#64748b">Altitude (h)</text>
                
                <!-- Field Indicator (Synced with Projectile) -->
                <g id="field-indicator" transform="translate(125, 400)">
                    <circle cx="0" cy="0" r="6" fill="#7209B7" />
                    <line id="vec-g" x1="0" y1="0" x2="0" y2="80" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrow-cyan)" />
                    <text x="12" y="4" font-family="Inter" font-style="italic" font-weight="600" font-size="12" fill="#7209B7">m</text>
                    <text id="lbl-g" class="math-text" x="12" y="40" font-size="12" fill="#00B4D8">g(h)</text>
                </g>
            </g>

            <!-- UI OVERLAYS -->
            <text x="24" y="36" font-family="Inter" font-size="22" font-weight="700" fill="#0f172a">Gravity: Projectile Motion & Field Dynamics</text>
            
            <!-- Real-time Data Box -->
            <g transform="translate(24, 60)">
                <rect x="0" y="0" width="180" height="90" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.95" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
                <text x="12" y="26" class="data-box-text">t   = <tspan id="data-t" font-weight="700" fill="#4361EE">0.00</tspan> s</text>
                <text x="12" y="52" class="data-box-text">v_y = <tspan id="data-vy" font-weight="700" fill="#06D6A0">+19.6</tspan> m/s</text>
                <text x="12" y="78" class="data-box-text">a_y = <tspan font-weight="700" fill="#FF3366">-9.8</tspan> m/s²</text>
            </g>

            <!-- Legend -->
            <g transform="translate(24, 165)">
                <rect x="0" y="0" width="200" height="95" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" opacity="0.95" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
                
                <circle cx="16" cy="22" r="5" fill="#06D6A0" />
                <text x="32" y="26" font-family="Inter" font-size="12" font-weight="600" fill="#334155">Velocity (<tspan font-style="italic">v, v_x, v_y</tspan>)</text>
                
                <circle cx="16" cy="48" r="5" fill="#FF3366" />
                <text x="32" y="52" font-family="Inter" font-size="12" font-weight="600" fill="#334155">Gravitational Force (<tspan font-style="italic">F_g</tspan>)</text>
                
                <circle cx="16" cy="74" r="5" fill="#00B4D8" />
                <text x="32" y="78" font-family="Inter" font-size="12" font-weight="600" fill="#334155">Gravitational Field (<tspan font-style="italic">g</tspan>)</text>
            </g>
        </svg>
        
        <div class="controls">
            <button id="btn-play">Pause</button>
            <button id="btn-vectors" class="toggle-active">Hide Vectors</button>
        </div>
    </div>

    <script>
        // Animation State
        let isPlaying = true;
        let showVectors = true;
        let startTime = null;
        let pausedTime = 0;
        let lastTimestamp = 0;

        // Timing Constants (ms)
        const LOOP_DURATION = 6000;
        const PHASE_LAUNCH = 500;
        const PHASE_FLIGHT = 4000;
        const PHASE_IMPACT = 1500;

        // Physics Constants (SVG units)
        const X0 = 50;
        const Y0 = 400;
        const V0X = 100;
        const V0Y = -300;
        const G = 150;
        const VEC_SCALE = 0.4;

        // DOM Elements
        const projectileGroup = document.getElementById('projectile-group');
        const vectorsGroup = document.getElementById('vectors');
        const fieldIndicator = document.getElementById('field-indicator');
        
        const vecVx = document.getElementById('vec-vx');
        const vecVy = document.getElementById('vec-vy');
        const vecV = document.getElementById('vec-v');
        const guideVx = document.getElementById('guide-vx');
        const guideVy = document.getElementById('guide-vy');
        const vecG = document.getElementById('vec-g');
        
        const lblVxMath = document.getElementById('lbl-vx-math');
        const lblVyMath = document.getElementById('lbl-vy-math');
        const lblVMath = document.getElementById('lbl-v-math');
        const lblFgMath = document.getElementById('lbl-fg-math');
        const lblG = document.getElementById('lbl-g');

        const dataT = document.getElementById('data-t');
        const dataVy = document.getElementById('data-vy');

        function updatePhysics(t) {
            // Kinematic Equations
            let x = X0 + V0X * t;
            let y = Y0 + V0Y * t + 0.5 * G * t * t;
            let vx = V0X;
            let vy = V0Y + G * t;

            // Update Projectile Position
            projectileGroup.setAttribute('transform', `translate(${x}, ${y})`);

            // Scale Vectors for Display
            let vxScaled = vx * VEC_SCALE;
            let vyScaled = vy * VEC_SCALE;

            // Update Vector Lines
            vecVx.setAttribute('x2', vxScaled);
            vecVy.setAttribute('y2', vyScaled);
            vecV.setAttribute('x2', vxScaled);
            vecV.setAttribute('y2', vyScaled);

            // Update Guides (Dotted Rectangle)
            guideVx.setAttribute('x1', vxScaled);
            guideVx.setAttribute('x2', vxScaled);
            guideVx.setAttribute('y2', vyScaled);
            
            guideVy.setAttribute('y1', vyScaled);
            guideVy.setAttribute('x2', vxScaled);
            guideVy.setAttribute('y2', vyScaled);

            // Position Labels
            lblVxMath.setAttribute('x', vxScaled / 2 - 20);
            lblVxMath.setAttribute('y', 20);

            lblVyMath.setAttribute('x', -10);
            lblVyMath.setAttribute('y', vyScaled / 2 + 5);

            lblVMath.setAttribute('x', vxScaled + 8);
            lblVMath.setAttribute('y', vyScaled + 5);

            lblFgMath.setAttribute('x', 10);
            lblFgMath.setAttribute('y', 45);

            // Handle Vy near zero (Apex) to prevent marker flipping artifacts
            if (Math.abs(vyScaled) < 3) {
                vecVy.setAttribute('opacity', '0');
                lblVyMath.setAttribute('opacity', '0');
                guideVx.setAttribute('opacity', '0');
                guideVy.setAttribute('opacity', '0');
            } else {
                vecVy.setAttribute('opacity', '1');
                lblVyMath.setAttribute('opacity', '1');
                guideVx.setAttribute('opacity', '0.6');
                guideVy.setAttribute('opacity', '0.6');
            }

            // Real-world mapping for Data Box (t: 0-4s, apex at 2s)
            let realVy = 19.6 - 9.8 * t;
            dataT.textContent = t.toFixed(2);
            dataVy.textContent = (realVy >= 0 ? '+' : '') + realVy.toFixed(1);

            // Update Side Panel (Gravitational Field)
            fieldIndicator.setAttribute('transform', `translate(125, ${y})`);
            
            // Inverse Square Law scaling for visual g vector
            // R_visual = 300, h = 400 - y
            let h = 400 - y;
            let gScale = Math.pow(300 / (300 + h), 2);
            let gLength = 80 * gScale;
            
            vecG.setAttribute('y2', gLength);
            lblG.setAttribute('y', gLength + 18);
        }

        function animate(timestamp) {
            if (!isPlaying) {
                lastTimestamp = timestamp;
                requestAnimationFrame(animate);
                return;
            }
            if (!startTime) startTime = timestamp - pausedTime;
            
            let elapsed = timestamp - startTime;
            let cycleTime = elapsed % LOOP_DURATION;
            let opacity = 1;

            if (cycleTime < PHASE_LAUNCH) {
                // 1. Launch Phase (0s - 0.5s): Fade in at origin
                updatePhysics(0);
                opacity = cycleTime / PHASE_LAUNCH;
            } else if (cycleTime <= PHASE_LAUNCH + PHASE_FLIGHT) {
                // 2. Flight Phase (0.5s - 4.5s): Parabolic motion
                let t = (cycleTime - PHASE_LAUNCH) / 1000; // maps to 0.0 - 4.0
                updatePhysics(t);
                opacity = 1;
            } else {
                // 3. Impact & Reset Phase (4.5s - 6.0s): Fade out at end
                updatePhysics(4);
                let fadeProgress = (cycleTime - (PHASE_LAUNCH + PHASE_FLIGHT)) / PHASE_IMPACT;
                opacity = Math.max(0, 1 - fadeProgress);
            }

            projectileGroup.setAttribute('opacity', opacity);
            requestAnimationFrame(animate);
        }

        // Interactivity
        document.getElementById('btn-play').addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? 'Pause' : 'Play';
            if (isPlaying) {
                startTime = performance.now() - pausedTime;
            } else {
                pausedTime = lastTimestamp - startTime;
            }
        });

        document.getElementById('btn-vectors').addEventListener('click', function() {
            showVectors = !showVectors;
            this.classList.toggle('toggle-active');
            this.textContent = showVectors ? 'Hide Vectors' : 'Show Vectors';
            vectorsGroup.style.display = showVectors ? 'block' : 'none';
        });

        // Start Loop
        requestAnimationFrame(animate);
    </script>
</body>
</html>
