<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Superposition Principle & Beats</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #212529;
        }
        .container {
            width: 100%;
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        .btn {
            background: #4361EE;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:hover {
            background: #304ffe;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .slider-group {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            font-weight: 600;
        }
        .val-display {
            font-family: 'Roboto Mono', monospace;
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 4px;
            color: #FF3366;
        }
        input[type=range] {
            -webkit-appearance: none;
            width: 180px;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #FF3366;
            cursor: pointer;
            margin-top: -7px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #ced4da;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button class="btn" id="playPauseBtn">Pause Animation</button>
        <div class="slider-group">
            <label for="f2Slider">Wave 2 Frequency (f₂):</label>
            <input type="range" id="f2Slider" min="8" max="12" step="0.1" value="11">
            <span class="val-display" id="f2Val">11.0 Hz</span>
        </div>
        <div class="slider-group" style="margin-left: 20px;">
            <span style="color: #6c757d;">Wave 1 (f₁): <span class="math" style="color: #4361EE;">10.0 Hz</span></span>
        </div>
    </div>

    <svg viewBox="0 0 800 650" preserveAspectRatio="xMidYMid meet">
        <title>Superposition Principle and Beats</title>
        <desc>An animated diagram showing two sine waves of slightly different frequencies adding together to form a beat pattern.</desc>
        
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#adb5bd" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="8" />

        <!-- Titles -->
        <text x="400" y="35" font-family="Inter" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">Superposition Principle: The Physics of Beats</text>
        <text x="400" y="58" font-family="Inter" font-size="13" text-anchor="middle" fill="#6c757d">Adding two waves of slightly different frequencies creates a slowly varying amplitude envelope.</text>

        <!-- Grid Lines & Axes -->
        <g stroke="#e9ecef" stroke-width="1" stroke-dasharray="4,4">
            <!-- Panel 1 Grid -->
            <line x1="50" y1="100" x2="750" y2="100" />
            <line x1="50" y1="180" x2="750" y2="180" />
            <!-- Panel 2 Grid -->
            <line x1="50" y1="240" x2="750" y2="240" />
            <line x1="50" y1="320" x2="750" y2="320" />
            <!-- Panel 3 Grid -->
            <line x1="50" y1="400" x2="750" y2="400" />
            <line x1="50" y1="440" x2="750" y2="440" />
            <line x1="50" y1="520" x2="750" y2="520" />
            <line x1="50" y1="560" x2="750" y2="560" />
        </g>

        <!-- Main Axes -->
        <g stroke="#adb5bd" stroke-width="1.5">
            <line x1="50" y1="140" x2="750" y2="140" marker-end="url(#arrow)" />
            <line x1="50" y1="280" x2="750" y2="280" marker-end="url(#arrow)" />
            <line x1="50" y1="480" x2="750" y2="480" marker-end="url(#arrow)" />
        </g>

        <!-- Axis Labels -->
        <g font-family="Inter" font-size="12" fill="#adb5bd" font-style="italic">
            <text x="755" y="144">x</text>
            <text x="755" y="284">x</text>
            <text x="755" y="484">x</text>
        </g>

        <!-- Equations -->
        <text x="50" y="90" font-family="Roboto Mono" font-size="14" fill="#4361EE" font-weight="700">y₁ = A sin(ω₁t)</text>
        <text x="50" y="230" font-family="Roboto Mono" font-size="14" fill="#FF3366" font-weight="700">y₂ = A sin(ω₂t)</text>
        <text x="50" y="385" font-family="Roboto Mono" font-size="14" fill="#7209B7" font-weight="700">y_res = y₁ + y₂ = [2A cos( (ω₁-ω₂)/2 · t )] sin( (ω₁+ω₂)/2 · t )</text>

        <!-- Live Value Readouts -->
        <g font-family="Roboto Mono" font-size="13" text-anchor="end">
            <text x="740" y="90" fill="#4361EE" id="val1">y₁ = 0.00 A</text>
            <text x="740" y="230" fill="#FF3366" id="val2">y₂ = 0.00 A</text>
            <text x="740" y="385" fill="#7209B7" id="valNet">y_res = 0.00 A</text>
        </g>

        <!-- Envelopes -->
        <path id="envPos" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4" />
        <path id="envNeg" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4" />

        <!-- Waves -->
        <path id="wave1" fill="none" stroke="#4361EE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path id="wave2" fill="none" stroke="#FF3366" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
        <path id="waveNet" fill="none" stroke="#7209B7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

        <!-- Constructive / Destructive Markers -->
        <g id="markers" font-family="Inter" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">
            <text id="anti0" y="392" fill="#06D6A0" display="none">CONSTRUCTIVE</text>
            <text id="anti1" y="392" fill="#06D6A0" display="none">CONSTRUCTIVE</text>
            <text id="anti2" y="392" fill="#06D6A0" display="none">CONSTRUCTIVE</text>
            <text id="anti3" y="392" fill="#06D6A0" display="none">CONSTRUCTIVE</text>
            <text id="anti4" y="392" fill="#06D6A0" display="none">CONSTRUCTIVE</text>

            <text id="node0" y="580" fill="#F77F00" display="none">DESTRUCTIVE</text>
            <text id="node1" y="580" fill="#F77F00" display="none">DESTRUCTIVE</text>
            <text id="node2" y="580" fill="#F77F00" display="none">DESTRUCTIVE</text>
            <text id="node3" y="580" fill="#F77F00" display="none">DESTRUCTIVE</text>
            <text id="node4" y="580" fill="#F77F00" display="none">DESTRUCTIVE</text>
        </g>

        <!-- Summation Probe -->
        <g id="probeGroup">
            <line id="probeLine" x1="50" y1="80" x2="50" y2="590" stroke="#495057" stroke-width="1.5" stroke-dasharray="4,4" />
            <circle id="dot1" cx="50" cy="140" r="5" fill="#4361EE" stroke="#fff" stroke-width="1.5" />
            <circle id="dot2" cx="50" cy="280" r="5" fill="#FF3366" stroke="#fff" stroke-width="1.5" />
            <circle id="dotNet" cx="50" cy="480" r="6" fill="#7209B7" stroke="#fff" stroke-width="1.5" />
            
            <rect id="probeBg" x="50" y="600" width="130" height="26" rx="4" fill="#495057" />
            <text id="probeText" x="115" y="617" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Summation Probe</text>
        </g>
    </svg>
</div>

<script>
    const path1 = document.getElementById('wave1');
    const path2 = document.getElementById('wave2');
    const pathNet = document.getElementById('waveNet');
    const pathEnvPos = document.getElementById('envPos');
    const pathEnvNeg = document.getElementById('envNeg');
    
    const probeLine = document.getElementById('probeLine');
    const dot1 = document.getElementById('dot1');
    const dot2 = document.getElementById('dot2');
    const dotNet = document.getElementById('dotNet');
    const probeBg = document.getElementById('probeBg');
    const probeText = document.getElementById('probeText');
    
    const val1 = document.getElementById('val1');
    const val2 = document.getElementById('val2');
    const valNet = document.getElementById('valNet');

    const playPauseBtn = document.getElementById('playPauseBtn');
    const f2Slider = document.getElementById('f2Slider');
    const f2Val = document.getElementById('f2Val');

    // Physics Parameters
    let time = 0;
    let isPlaying = true;
    const f1 = 10.0;
    let f2 = 11.0;
    const v = 0.2; // Wave propagation speed
    const A = 40;  // Amplitude
    
    // SVG Layout Parameters
    const xStart = 50;
    const width = 700;
    const steps = 350; // Resolution of the path
    const dx = width / steps;
    
    const base1 = 140;
    const base2 = 280;
    const baseNet = 480;

    // Interactivity
    playPauseBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "Pause Animation" : "Play Animation";
    });

    f2Slider.addEventListener('input', (e) => {
        f2 = parseFloat(e.target.value);
        f2Val.textContent = f2.toFixed(1) + " Hz";
    });

    function animate() {
        if (isPlaying) {
            time += 0.012; // Controls animation speed
        }

        let d1 = `M ${xStart} ${base1}`;
        let d2 = `M ${xStart} ${base2}`;
        let dNet = `M ${xStart} ${baseNet}`;
        let dEnvP = `M ${xStart} ${baseNet}`;
        let dEnvN = `M ${xStart} ${baseNet}`;

        // Generate wave paths
        for (let i = 0; i <= steps; i++) {
            let x = i * dx;
            let x_norm = x / width;
            
            // Phase calculations (kx - wt)
            let phase1 = 2 * Math.PI * f1 * (x_norm - v * time);
            let phase2 = 2 * Math.PI * f2 * (x_norm - v * time);
            
            let y1 = A * Math.sin(phase1);
            let y2 = A * Math.sin(phase2);
            let yNet = y1 + y2;
            
            // Envelope equation: 2A cos(pi * (f1 - f2) * (x - vt))
            let env = 2 * A * Math.cos(Math.PI * (f1 - f2) * (x_norm - v * time));

            d1 += ` L ${xStart + x} ${base1 - y1}`;
            d2 += ` L ${xStart + x} ${base2 - y2}`;
            dNet += ` L ${xStart + x} ${baseNet - yNet}`;
            dEnvP += ` L ${xStart + x} ${baseNet - Math.abs(env)}`;
            dEnvN += ` L ${xStart + x} ${baseNet + Math.abs(env)}`;
        }

        path1.setAttribute('d', d1);
        path2.setAttribute('d', d2);
        pathNet.setAttribute('d', dNet);
        pathEnvPos.setAttribute('d', dEnvP);
        pathEnvNeg.setAttribute('d', dEnvN);

        // Probe Logic (Scans left to right over 10 seconds)
        let probe_x_norm = (time / 10) % 1;
        let probe_x = xStart + probe_x_norm * width;
        
        let p_phase1 = 2 * Math.PI * f1 * (probe_x_norm - v * time);
        let p_phase2 = 2 * Math.PI * f2 * (probe_x_norm - v * time);
        let p_y1 = A * Math.sin(p_phase1);
        let p_y2 = A * Math.sin(p_phase2);
        let p_yNet = p_y1 + p_y2;

        probeLine.setAttribute('x1', probe_x);
        probeLine.setAttribute('x2', probe_x);
        
        dot1.setAttribute('cx', probe_x);
        dot1.setAttribute('cy', base1 - p_y1);
        dot2.setAttribute('cx', probe_x);
        dot2.setAttribute('cy', base2 - p_y2);
        dotNet.setAttribute('cx', probe_x);
        dotNet.setAttribute('cy', baseNet - p_yNet);

        // Update readouts
        let sign1 = p_y1 >= 0 ? "+" : "";
        let sign2 = p_y2 >= 0 ? "+" : "";
        let signNet = p_yNet >= 0 ? "+" : "";
        val1.textContent = `y₁ = ${sign1}${(p_y1/A).toFixed(2)} A`;
        val2.textContent = `y₂ = ${sign2}${(p_y2/A).toFixed(2)} A`;
        valNet.textContent = `y_res = ${signNet}${(p_yNet/A).toFixed(2)} A`;

        // Probe Label Positioning
        let bgX = probe_x - 65;
        if (bgX < xStart) bgX = xStart;
        if (bgX > xStart + width - 130) bgX = xStart + width - 130;
        probeBg.setAttribute('x', bgX);
        probeText.setAttribute('x', bgX + 65);

        // Constructive / Destructive Markers Logic
        let df = f1 - f2;
        let antiNodes = [];
        let nodes = [];
        
        if (Math.abs(df) > 0.05) {
            // Find nodes and antinodes in the visible range [0, 1]
            for (let n = -20; n <= 20; n++) {
                let x_anti = n / df + v * time;
                let x_node = (n + 0.5) / df + v * time;
                
                if (x_anti >= 0 && x_anti <= 1) antiNodes.push(x_anti);
                if (x_node >= 0 && x_node <= 1) nodes.push(x_node);
            }
        }

        // Update DOM for markers
        for(let i = 0; i < 5; i++) {
            let antiEl = document.getElementById(`anti${i}`);
            if (i < antiNodes.length) {
                antiEl.setAttribute('x', xStart + antiNodes[i] * width);
                antiEl.setAttribute('display', 'block');
            } else {
                antiEl.setAttribute('display', 'none');
            }
            
            let nodeEl = document.getElementById(`node${i}`);
            if (i < nodes.length) {
                nodeEl.setAttribute('x', xStart + nodes[i] * width);
                nodeEl.setAttribute('display', 'block');
            } else {
                nodeEl.setAttribute('display', 'none');
            }
        }

        requestAnimationFrame(animate);
    }

    // Start animation loop
    animate();
</script>

</body>
</html>
