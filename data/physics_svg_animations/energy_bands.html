<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Energy Band Dynamics: Intrinsic vs. Extrinsic</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Interactive Hover */
        .gap-label rect { transition: fill 0.3s ease; }
        .gap-label:hover rect { fill: #fff3cd; cursor: pointer; }

        /* --- Animations (18s Loop) --- */
        
        /* Fermi Level Movement */
        @keyframes fermi {
            0%, 28% { transform: translateY(225px); }
            33%, 61% { transform: translateY(115px); }
            66%, 94% { transform: translateY(335px); }
            100% { transform: translateY(225px); }
        }
        .fermi-group { animation: fermi 18s infinite cubic-bezier(0.4, 0, 0.2, 1); }

        /* Phase Texts */
        @keyframes t1 { 0%, 31% { opacity: 1; } 33%, 100% { opacity: 0; } }
        @keyframes t2 { 0%, 31% { opacity: 0; } 33%, 64% { opacity: 1; } 66%, 100% { opacity: 0; } }
        @keyframes t3 { 0%, 64% { opacity: 0; } 66%, 98% { opacity: 1; } 100% { opacity: 0; } }
        .t1 { animation: t1 18s infinite linear; }
        .t2 { animation: t2 18s infinite linear; }
        .t3 { animation: t3 18s infinite linear; }

        /* Dopant Levels */
        @keyframes ed-line { 0%, 31% { opacity: 0; } 33%, 64% { opacity: 1; } 66%, 100% { opacity: 0; } }
        @keyframes ea-line { 0%, 64% { opacity: 0; } 66%, 98% { opacity: 1; } 100% { opacity: 0; } }
        .ed-group { animation: ed-line 18s infinite linear; opacity: 0; }
        .ea-group { animation: ea-line 18s infinite linear; opacity: 0; }

        /* --- Phase 1: Intrinsic Particles --- */
        @keyframes p1-e1 {
            0%, 33%, 100% { opacity: 0; }
            2% { opacity: 1; transform: translate(0, 0); }
            5% { transform: translate(0, -330px); }
            31% { opacity: 1; transform: translate(80px, -330px); }
            32% { opacity: 0; }
        }
        @keyframes p1-h1 {
            0%, 33%, 100% { opacity: 0; }
            4.9% { opacity: 0; }
            5% { opacity: 1; transform: translate(0, 0); }
            31% { opacity: 1; transform: translate(60px, 0); }
            32% { opacity: 0; }
        }
        @keyframes p1-e2 {
            0%, 33%, 100% { opacity: 0; }
            2% { opacity: 1; transform: translate(0, 0); }
            10% { transform: translate(0, -330px); }
            31% { opacity: 1; transform: translate(70px, -330px); }
            32% { opacity: 0; }
        }
        @keyframes p1-h2 {
            0%, 33%, 100% { opacity: 0; }
            9.9% { opacity: 0; }
            10% { opacity: 1; transform: translate(0, 0); }
            31% { opacity: 1; transform: translate(90px, 0); }
            32% { opacity: 0; }
        }
        @keyframes p1-e3 {
            0%, 33%, 100% { opacity: 0; }
            2% { opacity: 1; transform: translate(0, 0); }
            15% { transform: translate(0, -330px); }
            31% { opacity: 1; transform: translate(100px, -330px); }
            32% { opacity: 0; }
        }
        @keyframes p1-h3 {
            0%, 33%, 100% { opacity: 0; }
            14.9% { opacity: 0; }
            15% { opacity: 1; transform: translate(0, 0); }
            31% { opacity: 1; transform: translate(50px, 0); }
            32% { opacity: 0; }
        }
        .p1-e1 { animation: p1-e1 18s infinite linear; opacity: 0; }
        .p1-h1 { animation: p1-h1 18s infinite linear; opacity: 0; }
        .p1-e2 { animation: p1-e2 18s infinite linear; opacity: 0; }
        .p1-h2 { animation: p1-h2 18s infinite linear; opacity: 0; }
        .p1-e3 { animation: p1-e3 18s infinite linear; opacity: 0; }
        .p1-h3 { animation: p1-h3 18s infinite linear; opacity: 0; }

        /* --- Phase 2: n-type Particles --- */
        @keyframes p2-e1 {
            0%, 32%, 66%, 100% { opacity: 0; }
            34% { opacity: 1; transform: translate(0, 0); }
            37% { transform: translate(0, -70px); }
            64% { opacity: 1; transform: translate(80px, -70px); }
            65% { opacity: 0; }
        }
        @keyframes p2-e2 {
            0%, 32%, 66%, 100% { opacity: 0; }
            34% { opacity: 1; transform: translate(0, 0); }
            40% { transform: translate(0, -70px); }
            64% { opacity: 1; transform: translate(60px, -70px); }
            65% { opacity: 0; }
        }
        @keyframes p2-e3 {
            0%, 32%, 66%, 100% { opacity: 0; }
            34% { opacity: 1; transform: translate(0, 0); }
            43% { transform: translate(0, -70px); }
            64% { opacity: 1; transform: translate(100px, -70px); }
            65% { opacity: 0; }
        }
        @keyframes p2-min-e {
            0%, 32%, 66%, 100% { opacity: 0; }
            34% { opacity: 1; transform: translate(0, -330px); }
            64% { opacity: 1; transform: translate(90px, -330px); }
            65% { opacity: 0; }
        }
        @keyframes p2-min-h {
            0%, 32%, 66%, 100% { opacity: 0; }
            34% { opacity: 1; transform: translate(0, 0); }
            64% { opacity: 1; transform: translate(70px, 0); }
            65% { opacity: 0; }
        }
        .p2-e1 { animation: p2-e1 18s infinite linear; opacity: 0; }
        .p2-e2 { animation: p2-e2 18s infinite linear; opacity: 0; }
        .p2-e3 { animation: p2-e3 18s infinite linear; opacity: 0; }
        .p2-min-e { animation: p2-min-e 18s infinite linear; opacity: 0; }
        .p2-min-h { animation: p2-min-h 18s infinite linear; opacity: 0; }

        /* --- Phase 3: p-type Particles --- */
        @keyframes p3-e1 {
            0%, 65%, 100% { opacity: 0; }
            67% { opacity: 1; transform: translate(0, 0); }
            70% { transform: translate(0, -70px); }
            97% { opacity: 1; transform: translate(0, -70px); } /* Localized, no drift */
            98% { opacity: 0; }
        }
        @keyframes p3-h1 {
            0%, 65%, 100% { opacity: 0; }
            69.9% { opacity: 0; }
            70% { opacity: 1; transform: translate(0, 0); }
            97% { opacity: 1; transform: translate(80px, 0); }
            98% { opacity: 0; }
        }
        @keyframes p3-e2 {
            0%, 65%, 100% { opacity: 0; }
            67% { opacity: 1; transform: translate(0, 0); }
            73% { transform: translate(0, -70px); }
            97% { opacity: 1; transform: translate(0, -70px); }
            98% { opacity: 0; }
        }
        @keyframes p3-h2 {
            0%, 65%, 100% { opacity: 0; }
            72.9% { opacity: 0; }
            73% { opacity: 1; transform: translate(0, 0); }
            97% { opacity: 1; transform: translate(60px, 0); }
            98% { opacity: 0; }
        }
        @keyframes p3-e3 {
            0%, 65%, 100% { opacity: 0; }
            67% { opacity: 1; transform: translate(0, 0); }
            76% { transform: translate(0, -70px); }
            97% { opacity: 1; transform: translate(0, -70px); }
            98% { opacity: 0; }
        }
        @keyframes p3-h3 {
            0%, 65%, 100% { opacity: 0; }
            75.9% { opacity: 0; }
            76% { opacity: 1; transform: translate(0, 0); }
            97% { opacity: 1; transform: translate(100px, 0); }
            98% { opacity: 0; }
        }
        @keyframes p3-min-e {
            0%, 65%, 100% { opacity: 0; }
            67% { opacity: 1; transform: translate(0, -330px); }
            97% { opacity: 1; transform: translate(90px, -330px); }
            98% { opacity: 0; }
        }
        @keyframes p3-min-h {
            0%, 65%, 100% { opacity: 0; }
            67% { opacity: 1; transform: translate(0, 0); }
            97% { opacity: 1; transform: translate(70px, 0); }
            98% { opacity: 0; }
        }
        .p3-e1 { animation: p3-e1 18s infinite linear; opacity: 0; }
        .p3-h1 { animation: p3-h1 18s infinite linear; opacity: 0; }
        .p3-e2 { animation: p3-e2 18s infinite linear; opacity: 0; }
        .p3-h2 { animation: p3-h2 18s infinite linear; opacity: 0; }
        .p3-e3 { animation: p3-e3 18s infinite linear; opacity: 0; }
        .p3-h3 { animation: p3-h3 18s infinite linear; opacity: 0; }
        .p3-min-e { animation: p3-min-e 18s infinite linear; opacity: 0; }
        .p3-min-h { animation: p3-min-h 18s infinite linear; opacity: 0; }

        /* --- Transition Arrows --- */
        @keyframes arr1 { 0%, 4% { opacity: 0; } 5%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
        @keyframes arr2 { 0%, 36% { opacity: 0; } 37%, 47% { opacity: 1; } 48%, 100% { opacity: 0; } }
        @keyframes arr3 { 0%, 69% { opacity: 0; } 70%, 80% { opacity: 1; } 81%, 100% { opacity: 0; } }
        .arr1 { animation: arr1 18s infinite linear; opacity: 0; }
        .arr2 { animation: arr2 18s infinite linear; opacity: 0; }
        .arr3 { animation: arr3 18s infinite linear; opacity: 0; }

    </style>
</head>
<body>

    <h1>Energy Band Dynamics: Intrinsic vs. Extrinsic</h1>
    
    <div class="svg-container">
        <svg viewBox="0 0 800 500" role="img" aria-label="Animated diagram of semiconductor energy bands showing intrinsic, n-type, and p-type states.">
            <title>Semiconductor Energy Bands Animation</title>
            <desc>Visualizes the transition of electrons and holes across the band gap and dopant levels in different semiconductor states.</desc>
            
            <defs>
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
                </marker>
                <marker id="arrowhead-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#7209B7" />
                </marker>
                <marker id="arrowhead-axis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#111" />
                </marker>
            </defs>

            <!-- Static Background & Axes -->
            <line x1="50" y1="450" x2="50" y2="40" stroke="#111" stroke-width="2" marker-end="url(#arrowhead-axis)" />
            <text x="-260" y="35" transform="rotate(-90)" font-family="Inter" font-weight="600" font-size="16" fill="#111">E (Energy)</text>

            <line x1="50" y1="450" x2="750" y2="450" stroke="#111" stroke-width="2" marker-end="url(#arrowhead-axis)" />
            <text x="400" y="480" font-family="Inter" font-weight="600" font-size="16" fill="#111" text-anchor="middle">Spatial Delocalization (x)</text>

            <!-- Conduction Band (Ec) -->
            <rect x="100" y="20" width="620" height="80" fill="#FF3366" fill-opacity="0.1" />
            <line x1="100" y1="100" x2="720" y2="100" stroke="#FF3366" stroke-width="3" />
            <text x="730" y="60" font-family="Inter" font-weight="700" font-size="16" fill="#FF3366">E_c</text>
            <text x="730" y="80" font-family="Inter" font-size="12" fill="#FF3366">Conduction Band</text>

            <!-- Valence Band (Ev) -->
            <rect x="100" y="350" width="620" height="80" fill="#4361EE" fill-opacity="0.1" />
            <line x1="100" y1="350" x2="720" y2="350" stroke="#4361EE" stroke-width="3" />
            <text x="730" y="390" font-family="Inter" font-weight="700" font-size="16" fill="#4361EE">E_v</text>
            <text x="730" y="410" font-family="Inter" font-size="12" fill="#4361EE">Valence Band</text>

            <!-- Band Gap Label -->
            <g class="gap-label">
                <line x1="400" y1="210" x2="400" y2="110" stroke="#333" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />
                <line x1="400" y1="240" x2="400" y2="340" stroke="#333" stroke-width="1" stroke-dasharray="4,4" marker-end="url(#arrowhead)" />
                <rect x="330" y="210" width="140" height="30" fill="#ffffff" rx="4" />
                <text x="400" y="230" font-family="Inter" font-weight="600" font-size="14" fill="#333" text-anchor="middle">E_g ≈ 1.1 eV (Si)</text>
            </g>

            <!-- Dynamic Phase Texts -->
            <text x="120" y="50" font-family="Inter" font-weight="700" font-size="22" fill="#333" class="t1">Phase 1: Intrinsic Semiconductor</text>
            <text x="120" y="50" font-family="Inter" font-weight="700" font-size="22" fill="#333" class="t2">Phase 2: n-type Doping (Donor)</text>
            <text x="120" y="50" font-family="Inter" font-weight="700" font-size="22" fill="#333" class="t3">Phase 3: p-type Doping (Acceptor)</text>

            <!-- Formulas -->
            <text x="120" y="80" font-family="Roboto Mono" font-size="16" fill="#7209B7" class="t1">n_e = n_h = n_i</text>
            <text x="120" y="80" font-family="Roboto Mono" font-size="16" fill="#7209B7" class="t2">n_e ≫ n_h  (n_e ≈ N_d)</text>
            <text x="120" y="80" font-family="Roboto Mono" font-size="16" fill="#7209B7" class="t3">n_h ≫ n_e  (n_h ≈ N_a)</text>
            <text x="550" y="40" font-family="Roboto Mono" font-size="16" fill="#333">n_e · n_h = n_i²</text>

            <!-- Dynamic Energy Levels -->
            <g class="fermi-group">
                <line x1="100" y1="0" x2="720" y2="0" stroke="#00B4D8" stroke-width="2" stroke-dasharray="8,4" />
                <text x="730" y="5" font-family="Inter" font-weight="600" font-size="14" fill="#00B4D8">E_f</text>
            </g>

            <g class="ed-group">
                <line x1="100" y1="130" x2="720" y2="130" stroke="#06D6A0" stroke-width="2" stroke-dasharray="6,4" />
                <text x="730" y="135" font-family="Inter" font-weight="600" font-size="14" fill="#06D6A0">E_d (Donor)</text>
            </g>

            <g class="ea-group">
                <line x1="100" y1="320" x2="720" y2="320" stroke="#F77F00" stroke-width="2" stroke-dasharray="6,4" />
                <text x="730" y="325" font-family="Inter" font-weight="600" font-size="14" fill="#F77F00">E_a (Acceptor)</text>
            </g>

            <!-- Transition Arrows -->
            <line x1="200" y1="380" x2="200" y2="70" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-purple)" class="arr1" />
            <line x1="150" y1="120" x2="150" y2="70" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-purple)" class="arr2" />
            <line x1="150" y1="380" x2="150" y2="330" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-purple)" class="arr3" />

            <!-- Phase 1 Particles (Intrinsic) -->
            <circle cx="200" cy="390" r="6" fill="#06D6A0" class="p1-e1" />
            <circle cx="200" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p1-h1" />
            
            <circle cx="350" cy="390" r="6" fill="#06D6A0" class="p1-e2" />
            <circle cx="350" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p1-h2" />
            
            <circle cx="500" cy="390" r="6" fill="#06D6A0" class="p1-e3" />
            <circle cx="500" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p1-h3" />

            <!-- Phase 2 Particles (n-type) -->
            <circle cx="150" cy="130" r="6" fill="#06D6A0" class="p2-e1" />
            <circle cx="250" cy="130" r="6" fill="#06D6A0" class="p2-e2" />
            <circle cx="350" cy="130" r="6" fill="#06D6A0" class="p2-e3" />
            <circle cx="450" cy="130" r="6" fill="#06D6A0" class="p2-e1" />
            <circle cx="550" cy="130" r="6" fill="#06D6A0" class="p2-e2" />
            <circle cx="650" cy="130" r="6" fill="#06D6A0" class="p2-e3" />
            
            <circle cx="300" cy="390" r="6" fill="#06D6A0" class="p2-min-e" />
            <circle cx="400" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p2-min-h" />

            <!-- Phase 3 Particles (p-type) -->
            <circle cx="150" cy="390" r="6" fill="#06D6A0" class="p3-e1" />
            <circle cx="150" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h1" />
            
            <circle cx="250" cy="390" r="6" fill="#06D6A0" class="p3-e2" />
            <circle cx="250" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h2" />
            
            <circle cx="350" cy="390" r="6" fill="#06D6A0" class="p3-e3" />
            <circle cx="350" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h3" />
            
            <circle cx="450" cy="390" r="6" fill="#06D6A0" class="p3-e1" />
            <circle cx="450" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h1" />
            
            <circle cx="550" cy="390" r="6" fill="#06D6A0" class="p3-e2" />
            <circle cx="550" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h2" />
            
            <circle cx="650" cy="390" r="6" fill="#06D6A0" class="p3-e3" />
            <circle cx="650" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-h3" />

            <circle cx="300" cy="390" r="6" fill="#06D6A0" class="p3-min-e" />
            <circle cx="400" cy="390" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" class="p3-min-h" />

            <!-- Legend -->
            <g transform="translate(100, 475)">
                <circle cx="0" cy="0" r="6" fill="#06D6A0" />
                <text x="15" y="4" font-family="Inter" font-size="12" fill="#333">Electron (e⁻)</text>

                <circle cx="120" cy="0" r="5" fill="#fff" stroke="#F77F00" stroke-width="2" />
                <text x="135" y="4" font-family="Inter" font-size="12" fill="#333">Hole (h⁺)</text>

                <line x1="220" y1="0" x2="250" y2="0" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead-purple)" />
                <text x="265" y="4" font-family="Inter" font-size="12" fill="#333">Excitation</text>

                <line x1="360" y1="0" x2="390" y2="0" stroke="#00B4D8" stroke-width="2" stroke-dasharray="8,4" />
                <text x="400" y="4" font-family="Inter" font-size="12" fill="#333">Fermi Level (E_f)</text>
            </g>

        </svg>
    </div>

</body>
</html>
