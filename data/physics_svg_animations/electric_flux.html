<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electric Flux Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        /* Hover to pause */
        svg:hover * {
            animation-play-state: paused !important;
        }

        /* Animations */
        .rotating-surface {
            animation: rotateSurface 10s ease-in-out infinite;
            transform-origin: 400px 250px;
        }

        .counter-rotate {
            animation: counterRotate 10s ease-in-out infinite;
            transform-origin: 565px 250px;
        }

        .angle-arc {
            animation: drawArc 10s ease-in-out infinite;
        }

        .theta-label {
            animation: fadeTheta 10s ease-in-out infinite;
        }

        .flux-highlights {
            animation: fadeFlux 10s ease-in-out infinite;
        }

        .formula-max {
            animation: formMax 10s ease-in-out infinite;
        }

        .formula-mid {
            animation: formMid 10s ease-in-out infinite;
        }

        .formula-min {
            animation: formMin 10s ease-in-out infinite;
        }

        @keyframes rotateSurface {
            0%, 20% { transform: rotate(0deg); }
            60%, 80% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes counterRotate {
            0%, 20% { transform: rotate(0deg); }
            60%, 80% { transform: rotate(90deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes drawArc {
            0%, 20% { stroke-dashoffset: 125.66; }
            60%, 80% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 125.66; }
        }

        @keyframes fadeTheta {
            0%, 20% { opacity: 0; }
            25%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        @keyframes fadeFlux {
            0%, 20% { opacity: 1; }
            60%, 80% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes formMax {
            0%, 20% { opacity: 1; }
            25%, 95% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes formMid {
            0%, 20% { opacity: 0; }
            25%, 55% { opacity: 1; }
            60%, 80% { opacity: 0; }
            85%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes formMin {
            0%, 55% { opacity: 0; }
            60%, 80% { opacity: 1; }
            85%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Electric Field (Orange) -->
            <marker id="arrow-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            
            <!-- Arrowhead for Area Vector (Blue) -->
            <marker id="arrow-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>

            <!-- Glow Filter for Flux Intersections -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Dynamic Clip Path matching the rotating surface -->
            <clipPath id="surface-clip">
                <g class="rotating-surface">
                    <polygon points="370,150 430,120 430,350 370,380" />
                </g>
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title & Header -->
        <text x="30" y="40" font-family="Inter" font-weight="700" font-size="22" fill="#212529">Electric Flux Visualization</text>
        <text x="30" y="65" font-family="Roboto Mono" font-size="16" fill="#495057">Φ_E = E · A = E A cos(θ)</text>

        <!-- Legend -->
        <g transform="translate(600, 20)" font-family="Inter" font-size="12" fill="#495057">
            <rect x="0" y="0" width="170" height="75" fill="#ffffff" stroke="#dee2e6" rx="6" />
            
            <line x1="10" y1="18" x2="30" y2="18" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-e)" />
            <text x="45" y="22" font-weight="600">Electric Field (E)</text>
            
            <line x1="10" y1="38" x2="30" y2="38" stroke="#4361EE" stroke-width="2" marker-end="url(#arrow-a)" />
            <text x="45" y="42" font-weight="600">Area Vector (A)</text>
            
            <polygon points="10,61 15,55 30,55 25,61" fill="#4361EE" fill-opacity="0.2" stroke="#4361EE" stroke-width="1.5" />
            <text x="45" y="62" font-weight="600">Surface Area</text>
        </g>

        <!-- Static Electric Field Lines (Background Layer) -->
        <g id="e-field" stroke="#F77F00" stroke-width="2">
            <!-- Line 1 (y=100) -->
            <line x1="50" y1="100" x2="280" y2="100" marker-end="url(#arrow-e)" />
            <line x1="280" y1="100" x2="520" y2="100" marker-end="url(#arrow-e)" />
            <line x1="520" y1="100" x2="750" y2="100" marker-end="url(#arrow-e)" />
            
            <!-- Line 2 (y=150) -->
            <line x1="50" y1="150" x2="280" y2="150" marker-end="url(#arrow-e)" />
            <line x1="280" y1="150" x2="520" y2="150" marker-end="url(#arrow-e)" />
            <line x1="520" y1="150" x2="750" y2="150" marker-end="url(#arrow-e)" />

            <!-- Line 3 (y=200) -->
            <line x1="50" y1="200" x2="280" y2="200" marker-end="url(#arrow-e)" />
            <line x1="280" y1="200" x2="520" y2="200" marker-end="url(#arrow-e)" />
            <line x1="520" y1="200" x2="750" y2="200" marker-end="url(#arrow-e)" />

            <!-- Line 4 (y=250) - Center -->
            <line x1="50" y1="250" x2="280" y2="250" marker-end="url(#arrow-e)" />
            <line x1="280" y1="250" x2="520" y2="250" marker-end="url(#arrow-e)" />
            <line x1="520" y1="250" x2="750" y2="250" marker-end="url(#arrow-e)" />

            <!-- Line 5 (y=300) -->
            <line x1="50" y1="300" x2="280" y2="300" marker-end="url(#arrow-e)" />
            <line x1="280" y1="300" x2="520" y2="300" marker-end="url(#arrow-e)" />
            <line x1="520" y1="300" x2="750" y2="300" marker-end="url(#arrow-e)" />

            <!-- Line 6 (y=350) -->
            <line x1="50" y1="350" x2="280" y2="350" marker-end="url(#arrow-e)" />
            <line x1="280" y1="350" x2="520" y2="350" marker-end="url(#arrow-e)" />
            <line x1="520" y1="350" x2="750" y2="350" marker-end="url(#arrow-e)" />

            <!-- Line 7 (y=400) -->
            <line x1="50" y1="400" x2="280" y2="400" marker-end="url(#arrow-e)" />
            <line x1="280" y1="400" x2="520" y2="400" marker-end="url(#arrow-e)" />
            <line x1="520" y1="400" x2="750" y2="400" marker-end="url(#arrow-e)" />
        </g>

        <!-- E Vector Label -->
        <g transform="translate(700, 80)">
            <text x="0" y="0" font-family="Inter" font-weight="700" font-style="italic" font-size="20" fill="#F77F00">E</text>
            <path d="M 0 -18 L 12 -18 L 8 -22 M 12 -18 L 8 -14" stroke="#F77F00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Angle Arc (Theta) -->
        <path d="M 480 250 A 80 80 0 0 0 400 170" fill="none" stroke="#495057" stroke-width="2.5" stroke-dasharray="125.66" class="angle-arc" />
        <text x="465" y="215" font-family="Inter" font-style="italic" font-weight="600" font-size="18" fill="#495057" class="theta-label">θ</text>

        <!-- Rotating Surface and Area Vector -->
        <g class="rotating-surface">
            <!-- The Surface Plane -->
            <polygon points="370,150 430,120 430,350 370,380" fill="#4361EE" fill-opacity="0.2" stroke="#4361EE" stroke-width="3" stroke-linejoin="round" />
            
            <!-- Area Vector (A) -->
            <line x1="400" y1="250" x2="550" y2="250" stroke="#4361EE" stroke-width="4" marker-end="url(#arrow-a)" />
            
            <!-- Area Vector Label (Counter-rotated to stay upright) -->
            <g class="counter-rotate">
                <text x="565" y="255" font-family="Inter" font-weight="700" font-style="italic" font-size="20" fill="#4361EE">A</text>
                <path d="M 565 235 L 577 235 L 573 231 M 577 235 L 573 239" stroke="#4361EE" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </g>

        <!-- Flux Highlights (Glowing lines where E intersects Surface) -->
        <g clip-path="url(#surface-clip)" class="flux-highlights">
            <g filter="url(#glow)">
                <line x1="300" y1="150" x2="500" y2="150" stroke="#FFD166" stroke-width="6" stroke-linecap="round" />
                <line x1="300" y1="200" x2="500" y2="200" stroke="#FFD166" stroke-width="6" stroke-linecap="round" />
                <line x1="300" y1="250" x2="500" y2="250" stroke="#FFD166" stroke-width="6" stroke-linecap="round" />
                <line x1="300" y1="300" x2="500" y2="300" stroke="#FFD166" stroke-width="6" stroke-linecap="round" />
                <line x1="300" y1="350" x2="500" y2="350" stroke="#FFD166" stroke-width="6" stroke-linecap="round" />
            </g>
        </g>

        <!-- Dynamic Formula Display -->
        <g font-family="Roboto Mono" font-size="24" font-weight="700">
            <!-- Maximum Flux State -->
            <text x="400" y="460" text-anchor="middle" class="formula-max" fill="#212529">
                Φ<tspan font-size="14" dy="5">E</tspan><tspan dy="-5"> = </tspan><tspan fill="#F77F00">E</tspan> <tspan fill="#4361EE">A</tspan> <tspan fill="#06D6A0" font-family="Inter" font-size="20" font-weight="600">(Maximum Flux)</tspan>
            </text>
            
            <!-- Intermediate Flux State -->
            <text x="400" y="460" text-anchor="middle" class="formula-mid" fill="#212529">
                Φ<tspan font-size="14" dy="5">E</tspan><tspan dy="-5"> = </tspan><tspan fill="#F77F00">E</tspan> <tspan fill="#4361EE">A</tspan> cos(θ)
            </text>
            
            <!-- Zero Flux State -->
            <text x="400" y="460" text-anchor="middle" class="formula-min" fill="#212529">
                Φ<tspan font-size="14" dy="5">E</tspan><tspan dy="-5"> = </tspan>0 <tspan fill="#FF3366" font-family="Inter" font-size="20" font-weight="600">(Zero Flux)</tspan>
            </text>
        </g>

        <!-- Interaction Hint -->
        <text x="780" y="485" font-family="Inter" font-size="12" fill="#adb5bd" text-anchor="end">Hover to pause animation</text>
    </svg>
</div>

</body>
</html>
