<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laws of Reflection</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

    body {
        margin: 0;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Inter', sans-serif;
    }

    .container {
        position: relative;
        width: 100%;
        max-width: 800px;
        background: #ffffff;
        box-shadow: 0 12px 32px rgba(0,0,0,0.08);
        border-radius: 12px;
        overflow: hidden;
    }

    .play-btn {
        position: absolute;
        top: 24px;
        right: 24px;
        background: #4361EE;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 14px;
        transition: background 0.2s, transform 0.1s;
        z-index: 10;
        box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
    }

    .play-btn:hover {
        background: #364fc7;
    }

    .play-btn:active {
        transform: scale(0.96);
    }

    svg {
        display: block;
        width: 100%;
        height: auto;
    }

    text {
        user-select: none;
    }

    .math {
        font-family: 'Roboto Mono', monospace;
    }

    /* --- Animations --- */
    
    /* Global paused state */
    .paused .anim {
        animation-play-state: paused !important;
    }

    @keyframes drawIncident {
        0% { stroke-dashoffset: 250; opacity: 0; }
        1% { opacity: 1; }
        25% { stroke-dashoffset: 0; opacity: 1; }
        91.66% { stroke-dashoffset: 0; opacity: 1; }
        98%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes moveIncidentArrow {
        0% { transform: translateX(250px); opacity: 0; }
        1% { opacity: 1; }
        25% { transform: translateX(0px); opacity: 1; }
        91.66% { transform: translateX(0px); opacity: 1; }
        98%, 100% { transform: translateX(0px); opacity: 0; }
    }

    @keyframes drawNormal {
        0%, 25% { width: 0; opacity: 0; }
        26% { opacity: 1; }
        33.33% { width: 250px; opacity: 1; }
        91.66% { width: 250px; opacity: 1; }
        98%, 100% { width: 250px; opacity: 0; }
    }

    @keyframes drawReflected {
        0%, 33.33% { stroke-dashoffset: 250; opacity: 0; }
        34% { opacity: 1; }
        58.33% { stroke-dashoffset: 0; opacity: 1; }
        91.66% { stroke-dashoffset: 0; opacity: 1; }
        98%, 100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes moveReflectedArrow {
        0%, 33.33% { transform: translateX(0px); opacity: 0; }
        34% { opacity: 1; }
        58.33% { transform: translateX(250px); opacity: 1; }
        91.66% { transform: translateX(250px); opacity: 1; }
        98%, 100% { transform: translateX(250px); opacity: 0; }
    }

    @keyframes drawArc {
        0%, 58.33% { stroke-dasharray: 0 377; opacity: 0; }
        59% { opacity: 1; }
        75% { stroke-dasharray: 47.1 377; opacity: 1; }
        80% { stroke-dasharray: 62.8 377; opacity: 1; }
        86% { stroke-dasharray: 31.4 377; opacity: 1; }
        91.66% { stroke-dasharray: 47.1 377; opacity: 1; }
        98%, 100% { stroke-dasharray: 47.1 377; opacity: 0; }
    }

    @keyframes fadeLabels {
        0%, 58.33% { opacity: 0; }
        75%, 91.66% { opacity: 1; }
        98%, 100% { opacity: 0; }
    }

    @keyframes fadeIncidentLabel {
        0% { opacity: 0; }
        25%, 91.66% { opacity: 1; }
        98%, 100% { opacity: 0; }
    }

    @keyframes fadeReflectedLabel {
        0%, 33.33% { opacity: 0; }
        58.33%, 91.66% { opacity: 1; }
        98%, 100% { opacity: 0; }
    }

    @keyframes moveThetaI {
        0%, 58.33% { transform: translate(367px, 271px); opacity: 0; }
        75% { transform: translate(367px, 271px); opacity: 1; }
        80% { transform: translate(357px, 276px); opacity: 1; }
        86% { transform: translate(378px, 268px); opacity: 1; }
        91.66% { transform: translate(367px, 271px); opacity: 1; }
        98%, 100% { transform: translate(367px, 271px); opacity: 0; }
    }

    @keyframes moveThetaR {
        0%, 58.33% { transform: translate(432px, 271px); opacity: 0; }
        75% { transform: translate(432px, 271px); opacity: 1; }
        80% { transform: translate(442px, 276px); opacity: 1; }
        86% { transform: translate(422px, 268px); opacity: 1; }
        91.66% { transform: translate(432px, 271px); opacity: 1; }
        98%, 100% { transform: translate(432px, 271px); opacity: 0; }
    }

    @keyframes rotateIncident {
        0%, 75% { transform: rotate(-45deg); animation-timing-function: ease-in-out; }
        80% { transform: rotate(-60deg); animation-timing-function: ease-in-out; }
        86% { transform: rotate(-30deg); animation-timing-function: ease-in-out; }
        91.66%, 100% { transform: rotate(-45deg); }
    }

    @keyframes rotateReflected {
        0%, 75% { transform: rotate(45deg); animation-timing-function: ease-in-out; }
        80% { transform: rotate(60deg); animation-timing-function: ease-in-out; }
        86% { transform: rotate(30deg); animation-timing-function: ease-in-out; }
        91.66%, 100% { transform: rotate(45deg); }
    }

    /* Apply animations */
    .incident-ray-line { stroke-dasharray: 250; animation: drawIncident 12s infinite linear; }
    .incident-arrow { animation: moveIncidentArrow 12s infinite linear; }
    .normal-clip-rect { animation: drawNormal 12s infinite linear; }
    .reflected-ray-line { stroke-dasharray: 250; animation: drawReflected 12s infinite linear; }
    .reflected-arrow { animation: moveReflectedArrow 12s infinite linear; }
    .arc-circle { animation: drawArc 12s infinite linear; }
    
    .incident-group { animation: rotateIncident 12s infinite linear; }
    .reflected-group { animation: rotateReflected 12s infinite linear; }
    
    .label-incident { animation: fadeIncidentLabel 12s infinite linear; }
    .label-reflected { animation: fadeReflectedLabel 12s infinite linear; }
    .label-dynamic { animation: fadeLabels 12s infinite linear; }
    
    .theta-i { animation: moveThetaI 12s infinite linear; }
    .theta-r { animation: moveThetaR 12s infinite linear; }

</style>
</head>
<body>

<div class="container">
    <button class="play-btn" id="playBtn" onclick="togglePlay()">Pause Animation</button>
    
    <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Laws of Reflection Animation</title>
        <desc id="svgDesc">An animated physics diagram demonstrating the laws of reflection. An incident ray strikes a mirror and reflects such that the angle of incidence equals the angle of reflection.</desc>

        <defs>
            <!-- Mirror Gradient -->
            <linearGradient id="mirrorGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="40%" stop-color="#e9ecef"/>
                <stop offset="100%" stop-color="#ced4da"/>
            </linearGradient>

            <!-- Hatching Pattern for non-reflective side -->
            <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
                <line x1="0" y1="0" x2="0" y2="8" stroke="#adb5bd" stroke-width="1.5" />
            </pattern>

            <!-- Clip Path for animating the dashed Normal line -->
            <clipPath id="normalClip">
                <rect x="0" y="-10" height="20" class="anim normal-clip-rect" />
            </clipPath>
        </defs>

        <!-- TITLE -->
        <text x="30" y="45" font-size="26" font-weight="700" fill="#212529">Laws of Reflection</text>
        <text x="30" y="70" font-size="15" font-weight="400" fill="#495057">Animated demonstration of light reflecting off a plane mirror.</text>

        <!-- LEGEND -->
        <g transform="translate(620, 70)">
            <rect x="0" y="0" width="150" height="85" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5"/>
            <line x1="15" y1="20" x2="35" y2="20" stroke="#06D6A0" stroke-width="3"/>
            <text x="45" y="24" font-size="12" font-weight="600" fill="#212529">Incident Ray</text>
            
            <line x1="15" y1="42" x2="35" y2="42" stroke="#FF3366" stroke-width="3"/>
            <text x="45" y="46" font-size="12" font-weight="600" fill="#212529">Reflected Ray</text>
            
            <line x1="15" y1="64" x2="35" y2="64" stroke="#4361EE" stroke-width="2" stroke-dasharray="4 2"/>
            <text x="45" y="68" font-size="12" font-weight="600" fill="#212529">Normal</text>
        </g>

        <!-- STATIC LABELS -->
        <text x="180" y="150" font-size="15" font-weight="700" fill="#06D6A0" class="anim label-incident">Incident Ray</text>
        <text x="520" y="150" font-size="15" font-weight="700" fill="#FF3366" class="anim label-reflected">Reflected Ray</text>
        
        <!-- DYNAMIC EQUATION TOP -->
        <text x="400" y="120" text-anchor="middle" font-size="24" font-weight="700" fill="#7209B7" class="anim label-dynamic math">∠i = ∠r</text>

        <!-- MIRROR -->
        <g transform="translate(0, 0)">
            <!-- Hatching (bottom) -->
            <rect x="150" y="355" width="500" height="12" fill="url(#hatch)" />
            <!-- Glass surface (top) -->
            <rect x="150" y="350" width="500" height="5" fill="url(#mirrorGrad)" stroke="#868e96" stroke-width="1" />
        </g>

        <!-- DYNAMIC PHYSICS ELEMENTS -->
        <!-- Center of coordinate system moved to Point of Incidence P (400, 350) -->
        <!-- Rotated -90deg so +x axis points UP, +y axis points RIGHT -->
        <g transform="translate(400, 350) rotate(-90)">
            
            <!-- NORMAL LINE -->
            <g class="normal-group">
                <line x1="0" y1="0" x2="250" y2="0" stroke="#4361EE" stroke-width="2" stroke-dasharray="8 6" clip-path="url(#normalClip)" />
                <!-- Reflected Arc (Normal to Reflected Ray) -->
                <circle cx="0" cy="0" r="60" fill="none" stroke="#212529" stroke-width="1.5" class="anim arc-circle" />
            </g>

            <!-- INCIDENT RAY -->
            <g class="anim incident-group">
                <line x1="250" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="3" class="anim incident-ray-line" />
                <polygon points="12,-6 0,0 12,6" fill="#06D6A0" class="anim incident-arrow" />
                <!-- Incident Arc (Incident Ray to Normal) -->
                <circle cx="0" cy="0" r="60" fill="none" stroke="#212529" stroke-width="1.5" class="anim arc-circle" />
            </g>

            <!-- REFLECTED RAY -->
            <g class="anim reflected-group">
                <line x1="0" y1="0" x2="250" y2="0" stroke="#FF3366" stroke-width="3" class="anim reflected-ray-line" />
                <polygon points="-12,-6 0,0 -12,6" fill="#FF3366" class="anim reflected-arrow" />
            </g>

        </g>

        <!-- POINT OF INCIDENCE -->
        <circle cx="400" cy="350" r="4.5" fill="#212529" />
        <text x="400" y="380" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">P (Point of Incidence)</text>

        <!-- ANGLE LABELS (Animated positions to follow arcs) -->
        <text class="anim theta-i math" font-size="18" font-weight="700" fill="#06D6A0">θ<tspan dy="4" font-size="13">i</tspan></text>
        <text class="anim theta-r math" font-size="18" font-weight="700" fill="#FF3366">θ<tspan dy="4" font-size="13">r</tspan></text>

        <!-- FORMULA BOX -->
        <rect x="100" y="420" width="600" height="90" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" />
        <text x="125" y="450" font-size="15" font-weight="700" fill="#212529">Laws of Reflection:</text>
        <text x="125" y="475" font-size="14" font-weight="400" fill="#495057">1. The incident ray, reflected ray, and normal lie in the same plane.</text>
        <text x="125" y="495" font-size="14" font-weight="400" fill="#495057">2. The angle of incidence equals the angle of reflection (<tspan class="math" font-weight="700" fill="#7209B7">∠i = ∠r</tspan>).</text>

    </svg>
</div>

<script>
    function togglePlay() {
        const btn = document.getElementById('playBtn');
        const isPaused = document.body.classList.toggle('paused');
        btn.textContent = isPaused ? 'Play Animation' : 'Pause Animation';
    }
</script>

</body>
</html>
