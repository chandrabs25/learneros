<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magnetic Dipole Moment Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            background-color: #f8f9fa;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
            max-width: 900px;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .math {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
        
        .label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }

        /* Animations */
        @keyframes orbit {
            0% { offset-distance: 0%; }
            100% { offset-distance: 100%; }
        }

        #electron-group {
            offset-path: path('M -150,0 A 150,75 0 1,0 150,0 A 150,75 0 1,0 -150,0');
            offset-rotate: 0deg;
            animation: orbit 3s linear infinite;
        }

        @keyframes m-grow {
            0%, 5% { transform: scaleY(0); opacity: 0; }
            15%, 90% { transform: scaleY(1); opacity: 1; }
            95%, 100% { transform: scaleY(0); opacity: 0; }
        }

        #m-vector-group {
            transform-origin: 0 0;
            animation: m-grow 10s ease-out infinite;
        }

        @keyframes i-pulse {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .pulse-current {
            animation: i-pulse 2s ease-in-out infinite;
        }

        @keyframes b-fade {
            0%, 25% { opacity: 0; }
            35%, 90% { opacity: 0.4; }
            95%, 100% { opacity: 0; }
        }

        .fade-in-b {
            animation: b-fade 10s ease-in-out infinite;
        }

        @keyframes assembly-tilt {
            0%, 30% { transform: translate(400px, 250px) rotate(0deg); }
            40%, 60% { transform: translate(400px, 250px) rotate(45deg); }
            65% { transform: translate(400px, 250px) rotate(20deg); }
            75% { transform: translate(400px, 250px) rotate(40deg); }
            85% { transform: translate(400px, 250px) rotate(25deg); }
            95%, 100% { transform: translate(400px, 250px) rotate(0deg); }
        }

        #dipole-assembly {
            animation: assembly-tilt 10s ease-in-out infinite;
        }

        @keyframes theta-fade {
            0%, 35% { opacity: 0; }
            40%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .fade-theta {
            animation: theta-fade 10s ease-in-out infinite;
        }

        @keyframes tau-fade {
            0%, 60% { opacity: 0; transform: scale(0.9); }
            65%, 85% { opacity: 1; transform: scale(1.05); }
            90%, 100% { opacity: 0; transform: scale(0.9); }
        }

        .fade-tau {
            animation: tau-fade 10s ease-in-out infinite;
            transform-origin: 0 0;
        }

        @keyframes u-fade {
            0%, 65% { opacity: 0; transform: translateY(10px); }
            70%, 90% { opacity: 1; transform: translateY(0); }
            95%, 100% { opacity: 0; transform: translateY(10px); }
        }

        .fade-u {
            animation: u-fade 10s ease-in-out infinite;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <title>Magnetic Dipole Moment Animation</title>
        <desc>An animation showing a circulating electron creating a magnetic dipole moment, which then interacts with an external magnetic field experiencing torque.</desc>

        <defs>
            <!-- Arrowhead for Dipole Moment (m) -->
            <marker id="arrow-m" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <!-- Arrowhead for B-Field -->
            <marker id="arrow-b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#7209B7" />
            </marker>
            <!-- Arrowhead for Current (I) -->
            <marker id="arrow-i" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <!-- Arrowhead for Torque (tau) -->
            <marker id="arrow-tau" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#00B4D8" />
            </marker>
            <!-- Glow Filter for Vectors -->
            <filter id="glow-m" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF3366" flood-opacity="0.4"/>
            </filter>
            <filter id="glow-loop" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
            </filter>
        </defs>

        <!-- Static UI Elements -->
        <text x="30" y="40" class="label" font-size="22" fill="#212529">Magnetic Dipole Moment (m⃗)</text>
        
        <!-- Legend / RHR Hint -->
        <g transform="translate(30, 60)">
            <rect x="0" y="0" width="310" height="95" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
            <text x="15" y="22" class="label" font-size="13" fill="#495057">
                <tspan font-weight="700" fill="#212529">Right-Hand Rule (RHR):</tspan>
                <tspan x="15" dy="20">1. Curl fingers with current (</tspan>
                <tspan fill="#F77F00" font-weight="700">I</tspan>
                <tspan>)</tspan>
                <tspan x="15" dy="20">2. Thumb points to Dipole Moment (</tspan>
                <tspan fill="#FF3366" font-weight="700" class="math">m⃗</tspan>
                <tspan>)</tspan>
                <tspan x="15" dy="20">Note: Electron (</tspan>
                <tspan fill="#4361EE" font-weight="700" class="math">e⁻</tspan>
                <tspan>) moves opposite to I.</tspan>
            </text>
        </g>

        <!-- External B-Field (Fades in) -->
        <g id="b-field" class="fade-in-b">
            <line x1="150" y1="420" x2="150" y2="80" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-b)" />
            <line x1="275" y1="420" x2="275" y2="80" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-b)" />
            <line x1="400" y1="420" x2="400" y2="80" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-b)" />
            <line x1="525" y1="420" x2="525" y2="80" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-b)" />
            <line x1="650" y1="420" x2="650" y2="80" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-b)" />
            <text x="660" y="100" fill="#7209B7" class="math" font-size="22">B⃗</text>
        </g>

        <!-- Interactions (Theta & Torque) - Fixed to center, appears when tilted -->
        <g id="interactions" transform="translate(400, 250)">
            <!-- Theta Arc -->
            <path d="M 0,-110 A 110 110 0 0 1 77.8,-77.8" fill="none" stroke="#495057" stroke-width="2" stroke-dasharray="4 4" class="fade-theta" />
            <text x="35" y="-120" fill="#495057" class="math" font-style="italic" font-size="18" class="fade-theta">θ</text>

            <!-- Torque Arrow (CCW rotation) -->
            <g class="fade-tau">
                <path d="M 90,-90 A 120 120 0 0 0 20,-120" fill="none" stroke="#00B4D8" stroke-width="3" marker-end="url(#arrow-tau)" />
                <text x="65" y="-135" fill="#00B4D8" class="math" font-size="20">τ⃗</text>
            </g>
        </g>

        <!-- Main Dipole Assembly (Rotates/Tilts) -->
        <g id="dipole-assembly">
            <!-- The Wire Loop -->
            <path id="loop-path" d="M -150,0 A 150,75 0 1,0 150,0 A 150,75 0 1,0 -150,0" fill="none" stroke="#495057" stroke-width="3" filter="url(#glow-loop)" />

            <!-- Current Arrows (CCW) -->
            <g class="pulse-current">
                <!-- Top -->
                <path d="M 15,-75 L -5,-75" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-i)" />
                <text x="-25" y="-85" fill="#F77F00" class="math" font-size="18">I</text>
                <!-- Bottom -->
                <path d="M -15,75 L 5,75" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-i)" />
                <!-- Left -->
                <path d="M -150,-15 L -150,5" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-i)" />
                <!-- Right -->
                <path d="M 150,15 L 150,-5" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-i)" />
            </g>

            <!-- Orbiting Electron (CW) -->
            <g id="electron-group">
                <circle r="7" fill="#4361EE" />
                <text x="12" y="-12" fill="#4361EE" class="math" font-size="16" text-shadow="1px 1px 2px #fff, -1px -1px 2px #fff">e⁻</text>
            </g>

            <!-- Dipole Moment Vector (m) -->
            <g id="m-vector-group">
                <line x1="0" y1="0" x2="0" y2="-160" stroke="#FF3366" stroke-width="5" marker-end="url(#arrow-m)" filter="url(#glow-m)" />
                <text x="15" y="-165" fill="#FF3366" class="math" font-size="20">m⃗ = I A⃗</text>
            </g>
            
            <!-- Center Dot -->
            <circle cx="0" cy="0" r="4" fill="#495057" />
        </g>

        <!-- Formulas Overlay (Bottom) -->
        <g transform="translate(400, 470)" text-anchor="middle" class="math" font-size="18">
            <text x="-220" y="0" fill="#00B4D8" class="fade-tau">τ⃗ = m⃗ × B⃗</text>
            <text x="0" y="0" fill="#FF3366">m = N I A</text>
            <text x="220" y="0" fill="#06D6A0" class="fade-u">U = -m⃗ · B⃗</text>
        </g>

    </svg>
</div>

</body>
</html>
