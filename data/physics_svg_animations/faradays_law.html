<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faraday's Law: AC Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            overflow: hidden;
            padding: 20px;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            fill: #212529;
            text-anchor: middle;
        }
        .subtitle {
            font-size: 14px;
            fill: #6c757d;
            text-anchor: middle;
        }
        .axis-label {
            font-size: 13px;
            fill: #495057;
            font-weight: 600;
        }
        .legend-text {
            font-size: 12px;
            fill: #343a40;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for Gradients and Markers -->
        <defs>
            <!-- Magnet Gradients -->
            <linearGradient id="gradN" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#2b41b3" />
                <stop offset="100%" stop-color="#4361EE" />
            </linearGradient>
            <linearGradient id="gradS" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF3366" />
                <stop offset="100%" stop-color="#cc2952" />
            </linearGradient>

            <!-- Arrowhead Markers -->
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#7209B7" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#212529" />
            </marker>
        </defs>

        <!-- Title and Formula -->
        <text x="400" y="40" class="title">Faraday's Law: AC Generator</text>
        <text x="400" y="60" class="subtitle">Mechanical rotation in a magnetic field induces an alternating electromotive force (EMF)</text>
        
        <text x="400" y="470" text-anchor="middle" class="math" font-size="20" font-weight="700" fill="#212529">
            ε = -N · dΦ<tspan baseline-shift="sub" font-size="14">B</tspan> / dt
        </text>

        <!-- ================= LEFT SIDE: 3D GENERATOR ================= -->
        
        <!-- Magnetic Field Lines (Background) -->
        <g opacity="0.25" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)">
            <line x1="70" y1="160" x2="360" y2="160"/>
            <line x1="70" y1="205" x2="360" y2="205"/>
            <line x1="70" y1="250" x2="360" y2="250"/>
            <line x1="70" y1="295" x2="360" y2="295"/>
            <line x1="70" y1="340" x2="360" y2="340"/>
        </g>

        <!-- Magnets -->
        <g>
            <!-- North Pole -->
            <path d="M 20 120 L 70 135 L 70 365 L 20 380 Z" fill="url(#gradN)"/>
            <text x="40" y="258" fill="white" font-size="28" font-weight="bold" text-anchor="middle">N</text>
            <!-- South Pole -->
            <path d="M 430 120 L 380 135 L 380 365 L 430 380 Z" fill="url(#gradS)"/>
            <text x="410" y="258" fill="white" font-size="28" font-weight="bold" text-anchor="middle">S</text>
        </g>

        <!-- Rotation Axis & Omega -->
        <line x1="225" y1="90" x2="225" y2="410" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8,6"/>
        <path d="M 205 100 A 20 10 0 1 1 245 100" fill="none" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)"/>
        <text x="255" y="105" font-family="Roboto Mono" font-size="18" font-style="italic" font-weight="bold" fill="#212529">ω</text>

        <!-- Dynamic Coil Assembly -->
        <g id="generator-group">
            <!-- Coil -->
            <polygon id="coil" points="" fill="rgba(33, 37, 41, 0.05)" stroke="#212529" stroke-width="3" stroke-linejoin="round"/>
            
            <!-- Area Vector -->
            <g id="area-vec-group">
                <line id="area-vec" x1="225" y1="250" x2="225" y2="250" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)"/>
                <text id="area-label" x="0" y="0" fill="#F77F00" class="math" font-weight="bold" font-size="16">A</text>
            </g>

            <!-- Velocity Vectors -->
            <g id="v-vec-group">
                <line id="v1" x1="0" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
                <line id="v2" x1="0" y1="0" x2="0" y2="0" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
            </g>
        </g>

        <!-- Magnetic Field Label -->
        <text x="130" y="150" fill="#7209B7" class="math" font-weight="bold" font-size="16">B</text>

        <!-- ================= RIGHT SIDE: GRAPH ================= -->
        
        <g id="graph-group" transform="translate(0, 0)">
            <!-- Axes -->
            <line x1="490" y1="250" x2="770" y2="250" stroke="#ced4da" stroke-width="2"/>
            <line x1="490" y1="370" x2="490" y2="130" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)"/>
            <line x1="490" y1="250" x2="780" y2="250" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)"/>
            
            <!-- Axis Labels -->
            <text x="770" y="270" text-anchor="end" class="axis-label">Time (t)</text>
            <text x="480" y="135" text-anchor="end" class="axis-label">Induced EMF (ε)</text>
            
            <!-- Static Sine Wave (Background) -->
            <path id="sine-wave" d="" fill="none" stroke="#FF3366" stroke-width="2.5" opacity="0.2"/>
            
            <!-- Active Sine Wave (Progress) -->
            <path id="sine-wave-active" d="" fill="none" stroke="#FF3366" stroke-width="3.5" stroke-linecap="round"/>
            
            <!-- Tracer Dot & Guidelines -->
            <line id="graph-line-x" x1="490" y1="250" x2="490" y2="250" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
            <line id="graph-line-y" x1="490" y1="250" x2="490" y2="250" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>
            <circle id="graph-dot" cx="490" cy="250" r="6" fill="#FF3366"/>
        </g>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(610, 20)">
            <rect x="0" y="0" width="170" height="100" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" shadow="sm"/>
            
            <line x1="12" y1="20" x2="32" y2="20" stroke="#7209B7" stroke-width="3"/>
            <text x="42" y="24" class="legend-text">Magnetic Field (B)</text>

            <line x1="12" y1="42" x2="32" y2="42" stroke="#F77F00" stroke-width="3"/>
            <text x="42" y="46" class="legend-text">Area Vector (A)</text>

            <line x1="12" y1="64" x2="32" y2="64" stroke="#06D6A0" stroke-width="3"/>
            <text x="42" y="68" class="legend-text">Velocity (v)</text>

            <line x1="12" y1="86" x2="32" y2="86" stroke="#FF3366" stroke-width="3"/>
            <text x="42" y="90" class="legend-text">Induced EMF (ε)</text>
        </g>

    </svg>
</div>

<script>
    // Physics and Geometry Constants
    const W = 130; // Coil Width
    const H = 170; // Coil Height
    const cx = 225; // Center X of generator
    const cy = 250; // Center Y of generator
    const phi = 15 * Math.PI / 180; // Isometric tilt angle (15 degrees)
    const L_A = 90; // Length of Area Vector
    const L_v = 55; // Length of Velocity Vector
    const period = 6000; // Animation loop duration in ms

    // DOM Elements
    const coil = document.getElementById('coil');
    const areaVec = document.getElementById('area-vec');
    const areaLabel = document.getElementById('area-label');
    const v1 = document.getElementById('v1');
    const v2 = document.getElementById('v2');
    const dot = document.getElementById('graph-dot');
    const lineX = document.getElementById('graph-line-x');
    const lineY = document.getElementById('graph-line-y');
    const activeWave = document.getElementById('sine-wave-active');
    const genGroup = document.getElementById('generator-group');
    const areaGroup = document.getElementById('area-vec-group');

    // Graph Constants
    const graphStartX = 490;
    const graphWidth = 270;
    const graphCenterY = 250;
    const graphAmplitude = 90;

    // Pre-calculate and draw the static background sine wave
    let staticPath = `M ${graphStartX} ${graphCenterY} `;
    for(let i = 0; i <= 100; i++) {
        let th = (i / 100) * 2 * Math.PI;
        let px = graphStartX + (th / (2 * Math.PI)) * graphWidth;
        let py = graphCenterY - graphAmplitude * Math.sin(th);
        staticPath += `L ${px} ${py} `;
    }
    document.getElementById('sine-wave').setAttribute('d', staticPath);

    // Main Animation Loop
    function animate(time) {
        // Normalized time t from 0 to 1
        let t = (time % period) / period;
        let theta = t * 2 * Math.PI;

        // 1. Calculate 3D to 2D Projection for the Coil
        // Coil corners in local 3D space, rotated by theta around Y, then tilted by phi around X
        const corners = [
            {y: -H/2, z: W/2}, 
            {y: -H/2, z: -W/2},
            {y: H/2, z: -W/2}, 
            {y: H/2, z: W/2}
        ];
        
        let pts = corners.map(p => {
            let x = cx + p.z * Math.sin(theta);
            let y = cy + p.y * Math.cos(phi) - p.z * Math.cos(theta) * Math.sin(phi);
            return `${x},${y}`;
        }).join(" ");
        coil.setAttribute('points', pts);

        // 2. Area Vector (A)
        // Normal to the coil surface
        let az = -L_A * Math.sin(theta);
        let ax2 = cx + L_A * Math.cos(theta);
        let ay2 = cy - az * Math.sin(phi);
        
        areaVec.setAttribute('x2', ax2);
        areaVec.setAttribute('y2', ay2);
        areaLabel.setAttribute('x', ax2 + 12);
        areaLabel.setAttribute('y', ay2 + 6);

        // Dynamic Z-sorting: Draw Area Vector behind or in front of coil based on Z-depth
        if (az > 0) {
            // Pointing towards viewer -> Draw AFTER coil
            if (areaGroup.previousElementSibling !== coil) {
                genGroup.insertBefore(coil, areaGroup);
            }
        } else {
            // Pointing away from viewer -> Draw BEFORE coil
            if (coil.previousElementSibling !== areaGroup) {
                genGroup.insertBefore(areaGroup, coil);
            }
        }

        // 3. Velocity Vectors (v)
        // Tangent to the circular path of the vertical wire segments
        let vx_dir = L_v * Math.cos(theta);
        let vy_dir = L_v * Math.sin(theta) * Math.sin(phi);

        // Right wire segment
        let v1x = cx + (W/2) * Math.sin(theta);
        let v1y = cy - (W/2) * Math.cos(theta) * Math.sin(phi);
        v1.setAttribute('x1', v1x); 
        v1.setAttribute('y1', v1y);
        v1.setAttribute('x2', v1x + vx_dir); 
        v1.setAttribute('y2', v1y + vy_dir);

        // Left wire segment (opposite velocity)
        let v2x = cx - (W/2) * Math.sin(theta);
        let v2y = cy + (W/2) * Math.cos(theta) * Math.sin(phi);
        v2.setAttribute('x1', v2x); 
        v2.setAttribute('y1', v2y);
        v2.setAttribute('x2', v2x - vx_dir); 
        v2.setAttribute('y2', v2y - vy_dir);

        // 4. Graph Updates (EMF)
        // EMF is proportional to sin(theta)
        let gx = graphStartX + t * graphWidth;
        let gy = graphCenterY - graphAmplitude * Math.sin(theta);
        
        dot.setAttribute('cx', gx);
        dot.setAttribute('cy', gy);
        
        // Vertical guideline to X-axis
        lineX.setAttribute('x1', gx); 
        lineX.setAttribute('x2', gx);
        lineX.setAttribute('y1', gy); 
        lineX.setAttribute('y2', graphCenterY);

        // Horizontal guideline to Y-axis
        lineY.setAttribute('x1', graphStartX); 
        lineY.setAttribute('x2', gx);
        lineY.setAttribute('y1', gy); 
        lineY.setAttribute('y2', gy);

        // Draw the active portion of the sine wave up to current time
        let activePath = `M ${graphStartX} ${graphCenterY} `;
        let steps = Math.floor(t * 100);
        for(let i = 0; i <= steps; i++) {
            let th = (i / 100) * 2 * Math.PI;
            let px = graphStartX + (th / (2 * Math.PI)) * graphWidth;
            let py = graphCenterY - graphAmplitude * Math.sin(th);
            activePath += `L ${px} ${py} `;
        }
        // Ensure the path connects exactly to the dot
        activePath += `L ${gx} ${gy}`;
        activeWave.setAttribute('d', activePath);

        requestAnimationFrame(animate);
    }

    // Start Animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
