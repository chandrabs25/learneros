<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mechanics of Density: From Particles to Pressure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .diagram-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Hover to Pause */
        svg:hover * {
            animation-play-state: paused !important;
        }

        /* Typography */
        .title { font-weight: 700; font-size: 22px; fill: #212529; }
        .subtitle { font-weight: 400; font-size: 14px; fill: #6c757d; }
        .math { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .label { font-size: 12px; fill: #495057; }
        .note { font-size: 11px; fill: #adb5bd; font-style: italic; }

        /* Animations */
        .probe-group {
            animation: probe-move 15s ease-in-out infinite;
        }

        .pressure-line {
            transform-origin: top center;
            animation: arrow-line 15s ease-in-out infinite;
        }

        .pressure-head {
            animation: arrow-head 15s ease-in-out infinite;
        }

        .mass-pulse {
            transform-origin: 750px 130px;
            animation: pulse-mass 15s ease-in-out infinite;
        }

        /* Particle Fade Groups */
        .fade-g2 { animation: fade-g2 15s linear infinite; }
        .fade-g3 { animation: fade-g3 15s linear infinite; }
        .fade-g4 { animation: fade-g4 15s linear infinite; }
        .fade-g5 { animation: fade-g5 15s linear infinite; }

        /* Dynamic Text Fade Groups */
        .t1 { animation: text1 15s linear infinite; }
        .t2 { animation: text2 15s linear infinite; }
        .t3 { animation: text3 15s linear infinite; }
        .t4 { animation: text4 15s linear infinite; }
        .t5 { animation: text5 15s linear infinite; }

        /* Keyframes */
        @keyframes probe-move {
            0%, 100% { transform: translateY(0); }
            40%, 60% { transform: translateY(340px); }
        }

        @keyframes arrow-line {
            0%, 100% { transform: scaleY(1); }
            40%, 60% { transform: scaleY(4); }
        }

        @keyframes arrow-head {
            0%, 100% { transform: translateY(0); }
            40%, 60% { transform: translateY(60px); }
        }

        @keyframes pulse-mass {
            0%, 39%, 61%, 100% { fill: #212529; transform: scale(1); }
            40%, 60% { fill: #FF3366; transform: scale(1.3); }
        }

        /* Particle Opacity Keyframes */
        @keyframes fade-g2 {
            0%, 9%, 91%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }
        @keyframes fade-g3 {
            0%, 19%, 81%, 100% { opacity: 0; }
            20%, 80% { opacity: 1; }
        }
        @keyframes fade-g4 {
            0%, 29%, 71%, 100% { opacity: 0; }
            30%, 70% { opacity: 1; }
        }
        @keyframes fade-g5 {
            0%, 39%, 61%, 100% { opacity: 0; }
            40%, 60% { opacity: 1; }
        }

        /* Text Opacity Keyframes */
        @keyframes text1 {
            0%, 9%, 91%, 100% { opacity: 1; }
            10%, 90% { opacity: 0; }
        }
        @keyframes text2 {
            0%, 9%, 20%, 100% { opacity: 0; }
            10%, 19%, 81%, 90% { opacity: 1; }
        }
        @keyframes text3 {
            0%, 19%, 30%, 100% { opacity: 0; }
            20%, 29%, 71%, 80% { opacity: 1; }
        }
        @keyframes text4 {
            0%, 29%, 40%, 100% { opacity: 0; }
            30%, 39%, 61%, 70% { opacity: 1; }
        }
        @keyframes text5 {
            0%, 39%, 61%, 100% { opacity: 0; }
            40%, 60% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 850 550" aria-label="Animated diagram showing how air density and pressure increase as altitude decreases.">
        <defs>
            <!-- Particle Clusters for the Density Column -->
            <g id="c-sparse" fill="#4361EE">
                <circle cx="10" cy="10" r="2.5"/><circle cx="40" cy="30" r="2.5"/>
                <circle cx="80" cy="15" r="2.5"/><circle cx="110" cy="35" r="2.5"/>
                <circle cx="140" cy="20" r="2.5"/>
            </g>
            <g id="c-med" fill="#4361EE">
                <use href="#c-sparse"/>
                <circle cx="20" cy="25" r="2.5"/><circle cx="30" cy="5" r="2.5"/>
                <circle cx="50" cy="20" r="2.5"/><circle cx="60" cy="35" r="2.5"/>
                <circle cx="70" cy="5" r="2.5"/><circle cx="90" cy="25" r="2.5"/>
                <circle cx="100" cy="10" r="2.5"/><circle cx="120" cy="25" r="2.5"/>
                <circle cx="130" cy="5" r="2.5"/><circle cx="145" cy="35" r="2.5"/>
            </g>
            <g id="c-dense" fill="#4361EE">
                <use href="#c-med"/>
                <circle cx="5" cy="30" r="2.5"/><circle cx="15" cy="15" r="2.5"/>
                <circle cx="25" cy="35" r="2.5"/><circle cx="35" cy="15" r="2.5"/>
                <circle cx="45" cy="5" r="2.5"/><circle cx="55" cy="25" r="2.5"/>
                <circle cx="65" cy="15" r="2.5"/><circle cx="75" cy="35" r="2.5"/>
                <circle cx="85" cy="10" r="2.5"/><circle cx="95" cy="30" r="2.5"/>
                <circle cx="105" cy="20" r="2.5"/><circle cx="115" cy="5" r="2.5"/>
                <circle cx="125" cy="35" r="2.5"/><circle cx="135" cy="15" r="2.5"/>
                <circle cx="148" cy="10" r="2.5"/>
            </g>
        </defs>

        <!-- Header -->
        <text x="425" y="35" text-anchor="middle" class="title">The Mechanics of Density & Atmospheric Pressure</text>
        <text x="425" y="55" text-anchor="middle" class="subtitle">Hover over the diagram to pause the animation</text>

        <!-- Background Gravity Field Lines -->
        <g stroke="#00B4D8" stroke-width="3" opacity="0.15" fill="none">
            <path d="M 270,100 L 270,450 M 260,440 L 270,450 L 280,440"/>
            <path d="M 350,100 L 350,450 M 340,440 L 350,450 L 360,440"/>
            <text x="310" y="280" class="math" font-size="28" fill="#00B4D8" stroke="none" opacity="0.5">g</text>
        </g>

        <!-- ========================================== -->
        <!-- LEFT PANEL: MACROSCOPIC COLUMN             -->
        <!-- ========================================== -->
        
        <!-- Depth Axis (h) -->
        <line x1="30" y1="70" x2="30" y2="450" stroke="#495057" stroke-width="2"/>
        <polygon points="25,440 35,440 30,450" fill="#495057"/>
        <text x="20" y="260" transform="rotate(-90, 20, 260)" text-anchor="middle" class="label">Depth (h)</text>

        <!-- Column Container -->
        <rect x="50" y="70" width="150" height="380" fill="#ffffff" stroke="#212529" stroke-width="2"/>

        <!-- Static Particle Gradient -->
        <use href="#c-sparse" x="50" y="70"/>
        <use href="#c-sparse" x="50" y="110"/>
        <use href="#c-sparse" x="50" y="150"/>
        <use href="#c-med" x="50" y="190"/>
        <use href="#c-med" x="50" y="230"/>
        <use href="#c-med" x="50" y="270"/>
        <use href="#c-dense" x="50" y="310"/>
        <use href="#c-dense" x="50" y="350"/>
        <use href="#c-dense" x="50" y="390"/>
        <use href="#c-dense" x="50" y="410"/>

        <!-- Moving Probe Group -->
        <g class="probe-group">
            <!-- Unit Volume Box -->
            <rect x="50" y="70" width="150" height="40" fill="rgba(114, 9, 183, 0.15)" stroke="#7209B7" stroke-width="2" stroke-dasharray="6,4"/>
            <text x="125" y="62" text-anchor="middle" class="math" font-size="12" fill="#7209B7">Unit Vol (V)</text>
            
            <!-- Pressure Vector Line -->
            <line x1="125" y1="110" x2="125" y2="130" stroke="#FF3366" stroke-width="4" class="pressure-line"/>
            
            <!-- Pressure Vector Arrowhead & Label -->
            <g class="pressure-head">
                <polygon points="118,130 132,130 125,142" fill="#FF3366"/>
                <text x="138" y="140" class="math" font-size="16" fill="#FF3366">P</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT PANEL: MICROSCOPIC CUBE              -->
        <!-- ========================================== -->

        <text x="510" y="325" text-anchor="middle" class="label">Magnified Unit Volume (V = 1 m³)</text>

        <!-- 3D Cube Back Face -->
        <rect x="480" y="100" width="140" height="140" fill="#ffffff" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4"/>
        
        <!-- 3D Cube Connecting Lines -->
        <line x1="440" y1="140" x2="480" y2="100" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4"/>
        <line x1="580" y1="140" x2="620" y2="100" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4"/>
        <line x1="440" y1="280" x2="480" y2="240" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4"/>
        <line x1="580" y1="280" x2="620" y2="240" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4,4"/>

        <!-- Particles Inside Cube -->
        <g fill="#4361EE">
            <!-- Group 1: Always Visible (2 particles) -->
            <circle cx="500" cy="180" r="6"/>
            <circle cx="560" cy="220" r="6"/>

            <!-- Group 2: Fades in at 10% (3 particles) -->
            <g class="fade-g2">
                <circle cx="480" cy="150" r="6"/>
                <circle cx="530" cy="250" r="6"/>
                <circle cx="580" cy="160" r="6"/>
            </g>

            <!-- Group 3: Fades in at 20% (4 particles) -->
            <g class="fade-g3">
                <circle cx="470" cy="200" r="6"/>
                <circle cx="510" cy="130" r="6"/>
                <circle cx="550" cy="260" r="6"/>
                <circle cx="590" cy="190" r="6"/>
            </g>

            <!-- Group 4: Fades in at 30% (5 particles) -->
            <g class="fade-g4">
                <circle cx="490" cy="240" r="6"/>
                <circle cx="520" cy="170" r="6"/>
                <circle cx="540" cy="210" r="6"/>
                <circle cx="570" cy="140" r="6"/>
                <circle cx="600" cy="230" r="6"/>
            </g>

            <!-- Group 5: Fades in at 40% (6 particles) -->
            <g class="fade-g5">
                <circle cx="465" cy="170" r="6"/>
                <circle cx="485" cy="220" r="6"/>
                <circle cx="505" cy="150" r="6"/>
                <circle cx="535" cy="190" r="6"/>
                <circle cx="565" cy="250" r="6"/>
                <circle cx="585" cy="130" r="6"/>
            </g>
        </g>

        <!-- 3D Cube Front Face -->
        <rect x="440" y="140" width="140" height="140" fill="rgba(67, 97, 238, 0.05)" stroke="#212529" stroke-width="2"/>

        <!-- ========================================== -->
        <!-- FORMULAS & DYNAMIC TEXT                    -->
        <!-- ========================================== -->

        <!-- Density Formula -->
        <text x="690" y="140" class="math" font-size="24" fill="#212529">ρ = </text>
        <text x="745" y="125" class="math mass-pulse" font-size="20">m</text>
        <line x1="740" y1="132" x2="765" y2="132" stroke="#212529" stroke-width="2"/>
        <text x="745" y="152" class="math" font-size="20" fill="#212529">V</text>

        <!-- Dynamic Mass Counter -->
        <text x="690" y="185" class="math t1" font-size="16" fill="#4361EE">Mass: 2 units</text>
        <text x="690" y="185" class="math t2" font-size="16" fill="#4361EE">Mass: 5 units</text>
        <text x="690" y="185" class="math t3" font-size="16" fill="#4361EE">Mass: 9 units</text>
        <text x="690" y="185" class="math t4" font-size="16" fill="#4361EE">Mass: 14 units</text>
        <text x="690" y="185" class="math t5" font-size="16" fill="#4361EE">Mass: 20 units</text>

        <!-- Pressure Formula -->
        <text x="690" y="230" class="math" font-size="18" fill="#FF3366">P = ρ·g·h</text>

        <!-- ========================================== -->
        <!-- LEGEND & NOTES                             -->
        <!-- ========================================== -->

        <!-- Legend Box -->
        <rect x="640" y="350" width="180" height="100" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6"/>
        
        <circle cx="660" cy="370" r="5" fill="#4361EE"/>
        <text x="675" y="374" class="label">Air Molecules (Mass)</text>
        
        <line x1="650" y1="395" x2="670" y2="395" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,2"/>
        <text x="675" y="399" class="label">Unit Volume Probe</text>
        
        <line x1="650" y1="420" x2="670" y2="420" stroke="#FF3366" stroke-width="3"/>
        <polygon points="665,416 673,420 665,424" fill="#FF3366"/>
        <text x="675" y="424" class="label">Pressure Vector (P)</text>

        <!-- Shell Theorem Note -->
        <text x="425" y="520" text-anchor="middle" class="note">Note: In Earth's interior, gravity (g) decreases, but in the atmosphere, density (ρ) is the primary driver of pressure changes.</text>

    </svg>
</div>

</body>
</html>
