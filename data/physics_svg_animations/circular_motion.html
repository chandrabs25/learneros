<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Circular Motion & Vector Dynamics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6c757d;
            --pos-color: #4361EE;
            --vel-color: #06D6A0;
            --force-color: #FF3366;
            --axis-color: #adb5bd;
            --panel-bg: #ffffff;
            --panel-border: #e9ecef;
            --arc-color: #fca311;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: var(--panel-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 700;
            color: var(--text-main);
        }

        p {
            margin: 0;
            color: var(--text-muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .svg-wrapper {
            position: relative;
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.02);
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 20px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            background: var(--text-main);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background: #343a40;
        }

        button:active {
            transform: scale(0.96);
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Uniform Circular Motion & Vector Dynamics</h1>
            <p>Observe how constant speed along a circular path results in continuously changing velocity direction, requiring a centripetal force. The projections on the axes demonstrate the link to Simple Harmonic Motion (SHM).</p>
        </header>

        <div class="svg-wrapper">
            <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Arrowhead Markers -->
                    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--pos-color)" />
                    </marker>
                    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--vel-color)" />
                    </marker>
                    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--force-color)" />
                    </marker>
                    <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                        <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--axis-color)" />
                    </marker>
                    
                    <!-- Drop Shadow for Panels -->
                    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                        <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.05"/>
                    </filter>
                </defs>

                <!-- Axes -->
                <line x1="50" y1="250" x2="600" y2="250" stroke="var(--axis-color)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
                <line x1="350" y1="450" x2="350" y2="50" stroke="var(--axis-color)" stroke-width="1.5" marker-end="url(#arrow-axis)" />
                <text x="590" y="240" fill="var(--text-muted)" font-size="14" font-style="italic">x</text>
                <text x="360" y="60" fill="var(--text-muted)" font-size="14" font-style="italic">y</text>

                <!-- Orbit Path -->
                <circle cx="350" cy="250" r="150" fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,6" />

                <!-- Angle Arc -->
                <path id="angle-arc" d="M 350 250 L 380 250 A 30 30 0 0 0 380 250 Z" fill="var(--arc-color)" fill-opacity="0.2" stroke="var(--arc-color)" stroke-width="1.5" />
                <text id="angle-label" x="395" y="245" fill="#e85d04" font-size="14" font-weight="600">θ</text>

                <!-- Projection Lines (SHM Shadows) -->
                <line id="proj-x" x1="500" y1="250" x2="500" y2="250" stroke="var(--axis-color)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
                <line id="proj-y" x1="350" y1="250" x2="500" y2="250" stroke="var(--axis-color)" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />

                <!-- Shadow Particles -->
                <circle id="shadow-x" cx="500" cy="250" r="6" fill="var(--text-main)" opacity="0.3" />
                <circle id="shadow-y" cx="350" cy="250" r="6" fill="var(--text-main)" opacity="0.3" />

                <!-- Vectors -->
                <line id="vec-r" x1="350" y1="250" x2="500" y2="250" stroke="var(--pos-color)" stroke-width="3" marker-end="url(#arrow-blue)" />
                <line id="vec-v" x1="500" y1="250" x2="500" y2="150" stroke="var(--vel-color)" stroke-width="3" marker-end="url(#arrow-green)" />
                <line id="vec-f" x1="500" y1="250" x2="420" y2="250" stroke="var(--force-color)" stroke-width="3" marker-end="url(#arrow-red)" />

                <!-- Main Particle -->
                <circle id="particle" cx="500" cy="250" r="8" fill="var(--text-main)" />

                <!-- Vector Labels -->
                <text id="label-r" x="425" y="240" fill="var(--pos-color)" font-size="15" font-weight="bold">r⃗</text>
                <text id="label-v" x="510" y="140" fill="var(--vel-color)" font-size="15" font-weight="bold">v⃗</text>
                <text id="label-f" x="460" y="240" fill="var(--force-color)" font-size="15" font-weight="bold">F⃗<tspan baseline-shift="sub" font-size="11">c</tspan></text>

                <!-- Legend Panel -->
                <g transform="translate(610, 20)">
                    <rect width="170" height="110" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5" filter="url(#shadow)" />
                    <text x="15" y="25" font-size="12" font-weight="700" fill="var(--text-muted)" letter-spacing="0.5">VECTORS</text>
                    
                    <line x1="15" y1="45" x2="35" y2="45" stroke="var(--pos-color)" stroke-width="3" marker-end="url(#arrow-blue)" />
                    <text x="45" y="49" font-size="13" fill="var(--text-main)">Position (r⃗)</text>
                    
                    <line x1="15" y1="70" x2="35" y2="70" stroke="var(--vel-color)" stroke-width="3" marker-end="url(#arrow-green)" />
                    <text x="45" y="74" font-size="13" fill="var(--text-main)">Velocity (v⃗)</text>
                    
                    <line x1="15" y1="95" x2="35" y2="95" stroke="var(--force-color)" stroke-width="3" marker-end="url(#arrow-red)" />
                    <text x="45" y="99" font-size="13" fill="var(--text-main)">Force (F⃗<tspan baseline-shift="sub" font-size="10">c</tspan>)</text>
                </g>

                <!-- Data Panel -->
                <g transform="translate(610, 320)">
                    <rect width="170" height="160" rx="8" fill="var(--panel-bg)" stroke="var(--panel-border)" stroke-width="1.5" filter="url(#shadow)" />
                    <text x="15" y="25" font-size="12" font-weight="700" fill="var(--text-muted)" letter-spacing="0.5">REAL-TIME DATA</text>
                    
                    <text x="15" y="50" class="math-text" font-size="13" fill="#495057">θ = <tspan id="data-theta">0</tspan>°</text>
                    <text x="15" y="75" class="math-text" font-size="13" fill="#495057">|v⃗| = const</text>
                    <text x="15" y="100" class="math-text" font-size="13" fill="#495057">|F⃗<tspan baseline-shift="sub" font-size="10">c</tspan>| = mω²r</text>
                    
                    <line x1="15" y1="115" x2="155" y2="115" stroke="var(--panel-border)" stroke-width="1" />
                    
                    <text x="15" y="135" class="math-text" font-size="12" fill="var(--text-muted)">x = r·cos(θ)</text>
                    <text x="15" y="155" class="math-text" font-size="12" fill="var(--text-muted)">y = r·sin(θ)</text>
                </g>
            </svg>
            
            <div class="controls">
                <button id="playPauseBtn">Pause</button>
            </div>
        </div>
    </div>

    <script>
        // Physics Constants & Setup
        const cx = 350;
        const cy = 250;
        const r = 150;
        const v_len = 100;
        const f_len = 80;
        const period = 8000; // 8 seconds per revolution

        // State Variables
        let isPlaying = true;
        let lastTime = 0;
        let accumulatedTime = 0;

        // DOM Elements
        const els = {
            particle: document.getElementById('particle'),
            shadowX: document.getElementById('shadow-x'),
            shadowY: document.getElementById('shadow-y'),
            projX: document.getElementById('proj-x'),
            projY: document.getElementById('proj-y'),
            vecR: document.getElementById('vec-r'),
            vecV: document.getElementById('vec-v'),
            vecF: document.getElementById('vec-f'),
            labelR: document.getElementById('label-r'),
            labelV: document.getElementById('label-v'),
            labelF: document.getElementById('label-f'),
            angleArc: document.getElementById('angle-arc'),
            angleLabel: document.getElementById('angle-label'),
            dataTheta: document.getElementById('data-theta'),
            btn: document.getElementById('playPauseBtn')
        };

        // Play/Pause Logic
        els.btn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            els.btn.innerText = isPlaying ? "Pause" : "Play";
            if (isPlaying) {
                lastTime = performance.now();
                requestAnimationFrame(animate);
            }
        });

        // Main Animation Loop
        function animate(time) {
            if (!lastTime) lastTime = time;
            
            if (isPlaying) {
                accumulatedTime += (time - lastTime);
            }
            lastTime = time;

            // Calculate Angle (0 to 2π)
            const rawTheta = (accumulatedTime / period) * 2 * Math.PI;
            const theta = rawTheta % (2 * Math.PI);

            // Particle Position
            const px = r * Math.cos(theta);
            const py = r * Math.sin(theta);
            const absX = cx + px;
            const absY = cy - py; // SVG y-axis is inverted

            // Update Particle & Shadows
            els.particle.setAttribute('cx', absX);
            els.particle.setAttribute('cy', absY);
            
            els.shadowX.setAttribute('cx', absX);
            els.shadowY.setAttribute('cy', absY);

            // Update Projection Lines
            els.projX.setAttribute('x1', absX);
            els.projX.setAttribute('y1', absY);
            els.projX.setAttribute('x2', absX);
            els.projX.setAttribute('y2', cy);

            els.projY.setAttribute('x1', absX);
            els.projY.setAttribute('y1', absY);
            els.projY.setAttribute('x2', cx);
            els.projY.setAttribute('y2', absY);

            // Update Vectors
            // 1. Position Vector (r)
            els.vecR.setAttribute('x2', absX);
            els.vecR.setAttribute('y2', absY);

            // 2. Velocity Vector (v) - Tangent to path
            const vx = -v_len * Math.sin(theta);
            const vy = v_len * Math.cos(theta);
            els.vecV.setAttribute('x1', absX);
            els.vecV.setAttribute('y1', absY);
            els.vecV.setAttribute('x2', absX + vx);
            els.vecV.setAttribute('y2', absY - vy);

            // 3. Centripetal Force Vector (Fc) - Pointing to center
            const fx = -f_len * Math.cos(theta);
            const fy = -f_len * Math.sin(theta);
            els.vecF.setAttribute('x1', absX);
            els.vecF.setAttribute('y1', absY);
            els.vecF.setAttribute('x2', absX + fx);
            els.vecF.setAttribute('y2', absY - fy);

            // Update Labels
            els.labelR.setAttribute('x', cx + (px / 2) - 15 * Math.sin(theta));
            els.labelR.setAttribute('y', cy - (py / 2) - 15 * Math.cos(theta));

            els.labelV.setAttribute('x', absX + vx + 12 * Math.cos(theta));
            els.labelV.setAttribute('y', absY - vy - 12 * Math.sin(theta));

            els.labelF.setAttribute('x', absX + fx/2 + 18 * Math.sin(theta) - 8);
            els.labelF.setAttribute('y', absY - fy/2 + 18 * Math.cos(theta) + 4);

            // Update Angle Arc
            const arcR = 30;
            const startX = cx + arcR;
            const startY = cy;
            const endX = cx + arcR * Math.cos(theta);
            const endY = cy - arcR * Math.sin(theta);
            const largeArc = theta > Math.PI ? 1 : 0;
            
            let pathD;
            if (theta === 0) {
                pathD = `M ${cx} ${cy} L ${startX} ${startY} Z`;
            } else {
                pathD = `M ${cx} ${cy} L ${startX} ${startY} A ${arcR} ${arcR} 0 ${largeArc} 0 ${endX} ${endY} Z`;
            }
            els.angleArc.setAttribute('d', pathD);

            // Update Angle Label Position (bisecting the angle)
            const labelDist = 45;
            els.angleLabel.setAttribute('x', cx + labelDist * Math.cos(theta / 2) - 5);
            els.angleLabel.setAttribute('y', cy - labelDist * Math.sin(theta / 2) + 5);

            // Update Data Panel Text
            els.dataTheta.textContent = (theta * 180 / Math.PI).toFixed(0).padStart(3, '0');

            if (isPlaying) {
                requestAnimationFrame(animate);
            }
        }

        // Start Animation
        requestAnimationFrame(animate);
    </script>
</body>
</html>
