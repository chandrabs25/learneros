<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipartition of Energy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6c757d;
            --monatomic: #4361EE;
            --diatomic: #7209B7;
            --kinetic: #FF3366;
            --trans-vec: #06D6A0;
            --rot-vec: #F77F00;
            --vib-vec: #00B4D8;
            --grid-line: #CED4DA;
        }

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        button {
            background: #ffffff;
            border: 2px solid var(--text-main);
            color: var(--text-main);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        button:hover {
            background: var(--text-main);
            color: #ffffff;
        }

        button.active {
            background: var(--vib-vec);
            border-color: var(--vib-vec);
            color: #ffffff;
        }

        svg {
            width: 100%;
            height: auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            overflow: visible;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: var(--text-main); }
        .subtitle { font-size: 14px; fill: var(--text-muted); }
        .label { font-size: 14px; font-weight: 600; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; }
        .math-small { font-family: 'Roboto Mono', monospace; font-size: 12px; }
        .axis-label { font-size: 12px; fill: var(--text-muted); font-weight: 600; }

        /* Animations */
        @keyframes pulse-bg {
            0% { stop-color: #ffffff; }
            100% { stop-color: #fff0f3; }
        }
        .bg-pulse { animation: pulse-bg 3s infinite alternate ease-in-out; }

        /* Floating & Wobbling */
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(4px, -6px); }
        }
        .float-anim { animation: float 4s infinite ease-in-out; }

        @keyframes wobble {
            0%, 100% { transform: rotate(-6deg) translateY(-2px); }
            50% { transform: rotate(6deg) translateY(2px); }
        }
        .wobble-anim { animation: wobble 3.5s infinite alternate ease-in-out; }

        /* Vector Pulsing */
        @keyframes pulse-vec {
            0%, 100% { transform: scale(0.8); }
            50% { transform: scale(1.3); }
        }
        .vec-x { animation: pulse-vec 2.1s infinite alternate ease-in-out; }
        .vec-y { animation: pulse-vec 1.7s infinite alternate ease-in-out; }
        .vec-z { animation: pulse-vec 2.5s infinite alternate ease-in-out; }
        .vec-rot { animation: pulse-vec 2.8s infinite alternate ease-in-out; }

        /* Bar Chart Animations (12s Loop: Monatomic -> Diatomic -> Summary) */
        .bar {
            transform-box: fill-box;
            transform-origin: bottom;
            transition: fill 0.5s ease;
        }

        @keyframes mon-bar {
            0%, 5% { transform: scaleY(0); }
            15%, 100% { transform: scaleY(1); }
        }
        .bar-mon { animation: mon-bar 12s infinite ease-out; }

        @keyframes dia-bar {
            0%, 33% { transform: scaleY(0); }
            43%, 100% { transform: scaleY(1); }
        }
        .bar-dia { animation: dia-bar 12s infinite ease-out; }

        @keyframes bar-glow {
            0%, 66% { fill: var(--kinetic); }
            75%, 90% { fill: #ff6b93; }
            100% { fill: var(--kinetic); }
        }
        .glow-anim { animation: bar-glow 12s infinite; }

        /* Highlight Boxes */
        @keyframes mon-hl {
            0%, 33% { opacity: 0.15; }
            34%, 100% { opacity: 0; }
        }
        @keyframes dia-hl {
            0%, 33% { opacity: 0; }
            34%, 66% { opacity: 0.15; }
            67%, 100% { opacity: 0; }
        }
        @keyframes sum-hl {
            0%, 66% { opacity: 0; }
            67%, 100% { opacity: 0.1; }
        }
        .hl-mon { animation: mon-hl 12s infinite; fill: var(--monatomic); }
        .hl-dia { animation: dia-hl 12s infinite; fill: var(--diatomic); }
        .hl-sum { animation: sum-hl 12s infinite; fill: var(--kinetic); }

        /* Vibration Mode (Interactive) */
        .vib-mode {
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }
        .vib-active .vib-mode {
            opacity: 1;
        }
        
        @keyframes vib-spring {
            0%, 100% { transform: scaleX(0.9); }
            50% { transform: scaleX(1.1); }
        }
        .vib-active .spring-anim {
            animation: vib-spring 0.8s infinite alternate ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="tempToggle" onclick="toggleTemp()">Switch to High Temp (Add Vibration)</button>
    </div>

    <svg viewBox="0 0 800 500" id="mainSvg">
        <defs>
            <!-- Gradients -->
            <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
                <stop offset="0%" stop-color="#ffffff" class="bg-pulse" />
                <stop offset="100%" stop-color="#f8f9fa" />
            </radialGradient>
            
            <radialGradient id="monatomicGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#809bfe" />
                <stop offset="100%" stop-color="#2A3D96" />
            </radialGradient>

            <radialGradient id="diatomicGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#b45bff" />
                <stop offset="100%" stop-color="#4A0677" />
            </radialGradient>

            <!-- Arrow Markers -->
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrowOrange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#00B4D8" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="url(#bgGrad)" rx="16" />

        <!-- Highlight Regions (Controlled by 12s Keyframes) -->
        <rect x="15" y="65" width="370" height="180" rx="12" class="hl-mon" />
        <rect x="15" y="255" width="370" height="180" rx="12" class="hl-dia" />
        <rect x="10" y="60" width="780" height="380" rx="12" class="hl-sum" />

        <!-- Title & Header -->
        <text x="400" y="35" text-anchor="middle" class="title">Equipartition of Energy</text>
        <text x="400" y="55" text-anchor="middle" class="subtitle">Energy is shared equally among all active degrees of freedom (DOF)</text>
        
        <!-- Center Divider -->
        <line x1="400" y1="80" x2="400" y2="460" stroke="var(--grid-line)" stroke-width="2" stroke-dasharray="6,6" />

        <!-- ================= LEFT PANEL: MOLECULES ================= -->

        <!-- 1. Monatomic Molecule -->
        <text x="30" y="95" class="label" fill="var(--monatomic)">Monatomic (f=3)</text>
        <rect x="240" y="75" width="130" height="32" rx="6" fill="#e0e7ff" />
        <text x="305" y="96" text-anchor="middle" class="math" fill="var(--monatomic)">U = 3/2 k_B T</text>

        <g transform="translate(180, 170)">
            <!-- Axes -->
            <line x1="-70" y1="0" x2="70" y2="0" stroke="var(--grid-line)" stroke-dasharray="4,4" />
            <line x1="0" y1="-70" x2="0" y2="70" stroke="var(--grid-line)" stroke-dasharray="4,4" />
            <line x1="-40" y1="40" x2="40" y2="-40" stroke="var(--grid-line)" stroke-dasharray="4,4" />
            
            <g class="float-anim">
                <!-- Translation Vectors -->
                <line x1="0" y1="0" x2="65" y2="0" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-x" style="transform-origin: 0 0;" />
                <line x1="0" y1="0" x2="0" y2="-65" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-y" style="transform-origin: 0 0;" />
                <line x1="0" y1="0" x2="-45" y2="45" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-z" style="transform-origin: 0 0;" />
                
                <!-- Atom -->
                <circle cx="0" cy="0" r="22" fill="url(#monatomicGrad)" />
            </g>
        </g>

        <!-- 2. Diatomic Molecule -->
        <text x="30" y="285" class="label" fill="var(--diatomic)" id="dia-f-label">Diatomic (f=5)</text>
        <rect x="240" y="265" width="130" height="32" rx="6" fill="#f3e8ff" />
        <text x="305" y="286" text-anchor="middle" class="math" fill="var(--diatomic)" id="dia-formula-text">U = 5/2 k_B T</text>

        <g transform="translate(180, 360)">
            <!-- Axes -->
            <line x1="-90" y1="0" x2="90" y2="0" stroke="var(--grid-line)" stroke-dasharray="4,4" />
            <line x1="0" y1="-80" x2="0" y2="80" stroke="var(--grid-line)" stroke-dasharray="4,4" />
            <line x1="-50" y1="50" x2="50" y2="-50" stroke="var(--grid-line)" stroke-dasharray="4,4" />

            <!-- Translation Vectors (Center of Mass) -->
            <line x1="0" y1="0" x2="70" y2="0" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-x" style="transform-origin: 0 0; animation-delay: 0.3s;" />
            <line x1="0" y1="0" x2="0" y2="-70" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-y" style="transform-origin: 0 0; animation-delay: 0.5s;" />
            <line x1="0" y1="0" x2="-50" y2="50" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" class="vec-z" style="transform-origin: 0 0; animation-delay: 0.1s;" />

            <!-- Rotating Molecule Group -->
            <g class="wobble-anim" style="transform-origin: 0 0;">
                <!-- Rigid Bond -->
                <line x1="-45" y1="0" x2="45" y2="0" stroke="#495057" stroke-width="8" stroke-linecap="round" />
                
                <!-- Vibration Spring (Hidden by default) -->
                <g class="vib-mode spring-anim" style="transform-origin: 0 0;">
                    <path d="M -40 0 Q -30 20 -20 0 T 0 0 T 20 0 T 40 0" fill="none" stroke="var(--vib-vec)" stroke-width="4" />
                </g>

                <!-- Atoms -->
                <circle cx="-45" cy="0" r="18" fill="url(#diatomicGrad)" />
                <circle cx="45" cy="0" r="18" fill="url(#diatomicGrad)" />

                <!-- Vibration Arrows (Hidden by default) -->
                <line x1="-65" y1="0" x2="-95" y2="0" stroke="var(--vib-vec)" stroke-width="3" marker-end="url(#arrowCyan)" class="vib-mode vec-x" style="transform-origin: -65px 0;" />
                <line x1="65" y1="0" x2="95" y2="0" stroke="var(--vib-vec)" stroke-width="3" marker-end="url(#arrowCyan)" class="vib-mode vec-x" style="transform-origin: 65px 0;" />
            </g>

            <!-- Rotation Vectors (Curved Arrows) -->
            <!-- w1: Rotation around Y axis (out of plane) -->
            <path d="M -35 -25 A 45 15 0 1 1 35 -25" fill="none" stroke="var(--rot-vec)" stroke-width="3" marker-end="url(#arrowOrange)" stroke-dasharray="5,3" class="vec-rot" style="transform-origin: 0 -25px;" />
            <!-- w2: Rotation around Z axis (in plane) -->
            <path d="M 60 25 A 65 65 0 0 1 -25 65" fill="none" stroke="var(--rot-vec)" stroke-width="3" marker-end="url(#arrowOrange)" stroke-dasharray="5,3" class="vec-rot" style="transform-origin: 0 0; animation-delay: 0.4s;" />
        </g>

        <!-- ================= RIGHT PANEL: BAR CHART ================= -->
        
        <text x="580" y="95" text-anchor="middle" class="label">Energy per Degree of Freedom</text>

        <!-- Chart Axes -->
        <line x1="430" y1="120" x2="430" y2="420" stroke="var(--grid-line)" stroke-width="2" />
        <line x1="430" y1="420" x2="780" y2="420" stroke="var(--grid-line)" stroke-width="2" />
        
        <!-- Y-Axis Label -->
        <text x="-270" y="415" transform="rotate(-90)" text-anchor="middle" class="axis-label">Energy (E)</text>

        <!-- Target Energy Line (1/2 kT) -->
        <line x1="430" y1="220" x2="780" y2="220" stroke="var(--kinetic)" stroke-width="1.5" stroke-dasharray="6,4" />
        <rect x="435" y="208" width="65" height="24" rx="4" fill="#fff0f3" />
        <text x="440" y="225" class="math-small" fill="var(--kinetic)">½ k_B T</text>

        <!-- BARS (Target height is 200px, so Y goes from 420 up to 220) -->
        
        <!-- Monatomic Group (f=3) -->
        <g class="glow-anim">
            <rect x="460" y="220" width="22" height="200" class="bar bar-mon" style="animation-delay: 0.0s;" />
            <rect x="490" y="220" width="22" height="200" class="bar bar-mon" style="animation-delay: 0.2s;" />
            <rect x="520" y="220" width="22" height="200" class="bar bar-mon" style="animation-delay: 0.4s;" />
        </g>
        
        <!-- Diatomic Group (f=5) -->
        <g class="glow-anim">
            <rect x="570" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.0s;" />
            <rect x="600" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.1s;" />
            <rect x="630" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.2s;" />
            <rect x="660" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.4s;" />
            <rect x="690" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.5s;" />
        </g>

        <!-- Vibrational Group (f=2, Hidden by default) -->
        <g class="vib-mode glow-anim">
            <rect x="730" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.6s;" />
            <rect x="760" y="220" width="22" height="200" class="bar bar-dia" style="animation-delay: 0.7s;" />
        </g>

        <!-- X-Axis Labels -->
        <!-- Monatomic -->
        <text x="471" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">x</tspan></text>
        <text x="501" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">y</tspan></text>
        <text x="531" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">z</tspan></text>
        <text x="501" y="460" text-anchor="middle" class="axis-label" fill="var(--monatomic)">Trans</text>

        <!-- Diatomic -->
        <text x="581" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">x</tspan></text>
        <text x="611" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">y</tspan></text>
        <text x="641" y="440" text-anchor="middle" class="math-small">v<tspan baseline-shift="sub" font-size="9">z</tspan></text>
        <text x="671" y="440" text-anchor="middle" class="math-small">ω<tspan baseline-shift="sub" font-size="9">1</tspan></text>
        <text x="701" y="440" text-anchor="middle" class="math-small">ω<tspan baseline-shift="sub" font-size="9">2</tspan></text>
        <text x="641" y="460" text-anchor="middle" class="axis-label" fill="var(--diatomic)">Trans + Rot</text>

        <!-- Vibrational -->
        <g class="vib-mode">
            <text x="741" y="440" text-anchor="middle" class="math-small">K<tspan baseline-shift="sub" font-size="9">vib</tspan></text>
            <text x="771" y="440" text-anchor="middle" class="math-small">U<tspan baseline-shift="sub" font-size="9">vib</tspan></text>
            <text x="756" y="460" text-anchor="middle" class="axis-label" fill="var(--vib-vec)">Vib</text>
        </g>

        <!-- Summary Formula Box -->
        <rect x="480" y="120" width="240" height="50" rx="8" fill="#ffffff" stroke="var(--kinetic)" stroke-width="2" />
        <text x="600" y="152" text-anchor="middle" class="math" fill="var(--kinetic)">E<tspan baseline-shift="sub" font-size="11">avg</tspan> = (f / 2) k_B T</text>

        <!-- ================= LEGEND ================= -->
        <rect x="20" y="455" width="360" height="30" rx="4" fill="#ffffff" stroke="var(--grid-line)" />
        
        <line x1="30" y1="470" x2="45" y2="470" stroke="var(--trans-vec)" stroke-width="3" marker-end="url(#arrowGreen)" />
        <text x="55" y="474" font-size="11" font-weight="600">Translation</text>

        <path d="M 130 475 Q 137 465 145 475" fill="none" stroke="var(--rot-vec)" stroke-width="2.5" marker-end="url(#arrowOrange)" />
        <text x="155" y="474" font-size="11" font-weight="600">Rotation</text>

        <line x1="215" y1="470" x2="230" y2="470" stroke="var(--vib-vec)" stroke-width="3" marker-end="url(#arrowCyan)" />
        <text x="240" y="474" font-size="11" font-weight="600">Vibration</text>

        <rect x="305" y="465" width="10" height="10" fill="var(--kinetic)" rx="2" />
        <text x="320" y="474" font-size="11" font-weight="600">Energy</text>

    </svg>
</div>

<script>
    function toggleTemp() {
        const svg = document.getElementById('mainSvg');
        const btn = document.getElementById('tempToggle');
        const isHighTemp = svg.classList.toggle('vib-active');
        
        if (isHighTemp) {
            btn.classList.add('active');
            btn.textContent = "Switch to Room Temp (f=5)";
            document.getElementById('dia-f-label').textContent = "Diatomic (f=7)";
            document.getElementById('dia-formula-text').textContent = "U = 7/2 k_B T";
        } else {
            btn.classList.remove('active');
            btn.textContent = "Switch to High Temp (Add Vibration)";
            document.getElementById('dia-f-label').textContent = "Diatomic (f=5)";
            document.getElementById('dia-formula-text').textContent = "U = 5/2 k_B T";
        }
    }
</script>

</body>
</html>
