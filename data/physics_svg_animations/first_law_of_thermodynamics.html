<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>First Law of Thermodynamics</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  svg {
    max-width: 100%;
    max-height: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    background-color: #ffffff;
  }

  * {
    animation-play-state: var(--play-state, running) !important;
  }

  .title {
    font-family: 'Inter', sans-serif;
    font-size: 24px;
    font-weight: 600;
    fill: #212529;
    text-anchor: middle;
  }

  .equation {
    font-family: 'Roboto Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    fill: #343A40;
    text-anchor: middle;
  }

  .label {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    text-anchor: middle;
  }

  .legend-text {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 400;
    fill: #495057;
    text-anchor: start;
    dominant-baseline: middle;
  }

  .system-label { fill: #212529; }
  .ext-label { fill: #EF476F; }
  .work-label { fill: #4361EE; }
  .heat-label { fill: #FF3366; }

  /* Macro Animations */
  @keyframes piston-move {
    0%, 40% { transform: translateY(0); }
    70%, 80% { transform: translateY(-120px); }
    100% { transform: translateY(0); }
  }

  @keyframes work-arrow-anim {
    0%, 35% { transform: translateY(0) scaleY(0.1); opacity: 0; }
    40% { transform: translateY(0) scaleY(0.1); opacity: 1; }
    70%, 80% { transform: translateY(-120px) scaleY(1.5); opacity: 1; }
    85% { opacity: 0; }
    100% { transform: translateY(0) scaleY(0.1); opacity: 0; }
  }

  @keyframes work-text-anim {
    0%, 35% { transform: translateY(0); opacity: 0; }
    40% { transform: translateY(0); opacity: 1; }
    70%, 80% { transform: translateY(-80px); opacity: 1; }
    85% { opacity: 0; }
    100% { transform: translateY(0); opacity: 0; }
  }

  @keyframes heat-anim {
    0%, 15% { opacity: 0; transform: translateY(15px); }
    25%, 55% { opacity: 1; transform: translateY(0); }
    65%, 100% { opacity: 0; transform: translateY(-15px); }
  }

  @keyframes aura-anim {
    0%, 15% { opacity: 0; transform: scaleY(1); }
    25%, 40% { opacity: 0.6; transform: scaleY(1); }
    70%, 80% { opacity: 0.6; transform: scaleY(2.2); }
    90%, 100% { opacity: 0; transform: scaleY(1); }
  }

  /* Equation Highlights */
  @keyframes eq-q-color {
    0%, 15% { fill: #343A40; }
    25%, 55% { fill: #FF3366; }
    65%, 100% { fill: #343A40; }
  }
  @keyframes eq-u-color {
    0%, 15% { fill: #343A40; }
    25%, 85% { fill: #F77F00; }
    95%, 100% { fill: #343A40; }
  }
  @keyframes eq-w-color {
    0%, 35% { fill: #343A40; }
    40%, 85% { fill: #4361EE; }
    95%, 100% { fill: #343A40; }
  }

  /* Particle Layers Macro Movement */
  @keyframes layer1-move {
    0%, 40% { transform: translateY(0); }
    70%, 80% { transform: translateY(-20px); }
    100% { transform: translateY(0); }
  }
  @keyframes layer2-move {
    0%, 40% { transform: translateY(0); }
    70%, 80% { transform: translateY(-60px); }
    100% { transform: translateY(0); }
  }
  @keyframes layer3-move {
    0%, 40% { transform: translateY(0); }
    70%, 80% { transform: translateY(-100px); }
    100% { transform: translateY(0); }
  }
  @keyframes system-label-move {
    0%, 40% { transform: translateY(0); }
    70%, 80% { transform: translateY(-60px); }
    100% { transform: translateY(0); }
  }

  /* Particle Crossfade (Temperature Increase) */
  @keyframes slow-fade {
    0%, 15% { opacity: 1; }
    25%, 85% { opacity: 0; }
    95%, 100% { opacity: 1; }
  }
  @keyframes fast-fade {
    0%, 15% { opacity: 0; }
    25%, 85% { opacity: 1; }
    95%, 100% { opacity: 0; }
  }

  /* Particle Micro Jitters */
  @keyframes j-slow-1 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(1px,-1px)} 66%{transform:translate(-1px,1px)} }
  @keyframes j-slow-2 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(-1px,-1px)} 66%{transform:translate(1px,1px)} }
  @keyframes j-slow-3 { 0%,100%{transform:translate(0,0)} 33%{transform:translate(1px,1px)} 66%{transform:translate(-1px,-1px)} }
  
  @keyframes j-fast-1 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(3px,-4px)} 50%{transform:translate(-4px,2px)} 75%{transform:translate(2px,4px)} }
  @keyframes j-fast-2 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(-4px,-2px)} 50%{transform:translate(3px,4px)} 75%{transform:translate(-2px,-3px)} }
  @keyframes j-fast-3 { 0%,100%{transform:translate(0,0)} 25%{transform:translate(2px,4px)} 50%{transform:translate(-3px,-4px)} 75%{transform:translate(4px,-2px)} }

  /* Assign Animations */
  .piston-group { animation: piston-move 10s infinite ease-in-out; }
  .work-arrow { animation: work-arrow-anim 10s infinite ease-in-out; transform-origin: 400px 290px; }
  .work-label-group { animation: work-text-anim 10s infinite ease-in-out; }
  .heat-group { animation: heat-anim 10s infinite ease-in-out; }
  .aura { animation: aura-anim 10s infinite ease-in-out; transform-origin: 400px 390px; }
  
  .eq-q { animation: eq-q-color 10s infinite ease-in-out; transition: fill 0.3s; }
  .eq-u { animation: eq-u-color 10s infinite ease-in-out; transition: fill 0.3s; }
  .eq-w { animation: eq-w-color 10s infinite ease-in-out; transition: fill 0.3s; }
  
  .layer1 { animation: layer1-move 10s infinite ease-in-out; }
  .layer2 { animation: layer2-move 10s infinite ease-in-out; }
  .layer3 { animation: layer3-move 10s infinite ease-in-out; }
  .system-label-group { animation: system-label-move 10s infinite ease-in-out; }
  
  .slow-particles { animation: slow-fade 10s infinite ease-in-out; }
  .fast-particles { animation: fast-fade 10s infinite ease-in-out; }
  
  .p-slow-1 { animation: j-slow-1 2s infinite linear; fill: #343A40; }
  .p-slow-2 { animation: j-slow-2 2.2s infinite linear; fill: #343A40; }
  .p-slow-3 { animation: j-slow-3 1.8s infinite linear; fill: #343A40; }
  
  .p-fast-1 { animation: j-fast-1 0.3s infinite linear; fill: #343A40; }
  .p-fast-2 { animation: j-fast-2 0.35s infinite linear; fill: #343A40; }
  .p-fast-3 { animation: j-fast-3 0.25s infinite linear; fill: #343A40; }

  .btn-bg { transition: fill 0.2s; }
  #play-pause-btn:hover .btn-bg { fill: #343A40; }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#EF476F" />
    </marker>
    
    <!-- Internal Energy Glow Gradient -->
    <radialGradient id="glow-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F77F00" stop-opacity="1" />
      <stop offset="70%" stop-color="#F77F00" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#F77F00" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Title & Equation -->
  <text x="400" y="40" class="title">First Law of Thermodynamics</text>
  <text x="400" y="85" class="equation">
    <tspan class="eq-q">ΔQ</tspan> = <tspan class="eq-u">ΔU</tspan> + <tspan class="eq-w">ΔW</tspan>
  </text>

  <!-- Surroundings Label -->
  <text x="180" y="250" class="label" fill="#6C757D">Surroundings</text>

  <!-- Legend -->
  <g transform="translate(610, 30)">
    <rect x="0" y="0" width="160" height="110" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" rx="6" />
    <circle cx="15" cy="20" r="5" fill="#FF3366" />
    <text x="30" y="20" class="legend-text">Heat (ΔQ)</text>
    <circle cx="15" cy="45" r="5" fill="#F77F00" />
    <text x="30" y="45" class="legend-text">Internal Energy (ΔU)</text>
    <circle cx="15" cy="70" r="5" fill="#4361EE" />
    <text x="30" y="70" class="legend-text">Work (ΔW)</text>
    <circle cx="15" cy="95" r="5" fill="#343A40" />
    <text x="30" y="95" class="legend-text">Gas Particles</text>
  </g>

  <!-- Heat Arrows (Q) -->
  <g class="heat-group">
    <path d="M 340 470 Q 330 450 340 430 T 340 395" fill="none" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
    <path d="M 400 470 Q 390 450 400 430 T 400 395" fill="none" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
    <path d="M 460 470 Q 450 450 460 430 T 460 395" fill="none" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
    <text x="400" y="490" class="label heat-label">Heat Added (ΔQ)</text>
  </g>

  <!-- Cylinder -->
  <path d="M 300 120 L 300 390 L 500 390 L 500 120" fill="none" stroke="#495057" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Internal Energy Aura -->
  <rect x="304" y="290" width="192" height="100" fill="url(#glow-grad)" class="aura" />

  <!-- Particles Layer 1 (Bottom) -->
  <g class="layer1">
    <g class="slow-particles">
      <circle cx="320" cy="370" r="4" class="p-slow-1" />
      <circle cx="350" cy="375" r="4" class="p-slow-2" />
      <circle cx="380" cy="365" r="4" class="p-slow-3" />
      <circle cx="410" cy="375" r="4" class="p-slow-1" />
      <circle cx="440" cy="370" r="4" class="p-slow-2" />
      <circle cx="470" cy="365" r="4" class="p-slow-3" />
    </g>
    <g class="fast-particles">
      <circle cx="320" cy="370" r="4" class="p-fast-1" />
      <circle cx="350" cy="375" r="4" class="p-fast-2" />
      <circle cx="380" cy="365" r="4" class="p-fast-3" />
      <circle cx="410" cy="375" r="4" class="p-fast-1" />
      <circle cx="440" cy="370" r="4" class="p-fast-2" />
      <circle cx="470" cy="365" r="4" class="p-fast-3" />
    </g>
  </g>

  <!-- Particles Layer 2 (Middle) -->
  <g class="layer2">
    <g class="slow-particles">
      <circle cx="330" cy="340" r="4" class="p-slow-2" />
      <circle cx="360" cy="335" r="4" class="p-slow-3" />
      <circle cx="390" cy="345" r="4" class="p-slow-1" />
      <circle cx="420" cy="340" r="4" class="p-slow-2" />
      <circle cx="450" cy="335" r="4" class="p-slow-3" />
      <circle cx="480" cy="345" r="4" class="p-slow-1" />
    </g>
    <g class="fast-particles">
      <circle cx="330" cy="340" r="4" class="p-fast-2" />
      <circle cx="360" cy="335" r="4" class="p-fast-3" />
      <circle cx="390" cy="345" r="4" class="p-fast-1" />
      <circle cx="420" cy="340" r="4" class="p-fast-2" />
      <circle cx="450" cy="335" r="4" class="p-fast-3" />
      <circle cx="480" cy="345" r="4" class="p-fast-1" />
    </g>
  </g>

  <!-- Particles Layer 3 (Top) -->
  <g class="layer3">
    <g class="slow-particles">
      <circle cx="340" cy="310" r="4" class="p-slow-3" />
      <circle cx="370" cy="315" r="4" class="p-slow-1" />
      <circle cx="400" cy="305" r="4" class="p-slow-2" />
      <circle cx="430" cy="315" r="4" class="p-slow-3" />
      <circle cx="460" cy="310" r="4" class="p-slow-1" />
    </g>
    <g class="fast-particles">
      <circle cx="340" cy="310" r="4" class="p-fast-3" />
      <circle cx="370" cy="315" r="4" class="p-fast-1" />
      <circle cx="400" cy="305" r="4" class="p-fast-2" />
      <circle cx="430" cy="315" r="4" class="p-fast-3" />
      <circle cx="460" cy="310" r="4" class="p-fast-1" />
    </g>
  </g>

  <!-- System Label -->
  <g class="system-label-group">
    <text x="400" y="340" class="label system-label">System (Gas)</text>
  </g>

  <!-- Work Arrow (W) -->
  <path class="work-arrow" d="M 396 345 L 396 305 L 388 305 L 400 290 L 412 305 L 404 305 L 404 345 Z" fill="#4361EE" />
  <g class="work-label-group">
    <text x="435" y="270" class="label work-label">F_gas (ΔW)</text>
  </g>

  <!-- Piston Group -->
  <g class="piston-group">
    <!-- Piston Rod -->
    <rect x="396" y="50" width="8" height="220" fill="#ADB5BD" />
    <!-- Piston Head -->
    <rect x="304" y="270" width="192" height="20" fill="#6C757D" rx="2" />
    
    <!-- External Pressure Arrows (P_ext) -->
    <line x1="340" y1="230" x2="340" y2="260" stroke="#EF476F" stroke-width="3" marker-end="url(#arrow-pink)" />
    <line x1="460" y1="230" x2="460" y2="260" stroke="#EF476F" stroke-width="3" marker-end="url(#arrow-pink)" />
    <text x="400" y="215" class="label ext-label">P_ext</text>
  </g>

  <!-- Play/Pause Button -->
  <g id="play-pause-btn" cursor="pointer" onclick="toggleAnimation()">
    <rect x="350" y="450" width="100" height="32" rx="16" fill="#212529" class="btn-bg" />
    <text x="400" y="466" fill="#ffffff" class="label" id="btn-text" dominant-baseline="middle">Pause</text>
  </g>

</svg>

<script>
  let isPaused = false;
  function toggleAnimation() {
    isPaused = !isPaused;
    const svg = document.querySelector('svg');
    if (isPaused) {
      svg.style.setProperty('--play-state', 'paused');
      document.getElementById('btn-text').textContent = 'Play';
    } else {
      svg.style.setProperty('--play-state', 'running');
      document.getElementById('btn-text').textContent = 'Pause';
    }
  }
</script>

</body>
</html>
