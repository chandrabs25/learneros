<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Motion: Simple Harmonic Projection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            display: block;
        }
        .title {
            text-align: center;
            margin-bottom: 20px;
            color: #2B2D42;
        }
        .title h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
        }
        .title p {
            margin: 5px 0 0 0;
            font-size: 14px;
            color: #6C757D;
        }
        text {
            user-select: none;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">
        <h1>Periodic Motion: Simple Harmonic Projection</h1>
        <p>Simple Harmonic Motion (SHM) as a 1D projection of Uniform Circular Motion (UCM)</p>
    </div>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated Diagram of Periodic Motion</title>
        <desc>A synchronized animation showing a particle in uniform circular motion, its linear projection as a mass-spring system, and a real-time displacement-time graph.</desc>

        <defs>
            <!-- Arrowheads for Vectors -->
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>

            <!-- Graph Grid Pattern -->
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#F1F3F5" stroke-width="1"/>
            </pattern>
        </defs>

        <!-- Legend -->
        <g transform="translate(620, 20)">
            <rect x="0" y="0" width="160" height="85" rx="6" fill="#f8f9fa" stroke="#DEE2E6" stroke-width="1"/>
            <text x="80" y="18" font-size="12" font-weight="600" fill="#495057" text-anchor="middle">Vector Key</text>
            
            <line x1="10" y1="35" x2="30" y2="35" stroke="#4361EE" stroke-width="2" marker-end="url(#arrow-blue)"/>
            <text x="40" y="39" font-size="11" fill="#495057">Displacement (x)</text>
            
            <line x1="10" y1="55" x2="30" y2="55" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
            <text x="40" y="59" font-size="11" fill="#495057">Velocity (v)</text>
            
            <line x1="10" y1="75" x2="30" y2="75" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)"/>
            <text x="40" y="79" font-size="11" fill="#495057">Restoring Force (F)</text>
        </g>

        <!-- ================= TOP LEFT: REFERENCE CIRCLE (UCM) ================= -->
        <g transform="translate(0, 0)">
            <text x="200" y="30" font-size="14" font-weight="600" fill="#2B2D42" text-anchor="middle">Reference Circle (UCM)</text>
            
            <!-- Axes -->
            <line x1="90" y1="150" x2="310" y2="150" stroke="#DEE2E6" stroke-width="2"/>
            <line x1="200" y1="40" x2="200" y2="260" stroke="#DEE2E6" stroke-width="2"/>
            
            <!-- Path Circle -->
            <circle cx="200" cy="150" r="80" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6,4"/>
            
            <!-- Labels -->
            <text x="285" y="140" font-size="12" fill="#6C757D" class="math">+A</text>
            <text x="95" y="140" font-size="12" fill="#6C757D" class="math">-A</text>
            <text x="205" y="65" font-size="12" fill="#6C757D" class="math">+A</text>
            <text x="205" y="245" font-size="12" fill="#6C757D" class="math">-A</text>

            <!-- Projection Line to X-axis -->
            <line id="ucm-proj-line" x1="280" y1="150" x2="280" y2="150" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="4,4"/>
            <circle id="ucm-proj-dot" cx="280" cy="150" r="4" fill="#4361EE" opacity="0.5"/>

            <!-- Vectors -->
            <line id="ucm-vec-x" x1="200" y1="150" x2="280" y2="150" stroke="#4361EE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
            <line id="ucm-vec-v" x1="280" y1="150" x2="280" y2="70" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)"/>
            <line id="ucm-vec-f" x1="280" y1="150" x2="200" y2="150" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-red)"/>
            
            <!-- Particle -->
            <circle id="ucm-particle" cx="280" cy="150" r="8" fill="#2B2D42"/>
        </g>

        <!-- ================= TOP RIGHT: LINEAR OSCILLATOR (SHM) ================= -->
        <g transform="translate(0, 0)">
            <text x="600" y="30" font-size="14" font-weight="600" fill="#2B2D42" text-anchor="middle">Linear Oscillator (SHM)</text>
            
            <!-- Axis & Wall -->
            <line x1="480" y1="150" x2="710" y2="150" stroke="#DEE2E6" stroke-width="2"/>
            <rect x="460" y="110" width="10" height="80" fill="#ADB5BD"/>
            <line x1="470" y1="110" x2="470" y2="190" stroke="#6C757D" stroke-width="2"/>
            
            <!-- Equilibrium Line -->
            <line x1="600" y1="130" x2="600" y2="170" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="4,4"/>
            
            <!-- Labels -->
            <text x="680" y="135" font-size="12" fill="#6C757D" class="math">+A</text>
            <text x="595" y="125" font-size="12" fill="#6C757D" class="math">0</text>
            <text x="510" y="135" font-size="12" fill="#6C757D" class="math">-A</text>

            <!-- Spring -->
            <path id="spring-path" d="M 470 150 L 680 150" fill="none" stroke="#868E96" stroke-width="2.5" stroke-linejoin="round"/>

            <!-- Vectors -->
            <line id="lin-vec-x" x1="600" y1="150" x2="680" y2="150" stroke="#4361EE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
            <line id="lin-vec-v" x1="680" y1="150" x2="680" y2="150" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-green)"/>
            <line id="lin-vec-f" x1="680" y1="150" x2="600" y2="150" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrow-red)"/>

            <!-- Vector Labels -->
            <text id="label-v" x="680" y="140" font-size="14" font-weight="bold" fill="#06D6A0" class="math">v</text>
            <text id="label-f" x="640" y="175" font-size="14" font-weight="bold" fill="#FF3366" class="math">F</text>

            <!-- Particle -->
            <circle id="lin-particle" cx="680" cy="150" r="10" fill="#2B2D42"/>
        </g>

        <!-- Dynamic Equations Box -->
        <g transform="translate(330, 100)">
            <rect x="0" y="0" width="140" height="80" rx="6" fill="#ffffff" stroke="#DEE2E6" stroke-width="1"/>
            <text x="70" y="20" font-size="11" font-weight="600" fill="#495057" text-anchor="middle">Instantaneous Values</text>
            <text id="eq-x" x="15" y="40" font-size="12" fill="#4361EE" class="math">x = 0.0</text>
            <text id="eq-v" x="15" y="55" font-size="12" fill="#06D6A0" class="math">v = 0.0</text>
            <text id="eq-f" x="15" y="70" font-size="12" fill="#FF3366" class="math">F = 0.0</text>
        </g>

        <!-- ================= BOTTOM: WAVE PLOT ================= -->
        <g transform="translate(0, 0)">
            <text x="400" y="260" font-size="14" font-weight="600" fill="#2B2D42" text-anchor="middle">Real-Time Displacement-Time Graph</text>
            
            <!-- Graph Background Grid -->
            <rect x="150" y="280" width="550" height="160" fill="url(#grid)"/>

            <!-- Axes -->
            <line x1="150" y1="360" x2="720" y2="360" stroke="#ADB5BD" stroke-width="2"/> <!-- Time Axis -->
            <line x1="150" y1="270" x2="150" y2="450" stroke="#ADB5BD" stroke-width="2"/> <!-- Disp Axis -->
            
            <!-- Axis Labels -->
            <text x="710" y="350" font-size="12" fill="#495057" text-anchor="end">Time (t) →</text>
            <text x="140" y="285" font-size="12" fill="#495057" text-anchor="end">Displacement (x)</text>
            
            <text x="140" y="285" font-size="12" fill="#6C757D" class="math" text-anchor="end">+A</text>
            <text x="140" y="364" font-size="12" fill="#6C757D" class="math" text-anchor="end">0</text>
            <text x="140" y="445" font-size="12" fill="#6C757D" class="math" text-anchor="end">-A</text>

            <!-- Wave Path -->
            <path id="wave-path" d="" fill="none" stroke="#4361EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Current Time Indicator -->
            <line id="current-time-line" x1="700" y1="280" x2="700" y2="440" stroke="#FF3366" stroke-width="1" stroke-dasharray="4,4" opacity="0.5"/>
            <circle id="wave-particle" cx="700" cy="360" r="6" fill="#4361EE"/>
            <circle id="wave-pulse" cx="700" cy="360" r="6" fill="none" stroke="#4361EE" stroke-width="2">
                <animate attributeName="r" values="6;14" dur="1s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="1;0" dur="1s" repeatCount="indefinite"/>
            </circle>
        </g>

    </svg>
</div>

<script>
    // Physics Constants
    const A = 80; // Amplitude in pixels
    const T = 4; // Period in seconds
    const omega = (2 * Math.PI) / T; // Angular frequency
    
    // Layout Constants
    const ucmCenter = { x: 200, y: 150 };
    const linCenter = { x: 600, y: 150 };
    const graphOrigin = { x: 150, y: 360 };
    const graphWidth = 550;
    const graphTimeWindow = 4; // Display last 4 seconds on graph

    // DOM Elements
    const els = {
        ucmParticle: document.getElementById('ucm-particle'),
        ucmProjLine: document.getElementById('ucm-proj-line'),
        ucmProjDot: document.getElementById('ucm-proj-dot'),
        ucmVecX: document.getElementById('ucm-vec-x'),
        ucmVecV: document.getElementById('ucm-vec-v'),
        ucmVecF: document.getElementById('ucm-vec-f'),
        
        linParticle: document.getElementById('lin-particle'),
        linVecX: document.getElementById('lin-vec-x'),
        linVecV: document.getElementById('lin-vec-v'),
        linVecF: document.getElementById('lin-vec-f'),
        springPath: document.getElementById('spring-path'),
        
        labelV: document.getElementById('label-v'),
        labelF: document.getElementById('label-f'),
        
        eqX: document.getElementById('eq-x'),
        eqV: document.getElementById('eq-v'),
        eqF: document.getElementById('eq-f'),
        
        wavePath: document.getElementById('wave-path'),
        waveParticle: document.getElementById('wave-particle'),
        wavePulse: document.getElementById('wave-pulse')
    };

    let startTime = null;
    let waveData = [];

    function updateVector(el, x1, y1, x2, y2, labelEl = null, labelOffset = 15) {
        const len = Math.hypot(x2 - x1, y2 - y1);
        if (len < 2) {
            el.setAttribute('opacity', '0');
            if (labelEl) labelEl.setAttribute('opacity', '0');
        } else {
            el.setAttribute('opacity', '1');
            el.setAttribute('x1', x1);
            el.setAttribute('y1', y1);
            el.setAttribute('x2', x2);
            el.setAttribute('y2', y2);
            
            if (labelEl) {
                labelEl.setAttribute('opacity', '1');
                const nx = (x2 - x1) / len;
                const ny = (y2 - y1) / len;
                labelEl.setAttribute('x', x2 + nx * labelOffset);
                labelEl.setAttribute('y', y2 + ny * labelOffset + 5);
            }
        }
    }

    function drawSpring(endX) {
        const startX = 470;
        const y = linCenter.y;
        const coils = 12;
        const width = endX - startX - 10; // -10 to attach to edge of particle
        const step = width / coils;
        
        let path = `M ${startX} ${y} `;
        for (let i = 1; i <= coils; i++) {
            const sign = (i % 2 === 0) ? 1 : -1;
            const px = startX + i * step - step / 2;
            const py = y + sign * 12;
            path += `L ${px} ${py} `;
            if (i === coils) {
                path += `L ${startX + width} ${y}`;
            }
        }
        els.springPath.setAttribute('d', path);
    }

    function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const t = (timestamp - startTime) / 1000; // Time in seconds
        const theta = omega * t;

        // 1. Calculate Core Physics Variables
        const x_disp = A * Math.cos(theta);
        const y_disp = -A * Math.sin(theta); // Negative because SVG y-axis is inverted

        // Visual scaling for vectors to fit nicely in the diagram
        const v_scale = 0.8;
        const f_scale = 0.8;
        
        const vx = -A * omega * Math.sin(theta) * v_scale;
        const vy = -A * omega * Math.cos(theta) * v_scale;
        
        const fx = -A * Math.cos(theta) * f_scale;
        const fy = A * Math.sin(theta) * f_scale;

        // 2. Update UCM (Reference Circle)
        const ucmX = ucmCenter.x + x_disp;
        const ucmY = ucmCenter.y + y_disp;
        
        els.ucmParticle.setAttribute('cx', ucmX);
        els.ucmParticle.setAttribute('cy', ucmY);
        
        els.ucmProjLine.setAttribute('x1', ucmX);
        els.ucmProjLine.setAttribute('y1', ucmY);
        els.ucmProjLine.setAttribute('x2', ucmX);
        els.ucmProjLine.setAttribute('y2', ucmCenter.y);
        els.ucmProjDot.setAttribute('cx', ucmX);

        updateVector(els.ucmVecX, ucmCenter.x, ucmCenter.y, ucmX, ucmY);
        updateVector(els.ucmVecV, ucmX, ucmY, ucmX + vx, ucmY + vy);
        updateVector(els.ucmVecF, ucmX, ucmY, ucmX + fx, ucmY + fy);

        // 3. Update Linear Oscillator (SHM)
        const linX = linCenter.x + x_disp;
        
        els.linParticle.setAttribute('cx', linX);
        
        updateVector(els.linVecX, linCenter.x, linCenter.y, linX, linCenter.y);
        updateVector(els.linVecV, linX, linCenter.y, linX + vx, linCenter.y, els.labelV, 15);
        updateVector(els.linVecF, linX, linCenter.y, linX + fx, linCenter.y, els.labelF, 15);
        
        drawSpring(linX);

        // 4. Update Wave Plot (Scrolling Graph)
        waveData.push({ t: t, x: x_disp });
        // Retain only data within the time window
        waveData = waveData.filter(d => t - d.t <= graphTimeWindow);

        let pathStr = "";
        waveData.forEach((d, i) => {
            // Map time to x-coordinate (newest is on the right)
            const px = graphOrigin.x + ((d.t - (t - graphTimeWindow)) / graphTimeWindow) * graphWidth;
            const py = graphOrigin.y - d.x; // Subtract because SVG y is inverted
            if (i === 0) pathStr += `M ${px} ${py} `;
            else pathStr += `L ${px} ${py} `;
        });
        els.wavePath.setAttribute('d', pathStr);

        // Update current wave particle position
        const currentPx = graphOrigin.x + graphWidth;
        const currentPy = graphOrigin.y - x_disp;
        els.waveParticle.setAttribute('cx', currentPx);
        els.waveParticle.setAttribute('cy', currentPy);
        els.wavePulse.setAttribute('cx', currentPx);
        els.wavePulse.setAttribute('cy', currentPy);

        // 5. Update Dynamic Equations
        // Normalize values for display (-1.0 to 1.0 range based on Amplitude)
        const normX = (x_disp / A).toFixed(2);
        const normV = (-Math.sin(theta)).toFixed(2);
        const normF = (-Math.cos(theta)).toFixed(2);
        
        els.eqX.textContent = `x = ${normX > 0 ? '+' : ''}${normX} A`;
        els.eqV.textContent = `v = ${normV > 0 ? '+' : ''}${normV} v_max`;
        els.eqF.textContent = `F = ${normF > 0 ? '+' : ''}${normF} F_max`;

        // Loop
        requestAnimationFrame(animate);
    }

    // Start Animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
