<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutherford Alpha Particle Scattering</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Core Animations */
        @keyframes movePass {
            0%, 12.5% { offset-distance: 0%; animation-timing-function: ease-out; }
            50% { offset-distance: 50%; animation-timing-function: ease-in; }
            87.5%, 100% { offset-distance: 100%; }
        }

        @keyframes moveBounce {
            0%, 12.5% { offset-distance: 0%; animation-timing-function: ease-out; }
            50% { offset-distance: 100%; animation-timing-function: ease-in; }
            87.5%, 100% { offset-distance: 0%; }
        }

        /* Velocity Vector Scaling (Speed) */
        @keyframes scaleVelPass {
            0%, 12.5% { transform: scaleX(1); }
            50% { transform: scaleX(0.4); }
            87.5%, 100% { transform: scaleX(1); }
        }

        @keyframes scaleVelBounce {
            0%, 12.5% { transform: scaleX(1) rotate(0deg); }
            49% { transform: scaleX(0.05) rotate(0deg); }
            50% { transform: scaleX(0) rotate(0deg); }
            51% { transform: scaleX(0.05) rotate(180deg); }
            87.5%, 100% { transform: scaleX(1) rotate(180deg); }
        }

        /* Force Vector Rotations and Scaling (1/r^2) */
        @keyframes forceP1 {
            0%, 12.5% { transform: rotate(199deg) scaleX(0.1); }
            50% { transform: rotate(270deg) scaleX(0.7); }
            87.5%, 100% { transform: rotate(305deg) scaleX(0.1); }
        }

        @keyframes forceP2 {
            0%, 12.5% { transform: rotate(190deg) scaleX(0.1); }
            50% { transform: rotate(248deg) scaleX(1.1); }
            87.5%, 100% { transform: rotate(282deg) scaleX(0.1); }
        }

        @keyframes forceP3 {
            0%, 12.5% { transform: rotate(186deg) scaleX(0.1); }
            50% { transform: rotate(221deg) scaleX(2.0); }
            87.5%, 100% { transform: rotate(262deg) scaleX(0.1); }
        }

        @keyframes forceP4 {
            0%, 12.5% { transform: rotate(180deg) scaleX(0.1); }
            50% { transform: rotate(180deg) scaleX(2.8); }
            87.5%, 100% { transform: rotate(180deg) scaleX(0.1); }
        }

        @keyframes forceP5 {
            0%, 12.5% { transform: rotate(170deg) scaleX(0.1); }
            50% { transform: rotate(111deg) scaleX(1.1); }
            87.5%, 100% { transform: rotate(77deg) scaleX(0.1); }
        }

        /* Annotations Fade In/Out */
        @keyframes fadeInOut {
            0%, 65% { opacity: 0; }
            70%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Class Assignments */
        .path-pass { animation: movePass 8s linear infinite; }
        .path-bounce { animation: moveBounce 8s linear infinite; }
        
        .vel-pass { animation: scaleVelPass 8s linear infinite; transform-origin: 0 0; }
        .vel-bounce { animation: scaleVelBounce 8s linear infinite; transform-origin: 0 0; }
        
        .f1 { animation: forceP1 8s linear infinite; transform-origin: 0 0; }
        .f2 { animation: forceP2 8s linear infinite; transform-origin: 0 0; }
        .f3 { animation: forceP3 8s linear infinite; transform-origin: 0 0; }
        .f4 { animation: forceP4 8s linear infinite; transform-origin: 0 0; }
        .f5 { animation: forceP5 8s linear infinite; transform-origin: 0 0; }

        .annotation { animation: fadeInOut 8s linear infinite; }

        .trajectory {
            fill: none;
            stroke: #ced4da;
            stroke-width: 2;
            stroke-dasharray: 6, 4;
        }

        .alpha-particle {
            fill: #FF3366;
            filter: drop-shadow(0px 0px 3px rgba(255, 51, 102, 0.6));
        }

        .vel-vec {
            stroke: #06D6A0;
            stroke-width: 3;
            stroke-linecap: round;
        }

        .force-vec {
            stroke: #4361EE;
            stroke-width: 3;
            stroke-linecap: round;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Velocity -->
            <marker id="arrowVel" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            
            <!-- Arrowhead for Force -->
            <marker id="arrowForce" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#4361EE" />
            </marker>

            <!-- Gradient for Gold Nucleus -->
            <radialGradient id="goldGrad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FFF59D" />
                <stop offset="40%" stop-color="#FFD700" />
                <stop offset="100%" stop-color="#F57F17" />
            </radialGradient>

            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">Rutherford Scattering: α-Particle Trajectories</text>
        <text x="400" y="60" text-anchor="middle" font-size="14" fill="#6c757d">Microscopic view of Coulombic repulsion and hyperbolic deflection</text>

        <!-- Trajectories (Dashed Background Lines) -->
        <path d="M 0 110 L 300 110 Q 420 110 480 60 L 624 -60" class="trajectory" />
        <path d="M 0 180 L 280 180 Q 380 180 410 100 L 466 -50" class="trajectory" />
        <path d="M 0 210 L 280 210 Q 360 210 360 130 L 360 -50" class="trajectory" />
        <path d="M 0 250 L 320 250" class="trajectory" />
        <path d="M 0 320 L 280 320 Q 380 320 410 400 L 466 550" class="trajectory" />

        <!-- Annotations (Fade In/Out) -->
        <g class="annotation">
            <!-- Impact Parameter (b) -->
            <line x1="400" y1="250" x2="400" y2="180" stroke="#495057" stroke-width="2" stroke-dasharray="4,4" />
            <text x="408" y="220" font-size="16" font-style="italic" fill="#495057">b</text>
            
            <!-- Distance of Closest Approach (d) -->
            <line x1="320" y1="250" x2="400" y2="250" stroke="#495057" stroke-width="2" />
            <line x1="320" y1="245" x2="320" y2="255" stroke="#495057" stroke-width="2" />
            <text x="355" y="242" font-size="16" font-style="italic" fill="#495057">d</text>

            <!-- Scattering Angle (θ) -->
            <line x1="280" y1="180" x2="520" y2="180" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4" />
            <path d="M 470 180 A 60 60 0 0 0 435 130" fill="none" stroke="#495057" stroke-width="2" />
            <text x="465" y="150" font-size="16" font-style="italic" fill="#495057">θ</text>
        </g>

        <!-- Nucleus -->
        <g transform="translate(400, 250)">
            <circle cx="0" cy="0" r="25" fill="url(#goldGrad)" stroke="#E6C200" stroke-width="2" filter="url(#glow)" />
            <text x="0" y="6" text-anchor="middle" font-size="20" font-weight="bold" fill="#B7950B">+</text>
            <text x="0" y="45" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">
                <tspan font-size="10" dy="-5">197</tspan>
                <tspan font-size="10" dy="10" dx="-18">79</tspan>
                <tspan font-size="14" dy="-5" dx="2">Au Nucleus</tspan>
            </text>
        </g>

        <!-- Particle 1 (Large b, top) -->
        <g class="path-pass" style="offset-path: path('M 0 110 L 300 110 Q 420 110 480 60 L 624 -60'); offset-rotate: auto;">
            <line x1="0" y1="0" x2="40" y2="0" class="vel-vec vel-pass" marker-end="url(#arrowVel)" />
        </g>
        <g class="path-pass" style="offset-path: path('M 0 110 L 300 110 Q 420 110 480 60 L 624 -60'); offset-rotate: 0deg;">
            <line x1="0" y1="0" x2="40" y2="0" class="force-vec f1" marker-end="url(#arrowForce)" />
            <circle cx="0" cy="0" r="5" class="alpha-particle" />
        </g>

        <!-- Particle 2 (Medium b, top) -->
        <g class="path-pass" style="offset-path: path('M 0 180 L 280 180 Q 380 180 410 100 L 466 -50'); offset-rotate: auto;">
            <line x1="0" y1="0" x2="40" y2="0" class="vel-vec vel-pass" marker-end="url(#arrowVel)" />
        </g>
        <g class="path-pass" style="offset-path: path('M 0 180 L 280 180 Q 380 180 410 100 L 466 -50'); offset-rotate: 0deg;">
            <line x1="0" y1="0" x2="40" y2="0" class="force-vec f2" marker-end="url(#arrowForce)" />
            <circle cx="0" cy="0" r="5" class="alpha-particle" />
        </g>

        <!-- Particle 3 (Small b, top) -->
        <g class="path-pass" style="offset-path: path('M 0 210 L 280 210 Q 360 210 360 130 L 360 -50'); offset-rotate: auto;">
            <line x1="0" y1="0" x2="40" y2="0" class="vel-vec vel-pass" marker-end="url(#arrowVel)" />
        </g>
        <g class="path-pass" style="offset-path: path('M 0 210 L 280 210 Q 360 210 360 130 L 360 -50'); offset-rotate: 0deg;">
            <line x1="0" y1="0" x2="40" y2="0" class="force-vec f3" marker-end="url(#arrowForce)" />
            <circle cx="0" cy="0" r="5" class="alpha-particle" />
        </g>

        <!-- Particle 4 (Head-on, b=0) -->
        <g class="path-bounce" style="offset-path: path('M 0 250 L 320 250'); offset-rotate: auto;">
            <line x1="0" y1="0" x2="40" y2="0" class="vel-vec vel-bounce" marker-end="url(#arrowVel)" />
        </g>
        <g class="path-bounce" style="offset-path: path('M 0 250 L 320 250'); offset-rotate: 0deg;">
            <line x1="0" y1="0" x2="40" y2="0" class="force-vec f4" marker-end="url(#arrowForce)" />
            <circle cx="0" cy="0" r="5" class="alpha-particle" />
        </g>

        <!-- Particle 5 (Medium b, bottom) -->
        <g class="path-pass" style="offset-path: path('M 0 320 L 280 320 Q 380 320 410 400 L 466 550'); offset-rotate: auto;">
            <line x1="0" y1="0" x2="40" y2="0" class="vel-vec vel-pass" marker-end="url(#arrowVel)" />
        </g>
        <g class="path-pass" style="offset-path: path('M 0 320 L 280 320 Q 380 320 410 400 L 466 550'); offset-rotate: 0deg;">
            <line x1="0" y1="0" x2="40" y2="0" class="force-vec f5" marker-end="url(#arrowForce)" />
            <circle cx="0" cy="0" r="5" class="alpha-particle" />
        </g>

        <!-- Legend -->
        <g transform="translate(20, 390)" font-size="13" fill="#212529">
            <rect x="0" y="0" width="180" height="90" fill="#ffffff" rx="6" stroke="#dee2e6" stroke-width="1" />
            <circle cx="20" cy="25" r="5" class="alpha-particle" />
            <text x="35" y="30" font-weight="600">α-particle (He²⁺)</text>
            
            <line x1="10" y1="50" x2="25" y2="50" class="vel-vec" marker-end="url(#arrowVel)" />
            <text x="35" y="54">Velocity Vector (v)</text>
            
            <line x1="10" y1="75" x2="25" y2="75" class="force-vec" marker-end="url(#arrowForce)" />
            <text x="35" y="79">Coulomb Force (F<tspan dy="3" font-size="10">e</tspan>)</text>
        </g>

        <!-- Formula Overlay -->
        <g transform="translate(610, 400)" font-family="'Roboto Mono', monospace" font-size="15" fill="#212529">
            <rect x="-15" y="-15" width="185" height="70" fill="#ffffff" rx="6" stroke="#dee2e6" stroke-width="1" />
            <text x="0" y="25">F = </text>
            
            <!-- Fraction 1 -->
            <text x="45" y="12">1</text>
            <line x1="35" y1="18" x2="65" y2="18" stroke="#212529" stroke-width="1.5" />
            <text x="35" y="36">4πε₀</text>
            
            <!-- Fraction 2 -->
            <text x="90" y="12">q₁q₂</text>
            <line x1="80" y1="18" x2="130" y2="18" stroke="#212529" stroke-width="1.5" />
            <text x="100" y="36">r²</text>
        </g>

    </svg>
</div>

</body>
</html>
