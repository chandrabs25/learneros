<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shear Stress and Strain in a Viscous Fluid</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        :root {
            --red: #FF3366;
            --blue: #4361EE;
            --green: #06D6A0;
            --cyan: #00B4D8;
            --cyan-trans: rgba(0, 180, 216, 0.3);
            --dark: #333333;
            --bg: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: var(--dark); }
        .label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 16px; fill: var(--dark); }
        .math { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; }
        .math-small { font-family: 'Roboto Mono', monospace; font-weight: 400; font-size: 14px; }

        /* Animations */
        .fluid-block {
            transform-origin: 200px 400px;
            animation: skewFluid 8s infinite ease-in-out;
        }

        .top-plate-group {
            animation: moveTop 8s infinite ease-in-out;
        }

        .force-arrow {
            animation: fadeForce 8s infinite ease-in-out;
        }

        /* Velocity Arrows */
        .v-shaft-1 { animation: scaleShaft1 8s infinite ease-in-out; }
        .v-head-1 { animation: moveHead1 8s infinite ease-in-out; }
        .v-shaft-2 { animation: scaleShaft2 8s infinite ease-in-out; }
        .v-head-2 { animation: moveHead2 8s infinite ease-in-out; }
        .v-shaft-3 { animation: scaleShaft3 8s infinite ease-in-out; }
        .v-head-3 { animation: moveHead3 8s infinite ease-in-out; }
        .v-shaft-4 { animation: scaleShaft4 8s infinite ease-in-out; }
        .v-head-4 { animation: moveHead4 8s infinite ease-in-out; }
        .v-label { animation: moveLabelV 8s infinite ease-in-out; }

        /* Displacement Markers */
        .dx-shaft { animation: scaleDx 8s infinite ease-in-out; }
        .dx-moving { animation: moveDxCap 8s infinite ease-in-out; }
        .dx-label { animation: moveDxLabel 8s infinite ease-in-out; }

        /* Hold Phase Highlights */
        .fade-hold { animation: fadeHold 8s infinite ease-in-out; }
        .formula-bg { animation: highlightFormulaBg 8s infinite ease-in-out; }

        /* Keyframes */
        @keyframes skewFluid {
            0%, 25% { transform: skewX(0deg); }
            62.5%, 87.5% { transform: skewX(-26.565deg); }
            100% { transform: skewX(0deg); }
        }

        @keyframes moveTop {
            0%, 25% { transform: translateX(0); }
            62.5%, 87.5% { transform: translateX(100px); }
            100% { transform: translateX(0); }
        }

        @keyframes fadeForce {
            0%, 12.5% { opacity: 0; }
            25%, 87.5% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Arrow 1: y=200, Max Length=100 (Shaft 92, Head 8) */
        @keyframes scaleShaft1 {
            0%, 25% { transform: translate(200px, 200px) scaleX(0); }
            62.5%, 87.5% { transform: translate(200px, 200px) scaleX(92); }
            100% { transform: translate(200px, 200px) scaleX(0); }
        }
        @keyframes moveHead1 {
            0%, 25% { transform: translate(200px, 200px) scale(0); }
            28% { transform: translate(208px, 200px) scale(1); }
            62.5%, 87.5% { transform: translate(292px, 200px) scale(1); }
            100% { transform: translate(200px, 200px) scale(0); }
        }
        @keyframes moveLabelV {
            0%, 25% { transform: translate(210px, 190px); opacity: 0; }
            28% { opacity: 1; }
            62.5%, 87.5% { transform: translate(302px, 190px); opacity: 1; }
            100% { transform: translate(210px, 190px); opacity: 0; }
        }

        /* Arrow 2: y=250, Max Length=75 (Shaft 67, Head 8) */
        @keyframes scaleShaft2 {
            0%, 25% { transform: translate(200px, 250px) scaleX(0); }
            62.5%, 87.5% { transform: translate(200px, 250px) scaleX(67); }
            100% { transform: translate(200px, 250px) scaleX(0); }
        }
        @keyframes moveHead2 {
            0%, 25% { transform: translate(200px, 250px) scale(0); }
            28% { transform: translate(206px, 250px) scale(1); }
            62.5%, 87.5% { transform: translate(267px, 250px) scale(1); }
            100% { transform: translate(200px, 250px) scale(0); }
        }

        /* Arrow 3: y=300, Max Length=50 (Shaft 42, Head 8) */
        @keyframes scaleShaft3 {
            0%, 25% { transform: translate(200px, 300px) scaleX(0); }
            62.5%, 87.5% { transform: translate(200px, 300px) scaleX(42); }
            100% { transform: translate(200px, 300px) scaleX(0); }
        }
        @keyframes moveHead3 {
            0%, 25% { transform: translate(200px, 300px) scale(0); }
            28% { transform: translate(204px, 300px) scale(1); }
            62.5%, 87.5% { transform: translate(242px, 300px) scale(1); }
            100% { transform: translate(200px, 300px) scale(0); }
        }

        /* Arrow 4: y=350, Max Length=25 (Shaft 17, Head 8) */
        @keyframes scaleShaft4 {
            0%, 25% { transform: translate(200px, 350px) scaleX(0); }
            62.5%, 87.5% { transform: translate(200px, 350px) scaleX(17); }
            100% { transform: translate(200px, 350px) scaleX(0); }
        }
        @keyframes moveHead4 {
            0%, 25% { transform: translate(200px, 350px) scale(0); }
            28% { transform: translate(202px, 350px) scale(1); }
            62.5%, 87.5% { transform: translate(217px, 350px) scale(1); }
            100% { transform: translate(200px, 350px) scale(0); }
        }

        /* Displacement Animations */
        @keyframes scaleDx {
            0%, 25% { transform: translate(200px, 160px) scaleX(0); opacity: 0; }
            26% { opacity: 1; }
            62.5%, 87.5% { transform: translate(200px, 160px) scaleX(100); opacity: 1; }
            100% { transform: translate(200px, 160px) scaleX(0); opacity: 0; }
        }
        @keyframes moveDxCap {
            0%, 25% { transform: translateX(0); opacity: 0; }
            26% { opacity: 1; }
            62.5%, 87.5% { transform: translateX(100px); opacity: 1; }
            100% { transform: translateX(0); opacity: 0; }
        }
        @keyframes moveDxLabel {
            0%, 25% { transform: translate(200px, 150px); opacity: 0; }
            26% { opacity: 1; }
            62.5%, 87.5% { transform: translate(250px, 150px); opacity: 1; }
            100% { transform: translate(200px, 150px); opacity: 0; }
        }

        /* Hold Phase Animations */
        @keyframes fadeHold {
            0%, 60% { opacity: 0; }
            65%, 87.5% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes highlightFormulaBg {
            0%, 60% { stroke: #e0e0e0; stroke-width: 1; }
            65%, 87.5% { stroke: var(--cyan); stroke-width: 2; }
            100% { stroke: #e0e0e0; stroke-width: 1; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <title>Shear Stress and Strain in a Viscous Fluid</title>
        <desc>An animation showing a fluid block deforming under a shear force, illustrating the no-slip condition, linear velocity gradient, and resulting shear strain angle.</desc>

        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <polygon points="0,1 10,5 0,9" fill="var(--red)" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <polygon points="0,1 10,5 0,9" fill="var(--green)" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="var(--bg)" rx="12" />

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" class="title">Shear Stress and Strain in Fluids</text>

        <!-- Static Background Elements -->
        <g id="static-markers">
            <!-- Original position dashed line -->
            <line x1="200" y1="400" x2="200" y2="200" stroke="#999" stroke-width="2" stroke-dasharray="6,6" />
            
            <!-- Height l dimension -->
            <line x1="160" y1="200" x2="160" y2="400" stroke="var(--dark)" stroke-width="1" />
            <line x1="155" y1="200" x2="165" y2="200" stroke="var(--dark)" stroke-width="1" />
            <line x1="155" y1="400" x2="165" y2="400" stroke="var(--dark)" stroke-width="1" />
            <line x1="160" y1="200" x2="200" y2="200" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3" />
            <line x1="160" y1="400" x2="200" y2="400" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3" />
            <text x="145" y="305" text-anchor="end" class="math">l</text>
        </g>

        <!-- Animated Fluid Block -->
        <rect x="200" y="200" width="400" height="200" fill="var(--cyan-trans)" stroke="var(--cyan)" stroke-width="2" class="fluid-block" />

        <!-- Bottom Plate (Fixed) -->
        <line x1="150" y1="400" x2="750" y2="400" stroke="var(--dark)" stroke-width="8" stroke-linecap="round" />
        <!-- Hatching for fixed plate -->
        <path d="M 160 404 L 150 414 M 180 404 L 170 414 M 200 404 L 190 414 M 220 404 L 210 414 M 240 404 L 230 414 M 260 404 L 250 414 M 280 404 L 270 414 M 300 404 L 290 414 M 320 404 L 310 414 M 340 404 L 330 414 M 360 404 L 350 414 M 380 404 L 370 414 M 400 404 L 390 414 M 420 404 L 410 414 M 440 404 L 430 414 M 460 404 L 450 414 M 480 404 L 470 414 M 500 404 L 490 414 M 520 404 L 510 414 M 540 404 L 530 414 M 560 404 L 550 414 M 580 404 L 570 414 M 600 404 L 590 414 M 620 404 L 610 414 M 640 404 L 630 414 M 660 404 L 650 414 M 680 404 L 670 414 M 700 404 L 690 414 M 720 404 L 710 414 M 740 404 L 730 414" stroke="#999" stroke-width="1" />

        <!-- Top Plate Group (Moving) -->
        <g class="top-plate-group">
            <line x1="180" y1="200" x2="620" y2="200" stroke="var(--dark)" stroke-width="8" stroke-linecap="round" />
            <text x="400" y="188" text-anchor="middle" class="math">Area A</text>
            
            <!-- Force Arrow -->
            <g class="force-arrow">
                <line x1="620" y1="180" x2="700" y2="180" stroke="var(--red)" stroke-width="4" marker-end="url(#arrow-red)" />
                <text x="660" y="170" text-anchor="middle" fill="var(--red)" class="math">F</text>
            </g>
        </g>

        <!-- Velocity Gradient Arrows -->
        <g id="velocity-arrows">
            <!-- Arrow 1 (Top) -->
            <line x1="0" y1="0" x2="1" y2="0" stroke="var(--green)" stroke-width="2" class="v-shaft-1" />
            <polygon points="0,-4 8,0 0,4" fill="var(--green)" class="v-head-1" />
            <text class="v-label math" fill="var(--green)">v</text>

            <!-- Arrow 2 -->
            <line x1="0" y1="0" x2="1" y2="0" stroke="var(--green)" stroke-width="2" class="v-shaft-2" />
            <polygon points="0,-4 8,0 0,4" fill="var(--green)" class="v-head-2" />

            <!-- Arrow 3 -->
            <line x1="0" y1="0" x2="1" y2="0" stroke="var(--green)" stroke-width="2" class="v-shaft-3" />
            <polygon points="0,-4 8,0 0,4" fill="var(--green)" class="v-head-3" />

            <!-- Arrow 4 -->
            <line x1="0" y1="0" x2="1" y2="0" stroke="var(--green)" stroke-width="2" class="v-shaft-4" />
            <polygon points="0,-4 8,0 0,4" fill="var(--green)" class="v-head-4" />
        </g>

        <!-- Displacement Delta x -->
        <g id="displacement-markers">
            <!-- Static left cap and dashed line -->
            <line x1="200" y1="155" x2="200" y2="165" stroke="var(--dark)" stroke-width="1" class="fade-hold" />
            <line x1="200" y1="200" x2="200" y2="155" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3" />
            
            <!-- Moving right cap and dashed line -->
            <g class="dx-moving">
                <line x1="200" y1="155" x2="200" y2="165" stroke="var(--dark)" stroke-width="1" />
                <line x1="200" y1="200" x2="200" y2="155" stroke="#aaa" stroke-width="1" stroke-dasharray="3,3" />
            </g>
            
            <!-- Expanding shaft -->
            <line x1="0" y1="0" x2="1" y2="0" stroke="var(--dark)" stroke-width="1" class="dx-shaft" />
            
            <!-- Label -->
            <text text-anchor="middle" class="dx-label math">Δx</text>
        </g>

        <!-- Angle Theta -->
        <g class="fade-hold">
            <path d="M 200 360 A 40 40 0 0 1 217.88 364.22" fill="none" stroke="var(--dark)" stroke-width="1.5" />
            <text x="212" y="385" class="math">θ</text>
        </g>

        <!-- Formula Overlay -->
        <g id="formula-overlay" transform="translate(220, 425)">
            <rect x="0" y="0" width="360" height="60" rx="6" fill="#ffffff" class="formula-bg" />
            <text x="180" y="24" text-anchor="middle" class="math-small" fill="var(--dark)">Shear Stress (τ) = F / A</text>
            <text x="180" y="46" text-anchor="middle" class="math-small" fill="var(--dark)">Shear Strain = Δx / l = tan(θ) ≈ θ</text>
        </g>

        <!-- Legend -->
        <g id="legend" transform="translate(630, 20)">
            <rect x="0" y="0" width="140" height="85" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
            
            <line x1="10" y1="20" x2="30" y2="20" stroke="var(--red)" stroke-width="3" marker-end="url(#arrow-red)" />
            <text x="45" y="24" class="label" font-size="13">Force (F)</text>
            
            <line x1="10" y1="45" x2="30" y2="45" stroke="var(--green)" stroke-width="3" marker-end="url(#arrow-green)" />
            <text x="45" y="49" class="label" font-size="13">Velocity (v)</text>
            
            <rect x="10" y="62" width="20" height="12" fill="var(--cyan-trans)" stroke="var(--cyan)" stroke-width="1" />
            <text x="45" y="73" class="label" font-size="13">Fluid Block</text>
        </g>

    </svg>

</body>
</html>
