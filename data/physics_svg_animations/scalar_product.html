<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scalar Product Animated Diagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            width: 100%;
            max-width: 900px;
            background: #f8f9fa;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .controls {
            position: absolute;
            bottom: 24px;
            right: 24px;
        }

        button {
            background: #4361EE;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.3);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #3651D4;
        }

        button:active {
            transform: translateY(2px);
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

    <div class="diagram-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Animated diagram showing the scalar product of two vectors</title>
            <desc>Vector B rotates from 0 to 180 degrees relative to Vector A, demonstrating how the projection B cos(theta) and the dot product change.</desc>

            <!-- Definitions for Markers and Patterns -->
            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9ECEF" stroke-width="1"/>
                </pattern>

                <!-- Arrowheads -->
                <marker id="arrowBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
                </marker>
                <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
                </marker>
                <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
                </marker>
            </defs>

            <!-- Background & Grid -->
            <rect width="100%" height="100%" fill="#f8f9fa" />
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- Title and Subtitle -->
            <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#212529">
                Scalar Product: <tspan font-style="italic">A</tspan> · <tspan font-style="italic">B</tspan> = |<tspan font-style="italic">A</tspan>| |<tspan font-style="italic">B</tspan>| cos θ
            </text>
            <text x="400" y="70" text-anchor="middle" font-size="14" fill="#6C757D">
                Geometric interpretation of the dot product as a projection
            </text>

            <!-- Legend -->
            <rect x="610" y="90" width="170" height="110" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" rx="8" shadow="0 4px 6px rgba(0,0,0,0.05)"/>
            <line x1="625" y1="110" x2="655" y2="110" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowBlue)"/>
            <text x="665" y="115" font-size="13" font-weight="600" fill="#495057">Vector <tspan font-style="italic">A</tspan> (Area)</text>
            
            <line x1="625" y1="145" x2="655" y2="145" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
            <text x="665" y="150" font-size="13" font-weight="600" fill="#495057">Vector <tspan font-style="italic">B</tspan> (Field)</text>
            
            <line x1="625" y1="180" x2="655" y2="180" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
            <text x="665" y="185" font-size="13" font-weight="600" fill="#495057">Projection</text>

            <!-- Flux Surface Analogy (Isometric Plane) -->
            <polygon points="270,190 230,240 230,440 270,390" fill="rgba(0, 180, 216, 0.15)" stroke="#00B4D8" stroke-width="2" stroke-linejoin="round"/>
            <text x="250" y="180" text-anchor="middle" font-size="12" font-weight="600" fill="#00B4D8">Surface</text>

            <!-- Coordinate Axis Baseline (Subtle) -->
            <line x1="50" y1="340" x2="750" y2="340" stroke="#DEE2E6" stroke-width="1" />

            <!-- Dynamic Elements Group -->
            <g id="diagramGroup">
                <!-- Angle Arc -->
                <path id="angleArc" d="" fill="rgba(255, 51, 102, 0.1)" stroke="#212529" stroke-width="1.5"/>
                <text id="angleText" x="0" y="0" text-anchor="middle" font-size="14" font-weight="600" fill="#212529">0°</text>

                <!-- Projection Line (Dashed) -->
                <line id="projLine" x1="250" y1="340" x2="250" y2="340" stroke="#6C757D" stroke-width="2" stroke-dasharray="6,4"/>

                <!-- Vector A (Base) -->
                <line x1="250" y1="340" x2="600" y2="340" stroke="#4361EE" stroke-width="4" marker-end="url(#arrowBlue)"/>
                <text x="590" y="325" font-size="18" font-weight="700" font-style="italic" fill="#4361EE">A</text>

                <!-- Projection Component (Green) -->
                <line id="projComp" x1="250" y1="340" x2="450" y2="340" stroke="#06D6A0" stroke-width="6" marker-end="url(#arrowGreen)"/>
                <text id="compLabel" x="350" y="365" text-anchor="middle" font-size="15" font-weight="600" fill="#06D6A0">
                    <tspan font-style="italic">B</tspan> cos θ
                </text>

                <!-- Vector B (Rotating) -->
                <line id="vecB" x1="250" y1="340" x2="450" y2="340" stroke="#FF3366" stroke-width="4" marker-end="url(#arrowRed)"/>
                <text id="labelB" x="460" y="330" font-size="18" font-weight="700" font-style="italic" fill="#FF3366">B</text>
                
                <!-- Origin Point -->
                <circle cx="250" cy="340" r="4" fill="#212529" />
            </g>

            <!-- Dynamic Formula Readout Box -->
            <rect x="150" y="420" width="500" height="60" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" rx="8" shadow="0 4px 12px rgba(0,0,0,0.05)"/>
            <text id="formulaText" class="math-text" x="400" y="456" text-anchor="middle" font-size="18" fill="#495057">
                Loading...
            </text>
        </svg>

        <div class="controls">
            <button id="playPauseBtn">Pause Animation</button>
        </div>
    </div>

    <script>
        // Physics and Geometry Constants
        const cx = 250;
        const cy = 340;
        const lenA = 350;
        const lenB = 220;
        const magA = 10.0;
        const magB = 5.0;

        // DOM Elements
        const vecB = document.getElementById('vecB');
        const projLine = document.getElementById('projLine');
        const projComp = document.getElementById('projComp');
        const angleArc = document.getElementById('angleArc');
        const angleText = document.getElementById('angleText');
        const compLabel = document.getElementById('compLabel');
        const formulaText = document.getElementById('formulaText');
        const labelB = document.getElementById('labelB');
        const playPauseBtn = document.getElementById('playPauseBtn');

        // Animation State
        let isPlaying = true;
        let startTime = null;
        let pausedTime = 0;

        // Easing Function (Cubic In-Out)
        function easeInOutCubic(x) {
            return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
        }

        // Main Animation Loop
        function animate(timestamp) {
            if (!startTime) startTime = timestamp - pausedTime;
            
            if (isPlaying) {
                let elapsed = timestamp - startTime;
                let T = elapsed % 12000; // 12-second loop
                let theta = 0;

                // Phase 1: 0 to 90 degrees (0s - 4s)
                if (T < 4000) {
                    theta = 90 * easeInOutCubic(T / 4000);
                } 
                // Phase 2: Pause at 90 degrees (4s - 6s)
                else if (T < 6000) {
                    theta = 90;
                } 
                // Phase 3: 90 to 180 degrees (6s - 10s)
                else if (T < 10000) {
                    theta = 90 + 90 * easeInOutCubic((T - 6000) / 4000);
                } 
                // Phase 4: 180 back to 0 degrees (10s - 12s)
                else {
                    theta = 180 - 180 * easeInOutCubic((T - 10000) / 2000);
                }

                updateVisuals(theta);
                requestAnimationFrame(animate);
            }
        }

        // Update SVG Elements based on Angle
        function updateVisuals(theta) {
            let rad = theta * Math.PI / 180;
            
            // Calculate Vector B tip coordinates
            let bx = cx + lenB * Math.cos(rad);
            let by = cy - lenB * Math.sin(rad); // SVG Y goes down

            // Update Vector B
            vecB.setAttribute('x2', bx);
            vecB.setAttribute('y2', by);
            
            // Update Vector B Label
            labelB.setAttribute('x', bx + 12 * Math.cos(rad));
            labelB.setAttribute('y', by - 12 * Math.sin(rad) - 5);

            // Update Projection Line (Dashed)
            projLine.setAttribute('x1', bx);
            projLine.setAttribute('y1', by);
            projLine.setAttribute('x2', bx);
            projLine.setAttribute('y2', cy);

            // Update Projection Component (Green)
            let px = cx + lenB * Math.cos(rad);
            projComp.setAttribute('x2', px);

            // Handle Projection Visibility and Label
            if (Math.abs(px - cx) < 3) {
                projComp.style.display = 'none';
                compLabel.style.display = 'none';
            } else {
                projComp.style.display = 'block';
                compLabel.style.display = 'block';
                compLabel.setAttribute('x', cx + (px - cx) / 2);
                compLabel.setAttribute('y', cy + 25);
            }

            // Update Angle Arc and Text
            if (theta > 0.5) {
                let arcRadius = 45;
                let ax = cx + arcRadius * Math.cos(rad);
                let ay = cy - arcRadius * Math.sin(rad);
                
                // SVG Arc Path
                let path = `M ${cx + arcRadius} ${cy} A ${arcRadius} ${arcRadius} 0 0 0 ${ax} ${ay} L ${cx} ${cy} Z`;
                angleArc.setAttribute('d', path);
                angleArc.style.display = 'block';

                // Angle Text Position
                let tx = cx + (arcRadius + 20) * Math.cos(rad / 2);
                let ty = cy - (arcRadius + 20) * Math.sin(rad / 2);
                angleText.setAttribute('x', tx);
                angleText.setAttribute('y', ty + 5);
                angleText.textContent = Math.round(theta) + '°';
                angleText.style.display = 'block';
            } else {
                angleArc.style.display = 'none';
                angleText.style.display = 'none';
            }

            // Update Dynamic Formula
            let dotProduct = magA * magB * Math.cos(rad);
            let color = dotProduct > 0.05 ? '#06D6A0' : (dotProduct < -0.05 ? '#FF3366' : '#6C757D');
            
            formulaText.innerHTML = `Φ = |<tspan font-style="italic" font-family="Inter">E</tspan>| |<tspan font-style="italic" font-family="Inter">A</tspan>| cos(θ) = (${magB.toFixed(1)})(${magA.toFixed(1)}) cos(${Math.round(theta)}°) = <tspan fill="${color}" font-weight="700">${dotProduct.toFixed(1)}</tspan>`;
        }

        // Start Animation
        requestAnimationFrame(animate);

        // Play/Pause Interaction
        playPauseBtn.addEventListener('click', function() {
            isPlaying = !isPlaying;
            this.textContent = isPlaying ? 'Pause Animation' : 'Play Animation';
            if (isPlaying) {
                startTime = performance.now() - pausedTime;
                requestAnimationFrame(animate);
            } else {
                pausedTime = performance.now() - startTime;
            }
        });
    </script>
</body>
</html>
