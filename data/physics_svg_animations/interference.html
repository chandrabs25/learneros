<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave Interference: Young's Double Slit</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
        }

        /* Typography */
        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 18px;
            fill: #2B2D42;
        }
        
        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            fill: #2B2D42;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            fill: #2B2D42;
        }

        /* Wave Animations */
        .wave {
            fill: none;
            vector-effect: non-scaling-stroke;
            animation: expand 8s linear infinite;
        }

        .s1-waves { stroke: #4361EE; }
        .s2-waves { stroke: #FF3366; }

        @keyframes expand {
            0% { transform: scale(0); opacity: 1; stroke-width: 2.5px; }
            70% { opacity: 0.8; stroke-width: 1px; }
            100% { transform: scale(1); opacity: 0; stroke-width: 0.5px; }
        }

        /* Source Pulsing */
        .source {
            animation: pulse 0.4s ease-in-out infinite alternate;
        }
        .s1-source { fill: #4361EE; }
        .s2-source { fill: #FF3366; }

        @keyframes pulse {
            0% { r: 3.5px; filter: drop-shadow(0 0 2px currentColor); }
            100% { r: 5px; filter: drop-shadow(0 0 6px currentColor); }
        }

        /* Intensity Graph Shimmer */
        .intensity-graph {
            fill: rgba(247, 127, 0, 0.25);
            stroke: #F77F00;
            stroke-width: 2px;
            animation: shimmer 2s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { opacity: 0.8; filter: drop-shadow(0 0 2px #F77F00); }
            100% { opacity: 1; filter: drop-shadow(0 0 8px #F77F00); }
        }

        /* Photon Travel Animations */
        .photon {
            fill: #ffffff;
            filter: drop-shadow(0 0 4px #fff);
        }

        .photon1 { animation: travel1 5s linear infinite; }
        .photon2 { animation: travel2 5s linear infinite; }

        @keyframes travel1 {
            0% { transform: translate(100px, 190px); opacity: 0; }
            5% { opacity: 1; }
            75% { transform: translate(650px, 66.7px); opacity: 1; }
            78%, 100% { transform: translate(650px, 66.7px); opacity: 0; }
        }

        @keyframes travel2 {
            0% { transform: translate(100px, 310px); opacity: 0; }
            5% { opacity: 1; }
            80% { transform: translate(650px, 66.7px); opacity: 1; }
            83%, 100% { transform: translate(650px, 66.7px); opacity: 0; }
        }

        /* Constructive Interference Nodes */
        .node {
            fill: #06D6A0;
            animation: node-pulse 1s ease-in-out infinite alternate;
        }

        @keyframes node-pulse {
            0% { r: 2px; opacity: 0.4; filter: drop-shadow(0 0 2px #06D6A0); }
            100% { r: 4px; opacity: 1; filter: drop-shadow(0 0 6px #06D6A0); }
        }

        /* Path Lines */
        .path-line {
            stroke-dasharray: 4, 4;
            opacity: 0.6;
            stroke-width: 1.5px;
        }
    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Wave Interference: Young's Double Slit</title>
        <desc id="svg-desc">An animated physics diagram showing two coherent wave sources creating an interference pattern, demonstrating path difference and the resulting intensity distribution on a screen.</desc>

        <!-- Definitions -->
        <defs>
            <!-- Base Wave Circle -->
            <circle id="base-wave" cx="0" cy="0" r="800" class="wave" />
            
            <!-- Arrowhead for dimension lines -->
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2B2D42" />
            </marker>

            <!-- Clip path to keep waves to the right of the barrier -->
            <clipPath id="wave-clip">
                <rect x="105" y="0" width="695" height="500" />
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Waves Group (Clipped) -->
        <g clip-path="url(#wave-clip)">
            <!-- Source 1 Waves (Blue) -->
            <g transform="translate(100, 190)" class="s1-waves">
                <use href="#base-wave" style="animation-delay: 0s;" />
                <use href="#base-wave" style="animation-delay: -0.4s;" />
                <use href="#base-wave" style="animation-delay: -0.8s;" />
                <use href="#base-wave" style="animation-delay: -1.2s;" />
                <use href="#base-wave" style="animation-delay: -1.6s;" />
                <use href="#base-wave" style="animation-delay: -2.0s;" />
                <use href="#base-wave" style="animation-delay: -2.4s;" />
                <use href="#base-wave" style="animation-delay: -2.8s;" />
                <use href="#base-wave" style="animation-delay: -3.2s;" />
                <use href="#base-wave" style="animation-delay: -3.6s;" />
                <use href="#base-wave" style="animation-delay: -4.0s;" />
                <use href="#base-wave" style="animation-delay: -4.4s;" />
                <use href="#base-wave" style="animation-delay: -4.8s;" />
                <use href="#base-wave" style="animation-delay: -5.2s;" />
                <use href="#base-wave" style="animation-delay: -5.6s;" />
                <use href="#base-wave" style="animation-delay: -6.0s;" />
                <use href="#base-wave" style="animation-delay: -6.4s;" />
                <use href="#base-wave" style="animation-delay: -6.8s;" />
                <use href="#base-wave" style="animation-delay: -7.2s;" />
                <use href="#base-wave" style="animation-delay: -7.6s;" />
            </g>

            <!-- Source 2 Waves (Red) -->
            <g transform="translate(100, 310)" class="s2-waves">
                <use href="#base-wave" style="animation-delay: 0s;" />
                <use href="#base-wave" style="animation-delay: -0.4s;" />
                <use href="#base-wave" style="animation-delay: -0.8s;" />
                <use href="#base-wave" style="animation-delay: -1.2s;" />
                <use href="#base-wave" style="animation-delay: -1.6s;" />
                <use href="#base-wave" style="animation-delay: -2.0s;" />
                <use href="#base-wave" style="animation-delay: -2.4s;" />
                <use href="#base-wave" style="animation-delay: -2.8s;" />
                <use href="#base-wave" style="animation-delay: -3.2s;" />
                <use href="#base-wave" style="animation-delay: -3.6s;" />
                <use href="#base-wave" style="animation-delay: -4.0s;" />
                <use href="#base-wave" style="animation-delay: -4.4s;" />
                <use href="#base-wave" style="animation-delay: -4.8s;" />
                <use href="#base-wave" style="animation-delay: -5.2s;" />
                <use href="#base-wave" style="animation-delay: -5.6s;" />
                <use href="#base-wave" style="animation-delay: -6.0s;" />
                <use href="#base-wave" style="animation-delay: -6.4s;" />
                <use href="#base-wave" style="animation-delay: -6.8s;" />
                <use href="#base-wave" style="animation-delay: -7.2s;" />
                <use href="#base-wave" style="animation-delay: -7.6s;" />
            </g>
        </g>

        <!-- Constructive Interference Nodes (Sparks) -->
        <g class="nodes">
            <!-- Central Max (m=0) -->
            <circle cx="237.5" cy="250" class="node" style="animation-delay: 0s;" />
            <circle cx="375.0" cy="250" class="node" style="animation-delay: -0.3s;" />
            <circle cx="512.5" cy="250" class="node" style="animation-delay: -0.6s;" />
            
            <!-- 1st Order Max (m=1) -->
            <circle cx="237.5" cy="204.2" class="node" style="animation-delay: -0.1s;" />
            <circle cx="375.0" cy="158.4" class="node" style="animation-delay: -0.4s;" />
            <circle cx="512.5" cy="112.5" class="node" style="animation-delay: -0.7s;" />

            <!-- 1st Order Max (m=-1) -->
            <circle cx="237.5" cy="295.8" class="node" style="animation-delay: -0.2s;" />
            <circle cx="375.0" cy="341.6" class="node" style="animation-delay: -0.5s;" />
            <circle cx="512.5" cy="387.5" class="node" style="animation-delay: -0.8s;" />
        </g>

        <!-- Barrier (Slit Plane) -->
        <path d="M 95,0 L 105,0 L 105,185 L 95,185 Z M 95,195 L 105,195 L 105,305 L 95,305 Z M 95,315 L 105,315 L 105,500 L 95,500 Z" fill="#2B2D42" />

        <!-- Observation Screen -->
        <rect x="650" y="0" width="12" height="500" fill="#2B2D42" />

        <!-- Intensity Graph (cos^2 curve) -->
        <!-- Generated accurate path for I = I_0 cos^2(pi * d * y / (lambda * D)) -->
        <path d="M 650,0 L 691.3,0 L 698.5,10 L 705.5,20 L 712.5,30 L 720,40 L 728,50 L 736,60 L 750,66.67 L 749.5,70 L 745,80 L 736.5,90 L 724.5,100 L 710,110 L 693.5,120 L 676.5,130 L 661,140 L 652.5,150 L 650,158.33 L 650.1,160 L 653.5,170 L 660.5,180 L 670.5,190 L 683,200 L 697,210 L 712,220 L 727,230 L 741,240 L 750,250 L 741,260 L 727,270 L 712,280 L 697,290 L 683,300 L 670.5,310 L 660.5,320 L 653.5,330 L 650.1,340 L 650,341.67 L 652.5,350 L 661,360 L 676.5,370 L 693.5,380 L 710,390 L 724.5,400 L 736.5,410 L 745,420 L 749.5,430 L 750,433.33 L 748,440 L 739.5,450 L 728,460 L 714.5,470 L 700,480 L 685,490 L 670,500 L 650,500 Z" class="intensity-graph" />

        <!-- Central Axis -->
        <line x1="100" y1="250" x2="650" y2="250" stroke="#2B2D42" stroke-dasharray="6,6" opacity="0.4" stroke-width="1.5" />

        <!-- Path Lines to Point P -->
        <line x1="100" y1="190" x2="650" y2="66.7" stroke="#4361EE" class="path-line" />
        <line x1="100" y1="310" x2="650" y2="66.7" stroke="#FF3366" class="path-line" />

        <!-- Path Difference (Delta L) Illustration -->
        <!-- Arc from P(650, 66.7) with radius L1=563.66 intersecting Path 2 -->
        <path d="M 100 190 A 563.66 563.66 0 0 0 134.5 294.7" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" opacity="0.8" />
        <!-- Highlight Delta L segment on Path 2 -->
        <line x1="100" y1="310" x2="134.5" y2="294.7" stroke="#F77F00" stroke-width="4" stroke-linecap="round" />
        <text x="102" y="328" class="math-text" fill="#F77F00" font-weight="bold" font-size="13px">ΔL</text>

        <!-- Angle Theta -->
        <line x1="100" y1="250" x2="650" y2="66.7" stroke="#06D6A0" stroke-dasharray="3,3" stroke-width="1.5" />
        <path d="M 160 250 A 60 60 0 0 0 156.9 231.1" fill="none" stroke="#06D6A0" stroke-width="2" />
        <text x="168" y="246" class="math-text" fill="#06D6A0" font-weight="bold">θ</text>

        <!-- Traveling Photons -->
        <circle r="3.5" class="photon photon1" />
        <circle r="3.5" class="photon photon2" />

        <!-- Sources -->
        <circle cx="100" cy="190" class="source s1-source" />
        <circle cx="100" cy="310" class="source s2-source" />
        <text x="70" y="194" class="math-text" font-weight="bold" fill="#4361EE">S₁</text>
        <text x="70" y="314" class="math-text" font-weight="bold" fill="#FF3366">S₂</text>

        <!-- Geometry Dimensions -->
        <!-- Slit Separation (d) -->
        <line x1="80" y1="195" x2="80" y2="305" stroke="#2B2D42" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="65" y="254" class="math-text" text-anchor="middle" font-weight="bold">d</text>

        <!-- Screen Distance (D) -->
        <line x1="105" y1="475" x2="645" y2="475" stroke="#2B2D42" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" />
        <text x="375" y="465" class="math-text" text-anchor="middle" font-weight="bold">D</text>

        <!-- UI & Annotations -->
        <text x="20" y="35" class="title">Wave Interference: Young's Double Slit</text>
        
        <!-- Legend -->
        <g transform="translate(20, 55)">
            <circle cx="5" cy="-4" r="4" fill="#4361EE" />
            <text x="15" y="0" class="label-text">Source 1 (S₁)</text>
            
            <circle cx="115" cy="-4" r="4" fill="#FF3366" />
            <text x="125" y="0" class="label-text">Source 2 (S₂)</text>
            
            <rect x="225" y="-9" width="12" height="10" fill="#F77F00" opacity="0.6" />
            <text x="243" y="0" class="label-text">Intensity (I)</text>

            <circle cx="335" cy="-4" r="4" fill="#06D6A0" />
            <text x="345" y="0" class="label-text">Constructive Node</text>
        </g>

        <!-- Physics Formula -->
        <rect x="600" y="455" width="180" height="30" fill="#ffffff" rx="4" opacity="0.8" />
        <text x="770" y="475" class="math-text" text-anchor="end" font-weight="bold">I = 4I₀ cos²(φ/2)</text>

        <!-- Fringe Labels -->
        <text x="668" y="254" class="label-text" font-weight="bold">Central Maximum (m=0)</text>
        <text x="668" y="70" class="label-text" font-weight="bold">1st Order Max (m=1)</text>
        <text x="668" y="437" class="label-text" font-weight="bold">1st Order Max (m=-1)</text>
        
        <text x="668" y="162" class="label-text" fill="#7209B7">Dark Fringe (Minima)</text>
        <text x="668" y="345" class="label-text" fill="#7209B7">Dark Fringe (Minima)</text>

        <!-- Point P Label -->
        <circle cx="650" cy="66.7" r="3" fill="#2B2D42" />
        <text x="635" y="60" class="math-text" font-weight="bold">P</text>

    </svg>
</div>

</body>
</html>
