<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Gas Law Interactive Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            max-width: 100%;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
            fill: #2B2D42;
            text-anchor: middle;
        }
        .subtitle {
            font-size: 16px;
            font-weight: 600;
            fill: #6c757d;
            text-anchor: middle;
        }
        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 32px;
            font-weight: 700;
            text-anchor: middle;
            fill: #2B2D42;
        }
        .formula-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            fill: #6c757d;
            text-anchor: middle;
        }
        .gauge-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: #2B2D42;
            text-anchor: middle;
        }
        .gauge-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            text-anchor: middle;
        }
        .legend-text {
            font-size: 12px;
            fill: #2B2D42;
            alignment-baseline: middle;
        }
        .cylinder-wall {
            fill: none;
            stroke: #2B2D42;
            stroke-width: 4px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .piston-rod {
            fill: #8D99AE;
        }
        .piston-plate {
            fill: #2B2D42;
        }
        .gauge-bg {
            fill: #e9ecef;
            rx: 6px;
        }
        .gauge-fill {
            rx: 6px;
            transition: height 0.1s linear, y 0.1s linear;
        }
        
        /* Dynamic Colors */
        .color-p { fill: #FF3366; color: #FF3366; }
        .color-v { fill: #4361EE; color: #4361EE; }
        .color-t { fill: #F77F00; color: #F77F00; }
        .color-v-vec { fill: #06D6A0; }
        
        .stroke-p { stroke: #FF3366; }
        .stroke-v { stroke: #4361EE; }
        .stroke-t { stroke: #F77F00; }
        
        /* Highlighting transitions */
        tspan {
            transition: fill 0.3s ease, font-size 0.3s ease;
        }
        .highlight {
            font-size: 38px;
        }
        .dim {
            fill: #adb5bd !important;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead for velocity vectors -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
        </marker>
        
        <!-- Heat Source Gradient -->
        <linearGradient id="heatGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F77F00" stop-opacity="1" />
            <stop offset="100%" stop-color="#FF3366" stop-opacity="0.2" />
        </linearGradient>
        
        <!-- Temperature Gradient for Legend -->
        <linearGradient id="tempGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4361EE" />
            <stop offset="100%" stop-color="#FF3366" />
        </linearGradient>
    </defs>

    <!-- Titles -->
    <text x="400" y="35" class="title">Ideal Gas Law: Kinetic Molecular Theory</text>
    <text x="400" y="60" class="subtitle" id="phase-text">Phase: Initialization</text>

    <!-- CYLINDER APPARATUS (Left Side) -->
    <g id="apparatus" transform="translate(50, 100)">
        <!-- Heat Source (Glows based on T) -->
        <rect id="heat-source" x="0" y="300" width="300" height="20" fill="url(#heatGradient)" opacity="0" rx="4" />
        <text id="heat-label" x="150" y="335" class="gauge-label color-t" opacity="0">Heat Added</text>
        
        <!-- Cylinder Walls -->
        <path d="M 0 0 L 0 300 L 300 300 L 300 0" class="cylinder-wall" />
        
        <!-- Piston -->
        <g id="piston">
            <rect x="140" y="-100" width="20" height="100" class="piston-rod" id="piston-rod" />
            <rect x="2" y="0" width="296" height="12" class="piston-plate" rx="2" />
        </g>
        
        <!-- Particles Group -->
        <g id="particles"></g>
        
        <!-- Vectors Group -->
        <g id="vectors"></g>
        
        <!-- Collisions Group -->
        <g id="collisions"></g>
    </g>

    <!-- GAUGES & FORMULA (Right Side) -->
    <g id="ui" transform="translate(400, 100)">
        
        <!-- Dynamic Formula -->
        <text x="180" y="30" class="formula">
            <tspan id="form-P" class="color-p">P</tspan>
            <tspan id="form-V" class="color-v">V</tspan>
            <tspan fill="#2B2D42"> = n R </tspan>
            <tspan id="form-T" class="color-t">T</tspan>
        </text>
        <text x="180" y="55" class="formula-text" id="law-name">General Equation</text>

        <!-- Gauges -->
        <!-- Pressure Gauge -->
        <g transform="translate(60, 100)">
            <rect x="0" y="0" width="30" height="150" class="gauge-bg" />
            <rect id="gauge-P" x="0" y="112.5" width="30" height="37.5" class="gauge-fill color-p" />
            <text x="15" y="170" class="gauge-label">Pressure</text>
            <text id="val-P" x="15" y="190" class="gauge-value color-p">1.0 atm</text>
        </g>

        <!-- Volume Gauge -->
        <g transform="translate(160, 100)">
            <rect x="0" y="0" width="30" height="150" class="gauge-bg" />
            <rect id="gauge-V" x="0" y="0" width="30" height="150" class="gauge-fill color-v" />
            <text x="15" y="170" class="gauge-label">Volume</text>
            <text id="val-V" x="15" y="190" class="gauge-value color-v">1.0 L</text>
        </g>

        <!-- Temperature Gauge -->
        <g transform="translate(260, 100)">
            <rect x="0" y="0" width="30" height="150" class="gauge-bg" />
            <rect id="gauge-T" x="0" y="112.5" width="30" height="37.5" class="gauge-fill color-t" />
            <text x="15" y="170" class="gauge-label">Temp</text>
            <text id="val-T" x="15" y="190" class="gauge-value color-t">300 K</text>
        </g>
    </g>

    <!-- Legend -->
    <g id="legend" transform="translate(460, 430)">
        <rect x="0" y="0" width="300" height="50" fill="#ffffff" stroke="#e9ecef" rx="6" />
        
        <!-- Velocity -->
        <line x1="15" y1="15" x2="35" y2="15" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow)" />
        <text x="45" y="16" class="legend-text">Velocity (v)</text>
        
        <!-- Collision/Force -->
        <circle cx="25" cy="35" r="6" fill="none" stroke="#FF3366" stroke-width="2" />
        <text x="45" y="36" class="legend-text">Collision (P)</text>
        
        <!-- Temperature Color -->
        <rect x="150" y="10" width="60" height="10" fill="url(#tempGradient)" rx="2" />
        <text x="220" y="16" class="legend-text">Temp (T)</text>
        <text x="150" y="36" class="legend-text" fill="#6c757d" style="font-size: 10px;">Blue=Cold, Red=Hot</text>
    </g>

</svg>

<script>
    // --- Physics & Animation Configuration ---
    const NUM_PARTICLES = 25;
    const PARTICLE_RADIUS = 4;
    const BASE_SPEED = 2.0;
    const VECTOR_SCALE = 5;
    const CYLINDER_WIDTH = 300;
    const CYLINDER_HEIGHT = 300;
    const LOOP_DURATION = 20000; // 20 seconds

    // --- DOM Elements ---
    const particlesGroup = document.getElementById('particles');
    const vectorsGroup = document.getElementById('vectors');
    const collisionsGroup = document.getElementById('collisions');
    const piston = document.getElementById('piston');
    const pistonRod = document.getElementById('piston-rod');
    const heatSource = document.getElementById('heat-source');
    const heatLabel = document.getElementById('heat-label');
    
    const gaugeP = document.getElementById('gauge-P');
    const gaugeV = document.getElementById('gauge-V');
    const gaugeT = document.getElementById('gauge-T');
    
    const valP = document.getElementById('val-P');
    const valV = document.getElementById('val-V');
    const valT = document.getElementById('val-T');
    
    const phaseText = document.getElementById('phase-text');
    const lawName = document.getElementById('law-name');
    const formP = document.getElementById('form-P');
    const formV = document.getElementById('form-V');
    const formT = document.getElementById('form-T');

    // --- State Variables ---
    let particles = [];
    let collisionRings = [];
    let currentState = { P: 1, V: 1, T: 1, phase: '' };

    // --- Initialization ---
    function initParticles() {
        for (let i = 0; i < NUM_PARTICLES; i++) {
            // Random position within initial volume (V=1 -> full height)
            let x = 20 + Math.random() * (CYLINDER_WIDTH - 40);
            let y = 50 + Math.random() * (CYLINDER_HEIGHT - 60);
            
            // Random direction
            let angle = Math.random() * 2 * Math.PI;
            let vx = Math.cos(angle);
            let vy = Math.sin(angle);

            // Create SVG elements
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", PARTICLE_RADIUS);
            particlesGroup.appendChild(circle);

            let line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("stroke", "#06D6A0");
            line.setAttribute("stroke-width", "1.5");
            line.setAttribute("marker-end", "url(#arrow)");
            vectorsGroup.appendChild(line);

            particles.push({ x, y, vx, vy, circle, line });
        }
    }

    // --- Color Interpolation ---
    function lerpColor(t) {
        // t goes from 1 (Blue) to 4 (Red)
        // Blue: #4361EE -> rgb(67, 97, 238)
        // Red: #FF3366 -> rgb(255, 51, 102)
        let fraction = (t - 1) / 3;
        fraction = Math.max(0, Math.min(1, fraction));
        
        let r = Math.round(67 + fraction * (255 - 67));
        let g = Math.round(97 + fraction * (51 - 97));
        let b = Math.round(238 + fraction * (102 - 238));
        
        return `rgb(${r}, ${g}, ${b})`;
    }

    // --- State Machine ---
    function getState(timeMs) {
        let t = (timeMs % LOOP_DURATION) / 1000; // 0 to 20 seconds
        let state = { V: 1.0, T: 1.0, phase: '', law: '' };

        if (t < 1) {
            // Pause at start
            state.V = 1.0; state.T = 1.0;
            state.phase = "Initial State";
            state.law = "PV = nRT";
        } else if (t < 5) {
            // Boyle's Law: Isothermal Compression (V decreases, T constant)
            let progress = (t - 1) / 4;
            // Easing function for smooth piston movement
            let ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);
            state.V = 1.0 - 0.5 * ease; // V goes 1.0 -> 0.5
            state.T = 1.0;
            state.phase = "Boyle's Law: Isothermal Compression";
            state.law = "P ∝ 1/V (Constant T)";
        } else if (t < 6.5) {
            // Pause
            state.V = 0.5; state.T = 1.0;
            state.phase = "Boyle's Law: Isothermal Compression";
            state.law = "P ∝ 1/V (Constant T)";
        } else if (t < 10.5) {
            // Charles's Law: Isobaric Expansion (T increases, V increases, P constant)
            let progress = (t - 6.5) / 4;
            let ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);
            state.T = 1.0 + 1.0 * ease; // T goes 1.0 -> 2.0
            state.V = 0.5 + 0.5 * ease; // V goes 0.5 -> 1.0
            state.phase = "Charles's Law: Isobaric Expansion";
            state.law = "V ∝ T (Constant P)";
        } else if (t < 12) {
            // Pause
            state.V = 1.0; state.T = 2.0;
            state.phase = "Charles's Law: Isobaric Expansion";
            state.law = "V ∝ T (Constant P)";
        } else if (t < 16) {
            // Gay-Lussac's Law: Isochoric Heating (T increases, V constant, P increases)
            let progress = (t - 12) / 4;
            let ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);
            state.V = 1.0;
            state.T = 2.0 + 2.0 * ease; // T goes 2.0 -> 4.0
            state.phase = "Gay-Lussac's Law: Isochoric Heating";
            state.law = "P ∝ T (Constant V)";
        } else if (t < 18) {
            // Pause
            state.V = 1.0; state.T = 4.0;
            state.phase = "Gay-Lussac's Law: Isochoric Heating";
            state.law = "P ∝ T (Constant V)";
        } else {
            // Reset smoothly
            let progress = (t - 18) / 2;
            let ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);
            state.V = 1.0;
            state.T = 4.0 - 3.0 * ease; // T goes 4.0 -> 1.0
            state.phase = "Resetting System...";
            state.law = "PV = nRT";
        }

        // Ideal Gas Law: P = T / V (normalized)
        state.P = state.T / state.V;
        return state;
    }

    // --- UI Updates ---
    function updateUI(state) {
        // Piston position (V=1 -> y=0, V=0.5 -> y=150)
        let pistonY = (1 - state.V) * 300;
        piston.setAttribute("transform", `translate(0, ${pistonY})`);
        pistonRod.setAttribute("y", -300 - pistonY);
        pistonRod.setAttribute("height", 300 + pistonY);

        // Heat Source
        let heatOpacity = (state.T - 1) / 3; // 0 to 1
        heatSource.setAttribute("opacity", heatOpacity);
        heatLabel.setAttribute("opacity", heatOpacity > 0.1 ? 1 : 0);

        // Gauges (Max P=4, V=1, T=4) -> Height max = 150
        let hP = (state.P / 4) * 150;
        let hV = (state.V / 1) * 150;
        let hT = (state.T / 4) * 150;

        gaugeP.setAttribute("height", hP);
        gaugeP.setAttribute("y", 150 - hP);
        gaugeV.setAttribute("height", hV);
        gaugeV.setAttribute("y", 150 - hV);
        gaugeT.setAttribute("height", hT);
        gaugeT.setAttribute("y", 150 - hT);

        // Values
        valP.textContent = state.P.toFixed(1) + " atm";
        valV.textContent = state.V.toFixed(1) + " L";
        valT.textContent = Math.round(state.T * 300) + " K";

        // Text
        phaseText.textContent = state.phase;
        lawName.textContent = state.law;

        // Formula Highlighting
        formP.className.baseVal = "color-p";
        formV.className.baseVal = "color-v";
        formT.className.baseVal = "color-t";
        
        if (state.phase.includes("Boyle")) {
            formP.classList.add("highlight");
            formV.classList.add("highlight");
            formT.classList.add("dim");
        } else if (state.phase.includes("Charles")) {
            formV.classList.add("highlight");
            formT.classList.add("highlight");
            formP.classList.add("dim");
        } else if (state.phase.includes("Gay-Lussac")) {
            formP.classList.add("highlight");
            formT.classList.add("highlight");
            formV.classList.add("dim");
        } else {
            formP.classList.remove("highlight", "dim");
            formV.classList.remove("highlight", "dim");
            formT.classList.remove("highlight", "dim");
        }
    }

    // --- Physics Loop ---
    function spawnCollision(x, y) {
        let ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        ring.setAttribute("cx", x);
        ring.setAttribute("cy", y);
        ring.setAttribute("fill", "none");
        ring.setAttribute("stroke", "#FF3366");
        ring.setAttribute("stroke-width", "2");
        collisionsGroup.appendChild(ring);
        collisionRings.push({ el: ring, age: 0, maxAge: 15 });
    }

    function updatePhysics(state) {
        let targetSpeed = BASE_SPEED * Math.sqrt(state.T);
        let pistonY = (1 - state.V) * 300 + 12; // +12 for piston plate thickness
        let particleColor = lerpColor(state.T);

        // Update Particles
        particles.forEach(p => {
            // Normalize velocity and apply target speed
            let currentSpeed = Math.hypot(p.vx, p.vy);
            if (currentSpeed === 0) { p.vx = 1; p.vy = 0; currentSpeed = 1; }
            p.vx = (p.vx / currentSpeed) * targetSpeed;
            p.vy = (p.vy / currentSpeed) * targetSpeed;

            // Move
            p.x += p.vx;
            p.y += p.vy;

            // Wall Collisions
            let hit = false;
            let hitX = p.x, hitY = p.y;

            // Left wall
            if (p.x < PARTICLE_RADIUS) {
                p.x = PARTICLE_RADIUS;
                p.vx = Math.abs(p.vx);
                hit = true; hitX = 0;
            }
            // Right wall
            else if (p.x > CYLINDER_WIDTH - PARTICLE_RADIUS) {
                p.x = CYLINDER_WIDTH - PARTICLE_RADIUS;
                p.vx = -Math.abs(p.vx);
                hit = true; hitX = CYLINDER_WIDTH;
            }

            // Bottom wall
            if (p.y > CYLINDER_HEIGHT - PARTICLE_RADIUS) {
                p.y = CYLINDER_HEIGHT - PARTICLE_RADIUS;
                p.vy = -Math.abs(p.vy);
                hit = true; hitY = CYLINDER_HEIGHT;
            }
            // Top wall (Piston)
            else if (p.y < pistonY + PARTICLE_RADIUS) {
                p.y = pistonY + PARTICLE_RADIUS;
                p.vy = Math.abs(p.vy);
                hit = true; hitY = pistonY;
            }

            if (hit) spawnCollision(hitX, hitY);

            // Update SVG Elements
            p.circle.setAttribute("cx", p.x);
            p.circle.setAttribute("cy", p.y);
            p.circle.setAttribute("fill", particleColor);

            p.line.setAttribute("x1", p.x);
            p.line.setAttribute("y1", p.y);
            p.line.setAttribute("x2", p.x + p.vx * VECTOR_SCALE);
            p.line.setAttribute("y2", p.y + p.vy * VECTOR_SCALE);
        });

        // Update Collision Rings
        for (let i = collisionRings.length - 1; i >= 0; i--) {
            let ring = collisionRings[i];
            ring.age++;
            if (ring.age > ring.maxAge) {
                collisionsGroup.removeChild(ring.el);
                collisionRings.splice(i, 1);
            } else {
                let r = ring.age * 1.5;
                let opacity = 1 - (ring.age / ring.maxAge);
                ring.el.setAttribute("r", r);
                ring.el.setAttribute("opacity", opacity);
            }
        }
    }

    // --- Main Animation Loop ---
    let startTime = performance.now();

    function animate(currentTime) {
        let elapsed = currentTime - startTime;
        let state = getState(elapsed);
        
        updateUI(state);
        updatePhysics(state);

        requestAnimationFrame(animate);
    }

    // Start
    initParticles();
    requestAnimationFrame(animate);

</script>
</body>
</html>
