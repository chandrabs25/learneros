<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Quantum Atom: Fundamental Forces and Spin</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

    body {
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: 'Inter', sans-serif;
    }

    svg {
        width: 100%;
        height: 100%;
        max-width: 1200px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        background-color: #ffffff;
    }

    /* SVG Text Styles */
    .title { font-size: 24px; font-weight: 700; fill: #212529; text-anchor: middle; }
    .phase-text { font-size: 16px; font-weight: 600; text-anchor: middle; opacity: 0; }
    .label { font-size: 12px; font-weight: 600; }
    .math { font-family: 'Roboto Mono', monospace; font-weight: 700; }

    /* Keyframe Animations */
    @keyframes rotate {
        from { transform: rotate(-135deg); }
        to { transform: rotate(225deg); }
    }

    @keyframes counterRotate {
        from { transform: rotate(135deg); }
        to { transform: rotate(-225deg); }
    }

    @keyframes radius {
        0%, 100% { transform: translateX(150px); }
        50% { transform: translateX(250px); }
    }

    @keyframes jitter {
        0%, 100% { transform: translate(0, 0); }
        25% { transform: translate(1.5px, -1.5px); }
        50% { transform: translate(-1.5px, 1.5px); }
        75% { transform: translate(-1.5px, -1.5px); }
    }

    @keyframes strongPulse {
        0%, 100% { stroke-width: 2; opacity: 0.6; }
        50% { stroke-width: 5; opacity: 1; }
    }

    @keyframes phase1Highlight {
        0%, 20% { opacity: 1; transform: scale(1.1); }
        25%, 100% { opacity: 0; transform: scale(1); }
    }

    @keyframes coulombFade {
        0%, 22% { opacity: 0; }
        25%, 48% { opacity: 1; }
        51%, 100% { opacity: 0; }
    }

    @keyframes arrowLineScale {
        0%, 100% { transform: scaleX(100); }
        50% { transform: scaleX(36); }
    }

    @keyframes arrowHeadMove {
        0%, 100% { transform: translateX(-100px); }
        50% { transform: translateX(-36px); }
    }

    @keyframes dashedLineScale {
        0%, 100% { transform: scaleX(150); }
        50% { transform: scaleX(250); }
    }

    @keyframes electronFade {
        0%, 48% { opacity: 1; }
        52%, 73% { opacity: 0.15; }
        77%, 100% { opacity: 1; }
    }

    @keyframes waveAppear {
        0%, 48% { opacity: 0; transform: scale(0.5); }
        52%, 73% { opacity: 1; transform: scale(1); }
        77%, 100% { opacity: 0; transform: scale(0.5); }
    }

    @keyframes ripple {
        0% { r: 8; opacity: 1; stroke-width: 3; }
        100% { r: 45; opacity: 0; stroke-width: 0.5; }
    }

    @keyframes spinAppear {
        0%, 73% { opacity: 0; transform: scale(0.5); }
        77%, 98% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.5); }
    }

    @keyframes precess {
        0%, 100% { transform: rotate(-20deg); }
        50% { transform: rotate(20deg); }
    }

    /* Phase Indicator Animations */
    @keyframes showP1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
    @keyframes showP2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes showP3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
    @keyframes showP4 { 0%, 73% { opacity: 0; } 75%, 98% { opacity: 1; } 100% { opacity: 0; } }

    /* Energy Bar Animations */
    @keyframes kineticBar {
        0%, 100% { transform: scaleY(-1); height: 30px; }
        50% { transform: scaleY(-1); height: 10px; }
    }
    @keyframes potentialBar {
        0%, 100% { height: 60px; }
        50% { height: 40px; }
    }
</style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svgTitle svgDesc">
    <title id="svgTitle">The Quantum Atom: Fundamental Forces and Spin</title>
    <desc id="svgDesc">An animated diagram showing the strong nuclear force, Coulomb force, wave-particle duality, and electron spin in a hydrogen-like atom.</desc>

    <defs>
        <!-- Grid Pattern -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f3f5" stroke-width="1"/>
        </pattern>

        <!-- Glow Filter for Wave Function -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Radial Gradient for Probability Cloud -->
        <radialGradient id="waveGrad">
            <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.7"/>
            <stop offset="40%" stop-color="#00B4D8" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#00B4D8" stop-opacity="0"/>
        </radialGradient>
    </defs>

    <!-- Background Grid -->
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Header & Phase Indicators -->
    <text x="400" y="40" class="title">The Quantum Atom: Fundamental Forces and Spin</text>
    
    <g transform="translate(400, 70)">
        <text class="phase-text" fill="#FF3366" style="animation: showP1 12s infinite;">Phase 1: Nuclear Stability (Strong Force)</text>
        <text class="phase-text" fill="#F77F00" style="animation: showP2 12s infinite;">Phase 2: Coulomb Interaction (Inverse Square)</text>
        <text class="phase-text" fill="#00B4D8" style="animation: showP3 12s infinite;">Phase 3: Quantum Delocalization (Wave-Particle)</text>
        <text class="phase-text" fill="#7209B7" style="animation: showP4 12s infinite;">Phase 4: Electron Spin (Magnetic Moment)</text>
    </g>

    <!-- Background Orbit Path (Rotated Ellipse) -->
    <g transform="translate(400, 250)">
        <ellipse cx="0" cy="0" rx="250" ry="150" fill="none" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6 6" transform="rotate(-45)" />
    </g>

    <!-- Main Atom Group -->
    <g transform="translate(400, 250)">
        
        <!-- Nucleus (Strong Force) -->
        <g style="animation: jitter 0.1s infinite;">
            <!-- Phase 1 Highlight -->
            <circle cx="0" cy="0" r="22" fill="none" stroke="#FF3366" stroke-width="2" style="animation: phase1Highlight 12s infinite;" />
            
            <!-- Strong Force Springs -->
            <path d="M -6 -6 L 6 6 M -6 6 L 6 -6" stroke="#FF3366" style="animation: strongPulse 0.5s infinite alternate;" />
            <circle cx="0" cy="0" r="16" fill="none" stroke="#FF3366" stroke-dasharray="4 4" style="animation: strongPulse 0.5s infinite alternate;" />
            
            <!-- Nucleons -->
            <circle cx="-6" cy="-6" r="7" fill="#FF3366" />
            <circle cx="6" cy="6" r="7" fill="#FF3366" />
            <circle cx="-6" cy="6" r="7" fill="#ADB5BD" />
            <circle cx="6" cy="-6" r="7" fill="#ADB5BD" />
        </g>
        <text x="0" y="45" class="label" fill="#FF3366" text-anchor="middle">Nucleus: Strong Force (F<tspan baseline-shift="sub" font-size="9">s</tspan>)</text>

        <!-- Rotating Orbit System -->
        <g style="animation: rotate 12s linear infinite; transform-origin: 0 0;">
            <!-- Radial Distance System -->
            <g style="animation: radius 6s ease-in-out infinite; transform-origin: 0 0;">
                
                <!-- Phase 2: Coulomb Interaction -->
                <g style="animation: coulombFade 12s infinite;">
                    <!-- Electric Field Line (Dashed) -->
                    <line x1="0" y1="0" x2="-1" y2="0" stroke="#F77F00" stroke-width="2" stroke-dasharray="0.04 0.04" style="animation: dashedLineScale 6s ease-in-out infinite; transform-origin: 0 0;" />
                    
                    <!-- Coulomb Force Arrow (Dynamic Length) -->
                    <line x1="0" y1="0" x2="-1" y2="0" stroke="#F77F00" stroke-width="3" style="animation: arrowLineScale 6s ease-in-out infinite; transform-origin: 0 0;" />
                    <g style="animation: arrowHeadMove 6s ease-in-out infinite; transform-origin: 0 0;">
                        <path d="M 0 0 L 12 -6 L 12 6 Z" fill="#F77F00" />
                    </g>
                    
                    <!-- Coulomb Label -->
                    <text x="-135" y="-12" class="math" font-size="13" fill="#F77F00">F<tspan baseline-shift="sub" font-size="10">c</tspan> ∝ 1/r²</text>
                </g>

                <!-- Counter-Rotated Elements (Keeps labels and spin upright) -->
                <g style="animation: counterRotate 12s linear infinite; transform-origin: 0 0;">
                    
                    <!-- Phase 3: Wave Function -->
                    <g style="animation: waveAppear 12s infinite;">
                        <circle cx="0" cy="0" r="35" fill="url(#waveGrad)" filter="url(#glow)" />
                        <circle cx="0" cy="0" r="10" fill="none" stroke="#00B4D8" style="animation: ripple 2s linear infinite;" />
                        <circle cx="0" cy="0" r="10" fill="none" stroke="#00B4D8" style="animation: ripple 2s linear infinite 1s;" />
                        <text x="0" y="-45" class="label" fill="#00B4D8" text-anchor="middle">ψ (Probability Cloud)</text>
                    </g>

                    <!-- Phase 4: Electron Spin -->
                    <g style="animation: spinAppear 12s infinite;">
                        <!-- Precession Path -->
                        <ellipse cx="0" cy="-56.5" rx="20.5" ry="5" fill="none" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
                        
                        <!-- Spin Vector -->
                        <g style="animation: precess 2s infinite; transform-origin: 0 0;">
                            <line x1="0" y1="0" x2="0" y2="-55" stroke="#7209B7" stroke-width="3" />
                            <path d="M 0 -62 L -5 -52 L 5 -52 Z" fill="#7209B7" />
                        </g>
                        
                        <text x="35" y="-60" class="label" fill="#7209B7">Electron Spin (s)</text>
                    </g>
                </g>

                <!-- The Electron Particle -->
                <circle cx="0" cy="0" r="8" fill="#00B4D8" style="animation: electronFade 12s infinite;" />

            </g>
        </g>
    </g>

    <!-- Formula Overlay (Bottom Left) -->
    <g transform="translate(30, 400)">
        <rect x="0" y="0" width="230" height="70" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
        <text x="15" y="28" class="math" font-size="14" fill="#FF3366">F<tspan baseline-shift="sub" font-size="10">s</tspan> > F<tspan baseline-shift="sub" font-size="10">c</tspan> <tspan fill="#6c757d" font-size="12" font-family="Inter" font-weight="normal">(at 10⁻¹⁵m)</tspan></text>
        <text x="15" y="52" class="math" font-size="14" fill="#7209B7">μ = -g<tspan baseline-shift="sub" font-size="10">s</tspan> (e/2m) S</text>
    </g>

    <!-- Energy Bar Chart (Top Right) -->
    <g transform="translate(640, 80)">
        <rect x="0" y="0" width="130" height="130" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
        <text x="65" y="22" class="label" text-anchor="middle" fill="#212529">Orbital Energy</text>
        
        <!-- Zero Energy Line -->
        <line x1="10" y1="60" x2="120" y2="60" stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 2" />
        
        <!-- Kinetic Energy (Red) -->
        <rect x="25" y="60" width="16" height="30" fill="#FF3366" style="animation: kineticBar 6s ease-in-out infinite; transform-origin: 0 60px;" />
        <text x="33" y="115" class="label" text-anchor="middle" fill="#FF3366">K</text>
        
        <!-- Potential Energy (Blue) -->
        <rect x="57" y="60" width="16" height="60" fill="#4361EE" style="animation: potentialBar 6s ease-in-out infinite;" />
        <text x="65" y="115" class="label" text-anchor="middle" fill="#4361EE">U</text>
        
        <!-- Total Energy (Green) -->
        <rect x="89" y="60" width="16" height="30" fill="#06D6A0" />
        <text x="97" y="115" class="label" text-anchor="middle" fill="#06D6A0">E</text>
    </g>

    <!-- Legend (Bottom Right) -->
    <g transform="translate(620, 370)">
        <rect x="0" y="0" width="150" height="100" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))" />
        
        <circle cx="15" cy="20" r="5" fill="#FF3366" />
        <text x="30" y="24" class="label" fill="#495057">Proton / Strong</text>
        
        <circle cx="15" cy="42" r="5" fill="#00B4D8" />
        <text x="30" y="46" class="label" fill="#495057">Electron / Wave</text>
        
        <circle cx="15" cy="64" r="5" fill="#F77F00" />
        <text x="30" y="68" class="label" fill="#495057">Coulomb Force</text>
        
        <circle cx="15" cy="86" r="5" fill="#7209B7" />
        <text x="30" y="90" class="label" fill="#495057">Magnetic Spin</text>
    </g>

</svg>

</body>
</html>
