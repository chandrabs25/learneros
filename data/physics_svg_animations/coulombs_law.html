<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coulomb's Law Interactive Visualization</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --pos-color: #FF3366;
            --neg-color: #4361EE;
            --force-color: #FF3366;
            --field-color: #F77F00;
            --dist-color: #00B4D8;
            --text-main: #333333;
            --text-muted: #666666;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--bg-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            padding: 20px;
            background-color: #ffffff;
            border-top: 1px solid #dee2e6;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            background-color: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        button:hover {
            background-color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }

        button:active {
            transform: translateY(0);
        }

        /* 
         * CSS Animation Driver 
         * We animate a hidden dummy element to strictly use CSS keyframes for the timing/easing logic.
         * JS will only read this value to sync the SVG attributes, preventing vector distortion.
         */
        @keyframes physics-engine {
            0%, 15% { left: 300px; }
            45%, 55% { left: 120px; }
            85%, 100% { left: 300px; }
        }

        #animation-driver {
            position: absolute;
            visibility: hidden;
            pointer-events: none;
            animation: physics-engine 8s ease-in-out infinite;
        }

        .field-line {
            stroke: var(--field-color);
            stroke-width: 1.5;
            opacity: 0.2;
            stroke-dasharray: 4 4;
        }
    </style>
</head>
<body>

    <!-- Hidden element driven by CSS keyframes to control the animation state -->
    <div id="animation-driver"></div>

    <div class="container">
        <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowhead for Force Vectors -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--force-color)" />
                </marker>

                <!-- Drop Shadow for Particles -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
                </filter>
                
                <filter id="box-shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
                </filter>
            </defs>

            <!-- Title & Description -->
            <text x="30" y="45" font-family="Inter" font-size="24" font-weight="700" fill="var(--text-main)">Coulomb's Law: Electrostatic Force</text>
            <text x="30" y="70" font-family="Inter" font-size="15" fill="var(--text-muted)">Observe how force scales with the inverse square of distance.</text>

            <!-- Legend -->
            <g transform="translate(30, 420)">
                <rect x="0" y="0" width="160" height="60" rx="6" fill="white" filter="url(#box-shadow)" />
                <text x="10" y="20" font-family="Inter" font-size="12" font-weight="600" fill="var(--text-main)">Legend:</text>
                <circle cx="16" cy="36" r="6" fill="var(--pos-color)" />
                <text x="28" y="40" font-family="Inter" font-size="11" fill="var(--text-muted)">Positive</text>
                <circle cx="86" cy="36" r="6" fill="var(--neg-color)" />
                <text x="98" y="40" font-family="Inter" font-size="11" fill="var(--text-muted)">Negative</text>
            </g>

            <!-- Formula Box -->
            <g transform="translate(560, 25)">
                <rect x="0" y="0" width="210" height="90" rx="8" fill="white" filter="url(#box-shadow)" />
                <text x="105" y="35" text-anchor="middle" font-family="Roboto Mono" font-size="20" font-weight="700" fill="var(--text-main)">
                    F = k <tspan fill="var(--text-main)">|q₁q₂|</tspan> / <tspan fill="var(--dist-color)">r²</tspan>
                </text>
                <text id="f-val-display" x="105" y="70" text-anchor="middle" font-family="Roboto Mono" font-size="18" fill="var(--force-color)" font-weight="700">
                    F = 0.100 N
                </text>
            </g>

            <!-- Electric Field Lines (Background) -->
            <g id="field-q1" transform="translate(250, 250)">
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(0)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(45)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(90)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(135)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(180)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(225)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(270)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(315)" />
            </g>
            <g id="field-q2" transform="translate(550, 250)">
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(0)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(45)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(90)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(135)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(180)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(225)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(270)" />
                <line x1="0" y1="0" x2="800" y2="0" class="field-line" transform="rotate(315)" />
            </g>

            <!-- Distance Indicator -->
            <g id="distance-group">
                <line id="dist-line" x1="250" y1="330" x2="550" y2="330" stroke="var(--dist-color)" stroke-width="2" stroke-dasharray="6,6" />
                <line id="dist-tick-1" x1="250" y1="320" x2="250" y2="340" stroke="var(--dist-color)" stroke-width="2" />
                <line id="dist-tick-2" x1="550" y1="320" x2="550" y2="340" stroke="var(--dist-color)" stroke-width="2" />
                <rect id="dist-bg" x="360" y="340" width="80" height="24" rx="4" fill="var(--bg-color)" />
                <text id="dist-label" x="400" y="357" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="600" fill="var(--dist-color)">r = 3.00 m</text>
            </g>

            <!-- Force Vectors -->
            <g id="force-vectors">
                <line id="force-1" y1="250" y2="250" stroke="var(--force-color)" stroke-width="5" marker-end="url(#arrowhead)" />
                <text id="force-1-label" y="230" text-anchor="middle" font-family="Inter" font-size="16" fill="var(--force-color)" font-weight="700">F₁₂</text>
                
                <line id="force-2" y1="250" y2="250" stroke="var(--force-color)" stroke-width="5" marker-end="url(#arrowhead)" />
                <text id="force-2-label" y="230" text-anchor="middle" font-family="Inter" font-size="16" fill="var(--force-color)" font-weight="700">F₂₁</text>
            </g>

            <!-- Particles (Drawn last to stay on top of vectors) -->
            <g id="q1" transform="translate(250, 250)">
                <circle r="22" fill="var(--pos-color)" filter="url(#shadow)" stroke="#d90429" stroke-width="2" />
                <text y="4" text-anchor="middle" fill="white" font-family="Inter" font-size="14" font-weight="700">q₁</text>
                <text y="-32" text-anchor="middle" fill="var(--pos-color)" font-family="Inter" font-size="20" font-weight="700">+</text>
            </g>

            <g id="q2-group" transform="translate(550, 250)">
                <circle id="q2-circle" r="22" fill="var(--pos-color)" filter="url(#shadow)" stroke="#d90429" stroke-width="2" />
                <text y="4" text-anchor="middle" fill="white" font-family="Inter" font-size="14" font-weight="700">q₂</text>
                <text id="q2-sign" y="-32" text-anchor="middle" fill="var(--pos-color)" font-family="Inter" font-size="20" font-weight="700">+</text>
            </g>

        </svg>

        <div class="controls">
            <button id="toggle-btn">Toggle q₂ Sign (Currently +)</button>
        </div>
    </div>

    <script>
        // Physics Constants & State
        const Q1_X = 250; // Fixed position of q1
        let isPositive = true;
        let sign = 1; // 1 for repulsion, -1 for attraction

        // DOM Elements
        const driver = document.getElementById('animation-driver');
        const q2Group = document.getElementById('q2-group');
        const fieldQ2 = document.getElementById('field-q2');
        
        const f1 = document.getElementById('force-1');
        const f2 = document.getElementById('force-2');
        const f1Label = document.getElementById('force-1-label');
        const f2Label = document.getElementById('force-2-label');
        
        const distLine = document.getElementById('dist-line');
        const distTick2 = document.getElementById('dist-tick-2');
        const distLabel = document.getElementById('dist-label');
        const distBg = document.getElementById('dist-bg');
        const fValDisplay = document.getElementById('f-val-display');

        const toggleBtn = document.getElementById('toggle-btn');
        const q2Circle = document.getElementById('q2-circle');
        const q2Sign = document.getElementById('q2-sign');

        // Toggle Interaction
        toggleBtn.addEventListener('click', () => {
            isPositive = !isPositive;
            sign = isPositive ? 1 : -1;
            
            if (isPositive) {
                q2Circle.setAttribute('fill', 'var(--pos-color)');
                q2Circle.setAttribute('stroke', '#d90429');
                q2Sign.setAttribute('fill', 'var(--pos-color)');
                q2Sign.textContent = '+';
                toggleBtn.textContent = 'Toggle q₂ Sign (Currently +)';
            } else {
                q2Circle.setAttribute('fill', 'var(--neg-color)');
                q2Circle.setAttribute('stroke', '#2b41a8');
                q2Sign.setAttribute('fill', 'var(--neg-color)');
                q2Sign.textContent = '−';
                toggleBtn.textContent = 'Toggle q₂ Sign (Currently −)';
            }
        });

        // Main Sync Loop
        // Reads the CSS animation state and updates SVG attributes for perfect physics accuracy
        function updatePhysics() {
            // Read current distance (r) from the CSS-animated dummy element
            const r_px = parseFloat(window.getComputedStyle(driver).left);
            
            // Map pixels to meters (100px = 1m)
            const r_m = r_px / 100;
            
            // Calculate Force (Inverse Square Law)
            // F = k * |q1*q2| / r^2. Using arbitrary constant to make visual scale nice.
            const f_n = 0.899 / (r_m * r_m);
            
            // Map force to visual arrow length
            const arrow_len = f_n * 300; 

            // Calculate Positions
            const q2_x = Q1_X + r_px;

            // Update Particle & Field Positions
            q2Group.setAttribute('transform', `translate(${q2_x}, 250)`);
            fieldQ2.setAttribute('transform', `translate(${q2_x}, 250)`);

            // Update Distance Indicator
            distLine.setAttribute('x2', q2_x);
            distTick2.setAttribute('x1', q2_x);
            distTick2.setAttribute('x2', q2_x);
            
            const mid_x = Q1_X + r_px / 2;
            distLabel.setAttribute('x', mid_x);
            distBg.setAttribute('x', mid_x - 40);
            distLabel.textContent = `r = ${r_m.toFixed(2)} m`;

            // Update Force Vectors
            if (sign === 1) {
                // Repulsion: Arrows point away from each other
                f1.setAttribute('x1', Q1_X);
                f1.setAttribute('x2', Q1_X - arrow_len);
                f1Label.setAttribute('x', Q1_X - arrow_len / 2);

                f2.setAttribute('x1', q2_x);
                f2.setAttribute('x2', q2_x + arrow_len);
                f2Label.setAttribute('x', q2_x + arrow_len / 2);
            } else {
                // Attraction: Arrows point towards each other
                f1.setAttribute('x1', Q1_X);
                f1.setAttribute('x2', Q1_X + arrow_len);
                f1Label.setAttribute('x', Q1_X + arrow_len / 2);

                f2.setAttribute('x1', q2_x);
                f2.setAttribute('x2', q2_x - arrow_len);
                f2Label.setAttribute('x', q2_x - arrow_len / 2);
            }

            // Update Formula Text
            fValDisplay.textContent = `F = ${f_n.toFixed(3)} N`;

            // Loop
            requestAnimationFrame(updatePhysics);
        }

        // Start animation loop
        requestAnimationFrame(updatePhysics);
    </script>
</body>
</html>
