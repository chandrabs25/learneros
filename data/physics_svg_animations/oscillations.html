<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Harmonic Motion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Simple Harmonic Motion: The Basis of Waves</title>
        <desc>An animated mass-spring system demonstrating simple harmonic motion, showing the relationship between displacement, velocity, restoring force, and energy conservation.</desc>

        <!-- Definitions for Arrowheads -->
        <defs>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            
            <!-- Wall Hatching Pattern -->
            <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10">
                <path d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke="#6c757d" stroke-width="1.5"/>
            </pattern>
        </defs>

        <!-- Title and Subtitle -->
        <text x="400" y="40" font-weight="700" font-size="22" fill="#212529" text-anchor="middle">Simple Harmonic Motion: The Basis of Waves</text>
        <text x="400" y="65" font-weight="400" font-size="14" fill="#495057" text-anchor="middle">Interplay of displacement, restoring force, velocity, and energy</text>

        <!-- Legend -->
        <rect x="30" y="85" width="160" height="100" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6" />
        <text x="40" y="105" font-weight="600" font-size="12" fill="#495057">Vectors:</text>
        
        <line x1="40" y1="120" x2="60" y2="120" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
        <text x="75" y="124" class="math" font-size="13" fill="#4361EE">x⃗ (Displacement)</text>
        
        <line x1="40" y1="145" x2="60" y2="145" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
        <text x="75" y="149" class="math" font-size="13" fill="#06D6A0">v⃗ (Velocity)</text>
        
        <line x1="40" y1="170" x2="60" y2="170" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
        <text x="75" y="174" class="math" font-size="13" fill="#FF3366">F⃗ (Force)</text>

        <!-- Static Scenery -->
        <!-- Floor -->
        <line x1="30" y1="400" x2="620" y2="400" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
        <text x="325" y="425" font-weight="400" font-size="14" fill="#6c757d" text-anchor="middle">Frictionless Surface</text>

        <!-- Wall -->
        <rect x="30" y="180" width="40" height="220" fill="url(#hatch)" stroke="#495057" stroke-width="2"/>
        <rect x="70" y="180" width="4" height="220" fill="#495057"/>

        <!-- Equilibrium and Amplitude Markers -->
        <line x1="350" y1="180" x2="350" y2="415" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="350" y="435" class="math" font-size="14" fill="#6c757d" text-anchor="middle">x = 0</text>

        <line x1="210" y1="400" x2="210" y2="410" stroke="#adb5bd" stroke-width="2"/>
        <text x="210" y="425" class="math" font-size="14" fill="#adb5bd" text-anchor="middle">-A</text>

        <line x1="490" y1="400" x2="490" y2="410" stroke="#adb5bd" stroke-width="2"/>
        <text x="490" y="425" class="math" font-size="14" fill="#adb5bd" text-anchor="middle">+A</text>

        <!-- Energy Bars Section -->
        <rect x="640" y="120" width="130" height="300" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="8"/>
        <text x="705" y="145" font-weight="600" font-size="14" fill="#495057" text-anchor="middle">Energy</text>
        
        <!-- Energy Bar Tracks -->
        <rect x="655" y="170" width="20" height="200" fill="#e9ecef" rx="3"/>
        <rect x="695" y="170" width="20" height="200" fill="#e9ecef" rx="3"/>
        <rect x="735" y="170" width="20" height="200" fill="#e9ecef" rx="3"/>

        <!-- Dynamic Energy Bars -->
        <rect id="bar-u" x="655" y="370" width="20" height="0" fill="#4361EE" rx="3"/>
        <rect id="bar-k" x="695" y="370" width="20" height="0" fill="#FF3366" rx="3"/>
        <rect id="bar-e" x="735" y="170" width="20" height="200" fill="#06D6A0" rx="3"/>

        <!-- Energy Labels -->
        <text x="665" y="395" class="math" font-size="16" fill="#4361EE" text-anchor="middle">U</text>
        <text x="705" y="395" class="math" font-size="16" fill="#FF3366" text-anchor="middle">K</text>
        <text x="745" y="395" class="math" font-size="16" fill="#06D6A0" text-anchor="middle">E</text>

        <!-- Dynamic System Elements -->
        <!-- Spring -->
        <path id="spring" d="" fill="none" stroke="#8d99ae" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

        <!-- Vectors -->
        <line id="vec-x" x1="350" y1="270" x2="350" y2="270" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
        <text id="label-x" class="math" font-size="16" fill="#4361EE" font-weight="600" text-anchor="middle" display="none">x⃗</text>

        <line id="vec-v" x1="350" y1="315" x2="350" y2="315" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
        <text id="label-v" class="math" font-size="16" fill="#06D6A0" font-weight="600" display="none">v⃗</text>

        <line id="vec-f" x1="350" y1="370" x2="350" y2="370" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
        <text id="label-f" class="math" font-size="16" fill="#FF3366" font-weight="600" display="none">F⃗ = -kx⃗</text>

        <!-- Mass -->
        <g id="mass-group" transform="translate(350, 370)">
            <rect x="-40" y="-30" width="80" height="60" fill="#2b2d42" rx="6" stroke="#1a1b28" stroke-width="2"/>
            <text x="-25" y="-10" class="math" font-size="16" fill="#ffffff" font-style="italic">m</text>
            <!-- Center dot -->
            <circle cx="0" cy="0" r="3" fill="#ffffff" opacity="0.5"/>
        </g>

    </svg>
</div>

<script>
    // Physics Constants
    const A = 140; // Amplitude in pixels
    const T = 4000; // Period in milliseconds (4 seconds)
    const omega = (2 * Math.PI) / T;
    const eqX = 350; // Equilibrium X position
    const massY = 370; // Center Y of the mass
    const maxEnergyHeight = 200; // Max height for energy bars

    // DOM Elements
    const massGroup = document.getElementById('mass-group');
    const springPath = document.getElementById('spring');
    
    const vecX = document.getElementById('vec-x');
    const labelX = document.getElementById('label-x');
    
    const vecV = document.getElementById('vec-v');
    const labelV = document.getElementById('label-v');
    
    const vecF = document.getElementById('vec-f');
    const labelF = document.getElementById('label-f');
    
    const barU = document.getElementById('bar-u');
    const barK = document.getElementById('bar-k');

    let startTime = null;

    function generateSpringPath(startX, endX, y) {
        const coils = 12;
        const straightLen = 15;
        const width = endX - startX - (2 * straightLen);
        const step = width / coils;
        const h = 18; // coil height

        let d = `M ${startX} ${y} L ${startX + straightLen} ${y} `;

        for (let i = 0; i < coils; i++) {
            const cx = startX + straightLen + i * step;
            d += `L ${cx + step * 0.25} ${y - h} `;
            d += `L ${cx + step * 0.75} ${y + h} `;
            d += `L ${cx + step} ${y} `;
        }
        
        d += `L ${endX} ${y}`;
        return d;
    }

    function updateVector(line, label, x1, y1, x2, y2, offset, isForce = false) {
        const length = x2 - x1;
        const absLength = Math.abs(length);

        if (absLength < 5) {
            line.setAttribute('display', 'none');
            label.setAttribute('display', 'none');
        } else {
            line.setAttribute('display', 'inline');
            label.setAttribute('display', 'inline');
            
            // Adjust start/end slightly to not hide the arrowhead inside the mass
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);

            const isRight = length > 0;
            
            if (isForce) {
                // Force label positioning
                label.setAttribute('x', x2 + (isRight ? 15 : -15));
                label.setAttribute('y', y2 + 5);
                label.setAttribute('text-anchor', isRight ? 'start' : 'end');
            } else {
                // General label positioning
                label.setAttribute('x', x1 + length / 2);
                label.setAttribute('y', y2 + offset);
                label.setAttribute('text-anchor', 'middle');
            }
        }
    }

    function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const elapsed = timestamp - startTime;
        
        // Calculate physics variables
        // x(t) = A * cos(omega * t)
        const x = A * Math.cos(omega * elapsed);
        
        // v(t) = -A * omega * sin(omega * t)
        // Normalized for visual length (max length = 100px)
        const vVisual = -100 * Math.sin(omega * elapsed);
        
        // F(t) = -k * x(t)
        // Normalized for visual length (max length = 100px)
        const fVisual = -x * (100 / A);

        const currentX = eqX + x;

        // 1. Update Mass Position
        massGroup.setAttribute('transform', `translate(${currentX}, ${massY})`);

        // 2. Update Spring
        springPath.setAttribute('d', generateSpringPath(74, currentX - 40, massY));

        // 3. Update Vectors
        // Displacement (x)
        updateVector(vecX, labelX, eqX, 270, currentX, 270, -12);
        
        // Velocity (v)
        updateVector(vecV, labelV, currentX, 315, currentX + vVisual, 315, -12);
        
        // Force (F)
        updateVector(vecF, labelF, currentX, massY, currentX + fVisual, massY, 0, true);

        // 4. Update Energy Bars
        // U is proportional to x^2
        const uRatio = Math.pow(x / A, 2);
        const uHeight = maxEnergyHeight * uRatio;
        
        // K is proportional to v^2 (which is sin^2)
        const kRatio = Math.pow(Math.sin(omega * elapsed), 2);
        const kHeight = maxEnergyHeight * kRatio;

        barU.setAttribute('height', uHeight);
        barU.setAttribute('y', 170 + (maxEnergyHeight - uHeight));

        barK.setAttribute('height', kHeight);
        barK.setAttribute('y', 170 + (maxEnergyHeight - kHeight));

        requestAnimationFrame(animate);
    }

    // Start animation
    requestAnimationFrame(animate);
</script>

</body>
</html>
