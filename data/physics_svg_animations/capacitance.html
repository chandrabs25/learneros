<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capacitance: Energy & Field Confinement</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .math { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .label { font-size: 13px; fill: #495057; }
        .bold { font-weight: 600; }

        /* Animations */
        @keyframes switch-anim {
            0%, 20% { transform: rotate(-40deg); }
            25%, 80% { transform: rotate(0deg); }
            85%, 100% { transform: rotate(-40deg); }
        }

        @keyframes charge-anim {
            0%, 20% { opacity: 0; transform: scale(0); }
            55%, 80% { opacity: 1; transform: scale(1); }
            85%, 90% { opacity: 0; transform: scale(0); }
            100% { opacity: 0; transform: scale(0); }
        }

        @keyframes efield-anim {
            0%, 20% { stroke-dashoffset: 100; opacity: 0; }
            55%, 80% { stroke-dashoffset: 0; opacity: 1; }
            85%, 90% { stroke-dashoffset: 100; opacity: 0; }
            100% { stroke-dashoffset: 100; opacity: 0; }
        }

        @keyframes meter-anim {
            0%, 20% { transform: scaleY(0); }
            55%, 80% { transform: scaleY(1); }
            85%, 90% { transform: scaleY(0); }
            100% { transform: scaleY(0); }
        }

        @keyframes fade-anim {
            0%, 20% { opacity: 0; }
            55%, 80% { opacity: 1; }
            85%, 90% { opacity: 0; }
            100% { opacity: 0; }
        }

        /* Element Classes */
        .switch-blade {
            transform-origin: 100px 170px;
            animation: switch-anim 10s infinite ease-in-out;
        }

        .charge {
            transform-box: fill-box;
            transform-origin: center;
            animation: charge-anim 10s infinite ease-in-out;
        }

        .efield {
            stroke: #F77F00;
            stroke-width: 3;
            fill: none;
            marker-end: url(#arrow);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: efield-anim 10s infinite ease-in-out;
            filter: url(#glow);
        }

        .meter-fill {
            transform-origin: 690px 350px;
            animation: meter-anim 10s infinite ease-in-out;
        }

        .fade-label {
            animation: fade-anim 10s infinite ease-in-out;
        }

        /* Staggered Delays for Wave Effect */
        .d0 { animation-delay: 0.0s; }
        .d1 { animation-delay: 0.1s; }
        .d2 { animation-delay: 0.2s; }
        .d3 { animation-delay: 0.3s; }
        .d4 { animation-delay: 0.4s; }
        .d5 { animation-delay: 0.5s; }
        .d6 { animation-delay: 0.6s; }
        .d7 { animation-delay: 0.7s; }
        .d8 { animation-delay: 0.8s; }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead for Electric Field -->
        <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
        </marker>

        <!-- Small Arrowhead for Annotations -->
        <marker id="small-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#ADB5BD"/>
        </marker>

        <!-- Plate Metallic Gradient -->
        <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#CED4DA"/>
            <stop offset="50%" stop-color="#ADB5BD"/>
            <stop offset="100%" stop-color="#6C757D"/>
        </linearGradient>

        <!-- Energy Meter Gradient -->
        <linearGradient id="meterGrad" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="#06D6A0" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#06D6A0" stop-opacity="1"/>
        </linearGradient>

        <!-- Glow Filter for E-Field -->
        <filter id="glow">
            <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="800" height="500" fill="#f8f9fa"/>

    <!-- Title -->
    <text x="400" y="45" text-anchor="middle" class="title">Capacitance: Energy &amp; Field Confinement</text>

    <!-- ================= CIRCUIT & BATTERY ================= -->
    <g stroke="#495057" stroke-width="2" fill="none">
        <!-- Top Wire -->
        <path d="M 250 140 L 100 140 L 100 170"/>
        <!-- Bottom Wire -->
        <path d="M 100 250 L 100 360 L 250 360"/>
        <!-- Wire between switch and battery -->
        <path d="M 100 200 L 100 230"/>
    </g>

    <!-- Battery Symbol -->
    <g stroke="#495057">
        <line x1="80" y1="230" x2="120" y2="230" stroke-width="3"/> <!-- Positive -->
        <line x1="90" y1="250" x2="110" y2="250" stroke-width="5"/> <!-- Negative -->
    </g>
    <text x="65" y="236" class="math" font-size="16" fill="#FF3366">+</text>
    <text x="65" y="256" class="math" font-size="16" fill="#4361EE">-</text>

    <!-- Switch -->
    <circle cx="100" cy="170" r="3" fill="#495057"/>
    <circle cx="100" cy="200" r="3" fill="#495057"/>
    <line x1="100" y1="170" x2="100" y2="200" stroke="#495057" stroke-width="3" stroke-linecap="round" class="switch-blade"/>

    <!-- ================= PLATES ================= -->
    <!-- Top Plate -->
    <rect x="250" y="130" width="300" height="20" fill="url(#plateGrad)" rx="3" stroke="#6C757D" stroke-width="1"/>
    <!-- Bottom Plate -->
    <rect x="250" y="350" width="300" height="20" fill="url(#plateGrad)" rx="3" stroke="#6C757D" stroke-width="1"/>

    <!-- Plate Labels -->
    <text x="565" y="145" class="math fade-label" font-size="18" fill="#FF3366">+Q</text>
    <text x="565" y="365" class="math fade-label" font-size="18" fill="#4361EE">-Q</text>

    <!-- ================= ELECTRIC FIELD & CHARGES ================= -->
    <!-- Group 0: x = 250 (Left Fringing) -->
    <g class="d0">
        <path d="M 250 160 C 200 200, 200 300, 250 335" class="efield" pathLength="100"/>
        <circle cx="250" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="250" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 1: x = 287.5 -->
    <g class="d1">
        <line x1="287.5" y1="160" x2="287.5" y2="335" class="efield" pathLength="100"/>
        <circle cx="287.5" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="287.5" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 2: x = 325 -->
    <g class="d2">
        <line x1="325" y1="160" x2="325" y2="335" class="efield" pathLength="100"/>
        <circle cx="325" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="325" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 3: x = 362.5 -->
    <g class="d3">
        <line x1="362.5" y1="160" x2="362.5" y2="335" class="efield" pathLength="100"/>
        <circle cx="362.5" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="362.5" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 4: x = 400 (Center) -->
    <g class="d4">
        <line x1="400" y1="160" x2="400" y2="335" class="efield" pathLength="100"/>
        <circle cx="400" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="400" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 5: x = 437.5 -->
    <g class="d5">
        <line x1="437.5" y1="160" x2="437.5" y2="335" class="efield" pathLength="100"/>
        <circle cx="437.5" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="437.5" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 6: x = 475 -->
    <g class="d6">
        <line x1="475" y1="160" x2="475" y2="335" class="efield" pathLength="100"/>
        <circle cx="475" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="475" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 7: x = 512.5 -->
    <g class="d7">
        <line x1="512.5" y1="160" x2="512.5" y2="335" class="efield" pathLength="100"/>
        <circle cx="512.5" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="512.5" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- Group 8: x = 550 (Right Fringing) -->
    <g class="d8">
        <path d="M 550 160 C 600 200, 600 300, 550 335" class="efield" pathLength="100"/>
        <circle cx="550" cy="155" r="5" fill="#FF3366" class="charge"/>
        <circle cx="550" cy="345" r="5" fill="#4361EE" class="charge"/>
    </g>

    <!-- E-Field Formula Label -->
    <g class="fade-label d4">
        <rect x="360" y="238" width="80" height="24" fill="#f8f9fa" opacity="0.85" rx="4"/>
        <text x="400" y="255" text-anchor="middle" class="math" font-size="15" fill="#F77F00">E = σ/ε₀</text>
    </g>

    <!-- ================= ENERGY METER ================= -->
    <text x="690" y="135" text-anchor="middle" class="label bold">Stored Energy</text>
    <rect x="675" y="150" width="30" height="200" fill="#e9ecef" stroke="#ADB5BD" stroke-width="2" rx="4"/>
    <rect x="675" y="150" width="30" height="200" fill="url(#meterGrad)" rx="4" class="meter-fill"/>
    
    <!-- Meter Ticks -->
    <line x1="705" y1="150" x2="715" y2="150" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="705" y1="250" x2="715" y2="250" stroke="#ADB5BD" stroke-width="2"/>
    <line x1="705" y1="350" x2="715" y2="350" stroke="#ADB5BD" stroke-width="2"/>

    <!-- ================= ANNOTATIONS & FORMULAS ================= -->
    <!-- Formula Box -->
    <rect x="630" y="380" width="120" height="65" fill="#ffffff" stroke="#ADB5BD" stroke-width="2" rx="6" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="690" y="405" text-anchor="middle" class="math" font-size="16" fill="#212529">Q ∝ V</text>
    <text x="690" y="430" text-anchor="middle" class="math" font-size="16" fill="#212529">C = Q/V</text>

    <!-- Fringing Field Annotation -->
    <text x="210" y="245" text-anchor="end" class="label bold">Fringing fields:</text>
    <text x="210" y="263" text-anchor="end" class="label">Most energy is confined</text>
    <text x="210" y="281" text-anchor="end" class="label">between the plates.</text>
    <path d="M 220 250 Q 235 250 235 230" fill="none" stroke="#ADB5BD" stroke-width="1.5" marker-end="url(#small-arrow)"/>

    <!-- ================= LEGEND ================= -->
    <rect x="30" y="380" width="180" height="90" fill="#ffffff" stroke="#ADB5BD" stroke-width="1" rx="6" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
    <text x="40" y="400" class="label bold" font-size="12">Legend</text>
    
    <circle cx="45" cy="420" r="5" fill="#FF3366"/>
    <text x="60" y="424" class="label" font-size="12">Positive Charge (+q)</text>
    
    <circle cx="45" cy="440" r="5" fill="#4361EE"/>
    <text x="60" y="444" class="label" font-size="12">Negative Charge (-q)</text>
    
    <line x1="40" y1="460" x2="52" y2="460" stroke="#F77F00" stroke-width="3"/>
    <polygon points="52,457 58,460 52,463" fill="#F77F00"/>
    <text x="60" y="464" class="label" font-size="12">Electric Field (E)</text>

</svg>

</body>
</html>
