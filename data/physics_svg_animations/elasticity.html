<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elasticity: The Microscopic Mechanism of Wave Propagation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #212529;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            margin: 10px 0 5px 0;
            text-align: center;
        }
        p.subtitle {
            font-size: 14px;
            color: #6c757d;
            margin-bottom: 20px;
            text-align: center;
        }
        svg {
            width: 100%;
            height: auto;
            max-height: 500px;
            display: block;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            gap: 15px;
        }
        button {
            background-color: #495057;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #343a40;
        }
        button.active {
            background-color: #06D6A0;
            color: #212529;
        }

        /* CSS Animations */
        .particle, .spring-wrapper {
            animation-duration: 8s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .spring-path {
            animation-duration: 8s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }
        .force-arrow, .label-anim {
            animation-duration: 8s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Particle Translations */
        @keyframes trans-p0 {
            0%, 10% { transform: translateX(0px); }
            20% { transform: translateX(40px); }
            30% { transform: translateX(0px); }
            40% { transform: translateX(-15px); }
            50%, 100% { transform: translateX(0px); }
        }
        @keyframes trans-p1 {
            0%, 20% { transform: translateX(0px); }
            30% { transform: translateX(40px); }
            40% { transform: translateX(0px); }
            50% { transform: translateX(-15px); }
            60%, 100% { transform: translateX(0px); }
        }
        @keyframes trans-p2 {
            0%, 30% { transform: translateX(0px); }
            40% { transform: translateX(40px); }
            50% { transform: translateX(0px); }
            60% { transform: translateX(-15px); }
            70%, 100% { transform: translateX(0px); }
        }
        @keyframes trans-p3 {
            0%, 40% { transform: translateX(0px); }
            50% { transform: translateX(40px); }
            60% { transform: translateX(0px); }
            70% { transform: translateX(-15px); }
            80%, 100% { transform: translateX(0px); }
        }
        @keyframes trans-p4 {
            0%, 50% { transform: translateX(0px); }
            60% { transform: translateX(40px); }
            70% { transform: translateX(0px); }
            80% { transform: translateX(-15px); }
            90%, 100% { transform: translateX(0px); }
        }

        .p0-anim { animation-name: trans-p0; }
        .p1-anim { animation-name: trans-p1; }
        .p2-anim { animation-name: trans-p2; }
        .p3-anim { animation-name: trans-p3; }
        .p4-anim { animation-name: trans-p4; }

        /* Spring Scaling */
        @keyframes scale-s0 {
            0%, 10% { transform: scaleX(1); }
            20% { transform: scaleX(0.7333); }
            30% { transform: scaleX(1.2666); }
            40% { transform: scaleX(1.1); }
            50% { transform: scaleX(0.9); }
            60%, 100% { transform: scaleX(1); }
        }
        @keyframes scale-s1 {
            0%, 20% { transform: scaleX(1); }
            30% { transform: scaleX(0.7333); }
            40% { transform: scaleX(1.2666); }
            50% { transform: scaleX(1.1); }
            60% { transform: scaleX(0.9); }
            70%, 100% { transform: scaleX(1); }
        }
        @keyframes scale-s2 {
            0%, 30% { transform: scaleX(1); }
            40% { transform: scaleX(0.7333); }
            50% { transform: scaleX(1.2666); }
            60% { transform: scaleX(1.1); }
            70% { transform: scaleX(0.9); }
            80%, 100% { transform: scaleX(1); }
        }
        @keyframes scale-s3 {
            0%, 40% { transform: scaleX(1); }
            50% { transform: scaleX(0.7333); }
            60% { transform: scaleX(1.2666); }
            70% { transform: scaleX(1.1); }
            80% { transform: scaleX(0.9); }
            90%, 100% { transform: scaleX(1); }
        }

        .s0-anim { animation-name: scale-s0; }
        .s1-anim { animation-name: scale-s1; }
        .s2-anim { animation-name: scale-s2; }
        .s3-anim { animation-name: scale-s3; }

        /* Restoring Force Arrows (d attribute animation) */
        @keyframes force-s0 {
            0%, 10% { d: path('M 175 220 L 175 220 L 175 220 M 175 220 L 175 220 M 175 220 L 175 220 L 175 220 M 175 220 L 175 220'); }
            20% { d: path('M 140 220 L 100 220 L 108 215 M 100 220 L 108 225 M 250 220 L 290 220 L 282 215 M 290 220 L 282 225'); }
            30% { d: path('M 100 220 L 140 220 L 132 215 M 140 220 L 132 225 M 290 220 L 250 220 L 258 215 M 250 220 L 258 225'); }
            40% { d: path('M 85 220 L 100 220 L 92 215 M 100 220 L 92 225 M 250 220 L 235 220 L 243 215 M 235 220 L 243 225'); }
            50% { d: path('M 100 220 L 85 220 L 93 215 M 85 220 L 93 225 M 235 220 L 250 220 L 242 215 M 250 220 L 242 225'); }
            60%, 100% { d: path('M 175 220 L 175 220 L 175 220 M 175 220 L 175 220 M 175 220 L 175 220 L 175 220 M 175 220 L 175 220'); }
        }
        @keyframes force-s1 {
            0%, 20% { d: path('M 325 220 L 325 220 L 325 220 M 325 220 L 325 220 M 325 220 L 325 220 L 325 220 M 325 220 L 325 220'); }
            30% { d: path('M 290 220 L 250 220 L 258 215 M 250 220 L 258 225 M 400 220 L 440 220 L 432 215 M 440 220 L 432 225'); }
            40% { d: path('M 250 220 L 290 220 L 282 215 M 290 220 L 282 225 M 440 220 L 400 220 L 408 215 M 400 220 L 408 225'); }
            50% { d: path('M 235 220 L 250 220 L 242 215 M 250 220 L 242 225 M 400 220 L 385 220 L 393 215 M 385 220 L 393 225'); }
            60% { d: path('M 250 220 L 235 220 L 243 215 M 235 220 L 243 225 M 385 220 L 400 220 L 392 215 M 400 220 L 392 225'); }
            70%, 100% { d: path('M 325 220 L 325 220 L 325 220 M 325 220 L 325 220 M 325 220 L 325 220 L 325 220 M 325 220 L 325 220'); }
        }
        @keyframes force-s2 {
            0%, 30% { d: path('M 475 220 L 475 220 L 475 220 M 475 220 L 475 220 M 475 220 L 475 220 L 475 220 M 475 220 L 475 220'); }
            40% { d: path('M 440 220 L 400 220 L 408 215 M 400 220 L 408 225 M 550 220 L 590 220 L 582 215 M 590 220 L 582 225'); }
            50% { d: path('M 400 220 L 440 220 L 432 215 M 440 220 L 432 225 M 590 220 L 550 220 L 558 215 M 550 220 L 558 225'); }
            60% { d: path('M 385 220 L 400 220 L 392 215 M 400 220 L 392 225 M 550 220 L 535 220 L 543 215 M 535 220 L 543 225'); }
            70% { d: path('M 400 220 L 385 220 L 393 215 M 385 220 L 393 225 M 535 220 L 550 220 L 542 215 M 550 220 L 542 225'); }
            80%, 100% { d: path('M 475 220 L 475 220 L 475 220 M 475 220 L 475 220 M 475 220 L 475 220 L 475 220 M 475 220 L 475 220'); }
        }
        @keyframes force-s3 {
            0%, 40% { d: path('M 625 220 L 625 220 L 625 220 M 625 220 L 625 220 M 625 220 L 625 220 L 625 220 M 625 220 L 625 220'); }
            50% { d: path('M 590 220 L 550 220 L 558 215 M 550 220 L 558 225 M 700 220 L 740 220 L 732 215 M 740 220 L 732 225'); }
            60% { d: path('M 550 220 L 590 220 L 582 215 M 590 220 L 582 225 M 740 220 L 700 220 L 708 215 M 700 220 L 708 225'); }
            70% { d: path('M 535 220 L 550 220 L 542 215 M 550 220 L 542 225 M 700 220 L 685 220 L 693 215 M 685 220 L 693 225'); }
            80% { d: path('M 550 220 L 535 220 L 543 215 M 535 220 L 543 225 M 685 220 L 700 220 L 692 215 M 700 220 L 692 225'); }
            90%, 100% { d: path('M 625 220 L 625 220 L 625 220 M 625 220 L 625 220 M 625 220 L 625 220 L 625 220 M 625 220 L 625 220'); }
        }

        .f-s0-anim { animation-name: force-s0; }
        .f-s1-anim { animation-name: force-s1; }
        .f-s2-anim { animation-name: force-s2; }
        .f-s3-anim { animation-name: force-s3; }

        /* Applied Force Arrow */
        @keyframes force-ext {
            0%, 9.9% { d: path('M 40 250 L 40 250 L 40 250 M 40 250 L 40 250'); opacity: 0; }
            10% { d: path('M 40 250 L 85 250 L 77 245 M 85 250 L 77 255'); opacity: 1; }
            15% { d: path('M 60 250 L 105 250 L 97 245 M 105 250 L 97 255'); opacity: 1; }
            20%, 100% { d: path('M 140 250 L 140 250 L 140 250 M 140 250 L 140 250'); opacity: 0; }
        }
        .f-ext-anim { animation-name: force-ext; }

        /* Displacement Arrow */
        @keyframes force-dx {
            0%, 10% { d: path('M 100 300 L 100 300 L 100 300 M 100 300 L 100 300'); opacity: 0; }
            11% { opacity: 1; }
            20% { d: path('M 100 300 L 140 300 L 132 295 M 140 300 L 132 305'); }
            30% { d: path('M 100 300 L 100 300 L 100 300 M 100 300 L 100 300'); }
            40% { d: path('M 100 300 L 85 300 L 93 295 M 85 300 L 93 305'); }
            49% { opacity: 1; }
            50%, 100% { d: path('M 100 300 L 100 300 L 100 300 M 100 300 L 100 300'); opacity: 0; }
        }
        .f-dx-anim { animation-name: force-dx; }

        /* Label Opacity Animations */
        @keyframes label-fext {
            0%, 9% { opacity: 0; }
            10%, 18% { opacity: 1; }
            20%, 100% { opacity: 0; }
        }
        @keyframes label-fres {
            0%, 29% { opacity: 0; }
            35%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        @keyframes label-dx {
            0%, 9% { opacity: 0; }
            15%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        .l-fext-anim { animation-name: label-fext; }
        .l-fres-anim { animation-name: label-fres; }
        .l-dx-anim { animation-name: label-dx; }

        .math-font { font-family: 'Roboto Mono', monospace; font-size: 14px; }
        .legend-text { font-size: 12px; fill: #6c757d; }
    </style>
</head>
<body>

<div class="container">
    <h1>Elasticity & Wave Propagation</h1>
    <p class="subtitle">Intermolecular elastic forces act as the restoring mechanism for longitudinal waves.</p>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2" />
            </filter>
        </defs>

        <!-- Background Grid / Ground -->
        <line x1="50" y1="265" x2="750" y2="265" stroke="#DEE2E6" stroke-width="2" />

        <!-- Equilibrium Lines -->
        <g stroke="#DEE2E6" stroke-dasharray="5,5" stroke-width="1.5">
            <line x1="100" y1="150" x2="100" y2="350" />
            <line x1="250" y1="150" x2="250" y2="350" />
            <line x1="400" y1="150" x2="400" y2="350" />
            <line x1="550" y1="150" x2="550" y2="350" />
            <line x1="700" y1="150" x2="700" y2="350" />
        </g>

        <!-- Springs and Particles -->
        <!-- Spring 0 & Particle 0 -->
        <g class="particle p0-anim">
            <path d="M 100 250 L 115 250 L 125 230 L 145 270 L 165 230 L 185 270 L 205 230 L 225 270 L 235 250 L 250 250" 
                  fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linejoin="round" 
                  vector-effect="non-scaling-stroke" style="transform-origin: 100px 250px;" class="spring-path s0-anim" />
            <circle cx="100" cy="250" r="12" fill="#495057" filter="url(#shadow)" />
        </g>

        <!-- Spring 1 & Particle 1 -->
        <g class="particle p1-anim">
            <path d="M 250 250 L 265 250 L 275 230 L 295 270 L 315 230 L 335 270 L 355 230 L 375 270 L 385 250 L 400 250" 
                  fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linejoin="round" 
                  vector-effect="non-scaling-stroke" style="transform-origin: 250px 250px;" class="spring-path s1-anim" />
            <circle cx="250" cy="250" r="12" fill="#495057" filter="url(#shadow)" />
        </g>

        <!-- Spring 2 & Particle 2 -->
        <g class="particle p2-anim">
            <path d="M 400 250 L 415 250 L 425 230 L 445 270 L 465 230 L 485 270 L 505 230 L 525 270 L 535 250 L 550 250" 
                  fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linejoin="round" 
                  vector-effect="non-scaling-stroke" style="transform-origin: 400px 250px;" class="spring-path s2-anim" />
            <circle cx="400" cy="250" r="12" fill="#495057" filter="url(#shadow)" />
        </g>

        <!-- Spring 3 & Particle 3 -->
        <g class="particle p3-anim">
            <path d="M 550 250 L 565 250 L 575 230 L 595 270 L 615 230 L 635 270 L 655 230 L 675 270 L 685 250 L 700 250" 
                  fill="none" stroke="#ADB5BD" stroke-width="3" stroke-linejoin="round" 
                  vector-effect="non-scaling-stroke" style="transform-origin: 550px 250px;" class="spring-path s3-anim" />
            <circle cx="550" cy="250" r="12" fill="#495057" filter="url(#shadow)" />
        </g>

        <!-- Particle 4 (End of chain) -->
        <g class="particle p4-anim">
            <circle cx="700" cy="250" r="12" fill="#495057" filter="url(#shadow)" />
        </g>

        <!-- Force Vectors -->
        <!-- Restoring Forces (Blue) -->
        <g fill="none" stroke="#4361EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path class="force-arrow f-s0-anim" d="M 175 220 L 175 220 L 175 220 M 175 220 L 175 220 M 175 220 L 175 220 L 175 220 M 175 220 L 175 220" />
            <path class="force-arrow f-s1-anim" d="M 325 220 L 325 220 L 325 220 M 325 220 L 325 220 M 325 220 L 325 220 L 325 220 M 325 220 L 325 220" />
            <path class="force-arrow f-s2-anim" d="M 475 220 L 475 220 L 475 220 M 475 220 L 475 220 M 475 220 L 475 220 L 475 220 M 475 220 L 475 220" />
            <path class="force-arrow f-s3-anim" d="M 625 220 L 625 220 L 625 220 M 625 220 L 625 220 M 625 220 L 625 220 L 625 220 M 625 220 L 625 220" />
        </g>

        <!-- Applied Force (Red) -->
        <path class="force-arrow f-ext-anim" fill="none" stroke="#FF3366" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" 
              d="M 40 250 L 40 250 L 40 250 M 40 250 L 40 250" />

        <!-- Displacement Vector (Green) -->
        <path class="force-arrow f-dx-anim" fill="none" stroke="#06D6A0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" 
              d="M 100 300 L 100 300 L 100 300 M 100 300 L 100 300" />

        <!-- Dynamic Labels -->
        <text x="60" y="235" fill="#FF3366" font-weight="600" font-size="14px" class="label-anim l-fext-anim math-font">F_ext</text>
        <text x="475" y="195" fill="#4361EE" font-weight="600" font-size="14px" text-anchor="middle" class="label-anim l-fres-anim math-font">F_restoring = -kΔx</text>
        <text x="120" y="325" fill="#06D6A0" font-weight="600" font-size="14px" text-anchor="middle" class="label-anim l-dx-anim math-font">Δx</text>

        <!-- Static Formula Box -->
        <rect x="610" y="40" width="160" height="50" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" filter="url(#shadow)" />
        <text x="690" y="62" fill="#212529" font-size="12px" font-weight="600" text-anchor="middle">Hooke's Law</text>
        <text x="690" y="80" fill="#4361EE" font-size="14px" font-weight="600" text-anchor="middle" class="math-font">F ∝ -Δx</text>

        <!-- Legend -->
        <g transform="translate(50, 420)">
            <rect x="0" y="0" width="700" height="50" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" />
            
            <line x1="20" y1="25" x2="40" y2="25" stroke="#FF3366" stroke-width="3" />
            <text x="48" y="29" class="legend-text">Applied Force</text>
            
            <line x1="150" y1="25" x2="170" y2="25" stroke="#4361EE" stroke-width="3" />
            <text x="178" y="29" class="legend-text">Restoring Force</text>
            
            <line x1="295" y1="25" x2="315" y2="25" stroke="#06D6A0" stroke-width="3" />
            <text x="323" y="29" class="legend-text">Displacement (Δx)</text>

            <path d="M 450 25 L 455 20 L 465 30 L 470 25" fill="none" stroke="#ADB5BD" stroke-width="2" />
            <text x="478" y="29" class="legend-text">Elastic Bond</text>

            <circle cx="575" cy="25" r="6" fill="#495057" />
            <text x="588" y="29" class="legend-text">Particle Mass</text>
        </g>
    </svg>

    <div class="controls">
        <button id="playBtn" onclick="togglePlay()">Pause</button>
        <button id="slowBtn" onclick="toggleSlow()">Slow Motion</button>
    </div>
</div>

<script>
    let isPlaying = true;
    let isSlow = false;

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getAnimations().forEach(anim => {
            if (isPlaying) {
                anim.play();
            } else {
                anim.pause();
            }
        });
        document.getElementById('playBtn').innerText = isPlaying ? 'Pause' : 'Play';
    }

    function toggleSlow() {
        isSlow = !isSlow;
        document.getAnimations().forEach(anim => {
            anim.playbackRate = isSlow ? 0.25 : 1;
        });
        const slowBtn = document.getElementById('slowBtn');
        slowBtn.innerText = isSlow ? 'Normal Speed' : 'Slow Motion';
        if (isSlow) {
            slowBtn.classList.add('active');
        } else {
            slowBtn.classList.remove('active');
        }
    }
</script>

</body>
</html>
