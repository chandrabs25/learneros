<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modes of Heat Transfer & Newton's Law of Cooling</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --red: #FF3366;
            --blue: #4361EE;
            --green: #06D6A0;
            --orange: #F77F00;
            --purple: #7209B7;
            --bg: #f8f9fa;
            --text: #2b2d42;
            --grid: #dee2e6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 0.5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #6c757d;
            margin: 0;
        }

        .svg-container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* --- Master 10s Loop Animations --- */
        
        /* Flame Ignition & Flicker */
        .animated .flame-wrapper {
            animation: ignite 10s infinite;
            transform-origin: 150px 350px;
        }
        .animated .flame-path {
            animation: flicker 0.4s infinite alternate;
            transform-origin: 150px 350px;
        }

        @keyframes ignite {
            0%, 5% { opacity: 0; transform: scale(0.2); }
            10%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }

        @keyframes flicker {
            0% { transform: scale(1) rotate(0deg); }
            33% { transform: scale(1.05) rotate(-2deg); }
            66% { transform: scale(0.95) rotate(3deg); }
            100% { transform: scale(1.02) rotate(-1deg); }
        }

        /* Rod Heating Gradient */
        .animated .rod-stop-1 { animation: heatRod1 10s infinite; }
        .animated .rod-stop-2 { animation: heatRod2 10s infinite; }

        @keyframes heatRod1 {
            0%, 10% { stop-color: var(--blue); }
            20%, 95% { stop-color: var(--red); }
            100% { stop-color: var(--blue); }
        }
        @keyframes heatRod2 {
            0%, 30% { stop-color: var(--blue); }
            50%, 95% { stop-color: var(--purple); }
            100% { stop-color: var(--blue); }
        }

        /* Conduction Atoms Heat Front */
        .animated .col-0 { animation: vib-0 0.05s infinite alternate, heat-col-0 10s infinite; }
        .animated .col-1 { animation: vib-1 0.06s infinite alternate, heat-col-1 10s infinite; }
        .animated .col-2 { animation: vib-2 0.055s infinite alternate, heat-col-2 10s infinite; }
        .animated .col-3 { animation: vib-3 0.065s infinite alternate, heat-col-3 10s infinite; }
        .animated .col-4 { animation: vib-4 0.05s infinite alternate, heat-col-4 10s infinite; }
        .animated .col-5 { animation: vib-5 0.06s infinite alternate, heat-col-5 10s infinite; }
        .animated .col-6 { animation: vib-6 0.055s infinite alternate, heat-col-6 10s infinite; }
        .animated .col-7 { animation: vib-7 0.065s infinite alternate, heat-col-7 10s infinite; }
        .animated .col-8 { animation: vib-8 0.05s infinite alternate, heat-col-8 10s infinite; }
        .animated .col-9 { animation: vib-9 0.06s infinite alternate, heat-col-9 10s infinite; }

        /* Heat Front Opacity Keyframes */
        @keyframes heat-col-0 { 0%, 10% { opacity: 0; } 15%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-1 { 0%, 12% { opacity: 0; } 17%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-2 { 0%, 14% { opacity: 0; } 19%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-3 { 0%, 16% { opacity: 0; } 21%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-4 { 0%, 18% { opacity: 0; } 23%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-5 { 0%, 20% { opacity: 0; } 25%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-6 { 0%, 22% { opacity: 0; } 27%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-7 { 0%, 24% { opacity: 0; } 29%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-8 { 0%, 26% { opacity: 0; } 31%, 95% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes heat-col-9 { 0%, 28% { opacity: 0; } 33%, 95% { opacity: 1; } 100% { opacity: 0; } }

        /* Vibration Amplitudes (decreasing away from heat source) */
        @keyframes vib-0 { to { transform: translate(3px, -3px); } }
        @keyframes vib-1 { to { transform: translate(2.5px, -2.5px); } }
        @keyframes vib-2 { to { transform: translate(2px, -2px); } }
        @keyframes vib-3 { to { transform: translate(1.5px, -1.5px); } }
        @keyframes vib-4 { to { transform: translate(1.2px, -1.2px); } }
        @keyframes vib-5 { to { transform: translate(1px, -1px); } }
        @keyframes vib-6 { to { transform: translate(0.8px, -0.8px); } }
        @keyframes vib-7 { to { transform: translate(0.6px, -0.6px); } }
        @keyframes vib-8 { to { transform: translate(0.4px, -0.4px); } }
        @keyframes vib-9 { to { transform: translate(0.2px, -0.2px); } }

        /* Convection Flow */
        .animated .convection-group {
            animation: showProcess 10s infinite;
        }
        .animated .convection-path {
            animation: flow 1.5s linear infinite;
        }
        @keyframes flow {
            to { stroke-dashoffset: -30; }
        }

        /* Radiation Waves */
        .animated .radiation-group {
            animation: showProcess 10s infinite;
        }
        .animated .rad-wave {
            animation: shootWave 2s linear infinite;
        }
        @keyframes shootWave {
            from { stroke-dashoffset: 30; }
            to { stroke-dashoffset: -150; }
        }

        /* General Process Visibility */
        @keyframes showProcess {
            0%, 10% { opacity: 0; }
            20%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Cooling Curve Drawing */
        .animated .drawn-curve {
            animation: drawCurve 10s linear infinite;
        }
        @keyframes drawCurve {
            0%, 20% { stroke-dashoffset: 400; }
            80%, 95% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 400; }
        }

        /* Controls */
        #restart-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            padding: 8px 16px;
            background: var(--blue);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 13px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s, transform 0.1s;
            z-index: 10;
        }
        #restart-btn:hover { background: #324ed4; }
        #restart-btn:active { transform: scale(0.95); }

    </style>
</head>
<body>

    <div class="header">
        <h1>MODES OF HEAT TRANSFER & NEWTON'S LAW OF COOLING</h1>
        <p class="subtitle">Observe the physical mechanisms (left) and the resulting mathematical behavior (right)</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" class="animated" id="main-svg" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Heat Transfer and Newton's Law of Cooling Animation</title>
            <desc id="svg-desc">An animated diagram showing conduction, convection, and radiation on the left, and a graph of Newton's Law of Cooling on the right.</desc>

            <defs>
                <!-- Rod Gradient -->
                <linearGradient id="rod-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="var(--blue)" class="rod-stop-1" />
                    <stop offset="100%" stop-color="var(--blue)" class="rod-stop-2" />
                </linearGradient>

                <!-- Convection Gradients (Hot to Cold) -->
                <linearGradient id="conv-grad-right" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="var(--red)"/>
                    <stop offset="40%" stop-color="var(--green)"/>
                    <stop offset="100%" stop-color="var(--blue)"/>
                </linearGradient>
                <linearGradient id="conv-grad-left" x1="0" y1="1" x2="0" y2="0">
                    <stop offset="0%" stop-color="var(--red)"/>
                    <stop offset="40%" stop-color="var(--green)"/>
                    <stop offset="100%" stop-color="var(--blue)"/>
                </linearGradient>

                <!-- Radiation Gradient (Fade out) -->
                <linearGradient id="rad-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="var(--orange)" stop-opacity="1"/>
                    <stop offset="80%" stop-color="var(--orange)" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="var(--orange)" stop-opacity="0"/>
                </linearGradient>

                <!-- Radiation Wave Path -->
                <path id="rad-wave-path" d="M 0,0 q 7,-7 15,0 t 15,0 t 15,0 t 15,0 t 15,0 t 15,0 t 15,0 t 15,0" fill="none" stroke="url(#rad-grad)" stroke-width="2.5" stroke-linecap="round" />

                <!-- Cooling Curve Path Definition for animateMotion -->
                <path id="cooling-curve-path" d="M 450,160 L 480,223 L 510,261 L 540,284 L 570,298 L 600,306 L 630,312 L 660,315 L 690,317 L 720,318 L 750,319" fill="none" />
                
                <!-- Arrowhead Marker for Axes -->
                <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0,1 L 8,5 L 0,9 z" fill="#6c757d" />
                </marker>
            </defs>

            <!-- Background Divider -->
            <line x1="400" y1="60" x2="400" y2="460" stroke="#e9ecef" stroke-width="2" stroke-dasharray="6 6" />

            <!-- ==========================================
                 LEFT PANEL: PHYSICAL PROCESS
                 ========================================== -->
            <g id="left-panel">
                
                <!-- Radiation (EM Waves) -->
                <g class="radiation-group" opacity="0">
                    <use href="#rad-wave-path" x="150" y="340" transform="rotate(-15 150 340)" stroke-dasharray="30 150" class="rad-wave" />
                    <use href="#rad-wave-path" x="150" y="340" transform="rotate(-45 150 340)" stroke-dasharray="30 150" class="rad-wave" style="animation-delay: -0.5s;" />
                    <use href="#rad-wave-path" x="150" y="340" transform="rotate(-135 150 340)" stroke-dasharray="30 150" class="rad-wave" style="animation-delay: -1s;" />
                    <use href="#rad-wave-path" x="150" y="340" transform="rotate(-165 150 340)" stroke-dasharray="30 150" class="rad-wave" style="animation-delay: -1.5s;" />
                    
                    <!-- Radiation Label -->
                    <text x="80" y="440" text-anchor="middle" font-size="13" class="math" fill="var(--orange)" font-weight="600">P = σeAT⁴</text>
                    <text x="80" y="456" text-anchor="middle" font-size="11" fill="var(--orange)">Radiation</text>
                </g>

                <!-- Convection (Fluid Flow Loops) -->
                <g class="convection-group" opacity="0">
                    <!-- Right Loop -->
                    <path d="M 160,330 L 160,180 Q 160,130 210,130 Q 260,130 260,180 L 260,260 Q 260,330 210,330 L 180,330" fill="none" stroke="url(#conv-grad-right)" stroke-width="3" stroke-dasharray="15 15" class="convection-path" stroke-linecap="round" />
                    <!-- Left Loop -->
                    <path d="M 140,330 L 140,180 Q 140,130 90,130 Q 40,130 40,180 L 40,260 Q 40,330 90,330 L 120,330" fill="none" stroke="url(#conv-grad-left)" stroke-width="3" stroke-dasharray="15 15" class="convection-path" stroke-linecap="round" />
                    
                    <!-- Convection Label -->
                    <text x="150" y="100" text-anchor="middle" font-size="13" font-weight="600" fill="var(--green)">Convection (Fluid Motion)</text>
                </g>

                <!-- Conduction (Metallic Rod & Atoms) -->
                <g id="conduction-rod">
                    <!-- Rod Background -->
                    <rect x="160" y="370" width="230" height="60" rx="6" fill="url(#rod-grad)" stroke="#2b2d42" stroke-width="2" />
                    
                    <!-- Static Base Atoms (Cold) -->
                    <g fill="#fff" opacity="0.25">
                        <!-- Col 0 to 9 -->
                        <circle cx="175" cy="378" r="4"/><circle cx="175" cy="392" r="4"/><circle cx="175" cy="406" r="4"/><circle cx="175" cy="420" r="4"/>
                        <circle cx="198" cy="378" r="4"/><circle cx="198" cy="392" r="4"/><circle cx="198" cy="406" r="4"/><circle cx="198" cy="420" r="4"/>
                        <circle cx="221" cy="378" r="4"/><circle cx="221" cy="392" r="4"/><circle cx="221" cy="406" r="4"/><circle cx="221" cy="420" r="4"/>
                        <circle cx="244" cy="378" r="4"/><circle cx="244" cy="392" r="4"/><circle cx="244" cy="406" r="4"/><circle cx="244" cy="420" r="4"/>
                        <circle cx="267" cy="378" r="4"/><circle cx="267" cy="392" r="4"/><circle cx="267" cy="406" r="4"/><circle cx="267" cy="420" r="4"/>
                        <circle cx="290" cy="378" r="4"/><circle cx="290" cy="392" r="4"/><circle cx="290" cy="406" r="4"/><circle cx="290" cy="420" r="4"/>
                        <circle cx="313" cy="378" r="4"/><circle cx="313" cy="392" r="4"/><circle cx="313" cy="406" r="4"/><circle cx="313" cy="420" r="4"/>
                        <circle cx="336" cy="378" r="4"/><circle cx="336" cy="392" r="4"/><circle cx="336" cy="406" r="4"/><circle cx="336" cy="420" r="4"/>
                        <circle cx="359" cy="378" r="4"/><circle cx="359" cy="392" r="4"/><circle cx="359" cy="406" r="4"/><circle cx="359" cy="420" r="4"/>
                        <circle cx="382" cy="378" r="4"/><circle cx="382" cy="392" r="4"/><circle cx="382" cy="406" r="4"/><circle cx="382" cy="420" r="4"/>
                    </g>

                    <!-- Vibrating Atoms (Heat Front) -->
                    <g fill="#fff">
                        <g class="col-0" opacity="0"><circle cx="175" cy="378" r="4"/><circle cx="175" cy="392" r="4"/><circle cx="175" cy="406" r="4"/><circle cx="175" cy="420" r="4"/></g>
                        <g class="col-1" opacity="0"><circle cx="198" cy="378" r="4"/><circle cx="198" cy="392" r="4"/><circle cx="198" cy="406" r="4"/><circle cx="198" cy="420" r="4"/></g>
                        <g class="col-2" opacity="0"><circle cx="221" cy="378" r="4"/><circle cx="221" cy="392" r="4"/><circle cx="221" cy="406" r="4"/><circle cx="221" cy="420" r="4"/></g>
                        <g class="col-3" opacity="0"><circle cx="244" cy="378" r="4"/><circle cx="244" cy="392" r="4"/><circle cx="244" cy="406" r="4"/><circle cx="244" cy="420" r="4"/></g>
                        <g class="col-4" opacity="0"><circle cx="267" cy="378" r="4"/><circle cx="267" cy="392" r="4"/><circle cx="267" cy="406" r="4"/><circle cx="267" cy="420" r="4"/></g>
                        <g class="col-5" opacity="0"><circle cx="290" cy="378" r="4"/><circle cx="290" cy="392" r="4"/><circle cx="290" cy="406" r="4"/><circle cx="290" cy="420" r="4"/></g>
                        <g class="col-6" opacity="0"><circle cx="313" cy="378" r="4"/><circle cx="313" cy="392" r="4"/><circle cx="313" cy="406" r="4"/><circle cx="313" cy="420" r="4"/></g>
                        <g class="col-7" opacity="0"><circle cx="336" cy="378" r="4"/><circle cx="336" cy="392" r="4"/><circle cx="336" cy="406" r="4"/><circle cx="336" cy="420" r="4"/></g>
                        <g class="col-8" opacity="0"><circle cx="359" cy="378" r="4"/><circle cx="359" cy="392" r="4"/><circle cx="359" cy="406" r="4"/><circle cx="359" cy="420" r="4"/></g>
                        <g class="col-9" opacity="0"><circle cx="382" cy="378" r="4"/><circle cx="382" cy="392" r="4"/><circle cx="382" cy="406" r="4"/><circle cx="382" cy="420" r="4"/></g>
                    </g>

                    <!-- Conduction Label (Fourier's Law) -->
                    <text x="280" y="456" class="math" font-size="14" font-weight="600">Q = -kA</text>
                    <text x="345" y="448" class="math" font-size="12">dT</text>
                    <line x1="343" y1="452" x2="363" y2="452" stroke="var(--text)" stroke-width="1.5"/>
                    <text x="345" y="464" class="math" font-size="12">dx</text>
                    <text x="295" y="478" text-anchor="middle" font-size="11" fill="#6c757d">Conduction (Lattice Vibration)</text>
                </g>

                <!-- Heat Source (Flame) -->
                <g class="flame-wrapper" opacity="0">
                    <!-- Outer Flame -->
                    <path d="M 150,410 Q 120,410 120,370 Q 120,320 150,290 Q 180,320 180,370 Q 180,410 150,410 Z" fill="var(--orange)" class="flame-path" />
                    <!-- Mid Flame -->
                    <path d="M 150,410 Q 130,410 130,380 Q 130,340 150,310 Q 170,340 170,380 Q 170,410 150,410 Z" fill="#FF5400" class="flame-path" style="animation-delay: 0.1s;" />
                    <!-- Inner Flame -->
                    <path d="M 150,410 Q 140,410 140,390 Q 140,360 150,340 Q 160,360 160,390 Q 160,410 150,410 Z" fill="#FFD166" class="flame-path" style="animation-delay: 0.2s;" />
                </g>

            </g>

            <!-- ==========================================
                 RIGHT PANEL: MATHEMATICAL GRAPH
                 ========================================== -->
            <g id="right-panel">
                
                <text x="600" y="100" text-anchor="middle" font-size="16" font-weight="700">Newton's Law of Cooling</text>
                
                <!-- Graph Grid -->
                <g stroke="var(--grid)" stroke-width="1">
                    <line x1="450" y1="266" x2="750" y2="266" />
                    <line x1="450" y1="213" x2="750" y2="213" />
                    <line x1="450" y1="160" x2="750" y2="160" />
                    <line x1="525" y1="380" x2="525" y2="130" />
                    <line x1="600" y1="380" x2="600" y2="130" />
                    <line x1="675" y1="380" x2="675" y2="130" />
                </g>

                <!-- Ambient Temperature Line (Asymptote) -->
                <line x1="450" y1="320" x2="750" y2="320" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" />
                <text x="760" y="324" font-size="12" class="math" fill="#6c757d">T_s</text>
                <text x="425" y="164" font-size="12" class="math" fill="#6c757d">T_0</text>

                <!-- Axes -->
                <line x1="450" y1="380" x2="760" y2="380" stroke="#495057" stroke-width="2" marker-end="url(#arrow-axis)" />
                <line x1="450" y1="380" x2="450" y2="120" stroke="#495057" stroke-width="2" marker-end="url(#arrow-axis)" />
                
                <!-- Axis Labels -->
                <text x="430" y="250" text-anchor="middle" transform="rotate(-90 430 250)" font-size="13" font-weight="600">Temperature (T)</text>
                <text x="600" y="410" text-anchor="middle" font-size="13" font-weight="600">Time (t)</text>

                <!-- Equation -->
                <text x="600" y="450" text-anchor="middle" font-size="15" class="math" fill="var(--red)" font-weight="600">T(t) = T_s + (T_0 - T_s)e<tspan dy="-6" font-size="11">-kt</tspan></text>

                <!-- The Cooling Curve -->
                <use href="#cooling-curve-path" stroke="var(--red)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="400" class="drawn-curve" />

                <!-- Tracing Point (Dot) -->
                <circle r="6" fill="var(--red)">
                    <!-- Motion syncs with the drawCurve animation (20% to 80% of 10s loop) -->
                    <animateMotion dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 0.8; 1" keyPoints="0; 0; 1; 1">
                        <mpath href="#cooling-curve-path"/>
                    </animateMotion>
                    <!-- Fade in/out to match the line drawing -->
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.19; 0.2; 0.95; 0.96; 1" dur="10s" repeatCount="indefinite" />
                </circle>

            </g>

            <!-- Legend -->
            <g id="legend" transform="translate(30, 30)">
                <rect x="0" y="0" width="110" height="90" fill="white" stroke="#e9ecef" rx="4" opacity="0.9"/>
                
                <circle cx="15" cy="20" r="5" fill="var(--red)"/>
                <text x="28" y="24" font-size="11">High Energy</text>
                
                <circle cx="15" cy="40" r="5" fill="var(--blue)"/>
                <text x="28" y="44" font-size="11">Low Energy</text>
                
                <line x1="10" y1="60" x2="20" y2="60" stroke="var(--green)" stroke-width="2" stroke-dasharray="4 2"/>
                <text x="28" y="64" font-size="11">Fluid Flow</text>
                
                <path d="M 10,80 q 2.5,-2.5 5,0 t 5,0" fill="none" stroke="var(--orange)" stroke-width="2"/>
                <text x="28" y="84" font-size="11">EM Radiation</text>
            </g>

        </svg>
        
        <button id="restart-btn">Restart Animation</button>
    </div>

    <script>
        // Minimal JavaScript to handle the Restart Animation functionality
        document.getElementById('restart-btn').addEventListener('click', () => {
            const svg = document.getElementById('main-svg');
            
            // Restart CSS animations by toggling the class
            svg.classList.remove('animated');
            // Trigger reflow to ensure the browser registers the class removal
            void svg.offsetWidth;
            svg.classList.add('animated');
            
            // Restart SMIL animations (<animate>, <animateMotion>)
            svg.setCurrentTime(0);
        });
    </script>
</body>
</html>
