<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Theory of Surface Tension</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        
        /* CSS Animations */
        .bulk-arrows {
            transform-origin: 0 0;
            animation: pulse-bulk 10s ease-in-out infinite;
        }
        .molecule-b-group {
            animation: dip-molecule 10s ease-in-out infinite;
        }
        .surface-arrows {
            transform-origin: 0 0;
            animation: intensify-surface 10s ease-in-out infinite;
        }
        .net-force {
            transform-origin: 0 0;
            animation: grow-net-force 10s ease-in-out infinite;
        }
        
        @keyframes pulse-bulk {
            0%, 30%, 100% { transform: scale(0.9); }
            15% { transform: scale(1.1); }
        }
        
        @keyframes dip-molecule {
            0%, 30%, 100% { transform: translate(400px, 150px); }
            40%, 60% { transform: translate(400px, 165px); }
        }
        
        @keyframes intensify-surface {
            0%, 30%, 100% { transform: scale(1); stroke-width: 3px; }
            40%, 60% { transform: scale(1.15); stroke-width: 4px; }
        }
        
        @keyframes grow-net-force {
            0%, 30%, 100% { transform: scaleY(0); opacity: 0; }
            40%, 60% { transform: scaleY(1); opacity: 1; }
        }
        
        /* Typography */
        text {
            font-family: 'Inter', sans-serif;
            fill: #212529;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .label-muted {
            fill: #adb5bd;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .label-liquid {
            fill: #0077B6;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Molecular Theory of Surface Tension</title>
        <desc>An animated diagram showing the cohesive forces on a molecule in the bulk of a liquid compared to a molecule on the surface, illustrating the net inward force that causes surface tension.</desc>
        
        <defs>
            <!-- Arrowhead for Red Cohesive Forces -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <!-- Arrowhead for Green Net Force -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
        </defs>

        <!-- Background Elements -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        
        <!-- Liquid Fill -->
        <rect x="200" y="150" width="400" height="300" fill="#CAF0F8" />
        
        <!-- Beaker Container -->
        <path d="M 200 100 L 200 450 L 600 450 L 600 100" fill="none" stroke="#E9ECEF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
        
        <!-- Environment Labels -->
        <text x="220" y="135" class="label-muted">AIR (VAPOR)</text>
        <text x="220" y="175" class="label-liquid">LIQUID</text>

        <!-- Surface Line with SMIL Animation (Syncs with CSS Keyframes) -->
        <path fill="none" stroke="#0077B6" stroke-width="4" stroke-linecap="round">
            <animate attributeName="d" 
                     values="M 200 150 Q 400 150 600 150; 
                             M 200 150 Q 400 150 600 150; 
                             M 200 150 Q 400 180 600 150; 
                             M 200 150 Q 400 180 600 150; 
                             M 200 150 Q 400 150 600 150; 
                             M 200 150 Q 400 150 600 150" 
                     keyTimes="0; 0.3; 0.4; 0.6; 0.7; 1" 
                     dur="10s" 
                     repeatCount="indefinite" />
        </path>

        <!-- Title -->
        <text x="400" y="50" font-size="24" font-weight="700" text-anchor="middle">Molecular Theory of Surface Tension</text>

        <!-- Molecule A (Bulk) -->
        <g transform="translate(400, 330)">
            <!-- Cohesive Forces (Symmetrical) -->
            <g class="bulk-arrows" stroke="#FF3366" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)">
                <line x1="0" y1="0" x2="0" y2="-45" />
                <line x1="0" y1="0" x2="0" y2="45" />
                <line x1="0" y1="0" x2="-45" y2="0" />
                <line x1="0" y1="0" x2="45" y2="0" />
                <line x1="0" y1="0" x2="31.8" y2="-31.8" />
                <line x1="0" y1="0" x2="-31.8" y2="-31.8" />
                <line x1="0" y1="0" x2="31.8" y2="31.8" />
                <line x1="0" y1="0" x2="-31.8" y2="31.8" />
            </g>
            <!-- Molecule Particle -->
            <circle cx="0" cy="0" r="15" fill="#4361EE" />
            <!-- Center Dot indicating Equilibrium -->
            <circle cx="0" cy="0" r="3" fill="#f8f9fa" />
        </g>
        <text x="400" y="415" font-size="16" font-weight="600" text-anchor="middle">Bulk Molecule: <tspan class="math">∑F&#8407; = 0</tspan></text>

        <!-- Molecule B (Surface) -->
        <g class="molecule-b-group">
            <!-- Net Force Arrow (Drawn behind molecule) -->
            <line class="net-force" x1="0" y1="0" x2="0" y2="85" stroke="#06D6A0" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow-green)" />
            
            <!-- Cohesive Forces (Asymmetrical) -->
            <g class="surface-arrows" stroke="#FF3366" stroke-linecap="round" marker-end="url(#arrow-red)">
                <line x1="0" y1="0" x2="-45" y2="0" />
                <line x1="0" y1="0" x2="45" y2="0" />
                <line x1="0" y1="0" x2="0" y2="45" />
                <line x1="0" y1="0" x2="31.8" y2="31.8" />
                <line x1="0" y1="0" x2="-31.8" y2="31.8" />
            </g>
            
            <!-- Molecule Particle -->
            <circle cx="0" cy="0" r="15" fill="#4361EE" />
        </g>
        <text x="400" y="100" font-size="16" font-weight="600" text-anchor="middle">Surface Molecule: <tspan class="math">F&#8407;<tspan dy="4" font-size="0.7em">net</tspan><tspan dy="-4"> ≠ 0</tspan></tspan> (Inward)</text>

        <!-- Legend -->
        <g transform="translate(615, 365)">
            <rect x="0" y="0" width="165" height="70" rx="6" fill="#ffffff" stroke="#E9ECEF" stroke-width="2" />
            <line x1="15" y1="25" x2="40" y2="25" stroke="#FF3366" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-red)" />
            <text x="50" y="29" font-size="12" font-weight="600">Cohesive Force</text>
            
            <line x1="15" y1="50" x2="40" y2="50" stroke="#06D6A0" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-green)" />
            <text x="50" y="54" font-size="12" font-weight="600">Net Inward Pull</text>
        </g>
    </svg>
</body>
</html>
