<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Electromagnetic Spectrum</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 25px;
            width: 100%;
            padding: 0 20px;
            box-sizing: border-box;
        }
        input[type=range] {
            flex-grow: 1;
            accent-color: #7209B7;
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        button {
            background: #4361EE;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            min-width: 100px;
        }
        button:hover {
            background: #3a0ca3;
        }
        button:active {
            transform: scale(0.96);
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7"/>
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0"/>
            </marker>
            <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#999"/>
            </marker>

            <!-- Spectrum Gradient -->
            <linearGradient id="spectrum-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#4a4e69"/>
                <stop offset="25%" stop-color="#9a8c98"/>
                <stop offset="40%" stop-color="#c9184a"/>
                <stop offset="46%" stop-color="#ff0000"/>
                <stop offset="48%" stop-color="#ff7f00"/>
                <stop offset="50%" stop-color="#ffff00"/>
                <stop offset="52%" stop-color="#00ff00"/>
                <stop offset="54%" stop-color="#0000ff"/>
                <stop offset="56%" stop-color="#8b00ff"/>
                <stop offset="65%" stop-color="#7209b7"/>
                <stop offset="80%" stop-color="#4361ee"/>
                <stop offset="100%" stop-color="#03045e"/>
            </linearGradient>
        </defs>

        <!-- Title & Formula -->
        <text x="400" y="30" text-anchor="middle" font-size="24" font-weight="700" fill="#111">The Electromagnetic Spectrum: c = λν</text>
        <text x="400" y="55" text-anchor="middle" font-size="14" class="math" fill="#666">E_y = E₀ sin(kx - ωt) &nbsp;&nbsp;|&nbsp;&nbsp; B_z = B₀ sin(kx - ωt)</text>

        <!-- Spectrum Bar -->
        <g id="spectrum-bar">
            <rect x="100" y="90" width="600" height="16" rx="8" fill="url(#spectrum-grad)"/>
            
            <!-- Labels -->
            <text x="160" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Radio</text>
            <text x="280" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Microwave</text>
            <text x="358" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">IR</text>
            <text x="400" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Visible</text>
            <text x="448" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">UV</text>
            <text x="532" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">X-ray</text>
            <text x="640" y="82" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Gamma</text>

            <!-- Scanner -->
            <rect id="scanner" x="100" y="86" width="4" height="24" fill="#fff" stroke="#111" stroke-width="1.5" rx="2"/>
        </g>

        <!-- 3D Wave Propagation -->
        <g id="wave-3d" transform="translate(0, 40)">
            <!-- Axes -->
            <line x1="100" y1="200" x2="720" y2="200" stroke="#ccc" stroke-width="2" marker-end="url(#arrow-black)"/>
            <line x1="100" y1="280" x2="100" y2="100" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-black)"/>
            <line x1="60" y1="160" x2="160" y2="260" stroke="#ccc" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow-black)"/>
            
            <!-- Axis Labels -->
            <text x="730" y="205" font-size="13" font-weight="600" fill="#999" font-style="italic">x</text>
            <text x="90" y="100" font-size="13" font-weight="600" fill="#F77F00" font-style="italic">y (E)</text>
            <text x="165" y="270" font-size="13" font-weight="600" fill="#7209B7" font-style="italic">z (B)</text>
            <text x="700" y="185" font-size="12" font-weight="600" fill="#06D6A0" text-anchor="end">Direction of Propagation (c)</text>
            
            <!-- Propagation Vector -->
            <line x1="650" y1="200" x2="710" y2="200" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)"/>

            <!-- Wave Envelopes -->
            <path id="wave-e" fill="rgba(247, 127, 0, 0.15)" stroke="#F77F00" stroke-width="2" stroke-linejoin="round"/>
            <path id="wave-b" fill="rgba(114, 9, 183, 0.15)" stroke="#7209B7" stroke-width="2" stroke-linejoin="round"/>

            <!-- Vector Pools -->
            <g id="vectors-e"></g>
            <g id="vectors-b"></g>
        </g>

        <!-- Dynamic Annotations -->
        <g id="annotations" transform="translate(0, 370)">
            <text x="100" y="0" font-size="15" font-weight="600" fill="#333">Wavelength (λ): <tspan id="val-lambda" class="math" fill="#000"></tspan></text>
            <text x="700" y="0" font-size="15" font-weight="600" fill="#333" text-anchor="end">Frequency (f): <tspan id="val-freq" class="math" fill="#000"></tspan></text>
        </g>

        <!-- Characteristic Sizes -->
        <g id="sizes" transform="translate(0, 10)">
            <!-- Radio: Skyscraper -->
            <g id="icon-radio" data-x="160" transform="translate(160, 460)">
                <rect x="-12" y="-35" width="24" height="35" fill="#6c757d" rx="2"/>
                <rect x="-7" y="-30" width="5" height="5" fill="#fff" rx="1"/>
                <rect x="2" y="-30" width="5" height="5" fill="#fff" rx="1"/>
                <rect x="-7" y="-20" width="5" height="5" fill="#fff" rx="1"/>
                <rect x="2" y="-20" width="5" height="5" fill="#fff" rx="1"/>
                <rect x="-7" y="-10" width="5" height="5" fill="#fff" rx="1"/>
                <rect x="2" y="-10" width="5" height="5" fill="#fff" rx="1"/>
                <text y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Skyscraper</text>
            </g>

            <!-- Microwave: Honeybee -->
            <g id="icon-micro" data-x="280" transform="translate(280, 460)">
                <ellipse cx="0" cy="-18" rx="8" ry="14" fill="#ffb703" transform="rotate(90 0 -18)"/>
                <line x1="-8" y1="-18" x2="-8" y2="-26" stroke="#212529" stroke-width="2.5"/>
                <line x1="0" y1="-18" x2="0" y2="-26" stroke="#212529" stroke-width="2.5"/>
                <line x1="8" y1="-18" x2="8" y2="-26" stroke="#212529" stroke-width="2.5"/>
                <path d="M-5,-18 Q-15,-30 -5,-35 Q0,-25 0,-18" fill="rgba(0,180,216,0.6)"/>
                <path d="M5,-18 Q15,-30 5,-35 Q0,-25 0,-18" fill="rgba(0,180,216,0.6)"/>
                <text y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Honeybee</text>
            </g>

            <!-- IR: Needle Point -->
            <g id="icon-ir" data-x="358" transform="translate(358, 460)">
                <path d="M-1.5,-30 L1.5,-30 L0,0 Z" fill="#adb5bd"/>
                <circle cx="0" cy="-33" r="2.5" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
                <text y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Needle Point</text>
            </g>

            <!-- Visible: Protozoan -->
            <g id="icon-vis" data-x="400" transform="translate(400, 460)">
                <path d="M0,-20 C12,-28 22,-15 15,-5 C10,8 -12,8 -18,-5 C-25,-15 -12,-28 0,-20 Z" fill="#48cae4"/>
                <circle cx="2" cy="-12" r="3.5" fill="#023e8a"/>
                <circle cx="-6" cy="-18" r="1.5" fill="#023e8a" opacity="0.6"/>
                <circle cx="8" cy="-6" r="1" fill="#023e8a" opacity="0.6"/>
                <text y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Protozoan</text>
            </g>

            <!-- UV/X-ray/Gamma: Atom -->
            <g id="icon-atom" data-x="532" transform="translate(532, 460)">
                <circle cx="0" cy="-15" r="3.5" fill="#f72585"/>
                <ellipse cx="0" cy="-15" rx="14" ry="4.5" fill="none" stroke="#4361ee" stroke-width="1.5" transform="rotate(30 0 -15)"/>
                <ellipse cx="0" cy="-15" rx="14" ry="4.5" fill="none" stroke="#4361ee" stroke-width="1.5" transform="rotate(-30 0 -15)"/>
                <ellipse cx="0" cy="-15" rx="14" ry="4.5" fill="none" stroke="#4361ee" stroke-width="1.5" transform="rotate(90 0 -15)"/>
                <text y="18" text-anchor="middle" font-size="11" font-weight="600" fill="#666">Atom / Nucleus</text>
            </g>
        </g>
    </svg>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #F77F00;"></div> Electric Field (E)</div>
        <div class="legend-item"><div class="dot" style="background: #7209B7;"></div> Magnetic Field (B)</div>
        <div class="legend-item"><div class="dot" style="background: #06D6A0;"></div> Propagation (c)</div>
    </div>

    <div class="controls">
        <button id="play-btn">Pause</button>
        <input type="range" id="slider" min="0" max="1" step="0.001" value="0">
    </div>
</div>

<script>
    const svgNS = "http://www.w3.org/2000/svg";
    
    // DOM Elements
    const vectorsE = document.getElementById('vectors-e');
    const vectorsB = document.getElementById('vectors-b');
    const pathE = document.getElementById('wave-e');
    const pathB = document.getElementById('wave-b');
    const scanner = document.getElementById('scanner');
    const valLambda = document.getElementById('val-lambda');
    const valFreq = document.getElementById('val-freq');
    const slider = document.getElementById('slider');
    const playBtn = document.getElementById('play-btn');

    // Icons mapping
    const icons = [
        { id: 'icon-radio', u: 0.1 },
        { id: 'icon-micro', u: 0.3 },
        { id: 'icon-ir', u: 0.43 },
        { id: 'icon-vis', u: 0.5 },
        { id: 'icon-atom', u: 0.75 }
    ].map(item => ({ el: document.getElementById(item.id), u: item.u }));

    // State
    let u = 0;
    let isPlaying = true;
    let lastTime = performance.now();

    // Vector Pools for performance
    const poolE = [];
    const poolB = [];

    function getLine(pool, index, parent, color, marker) {
        if (index < pool.length) return pool[index];
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("stroke", color);
        line.setAttribute("stroke-width", "2");
        line.setAttribute("marker-end", `url(#${marker})`);
        parent.appendChild(line);
        pool.push(line);
        return line;
    }

    function setSciText(el, prefix, exponent, suffix) {
        el.innerHTML = `${prefix}10<tspan dy="-0.5em" font-size="0.7em">${exponent}</tspan><tspan dy="0.5em">${suffix}</tspan>`;
    }

    // Event Listeners
    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? "Pause" : "Play";
        if (isPlaying) lastTime = performance.now();
    });

    slider.addEventListener('input', () => {
        u = parseFloat(slider.value);
        if (isPlaying) {
            isPlaying = false;
            playBtn.textContent = "Play";
        }
    });

    // Main Animation Loop
    function update(time) {
        let dt = time - lastTime;
        if (dt > 100) dt = 16; // Prevent jumps if tab was inactive
        lastTime = time;

        if (isPlaying) {
            u += dt / 15000; // 15 seconds full sweep
            if (u > 1) u = 0;
            slider.value = u;
        }

        // Physics Math Mapping
        // u=0 -> Radio (lambda=10^3, freq=3*10^5)
        // u=1 -> Gamma (lambda=10^-12, freq=3*10^20)
        const logLambda = 3 - 15 * u;
        const logFreq = 5 + 15 * u;
        
        // Visual Wavelength (exponential scale for visualization)
        const lambda_px = 300 * Math.pow(15 / 300, u);

        // Update Text
        setSciText(valLambda, "1.0 × ", logLambda.toFixed(1), " m");
        setSciText(valFreq, "3.0 × ", logFreq.toFixed(1), " Hz");

        // Update Scanner Position
        scanner.setAttribute('x', 100 + u * 600 - 2);

        // Update Icons Opacity and Scale
        icons.forEach(icon => {
            const dist = Math.abs(u - icon.u);
            const opacity = Math.max(0.15, 1 - dist * 5);
            const scale = Math.max(0.8, 1 - dist * 2.5);
            icon.el.setAttribute('opacity', opacity);
            const xPos = icon.el.getAttribute('data-x');
            icon.el.setAttribute('transform', `translate(${xPos}, 460) scale(${scale})`);
        });

        // Draw Wave
        const A = 65; // Amplitude
        const v = 150; // Constant phase velocity (px/s)
        const t = time / 1000;
        const k = 2 * Math.PI / lambda_px;
        const omega = k * v;

        let dE = `M 100 200 `;
        let dB = `M 100 200 `;

        // Calculate envelopes
        for (let x = 0; x <= 600; x += 3) {
            const phase = k * x - omega * t;
            const Ey = -A * Math.sin(phase); // -Y is up in SVG
            const Bx = 0.5 * A * Math.sin(phase); // Z-axis projection (skewed)
            const By = 0.5 * A * Math.sin(phase);

            dE += `L ${100 + x} ${200 + Ey} `;
            dB += `L ${100 + x + Bx} ${200 + By} `;
        }
        
        dE += `L 700 200 Z`;
        dB += `L 700 200 Z`;

        pathE.setAttribute('d', dE);
        pathB.setAttribute('d', dB);

        // Draw Vectors (fixed spatial intervals relative to lambda)
        let eIdx = 0;
        let bIdx = 0;
        const spacing = Math.max(lambda_px / 8, 4); // Prevent infinite loops/clutter

        for (let x = 0; x <= 600; x += spacing) {
            const phase = k * x - omega * t;
            const Ey = -A * Math.sin(phase);
            const Bx = 0.5 * A * Math.sin(phase);
            const By = 0.5 * A * Math.sin(phase);

            if (Math.abs(Ey) > 3) {
                const lineE = getLine(poolE, eIdx++, vectorsE, "#F77F00", "arrow-orange");
                lineE.setAttribute("x1", 100 + x);
                lineE.setAttribute("y1", 200);
                lineE.setAttribute("x2", 100 + x);
                lineE.setAttribute("y2", 200 + Ey);
                lineE.style.display = "inline";
            }

            if (Math.abs(Bx) > 3) {
                const lineB = getLine(poolB, bIdx++, vectorsB, "#7209B7", "arrow-purple");
                lineB.setAttribute("x1", 100 + x);
                lineB.setAttribute("y1", 200);
                lineB.setAttribute("x2", 100 + x + Bx);
                lineB.setAttribute("y2", 200 + By);
                lineB.style.display = "inline";
            }
        }

        // Hide unused lines in pool
        for (let i = eIdx; i < poolE.length; i++) poolE[i].style.display = "none";
        for (let i = bIdx; i < poolB.length; i++) poolB[i].style.display = "none";

        requestAnimationFrame(update);
    }

    // Start animation
    requestAnimationFrame(update);
</script>

</body>
</html>
