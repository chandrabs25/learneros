<script>
    // This script mathematically generates the CSS keyframes for the coupled spring-mass system
    // to ensure 100% physical accuracy of the wave propagation, forces, and spring deformations.
    function initPhysicsAnimations() {
        const style = document.createElement('style');
        let css = '';
        const T = 10; // Total loop duration in seconds
        const frames = 100; // Keyframe resolution

        // Displacement function: Sine wave pulse
        function getU(pct, startPct, durPct) {
            if (pct < startPct || pct > startPct + durPct) return 0;
            let phase = (pct - startPct) / durPct;
            return 25 * Math.sin(phase * 2 * Math.PI);
        }

        for (let i = 0; i < 10; i++) {
            // Medium A (Fast, High Modulus)
            let sA = 5 + i * 1.0; // Start time delay
            let dA = 15; // Pulse duration

            // Medium B (Slow, Low Modulus: v = v_A / sqrt(2))
            let sB = 5 + i * 1.414;
            let dB = 21.2;

            // Particle Animations
            css += `@keyframes pA_${i} {`;
            for(let f=0; f<=frames; f++) css += `${f}% { transform: translateX(${getU(f, sA, dA).toFixed(2)}px); }`;
            css += `}\n.playing .pA_${i} { animation: pA_${i} ${T}s linear infinite; }\n`;

            css += `@keyframes pB_${i} {`;
            for(let f=0; f<=frames; f++) css += `${f}% { transform: translateX(${getU(f, sB, dB).toFixed(2)}px); }`;
            css += `}\n.playing .pB_${i} { animation: pB_${i} ${T}s linear infinite; }\n`;

            // Restoring Force Vectors (F_rest proportional to -u)
            css += `@keyframes vRestA_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u = getU(f, sA, dA);
                css += `${f}% { transform: scaleX(${(u/25).toFixed(2)}); opacity: ${Math.abs(u)>2 ? 1 : 0}; }`;
            }
            css += `}\n.playing .vRestA_${i} { animation: vRestA_${i} ${T}s linear infinite; }\n`;

            css += `@keyframes vRestB_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u = getU(f, sB, dB);
                css += `${f}% { transform: scaleX(${(u/25).toFixed(2)}); opacity: ${Math.abs(u)>2 ? 1 : 0}; }`;
            }
            css += `}\n.playing .vRestB_${i} { animation: vRestB_${i} ${T}s linear infinite; }\n`;

            // Displacement Vectors
            css += `@keyframes vDispA_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u = getU(f, sA, dA);
                css += `${f}% { transform: scaleX(${(u/25).toFixed(2)}); opacity: ${Math.abs(u)>2 ? 1 : 0}; }`;
            }
            css += `}\n.playing .vDispA_${i} { animation: vDispA_${i} ${T}s linear infinite; }\n`;

            css += `@keyframes vDispB_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u = getU(f, sB, dB);
                css += `${f}% { transform: scaleX(${(u/25).toFixed(2)}); opacity: ${Math.abs(u)>2 ? 1 : 0}; }`;
            }
            css += `}\n.playing .vDispB_${i} { animation: vDispB_${i} ${T}s linear infinite; }\n`;
        }

        // Spring Animations (Coupling logic)
        for (let i = 0; i < 9; i++) {
            let sA = 5 + i * 1.0; let dA = 15;
            let sB = 5 + i * 1.414; let dB = 21.2;

            css += `@keyframes sA_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u1 = getU(f, sA, dA);
                let u2 = getU(f, sA + 1.0, dA);
                let scale = (60 + u2 - u1) / 60;
                css += `${f}% { transform: translateX(${u1.toFixed(2)}px) scaleX(${scale.toFixed(2)}); }`;
            }
            css += `}\n.playing .sA_${i} { animation: sA_${i} ${T}s linear infinite; transform-origin: left center; }\n`;

            css += `@keyframes sB_${i} {`;
            for(let f=0; f<=frames; f++) {
                let u1 = getU(f, sB, dB);
                let u2 = getU(f, sB + 1.414, dB);
                let scale = (60 + u2 - u1) / 60;
                css += `${f}% { transform: translateX(${u1.toFixed(2)}px) scaleX(${scale.toFixed(2)}); }`;
            }
            css += `}\n.playing .sB_${i} { animation: sB_${i} ${T}s linear infinite; transform-origin: left center; }\n`;
        }

        // Applied Force (F_ext) at the start
        css += `@keyframes vExtA {`;
        for(let f=0; f<=frames; f++) {
            let u = getU(f, 5, 15);
            css += `${f}% { transform: translateX(${u.toFixed(2)}px); opacity: ${f>=5 && f<=12.5 ? 1 : 0}; }`;
        }
        css += `}\n.playing .vExtA { animation: vExtA ${T}s linear infinite; }\n`;

        css += `@keyframes vExtB {`;
        for(let f=0; f<=frames; f++) {
            let u = getU(f, 5, 21.2);
            css += `${f}% { transform: translateX(${u.toFixed(2)}px); opacity: ${f>=5 && f<=15.6 ? 1 : 0}; }`;
        }
        css += `}\n.playing .vExtB { animation: vExtB ${T}s linear infinite; }\n`;

        // Wave Front Trackers
        css += `@keyframes frontA {`;
        for(let f=0; f<=frames; f++) {
            let x = 100; if(f>5) x = 100 + (f-5)*60; if(x>640) x=640;
            css += `${f}% { transform: translateX(${x-100}px); opacity: ${f>5 && x<640 ? 1 : 0}; }`;
        }
        css += `}\n.playing .frontA { animation: frontA ${T}s linear infinite; }\n`;

        css += `@keyframes frontB {`;
        for(let f=0; f<=frames; f++) {
            let x = 100; if(f>5) x = 100 + (f-5)*(60/1.414); if(x>640) x=640;
            css += `${f}% { transform: translateX(${x-100}px); opacity: ${f>5 && x<640 ? 1 : 0}; }`;
        }
        css += `}\n.playing .frontB { animation: frontB ${T}s linear infinite; }\n`;

        // Dynamic State Labels (Compression)
        css += `@keyframes stateA {`;
        for(let f=0; f<=frames; f++) {
            let maxU = 0; let maxI = 0;
            for(let i=0; i<10; i++) {
                let u = getU(f, 5 + i*1.0, 15);
                if(u > maxU) { maxU = u; maxI = i; }
            }
            let x = 100 + maxI * 60;
            css += `${f}% { transform: translateX(${x-100}px); opacity: ${maxU > 10 ? 1 : 0}; }`;
        }
        css += `}\n.playing .stateA { animation: stateA ${T}s linear infinite; }\n`;

        css += `@keyframes stateB {`;
        for(let f=0; f<=frames; f++) {
            let maxU = 0; let maxI = 0;
            for(let i=0; i<10; i++) {
                let u = getU(f, 5 + i*1.414, 21.2);
                if(u > maxU) { maxU = u; maxI = i; }
            }
            let x = 100 + maxI * 60;
            css += `${f}% { transform: translateX(${x-100}px); opacity: ${maxU > 10 ? 1 : 0}; }`;
        }
        css += `}\n.playing .stateB { animation: stateB ${T}s linear infinite; }\n`;

        style.innerHTML = css;
        document.head.appendChild(style);
    }

    // Initialize the CSS animations on load
    window.onload = initPhysicsAnimations;

    // Replay functionality
    function replay() {
        const svg = document.getElementById('sim');
        svg.classList.remove('playing');
        void svg.offsetWidth; // Trigger reflow to restart CSS animations
        svg.classList.add('playing');
    }
</script>

</body>
</html>
