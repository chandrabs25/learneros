<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centripetal Force Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* CSS Animations */
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); } /* Counter-clockwise */
        }
        
        @keyframes counterOrbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); } /* Clockwise to keep text upright */
        }

        .rotate-group {
            animation: orbit 5s linear infinite;
        }

        .counter-rotate {
            animation: counterOrbit 5s linear infinite;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg">
        <title>Centripetal Force Animation</title>
        <desc>An animated diagram showing an electron orbiting a nucleus and a proton moving in a magnetic field, demonstrating that centripetal force is always perpendicular to velocity.</desc>

        <defs>
            <!-- Drop Shadow for Particles -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
            </filter>

            <!-- Arrowheads -->
            <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0"/>
            </marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366"/>
            </marker>

            <!-- Magnetic Field Pattern -->
            <pattern id="b-field" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 16 16 L 24 24 M 24 16 L 16 24" stroke="#7209B7" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
            </pattern>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Global Header -->
        <text x="400" y="40" text-anchor="middle" font-family="Inter" font-size="22" font-weight="800" fill="#212529">Centripetal Force: F is always ⊥ to v</text>
        <text x="400" y="60" text-anchor="middle" font-family="Inter" font-size="13" fill="#6c757d">Hover over the diagram to slow down the animation</text>

        <!-- ========================================== -->
        <!-- PANEL A: ELECTROSTATIC FORCE (ATOMIC MODEL)-->
        <!-- ========================================== -->
        
        <!-- Panel Title -->
        <text x="200" y="100" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#343a40">1. Electrostatic (Atoms)</text>

        <!-- Orbit Path -->
        <circle cx="200" cy="250" r="100" fill="none" stroke="#CED4DA" stroke-width="1.5" stroke-dasharray="6,6"/>

        <!-- Nucleus -->
        <circle cx="200" cy="250" r="16" fill="#F77F00" filter="url(#shadow)"/>
        <text x="200" y="255" text-anchor="middle" fill="#ffffff" font-family="Inter" font-weight="800" font-size="14">+</text>

        <!-- Rotating Assembly A -->
        <g class="rotate-group" style="transform-origin: 200px 250px;">
            
            <!-- Velocity Vector (Green) -->
            <line x1="200" y1="150" x2="110" y2="150" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
            
            <!-- Force Vector (Red) -->
            <line x1="200" y1="150" x2="200" y2="220" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>

            <!-- Electron -->
            <circle cx="200" cy="150" r="10" fill="#4361EE" filter="url(#shadow)"/>
            <text x="200" y="154" text-anchor="middle" fill="#ffffff" font-family="Inter" font-weight="800" font-size="14">-</text>

            <!-- Upright Labels -->
            <!-- Velocity Label -->
            <g transform="translate(155, 135)">
                <g class="counter-rotate" style="transform-origin: 0px 0px;">
                    <text x="0" y="0" text-anchor="middle" fill="#06D6A0" font-family="Roboto Mono" font-weight="700" font-style="italic" font-size="16">v</text>
                    <path d="M -5 -12 L 5 -12 L 2 -15 M 5 -12 L 2 -9" stroke="#06D6A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>

            <!-- Force Label -->
            <g transform="translate(220, 185)">
                <g class="counter-rotate" style="transform-origin: 0px 0px;">
                    <text x="0" y="0" text-anchor="middle" fill="#FF3366" font-family="Roboto Mono" font-weight="700" font-style="italic" font-size="16">F<tspan dy="4" font-size="11" font-style="normal">c</tspan></text>
                    <path d="M -5 -12 L 5 -12 L 2 -15 M 5 -12 L 2 -9" stroke="#FF3366" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>
        </g>

        <!-- Formula A -->
        <g transform="translate(0, 410)">
            <text x="135" y="0" font-family="Roboto Mono" font-size="15" fill="#212529">F<tspan dy="4" font-size="11">c</tspan><tspan dy="-4"> = </tspan></text>
            
            <!-- Fraction 1 -->
            <text x="180" y="-10" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">ke<tspan dy="-5" font-size="11">2</tspan></text>
            <line x1="165" y1="-4" x2="195" y2="-4" stroke="#212529" stroke-width="1.5"/>
            <text x="180" y="12" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">r<tspan dy="-5" font-size="11">2</tspan></text>
            
            <text x="210" y="0" font-family="Roboto Mono" font-size="15" fill="#212529"> = </text>
            
            <!-- Fraction 2 -->
            <text x="255" y="-10" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">mv<tspan dy="-5" font-size="11">2</tspan></text>
            <line x1="240" y1="-4" x2="270" y2="-4" stroke="#212529" stroke-width="1.5"/>
            <text x="255" y="12" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">r</text>
        </g>


        <!-- ========================================== -->
        <!-- PANEL B: LORENTZ FORCE (MAGNETIC FIELD)    -->
        <!-- ========================================== -->

        <!-- Panel Title -->
        <text x="600" y="100" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#343a40">2. Magnetic Field (Lorentz)</text>

        <!-- Magnetic Field Background -->
        <rect x="440" y="120" width="320" height="260" fill="url(#b-field)" rx="8"/>
        
        <!-- Field Label -->
        <text x="750" y="370" text-anchor="end" fill="#7209B7" font-family="Inter" font-weight="600" font-size="14">B (into page)</text>
        <path d="M 645 365 L 655 365 L 652 362 M 655 365 L 652 368" stroke="#7209B7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Orbit Path -->
        <circle cx="600" cy="250" r="100" fill="none" stroke="#CED4DA" stroke-width="1.5" stroke-dasharray="6,6"/>

        <!-- Center Reference Dot -->
        <circle cx="600" cy="250" r="3" fill="#CED4DA"/>

        <!-- Rotating Assembly B -->
        <g class="rotate-group" style="transform-origin: 600px 250px;">
            
            <!-- Velocity Vector (Green) -->
            <line x1="600" y1="150" x2="510" y2="150" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
            
            <!-- Force Vector (Red) -->
            <line x1="600" y1="150" x2="600" y2="220" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>

            <!-- Proton -->
            <circle cx="600" cy="150" r="10" fill="#FF3366" filter="url(#shadow)"/>
            <text x="600" y="154" text-anchor="middle" fill="#ffffff" font-family="Inter" font-weight="800" font-size="14">+</text>

            <!-- Upright Labels -->
            <!-- Velocity Label -->
            <g transform="translate(555, 135)">
                <g class="counter-rotate" style="transform-origin: 0px 0px;">
                    <text x="0" y="0" text-anchor="middle" fill="#06D6A0" font-family="Roboto Mono" font-weight="700" font-style="italic" font-size="16">v</text>
                    <path d="M -5 -12 L 5 -12 L 2 -15 M 5 -12 L 2 -9" stroke="#06D6A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>

            <!-- Force Label -->
            <g transform="translate(620, 185)">
                <g class="counter-rotate" style="transform-origin: 0px 0px;">
                    <text x="0" y="0" text-anchor="middle" fill="#FF3366" font-family="Roboto Mono" font-weight="700" font-style="italic" font-size="16">F<tspan dy="4" font-size="11" font-style="normal">m</tspan></text>
                    <path d="M -5 -12 L 5 -12 L 2 -15 M 5 -12 L 2 -9" stroke="#FF3366" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>
        </g>

        <!-- Formula B -->
        <g transform="translate(0, 410)">
            <text x="530" y="0" font-family="Roboto Mono" font-size="15" fill="#212529">F<tspan dy="4" font-size="11">c</tspan><tspan dy="-4"> = qvB = </tspan></text>
            
            <!-- Fraction -->
            <text x="655" y="-10" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">mv<tspan dy="-5" font-size="11">2</tspan></text>
            <line x1="640" y1="-4" x2="670" y2="-4" stroke="#212529" stroke-width="1.5"/>
            <text x="655" y="12" font-family="Roboto Mono" font-size="15" fill="#212529" text-anchor="middle">r</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(150, 460)">
            <rect x="0" y="0" width="500" height="40" rx="8" fill="#ffffff" stroke="#CED4DA" stroke-width="1"/>
            
            <!-- Velocity Legend -->
            <line x1="20" y1="20" x2="45" y2="20" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrowGreen)"/>
            <text x="55" y="25" font-family="Inter" font-size="13" fill="#495057">Velocity (v)</text>

            <!-- Force Legend -->
            <line x1="160" y1="20" x2="185" y2="20" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
            <text x="195" y="25" font-family="Inter" font-size="13" fill="#495057">Centripetal Force (F)</text>

            <!-- B-Field Legend -->
            <path d="M 355 15 L 365 25 M 365 15 L 355 25" stroke="#7209B7" stroke-width="2" stroke-linecap="round"/>
            <text x="375" y="25" font-family="Inter" font-size="13" fill="#495057">Magnetic Field (B)</text>
        </g>

    </svg>
</div>

<script>
    // Minimal JavaScript to handle the hover slow-down effect smoothly
    document.addEventListener('DOMContentLoaded', () => {
        const svgContainer = document.querySelector('.svg-container');
        const animatedElements = document.querySelectorAll('.rotate-group, .counter-rotate');
        
        svgContainer.addEventListener('mouseenter', () => {
            animatedElements.forEach(el => {
                el.getAnimations().forEach(anim => {
                    anim.playbackRate = 0.3; // Slow down to 30% speed for easy inspection
                });
            });
        });
        
        svgContainer.addEventListener('mouseleave', () => {
            animatedElements.forEach(el => {
                el.getAnimations().forEach(anim => {
                    anim.playbackRate = 1.0; // Return to normal speed
                });
            });
        });
    });
</script>

</body>
</html>
