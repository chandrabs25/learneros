<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminar Flow & Velocity Gradient</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Animations */
        @keyframes slide-texture {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(250px); opacity: 1; }
            85% { transform: translateX(250px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes move-p5 {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(250px); opacity: 1; }
            85% { transform: translateX(250px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes move-p4 {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(200px); opacity: 1; }
            85% { transform: translateX(200px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes move-p3 {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(150px); opacity: 1; }
            85% { transform: translateX(150px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes move-p2 {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(100px); opacity: 1; }
            85% { transform: translateX(100px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes move-p1 {
            0%, 10% { transform: translateX(0); opacity: 1; }
            80% { transform: translateX(50px); opacity: 1; }
            85% { transform: translateX(50px); opacity: 0; }
            90% { transform: translateX(0); opacity: 0; }
            95%, 100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes skew-line {
            0%, 10% { transform: skewX(0deg); opacity: 1; }
            80% { transform: skewX(-51.34deg); opacity: 1; }
            85% { transform: skewX(-51.34deg); opacity: 0; }
            90% { transform: skewX(0deg); opacity: 0; }
            95%, 100% { transform: skewX(0deg); opacity: 1; }
        }

        @keyframes pulse-arrow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Applying Animations */
        .moving-texture { animation: slide-texture 10s linear infinite; }
        .p5 { animation: move-p5 10s linear infinite; }
        .p4 { animation: move-p4 10s linear infinite; }
        .p3 { animation: move-p3 10s linear infinite; }
        .p2 { animation: move-p2 10s linear infinite; }
        .p1 { animation: move-p1 10s linear infinite; }
        
        .shear-line {
            transform-origin: 300px 350px;
            animation: skew-line 10s linear infinite;
        }

        .vel-arrow {
            animation: pulse-arrow 3s ease-in-out infinite;
            transition: stroke 0.3s;
        }

        .particle {
            transition: fill 0.3s, r 0.3s;
        }

        /* Hover Interactions */
        .layer-group {
            cursor: crosshair;
        }

        .layer-group:hover .vel-arrow {
            stroke: #F77F00;
            marker-end: url(#arrow-orange);
            animation: none;
            opacity: 1;
        }

        .layer-group:hover .particle {
            fill: #F77F00;
            r: 8;
        }
        
        .layer-group:hover .hover-bg {
            fill: rgba(247, 127, 0, 0.05);
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Laminar Flow and Velocity Gradient</title>
        <desc id="svg-desc">An animated diagram showing a fluid between a stationary bottom plate and a moving top plate. Tracer particles and velocity vectors demonstrate the linear velocity gradient (dv/dy) characteristic of laminar Couette flow.</desc>

        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#333333" />
            </marker>

            <!-- Plate Texture Pattern -->
            <pattern id="plate-texture" patternUnits="userSpaceOnUse" width="20" height="20" patternTransform="rotate(45)">
                <line x1="0" y1="0" x2="0" y2="20" stroke="#ffffff" stroke-width="3" opacity="0.15" />
            </pattern>

            <!-- Clip Path for Top Plate -->
            <clipPath id="top-plate-clip">
                <rect x="100" y="130" width="600" height="20" />
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title & Subtitle -->
        <text x="400" y="40" font-family="Inter" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">Laminar Flow: Velocity Gradient in a Viscous Fluid</text>
        <text x="400" y="65" font-family="Inter" font-size="14" text-anchor="middle" fill="#6c757d">Hover over fluid layers to inspect velocity vectors. Animation shows steady-state shear.</text>

        <!-- Fluid Medium -->
        <rect x="100" y="150" width="600" height="200" fill="#E0F2FE" />

        <!-- Dimension Line (y) -->
        <line x1="70" y1="155" x2="70" y2="345" stroke="#333333" stroke-width="1.5" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)" />
        <text x="55" y="255" font-family="Roboto Mono" font-size="16" font-style="italic" text-anchor="middle" fill="#333333">y</text>
        <line x1="60" y1="150" x2="90" y2="150" stroke="#333333" stroke-width="1" />
        <line x1="60" y1="350" x2="90" y2="350" stroke="#333333" stroke-width="1" />

        <!-- Bottom Plate (Stationary) -->
        <rect x="100" y="350" width="600" height="20" fill="#343a40" rx="2" />
        <text x="400" y="395" font-family="Roboto Mono" font-size="18" font-weight="700" text-anchor="middle" fill="#343a40">v = 0</text>
        <text x="400" y="415" font-family="Inter" font-size="14" text-anchor="middle" fill="#6c757d">(Fixed Boundary / No-Slip)</text>

        <!-- Top Plate (Moving) -->
        <!-- 3D Top Area -->
        <polygon points="100,130 130,100 730,100 700,130" fill="#495057" />
        <text x="415" y="120" font-family="Inter" font-size="16" font-weight="600" fill="#ffffff" text-anchor="middle" opacity="0.9">Area A</text>
        
        <!-- Front Edge with Moving Texture -->
        <rect x="100" y="130" width="600" height="20" fill="#343a40" />
        <g clip-path="url(#top-plate-clip)">
            <rect class="moving-texture" x="-200" y="130" width="1000" height="20" fill="url(#plate-texture)" />
        </g>
        
        <!-- Top Plate Labels -->
        <text x="200" y="85" font-family="Roboto Mono" font-size="18" font-weight="700" text-anchor="middle" fill="#343a40">v = v<tspan dy="5" font-size="12">max</tspan></text>

        <!-- Applied Force Arrow -->
        <line x1="550" y1="140" x2="650" y2="140" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)" />
        <text x="665" y="146" font-family="Roboto Mono" font-size="20" font-weight="700" fill="#FF3366">F<tspan dy="5" font-size="14">ext</tspan></text>

        <!-- Shear Deformation Marker (Dashed Line) -->
        <line class="shear-line" x1="300" y1="350" x2="300" y2="150" stroke="#4361EE" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />

        <!-- Velocity Gradient Label (Left side) -->
        <g transform="translate(230, 240)">
            <text x="0" y="0" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#06D6A0" text-anchor="end">dv</text>
            <line x1="-25" y1="6" x2="5" y2="6" stroke="#06D6A0" stroke-width="2" />
            <text x="0" y="22" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#06D6A0" text-anchor="end">dy</text>
        </g>

        <!-- Fluid Layers (Interactive & Animated) -->
        
        <!-- Layer 0: Stationary (Bottom) -->
        <circle class="particle" cx="300" cy="350" r="6" fill="#4361EE" />

        <!-- Layer 1 -->
        <g class="layer-group">
            <rect class="hover-bg" x="100" y="290" width="600" height="40" fill="transparent" />
            <line class="vel-arrow" x1="300" y1="310" x2="350" y2="310" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <circle class="particle p1" cx="300" cy="310" r="6" fill="#4361EE" />
        </g>

        <!-- Layer 2 -->
        <g class="layer-group">
            <rect class="hover-bg" x="100" y="250" width="600" height="40" fill="transparent" />
            <line class="vel-arrow" x1="300" y1="270" x2="400" y2="270" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <circle class="particle p2" cx="300" cy="270" r="6" fill="#4361EE" />
        </g>

        <!-- Layer 3 -->
        <g class="layer-group">
            <rect class="hover-bg" x="100" y="210" width="600" height="40" fill="transparent" />
            <line class="vel-arrow" x1="300" y1="230" x2="450" y2="230" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <circle class="particle p3" cx="300" cy="230" r="6" fill="#4361EE" />
        </g>

        <!-- Layer 4 -->
        <g class="layer-group">
            <rect class="hover-bg" x="100" y="170" width="600" height="40" fill="transparent" />
            <line class="vel-arrow" x1="300" y1="190" x2="500" y2="190" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <circle class="particle p4" cx="300" cy="190" r="6" fill="#4361EE" />
        </g>

        <!-- Layer 5 (Top) -->
        <g class="layer-group">
            <rect class="hover-bg" x="100" y="130" width="600" height="40" fill="transparent" />
            <line class="vel-arrow" x1="300" y1="150" x2="550" y2="150" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
            <circle class="particle p5" cx="300" cy="150" r="6" fill="#4361EE" />
        </g>

        <!-- Newton's Law of Viscosity Formula Box -->
        <rect x="530" y="210" width="230" height="70" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" opacity="0.9" />
        <text x="645" y="235" font-family="Inter" font-size="12" font-weight="600" fill="#6c757d" text-anchor="middle" letter-spacing="0.5">NEWTON'S LAW OF VISCOSITY</text>
        <text x="645" y="265" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#343a40" text-anchor="middle">F = <tspan fill="#4361EE">η</tspan> A <tspan fill="#06D6A0">dv/dy</tspan></text>

        <!-- Legend Box -->
        <rect x="530" y="380" width="230" height="100" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
        <text x="545" y="405" font-family="Inter" font-size="12" font-weight="700" fill="#495057">LEGEND</text>
        
        <!-- Legend Items -->
        <line x1="545" y1="425" x2="575" y2="425" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
        <text x="590" y="430" font-family="Inter" font-size="13" fill="#495057">Velocity Vector (v)</text>

        <circle cx="560" cy="450" r="5" fill="#4361EE" />
        <text x="590" y="454" font-family="Inter" font-size="13" fill="#495057">Tracer Particle</text>

        <line x1="545" y1="470" x2="575" y2="470" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" />
        <text x="590" y="474" font-family="Inter" font-size="13" fill="#495057">Applied Force (F)</text>

    </svg>
</div>

</body>
</html>
