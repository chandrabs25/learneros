<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal's Law: Hydraulic Lift</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Animations */
        @keyframes move-left {
            0%, 16.66% { transform: translateY(0); }
            58.33%, 75% { transform: translateY(90px); }
            100% { transform: translateY(0); }
        }
        
        @keyframes move-right {
            0%, 16.66% { transform: translateY(0); }
            58.33%, 75% { transform: translateY(-30px); }
            100% { transform: translateY(0); }
        }

        @keyframes pulse-pressure {
            0%, 16.66% { opacity: 0.3; transform: scale(0.8); }
            30%, 60% { opacity: 1; transform: scale(1.2); }
            75%, 100% { opacity: 0.3; transform: scale(0.8); }
        }

        @keyframes fade-in {
            0%, 16.66% { opacity: 0; transform: translateY(10px); }
            30%, 75% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        .group-left, .fluid-left {
            animation: move-left 6s ease-in-out infinite;
        }

        .group-right, .fluid-right {
            animation: move-right 6s ease-in-out infinite;
        }

        .pressure-indicator {
            animation: pulse-pressure 6s ease-in-out infinite;
        }

        .dynamic-text {
            animation: fade-in 6s ease-in-out infinite;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Pascal's Law: Hydraulic Lift</title>
        <desc id="svg-desc">An animated diagram demonstrating Pascal's Law. A small downward force on a small piston creates pressure that is transmitted equally through an incompressible fluid, resulting in a larger upward force on a larger piston.</desc>

        <defs>
            <!-- Arrowhead for thin red force vector -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FF3366"/>
            </marker>
            
            <!-- Arrowhead for thick red force vector -->
            <marker id="arrow-red-thick" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#FF3366"/>
            </marker>

            <!-- Arrowhead for pressure indicators -->
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7209B7"/>
            </marker>

            <!-- Arrowhead for measurement lines -->
            <marker id="arrow-black" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#212529"/>
            </marker>

            <!-- Clip path defining the interior volume of the hydraulic vessel -->
            <clipPath id="vessel-clip">
                <path d="M 120 150 L 120 450 A 20 20 0 0 0 140 470 L 640 470 A 20 20 0 0 0 660 450 L 660 150 L 480 150 L 480 390 A 20 20 0 0 1 460 410 L 200 410 A 20 20 0 0 1 180 390 L 180 150 Z"/>
            </clipPath>

            <!-- Reusable Pressure Indicator Cross -->
            <g id="pressure-cross">
                <circle cx="0" cy="0" r="2.5" fill="#7209B7"/>
                <line x1="0" y1="-4" x2="0" y2="-12" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)"/>
                <line x1="0" y1="4" x2="0" y2="12" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)"/>
                <line x1="-4" y1="0" x2="-12" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)"/>
                <line x1="4" y1="0" x2="12" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Title & Main Formula -->
        <text x="400" y="45" text-anchor="middle" font-size="28" font-weight="700" fill="#212529">Pascal's Law: Hydraulic Lift</text>
        
        <rect x="250" y="70" width="300" height="50" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
        <text x="400" y="102" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="20" font-weight="700" fill="#7209B7">P = F₁/A₁ = F₂/A₂</text>

        <!-- Legend -->
        <rect x="630" y="20" width="150" height="95" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
        <text x="705" y="40" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">LEGEND</text>
        <line x1="645" y1="55" x2="665" y2="55" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
        <text x="675" y="59" font-size="11" fill="#212529">Force Vector</text>
        <use href="#pressure-cross" x="655" y="75" transform="scale(0.8) translate(160, 18)"/>
        <text x="675" y="79" font-size="11" fill="#212529">Pressure (P)</text>
        <rect x="645" y="90" width="20" height="10" fill="#CAF0F8" stroke="#00B4D8" stroke-width="1"/>
        <text x="675" y="99" font-size="11" fill="#212529">Hydraulic Fluid</text>

        <!-- Measurement Lines (Static Background) -->
        <!-- Left Side (Input) -->
        <line x1="60" y1="230" x2="120" y2="230" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="60" y1="320" x2="120" y2="320" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="70" y1="230" x2="70" y2="320" stroke="#212529" stroke-width="2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
        <text x="55" y="280" text-anchor="end" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" fill="#212529">d₁</text>

        <!-- Right Side (Output) -->
        <line x1="660" y1="230" x2="730" y2="230" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="660" y1="200" x2="730" y2="200" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="4 4"/>
        <line x1="720" y1="200" x2="720" y2="230" stroke="#212529" stroke-width="2" marker-start="url(#arrow-black)" marker-end="url(#arrow-black)"/>
        <text x="735" y="220" text-anchor="start" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" fill="#212529">d₂</text>

        <!-- Fluid Container (Clipped) -->
        <g clip-path="url(#vessel-clip)">
            <!-- Static Bottom Fluid -->
            <rect x="100" y="390" width="600" height="100" fill="#CAF0F8"/>
            
            <!-- Animated Left Fluid -->
            <rect x="100" y="250" width="100" height="200" fill="#CAF0F8" class="fluid-left"/>
            
            <!-- Animated Right Fluid -->
            <rect x="450" y="250" width="250" height="200" fill="#CAF0F8" class="fluid-right"/>
        </g>

        <!-- Vessel Outline (Strokes) -->
        <!-- Outer Wall -->
        <path d="M 120 150 L 120 450 A 20 20 0 0 0 140 470 L 640 470 A 20 20 0 0 0 660 450 L 660 150" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
        <!-- Inner Wall -->
        <path d="M 180 150 L 180 390 A 20 20 0 0 0 200 410 L 460 410 A 20 20 0 0 0 480 390 L 480 150" fill="none" stroke="#495057" stroke-width="4" stroke-linecap="round"/>

        <!-- Animated Pressure Indicators -->
        <g class="pressure-indicator" style="transform-origin: 150px 380px;"><use href="#pressure-cross" x="150" y="380"/></g>
        <g class="pressure-indicator" style="transform-origin: 150px 440px;"><use href="#pressure-cross" x="150" y="440"/></g>
        <g class="pressure-indicator" style="transform-origin: 250px 440px;"><use href="#pressure-cross" x="250" y="440"/></g>
        <g class="pressure-indicator" style="transform-origin: 350px 440px;"><use href="#pressure-cross" x="350" y="440"/></g>
        <g class="pressure-indicator" style="transform-origin: 450px 440px;"><use href="#pressure-cross" x="450" y="440"/></g>
        <g class="pressure-indicator" style="transform-origin: 570px 440px;"><use href="#pressure-cross" x="570" y="440"/></g>
        <g class="pressure-indicator" style="transform-origin: 570px 360px;"><use href="#pressure-cross" x="570" y="360"/></g>
        <g class="pressure-indicator" style="transform-origin: 500px 300px;"><use href="#pressure-cross" x="500" y="300"/></g>
        <g class="pressure-indicator" style="transform-origin: 640px 300px;"><use href="#pressure-cross" x="640" y="300"/></g>

        <!-- Left Input Group (Moves Down) -->
        <g class="group-left">
            <!-- Left Piston -->
            <rect x="122" y="230" width="56" height="20" rx="3" fill="#495057"/>
            <text x="150" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A₁</text>
            
            <!-- F1 Force Vector -->
            <line x1="150" y1="130" x2="150" y2="225" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
            <text x="130" y="125" font-family="'Roboto Mono', monospace" font-size="18" font-weight="700" fill="#FF3366">F₁</text>
        </g>

        <!-- Right Output Group (Moves Up) -->
        <g class="group-right">
            <!-- Right Piston -->
            <rect x="482" y="230" width="176" height="20" rx="3" fill="#495057"/>
            <text x="570" y="244" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">A₂ = 3A₁</text>
            
            <!-- Load Block -->
            <rect x="520" y="130" width="100" height="100" rx="6" fill="#ADB5BD" stroke="#6C757D" stroke-width="3"/>
            <text x="570" y="185" text-anchor="middle" font-size="16" font-weight="700" fill="#212529">1000 kg</text>
            
            <!-- F2 Force Vector -->
            <line x1="640" y1="230" x2="640" y2="80" stroke="#FF3366" stroke-width="8" marker-end="url(#arrow-red-thick)"/>
            <text x="655" y="75" font-family="'Roboto Mono', monospace" font-size="22" font-weight="700" fill="#FF3366">F₂</text>
        </g>

        <!-- Dynamic Explanatory Text Box (Fades in during press) -->
        <g class="dynamic-text">
            <rect x="240" y="220" width="200" height="110" rx="8" fill="#ffffff" stroke="#00B4D8" stroke-width="2" opacity="0.95"/>
            <text x="340" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#212529">Incompressible Fluid</text>
            <text x="340" y="270" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" fill="#00B4D8">Vol = A₁d₁ = A₂d₂</text>
            <text x="340" y="295" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" fill="#FF3366">F₂ = 3 × F₁</text>
            <text x="340" y="315" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" fill="#06D6A0">Work = F₁d₁ = F₂d₂</text>
        </g>

    </svg>
</div>

</body>
</html>
