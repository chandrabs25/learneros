<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refraction & Huygens Principle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #1D3557; }
        .label-bold { font-size: 16px; font-weight: 600; fill: #1D3557; }
        .label-math { font-family: 'Roboto Mono', monospace; font-size: 14px; fill: #1D3557; }
        .label-small { font-family: 'Roboto Mono', monospace; font-size: 12px; fill: #6C757D; }
        .label-purple { font-size: 14px; font-weight: 600; fill: #7209B7; }

        /* Animations */
        @keyframes pulseRay {
            0%, 100% { opacity: 0.7; stroke-width: 3px; }
            50% { opacity: 1; stroke-width: 5px; }
        }

        .ray {
            animation: pulseRay 2s infinite ease-in-out;
        }

        @keyframes packetFade {
            0%, 5% { opacity: 0; }
            15%, 80% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        .wave-packet {
            animation: packetFade 8s linear infinite;
        }

        @keyframes moveIncident {
            0% { transform: translate(-127.26px, -127.26px); }
            100% { transform: translate(212.13px, 212.13px); }
        }

        #incident-waves-group {
            animation: moveIncident 8s linear infinite;
        }

        @keyframes moveRefracted {
            0% { transform: translate(-56.57px, -105.84px); }
            100% { transform: translate(94.28px, 176.40px); }
        }

        #refracted-waves-group {
            animation: moveRefracted 8s linear infinite;
        }

        /* Huygens Wavelets Animations */
        .wavelet {
            fill: none;
            stroke: #7209B7;
            stroke-width: 2px;
        }

        @keyframes w1 {
            0%, 15.37% { r: 0; opacity: 0; }
            15.38% { r: 0; opacity: 0.6; }
            80% { opacity: 0.6; }
            90% { opacity: 0; }
            100% { r: 270.8px; opacity: 0; }
        }
        @keyframes w2 {
            0%, 26.49% { r: 0; opacity: 0; }
            26.50% { r: 0; opacity: 0.6; }
            80% { opacity: 0.6; }
            90% { opacity: 0; }
            100% { r: 235.2px; opacity: 0; }
        }
        @keyframes w3 {
            0%, 37.49% { r: 0; opacity: 0; }
            37.50% { r: 0; opacity: 0.6; }
            80% { opacity: 0.6; }
            90% { opacity: 0; }
            100% { r: 200.0px; opacity: 0; }
        }
        @keyframes w4 {
            0%, 48.49% { r: 0; opacity: 0; }
            48.50% { r: 0; opacity: 0.6; }
            80% { opacity: 0.6; }
            90% { opacity: 0; }
            100% { r: 164.8px; opacity: 0; }
        }
        @keyframes w5 {
            0%, 59.62% { r: 0; opacity: 0; }
            59.63% { r: 0; opacity: 0.6; }
            80% { opacity: 0.6; }
            90% { opacity: 0; }
            100% { r: 129.2px; opacity: 0; }
        }

        .w1 { animation: w1 8s linear infinite; }
        .w2 { animation: w2 8s linear infinite; }
        .w3 { animation: w3 8s linear infinite; }
        .w4 { animation: w4 8s linear infinite; }
        .w5 { animation: w5 8s linear infinite; }

        /* Huygens Sources (Dots) Animations */
        @keyframes d1 { 0%, 15.37% { opacity: 0; } 15.38%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
        @keyframes d2 { 0%, 26.49% { opacity: 0; } 26.50%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
        @keyframes d3 { 0%, 37.49% { opacity: 0; } 37.50%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
        @keyframes d4 { 0%, 48.49% { opacity: 0; } 48.50%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
        @keyframes d5 { 0%, 59.62% { opacity: 0; } 59.63%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }

        .d1 { animation: d1 8s linear infinite; }
        .d2 { animation: d2 8s linear infinite; }
        .d3 { animation: d3 8s linear infinite; }
        .d4 { animation: d4 8s linear infinite; }
        .d5 { animation: d5 8s linear infinite; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Clip Paths for Media -->
            <clipPath id="m1-clip">
                <rect x="0" y="0" width="800" height="250" />
            </clipPath>
            <clipPath id="m2-clip">
                <rect x="0" y="250" width="800" height="250" />
            </clipPath>

            <!-- Markers -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Base Wavefront Lines -->
            <!-- Incident wavefront (angle -45 deg, passing through 400,250) -->
            <line id="inc-wave" x1="187.9" y1="462.1" x2="612.1" y2="37.9" stroke="#00B4D8" stroke-width="2" />
            
            <!-- Refracted wavefront (angle -28.125 deg, passing through 400,250) -->
            <line id="ref-wave" x1="135.4" y1="391.4" x2="664.6" y2="108.6" stroke="#00B4D8" stroke-width="2" />
        </defs>

        <!-- Backgrounds for Media -->
        <rect x="0" y="0" width="800" height="250" fill="#EDF2FB" />
        <rect x="0" y="250" width="800" height="250" fill="#D7E3FC" />

        <!-- Interface Line -->
        <line x1="0" y1="250" x2="800" y2="250" stroke="#1D3557" stroke-width="3" />

        <!-- Normal Line -->
        <line x1="400" y1="50" x2="400" y2="450" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="6,6" />

        <!-- Angles -->
        <!-- Angle i (45 deg) -->
        <path d="M 400 190 A 60 60 0 0 0 357.6 207.6" fill="none" stroke="#1D3557" stroke-width="2" />
        <text x="370" y="185" font-family="Inter" font-size="16" font-style="italic" fill="#1D3557">i</text>
        
        <!-- Angle r (28.125 deg) -->
        <path d="M 400 320 A 70 70 0 0 0 433.0 311.7" fill="none" stroke="#1D3557" stroke-width="2" />
        <text x="415" y="340" font-family="Inter" font-size="16" font-style="italic" fill="#1D3557">r</text>

        <!-- Wavelets (Clipped to Medium 2) -->
        <g clip-path="url(#m2-clip)">
            <circle cx="250" cy="250" class="wavelet w1" />
            <circle cx="325" cy="250" class="wavelet w2" />
            <circle cx="400" cy="250" class="wavelet w3" />
            <circle cx="475" cy="250" class="wavelet w4" />
            <circle cx="550" cy="250" class="wavelet w5" />
        </g>

        <!-- Refracted Wavefronts (Clipped to Medium 2) -->
        <g clip-path="url(#m2-clip)">
            <g class="wave-packet">
                <g id="refracted-waves-group">
                    <!-- Spaced by λ2 = 40px -->
                    <use href="#ref-wave" transform="translate(0, 0)" />
                    <use href="#ref-wave" transform="translate(-18.86, -35.28)" />
                    <use href="#ref-wave" transform="translate(-37.71, -70.56)" />
                    <use href="#ref-wave" transform="translate(-56.57, -105.84)" />
                    <use href="#ref-wave" transform="translate(-75.42, -141.12)" />
                </g>
            </g>
        </g>

        <!-- Incident Wavefronts (Clipped to Medium 1) -->
        <g clip-path="url(#m1-clip)">
            <g class="wave-packet">
                <g id="incident-waves-group">
                    <!-- Spaced by λ1 = 60px -->
                    <use href="#inc-wave" transform="translate(0, 0)" />
                    <use href="#inc-wave" transform="translate(-42.42, -42.42)" />
                    <use href="#inc-wave" transform="translate(-84.84, -84.84)" />
                    <use href="#inc-wave" transform="translate(-127.26, -127.26)" />
                    <use href="#inc-wave" transform="translate(-169.68, -169.68)" />
                </g>
            </g>
        </g>

        <!-- Rays -->
        <line x1="230.3" y1="80.3" x2="397" y2="247" stroke="#06D6A0" class="ray" marker-end="url(#arrow-green)" />
        <line x1="400" y1="250" x2="517.9" y2="470.5" stroke="#06D6A0" class="ray" marker-end="url(#arrow-green)" />

        <!-- Huygens Sources (Dots) -->
        <circle cx="250" cy="250" r="4" fill="#7209B7" class="d1" />
        <circle cx="325" cy="250" r="4" fill="#7209B7" class="d2" />
        <circle cx="400" cy="250" r="4" fill="#7209B7" class="d3" />
        <circle cx="475" cy="250" r="4" fill="#7209B7" class="d4" />
        <circle cx="550" cy="250" r="4" fill="#7209B7" class="d5" />

        <!-- UI Overlays & Text -->
        
        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" class="title">Refraction: Huygens Principle &amp; Snell's Law</text>

        <!-- Medium 1 Label -->
        <text x="20" y="60" class="label-bold">Medium 1 (Air)</text>
        <text x="20" y="85" class="label-math">n₁ = 1.0</text>
        <text x="20" y="105" class="label-math">v₁ = c</text>
        <text x="20" y="125" class="label-math">λ₁ = 60 units</text>

        <!-- Medium 2 Label -->
        <text x="20" y="415" class="label-bold">Medium 2 (Glass)</text>
        <text x="20" y="440" class="label-math">n₂ = 1.5</text>
        <text x="20" y="460" class="label-math">v₂ = v₁ / 1.5</text>
        <text x="20" y="480" class="label-math">λ₂ = 40 units</text>

        <!-- Legend -->
        <rect x="580" y="60" width="200" height="110" rx="8" fill="#ffffff" opacity="0.9" stroke="#EDF2FB" stroke-width="2" />
        <text x="680" y="85" text-anchor="middle" class="label-bold">Legend</text>
        
        <line x1="595" y1="110" x2="625" y2="110" stroke="#00B4D8" stroke-width="2" />
        <text x="635" y="114" class="label-math" font-size="13">Wavefronts (λ)</text>
        
        <line x1="595" y1="135" x2="620" y2="135" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
        <text x="635" y="139" class="label-math" font-size="13">Rays (v)</text>
        
        <path d="M 595 165 A 15 15 0 0 1 625 165" fill="none" stroke="#7209B7" stroke-width="2" />
        <text x="635" y="164" class="label-math" font-size="13">Wavelets</text>

        <!-- Snell's Law Card -->
        <rect x="560" y="390" width="220" height="90" rx="8" fill="#ffffff" opacity="0.95" stroke="#D7E3FC" stroke-width="2" />
        <text x="670" y="415" text-anchor="middle" class="label-bold">Snell's Law</text>
        <text x="670" y="440" text-anchor="middle" class="label-math" font-size="16">n₁sin(i) = n₂sin(r)</text>
        <text x="670" y="465" text-anchor="middle" class="label-small">1.0 × sin(45°) = 1.5 × sin(28.1°)</text>

        <!-- Wavelet Annotation -->
        <path d="M 180 315 Q 240 315 305 265" fill="none" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple)" />
        <text x="170" y="320" text-anchor="end" class="label-purple">Secondary Wavelets</text>
        <text x="170" y="338" text-anchor="end" class="label-small" fill="#7209B7">(expand at v₂)</text>

    </svg>
</div>

</body>
</html>
