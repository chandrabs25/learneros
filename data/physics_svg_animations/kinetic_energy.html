<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anatomy of Kinetic Energy: Degrees of Freedom</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- Animations --- */
        
        /* 1. Translation (Phase 1 & 4) */
        .translate-group {
            transform-origin: 350px 250px;
            animation: anim-translate 12s infinite ease-in-out;
        }
        @keyframes anim-translate {
            0% { transform: translate(0, 0); }
            5% { transform: translate(40px, -30px); }
            10% { transform: translate(-20px, 40px); }
            15% { transform: translate(-50px, -20px); }
            20% { transform: translate(30px, 20px); }
            25%, 75% { transform: translate(0, 0); } /* Paused for Rot & Vib */
            80% { transform: translate(-40px, 30px); }
            85% { transform: translate(20px, -40px); }
            90% { transform: translate(50px, 20px); }
            95% { transform: translate(-30px, -20px); }
            100% { transform: translate(0, 0); }
        }

        /* 2. Rotation (Phase 2 & 4) */
        .rotate-group {
            transform-origin: 350px 250px;
            animation: anim-rotate 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes anim-rotate {
            0%, 25% { transform: rotate(0deg); }
            50%, 75% { transform: rotate(360deg); }
            100% { transform: rotate(720deg); }
        }

        /* 3. Vibration (Phase 3 & 4) */
        .vibrate-group {
            transform-origin: 350px 250px;
            animation: anim-vibrate 12s infinite ease-in-out;
        }
        @keyframes anim-vibrate {
            0%, 50% { transform: scaleX(1); }
            52.5% { transform: scaleX(1.15); }
            55% { transform: scaleX(0.85); }
            57.5% { transform: scaleX(1.15); }
            60% { transform: scaleX(0.85); }
            62.5% { transform: scaleX(1.15); }
            65% { transform: scaleX(0.85); }
            67.5% { transform: scaleX(1.15); }
            70% { transform: scaleX(0.85); }
            72.5% { transform: scaleX(1.15); }
            75% { transform: scaleX(1); }
            77.5% { transform: scaleX(1.15); }
            80% { transform: scaleX(0.85); }
            82.5% { transform: scaleX(1.15); }
            85% { transform: scaleX(0.85); }
            87.5% { transform: scaleX(1.15); }
            90% { transform: scaleX(0.85); }
            92.5% { transform: scaleX(1.15); }
            95% { transform: scaleX(0.85); }
            97.5% { transform: scaleX(1.15); }
            100% { transform: scaleX(1); }
        }

        /* --- Opacity Toggles for Phases --- */
        .op-phase1 { animation: op-p1 12s infinite; }
        .op-phase2 { animation: op-p2 12s infinite; }
        .op-phase3 { animation: op-p3 12s infinite; }
        .op-phase4 { animation: op-p4 12s infinite; }
        .op-phase1-4 { animation: op-p14 12s infinite; }
        .op-phase2-4 { animation: op-p24 12s infinite; }
        .op-phase3-4 { animation: op-p34 12s infinite; }

        @keyframes op-p1 { 0%, 24.9% {opacity:1} 25%, 100% {opacity:0} }
        @keyframes op-p2 { 0%, 24.9% {opacity:0} 25%, 49.9% {opacity:1} 50%, 100% {opacity:0} }
        @keyframes op-p3 { 0%, 49.9% {opacity:0} 50%, 74.9% {opacity:1} 75%, 100% {opacity:0} }
        @keyframes op-p4 { 0%, 74.9% {opacity:0} 75%, 100% {opacity:1} }
        
        @keyframes op-p14 { 0%, 24.9% {opacity:1} 25%, 74.9% {opacity:0} 75%, 100% {opacity:1} }
        @keyframes op-p24 { 0%, 24.9% {opacity:0} 25%, 49.9% {opacity:1} 50%, 74.9% {opacity:0} 75%, 100% {opacity:1} }
        @keyframes op-p34 { 0%, 49.9% {opacity:0} 50%, 100% {opacity:1} }

        /* --- Energy Bar Graph Animations --- */
        .bar-trans { animation: bar-t 12s infinite ease-in-out; }
        .bar-rot { animation: bar-r 12s infinite ease-in-out; }
        .bar-vib-pe { animation: bar-v-pe 12s infinite ease-in-out; }
        .bar-vib-ke { animation: bar-v-ke 12s infinite ease-in-out; }

        /* Base Y is 250. Max height is 150 (3 units). 1 unit = 50px */
        @keyframes bar-t {
            0%, 20% { height: 150px; y: 100px; }
            25%, 70% { height: 0px; y: 250px; }
            75%, 100% { height: 150px; y: 100px; }
        }
        @keyframes bar-r {
            0%, 20% { height: 0px; y: 250px; }
            25%, 45% { height: 100px; y: 150px; }
            50%, 70% { height: 0px; y: 250px; }
            75%, 100% { height: 100px; y: 150px; }
        }
        @keyframes bar-v-pe {
            0%, 45% { height: 0px; y: 250px; }
            50%, 100% { height: 50px; y: 200px; }
        }
        @keyframes bar-v-ke {
            0%, 45% { height: 0px; y: 250px; }
            50%, 100% { height: 50px; y: 150px; }
        }

        .math-font { font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Anatomy of Kinetic Energy: Degrees of Freedom in a Diatomic Molecule</title>
        <desc>An animated diagram showing translational, rotational, and vibrational kinetic energy modes of a diatomic molecule, demonstrating the Law of Equipartition of Energy.</desc>

        <!-- Definitions for Markers and Gradients -->
        <defs>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-green-rev" viewBox="0 0 10 10" refX="3" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <radialGradient id="atom-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#738cf9" />
                <stop offset="100%" stop-color="#4361EE" />
            </radialGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background Grid & Lab Axes -->
        <g stroke="#e9ecef" stroke-width="2" stroke-dasharray="4,4">
            <line x1="100" y1="250" x2="550" y2="250" /> <!-- X Axis -->
            <line x1="350" y1="50" x2="350" y2="450" /> <!-- Y Axis -->
            <line x1="200" y1="400" x2="500" y2="100" /> <!-- Z Axis -->
        </g>
        <g fill="#adb5bd" font-size="14" font-style="italic">
            <text x="540" y="240">x</text>
            <text x="360" y="60">y</text>
            <text x="490" y="90">z</text>
        </g>

        <!-- Header Texts -->
        <text x="400" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#212529">Kinetic Energy &amp; Degrees of Freedom</text>
        <text x="400" y="65" font-size="14" fill="#6c757d" text-anchor="middle">Law of Equipartition of Energy in a Diatomic Molecule</text>

        <!-- State Label Box -->
        <g transform="translate(30, 80)">
            <rect width="220" height="40" rx="8" fill="#212529" shadow="0 4px 6px rgba(0,0,0,0.1)"/>
            <text x="110" y="26" fill="#06D6A0" font-size="16" font-weight="600" text-anchor="middle" class="op-phase1">Mode: Translational</text>
            <text x="110" y="26" fill="#4361EE" font-size="16" font-weight="600" text-anchor="middle" class="op-phase2">Mode: Rotational</text>
            <text x="110" y="26" fill="#FF3366" font-size="16" font-weight="600" text-anchor="middle" class="op-phase3">Mode: Vibrational</text>
            <text x="110" y="26" fill="#F77F00" font-size="16" font-weight="600" text-anchor="middle" class="op-phase4">Mode: High Temp (All)</text>
        </g>

        <!-- Legend -->
        <g transform="translate(30, 400)" font-size="12" fill="#495057" font-weight="600">
            <rect x="0" y="0" width="14" height="14" fill="#FF3366" rx="3"/>
            <text x="24" y="11">Kinetic Energy (K.E.)</text>
            <rect x="0" y="24" width="14" height="14" fill="#4361EE" rx="3"/>
            <text x="24" y="35">Potential Energy (P.E.)</text>
            <rect x="0" y="48" width="14" height="14" fill="#06D6A0" rx="3"/>
            <text x="24" y="59">Velocity / Motion</text>
        </g>

        <!-- Main Molecule Animation Group -->
        <g class="translate-group">
            
            <!-- Translational Vectors (Phase 1 & 4) -->
            <g class="op-phase1-4">
                <line x1="350" y1="250" x2="460" y2="250" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" />
                <line x1="350" y1="250" x2="350" y2="140" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" />
                <line x1="350" y1="250" x2="260" y2="340" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" />
                <text x="465" y="245" fill="#06D6A0" class="math-font" font-size="16" font-weight="bold">v<tspan dy="5" font-size="0.7em">x</tspan></text>
                <text x="360" y="145" fill="#06D6A0" class="math-font" font-size="16" font-weight="bold">v<tspan dy="5" font-size="0.7em">y</tspan></text>
                <text x="245" y="355" fill="#06D6A0" class="math-font" font-size="16" font-weight="bold">v<tspan dy="5" font-size="0.7em">z</tspan></text>
            </g>

            <!-- Rotational Vectors (Phase 2 & 4) -->
            <g class="op-phase2-4">
                <!-- Z-axis rotation (in XY plane) -->
                <path d="M 350 150 A 100 100 0 1 1 250 250" fill="none" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" stroke-dasharray="8,4"/>
                <!-- Y-axis rotation (in XZ plane, simulated 3D) -->
                <path d="M 210 250 A 140 40 0 1 1 490 250" fill="none" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-green)" stroke-dasharray="8,4"/>
                <text x="495" y="245" fill="#06D6A0" class="math-font" font-size="20" font-weight="bold">ω</text>
            </g>

            <!-- Rotating Body -->
            <g class="rotate-group">
                <!-- Vibrating Body -->
                <g class="vibrate-group">
                    
                    <!-- Chemical Bond (Base) -->
                    <line x1="275" y1="250" x2="425" y2="250" stroke="#ced4da" stroke-width="10" stroke-linecap="round" />
                    
                    <!-- Vibrational Spring (Phase 3 & 4) -->
                    <path d="M 290 250 L 300 230 L 310 270 L 320 230 L 330 270 L 340 230 L 350 270 L 360 230 L 370 270 L 380 230 L 390 270 L 400 250 L 410 250" 
                          fill="none" stroke="#FF3366" stroke-width="4" stroke-linejoin="round" class="op-phase3-4" />

                    <!-- Atoms -->
                    <circle cx="275" cy="250" r="25" fill="url(#atom-grad)" filter="url(#glow)" />
                    <circle cx="425" cy="250" r="25" fill="url(#atom-grad)" filter="url(#glow)" />

                    <!-- Vibrational Ripples (Phase 3 & 4) -->
                    <g class="op-phase3-4">
                        <circle cx="275" cy="250" r="35" fill="none" stroke="#FF3366" stroke-width="2">
                            <animate attributeName="r" values="25; 45; 25" dur="0.8s" repeatCount="indefinite" />
                            <animate attributeName="opacity" values="1; 0; 1" dur="0.8s" repeatCount="indefinite" />
                        </circle>
                        <circle cx="425" cy="250" r="35" fill="none" stroke="#FF3366" stroke-width="2">
                            <animate attributeName="r" values="25; 45; 25" dur="0.8s" repeatCount="indefinite" />
                            <animate attributeName="opacity" values="1; 0; 1" dur="0.8s" repeatCount="indefinite" />
                        </circle>
                    </g>

                </g>
            </g>
            
            <!-- Center of Mass Indicator -->
            <circle cx="350" cy="250" r="4" fill="#212529" />
            <text x="358" y="265" font-size="10" fill="#212529" font-weight="700">CoM</text>
        </g>

        <!-- Dynamic Formulas (Bottom Center) -->
        <g transform="translate(350, 470)" class="math-font" font-size="20" font-weight="700" text-anchor="middle" fill="#212529">
            <text class="op-phase1">K<tspan dy="5" font-size="0.7em">t</tspan><tspan dy="-5"> = ½mv</tspan><tspan dy="-5" font-size="0.7em">2</tspan> <tspan fill="#6c757d" font-family="Inter" font-size="0.8em" font-weight="400">(3 Degrees of Freedom)</tspan></text>
            <text class="op-phase2">K<tspan dy="5" font-size="0.7em">r</tspan><tspan dy="-5"> = ½Iω</tspan><tspan dy="-5" font-size="0.7em">2</tspan> <tspan fill="#6c757d" font-family="Inter" font-size="0.8em" font-weight="400">(2 Degrees of Freedom)</tspan></text>
            <text class="op-phase3">E<tspan dy="5" font-size="0.7em">v</tspan><tspan dy="-5"> = ½mv</tspan><tspan dy="-5" font-size="0.7em">2</tspan><tspan dy="5"> + ½kx</tspan><tspan dy="-5" font-size="0.7em">2</tspan> <tspan fill="#6c757d" font-family="Inter" font-size="0.8em" font-weight="400">(2 Degrees of Freedom)</tspan></text>
            <text class="op-phase4">E<tspan dy="5" font-size="0.7em">total</tspan><tspan dy="-5"> = K</tspan><tspan dy="5" font-size="0.7em">t</tspan><tspan dy="-5"> + K</tspan><tspan dy="5" font-size="0.7em">r</tspan><tspan dy="-5"> + E</tspan><tspan dy="5" font-size="0.7em">v</tspan> <tspan fill="#6c757d" font-family="Inter" font-size="0.8em" font-weight="400">(7 Total DoF)</tspan></text>
        </g>

        <!-- Energy Bar Graph -->
        <g transform="translate(570, 100)">
            <!-- Graph Background -->
            <rect width="200" height="300" rx="12" fill="#ffffff" stroke="#dee2e6" stroke-width="2" />
            <text x="100" y="30" font-size="16" font-weight="700" text-anchor="middle" fill="#212529">Energy Distribution</text>
            
            <!-- Grid Lines -->
            <line x1="25" y1="100" x2="175" y2="100" stroke="#f8f9fa" stroke-width="2"/>
            <line x1="25" y1="150" x2="175" y2="150" stroke="#f8f9fa" stroke-width="2"/>
            <line x1="25" y1="200" x2="175" y2="200" stroke="#f8f9fa" stroke-width="2"/>
            
            <!-- Axes -->
            <line x1="35" y1="250" x2="180" y2="250" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>
            <line x1="35" y1="70" x2="35" y2="250" stroke="#adb5bd" stroke-width="2" stroke-linecap="round"/>

            <!-- Y-axis Labels (Equipartition Units) -->
            <text x="28" y="104" font-size="11" fill="#868e96" text-anchor="end" font-weight="600">3(½kT)</text>
            <text x="28" y="154" font-size="11" fill="#868e96" text-anchor="end" font-weight="600">2(½kT)</text>
            <text x="28" y="204" font-size="11" fill="#868e96" text-anchor="end" font-weight="600">1(½kT)</text>

            <!-- Animated Bars -->
            <!-- Translational (Max 3 units = 150px) -->
            <rect class="bar-trans" x="50" width="28" fill="#FF3366" rx="4" />
            
            <!-- Rotational (Max 2 units = 100px) -->
            <rect class="bar-rot" x="100" width="28" fill="#FF3366" rx="4" />
            
            <!-- Vibrational (Max 2 units = 100px, Split into PE and KE) -->
            <rect class="bar-vib-pe" x="150" width="28" fill="#4361EE" rx="4" />
            <rect class="bar-vib-ke" x="150" width="28" fill="#FF3366" rx="4" />

            <!-- X-axis Labels -->
            <text x="64" y="270" font-size="13" font-weight="700" fill="#495057" text-anchor="middle">Trans</text>
            <text x="114" y="270" font-size="13" font-weight="700" fill="#495057" text-anchor="middle">Rot</text>
            <text x="164" y="270" font-size="13" font-weight="700" fill="#495057" text-anchor="middle">Vib</text>
        </g>

    </svg>
</div>

</body>
</html>
