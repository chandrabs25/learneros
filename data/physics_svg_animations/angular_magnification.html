<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angular Magnification in an Astronomical Telescope</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .ray-orange {
            stroke-dasharray: 800;
            stroke-dashoffset: 800;
            animation: drawOrange 10s ease-in-out infinite;
        }

        .ray-blue {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawBlue 10s ease-in-out infinite;
        }

        .arrow-fade {
            animation: fadeArrow 10s ease-in-out infinite;
            opacity: 0;
        }

        .photons-group {
            animation: fadePhotons 10s ease-in-out infinite;
            opacity: 0;
        }

        .angle-arc {
            animation: pulseAngle 10s ease-in-out infinite;
            opacity: 0;
        }

        .angle-label {
            animation: fadeLabel 10s ease-in-out infinite;
            opacity: 0;
        }

        .intermediate-image {
            animation: fadeImage 10s ease-in-out infinite;
            opacity: 0;
        }

        @keyframes drawOrange {
            0%, 5% { stroke-dashoffset: 800; opacity: 0; }
            6% { opacity: 1; stroke-dashoffset: 800; }
            15% { stroke-dashoffset: 0; opacity: 1; }
            90% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes drawBlue {
            0%, 15% { stroke-dashoffset: 400; opacity: 0; }
            16% { opacity: 1; stroke-dashoffset: 400; }
            25% { stroke-dashoffset: 0; opacity: 1; }
            90% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes fadePhotons {
            0%, 25% { opacity: 0; }
            30%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes pulseAngle {
            0%, 25% { opacity: 0; stroke-width: 2px; }
            30%, 50% { opacity: 1; stroke-width: 4px; }
            55%, 85% { opacity: 1; stroke-width: 2px; }
            90%, 100% { opacity: 0; stroke-width: 2px; }
        }

        @keyframes fadeLabel {
            0%, 25% { opacity: 0; transform: translateY(5px); }
            30%, 85% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-5px); }
        }

        @keyframes fadeArrow {
            0%, 24% { opacity: 0; }
            25%, 90% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fadeImage {
            0%, 14% { opacity: 0; }
            15%, 90% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Hover Interactions */
        .lens-obj, .lens-eye {
            cursor: pointer;
        }
        
        .lens-obj ellipse, .lens-eye ellipse {
            transition: fill-opacity 0.3s, stroke-width 0.3s;
        }

        .lens-obj:hover ellipse, .lens-eye:hover ellipse {
            fill-opacity: 0.6;
            stroke-width: 3px;
        }

        .bracket line, .bracket text {
            transition: stroke 0.3s, fill 0.3s, stroke-width 0.3s;
        }

        .lens-obj:hover ~ .bracket-fo line { stroke: #FF3366; stroke-width: 2.5px; }
        .lens-obj:hover ~ .bracket-fo text { fill: #FF3366; font-weight: 700; }
        
        .lens-eye:hover ~ .bracket-fe line { stroke: #FF3366; stroke-width: 2.5px; }
        .lens-eye:hover ~ .bracket-fe text { fill: #FF3366; font-weight: 700; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Angular Magnification in an Astronomical Telescope</title>
        <desc>An animated diagram showing light rays passing through the objective and eyepiece lenses of an astronomical telescope, illustrating angular magnification.</desc>

        <defs>
            <!-- Arrowhead for blue outgoing rays -->
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>

            <!-- Arrowhead for intermediate image -->
            <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Drop shadow for formula box -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.08" />
            </filter>

            <!-- Full paths for photon animation -->
            <path id="p1" d="M 0 208.75 L 150 220 L 550 250 L 650 257.5 L 800 212.5" />
            <path id="p2" d="M 0 358.75 L 150 370 L 550 250 L 650 220 L 800 175" />
            <path id="p3" d="M 0 58.75 L 150 70 L 550 250 L 650 295 L 800 250" />
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="400" y="40" font-size="22" font-weight="700" fill="#212529" text-anchor="middle">Angular Magnification: Astronomical Telescope</text>
        <text x="400" y="60" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">Normal Adjustment (Image at Infinity)</text>

        <!-- Optical Axis -->
        <line x1="0" y1="220" x2="800" y2="220" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="8,4" />

        <!-- Lenses (Interactive) -->
        <g class="lens-obj">
            <ellipse cx="150" cy="220" rx="14" ry="180" fill="#A2D2FF" fill-opacity="0.3" stroke="#4361EE" stroke-width="2" pointer-events="all" />
            <text x="150" y="25" font-size="14" font-weight="600" fill="#4361EE" text-anchor="middle">Objective Lens</text>
        </g>

        <g class="lens-eye">
            <ellipse cx="650" cy="220" rx="10" ry="80" fill="#A2D2FF" fill-opacity="0.3" stroke="#4361EE" stroke-width="2" pointer-events="all" />
            <text x="650" y="125" font-size="14" font-weight="600" fill="#4361EE" text-anchor="middle">Eyepiece</text>
        </g>

        <!-- Brackets & Dimensions -->
        <g class="bracket bracket-fo">
            <line x1="150" y1="430" x2="550" y2="430" stroke="#6c757d" stroke-width="1.5" />
            <line x1="150" y1="425" x2="150" y2="435" stroke="#6c757d" stroke-width="1.5" />
            <line x1="550" y1="425" x2="550" y2="435" stroke="#6c757d" stroke-width="1.5" />
            <text x="350" y="420" font-size="14" font-family="Roboto Mono" fill="#495057" text-anchor="middle">f<tspan dy="3" font-size="10">o</tspan></text>
        </g>

        <g class="bracket bracket-fe">
            <line x1="550" y1="430" x2="650" y2="430" stroke="#6c757d" stroke-width="1.5" />
            <line x1="650" y1="425" x2="650" y2="435" stroke="#6c757d" stroke-width="1.5" />
            <text x="600" y="420" font-size="14" font-family="Roboto Mono" fill="#495057" text-anchor="middle">f<tspan dy="3" font-size="10">e</tspan></text>
        </g>

        <g class="bracket bracket-L">
            <line x1="150" y1="470" x2="650" y2="470" stroke="#adb5bd" stroke-width="1.5" />
            <line x1="150" y1="465" x2="150" y2="475" stroke="#adb5bd" stroke-width="1.5" />
            <line x1="650" y1="465" x2="650" y2="475" stroke="#adb5bd" stroke-width="1.5" />
            <text x="400" y="462" font-size="14" font-family="Roboto Mono" fill="#6c757d" text-anchor="middle">L = f<tspan dy="3" font-size="10">o</tspan><tspan dy="-3"> + f</tspan><tspan dy="3" font-size="10">e</tspan></text>
        </g>

        <!-- Intermediate Image -->
        <g class="intermediate-image">
            <line x1="550" y1="220" x2="550" y2="246" stroke="#7209B7" stroke-width="2.5" marker-end="url(#arrowPurple)" />
            <circle cx="550" cy="220" r="3" fill="#7209B7" />
            <text x="542" y="212" font-size="14" font-weight="600" font-family="Roboto Mono" fill="#7209B7" text-anchor="end">F<tspan dy="3" font-size="10">o</tspan><tspan dy="-3">,F</tspan><tspan dy="3" font-size="10">e</tspan></text>
            <text x="558" y="242" font-size="14" font-weight="600" font-family="Roboto Mono" fill="#7209B7" text-anchor="start">h'</text>
        </g>

        <!-- Light Rays -->
        <!-- Orange Rays (Incoming & Intermediate) -->
        <path d="M 0 208.75 L 150 220 L 550 250" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-orange" />
        <path d="M 0 358.75 L 150 370 L 550 250" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-orange" />
        <path d="M 0 58.75 L 150 70 L 550 250" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-orange" />

        <!-- Blue Rays (Outgoing) -->
        <path d="M 550 250 L 650 257.5 L 800 212.5" fill="none" stroke="#4361EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-blue" />
        <path d="M 550 250 L 650 220 L 800 175" fill="none" stroke="#4361EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-blue" />
        <path d="M 550 250 L 650 295 L 800 250" fill="none" stroke="#4361EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ray-blue" />

        <!-- Arrowheads for Blue Rays -->
        <path d="M 790 215.5 L 800 212.5" fill="none" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowBlue)" class="arrow-fade" />
        <path d="M 790 178 L 800 175" fill="none" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowBlue)" class="arrow-fade" />
        <path d="M 790 253 L 800 250" fill="none" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowBlue)" class="arrow-fade" />

        <!-- Angles -->
        <!-- Alpha Angle (Incoming) -->
        <g>
            <path d="M 70 220 A 80 80 0 0 1 70.24 214.0" fill="none" stroke="#06D6A0" class="angle-arc" />
            <text x="52" y="214" font-size="16" font-family="Roboto Mono" font-weight="700" fill="#06D6A0" class="angle-label">α</text>
        </g>

        <!-- Beta Angle (Outgoing) -->
        <g>
            <path d="M 710 220 A 60 60 0 0 0 707.5 202.8" fill="none" stroke="#FF3366" class="angle-arc" />
            <text x="722" y="200" font-size="16" font-family="Roboto Mono" font-weight="700" fill="#FF3366" class="angle-label">β</text>
        </g>

        <!-- Photons (Moving Particles) -->
        <g class="photons-group">
            <!-- Path 1 Photons -->
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p1"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-1.33s"><mpath href="#p1"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-2.66s"><mpath href="#p1"/></animateMotion>
            </circle>

            <!-- Path 2 Photons -->
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p2"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-1.33s"><mpath href="#p2"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-2.66s"><mpath href="#p2"/></animateMotion>
            </circle>

            <!-- Path 3 Photons -->
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#p3"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-1.33s"><mpath href="#p3"/></animateMotion>
            </circle>
            <circle r="3" fill="#ffffff" filter="drop-shadow(0 0 2px rgba(0,0,0,0.3))">
                <animateMotion dur="4s" repeatCount="indefinite" begin="-2.66s"><mpath href="#p3"/></animateMotion>
            </circle>
        </g>

        <!-- Formula Overlay Box -->
        <g transform="translate(560, 310)">
            <rect x="0" y="0" width="210" height="85" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="url(#shadow)" />
            <text x="105" y="25" font-size="13" font-weight="600" fill="#495057" text-anchor="middle" letter-spacing="0.5">MAGNIFICATION</text>
            
            <text x="35" y="60" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#212529">m =</text>
            
            <text x="85" y="50" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#FF3366">β</text>
            <line x1="80" y1="56" x2="102" y2="56" stroke="#212529" stroke-width="1.5" />
            <text x="85" y="74" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#06D6A0">α</text>
            
            <text x="115" y="60" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#212529">≈</text>
            
            <text x="145" y="50" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#212529">f<tspan dy="2" font-size="12">o</tspan></text>
            <line x1="140" y1="56" x2="172" y2="56" stroke="#212529" stroke-width="1.5" />
            <text x="145" y="74" font-size="18" font-family="Roboto Mono" font-weight="700" fill="#212529">f<tspan dy="2" font-size="12">e</tspan></text>
        </g>

        <!-- Legend -->
        <g transform="translate(20, 390)">
            <rect x="0" y="0" width="180" height="90" rx="6" fill="#ffffff" fill-opacity="0.9" stroke="#e9ecef" stroke-width="1" />
            
            <circle cx="15" cy="20" r="5" fill="#F77F00" />
            <text x="30" y="24" font-size="12" font-weight="600" fill="#495057">Incoming Light</text>
            
            <circle cx="15" cy="45" r="5" fill="#4361EE" />
            <text x="30" y="49" font-size="12" font-weight="600" fill="#495057">Outgoing Light</text>
            
            <circle cx="15" cy="70" r="5" fill="#7209B7" />
            <text x="30" y="74" font-size="12" font-weight="600" fill="#495057">Intermediate Image</text>
        </g>

    </svg>
</div>

</body>
</html>
