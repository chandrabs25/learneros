<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equivalent Resistance of a Symmetrical Cube</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1100px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Continuous Flow Animation */
        @keyframes flow {
            to { stroke-dashoffset: -24; }
        }

        /* Phase Animations for Opacity */
        @keyframes fade-in {
            0%, 5% { opacity: 0; }
            10%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes fade-t1 {
            0%, 15% { opacity: 0; }
            20%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes fade-t2 {
            0%, 25% { opacity: 0; }
            30%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes fade-t3 {
            0%, 35% { opacity: 0; }
            40%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes fade-out {
            0%, 45% { opacity: 0; }
            50%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes fade-math {
            0%, 55% { opacity: 0; transform: translateY(10px); }
            60%, 90% { opacity: 1; transform: translateY(0); }
            95%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Applying Animations */
        .current-path {
            stroke-dasharray: 12 12;
            animation: flow 0.8s linear infinite;
        }
        
        .tier-in { animation: fade-in 12s infinite; }
        .tier-1  { animation: fade-t1 12s infinite; }
        .tier-2  { animation: fade-t2 12s infinite; }
        .tier-3  { animation: fade-t3 12s infinite; }
        .tier-out { animation: fade-out 12s infinite; }
        
        .math-panel-container {
            animation: fade-math 12s infinite;
        }

        /* Math Panel HTML Styling */
        .math-panel {
            background: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            color: #212529;
            line-height: 1.6;
        }
        .math-panel h3 {
            margin: 0 0 12px 0;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            color: #4361EE;
            border-bottom: 2px solid #f8f9fa;
            padding-bottom: 6px;
        }
        .math-highlight {
            background: #e0fbfc;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            color: #0077b6;
        }
        
        /* SVG Element Styling */
        .node-label {
            font-size: 16px;
            font-weight: 700;
            fill: #212529;
            user-select: none;
        }
        .current-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 600;
            user-select: none;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 950 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Equivalent Resistance of a Symmetrical Cube</title>
        <desc>An animated 3D isometric diagram showing the flow of current through a cube of 12 identical resistors to derive the equivalent resistance.</desc>

        <!-- Definitions -->
        <defs>
            <!-- Glow Filter for Active Paths -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Resistor Symbol -->
            <g id="resistor">
                <!-- Background rect to hide the line underneath -->
                <rect x="-22" y="-12" width="44" height="24" fill="#ffffff" />
                <!-- Zig-zag path -->
                <path d="M -20 0 L -15 -10 L -5 10 L 5 -10 L 15 10 L 20 0" 
                      fill="none" stroke="#495057" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- Arrowheads -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="475" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#212529">Equivalent Resistance: Symmetrical Cube</text>
        <text x="475" y="65" text-anchor="middle" font-size="14" font-weight="400" fill="#6c757d">Current distribution and voltage drop across a 12-resistor network</text>

        <!-- Legend -->
        <g transform="translate(40, 90)">
            <rect width="190" height="140" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
            <text x="15" y="25" font-size="14" font-weight="700" fill="#495057">Legend</text>
            
            <line x1="15" y1="45" x2="45" y2="45" stroke="#FF3366" stroke-width="4" stroke-dasharray="6 4" />
            <text x="55" y="50" font-size="13" fill="#212529">Total Current (I)</text>
            
            <line x1="15" y1="75" x2="45" y2="75" stroke="#F77F00" stroke-width="3" stroke-dasharray="6 4" />
            <text x="55" y="80" font-size="13" fill="#212529">Branch Current (I/3)</text>
            
            <line x1="15" y1="105" x2="45" y2="105" stroke="#FFB703" stroke-width="2" stroke-dasharray="6 4" />
            <text x="55" y="110" font-size="13" fill="#212529">Branch Current (I/6)</text>
        </g>

        <!-- ==================== CIRCUIT EDGES (BASE) ==================== -->
        <g stroke="#dee2e6" stroke-width="3" stroke-linecap="round">
            <!-- Bottom Face -->
            <line x1="400" y1="480" x2="540" y2="410" /> <!-- a to b -->
            <line x1="540" y1="410" x2="400" y2="340" /> <!-- b to c -->
            <line x1="400" y1="340" x2="260" y2="410" /> <!-- c to d -->
            <line x1="260" y1="410" x2="400" y2="480" /> <!-- d to a -->
            
            <!-- Top Face -->
            <line x1="400" y1="300" x2="540" y2="230" /> <!-- e to f -->
            <line x1="540" y1="230" x2="400" y2="160" /> <!-- f to g -->
            <line x1="400" y1="160" x2="260" y2="230" /> <!-- g to h -->
            <line x1="260" y1="230" x2="400" y2="300" /> <!-- h to e -->
            
            <!-- Vertical Edges -->
            <line x1="400" y1="480" x2="400" y2="300" /> <!-- a to e -->
            <line x1="540" y1="410" x2="540" y2="230" /> <!-- b to f -->
            <line x1="400" y1="340" x2="400" y2="160" /> <!-- c to g -->
            <line x1="260" y1="410" x2="260" y2="230" /> <!-- d to h -->
        </g>

        <!-- ==================== ANIMATED CURRENT PATHS ==================== -->
        
        <!-- Entry Current (I) -->
        <g class="tier-in" filter="url(#glow)">
            <line x1="330" y1="550" x2="395" y2="485" stroke="#FF3366" stroke-width="4" class="current-path" marker-end="url(#arrow-red)" />
            <text x="340" y="530" fill="#FF3366" class="current-label">I</text>
        </g>

        <!-- Tier 1: I/3 (Orange) -->
        <g class="tier-1" filter="url(#glow)">
            <line x1="400" y1="480" x2="540" y2="410" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- a to b -->
            <line x1="400" y1="480" x2="260" y2="410" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- a to d -->
            <line x1="400" y1="480" x2="400" y2="300" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- a to e -->
            
            <text x="480" y="470" fill="#F77F00" class="current-label">I/3</text>
            <text x="300" y="470" fill="#F77F00" class="current-label">I/3</text>
            <text x="410" y="410" fill="#F77F00" class="current-label">I/3</text>
        </g>

        <!-- Tier 2: I/6 (Yellow/Gold) -->
        <g class="tier-2" filter="url(#glow)">
            <!-- From b -->
            <line x1="540" y1="410" x2="400" y2="340" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- b to c -->
            <line x1="540" y1="410" x2="540" y2="230" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- b to f -->
            <!-- From d -->
            <line x1="260" y1="410" x2="400" y2="340" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- d to c -->
            <line x1="260" y1="410" x2="260" y2="230" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- d to h -->
            <!-- From e -->
            <line x1="400" y1="300" x2="540" y2="230" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- e to f -->
            <line x1="400" y1="300" x2="260" y2="230" stroke="#FFB703" stroke-width="2" class="current-path" /> <!-- e to h -->
            
            <text x="550" y="325" fill="#FFB703" class="current-label">I/6</text>
            <text x="225" y="325" fill="#FFB703" class="current-label">I/6</text>
        </g>

        <!-- Tier 3: I/3 (Orange) -->
        <g class="tier-3" filter="url(#glow)">
            <line x1="400" y1="340" x2="400" y2="160" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- c to g -->
            <line x1="540" y1="230" x2="400" y2="160" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- f to g -->
            <line x1="260" y1="230" x2="400" y2="160" stroke="#F77F00" stroke-width="3" class="current-path" /> <!-- h to g -->
            
            <text x="410" y="240" fill="#F77F00" class="current-label">I/3</text>
            <text x="480" y="185" fill="#F77F00" class="current-label">I/3</text>
            <text x="300" y="185" fill="#F77F00" class="current-label">I/3</text>
        </g>

        <!-- Exit Current (I) -->
        <g class="tier-out" filter="url(#glow)">
            <line x1="400" y1="160" x2="465" y2="95" stroke="#FF3366" stroke-width="4" class="current-path" marker-end="url(#arrow-red)" />
            <text x="430" y="105" fill="#FF3366" class="current-label">I</text>
        </g>


        <!-- ==================== RESISTORS ==================== -->
        <!-- Placed on top of lines so they appear integrated -->
        <!-- Bottom Face -->
        <use href="#resistor" transform="translate(470, 445) rotate(-26.565)" /> <!-- ab -->
        <use href="#resistor" transform="translate(470, 375) rotate(26.565)" />  <!-- bc -->
        <use href="#resistor" transform="translate(330, 375) rotate(-26.565)" /> <!-- cd -->
        <use href="#resistor" transform="translate(330, 445) rotate(26.565)" />  <!-- da -->
        
        <!-- Top Face -->
        <use href="#resistor" transform="translate(470, 265) rotate(-26.565)" /> <!-- ef -->
        <use href="#resistor" transform="translate(470, 195) rotate(26.565)" />  <!-- fg -->
        <use href="#resistor" transform="translate(330, 195) rotate(-26.565)" /> <!-- gh -->
        <use href="#resistor" transform="translate(330, 265) rotate(26.565)" />  <!-- he -->
        
        <!-- Vertical Edges -->
        <use href="#resistor" transform="translate(400, 390) rotate(90)" /> <!-- ae -->
        <use href="#resistor" transform="translate(540, 320) rotate(90)" /> <!-- bf -->
        <use href="#resistor" transform="translate(400, 250) rotate(90)" /> <!-- cg -->
        <use href="#resistor" transform="translate(260, 320) rotate(90)" /> <!-- dh -->


        <!-- ==================== NODES & LABELS ==================== -->
        <!-- Nodes -->
        <g fill="#4361EE" stroke="#ffffff" stroke-width="2.5">
            <circle cx="400" cy="480" r="6" /> <!-- a -->
            <circle cx="540" cy="410" r="6" /> <!-- b -->
            <circle cx="400" cy="340" r="6" /> <!-- c -->
            <circle cx="260" cy="410" r="6" /> <!-- d -->
            <circle cx="400" cy="300" r="6" /> <!-- e -->
            <circle cx="540" cy="230" r="6" /> <!-- f -->
            <circle cx="400" cy="160" r="6" /> <!-- g -->
            <circle cx="260" cy="230" r="6" /> <!-- h -->
        </g>

        <!-- Node Labels -->
        <g class="node-label">
            <text x="385" y="505">a</text>
            <text x="555" y="420">b</text>
            <text x="415" y="335">c</text>
            <text x="235" y="420">d</text>
            <text x="380" y="295">e</text>
            <text x="555" y="225">f</text>
            <text x="385" y="145">g</text>
            <text x="235" y="225">h</text>
        </g>

        <!-- ==================== MATH PANEL ==================== -->
        <foreignObject x="640" y="320" width="280" height="240" class="math-panel-container">
            <div xmlns="http://www.w3.org/1999/xhtml" class="math-panel">
                <h3>Kirchhoff's Derivation</h3>
                <div style="margin-bottom: 8px;">
                    Path: <span style="color:#4361EE; font-weight:bold;">a → b → c → g</span>
                </div>
                <div style="margin-bottom: 8px;">
                    V<sub>ag</sub> = V<sub>ab</sub> + V<sub>bc</sub> + V<sub>cg</sub>
                </div>
                <div style="margin-bottom: 8px; color: #6c757d;">
                    V<sub>ag</sub> = (I/3)R + (I/6)R + (I/3)R
                </div>
                <div style="margin-bottom: 8px; color: #6c757d;">
                    V<sub>ag</sub> = <span style="color:#F77F00">2/6 IR</span> + <span style="color:#FFB703">1/6 IR</span> + <span style="color:#F77F00">2/6 IR</span>
                </div>
                <div style="margin-bottom: 12px; font-weight: bold;">
                    V<sub>ag</sub> = 5/6 IR
                </div>
                <div class="math-highlight">
                    R<sub>eq</sub> = V<sub>ag</sub> / I = 5/6 R
                </div>
            </div>
        </foreignObject>

    </svg>
</div>

</body>
</html>
