<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Coil Galvanometer Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 600; fill: #212529; }
        .subtitle { font-size: 14px; fill: #6C757D; }
        .label { font-size: 14px; fill: #495057; font-weight: 600; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 15px; fill: #212529; }
        .math-bold { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        
        /* Colors */
        .color-bfield { fill: #7209B7; }
        .color-force { fill: #FF3366; }
        .color-current { fill: #F77F00; }
        .color-spring { fill: #4361EE; }

        /* Animations */
        .rotating-assembly {
            transform-origin: 400px 300px;
            animation: rotateCoil 10s ease-in-out infinite;
        }

        .force-vector {
            animation: forceFade 10s ease-in-out infinite;
        }

        .coil-glow {
            animation: coilGlow 10s ease-in-out infinite;
        }

        .spring-anim {
            transform-origin: 400px 300px;
            animation: tightenSpring 10s ease-in-out infinite;
        }

        .current-indicator {
            animation: indicatorFade 10s ease-in-out infinite;
        }

        @keyframes rotateCoil {
            0%, 10% { transform: rotate(0deg); }
            30% { transform: rotate(45deg); }
            35% { transform: rotate(43.5deg); }
            40% { transform: rotate(45deg); }
            70% { transform: rotate(45deg); }
            80%, 100% { transform: rotate(0deg); }
        }

        @keyframes forceFade {
            0%, 9% { opacity: 0; }
            15%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        @keyframes coilGlow {
            0%, 9% { stroke: #E85D04; filter: none; }
            15%, 75% { stroke: #FFBA08; filter: drop-shadow(0 0 6px rgba(247, 127, 0, 0.8)); }
            80%, 100% { stroke: #E85D04; filter: none; }
        }

        @keyframes tightenSpring {
            0%, 10% { transform: rotate(0deg) scale(1); }
            30%, 70% { transform: rotate(45deg) scale(0.85); }
            80%, 100% { transform: rotate(0deg) scale(1); }
        }

        @keyframes indicatorFade {
            0%, 9% { opacity: 0.3; }
            15%, 75% { opacity: 1; }
            80%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 900 550" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>
            <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            
            <!-- Gradients -->
            <linearGradient id="gradN" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#343A40" />
                <stop offset="100%" stop-color="#6C757D" />
            </linearGradient>
            <linearGradient id="gradS" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#6C757D" />
                <stop offset="100%" stop-color="#343A40" />
            </linearGradient>
            <radialGradient id="gradCore" cx="50%" cy="50%" r="50%">
                <stop offset="70%" stop-color="#E9ECEF" />
                <stop offset="100%" stop-color="#CED4DA" />
            </radialGradient>
        </defs>

        <!-- Title & Header -->
        <text x="450" y="40" class="title" text-anchor="middle">Moving Coil Galvanometer</text>
        <text x="450" y="60" class="subtitle" text-anchor="middle">Top-Down Cross-Section View • Radial Magnetic Field</text>

        <!-- Dynamic Current Display -->
        <rect x="350" y="80" width="200" height="40" rx="8" fill="#f8f9fa" stroke="#DEE2E6" stroke-width="2"/>
        <text x="450" y="106" class="math math-bold current-indicator" text-anchor="middle" font-size="18">
            Current I: <tspan id="current-val" class="color-current">0.0</tspan> mA
        </text>

        <!-- Scale Arc & Ticks -->
        <g transform="translate(400, 300)">
            <path d="M -130 -130 A 183.8 183.8 0 0 1 130 -130" fill="none" stroke="#212529" stroke-width="3"/>
            <!-- Ticks every 15 degrees from -45 to +45 -->
            <line x1="0" y1="-183.8" x2="0" y2="-193.8" stroke="#212529" stroke-width="2" transform="rotate(-45)"/>
            <line x1="0" y1="-183.8" x2="0" y2="-188.8" stroke="#212529" stroke-width="1.5" transform="rotate(-30)"/>
            <line x1="0" y1="-183.8" x2="0" y2="-188.8" stroke="#212529" stroke-width="1.5" transform="rotate(-15)"/>
            <line x1="0" y1="-183.8" x2="0" y2="-195.8" stroke="#212529" stroke-width="3"/> <!-- Zero -->
            <line x1="0" y1="-183.8" x2="0" y2="-188.8" stroke="#212529" stroke-width="1.5" transform="rotate(15)"/>
            <line x1="0" y1="-183.8" x2="0" y2="-188.8" stroke="#212529" stroke-width="1.5" transform="rotate(30)"/>
            <line x1="0" y1="-183.8" x2="0" y2="-193.8" stroke="#212529" stroke-width="2" transform="rotate(45)"/>
            
            <!-- Scale Labels -->
            <text x="-145" y="-145" class="math" text-anchor="middle" font-size="12">MAX</text>
            <text x="0" y="-205" class="math" text-anchor="middle" font-size="14">0</text>
            <text x="145" y="-145" class="math" text-anchor="middle" font-size="12">MAX</text>
        </g>

        <!-- Concave Magnets -->
        <!-- North Magnet (Left) -->
        <path d="M 200 215 L 350 215 A 85 85 0 0 0 350 385 L 200 385 Z" fill="url(#gradN)" stroke="#212529" stroke-width="2"/>
        <text x="230" y="310" class="title" fill="#ffffff" font-size="28">N</text>
        
        <!-- South Magnet (Right) -->
        <path d="M 600 215 L 450 215 A 85 85 0 0 1 450 385 L 600 385 Z" fill="url(#gradS)" stroke="#212529" stroke-width="2"/>
        <text x="570" y="310" class="title" fill="#ffffff" font-size="28">S</text>

        <!-- Radial Magnetic Field Lines (Purple) -->
        <g transform="translate(400, 300)">
            <!-- North Side (Entering Core) -->
            <line x1="-85" y1="0" x2="-65" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(-40)"/>
            <line x1="-85" y1="0" x2="-65" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(-20)"/>
            <line x1="-85" y1="0" x2="-65" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)"/>
            <line x1="-85" y1="0" x2="-65" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(20)"/>
            <line x1="-85" y1="0" x2="-65" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(40)"/>
            
            <!-- South Side (Leaving Core) -->
            <line x1="65" y1="0" x2="85" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(-40)"/>
            <line x1="65" y1="0" x2="85" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(-20)"/>
            <line x1="65" y1="0" x2="85" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)"/>
            <line x1="65" y1="0" x2="85" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(20)"/>
            <line x1="65" y1="0" x2="85" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowB)" transform="rotate(40)"/>
        </g>

        <!-- Soft Iron Core -->
        <circle cx="400" cy="300" r="60" fill="url(#gradCore)" stroke="#ADB5BD" stroke-width="2"/>
        
        <!-- Restoring Spring -->
        <g class="spring-anim">
            <path d="M 400 300 Q 410 290 415 300 Q 420 315 400 320 Q 380 325 375 300 Q 370 275 400 270 Q 435 265 440 300" fill="none" stroke="#4361EE" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- Rotating Assembly (Coil, Pointer, Forces) -->
        <g class="rotating-assembly">
            <!-- Coil Rectangle -->
            <rect x="338" y="294" width="124" height="12" fill="none" stroke="#E85D04" stroke-width="3" rx="2" class="coil-glow"/>
            
            <!-- Coil Wire Cross-sections -->
            <!-- Left Wire (Current INTO page) -->
            <circle cx="338" cy="300" r="6" fill="#F77F00" stroke="#fff" stroke-width="1.5"/>
            <path d="M 335 297 L 341 303 M 335 303 L 341 297" stroke="#fff" stroke-width="1.5"/> <!-- Cross -->
            
            <!-- Right Wire (Current OUT OF page) -->
            <circle cx="462" cy="300" r="6" fill="#F77F00" stroke="#fff" stroke-width="1.5"/>
            <circle cx="462" cy="300" r="2" fill="#fff"/> <!-- Dot -->

            <!-- Pointer Needle -->
            <line x1="400" y1="300" x2="400" y2="125" stroke="#1D3557" stroke-width="3" stroke-linecap="round"/>
            <polygon points="396,130 404,130 400,115" fill="#1D3557"/>
            <circle cx="400" cy="300" r="4" fill="#1D3557"/>

            <!-- Force Vectors (Red) -->
            <!-- Left Force (UP) -->
            <g class="force-vector">
                <line x1="338" y1="290" x2="338" y2="240" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowF)"/>
                <text x="330" y="245" class="math math-bold color-force" text-anchor="end">F<tspan dy="5" font-size="11">m</tspan></text>
            </g>
            
            <!-- Right Force (DOWN) -->
            <g class="force-vector">
                <line x1="462" y1="310" x2="462" y2="360" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowF)"/>
                <text x="470" y="365" class="math math-bold color-force" text-anchor="start">F<tspan dy="5" font-size="11">m</tspan></text>
            </g>
        </g>

        <!-- Static Labels & Annotations -->
        
        <!-- B-Field Label -->
        <text x="280" y="270" class="math math-bold color-bfield" font-size="18">B</text>
        <text x="505" y="345" class="math math-bold color-bfield" font-size="18">B</text>

        <!-- Component Pointers -->
        <line x1="260" y1="420" x2="300" y2="380" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="4"/>
        <text x="255" y="435" class="label" text-anchor="middle">Concave Magnet</text>

        <line x1="400" y1="420" x2="400" y2="365" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="4"/>
        <text x="400" y="435" class="label" text-anchor="middle">Soft Iron Core</text>

        <line x1="540" y1="420" x2="430" y2="315" stroke="#6C757D" stroke-width="1.5" stroke-dasharray="4"/>
        <text x="545" y="435" class="label" text-anchor="middle">Restoring Spring</text>

        <!-- Physics Panel (Right Side) -->
        <rect x="650" y="120" width="230" height="320" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="2"/>
        <text x="665" y="150" class="label" font-size="16" fill="#212529">Physics Principles</text>
        
        <text x="665" y="180" class="label" font-size="13">1. Radial Magnetic Field</text>
        <text x="675" y="200" class="math color-bfield" font-size="13">θ = 90° <tspan fill="#6C757D" font-family="Inter">everywhere</tspan></text>
        
        <text x="665" y="235" class="label" font-size="13">2. Deflecting Torque</text>
        <text x="675" y="255" class="math color-force" font-size="14">τ<tspan dy="3" font-size="10">d</tspan><tspan dy="-3"> = NIAB</tspan></text>
        
        <text x="665" y="290" class="label" font-size="13">3. Restoring Torque</text>
        <text x="675" y="310" class="math color-spring" font-size="14">τ<tspan dy="3" font-size="10">r</tspan><tspan dy="-3"> = kφ</tspan></text>
        
        <text x="665" y="345" class="label" font-size="13">4. Equilibrium (τ<tspan dy="3" font-size="10">d</tspan><tspan dy="-3"> = τ</tspan><tspan dy="3" font-size="10">r</tspan><tspan dy="-3">)</tspan></text>
        <text x="675" y="370" class="math" font-size="14">φ = (NAB/k)·<tspan class="color-current">I</tspan></text>
        
        <rect x="665" y="390" width="200" height="35" rx="4" fill="#E9ECEF"/>
        <text x="765" y="413" class="math math-bold" text-anchor="middle" font-size="16">φ ∝ <tspan class="color-current">I</tspan></text>

        <!-- Legend -->
        <rect x="20" y="120" width="160" height="150" rx="8" fill="#ffffff" stroke="#DEE2E6" stroke-width="2"/>
        <text x="35" y="145" class="label" font-size="14">Legend</text>
        
        <circle cx="40" cy="170" r="6" fill="#F77F00"/>
        <text x="55" y="174" class="subtitle" font-size="13">Coil (Current)</text>
        
        <line x1="32" y1="200" x2="48" y2="200" stroke="#7209B7" stroke-width="3" marker-end="url(#arrowB)"/>
        <text x="55" y="204" class="subtitle" font-size="13">B-Field Vector</text>
        
        <line x1="32" y1="230" x2="48" y2="230" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowF)"/>
        <text x="55" y="234" class="subtitle" font-size="13">Force Vector</text>

        <path d="M 35 255 Q 40 265 45 255" fill="none" stroke="#4361EE" stroke-width="2"/>
        <text x="55" y="264" class="subtitle" font-size="13">Hairspring</text>

    </svg>

    <script>
        // Synchronize the dynamic current text with the 10-second CSS animation loop
        const currentText = document.getElementById('current-val');
        
        function updateCurrent() {
            // 10000ms loop
            const t = (Date.now() % 10000) / 10000; 
            let current = 0;
            
            // Match the CSS @keyframes rotateCoil timing
            if (t > 0.1 && t <= 0.3) {
                // Ramping up (1s to 3s)
                current = ((t - 0.1) / 0.2) * 5.0;
            } else if (t > 0.3 && t <= 0.7) {
                // Steady state (3s to 7s)
                current = 5.0;
                // Add slight oscillation simulation matching the CSS keyframes
                if (t > 0.3 && t <= 0.4) {
                    const osc = Math.sin((t - 0.3) * Math.PI * 10) * 0.2;
                    current += osc;
                }
            } else if (t > 0.7 && t <= 0.8) {
                // Ramping down (7s to 8s)
                current = ((0.8 - t) / 0.1) * 5.0;
            }
            
            // Ensure no negative values due to floating point
            current = Math.max(0, current);
            currentText.textContent = current.toFixed(1);
            
            requestAnimationFrame(updateCurrent);
        }
        
        // Start the loop
        updateCurrent();
    </script>
</body>
</html>
