<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Strong Nuclear Force</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Pause on hover */
        svg:hover * {
            animation-play-state: paused !important;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; fill: #6c757d; }
        .label { font-size: 12px; fill: #495057; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 13px; }
        .math-large { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; }
        
        /* Keyframes for Protons */
        @keyframes p1-move {
            0% { transform: translateX(40px); }
            33.3% { transform: translateX(190px); } /* Coulomb Barrier */
            41.6% { transform: translateX(220px); } /* Nuclear Well */
            45% { transform: translateX(215px); }
            50% { transform: translateX(225px); }
            55% { transform: translateX(215px); }
            60% { transform: translateX(225px); }
            65% { transform: translateX(215px); }
            70% { transform: translateX(225px); }
            75% { transform: translateX(220px); opacity: 1; }
            80% { transform: translateX(220px); opacity: 0; }
            95% { transform: translateX(40px); opacity: 0; }
            100% { transform: translateX(40px); opacity: 1; }
        }

        @keyframes p2-move {
            0% { transform: translateX(440px); }
            33.3% { transform: translateX(290px); } /* Coulomb Barrier */
            41.6% { transform: translateX(260px); } /* Nuclear Well */
            45% { transform: translateX(265px); }
            50% { transform: translateX(255px); }
            55% { transform: translateX(265px); }
            60% { transform: translateX(255px); }
            65% { transform: translateX(265px); }
            70% { transform: translateX(255px); }
            75% { transform: translateX(260px); opacity: 1; }
            80% { transform: translateX(260px); opacity: 0; }
            95% { transform: translateX(440px); opacity: 0; }
            100% { transform: translateX(440px); opacity: 1; }
        }

        /* Keyframes for Neutron */
        @keyframes neutron-move {
            0%, 35% { transform: translateY(-80px); opacity: 0; }
            45% { transform: translateY(0px); opacity: 1; }
            50% { transform: translateY(-4px); opacity: 1; }
            55% { transform: translateY(0px); opacity: 1; }
            60% { transform: translateY(-4px); opacity: 1; }
            65% { transform: translateY(0px); opacity: 1; }
            70% { transform: translateY(-4px); opacity: 1; }
            75% { transform: translateY(0px); opacity: 1; }
            80% { opacity: 0; }
            100% { transform: translateY(-80px); opacity: 0; }
        }

        /* Keyframes for Forces */
        @keyframes coulomb-scale {
            0% { transform: scaleX(0.3); opacity: 1; }
            33.3% { transform: scaleX(1.5); opacity: 1; }
            41.6% { transform: scaleX(2.0); opacity: 0.6; }
            75% { transform: scaleX(2.0); opacity: 0.6; }
            80% { opacity: 0; }
            100% { transform: scaleX(0.3); opacity: 1; }
        }

        @keyframes strong-scale {
            0%, 28% { transform: scaleX(0); opacity: 0; }
            33.3% { transform: scaleX(0.4); opacity: 0.8; }
            41.6% { transform: scaleX(1.6); opacity: 1; }
            45%, 55%, 65% { transform: scaleX(1.4); opacity: 1; }
            50%, 60%, 70% { transform: scaleX(1.7); opacity: 1; }
            75% { transform: scaleX(1.6); opacity: 1; }
            80% { opacity: 0; }
            100% { transform: scaleX(0); opacity: 0; }
        }

        /* Keyframes for Interaction Field (Halo) */
        @keyframes halo-pulse {
            0%, 30% { r: 20; opacity: 0; }
            33.3% { r: 35; opacity: 0.1; }
            41.6% { r: 60; opacity: 0.15; }
            45%, 55%, 65% { r: 55; opacity: 0.1; }
            50%, 60%, 70% { r: 65; opacity: 0.2; }
            75% { r: 60; opacity: 0.15; }
            80% { opacity: 0; }
            100% { r: 20; opacity: 0; }
        }

        /* Keyframes for Graph Tracking Dot */
        @keyframes dot-move {
            0% { transform: translate(760px, 295px); }
            33.3% { transform: translate(615px, 240px); }
            41.6% { transform: translate(570px, 420px); }
            45% { transform: translate(580px, 390px); }
            50% { transform: translate(560px, 390px); }
            55% { transform: translate(580px, 390px); }
            60% { transform: translate(560px, 390px); }
            65% { transform: translate(580px, 390px); }
            70% { transform: translate(560px, 390px); }
            75% { transform: translate(570px, 420px); opacity: 1; }
            80% { transform: translate(570px, 420px); opacity: 0; }
            95% { transform: translate(760px, 295px); opacity: 0; }
            100% { transform: translate(760px, 295px); opacity: 1; }
        }

        /* Keyframes for Formulas */
        @keyframes fade-coulomb {
            0%, 33.3% { opacity: 1; }
            41.6%, 100% { opacity: 0.3; }
        }
        @keyframes fade-strong {
            0%, 30% { opacity: 0; }
            41.6%, 75% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        /* Apply Animations */
        .p1 { animation: p1-move 12s ease-in-out infinite; }
        .p2 { animation: p2-move 12s ease-in-out infinite; }
        .neutron { animation: neutron-move 12s ease-in-out infinite; }
        .dot { animation: dot-move 12s ease-in-out infinite; }
        .halo { animation: halo-pulse 12s ease-in-out infinite; }
        
        .coulomb-arrow-1 { transform-origin: -25px 0px; animation: coulomb-scale 12s ease-in-out infinite; }
        .strong-arrow-1 { transform-origin: 25px 0px; animation: strong-scale 12s ease-in-out infinite; }
        .coulomb-arrow-2 { transform-origin: 25px 0px; animation: coulomb-scale 12s ease-in-out infinite; }
        .strong-arrow-2 { transform-origin: -25px 0px; animation: strong-scale 12s ease-in-out infinite; }
        
        .formula-coulomb { animation: fade-coulomb 12s ease-in-out infinite; }
        .formula-strong { animation: fade-strong 12s ease-in-out infinite; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing two protons approaching, repelling due to electric force, then snapping together as the strong nuclear force takes over at short range.">
    
    <!-- Definitions for Arrowheads and Gradients -->
    <defs>
        <marker id="arrow-coulomb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
        </marker>
        <marker id="arrow-strong" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
        </marker>
        <radialGradient id="halo-grad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#4361EE" stop-opacity="1" />
            <stop offset="100%" stop-color="#4361EE" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Background Base -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- Header -->
    <text x="400" y="35" text-anchor="middle" class="title">The Strong Nuclear Force</text>
    <text x="400" y="55" text-anchor="middle" class="subtitle">Overcoming Electrostatic Repulsion in the Nucleus</text>
    <text x="780" y="25" text-anchor="end" font-size="11" fill="#adb5bd" font-style="italic">Hover to pause animation</text>

    <!-- Left Panel: Physical Interaction Zone -->
    <rect x="20" y="80" width="450" height="370" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
    <text x="245" y="105" text-anchor="middle" class="label" font-weight="600">Physical Interaction Zone</text>
    
    <!-- Formulas -->
    <g class="formula-coulomb">
        <text x="245" y="140" text-anchor="middle" fill="#F77F00" class="math">
            <tspan font-style="italic">F</tspan><tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> = (1/4πε</tspan><tspan dy="4" font-size="10">0</tspan><tspan dy="-4">)(q</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4">q</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> / </tspan><tspan font-style="italic">r</tspan><tspan dy="-4" font-size="10">2</tspan><tspan dy="4">)</tspan>
        </text>
    </g>
    <g class="formula-strong">
        <text x="245" y="170" text-anchor="middle" fill="#4361EE" class="math-large">
            <tspan font-style="italic">F</tspan><tspan dy="4" font-size="12">s</tspan><tspan dy="-4"> ≫ </tspan><tspan font-style="italic">F</tspan><tspan dy="4" font-size="12">e</tspan>
        </text>
        <text x="245" y="190" text-anchor="middle" fill="#4361EE" class="label" font-style="italic">Nucleons Bound</text>
    </g>

    <!-- Distance Scale (Background) -->
    <line x1="40" y1="410" x2="440" y2="410" stroke="#dee2e6" stroke-width="2" />
    <line x1="240" y1="405" x2="240" y2="415" stroke="#adb5bd" stroke-width="2" />
    <text x="240" y="430" text-anchor="middle" class="label" fill="#adb5bd">r = 0</text>
    <line x1="140" y1="405" x2="140" y2="415" stroke="#dee2e6" stroke-width="2" />
    <line x1="340" y1="405" x2="340" y2="415" stroke="#dee2e6" stroke-width="2" />
    <line x1="40" y1="405" x2="40" y2="415" stroke="#dee2e6" stroke-width="2" />
    <line x1="440" y1="405" x2="440" y2="415" stroke="#dee2e6" stroke-width="2" />
    <text x="440" y="430" text-anchor="middle" class="label" fill="#adb5bd">r = 10 fm</text>

    <!-- Particles Group -->
    <g transform="translate(0, 280)">
        
        <!-- Proton 1 (Left) -->
        <g class="p1">
            <circle class="halo" cx="0" cy="0" fill="url(#halo-grad)" />
            <!-- Coulomb Repulsion Arrow (Points Left) -->
            <line x1="-25" y1="0" x2="-55" y2="0" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-coulomb)" class="coulomb-arrow-1" />
            <!-- Strong Force Arrow (Points Right) -->
            <line x1="25" y1="0" x2="65" y2="0" stroke="#4361EE" stroke-width="5" marker-end="url(#arrow-strong)" class="strong-arrow-1" />
            <!-- Particle Body -->
            <circle cx="0" cy="0" r="20" fill="#FF3366" />
            <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">+</text>
        </g>

        <!-- Proton 2 (Right) -->
        <g class="p2">
            <circle class="halo" cx="0" cy="0" fill="url(#halo-grad)" />
            <!-- Coulomb Repulsion Arrow (Points Right) -->
            <line x1="25" y1="0" x2="55" y2="0" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-coulomb)" class="coulomb-arrow-2" />
            <!-- Strong Force Arrow (Points Left) -->
            <line x1="-25" y1="0" x2="-65" y2="0" stroke="#4361EE" stroke-width="5" marker-end="url(#arrow-strong)" class="strong-arrow-2" />
            <!-- Particle Body -->
            <circle cx="0" cy="0" r="20" fill="#FF3366" />
            <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">+</text>
        </g>

        <!-- Neutron (Drops in from top) -->
        <g transform="translate(240, -35)" class="neutron">
            <circle class="halo" cx="0" cy="0" fill="url(#halo-grad)" />
            <!-- Strong Force Arrows from Neutron to Protons -->
            <line x1="-12" y1="12" x2="-22" y2="22" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-strong)" />
            <line x1="12" y1="12" x2="22" y2="22" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-strong)" />
            <!-- Particle Body -->
            <circle cx="0" cy="0" r="20" fill="#6C757D" />
            <text x="0" y="5" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold" font-style="italic">n</text>
        </g>

    </g>


    <!-- Right Panel: Potential Energy Graph -->
    <rect x="490" y="80" width="290" height="370" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
    <text x="635" y="105" text-anchor="middle" class="label" font-weight="600">Potential Energy Graph</text>

    <g transform="translate(0, 0)">
        <!-- Axes -->
        <!-- X Axis (V = 0) -->
        <line x1="520" y1="300" x2="760" y2="300" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4" />
        <text x="760" y="315" text-anchor="end" class="label math"><tspan font-style="italic">r</tspan> (fm)</text>
        
        <!-- Y Axis (r = 0) -->
        <line x1="540" y1="430" x2="540" y2="130" stroke="#adb5bd" stroke-width="2" />
        <text x="-280" y="525" transform="rotate(-90)" text-anchor="middle" class="label math"><tspan font-style="italic">V(r)</tspan> (MeV)</text>

        <!-- Axis Ticks -->
        <line x1="570" y1="297" x2="570" y2="303" stroke="#adb5bd" stroke-width="2" />
        <text x="570" y="315" text-anchor="middle" class="label" font-size="10">1.0</text>
        <line x1="615" y1="297" x2="615" y2="303" stroke="#adb5bd" stroke-width="2" />
        <text x="615" y="315" text-anchor="middle" class="label" font-size="10">2.5</text>

        <!-- Potential Energy Curve (Lennard-Jones + Coulomb shape) -->
        <path d="M 540 150 C 545 250, 550 420, 570 420 C 590 420, 600 240, 615 240 C 635 240, 680 290, 760 295" fill="none" stroke="#4361EE" stroke-width="3" stroke-linecap="round" />

        <!-- Graph Annotations -->
        <text x="615" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#F77F00">Coulomb Barrier</text>
        <line x1="615" y1="220" x2="615" y2="235" stroke="#F77F00" stroke-width="1" />
        
        <text x="570" y="445" text-anchor="middle" font-size="11" font-weight="600" fill="#4361EE">Nuclear Well</text>
        <line x1="570" y1="435" x2="570" y2="425" stroke="#4361EE" stroke-width="1" />

        <!-- Tracking Dot -->
        <circle class="dot" cx="0" cy="0" r="6" fill="#212529" stroke="#ffffff" stroke-width="2" />
    </g>


    <!-- Bottom Legend -->
    <g transform="translate(0, 475)">
        <circle cx="90" cy="0" r="7" fill="#FF3366" />
        <text x="105" y="4" class="label">Proton</text>

        <circle cx="180" cy="0" r="7" fill="#6C757D" />
        <text x="195" y="4" class="label">Neutron</text>

        <line x1="280" y1="0" x2="305" y2="0" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-coulomb)" />
        <text x="320" y="4" class="label">Coulomb Repulsion</text>

        <line x1="460" y1="0" x2="485" y2="0" stroke="#4361EE" stroke-width="4" marker-end="url(#arrow-strong)" />
        <text x="500" y="4" class="label">Strong Nuclear Force</text>

        <line x1="640" y1="0" x2="665" y2="0" stroke="#4361EE" stroke-width="3" />
        <text x="675" y="4" class="label">Potential Energy</text>
    </g>

</svg>

</body>
</html>
