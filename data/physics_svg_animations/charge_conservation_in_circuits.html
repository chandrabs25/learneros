<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirchhoff's Junction Rule Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            max-height: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .wire {
            stroke: #444444;
            stroke-width: 8;
            stroke-linecap: round;
            fill: none;
        }
        .current-arrow {
            stroke: #4361EE;
            stroke-width: 3;
            stroke-dasharray: 8 6;
            animation: flowArrow 1s linear infinite;
        }
        @keyframes flowArrow {
            from { stroke-dashoffset: 14; }
            to { stroke-dashoffset: 0; }
        }
        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
        .label-text {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            fill: #212529;
        }
        .title-text {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            fill: #212529;
        }
        .annotation-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            fill: #7209B7;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
        <title>Kirchhoff's First Law (Junction Rule)</title>
        <desc>An animated circuit node demonstrating the conservation of charge. The total current entering the junction equals the total current leaving.</desc>

        <defs>
            <!-- Glow filter for charges -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Shadow filter for the central node -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.3" />
            </filter>

            <!-- Arrowhead marker for current vectors -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#4361EE" />
            </marker>

            <!-- Motion Paths for Particles -->
            <!-- I1 to Outputs -->
            <path id="path13" d="M 183.494,125 L 400,250 L 576.777,73.223" />
            <path id="path14" d="M 183.494,125 L 400,250 L 650,250" />
            <path id="path15" d="M 183.494,125 L 400,250 L 576.777,426.777" />
            
            <!-- I2 to Outputs -->
            <path id="path23" d="M 183.494,375 L 400,250 L 576.777,73.223" />
            <path id="path24" d="M 183.494,375 L 400,250 L 650,250" />
            <path id="path25" d="M 183.494,375 L 400,250 L 576.777,426.777" />
        </defs>

        <!-- Background grid (optional, kept clean as per spec) -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title and Subtitle -->
        <text x="400" y="40" class="title-text" font-size="24" text-anchor="middle">Kirchhoff’s First Law (Junction Rule)</text>
        <text x="400" y="70" class="math-text" font-size="20" text-anchor="middle" fill="#4361EE">
            Σ I<tspan baseline-shift="sub" font-size="0.7em">in</tspan> = Σ I<tspan baseline-shift="sub" font-size="0.7em">out</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(600, 20)">
            <rect x="0" y="0" width="170" height="60" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
            <line x1="15" y1="20" x2="40" y2="20" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)"/>
            <text x="55" y="24" class="label-text" font-size="12">Current (I)</text>
            <circle cx="27" cy="42" r="4" fill="#FFD700" filter="url(#glow)"/>
            <text x="55" y="46" class="label-text" font-size="12">Charge (+q)</text>
        </g>

        <!-- Wires -->
        <g id="wires">
            <line x1="183.494" y1="125" x2="400" y2="250" class="wire" />
            <line x1="183.494" y1="375" x2="400" y2="250" class="wire" />
            <line x1="400" y1="250" x2="576.777" y2="73.223" class="wire" />
            <line x1="400" y1="250" x2="650" y2="250" class="wire" />
            <line x1="400" y1="250" x2="576.777" y2="426.777" class="wire" />
        </g>

        <!-- Current Arrows -->
        <g id="arrows">
            <!-- I1 Arrow -->
            <g transform="translate(291.7, 187.5) rotate(30)">
                <line x1="-20" y1="-18" x2="20" y2="-18" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.2"/>
                <line x1="-20" y1="-18" x2="15" y2="-18" class="current-arrow"/>
            </g>
            <!-- I2 Arrow -->
            <g transform="translate(291.7, 312.5) rotate(-30)">
                <line x1="-20" y1="18" x2="20" y2="18" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.2"/>
                <line x1="-20" y1="18" x2="15" y2="18" class="current-arrow"/>
            </g>
            <!-- I3 Arrow -->
            <g transform="translate(488.4, 161.6) rotate(-45)">
                <line x1="-20" y1="-18" x2="20" y2="-18" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.2"/>
                <line x1="-20" y1="-18" x2="15" y2="-18" class="current-arrow"/>
            </g>
            <!-- I4 Arrow -->
            <g transform="translate(525, 250) rotate(0)">
                <line x1="-20" y1="-18" x2="20" y2="-18" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.2"/>
                <line x1="-20" y1="-18" x2="15" y2="-18" class="current-arrow"/>
            </g>
            <!-- I5 Arrow -->
            <g transform="translate(488.4, 338.4) rotate(45)">
                <line x1="-20" y1="18" x2="20" y2="18" stroke="#4361EE" stroke-width="3" marker-end="url(#arrowhead)" opacity="0.2"/>
                <line x1="-20" y1="18" x2="15" y2="18" class="current-arrow"/>
            </g>
        </g>

        <!-- Current Labels -->
        <g id="labels">
            <text x="250" y="140" class="label-text" font-size="16">I<tspan baseline-shift="sub" font-size="0.7em">1</tspan> = 3A</text>
            <text x="250" y="370" class="label-text" font-size="16">I<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = 2A</text>
            <text x="500" y="130" class="label-text" font-size="16">I<tspan baseline-shift="sub" font-size="0.7em">3</tspan> = 2A</text>
            <text x="540" y="225" class="label-text" font-size="16">I<tspan baseline-shift="sub" font-size="0.7em">4</tspan> = 2A</text>
            <text x="500" y="380" class="label-text" font-size="16">I<tspan baseline-shift="sub" font-size="0.7em">5</tspan> = 1A</text>
        </g>

        <!-- Particles (Charges) -->
        <g id="particles" fill="#FFD700" filter="url(#glow)">
            <!-- I1 Particles (12 particles, 3 per second) -->
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#path13" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="0s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.333s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-0.333s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.667s"><mpath href="#path15" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-0.667s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.000s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-1.000s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.333s"><mpath href="#path13" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-1.333s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.667s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-1.667s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.000s"><mpath href="#path13" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-2.000s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.333s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-2.333s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.667s"><mpath href="#path15" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-2.667s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.000s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-3.000s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.333s"><mpath href="#path13" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-3.333s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.667s"><mpath href="#path14" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-3.667s" /></circle>

            <!-- I2 Particles (8 particles, 2 per second, phase shifted by 0.083s to avoid exact overlaps at node) -->
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.083s"><mpath href="#path23" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-0.083s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-0.583s"><mpath href="#path24" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-0.583s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.083s"><mpath href="#path25" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-1.083s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-1.583s"><mpath href="#path23" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-1.583s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.083s"><mpath href="#path23" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-2.083s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-2.583s"><mpath href="#path24" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-2.583s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.083s"><mpath href="#path25" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-3.083s" /></circle>
            <circle r="4"><animateMotion dur="4s" repeatCount="indefinite" begin="-3.583s"><mpath href="#path23" /></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="4s" repeatCount="indefinite" begin="-3.583s" /></circle>
        </g>

        <!-- Central Node -->
        <g id="node">
            <circle cx="400" cy="250" r="14" fill="#333333" filter="url(#shadow)" />
            <circle cx="400" cy="250" r="6" fill="#555555" />
        </g>

        <!-- Node Annotations -->
        <g id="node-annotation">
            <line x1="400" y1="270" x2="400" y2="280" stroke="#7209B7" stroke-width="1.5" />
            <text x="400" y="295" class="annotation-text" text-anchor="middle" font-weight="600">No charge accumulation</text>
            <text x="400" y="312" class="math-text" font-size="12" fill="#7209B7" text-anchor="middle">(dq/dt = 0)</text>
        </g>

        <!-- Real-time Equation -->
        <g id="equation" transform="translate(400, 450)">
            <text x="0" y="0" class="math-text" font-size="22" text-anchor="middle" fill="#212529">
                I<tspan baseline-shift="sub" font-size="0.7em">1</tspan> + I<tspan baseline-shift="sub" font-size="0.7em">2</tspan> = I<tspan baseline-shift="sub" font-size="0.7em">3</tspan> + I<tspan baseline-shift="sub" font-size="0.7em">4</tspan> + I<tspan baseline-shift="sub" font-size="0.7em">5</tspan>
            </text>
            <text x="0" y="30" class="math-text" font-size="20" text-anchor="middle" fill="#4361EE">
                3A + 2A = 2A + 2A + 1A <tspan fill="#212529" font-family="Inter"> ⇒ </tspan> <tspan fill="#06D6A0" font-weight="bold">5A = 5A</tspan>
            </text>
        </g>

    </svg>
</div>

</body>
</html>
