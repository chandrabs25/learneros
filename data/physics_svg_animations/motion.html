<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rectilinear Motion Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* CSS Animations */
        .object-group {
            /* 
               Phase 1 (0-4s / 0-40%): Constant velocity (linear)
               Phase 2 (4-6s / 40-60%): Constant deceleration to rest (quadratic ease-out)
               Phase 3 (6-8s / 60-80%): Stationary
               Phase 4 (8-10s / 80-100%): Reset
            */
            animation: move-obj 10s infinite;
        }

        .graph-clip-rect {
            /* Reveals the graph linearly with time */
            animation: draw-graph 10s infinite linear;
        }

        .fade-group {
            animation: fade-reset 10s infinite;
        }

        @keyframes move-obj {
            0% { transform: translateX(0px); animation-timing-function: linear; }
            40% { transform: translateX(300px); animation-timing-function: cubic-bezier(0.3333, 0.6667, 0.6667, 1); }
            60%, 80% { transform: translateX(375px); }
            82%, 100% { transform: translateX(0px); }
        }

        @keyframes draw-graph {
            0% { width: 0px; }
            80% { width: 600px; }
            82%, 100% { width: 0px; }
        }

        @keyframes fade-reset {
            0%, 78% { opacity: 1; }
            80%, 84% { opacity: 0; }
            86%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Rectilinear Motion: Position vs. Time</title>
        <desc>Animated diagram showing a particle moving along a straight line and its corresponding position-time graph.</desc>

        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#495057" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            
            <!-- Clip Path for Graph Drawing -->
            <clipPath id="graph-clip">
                <rect class="graph-clip-rect" x="100" y="30" width="0" height="240" />
            </clipPath>
        </defs>

        <!-- Static Background Elements -->
        <text x="40" y="40" font-size="20" font-weight="700" fill="#212529">Rectilinear Motion: Position (<tspan font-style="italic">x</tspan>) vs. Time (<tspan font-style="italic">t</tspan>)</text>

        <!-- Legend -->
        <g font-size="12" fill="#495057">
            <rect x="40" y="410" width="120" height="70" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1" />
            <circle cx="55" cy="425" r="5" fill="#4361EE" />
            <text x="70" y="429">Object</text>
            
            <line x1="50" y1="445" x2="60" y2="445" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)" />
            <text x="70" y="449">Velocity (<tspan font-style="italic">v</tspan>)</text>
            
            <line x1="50" y1="465" x2="60" y2="465" stroke="#FF3366" stroke-width="2" />
            <text x="70" y="469"><tspan font-style="italic">x-t</tspan> Graph</text>
        </g>

        <!-- Dynamic Values Box -->
        <rect x="620" y="20" width="140" height="70" rx="8" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" />
        <text id="time-text" x="635" y="45" font-family="'Roboto Mono', monospace" font-size="16" fill="#212529">t = 0.00 s</text>
        <text id="pos-text" x="635" y="70" font-family="'Roboto Mono', monospace" font-size="16" fill="#4361EE">x = 0.00 m</text>

        <!-- Graph Grid & Axes -->
        <g class="fade-group">
            <!-- Grid Lines -->
            <g stroke="#e9ecef" stroke-width="1" stroke-dasharray="4,4">
                <line x1="100" y1="210" x2="720" y2="210" />
                <line x1="100" y1="170" x2="720" y2="170" />
                <line x1="100" y1="130" x2="720" y2="130" />
                <line x1="100" y1="90" x2="720" y2="90" />
                <line x1="100" y1="50" x2="720" y2="50" />
                
                <line x1="175" y1="50" x2="175" y2="250" />
                <line x1="250" y1="50" x2="250" y2="250" />
                <line x1="325" y1="50" x2="325" y2="250" />
                <line x1="400" y1="50" x2="400" y2="250" />
                <line x1="475" y1="50" x2="475" y2="250" />
                <line x1="550" y1="50" x2="550" y2="250" />
                <line x1="625" y1="50" x2="625" y2="250" />
                <line x1="700" y1="50" x2="700" y2="250" />
            </g>

            <!-- Graph Axes -->
            <line x1="100" y1="250" x2="730" y2="250" stroke="#495057" stroke-width="2" marker-end="url(#arrow-axis)" />
            <line x1="100" y1="250" x2="100" y2="40" stroke="#495057" stroke-width="2" marker-end="url(#arrow-axis)" />
            
            <!-- Graph Labels -->
            <g font-size="12" fill="#6c757d" text-anchor="middle">
                <text x="175" y="268">1</text>
                <text x="250" y="268">2</text>
                <text x="325" y="268">3</text>
                <text x="400" y="268">4</text>
                <text x="475" y="268">5</text>
                <text x="550" y="268">6</text>
                <text x="625" y="268">7</text>
                <text x="700" y="268">8</text>
                <text x="730" y="268" font-weight="600" fill="#212529">t (s)</text>
            </g>
            <g font-size="12" fill="#6c757d" text-anchor="end">
                <text x="90" y="214">1</text>
                <text x="90" y="174">2</text>
                <text x="90" y="134">3</text>
                <text x="90" y="94">4</text>
                <text x="90" y="54">5</text>
                <text x="90" y="35" font-weight="600" fill="#212529">x (m)</text>
            </g>

            <!-- Physical Reference Frame (Axis) -->
            <line x1="50" y1="350" x2="750" y2="350" stroke="#495057" stroke-width="2" marker-end="url(#arrow-axis)" />
            
            <!-- Physical Axis Ticks & Labels -->
            <g stroke="#495057" stroke-width="2">
                <line x1="100" y1="345" x2="100" y2="355" />
                <line x1="175" y1="347" x2="175" y2="353" />
                <line x1="250" y1="347" x2="250" y2="353" />
                <line x1="325" y1="347" x2="325" y2="353" />
                <line x1="400" y1="347" x2="400" y2="353" />
                <line x1="475" y1="347" x2="475" y2="353" />
                <line x1="550" y1="347" x2="550" y2="353" />
                <line x1="625" y1="347" x2="625" y2="353" />
                <line x1="700" y1="347" x2="700" y2="353" />
            </g>
            <g font-size="12" fill="#6c757d" text-anchor="middle">
                <text x="100" y="375" font-weight="600" fill="#212529">0</text>
                <text x="175" y="375">1</text>
                <text x="250" y="375">2</text>
                <text x="325" y="375">3</text>
                <text x="400" y="375">4</text>
                <text x="475" y="375">5</text>
                <text x="550" y="375">6</text>
                <text x="625" y="375">7</text>
                <text x="700" y="375">8</text>
                <text x="740" y="375" font-weight="600" fill="#212529">x (m)</text>
                <text x="100" y="395" font-size="11" fill="#adb5bd">Origin</text>
            </g>

            <!-- The x-t Graph Path -->
            <!-- 
                Math: 
                Phase 1 (0-4s): Linear from (100,250) to (400,90). Slope = -160/300.
                Phase 2 (4-6s): Parabola from (400,90) to (550,50). Control point (475,50) ensures matching tangents.
                Phase 3 (6-8s): Horizontal line from (550,50) to (700,50).
            -->
            <path id="graph-line" d="M 100 250 L 400 90 Q 475 50 550 50 L 700 50" fill="none" stroke="#FF3366" stroke-width="3" clip-path="url(#graph-clip)" />

            <!-- Dynamic Connecting Lines -->
            <line id="indicator-line" x1="100" y1="350" x2="100" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,6" opacity="0" />
            <line id="indicator-y" x1="100" y1="250" x2="100" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4" opacity="0" />
            <line id="indicator-x" x1="100" y1="250" x2="100" y2="250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4" opacity="0" />
            
            <circle id="graph-point" cx="100" cy="250" r="5" fill="#FF3366" opacity="0" />

            <!-- The Moving Object & Velocity Vector -->
            <g class="object-group">
                <circle cx="100" cy="350" r="10" fill="#4361EE" />
                
                <!-- Velocity Vector (Updated via JS to prevent arrowhead distortion) -->
                <line id="v-arrow" x1="100" y1="350" x2="160" y2="350" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)" />
                <text id="v-text" x="170" y="345" fill="#06D6A0" font-family="'Roboto Mono', monospace" font-size="14" font-weight="600" font-style="italic">v</text>
            </g>
        </g>
    </svg>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const obj = document.querySelector('.object-group');
        const graphClip = document.querySelector('.graph-clip-rect');
        const timeText = document.querySelector('#time-text');
        const posText = document.querySelector('#pos-text');
        const indicator = document.querySelector('#indicator-line');
        const indicatorY = document.querySelector('#indicator-y');
        const indicatorX = document.querySelector('#indicator-x');
        const graphPoint = document.querySelector('#graph-point');
        const vArrow = document.querySelector('#v-arrow');
        const vText = document.querySelector('#v-text');
        const fadeGroup = document.querySelector('.fade-group');

        function update() {
            // Read current physical X from CSS transform matrix
            const style = window.getComputedStyle(obj);
            const transform = style.transform;
            let tx = 0;
            if (transform !== 'none') {
                const values = transform.split('(')[1].split(')')[0].split(',');
                tx = parseFloat(values[4]);
            }
            
            // Read current Time from clip-path width
            const clipStyle = window.getComputedStyle(graphClip);
            const clipWidth = parseFloat(clipStyle.width); 
            
            // Convert pixels to physical units
            let x_m = tx / 75;
            let t_s = clipWidth / 75;
            
            // Update Text Displays
            timeText.textContent = `t = ${t_s.toFixed(2)} s`;
            posText.textContent = `x = ${x_m.toFixed(2)} m`;
            
            // Calculate SVG Coordinates
            let objX = 100 + tx;
            let graphX = 100 + clipWidth;
            let graphY = 250 - x_m * 40;
            
            // Calculate instantaneous velocity for the vector
            // Phase 1: v = 1 m/s. Phase 2: v = 1 - 0.5*t. Phase 3: v = 0.
            let v = 0;
            if (t_s <= 4) {
                v = 1;
            } else if (t_s <= 6) {
                v = 1 - 0.5 * (t_s - 4);
            } else {
                v = 0;
            }

            // Update Velocity Vector (Length = 60px per 1 m/s)
            if (v > 0.02) {
                let arrowEnd = objX + v * 60;
                vArrow.setAttribute('x1', objX);
                vArrow.setAttribute('x2', arrowEnd);
                vArrow.style.opacity = 1;
                
                vText.setAttribute('x', arrowEnd + 10);
                vText.setAttribute('y', 345);
                vText.style.opacity = 1;
            } else {
                vArrow.style.opacity = 0;
                vText.style.opacity = 0;
            }
            
            // Check visibility state from the fade animation
            const groupOpacity = parseFloat(window.getComputedStyle(fadeGroup).opacity);
            
            // Update Dynamic Indicators
            if (groupOpacity > 0.1 && t_s <= 8.05) {
                // Diagonal mapping line from object to graph point
                indicator.setAttribute('x1', objX);
                indicator.setAttribute('y1', 350);
                indicator.setAttribute('x2', graphX);
                indicator.setAttribute('y2', graphY);
                indicator.style.opacity = 0.6;
                
                // Horizontal line to Position axis
                indicatorY.setAttribute('x1', 100);
                indicatorY.setAttribute('y1', graphY);
                indicatorY.setAttribute('x2', graphX);
                indicatorY.setAttribute('y2', graphY);
                indicatorY.style.opacity = 0.6;

                // Vertical line to Time axis
                indicatorX.setAttribute('x1', graphX);
                indicatorX.setAttribute('y1', 250);
                indicatorX.setAttribute('x2', graphX);
                indicatorX.setAttribute('y2', graphY);
                indicatorX.style.opacity = 0.6;
                
                // Moving point on the graph
                graphPoint.setAttribute('cx', graphX);
                graphPoint.setAttribute('cy', graphY);
                graphPoint.style.opacity = 1;
            } else {
                indicator.style.opacity = 0;
                indicatorY.style.opacity = 0;
                indicatorX.style.opacity = 0;
                graphPoint.style.opacity = 0;
            }
            
            requestAnimationFrame(update);
        }
        
        // Start the sync loop
        requestAnimationFrame(update);
    });
</script>

</body>
</html>
