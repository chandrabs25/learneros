<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Degrees of Freedom (f): Kinetic Theory</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        text {
            user-select: none;
        }

        /* Axes Animation */
        .axis {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: drawAxis 1.5s ease-out forwards;
        }

        @keyframes drawAxis {
            to { stroke-dashoffset: 0; }
        }

        /* Monatomic Translation (0-4s of 10s loop) */
        .monatomic-anim {
            animation: monaTrans 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes monaTrans {
            0%, 5%, 35%, 100% { transform: translate(0px, 0px); }
            10% { transform: translate(30px, 17.3px); } /* +X */
            15% { transform: translate(0px, 0px); }
            20% { transform: translate(0px, -35px); } /* +Y */
            25% { transform: translate(0px, 0px); }
            30% { transform: translate(-30px, 17.3px); } /* +Z */
        }

        /* Diatomic Translation (0-4s of 10s loop) */
        .diatomic-trans {
            animation: diaTrans 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes diaTrans {
            0%, 5%, 35%, 100% { transform: translate(0px, 0px); }
            15% { transform: translate(20px, -15px); } /* +X, +Y */
            25% { transform: translate(-20px, 15px); } /* -X, -Y */
        }

        /* Diatomic Rotation (4-8s of 10s loop) */
        .diatomic-rot {
            transform-origin: 0 0;
            animation: diaRot 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes diaRot {
            0%, 40% { transform: rotate3d(0, 1, 0, 0deg); }
            45%, 55% { transform: rotate3d(0, 1, 0, 360deg); } /* Rotate around Y */
            55.1% { transform: rotate3d(-0.866, 0.5, 0, 0deg); }
            60%, 70% { transform: rotate3d(-0.866, 0.5, 0, 360deg); } /* Rotate around Z */
            70.1%, 100% { transform: rotate3d(0, 1, 0, 0deg); }
        }

        /* Vector Opacity Pulses */
        .vec-x { animation: pulseX 10s infinite; }
        .vec-y { animation: pulseY 10s infinite; }
        .vec-z { animation: pulseZ 10s infinite; }
        .vec-dia { animation: pulseDia 10s infinite; }

        @keyframes pulseX { 0%, 5%, 15%, 100% { opacity: 0.3; } 10% { opacity: 1; } }
        @keyframes pulseY { 0%, 15%, 25%, 100% { opacity: 0.3; } 20% { opacity: 1; } }
        @keyframes pulseZ { 0%, 25%, 35%, 100% { opacity: 0.3; } 30% { opacity: 1; } }
        @keyframes pulseDia { 0%, 5%, 35%, 100% { opacity: 0.3; } 15%, 25% { opacity: 1; } }

        /* Rotational Arcs Opacity */
        .arc-y { animation: showArcY 10s infinite; }
        .arc-z { animation: showArcZ 10s infinite; }

        @keyframes showArcY { 0%, 40%, 55%, 100% { opacity: 0; } 45%, 50% { opacity: 1; } }
        @keyframes showArcZ { 0%, 55%, 70%, 100% { opacity: 0; } 60%, 65% { opacity: 1; } }

        /* Energy Packets (Glowing Dots) */
        .packet { opacity: 0; }
        .p1 { animation: floatP1 10s infinite; }
        .p2 { animation: floatP2 10s infinite; }
        .p3 { animation: floatP3 10s infinite; }
        .p4 { animation: floatP4 10s infinite; }
        .p5 { animation: floatP5 10s infinite; }

        @keyframes floatP1 { 5% { opacity:0; transform:translate(0,0) scale(0.5); } 10% { opacity:1; transform:translate(0,-20px) scale(1.2); } 15% { opacity:0; transform:translate(0,-40px) scale(1); } }
        @keyframes floatP2 { 15% { opacity:0; transform:translate(0,0) scale(0.5); } 20% { opacity:1; transform:translate(0,-20px) scale(1.2); } 25% { opacity:0; transform:translate(0,-40px) scale(1); } }
        @keyframes floatP3 { 25% { opacity:0; transform:translate(0,0) scale(0.5); } 30% { opacity:1; transform:translate(0,-20px) scale(1.2); } 35% { opacity:0; transform:translate(0,-40px) scale(1); } }
        @keyframes floatP4 { 42% { opacity:0; transform:translate(0,0) scale(0.5); } 47% { opacity:1; transform:translate(0,-20px) scale(1.2); } 52% { opacity:0; transform:translate(0,-40px) scale(1); } }
        @keyframes floatP5 { 57% { opacity:0; transform:translate(0,0) scale(0.5); } 62% { opacity:1; transform:translate(0,-20px) scale(1.2); } 67% { opacity:0; transform:translate(0,-40px) scale(1); } }

        /* Formula Pulse */
        .formula {
            transform-origin: center;
            animation: pulseFormula 10s infinite;
        }

        @keyframes pulseFormula {
            0%, 75%, 100% { transform: scale(1); opacity: 0.8; }
            85%, 90% { transform: scale(1.15); opacity: 1; }
        }
        
        .highlight-text {
            animation: colorShift 10s infinite;
        }
        
        @keyframes colorShift {
            0%, 75%, 100% { fill: #7209B7; }
            85%, 90% { fill: #FF3366; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <radialGradient id="atomGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#4CC9F0" />
            <stop offset="100%" stop-color="#4361EE" />
        </radialGradient>
        
        <radialGradient id="energyGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FF3366" stop-opacity="1" />
            <stop offset="100%" stop-color="#FF3366" stop-opacity="0" />
        </radialGradient>

        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
        </filter>

        <!-- Arrowheads -->
        <marker id="arrow-vel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
        </marker>
        <marker id="arrow-rot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
        </marker>
        <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0 2 L 10 5 L 0 8 z" fill="#adb5bd" />
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" rx="12" />

    <!-- Title -->
    <text x="400" y="45" font-family="Inter" font-size="24" font-weight="700" text-anchor="middle" fill="#212529">Degrees of Freedom (f): Kinetic Theory</text>

    <!-- Legend -->
    <g transform="translate(610, 15)">
        <rect x="0" y="0" width="170" height="75" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" rx="6" />
        <line x1="10" y1="18" x2="30" y2="18" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-vel)"/>
        <text x="40" y="22" font-family="Inter" font-size="11" fill="#495057">Translational Vel.</text>
        
        <path d="M 10 40 Q 20 30 30 40" fill="none" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-rot)"/>
        <text x="40" y="42" font-family="Inter" font-size="11" fill="#495057">Rotational Axis</text>
        
        <circle cx="20" cy="58" r="4" fill="#FF3366" />
        <text x="40" y="62" font-family="Inter" font-size="11" fill="#495057">Energy Packet (kT/2)</text>
    </g>

    <!-- ================= LEFT PANE: MONATOMIC ================= -->
    <g transform="translate(200, 240)">
        <!-- Axes -->
        <g stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-axis)" class="axis">
            <line x1="0" y1="0" x2="86.6" y2="50" /> <!-- X -->
            <line x1="0" y1="0" x2="0" y2="-100" /> <!-- Y -->
            <line x1="0" y1="0" x2="-86.6" y2="50" /> <!-- Z -->
        </g>
        
        <!-- Axis Labels -->
        <text x="95" y="60" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">x</text>
        <text x="-10" y="-105" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">y</text>
        <text x="-95" y="60" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">z</text>

        <!-- Monatomic Animation Group -->
        <g class="monatomic-anim">
            <!-- Velocity Vectors -->
            <g stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-vel)">
                <line x1="0" y1="0" x2="60.6" y2="35" class="vec-x" />
                <line x1="0" y1="0" x2="0" y2="-70" class="vec-y" />
                <line x1="0" y1="0" x2="-60.6" y2="35" class="vec-z" />
            </g>

            <!-- Vector Labels -->
            <g class="vec-x" transform="translate(65, 45)">
                <text font-family="Roboto Mono" font-style="italic" font-size="14" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">x</tspan></text>
                <path d="M 0,-12 L 6,-12 L 4,-14 M 6,-12 L 4,-10" stroke="#06D6A0" stroke-width="1" fill="none"/>
            </g>
            <g class="vec-y" transform="translate(10, -65)">
                <text font-family="Roboto Mono" font-style="italic" font-size="14" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">y</tspan></text>
                <path d="M 0,-12 L 6,-12 L 4,-14 M 6,-12 L 4,-10" stroke="#06D6A0" stroke-width="1" fill="none"/>
            </g>
            <g class="vec-z" transform="translate(-75, 45)">
                <text font-family="Roboto Mono" font-style="italic" font-size="14" fill="#06D6A0">v<tspan baseline-shift="sub" font-size="10">z</tspan></text>
                <path d="M 0,-12 L 6,-12 L 4,-14 M 6,-12 L 4,-10" stroke="#06D6A0" stroke-width="1" fill="none"/>
            </g>

            <!-- Atom -->
            <circle cx="0" cy="0" r="22" fill="url(#atomGrad)" filter="url(#shadow)" />
            
            <!-- Energy Packets (Floating Dots) -->
            <circle cx="0" cy="-30" r="5" fill="#FF3366" class="packet p1" filter="url(#shadow)" />
            <circle cx="0" cy="-30" r="5" fill="#FF3366" class="packet p2" filter="url(#shadow)" />
            <circle cx="0" cy="-30" r="5" fill="#FF3366" class="packet p3" filter="url(#shadow)" />
        </g>
    </g>

    <!-- ================= RIGHT PANE: DIATOMIC ================= -->
    <g transform="translate(600, 240)">
        <!-- Axes -->
        <g stroke="#adb5bd" stroke-width="1.5" marker-end="url(#arrow-axis)" class="axis">
            <line x1="0" y1="0" x2="86.6" y2="50" /> <!-- X -->
            <line x1="0" y1="0" x2="0" y2="-100" /> <!-- Y -->
            <line x1="0" y1="0" x2="-86.6" y2="50" /> <!-- Z -->
        </g>
        
        <!-- Axis Labels -->
        <text x="95" y="60" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">x</text>
        <text x="-10" y="-105" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">y</text>
        <text x="-95" y="60" font-family="Roboto Mono" font-size="12" fill="#adb5bd" font-style="italic">z</text>

        <!-- Diatomic Translation Group -->
        <g class="diatomic-trans">
            
            <!-- CoM Velocity Vectors -->
            <g stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrow-vel)" class="vec-dia">
                <line x1="0" y1="0" x2="60.6" y2="35" />
                <line x1="0" y1="0" x2="0" y2="-70" />
                <line x1="0" y1="0" x2="-60.6" y2="35" />
            </g>

            <!-- Rotational Arcs (Drawn in background to avoid 3D clipping) -->
            <!-- Arc around Y-axis (lies in XZ plane, horizontal ellipse) -->
            <path d="M -45,0 A 45,15 0 1,0 45,0" fill="none" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-rot)" class="arc-y" />
            <path d="M 45,0 A 45,15 0 0,0 -45,0" fill="none" stroke="#FF3366" stroke-width="3" stroke-dasharray="4 4" class="arc-y" />
            
            <!-- Arc around Z-axis (lies in XY plane, rotated -30 deg) -->
            <g transform="rotate(-30)" class="arc-z">
                <path d="M -45,0 A 45,15 0 1,0 45,0" fill="none" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-rot)" />
                <path d="M 45,0 A 45,15 0 0,0 -45,0" fill="none" stroke="#FF3366" stroke-width="3" stroke-dasharray="4 4" />
            </g>

            <!-- Diatomic Rotation Group -->
            <g class="diatomic-rot">
                <!-- Invisible bounding box stabilizer for 3D transform -->
                <circle cx="0" cy="0" r="80" fill="none" />
                
                <!-- Bond (Lies on isometric X-axis: 30 degrees) -->
                <!-- Atom 1: (-43.3, -25), Atom 2: (43.3, 25) -->
                <line x1="-43.3" y1="-25" x2="43.3" y2="25" stroke="#6c757d" stroke-width="14" stroke-linecap="round" filter="url(#shadow)" />
                
                <!-- Atoms -->
                <circle cx="-43.3" cy="-25" r="18" fill="url(#atomGrad)" filter="url(#shadow)" />
                <circle cx="43.3" cy="25" r="18" fill="url(#atomGrad)" filter="url(#shadow)" />
                
                <!-- Center of Mass -->
                <circle cx="0" cy="0" r="4" fill="#ffffff" />
            </g>

            <!-- Energy Packets (Floating Dots) -->
            <circle cx="0" cy="-40" r="5" fill="#FF3366" class="packet p1" filter="url(#shadow)" />
            <circle cx="0" cy="-40" r="5" fill="#FF3366" class="packet p2" filter="url(#shadow)" />
            <circle cx="0" cy="-40" r="5" fill="#FF3366" class="packet p3" filter="url(#shadow)" />
            <circle cx="0" cy="-40" r="5" fill="#FF3366" class="packet p4" filter="url(#shadow)" />
            <circle cx="0" cy="-40" r="5" fill="#FF3366" class="packet p5" filter="url(#shadow)" />
        </g>
    </g>

    <!-- ================= LABELS & SUMMARY ================= -->
    
    <!-- Monatomic Labels -->
    <text x="200" y="390" font-family="Inter" font-size="20" font-weight="700" text-anchor="middle" fill="#4361EE">Monatomic (f = 3)</text>
    <text x="200" y="415" font-family="Inter" font-size="14" font-weight="600" text-anchor="middle" fill="#6c757d">3 Translational</text>
    
    <!-- Monatomic Energy Dots Indicator -->
    <g transform="translate(200, 435)">
        <circle cx="-15" cy="0" r="4" fill="#FF3366" class="vec-x" />
        <circle cx="0" cy="0" r="4" fill="#FF3366" class="vec-y" />
        <circle cx="15" cy="0" r="4" fill="#FF3366" class="vec-z" />
    </g>

    <!-- Diatomic Labels -->
    <text x="600" y="390" font-family="Inter" font-size="20" font-weight="700" text-anchor="middle" fill="#4361EE">Diatomic (f = 5)</text>
    <text x="600" y="415" font-family="Inter" font-size="14" font-weight="600" text-anchor="middle" fill="#6c757d">3 Translational + 2 Rotational</text>
    
    <!-- Diatomic Energy Dots Indicator -->
    <g transform="translate(600, 435)">
        <circle cx="-30" cy="0" r="4" fill="#FF3366" class="vec-dia" />
        <circle cx="-15" cy="0" r="4" fill="#FF3366" class="vec-dia" />
        <circle cx="0" cy="0" r="4" fill="#FF3366" class="vec-dia" />
        <circle cx="15" cy="0" r="4" fill="#FF3366" class="arc-y" />
        <circle cx="30" cy="0" r="4" fill="#FF3366" class="arc-z" />
    </g>

    <!-- Equipartition Formula -->
    <g transform="translate(400, 475)" class="formula">
        <rect x="-100" y="-25" width="200" height="35" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" rx="8" />
        <text x="0" y="-2" font-family="Roboto Mono" font-size="18" font-weight="700" text-anchor="middle" class="highlight-text">
            U = (f/2) k<tspan baseline-shift="sub" font-size="12">B</tspan>T
        </text>
    </g>

</svg>

</body>
</html>
