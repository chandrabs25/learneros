<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampere's Circuital Law Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --wire-color: #212529;
            --current-color: #06D6A0;
            --loop-color: #4361EE;
            --b-field-color: #7209B7;
            --dl-color: #FF3366;
            --field-line-color: #B388FF;
            --anim-duration: 12s;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Play/Pause Control */
        #play-pause {
            display: none;
        }

        .control-btn {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: var(--wire-color);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            z-index: 10;
            user-select: none;
            transition: background 0.3s;
        }

        .control-btn:hover {
            background: #495057;
        }

        #play-pause:checked ~ .control-btn::after {
            content: "Pause Animation";
        }

        #play-pause:not(:checked) ~ .control-btn::after {
            content: "Play Animation";
        }

        /* Pause all animations when checkbox is unchecked */
        #play-pause:not(:checked) ~ svg * {
            animation-play-state: paused !important;
        }

        /* Typography */
        .title {
            font-size: 26px;
            font-weight: 700;
            fill: var(--wire-color);
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 22px;
            font-weight: 700;
        }

        .legend-text {
            font-size: 13px;
            fill: #495057;
        }

        .math-label {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-style: italic;
        }

        /* Animations */
        .current-arrow, .current-label {
            transform-origin: 435px 420px;
            animation: current-grow var(--anim-duration) linear infinite;
        }

        .field-line {
            transform-origin: 0px 0px;
            animation: field-fade var(--anim-duration) linear infinite;
        }

        .loop-mask-circle {
            transform-origin: 0px 0px;
            transform: scale(1, -1);
            animation: loop-draw var(--anim-duration) linear infinite;
        }

        .amperian-loop {
            animation: loop-fade var(--anim-duration) linear infinite;
        }

        .static-b {
            animation: static-b-fade var(--anim-duration) linear infinite;
        }

        .integration-trail {
            transform-origin: 0px 0px;
            transform: scale(1, -1);
            animation: trail-draw var(--anim-duration) linear infinite;
        }

        .rotating-vectors {
            transform-origin: 0px 0px;
            animation: vector-rotate var(--anim-duration) linear infinite;
        }

        .formula-left {
            animation: highlight-left var(--anim-duration) linear infinite;
        }

        .formula-right {
            animation: highlight-right var(--anim-duration) linear infinite;
        }

        /* Keyframes */
        @keyframes current-grow {
            0% { transform: scaleY(0); opacity: 0; }
            5% { opacity: 1; }
            16.6% { transform: scaleY(1); opacity: 1; }
            90% { transform: scaleY(1); opacity: 1; }
            95% { opacity: 0; transform: scaleY(1); }
            100% { opacity: 0; transform: scaleY(0); }
        }

        @keyframes field-fade {
            0%, 16.6% { opacity: 0; transform: scale(0.8); }
            33.3% { opacity: var(--max-op); transform: scale(1); }
            90% { opacity: var(--max-op); transform: scale(1); }
            95%, 100% { opacity: 0; transform: scale(1.05); }
        }

        @keyframes loop-draw {
            0%, 33.3% { stroke-dashoffset: 1131; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes loop-fade {
            0%, 33.3% { opacity: 0; }
            35%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes static-b-fade {
            0%, 33.3% { opacity: 0; }
            45%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes vector-rotate {
            0%, 50% { transform: rotate(0deg); opacity: 0; }
            51% { opacity: 1; }
            83.3% { transform: rotate(-360deg); opacity: 1; }
            85%, 100% { opacity: 0; transform: rotate(-360deg); }
        }

        @keyframes trail-draw {
            0%, 50% { stroke-dashoffset: 1131; opacity: 0; }
            51% { opacity: 0.8; }
            83.3% { stroke-dashoffset: 0; opacity: 0.8; }
            90% { opacity: 0.8; }
            95%, 100% { opacity: 0; }
        }

        @keyframes highlight-left {
            0%, 50% { fill: var(--wire-color); }
            52%, 83.3% { fill: var(--dl-color); text-shadow: 0 0 8px rgba(255,51,102,0.4); }
            85%, 100% { fill: var(--wire-color); text-shadow: none; }
        }

        @keyframes highlight-right {
            0%, 83.3% { fill: var(--wire-color); }
            85%, 95% { fill: var(--current-color); text-shadow: 0 0 8px rgba(6,214,160,0.4); }
            100% { fill: var(--wire-color); text-shadow: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <input type="checkbox" id="play-pause" checked>
    <label for="play-pause" class="control-btn"></label>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="wire-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#111" />
                <stop offset="30%" stop-color="#495057" />
                <stop offset="70%" stop-color="#343a40" />
                <stop offset="100%" stop-color="#111" />
            </linearGradient>

            <!-- Arrowhead Markers -->
            <marker id="arrow-current" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--current-color)" />
            </marker>
            <marker id="arrow-b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--b-field-color)" />
            </marker>
            <marker id="arrow-dl" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--dl-color)" />
            </marker>

            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feMerge>
                    <feMergeNode in="blur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Mask for drawing the dashed Amperian loop -->
            <mask id="loop-mask">
                <circle cx="0" cy="0" r="180" stroke="white" stroke-width="10" fill="none" class="loop-mask-circle" stroke-dasharray="1131" stroke-dashoffset="1131" />
            </mask>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="var(--bg-color)" />

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" class="title">Ampere's Circuital Law</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="170" height="125" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6" />
            <text x="15" y="25" font-weight="700" font-size="14" fill="#212529">Legend</text>
            
            <line x1="15" y1="45" x2="35" y2="45" stroke="var(--current-color)" stroke-width="3" marker-end="url(#arrow-current)" />
            <text x="45" y="49" class="legend-text">Current (I)</text>
            
            <line x1="15" y1="65" x2="35" y2="65" stroke="var(--b-field-color)" stroke-width="3" marker-end="url(#arrow-b)" />
            <text x="45" y="69" class="legend-text">Magnetic Field (B)</text>
            
            <line x1="15" y1="85" x2="35" y2="85" stroke="var(--loop-color)" stroke-width="2" stroke-dasharray="4 3" />
            <text x="45" y="89" class="legend-text">Amperian Loop</text>
            
            <line x1="15" y1="105" x2="35" y2="105" stroke="var(--dl-color)" stroke-width="3" marker-end="url(#arrow-dl)" />
            <text x="45" y="109" class="legend-text">Length Element (dl)</text>
        </g>

        <!-- Main Diagram -->
        <!-- Top half of the wire (Behind the loop) -->
        <rect x="385" y="60" width="30" height="190" fill="url(#wire-grad)" rx="2" />

        <!-- 3D Projected Group (Center at 400, 250) -->
        <g transform="translate(400, 250) scale(1, 0.4)">
            
            <!-- Concentric Magnetic Field Lines -->
            <circle cx="0" cy="0" r="100" stroke="var(--field-line-color)" stroke-width="4" fill="none" class="field-line" style="--max-op: 0.6;" />
            <circle cx="0" cy="0" r="180" stroke="var(--field-line-color)" stroke-width="2.5" fill="none" class="field-line" style="--max-op: 0.4;" />
            <circle cx="0" cy="0" r="260" stroke="var(--field-line-color)" stroke-width="1.5" fill="none" class="field-line" style="--max-op: 0.2;" />

            <!-- Amperian Loop (Dashed, revealed by mask) -->
            <circle cx="0" cy="0" r="180" stroke="var(--loop-color)" stroke-width="4" stroke-dasharray="12 8" fill="none" class="amperian-loop" mask="url(#loop-mask)" />

            <!-- Integration Trail (Glow effect following the vectors) -->
            <circle cx="0" cy="0" r="180" stroke="var(--dl-color)" stroke-width="6" fill="none" class="integration-trail" stroke-dasharray="1131" stroke-dashoffset="1131" filter="url(#glow)" />

            <!-- Static B Vectors on the Loop -->
            <g class="static-b">
                <!-- Top -->
                <line x1="0" y1="-180" x2="-60" y2="-180" stroke="var(--b-field-color)" stroke-width="4" marker-end="url(#arrow-b)" />
                <!-- Left -->
                <line x1="-180" y1="0" x2="-180" y2="60" stroke="var(--b-field-color)" stroke-width="4" marker-end="url(#arrow-b)" />
                <!-- Bottom -->
                <line x1="0" y1="180" x2="60" y2="180" stroke="var(--b-field-color)" stroke-width="4" marker-end="url(#arrow-b)" />
            </g>

            <!-- Rotating Vectors (dl and B) -->
            <g class="rotating-vectors">
                <!-- dl vector (tangent to circle at x=180, y=0) -->
                <line x1="180" y1="25" x2="180" y2="-25" stroke="var(--dl-color)" stroke-width="6" marker-end="url(#arrow-dl)" />
                <!-- B vector (parallel to dl, slightly offset outward) -->
                <line x1="195" y1="35" x2="195" y2="-45" stroke="var(--b-field-color)" stroke-width="5" marker-end="url(#arrow-b)" />
                
                <!-- Label for dl (rotates with the vector) -->
                <text x="150" y="5" font-family="Inter" font-size="20" font-weight="bold" font-style="italic" fill="var(--dl-color)" transform="rotate(90, 150, 5)">dl&#x20D7;</text>
            </g>
        </g>

        <!-- Bottom half of the wire (In front of the loop) -->
        <rect x="385" y="250" width="30" height="190" fill="url(#wire-grad)" rx="2" />

        <!-- Current Arrow (Placed alongside the wire to avoid 3D clipping issues) -->
        <line x1="435" y1="420" x2="435" y2="80" stroke="var(--current-color)" stroke-width="8" marker-end="url(#arrow-current)" class="current-arrow" />
        <text x="450" y="100" font-size="24" fill="var(--current-color)" class="math-label current-label">I</text>

        <!-- Static Labels (Outside 3D transform to prevent distortion) -->
        <!-- Label for Bottom Static B Vector -->
        <text x="445" y="340" font-size="20" fill="var(--b-field-color)" class="math-label static-b">B&#x20D7;</text>
        <!-- Label for Amperian Loop -->
        <text x="210" y="320" font-size="16" font-weight="600" fill="var(--loop-color)" class="amperian-loop">Amperian Loop</text>

        <!-- Formula at the Bottom -->
        <text x="400" y="475" text-anchor="middle" class="formula">
            <tspan class="formula-left">∮ B&#x20D7; · dl&#x20D7;</tspan> = <tspan class="formula-right">μ₀I</tspan>
        </text>

    </svg>
</div>

</body>
</html>
