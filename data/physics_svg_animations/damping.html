<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damped Simple Harmonic Motion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #f8f9fa;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .formula {
            font-family: 'Roboto Mono', monospace;
        }
        .label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
        }
        .title {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 700;
            fill: #212529;
        }
        .legend-text {
            font-size: 13px;
            fill: #495057;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Damped Simple Harmonic Motion</title>
        <desc>Animated diagram showing a mass-spring system losing energy due to damping, with a corresponding displacement-time graph.</desc>

        <defs>
            <!-- Arrowheads for Vectors -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>

            <!-- Fluid Gradient -->
            <linearGradient id="fluid-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#CAF0F8" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#90E0EF" stop-opacity="0.9"/>
            </linearGradient>

            <!-- Drop Shadow for Mass -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.2"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" class="title" text-anchor="middle">Damped Simple Harmonic Motion</text>

        <!-- ================= LEFT PANEL: PHYSICAL SYSTEM ================= -->
        
        <!-- Fluid Container -->
        <rect x="40" y="120" width="120" height="320" fill="url(#fluid-grad)" rx="8" />
        <path d="M 40 120 Q 70 115 100 120 T 160 120" stroke="#00B4D8" stroke-width="2" fill="none"/>
        <text x="100" y="425" class="label" fill="#0077B6" text-anchor="middle" font-size="12" opacity="0.7">Viscous Fluid</text>

        <!-- Ceiling -->
        <line x1="30" y1="60" x2="170" y2="60" stroke="#343A40" stroke-width="6" stroke-linecap="round"/>
        <!-- Ceiling hatch marks -->
        <path d="M 40 60 L 50 50 M 60 60 L 70 50 M 80 60 L 90 50 M 100 60 L 110 50 M 120 60 L 130 50 M 140 60 L 150 50 M 160 60 L 170 50" stroke="#343A40" stroke-width="2"/>

        <!-- Equilibrium Line -->
        <line x1="30" y1="250" x2="170" y2="250" stroke="#ADB5BD" stroke-width="1" stroke-dasharray="5,5"/>
        <text x="35" y="245" class="label" fill="#6C757D" font-size="11">x = 0</text>

        <!-- Dynamic Spring -->
        <path id="spring" stroke="#6C757D" stroke-width="3" fill="none" stroke-linejoin="round"/>

        <!-- Dynamic Mass -->
        <rect id="mass" x="80" y="230" width="40" height="40" fill="#6C757D" rx="6" filter="url(#shadow)"/>
        <text id="mass-label" x="100" y="255" class="label" fill="#ffffff" text-anchor="middle" font-weight="bold">m</text>

        <!-- Dynamic Vectors -->
        <!-- Restoring Force (Blue) -->
        <line id="vec-fs" x1="85" y1="250" x2="85" y2="250" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
        <!-- Velocity (Green) -->
        <line id="vec-v" x1="100" y1="250" x2="100" y2="250" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
        <!-- Damping Force (Red) -->
        <line id="vec-fd" x1="115" y1="250" x2="115" y2="250" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>

        <!-- Connector Line (Mass to Graph) -->
        <line id="connector" x1="120" y1="250" x2="350" y2="250" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="4,4"/>

        <!-- ================= RIGHT PANEL: GRAPH ================= -->
        
        <!-- Graph Grid & Axes -->
        <g stroke="#DEE2E6" stroke-width="1">
            <line x1="350" y1="150" x2="720" y2="150" />
            <line x1="350" y1="200" x2="720" y2="200" />
            <line x1="350" y1="300" x2="720" y2="300" />
            <line x1="350" y1="350" x2="720" y2="350" />
            <line x1="450" y1="130" x2="450" y2="370" />
            <line x1="550" y1="130" x2="550" y2="370" />
            <line x1="650" y1="130" x2="650" y2="370" />
        </g>

        <!-- X and Y Axes -->
        <line x1="350" y1="250" x2="730" y2="250" stroke="#343A40" stroke-width="2" marker-end="url(#arrow-blue)" style="marker-end: none;"/>
        <line x1="350" y1="120" x2="350" y2="380" stroke="#343A40" stroke-width="2"/>
        <path d="M 725 245 L 735 250 L 725 255 Z" fill="#343A40"/> <!-- X-axis arrow -->
        <path d="M 345 125 L 350 115 L 355 125 Z" fill="#343A40"/> <!-- Y-axis arrow -->

        <!-- Axis Labels -->
        <text x="740" y="254" class="label" font-weight="bold">t</text>
        <text x="335" y="115" class="label" font-weight="bold">x</text>
        <text x="325" y="155" class="label" font-size="12" fill="#6C757D">+A</text>
        <text x="325" y="355" class="label" font-size="12" fill="#6C757D">-A</text>

        <!-- Decay Envelopes (Calculated via JS) -->
        <path id="env-top" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
        <path id="env-bot" stroke="#ADB5BD" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
        
        <!-- Envelope Label -->
        <text x="580" y="135" class="formula" font-size="13" fill="#868E96">
            x = ±A e<tspan dy="-5" font-size="10">-(b/2m)t</tspan>
        </text>

        <!-- Dynamic Graph Path -->
        <path id="graph-path" stroke="#333333" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
        
        <!-- Tracker Dot -->
        <circle id="tracker" cx="350" cy="250" r="5" fill="#FF3366" filter="url(#shadow)"/>

        <!-- ================= ENERGY BAR ================= -->
        <text x="765" y="135" class="label" font-weight="bold" text-anchor="middle">Energy</text>
        <rect x="755" y="150" width="20" height="200" fill="none" stroke="#CED4DA" stroke-width="2" rx="3"/>
        <rect id="energy-bar" x="755" y="150" width="20" height="200" fill="#06D6A0" rx="2"/>
        <text x="765" y="365" class="label" font-size="11" fill="#6C757D" text-anchor="middle">Total</text>

        <!-- ================= LABELS & LEGEND ================= -->
        
        <!-- Equation -->
        <rect x="40" y="450" width="280" height="35" fill="#ffffff" stroke="#DEE2E6" rx="5"/>
        <text x="50" y="473" class="formula" font-size="15" fill="#212529">
            m d²x/dt² + b dx/dt + kx = 0
        </text>

        <!-- Legend -->
        <rect x="350" y="415" width="370" height="70" fill="#ffffff" stroke="#DEE2E6" rx="5"/>
        
        <line x1="365" y1="435" x2="385" y2="435" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
        <text x="400" y="440" class="legend-text">Velocity (<tspan class="formula" font-style="italic">v</tspan>)</text>

        <line x1="365" y1="465" x2="385" y2="465" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
        <text x="400" y="470" class="legend-text">Restoring Force (<tspan class="formula" font-style="italic">F<tspan dy="3" font-size="10">s</tspan></tspan>)</text>

        <line x1="550" y1="435" x2="570" y2="435" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
        <text x="585" y="440" class="legend-text">Damping Force (<tspan class="formula" font-style="italic">F<tspan dy="3" font-size="10">d</tspan></tspan>)</text>

    </svg>
</div>

<script>
    // Physics Constants
    const A0 = 100;               // Initial amplitude (pixels)
    const omega = Math.PI;        // Angular frequency (T = 2s)
    const gamma = 0.18;           // Damping coefficient (b/2m)
    const duration = 12;          // Loop duration in seconds
    const graphWidth = 370;       // Width of the graph area
    const graphStartX = 350;      // Starting X coordinate of graph
    const centerY = 250;          // Equilibrium Y coordinate

    // DOM Elements
    const spring = document.getElementById('spring');
    const mass = document.getElementById('mass');
    const massLabel = document.getElementById('mass-label');
    const vecV = document.getElementById('vec-v');
    const vecFs = document.getElementById('vec-fs');
    const vecFd = document.getElementById('vec-fd');
    const graphPath = document.getElementById('graph-path');
    const tracker = document.getElementById('tracker');
    const connector = document.getElementById('connector');
    const energyBar = document.getElementById('energy-bar');

    // Pre-calculate Envelopes
    let envTopD = `M ${graphStartX} ${centerY - A0} `;
    let envBotD = `M ${graphStartX} ${centerY + A0} `;
    for (let i = 0; i <= graphWidth; i += 5) {
        let t = (i / graphWidth) * duration;
        let envX = A0 * Math.exp(-gamma * t);
        envTopD += `L ${graphStartX + i} ${centerY - envX} `;
        envBotD += `L ${graphStartX + i} ${centerY + envX} `;
    }
    document.getElementById('env-top').setAttribute('d', envTopD);
    document.getElementById('env-bot').setAttribute('d', envBotD);

    // Initial Energy Calculation (for normalization)
    // E = 1/2 k x^2 + 1/2 m v^2. Let m=1, k=omega^2.
    const k = omega * omega;
    const initialV = A0 * (-gamma); // v at t=0
    const maxEnergy = 0.5 * k * (A0 * A0) + 0.5 * (initialV * initialV);

    // Animation State
    let startTime = null;
    let currentPathData = "";

    // Helper to draw the zig-zag spring
    function drawSpring(startY, endY) {
        const coils = 10;
        const deltaY = (endY - startY) / coils;
        let d = `M 100 ${startY} `;
        for (let i = 1; i < coils; i++) {
            let xOffset = (i % 2 === 0) ? 85 : 115;
            d += `L ${xOffset} ${startY + i * deltaY} `;
        }
        d += `L 100 ${endY}`;
        spring.setAttribute('d', d);
    }

    // Helper to update vector arrows
    function updateVector(elem, baseX, baseY, value, scale) {
        let length = value * scale;
        if (Math.abs(length) < 3) {
            elem.setAttribute('opacity', '0'); // Hide if too small
        } else {
            elem.setAttribute('opacity', '1');
            elem.setAttribute('y1', baseY);
            elem.setAttribute('y2', baseY + length);
        }
    }

    // Main Animation Loop
    function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        let elapsed = (timestamp - startTime) / 1000;

        // Reset loop
        if (elapsed > duration) {
            startTime = timestamp;
            elapsed = 0;
            currentPathData = "";
        }

        let t = elapsed;
        
        // Physics Equations
        let expFactor = Math.exp(-gamma * t);
        let x = A0 * expFactor * Math.cos(omega * t);
        let v = A0 * expFactor * (-omega * Math.sin(omega * t) - gamma * Math.cos(omega * t));
        
        // Forces (proportional for visualization)
        let Fs = -x; // Restoring force opposes displacement
        let Fd = -v; // Damping force opposes velocity

        // Update Mass Position
        let massY = centerY + x;
        mass.setAttribute('y', massY - 20);
        massLabel.setAttribute('y', massY + 5);

        // Update Spring
        drawSpring(60, massY - 20);

        // Update Vectors
        // Scales chosen to fit nicely within the visual bounds
        updateVector(vecV, 100, massY, v, 0.18);    // Velocity (Green)
        updateVector(vecFs, 85, massY, Fs, 0.8);    // Restoring Force (Blue)
        updateVector(vecFd, 115, massY, Fd, 0.25);  // Damping Force (Red)

        // Update Graph
        let graphX = graphStartX + (t / duration) * graphWidth;
        let graphY = centerY + x;
        
        if (currentPathData === "") {
            currentPathData = `M ${graphX} ${graphY}`;
        } else {
            currentPathData += ` L ${graphX} ${graphY}`;
        }
        graphPath.setAttribute('d', currentPathData);
        
        // Update Tracker & Connector
        tracker.setAttribute('cx', graphX);
        tracker.setAttribute('cy', graphY);
        connector.setAttribute('y1', massY);
        connector.setAttribute('y2', massY);
        connector.setAttribute('x2', graphX);

        // Update Energy Bar
        let currentEnergy = 0.5 * k * (x * x) + 0.5 * (v * v);
        let energyRatio = Math.max(0, currentEnergy / maxEnergy);
        let barHeight = 200 * energyRatio;
        energyBar.setAttribute('height', barHeight);
        energyBar.setAttribute('y', 150 + (200 - barHeight));

        // Color shift energy bar based on level
        if (energyRatio > 0.5) {
            energyBar.setAttribute('fill', '#06D6A0'); // Green
        } else if (energyRatio > 0.2) {
            energyBar.setAttribute('fill', '#FFD166'); // Yellow
        } else {
            energyBar.setAttribute('fill', '#FF3366'); // Red
        }

        requestAnimationFrame(animate);
    }

    // Start Animation
    requestAnimationFrame(animate);

</script>
</body>
</html>
