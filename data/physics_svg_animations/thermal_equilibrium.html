<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Equilibrium & The Zeroth Law</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        #diagram-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            border-radius: 16px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
        }

        @keyframes flow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        .heat-arrow {
            stroke-dasharray: 12 12;
            animation: flow 0.6s linear infinite;
        }

        .gauge-bg {
            fill: #e9ecef;
            rx: 8px;
        }
        
        .chamber-border {
            fill: none;
            stroke: #343a40;
            stroke-width: 4;
            rx: 4px;
        }
    </style>
</head>
<body>

<div id="diagram-container">
    <svg viewBox="0 0 800 500" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Thermal Equilibrium & The Zeroth Law</title>
        <desc id="svg-desc">Animated diagram showing two gas chambers reaching thermal equilibrium as particles exchange kinetic energy.</desc>

        <defs>
            <!-- Arrowhead for heat flow -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
            
            <!-- Glow effect for diathermic wall -->
            <filter id="glow" x="-50%" y="-20%" width="200%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComponentTransfer in="blur" result="glow">
                    <feFuncA type="linear" slope="1.5"/>
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode in="glow"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- Titles and Labels -->
        <text x="400" y="40" text-anchor="middle" font-weight="700" font-size="24" fill="#212529">Thermal Equilibrium &amp; The Zeroth Law</text>
        
        <text x="250" y="85" text-anchor="middle" font-weight="600" font-size="18" fill="#FF3366">System A</text>
        <text x="550" y="85" text-anchor="middle" font-weight="600" font-size="18" fill="#4361EE">System B</text>

        <!-- Chamber Backgrounds -->
        <rect id="bgA" x="100" y="100" width="300" height="300" fill="#ffccd5" />
        <rect id="bgB" x="400" y="100" width="300" height="300" fill="#d1e9ff" />

        <!-- Particles Groups -->
        <g id="particlesA"></g>
        <g id="particlesB"></g>

        <!-- Chamber Borders -->
        <rect class="chamber-border" x="100" y="100" width="600" height="300" />

        <!-- The Boundary Wall -->
        <line id="wallSolid" x1="400" y1="100" x2="400" y2="400" stroke="#6c757d" stroke-width="6" />
        <line id="wallDashed" x1="400" y1="100" x2="400" y2="400" stroke="#06D6A0" stroke-width="6" stroke-dasharray="10 10" filter="url(#glow)" opacity="0" />

        <!-- Heat Flow Vectors -->
        <g id="heatArrowsGroup" opacity="0">
            <!-- Background glow for visibility -->
            <rect x="330" y="210" width="140" height="30" fill="#ffffff" opacity="0.8" rx="4"/>
            <text x="400" y="232" text-anchor="middle" font-weight="700" font-size="18" fill="#F77F00">Heat Flow (Q)</text>
            
            <path class="heat-arrow" d="M 320 150 L 460 150" stroke="#F77F00" stroke-width="6" fill="none" marker-end="url(#arrowhead)"/>
            <path class="heat-arrow" d="M 320 270 L 460 270" stroke="#F77F00" stroke-width="6" fill="none" marker-end="url(#arrowhead)"/>
            <path class="heat-arrow" d="M 320 350 L 460 350" stroke="#F77F00" stroke-width="6" fill="none" marker-end="url(#arrowhead)"/>
        </g>

        <!-- Temperature Gauge A -->
        <text x="50" y="85" text-anchor="middle" font-weight="600" font-size="16" fill="#333">T_A</text>
        <rect class="gauge-bg" x="42" y="100" width="16" height="200" />
        <rect id="gaugeFillA" x="42" y="100" width="16" height="200" fill="#FF3366" rx="8" />
        <text id="labelA" x="50" y="325" text-anchor="middle" class="mono" font-weight="700" font-size="16" fill="#FF3366">500 K</text>

        <!-- Temperature Gauge B -->
        <text x="750" y="85" text-anchor="middle" font-weight="600" font-size="16" fill="#333">T_B</text>
        <rect class="gauge-bg" x="742" y="100" width="16" height="200" />
        <rect id="gaugeFillB" x="742" y="200" width="16" height="100" fill="#4361EE" rx="8" />
        <text id="labelB" x="750" y="325" text-anchor="middle" class="mono" font-weight="700" font-size="16" fill="#4361EE">300 K</text>

        <!-- Equilibrium Equation Overlay -->
        <g id="eqGroup" opacity="0">
            <rect x="250" y="425" width="300" height="46" fill="#f8f9fa" rx="8" stroke="#8338EC" stroke-width="2" />
            <text x="400" y="455" text-anchor="middle" class="mono" font-weight="700" font-size="20" fill="#8338EC">Q_net = 0 &rArr; T_A = T_B</text>
        </g>

        <!-- Legend -->
        <g transform="translate(100, 435)">
            <circle cx="10" cy="-5" r="5" fill="#FF3366"/>
            <text x="22" y="0" font-size="13" fill="#555">Hot Particles</text>
            <circle cx="120" cy="-5" r="5" fill="#4361EE"/>
            <text x="132" y="0" font-size="13" fill="#555">Cold Particles</text>
        </g>

    </svg>
</div>

<script>
    const numParticles = 20;
    const radius = 4;
    const pA = [];
    const pB = [];
    
    const particlesAGroup = document.getElementById('particlesA');
    const particlesBGroup = document.getElementById('particlesB');

    // Initialize particles with random positions and normalized direction vectors
    function initParticles(group, array, color, minX, maxX) {
        for(let i = 0; i < numParticles; i++) {
            let circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", radius);
            circle.setAttribute("fill", color);
            group.appendChild(circle);
            
            let angle = Math.random() * 2 * Math.PI;
            array.push({
                el: circle,
                x: minX + radius + Math.random() * (maxX - minX - 2 * radius),
                y: 100 + radius + Math.random() * (300 - 2 * radius),
                dx: Math.cos(angle),
                dy: Math.sin(angle)
            });
        }
    }

    initParticles(particlesAGroup, pA, "#FF3366", 100, 400);
    initParticles(particlesBGroup, pB, "#4361EE", 400, 700);

    // Color interpolation utilities
    function hexToRgb(hex) {
        let bigint = parseInt(hex.slice(1), 16);
        return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
    }

    function rgbToHex(r, g, b) {
        return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1);
    }

    function lerpColor(c1, c2, t) {
        let rgb1 = hexToRgb(c1);
        let rgb2 = hexToRgb(c2);
        let r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * t);
        let g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * t);
        let b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * t);
        return rgbToHex(r, g, b);
    }

    const bgA_start = "#ffccd5";
    const bgB_start = "#d1e9ff";
    const bg_end = "#e2e2e2";

    // Animation Loop Variables
    let startTimestamp = null;
    const LOOP_DURATION = 15000; // 15 seconds loop

    function update(timestamp) {
        if (!startTimestamp) startTimestamp = timestamp;
        let elapsed = timestamp - startTimestamp;
        let t = elapsed % LOOP_DURATION;
        
        // Phase determination and interpolation factor
        // 0-3s: Isolation (factor = 0)
        // 3-5s: Contact, no temp change yet (factor = 0)
        // 5-12s: Energy Transfer (factor 0 -> 1)
        // 12-15s: Equilibrium (factor = 1)
        let factor = 0;
        if (t >= 5000 && t < 12000) {
            let progress = (t - 5000) / 7000;
            // Smoothstep for natural easing
            factor = progress * progress * (3 - 2 * progress);
        } else if (t >= 12000) {
            factor = 1;
        }

        // Calculate Macroscopic Temperatures
        let TA = 500 - 100 * factor;
        let TB = 300 + 100 * factor;

        // Update Background Colors
        document.getElementById('bgA').setAttribute('fill', lerpColor(bgA_start, bg_end, factor));
        document.getElementById('bgB').setAttribute('fill', lerpColor(bgB_start, bg_end, factor));

        // Update Temperature Gauges (Mapping 200K-600K to 0-200px height)
        let hA = (TA - 200) / 2;
        document.getElementById('gaugeFillA').setAttribute('height', hA);
        document.getElementById('gaugeFillA').setAttribute('y', 100 + (200 - hA));
        document.getElementById('labelA').textContent = Math.round(TA) + " K";

        let hB = (TB - 200) / 2;
        document.getElementById('gaugeFillB').setAttribute('height', hB);
        document.getElementById('gaugeFillB').setAttribute('y', 100 + (200 - hB));
        document.getElementById('labelB').textContent = Math.round(TB) + " K";

        // Update Wall, Arrows, and Equation Opacities based on timeline
        let wallSolid = document.getElementById('wallSolid');
        let wallDashed = document.getElementById('wallDashed');
        let arrows = document.getElementById('heatArrowsGroup');
        let eqGroup = document.getElementById('eqGroup');

        // Wall state
        if (t < 3000) {
            wallSolid.setAttribute('opacity', 1);
            wallDashed.setAttribute('opacity', 0);
        } else {
            wallSolid.setAttribute('opacity', 0);
            wallDashed.setAttribute('opacity', 1);
        }

        // Arrows state
        let arrowOp = 0;
        if (t >= 3000 && t < 4000) {
            arrowOp = (t - 3000) / 1000; // Fade in
        } else if (t >= 4000 && t < 11000) {
            arrowOp = 1; // Full visibility
        } else if (t >= 11000 && t < 12000) {
            arrowOp = 1 - (t - 11000) / 1000; // Fade out
        }
        arrows.setAttribute('opacity', arrowOp);

        // Equation state
        let eqOp = 0;
        if (t >= 12000 && t < 12500) {
            eqOp = (t - 12000) / 500; // Fade in
        } else if (t >= 12500) {
            eqOp = 1;
        }
        eqGroup.setAttribute('opacity', eqOp);

        // Physics: v_rms is proportional to sqrt(T)
        // Base multiplier chosen for visual clarity at 60fps
        let vA = 0.22 * Math.sqrt(TA);
        let vB = 0.22 * Math.sqrt(TB);

        // Move Particles
        function moveParticles(pArray, minX, maxX, v) {
            for(let i = 0; i < numParticles; i++) {
                let p = pArray[i];
                p.x += p.dx * v;
                p.y += p.dy * v;
                
                // Wall collisions
                if (p.x <= minX + radius) { p.x = minX + radius; p.dx *= -1; }
                if (p.x >= maxX - radius) { p.x = maxX - radius; p.dx *= -1; }
                if (p.y <= 100 + radius) { p.y = 100 + radius; p.dy *= -1; }
                if (p.y >= 400 - radius) { p.y = 400 - radius; p.dy *= -1; }
                
                p.el.setAttribute('cx', p.x);
                p.el.setAttribute('cy', p.y);
            }
        }

        moveParticles(pA, 100, 400, vA);
        moveParticles(pB, 400, 700, vB);

        requestAnimationFrame(update);
    }

    // Start animation loop
    requestAnimationFrame(update);
</script>

</body>
</html>
