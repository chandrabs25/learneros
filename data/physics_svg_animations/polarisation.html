<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Polarisation & Malus's Law</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #212529;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animation for Wave Propagation */
        .wave-group {
            animation: moveWave 2s linear infinite;
        }

        @keyframes moveWave {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(0px); }
        }

        /* Typography inside SVG */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #6C757D; }
        .label { font-size: 13px; font-weight: 600; fill: #495057; text-anchor: middle; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 700; }
        .math-large { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; }
        
        .color-orange { fill: #F77F00; }
        .color-blue { fill: #4361EE; }
        .color-red { fill: #FF3366; }

        /* UI Panel */
        .ui-panel {
            fill: #f8f9fa;
            stroke: #DEE2E6;
            stroke-width: 1;
            rx: 8;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <title>Linear Polarisation of Light and Malus's Law</title>
        <desc>An interactive 3D optical bench showing unpolarized light passing through a fixed polarizer, then a rotating analyzer, demonstrating Malus's Law.</desc>

        <!-- Definitions -->
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ADB5BD" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>

            <!-- Clip Paths for Wave Regions -->
            <clipPath id="clip-unpol">
                <rect x="50" y="100" width="300" height="500" />
            </clipPath>
            <clipPath id="clip-pol">
                <rect x="350" y="100" width="300" height="500" />
            </clipPath>
            <clipPath id="clip-trans">
                <rect x="650" y="100" width="300" height="500" />
            </clipPath>
        </defs>

        <!-- Header Texts -->
        <text x="500" y="40" class="title" text-anchor="middle">Linear Polarisation & Malus's Law</text>
        <text x="500" y="65" class="subtitle" text-anchor="middle">Observe how the rotating Analyzer modulates the amplitude and intensity of the transmitted light.</text>

        <!-- Dynamic UI Panel (Top Left) -->
        <rect x="40" y="80" width="220" height="90" class="ui-panel" />
        <text x="55" y="105" class="label" text-anchor="start">Malus's Law:</text>
        <text x="55" y="130" class="math-large color-orange" text-anchor="start">I = I₀ cos²(θ)</text>
        <text x="55" y="155" class="math color-blue" text-anchor="start" id="text-theta">θ = 0°</text>
        <text x="140" y="155" class="math color-orange" text-anchor="start" id="text-intensity">I = 100.0%</text>
        <text x="55" y="155" class="math color-red" text-anchor="start" id="text-extinction" opacity="0" style="font-size: 13px; transform: translateY(20px);">Extinction!</text>

        <!-- Vector Diagram (Top Right) -->
        <g transform="translate(850, 130)">
            <rect x="-80" y="-80" width="160" height="160" class="ui-panel" />
            <text x="0" y="-60" class="label">Vector Projection</text>
            
            <!-- Axes -->
            <line x1="-50" y1="0" x2="50" y2="0" stroke="#E9ECEF" stroke-width="1" />
            <line x1="0" y1="-50" x2="0" y2="50" stroke="#E9ECEF" stroke-width="1" />
            <circle cx="0" cy="0" r="45" stroke="#DEE2E6" stroke-width="1" fill="none" stroke-dasharray="2,2" />
            
            <!-- Analyzer Axis -->
            <line id="vd-axis" x1="0" y1="45" x2="0" y2="-45" stroke="#4361EE" stroke-width="2" stroke-dasharray="4,4" />
            
            <!-- Projection Line (Dotted) -->
            <line id="vd-proj" x1="0" y1="-45" x2="0" y2="-45" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="2,2" />
            
            <!-- E_in Vector -->
            <line x1="0" y1="0" x2="0" y2="-45" stroke="#ADB5BD" stroke-width="3" marker-end="url(#arrow-grey)" />
            
            <!-- E_out Vector -->
            <line id="vd-eout" x1="0" y1="0" x2="0" y2="-45" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)" />
            
            <!-- Labels -->
            <text x="-10" y="-50" class="math" fill="#ADB5BD" font-size="12px">E₀</text>
            <text id="vd-label-eout" x="10" y="-20" class="math" fill="#F77F00" font-size="12px">E</text>
        </g>

        <!-- Optical Bench Background -->
        <line x1="50" y1="350" x2="950" y2="350" stroke="#6C757D" stroke-width="1" stroke-dasharray="5,5" />
        
        <!-- Component Stands -->
        <line x1="350" y1="478" x2="350" y2="520" stroke="#CED4DA" stroke-width="6" stroke-linecap="round" />
        <line x1="650" y1="478" x2="650" y2="520" stroke="#CED4DA" stroke-width="6" stroke-linecap="round" />
        <line x1="50" y1="520" x2="950" y2="520" stroke="#DEE2E6" stroke-width="4" stroke-linecap="round" />

        <!-- Component Labels -->
        <text x="200" y="550" class="label">Unpolarized Light</text>
        <text x="350" y="550" class="label color-blue">Polarizer (Fixed)</text>
        <text x="500" y="550" class="label color-orange">Linearly Polarized</text>
        <text x="650" y="550" class="label color-blue">Analyzer (Rotating)</text>
        <text x="800" y="550" class="label color-orange">Transmitted Light</text>

        <!-- WAVES AND POLARIZERS -->

        <!-- 1. Unpolarized Light -->
        <g clip-path="url(#clip-unpol)">
            <g id="unpol-waves" class="wave-group">
                <!-- Paths injected via JS -->
            </g>
        </g>

        <!-- 2. Fixed Polarizer -->
        <g id="polarizer-fixed">
            <polygon id="pol-poly" points="" fill="#4361EE" fill-opacity="0.15" stroke="#4361EE" stroke-width="2" stroke-linejoin="round" />
            <line id="pol-axis" x1="0" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5" />
        </g>

        <!-- 3. Polarized Light -->
        <g clip-path="url(#clip-pol)">
            <g id="pol-wave" class="wave-group">
                <!-- Path injected via JS -->
            </g>
        </g>

        <!-- 4. Rotating Analyzer -->
        <g id="analyzer-rotating">
            <polygon id="analyzer-poly" points="" fill="#4361EE" fill-opacity="0.15" stroke="#4361EE" stroke-width="2" stroke-linejoin="round" />
            <line id="analyzer-axis" x1="0" y1="0" x2="0" y2="0" stroke="#ffffff" stroke-width="2" stroke-dasharray="5,5" />
            <!-- Angle Indicator Arc -->
            <path id="analyzer-arc" d="" fill="none" stroke="#FF3366" stroke-width="2" stroke-dasharray="3,3" opacity="0.7"/>
        </g>

        <!-- 5. Transmitted Light -->
        <g clip-path="url(#clip-trans)">
            <g class="wave-group">
                <path id="trans-wave-path" d="" fill="none" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
            </g>
        </g>

    </svg>
</div>

<script>
    /**
     * Physics & SVG Math Configuration
     */
    const A = 60;          // Wave Amplitude
    const lambda = 100;    // Wavelength
    const k = 2 * Math.PI / lambda; // Wave number
    const y0 = 350;        // Optical axis Y coordinate
    const projFactor = 0.4; // Oblique projection depth factor

    // Oblique projection function: maps 3D (x, y, z) to 2D screen (X, Y)
    // x: propagation axis, y: vertical axis, z: depth axis
    function project(x, y, z) {
        return {
            X: x + z * projFactor,
            Y: y0 - y - z * projFactor
        };
    }

    // Generates a static SVG path string for a sine wave
    function generateWavePath(startX, endX, amp, angleRad) {
        let d = `M `;
        // Generate extra length to allow for CSS translation (-100 to +100)
        for (let x = startX - lambda; x <= endX + lambda; x += 2) {
            let y = amp * Math.cos(angleRad) * Math.sin(k * x);
            let z = amp * Math.sin(angleRad) * Math.sin(k * x);
            let p = project(x, y, z);
            d += `${p.X},${p.Y} `;
        }
        return d;
    }

    // Create a wave DOM element
    function createWaveElement(d, color, opacity, strokeWidth) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", color);
        path.setAttribute("stroke-width", strokeWidth);
        path.setAttribute("opacity", opacity);
        path.setAttribute("stroke-linecap", "round");
        path.setAttribute("stroke-linejoin", "round");
        return path;
    }

    // Draw Polarizer Polygon (3D Parallelogram)
    function updatePolarizerShape(polyId, axisId, xc, thetaRad) {
        const uMax = 100; // Half-height along transmission axis
        const vMax = 70;  // Half-width perpendicular to axis

        const corners = [
            {u: uMax, v: vMax},
            {u: uMax, v: -vMax},
            {u: -uMax, v: -vMax},
            {u: -uMax, v: vMax}
        ];

        let points = "";
        corners.forEach(c => {
            let y = c.u * Math.cos(thetaRad) - c.v * Math.sin(thetaRad);
            let z = c.u * Math.sin(thetaRad) + c.v * Math.cos(thetaRad);
            let p = project(xc, y, z);
            points += `${p.X},${p.Y} `;
        });
        document.getElementById(polyId).setAttribute('points', points.trim());

        // Transmission axis line
        let y1 = uMax * Math.cos(thetaRad);
        let z1 = uMax * Math.sin(thetaRad);
        let p1 = project(xc, y1, z1);
        
        let y2 = -uMax * Math.cos(thetaRad);
        let z2 = -uMax * Math.sin(thetaRad);
        let p2 = project(xc, y2, z2);

        const axis = document.getElementById(axisId);
        axis.setAttribute('x1', p1.X);
        axis.setAttribute('y1', p1.Y);
        axis.setAttribute('x2', p2.X);
        axis.setAttribute('y2', p2.Y);
    }

    /**
     * Initialization (Static Elements)
     */
    function init() {
        // 1. Unpolarized Waves (4 overlapping waves at different angles)
        const unpolGroup = document.getElementById('unpol-waves');
        const angles = [0, 45, 90, 135];
        angles.forEach(deg => {
            let rad = deg * Math.PI / 180;
            let d = generateWavePath(50, 350, A, rad);
            unpolGroup.appendChild(createWaveElement(d, "#ADB5BD", 0.5, 2));
        });

        // 2. Fixed Polarizer (Vertical, theta = 0)
        updatePolarizerShape('pol-poly', 'pol-axis', 350, 0);

        // 3. Polarized Wave (Vertical, theta = 0)
        const polGroup = document.getElementById('pol-wave');
        let dPol = generateWavePath(350, 650, A, 0);
        polGroup.appendChild(createWaveElement(dPol, "#F77F00", 1.0, 3));
    }

    /**
     * Main Animation Loop (Dynamic Elements)
     */
    const startTime = Date.now();
    const cycleDuration = 12000; // 12 seconds per 360 degree rotation

    function animate() {
        let t = Date.now() - startTime;
        let thetaDeg = (t / cycleDuration) * 360;
        let thetaRad = thetaDeg * Math.PI / 180;

        // 1. Update Analyzer Shape
        updatePolarizerShape('analyzer-poly', 'analyzer-axis', 650, thetaRad);

        // 2. Update Transmitted Wave (Malus's Law: Amplitude = A * cos(theta))
        // The wave oscillates in the plane of the analyzer (thetaRad)
        const ampTrans = A * Math.cos(thetaRad);
        let dTrans = generateWavePath(650, 950, ampTrans, thetaRad);
        const transPath = document.getElementById('trans-wave-path');
        transPath.setAttribute('d', dTrans);
        
        // Adjust opacity based on intensity for visual emphasis
        const intensity = Math.pow(Math.cos(thetaRad), 2);
        transPath.setAttribute('opacity', 0.1 + 0.9 * intensity);

        // 3. Update Vector Diagram
        updateVectorDiagram(thetaRad, intensity);

        // 4. Update UI Text
        updateUI(thetaDeg, intensity);

        requestAnimationFrame(animate);
    }

    function updateVectorDiagram(thetaRad, intensity) {
        const cx = 0; // Relative to <g> transform
        const cy = 0;
        const R = 45;

        // Analyzer Axis Line
        const axX = cx + R * Math.sin(thetaRad);
        const axY = cy - R * Math.cos(thetaRad);
        const axX2 = cx - R * Math.sin(thetaRad);
        const axY2 = cy + R * Math.cos(thetaRad);
        
        const axisLine = document.getElementById('vd-axis');
        axisLine.setAttribute('x1', axX2);
        axisLine.setAttribute('y1', axY2);
        axisLine.setAttribute('x2', axX);
        axisLine.setAttribute('y2', axY);

        // E_out Vector (Projection of vertical E_in onto Analyzer Axis)
        const eOutMag = R * Math.cos(thetaRad);
        const eOutX = cx + eOutMag * Math.sin(thetaRad);
        const eOutY = cy - eOutMag * Math.cos(thetaRad);
        
        const eOutLine = document.getElementById('vd-eout');
        eOutLine.setAttribute('x2', eOutX);
        eOutLine.setAttribute('y2', eOutY);

        // Projection Dotted Line (from tip of E_in to tip of E_out)
        const projLine = document.getElementById('vd-proj');
        projLine.setAttribute('x1', cx);
        projLine.setAttribute('y1', cy - R); // Tip of E_in
        projLine.setAttribute('x2', eOutX);
        projLine.setAttribute('y2', eOutY);
        
        // Hide arrowhead if magnitude is near zero
        if (Math.abs(eOutMag) < 3) {
            eOutLine.setAttribute('marker-end', '');
            projLine.setAttribute('opacity', '0');
        } else {
            eOutLine.setAttribute('marker-end', 'url(#arrow-orange)');
            projLine.setAttribute('opacity', '1');
        }

        // Move E_out label
        const labelEout = document.getElementById('vd-label-eout');
        labelEout.setAttribute('x', eOutX + 10);
        labelEout.setAttribute('y', eOutY + 10);
    }

    function updateUI(thetaDeg, intensity) {
        let displayDeg = Math.round(thetaDeg % 360);
        const pct = (intensity * 100).toFixed(1);

        document.getElementById('text-theta').textContent = `θ = ${displayDeg.toString().padStart(3, '0')}°`;
        document.getElementById('text-intensity').textContent = `I = ${pct.padStart(5, '0')}% I₀`;

        const extinctionText = document.getElementById('text-extinction');
        if (intensity < 0.005) {
            extinctionText.setAttribute('opacity', '1');
        } else {
            extinctionText.setAttribute('opacity', '0');
        }
    }

    // Start
    init();
    requestAnimationFrame(animate);

</script>
</body>
</html>
