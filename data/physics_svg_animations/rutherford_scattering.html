<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rutherford Scattering Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #111; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #555; }
        .label { font-size: 14px; font-weight: 600; fill: #333; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 14px; }
        .math-large { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 500; fill: #333; }
        
        /* Legend */
        .legend-text { font-size: 13px; fill: #444; }

        /* Animations */
        .particle-wrapper {
            animation: moveParticle 6s infinite;
        }

        .vel-vector {
            animation: scaleVel 6s infinite;
            transform-origin: left center;
        }

        /* 
         * Easing simulates 1/r^2 force: 
         * Decelerates as it approaches the nucleus (0% -> 50%)
         * Accelerates as it leaves (50% -> 100%)
         */
        @keyframes moveParticle {
            0% { 
                offset-distance: 0%; 
                animation-timing-function: cubic-bezier(0.4, 0, 1, 1); 
            }
            50% { 
                offset-distance: 50%; 
                animation-timing-function: cubic-bezier(0, 0, 0.2, 1); 
            }
            100% { 
                offset-distance: 100%; 
            }
        }

        @keyframes scaleVel {
            0% { transform: scaleX(1.2); }
            50% { transform: scaleX(0.15); }
            100% { transform: scaleX(1.2); }
        }

        /* Force Vector Animations (Rotation and 1/r^2 Scale) */
        .force-vector {
            transform-origin: left center;
        }

        /* Path 1: Central (b=0) */
        .force-wrapper-1 { animation: moveParticle 6s infinite; offset-rotate: 0deg; }
        .force-vector-1 { animation: forceAnim1 6s infinite; }
        @keyframes forceAnim1 {
            0% { transform: rotate(180deg) scaleX(0.1); }
            50% { transform: rotate(180deg) scaleX(1.5); }
            100% { transform: rotate(180deg) scaleX(0.1); }
        }

        /* Path 2: Top Near Miss (b=40) */
        .force-wrapper-2 { animation: moveParticle 6s infinite; offset-rotate: 0deg; }
        .force-vector-2 { animation: forceAnim2 6s infinite; }
        @keyframes forceAnim2 {
            0% { transform: rotate(185deg) scaleX(0.1); }
            50% { transform: rotate(215deg) scaleX(1.2); }
            100% { transform: rotate(258deg) scaleX(0.1); }
        }

        /* Path 3: Top Distant (b=100) */
        .force-wrapper-3 { animation: moveParticle 6s infinite; offset-rotate: 0deg; }
        .force-vector-3 { animation: forceAnim3 6s infinite; }
        @keyframes forceAnim3 {
            0% { transform: rotate(192deg) scaleX(0.05); }
            50% { transform: rotate(265deg) scaleX(0.4); }
            100% { transform: rotate(330deg) scaleX(0.05); }
        }

        /* Path 4: Bottom Near Miss (b=-60) */
        .force-wrapper-4 { animation: moveParticle 6s infinite; offset-rotate: 0deg; }
        .force-vector-4 { animation: forceAnim4 6s infinite; }
        @keyframes forceAnim4 {
            0% { transform: rotate(172deg) scaleX(0.1); }
            50% { transform: rotate(133deg) scaleX(1.0); }
            100% { transform: rotate(78deg) scaleX(0.1); }
        }

        /* Path 5: Bottom Distant (b=-120) */
        .force-wrapper-5 { animation: moveParticle 6s infinite; offset-rotate: 0deg; }
        .force-vector-5 { animation: forceAnim5 6s infinite; }
        @keyframes forceAnim5 {
            0% { transform: rotate(165deg) scaleX(0.05); }
            50% { transform: rotate(93deg) scaleX(0.3); }
            100% { transform: rotate(29deg) scaleX(0.05); }
        }

        /* Glow animation for nucleus */
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.6)); }
            50% { filter: drop-shadow(0 0 16px rgba(255, 215, 0, 0.9)); }
        }
        .nucleus {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid meet">
        <defs>
            <!-- Nucleus Gradient -->
            <radialGradient id="goldGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFF59D" />
                <stop offset="50%" stop-color="#FFD700" />
                <stop offset="100%" stop-color="#F57F17" />
            </radialGradient>

            <!-- Particle Gradient -->
            <radialGradient id="alphaGradient" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF8A9F" />
                <stop offset="100%" stop-color="#FF3366" />
            </radialGradient>

            <!-- Arrowheads -->
            <marker id="arrowVel" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrowForce" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#4361EE" />
            </marker>
            <marker id="arrowDimStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#4361EE" />
            </marker>

            <!-- Trajectory Paths -->
            <path id="path1" d="M 50 300 L 400 300 L 50 300" />
            <path id="path2" d="M 50 260 Q 480 260, 450 50" />
            <path id="path3" d="M 50 200 Q 480 200, 950 50" />
            <path id="path4" d="M 50 360 Q 480 360, 550 550" />
            <path id="path5" d="M 50 420 Q 480 420, 950 550" />
        </defs>

        <!-- Background Grid (Subtle) -->
        <g stroke="#e9ecef" stroke-width="1">
            <line x1="0" y1="100" x2="1000" y2="100" />
            <line x1="0" y1="200" x2="1000" y2="200" />
            <line x1="0" y1="300" x2="1000" y2="300" />
            <line x1="0" y1="400" x2="1000" y2="400" />
            <line x1="0" y1="500" x2="1000" y2="500" />
            <line x1="250" y1="0" x2="250" y2="600" />
            <line x1="500" y1="0" x2="500" y2="600" />
            <line x1="750" y1="0" x2="750" y2="600" />
        </g>

        <!-- Header Texts -->
        <text x="30" y="45" class="title">Rutherford Scattering: The Nuclear Atom</text>
        <text x="30" y="70" class="subtitle">Alpha particles (He²⁺) deflected by the concentrated positive charge of a Gold nucleus.</text>

        <!-- Trajectory Traces (Static Dashed Lines) -->
        <g fill="none" stroke="#ced4da" stroke-width="2" stroke-dasharray="6 6">
            <use href="#path1" />
            <use href="#path2" />
            <use href="#path3" />
            <use href="#path4" />
            <use href="#path5" />
        </g>

        <!-- Geometry & Annotations -->
        <g>
            <!-- Impact Parameter (b) for Path 3 -->
            <line x1="500" y1="300" x2="500" y2="200" stroke="#4361EE" stroke-width="2" stroke-dasharray="4 4" marker-start="url(#arrowDimStart)" marker-end="url(#arrowDim)" />
            <text x="510" y="255" class="math" fill="#4361EE" font-weight="bold">b</text>
            <text x="525" y="255" class="subtitle" fill="#4361EE">(Impact Parameter)</text>

            <!-- Distance of Closest Approach (r0) for Path 1 -->
            <line x1="500" y1="300" x2="400" y2="300" stroke="#4361EE" stroke-width="2" stroke-dasharray="4 4" marker-start="url(#arrowDimStart)" marker-end="url(#arrowDim)" />
            <text x="440" y="290" class="math" fill="#4361EE" font-weight="bold">r₀</text>

            <!-- Scattering Angle (θ) for Path 3 -->
            <!-- Horizontal incoming asymptote extension -->
            <line x1="490" y1="200" x2="750" y2="200" stroke="#4361EE" stroke-width="1.5" stroke-dasharray="4 4" />
            <!-- Outgoing asymptote extension -->
            <line x1="490" y1="200" x2="800" y2="99" stroke="#4361EE" stroke-width="1.5" stroke-dasharray="4 4" />
            <!-- Arc -->
            <path d="M 650 200 A 160 160 0 0 0 635 153" fill="none" stroke="#4361EE" stroke-width="2" marker-end="url(#arrowDim)" />
            <text x="665" y="185" class="math" fill="#4361EE" font-weight="bold">θ</text>
            <text x="680" y="185" class="subtitle" fill="#4361EE">(Scattering Angle)</text>
        </g>

        <!-- Nucleus -->
        <g transform="translate(500, 300)">
            <circle cx="0" cy="0" r="22" fill="url(#goldGradient)" class="nucleus" />
            <text x="0" y="45" text-anchor="middle" class="label">Gold Nucleus</text>
            <text x="0" y="65" text-anchor="middle" class="math">(Z = 79)</text>
            <text x="0" y="5" text-anchor="middle" font-weight="bold" fill="#B76E00" font-size="18">+</text>
        </g>

        <!-- Animated Particles and Vectors -->
        
        <!-- Path 1 (Central) -->
        <g class="particle-wrapper" style="offset-path: url(#path1);">
            <g style="offset-rotate: auto;">
                <circle cx="0" cy="0" r="6" fill="url(#alphaGradient)" />
                <line x1="8" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" class="vel-vector" />
            </g>
        </g>
        <g class="force-wrapper-1" style="offset-path: url(#path1);">
            <line x1="0" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" class="force-vector force-vector-1" />
        </g>

        <!-- Path 2 (Top Near Miss) -->
        <g class="particle-wrapper" style="offset-path: url(#path2);">
            <g style="offset-rotate: auto;">
                <circle cx="0" cy="0" r="6" fill="url(#alphaGradient)" />
                <line x1="8" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" class="vel-vector" />
            </g>
        </g>
        <g class="force-wrapper-2" style="offset-path: url(#path2);">
            <line x1="0" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" class="force-vector force-vector-2" />
        </g>

        <!-- Path 3 (Top Distant) -->
        <g class="particle-wrapper" style="offset-path: url(#path3);">
            <g style="offset-rotate: auto;">
                <circle cx="0" cy="0" r="6" fill="url(#alphaGradient)" />
                <line x1="8" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" class="vel-vector" />
            </g>
        </g>
        <g class="force-wrapper-3" style="offset-path: url(#path3);">
            <line x1="0" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" class="force-vector force-vector-3" />
        </g>

        <!-- Path 4 (Bottom Near Miss) -->
        <g class="particle-wrapper" style="offset-path: url(#path4);">
            <g style="offset-rotate: auto;">
                <circle cx="0" cy="0" r="6" fill="url(#alphaGradient)" />
                <line x1="8" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" class="vel-vector" />
            </g>
        </g>
        <g class="force-wrapper-4" style="offset-path: url(#path4);">
            <line x1="0" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" class="force-vector force-vector-4" />
        </g>

        <!-- Path 5 (Bottom Distant) -->
        <g class="particle-wrapper" style="offset-path: url(#path5);">
            <g style="offset-rotate: auto;">
                <circle cx="0" cy="0" r="6" fill="url(#alphaGradient)" />
                <line x1="8" y1="0" x2="40" y2="0" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" class="vel-vector" />
            </g>
        </g>
        <g class="force-wrapper-5" style="offset-path: url(#path5);">
            <line x1="0" y1="0" x2="60" y2="0" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" class="force-vector force-vector-5" />
        </g>

        <!-- Legend Box -->
        <g transform="translate(30, 430)">
            <rect x="0" y="0" width="220" height="140" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <text x="15" y="25" class="label">Legend</text>
            
            <circle cx="25" cy="45" r="6" fill="url(#alphaGradient)" />
            <text x="45" y="50" class="legend-text">α-particle (+2e)</text>
            
            <circle cx="25" cy="70" r="8" fill="url(#goldGradient)" />
            <text x="45" y="75" class="legend-text">Gold Nucleus (+79e)</text>
            
            <line x1="15" y1="95" x2="35" y2="95" stroke="#06D6A0" stroke-width="2.5" marker-end="url(#arrowVel)" />
            <text x="45" y="100" class="legend-text">Velocity Vector (v)</text>
            
            <line x1="15" y1="120" x2="35" y2="120" stroke="#FF3366" stroke-width="2.5" marker-end="url(#arrowForce)" />
            <text x="45" y="125" class="legend-text">Coulomb Force (F_c)</text>
        </g>

        <!-- Formula Box -->
        <g transform="translate(680, 460)">
            <rect x="0" y="0" width="290" height="110" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <text x="15" y="25" class="label" fill="#7209B7">Impact Parameter Formula</text>
            
            <text x="15" y="60" class="math-large">
                <tspan fill="#4361EE">b</tspan> = 
                <tspan fill="#555">───────</tspan> · 
                <tspan fill="#555">─────────</tspan>
            </text>
            <text x="65" y="45" class="math-large" fill="#555">1</text>
            <text x="145" y="45" class="math-large" fill="#555">Ze² cot(θ/2)</text>
            
            <text x="50" y="80" class="math-large" fill="#555">4πε₀</text>
            <text x="190" y="80" class="math-large" fill="#555">K</text>
            
            <text x="15" y="100" class="math" font-size="11" fill="#888">K = Kinetic Energy of α-particle</text>
        </g>

    </svg>
</div>

</body>
</html>
