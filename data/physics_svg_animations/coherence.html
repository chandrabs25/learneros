<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coherence vs. Incoherence in Wave Optics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Continuous wave propagation */
        @keyframes flow {
            0% { transform: translateX(-80px); }
            100% { transform: translateX(0px); }
        }

        .wave-flow {
            animation: flow 2s linear infinite;
        }

        /* Incoherent Phase Jumps (Randomized shifts) */
        @keyframes jump1 {
            0%, 24.99% { transform: translateX(0px); }
            25%, 49.99% { transform: translateX(30px); }
            50%, 74.99% { transform: translateX(-20px); }
            75%, 99.99% { transform: translateX(50px); }
            100% { transform: translateX(0px); }
        }

        @keyframes jump2 {
            0%, 32.99% { transform: translateX(0px); }
            33%, 65.99% { transform: translateX(-40px); }
            66%, 99.99% { transform: translateX(25px); }
            100% { transform: translateX(0px); }
        }

        .phase-jump-1 { animation: jump1 6s steps(1) infinite; }
        .phase-jump-2 { animation: jump2 6s steps(1) infinite; }

        /* Clock Rotations synced with phase jumps */
        @keyframes clock1 {
            0%, 24.99% { transform: rotate(0deg); }
            25%, 49.99% { transform: rotate(135deg); }
            50%, 74.99% { transform: rotate(-90deg); }
            75%, 99.99% { transform: rotate(225deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes clock2 {
            0%, 32.99% { transform: rotate(0deg); }
            33%, 65.99% { transform: rotate(-180deg); }
            66%, 99.99% { transform: rotate(112.5deg); }
            100% { transform: rotate(0deg); }
        }

        .clock-hand-1 { animation: clock1 6s steps(1) infinite; transform-origin: 0 0; }
        .clock-hand-2 { animation: clock2 6s steps(1) infinite; transform-origin: 0 0; }

        /* Lightning Bolt Flashes */
        @keyframes flash1 {
            0%, 23.99% { opacity: 0; transform: scale(0.8); }
            24%, 28% { opacity: 1; transform: scale(1.2); }
            28.01%, 48.99% { opacity: 0; transform: scale(0.8); }
            49%, 53% { opacity: 1; transform: scale(1.2); }
            53.01%, 73.99% { opacity: 0; transform: scale(0.8); }
            74%, 78% { opacity: 1; transform: scale(1.2); }
            78.01%, 100% { opacity: 0; transform: scale(0.8); }
        }

        @keyframes flash2 {
            0%, 31.99% { opacity: 0; transform: scale(0.8); }
            32%, 36% { opacity: 1; transform: scale(1.2); }
            36.01%, 64.99% { opacity: 0; transform: scale(0.8); }
            65%, 69% { opacity: 1; transform: scale(1.2); }
            69.01%, 100% { opacity: 0; transform: scale(0.8); }
        }

        .flash-1 { animation: flash1 6s linear infinite; transform-origin: center; }
        .flash-2 { animation: flash2 6s linear infinite; transform-origin: center; }

        /* Coherent Primary Source Ripples */
        @keyframes ripple {
            0% { r: 10px; opacity: 1; stroke-width: 3px; }
            100% { r: 110px; opacity: 0; stroke-width: 1px; }
        }

        .wf { fill: none; stroke: #06D6A0; }
        .wf-1 { animation: ripple 2s linear infinite; animation-delay: 0s; }
        .wf-2 { animation: ripple 2s linear infinite; animation-delay: 0.66s; }
        .wf-3 { animation: ripple 2s linear infinite; animation-delay: 1.33s; }

        /* Global Pause */
        body.paused *, body.paused {
            animation-play-state: paused !important;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        button {
            padding: 8px 16px;
            background: #4361EE;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 6px rgba(67, 97, 238, 0.2);
            transition: background 0.2s, transform 0.1s;
        }

        button:hover {
            background: #3651d4;
        }

        button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <button id="playPause">Pause Animation</button>
        </div>

        <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Sine Wave Path Definition (Lambda = 80px, Amplitude = 20px) -->
                <path id="sine-wave" d="M -160 0 Q -140 -20 -120 0 T -80 0 T -40 0 T 0 0 T 40 0 T 80 0 T 120 0 T 160 0 T 200 0 T 240 0 T 280 0 T 320 0 T 360 0 T 400 0 T 440 0 T 480 0 T 520 0 T 560 0 T 600 0 T 640 0 T 680 0 T 720 0" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
                
                <!-- Clip Path to hide waves before the source and after the screen -->
                <clipPath id="wave-clip">
                    <rect x="0" y="-40" width="530" height="80" />
                </clipPath>

                <!-- Screen Gradients -->
                <linearGradient id="incoherent-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#e9ecef" />
                    <stop offset="50%" stop-color="#fdfcdc" />
                    <stop offset="100%" stop-color="#e9ecef" />
                </linearGradient>

                <linearGradient id="fringe-grad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#111" />
                    <stop offset="15%" stop-color="#fff" />
                    <stop offset="30%" stop-color="#111" />
                    <stop offset="50%" stop-color="#fff" /> <!-- Central Maximum -->
                    <stop offset="70%" stop-color="#111" />
                    <stop offset="85%" stop-color="#fff" />
                    <stop offset="100%" stop-color="#111" />
                </linearGradient>

                <!-- Drop Shadow for Panels -->
                <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
                    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.06" />
                </filter>
            </defs>

            <!-- Title -->
            <text x="400" y="35" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#212529">Coherence vs. Incoherence in Wave Optics</text>

            <!-- Legend -->
            <rect x="610" y="10" width="170" height="70" rx="6" fill="#ffffff" stroke="#dee2e6" />
            <line x1="620" y1="25" x2="640" y2="25" stroke="#00B4D8" stroke-width="3" />
            <text x="650" y="29" font-family="Inter" font-size="11" fill="#495057">Wave 1</text>
            <line x1="620" y1="45" x2="640" y2="45" stroke="#F77F00" stroke-width="3" />
            <text x="650" y="49" font-family="Inter" font-size="11" fill="#495057">Wave 2</text>
            <circle cx="630" cy="65" r="4" fill="#06D6A0" />
            <text x="650" y="69" font-family="Inter" font-size="11" fill="#495057">Primary Source</text>

            <!-- ========================================== -->
            <!-- PANEL A: INCOHERENT SOURCES (TOP)          -->
            <!-- ========================================== -->
            <rect x="20" y="60" width="760" height="220" rx="10" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#shadow)" />
            
            <!-- Panel Labels -->
            <text x="40" y="90" font-family="Inter" font-size="16" font-weight="600" fill="#212529">Independent Sources (Incoherent)</text>
            <text x="400" y="90" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#7209B7" text-anchor="middle">Δϕ(t) ≠ constant</text>

            <!-- Source S1 -->
            <circle cx="150" cy="130" r="6" fill="#00B4D8" />
            <text x="135" y="120" font-family="Inter" font-size="12" font-weight="600" fill="#495057">S₁</text>
            
            <!-- Source S2 -->
            <circle cx="150" cy="210" r="6" fill="#F77F00" />
            <text x="135" y="230" font-family="Inter" font-size="12" font-weight="600" fill="#495057">S₂</text>

            <!-- Phase Clocks (Incoherent) -->
            <g transform="translate(100, 130)">
                <circle cx="0" cy="0" r="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" />
                <line x1="0" y1="0" x2="0" y2="-14" stroke="#00B4D8" stroke-width="2.5" class="clock-hand-1" />
                <text x="-25" y="-15" font-size="16" class="flash-1" fill="#FF3366">⚡</text>
            </g>
            <g transform="translate(100, 210)">
                <circle cx="0" cy="0" r="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" />
                <line x1="0" y1="0" x2="0" y2="-14" stroke="#F77F00" stroke-width="2.5" class="clock-hand-2" />
                <text x="-25" y="-15" font-size="16" class="flash-2" fill="#FF3366">⚡</text>
            </g>

            <!-- Incoherent Waves -->
            <!-- Wave 1 (Cyan) -->
            <g transform="translate(150, 130) rotate(4.31)">
                <g clip-path="url(#wave-clip)">
                    <g class="phase-jump-1">
                        <use href="#sine-wave" stroke="#00B4D8" class="wave-flow" />
                    </g>
                </g>
            </g>
            <!-- Wave 2 (Orange) -->
            <g transform="translate(150, 210) rotate(-4.31)">
                <g clip-path="url(#wave-clip)">
                    <g class="phase-jump-2">
                        <use href="#sine-wave" stroke="#F77F00" class="wave-flow" />
                    </g>
                </g>
            </g>

            <!-- Incoherent Screen -->
            <rect x="680" y="90" width="30" height="160" rx="4" fill="url(#incoherent-grad)" stroke="#ced4da" stroke-width="1" />
            <text x="695" y="270" text-anchor="middle" font-family="Roboto Mono" font-size="13" font-weight="700" fill="#212529">I = I₁ + I₂</text>

            <!-- Incoherent Intensity Graph Overlay -->
            <text x="720" y="80" font-family="Inter" font-size="10" font-weight="600" fill="#dc3545">Intensity</text>
            <line x1="720" y1="90" x2="720" y2="250" stroke="#adb5bd" stroke-width="1" />
            <line x1="735" y1="90" x2="735" y2="250" stroke="#dc3545" stroke-width="2" stroke-dasharray="4 4" />
            <text x="740" y="174" font-family="Roboto Mono" font-size="10" fill="#dc3545">2I₀</text>


            <!-- ========================================== -->
            <!-- PANEL B: COHERENT SOURCES (BOTTOM)         -->
            <!-- ========================================== -->
            <rect x="20" y="300" width="760" height="230" rx="10" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#shadow)" />
            
            <!-- Panel Labels -->
            <text x="40" y="330" font-family="Inter" font-size="16" font-weight="600" fill="#212529">Single Source Split (Coherent)</text>
            <text x="400" y="330" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#7209B7" text-anchor="middle">Δϕ = constant</text>

            <!-- Primary Source S -->
            <circle cx="50" cy="410" r="6" fill="#06D6A0" />
            <text x="35" y="400" font-family="Inter" font-size="12" font-weight="600" fill="#495057">S</text>

            <!-- Expanding Wavefronts from S -->
            <circle cx="50" cy="410" r="10" class="wf wf-1" />
            <circle cx="50" cy="410" r="10" class="wf wf-2" />
            <circle cx="50" cy="410" r="10" class="wf wf-3" />

            <!-- Barrier with Slits -->
            <path d="M 150 310 L 150 360 M 150 380 L 150 440 M 150 460 L 150 520" stroke="#343a40" stroke-width="6" stroke-linecap="round" />

            <!-- Source S1 (Slit 1) -->
            <circle cx="150" cy="370" r="4" fill="#00B4D8" />
            <text x="165" y="360" font-family="Inter" font-size="12" font-weight="600" fill="#495057">S₁</text>
            
            <!-- Source S2 (Slit 2) -->
            <circle cx="150" cy="450" r="4" fill="#F77F00" />
            <text x="165" y="470" font-family="Inter" font-size="12" font-weight="600" fill="#495057">S₂</text>

            <!-- Phase Clocks (Coherent - Static) -->
            <g transform="translate(120, 370)">
                <circle cx="0" cy="0" r="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" />
                <line x1="0" y1="0" x2="0" y2="-14" stroke="#00B4D8" stroke-width="2.5" />
            </g>
            <g transform="translate(120, 450)">
                <circle cx="0" cy="0" r="14" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" />
                <line x1="0" y1="0" x2="0" y2="-14" stroke="#F77F00" stroke-width="2.5" />
            </g>

            <!-- Coherent Waves -->
            <!-- Wave 1 (Cyan) -->
            <g transform="translate(150, 370) rotate(4.31)">
                <g clip-path="url(#wave-clip)">
                    <use href="#sine-wave" stroke="#00B4D8" class="wave-flow" />
                </g>
            </g>
            <!-- Wave 2 (Orange) -->
            <g transform="translate(150, 450) rotate(-4.31)">
                <g clip-path="url(#wave-clip)">
                    <use href="#sine-wave" stroke="#F77F00" class="wave-flow" />
                </g>
            </g>

            <!-- Coherent Screen (Fringe Pattern) -->
            <rect x="680" y="330" width="30" height="160" rx="4" fill="url(#fringe-grad)" stroke="#ced4da" stroke-width="1" />
            <text x="695" y="515" text-anchor="middle" font-family="Roboto Mono" font-size="13" font-weight="700" fill="#212529">I = 4I₀cos²(ϕ/2)</text>

            <!-- Coherent Intensity Graph Overlay -->
            <text x="720" y="320" font-family="Inter" font-size="10" font-weight="600" fill="#dc3545">Intensity</text>
            <line x1="720" y1="330" x2="720" y2="490" stroke="#adb5bd" stroke-width="1" />
            <!-- Intensity Curve matching the fringes -->
            <path d="M 720 330 Q 750 342 750 354 Q 750 366 720 378 Q 750 394 750 410 Q 750 426 720 442 Q 750 454 750 466 Q 750 478 720 490" fill="none" stroke="#dc3545" stroke-width="2" />
            <text x="755" y="413" font-family="Roboto Mono" font-size="10" fill="#dc3545">4I₀</text>

        </svg>
    </div>

    <script>
        const btn = document.getElementById('playPause');
        btn.addEventListener('click', () => {
            document.body.classList.toggle('paused');
            if (document.body.classList.contains('paused')) {
                btn.innerText = 'Play Animation';
                btn.style.background = '#06D6A0';
            } else {
                btn.innerText = 'Pause Animation';
                btn.style.background = '#4361EE';
            }
        });
    </script>
</body>
</html>
