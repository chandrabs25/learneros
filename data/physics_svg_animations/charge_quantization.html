<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charge Quantization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        text {
            user-select: none;
        }
        
        /* Animations */
        .smooth-glow {
            animation: fadeGlow 12s infinite ease-in-out;
        }
        .lens-group {
            animation: moveLens 12s infinite ease-in-out;
        }
        .macro-text {
            animation: fadeMacro 12s infinite ease-in-out;
        }
        .micro-text {
            animation: fadeMicro 12s infinite ease-in-out;
        }
        
        /* Electron Drops */
        .e1 { animation: drop1 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); }
        .e2 { animation: drop2 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); }
        .e3 { animation: drop3 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); }
        .e4 { animation: drop4 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); }
        .e5 { animation: drop5 12s infinite cubic-bezier(0.34, 1.56, 0.64, 1); }
        
        /* Graph Animations */
        .staircase {
            stroke-dasharray: 530;
            stroke-dashoffset: 530;
            animation: drawStaircase 12s infinite linear;
        }
        .p1 { animation: showP1 12s infinite ease-out; transform-origin: 500px 344px; }
        .p2 { animation: showP2 12s infinite ease-out; transform-origin: 550px 288px; }
        .p3 { animation: showP3 12s infinite ease-out; transform-origin: 600px 232px; }
        .p4 { animation: showP4 12s infinite ease-out; transform-origin: 650px 176px; }
        .p5 { animation: showP5 12s infinite ease-out; transform-origin: 700px 120px; }
        
        /* Counters */
        .c0 { animation: showC0 12s infinite; }
        .c1 { animation: showC1 12s infinite; }
        .c2 { animation: showC2 12s infinite; }
        .c3 { animation: showC3 12s infinite; }
        .c4 { animation: showC4 12s infinite; }
        .c5 { animation: showC5 12s infinite; }
        
        /* Conclusion */
        .conclusion { animation: showConclusion 12s infinite ease-in-out; }
        .formula-box { animation: highlightFormula 12s infinite ease-in-out; transform-origin: 600px 80px; }

        /* Keyframes */
        @keyframes fadeGlow {
            0%, 15% { opacity: 0.6; }
            20%, 90% { opacity: 0.1; }
            95%, 100% { opacity: 0.6; }
        }
        @keyframes moveLens {
            0%, 10% { transform: translate(-250px, -250px); opacity: 0; }
            18%, 92% { transform: translate(0, 0); opacity: 1; }
            96%, 100% { transform: translate(-250px, -250px); opacity: 0; }
        }
        @keyframes fadeMacro {
            0%, 15% { opacity: 1; }
            20%, 100% { opacity: 0; }
        }
        @keyframes fadeMicro {
            0%, 15% { opacity: 0; }
            20%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        
        @keyframes drop1 {
            0%, 25% { transform: translateY(-200px); opacity: 0; }
            28%, 95% { transform: translateY(0); opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes drop2 {
            0%, 38% { transform: translateY(-200px); opacity: 0; }
            41%, 95% { transform: translateY(0); opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes drop3 {
            0%, 51% { transform: translateY(-200px); opacity: 0; }
            54%, 95% { transform: translateY(0); opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes drop4 {
            0%, 64% { transform: translateY(-200px); opacity: 0; }
            67%, 95% { transform: translateY(0); opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes drop5 {
            0%, 77% { transform: translateY(-200px); opacity: 0; }
            80%, 95% { transform: translateY(0); opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        @keyframes drawStaircase {
            0%, 25% { stroke-dashoffset: 530; opacity: 1; }
            28%, 38% { stroke-dashoffset: 424; opacity: 1; }
            41%, 51% { stroke-dashoffset: 318; opacity: 1; }
            54%, 64% { stroke-dashoffset: 212; opacity: 1; }
            67%, 77% { stroke-dashoffset: 106; opacity: 1; }
            80%, 95% { stroke-dashoffset: 0; opacity: 1; }
            96%, 100% { stroke-dashoffset: 530; opacity: 0; }
        }

        @keyframes showP1 { 0%, 27% { opacity: 0; transform: scale(0); } 28%, 95% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
        @keyframes showP2 { 0%, 40% { opacity: 0; transform: scale(0); } 41%, 95% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
        @keyframes showP3 { 0%, 53% { opacity: 0; transform: scale(0); } 54%, 95% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
        @keyframes showP4 { 0%, 66% { opacity: 0; transform: scale(0); } 67%, 95% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }
        @keyframes showP5 { 0%, 79% { opacity: 0; transform: scale(0); } 80%, 95% { opacity: 1; transform: scale(1); } 96%, 100% { opacity: 0; } }

        @keyframes showC0 { 0%, 25% { opacity: 1; } 25.1%, 100% { opacity: 0; } }
        @keyframes showC1 { 0%, 25% { opacity: 0; } 25.1%, 38% { opacity: 1; } 38.1%, 100% { opacity: 0; } }
        @keyframes showC2 { 0%, 38% { opacity: 0; } 38.1%, 51% { opacity: 1; } 51.1%, 100% { opacity: 0; } }
        @keyframes showC3 { 0%, 51% { opacity: 0; } 51.1%, 64% { opacity: 1; } 64.1%, 100% { opacity: 0; } }
        @keyframes showC4 { 0%, 64% { opacity: 0; } 64.1%, 77% { opacity: 1; } 77.1%, 100% { opacity: 0; } }
        @keyframes showC5 { 0%, 77% { opacity: 0; } 77.1%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }

        @keyframes showConclusion {
            0%, 82% { opacity: 0; transform: translateY(10px); }
            84%, 95% { opacity: 1; transform: translateY(0); }
            96%, 100% { opacity: 0; }
        }
        @keyframes highlightFormula {
            0%, 82% { transform: scale(1); fill: #212529; }
            84%, 95% { transform: scale(1.15); fill: #F77F00; }
            96%, 100% { transform: scale(1); fill: #212529; }
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Metallic Gradient for Plate -->
            <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f8f9fa" />
                <stop offset="50%" stop-color="#dee2e6" />
                <stop offset="100%" stop-color="#ced4da" />
            </linearGradient>
            
            <!-- Glass Gradient for Lens -->
            <radialGradient id="glassGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
            </radialGradient>

            <!-- Lens Clip Path -->
            <clipPath id="lensClip">
                <circle cx="200" cy="260" r="110" />
            </clipPath>

            <!-- Electron Symbol -->
            <g id="electron">
                <circle cx="0" cy="0" r="14" fill="#4361EE" />
                <rect x="-7" y="-1.5" width="14" height="3" fill="#ffffff" rx="1" />
            </g>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Title & Subtitles -->
        <text x="400" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#212529">Charge Quantization: The Microscopic Reality</text>
        <text x="400" y="60" text-anchor="middle" font-family="Inter" font-weight="400" font-size="14" fill="#6c757d" class="macro-text">Macroscopic View: Continuous Charge</text>
        <text x="400" y="60" text-anchor="middle" font-family="Inter" font-weight="600" font-size="14" fill="#4361EE" class="micro-text">Microscopic View: Discrete Electrons</text>

        <!-- LEFT PANEL: Physical Plate -->
        <g id="left-panel">
            <!-- Base Plate -->
            <rect x="40" y="120" width="320" height="280" rx="8" fill="url(#metalGrad)" stroke="#adb5bd" stroke-width="2" />
            
            <!-- Smooth Glow (Macroscopic Charge) -->
            <rect x="40" y="120" width="320" height="280" rx="8" fill="#4361EE" class="smooth-glow" />

            <!-- Magnifying Lens Group -->
            <g class="lens-group">
                <!-- Handle -->
                <line x1="280" y1="340" x2="350" y2="410" stroke="#343a40" stroke-width="16" stroke-linecap="round" />
                <line x1="280" y1="340" x2="350" y2="410" stroke="#6c757d" stroke-width="8" stroke-linecap="round" />
                
                <!-- Outer Ring -->
                <circle cx="200" cy="260" r="116" fill="#f8f9fa" stroke="#343a40" stroke-width="6" />
                
                <!-- Clipped Microscopic View -->
                <g clip-path="url(#lensClip)">
                    <!-- Zoomed Plate Background (Hides smooth glow) -->
                    <rect x="40" y="120" width="320" height="280" fill="url(#metalGrad)" />
                    
                    <!-- Electrons -->
                    <g class="e1"><use href="#electron" x="140" y="200" /></g>
                    <g class="e2"><use href="#electron" x="260" y="220" /></g>
                    <g class="e3"><use href="#electron" x="170" y="300" /></g>
                    <g class="e4"><use href="#electron" x="240" y="320" /></g>
                    <g class="e5"><use href="#electron" x="200" y="260" /></g>
                </g>
                
                <!-- Glass Overlay -->
                <circle cx="200" cy="260" r="110" fill="url(#glassGrad)" pointer-events="none" />
                
                <!-- Inner Ring Highlight -->
                <circle cx="200" cy="260" r="110" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.5" />
            </g>
        </g>

        <!-- RIGHT PANEL: Quantization Graph -->
        <g id="right-panel">
            <!-- Grid Lines -->
            <g stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4">
                <!-- Vertical -->
                <line x1="500" y1="120" x2="500" y2="400" />
                <line x1="550" y1="120" x2="550" y2="400" />
                <line x1="600" y1="120" x2="600" y2="400" />
                <line x1="650" y1="120" x2="650" y2="400" />
                <line x1="700" y1="120" x2="700" y2="400" />
                <!-- Horizontal -->
                <line x1="450" y1="344" x2="720" y2="344" />
                <line x1="450" y1="288" x2="720" y2="288" />
                <line x1="450" y1="232" x2="720" y2="232" />
                <line x1="450" y1="176" x2="720" y2="176" />
                <line x1="450" y1="120" x2="720" y2="120" />
            </g>

            <!-- Axes -->
            <path d="M 450 100 V 400 H 740" stroke="#212529" stroke-width="2.5" fill="none" />
            <polygon points="445,110 450,100 455,110" fill="#212529" />
            <polygon points="730,395 740,400 730,405" fill="#212529" />

            <!-- Axis Labels -->
            <text x="450" y="85" text-anchor="middle" font-family="Inter" font-weight="600" font-size="13" fill="#212529">Magnitude of Charge, |Q|</text>
            <text x="740" y="435" text-anchor="end" font-family="Inter" font-weight="600" font-size="13" fill="#212529">Number of Electrons, n</text>

            <!-- X-Axis Ticks & Numbers -->
            <g font-family="Roboto Mono" font-size="12" fill="#495057" text-anchor="middle">
                <line x1="500" y1="400" x2="500" y2="405" stroke="#212529" stroke-width="2"/> <text x="500" y="420">1</text>
                <line x1="550" y1="400" x2="550" y2="405" stroke="#212529" stroke-width="2"/> <text x="550" y="420">2</text>
                <line x1="600" y1="400" x2="600" y2="405" stroke="#212529" stroke-width="2"/> <text x="600" y="420">3</text>
                <line x1="650" y1="400" x2="650" y2="405" stroke="#212529" stroke-width="2"/> <text x="650" y="420">4</text>
                <line x1="700" y1="400" x2="700" y2="405" stroke="#212529" stroke-width="2"/> <text x="700" y="420">5</text>
            </g>

            <!-- Y-Axis Ticks & Numbers -->
            <g font-family="Roboto Mono" font-size="12" fill="#495057" text-anchor="end">
                <line x1="445" y1="344" x2="450" y2="344" stroke="#212529" stroke-width="2"/> <text x="440" y="348">1e</text>
                <line x1="445" y1="288" x2="450" y2="288" stroke="#212529" stroke-width="2"/> <text x="440" y="292">2e</text>
                <line x1="445" y1="232" x2="450" y2="232" stroke="#212529" stroke-width="2"/> <text x="440" y="236">3e</text>
                <line x1="445" y1="176" x2="450" y2="176" stroke="#212529" stroke-width="2"/> <text x="440" y="180">4e</text>
                <line x1="445" y1="120" x2="450" y2="120" stroke="#212529" stroke-width="2"/> <text x="440" y="124">5e</text>
            </g>

            <!-- Staircase Plot -->
            <path class="staircase" d="M 450 400 H 500 V 344 H 550 V 288 H 600 V 232 H 650 V 176 H 700 V 120" 
                  stroke="#F77F00" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" />
            
            <!-- Discrete Points -->
            <g fill="#F77F00" stroke="#ffffff" stroke-width="2">
                <circle class="p1" cx="500" cy="344" r="6" />
                <circle class="p2" cx="550" cy="288" r="6" />
                <circle class="p3" cx="600" cy="232" r="6" />
                <circle class="p4" cx="650" cy="176" r="6" />
                <circle class="p5" cx="700" cy="120" r="6" />
            </g>
        </g>

        <!-- Dynamic Counter -->
        <g font-family="Roboto Mono" font-size="18" font-weight="700" fill="#4361EE" text-anchor="middle">
            <text x="600" y="45" class="c0">n = 0</text>
            <text x="600" y="45" class="c1">n = 1</text>
            <text x="600" y="45" class="c2">n = 2</text>
            <text x="600" y="45" class="c3">n = 3</text>
            <text x="600" y="45" class="c4">n = 4</text>
            <text x="600" y="45" class="c5">n = 5</text>
        </g>

        <!-- Formulas and Constants -->
        <g class="formula-box">
            <text x="600" y="280" text-anchor="middle" font-family="Roboto Mono" font-weight="700" font-size="24">Q = ±ne</text>
        </g>
        <text x="760" y="480" text-anchor="end" font-family="Roboto Mono" font-size="14" fill="#6c757d">e = 1.6 × 10⁻¹⁹ C</text>

        <!-- Conclusion Text -->
        <text x="600" y="310" text-anchor="middle" font-family="Inter" font-weight="600" font-size="15" fill="#F77F00" class="conclusion">Charge is not continuous; it is quantized.</text>

        <!-- Legend -->
        <g transform="translate(40, 435)">
            <rect x="0" y="0" width="160" height="50" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
            <circle cx="15" cy="15" r="6" fill="#4361EE" />
            <text x="30" y="19" font-family="Inter" font-size="12" fill="#495057">Electron (e⁻)</text>
            <line x1="9" y1="35" x2="21" y2="35" stroke="#F77F00" stroke-width="3" stroke-linecap="round" />
            <text x="30" y="39" font-family="Inter" font-size="12" fill="#495057">Total Charge (Q)</text>
        </g>
    </svg>
</body>
</html>
