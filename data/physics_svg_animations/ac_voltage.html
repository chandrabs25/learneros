<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AC Voltage across a Pure Resistor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-v: #FF3366;
            --color-i: #4361EE;
            --color-bg: #f8f9fa;
            --color-text: #333333;
            --color-grid: #e9ecef;
            --color-wire: #495057;
            --color-charge: #6c757d;
            --anim-duration: 4s;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #e2e8f0;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--color-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 20px;
            max-width: 900px;
            width: 100%;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        @keyframes rotate-phasor {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-360deg); }
        }

        @keyframes counter-rotate-v {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes counter-rotate-i {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes scan-x {
            0% { transform: translateX(0px); }
            100% { transform: translateX(240px); }
        }

        /* Y-axis animation for dots to follow the sine wave perfectly */
        @keyframes dot-v-y {
            0% { transform: translateY(0px); }
            4.16% { transform: translateY(-20.7px); }
            8.33% { transform: translateY(-40.0px); }
            12.5% { transform: translateY(-56.6px); }
            16.66% { transform: translateY(-69.3px); }
            20.83% { transform: translateY(-77.3px); }
            25% { transform: translateY(-80.0px); }
            29.16% { transform: translateY(-77.3px); }
            33.33% { transform: translateY(-69.3px); }
            37.5% { transform: translateY(-56.6px); }
            41.66% { transform: translateY(-40.0px); }
            45.83% { transform: translateY(-20.7px); }
            50% { transform: translateY(0px); }
            54.16% { transform: translateY(20.7px); }
            58.33% { transform: translateY(40.0px); }
            62.5% { transform: translateY(56.6px); }
            66.66% { transform: translateY(69.3px); }
            70.83% { transform: translateY(77.3px); }
            75% { transform: translateY(80.0px); }
            79.16% { transform: translateY(77.3px); }
            83.33% { transform: translateY(69.3px); }
            87.5% { transform: translateY(56.6px); }
            91.66% { transform: translateY(40.0px); }
            95.83% { transform: translateY(20.7px); }
            100% { transform: translateY(0px); }
        }

        @keyframes dot-i-y {
            0% { transform: translateY(0px); }
            4.16% { transform: translateY(-12.9px); }
            8.33% { transform: translateY(-25.0px); }
            12.5% { transform: translateY(-35.4px); }
            16.66% { transform: translateY(-43.3px); }
            20.83% { transform: translateY(-48.3px); }
            25% { transform: translateY(-50.0px); }
            29.16% { transform: translateY(-48.3px); }
            33.33% { transform: translateY(-43.3px); }
            37.5% { transform: translateY(-35.4px); }
            41.66% { transform: translateY(-25.0px); }
            45.83% { transform: translateY(-12.9px); }
            50% { transform: translateY(0px); }
            54.16% { transform: translateY(12.9px); }
            58.33% { transform: translateY(25.0px); }
            62.5% { transform: translateY(35.4px); }
            66.66% { transform: translateY(43.3px); }
            70.83% { transform: translateY(48.3px); }
            75% { transform: translateY(50.0px); }
            79.16% { transform: translateY(48.3px); }
            83.33% { transform: translateY(43.3px); }
            87.5% { transform: translateY(35.4px); }
            91.66% { transform: translateY(25.0px); }
            95.83% { transform: translateY(12.9px); }
            100% { transform: translateY(0px); }
        }

        /* Charge carrier SHM animations */
        @keyframes charge-top {
            0% { transform: translateX(-12px); } 4.16% { transform: translateX(-11.6px); } 8.33% { transform: translateX(-10.4px); } 12.5% { transform: translateX(-8.5px); } 16.66% { transform: translateX(-6px); } 20.83% { transform: translateX(-3.1px); } 25% { transform: translateX(0px); } 29.16% { transform: translateX(3.1px); } 33.33% { transform: translateX(6px); } 37.5% { transform: translateX(8.5px); } 41.66% { transform: translateX(10.4px); } 45.83% { transform: translateX(11.6px); } 50% { transform: translateX(12px); } 54.16% { transform: translateX(11.6px); } 58.33% { transform: translateX(10.4px); } 62.5% { transform: translateX(8.5px); } 66.66% { transform: translateX(6px); } 70.83% { transform: translateX(3.1px); } 75% { transform: translateX(0px); } 79.16% { transform: translateX(-3.1px); } 83.33% { transform: translateX(-6px); } 87.5% { transform: translateX(-8.5px); } 91.66% { transform: translateX(-10.4px); } 95.83% { transform: translateX(-11.6px); } 100% { transform: translateX(-12px); }
        }
        @keyframes charge-bottom {
            0% { transform: translateX(12px); } 4.16% { transform: translateX(11.6px); } 8.33% { transform: translateX(10.4px); } 12.5% { transform: translateX(8.5px); } 16.66% { transform: translateX(6px); } 20.83% { transform: translateX(3.1px); } 25% { transform: translateX(0px); } 29.16% { transform: translateX(-3.1px); } 33.33% { transform: translateX(-6px); } 37.5% { transform: translateX(-8.5px); } 41.66% { transform: translateX(-10.4px); } 45.83% { transform: translateX(-11.6px); } 50% { transform: translateX(-12px); } 54.16% { transform: translateX(-11.6px); } 58.33% { transform: translateX(-10.4px); } 62.5% { transform: translateX(-8.5px); } 66.66% { transform: translateX(-6px); } 70.83% { transform: translateX(-3.1px); } 75% { transform: translateX(0px); } 79.16% { transform: translateX(3.1px); } 83.33% { transform: translateX(6px); } 87.5% { transform: translateX(8.5px); } 91.66% { transform: translateX(10.4px); } 95.83% { transform: translateX(11.6px); } 100% { transform: translateX(12px); }
        }
        @keyframes charge-right {
            0% { transform: translateY(-12px); } 4.16% { transform: translateY(-11.6px); } 8.33% { transform: translateY(-10.4px); } 12.5% { transform: translateY(-8.5px); } 16.66% { transform: translateY(-6px); } 20.83% { transform: translateY(-3.1px); } 25% { transform: translateY(0px); } 29.16% { transform: translateY(3.1px); } 33.33% { transform: translateY(6px); } 37.5% { transform: translateY(8.5px); } 41.66% { transform: translateY(10.4px); } 45.83% { transform: translateY(11.6px); } 50% { transform: translateY(12px); } 54.16% { transform: translateY(11.6px); } 58.33% { transform: translateY(10.4px); } 62.5% { transform: translateY(8.5px); } 66.66% { transform: translateY(6px); } 70.83% { transform: translateY(3.1px); } 75% { transform: translateY(0px); } 79.16% { transform: translateY(-3.1px); } 83.33% { transform: translateY(-6px); } 87.5% { transform: translateY(-8.5px); } 91.66% { transform: translateY(-10.4px); } 95.83% { transform: translateY(-11.6px); } 100% { transform: translateY(-12px); }
        }
        @keyframes charge-left {
            0% { transform: translateY(12px); } 4.16% { transform: translateY(11.6px); } 8.33% { transform: translateY(10.4px); } 12.5% { transform: translateY(8.5px); } 16.66% { transform: translateY(6px); } 20.83% { transform: translateY(3.1px); } 25% { transform: translateY(0px); } 29.16% { transform: translateY(-3.1px); } 33.33% { transform: translateY(-6px); } 37.5% { transform: translateY(-8.5px); } 41.66% { transform: translateY(-10.4px); } 45.83% { transform: translateY(-11.6px); } 50% { transform: translateY(-12px); } 54.16% { transform: translateY(-11.6px); } 58.33% { transform: translateY(-10.4px); } 62.5% { transform: translateY(-8.5px); } 66.66% { transform: translateY(-6px); } 70.83% { transform: translateY(-3.1px); } 75% { transform: translateY(0px); } 79.16% { transform: translateY(3.1px); } 83.33% { transform: translateY(6px); } 87.5% { transform: translateY(8.5px); } 91.66% { transform: translateY(10.4px); } 95.83% { transform: translateY(11.6px); } 100% { transform: translateY(12px); }
        }

        /* Applying animations */
        .anim-phasor { animation: rotate-phasor var(--anim-duration) linear infinite; transform-origin: 380px 250px; }
        .anim-counter-v { animation: counter-rotate-v var(--anim-duration) linear infinite; transform-origin: 460px 250px; }
        .anim-counter-i { animation: counter-rotate-i var(--anim-duration) linear infinite; transform-origin: 430px 250px; }
        .anim-scan-x { animation: scan-x var(--anim-duration) linear infinite; }
        .anim-dot-v { animation: dot-v-y var(--anim-duration) linear infinite; }
        .anim-dot-i { animation: dot-i-y var(--anim-duration) linear infinite; }
        
        .c-top { animation: charge-top var(--anim-duration) linear infinite; }
        .c-bottom { animation: charge-bottom var(--anim-duration) linear infinite; }
        .c-right { animation: charge-right var(--anim-duration) linear infinite; }
        .c-left { animation: charge-left var(--anim-duration) linear infinite; }

        /* Pause state */
        .paused .anim-phasor,
        .paused .anim-counter-v,
        .paused .anim-counter-i,
        .paused .anim-scan-x,
        .paused .anim-dot-v,
        .paused .anim-dot-i,
        .paused .c-top,
        .paused .c-bottom,
        .paused .c-right,
        .paused .c-left {
            animation-play-state: paused !important;
        }

        .controls {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        button {
            background-color: var(--color-text);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

<div class="container" id="animation-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="var(--color-v)" />
            </marker>
            <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="var(--color-i)" />
            </marker>
            <marker id="arrow-black" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L8,3 z" fill="#888" />
            </marker>

            <!-- Moving Mask for Waveform Drawing -->
            <mask id="wave-mask">
                <rect x="-240" y="-120" width="240" height="240" fill="white" class="anim-scan-x" />
            </mask>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="var(--color-bg)" rx="12" />

        <!-- Main Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="var(--color-text)">AC Voltage across a Pure Resistor</text>

        <!-- Panel Titles -->
        <text x="140" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Circuit Diagram</text>
        <text x="380" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Phasor Diagram</text>
        <text x="640" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#555">Waveform Plot</text>

        <!-- ========================================== -->
        <!-- PANEL A: CIRCUIT DIAGRAM                   -->
        <!-- ========================================== -->
        <g id="panel-circuit">
            <!-- Wires -->
            <polyline points="60,230 60,150 220,150 220,210" fill="none" stroke="var(--color-wire)" stroke-width="2"/>
            <polyline points="220,290 220,350 60,350 60,270" fill="none" stroke="var(--color-wire)" stroke-width="2"/>
            
            <!-- Resistor Symbol -->
            <path d="M 220 210 L 210 215 L 230 225 L 210 235 L 230 245 L 210 255 L 230 265 L 210 275 L 230 285 L 220 290" fill="none" stroke="var(--color-wire)" stroke-width="2" stroke-linejoin="round"/>
            <text x="240" y="255" font-size="16" font-weight="600" fill="var(--color-text)" class="math">R</text>

            <!-- AC Source Symbol -->
            <circle cx="60" cy="250" r="20" fill="white" stroke="var(--color-wire)" stroke-width="2"/>
            <path d="M 47 250 Q 53.5 238 60 250 T 73 250" fill="none" stroke="var(--color-wire)" stroke-width="2"/>
            <text x="20" y="255" font-size="14" font-weight="600" fill="var(--color-v)" class="math">v(t)</text>

            <!-- Charge Carriers -->
            <!-- Top Wire -->
            <circle cx="100" cy="150" r="4" fill="var(--color-charge)" class="c-top"/>
            <circle cx="140" cy="150" r="4" fill="var(--color-charge)" class="c-top"/>
            <circle cx="180" cy="150" r="4" fill="var(--color-charge)" class="c-top"/>
            <!-- Bottom Wire -->
            <circle cx="100" cy="350" r="4" fill="var(--color-charge)" class="c-bottom"/>
            <circle cx="140" cy="350" r="4" fill="var(--color-charge)" class="c-bottom"/>
            <circle cx="180" cy="350" r="4" fill="var(--color-charge)" class="c-bottom"/>
            <!-- Left Wire -->
            <circle cx="60" cy="180" r="4" fill="var(--color-charge)" class="c-left"/>
            <circle cx="60" cy="200" r="4" fill="var(--color-charge)" class="c-left"/>
            <circle cx="60" cy="300" r="4" fill="var(--color-charge)" class="c-left"/>
            <circle cx="60" cy="320" r="4" fill="var(--color-charge)" class="c-left"/>
            <!-- Right Wire -->
            <circle cx="220" cy="180" r="4" fill="var(--color-charge)" class="c-right"/>
            <circle cx="220" cy="200" r="4" fill="var(--color-charge)" class="c-right"/>
            <circle cx="220" cy="300" r="4" fill="var(--color-charge)" class="c-right"/>
            <circle cx="220" cy="320" r="4" fill="var(--color-charge)" class="c-right"/>
        </g>

        <!-- ========================================== -->
        <!-- PANEL B: PHASOR DIAGRAM                    -->
        <!-- ========================================== -->
        <g id="panel-phasor">
            <!-- Axes -->
            <line x1="280" y1="250" x2="480" y2="250" stroke="#ccc" stroke-dasharray="4 4"/>
            <line x1="380" y1="150" x2="380" y2="350" stroke="#ccc" stroke-dasharray="4 4"/>
            
            <!-- Reference Circles -->
            <circle cx="380" cy="250" r="80" fill="none" stroke="#e0e0e0" stroke-dasharray="4 4"/>
            <circle cx="380" cy="250" r="50" fill="none" stroke="#e0e0e0" stroke-dasharray="4 4"/>

            <!-- Rotation Indicator -->
            <path d="M 405 180 A 75 75 0 0 0 350 180" fill="none" stroke="#888" stroke-width="1.5" marker-end="url(#arrow-black)"/>
            <text x="375" y="170" font-size="12" font-style="italic" fill="#888" class="math">ω</text>

            <!-- Rotating Phasors -->
            <g class="anim-phasor">
                <!-- Voltage Phasor -->
                <line x1="380" y1="250" x2="460" y2="250" stroke="var(--color-v)" stroke-width="3" marker-end="url(#arrow-red)"/>
                <!-- Current Phasor -->
                <line x1="380" y1="250" x2="430" y2="250" stroke="var(--color-i)" stroke-width="3" marker-end="url(#arrow-blue)"/>
                
                <!-- Labels (Counter-rotating to stay upright) -->
                <g class="anim-counter-v">
                    <text x="465" y="255" font-size="14" font-weight="600" fill="var(--color-v)" class="math">V_m</text>
                </g>
                <g class="anim-counter-i">
                    <text x="420" y="235" font-size="14" font-weight="600" fill="var(--color-i)" class="math">I_m</text>
                </g>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- PANEL C: WAVEFORM PLOT                     -->
        <!-- ========================================== -->
        <g id="panel-waveform" transform="translate(520, 250)">
            <!-- Grid and Axes -->
            <line x1="0" y1="0" x2="250" y2="0" stroke="#ccc"/>
            <line x1="0" y1="-120" x2="0" y2="120" stroke="#ccc"/>
            
            <!-- Axis Labels -->
            <text x="-15" y="-110" font-size="12" fill="#888">Amplitude</text>
            <text x="245" y="15" font-size="12" fill="#888" class="math">ωt</text>
            
            <!-- Ticks -->
            <line x1="120" y1="-3" x2="120" y2="3" stroke="#888"/>
            <text x="120" y="15" text-anchor="middle" font-size="12" fill="#888" class="math">π</text>
            <line x1="240" y1="-3" x2="240" y2="3" stroke="#888"/>
            <text x="240" y="15" text-anchor="middle" font-size="12" fill="#888" class="math">2π</text>

            <!-- RMS Lines -->
            <line x1="0" y1="-56.56" x2="240" y2="-56.56" stroke="var(--color-v)" stroke-dasharray="3 3" opacity="0.4"/>
            <text x="245" y="-53" font-size="10" fill="var(--color-v)" class="math">V_rms</text>

            <!-- Pre-drawn Sine Waves (Revealed by Mask) -->
            <g mask="url(#wave-mask)">
                <!-- Voltage Wave (Amplitude 80) -->
                <polyline points="0,0 10,-20.7 20,-40.0 30,-56.6 40,-69.3 50,-77.3 60,-80.0 70,-77.3 80,-69.3 90,-56.6 100,-40.0 110,-20.7 120,0 130,20.7 140,40.0 150,56.6 160,69.3 170,77.3 180,80.0 190,77.3 200,69.3 210,56.6 220,40.0 230,20.7 240,0" fill="none" stroke="var(--color-v)" stroke-width="3" stroke-linejoin="round"/>
                
                <!-- Current Wave (Amplitude 50) -->
                <polyline points="0,0 10,-12.9 20,-25.0 30,-35.4 40,-43.3 50,-48.3 60,-50.0 70,-48.3 80,-43.3 90,-35.4 100,-25.0 110,-12.9 120,0 130,12.9 140,25.0 150,35.4 160,43.3 170,48.3 180,50.0 190,48.3 200,43.3 210,35.4 220,25.0 230,12.9 240,0" fill="none" stroke="var(--color-i)" stroke-width="3" stroke-linejoin="round"/>
            </g>

            <!-- Scanning Indicator -->
            <g class="anim-scan-x">
                <!-- Vertical Scanning Line -->
                <line x1="0" y1="-100" x2="0" y2="100" stroke="#555" stroke-width="1" stroke-dasharray="4 4"/>
                
                <!-- Tracking Dots -->
                <circle cx="0" cy="0" r="5" fill="var(--color-v)" class="anim-dot-v"/>
                <circle cx="0" cy="0" r="4" fill="var(--color-i)" class="anim-dot-i"/>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND & EQUATIONS                         -->
        <!-- ========================================== -->
        <rect x="230" y="440" width="340" height="40" fill="white" rx="6" stroke="#e0e0e0"/>
        
        <rect x="250" y="454" width="12" height="12" fill="var(--color-v)" rx="2"/>
        <text x="270" y="465" font-size="14" fill="var(--color-v)" class="math">v = V_m sin(ωt)</text>
        
        <rect x="420" y="454" width="12" height="12" fill="var(--color-i)" rx="2"/>
        <text x="440" y="465" font-size="14" fill="var(--color-i)" class="math">i = I_m sin(ωt)</text>

    </svg>

    <!-- Interactive Controls -->
    <div class="controls">
        <button id="playPauseBtn">Pause Animation</button>
    </div>
</div>

<script>
    const btn = document.getElementById('playPauseBtn');
    const container = document.getElementById('animation-container');
    let isPlaying = true;

    btn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            container.classList.remove('paused');
            btn.textContent = 'Pause Animation';
        } else {
            container.classList.add('paused');
            btn.textContent = 'Play Animation';
        }
    });
</script>

</body>
</html>
