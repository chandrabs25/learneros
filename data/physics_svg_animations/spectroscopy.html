<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Spectroscopy Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 600; fill: #495057; }
        .math { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .label { font-family: 'Roboto Mono', monospace; font-size: 12px; fill: #6c757d; }

        /* Animations */
        .nucleus {
            animation: pulse 2s infinite ease-in-out;
            transform-origin: 0 0;
        }

        .electron {
            animation: electron-jump 10s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        .photon-in {
            animation: photon-in-anim 10s infinite linear;
        }

        .photon-out {
            animation: photon-out-anim 10s infinite linear;
        }

        .abs-line {
            animation: abs-line-anim 10s infinite;
        }

        .em-line {
            animation: em-line-anim 10s infinite;
        }

        /* Keyframes */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes electron-jump {
            0%, 14% { transform: translateY(0); }
            16%, 49% { transform: translateY(-90px); }
            51%, 100% { transform: translateY(0); }
        }

        @keyframes photon-in-anim {
            0% { transform: translate(40px, 240px); opacity: 0; }
            2% { opacity: 1; }
            15% { transform: translate(140px, 240px); opacity: 1; }
            15.1%, 100% { opacity: 0; }
        }

        @keyframes photon-out-anim {
            0%, 49.9% { transform: translate(200px, 150px); opacity: 0; }
            50% { opacity: 1; }
            65% { transform: translate(300px, 150px); opacity: 1; }
            66%, 100% { opacity: 0; }
        }

        @keyframes abs-line-anim {
            0%, 14.9% { opacity: 0; }
            15%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes em-line-anim {
            0%, 49.9% { opacity: 0; }
            50%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Quantum Mechanics of Spectroscopy</title>
        <desc>Animation showing an electron absorbing a photon, jumping to a higher energy level, and then emitting a photon as it drops back down, creating absorption and emission spectral lines.</desc>

        <defs>
            <!-- Glow Filters -->
            <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="glow-purple" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrowheads -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Rainbow Gradient for Continuous Spectrum -->
            <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#7209B7" /> <!-- Violet -->
                <stop offset="20%" stop-color="#4361EE" /> <!-- Blue -->
                <stop offset="40%" stop-color="#06D6A0" /> <!-- Green -->
                <stop offset="60%" stop-color="#FFD166" /> <!-- Yellow -->
                <stop offset="80%" stop-color="#F77F00" /> <!-- Orange -->
                <stop offset="100%" stop-color="#EF476F" /> <!-- Red -->
            </linearGradient>

            <!-- Photon Wave Packet Path -->
            <path id="wave" d="M 0 0 Q 5 -15 10 0 T 20 0 T 30 0 T 40 0 T 50 0 T 60 0" fill="none" stroke-width="2.5" />
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="400" y="40" class="title" text-anchor="middle">Atomic Spectroscopy: E = hν</text>
        <text x="400" y="65" class="subtitle" text-anchor="middle" fill="#6c757d">Absorption and Emission of Photons</text>

        <!-- ================= ATOMIC TRANSITION ZONE ================= -->
        <g id="atom-zone" transform="translate(200, 280)">
            <!-- Energy Levels (Orbits) -->
            <circle cx="0" cy="0" r="40" fill="none" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5" />
            <circle cx="0" cy="0" r="80" fill="none" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5" />
            <circle cx="0" cy="0" r="130" fill="none" stroke="#adb5bd" stroke-dasharray="4 4" stroke-width="1.5" />
            
            <!-- Nucleus -->
            <circle cx="0" cy="0" r="10" fill="#212529" class="nucleus" />
            
            <!-- Orbit Labels -->
            <text x="0" y="55" class="label" text-anchor="middle">n=1 (Ground)</text>
            <text x="0" y="95" class="label" text-anchor="middle">n=2</text>
            <text x="0" y="145" class="label" text-anchor="middle">n=3 (Excited)</text>

            <!-- Energy Gap Indicator -->
            <path d="M -20 -40 L -30 -40 L -30 -130 L -20 -130" fill="none" stroke="#06D6A0" stroke-width="2" opacity="0.8"/>
            <text x="-38" y="-85" class="math" font-size="14" fill="#06D6A0" text-anchor="end" dominant-baseline="middle">ΔE</text>
        </g>

        <!-- Electron -->
        <!-- Placed at n=1 top (200, 240). Jumps to n=3 top (200, 150) -->
        <circle cx="200" cy="240" r="7" fill="#4361EE" filter="url(#glow-blue)" class="electron" />

        <!-- Photons -->
        <!-- Absorption Photon (Orange) -->
        <g class="photon-in">
            <use href="#wave" stroke="#F77F00" marker-end="url(#arrow-orange)" />
            <text x="30" y="-20" class="math" font-size="14" fill="#F77F00" text-anchor="middle">hν</text>
        </g>

        <!-- Emission Photon (Purple) -->
        <g class="photon-out">
            <use href="#wave" stroke="#7209B7" marker-end="url(#arrow-purple)" />
            <text x="30" y="-20" class="math" font-size="14" fill="#7209B7" text-anchor="middle">hν</text>
        </g>

        <!-- ================= SPECTRAL OUTPUT ZONE ================= -->
        <g id="spectra-zone" transform="translate(450, 140)">
            
            <!-- Absorption Spectrum -->
            <text x="150" y="-10" class="subtitle" text-anchor="middle">Absorption Spectrum</text>
            <rect x="0" y="0" width="300" height="40" fill="url(#rainbow)" rx="4" />
            <!-- Dark Absorption Line (at 10% width = 30px, Violet/Purple region) -->
            <line x1="30" y1="0" x2="30" y2="40" stroke="#111" stroke-width="4" class="abs-line" />
            
            <!-- Emission Spectrum -->
            <text x="150" y="90" class="subtitle" text-anchor="middle">Emission Spectrum</text>
            <rect x="0" y="100" width="300" height="40" fill="#111" rx="4" />
            <!-- Bright Emission Line -->
            <line x1="30" y1="100" x2="30" y2="140" stroke="#7209B7" stroke-width="4" class="em-line" filter="url(#glow-purple)" />
            
            <!-- Wavelength Scale -->
            <path d="M 0 145 v 5 M 75 145 v 5 M 150 145 v 5 M 225 145 v 5 M 300 145 v 5" stroke="#adb5bd" stroke-width="1.5" fill="none"/>
            <line x1="0" y1="147.5" x2="300" y2="147.5" stroke="#adb5bd" stroke-width="1.5" />
            <text x="0" y="165" class="label" text-anchor="middle">400nm</text>
            <text x="300" y="165" class="label" text-anchor="middle">700nm</text>
            <text x="150" y="165" class="label" text-anchor="middle">Wavelength (λ)</text>
        </g>

        <!-- ================= EQUATIONS & LEGEND ================= -->
        <g id="equations" transform="translate(450, 350)">
            <rect x="0" y="0" width="300" height="90" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5" rx="8" />
            <text x="150" y="35" class="math" font-size="18" fill="#212529" text-anchor="middle">ΔE = E<tspan dy="4" font-size="12">3</tspan><tspan dy="-4"> - E</tspan><tspan dy="4" font-size="12">1</tspan></text>
            <text x="150" y="70" class="math" font-size="18" fill="#212529" text-anchor="middle">E = hc / λ</text>
        </g>

        <g id="legend" transform="translate(30, 370)">
            <rect x="0" y="0" width="160" height="70" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1.5" rx="6" />
            
            <circle cx="15" cy="18" r="5" fill="#4361EE" />
            <text x="30" y="22" font-size="12" font-weight="600" fill="#495057">Electron</text>
            
            <line x1="10" y1="38" x2="20" y2="38" stroke="#F77F00" stroke-width="3" />
            <text x="30" y="42" font-size="12" font-weight="600" fill="#495057">Absorption Photon</text>
            
            <line x1="10" y1="55" x2="20" y2="55" stroke="#7209B7" stroke-width="3" />
            <text x="30" y="59" font-size="12" font-weight="600" fill="#495057">Emission Photon</text>
        </g>

    </svg>
</div>

</body>
</html>
