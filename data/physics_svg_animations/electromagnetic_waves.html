<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromagnetic Wave Propagation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            display: block;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            fill: #1a1a1a;
        }

        .subtitle {
            font-size: 16px;
            font-weight: 400;
            fill: #666;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 18px;
            font-weight: 700;
            fill: #1a1a1a;
        }

        .axis-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-style: italic;
            fill: #333;
        }

        .vector-label {
            font-size: 18px;
            font-weight: 600;
        }

        .legend-text {
            font-size: 14px;
            fill: #444;
            font-weight: 600;
        }

        .hint {
            font-size: 14px;
            fill: #888;
            transition: opacity 0.3s;
        }

        /* CSS Animation for Wave Propagation */
        @keyframes propagate {
            0% { transform: translateX(0); }
            100% { transform: translateX(200px); }
        }

        #animated-wave {
            animation: propagate 4s linear infinite;
            will-change: transform;
        }

        svg:hover #animated-wave {
            animation-play-state: paused;
        }

        svg:hover .hint {
            opacity: 0.5;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead for Axes -->
            <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333" />
            </marker>

            <!-- Arrowhead for Electric Field (Orange) -->
            <marker id="arrow-e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>

            <!-- Arrowhead for Magnetic Field (Purple) -->
            <marker id="arrow-b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>

            <!-- Arrowhead for Propagation Vector (Green) -->
            <marker id="arrow-k" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>

            <!-- Glow Filter for Wave Paths -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- 3D Projection Clip Path (Masks the -X half-space behind the YZ plane) -->
            <clipPath id="wave-clip">
                <polygon points="200,-50 200,300 -50,550 -50,650 1050,650 1050,-50" />
            </clipPath>

            <!-- Single Wavelength Template (Lambda = 200px) -->
            <g id="wave-template">
                <!-- Electric Field (E) Path - XY Plane -->
                <path d="M 0,300 q 50,-200 100,0 t 100,0" fill="none" stroke="#F77F00" stroke-width="3" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- Magnetic Field (B) Path - XZ Plane -->
                <path d="M 0,300 q -50,100 100,0 t 100,0" fill="none" stroke="#7209B7" stroke-width="3" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Electric Field Vectors -->
                <line x1="20" y1="300" x2="20" y2="236" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="40" y1="300" x2="40" y2="204" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="60" y1="300" x2="60" y2="204" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="80" y1="300" x2="80" y2="236" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="120" y1="300" x2="120" y2="364" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="140" y1="300" x2="140" y2="396" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="160" y1="300" x2="160" y2="396" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />
                <line x1="180" y1="300" x2="180" y2="364" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-e)" />

                <!-- Magnetic Field Vectors -->
                <line x1="20" y1="300" x2="-12" y2="332" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="40" y1="300" x2="-8" y2="348" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="60" y1="300" x2="12" y2="348" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="80" y1="300" x2="48" y2="332" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="120" y1="300" x2="152" y2="268" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="140" y1="300" x2="188" y2="252" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="160" y1="300" x2="208" y2="252" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
                <line x1="180" y1="300" x2="212" y2="268" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-b)" />
            </g>
        </defs>

        <!-- Typography & UI Overlay -->
        <text x="40" y="50" class="title">Electromagnetic Wave Propagation</text>
        
        <text x="40" y="85" class="subtitle">Speed of Light in Vacuum:</text>
        <text x="255" y="85" class="formula">c = 1 / √(μ<tspan baseline-shift="sub" font-size="0.7em">0</tspan>ε<tspan baseline-shift="sub" font-size="0.7em">0</tspan>)</text>
        
        <text x="40" y="120" class="subtitle">Orthogonality Principle:</text>
        <text x="255" y="120" class="formula" fill="#FF3366">E⃗ ⊥ B⃗ ⊥ k⃗</text>

        <!-- Legend Box -->
        <rect x="740" y="30" width="220" height="110" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
        <line x1="755" y1="55" x2="785" y2="55" stroke="#F77F00" stroke-width="3" />
        <text x="795" y="60" class="legend-text">Electric Field (E⃗)</text>
        <line x1="755" y1="85" x2="785" y2="85" stroke="#7209B7" stroke-width="3" />
        <text x="795" y="90" class="legend-text">Magnetic Field (B⃗)</text>
        <line x1="755" y1="115" x2="785" y2="115" stroke="#06D6A0" stroke-width="3" />
        <text x="795" y="120" class="legend-text">Propagation (k⃗)</text>

        <!-- Coordinate Axes (Drawn behind the wave) -->
        <g id="axes">
            <!-- X-axis (Propagation Direction) -->
            <line x1="200" y1="300" x2="950" y2="300" stroke="#333333" stroke-width="2" marker-end="url(#arrow-axis)" />
            <text x="965" y="295" class="axis-label">x</text>

            <!-- Y-axis (Electric Field Plane) -->
            <line x1="200" y1="300" x2="200" y2="100" stroke="#333333" stroke-width="2" marker-end="url(#arrow-axis)" />
            <text x="180" y="90" class="axis-label">y</text>

            <!-- Z-axis (Magnetic Field Plane - Isometric Projection) -->
            <line x1="200" y1="300" x2="50" y2="450" stroke="#333333" stroke-width="2" marker-end="url(#arrow-axis)" />
            <text x="30" y="470" class="axis-label">z</text>
        </g>

        <!-- Animated Wave Group (Clipped to perfectly emerge from the YZ plane) -->
        <g clip-path="url(#wave-clip)">
            <g id="animated-wave">
                <!-- Replicate the wave template to cover the axis and allow seamless looping -->
                <use href="#wave-template" x="-200" />
                <use href="#wave-template" x="0" />
                <use href="#wave-template" x="200" />
                <use href="#wave-template" x="400" />
                <use href="#wave-template" x="600" />
                <use href="#wave-template" x="800" />
            </g>
        </g>

        <!-- Axis Labels for Fields -->
        <text x="215" y="130" class="vector-label" fill="#F77F00">E⃗</text>
        <text x="80" y="410" class="vector-label" fill="#7209B7">B⃗</text>

        <!-- Propagation Vector (k) -->
        <g transform="translate(650, 150)">
            <line x1="0" y1="0" x2="150" y2="0" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-k)" />
            <text x="75" y="-15" text-anchor="middle" class="vector-label" fill="#06D6A0">Direction of Travel (c)</text>
        </g>

        <!-- Interactive Hint -->
        <text x="500" y="570" text-anchor="middle" class="hint">Hover over the diagram to pause the animation</text>
    </svg>
</div>

</body>
</html>
