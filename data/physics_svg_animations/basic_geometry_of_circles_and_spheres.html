<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry of Spherical Reflection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-main: #212529;
            --text-muted: #6C757D;
            --mirror: #6C757D;
            --incident: #FFD700;
            --reflected: #FF3366;
            --normal: #4361EE;
            --tangent: #ADB5BD;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        .svg-wrapper {
            width: 100%;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            padding: 15px;
            background: var(--bg-color);
            border-radius: 8px;
        }

        button {
            background: var(--normal);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100px;
        }

        button:hover {
            background: #3651c9;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            max-width: 400px;
        }

        input[type=range] {
            flex-grow: 1;
            accent-color: var(--normal);
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        .pulse {
            animation: pulse-anim 2s infinite;
            transform-origin: 400px 230px;
        }

        @keyframes pulse-anim {
            0% { opacity: 0.5; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.5; transform: scale(0.98); }
        }

        .legend {
            font-size: 12px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="svg-wrapper">
        <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
            <defs>
                <!-- Arrowheads -->
                <marker id="arrow-inc" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--incident)" />
                </marker>
                <marker id="arrow-ref" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--reflected)" />
                </marker>
                <marker id="arrow-norm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--normal)" />
                </marker>
                
                <!-- Glow Filter -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Background / Grid -->
            <rect width="800" height="500" fill="#ffffff" />
            
            <!-- Title -->
            <text x="25" y="40" font-size="20" font-weight="700" fill="var(--text-main)">Geometry of Spherical Reflection: The Radial Normal</text>
            <text x="25" y="62" font-size="13" fill="var(--text-muted)">Interactive demonstration of the Law of Reflection on a concave mirror.</text>

            <!-- Legend -->
            <g transform="translate(640, 25)" class="legend">
                <rect x="-10" y="-10" width="150" height="85" fill="#f8f9fa" rx="6" stroke="#e9ecef"/>
                <g transform="translate(0, 5)">
                    <rect class="legend-color" fill="var(--incident)" />
                    <text x="20" y="10" fill="var(--text-main)">Incident Ray</text>
                </g>
                <g transform="translate(0, 25)">
                    <rect class="legend-color" fill="var(--reflected)" />
                    <text x="20" y="10" fill="var(--text-main)">Reflected Ray</text>
                </g>
                <g transform="translate(0, 45)">
                    <rect class="legend-color" fill="var(--normal)" />
                    <text x="20" y="10" fill="var(--text-main)">Radial Normal</text>
                </g>
            </g>

            <!-- Principal Axis -->
            <line x1="30" y1="250" x2="770" y2="250" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="6,4" />
            <text x="710" y="240" font-size="12" fill="var(--text-muted)" font-style="italic">Principal Axis</text>

            <!-- Mirror Surface -->
            <!-- Arc centered at (400,250), R=200. From angle -72 deg to +72 deg -->
            <path id="mirror-arc" d="M 461.8 59.8 A 200 200 0 0 0 461.8 440.2" fill="none" stroke="var(--mirror)" stroke-width="6" stroke-linecap="round" />
            
            <!-- Dynamic Elements -->
            <g id="dynamic-group">
                <!-- Angle Arcs -->
                <path id="arc-i" fill="var(--incident)" fill-opacity="0.2" stroke="var(--incident)" stroke-width="1.5" />
                <path id="arc-r" fill="var(--reflected)" fill-opacity="0.2" stroke="var(--reflected)" stroke-width="1.5" />

                <!-- Tangent Line -->
                <line id="tan-line" stroke="var(--tangent)" stroke-width="2" />

                <!-- Normal Line -->
                <line id="norm-line" stroke="var(--normal)" stroke-width="2" stroke-dasharray="5,5" />

                <!-- Rays -->
                <line id="ray-inc" stroke="var(--incident)" stroke-width="3" />
                <line id="ray-ref" stroke="var(--reflected)" stroke-width="3" />

                <!-- Custom Arrowheads (updated via JS for precise positioning) -->
                <polygon id="poly-inc" points="-6,-4 6,0 -6,4" fill="var(--incident)" />
                <polygon id="poly-ref" points="-6,-4 6,0 -6,4" fill="var(--reflected)" />
                <polygon id="poly-norm" points="-5,-4 5,0 -5,4" fill="var(--normal)" />

                <!-- Angle Labels -->
                <text id="label-i" class="math-text" font-size="14" fill="#d49a00" text-anchor="middle" dominant-baseline="middle">θi</text>
                <text id="label-r" class="math-text" font-size="14" fill="var(--reflected)" text-anchor="middle" dominant-baseline="middle">θr</text>

                <!-- Point P -->
                <circle id="point-p" r="5" fill="#212529" />
                <text id="label-p" font-size="14" font-weight="600" fill="#212529">P</text>
            </g>

            <!-- Static Points -->
            <circle cx="400" cy="250" r="5" fill="#212529" />
            <text x="395" y="270" font-size="14" font-weight="600" fill="#212529" text-anchor="end">C</text>
            
            <circle cx="500" cy="250" r="4" fill="#212529" />
            <text x="495" y="270" font-size="14" font-weight="600" fill="#212529" text-anchor="end">F</text>

            <circle cx="600" cy="250" r="4" fill="#212529" />
            <text x="610" y="270" font-size="14" font-weight="600" fill="#212529">V</text>

            <!-- Pulse Text -->
            <text x="400" y="225" font-size="12" fill="var(--normal)" font-weight="600" text-anchor="middle" class="pulse">Normal passes through C</text>

            <!-- Formula Overlay Box -->
            <g transform="translate(560, 360)">
                <rect x="0" y="0" width="210" height="110" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2" filter="url(#glow)"/>
                <text x="15" y="25" font-size="13" font-weight="700" fill="var(--text-main)">Geometric Principles:</text>
                
                <text x="15" y="50" font-size="13" class="math-text" fill="var(--text-main)">
                    <tspan fill="var(--incident)">∠θi</tspan> = <tspan fill="var(--reflected)">∠θr</tspan>
                </text>
                
                <text x="15" y="75" font-size="13" class="math-text" fill="var(--text-main)">
                    <tspan fill="var(--normal)">n⃗</tspan> ⊥ Tangent
                </text>

                <text x="15" y="95" font-size="10" fill="var(--text-muted)">* Rays far from axis show</text>
                <text x="22" y="107" font-size="10" fill="var(--text-muted)">spherical aberration.</text>
            </g>
        </svg>
    </div>

    <div class="controls">
        <button id="play-btn">Pause</button>
        <div class="slider-container">
            <label for="y-slider" style="font-size: 14px; font-weight: 600;">Ray Height:</label>
            <input type="range" id="y-slider" min="70" max="430" value="70" step="1">
        </div>
    </div>
</div>

<script>
    const R = 200;
    const cx = 400;
    const cy = 250;

    const rayInc = document.getElementById('ray-inc');
    const rayRef = document.getElementById('ray-ref');
    const normLine = document.getElementById('norm-line');
    const tanLine = document.getElementById('tan-line');
    const pointP = document.getElementById('point-p');
    const arcI = document.getElementById('arc-i');
    const arcR = document.getElementById('arc-r');
    const labelI = document.getElementById('label-i');
    const labelR = document.getElementById('label-r');
    const labelP = document.getElementById('label-p');
    
    const polyInc = document.getElementById('poly-inc');
    const polyRef = document.getElementById('poly-ref');
    const polyNorm = document.getElementById('poly-norm');

    const ySlider = document.getElementById('y-slider');
    const playBtn = document.getElementById('play-btn');

    let isPlaying = true;
    let animationTime = 0;
    let lastTime = performance.now();

    function updateArrow(el, x, y, angleRad) {
        const deg = angleRad * 180 / Math.PI;
        el.setAttribute('transform', `translate(${x}, ${y}) rotate(${deg})`);
    }

    function updateGeometry(y) {
        // Clamp y to stay within the mirror arc
        y = Math.max(cy - R + 10, Math.min(cy + R - 10, y));
        
        let dy = y - cy;
        let dx = Math.sqrt(R*R - dy*dy);
        let px = cx + dx;
        let py = y;
        
        let alpha = Math.atan2(dy, dx); // Angle of normal from C
        
        // 1. Incident Ray (comes from x=30)
        rayInc.setAttribute('x1', '30');
        rayInc.setAttribute('y1', py);
        rayInc.setAttribute('x2', px);
        rayInc.setAttribute('y2', py);
        updateArrow(polyInc, px - 60, py, 0);
        
        // 2. Normal Line (from C through P, extended)
        let nx = cx + 260 * Math.cos(alpha);
        let ny = cy + 260 * Math.sin(alpha);
        normLine.setAttribute('x1', cx);
        normLine.setAttribute('y1', cy);
        normLine.setAttribute('x2', nx);
        normLine.setAttribute('y2', ny);
        updateArrow(polyNorm, cx + 240 * Math.cos(alpha), cy + 240 * Math.sin(alpha), alpha);
        
        // 3. Tangent Line (perpendicular to normal at P)
        let tanLen = 80;
        let tx1 = px - tanLen * Math.sin(alpha);
        let ty1 = py + tanLen * Math.cos(alpha);
        let tx2 = px + tanLen * Math.sin(alpha);
        let ty2 = py - tanLen * Math.cos(alpha);
        tanLine.setAttribute('x1', tx1);
        tanLine.setAttribute('y1', ty1);
        tanLine.setAttribute('x2', tx2);
        tanLine.setAttribute('y2', ty2);
        
        // 4. Reflected Ray
        let refAngle = Math.PI + 2 * alpha;
        let rx = px + 800 * Math.cos(refAngle);
        let ry = py + 800 * Math.sin(refAngle);
        rayRef.setAttribute('x1', px);
        rayRef.setAttribute('y1', py);
        rayRef.setAttribute('x2', rx);
        rayRef.setAttribute('y2', ry);
        updateArrow(polyRef, px + 120 * Math.cos(refAngle), py + 120 * Math.sin(refAngle), refAngle);
        
        // 5. Point P and Label
        pointP.setAttribute('cx', px);
        pointP.setAttribute('cy', py);
        labelP.setAttribute('x', px + 15);
        labelP.setAttribute('y', py - 15);
        
        // 6. Angles and Arcs
        let ra = 45; // Arc radius
        let sweep = alpha > 0 ? 1 : 0;
        
        if (Math.abs(alpha) < 0.02) {
            // Hide arcs when ray is on the principal axis
            arcI.setAttribute('d', '');
            arcR.setAttribute('d', '');
            labelI.setAttribute('opacity', '0');
            labelR.setAttribute('opacity', '0');
        } else {
            labelI.setAttribute('opacity', '1');
            labelR.setAttribute('opacity', '1');
            
            // Incident Arc (from PI to PI+alpha)
            let ia1x = px - ra;
            let ia1y = py;
            let ia2x = px - ra * Math.cos(alpha);
            let ia2y = py - ra * Math.sin(alpha);
            arcI.setAttribute('d', `M ${ia1x} ${ia1y} A ${ra} ${ra} 0 0 ${sweep} ${ia2x} ${ia2y}`);
            
            // Reflected Arc (from PI+alpha to PI+2*alpha)
            let ra3x = px - ra * Math.cos(2*alpha);
            let ra3y = py - ra * Math.sin(2*alpha);
            arcR.setAttribute('d', `M ${ia2x} ${ia2y} A ${ra} ${ra} 0 0 ${sweep} ${ra3x} ${ra3y}`);
            
            // Position Angle Labels
            let rt = 65; // Text radius
            let tiAngle = Math.PI + alpha/2;
            let trAngle = Math.PI + 1.5*alpha;
            
            labelI.setAttribute('x', px + rt * Math.cos(tiAngle));
            labelI.setAttribute('y', py + rt * Math.sin(tiAngle) + 2);
            labelR.setAttribute('x', px + rt * Math.cos(trAngle));
            labelR.setAttribute('y', py + rt * Math.sin(trAngle) + 2);
        }
    }

    // Easing function for smooth scanning
    function easeInOut(t) {
        return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    }

    // Inverse easing to sync time when slider is manually moved
    function invEaseInOut(v) {
        if (v < 0.5) return Math.sqrt(v / 2);
        return 1 - Math.sqrt((1 - v) / 2);
    }

    function calculateYFromTime(t) {
        let y = 250;
        if (t < 3500) {
            let p = t / 3500;
            y = 70 + 180 * easeInOut(p);
        } else if (t < 4500) {
            y = 250; // Pause at axis
        } else if (t < 8000) {
            let p = (t - 4500) / 3500;
            y = 250 + 180 * easeInOut(p);
        } else {
            let p = (t - 8000) / 1000;
            y = 430 - 360 * easeInOut(p); // Fast return
        }
        return y;
    }

    function syncTimeFromY(y) {
        if (y <= 250) {
            let p = (y - 70) / 180;
            animationTime = invEaseInOut(p) * 3500;
        } else {
            let p = (y - 250) / 180;
            animationTime = 4500 + invEaseInOut(p) * 3500;
        }
    }

    function loop(now) {
        let dt = now - lastTime;
        lastTime = now;

        if (isPlaying) {
            animationTime = (animationTime + dt) % 9000;
            let y = calculateYFromTime(animationTime);
            ySlider.value = y;
            updateGeometry(y);
        }

        requestAnimationFrame(loop);
    }

    // Event Listeners
    ySlider.addEventListener('input', (e) => {
        isPlaying = false;
        playBtn.textContent = 'Play';
        updateGeometry(parseFloat(e.target.value));
    });

    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        playBtn.textContent = isPlaying ? 'Pause' : 'Play';
        if (isPlaying) {
            lastTime = performance.now();
            syncTimeFromY(parseFloat(ySlider.value));
        }
    });

    // Initialize
    updateGeometry(70);
    requestAnimationFrame(loop);

</script>
</body>
</html>
