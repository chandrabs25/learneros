<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Shell Theorem: Gravitational Intensity of a Spherical Shell</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        button {
            background-color: #212529;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #495057;
        }
        
        /* Typography */
        .title { font-size: 20px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .math { font-family: 'Roboto Mono', monospace; font-size: 16px; fill: #212529; }
        .math-bold { font-family: 'Roboto Mono', monospace; font-weight: 700; }
        .label { font-size: 14px; fill: #495057; }
        .legend-text { font-size: 12px; fill: #495057; }
        
        /* Animations */
        svg.paused * {
            animation-play-state: paused !important;
        }

        .mass-group {
            animation: moveMass 12s linear infinite;
        }
        @keyframes moveMass {
            0% { transform: translateX(620px) translateY(250px); opacity: 1; }
            8.33% { transform: translateX(572px) translateY(250px); }
            16.67% { transform: translateX(524px) translateY(250px); }
            25% { transform: translateX(476px) translateY(250px); }
            33.33% { transform: translateX(428px) translateY(250px); }
            41.66% { transform: translateX(380px) translateY(250px); }
            62.5% { transform: translateX(300px) translateY(250px); }
            75% { transform: translateX(220px) translateY(250px); }
            83.33% { transform: translateX(180px) translateY(250px); }
            91.67% { transform: translateX(140px) translateY(250px); }
            95% { opacity: 1; }
            100% { transform: translateX(100px) translateY(250px); opacity: 0; }
        }

        .force-line {
            transform-origin: 0 0;
            animation: scaleForceLine 12s linear infinite;
        }
        @keyframes scaleForceLine {
            0% { transform: scaleX(10); opacity: 1; }
            8.33% { transform: scaleX(13.84); }
            16.67% { transform: scaleX(20.4); }
            25% { transform: scaleX(33.06); }
            33.33% { transform: scaleX(62.5); }
            41.66% { transform: scaleX(160); opacity: 1; }
            41.67% { transform: scaleX(0); opacity: 0; }
            75% { transform: scaleX(0); opacity: 0; }
            75.01% { transform: scaleX(-160); opacity: 1; }
            83.33% { transform: scaleX(-71.1); }
            91.67% { transform: scaleX(-40); }
            95% { opacity: 1; }
            100% { transform: scaleX(-25.6); opacity: 0; }
        }

        .force-arrow {
            transform-origin: 0 0;
            animation: moveForceArrow 12s linear infinite;
        }
        @keyframes moveForceArrow {
            0% { transform: translateX(-10px) rotate(0deg); opacity: 1; }
            8.33% { transform: translateX(-13.84px) rotate(0deg); }
            16.67% { transform: translateX(-20.4px) rotate(0deg); }
            25% { transform: translateX(-33.06px) rotate(0deg); }
            33.33% { transform: translateX(-62.5px) rotate(0deg); }
            41.66% { transform: translateX(-160px) rotate(0deg); opacity: 1; }
            41.67% { transform: translateX(0px) rotate(0deg); opacity: 0; }
            75% { transform: translateX(0px) rotate(180deg); opacity: 0; }
            75.01% { transform: translateX(160px) rotate(180deg); opacity: 1; }
            83.33% { transform: translateX(71.1px) rotate(180deg); }
            91.67% { transform: translateX(40px) rotate(180deg); }
            95% { opacity: 1; }
            100% { transform: translateX(25.6px) rotate(180deg); opacity: 0; }
        }

        .r-line {
            transform-origin: 300px 250px;
            animation: scaleRLine 12s linear infinite;
        }
        @keyframes scaleRLine {
            0% { transform: scaleX(320); opacity: 1; }
            8.33% { transform: scaleX(272); }
            16.67% { transform: scaleX(224); }
            25% { transform: scaleX(176); }
            33.33% { transform: scaleX(128); }
            41.66% { transform: scaleX(80); }
            62.5% { transform: scaleX(0); }
            75% { transform: scaleX(-80); }
            83.33% { transform: scaleX(-120); }
            91.67% { transform: scaleX(-160); }
            95% { opacity: 1; }
            100% { transform: scaleX(-200); opacity: 0; }
        }

        .r-label {
            animation: moveRLabel 12s linear infinite;
        }
        @keyframes moveRLabel {
            0% { transform: translateX(460px); opacity: 1; }
            8.33% { transform: translateX(436px); }
            16.67% { transform: translateX(412px); }
            25% { transform: translateX(388px); }
            33.33% { transform: translateX(364px); }
            41.66% { transform: translateX(340px); }
            62.5% { transform: translateX(300px); }
            75% { transform: translateX(260px); }
            83.33% { transform: translateX(240px); }
            91.67% { transform: translateX(220px); }
            95% { opacity: 1; }
            100% { transform: translateX(200px); opacity: 0; }
        }

        .graph-point {
            animation: moveGraphPoint 12s linear infinite;
        }
        @keyframes moveGraphPoint {
            0% { transform: translate(750px, 445px); opacity: 1; }
            8.33% { transform: translate(720px, 443.08px); }
            16.67% { transform: translate(690px, 439.8px); }
            25% { transform: translate(660px, 433.47px); }
            33.33% { transform: translate(630px, 418.75px); }
            41.66% { transform: translate(600px, 370px); }
            41.67% { transform: translate(600px, 450px); }
            62.5% { transform: translate(550px, 450px); }
            75% { transform: translate(600px, 450px); }
            75.01% { transform: translate(600px, 370px); }
            83.33% { transform: translate(625px, 414.45px); }
            91.67% { transform: translate(650px, 430px); }
            95% { opacity: 1; }
            100% { transform: translate(675px, 437.2px); opacity: 0; }
        }

        .flash {
            animation: shellFlash 12s linear infinite;
        }
        @keyframes shellFlash {
            0%, 40% { opacity: 0; stroke-width: 4px; }
            41.66% { opacity: 1; stroke-width: 10px; }
            45%, 73% { opacity: 0; stroke-width: 4px; }
            75% { opacity: 1; stroke-width: 10px; }
            78%, 100% { opacity: 0; stroke-width: 4px; }
        }

        .formula-outside {
            animation: toggleFormula1 12s linear infinite;
        }
        @keyframes toggleFormula1 {
            0%, 41.66% { opacity: 1; }
            41.67%, 75% { opacity: 0; }
            75.01%, 100% { opacity: 1; }
        }

        .formula-inside {
            animation: toggleFormula2 12s linear infinite;
        }
        @keyframes toggleFormula2 {
            0%, 41.66% { opacity: 0; }
            41.67%, 75% { opacity: 1; }
            75.01%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <button id="playPauseBtn">Pause</button>
    </div>
    
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Shell Theorem: Gravitational Intensity of a Spherical Shell</title>
        <desc>An animation showing a test mass moving through a spherical shell. The gravitational force follows the inverse-square law outside the shell and drops to zero inside.</desc>
        
        <defs>
            <marker id="cyan-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#00B4D8" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" class="title">Gravitational Field: Uniform Spherical Shell</text>

        <!-- Dynamic Formulas -->
        <g class="formula-outside">
            <text x="40" y="85" class="math math-bold" font-size="18">F = </text>
            <text x="85" y="75" class="math">GMm</text>
            <line x1="80" y1="82" x2="120" y2="82" stroke="#212529" stroke-width="2"/>
            <text x="90" y="98" class="math">r²</text>
        </g>
        <g class="formula-inside">
            <text x="40" y="85" class="math math-bold" font-size="18">F = 0</text>
            <text x="40" y="105" class="label" fill="#FF3366" font-style="italic">(Inside Shell)</text>
        </g>

        <!-- Legend -->
        <g transform="translate(20, 390)">
            <rect width="180" height="90" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1" />
            <line x1="15" y1="20" x2="45" y2="20" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4,4" />
            <text x="55" y="24" class="legend-text">Gravitational Field</text>
            
            <line x1="15" y1="45" x2="35" y2="45" stroke="#FF3366" stroke-width="3" />
            <polygon points="35,45 45,41 45,49" fill="#FF3366" />
            <text x="55" y="49" class="legend-text">Gravitational Force</text>
            
            <circle cx="30" cy="70" r="6" fill="#e9ecef" stroke="#495057" stroke-width="2" />
            <text x="55" y="74" class="legend-text">Spherical Shell</text>
        </g>

        <!-- Live Graph (g vs r) -->
        <g transform="translate(0, 0)">
            <!-- Axes -->
            <path d="M 550 340 L 550 450 L 760 450" fill="none" stroke="#212529" stroke-width="2" />
            <text x="540" y="335" class="math">g</text>
            <text x="765" y="455" class="math">r</text>
            
            <!-- Tick Marks -->
            <line x1="600" y1="450" x2="600" y2="455" stroke="#212529" stroke-width="2" />
            <text x="600" y="470" class="math" font-size="12" text-anchor="middle">R</text>
            
            <line x1="650" y1="450" x2="650" y2="455" stroke="#212529" stroke-width="2" />
            <text x="650" y="470" class="math" font-size="12" text-anchor="middle">2R</text>
            
            <line x1="700" y1="450" x2="700" y2="455" stroke="#212529" stroke-width="2" />
            <text x="700" y="470" class="math" font-size="12" text-anchor="middle">3R</text>
            
            <line x1="750" y1="450" x2="750" y2="455" stroke="#212529" stroke-width="2" />
            <text x="750" y="470" class="math" font-size="12" text-anchor="middle">4R</text>

            <!-- Static Graph Curve Background -->
            <!-- Inside Shell (g=0) -->
            <line x1="550" y1="450" x2="600" y2="450" stroke="#00B4D8" stroke-width="3" />
            <!-- Discontinuity Drop -->
            <line x1="600" y1="370" x2="600" y2="450" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
            <!-- Outside Shell (1/r^2) -->
            <path d="M 600 370 L 605 383.9 L 610 394.4 L 615 402.6 L 620 409.2 L 625 414.5 L 630 418.8 L 640 425.3 L 650 430 L 675 437.2 L 700 441.1 L 750 445" fill="none" stroke="#00B4D8" stroke-width="2" stroke-dasharray="4,4" opacity="0.5" />
        </g>

        <!-- Gravitational Field Lines (Static, Outside Shell) -->
        <g transform="translate(300, 250)" stroke="#00B4D8" stroke-width="2" stroke-dasharray="6,6" opacity="0.6">
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(22.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(67.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(112.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(157.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(202.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(247.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(292.5)" marker-end="url(#cyan-arrow)" />
            <line x1="320" y1="0" x2="90" y2="0" transform="rotate(337.5)" marker-end="url(#cyan-arrow)" />
        </g>

        <!-- Spherical Shell -->
        <circle cx="300" cy="250" r="80" fill="#ced4da" fill-opacity="0.3" stroke="#495057" stroke-width="4" />
        <!-- Shell Flash Effect -->
        <circle cx="300" cy="250" r="80" fill="none" stroke="#FF3366" class="flash" />
        <text x="300" y="155" class="math math-bold" font-size="18" text-anchor="middle">M</text>

        <!-- Distance Indicator (r) -->
        <line class="r-line" x1="300" y1="250" x2="301" y2="250" stroke="#212529" stroke-width="1" />
        <text class="r-label" y="265" class="math" font-size="14" text-anchor="middle" font-style="italic">r</text>

        <!-- Test Mass and Force Vector Group -->
        <g class="mass-group">
            <!-- Force Vector -->
            <line class="force-line" x1="0" y1="0" x2="-1" y2="0" stroke="#FF3366" stroke-width="3" />
            <polygon class="force-arrow" points="0,0 10,-6 10,6" fill="#FF3366" />
            
            <!-- Mass Particle -->
            <circle cx="0" cy="0" r="6" fill="#1D3557" />
            <text y="-15" class="math math-bold" font-size="16" text-anchor="middle" fill="#1D3557">m</text>
            <text y="-35" class="math" font-size="14" text-anchor="middle" fill="#FF3366">F<tspan dy="5" font-size="10">g</tspan></text>
        </g>

        <!-- Live Graph Point -->
        <circle class="graph-point" cx="0" cy="0" r="5" fill="#00B4D8" stroke="#ffffff" stroke-width="1.5" />

    </svg>
</div>

<script>
    const svg = document.querySelector('svg');
    const btn = document.getElementById('playPauseBtn');
    
    btn.addEventListener('click', () => {
        svg.classList.toggle('paused');
        btn.textContent = svg.classList.contains('paused') ? 'Play' : 'Pause';
    });
</script>

</body>
</html>
