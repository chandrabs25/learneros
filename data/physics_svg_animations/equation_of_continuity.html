<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equation of Continuity Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Streamline Paths for CSS offset-path */
        .sl-1 { offset-path: path('M 0 190 L 250 190 C 300 190, 320 220, 350 220 L 450 220 C 480 220, 500 190, 550 190 L 800 190'); }
        .sl-2 { offset-path: path('M 0 220 L 250 220 C 300 220, 320 235, 350 235 L 450 235 C 480 235, 500 220, 550 220 L 800 220'); }
        .sl-3 { offset-path: path('M 0 250 L 800 250'); }
        .sl-4 { offset-path: path('M 0 280 L 250 280 C 300 280, 320 265, 350 265 L 450 265 C 480 265, 500 280, 550 280 L 800 280'); }
        .sl-5 { offset-path: path('M 0 310 L 250 310 C 300 310, 320 280, 350 280 L 450 280 C 480 280, 500 310, 550 310 L 800 310'); }

        /* 
         * Physics Timing Calculation:
         * v2 = 4 * v1 (since Area ratio is 4:1)
         * Total equivalent distance at v1 = 605px
         * 0% to 41.3% -> Wide section (constant slow v1)
         * 41.3% to 47.9% -> Accelerating transition
         * 47.9% to 52.1% -> Narrow section (constant fast v2)
         * 52.1% to 58.7% -> Decelerating transition
         * 58.7% to 100% -> Wide section (constant slow v1)
         */
        @keyframes flow {
            0% { offset-distance: 0%; animation-timing-function: linear; }
            41.3% { offset-distance: 31.25%; animation-timing-function: ease-in; }
            47.9% { offset-distance: 43.75%; animation-timing-function: linear; }
            52.1% { offset-distance: 56.25%; animation-timing-function: ease-out; }
            58.7% { offset-distance: 68.75%; animation-timing-function: linear; }
            100% { offset-distance: 100%; }
        }

        @keyframes arrow-scale {
            0% { transform: scaleX(1); animation-timing-function: linear; }
            41.3% { transform: scaleX(1); animation-timing-function: ease-in; }
            47.9% { transform: scaleX(4); animation-timing-function: linear; }
            52.1% { transform: scaleX(4); animation-timing-function: ease-out; }
            58.7% { transform: scaleX(1); animation-timing-function: linear; }
            100% { transform: scaleX(1); }
        }

        .particle {
            animation: flow 4s var(--delay) infinite;
            offset-rotate: auto;
            position: absolute;
        }

        .velocity-arrow {
            animation: arrow-scale 4s var(--delay) infinite;
            transform-origin: 4px 0px;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Equation of Continuity</title>
        <desc>An animated diagram showing fluid particles moving through a pipe that narrows. As the cross-sectional area decreases, the velocity of the particles increases to maintain a constant mass flow rate.</desc>

        <defs>
            <!-- Pipe 3D Gradient -->
            <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#DEE2E6" />
                <stop offset="15%" stop-color="#F8F9FA" />
                <stop offset="50%" stop-color="#E9ECEF" />
                <stop offset="85%" stop-color="#CED4DA" />
                <stop offset="100%" stop-color="#ADB5BD" />
            </linearGradient>
        </defs>

        <!-- Background Grid (Subtle) -->
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#E9ECEF" stroke-width="1"/>
        </pattern>
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Title -->
        <text x="400" y="50" text-anchor="middle" font-size="24" font-weight="600" fill="#212529">
            Equation of Continuity: <tspan class="math-text" fill="#4361EE">A₁v₁ = A₂v₂</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(610, 20)">
            <rect x="0" y="0" width="170" height="85" rx="6" fill="#ffffff" stroke="#DEE2E6" stroke-width="1" opacity="0.95" />
            
            <circle cx="15" cy="20" r="4" fill="#4361EE" />
            <text x="28" y="24" font-size="12" fill="#495057">Fluid Particle</text>
            
            <path d="M 10 40 L 20 40 M 17 38 L 20 40 L 17 42" stroke="#06D6A0" stroke-width="2" fill="none" />
            <text x="28" y="44" font-size="12" fill="#495057">Velocity Vector (<tspan class="math-text" font-style="italic">v</tspan>)</text>
            
            <ellipse cx="15" cy="60" rx="6" ry="3" fill="#FF3366" fill-opacity="0.3" stroke="#FF3366" stroke-width="1" />
            <text x="28" y="64" font-size="12" fill="#495057">Cross-section (<tspan class="math-text" font-style="italic">A</tspan>)</text>
        </g>

        <!-- Main Pipe -->
        <path d="M 0 170 L 250 170 C 300 170, 320 210, 350 210 L 450 210 C 480 210, 500 170, 550 170 L 800 170 
                 L 800 330 L 550 330 C 500 330, 480 290, 450 290 L 350 290 C 320 290, 300 330, 250 330 L 0 330 Z" 
              fill="url(#pipeGrad)" stroke="#495057" stroke-width="3" />

        <!-- Streamline Guides (Faint lines showing the flow paths) -->
        <g fill="none" stroke="#4361EE" stroke-width="1" stroke-opacity="0.15">
            <path d="M 0 190 L 250 190 C 300 190, 320 220, 350 220 L 450 220 C 480 220, 500 190, 550 190 L 800 190" />
            <path d="M 0 220 L 250 220 C 300 220, 320 235, 350 235 L 450 235 C 480 235, 500 220, 550 220 L 800 220" />
            <path d="M 0 250 L 800 250" />
            <path d="M 0 280 L 250 280 C 300 280, 320 265, 350 265 L 450 265 C 480 265, 500 280, 550 280 L 800 280" />
            <path d="M 0 310 L 250 310 C 300 310, 320 280, 350 280 L 450 280 C 480 280, 500 310, 550 310 L 800 310" />
        </g>

        <!-- Cross-sectional Areas -->
        <!-- Area 1 (Wide) -->
        <ellipse cx="150" cy="250" rx="20" ry="80" fill="#FF3366" fill-opacity="0.2" stroke="#FF3366" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="150" y="140" text-anchor="middle" class="math-text" font-size="18" font-weight="bold" fill="#FF3366">A₁</text>
        <line x1="150" y1="145" x2="150" y2="170" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="2 2" />

        <!-- Area 2 (Narrow) -->
        <ellipse cx="400" cy="250" rx="10" ry="40" fill="#FF3366" fill-opacity="0.25" stroke="#FF3366" stroke-width="2" stroke-dasharray="4 2"/>
        <text x="400" y="190" text-anchor="middle" class="math-text" font-size="18" font-weight="bold" fill="#FF3366">A₂</text>
        <line x1="400" y1="195" x2="400" y2="210" stroke="#FF3366" stroke-width="1.5" stroke-dasharray="2 2" />

        <!-- Velocity Labels -->
        <!-- v1 Label -->
        <g transform="translate(150, 370)">
            <text x="0" y="0" text-anchor="middle" class="math-text" font-size="18" font-weight="bold" fill="#06D6A0" font-style="italic">v<tspan font-style="normal" font-size="14" dy="4">1</tspan></text>
            <path d="M -6 -18 L 6 -18 L 3 -21 M 6 -18 L 3 -15" stroke="#06D6A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        
        <!-- v2 Label -->
        <g transform="translate(400, 330)">
            <text x="0" y="0" text-anchor="middle" class="math-text" font-size="18" font-weight="bold" fill="#06D6A0" font-style="italic">v<tspan font-style="normal" font-size="14" dy="4">2</tspan></text>
            <path d="M -6 -18 L 6 -18 L 3 -21 M 6 -18 L 3 -15" stroke="#06D6A0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>

        <!-- Particles and Vectors -->
        <!-- Streamline 1 (Top Outer) -->
        <g class="particle sl-1" style="--delay: 0s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-1" style="--delay: -0.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-1" style="--delay: -1.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-1" style="--delay: -2s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-1" style="--delay: -2.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-1" style="--delay: -3.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>

        <!-- Streamline 2 (Top Inner) -->
        <g class="particle sl-2" style="--delay: 0s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-2" style="--delay: -0.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-2" style="--delay: -1.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-2" style="--delay: -2s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-2" style="--delay: -2.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-2" style="--delay: -3.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>

        <!-- Streamline 3 (Center) -->
        <g class="particle sl-3" style="--delay: 0s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-3" style="--delay: -0.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-3" style="--delay: -1.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-3" style="--delay: -2s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-3" style="--delay: -2.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-3" style="--delay: -3.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>

        <!-- Streamline 4 (Bottom Inner) -->
        <g class="particle sl-4" style="--delay: 0s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-4" style="--delay: -0.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-4" style="--delay: -1.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-4" style="--delay: -2s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-4" style="--delay: -2.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-4" style="--delay: -3.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>

        <!-- Streamline 5 (Bottom Outer) -->
        <g class="particle sl-5" style="--delay: 0s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-5" style="--delay: -0.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-5" style="--delay: -1.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-5" style="--delay: -2s;">
            <circle cx="0" cy="0" r="4" fill="#4361EE" />
            <path d="M 4 0 L 12 0 M 9 -2.5 L 12 0 L 9 2.5" class="velocity-arrow" vector-effect="non-scaling-stroke" stroke="#06D6A0" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </g>
        <g class="particle sl-5" style="--delay: -2.667s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>
        <g class="particle sl-5" style="--delay: -3.333s;"><circle cx="0" cy="0" r="4" fill="#4361EE" /></g>

        <!-- Physics Notes / Footer -->
        <rect x="100" y="410" width="600" height="70" rx="8" fill="#E9ECEF" stroke="#CED4DA" stroke-width="1" />
        <text x="400" y="435" text-anchor="middle" font-size="14" fill="#495057">
            For an incompressible fluid, the volume flow rate (<tspan class="math-text" font-weight="bold">ΔV/Δt</tspan>) remains constant.
        </text>
        <text x="400" y="460" text-anchor="middle" font-size="13" fill="#6C757D">
            Electrical Analogy (Drift Velocity): <tspan class="math-text" fill="#7209B7" font-weight="bold">I = nAev_d</tspan>
        </text>

    </svg>
</div>

</body>
</html>
