<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopic Origin of Pressure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        .text-title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 22px; fill: #1D3557; }
        .text-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #1D3557; }
        .text-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #1D3557; }
        .text-math { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; fill: #1D3557; }
        .text-math-small { font-family: 'Roboto Mono', monospace; font-weight: 400; font-size: 12px; fill: #1D3557; }
        
        #gauge-fill {
            transition: height 0.1s linear, y 0.1s linear;
        }
        
        #impact-layer {
            transition: opacity 0.15s ease-in-out;
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Kinetic Theory of Pressure</title>
        <desc>An animation showing gas molecules bouncing inside a container. Collisions with the right wall exert a force, demonstrating the microscopic origin of macroscopic pressure.</desc>

        <defs>
            <!-- Arrowhead for Velocity Vectors -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <!-- Arrowhead for Force Vectors -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
            <!-- Drop Shadow for UI elements -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" class="text-title">Microscopic Origin of Pressure</text>

        <!-- Container -->
        <g id="container">
            <!-- Left, Top, Bottom Walls -->
            <path d="M 500 100 L 50 100 L 50 400 L 500 400" fill="none" stroke="#1D3557" stroke-width="2"/>
            <!-- Target Right Wall -->
            <line x1="500" y1="100" x2="500" y2="400" stroke="#1D3557" stroke-width="6" stroke-linecap="round"/>
            
            <!-- Area Bracket -->
            <path d="M 510 100 L 520 100 L 520 400 L 510 400" fill="none" stroke="#1D3557" stroke-width="2"/>
            <text x="530" y="250" class="text-label" dominant-baseline="middle">Area (A)</text>
        </g>

        <!-- Dynamic Layers -->
        <g id="vectors-layer"></g>
        <g id="particles-layer"></g>
        
        <!-- Focus Particle Halo -->
        <g id="focus-halo-group">
            <circle r="12" fill="none" stroke="#F77F00" stroke-width="2" stroke-dasharray="4 4">
                <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
            </circle>
            <text id="m-label" x="-15" y="-15" font-family="Roboto Mono" font-style="italic" font-size="14" fill="#F77F00" font-weight="bold">m</text>
        </g>

        <!-- Impact Layer (Hidden by default) -->
        <g id="impact-layer" opacity="0">
            <!-- Force Arrow -->
            <line id="impact-force" x1="500" y1="250" x2="570" y2="250" stroke="#FF3366" stroke-width="4" marker-end="url(#arrow-red)"/>
            <!-- Momentum Formula -->
            <text id="impact-text" x="510" y="230" class="text-math" fill="#FF3366">
                Δp = 2mv<tspan dy="3" font-size="0.7em">x</tspan>
            </text>
            <!-- Force Label -->
            <text id="impact-f-text" x="580" y="255" class="text-math" fill="#FF3366">F</text>
        </g>

        <!-- UI Elements -->
        
        <!-- Formula Box -->
        <g transform="translate(600, 70)" filter="url(#shadow)">
            <rect width="160" height="65" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6"/>
            <text x="80" y="28" class="text-math" text-anchor="middle">
                <tspan x="60" dy="0">P = </tspan>
                <tspan x="105" dy="-8">ΣF<tspan font-size="10" dy="4">avg</tspan></tspan>
                <tspan x="105" dy="18">A</tspan>
            </text>
            <line x1="85" y1="33" x2="130" y2="33" stroke="#1D3557" stroke-width="1.5"/>
        </g>

        <!-- Pressure Gauge -->
        <g transform="translate(620, 160)">
            <rect x="0" y="0" width="20" height="180" fill="#e9ecef" stroke="#1D3557" stroke-width="2" rx="4"/>
            <rect id="gauge-fill" x="0" y="180" width="20" height="0" fill="#FF3366" rx="3"/>
            <text x="10" y="200" text-anchor="middle" class="text-label">Pressure</text>
            
            <!-- Tick marks -->
            <line x1="-5" y1="0" x2="0" y2="0" stroke="#1D3557" stroke-width="1"/>
            <line x1="-5" y1="45" x2="0" y2="45" stroke="#1D3557" stroke-width="1"/>
            <line x1="-5" y1="90" x2="0" y2="90" stroke="#1D3557" stroke-width="1"/>
            <line x1="-5" y1="135" x2="0" y2="135" stroke="#1D3557" stroke-width="1"/>
            <line x1="-5" y1="180" x2="0" y2="180" stroke="#1D3557" stroke-width="1"/>
        </g>

        <!-- Legend -->
        <g transform="translate(600, 380)" filter="url(#shadow)">
            <rect width="160" height="80" fill="#ffffff" stroke="#dee2e6" stroke-width="1" rx="6"/>
            
            <circle cx="20" cy="20" r="5" fill="#4361EE"/>
            <text x="35" y="24" class="text-desc">Gas Molecule</text>
            
            <line x1="10" y1="40" x2="25" y2="40" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
            <text x="35" y="44" class="text-desc">Velocity (v)</text>
            
            <line x1="10" y1="60" x2="25" y2="60" stroke="#FF3366" stroke-width="2" marker-end="url(#arrow-red)"/>
            <text x="35" y="64" class="text-desc">Force (F)</text>
        </g>

    </svg>

    <script>
        const numParticles = 12;
        const particles = [];
        const container = { x: 50, y: 100, w: 450, h: 300 };
        const r = 5; 
        const vScale = 0.15; 

        const pLayer = document.getElementById('particles-layer');
        const vLayer = document.getElementById('vectors-layer');
        const pElements = [];
        const vElements = [];

        // Initialize Particles
        for(let i = 0; i < numParticles; i++) {
            particles.push({
                x: container.x + r + Math.random() * (container.w - 2*r),
                y: container.y + r + Math.random() * (container.h - 2*r),
                vx: (Math.random() - 0.5) * 400,
                vy: (Math.random() - 0.5) * 400,
                isFocus: false
            });

            // Minimum speed enforcement to keep things lively
            if(Math.abs(particles[i].vx) < 100) particles[i].vx = 100 * Math.sign(particles[i].vx || 1);
            if(Math.abs(particles[i].vy) < 100) particles[i].vy = 100 * Math.sign(particles[i].vy || 1);

            // Create SVG Elements
            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("r", r);
            circle.setAttribute("fill", "#4361EE");
            pLayer.appendChild(circle);
            pElements.push(circle);

            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("stroke", "#06D6A0");
            line.setAttribute("stroke-width", "2");
            line.setAttribute("marker-end", "url(#arrow-green)");
            vLayer.appendChild(line);
            vElements.push(line);
        }

        // Set initial focus particle
        particles[0].isFocus = true;
        particles[0].vx = Math.abs(particles[0].vx) + 150; // Ensure it moves right

        let lastTime = performance.now();
        let isPaused = false;
        let gaugeValue = 0;

        const gaugeFill = document.getElementById('gauge-fill');
        const impactLayer = document.getElementById('impact-layer');
        const impactForce = document.getElementById('impact-force');
        const impactText = document.getElementById('impact-text');
        const impactFText = document.getElementById('impact-f-text');
        const focusHaloGroup = document.getElementById('focus-halo-group');

        function updateGauge() {
            const maxH = 180;
            const h = (gaugeValue / 100) * maxH;
            gaugeFill.setAttribute("height", h);
            gaugeFill.setAttribute("y", maxH - h);
        }

        function triggerFocusEvent(p) {
            isPaused = true;
            
            // Position impact visuals
            impactForce.setAttribute('y1', p.y);
            impactForce.setAttribute('y2', p.y);
            impactText.setAttribute('y', p.y - 15);
            impactFText.setAttribute('y', p.y + 5);
            
            impactLayer.setAttribute('opacity', '1');
            
            // Spike gauge
            gaugeValue = Math.min(100, gaugeValue + 40);
            updateGauge();

            // Freeze frame for 1 second
            setTimeout(() => {
                impactLayer.setAttribute('opacity', '0');
                p.isFocus = false;
                
                // Pick a new focus particle that is moving towards the right wall
                let candidates = particles.filter(part => part.vx > 50 && part.x < container.x + container.w / 2);
                let newFocus = candidates.length > 0 ? candidates[Math.floor(Math.random() * candidates.length)] : particles[Math.floor(Math.random() * particles.length)];
                
                newFocus.vx = Math.abs(newFocus.vx); // Force it to move right
                newFocus.isFocus = true;
                
                isPaused = false;
                lastTime = performance.now(); // Reset timer
                requestAnimationFrame(update);
            }, 1000);
        }

        function draw() {
            let focusP = null;

            particles.forEach((p, i) => {
                pElements[i].setAttribute("cx", p.x);
                pElements[i].setAttribute("cy", p.y);

                vElements[i].setAttribute("x1", p.x);
                vElements[i].setAttribute("y1", p.y);
                vElements[i].setAttribute("x2", p.x + p.vx * vScale);
                vElements[i].setAttribute("y2", p.y + p.vy * vScale);

                if (p.isFocus) focusP = p;
            });

            if (focusP) {
                focusHaloGroup.setAttribute("transform", `translate(${focusP.x}, ${focusP.y})`);
                focusHaloGroup.setAttribute("opacity", "1");
            } else {
                focusHaloGroup.setAttribute("opacity", "0");
            }
        }

        function update(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05); // Cap dt to prevent tunneling
            lastTime = time;

            // Decay gauge
            gaugeValue = Math.max(0, gaugeValue - 15 * dt);
            updateGauge();

            if (!isPaused) {
                particles.forEach(p => {
                    p.x += p.vx * dt;
                    p.y += p.vy * dt;

                    // Left Wall
                    if (p.x < container.x + r) { 
                        p.x = container.x + r; 
                        p.vx *= -1; 
                    }
                    // Top Wall
                    if (p.y < container.y + r) { 
                        p.y = container.y + r; 
                        p.vy *= -1; 
                    }
                    // Bottom Wall
                    if (p.y > container.y + container.h - r) { 
                        p.y = container.y + container.h - r; 
                        p.vy *= -1; 
                    }
                    // Right Wall (Target)
                    if (p.x > container.x + container.w - r) {
                        p.x = container.x + container.w - r;
                        p.vx *= -1; // Elastic reflection
                        
                        // Add to pressure gauge for any collision
                        gaugeValue = Math.min(100, gaugeValue + 8);
                        
                        if (p.isFocus) {
                            triggerFocusEvent(p);
                        }
                    }
                });
            }
            
            draw();
            
            if (!isPaused) {
                requestAnimationFrame(update);
            }
        }

        // Start animation
        requestAnimationFrame(update);

    </script>
</body>
</html>
