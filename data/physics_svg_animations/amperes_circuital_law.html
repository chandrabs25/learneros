<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ampere-Maxwell Law: Displacement Current</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
        }

        /* Animations */
        .current-particles {
            animation: move-particles 10s linear infinite;
        }

        .e-field, .charge {
            animation: accumulate 10s linear infinite;
        }

        .b-field {
            animation: pulse 10s linear infinite;
        }

        @keyframes move-particles {
            0% { transform: translateX(0); opacity: 0; }
            10% { opacity: 1; }
            80% { transform: translateX(200px); opacity: 1; }
            85% { opacity: 0; }
            100% { transform: translateX(250px); opacity: 0; }
        }

        @keyframes accumulate {
            0% { opacity: 0; }
            10% { opacity: 0.1; }
            80% { opacity: 1; }
            85% { opacity: 1; }
            95% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes pulse {
            0% { opacity: 0; }
            10% { opacity: 1; }
            80% { opacity: 1; }
            85% { opacity: 0; }
            100% { opacity: 0; }
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" aria-label="Animated diagram showing conduction current, displacement current, and the resulting magnetic fields in a capacitor.">
        <defs>
            <!-- Gradients for 3D effect -->
            <radialGradient id="sphere" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#80ead2" />
                <stop offset="100%" stop-color="#06D6A0" />
            </radialGradient>
            
            <linearGradient id="plate-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#8b939a" />
                <stop offset="100%" stop-color="#495057" />
            </linearGradient>

            <!-- Arrowhead for Electric Field -->
            <marker id="arrow-e" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <polygon points="0,0 10,5 0,10" fill="#F77F00" />
            </marker>

            <!-- Clip paths to hide particles inside the capacitor -->
            <clipPath id="left-wire-clip">
                <rect x="0" y="200" width="330" height="100" />
            </clipPath>
            <clipPath id="right-wire-clip">
                <rect x="470" y="200" width="330" height="100" />
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" rx="12" />

        <!-- Title -->
        <text x="400" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#212529">Ampere-Maxwell Law: Displacement Current</text>
        <text x="400" y="65" text-anchor="middle" font-size="14" fill="#6C757D">Charging phase of a parallel-plate capacitor</text>

        <!-- Wires -->
        <line x1="40" y1="250" x2="330" y2="250" stroke="#343A40" stroke-width="5" stroke-linecap="round" />
        <line x1="470" y1="250" x2="760" y2="250" stroke="#343A40" stroke-width="5" stroke-linecap="round" />

        <!-- Capacitor Plates -->
        <rect x="330" y="125" width="12" height="250" fill="url(#plate-grad)" rx="3" />
        <rect x="458" y="125" width="12" height="250" fill="url(#plate-grad)" rx="3" />

        <!-- Amperian Loops (Dashed Grey) -->
        <!-- Loop 1 (Around Wire) -->
        <ellipse cx="190" cy="250" rx="35" ry="80" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4" />
        <text x="190" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#6C757D">Loop L<tspan baseline-shift="sub" font-size="10">1</tspan></text>
        
        <!-- Loop 2 (Between Plates) -->
        <ellipse cx="400" cy="250" rx="35" ry="80" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4" />
        <text x="400" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="#6C757D">Loop L<tspan baseline-shift="sub" font-size="10">2</tspan></text>

        <!-- Electric Field (Orange, Animated) -->
        <g class="e-field">
            <line x1="342" y1="150" x2="448" y2="150" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="183" x2="448" y2="183" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="216" x2="448" y2="216" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="250" x2="448" y2="250" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="283" x2="448" y2="283" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="316" x2="448" y2="316" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
            <line x1="342" y1="350" x2="448" y2="350" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
        </g>

        <!-- Magnetic Fields (Purple, Animated) -->
        <g class="b-field">
            <!-- B-Field 1 (Wire) -->
            <!-- Back half -->
            <path d="M 190 195 A 20 55 0 0 0 190 305" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
            <polygon points="166,255 174,255 170,245" fill="#7209B7" opacity="0.6" />
            <!-- Front half -->
            <path d="M 190 195 A 20 55 0 0 1 190 305" fill="none" stroke="#7209B7" stroke-width="3" />
            <polygon points="206,245 214,245 210,255" fill="#7209B7" />

            <!-- B-Field 2 (Capacitor) -->
            <!-- Back half -->
            <path d="M 400 195 A 20 55 0 0 0 400 305" fill="none" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 3" opacity="0.6" />
            <polygon points="376,255 384,255 380,245" fill="#7209B7" opacity="0.6" />
            <!-- Front half -->
            <path d="M 400 195 A 20 55 0 0 1 400 305" fill="none" stroke="#7209B7" stroke-width="3" />
            <polygon points="416,245 424,245 420,255" fill="#7209B7" />
        </g>

        <!-- Charges on Plates (Animated) -->
        <g class="charge">
            <!-- Left Plate (+) -->
            <text x="315" y="156" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="189" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="222" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="256" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="289" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="322" fill="#FF3366" font-size="18" font-weight="bold">+</text>
            <text x="315" y="356" fill="#FF3366" font-size="18" font-weight="bold">+</text>

            <!-- Right Plate (-) -->
            <text x="475" y="154" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="187" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="220" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="254" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="287" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="320" fill="#4361EE" font-size="22" font-weight="bold">-</text>
            <text x="475" y="354" fill="#4361EE" font-size="22" font-weight="bold">-</text>
        </g>

        <!-- Conduction Current Particles (Green, Animated) -->
        <!-- Left Wire Flow -->
        <g clip-path="url(#left-wire-clip)">
            <g class="current-particles">
                <circle cx="-190" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="-150" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="-110" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="-70" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="-30" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="10" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="50" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="90" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="130" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="170" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="210" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="250" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="290" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="330" cy="250" r="5" fill="url(#sphere)" />
            </g>
        </g>

        <!-- Right Wire Flow -->
        <g clip-path="url(#right-wire-clip)">
            <g class="current-particles">
                <circle cx="270" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="310" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="350" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="390" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="430" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="470" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="510" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="550" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="590" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="630" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="670" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="710" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="750" cy="250" r="5" fill="url(#sphere)" />
                <circle cx="790" cy="250" r="5" fill="url(#sphere)" />
            </g>
        </g>

        <!-- Labels -->
        <text x="190" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#06D6A0">I<tspan baseline-shift="sub" font-size="12">c</tspan></text>
        <text x="400" y="105" text-anchor="middle" font-size="16" font-weight="700" fill="#F77F00">I<tspan baseline-shift="sub" font-size="12">d</tspan> = ε<tspan baseline-shift="sub" font-size="12">0</tspan> (dΦ<tspan baseline-shift="sub" font-size="12">E</tspan> / dt)</text>
        
        <text x="190" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#7209B7">B Field</text>
        <text x="400" y="380" text-anchor="middle" font-size="14" font-weight="700" fill="#F77F00">E Field</text>

        <!-- Formula Box -->
        <rect x="230" y="415" width="340" height="60" fill="#f8f9fa" stroke="#dee2e6" stroke-width="2" rx="8" />
        <text x="400" y="452" text-anchor="middle" class="math-text" font-size="20" fill="#212529">
            ∮ <tspan fill="#7209B7" font-weight="bold">B</tspan> · d<tspan font-weight="bold">l</tspan> = μ<tspan baseline-shift="sub" font-size="14">0</tspan> (<tspan fill="#06D6A0" font-weight="bold">I</tspan><tspan fill="#06D6A0" baseline-shift="sub" font-size="14">c</tspan> + <tspan fill="#F77F00" font-weight="bold">I</tspan><tspan fill="#F77F00" baseline-shift="sub" font-size="14">d</tspan>)
        </text>

        <!-- Legend -->
        <rect x="580" y="365" width="200" height="110" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="8" />
        <text x="595" y="385" font-size="11" font-weight="700" fill="#ADB5BD" letter-spacing="1">LEGEND</text>
        
        <!-- Legend Item 1 -->
        <circle cx="605" cy="405" r="5" fill="url(#sphere)" />
        <text x="620" y="409" font-size="12" font-weight="600" fill="#343A40">Conduction Current (I<tspan baseline-shift="sub" font-size="9">c</tspan>)</text>
        
        <!-- Legend Item 2 -->
        <line x1="595" y1="430" x2="610" y2="430" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-e)" />
        <text x="620" y="434" font-size="12" font-weight="600" fill="#343A40">Electric Field (E) / I<tspan baseline-shift="sub" font-size="9">d</tspan></text>
        
        <!-- Legend Item 3 -->
        <line x1="595" y1="455" x2="615" y2="455" stroke="#7209B7" stroke-width="2.5" />
        <polygon points="610,451 618,455 610,459" fill="#7209B7" />
        <text x="620" y="459" font-size="12" font-weight="600" fill="#343A40">Magnetic Field (B)</text>
    </svg>
</div>

</body>
</html>
