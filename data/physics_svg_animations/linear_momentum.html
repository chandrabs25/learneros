<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Momentum of a System of Particles</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-size: 22px;
            font-weight: 700;
            fill: #333;
            text-anchor: middle;
            transition: opacity 0.3s ease;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: #333;
        }

        .vector-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            fill: #111;
            text-anchor: middle;
        }

        tspan.sub {
            font-size: 0.7em;
            baseline-shift: sub;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 960 540" id="main-svg">
        <title>Linear Momentum of a System of Particles</title>
        <desc>An animation showing three particles moving, their individual momentum vectors summing at the center of mass, and the system accelerating under an external force.</desc>
        
        <defs>
            <!-- Background Grid -->
            <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
                <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#dee2e6" stroke-width="1" stroke-dasharray="4 4"/>
            </pattern>

            <!-- Arrowhead Markers -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-red-thick" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#FF3366" />
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                <path d="M 0 1 L 8 5 L 0 9 z" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Scene Group (fades in/out) -->
        <g id="scene" opacity="0">
            
            <!-- Velocity Vectors (Green) -->
            <line id="v1" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)" stroke-linecap="round"/>
            <line id="v2" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)" stroke-linecap="round"/>
            <line id="v3" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)" stroke-linecap="round"/>

            <!-- Momentum Vectors (Red) -->
            <line id="m1" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" stroke-linecap="round"/>
            <line id="m2" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" stroke-linecap="round"/>
            <line id="m3" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)" stroke-linecap="round"/>

            <!-- Total Momentum Vector (Thick Red) -->
            <line id="p_tot" stroke="#FF3366" stroke-width="6" marker-end="url(#arrow-red-thick)" stroke-linecap="round" opacity="0"/>

            <!-- External Force Vector (Orange) -->
            <line id="f_ext" stroke="#F77F00" stroke-width="6" marker-end="url(#arrow-orange)" stroke-linecap="round" opacity="0"/>

            <!-- Particles (Blue) -->
            <circle id="p1" r="8" fill="#4361EE" />
            <circle id="p2" r="12" fill="#4361EE" />
            <circle id="p3" r="16" fill="#4361EE" />

            <!-- Center of Mass Crosshair -->
            <g id="cm">
                <circle cx="0" cy="0" r="8" fill="none" stroke="#111" stroke-width="2"/>
                <line x1="-12" y1="0" x2="12" y2="0" stroke="#111" stroke-width="2"/>
                <line x1="0" y1="-12" x2="0" y2="12" stroke="#111" stroke-width="2"/>
            </g>

            <!-- Labels -->
            <text id="l1" class="label">m<tspan class="sub">1</tspan></text>
            <text id="l2" class="label">m<tspan class="sub">2</tspan></text>
            <text id="l3" class="label">m<tspan class="sub">3</tspan></text>

            <text id="ml1" class="vector-label" fill="#FF3366">p<tspan class="sub">1</tspan></text>
            <text id="ml2" class="vector-label" fill="#FF3366">p<tspan class="sub">2</tspan></text>
            <text id="ml3" class="vector-label" fill="#FF3366">p<tspan class="sub">3</tspan></text>
            
            <text id="ptot_label" class="vector-label" fill="#FF3366" font-size="18px" opacity="0">P</text>
            <text id="fext_label" class="vector-label" fill="#F77F00" font-size="18px" opacity="0">F<tspan class="sub">ext</tspan></text>
        </g>

        <!-- UI Overlay -->
        <g id="ui">
            <text x="480" y="45" class="title">Linear Momentum of a System of Particles</text>
            
            <!-- Legend -->
            <g transform="translate(760, 20)">
                <rect width="180" height="140" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1" opacity="0.9"/>
                <text x="90" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="#333">Legend</text>
                
                <circle cx="20" cy="45" r="6" fill="#4361EE" />
                <text x="35" y="49" font-size="13" fill="#555">Particle (m)</text>

                <line x1="12" y1="65" x2="28" y2="65" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
                <text x="35" y="69" font-size="13" fill="#555">Velocity (<tspan font-family="Roboto Mono" font-weight="bold">v</tspan>)</text>

                <line x1="12" y1="85" x2="28" y2="85" stroke="#FF3366" stroke-width="3" marker-end="url(#arrow-red)"/>
                <text x="35" y="89" font-size="13" fill="#555">Momentum (<tspan font-family="Roboto Mono" font-weight="bold">p</tspan>)</text>

                <line x1="12" y1="105" x2="28" y2="105" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-orange)"/>
                <text x="35" y="109" font-size="13" fill="#555">Ext. Force (<tspan font-family="Roboto Mono" font-weight="bold">F</tspan><tspan class="sub">ext</tspan>)</text>

                <g transform="translate(20, 125)">
                    <circle cx="0" cy="0" r="5" fill="none" stroke="#111" stroke-width="1.5"/>
                    <line x1="-7" y1="0" x2="7" y2="0" stroke="#111" stroke-width="1.5"/>
                    <line x1="0" y1="-7" x2="0" y2="7" stroke="#111" stroke-width="1.5"/>
                </g>
                <text x="35" y="129" font-size="13" fill="#555">Center of Mass</text>
            </g>

            <!-- Dynamic Formulas -->
            <g transform="translate(480, 500)">
                <rect x="-150" y="-30" width="300" height="45" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="1" opacity="0.9"/>
                <text id="form1" class="formula" opacity="1">P = Σ m<tspan class="sub">i</tspan> v<tspan class="sub">i</tspan></text>
                <text id="form2" class="formula" opacity="0">P = M V<tspan class="sub">cm</tspan></text>
                <text id="form3" class="formula" opacity="0">F<tspan class="sub">ext</tspan> = dP/dt</text>
            </g>
        </g>
    </svg>
</div>

<script>
    // Physics System Definition
    const particles = [
        { id: 1, m: 1, r: 8, x0: 80, y0: 180, vx0: 40, vy0: 15 },
        { id: 2, m: 2, r: 12, x0: 80, y0: 380, vx0: 50, vy0: -15 },
        { id: 3, m: 3, r: 16, x0: 130, y0: 280, vx0: 30, vy0: 5 }
    ];
    
    const M = particles.reduce((sum, p) => sum + p.m, 0);
    const Fx = 30, Fy = 0; // External force vector
    const ax = Fx / M, ay = Fy / M; // Acceleration of CM

    // Animation Loop
    function update(time) {
        // 12-second loop
        const t = (time / 1000) % 12; 

        // Phase Timings & Opacities
        const fade_in = Math.min(1, t / 0.5);
        const fade_out = Math.max(0, 1 - (t - 10.5) / 0.5);
        const global_opacity = Math.min(fade_in, fade_out);

        // Phase 2: Vectors slide to CM (t=3.5 to 4.5)
        const slide_progress = Math.max(0, Math.min(1, (t - 3.5) / 1.0));
        const particle_opacity = 1.0 - 0.7 * slide_progress;

        // Phase 2: Total P fades in (t=4.0 to 4.5)
        const P_opacity = Math.max(0, Math.min(1, (t - 4.0) / 0.5));
        
        // Phase 3: External Force appears (t=6.0 to 10.5)
        const F_opacity = (t >= 6.0 && t < 10.5) ? Math.max(0, Math.min(1, (t - 6.0) / 0.2)) : 0;

        // Kinematics (Constant velocity until t=6.0, then acceleration)
        const dt1 = Math.min(t, 6.0);
        const dt2 = Math.max(0, t - 6.0);

        let cm_x = 0, cm_y = 0;
        let P_tot_x = 0, P_tot_y = 0;

        // Calculate current state
        particles.forEach(p => {
            p.x = p.x0 + p.vx0 * dt1 + (p.vx0 * dt2 + 0.5 * ax * dt2 * dt2);
            p.y = p.y0 + p.vy0 * dt1 + (p.vy0 * dt2 + 0.5 * ay * dt2 * dt2);
            p.vx = p.vx0 + ax * dt2;
            p.vy = p.vy0 + ay * dt2;

            p.px = p.m * p.vx;
            p.py = p.m * p.vy;

            cm_x += p.m * p.x;
            cm_y += p.m * p.y;
            P_tot_x += p.px;
            P_tot_y += p.py;
        });

        cm_x /= M;
        cm_y /= M;

        // Update DOM Elements
        document.getElementById('scene').setAttribute('opacity', global_opacity);

        // Formulas
        document.getElementById('form1').setAttribute('opacity', t < 4.0 ? 1 : 0);
        document.getElementById('form2').setAttribute('opacity', t >= 4.0 && t < 6.0 ? 1 : 0);
        document.getElementById('form3').setAttribute('opacity', t >= 6.0 ? 1 : 0);

        // Center of Mass
        document.getElementById('cm').setAttribute('transform', `translate(${cm_x}, ${cm_y})`);

        // External Force Vector
        const f_arrow = document.getElementById('f_ext');
        f_arrow.setAttribute('x1', cm_x);
        f_arrow.setAttribute('y1', cm_y);
        f_arrow.setAttribute('x2', cm_x + Fx * 2.5); // Scaled for visibility
        f_arrow.setAttribute('y2', cm_y + Fy * 2.5);
        f_arrow.setAttribute('opacity', F_opacity);
        
        const f_label = document.getElementById('fext_label');
        f_label.setAttribute('x', cm_x + Fx * 2.5 + 10);
        f_label.setAttribute('y', cm_y + Fy * 2.5 + 5);
        f_label.setAttribute('opacity', F_opacity);

        // Total Momentum Vector
        const p_arrow = document.getElementById('p_tot');
        p_arrow.setAttribute('x1', cm_x);
        p_arrow.setAttribute('y1', cm_y);
        p_arrow.setAttribute('x2', cm_x + P_tot_x);
        p_arrow.setAttribute('y2', cm_y + P_tot_y);
        p_arrow.setAttribute('opacity', P_opacity);

        const ptot_label = document.getElementById('ptot_label');
        ptot_label.setAttribute('x', cm_x + P_tot_x + 10);
        ptot_label.setAttribute('y', cm_y + P_tot_y + 5);
        ptot_label.setAttribute('opacity', P_opacity);

        // Particles and Individual Vectors
        let stack_x = cm_x;
        let stack_y = cm_y;

        particles.forEach(p => {
            // Particle Circle
            const circle = document.getElementById(`p${p.id}`);
            circle.setAttribute('cx', p.x);
            circle.setAttribute('cy', p.y);
            circle.setAttribute('opacity', particle_opacity);

            // Particle Label
            const label = document.getElementById(`l${p.id}`);
            label.setAttribute('x', p.x - 20);
            label.setAttribute('y', p.y - 10);
            label.setAttribute('opacity', particle_opacity);

            // Velocity Vector (Green)
            const v_arrow = document.getElementById(`v${p.id}`);
            v_arrow.setAttribute('x1', p.x);
            v_arrow.setAttribute('y1', p.y);
            v_arrow.setAttribute('x2', p.x + p.vx);
            v_arrow.setAttribute('y2', p.y + p.vy);
            v_arrow.setAttribute('opacity', particle_opacity);

            // Momentum Vector (Red) - with perpendicular offset to avoid overlapping velocity
            const v_mag = Math.hypot(p.vx, p.vy);
            const nx = -p.vy / v_mag;
            const ny = p.vx / v_mag;
            
            // Offset is 5px when attached to particle, 0px when stacked at CM
            const offset_x = 5 * nx * (1 - slide_progress);
            const offset_y = 5 * ny * (1 - slide_progress);

            const start_x = p.x + offset_x + (stack_x - p.x - offset_x) * slide_progress;
            const start_y = p.y + offset_y + (stack_y - p.y - offset_y) * slide_progress;
            
            const m_arrow = document.getElementById(`m${p.id}`);
            m_arrow.setAttribute('x1', start_x);
            m_arrow.setAttribute('y1', start_y);
            m_arrow.setAttribute('x2', start_x + p.px);
            m_arrow.setAttribute('y2', start_y + p.py);
            
            // Fade out individual momentum vectors slightly when total P is shown
            m_arrow.setAttribute('opacity', 1.0 - 0.5 * P_opacity);

            // Momentum Label
            const m_label = document.getElementById(`ml${p.id}`);
            m_label.setAttribute('x', start_x + p.px/2 - 10 + offset_x*2);
            m_label.setAttribute('y', start_y + p.py/2 - 10 + offset_y*2);
            m_label.setAttribute('opacity', 1.0 - 0.5 * P_opacity);

            // Advance stack position for next vector
            stack_x += p.px;
            stack_y += p.py;
        });

        requestAnimationFrame(update);
    }

    // Start animation
    requestAnimationFrame(update);
</script>

</body>
</html>
