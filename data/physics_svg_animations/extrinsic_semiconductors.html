<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamics of Extrinsic Semiconductors</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }

        button {
            padding: 10px 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            color: #ffffff;
            background-color: #4361EE;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #3651D4;
        }

        button.restart {
            background-color: #6C757D;
        }

        button.restart:hover {
            background-color: #5A6268;
        }

        /* --- Animations --- */
        .paused * {
            animation-play-state: paused !important;
        }

        /* Block Sliding */
        @keyframes slide-n {
            0%, 26.6% { transform: translateX(0); }
            33.3%, 100% { transform: translateX(40px); }
        }
        @keyframes slide-p {
            0%, 26.6% { transform: translateX(0); }
            33.3%, 100% { transform: translateX(-40px); }
        }
        .run-anim .n-block { animation: slide-n 15s infinite ease-in-out; }
        .run-anim .p-block { animation: slide-p 15s infinite ease-in-out; }

        /* Doping Fade (Phase 1) */
        @keyframes ion-appear {
            0%, 2% { opacity: 0; }
            5%, 100% { opacity: 1; }
        }
        @keyframes si-fade {
            0%, 2% { opacity: 1; }
            5%, 100% { opacity: 0; }
        }
        .run-anim .ion-appear { animation: ion-appear 15s infinite; }
        .run-anim .si-fade { animation: si-fade 15s infinite; }

        /* Carrier Recombination (Diffusion to Junction) */
        @keyframes e-rec {
            0%, 5% { transform: translate(var(--startX), var(--startY)); opacity: 1; }
            8% { transform: translate(calc(var(--startX) - 15px), calc(var(--startY) - 10px)); opacity: 1; }
            12% { transform: translate(calc(var(--startX) + 10px), calc(var(--startY) + 15px)); opacity: 1; }
            16% { transform: translate(calc(var(--startX) - 12px), calc(var(--startY) + 5px)); opacity: 1; }
            20% { transform: translate(calc(var(--startX) + 12px), calc(var(--startY) - 12px)); opacity: 1; }
            26.6%, 33.3% { transform: translate(var(--startX), var(--startY)); opacity: 1; }
            40% { transform: translate(360px, var(--startY)); opacity: 1; }
            41%, 100% { transform: translate(360px, var(--startY)); opacity: 0; }
        }
        @keyframes h-rec {
            0%, 5% { transform: translate(var(--startX), var(--startY)); opacity: 1; }
            8% { transform: translate(calc(var(--startX) + 15px), calc(var(--startY) + 10px)); opacity: 1; }
            12% { transform: translate(calc(var(--startX) - 10px), calc(var(--startY) - 15px)); opacity: 1; }
            16% { transform: translate(calc(var(--startX) + 12px), calc(var(--startY) - 5px)); opacity: 1; }
            20% { transform: translate(calc(var(--startX) - 12px), calc(var(--startY) + 12px)); opacity: 1; }
            26.6%, 33.3% { transform: translate(var(--startX), var(--startY)); opacity: 1; }
            40% { transform: translate(440px, var(--startY)); opacity: 1; }
            41%, 100% { transform: translate(440px, var(--startY)); opacity: 0; }
        }
        .run-anim .e-rec { animation: e-rec 15s infinite ease-in-out; }
        .run-anim .h-rec { animation: h-rec 15s infinite ease-in-out; }

        /* Carrier Drift (Equilibrium) */
        @keyframes e-drift {
            0%, 5% { transform: translate(var(--startX), var(--startY)); }
            10%, 30%, 50%, 70% { transform: translate(calc(var(--startX) - 10px), calc(var(--startY) + 10px)); }
            20%, 40%, 60% { transform: translate(calc(var(--startX) + 10px), calc(var(--startY) - 10px)); }
            80% { transform: translate(var(--startX), var(--startY)); }
            86% { transform: translate(calc(var(--startX) + 50px), var(--startY)); }
            93%, 100% { transform: translate(var(--startX), var(--startY)); }
        }
        @keyframes h-drift {
            0%, 5% { transform: translate(var(--startX), var(--startY)); }
            10%, 30%, 50%, 70% { transform: translate(calc(var(--startX) + 10px), calc(var(--startY) - 10px)); }
            20%, 40%, 60% { transform: translate(calc(var(--startX) - 10px), calc(var(--startY) + 10px)); }
            80% { transform: translate(var(--startX), var(--startY)); }
            86% { transform: translate(calc(var(--startX) - 50px), var(--startY)); }
            93%, 100% { transform: translate(var(--startX), var(--startY)); }
        }
        .run-anim .e-drift { animation: e-drift 15s infinite ease-in-out; }
        .run-anim .h-drift { animation: h-drift 15s infinite ease-in-out; }

        /* Recombination Flash */
        @keyframes flash-anim {
            0%, 39% { opacity: 0; transform: scale(0); }
            40% { opacity: 1; transform: scale(1.5); }
            45%, 100% { opacity: 0; transform: scale(0); }
        }
        .flash {
            transform-origin: center;
            transform-box: fill-box;
        }
        .run-anim .flash { animation: flash-anim 15s infinite; }

        /* Depletion Region & Vectors */
        @keyframes depletion-grow {
            0%, 53.3% { opacity: 0; }
            80%, 100% { opacity: 0.8; }
        }
        @keyframes efield-clip-grow {
            0%, 53.3% { width: 0; }
            80%, 100% { width: 100px; }
        }
        @keyframes idiff-show {
            0%, 33.3% { opacity: 0; }
            35%, 53.3% { opacity: 1; }
            55%, 100% { opacity: 0; }
        }
        @keyframes idrift-show {
            0%, 80% { opacity: 0; }
            82%, 98% { opacity: 1; }
            100% { opacity: 0; }
        }
        .run-anim .depletion-rect { animation: depletion-grow 15s infinite ease-in-out; }
        .run-anim .efield-clip-rect { animation: efield-clip-grow 15s infinite ease-in-out; }
        .run-anim .idiff-group { animation: idiff-show 15s infinite ease-in-out; }
        .run-anim .idrift-group { animation: idrift-show 15s infinite ease-in-out; }

    </style>
</head>
<body>

<div class="container">
    <svg id="main-svg" class="run-anim" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrow Markers -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>

            <!-- Lattice Symbols -->
            <g id="si-atom">
                <circle cx="0" cy="0" r="6" fill="#ADB5BD"/>
            </g>
            <g id="p-ion">
                <circle cx="0" cy="0" r="10" fill="#4361EE"/>
                <text x="0" y="4" font-family="'Inter', sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="bold">+</text>
            </g>
            <g id="b-ion">
                <circle cx="0" cy="0" r="10" fill="#FF3366"/>
                <text x="0" y="4" font-family="'Inter', sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">-</text>
            </g>
            <g id="electron">
                <circle cx="0" cy="0" r="4" fill="#4361EE"/>
            </g>
            <g id="hole">
                <circle cx="0" cy="0" r="4" fill="white" stroke="#FF3366" stroke-width="2"/>
            </g>

            <!-- Clip Path for E-Field -->
            <clipPath id="efield-clip">
                <rect x="350" y="230" width="100" height="40" class="efield-clip-rect"/>
            </clipPath>
        </defs>

        <!-- Title -->
        <text x="400" y="35" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#212529">Formation of p-n Junction &amp; Depletion Region</text>

        <!-- Region Labels -->
        <text x="200" y="70" font-family="'Inter', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#4361EE">n-type (Donor N<tspan dy="4" font-size="12">D</tspan>)</text>
        <text x="600" y="70" font-family="'Inter', sans-serif" font-size="16" font-weight="600" text-anchor="middle" fill="#FF3366">p-type (Acceptor N<tspan dy="4" font-size="12">A</tspan>)</text>

        <!-- Carrier Density Labels -->
        <text x="200" y="420" font-family="'Roboto Mono', monospace" font-size="14" text-anchor="middle" fill="#4361EE">n<tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> ≈ N</tspan><tspan dy="4" font-size="10">D</tspan></text>
        <text x="600" y="420" font-family="'Roboto Mono', monospace" font-size="14" text-anchor="middle" fill="#FF3366">n<tspan dy="4" font-size="10">h</tspan><tspan dy="-4"> ≈ N</tspan><tspan dy="4" font-size="10">A</tspan></text>

        <!-- Depletion Region Overlay (Fixed in center) -->
        <rect x="340" y="80" width="120" height="320" fill="#E9ECEF" class="depletion-rect" rx="4"/>

        <!-- N-Type Block -->
        <g class="n-block">
            <rect x="40" y="80" width="320" height="320" fill="#EBF8FF" rx="4"/>
            
            <!-- Si Atoms (Fading ones at ion positions) -->
            <use href="#si-atom" x="320" y="150" class="si-fade"/>
            <use href="#si-atom" x="320" y="240" class="si-fade"/>
            <use href="#si-atom" x="320" y="330" class="si-fade"/>
            <use href="#si-atom" x="160" y="150" class="si-fade"/>
            <use href="#si-atom" x="160" y="330" class="si-fade"/>

            <!-- Si Atoms (Permanent) -->
            <!-- Col 80 -->
            <use href="#si-atom" x="80" y="105"/> <use href="#si-atom" x="80" y="195"/> <use href="#si-atom" x="80" y="285"/> <use href="#si-atom" x="80" y="375"/>
            <!-- Col 160 -->
            <use href="#si-atom" x="160" y="105"/> <use href="#si-atom" x="160" y="240"/> <use href="#si-atom" x="160" y="375"/>
            <!-- Col 240 -->
            <use href="#si-atom" x="240" y="105"/> <use href="#si-atom" x="240" y="195"/> <use href="#si-atom" x="240" y="285"/> <use href="#si-atom" x="240" y="375"/>
            <!-- Col 320 -->
            <use href="#si-atom" x="320" y="105"/> <use href="#si-atom" x="320" y="375"/>

            <!-- P+ Ions (Fade in) -->
            <g class="ion-appear">
                <use href="#p-ion" x="320" y="150"/>
                <use href="#p-ion" x="320" y="240"/>
                <use href="#p-ion" x="320" y="330"/>
                <use href="#p-ion" x="160" y="150"/>
                <use href="#p-ion" x="160" y="330"/>
            </g>

            <!-- Free Electrons -->
            <use href="#electron" style="--startX: 320px; --startY: 150px;" class="e-rec"/>
            <use href="#electron" style="--startX: 320px; --startY: 240px;" class="e-rec"/>
            <use href="#electron" style="--startX: 320px; --startY: 330px;" class="e-rec"/>
            <use href="#electron" style="--startX: 160px; --startY: 150px;" class="e-drift"/>
            <use href="#electron" style="--startX: 160px; --startY: 330px;" class="e-drift"/>
        </g>

        <!-- P-Type Block -->
        <g class="p-block">
            <rect x="440" y="80" width="320" height="320" fill="#FFF5F5" rx="4"/>

            <!-- Si Atoms (Fading ones at ion positions) -->
            <use href="#si-atom" x="480" y="150" class="si-fade"/>
            <use href="#si-atom" x="480" y="240" class="si-fade"/>
            <use href="#si-atom" x="480" y="330" class="si-fade"/>
            <use href="#si-atom" x="640" y="150" class="si-fade"/>
            <use href="#si-atom" x="640" y="330" class="si-fade"/>

            <!-- Si Atoms (Permanent) -->
            <!-- Col 480 -->
            <use href="#si-atom" x="480" y="105"/> <use href="#si-atom" x="480" y="375"/>
            <!-- Col 560 -->
            <use href="#si-atom" x="560" y="105"/> <use href="#si-atom" x="560" y="195"/> <use href="#si-atom" x="560" y="285"/> <use href="#si-atom" x="560" y="375"/>
            <!-- Col 640 -->
            <use href="#si-atom" x="640" y="105"/> <use href="#si-atom" x="640" y="240"/> <use href="#si-atom" x="640" y="375"/>
            <!-- Col 720 -->
            <use href="#si-atom" x="720" y="105"/> <use href="#si-atom" x="720" y="195"/> <use href="#si-atom" x="720" y="285"/> <use href="#si-atom" x="720" y="375"/>

            <!-- B- Ions (Fade in) -->
            <g class="ion-appear">
                <use href="#b-ion" x="480" y="150"/>
                <use href="#b-ion" x="480" y="240"/>
                <use href="#b-ion" x="480" y="330"/>
                <use href="#b-ion" x="640" y="150"/>
                <use href="#b-ion" x="640" y="330"/>
            </g>

            <!-- Holes -->
            <use href="#hole" style="--startX: 480px; --startY: 150px;" class="h-rec"/>
            <use href="#hole" style="--startX: 480px; --startY: 240px;" class="h-rec"/>
            <use href="#hole" style="--startX: 480px; --startY: 330px;" class="h-rec"/>
            <use href="#hole" style="--startX: 640px; --startY: 150px;" class="h-drift"/>
            <use href="#hole" style="--startX: 640px; --startY: 330px;" class="h-drift"/>
        </g>

        <!-- Recombination Flashes -->
        <circle cx="400" cy="150" r="15" fill="#FFD166" class="flash"/>
        <circle cx="400" cy="240" r="15" fill="#FFD166" class="flash"/>
        <circle cx="400" cy="330" r="15" fill="#FFD166" class="flash"/>

        <!-- Internal Electric Field Arrow -->
        <g clip-path="url(#efield-clip)">
            <line x1="350" y1="240" x2="445" y2="240" stroke="#F77F00" stroke-width="4" marker-end="url(#arrow-orange)"/>
            <text x="400" y="230" font-family="'Inter', sans-serif" font-size="14" font-weight="bold" fill="#F77F00" text-anchor="middle">E-Field</text>
        </g>

        <!-- Diffusion Current Arrow -->
        <g class="idiff-group">
            <line x1="460" y1="450" x2="345" y2="450" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)"/>
            <text x="400" y="440" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#06D6A0" text-anchor="middle">Diffusion Current (I_diff)</text>
        </g>

        <!-- Drift Current Arrow -->
        <g class="idrift-group">
            <line x1="340" y1="470" x2="455" y2="470" stroke="#4361EE" stroke-width="3" marker-end="url(#arrow-blue)"/>
            <text x="400" y="490" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#4361EE" text-anchor="middle">Drift Current (I_drift)</text>
        </g>

        <!-- Legend -->
        <rect x="20" y="430" width="280" height="55" fill="#ffffff" stroke="#ADB5BD" rx="6"/>
        <circle cx="35" cy="445" r="4" fill="#4361EE"/>
        <text x="45" y="449" font-family="'Inter', sans-serif" font-size="12" fill="#212529">Free Electron</text>
        
        <circle cx="35" cy="468" r="4" fill="white" stroke="#FF3366" stroke-width="2"/>
        <text x="45" y="472" font-family="'Inter', sans-serif" font-size="12" fill="#212529">Hole</text>
        
        <circle cx="160" cy="445" r="7" fill="#4361EE"/>
        <text x="160" y="449" font-family="'Inter', sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">+</text>
        <text x="175" y="449" font-family="'Inter', sans-serif" font-size="12" fill="#212529">Donor (P⁺)</text>
        
        <circle cx="160" cy="468" r="7" fill="#FF3366"/>
        <text x="160" y="472" font-family="'Inter', sans-serif" font-size="10" fill="white" text-anchor="middle" font-weight="bold">-</text>
        <text x="175" y="472" font-family="'Inter', sans-serif" font-size="12" fill="#212529">Acceptor (B⁻)</text>

        <!-- Formula Overlay -->
        <rect x="520" y="430" width="260" height="55" fill="#ffffff" stroke="#ADB5BD" rx="6"/>
        <text x="530" y="462" font-family="'Roboto Mono', monospace" font-size="15" fill="#212529">
            V<tspan dy="4" font-size="11">bi</tspan><tspan dy="-4"> = (kT/q) ln(N</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4">N</tspan><tspan dy="4" font-size="11">D</tspan><tspan dy="-4">/n</tspan><tspan dy="4" font-size="11">i</tspan><tspan dy="-8" font-size="10">2</tspan><tspan dy="4">)</tspan>
        </text>

    </svg>

    <div class="controls">
        <button id="play-btn" onclick="togglePlay()">Pause</button>
        <button class="restart" onclick="restartAnim()">Restart Animation</button>
    </div>
</div>

<script>
    let isPlaying = true;

    function togglePlay() {
        const svg = document.getElementById('main-svg');
        const btn = document.getElementById('play-btn');
        if (isPlaying) {
            svg.classList.add('paused');
            btn.innerText = 'Play';
        } else {
            svg.classList.remove('paused');
            btn.innerText = 'Pause';
        }
        isPlaying = !isPlaying;
    }

    function restartAnim() {
        const svg = document.getElementById('main-svg');
        svg.classList.remove('run-anim');
        void svg.offsetWidth; // Trigger reflow to restart CSS animations
        svg.classList.add('run-anim');
        
        if (!isPlaying) {
            togglePlay(); // Ensure it plays after restart
        }
    }
</script>

</body>
</html>
