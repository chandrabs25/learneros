<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conservation of Energy: Escape Velocity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-k: #FF3366;
            --color-u: #4361EE;
            --color-e: #06D6A0;
            --color-v: #06D6A0;
            --color-f: #00B4D8;
            --color-earth-1: #00B4D8;
            --color-earth-2: #0077B6;
            --color-bg: #f8f9fa;
            --color-text: #212529;
            --color-text-muted: #6C757D;
            --color-grid: #E9ECEF;
            --color-axis: #ADB5BD;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--color-bg);
            font-family: 'Inter', sans-serif;
        }

        .simulation-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
            background-color: var(--color-bg);
            border-radius: 8px;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: 600;
            font-size: 14px;
        }

        /* --- Animations --- */
        
        /* Global Fade for loop reset */
        @keyframes globalFade {
            0%, 87.5% { opacity: 1; }
            90%, 95% { opacity: 0; }
            100% { opacity: 1; }
        }
        .fade-group {
            animation: globalFade 8s infinite;
        }

        /* Projectile Motion (y: 400 to 50) */
        @keyframes moveProjectile {
            0% { transform: translateY(400px); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { transform: translateY(50px); }
            95%, 100% { transform: translateY(400px); }
        }
        .anim-projectile {
            animation: moveProjectile 8s infinite;
        }

        /* Velocity Vector (Length: 80 to 37.7) */
        @keyframes animVelocity {
            0% { y2: -85px; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { y2: -42.7px; }
            95%, 100% { y2: -85px; }
        }
        .anim-vec-v { animation: animVelocity 8s infinite; }

        /* Gravity Vector (Length: 60 to 3) - 1/r^2 drops faster */
        @keyframes animGravity {
            0% { y2: 65px; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { y2: 8px; }
            95%, 100% { y2: 65px; }
        }
        .anim-vec-f { animation: animGravity 8s infinite; }

        /* Vector Labels */
        @keyframes animLabelV {
            0% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { transform: translateY(42.3px); }
            95%, 100% { transform: translateY(0px); }
        }
        .anim-label-v { animation: animLabelV 8s infinite; }

        @keyframes animLabelF {
            0% { transform: translateY(0px); animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { transform: translateY(-57px); }
            95%, 100% { transform: translateY(0px); }
        }
        .anim-label-f { animation: animLabelF 8s infinite; }

        /* Kinetic Energy Bar (Height: 150 to 33.3) */
        @keyframes animKBar {
            0% { y: 100px; height: 150px; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { y: 216.7px; height: 33.3px; }
            95%, 100% { y: 100px; height: 150px; }
        }
        .anim-bar-k { animation: animKBar 8s infinite; }

        /* Potential Energy Bar (Height: 150 to 33.3, y stays at 250 to grow UPWARDS from negative) */
        @keyframes animUBar {
            0% { height: 150px; animation-timing-function: cubic-bezier(0.25, 0.46, 0.45, 0.94); }
            87.5%, 90% { height: 33.3px; }
            95%, 100% { height: 150px; }
        }
        .anim-bar-u { animation: animUBar 8s infinite; }

        /* Hover to Pause Logic */
        .earth-hover {
            cursor: pointer;
        }
        /* Modern :has() selector for pausing */
        svg:has(.earth-hover:hover) * {
            animation-play-state: paused !important;
        }
        /* Fallback for older browsers */
        .earth-hover:hover ~ .fade-group,
        .earth-hover:hover ~ .fade-group * {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body>

<div class="simulation-container">
    <svg viewBox="0 0 800 500" aria-label="Conservation of Energy Simulation: Escape Velocity">
        <defs>
            <!-- Earth Gradient -->
            <radialGradient id="earthGrad" cx="50%" cy="30%" r="70%">
                <stop offset="0%" stop-color="var(--color-earth-1)"/>
                <stop offset="100%" stop-color="var(--color-earth-2)"/>
            </radialGradient>

            <!-- Arrowheads -->
            <marker id="arrowV" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-v)" />
            </marker>
            <marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--color-f)" />
            </marker>
        </defs>

        <!-- ================= BACKGROUND & STATIC ELEMENTS ================= -->
        
        <!-- Title & Instructions -->
        <text x="30" y="40" font-size="22" font-weight="700" fill="var(--color-text)">Conservation of Energy: Escape Velocity</text>
        <text x="30" y="65" font-size="13" fill="var(--color-text-muted)">Hover over Earth to pause simulation</text>

        <!-- Distance Markers (Left Side) -->
        <g stroke="var(--color-grid)" stroke-width="1" stroke-dasharray="4,4">
            <line x1="150" y1="300" x2="350" y2="300" />
            <line x1="150" y1="200" x2="350" y2="200" />
            <line x1="150" y1="100" x2="350" y2="100" />
        </g>
        <g font-size="11" fill="var(--color-axis)" font-family="'Roboto Mono', monospace">
            <text x="355" y="304">r = 2R</text>
            <text x="355" y="204">r = 3R</text>
            <text x="355" y="104">r = 4R</text>
            <text x="355" y="404">r = R (Surface)</text>
        </g>

        <!-- Trajectory Line -->
        <line x1="250" y1="400" x2="250" y2="50" stroke="var(--color-axis)" stroke-width="2" stroke-dasharray="6,6" />

        <!-- Earth -->
        <g aria-label="Earth">
            <!-- Atmosphere Glow -->
            <circle cx="250" cy="500" r="108" fill="none" stroke="var(--color-earth-1)" stroke-width="2" opacity="0.3"/>
            <circle cx="250" cy="500" r="104" fill="none" stroke="var(--color-earth-1)" stroke-width="4" opacity="0.15"/>
            <!-- Planet Body -->
            <circle cx="250" cy="500" r="100" fill="url(#earthGrad)" stroke="var(--color-earth-2)" stroke-width="2"/>
        </g>

        <!-- Energy Chart Axes & Grid -->
        <g aria-label="Energy Bar Chart">
            <!-- Y-Axis -->
            <line x1="540" y1="80" x2="540" y2="420" stroke="var(--color-axis)" stroke-width="2"/>
            
            <!-- Y-Axis Ticks & Labels -->
            <line x1="535" y1="100" x2="545" y2="100" stroke="var(--color-axis)" stroke-width="2"/>
            <text x="525" y="104" font-size="12" fill="var(--color-text-muted)" text-anchor="end">+E<tspan dy="2" font-size="9">max</tspan></text>
            
            <line x1="535" y1="400" x2="545" y2="400" stroke="var(--color-axis)" stroke-width="2"/>
            <text x="525" y="404" font-size="12" fill="var(--color-text-muted)" text-anchor="end">-E<tspan dy="2" font-size="9">max</tspan></text>

            <!-- Zero Energy Line (X-Axis) -->
            <line x1="520" y1="250" x2="780" y2="250" stroke="var(--color-text-muted)" stroke-width="2" stroke-dasharray="5,5"/>
            <text x="780" y="243" font-size="12" fill="var(--color-text-muted)" text-anchor="end">Zero Energy (E = 0)</text>

            <!-- Bar Chart X-Axis Labels -->
            <text x="575" y="440" font-size="16" font-weight="700" fill="var(--color-k)" text-anchor="middle">K</text>
            <text x="655" y="440" font-size="16" font-weight="700" fill="var(--color-u)" text-anchor="middle">U</text>
            <text x="735" y="440" font-size="16" font-weight="700" fill="var(--color-e)" text-anchor="middle">E<tspan dy="4" font-size="11">total</tspan></text>
        </g>

        <!-- Formulas / Legend (Top Right) -->
        <g class="formula" aria-label="Formulas">
            <rect x="520" y="30" width="250" height="95" fill="#ffffff" rx="8" stroke="var(--color-grid)" stroke-width="1" opacity="0.9"/>
            <text x="540" y="55" fill="var(--color-k)">K = ½mv²</text>
            <text x="540" y="80" fill="var(--color-u)">U = -GMm/r</text>
            <text x="540" y="105" fill="var(--color-e)">E = K + U = 0</text>
        </g>

        <!-- Hover Target (Placed before animated elements for fallback CSS support) -->
        <circle class="earth-hover" cx="250" cy="500" r="120" fill="transparent" aria-hidden="true"/>

        <!-- ================= ANIMATED ELEMENTS ================= -->
        
        <g class="fade-group">
            
            <!-- Projectile & Vectors -->
            <g class="anim-projectile">
                <!-- Velocity Vector -->
                <line class="anim-vec-v" x1="250" y1="-5" x2="250" y2="-85" stroke="var(--color-v)" stroke-width="3" marker-end="url(#arrowV)"/>
                <text class="anim-label-v formula" x="262" y="-75" fill="var(--color-v)" font-style="italic" font-weight="700">v</text>
                
                <!-- Gravity Vector -->
                <line class="anim-vec-f" x1="250" y1="5" x2="250" y2="65" stroke="var(--color-f)" stroke-width="3" marker-end="url(#arrowF)"/>
                <text class="anim-label-f formula" x="262" y="55" fill="var(--color-f)" font-style="italic" font-weight="700">F<tspan dy="4" font-size="10">g</tspan></text>
                
                <!-- Projectile Body -->
                <circle cx="250" cy="0" r="6" fill="#ffffff" stroke="#333333" stroke-width="2"/>
            </g>

            <!-- Energy Bars -->
            <g aria-label="Dynamic Energy Bars">
                <!-- Kinetic Energy Bar (Positive, shrinks) -->
                <rect class="anim-bar-k" x="560" y="100" width="30" height="150" fill="var(--color-k)" rx="3"/>
                
                <!-- Potential Energy Bar (Negative, grows upwards towards 0) -->
                <rect class="anim-bar-u" x="640" y="250" width="30" height="150" fill="var(--color-u)" rx="3"/>
                
                <!-- Total Energy Bar (Constant at 0) -->
                <rect x="720" y="248" width="30" height="4" fill="var(--color-e)" rx="2"/>
            </g>

        </g>
    </svg>
</div>

</body>
</html>
