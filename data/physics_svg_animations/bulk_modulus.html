<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Modulus & Longitudinal Waves</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,700&display=swap');

        :root {
            --bg: #f8f9fa;
            --pressure: #FF3366;
            --medium: #4361EE;
            --velocity: #06D6A0;
            --rarefaction: #F77F00;
            --text: #2B2D42;
            --grid: #ced4da;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        text {
            fill: var(--text);
            user-select: none;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
        }

        /* Left Panel Animations */
        @keyframes compress-vol {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.8); } /* 36% area reduction, 20% side reduction */
        }

        @keyframes push-top {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(16px); }
        }
        @keyframes push-bottom {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-16px); }
        }
        @keyframes push-left {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(16px); }
        }
        @keyframes push-right {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(-16px); }
        }

        @keyframes fade-in-out {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .vol-anim {
            transform-origin: 200px 280px;
            animation: compress-vol 4s infinite cubic-bezier(0.37, 0, 0.63, 1);
        }
        .arrow-top { animation: push-top 4s infinite cubic-bezier(0.37, 0, 0.63, 1); }
        .arrow-bottom { animation: push-bottom 4s infinite cubic-bezier(0.37, 0, 0.63, 1); }
        .arrow-left { animation: push-left 4s infinite cubic-bezier(0.37, 0, 0.63, 1); }
        .arrow-right { animation: push-right 4s infinite cubic-bezier(0.37, 0, 0.63, 1); }
        .fade-text { animation: fade-in-out 4s infinite cubic-bezier(0.37, 0, 0.63, 1); }

        /* Right Panel Animations */
        @keyframes oscillate {
            0%, 100% { transform: translateX(-15px); }
            50% { transform: translateX(15px); }
        }

        @keyframes move-wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(150px); }
        }

        .particle-col {
            animation: oscillate 4s infinite cubic-bezier(0.37, 0, 0.63, 1);
        }

        /* Delays for longitudinal wave (moving right) */
        .col-0 { animation-delay: -40s; }
        .col-1 { animation-delay: -39.333s; }
        .col-2 { animation-delay: -38.667s; }
        .col-3 { animation-delay: -38s; }
        .col-4 { animation-delay: -37.333s; }
        .col-5 { animation-delay: -36.667s; }
        .col-6 { animation-delay: -36s; }
        .col-7 { animation-delay: -35.333s; }
        .col-8 { animation-delay: -34.667s; }
        .col-9 { animation-delay: -34s; }
        .col-10 { animation-delay: -33.333s; }
        .col-11 { animation-delay: -32.667s; }
        .col-12 { animation-delay: -32s; }
        .col-13 { animation-delay: -31.333s; }
        .col-14 { animation-delay: -30.667s; }

        .wave-tracker {
            animation: move-wave 4s linear infinite;
        }

    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--pressure)" />
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--velocity)" />
            </marker>

            <!-- Particle Column for Wave -->
            <g id="p-col">
                <circle cx="0" cy="216" r="3.5" fill="var(--medium)"/>
                <circle cx="0" cy="248" r="3.5" fill="var(--medium)"/>
                <circle cx="0" cy="280" r="3.5" fill="var(--medium)"/>
                <circle cx="0" cy="312" r="3.5" fill="var(--medium)"/>
                <circle cx="0" cy="344" r="3.5" fill="var(--medium)"/>
            </g>

            <!-- Particle Row for Fluid Element -->
            <g id="p-row">
                <circle cx="-53.3" cy="0" r="3.5" fill="var(--medium)"/>
                <circle cx="-26.6" cy="0" r="3.5" fill="var(--medium)"/>
                <circle cx="0" cy="0" r="3.5" fill="var(--medium)"/>
                <circle cx="26.6" cy="0" r="3.5" fill="var(--medium)"/>
                <circle cx="53.3" cy="0" r="3.5" fill="var(--medium)"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="var(--bg)"/>

        <!-- Header -->
        <text x="400" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="var(--text)">Bulk Modulus &amp; Longitudinal Waves</text>

        <!-- Formula Overlay -->
        <g transform="translate(0, -5)">
            <text x="345" y="95" class="math" font-size="22" font-weight="700" text-anchor="end">B = -</text>
            <text x="400" y="75" class="math" font-size="18" font-weight="700" text-anchor="middle">ΔP</text>
            <line x1="360" y1="85" x2="440" y2="85" stroke="var(--text)" stroke-width="2"/>
            <text x="400" y="105" class="math" font-size="18" font-weight="700" text-anchor="middle">ΔV / V</text>
        </g>

        <!-- Panel Titles -->
        <text x="200" y="150" font-size="16" font-weight="600" text-anchor="middle" fill="var(--text)">Fluid Element</text>
        <text x="605" y="150" font-size="16" font-weight="600" text-anchor="middle" fill="var(--text)">Longitudinal Wave in Tube</text>

        <!-- ================= LEFT PANEL ================= -->
        <g id="left-panel">
            <!-- Original Volume Dashed Box -->
            <rect x="120" y="200" width="160" height="160" fill="none" stroke="var(--text)" stroke-width="2" stroke-dasharray="6,6" opacity="0.4"/>
            <text x="130" y="220" class="math" font-size="16" font-weight="700" fill="var(--text)" opacity="0.6">V</text>

            <!-- Compressed Volume & Particles -->
            <g class="vol-anim">
                <rect x="120" y="200" width="160" height="160" fill="var(--medium)" fill-opacity="0.15" stroke="var(--medium)" stroke-width="2" vector-effect="non-scaling-stroke"/>
                <g transform="translate(200, 280)">
                    <use href="#p-row" y="-53.3"/>
                    <use href="#p-row" y="-26.6"/>
                    <use href="#p-row" y="0"/>
                    <use href="#p-row" y="26.6"/>
                    <use href="#p-row" y="53.3"/>
                </g>
            </g>

            <!-- Delta V Label -->
            <text x="100" y="215" class="math fade-text" font-size="14" font-weight="700" fill="var(--medium)">ΔV</text>
            <path d="M 118 210 L 132 210" stroke="var(--medium)" stroke-width="1.5" class="fade-text" marker-end="url(#arrow-green)" style="marker-end: none;"/> <!-- Just a line indicator if needed, but text is enough -->

            <!-- Pressure Arrows -->
            <g class="arrow-top">
                <line x1="200" y1="150" x2="200" y2="196" stroke="var(--pressure)" stroke-width="4" marker-end="url(#arrow-red)"/>
                <text x="215" y="170" class="math fade-text" font-size="16" font-weight="700" fill="var(--pressure)">ΔP</text>
            </g>
            <g class="arrow-bottom">
                <line x1="200" y1="410" x2="200" y2="364" stroke="var(--pressure)" stroke-width="4" marker-end="url(#arrow-red)"/>
                <text x="215" y="395" class="math fade-text" font-size="16" font-weight="700" fill="var(--pressure)">ΔP</text>
            </g>
            <g class="arrow-left">
                <line x1="70" y1="280" x2="116" y2="280" stroke="var(--pressure)" stroke-width="4" marker-end="url(#arrow-red)"/>
                <text x="75" y="270" class="math fade-text" font-size="16" font-weight="700" fill="var(--pressure)">ΔP</text>
            </g>
            <g class="arrow-right">
                <line x1="330" y1="280" x2="284" y2="280" stroke="var(--pressure)" stroke-width="4" marker-end="url(#arrow-red)"/>
                <text x="295" y="270" class="math fade-text" font-size="16" font-weight="700" fill="var(--pressure)">ΔP</text>
            </g>
        </g>

        <!-- ================= RIGHT PANEL ================= -->
        <g id="right-panel">
            <!-- Tube Outline -->
            <rect x="415" y="200" width="380" height="160" fill="#ffffff" stroke="var(--text)" stroke-width="2" rx="4"/>
            
            <!-- Particles (15 columns, 25px apart) -->
            <!-- Clip path to keep particles inside tube -->
            <clipPath id="tube-clip">
                <rect x="415" y="200" width="380" height="160" rx="4"/>
            </clipPath>
            
            <g clip-path="url(#tube-clip)">
                <use href="#p-col" x="430" class="particle-col col-0"/>
                <use href="#p-col" x="455" class="particle-col col-1"/>
                <use href="#p-col" x="480" class="particle-col col-2"/>
                <use href="#p-col" x="505" class="particle-col col-3"/>
                <use href="#p-col" x="530" class="particle-col col-4"/>
                <use href="#p-col" x="555" class="particle-col col-5"/>
                <use href="#p-col" x="580" class="particle-col col-6"/>
                <use href="#p-col" x="605" class="particle-col col-7"/>
                <use href="#p-col" x="630" class="particle-col col-8"/>
                <use href="#p-col" x="655" class="particle-col col-9"/>
                <use href="#p-col" x="680" class="particle-col col-10"/>
                <use href="#p-col" x="705" class="particle-col col-11"/>
                <use href="#p-col" x="730" class="particle-col col-12"/>
                <use href="#p-col" x="755" class="particle-col col-13"/>
                <use href="#p-col" x="780" class="particle-col col-14"/>
            </g>

            <!-- Wave Tracker (Moves 150px right in 4s, perfectly syncing with wave) -->
            <g class="wave-tracker">
                <!-- Velocity Arrow -->
                <line x1="512.5" y1="175" x2="572.5" y2="175" stroke="var(--velocity)" stroke-width="4" marker-end="url(#arrow-green)"/>
                <text x="542.5" y="165" class="math" fill="var(--velocity)" font-weight="700" font-size="18" font-style="italic" text-anchor="middle">v</text>

                <!-- Compression Tracker -->
                <line x1="542.5" y1="185" x2="542.5" y2="380" stroke="var(--velocity)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
                <text x="542.5" y="395" fill="var(--velocity)" font-size="14" font-weight="700" text-anchor="middle">Compression</text>

                <!-- Rarefaction Tracker -->
                <line x1="617.5" y1="200" x2="617.5" y2="380" stroke="var(--rarefaction)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6"/>
                <text x="617.5" y="395" fill="var(--rarefaction)" font-size="14" font-weight="700" text-anchor="middle">Rarefaction</text>
            </g>
        </g>

        <!-- ================= BOTTOM INFO CARD ================= -->
        <rect x="150" y="425" width="500" height="60" rx="8" fill="#ffffff" stroke="var(--grid)" stroke-width="2"/>
        <text x="400" y="448" text-anchor="middle" font-size="14" fill="var(--text)">
            A higher Bulk Modulus (<tspan class="math" font-weight="700">B</tspan>) means the fluid is harder to compress,
        </text>
        <text x="400" y="468" text-anchor="middle" font-size="14" fill="var(--text)">
            resulting in a faster longitudinal wave speed: 
            <tspan class="math" font-weight="700" fill="var(--velocity)">v = √(B/ρ)</tspan>
        </text>

    </svg>
</body>
</html>
