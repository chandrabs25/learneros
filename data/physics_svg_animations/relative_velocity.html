<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relative Velocity Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 700;
            fill: #212529;
            text-anchor: middle;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 600;
            fill: #495057;
            text-anchor: middle;
        }

        .legend-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            fill: #495057;
        }

        .vec-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
            fill: #06D6A0;
            text-anchor: middle;
            transition: all 0.3s ease;
        }

        .vec-label.purple {
            fill: #7209B7;
        }

        .formula-title {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            fill: #495057;
            text-anchor: middle;
        }

        .formula-math {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            fill: #212529;
            text-anchor: middle;
        }

        .vector-group {
            cursor: pointer;
        }

        .vector-group:hover line {
            filter: brightness(1.1);
            stroke-width: 4px;
        }
        
        .vector-group.relative:hover line {
            stroke-width: 6px;
        }

        .vector-group:hover .vec-label {
            font-size: 16px;
            fill: #000;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Relative Velocity Animation</title>
        <desc>Animation showing relative velocity between two cars in same and opposite directions, and from a shifted frame of reference.</desc>

        <defs>
            <!-- Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#dee2e6" stroke-width="1" />
            </pattern>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15" />
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-green" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#06D6A0" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#7209B7" />
            </marker>

            <!-- Car Templates -->
            <g id="car-body-A">
                <rect x="-30" y="-15" width="60" height="25" rx="5" fill="#4361EE" filter="url(#shadow)" />
                <rect x="-15" y="-25" width="30" height="10" rx="3" fill="#3f37c9" />
                <rect x="10" y="-10" width="15" height="10" rx="2" fill="#e9ecef" opacity="0.8" />
            </g>
            <g id="car-body-B">
                <rect x="-30" y="-15" width="60" height="25" rx="5" fill="#FF3366" filter="url(#shadow)" />
                <rect x="-15" y="-25" width="30" height="10" rx="3" fill="#d90429" />
                <rect x="10" y="-10" width="15" height="10" rx="2" fill="#e9ecef" opacity="0.8" />
            </g>

            <!-- Wheel Template -->
            <g id="wheel">
                <circle r="7" fill="#212529" />
                <circle r="3" fill="#ced4da" />
                <line x1="-7" y1="0" x2="7" y2="0" stroke="#f8f9fa" stroke-width="1.5" />
                <line x1="0" y1="-7" x2="0" y2="7" stroke="#f8f9fa" stroke-width="1.5" />
            </g>
        </defs>

        <!-- Master Timers (Invisible) -->
        <!-- 6s per phase: 5s motion + 1s pause/reset -->
        <rect width="0" height="0">
            <animate id="p1" attributeName="x" from="0" to="1" begin="0s; p3.end" dur="6s" />
            <animate id="p2" attributeName="x" from="0" to="1" begin="p1.end" dur="6s" />
            <animate id="p3" attributeName="x" from="0" to="1" begin="p2.end" dur="6s" />
        </rect>

        <!-- Moving Environment (Grid + Road) -->
        <g id="moving-environment">
            <rect x="-400" y="0" width="1600" height="500" fill="url(#grid)" />
            
            <!-- Road -->
            <rect x="-400" y="160" width="1600" height="160" fill="#343a40" />
            <line x1="-400" y1="160" x2="1200" y2="160" stroke="#adb5bd" stroke-width="3" />
            <line x1="-400" y1="320" x2="1200" y2="320" stroke="#adb5bd" stroke-width="3" />
            <line x1="-400" y1="240" x2="1200" y2="240" stroke="#f8f9fa" stroke-width="4" stroke-dasharray="30 30" />

            <!-- Environment Translation (Only moves in Phase 3) -->
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 0" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
            <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 0 0" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
            <animateTransform attributeName="transform" type="translate" values="0 0; -400 0; -400 0" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
        </g>

        <!-- Scene Fade Controller -->
        <g id="scene">
            <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p1.begin" dur="6s" fill="freeze" />
            <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p2.begin" dur="6s" fill="freeze" />
            <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p3.begin" dur="6s" fill="freeze" />

            <!-- CAR A (Observer) -->
            <g id="carA">
                <!-- Car A Translation -->
                <animateTransform attributeName="transform" type="translate" values="150 200; 550 200; 550 200" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                <animateTransform attributeName="transform" type="translate" values="150 200; 550 200; 550 200" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                <animateTransform attributeName="transform" type="translate" values="350 200; 350 200; 350 200" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />

                <use href="#car-body-A" />
                
                <!-- Car A Wheels -->
                <g transform="translate(-15, 10)">
                    <use href="#wheel" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 1440; 1440" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 1440; 1440" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 0; 0" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                </g>
                <g transform="translate(15, 10)">
                    <use href="#wheel" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 1440; 1440" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 1440; 1440" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 0; 0" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                </g>

                <!-- Vector A -->
                <g class="vector-group">
                    <line x1="0" y1="-35" y2="-35" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)">
                        <animate attributeName="x2" values="80; 80; 80" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="80; 80; 80" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="0; 0; 0" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                        <animate attributeName="opacity" values="1; 1; 1" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                        <animate attributeName="opacity" values="1; 1; 1" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                        <animate attributeName="opacity" values="0; 0; 0" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                    </line>
                    <!-- Label P1/P2 -->
                    <g opacity="0">
                        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p1.begin" dur="6s" fill="freeze" />
                        <text x="40" y="-45" class="vec-label">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 40</text>
                    </g>
                    <g opacity="0">
                        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p2.begin" dur="6s" fill="freeze" />
                        <text x="40" y="-45" class="vec-label">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">A</tspan> = 40</text>
                    </g>
                </g>
            </g>

            <!-- CAR B (Target) -->
            <g id="carB">
                <!-- Car B Translation -->
                <animateTransform attributeName="transform" type="translate" values="150 280; 750 280; 750 280" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                <animateTransform attributeName="transform" type="translate" values="750 280; 350 280; 350 280" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                <animateTransform attributeName="transform" type="translate" values="250 280; 450 280; 450 280" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />

                <use href="#car-body-B" />
                
                <!-- Car B Wheels -->
                <g transform="translate(-15, 10)">
                    <use href="#wheel" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 2160; 2160" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; -1440; -1440" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 720; 720" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                </g>
                <g transform="translate(15, 10)">
                    <use href="#wheel" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 2160; 2160" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; -1440; -1440" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                    <animateTransform attributeName="transform" type="rotate" values="0; 720; 720" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                </g>

                <!-- Vector B -->
                <g class="vector-group">
                    <line x1="0" y1="-35" y2="-35" stroke="#06D6A0" stroke-width="3" marker-end="url(#arrow-green)">
                        <animate attributeName="x2" values="120; 120; 120" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="-80; -80; -80" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="40; 40; 40" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                    </line>
                </g>

                <!-- Vector BA (Relative) -->
                <g class="vector-group relative">
                    <line x1="0" y1="45" y2="45" stroke="#7209B7" stroke-width="5" marker-end="url(#arrow-purple)">
                        <animate attributeName="x2" values="40; 40; 40" keyTimes="0; 0.833; 1" begin="p1.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="-160; -160; -160" keyTimes="0; 0.833; 1" begin="p2.begin" dur="6s" fill="freeze" />
                        <animate attributeName="x2" values="40; 40; 40" keyTimes="0; 0.833; 1" begin="p3.begin" dur="6s" fill="freeze" />
                    </line>
                </g>

                <!-- Labels for Car B and Relative Velocity -->
                <!-- P1 Labels -->
                <g opacity="0">
                    <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p1.begin" dur="6s" fill="freeze" />
                    <text x="60" y="-45" class="vec-label">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = 60</text>
                    <text x="20" y="65" class="vec-label purple">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = +20</text>
                </g>
                <!-- P2 Labels -->
                <g opacity="0">
                    <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p2.begin" dur="6s" fill="freeze" />
                    <text x="-40" y="-45" class="vec-label">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = -40</text>
                    <text x="-80" y="65" class="vec-label purple">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = -80</text>
                </g>
                <!-- P3 Labels -->
                <g opacity="0">
                    <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p3.begin" dur="6s" fill="freeze" />
                    <text x="20" y="-45" class="vec-label">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">B</tspan> = 20</text>
                    <text x="20" y="65" class="vec-label purple">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = +20</text>
                </g>
            </g>
        </g>

        <!-- Static UI Elements -->
        
        <!-- Title -->
        <text x="400" y="40" class="title">Relative Velocity in 1D</text>
        <text x="400" y="65" class="subtitle">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">B</tspan> - v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">A</tspan></text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect width="170" height="110" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)" />
            <text x="85" y="20" font-family="Inter" font-size="12" font-weight="700" fill="#212529" text-anchor="middle">LEGEND</text>
            
            <rect x="15" y="35" width="12" height="12" rx="2" fill="#4361EE" />
            <text x="35" y="45" class="legend-text">Car A (Observer)</text>
            
            <rect x="15" y="55" width="12" height="12" rx="2" fill="#FF3366" />
            <text x="35" y="65" class="legend-text">Car B (Target)</text>
            
            <line x1="15" y1="80" x2="27" y2="80" stroke="#06D6A0" stroke-width="3" />
            <text x="35" y="84" class="legend-text">Velocity (v&#x20D7;)</text>
            
            <line x1="15" y1="98" x2="27" y2="98" stroke="#7209B7" stroke-width="4" />
            <text x="35" y="102" class="legend-text">Relative Vel. (v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan>)</text>
        </g>

        <!-- Formula Display Box -->
        <g transform="translate(150, 390)">
            <rect width="500" height="85" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)" />
            
            <!-- P1 Formula -->
            <g opacity="0">
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p1.begin" dur="6s" fill="freeze" />
                <text x="250" y="30" class="formula-title">Phase 1: Same Direction (Subtraction)</text>
                <text x="250" y="62" class="formula-math">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = 60 - 40 = <tspan fill="#7209B7">+20 units/s</tspan></text>
            </g>
            
            <!-- P2 Formula -->
            <g opacity="0">
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p2.begin" dur="6s" fill="freeze" />
                <text x="250" y="30" class="formula-title">Phase 2: Opposite Direction (Addition)</text>
                <text x="250" y="62" class="formula-math">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = (-40) - 40 = <tspan fill="#7209B7">-80 units/s</tspan></text>
            </g>
            
            <!-- P3 Formula -->
            <g opacity="0">
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.083; 0.833; 0.916; 1" begin="p3.begin" dur="6s" fill="freeze" />
                <text x="250" y="30" class="formula-title">Phase 3: Observer's Frame (Car A is stationary)</text>
                <text x="250" y="62" class="formula-math">v&#x20D7;<tspan baseline-shift="sub" font-size="0.7em">BA</tspan> = 20 - 0 = <tspan fill="#7209B7">+20 units/s</tspan></text>
            </g>
        </g>

    </svg>
</div>

</body>
</html>
