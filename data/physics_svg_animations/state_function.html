<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Function: Path Independence of Electric Potential</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 900px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            border-radius: 16px;
        }
        text {
            user-select: none;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Animations */
        @keyframes probe1 {
            0% { offset-distance: 0%; opacity: 1; }
            8.33% { offset-distance: 35.71%; } /* Reaches R1 */
            12.5% { offset-distance: 44.29%; } /* Leaves R1 */
            16.67% { offset-distance: 55.71%; } /* Reaches R2 */
            20.83% { offset-distance: 64.29%; } /* Leaves R2 */
            29.17% { offset-distance: 100%; opacity: 1; } /* Reaches B */
            33.33% { offset-distance: 100%; opacity: 1; } /* Hold at B */
            34% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes probe2 {
            0%, 37.5% { opacity: 0; offset-distance: 0%; }
            41.67% { opacity: 1; offset-distance: 0%; } /* Starts at A */
            50% { offset-distance: 35.71%; } /* Reaches Battery */
            51.67% { offset-distance: 41.43%; } /* Leaves Battery */
            55.67% { offset-distance: 58.57%; } /* Reaches R3 */
            59.83% { offset-distance: 67.14%; } /* Leaves R3 */
            67.5% { offset-distance: 100%; opacity: 1; } /* Reaches B */
            75% { offset-distance: 100%; opacity: 1; } /* Hold at B */
            76% { opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes indicator {
            0%, 8.33% { transform: translateY(0px); }
            12.5%, 16.67% { transform: translateY(50px); } /* After R1 (-5V) */
            20.83%, 33.33% { transform: translateY(100px); } /* After R2 (-10V) */
            37.5%, 50% { transform: translateY(0px); } /* Reset */
            51.67%, 55.67% { transform: translateY(-100px); } /* After Battery (+10V) */
            59.83%, 100% { transform: translateY(100px); } /* After R3 (-10V) */
        }

        @keyframes meterPos {
            0%, 50% { transform: scaleY(0); }
            51.67%, 55.67% { transform: scaleY(1); } /* Battery Gain */
            57.75%, 100% { transform: scaleY(0); } /* Drops through 0 during R3 */
        }

        @keyframes meterNeg {
            0%, 8.33% { transform: scaleY(0); }
            12.5%, 16.67% { transform: scaleY(0.5); } /* R1 Drop */
            20.83%, 33.33% { transform: scaleY(1); } /* R2 Drop */
            37.5%, 55.67% { transform: scaleY(0); } /* Reset & Battery Gain */
            57.75% { transform: scaleY(0); } /* Crosses 0 during R3 */
            59.83%, 100% { transform: scaleY(1); } /* R3 Drop Final */
        }

        @keyframes fadeInGlow {
            0%, 73% { opacity: 0; }
            76%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        .probe-1 {
            offset-path: path('M 150 250 L 150 100 L 550 100 L 550 250');
            animation: probe1 12s linear infinite;
        }

        .probe-2 {
            offset-path: path('M 150 250 L 150 400 L 550 400 L 550 250');
            animation: probe2 12s linear infinite;
        }

        .meter-indicator {
            animation: indicator 12s linear infinite;
        }

        .meter-pos {
            transform-origin: 700px 250px;
            animation: meterPos 12s linear infinite;
        }

        .meter-neg {
            transform-origin: 700px 250px;
            animation: meterNeg 12s linear infinite;
        }

        .glow-overlay {
            animation: fadeInGlow 12s linear infinite;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Glow Filter for Probe and Path Equivalence -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>

        <!-- Resistor Symbol (60px wide) -->
        <g id="resistor">
            <path d="M 0 0 L 8 0 L 12 -12 L 20 12 L 28 -12 L 36 12 L 44 -12 L 48 0 L 60 0" 
                  fill="none" stroke="#4361EE" stroke-width="3" stroke-linejoin="round"/>
        </g>

        <!-- Battery Symbol (40px wide) -->
        <g id="battery">
            <line x1="0" y1="0" x2="15" y2="0" stroke="#333333" stroke-width="3" />
            <line x1="15" y1="-16" x2="15" y2="16" stroke="#333333" stroke-width="5" />
            <line x1="25" y1="-24" x2="25" y2="24" stroke="#333333" stroke-width="2" />
            <line x1="25" y1="0" x2="40" y2="0" stroke="#333333" stroke-width="3" />
            <!-- Plus/Minus labels -->
            <text x="8" y="-20" font-size="14" font-weight="bold" fill="#FF3366" class="math">-</text>
            <text x="30" y="-20" font-size="14" font-weight="bold" fill="#06D6A0" class="math">+</text>
        </g>
    </defs>

    <!-- Title -->
    <text x="400" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#2D3436">State Function: Path Independence of Electric Potential</text>
    
    <!-- Base Circuit Wires -->
    <g fill="none" stroke="#333333" stroke-width="3">
        <!-- Path 1 (Top) -->
        <path d="M 150 250 L 150 100 L 250 100" />
        <path d="M 310 100 L 390 100" />
        <path d="M 450 100 L 550 100 L 550 250" />
        
        <!-- Path 2 (Bottom) -->
        <path d="M 150 250 L 150 400 L 250 400" />
        <path d="M 290 400 L 410 400" />
        <path d="M 470 400 L 550 400 L 550 250" />
    </g>

    <!-- Components -->
    <use href="#resistor" x="250" y="100" />
    <use href="#resistor" x="390" y="100" />
    <use href="#battery" x="250" y="400" />
    <use href="#resistor" x="410" y="400" />

    <!-- Component Labels -->
    <text x="280" y="75" font-size="16" font-weight="bold" fill="#4361EE" text-anchor="middle" class="math">R₁</text>
    <text x="420" y="75" font-size="16" font-weight="bold" fill="#4361EE" text-anchor="middle" class="math">R₂</text>
    <text x="270" y="445" font-size="16" font-weight="bold" fill="#06D6A0" text-anchor="middle" class="math">ε₁</text>
    <text x="440" y="445" font-size="16" font-weight="bold" fill="#4361EE" text-anchor="middle" class="math">R₃</text>

    <!-- Nodes -->
    <circle cx="150" cy="250" r="8" fill="#2D3436" stroke="#06D6A0" stroke-width="2" />
    <circle cx="550" cy="250" r="8" fill="#2D3436" stroke="#FF3366" stroke-width="2" />
    
    <text x="135" y="255" font-size="16" font-weight="bold" fill="#2D3436" text-anchor="end" class="math">Node A (V_A)</text>
    <text x="565" y="255" font-size="16" font-weight="bold" fill="#2D3436" text-anchor="start" class="math">Node B (V_B)</text>

    <!-- Glow Overlay (Phase 4) -->
    <g class="glow-overlay">
        <path d="M 150 250 L 150 100 L 550 100 L 550 250" fill="none" stroke="#F77F00" stroke-width="6" filter="url(#glow-orange)" opacity="0.6" />
        <path d="M 150 250 L 150 400 L 550 400 L 550 250" fill="none" stroke="#F77F00" stroke-width="6" filter="url(#glow-orange)" opacity="0.6" />
        
        <!-- Equation Overlay -->
        <rect x="230" y="200" width="240" height="100" fill="#ffffff" rx="10" opacity="0.9" stroke="#F77F00" stroke-width="2" />
        <text x="350" y="245" font-size="22" fill="#F77F00" text-anchor="middle" class="math">
            <tspan font-weight="normal">∫</tspan> <tspan font-weight="bold">E</tspan> · <tspan font-weight="bold">dl</tspan> = <tspan font-weight="normal">∫</tspan> <tspan font-weight="bold">E</tspan> · <tspan font-weight="bold">dl</tspan>
        </text>
        <text x="270" y="265" font-size="12" fill="#F77F00" text-anchor="middle" font-weight="bold">Path 1</text>
        <text x="430" y="265" font-size="12" fill="#F77F00" text-anchor="middle" font-weight="bold">Path 2</text>
        <text x="350" y="285" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">ΔV is Path Independent</text>
    </g>

    <!-- Potential Meter -->
    <g id="meter">
        <!-- Axis -->
        <line x1="700" y1="130" x2="700" y2="370" stroke="#333333" stroke-width="2" />
        
        <!-- Ticks and Labels -->
        <line x1="695" y1="150" x2="705" y2="150" stroke="#333333" stroke-width="2" />
        <text x="715" y="155" font-size="14" fill="#06D6A0" font-weight="bold" class="math">+10V</text>
        
        <line x1="695" y1="200" x2="705" y2="200" stroke="#333333" stroke-width="1" />
        
        <line x1="690" y1="250" x2="710" y2="250" stroke="#333333" stroke-width="2" />
        <text x="715" y="255" font-size="14" fill="#333333" font-weight="bold" class="math">0V (V_A)</text>
        
        <line x1="695" y1="300" x2="705" y2="300" stroke="#333333" stroke-width="1" />
        
        <line x1="695" y1="350" x2="705" y2="350" stroke="#333333" stroke-width="2" />
        <text x="715" y="355" font-size="14" fill="#FF3366" font-weight="bold" class="math">-10V (V_B)</text>

        <!-- Dynamic Bars -->
        <rect x="696" y="150" width="8" height="100" fill="#06D6A0" class="meter-pos" />
        <rect x="696" y="250" width="8" height="100" fill="#FF3366" class="meter-neg" />

        <!-- Indicator -->
        <g class="meter-indicator">
            <polygon points="694,250 684,244 684,256" fill="#7209B7" />
            <line x1="684" y1="250" x2="640" y2="250" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 2" />
            <text x="635" y="254" font-size="13" font-weight="bold" fill="#7209B7" text-anchor="end">Probe Potential</text>
        </g>
    </g>

    <!-- Animated Probes -->
    <circle r="7" fill="#FF3366" filter="url(#glow)" class="probe-1" />
    <circle r="7" fill="#FF3366" filter="url(#glow)" class="probe-2" />

    <!-- Legend -->
    <rect x="20" y="390" width="160" height="90" fill="#ffffff" rx="8" stroke="#e0e0e0" stroke-width="1" />
    <text x="30" y="410" font-size="12" font-weight="bold" fill="#333333">Legend</text>
    
    <circle cx="35" cy="425" r="5" fill="#FF3366" />
    <text x="45" y="429" font-size="11" fill="#333333">Potential Drop / Probe</text>
    
    <circle cx="35" cy="445" r="5" fill="#06D6A0" />
    <text x="45" y="449" font-size="11" fill="#333333">Potential Gain</text>
    
    <line x1="30" y1="465" x2="40" y2="465" stroke="#F77F00" stroke-width="3" />
    <text x="45" y="469" font-size="11" fill="#333333">Electric Field Work</text>

    <!-- Footer Note -->
    <text x="400" y="485" font-size="12" fill="#6c757d" text-anchor="middle" font-style="italic">
        In a conservative field, the work done per unit charge depends only on the initial and final positions.
    </text>

</svg>

</body>
</html>
