<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intermolecular Forces and Surface Tension</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #212529;
        }
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Animations */
        .phase1 {
            animation: phase1-anim 10s infinite;
        }
        @keyframes phase1-anim {
            0% { opacity: 0; }
            5%, 25% { opacity: 1; }
            30%, 100% { opacity: 0; }
        }

        .phase2 {
            animation: phase2-anim 10s infinite;
        }
        @keyframes phase2-anim {
            0%, 25% { opacity: 0; }
            30%, 65% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }

        .phase3 {
            animation: phase3-anim 10s infinite;
        }
        @keyframes phase3-anim {
            0%, 65% { opacity: 0; }
            70%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        .surface-straight {
            animation: surface-straight-anim 10s infinite;
        }
        @keyframes surface-straight-anim {
            0%, 25% { opacity: 1; }
            30%, 65% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }

        .arrows-A {
            transform-origin: 250px 320px;
            animation: grow-arrows-A 10s infinite;
        }
        @keyframes grow-arrows-A {
            0% { transform: scale(0); opacity: 0; }
            5%, 25% { transform: scale(1); opacity: 1; }
            30%, 100% { transform: scale(0); opacity: 0; }
        }

        .arrows-B {
            transform-origin: 550px 150px;
            animation: grow-arrows-B 10s infinite;
        }
        @keyframes grow-arrows-B {
            0%, 25% { transform: scale(0); opacity: 0; }
            30%, 65% { transform: scale(1); opacity: 1; }
            70%, 100% { transform: scale(0); opacity: 0; }
        }

        .net-arrow {
            transform-origin: 550px 150px;
            animation: pulse-net 10s infinite;
        }
        @keyframes pulse-net {
            0%, 35% { transform: scaleY(0); opacity: 0; }
            40% { transform: scaleY(1.1); opacity: 1; }
            45% { transform: scaleY(1.0); opacity: 1; }
            50% { transform: scaleY(1.1); opacity: 1; }
            55% { transform: scaleY(1.0); opacity: 1; }
            60% { transform: scaleY(1.1); opacity: 1; }
            65%, 100% { transform: scaleY(0); opacity: 0; }
        }

        .molecule-vibrate {
            animation: vibrate 0.5s infinite alternate ease-in-out;
        }
        @keyframes vibrate {
            0% { transform: translate(0, 0); }
            100% { transform: translate(1px, -1px); }
        }

        .glow-pulse {
            animation: glow-anim 10s infinite;
        }
        @keyframes glow-anim {
            0%, 65% { opacity: 0; }
            70%, 95% { opacity: 0.6; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Intermolecular Forces: Bulk vs. Surface</title>
        <desc>Diagram showing balanced intermolecular forces in the bulk of a liquid and unbalanced inward forces at the surface.</desc>

        <defs>
            <!-- Arrowhead for attractive forces -->
            <marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <polygon points="0 0, 6 3, 0 6" fill="#FF3366" />
            </marker>
            <!-- Arrowhead for net force -->
            <marker id="arrowhead-net" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
                <polygon points="0 0, 8 4, 0 8" fill="#FF3366" />
            </marker>
            <!-- Glow filter for surface film -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Title -->
        <text x="400" y="40" font-size="24" font-weight="700" text-anchor="middle">Intermolecular Forces: Bulk vs. Surface</text>

        <!-- Liquid Container -->
        <rect x="100" y="150" width="600" height="300" fill="#E0F2FE" stroke="#BEE3F8" stroke-width="2" />
        
        <!-- Surface Film Highlight (Phase 3) -->
        <rect x="100" y="150" width="600" height="25" fill="#F77F00" filter="url(#glow)" class="glow-pulse" />

        <!-- Straight Surface Line -->
        <line class="surface-straight" x1="100" y1="150" x2="700" y2="150" stroke="#4361EE" stroke-width="2" />

        <!-- Dipped Surface Line (Phase 2) -->
        <g class="phase2">
            <!-- Hide the straight part -->
            <rect x="480" y="148" width="140" height="4" fill="#f8f9fa" />
            <!-- Dipped liquid fill -->
            <path d="M 480 150 Q 550 175 620 150 Z" fill="#E0F2FE" />
            <!-- Dipped line -->
            <path d="M 480 150 Q 550 175 620 150" fill="none" stroke="#4361EE" stroke-width="2" />
        </g>

        <!-- ========================================== -->
        <!-- MOLECULE A: BULK (Balanced Forces)         -->
        <!-- ========================================== -->
        
        <!-- Sphere of Influence A -->
        <circle cx="250" cy="320" r="70" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4" />
        <line x1="250" y1="320" x2="300" y2="270" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 2" />
        <text x="285" y="285" font-size="14" class="math" fill="#495057">r_o</text>

        <!-- Surrounding Molecules A -->
        <g opacity="0.3" fill="#4361EE">
            <circle cx="305" cy="320" r="6" />
            <circle cx="289" cy="359" r="6" />
            <circle cx="250" cy="375" r="6" />
            <circle cx="211" cy="359" r="6" />
            <circle cx="195" cy="320" r="6" />
            <circle cx="211" cy="281" r="6" />
            <circle cx="250" cy="265" r="6" />
            <circle cx="289" cy="281" r="6" />
        </g>

        <!-- Force Vectors A (Phase 1) -->
        <g class="arrows-A" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowhead)">
            <line x1="250" y1="320" x2="285" y2="320" />
            <line x1="250" y1="320" x2="275" y2="345" />
            <line x1="250" y1="320" x2="250" y2="355" />
            <line x1="250" y1="320" x2="225" y2="345" />
            <line x1="250" y1="320" x2="215" y2="320" />
            <line x1="250" y1="320" x2="225" y2="295" />
            <line x1="250" y1="320" x2="250" y2="285" />
            <line x1="250" y1="320" x2="275" y2="295" />
        </g>

        <!-- Central Molecule A -->
        <circle cx="250" cy="320" r="12" fill="#4361EE" class="molecule-vibrate" />

        <!-- Labels A -->
        <text x="250" y="420" font-size="16" font-weight="600" text-anchor="middle">Bulk Molecule</text>
        <text x="250" y="445" font-size="16" font-weight="700" class="math phase1" fill="#FF3366" text-anchor="middle">ΣF = 0</text>

        <!-- Potential Energy Gauge A -->
        <rect x="140" y="280" width="16" height="60" fill="none" stroke="#212529" stroke-width="2" rx="2" />
        <rect x="142" y="320" width="12" height="18" fill="#4361EE" rx="1" />
        <text x="148" y="360" font-size="12" font-weight="600" text-anchor="middle">PE</text>


        <!-- ========================================== -->
        <!-- MOLECULE B: SURFACE (Unbalanced Forces)    -->
        <!-- ========================================== -->

        <!-- Sphere of Influence B -->
        <circle cx="550" cy="150" r="70" fill="none" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="6 4" />
        <line x1="550" y1="150" x2="600" y2="100" stroke="#ADB5BD" stroke-width="1.5" stroke-dasharray="2 2" />
        <text x="585" y="115" font-size="14" class="math" fill="#495057">r_o</text>

        <!-- Surrounding Molecules B (Lower Hemisphere Only) -->
        <g opacity="0.3" fill="#4361EE">
            <circle cx="605" cy="150" r="6" />
            <circle cx="589" cy="189" r="6" />
            <circle cx="550" cy="205" r="6" />
            <circle cx="511" cy="189" r="6" />
            <circle cx="495" cy="150" r="6" />
        </g>

        <!-- Force Vectors B (Phase 2) -->
        <g class="arrows-B" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowhead)">
            <line x1="550" y1="150" x2="585" y2="150" />
            <line x1="550" y1="150" x2="575" y2="175" />
            <line x1="550" y1="150" x2="550" y2="185" />
            <line x1="550" y1="150" x2="525" y2="175" />
            <line x1="550" y1="150" x2="515" y2="150" />
        </g>

        <!-- Net Force Vector B (Phase 2) -->
        <line x1="550" y1="150" x2="550" y2="230" class="net-arrow" stroke="#FF3366" stroke-width="6" marker-end="url(#arrowhead-net)" />

        <!-- Central Molecule B -->
        <circle cx="550" cy="150" r="12" fill="#4361EE" class="molecule-vibrate" />

        <!-- Labels B -->
        <text x="550" y="65" font-size="16" font-weight="600" text-anchor="middle">Surface Molecule</text>
        <text x="550" y="90" font-size="16" font-weight="700" class="math phase2" fill="#FF3366" text-anchor="middle">F_net ≠ 0 (Inward Pull)</text>

        <!-- Potential Energy Gauge B -->
        <rect x="650" y="100" width="16" height="60" fill="none" stroke="#212529" stroke-width="2" rx="2" />
        <rect x="652" y="110" width="12" height="48" fill="#4361EE" rx="1" />
        <text x="658" y="180" font-size="12" font-weight="600" text-anchor="middle">PE</text>
        <text x="658" y="85" font-size="12" font-weight="700" fill="#F77F00" class="phase3" text-anchor="middle">Higher PE</text>


        <!-- ========================================== -->
        <!-- PHASE 3 ANNOTATION (Energy & Work)         -->
        <!-- ========================================== -->
        <g class="phase3">
            <rect x="180" y="220" width="440" height="40" fill="#ffffff" opacity="0.9" rx="8" stroke="#F77F00" stroke-width="2" />
            <text x="400" y="246" font-size="16" font-weight="600" fill="#F77F00" text-anchor="middle">Work must be done against inward forces to reach the surface</text>
        </g>


        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(580, 390)">
            <rect x="0" y="0" width="190" height="80" fill="#ffffff" stroke="#dee2e6" stroke-width="2" rx="6" />
            <text x="95" y="20" font-size="12" font-weight="700" text-anchor="middle" fill="#6c757d">LEGEND</text>
            
            <circle cx="20" cy="40" r="6" fill="#4361EE" />
            <text x="35" y="44" font-size="13" font-weight="500">Molecule</text>
            
            <line x1="15" y1="62" x2="30" y2="62" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowhead)" />
            <text x="45" y="66" font-size="13" font-weight="500">Attractive Force</text>
        </g>

    </svg>
</body>
</html>
