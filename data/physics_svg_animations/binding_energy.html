<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binding Energy & Mass Defect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px 25px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10;
            backdrop-filter: blur(5px);
            border: 1px solid #e9ecef;
        }
        button {
            background: #4361EE;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 80px;
        }
        button:hover {
            background: #3651d4;
        }
        input[type=range] {
            width: 200px;
            accent-color: #4361EE;
            cursor: pointer;
        }
        
        /* CSS Animations */
        .anim {
            animation-duration: 12s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
            animation-play-state: running;
            animation-fill-mode: both;
        }

        /* Nucleon Movements */
        @keyframes p1-move {
            0%, 25% { transform: translate(200px, 150px); opacity: 1; }
            41.6% { transform: translate(370px, 220px); opacity: 1; }
            50%, 66.6% { transform: translate(388px, 238px); opacity: 1; }
            75% { transform: translate(238px, 423px); opacity: 1; }
            85%, 91.6% { transform: translate(243px, 384px); opacity: 1; }
            95% { opacity: 0; }
            100% { transform: translate(200px, 150px); opacity: 1; }
        }
        @keyframes p2-move {
            0%, 25% { transform: translate(600px, 350px); opacity: 1; }
            41.6% { transform: translate(430px, 280px); opacity: 1; }
            50%, 66.6% { transform: translate(412px, 262px); opacity: 1; }
            75% { transform: translate(262px, 447px); opacity: 1; }
            85%, 91.6% { transform: translate(267px, 408px); opacity: 1; }
            95% { opacity: 0; }
            100% { transform: translate(600px, 350px); opacity: 1; }
        }
        @keyframes n1-move {
            0%, 25% { transform: translate(600px, 150px); opacity: 1; }
            41.6% { transform: translate(430px, 220px); opacity: 1; }
            50%, 66.6% { transform: translate(412px, 238px); opacity: 1; }
            75% { transform: translate(262px, 423px); opacity: 1; }
            85%, 91.6% { transform: translate(267px, 384px); opacity: 1; }
            95% { opacity: 0; }
            100% { transform: translate(600px, 150px); opacity: 1; }
        }
        @keyframes n2-move {
            0%, 25% { transform: translate(200px, 350px); opacity: 1; }
            41.6% { transform: translate(370px, 280px); opacity: 1; }
            50%, 66.6% { transform: translate(388px, 262px); opacity: 1; }
            75% { transform: translate(238px, 447px); opacity: 1; }
            85%, 91.6% { transform: translate(243px, 408px); opacity: 1; }
            95% { opacity: 0; }
            100% { transform: translate(200px, 350px); opacity: 1; }
        }

        /* Free Nucleons */
        @keyframes free-nucleons {
            0%, 66.6% { opacity: 0; transform: translate(550px, 435px); }
            75% { opacity: 1; transform: translate(550px, 435px); }
            85%, 91.6% { opacity: 1; transform: translate(545px, 474px); }
            95%, 100% { opacity: 0; transform: translate(545px, 474px); }
        }

        /* Forces */
        @keyframes coulomb {
            0%, 25% { opacity: 0; }
            35%, 41.6% { opacity: 1; }
            42%, 100% { opacity: 0; }
        }
        @keyframes strong-force {
            0%, 41.6% { opacity: 0; }
            42%, 50% { opacity: 1; }
            55%, 100% { opacity: 0; }
        }

        /* Energy Pulse */
        @keyframes energy-pulse {
            0%, 49% { opacity: 0; transform: scale(0); transform-origin: 400px 250px; }
            50% { opacity: 1; transform: scale(0.1); transform-origin: 400px 250px; }
            66.6% { opacity: 0; transform: scale(4); transform-origin: 400px 250px; }
            100% { opacity: 0; transform: scale(4); transform-origin: 400px 250px; }
        }

        /* Scale Animations */
        @keyframes scale-appear {
            0%, 66.6% { opacity: 0; }
            75%, 91.6% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes beam-tilt {
            0%, 75% { transform: rotate(0deg); }
            85%, 91.6% { transform: rotate(15deg); }
            95%, 100% { transform: rotate(15deg); }
        }
        @keyframes pan-counter-tilt {
            0%, 75% { transform: rotate(0deg); }
            85%, 91.6% { transform: rotate(-15deg); }
            95%, 100% { transform: rotate(-15deg); }
        }

        /* Labels */
        @keyframes label-scattered {
            0%, 20% { opacity: 1; }
            25%, 100% { opacity: 0; }
        }
        @keyframes label-coulomb {
            0%, 25% { opacity: 0; }
            30%, 40% { opacity: 1; }
            42%, 100% { opacity: 0; }
        }
        @keyframes label-strong {
            0%, 41% { opacity: 0; }
            43%, 55% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }
        @keyframes label-energy {
            0%, 49% { opacity: 0; }
            52%, 65% { opacity: 1; }
            68%, 100% { opacity: 0; }
        }
        @keyframes label-mass {
            0%, 70% { opacity: 0; }
            75%, 91.6% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes well-fade {
            0%, 66.6% { opacity: 0.4; }
            75%, 100% { opacity: 0; }
        }

        .p1 { animation-name: p1-move; }
        .p2 { animation-name: p2-move; }
        .n1 { animation-name: n1-move; }
        .n2 { animation-name: n2-move; }
        .free-group { animation-name: free-nucleons; }
        .coulomb-arrow { animation-name: coulomb; }
        .strong-arrow { animation-name: strong-force; }
        .energy-wave { animation-name: energy-pulse; }
        .scale-group { animation-name: scale-appear; }
        .beam-group { animation-name: beam-tilt; }
        .left-pan, .right-pan { animation-name: pan-counter-tilt; }
        .lbl-scattered { animation-name: label-scattered; }
        .lbl-coulomb { animation-name: label-coulomb; }
        .lbl-strong { animation-name: label-strong; }
        .lbl-energy { animation-name: label-energy; }
        .lbl-mass { animation-name: label-mass; }
        .well-bg { animation-name: well-fade; }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 500" aria-label="Diagram showing protons and neutrons binding to form a nucleus and releasing energy.">
        <defs>
            <!-- Gradients -->
            <radialGradient id="protonGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ff80a0"/>
                <stop offset="100%" stop-color="#FF3366"/>
            </radialGradient>
            <radialGradient id="neutronGrad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#a0a5ab"/>
                <stop offset="100%" stop-color="#6C757D"/>
            </radialGradient>
            <radialGradient id="energyGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
            </radialGradient>
            
            <!-- Drop Shadow -->
            <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25" />
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrowOrange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
            </marker>
            <marker id="arrowBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#4361EE" />
            </marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF3366" />
            </marker>
        </defs>

        <!-- Background Potential Well -->
        <g class="anim well-bg">
            <path d="M 50 150 Q 400 600 750 150" fill="none" stroke="#00B4D8" stroke-width="3" stroke-dasharray="8,6"/>
            <text x="400" y="420" font-family="Inter" font-size="14" fill="#00B4D8" text-anchor="middle">Nuclear Potential Well</text>
        </g>

        <!-- Title & Formula -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="700" text-anchor="middle" fill="#212529">Binding Energy &amp; Mass Defect (⁴₂He)</text>
        <text x="400" y="490" font-family="Roboto Mono" font-size="16" font-weight="500" text-anchor="middle" fill="#212529">B.E. = [ (Z·m_p + N·m_n) - M_nucleus ] c²</text>

        <!-- Legend -->
        <g transform="translate(20, 60)">
            <rect x="0" y="0" width="110" height="60" fill="white" stroke="#e9ecef" rx="6" filter="url(#drop-shadow)"/>
            <circle cx="20" cy="18" r="8" fill="url(#protonGrad)"/>
            <text x="15" y="22" font-family="Inter" font-size="10" font-weight="bold" fill="white">+</text>
            <text x="38" y="22" font-family="Inter" font-size="12" fill="#212529">Proton</text>
            <circle cx="20" cy="42" r="8" fill="url(#neutronGrad)"/>
            <text x="38" y="46" font-family="Inter" font-size="12" fill="#212529">Neutron</text>
        </g>

        <!-- Energy Pulse -->
        <circle cx="400" cy="250" r="100" fill="url(#energyGrad)" class="anim energy-wave" />

        <!-- Mass Balance Scale -->
        <g class="anim scale-group">
            <!-- Base -->
            <path d="M 350 470 L 450 470 L 410 380 L 390 380 Z" fill="#e9ecef" stroke="#adb5bd" stroke-width="2"/>
            <circle cx="400" cy="380" r="6" fill="#495057"/>

            <!-- Beam & Pans -->
            <g class="anim beam-group" style="transform-origin: 400px 380px;">
                <line x1="250" y1="380" x2="550" y2="380" stroke="#495057" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Left Pan -->
                <g class="anim left-pan" style="transform-origin: 250px 380px;">
                    <path d="M 250 380 L 210 450 M 250 380 L 290 450" stroke="#adb5bd" stroke-width="2"/>
                    <line x1="200" y1="450" x2="300" y2="450" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
                </g>

                <!-- Right Pan -->
                <g class="anim right-pan" style="transform-origin: 550px 380px;">
                    <path d="M 550 380 L 510 450 M 550 380 L 590 450" stroke="#adb5bd" stroke-width="2"/>
                    <line x1="500" y1="450" x2="600" y2="450" stroke="#495057" stroke-width="4" stroke-linecap="round"/>
                </g>
            </g>
        </g>

        <!-- Free Nucleons (Right Pan) -->
        <g class="anim free-group" filter="url(#drop-shadow)">
            <!-- P1 -->
            <g transform="translate(-20, -20)">
                <circle cx="0" cy="0" r="15" fill="url(#protonGrad)"/>
                <text x="0" y="5" font-family="Inter" font-size="16" font-weight="bold" fill="white" text-anchor="middle">+</text>
            </g>
            <!-- P2 -->
            <g transform="translate(20, 20)">
                <circle cx="0" cy="0" r="15" fill="url(#protonGrad)"/>
                <text x="0" y="5" font-family="Inter" font-size="16" font-weight="bold" fill="white" text-anchor="middle">+</text>
            </g>
            <!-- N1 -->
            <g transform="translate(20, -20)">
                <circle cx="0" cy="0" r="15" fill="url(#neutronGrad)"/>
            </g>
            <!-- N2 -->
            <g transform="translate(-20, 20)">
                <circle cx="0" cy="0" r="15" fill="url(#neutronGrad)"/>
            </g>
        </g>

        <!-- Original Nucleons (Animate to Bound Nucleus on Left Pan) -->
        <!-- P1 (Top-Left) -->
        <g class="anim p1" filter="url(#drop-shadow)">
            <line x1="-15" y1="-15" x2="-35" y2="-35" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowOrange)" class="anim coulomb-arrow"/>
            <line x1="15" y1="15" x2="35" y2="35" stroke="#4361EE" stroke-width="5" marker-end="url(#arrowBlue)" class="anim strong-arrow"/>
            <circle cx="0" cy="0" r="15" fill="url(#protonGrad)"/>
            <text x="0" y="5" font-family="Inter" font-size="16" font-weight="bold" fill="white" text-anchor="middle">+</text>
        </g>

        <!-- P2 (Bottom-Right) -->
        <g class="anim p2" filter="url(#drop-shadow)">
            <line x1="15" y1="15" x2="35" y2="35" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowOrange)" class="anim coulomb-arrow"/>
            <line x1="-15" y1="-15" x2="-35" y2="-35" stroke="#4361EE" stroke-width="5" marker-end="url(#arrowBlue)" class="anim strong-arrow"/>
            <circle cx="0" cy="0" r="15" fill="url(#protonGrad)"/>
            <text x="0" y="5" font-family="Inter" font-size="16" font-weight="bold" fill="white" text-anchor="middle">+</text>
        </g>

        <!-- N1 (Top-Right) -->
        <g class="anim n1" filter="url(#drop-shadow)">
            <line x1="-15" y1="15" x2="-35" y2="35" stroke="#4361EE" stroke-width="5" marker-end="url(#arrowBlue)" class="anim strong-arrow"/>
            <circle cx="0" cy="0" r="15" fill="url(#neutronGrad)"/>
        </g>

        <!-- N2 (Bottom-Left) -->
        <g class="anim n2" filter="url(#drop-shadow)">
            <line x1="15" y1="-15" x2="35" y2="-35" stroke="#4361EE" stroke-width="5" marker-end="url(#arrowBlue)" class="anim strong-arrow"/>
            <circle cx="0" cy="0" r="15" fill="url(#neutronGrad)"/>
        </g>

        <!-- Dynamic Labels -->
        <text x="400" y="100" font-family="Roboto Mono" font-size="20" font-weight="600" fill="#212529" text-anchor="middle" class="anim lbl-scattered">M_total = Σ m_i</text>
        
        <text x="400" y="180" font-family="Inter" font-size="18" font-weight="600" fill="#F77F00" text-anchor="middle" class="anim lbl-coulomb">Electrostatic Repulsion</text>
        
        <text x="400" y="320" font-family="Inter" font-size="18" font-weight="600" fill="#4361EE" text-anchor="middle" class="anim lbl-strong">Strong Nuclear Force (Attractive)</text>
        
        <text x="400" y="150" font-family="Inter" font-size="22" font-weight="700" fill="#d4af37" text-anchor="middle" class="anim lbl-energy">Energy Released (B.E.)</text>
        
        <g class="anim lbl-mass">
            <text x="400" y="280" font-family="Inter" font-size="18" font-weight="700" fill="#FF3366" text-anchor="middle">Mass Defect (Δm)</text>
            <path d="M 400 290 L 400 330" stroke="#FF3366" stroke-width="3" marker-end="url(#arrowRed)"/>
        </g>

    </svg>

    <div class="controls">
        <button id="playPauseBtn">Pause</button>
        <input type="range" id="timeSlider" min="0" max="12" step="0.05" value="0" aria-label="Animation Timeline">
    </div>
</div>

<script>
    const anims = document.querySelectorAll('.anim');
    const btn = document.getElementById('playPauseBtn');
    const slider = document.getElementById('timeSlider');
    
    let isPlaying = true;
    let currentT = 0;
    let lastTime = performance.now();

    function loop(now) {
        if (isPlaying) {
            let dt = (now - lastTime) / 1000;
            currentT = (currentT + dt) % 12;
            slider.value = currentT;
        }
        lastTime = now;
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    btn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        btn.textContent = isPlaying ? "Pause" : "Play";
        if (isPlaying) {
            lastTime = performance.now();
            anims.forEach(a => {
                a.style.animationPlayState = 'running';
            });
        } else {
            anims.forEach(a => {
                a.style.animationPlayState = 'paused';
            });
        }
    });

    slider.addEventListener('input', () => {
        isPlaying = false;
        btn.textContent = "Play";
        currentT = parseFloat(slider.value);
        anims.forEach(a => {
            a.style.animationPlayState = 'paused';
            a.style.animationDelay = `-${currentT}s`;
        });
    });
</script>

</body>
</html>
