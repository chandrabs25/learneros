<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxwell's Equations & Light Propagation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');
        
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #diagram-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        .svg-wrapper {
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        @keyframes wave-flow {
            from { transform: translateX(0); }
            to { transform: translateX(240px); }
        }

        .wave-group {
            animation: wave-flow 4s linear infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-1 { animation: fadeIn 0.8s ease-out forwards; }
        .fade-in-2 { opacity: 0; animation: fadeIn 0.8s ease-out 0.8s forwards; }
        .fade-in-3 { opacity: 0; animation: fadeIn 1s ease-out 1.6s forwards; }

        .btn {
            transition: opacity 0.2s, transform 0.2s;
        }
        .btn:hover {
            opacity: 0.85;
            transform: scale(1.05);
        }
        .btn:active {
            transform: scale(0.95);
        }

        /* Math Typography */
        .math {
            font-family: 'Roboto Mono', monospace;
        }
        .math-bold {
            font-weight: 700;
        }
    </style>
</head>
<body>

<div id="diagram-container">
    <div class="svg-wrapper">
        <svg viewBox="0 0 800 500" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Maxwell’s Equations: The Propagation of Electromagnetic Waves</title>
            <desc id="svg-desc">An animated 3D diagram showing an electromagnetic wave. The electric field oscillates vertically in orange, and the magnetic field oscillates horizontally in purple. Both propagate along the x-axis in green, demonstrating their mutually perpendicular nature as described by Maxwell's equations.</desc>

            <defs>
                <!-- Arrowhead for Axes -->
                <marker id="arrow-axis" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#adb5bd" />
                </marker>
                
                <!-- Arrowhead for Electric Field (Orange) -->
                <marker id="arrow-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
                </marker>

                <!-- Arrowhead for Magnetic Field (Purple) -->
                <marker id="arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#7209B7" />
                </marker>

                <!-- Arrowhead for Propagation Velocity (Green) -->
                <marker id="arrow-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 1 L 10 5 L 0 9 z" fill="#06D6A0" />
                </marker>

                <!-- Clip path to ensure waves start exactly at the origin -->
                <clipPath id="wave-clip">
                    <rect x="150" y="0" width="650" height="500" />
                </clipPath>

                <!-- Glow Filters -->
                <filter id="glow-e" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-b" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Title -->
            <text x="400" y="40" font-size="22" font-weight="700" fill="#212529" text-anchor="middle" class="fade-in-1">Maxwell’s Equations & Light Propagation</text>

            <!-- Coordinate System Axes -->
            <g class="fade-in-1" stroke="#adb5bd" stroke-width="1.5" fill="none">
                <!-- X axis (Propagation) -->
                <line x1="150" y1="250" x2="750" y2="250" marker-end="url(#arrow-axis)" />
                <!-- Y axis (Electric Field) -->
                <line x1="150" y1="420" x2="150" y2="60" marker-end="url(#arrow-axis)" />
                <!-- Z axis (Magnetic Field) - 30 deg isometric projection -->
                <line x1="150" y1="250" x2="20.1" y2="325" marker-end="url(#arrow-axis)" />
            </g>

            <!-- Origin Point -->
            <circle cx="150" cy="250" r="4" fill="#adb5bd" class="fade-in-1" />

            <!-- Axis Labels -->
            <g class="fade-in-1" font-size="14" font-weight="600" fill="#6c757d">
                <text x="760" y="255">X</text>
                <text x="145" y="45">Y</text>
                <text x="5" y="340">Z</text>
            </g>

            <!-- Propagation Vector (v) -->
            <g class="fade-in-2">
                <line x1="620" y1="250" x2="730" y2="250" stroke="#06D6A0" stroke-width="4" marker-end="url(#arrow-v)" />
                <text x="660" y="235" class="math math-bold" font-size="18" fill="#06D6A0" font-style="italic">v = c</text>
            </g>

            <!-- Waves and Field Vectors (Clipped to start at origin) -->
            <g class="fade-in-3" clip-path="url(#wave-clip)">
                <!-- Continuous Wave Paths (Animated via CSS) -->
                <g class="wave-group" id="wave-anim-group">
                    <path id="wave-e" fill="none" stroke="#F77F00" stroke-width="3" opacity="0.85" filter="url(#glow-e)" />
                    <path id="wave-b" fill="none" stroke="#7209B7" stroke-width="3" opacity="0.85" filter="url(#glow-b)" />
                </g>
                
                <!-- Oscillating Field Vectors (Animated via JS) -->
                <g id="vectors-e"></g>
                <g id="vectors-b"></g>
            </g>

            <!-- Vector Labels -->
            <g class="fade-in-3 math math-bold" font-size="18">
                <text x="200" y="150" fill="#F77F00">E</text>
                <text x="235" y="335" fill="#7209B7">B</text>
            </g>

            <!-- Legend -->
            <g class="fade-in-2" transform="translate(580, 60)">
                <rect x="0" y="0" width="190" height="90" rx="6" fill="rgba(255,255,255,0.9)" stroke="#e9ecef" stroke-width="1" />
                
                <line x1="15" y1="25" x2="35" y2="25" stroke="#F77F00" stroke-width="3"/>
                <text x="45" y="29" font-size="12" fill="#495057">Electric Field (<tspan class="math math-bold">E</tspan>)</text>
                
                <line x1="15" y1="45" x2="35" y2="45" stroke="#7209B7" stroke-width="3"/>
                <text x="45" y="49" font-size="12" fill="#495057">Magnetic Field (<tspan class="math math-bold">B</tspan>)</text>
                
                <line x1="15" y1="65" x2="35" y2="65" stroke="#06D6A0" stroke-width="3"/>
                <text x="45" y="69" font-size="12" fill="#495057">Propagation (<tspan class="math math-bold">v</tspan>)</text>
            </g>

            <!-- Maxwell's Equations Panel -->
            <g class="fade-in-3" transform="translate(510, 300)">
                <rect x="0" y="0" width="260" height="170" rx="8" fill="white" stroke="#e9ecef" stroke-width="2" filter="drop-shadow(0 4px 12px rgba(0,0,0,0.05))"/>
                <text x="15" y="28" font-size="14" font-weight="700" fill="#212529">Maxwell's Equations</text>
                
                <!-- Eq 1: Gauss's Law -->
                <text x="15" y="60" class="math" font-size="14" fill="#495057">
                    <tspan class="math-bold">∇</tspan> · <tspan class="math-bold" fill="#F77F00">E</tspan> = ρ / ε₀
                </text>
                
                <!-- Eq 2: Gauss's Law for Magnetism -->
                <text x="15" y="90" class="math" font-size="14" fill="#495057">
                    <tspan class="math-bold">∇</tspan> · <tspan class="math-bold" fill="#7209B7">B</tspan> = 0
                </text>
                
                <!-- Eq 3: Faraday's Law -->
                <text x="15" y="120" class="math" font-size="14" fill="#495057">
                    <tspan class="math-bold">∇</tspan> × <tspan class="math-bold" fill="#F77F00">E</tspan> = -∂<tspan class="math-bold" fill="#7209B7">B</tspan> / ∂t
                </text>
                
                <!-- Eq 4: Ampere-Maxwell Law -->
                <text x="15" y="150" class="math" font-size="14" fill="#495057">
                    <tspan class="math-bold">∇</tspan> × <tspan class="math-bold" fill="#7209B7">B</tspan> = μ₀J + μ₀ε₀(∂<tspan class="math-bold" fill="#F77F00">E</tspan>/∂t)
                </text>
            </g>

            <!-- Interactive Play/Pause Button -->
            <g id="play-btn" class="btn fade-in-3" transform="translate(30, 430)" cursor="pointer" role="button" aria-label="Play or Pause Animation">
                <circle cx="24" cy="24" r="24" fill="#4361EE" />
                <!-- Play Icon (Hidden by default) -->
                <path id="play-icon" d="M 18 14 L 34 24 L 18 34 Z" fill="white" style="display: none;" />
                <!-- Pause Icon (Visible by default) -->
                <g id="pause-icon" fill="white">
                    <rect x="16" y="14" width="5" height="20" rx="1" />
                    <rect x="27" y="14" width="5" height="20" rx="1" />
                </g>
            </g>
        </svg>
    </div>
</div>

<script>
    // Physics Constants
    const A = 85; // Amplitude
    const lambda = 240; // Wavelength
    const k = 2 * Math.PI / lambda; // Wave number
    const period = 4000; // 4 seconds per cycle
    const omega = 2 * Math.PI / period; // Angular frequency
    
    // Z-axis projection constants (30 degree isometric)
    const zCos = 0.866; // cos(30)
    const zSin = 0.5;   // sin(30)

    // 1. Generate Static Wave Paths for CSS Translation
    const pathE = document.getElementById('wave-e');
    const pathB = document.getElementById('wave-b');
    
    // Draw paths from well before the origin to well after, to allow seamless CSS looping
    let dE = `M -240 250 `;
    let dB = `M -240 250 `;
    
    for (let x = -240; x <= 960; x += 2) {
        // Electric Field (XY plane)
        let yE = 250 - A * Math.sin(k * x);
        dE += `L ${x} ${yE} `;
        
        // Magnetic Field (XZ plane projected to 2D)
        let zB = A * Math.sin(k * x);
        let xB = x - zB * zCos;
        let yB = 250 + zB * zSin;
        dB += `L ${xB} ${yB} `;
    }
    pathE.setAttribute('d', dE);
    pathB.setAttribute('d', dB);

    // 2. Generate Field Vectors
    const groupE = document.getElementById('vectors-e');
    const groupB = document.getElementById('vectors-b');
    const vectorsE = [];
    const vectorsB = [];
    
    // Create vectors every 30px along the visible X axis
    for (let x = 150; x <= 750; x += 30) {
        // E vector line
        let lineE = document.createElementNS("http://www.w3.org/2000/svg", "line");
        lineE.setAttribute("x1", x);
        lineE.setAttribute("y1", 250);
        lineE.setAttribute("stroke", "#F77F00");
        lineE.setAttribute("stroke-width", "2");
        lineE.setAttribute("opacity", "0.9");
        groupE.appendChild(lineE);
        vectorsE.push({ el: lineE, x: x });
        
        // B vector line
        let lineB = document.createElementNS("http://www.w3.org/2000/svg", "line");
        lineB.setAttribute("x1", x);
        lineB.setAttribute("y1", 250);
        lineB.setAttribute("stroke", "#7209B7");
        lineB.setAttribute("stroke-width", "2");
        lineB.setAttribute("opacity", "0.9");
        groupB.appendChild(lineB);
        vectorsB.push({ el: lineB, x: x });
    }

    // 3. Animation Loop for Vectors (Kept perfectly in sync with CSS wave via performance.now)
    let isPlaying = true;
    let startTime = performance.now();
    let pausedTime = 0;
    let animFrame;

    function animate(currentTime) {
        if (!isPlaying) return;
        
        let elapsed = currentTime - startTime;
        let phase = omega * elapsed;
        
        for (let i = 0; i < vectorsE.length; i++) {
            let x = vectorsE[i].x;
            
            // Calculate instantaneous field strength
            let val = A * Math.sin(k * x - phase);
            
            // Update E vector (Vertical)
            if (Math.abs(val) < 2) {
                // Hide arrowhead when vector is near zero to prevent visual glitch
                vectorsE[i].el.setAttribute("y2", 250);
                vectorsE[i].el.setAttribute("marker-end", "");
            } else {
                vectorsE[i].el.setAttribute("y2", 250 - val);
                vectorsE[i].el.setAttribute("marker-end", "url(#arrow-e)");
            }
            
            // Update B vector (Oblique / Z-axis projected)
            if (Math.abs(val) < 2) {
                vectorsB[i].el.setAttribute("x2", x);
                vectorsB[i].el.setAttribute("y2", 250);
                vectorsB[i].el.setAttribute("marker-end", "");
            } else {
                vectorsB[i].el.setAttribute("x2", x - val * zCos);
                vectorsB[i].el.setAttribute("y2", 250 + val * zSin);
                vectorsB[i].el.setAttribute("marker-end", "url(#arrow-b)");
            }
        }
        animFrame = requestAnimationFrame(animate);
    }
    
    // Start animation
    animFrame = requestAnimationFrame(animate);

    // 4. Interactivity: Play/Pause Logic
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const pauseIcon = document.getElementById('pause-icon');
    const waveGroup = document.getElementById('wave-anim-group');

    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;
        if (isPlaying) {
            playIcon.style.display = 'none';
            pauseIcon.style.display = 'block';
            // Resume from where we left off
            startTime = performance.now() - pausedTime;
            waveGroup.style.animationPlayState = 'running';
            animFrame = requestAnimationFrame(animate);
        } else {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            // Record how much time has passed to resume smoothly
            pausedTime = performance.now() - startTime;
            waveGroup.style.animationPlayState = 'paused';
            cancelAnimationFrame(animFrame);
        }
    });
</script>

</body>
</html>
