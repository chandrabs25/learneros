<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fundamental Properties of Electric Charge</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --pos-color: #FF3366;
      --neg-color: #4361EE;
      --net-color: #06D6A0;
      --dipole-color: #7209B7;
      --field-color: #F77F00;
      --text-main: #2b2d42;
      --text-muted: #6c757d;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #e9ecef;
      font-family: 'Inter', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .app-container {
      background: var(--bg-color);
      max-width: 800px;
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .svg-container {
      width: 100%;
      position: relative;
      background: #ffffff;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Scene Management */
    .scene {
      opacity: 0;
      transition: opacity 0.6s ease-in-out;
      pointer-events: none;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* Typography */
    text {
      font-family: 'Inter', sans-serif;
      fill: var(--text-main);
    }
    .math {
      font-family: 'Roboto Mono', monospace;
    }
    .title {
      font-size: 24px;
      font-weight: 700;
    }
    .subtitle {
      font-size: 18px;
      font-weight: 600;
      fill: var(--text-muted);
    }
    .label {
      font-size: 14px;
      font-weight: 600;
    }
    .small-math {
      font-size: 10px;
    }

    /* Scene 1 Animations */
    @keyframes repel-left {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(60px); }
      50% { transform: translateX(-80px); }
    }
    @keyframes repel-right {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-60px); }
      50% { transform: translateX(80px); }
    }
    @keyframes force-scale-l {
      0%, 100% { transform: scaleX(1); }
      20% { transform: scaleX(2.2); }
      50% { transform: scaleX(0.4); }
    }
    @keyframes force-translate-l {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-30px); }
      50% { transform: translateX(15px); }
    }
    @keyframes force-scale-r {
      0%, 100% { transform: scaleX(1); }
      20% { transform: scaleX(2.2); }
      50% { transform: scaleX(0.4); }
    }
    @keyframes force-translate-r {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(30px); }
      50% { transform: translateX(-15px); }
    }

    @keyframes attract-left {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(70px); }
      50% { transform: translateX(-20px); }
    }
    @keyframes attract-right {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-70px); }
      50% { transform: translateX(20px); }
    }
    @keyframes force-scale-att-l {
      0%, 100% { transform: scaleX(1); }
      20% { transform: scaleX(2.5); }
      50% { transform: scaleX(0.6); }
    }
    @keyframes force-translate-att-l {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(37.5px); }
      50% { transform: translateX(-10px); }
    }
    @keyframes force-scale-att-r {
      0%, 100% { transform: scaleX(1); }
      20% { transform: scaleX(2.5); }
      50% { transform: scaleX(0.6); }
    }
    @keyframes force-translate-att-r {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-37.5px); }
      50% { transform: translateX(10px); }
    }

    /* Scene 2 Animations */
    @keyframes bounce-q1 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(70px, -50px); }
      50% { transform: translate(120px, 50px); }
      75% { transform: translate(20px, 120px); }
    }
    @keyframes bounce-q2 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-40px, 70px); }
      50% { transform: translate(-120px, 0px); }
      75% { transform: translate(-70px, -90px); }
    }
    @keyframes bounce-q3 {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-150px, -60px); }
      50% { transform: translate(-100px, -140px); }
      75% { transform: translate(100px, -60px); }
    }
    @keyframes flash-anim {
      0%, 48% { transform: scale(0); opacity: 1; }
      50% { transform: scale(2); opacity: 0; }
      100% { transform: scale(0); opacity: 0; }
    }
    @keyframes pulse-eq {
      0%, 45% { fill: var(--text-main); transform: scale(1); }
      50% { fill: var(--net-color); transform: scale(1.08); font-weight: bold; }
      55%, 100% { fill: var(--text-main); transform: scale(1); }
    }

    /* Scene 3 Animations */
    @keyframes fade-in-field {
      0%, 15% { opacity: 0; }
      40%, 100% { opacity: 1; }
    }
    @keyframes fade-slide {
      0%, 40% { opacity: 0; transform: translateY(15px); }
      60%, 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade-in {
      0%, 60% { opacity: 0; }
      80%, 100% { opacity: 1; }
    }

    /* Controls UI */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: #f8f9fa;
      border-top: 1px solid #e9ecef;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button {
      background: #ffffff;
      border: 1px solid #ced4da;
      color: #495057;
      padding: 8px 16px;
      border-radius: 6px;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover {
      background: #e9ecef;
      color: #212529;
    }
    button.primary {
      background: var(--neg-color);
      color: white;
      border-color: var(--neg-color);
    }
    button.primary:hover {
      background: #364fc7;
      border-color: #364fc7;
    }
    .indicators {
      display: flex;
      gap: 8px;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ced4da;
      transition: background 0.3s;
    }
    .dot.active {
      background: var(--neg-color);
    }

    /* Utility */
    .anim {
      animation-play-state: paused;
    }
    .scene.active .anim {
      animation-play-state: running;
    }
  </style>
</head>
<body>

<div class="app-container">
  <div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
      <title>Properties of Electric Charge Animation</title>
      <desc>An interactive animation demonstrating charge interaction, additivity, and the electric dipole.</desc>

      <defs>
        <!-- Gradients for 3D effect -->
        <radialGradient id="grad-pos" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#ff8fa3" />
          <stop offset="100%" stop-color="#FF3366" />
        </radialGradient>
        <radialGradient id="grad-neg" cx="30%" cy="30%" r="70%">
          <stop offset="0%" stop-color="#8fa3ff" />
          <stop offset="100%" stop-color="#4361EE" />
        </radialGradient>
        
        <!-- Drop Shadow -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15" />
        </filter>

        <!-- Markers -->
        <marker id="arrow-field" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
        </marker>
        <marker id="arrow-dipole" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
        </marker>
      </defs>

      <!-- Global Title -->
      <text x="400" y="40" text-anchor="middle" class="title">Fundamental Properties of Electric Charge</text>

      <!-- ========================================== -->
      <!-- SCENE 1: INTERACTION                       -->
      <!-- ========================================== -->
      <g id="scene1" class="scene active">
        <text x="400" y="75" text-anchor="middle" class="subtitle">1. Interaction: Like Charges Repel, Opposite Charges Attract</text>
        
        <!-- Repulsion Section (Top) -->
        <text x="400" y="120" text-anchor="middle" class="label" fill="#6c757d">Repulsion (Like Charges)</text>
        
        <!-- Left +q -->
        <g class="anim" style="animation: repel-left 5s infinite ease-in-out; transform-origin: 300px 160px;" transform="translate(300, 160)">
          <!-- Force Vector -->
          <line x1="-15" y1="0" x2="-40" y2="0" stroke="#FF3366" stroke-width="3" stroke-linecap="round" class="anim" style="animation: force-scale-l 5s infinite ease-in-out; transform-origin: -15px 0;" />
          <polygon points="-40,0 -32,-5 -32,5" fill="#FF3366" class="anim" style="animation: force-translate-l 5s infinite ease-in-out;" />
          <text x="-45" y="-15" fill="#FF3366" class="math label anim" style="animation: force-translate-l 5s infinite ease-in-out; text-anchor: end;">F<tspan dy="4" class="small-math">21</tspan></text>
          
          <!-- Particle -->
          <circle r="15" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-22" text-anchor="middle" class="math label">+q<tspan dy="4" class="small-math">1</tspan></text>
        </g>

        <!-- Right +q -->
        <g class="anim" style="animation: repel-right 5s infinite ease-in-out; transform-origin: 500px 160px;" transform="translate(500, 160)">
          <!-- Force Vector -->
          <line x1="15" y1="0" x2="40" y2="0" stroke="#FF3366" stroke-width="3" stroke-linecap="round" class="anim" style="animation: force-scale-r 5s infinite ease-in-out; transform-origin: 15px 0;" />
          <polygon points="40,0 32,-5 32,5" fill="#FF3366" class="anim" style="animation: force-translate-r 5s infinite ease-in-out;" />
          <text x="45" y="-15" fill="#FF3366" class="math label anim" style="animation: force-translate-r 5s infinite ease-in-out; text-anchor: start;">F<tspan dy="4" class="small-math">12</tspan></text>
          
          <!-- Particle -->
          <circle r="15" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-22" text-anchor="middle" class="math label">+q<tspan dy="4" class="small-math">2</tspan></text>
        </g>

        <!-- Divider -->
        <line x1="200" y1="250" x2="600" y2="250" stroke="#dee2e6" stroke-width="2" stroke-dasharray="6 6" />

        <!-- Attraction Section (Bottom) -->
        <text x="400" y="280" text-anchor="middle" class="label" fill="#6c757d">Attraction (Opposite Charges)</text>

        <!-- Left +q -->
        <g class="anim" style="animation: attract-left 5s infinite ease-in-out; transform-origin: 300px 340px;" transform="translate(300, 340)">
          <!-- Force Vector -->
          <line x1="15" y1="0" x2="40" y2="0" stroke="#FF3366" stroke-width="3" stroke-linecap="round" class="anim" style="animation: force-scale-att-l 5s infinite ease-in-out; transform-origin: 15px 0;" />
          <polygon points="40,0 32,-5 32,5" fill="#FF3366" class="anim" style="animation: force-translate-att-l 5s infinite ease-in-out;" />
          <text x="45" y="-15" fill="#FF3366" class="math label anim" style="animation: force-translate-att-l 5s infinite ease-in-out; text-anchor: start;">F<tspan dy="4" class="small-math">21</tspan></text>
          
          <!-- Particle -->
          <circle r="15" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-22" text-anchor="middle" class="math label">+q<tspan dy="4" class="small-math">1</tspan></text>
        </g>

        <!-- Right -q -->
        <g class="anim" style="animation: attract-right 5s infinite ease-in-out; transform-origin: 500px 340px;" transform="translate(500, 340)">
          <!-- Force Vector -->
          <line x1="-15" y1="0" x2="-40" y2="0" stroke="#FF3366" stroke-width="3" stroke-linecap="round" class="anim" style="animation: force-scale-att-r 5s infinite ease-in-out; transform-origin: -15px 0;" />
          <polygon points="-40,0 -32,-5 -32,5" fill="#FF3366" class="anim" style="animation: force-translate-att-r 5s infinite ease-in-out;" />
          <text x="-45" y="-15" fill="#FF3366" class="math label anim" style="animation: force-translate-att-r 5s infinite ease-in-out; text-anchor: end;">F<tspan dy="4" class="small-math">12</tspan></text>
          
          <!-- Particle -->
          <circle r="15" fill="url(#grad-neg)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-22" text-anchor="middle" class="math label">-q<tspan dy="4" class="small-math">2</tspan></text>
        </g>
        
        <!-- Formula -->
        <text x="400" y="440" text-anchor="middle" class="math" fill="#FF3366" font-size="18">|F| ∝ 1 / r²</text>
      </g>

      <!-- ========================================== -->
      <!-- SCENE 2: ADDITIVITY                        -->
      <!-- ========================================== -->
      <g id="scene2" class="scene">
        <text x="400" y="75" text-anchor="middle" class="subtitle">2. Additivity: Total Charge is the Algebraic Sum</text>
        
        <!-- System Box -->
        <rect x="220" y="120" width="360" height="240" fill="#f1f3f5" stroke="#adb5bd" stroke-width="2" stroke-dasharray="8 8" rx="12" />
        <text x="235" y="145" class="label" fill="#495057">Closed System S</text>

        <!-- Collision Flash -->
        <circle cx="400" cy="250" r="25" fill="none" stroke="#06D6A0" stroke-width="4" class="anim" style="animation: flash-anim 5s infinite; transform-origin: 400px 250px;" />

        <!-- Particles -->
        <!-- q1: +3q -->
        <g class="anim" style="animation: bounce-q1 5s infinite ease-in-out;" transform="translate(280, 200)">
          <circle r="18" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -7 0 L 7 0 M 0 -7 L 0 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-25" text-anchor="middle" class="math label">+3q</text>
        </g>

        <!-- q2: -1q -->
        <g class="anim" style="animation: bounce-q2 5s infinite ease-in-out;" transform="translate(520, 250)">
          <circle r="14" fill="url(#grad-neg)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-20" text-anchor="middle" class="math label">-1q</text>
        </g>

        <!-- q3: +2q -->
        <g class="anim" style="animation: bounce-q3 5s infinite ease-in-out;" transform="translate(400, 340)">
          <circle r="16" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="0" y="-22" text-anchor="middle" class="math label">+2q</text>
        </g>

        <!-- Equation -->
        <text x="400" y="420" text-anchor="middle" class="math anim" style="animation: pulse-eq 5s infinite; transform-origin: 400px 420px; font-size: 20px;">
          Q<tspan dy="5" class="small-math">net</tspan><tspan dy="-5"> = (+3q) + (-1q) + (+2q) = +4q</tspan>
        </text>
      </g>

      <!-- ========================================== -->
      <!-- SCENE 3: ELECTRIC DIPOLE                   -->
      <!-- ========================================== -->
      <g id="scene3" class="scene">
        <text x="400" y="75" text-anchor="middle" class="subtitle">3. The Electric Dipole</text>

        <!-- Field Lines Group -->
        <g class="anim" style="animation: fade-in-field 5s infinite ease-in-out;">
          <!-- Straight middle -->
          <path d="M 485 220 L 400 220 L 315 220" fill="none" stroke="#F77F00" stroke-width="2" marker-mid="url(#arrow-field)" opacity="0.7"/>
          <!-- Top Inner -->
          <path d="M 490 205 Q 450 150, 400 160 T 310 205" fill="none" stroke="#F77F00" stroke-width="2" marker-mid="url(#arrow-field)" opacity="0.7"/>
          <!-- Bottom Inner -->
          <path d="M 490 235 Q 450 290, 400 280 T 310 235" fill="none" stroke="#F77F00" stroke-width="2" marker-mid="url(#arrow-field)" opacity="0.7"/>
          <!-- Top Outer -->
          <path d="M 500 205 Q 460 80, 400 100 T 300 205" fill="none" stroke="#F77F00" stroke-width="2" marker-mid="url(#arrow-field)" opacity="0.7"/>
          <!-- Bottom Outer -->
          <path d="M 500 235 Q 460 360, 400 340 T 300 235" fill="none" stroke="#F77F00" stroke-width="2" marker-mid="url(#arrow-field)" opacity="0.7"/>
        </g>

        <!-- Particles -->
        <!-- Left -q -->
        <g transform="translate(300, 220)">
          <circle r="15" fill="url(#grad-neg)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="-25" y="-20" text-anchor="middle" class="math label">-q</text>
        </g>

        <!-- Right +q -->
        <g transform="translate(500, 220)">
          <circle r="15" fill="url(#grad-pos)" filter="url(#shadow)" />
          <path d="M -6 0 L 6 0 M 0 -6 L 0 6" stroke="#fff" stroke-width="2.5" stroke-linecap="round" />
          <text x="25" y="-20" text-anchor="middle" class="math label">+q</text>
        </g>

        <!-- Dipole Vector p -->
        <g class="anim" style="animation: fade-slide 5s infinite ease-out;">
          <line x1="300" y1="280" x2="485" y2="280" stroke="#7209B7" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-dipole)" />
          <text x="400" y="270" text-anchor="middle" fill="#7209B7" font-family="Roboto Mono" font-weight="bold" font-style="italic" font-size="18">p</text>
          <!-- Vector arrow over p -->
          <path d="M 395 256 L 405 256 L 402 253 M 405 256 L 402 259" stroke="#7209B7" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Dimension 2a -->
        <g class="anim" style="animation: fade-in 5s infinite ease-in;">
          <line x1="300" y1="320" x2="500" y2="320" stroke="#868e96" stroke-width="1.5" />
          <line x1="300" y1="310" x2="300" y2="330" stroke="#868e96" stroke-width="1.5" />
          <line x1="500" y1="310" x2="500" y2="330" stroke="#868e96" stroke-width="1.5" />
          <rect x="385" y="310" width="30" height="20" fill="#ffffff" />
          <text x="400" y="325" text-anchor="middle" class="math label" fill="#495057">2a</text>
        </g>

        <!-- Formula -->
        <g class="anim" style="animation: fade-in 5s infinite ease-in;">
          <text x="400" y="400" text-anchor="middle" class="math" fill="#7209B7" font-size="22" font-weight="bold">
            |p| = q × 2a
          </text>
          <!-- Vector arrow over p in formula -->
          <path d="M 373 382 L 383 382 L 380 379 M 383 382 L 380 385" stroke="#7209B7" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

    </svg>
  </div>

  <!-- Controls UI -->
  <div class="controls">
    <div class="indicators">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div class="btn-group">
      <button onclick="prevScene()">Previous</button>
      <button id="playPauseBtn" class="primary" onclick="togglePlay()">Pause</button>
      <button onclick="nextScene()">Next</button>
    </div>
  </div>
</div>

<script>
  const scenes = document.querySelectorAll('.scene');
  const dots = document.querySelectorAll('.dot');
  let currentScene = 0;
  let isPlaying = true;
  let timer;

  function showScene(index) {
    scenes.forEach((scene, i) => {
      if (i === index) {
        scene.classList.add('active');
        // Trigger reflow to restart animations cleanly
        const animatedElements = scene.querySelectorAll('.anim');
        animatedElements.forEach(el => {
          el.style.animation = 'none';
          void el.offsetWidth; // Reflow
          el.style.animation = '';
        });
      } else {
        scene.classList.remove('active');
      }
    });
    dots.forEach((dot, i) => {
      dot.classList.toggle('active', i === index);
    });
    currentScene = index;
  }

  function resetTimer() {
    if (isPlaying) {
      clearInterval(timer);
      timer = setInterval(nextScene, 5000);
    }
  }

  function nextScene() {
    showScene((currentScene + 1) % scenes.length);
    resetTimer();
  }

  function prevScene() {
    showScene((currentScene - 1 + scenes.length) % scenes.length);
    resetTimer();
  }

  function togglePlay() {
    isPlaying = !isPlaying;
    const btn = document.getElementById('playPauseBtn');
    if (isPlaying) {
      btn.textContent = 'Pause';
      timer = setInterval(nextScene, 5000);
      document.querySelectorAll('.anim').forEach(el => el.style.animationPlayState = 'running');
    } else {
      btn.textContent = 'Play';
      clearInterval(timer);
      document.querySelectorAll('.anim').forEach(el => el.style.animationPlayState = 'paused');
    }
  }

  // Initialize
  timer = setInterval(nextScene, 5000);
  showScene(0);
</script>

</body>
</html>
