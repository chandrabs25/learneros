<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopic Electrostatics of Conductors and Insulators</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; text-anchor: middle; }
        .subtitle { font-size: 18px; font-weight: 600; fill: #343A40; text-anchor: middle; }
        .label { font-size: 13px; fill: #495057; text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 16px; fill: #212529; text-anchor: middle; }
        .legend-text { font-size: 13px; fill: #495057; dominant-baseline: central; }

        /* Animations */
        @keyframes e-ext-fade {
            0%, 25% { opacity: 0; }
            41.67%, 75% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes e-ind-fade-cond {
            0%, 41.67% { opacity: 0; }
            58.33%, 75% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes e-ind-fade-insul {
            0%, 41.67% { opacity: 0; }
            58.33%, 75% { opacity: 0.4; }
            100% { opacity: 0; }
        }

        @keyframes drift-cond {
            0%, 25% { transform: translate(0, 0); }
            41.67%, 75% { transform: translate(var(--dx), var(--dy)); }
            100% { transform: translate(0, 0); }
        }

        @keyframes polarize-insul {
            0%, 25% { transform: translateX(0) scaleX(1); }
            41.67%, 75% { transform: translateX(-10px) scaleX(0.8); }
            100% { transform: translateX(0) scaleX(1); }
        }

        @keyframes spin-1 { 100% { transform: rotate(360deg); } }
        @keyframes spin-2 { 100% { transform: rotate(360deg); } }
        @keyframes spin-3 { 100% { transform: rotate(360deg); } }
        @keyframes spin-4 { 100% { transform: rotate(360deg); } }

        @keyframes brownian-1 {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(-3px, -10px); }
            60% { transform: translate(9px, -3px); }
            80% { transform: translate(5px, 8px); }
        }
        @keyframes brownian-2 {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(7px, -6px); }
            40% { transform: translate(-5px, -8px); }
            60% { transform: translate(-9px, 4px); }
            80% { transform: translate(4px, 9px); }
        }
        @keyframes brownian-3 {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(-6px, -7px); }
            40% { transform: translate(8px, -4px); }
            60% { transform: translate(5px, 9px); }
            80% { transform: translate(-7px, 5px); }
        }
        @keyframes brownian-4 {
            0%, 100% { transform: translate(0,0); }
            20% { transform: translate(8px, 6px); }
            40% { transform: translate(4px, -9px); }
            60% { transform: translate(-8px, -5px); }
            80% { transform: translate(-5px, 7px); }
        }

        /* Applied Classes */
        .e-ext { animation: e-ext-fade 12s infinite ease-in-out; }
        .e-ind-cond { animation: e-ind-fade-cond 12s infinite ease-in-out; }
        .e-ind-insul { animation: e-ind-fade-insul 12s infinite ease-in-out; }
        .drift { animation: drift-cond 12s infinite ease-in-out; }
        .polarize { animation: polarize-insul 12s infinite ease-in-out; }
        
        .spin-1 { animation: spin-1 1.4s infinite linear; transform-origin: 0 0; }
        .spin-2 { animation: spin-2 1.7s infinite linear; transform-origin: 0 0; }
        .spin-3 { animation: spin-3 2.1s infinite linear; transform-origin: 0 0; }
        .spin-4 { animation: spin-4 1.2s infinite linear; transform-origin: 0 0; }

        .br-1 { animation: brownian-1 2.3s infinite linear; }
        .br-2 { animation: brownian-2 2.7s infinite linear; }
        .br-3 { animation: brownian-3 1.9s infinite linear; }
        .br-4 { animation: brownian-4 2.5s infinite linear; }

    </style>
</head>
<body>

<div id="svg-container">
    <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Drop Shadow for Panels -->
            <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.08"/>
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-ext" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-ind" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-pointer" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#495057" />
            </marker>

            <!-- Reusable Particles -->
            <g id="electron">
                <circle r="5" fill="#4361EE" />
                <path d="M -2.5 0 L 2.5 0" stroke="white" stroke-width="1.2" />
            </g>
            <g id="ion">
                <circle r="11" fill="#FF3366" />
                <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="white" stroke-width="1.8" />
            </g>
        </defs>

        <!-- Titles -->
        <text x="400" y="35" class="title">Microscopic Behavior: Conductors vs. Insulators</text>
        <text x="212.5" y="75" class="subtitle">Conductor (Metal)</text>
        <text x="587.5" y="75" class="subtitle">Insulator (Dielectric)</text>

        <!-- Panels -->
        <rect x="50" y="90" width="325" height="340" rx="12" fill="#E9ECEF" stroke="#CED4DA" stroke-width="2" filter="url(#shadow)"/>
        <rect x="425" y="90" width="325" height="340" rx="12" fill="#FEFAE0" stroke="#E9EDC9" stroke-width="2" filter="url(#shadow)"/>

        <!-- External Electric Field Lines (E_ext) - Conductor -->
        <g class="e-ext">
            <line x1="55" y1="125" x2="365" y2="125" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="55" y1="195" x2="365" y2="195" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="55" y1="265" x2="365" y2="265" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="55" y1="335" x2="365" y2="335" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="55" y1="405" x2="365" y2="405" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
        </g>

        <!-- External Electric Field Lines (E_ext) - Insulator -->
        <g class="e-ext">
            <line x1="430" y1="125" x2="740" y2="125" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="430" y1="195" x2="740" y2="195" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="430" y1="265" x2="740" y2="265" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="430" y1="335" x2="740" y2="335" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
            <line x1="430" y1="405" x2="740" y2="405" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow-ext)" />
        </g>

        <!-- Induced Electric Field Lines (E_ind) - Conductor -->
        <g class="e-ind-cond">
            <line x1="330" y1="145" x2="90" y2="145" stroke="#F77F00" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-ind)" />
            <line x1="330" y1="215" x2="90" y2="215" stroke="#F77F00" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-ind)" />
            <line x1="330" y1="285" x2="90" y2="285" stroke="#F77F00" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-ind)" />
            <line x1="330" y1="355" x2="90" y2="355" stroke="#F77F00" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-ind)" />
        </g>

        <!-- Induced Electric Field Lines (E_ind) - Insulator -->
        <g class="e-ind-insul">
            <line x1="705" y1="145" x2="470" y2="145" stroke="#F77F00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-ind)" />
            <line x1="705" y1="215" x2="470" y2="215" stroke="#F77F00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-ind)" />
            <line x1="705" y1="285" x2="470" y2="285" stroke="#F77F00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-ind)" />
            <line x1="705" y1="355" x2="470" y2="355" stroke="#F77F00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-ind)" />
        </g>

        <!-- CONDUCTOR PANEL -->
        <g id="conductor-lattice">
            <!-- Row 1 -->
            <use href="#ion" x="115" y="145" /> <use href="#ion" x="180" y="145" /> <use href="#ion" x="245" y="145" /> <use href="#ion" x="310" y="145" />
            <!-- Row 2 -->
            <use href="#ion" x="115" y="215" /> <use href="#ion" x="180" y="215" /> <use href="#ion" x="245" y="215" /> <use href="#ion" x="310" y="215" />
            <!-- Row 3 -->
            <use href="#ion" x="115" y="285" /> <use href="#ion" x="180" y="285" /> <use href="#ion" x="245" y="285" /> <use href="#ion" x="310" y="285" />
            <!-- Row 4 -->
            <use href="#ion" x="115" y="355" /> <use href="#ion" x="180" y="355" /> <use href="#ion" x="245" y="355" /> <use href="#ion" x="310" y="355" />
        </g>

        <g id="conductor-electrons">
            <!-- Row 1 -->
            <g class="drift" style="--dx: -55px; --dy: -35px;" transform="translate(115, 145)"><g class="br-1"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -105px; --dy: -15px;" transform="translate(180, 145)"><g class="br-2"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -180px; --dy: 5px;" transform="translate(245, 145)"><g class="br-3"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -230px; --dy: 25px;" transform="translate(310, 145)"><g class="br-4"><use href="#electron" /></g></g>
            <!-- Row 2 -->
            <g class="drift" style="--dx: -55px; --dy: -25px;" transform="translate(115, 215)"><g class="br-2"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -105px; --dy: -5px;" transform="translate(180, 215)"><g class="br-4"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -180px; --dy: 15px;" transform="translate(245, 215)"><g class="br-1"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -230px; --dy: 35px;" transform="translate(310, 215)"><g class="br-3"><use href="#electron" /></g></g>
            <!-- Row 3 -->
            <g class="drift" style="--dx: -55px; --dy: -15px;" transform="translate(115, 285)"><g class="br-3"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -105px; --dy: 5px;" transform="translate(180, 285)"><g class="br-1"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -180px; --dy: 25px;" transform="translate(245, 285)"><g class="br-4"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -230px; --dy: 45px;" transform="translate(310, 285)"><g class="br-2"><use href="#electron" /></g></g>
            <!-- Row 4 -->
            <g class="drift" style="--dx: -55px; --dy: -5px;" transform="translate(115, 355)"><g class="br-4"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -105px; --dy: 15px;" transform="translate(180, 355)"><g class="br-3"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -180px; --dy: 35px;" transform="translate(245, 355)"><g class="br-2"><use href="#electron" /></g></g>
            <g class="drift" style="--dx: -230px; --dy: 55px;" transform="translate(310, 355)"><g class="br-1"><use href="#electron" /></g></g>
        </g>

        <!-- INSULATOR PANEL -->
        <g id="insulator-atoms">
            <!-- Row 1 -->
            <g transform="translate(490, 145)"><use href="#ion" /><g class="polarize"><g class="spin-1"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(555, 145)"><use href="#ion" /><g class="polarize"><g class="spin-2"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(620, 145)"><use href="#ion" /><g class="polarize"><g class="spin-3"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(685, 145)"><use href="#ion" /><g class="polarize"><g class="spin-4"><use href="#electron" x="16" y="0" /></g></g></g>
            <!-- Row 2 -->
            <g transform="translate(490, 215)"><use href="#ion" /><g class="polarize"><g class="spin-3"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(555, 215)"><use href="#ion" /><g class="polarize"><g class="spin-1"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(620, 215)"><use href="#ion" /><g class="polarize"><g class="spin-4"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(685, 215)"><use href="#ion" /><g class="polarize"><g class="spin-2"><use href="#electron" x="16" y="0" /></g></g></g>
            <!-- Row 3 -->
            <g transform="translate(490, 285)"><use href="#ion" /><g class="polarize"><g class="spin-2"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(555, 285)"><use href="#ion" /><g class="polarize"><g class="spin-4"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(620, 285)"><use href="#ion" /><g class="polarize"><g class="spin-1"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(685, 285)"><use href="#ion" /><g class="polarize"><g class="spin-3"><use href="#electron" x="16" y="0" /></g></g></g>
            <!-- Row 4 -->
            <g transform="translate(490, 355)"><use href="#ion" /><g class="polarize"><g class="spin-4"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(555, 355)"><use href="#ion" /><g class="polarize"><g class="spin-3"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(620, 355)"><use href="#ion" /><g class="polarize"><g class="spin-2"><use href="#electron" x="16" y="0" /></g></g></g>
            <g transform="translate(685, 355)"><use href="#ion" /><g class="polarize"><g class="spin-1"><use href="#electron" x="16" y="0" /></g></g></g>
        </g>

        <!-- Pointers & Annotations -->
        <text x="212.5" y="105" class="label">Free Electrons</text>
        <path d="M 165 105 Q 135 105 120 135" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow-pointer)"/>

        <text x="587.5" y="105" class="label">Bound Electrons</text>
        <path d="M 535 105 Q 505 105 495 135" fill="none" stroke="#495057" stroke-width="1.5" marker-end="url(#arrow-pointer)"/>

        <!-- Equations -->
        <g class="e-ind-cond">
            <text x="212.5" y="460" class="formula">
                <tspan font-weight="bold" font-style="italic">E</tspan><tspan dy="4" font-size="12">net</tspan><tspan dy="-4"> = 0</tspan>
            </text>
        </g>
        <g class="e-ind-insul">
            <text x="587.5" y="460" class="formula">
                <tspan font-weight="bold" font-style="italic">E</tspan><tspan dy="4" font-size="12">net</tspan><tspan dy="-4"> &lt; </tspan><tspan font-weight="bold" font-style="italic">E</tspan><tspan dy="4" font-size="12">ext</tspan>
            </text>
        </g>

        <!-- Legend -->
        <g transform="translate(140, 515)">
            <use href="#ion" x="0" y="0" />
            <text x="18" y="0" class="legend-text">Positive Ion</text>
            
            <use href="#electron" x="130" y="0" />
            <text x="142" y="0" class="legend-text">Electron</text>
            
            <line x1="230" y1="0" x2="260" y2="0" stroke="#F77F00" stroke-width="3" marker-end="url(#arrow-ext)"/>
            <text x="275" y="0" class="legend-text">External Field (<tspan font-family="Roboto Mono" font-style="italic" font-weight="bold">E</tspan><tspan dy="3" font-size="10">ext</tspan><tspan dy="-3">)</tspan></text>
            
            <line x1="410" y1="0" x2="440" y2="0" stroke="#F77F00" stroke-width="3" stroke-dasharray="4,3" marker-end="url(#arrow-ind)"/>
            <text x="455" y="0" class="legend-text">Induced Field (<tspan font-family="Roboto Mono" font-style="italic" font-weight="bold">E</tspan><tspan dy="3" font-size="10">ind</tspan><tspan dy="-3">)</tspan></text>
        </g>

    </svg>
</div>

</body>
</html>
