<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microscopic & Macroscopic Resistivity</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.75);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent-red: #FF3366;
            --accent-green: #06D6A0;
            --accent-blue: #4361EE;
            --accent-orange: #F77F00;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 75vw;
            height: 100vh;
        }

        /* Glassmorphic Control Panel */
        #control-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 25vw;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.05);
            padding: 2rem;
            box-sizing: border-box;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            z-index: 10;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            line-height: 1.3;
            color: var(--accent-blue);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0 0 1rem 0;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: var(--accent-orange);
            font-weight: 700;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 0.5rem;
            border-radius: 8px;
            border: 1px solid rgba(0,0,0,0.1);
            background: rgba(255,255,255,0.9);
            font-family: 'Inter', sans-serif;
            outline: none;
        }

        select:focus {
            border-color: var(--accent-blue);
        }

        /* Custom Range Slider */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
            padding: 0;
            border: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent-blue);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e1;
            border-radius: 2px;
        }
        input[type=range]:focus::-webkit-slider-thumb {
            background: var(--accent-orange);
        }

        /* Specific slider thumb colors */
        #temp::-webkit-slider-thumb { background: var(--accent-red); }
        #voltageV::-webkit-slider-thumb { background: var(--accent-green); }

        /* Formula Card */
        #formula-card {
            position: absolute;
            top: 2rem;
            left: 2rem;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            z-index: 10;
            min-width: 250px;
        }

        .formula-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .math-eq {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-main);
            text-align: center;
        }

        .math-eq span.rho { color: var(--accent-red); }
        .math-eq span.L { color: var(--accent-blue); }
        .math-eq span.A { color: var(--accent-orange); }

        .live-data {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 0.5rem 1rem;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
        }

        .live-data div:nth-child(odd) {
            font-weight: 600;
            color: var(--text-muted);
        }
        .live-data div:nth-child(even) {
            text-align: right;
            font-weight: 700;
            color: var(--text-main);
        }

        .legend {
            margin-top: auto;
            background: rgba(255,255,255,0.5);
            padding: 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .legend-item:last-child { margin-bottom: 0; }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }

        @media (max-width: 900px) {
            #canvas-container { width: 100vw; height: 60vh; position: relative; }
            #control-panel { width: 100vw; height: 40vh; position: relative; border-left: none; border-top: 1px solid rgba(255,255,255,0.5); }
            #formula-card { top: 1rem; left: 1rem; padding: 1rem; }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="formula-card">
        <div class="formula-title">Macroscopic Resistance</div>
        <div class="math-eq">R = <span class="rho">&rho;</span> &middot; <span class="L">L</span> / <span class="A">A</span></div>
        <div class="live-data">
            <div>&rho; (Resistivity):</div><div id="out-rho">0.00e0 &Omega;&middot;m</div>
            <div>R (Resistance):</div><div id="out-R">0.00 &Omega;</div>
            <div>I (Current):</div><div id="out-I">0.00 A</div>
            <div>v_d (Drift Vel):</div><div id="out-vd">0.00 mm/s</div>
        </div>
    </div>

    <div id="control-panel">
        <div>
            <h1>Resistivity Simulation</h1>
            <p class="subtitle">Explore the microscopic Drude model and macroscopic Ohm's Law.</p>
        </div>

        <div class="control-group">
            <label for="materialType">Material</label>
            <select id="materialType">
                <option value="copper">Copper (Metal)</option>
                <option value="silicon">Silicon (Semiconductor)</option>
                <option value="glass">Glass (Insulator)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="temp">Temperature (T) <span class="val-display" id="val-temp">300 K</span></label>
            <input type="range" id="temp" min="100" max="1000" step="10" value="300">
        </div>

        <div class="control-group">
            <label for="lengthL">Length (L) <span class="val-display" id="val-lengthL">5.0 m</span></label>
            <input type="range" id="lengthL" min="2" max="10" step="0.5" value="5">
        </div>

        <div class="control-group">
            <label for="areaA">Cross-Section Area (A) <span class="val-display" id="val-areaA">2.0 m&sup2;</span></label>
            <input type="range" id="areaA" min="1" max="5" step="0.1" value="2">
        </div>

        <div class="control-group">
            <label for="voltageV">Applied Voltage (V) <span class="val-display" id="val-voltageV">10 V</span></label>
            <input type="range" id="voltageV" min="0" max="20" step="1" value="10">
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: var(--accent-red);"></div> Lattice Ions (Vibrate with T)</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-blue);"></div> Free Electrons (Flow with V)</div>
            <div class="legend-item"><div class="dot" style="background: var(--accent-green); border-radius: 0; height: 4px; width: 16px;"></div> Electric Field</div>
        </div>
    </div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Material Constants (Real Physics Values) ---
        const MAT_DATA = {
            copper:  { rho0: 1.72e-8, alpha: 0.0039,  baseN: 1.0,  type: 'metal' },
            silicon: { rho0: 640,     alpha: -0.075,  baseN: 0.05, type: 'semi' },
            glass:   { rho0: 1e12,    alpha: 0,       baseN: 0.001,type: 'insulator' }
        };
        const T0 = 293; // Reference Temp

        // --- DOM Elements ---
        const ui = {
            mat: document.getElementById('materialType'),
            temp: document.getElementById('temp'),
            len: document.getElementById('lengthL'),
            area: document.getElementById('areaA'),
            volt: document.getElementById('voltageV'),
            vTemp: document.getElementById('val-temp'),
            vLen: document.getElementById('val-lengthL'),
            vArea: document.getElementById('val-areaA'),
            vVolt: document.getElementById('val-voltageV'),
            oRho: document.getElementById('out-rho'),
            oR: document.getElementById('out-R'),
            oI: document.getElementById('out-I'),
            oVd: document.getElementById('out-vd')
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Bright background
        scene.background = new THREE.Color(0xf0f4f8);
        scene.fog = new THREE.FogExp2(0xf0f4f8, 0.02);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 6, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 5;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x4361EE, 0.5, 20);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        // --- 3D Objects ---
        const group = new THREE.Group();
        scene.add(group);

        // 1. The Wire (Cylinder)
        // Default cylinder is along Y. We rotate the mesh so local Y becomes global X.
        const cylGeo = new THREE.CylinderGeometry(1, 1, 1, 32, 1, false);
        const cylMat = new THREE.MeshPhysicalMaterial({
            color: 0xE2E8F0,
            transparent: true,
            opacity: 0.25,
            roughness: 0.1,
            metalness: 0.1,
            side: THREE.DoubleSide,
            depthWrite: false
        });
        const cylinder = new THREE.Mesh(cylGeo, cylMat);
        cylinder.rotation.z = Math.PI / 2; // Align length with X axis
        group.add(cylinder);

        // Wireframe edges for cylinder
        const edgesGeo = new THREE.EdgesGeometry(cylGeo);
        const edgesMat = new THREE.LineBasicMaterial({ color: 0x94a3b8, transparent: true, opacity: 0.4 });
        const cylinderEdges = new THREE.LineSegments(edgesGeo, edgesMat);
        cylinder.add(cylinderEdges);

        // 2. Electric Field Arrow
        const arrowDir = new THREE.Vector3(1, 0, 0);
        const arrowOrigin = new THREE.Vector3(0, 0, 0);
        const arrowLength = 1;
        const arrowColor = 0x06D6A0;
        const eFieldArrow = new THREE.ArrowHelper(arrowDir, arrowOrigin, arrowLength, arrowColor, 0.5, 0.3);
        group.add(eFieldArrow);

        // 3. Lattice Ions (InstancedMesh)
        const ionGeo = new THREE.SphereGeometry(0.15, 16, 16);
        const ionMat = new THREE.MeshPhongMaterial({ 
            color: 0xFF3366, 
            shininess: 100,
            emissive: 0x330000 
        });
        let ionMesh;
        let ionBasePositions = [];
        let ionPhases = [];

        // 4. Electrons (InstancedMesh)
        const MAX_ELECTRONS = 3000;
        const elecGeo = new THREE.SphereGeometry(0.06, 8, 8);
        const elecMat = new THREE.MeshPhongMaterial({ 
            color: 0x4361EE, 
            shininess: 100,
            emissive: 0x001166
        });
        const elecMesh = new THREE.InstancedMesh(elecGeo, elecMat, MAX_ELECTRONS);
        elecMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
        group.add(elecMesh);

        let elecPositions = new Float32Array(MAX_ELECTRONS * 3);
        let elecVelocities = new Float32Array(MAX_ELECTRONS * 3);
        const dummy = new THREE.Object3D();

        // Initialize electron random positions and velocities
        for(let i=0; i<MAX_ELECTRONS; i++) {
            elecPositions[i*3] = (Math.random() - 0.5) * 10; // X
            elecPositions[i*3+1] = (Math.random() - 0.5) * 2;  // Y
            elecPositions[i*3+2] = (Math.random() - 0.5) * 2;  // Z
            
            elecVelocities[i*3] = 0;
            elecVelocities[i*3+1] = 0;
            elecVelocities[i*3+2] = 0;
        }

        // --- Core Logic & Geometry Updates ---

        function updateGeometry() {
            const L = parseFloat(ui.len.value);
            const A = parseFloat(ui.area.value);
            const r = Math.sqrt(A / Math.PI);

            // Update Cylinder Scale (Remember it's rotated, so local Y is length, local X/Z are radius)
            cylinder.scale.set(r, L, r);
            
            // Update Arrow
            eFieldArrow.position.set(-L/2 - 1, r + 0.5, 0);
            eFieldArrow.setLength(L + 2, 0.5, 0.3);

            // Regenerate Lattice Grid
            if (ionMesh) group.remove(ionMesh);
            
            ionBasePositions = [];
            ionPhases = [];
            const spacing = 0.8; // Distance between ions
            
            // Create grid within cylinder bounds
            for (let x = -L/2 + spacing/2; x <= L/2; x += spacing) {
                for (let y = -r + spacing/2; y <= r; y += spacing) {
                    for (let z = -r + spacing/2; z <= r; z += spacing) {
                        // Check if inside cylinder radius
                        if (y*y + z*z <= r*r * 0.8) { // 0.8 to keep slightly inside
                            ionBasePositions.push(new THREE.Vector3(x, y, z));
                            ionPhases.push(Math.random() * Math.PI * 2);
                        }
                    }
                }
            }

            ionMesh = new THREE.InstancedMesh(ionGeo, ionMat, ionBasePositions.length);
            ionMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            group.add(ionMesh);

            // Constrain existing electrons to new bounds
            for(let i=0; i<MAX_ELECTRONS; i++) {
                if(Math.abs(elecPositions[i*3]) > L/2) elecPositions[i*3] = (Math.random()-0.5)*L;
                let cy = elecPositions[i*3+1];
                let cz = elecPositions[i*3+2];
                if(cy*cy + cz*cz > r*r) {
                    let angle = Math.random() * Math.PI * 2;
                    let rad = Math.random() * r;
                    elecPositions[i*3+1] = Math.cos(angle) * rad;
                    elecPositions[i*3+2] = Math.sin(angle) * rad;
                }
            }
        }

        // Event Listeners for UI
        function attachListeners() {
            const inputs = [ui.mat, ui.temp, ui.len, ui.area, ui.volt];
            inputs.forEach(input => {
                input.addEventListener('input', () => {
                    updateUIValues();
                    if(input === ui.len || input === ui.area) {
                        updateGeometry();
                    }
                });
            });
        }

        function updateUIValues() {
            ui.vTemp.innerText = `${ui.temp.value} K`;
            ui.vLen.innerText = `${parseFloat(ui.len.value).toFixed(1)} m`;
            ui.vArea.innerText = `${parseFloat(ui.area.value).toFixed(1)} m²`;
            ui.vVolt.innerText = `${ui.volt.value} V`;
        }

        // --- Animation Loop & Physics Engine ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.016; // approx 60fps step

            // 1. Read State
            const T = parseFloat(ui.temp.value);
            const L = parseFloat(ui.len.value);
            const A = parseFloat(ui.area.value);
            const V = parseFloat(ui.volt.value);
            const matKey = ui.mat.value;
            const mat = MAT_DATA[matKey];
            const r = Math.sqrt(A / Math.PI);

            // 2. Macroscopic Physics Calculations (For UI Display)
            let rho;
            if (mat.type === 'semi') {
                // Semiconductors: resistivity drops exponentially with T
                rho = mat.rho0 * Math.exp(mat.alpha * (T - T0));
            } else {
                // Metals/Insulators: linear approx
                rho = mat.rho0 * (1 + mat.alpha * (T - T0));
            }
            
            const R = rho * (L / A);
            const I = V / R;
            
            // Update Formula Card
            ui.oRho.innerText = `${rho.toExponential(2)} Ω·m`;
            if (R > 1e6) ui.oR.innerText = `${(R/1e6).toFixed(2)} MΩ`;
            else if (R < 0.01) ui.oR.innerText = `${(R*1e6).toFixed(2)} µΩ`;
            else ui.oR.innerText = `${R.toFixed(4)} Ω`;
            
            if (I > 1000) ui.oI.innerText = `${(I/1000).toFixed(2)} kA`;
            else if (I < 0.001 && I > 0) ui.oI.innerText = `${(I*1000).toFixed(2)} mA`;
            else ui.oI.innerText = `${I.toFixed(2)} A`;

            // 3. Microscopic Visual Mapping (Drude Model Simulation)
            
            // Visual Electric Field (Acceleration)
            const visual_E = V / L; 
            
            // Ion Vibration Amplitude (proportional to sqrt(T))
            const vibAmp = Math.sqrt(T) * 0.003;
            
            // Update Ion Colors based on Temp (glow redder when hot)
            const heatColor = new THREE.Color(0xFF3366).lerp(new THREE.Color(0xFFaa00), (T-100)/1500);
            ionMat.color.copy(heatColor);
            ionMat.emissive.copy(heatColor).multiplyScalar(0.2 + (T/2000));

            // Animate Ions
            if (ionMesh) {
                for (let i = 0; i < ionBasePositions.length; i++) {
                    const base = ionBasePositions[i];
                    const phase = ionPhases[i];
                    dummy.position.set(
                        base.x + Math.sin(time * 20 + phase) * vibAmp,
                        base.y + Math.cos(time * 23 + phase) * vibAmp,
                        base.z + Math.sin(time * 17 + phase) * vibAmp
                    );
                    dummy.updateMatrix();
                    ionMesh.setMatrixAt(i, dummy.matrix);
                }
                ionMesh.instanceMatrix.needsUpdate = true;
            }

            // Electron Logic
            // Determine active electrons based on material and Temp
            let activeRatio = mat.baseN;
            if (mat.type === 'semi') {
                // More carriers generated at higher temps
                activeRatio = Math.min(1.0, mat.baseN * Math.exp(0.01 * (T - 100)));
            }
            const activeElectrons = Math.floor(MAX_ELECTRONS * activeRatio);
            elecMesh.count = activeElectrons;

            // Scattering probability (represents collisions with vibrating lattice)
            // Higher T -> larger vibration -> higher cross section -> more scatter
            let scatterProb = 0.01; 
            if (mat.type === 'metal') {
                scatterProb = 0.01 + (T - 100) * 0.00005;
            } else if (mat.type === 'insulator') {
                scatterProb = 0.5; // Almost immediate scattering, no flow
            } else {
                scatterProb = 0.02 + (T - 100) * 0.00002;
            }

            const thermalSpeed = Math.sqrt(T) * 0.005;
            let totalVx = 0;

            for (let i = 0; i < activeElectrons; i++) {
                let idx = i * 3;
                
                // Accelerate due to E-field (F = qE)
                // Only accelerate if it's not an insulator (simplified visual)
                if (mat.type !== 'insulator') {
                    elecVelocities[idx] += visual_E * 0.002; 
                }

                // Scatter (Collision)
                if (Math.random() < scatterProb) {
                    // Randomize velocity direction, magnitude based on thermal energy
                    const theta = Math.random() * 2 * Math.PI;
                    const phi = Math.acos(2 * Math.random() - 1);
                    elecVelocities[idx] = thermalSpeed * Math.sin(phi) * Math.cos(theta);
                    elecVelocities[idx+1] = thermalSpeed * Math.sin(phi) * Math.sin(theta);
                    elecVelocities[idx+2] = thermalSpeed * Math.cos(phi);
                }

                // Apply Velocity
                elecPositions[idx] += elecVelocities[idx];
                elecPositions[idx+1] += elecVelocities[idx+1];
                elecPositions[idx+2] += elecVelocities[idx+2];

                totalVx += elecVelocities[idx];

                // Boundary Conditions
                // Wrap around X (Length)
                if (elecPositions[idx] > L/2) {
                    elecPositions[idx] = -L/2;
                    // Randomize cross-section entry to maintain uniform density
                    const angle = Math.random() * Math.PI * 2;
                    const rad = Math.sqrt(Math.random()) * r; // sqrt for uniform area distribution
                    elecPositions[idx+1] = Math.cos(angle) * rad;
                    elecPositions[idx+2] = Math.sin(angle) * rad;
                } else if (elecPositions[idx] < -L/2) {
                    elecPositions[idx] = L/2;
                }

                // Bounce off cylinder walls (Y, Z)
                const currentR2 = elecPositions[idx+1]**2 + elecPositions[idx+2]**2;
                if (currentR2 > r*r) {
                    const currentR = Math.sqrt(currentR2);
                    // Push back inside
                    elecPositions[idx+1] *= (r / currentR) * 0.99;
                    elecPositions[idx+2] *= (r / currentR) * 0.99;
                    // Reverse radial velocity component (simplified bounce)
                    elecVelocities[idx+1] *= -0.5;
                    elecVelocities[idx+2] *= -0.5;
                }

                // Update Instance Matrix
                dummy.position.set(elecPositions[idx], elecPositions[idx+1], elecPositions[idx+2]);
                dummy.updateMatrix();
                elecMesh.setMatrixAt(i, dummy.matrix);
            }
            elecMesh.instanceMatrix.needsUpdate = true;

            // Calculate and display visual drift velocity
            const avgVd = activeElectrons > 0 ? (totalVx / activeElectrons) * 100 : 0;
            ui.oVd.innerText = `${avgVd.toFixed(2)} mm/s`;

            // Render
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            renderer.setSize(width, height);
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
        });

        // Init
        updateUIValues();
        updateGeometry();
        attachListeners();
        animate();

    </script>
</body>
</html>
