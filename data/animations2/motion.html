<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinematics: Rectilinear Motion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --color-pos: #4361EE;
            --color-vel: #06D6A0;
            --color-acc: #F77F00;
            --color-track: #BDC3C7;
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(255, 255, 255, 0.4);
            --text-main: #2b2d42;
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 20px;
            border-radius: 16px;
            min-width: 250px;
        }

        #info-panel h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
        }

        .live-data {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .live-data span {
            font-weight: 700;
        }

        #val-x { color: var(--color-pos); }
        #val-v { color: var(--color-vel); }
        #val-a { color: var(--color-acc); }

        #controls-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 25%;
            min-width: 300px;
            height: 100vh;
            padding: 30px 20px;
            box-sizing: border-box;
            border-left: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .control-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #d1d8e0;
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid;
        }

        #slider-x0::-webkit-slider-thumb { border-color: var(--color-pos); background: var(--color-pos); }
        #slider-v0::-webkit-slider-thumb { border-color: var(--color-vel); background: var(--color-vel); }
        #slider-a::-webkit-slider-thumb { border-color: var(--color-acc); background: var(--color-acc); }
        #slider-time::-webkit-slider-thumb { border-color: #888; background: #888; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #btn-play {
            background: var(--color-pos);
            color: white;
        }

        #btn-play:hover { background: #324fc7; }
        
        #btn-reset {
            background: white;
            color: var(--text-main);
            border: 1px solid #d1d8e0;
        }

        #btn-reset:hover { background: #f1f2f6; }

        #labels-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .marker-label {
            position: absolute;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            color: #555;
            background: rgba(255,255,255,0.8);
            padding: 2px 4px;
            border-radius: 4px;
            transform: translate(-50%, -50%);
            user-select: none;
        }

        @media (max-width: 768px) {
            #controls-panel { width: 100%; height: auto; bottom: 0; top: auto; border-left: none; border-top: 1px solid var(--panel-border); padding: 15px; }
            #info-panel { top: 10px; left: 10px; padding: 15px; }
            #canvas-container { height: calc(100vh - 300px); }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <div id="info-panel" class="glass-panel">
        <h2>Rectilinear Motion</h2>
        <div class="formula">x(t) = x₀ + v₀t + ½at²</div>
        <div class="live-data">
            t: <span id="val-t">0.00</span> s<br>
            x: <span id="val-x">0.00</span> m<br>
            v: <span id="val-v">0.00</span> m/s
        </div>
    </div>

    <div id="controls-panel" class="glass-panel">
        <div class="control-group">
            <div class="control-header">
                <span>Initial Position (x₀)</span>
                <span class="control-value"><span id="disp-x0">0</span> m</span>
            </div>
            <input type="range" id="slider-x0" min="-20" max="20" step="1" value="0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Initial Velocity (v₀)</span>
                <span class="control-value"><span id="disp-v0">2.0</span> m/s</span>
            </div>
            <input type="range" id="slider-v0" min="-10" max="10" step="0.5" value="2">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Acceleration (a)</span>
                <span class="control-value"><span id="disp-a">0.5</span> m/s²</span>
            </div>
            <input type="range" id="slider-a" min="-5" max="5" step="0.1" value="0.5">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Time Scale</span>
                <span class="control-value"><span id="disp-time">1.0</span>x</span>
            </div>
            <input type="range" id="slider-time" min="0" max="2" step="0.1" value="1">
        </div>

        <div class="btn-group">
            <button id="btn-play">Play</button>
            <button id="btn-reset">Reset</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- State Variables ---
        let x0 = 0;
        let v0 = 2;
        let a = 0.5;
        let timeScale = 1;
        let t = 0;
        let isRunning = false;
        
        let currentX = 0;
        let currentV = 0;

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const labelsContainer = document.getElementById('labels-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
        controls.minDistance = 10;
        controls.maxDistance = 100;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 30, 20);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -60;
        dirLight.shadow.camera.right = 60;
        dirLight.shadow.camera.top = 20;
        dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Objects ---
        // 1. Grid Floor
        const gridHelper = new THREE.GridHelper(100, 100, 0xd1d8e0, 0xe2e8f0);
        gridHelper.position.y = -0.25;
        scene.add(gridHelper);

        // 2. Track
        const trackGeo = new THREE.BoxGeometry(100, 0.5, 2);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0xBDC3C7, roughness: 0.8 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.receiveShadow = true;
        scene.add(track);

        // 3. Markers & Labels
        const markers = [];
        const markerGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0x555555 });

        for (let i = -50; i <= 50; i += 5) {
            const marker = new THREE.Mesh(markerGeo, markerMat);
            marker.position.set(i, 0.3, 1.2);
            scene.add(marker);

            const labelDiv = document.createElement('div');
            labelDiv.className = 'marker-label';
            labelDiv.textContent = i;
            labelsContainer.appendChild(labelDiv);

            markers.push({ mesh: marker, div: labelDiv, pos3D: new THREE.Vector3(i, 0.3, 1.5) });
        }

        // 4. Point Object (Sphere)
        const sphereGeo = new THREE.SphereGeometry(1, 32, 32);
        const sphereMat = new THREE.MeshStandardMaterial({ 
            color: 0x4361EE, 
            roughness: 0.2, 
            metalness: 0.8 
        });
        const sphere = new THREE.Mesh(sphereGeo, sphereMat);
        sphere.position.y = 1.25; // Sit on track
        sphere.castShadow = true;
        scene.add(sphere);

        // 5. Vectors (Arrows)
        const velColor = 0x06D6A0;
        const accColor = 0xF77F00;
        const origin = new THREE.Vector3(0, 0, 0);
        const dir = new THREE.Vector3(1, 0, 0);
        
        const velArrow = new THREE.ArrowHelper(dir, origin, 1, velColor, 0.5, 0.3);
        scene.add(velArrow);

        const accArrow = new THREE.ArrowHelper(dir, origin, 1, accColor, 0.5, 0.3);
        scene.add(accArrow);

        // 6. Motion Trail
        const maxTrailPoints = 120; // Approx 2 seconds at 60fps
        const trailPositions = [];
        const trailGeo = new THREE.BufferGeometry();
        const trailMat = new THREE.LineBasicMaterial({ 
            vertexColors: true, 
            transparent: true, 
            linewidth: 2 
        });
        const trailLine = new THREE.Line(trailGeo, trailMat);
        scene.add(trailLine);

        // --- UI Elements & Event Listeners ---
        const sliderX0 = document.getElementById('slider-x0');
        const sliderV0 = document.getElementById('slider-v0');
        const sliderA = document.getElementById('slider-a');
        const sliderTime = document.getElementById('slider-time');
        
        const dispX0 = document.getElementById('disp-x0');
        const dispV0 = document.getElementById('disp-v0');
        const dispA = document.getElementById('disp-a');
        const dispTime = document.getElementById('disp-time');

        const valT = document.getElementById('val-t');
        const valX = document.getElementById('val-x');
        const valV = document.getElementById('val-v');

        const btnPlay = document.getElementById('btn-play');
        const btnReset = document.getElementById('btn-reset');

        function updateStateFromUI() {
            x0 = parseFloat(sliderX0.value);
            v0 = parseFloat(sliderV0.value);
            a = parseFloat(sliderA.value);
            timeScale = parseFloat(sliderTime.value);

            dispX0.textContent = x0.toFixed(1);
            dispV0.textContent = v0.toFixed(1);
            dispA.textContent = a.toFixed(1);
            dispTime.textContent = timeScale.toFixed(1);

            if (!isRunning && t === 0) {
                updatePhysics(0);
            }
        }

        sliderX0.addEventListener('input', updateStateFromUI);
        sliderV0.addEventListener('input', updateStateFromUI);
        sliderA.addEventListener('input', updateStateFromUI);
        sliderTime.addEventListener('input', updateStateFromUI);

        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            btnPlay.textContent = isRunning ? 'Pause' : 'Play';
            btnPlay.style.background = isRunning ? '#e74c3c' : 'var(--color-pos)';
        });

        btnReset.addEventListener('click', () => {
            isRunning = false;
            btnPlay.textContent = 'Play';
            btnPlay.style.background = 'var(--color-pos)';
            t = 0;
            trailPositions.length = 0;
            trailGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
            trailGeo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(0), 3));
            updatePhysics(0);
        });

        // --- Physics & Animation Logic ---
        const clock = new THREE.Clock();

        function updatePhysics(deltaT) {
            if (isRunning) {
                t += deltaT * timeScale;
            }

            // Kinematic Equations
            currentX = x0 + (v0 * t) + (0.5 * a * t * t);
            currentV = v0 + (a * t);

            // Update Sphere
            sphere.position.x = currentX;

            // Update Velocity Arrow
            const vLen = Math.abs(currentV);
            if (vLen > 0.05) {
                velArrow.visible = true;
                velArrow.setDirection(new THREE.Vector3(currentV >= 0 ? 1 : -1, 0, 0));
                velArrow.setLength(vLen, Math.min(0.5, vLen * 0.4), Math.min(0.3, vLen * 0.25));
            } else {
                velArrow.visible = false;
            }
            velArrow.position.copy(sphere.position);

            // Update Acceleration Arrow
            const aLen = Math.abs(a);
            if (aLen > 0.05) {
                accArrow.visible = true;
                accArrow.setDirection(new THREE.Vector3(a >= 0 ? 1 : -1, 0, 0));
                // Scale acceleration visually for better appearance relative to velocity
                const visualALen = aLen * 2; 
                accArrow.setLength(visualALen, Math.min(0.5, visualALen * 0.4), Math.min(0.3, visualALen * 0.25));
            } else {
                accArrow.visible = false;
            }
            accArrow.position.copy(sphere.position).add(new THREE.Vector3(0, 1.5, 0));

            // Update Trail
            if (isRunning) {
                trailPositions.push(sphere.position.clone());
                if (trailPositions.length > maxTrailPoints) {
                    trailPositions.shift();
                }

                const positions = new Float32Array(trailPositions.length * 3);
                const colors = new Float32Array(trailPositions.length * 3);
                const colorBase = new THREE.Color(0x4361EE);
                const colorBg = new THREE.Color(0xf0f4f8);

                for (let i = 0; i < trailPositions.length; i++) {
                    positions[i * 3] = trailPositions[i].x;
                    positions[i * 3 + 1] = trailPositions[i].y;
                    positions[i * 3 + 2] = trailPositions[i].z;

                    // Fade out older points by lerping to background color
                    const ratio = i / trailPositions.length; 
                    const c = colorBg.clone().lerp(colorBase, ratio);
                    colors[i * 3] = c.r;
                    colors[i * 3 + 1] = c.g;
                    colors[i * 3 + 2] = c.b;
                }

                trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                trailGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                trailGeo.attributes.position.needsUpdate = true;
                trailGeo.attributes.color.needsUpdate = true;
            }

            // Update UI Text
            valT.textContent = t.toFixed(2);
            valX.textContent = currentX.toFixed(2);
            valV.textContent = currentV.toFixed(2);
        }

        function updateLabels() {
            markers.forEach(m => {
                const vec = m.pos3D.clone();
                vec.project(camera);
                
                // Check if behind camera
                if (vec.z > 1) {
                    m.div.style.display = 'none';
                    return;
                }

                const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
                const y = (vec.y * -0.5 + 0.5) * window.innerHeight;
                
                // Hide if off-screen
                if (x < 0 || x > window.innerWidth || y < 0 || y > window.innerHeight) {
                    m.div.style.display = 'none';
                } else {
                    m.div.style.display = 'block';
                    m.div.style.left = `${x}px`;
                    m.div.style.top = `${y}px`;
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            updatePhysics(delta);
            
            controls.update();
            updateLabels();
            
            renderer.render(scene, camera);
        }

        // --- Window Resize Handling ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize
        updateStateFromUI();
        animate();

    </script>
</body>
</html>
