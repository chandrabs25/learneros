<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faraday's Law of Induction - 3D Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            color: #333;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphic UI Panel */
        #ui-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 25%;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #1d3557;
            text-align: center;
            font-weight: 700;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            color: #457b9d;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #e63946;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #a8dadc;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Specific slider colors */
        #slider-B::-webkit-slider-thumb {
            background: #7209B7;
        }

        #slider-omega::-webkit-slider-thumb {
            background: #06D6A0;
        }

        #slider-N::-webkit-slider-thumb {
            background: #F77F00;
        }

        #slider-area::-webkit-slider-thumb {
            background: #4361EE;
        }

        /* Formula Card */
        #formula-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            z-index: 10;
            font-size: 1rem;
            border-left: 5px solid #F77F00;
        }

        .math-line {
            margin: 8px 0;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .math-symbol {
            font-style: italic;
            font-weight: bold;
        }

        .val-box {
            background: #f1faee;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            min-width: 60px;
            text-align: right;
            display: inline-block;
        }

        /* Graph Overlay */
        #graph-wrapper {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 800px;
            height: 160px;
            background: rgba(26, 26, 46, 0.9);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        #graph-header {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 0.8rem;
            margin-bottom: 5px;
            padding: 0 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        #graph-canvas {
            width: 100%;
            height: 100%;
            border-radius: 8px;
        }

        /* Galvanometer */
        #galvanometer-container {
            width: 100%;
            height: 120px;
            margin-top: 10px;
            position: relative;
            background: #fff;
            border-radius: 8px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        #galvanometer-canvas {
            width: 100%;
            height: 100%;
        }

        /* 3D Labels */
        .scene-label {
            position: absolute;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            pointer-events: none;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .label-B {
            color: #7209B7;
            text-shadow: 0 0 5px #fff;
        }

        .label-n {
            color: #06D6A0;
            text-shadow: 0 0 5px #000;
        }

        @media (max-width: 768px) {
            #ui-panel {
                width: 90%;
                right: 5%;
                top: 120px;
            }

            #formula-card {
                width: 90%;
                left: 5%;
                top: 10px;
                box-sizing: border-box;
            }

            #graph-wrapper {
                width: 95%;
                bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="formula-card">
        <div style="font-weight: 700; color: #1d3557; margin-bottom: 5px; font-size: 0.9rem;">REAL-TIME PHYSICS</div>
        <div class="math-line">
            <span class="math-symbol">&Phi;<sub>B</sub></span> = B &middot; A &middot; cos(&omega;t) =
            <span class="val-box" id="val-flux" style="color: #7209B7;">0.00</span> Wb
        </div>
        <div class="math-line">
            <span class="math-symbol">&epsilon;</span> = -N
            <span
                style="display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; margin: 0 4px; font-size: 0.8em; line-height: 1.1;">
                <span
                    style="border-bottom: 1.5px solid currentColor; padding: 0 2px;">d&Phi;<sub><small>B</small></sub></span>
                <span>dt</span>
            </span> =
            <span class="val-box" id="val-emf" style="color: #F77F00;">0.00</span> V
        </div>
    </div>

    <div id="ui-panel">
        <h2>Generator Controls</h2>

        <div class="control-group">
            <div class="control-header">
                <span>Magnetic Field (B)</span>
                <span id="lbl-B">1.0 T</span>
            </div>
            <input type="range" id="slider-B" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Angular Velocity (&omega;)</span>
                <span id="lbl-omega">1.0 rad/s</span>
            </div>
            <input type="range" id="slider-omega" min="0" max="5.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Number of Turns (N)</span>
                <span id="lbl-N">10</span>
            </div>
            <input type="range" id="slider-N" min="1" max="100" step="1" value="10">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Coil Area (A)</span>
                <span id="lbl-area">2.0 m&sup2;</span>
            </div>
            <input type="range" id="slider-area" min="0.5" max="4.0" step="0.1" value="2.0">
        </div>

        <div id="galvanometer-container">
            <canvas id="galvanometer-canvas"></canvas>
        </div>
    </div>

    <div id="graph-wrapper">
        <div id="graph-header">
            <div class="legend-item">
                <div class="legend-color" style="background: #a8dadc;"></div>
                <span>Magnetic Flux (&Phi;<sub>B</sub>)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background: #FFD166;"></div>
                <span>Induced EMF (&epsilon;)</span>
            </div>
        </div>
        <canvas id="graph-canvas"></canvas>
    </div>

    <div id="label-B" class="scene-label label-B">B</div>
    <div id="label-n" class="scene-label label-n">n&#770;</div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Physics Parameters ---
        const params = {
            B: 1.0,
            omega: 1.0,
            N: 10,
            area: 2.0
        };

        let time = 0;
        const clock = new THREE.Clock();

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // Grid
        const gridHelper = new THREE.GridHelper(10, 10, 0xcccccc, 0xe0e0e0);
        gridHelper.position.y = -2.5;
        scene.add(gridHelper);

        // --- Objects ---

        // 1. Magnetic Field (B)
        const fieldGroup = new THREE.Group();
        const arrows = [];
        const arrowDir = new THREE.Vector3(1, 0, 0);
        const arrowLength = 6;
        const arrowColor = 0x7209B7;

        for (let y = -2; y <= 2; y += 1) {
            for (let z = -2; z <= 2; z += 1) {
                const origin = new THREE.Vector3(-3, y, z);
                const arrow = new THREE.ArrowHelper(arrowDir, origin, arrowLength, arrowColor, 0.4, 0.2);
                // Make lines thicker by replacing line with cylinder
                arrow.line.material.linewidth = 2;
                fieldGroup.add(arrow);
                arrows.push(arrow);
            }
        }
        scene.add(fieldGroup);

        // 2. Armature (Coil)
        const coilGroup = new THREE.Group();
        scene.add(coilGroup);

        let coilMeshes = [];
        let fluxPlane;
        const fixedHeight = 2.0; // Fixed Y dimension

        // Current Particles
        const numParticles = 30;
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.06, 16, 16);
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x4361EE });
        let particleOffset = 0;

        for (let i = 0; i < numParticles; i++) {
            const mesh = new THREE.Mesh(particleGeo, particleMat);
            coilGroup.add(mesh);
            particles.push(mesh);
        }

        function buildCoil() {
            // Remove old geometry
            coilMeshes.forEach(mesh => coilGroup.remove(mesh));
            if (fluxPlane) coilGroup.remove(fluxPlane);
            coilMeshes = [];

            const w = params.area / fixedHeight; // Z dimension
            const h = fixedHeight; // Y dimension

            // Wire thickness based on N
            const radius = 0.02 + (params.N / 100) * 0.08;
            const coilMat = new THREE.MeshStandardMaterial({
                color: 0xF77F00,
                metalness: 0.4,
                roughness: 0.3
            });

            // 4 cylinders forming a rectangle in YZ plane
            const geoH = new THREE.CylinderGeometry(radius, radius, w, 16);
            const geoV = new THREE.CylinderGeometry(radius, radius, h, 16);

            const top = new THREE.Mesh(geoH, coilMat);
            top.rotation.x = Math.PI / 2;
            top.position.set(0, h / 2, 0);

            const bottom = new THREE.Mesh(geoH, coilMat);
            bottom.rotation.x = Math.PI / 2;
            bottom.position.set(0, -h / 2, 0);

            const left = new THREE.Mesh(geoV, coilMat);
            left.position.set(0, 0, -w / 2);

            const right = new THREE.Mesh(geoV, coilMat);
            right.position.set(0, 0, w / 2);

            coilGroup.add(top, bottom, left, right);
            coilMeshes.push(top, bottom, left, right);

            // Flux Visualization Plane
            const planeGeo = new THREE.PlaneGeometry(w, h);
            const planeMat = new THREE.MeshBasicMaterial({
                color: 0x7209B7,
                transparent: true,
                opacity: 0.0,
                side: THREE.DoubleSide,
                depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            fluxPlane = new THREE.Mesh(planeGeo, planeMat);
            fluxPlane.rotation.y = Math.PI / 2; // Align with YZ plane
            coilGroup.add(fluxPlane);
        }

        buildCoil();

        // 3. Normal Vector (n)
        const normalDir = new THREE.Vector3(1, 0, 0); // Points +X initially
        const normalOrigin = new THREE.Vector3(0, 0, 0);
        const normalArrow = new THREE.ArrowHelper(normalDir, normalOrigin, 2, 0x06D6A0, 0.4, 0.2);
        // Thicken normal arrow
        normalArrow.line.material.linewidth = 3;
        coilGroup.add(normalArrow);

        // --- UI Interactions ---
        document.getElementById('slider-B').addEventListener('input', (e) => {
            params.B = parseFloat(e.target.value);
            document.getElementById('lbl-B').innerText = params.B.toFixed(1) + ' T';
            // Update arrow opacity/scale
            arrows.forEach(a => {
                a.setLength(6 * (0.5 + params.B / 2), 0.4, 0.2);
                a.line.material.opacity = 0.3 + (params.B / 2.0) * 0.7;
                a.cone.material.opacity = 0.3 + (params.B / 2.0) * 0.7;
                a.line.material.transparent = true;
                a.cone.material.transparent = true;
            });
        });

        document.getElementById('slider-omega').addEventListener('input', (e) => {
            params.omega = parseFloat(e.target.value);
            document.getElementById('lbl-omega').innerText = params.omega.toFixed(1) + ' rad/s';
        });

        document.getElementById('slider-N').addEventListener('input', (e) => {
            params.N = parseInt(e.target.value);
            document.getElementById('lbl-N').innerText = params.N;
            buildCoil();
        });

        document.getElementById('slider-area').addEventListener('input', (e) => {
            params.area = parseFloat(e.target.value);
            document.getElementById('lbl-area').innerText = params.area.toFixed(1) + ' m²';
            buildCoil();
        });

        // --- Graph Setup ---
        const graphCanvas = document.getElementById('graph-canvas');
        const gCtx = graphCanvas.getContext('2d');
        const history = [];
        const maxHistory = 300;

        function resizeGraph() {
            const rect = graphCanvas.parentElement.getBoundingClientRect();
            graphCanvas.width = rect.width - 20;
            graphCanvas.height = rect.height - 35;
        }
        window.addEventListener('resize', resizeGraph);
        resizeGraph();

        function drawGraph() {
            gCtx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

            const w = graphCanvas.width;
            const h = graphCanvas.height;
            const midY = h / 2;

            // Draw Grid & Zero Line
            gCtx.strokeStyle = 'rgba(255,255,255,0.1)';
            gCtx.lineWidth = 1;
            gCtx.beginPath();
            gCtx.moveTo(0, midY);
            gCtx.lineTo(w, midY);
            gCtx.stroke();

            if (history.length === 0) return;

            // Scaling factors
            // Max theoretical flux = 2.0 * 4.0 = 8.0
            const scaleFlux = (h / 2) / 10.0;
            // Max theoretical EMF = 100 * 2.0 * 4.0 * 5.0 = 4000
            // We use a smaller scale so normal values are visible, clipping is fine for extremes
            const scaleEMF = (h / 2) / 150.0;

            // Draw Flux (Light Blue/White)
            gCtx.strokeStyle = '#a8dadc';
            gCtx.lineWidth = 2;
            gCtx.beginPath();
            for (let i = 0; i < history.length; i++) {
                const x = (i / maxHistory) * w;
                const y = midY - (history[i].flux * scaleFlux);
                if (i === 0) gCtx.moveTo(x, y);
                else gCtx.lineTo(x, y);
            }
            gCtx.stroke();

            // Draw EMF (Yellow)
            gCtx.strokeStyle = '#FFD166';
            gCtx.lineWidth = 2;
            gCtx.beginPath();
            for (let i = 0; i < history.length; i++) {
                const x = (i / maxHistory) * w;
                const y = midY - (history[i].emf * scaleEMF);
                if (i === 0) gCtx.moveTo(x, y);
                else gCtx.lineTo(x, y);
            }
            gCtx.stroke();
        }

        // --- Galvanometer Setup ---
        const galvCanvas = document.getElementById('galvanometer-canvas');
        const galvCtx = galvCanvas.getContext('2d');

        function resizeGalv() {
            const rect = galvCanvas.parentElement.getBoundingClientRect();
            galvCanvas.width = rect.width;
            galvCanvas.height = rect.height;
        }
        window.addEventListener('resize', resizeGalv);
        resizeGalv();

        function drawGalvanometer(emf) {
            const w = galvCanvas.width;
            const h = galvCanvas.height;
            const cx = w / 2;
            const cy = h - 10;
            const r = Math.min(w / 2 - 20, h - 30);

            galvCtx.clearRect(0, 0, w, h);

            // Draw Dial
            galvCtx.beginPath();
            galvCtx.arc(cx, cy, r, Math.PI, 0);
            galvCtx.lineWidth = 4;
            galvCtx.strokeStyle = '#1d3557';
            galvCtx.stroke();

            // Ticks
            for (let i = 0; i <= 10; i++) {
                const angle = Math.PI - (i / 10) * Math.PI;
                const isMajor = i === 0 || i === 5 || i === 10;
                const len = isMajor ? 15 : 8;
                galvCtx.beginPath();
                galvCtx.moveTo(cx + Math.cos(angle) * (r - len), cy - Math.sin(angle) * (r - len));
                galvCtx.lineTo(cx + Math.cos(angle) * r, cy - Math.sin(angle) * r);
                galvCtx.lineWidth = isMajor ? 3 : 1;
                galvCtx.strokeStyle = isMajor ? '#e63946' : '#457b9d';
                galvCtx.stroke();
            }

            // Labels
            galvCtx.fillStyle = '#1d3557';
            galvCtx.font = '12px Inter';
            galvCtx.textAlign = 'center';
            galvCtx.fillText('-V', cx - r + 10, cy + 15);
            galvCtx.fillText('0', cx, cy - r - 10);
            galvCtx.fillText('+V', cx + r - 10, cy + 15);

            // Needle
            // Map EMF to angle. Let's say max display EMF is 100
            let mappedEmf = Math.max(-100, Math.min(100, emf));
            const needleAngle = Math.PI / 2 - (mappedEmf / 100) * (Math.PI / 2 - 0.2);

            galvCtx.beginPath();
            galvCtx.moveTo(cx, cy);
            galvCtx.lineTo(cx + Math.cos(needleAngle) * (r - 5), cy - Math.sin(needleAngle) * (r - 5));
            galvCtx.lineWidth = 3;
            galvCtx.strokeStyle = '#e63946';
            galvCtx.stroke();

            // Center pin
            galvCtx.beginPath();
            galvCtx.arc(cx, cy, 6, 0, Math.PI * 2);
            galvCtx.fillStyle = '#1d3557';
            galvCtx.fill();
        }

        // --- Labels Update ---
        const labelB = document.getElementById('label-B');
        const labelN = document.getElementById('label-n');
        const posB = new THREE.Vector3(2, 2.5, 0);
        const posN = new THREE.Vector3();

        function updateLabels() {
            // Project B
            const tempB = posB.clone().project(camera);
            const xB = (tempB.x * .5 + .5) * window.innerWidth;
            const yB = -(tempB.y * .5 - .5) * window.innerHeight;
            labelB.style.left = `${xB}px`;
            labelB.style.top = `${yB}px`;

            // Project n (tip of normal arrow)
            posN.set(2.2, 0, 0); // Local coordinate of arrow tip
            posN.applyMatrix4(coilGroup.matrixWorld);
            const tempN = posN.clone().project(camera);
            const xN = (tempN.x * .5 + .5) * window.innerWidth;
            const yN = -(tempN.y * .5 - .5) * window.innerHeight;
            labelN.style.left = `${xN}px`;
            labelN.style.top = `${yN}px`;
        }

        // --- Particle Logic ---
        function updateParticles(offset, w, h) {
            const perimeter = 2 * w + 2 * h;
            for (let i = 0; i < numParticles; i++) {
                let d = (offset + (i / numParticles) * perimeter) % perimeter;
                if (d < 0) d += perimeter;

                let x = 0, y = 0, z = 0;
                // Path in YZ plane
                // A(0, h/2, -w/2) -> B(0, h/2, w/2) -> C(0, -h/2, w/2) -> D(0, -h/2, -w/2)
                if (d < w) {
                    // Top edge
                    z = -w / 2 + d;
                    y = h / 2;
                } else if (d < w + h) {
                    // Right edge
                    z = w / 2;
                    y = h / 2 - (d - w);
                } else if (d < 2 * w + h) {
                    // Bottom edge
                    z = w / 2 - (d - (w + h));
                    y = -h / 2;
                } else {
                    // Left edge
                    z = -w / 2;
                    y = -h / 2 + (d - (2 * w + h));
                }
                particles[i].position.set(x, y, z);
            }
        }

        // --- Animation Loop ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            time += dt;

            // Physics Calculations
            const theta = params.omega * time;
            coilGroup.rotation.y = theta;

            // Math: Normal is initially +X. Rotating around Y gives n = (cos(theta), 0, -sin(theta))
            // B is (1, 0, 0). Dot product = cos(theta).
            const flux = params.B * params.area * Math.cos(theta);

            // EMF = -N * d(Flux)/dt = N * B * A * omega * sin(theta)
            const emf = params.N * params.B * params.area * params.omega * Math.sin(theta);

            // Update UI Text
            document.getElementById('val-flux').innerText = flux.toFixed(2);
            document.getElementById('val-emf').innerText = emf.toFixed(2);

            // Update Graph History
            history.push({ flux, emf });
            if (history.length > maxHistory) history.shift();
            drawGraph();

            // Update Galvanometer
            drawGalvanometer(emf);

            // Update Visuals
            // Flux Plane Opacity
            if (fluxPlane) {
                fluxPlane.material.opacity = 0.6 * Math.abs(Math.cos(theta)) * (params.B / 2.0);
            }

            // Current Particles Movement
            const w = params.area / fixedHeight;
            const h = fixedHeight;
            const perimeter = 2 * w + 2 * h;

            // Speed proportional to EMF
            const speed = emf * 0.05;
            particleOffset = (particleOffset + speed * dt) % perimeter;
            updateParticles(particleOffset, w, h);

            // Scale particles based on current magnitude
            const pScale = Math.min(1.5, Math.max(0.1, Math.abs(emf) * 0.05));
            particles.forEach(p => p.scale.setScalar(pScale));

            updateLabels();
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Window Resize
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        animate();
    </script>
</body>

</html>
