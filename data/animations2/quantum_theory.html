<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bohr Model vs. Classical Collapse</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --nucleus-color: #FF3366;
            --electron-color: #4361EE;
            --wave-color: #06D6A0;
            --force-color: #F77F00;
            --photon-color: #7209B7;
            --orbit-color: #BDC3C7;
            --text-main: #2d3748;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        /* Glassmorphic Controls */
        #controls {
            position: absolute;
            top: 0;
            right: 0;
            width: 320px;
            height: 100vh;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid var(--glass-border);
            box-shadow: -5px 0 15px rgba(0,0,0,0.05);
            z-index: 10;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            line-height: 1.3;
            background: linear-gradient(45deg, var(--electron-color), var(--photon-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: var(--electron-color);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--electron-color);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #cbd5e0;
            border-radius: 2px;
        }

        .toggle-btn {
            background: #e2e8f0;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--text-main);
        }

        .toggle-btn.active {
            background: var(--electron-color);
            color: white;
            box-shadow: 0 4px 10px rgba(67, 97, 238, 0.3);
        }

        .toggle-btn.classical.active {
            background: var(--nucleus-color);
            box-shadow: 0 4px 10px rgba(255, 51, 102, 0.3);
        }

        .mode-switch {
            display: flex;
            gap: 10px;
        }
        .mode-switch button {
            flex: 1;
        }

        /* Formula Card */
        #info-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            z-index: 10;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.9rem;
            min-width: 200px;
        }

        .math-line {
            margin: 8px 0;
            display: flex;
            align-items: center;
        }
        
        .math-label {
            font-weight: 700;
            width: 30px;
            color: var(--text-main);
        }

        .math-value {
            color: var(--photon-color);
            font-weight: 700;
        }

        .legend {
            margin-top: 20px;
            font-size: 0.8rem;
            font-family: 'Inter', sans-serif;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            #controls {
                width: 100%;
                height: auto;
                bottom: 0;
                top: auto;
                border-left: none;
                border-top: 1px solid var(--glass-border);
                max-height: 40vh;
            }
            #info-card {
                top: 10px;
                left: 10px;
                padding: 10px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="info-card">
        <div style="font-family: 'Inter'; font-weight: 800; margin-bottom: 10px; font-size: 1rem;">Live Data</div>
        <div class="math-line"><span class="math-label">r =</span> <span id="val-r" class="math-value">0.00</span> Å</div>
        <div class="math-line"><span class="math-label">E =</span> <span id="val-e" class="math-value">0.00</span> eV</div>
        <div class="math-line"><span class="math-label">L =</span> <span id="val-l" class="math-value">0.00</span> ℏ</div>
        
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: var(--wave-color)"></div> Velocity (v) / EM Wave</div>
            <div class="legend-item"><div class="color-box" style="background: var(--force-color)"></div> Centripetal Force (Fc)</div>
            <div class="legend-item"><div class="color-box" style="background: var(--photon-color)"></div> Photon</div>
        </div>
    </div>

    <div id="controls">
        <h1>Bohr Model vs.<br>Classical Collapse</h1>
        
        <div class="control-group">
            <label>Simulation Mode</label>
            <div class="mode-switch">
                <button id="btn-bohr" class="toggle-btn active">Bohr (Quantum)</button>
                <button id="btn-class" class="toggle-btn classical">Classical</button>
            </div>
        </div>

        <div class="control-group">
            <label>Atomic Number (Z) <span id="lbl-z" class="val-display">1</span></label>
            <input type="range" id="slider-z" min="1" max="10" step="1" value="1">
        </div>

        <div class="control-group" id="group-n">
            <label>Quantum Level (n) <span id="lbl-n" class="val-display">2</span></label>
            <input type="range" id="slider-n" min="1" max="5" step="1" value="2">
        </div>

        <div class="control-group">
            <label>Time Scale <span id="lbl-dt" class="val-display">1.0x</span></label>
            <input type="range" id="slider-dt" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <button id="btn-vectors" class="toggle-btn active">Hide Vectors</button>
        </div>
    </div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Configuration & State ---
        const config = {
            colors: {
                bg: 0xf0f4f8,
                nucleus: 0xFF3366,
                electron: 0x4361EE,
                wave: 0x06D6A0,
                force: 0xF77F00,
                photon: 0x7209B7,
                orbit: 0xBDC3C7
            },
            a0: 2.0, // Base visual radius
            v0: 2.0, // Base visual velocity
            classicalDecay: 0.3 // Rate of classical collapse
        };

        const state = {
            mode: 'bohr', // 'bohr' or 'classical'
            Z: 1,
            n: 2,
            dt: 1.0,
            showVectors: true,
            
            // Electron physical state
            r: 0,
            theta: 0,
            v: 0,
            target_r: 0,
            isJumping: false
        };

        // Initialize state
        state.r = config.a0 * (state.n * state.n) / state.Z;
        state.target_r = state.r;

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(config.colors.bg);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 10, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // --- Scene Objects ---

        // Nucleus
        const nucleusGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const nucleusMat = new THREE.MeshStandardMaterial({ 
            color: config.colors.nucleus,
            emissive: config.colors.nucleus,
            emissiveIntensity: 0.4,
            roughness: 0.2
        });
        const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
        scene.add(nucleus);

        const nucleusLight = new THREE.PointLight(config.colors.nucleus, 1.5, 20);
        scene.add(nucleusLight);

        // Electron
        const electronGeo = new THREE.SphereGeometry(0.3, 32, 32);
        const electronMat = new THREE.MeshStandardMaterial({ 
            color: config.colors.electron,
            roughness: 0.1,
            metalness: 0.2
        });
        const electron = new THREE.Mesh(electronGeo, electronMat);
        scene.add(electron);

        // Bohr Orbits (Dashed Circles)
        const orbits = [];
        const orbitMaterial = new THREE.LineDashedMaterial({
            color: config.colors.orbit,
            dashSize: 0.4,
            gapSize: 0.2,
            transparent: true,
            opacity: 0.4
        });

        function updateOrbits() {
            orbits.forEach(o => scene.remove(o));
            orbits.length = 0;
            
            if (state.mode === 'bohr') {
                for (let i = 1; i <= 5; i++) {
                    const radius = config.a0 * (i * i) / state.Z;
                    const geo = new THREE.BufferGeometry();
                    const points = [];
                    for (let j = 0; j <= 64; j++) {
                        const theta = (j / 64) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                    }
                    geo.setFromPoints(points);
                    const line = new THREE.Line(geo, orbitMaterial);
                    line.computeLineDistances();
                    scene.add(line);
                    orbits.push(line);
                }
            }
        }
        updateOrbits();

        // Vectors
        const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 2, config.colors.wave, 0.6, 0.4);
        const forceArrow = new THREE.ArrowHelper(new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,0), 2, config.colors.force, 0.6, 0.4);
        scene.add(velArrow);
        scene.add(forceArrow);

        // Classical Trail
        const maxTrailPoints = 500;
        const trailGeo = new THREE.BufferGeometry();
        const trailPositions = new Float32Array(maxTrailPoints * 3);
        const trailColors = new Float32Array(maxTrailPoints * 3);
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        trailGeo.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
        
        const trailMat = new THREE.LineBasicMaterial({
            vertexColors: true,
            transparent: true,
            opacity: 0.8
        });
        const trail = new THREE.Line(trailGeo, trailMat);
        scene.add(trail);
        
        let trailIndex = 0;
        let trailActivePoints = 0;

        function resetTrail() {
            trailIndex = 0;
            trailActivePoints = 0;
            for(let i=0; i<maxTrailPoints*3; i++) {
                trailPositions[i] = 0;
                trailColors[i] = 1; // White initially, hidden by logic
            }
            trailGeo.attributes.position.needsUpdate = true;
            trailGeo.attributes.color.needsUpdate = true;
        }

        // Classical EM Radiation (Expanding Wavy Rings)
        const emWaves = [];
        function spawnEMWave(pos) {
            const geo = new THREE.BufferGeometry();
            const points = [];
            for(let i=0; i<=64; i++) {
                points.push(new THREE.Vector3(0,0,0));
            }
            geo.setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({ color: config.colors.wave, transparent: true, opacity: 0.8 });
            const wave = new THREE.Line(geo, mat);
            wave.position.copy(pos);
            wave.userData = { radius: 0, life: 1.0 };
            scene.add(wave);
            emWaves.push(wave);
        }

        // Photon Wave Packet
        let activePhoton = null;
        function spawnPhoton(startR, endR, isEmission) {
            if(activePhoton) scene.remove(activePhoton);
            
            const geo = new THREE.BufferGeometry();
            const points = [];
            for(let i=0; i<=100; i++) points.push(new THREE.Vector3(0,0,0));
            geo.setFromPoints(points);
            
            const mat = new THREE.LineBasicMaterial({ color: config.colors.photon, linewidth: 2 });
            activePhoton = new THREE.Line(geo, mat);
            
            // Direction vector
            const angle = state.theta;
            const dir = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle));
            
            activePhoton.userData = {
                progress: 0,
                start: isEmission ? endR : 25, // If emission, starts at electron and goes out. If absorption, comes from outside.
                end: isEmission ? 25 : endR,
                dir: dir,
                isEmission: isEmission
            };
            scene.add(activePhoton);
        }

        // --- UI Interactions ---
        const ui = {
            btnBohr: document.getElementById('btn-bohr'),
            btnClass: document.getElementById('btn-class'),
            slZ: document.getElementById('slider-z'),
            slN: document.getElementById('slider-n'),
            slDt: document.getElementById('slider-dt'),
            btnVec: document.getElementById('btn-vectors'),
            groupN: document.getElementById('group-n'),
            
            lblZ: document.getElementById('lbl-z'),
            lblN: document.getElementById('lbl-n'),
            lblDt: document.getElementById('lbl-dt'),
            
            valR: document.getElementById('val-r'),
            valE: document.getElementById('val-e'),
            valL: document.getElementById('val-l')
        };

        function setMode(mode) {
            state.mode = mode;
            if (mode === 'bohr') {
                ui.btnBohr.classList.add('active');
                ui.btnClass.classList.remove('active');
                ui.groupN.style.opacity = '1';
                ui.slN.disabled = false;
                
                // Jump to nearest valid orbit
                state.target_r = config.a0 * (state.n * state.n) / state.Z;
                state.isJumping = true;
                resetTrail();
            } else {
                ui.btnClass.classList.add('active');
                ui.btnBohr.classList.remove('active');
                ui.groupN.style.opacity = '0.5';
                ui.slN.disabled = true;
                state.isJumping = false;
                resetTrail();
            }
            updateOrbits();
        }

        ui.btnBohr.addEventListener('click', () => setMode('bohr'));
        ui.btnClass.addEventListener('click', () => setMode('classical'));

        ui.slZ.addEventListener('input', (e) => {
            state.Z = parseInt(e.target.value);
            ui.lblZ.innerText = state.Z;
            if(state.mode === 'bohr') {
                state.target_r = config.a0 * (state.n * state.n) / state.Z;
                state.isJumping = true;
            }
            updateOrbits();
        });

        ui.slN.addEventListener('input', (e) => {
            const oldN = state.n;
            state.n = parseInt(e.target.value);
            ui.lblN.innerText = state.n;
            if(state.mode === 'bohr') {
                const oldR = state.r;
                state.target_r = config.a0 * (state.n * state.n) / state.Z;
                state.isJumping = true;
                spawnPhoton(oldR, state.target_r, state.n < oldN);
            }
        });

        ui.slDt.addEventListener('input', (e) => {
            state.dt = parseFloat(e.target.value);
            ui.lblDt.innerText = state.dt.toFixed(1) + 'x';
        });

        ui.btnVec.addEventListener('click', () => {
            state.showVectors = !state.showVectors;
            ui.btnVec.innerText = state.showVectors ? "Hide Vectors" : "Show Vectors";
            ui.btnVec.classList.toggle('active', !state.showVectors); // Invert logic for button styling
            velArrow.visible = state.showVectors;
            forceArrow.visible = state.showVectors;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Physics & Animation Loop ---
        const clock = new THREE.Clock();
        let frameCount = 0;

        function updatePhysics(delta) {
            const dt = delta * state.dt * 5; // Scale time for visual effect

            if (state.mode === 'bohr') {
                // Quantum Jump Interpolation
                if (state.isJumping) {
                    state.r += (state.target_r - state.r) * 10.0 * delta;
                    if (Math.abs(state.r - state.target_r) < 0.01) {
                        state.r = state.target_r;
                        state.isJumping = false;
                    }
                }

                // Effective n based on current radius (smooths transitions)
                const current_n = Math.sqrt((state.r * state.Z) / config.a0);
                
                // v_n = Z / n * v_0
                state.v = (state.Z / Math.max(current_n, 0.1)) * config.v0;
                
                // Angular velocity w = v / r
                const omega = state.v / state.r;
                state.theta += omega * dt;

            } else {
                // Classical Larmor Formula: dr/dt = -k * Z^2 / r^2
                const dr = -config.classicalDecay * (state.Z * state.Z) / (state.r * state.r) * dt;
                state.r += dr;

                // Prevent falling into point singularity, stop at nucleus surface
                if (state.r < 0.8) {
                    state.r = 0.8;
                    state.v = 0;
                } else {
                    // Force balance: mv^2/r = kZe^2/r^2 => v = sqrt(kZe^2/mr)
                    // Scaled: v = v0 * sqrt(Z * a0 / r)
                    state.v = config.v0 * Math.sqrt((state.Z * config.a0) / state.r);
                    const omega = state.v / state.r;
                    state.theta += omega * dt;

                    // Update Trail
                    if (frameCount % 2 === 0) {
                        const idx = (trailIndex % maxTrailPoints) * 3;
                        trailPositions[idx] = state.r * Math.cos(state.theta);
                        trailPositions[idx+1] = 0;
                        trailPositions[idx+2] = state.r * Math.sin(state.theta);
                        
                        trailIndex++;
                        if(trailActivePoints < maxTrailPoints) trailActivePoints++;

                        // Update colors to fade out
                        const bg = new THREE.Color(config.colors.bg);
                        const trailCol = new THREE.Color(config.colors.electron);
                        
                        for(let i=0; i<trailActivePoints; i++) {
                            const pIdx = ((trailIndex - 1 - i + maxTrailPoints) % maxTrailPoints) * 3;
                            const ratio = 1.0 - (i / maxTrailPoints);
                            const c = trailCol.clone().lerp(bg, 1 - ratio);
                            trailColors[pIdx] = c.r;
                            trailColors[pIdx+1] = c.g;
                            trailColors[pIdx+2] = c.b;
                        }

                        trailGeo.attributes.position.needsUpdate = true;
                        trailGeo.attributes.color.needsUpdate = true;
                        trailGeo.setDrawRange(0, trailActivePoints);
                    }

                    // Emit Classical Radiation
                    if (frameCount % 15 === 0 && state.r > 0.9) {
                        const pos = new THREE.Vector3(state.r * Math.cos(state.theta), 0, state.r * Math.sin(state.theta));
                        spawnEMWave(pos);
                    }
                }
            }

            // Update Electron Position
            const x = state.r * Math.cos(state.theta);
            const z = state.r * Math.sin(state.theta);
            electron.position.set(x, 0, z);

            // Update Vectors
            if (state.showVectors && state.r > 0.8) {
                const velDir = new THREE.Vector3(-Math.sin(state.theta), 0, Math.cos(state.theta));
                const forceDir = new THREE.Vector3(-Math.cos(state.theta), 0, -Math.sin(state.theta));
                
                velArrow.position.set(x, 0, z);
                velArrow.setDirection(velDir);
                velArrow.setLength(state.v * 0.8, 0.4, 0.2);

                forceArrow.position.set(x, 0, z);
                forceArrow.setDirection(forceDir);
                // Force magnitude proportional to v^2/r
                const fMag = (state.v * state.v) / state.r;
                forceArrow.setLength(Math.min(fMag * 0.5, 10), 0.4, 0.2); // Cap length
            }

            // Update Classical EM Waves
            for (let i = emWaves.length - 1; i >= 0; i--) {
                const wave = emWaves[i];
                wave.userData.radius += 5.0 * delta * state.dt;
                wave.userData.life -= 0.5 * delta * state.dt;
                
                if (wave.userData.life <= 0) {
                    scene.remove(wave);
                    emWaves.splice(i, 1);
                } else {
                    const positions = wave.geometry.attributes.position.array;
                    const r = wave.userData.radius;
                    for(let j=0; j<=64; j++) {
                        const ang = (j/64) * Math.PI * 2;
                        // Add sinusoidal wobble to radius
                        const wobble = Math.sin(ang * 8 - frameCount*0.2) * 0.2 * wave.userData.life;
                        positions[j*3] = Math.cos(ang) * (r + wobble);
                        positions[j*3+2] = Math.sin(ang) * (r + wobble);
                    }
                    wave.geometry.attributes.position.needsUpdate = true;
                    wave.material.opacity = wave.userData.life * 0.8;
                }
            }

            // Update Photon Wave Packet
            if (activePhoton) {
                activePhoton.userData.progress += 15.0 * delta * state.dt;
                const p = activePhoton.userData.progress;
                const start = activePhoton.userData.start;
                const end = activePhoton.userData.end;
                const dir = activePhoton.userData.dir;
                
                const currentDist = start + (end > start ? p : -p);
                
                // Check if reached destination
                if ((end > start && currentDist >= end) || (end < start && currentDist <= end)) {
                    scene.remove(activePhoton);
                    activePhoton = null;
                } else {
                    const positions = activePhoton.geometry.attributes.position.array;
                    for(let i=0; i<=100; i++) {
                        // Create a wave packet shape: sine wave * gaussian envelope
                        const localX = (i - 50) * 0.1; 
                        const envelope = Math.exp(-(localX*localX)/2);
                        const waveY = Math.sin(localX * 10 - p * 5) * envelope * 1.5;
                        
                        // Position along direction vector
                        const distAlongRay = currentDist + localX;
                        positions[i*3] = dir.x * distAlongRay;
                        positions[i*3+1] = waveY;
                        positions[i*3+2] = dir.z * distAlongRay;
                    }
                    activePhoton.geometry.attributes.position.needsUpdate = true;
                }
            }
        }

        function updateUI() {
            // Calculate physical values for display
            // 1 a0 visual unit = 0.529 Å
            const r_angstrom = (state.r / config.a0) * 0.529;
            
            // Effective n
            const eff_n = Math.sqrt((state.r * state.Z) / config.a0);
            
            // Energy E = -13.6 * Z^2 / n^2
            let E = -13.6 * (state.Z * state.Z) / (eff_n * eff_n);
            if (state.r < 0.81) E = "-∞"; // Collapsed
            else E = E.toFixed(2);

            // Angular Momentum L = n * hbar
            let L = eff_n.toFixed(2);
            if (state.mode === 'bohr' && !state.isJumping) L = state.n.toFixed(2);
            if (state.r < 0.81) L = "0.00";

            ui.valR.innerText = r_angstrom.toFixed(3);
            ui.valE.innerText = E;
            ui.valL.innerText = L;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1); // Cap delta to prevent huge jumps
            
            updatePhysics(delta);
            updateUI();
            
            controls.update();
            renderer.render(scene, camera);
            frameCount++;
        }

        // Start
        animate();

    </script>
</body>
</html>
