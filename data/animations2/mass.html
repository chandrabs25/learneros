<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mass vs. Moment of Inertia</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            color: #2B2D42;
        }
        canvas {
            display: block;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
            padding: 20px;
            position: absolute;
        }
        #controls {
            top: 20px;
            right: 20px;
            width: 300px;
            max-width: 25vw;
        }
        #formula-card {
            top: 20px;
            left: 20px;
            width: 320px;
        }
        h2 {
            margin-top: 0;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #2B2D42;
            border-bottom: 2px solid rgba(0,0,0,0.05);
            padding-bottom: 10px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: #7209B7;
        }
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #7209B7;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: rgba(43, 45, 66, 0.2);
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }
        button {
            width: 100%;
            padding: 10px;
            background: #2B2D42;
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 10px;
        }
        button:hover {
            background: #1a1b28;
        }
        button:active {
            transform: scale(0.98);
        }
        .formula-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .formula-label {
            font-weight: 600;
        }
        .formula-value {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
        .color-purple { color: #7209B7; }
        .color-red { color: #FF3366; }
        .color-green { color: #06D6A0; }
        .color-orange { color: #F77F00; }
        
        .legend {
            margin-top: 15px;
            font-size: 0.8rem;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="formula-card" class="glass-panel">
        <h2>Live Physics Data</h2>
        <div class="formula-row">
            <span class="formula-label">Mass (m):</span>
            <span class="formula-value color-purple" id="disp-mass">1.00 kg</span>
        </div>
        <div class="formula-row">
            <span class="formula-label">Inertia (I = m·r²):</span>
            <span class="formula-value color-purple" id="disp-inertia">2.25 kg·m²</span>
        </div>
        <hr style="border: 0; border-top: 1px solid rgba(0,0,0,0.1); margin: 10px 0;">
        <div class="formula-row">
            <span class="formula-label">Linear Accel (a = F/m):</span>
            <span class="formula-value color-orange" id="disp-lin-accel">2.00 m/s²</span>
        </div>
        <div class="formula-row">
            <span class="formula-label">Angular Accel (α = τ/I):</span>
            <span class="formula-value color-orange" id="disp-ang-accel">0.89 rad/s²</span>
        </div>
        
        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background:#7209B7;"></div> Mass</div>
            <div class="legend-item"><div class="color-box" style="background:#FF3366;"></div> Force/Torque</div>
            <div class="legend-item"><div class="color-box" style="background:#06D6A0;"></div> Velocity</div>
            <div class="legend-item"><div class="color-box" style="background:#F77F00;"></div> Acceleration</div>
        </div>
    </div>

    <div id="controls" class="glass-panel">
        <h2>Simulation Controls</h2>
        
        <div class="control-group">
            <label>Mass (m) <span class="val-display" id="val-mass">1.0 kg</span></label>
            <input type="range" id="slider-mass" min="0.5" max="5.0" step="0.1" value="1.0">
        </div>
        
        <div class="control-group">
            <label>Radius (r) <span class="val-display" id="val-radius">1.5 m</span></label>
            <input type="range" id="slider-radius" min="0.5" max="2.5" step="0.1" value="1.5">
        </div>
        
        <div class="control-group">
            <label>Force/Torque (F, τ) <span class="val-display" id="val-force">2.0</span></label>
            <input type="range" id="slider-force" min="0" max="10" step="0.5" value="2.0">
        </div>

        <button id="btn-reset">Reset Motion</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Configuration & State ---
        const params = {
            mass: 1.0,
            radius: 1.5,
            force: 2.0
        };

        const state = {
            linear: { x: 0, v: 0, a: 0 },
            rotational: { theta: 0, omega: 0, alpha: 0 }
        };

        const colors = {
            mass: 0x7209B7,
            force: 0xFF3366,
            velocity: 0x06D6A0,
            acceleration: 0xF77F00,
            axis: 0x2B2D42,
            bg: 0xf0f4f8
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(colors.bg);
        scene.fog = new THREE.Fog(colors.bg, 20, 50);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 12, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Environment ---
        const floorGeo = new THREE.PlaneGeometry(100, 100);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xe0e5ec, roughness: 0.8 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        const grid = new THREE.GridHelper(100, 100, 0x000000, 0x000000);
        grid.material.opacity = 0.05;
        grid.material.transparent = true;
        scene.add(grid);

        // --- Materials ---
        const massMat = new THREE.MeshStandardMaterial({ color: colors.mass, roughness: 0.3, metalness: 0.1 });
        const axisMat = new THREE.MeshStandardMaterial({ color: colors.axis, roughness: 0.7 });

        // --- Linear Track (Left) ---
        const linearBaseX = -4;
        const cubeGeo = new THREE.BoxGeometry(1, 1, 1);
        const cube = new THREE.Mesh(cubeGeo, massMat);
        cube.castShadow = true;
        scene.add(cube);

        // Linear Vectors
        const linForceArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(), 1, colors.force, 0.3, 0.2);
        const linVelArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(), 1, colors.velocity, 0.3, 0.2);
        const linAccArrow = new THREE.ArrowHelper(new THREE.Vector3(0,0,-1), new THREE.Vector3(), 1, colors.acceleration, 0.3, 0.2);
        scene.add(linForceArrow);
        scene.add(linVelArrow);
        scene.add(linAccArrow);

        // Track line
        const trackGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(linearBaseX, 0.01, 20), new THREE.Vector3(linearBaseX, 0.01, -20)]);
        const trackMat = new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.2 });
        scene.add(new THREE.Line(trackGeo, trackMat));

        // --- Rotational Track (Right) ---
        const rotBaseX = 4;
        
        // Axis
        const axisGeo = new THREE.CylinderGeometry(0.1, 0.1, 4, 16);
        const axis = new THREE.Mesh(axisGeo, axisMat);
        axis.position.set(rotBaseX, 2, 0);
        axis.castShadow = true;
        scene.add(axis);

        // Rod
        const rodGeo = new THREE.CylinderGeometry(0.05, 0.05, 1, 16);
        // Shift geometry so origin is at one end
        rodGeo.translate(0, 0.5, 0);
        rodGeo.rotateX(Math.PI / 2);
        const rod = new THREE.Mesh(rodGeo, axisMat);
        rod.position.set(rotBaseX, 1, 0);
        rod.castShadow = true;
        scene.add(rod);

        // Sphere
        const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
        const sphere = new THREE.Mesh(sphereGeo, massMat);
        sphere.castShadow = true;
        scene.add(sphere);

        // Rotational Vectors
        const rotForceArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 1, colors.force, 0.3, 0.2);
        const rotVelArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 1, colors.velocity, 0.3, 0.2);
        const rotAccArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(), 1, colors.acceleration, 0.3, 0.2);
        scene.add(rotForceArrow);
        scene.add(rotVelArrow);
        scene.add(rotAccArrow);

        // Circle path
        const pathGeo = new THREE.RingGeometry(params.radius - 0.02, params.radius + 0.02, 64);
        const pathMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.1, side: THREE.DoubleSide });
        const pathMesh = new THREE.Mesh(pathGeo, pathMat);
        pathMesh.rotation.x = -Math.PI / 2;
        pathMesh.position.set(rotBaseX, 0.01, 0);
        scene.add(pathMesh);


        // --- UI Logic ---
        const uiMass = document.getElementById('slider-mass');
        const uiRadius = document.getElementById('slider-radius');
        const uiForce = document.getElementById('slider-force');
        const btnReset = document.getElementById('btn-reset');

        const valMass = document.getElementById('val-mass');
        const valRadius = document.getElementById('val-radius');
        const valForce = document.getElementById('val-force');

        const dispMass = document.getElementById('disp-mass');
        const dispInertia = document.getElementById('disp-inertia');
        const dispLinAccel = document.getElementById('disp-lin-accel');
        const dispAngAccel = document.getElementById('disp-ang-accel');

        function updateParams() {
            params.mass = parseFloat(uiMass.value);
            params.radius = parseFloat(uiRadius.value);
            params.force = parseFloat(uiForce.value);

            valMass.innerText = params.mass.toFixed(1) + ' kg';
            valRadius.innerText = params.radius.toFixed(1) + ' m';
            valForce.innerText = params.force.toFixed(1);

            // Update path visual
            pathMesh.geometry.dispose();
            pathMesh.geometry = new THREE.RingGeometry(params.radius - 0.02, params.radius + 0.02, 64);
        }

        uiMass.addEventListener('input', updateParams);
        uiRadius.addEventListener('input', updateParams);
        uiForce.addEventListener('input', updateParams);

        btnReset.addEventListener('click', () => {
            state.linear.x = 0;
            state.linear.v = 0;
            state.rotational.theta = 0;
            state.rotational.omega = 0;
        });

        // --- Physics & Animation Loop ---
        const clock = new THREE.Clock();

        function updateArrow(arrow, origin, direction, magnitude) {
            if (magnitude < 0.01) {
                arrow.visible = false;
                return;
            }
            arrow.visible = true;
            arrow.position.copy(origin);
            arrow.setDirection(direction.normalize());
            arrow.setLength(magnitude, magnitude * 0.2, magnitude * 0.1);
        }

        function animate() {
            requestAnimationFrame(animate);

            let dt = clock.getDelta();
            if (dt > 0.1) dt = 0.1; // Prevent huge jumps if tab is inactive

            // --- Physics Calculations ---
            
            // Linear
            state.linear.a = params.force / params.mass;
            state.linear.v += state.linear.a * dt;
            state.linear.x += state.linear.v * dt;

            // Rotational
            const inertia = params.mass * Math.pow(params.radius, 2);
            state.rotational.alpha = params.force / inertia; // Assuming slider is Torque
            state.rotational.omega += state.rotational.alpha * dt;
            state.rotational.theta += state.rotational.omega * dt;

            // --- Update Visuals ---
            
            // Scale based on mass (volume proportional to mass -> scale proportional to cube root)
            const scale = Math.pow(params.mass, 1/3);
            cube.scale.set(scale, scale, scale);
            sphere.scale.set(scale, scale, scale);

            const objHeight = scale / 2;

            // Linear Track Update
            // Move along Z axis. Loop back if it goes too far for continuous viewing
            let visualZ = -state.linear.x % 40; 
            if (visualZ < -20) visualZ += 40; // Keep within view

            cube.position.set(linearBaseX, objHeight, visualZ);

            const linDir = new THREE.Vector3(0, 0, -1);
            updateArrow(linForceArrow, cube.position.clone().add(new THREE.Vector3(0, scale*0.6, 0)), linDir, params.force * 0.5);
            updateArrow(linVelArrow, cube.position.clone().add(new THREE.Vector3(scale*0.6, 0, 0)), linDir, state.linear.v * 0.2);
            updateArrow(linAccArrow, cube.position.clone().add(new THREE.Vector3(-scale*0.6, 0, 0)), linDir, state.linear.a * 0.5);

            // Rotational Track Update
            rod.scale.z = params.radius; // Scale cylinder length
            rod.position.y = objHeight;
            
            const sX = rotBaseX + params.radius * Math.cos(state.rotational.theta);
            const sZ = -params.radius * Math.sin(state.rotational.theta);
            sphere.position.set(sX, objHeight, sZ);

            // Tangent direction for vectors
            const tangentDir = new THREE.Vector3(-Math.sin(state.rotational.theta), 0, -Math.cos(state.rotational.theta));
            
            updateArrow(rotForceArrow, sphere.position.clone().add(new THREE.Vector3(0, scale*0.6, 0)), tangentDir.clone(), params.force * 0.5);
            
            // Tangential velocity v = omega * r
            const tangVel = state.rotational.omega * params.radius;
            // Tangential acceleration a_t = alpha * r
            const tangAcc = state.rotational.alpha * params.radius;

            // Offset vectors slightly so they don't overlap perfectly
            const offsetOut = new THREE.Vector3(Math.cos(state.rotational.theta), 0, -Math.sin(state.rotational.theta)).multiplyScalar(scale * 0.6);
            const offsetIn = offsetOut.clone().negate();

            updateArrow(rotVelArrow, sphere.position.clone().add(offsetOut), tangentDir.clone(), tangVel * 0.2);
            updateArrow(rotAccArrow, sphere.position.clone().add(offsetIn), tangentDir.clone(), tangAcc * 0.5);


            // --- Update UI Data ---
            dispMass.innerText = params.mass.toFixed(2) + ' kg';
            dispInertia.innerText = inertia.toFixed(2) + ' kg·m²';
            dispLinAccel.innerText = state.linear.a.toFixed(2) + ' m/s²';
            dispAngAccel.innerText = state.rotational.alpha.toFixed(2) + ' rad/s²';

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize and start
        updateParams();
        animate();

    </script>
</body>
</html>
