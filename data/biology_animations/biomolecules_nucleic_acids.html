<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Architecture of DNA</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        text {
            user-select: none;
        }

        .font-mono {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            fill: #2C3E50;
        }

        /* Animation Keyframes */
        .n1-phos { animation: n1-phos-anim 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .n1-sugar { animation: n1-sugar-anim 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .n1-base { animation: n1-base-anim 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .n2-group { animation: drop-in-2 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .n3-group { animation: drop-in-3 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .n4-group { animation: drop-in-4 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

        .bond-left-2 { stroke-dasharray: 100; animation: draw-bond-2 14s ease-in-out infinite; }
        .bond-left-3 { stroke-dasharray: 100; animation: draw-bond-3 14s ease-in-out infinite; }
        .bond-left-4 { stroke-dasharray: 100; animation: draw-bond-4 14s ease-in-out infinite; }

        .right-strand { animation: right-strand-anim 14s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .h-bond-reveal { animation: reveal-h-bonds 14s ease-in-out infinite; }

        .label-n1 { animation: fade-in-15 14s ease-in-out infinite; }
        .label-poly { animation: fade-in-30 14s ease-in-out infinite; }
        .label-anti { animation: fade-in-55 14s ease-in-out infinite; }
        .label-hbond { animation: fade-in-75 14s ease-in-out infinite; }

        @keyframes n1-phos-anim {
            0%, 5% { transform: translateX(-40px); opacity: 0; }
            15%, 90% { transform: translateX(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes n1-sugar-anim {
            0%, 5% { transform: translateY(-30px); opacity: 0; }
            15%, 90% { transform: translateY(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes n1-base-anim {
            0%, 5% { transform: translateX(40px); opacity: 0; }
            15%, 90% { transform: translateX(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes drop-in-2 {
            0%, 21% { transform: translateY(-40px); opacity: 0; }
            26%, 90% { transform: translateY(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes drop-in-3 {
            0%, 28% { transform: translateY(-40px); opacity: 0; }
            33%, 90% { transform: translateY(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes drop-in-4 {
            0%, 35% { transform: translateY(-40px); opacity: 0; }
            40%, 90% { transform: translateY(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes draw-bond-2 {
            0%, 25% { stroke-dashoffset: 100; opacity: 0; }
            30%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes draw-bond-3 {
            0%, 32% { stroke-dashoffset: 100; opacity: 0; }
            37%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes draw-bond-4 {
            0%, 39% { stroke-dashoffset: 100; opacity: 0; }
            44%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes right-strand-anim {
            0%, 45% { transform: translateX(60px); opacity: 0; }
            55%, 90% { transform: translateX(0); opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes reveal-h-bonds {
            0%, 64% { height: 0; }
            75%, 90% { height: 400px; }
            95%, 100% { height: 0; }
        }

        @keyframes fade-in-15 { 0%, 15% { opacity: 0; } 20%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        @keyframes fade-in-30 { 0%, 30% { opacity: 0; } 35%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        @keyframes fade-in-55 { 0%, 55% { opacity: 0; } 60%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        @keyframes fade-in-75 { 0%, 75% { opacity: 0; } 80%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }

    </style>
</head>
<body>

<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D"/>
        </marker>
        <clipPath id="h-bond-clip">
            <rect x="400" y="100" width="200" height="0" class="h-bond-reveal"/>
        </clipPath>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

    <!-- Title & Subtitle -->
    <text x="500" y="40" font-size="24" font-weight="700" text-anchor="middle" fill="#2C3E50">Molecular Structure of DNA (Deoxyribonucleic Acid)</text>
    <text x="500" y="65" font-size="14" font-weight="400" text-anchor="middle" fill="#7F8C8D">From Nucleotide Assembly to Antiparallel Double Helix</text>

    <!-- Legend -->
    <g transform="translate(250, 560)" font-size="12" font-weight="600" fill="#2C3E50">
        <rect x="0" y="0" width="12" height="12" fill="#2ECC71" rx="2"/> <text x="18" y="10">Adenine (A)</text>
        <rect x="110" y="0" width="12" height="12" fill="#E74C3C" rx="2"/> <text x="128" y="10">Thymine (T)</text>
        <rect x="220" y="0" width="12" height="12" fill="#3498DB" rx="2"/> <text x="238" y="10">Guanine (G)</text>
        <rect x="330" y="0" width="12" height="12" fill="#F39C12" rx="2"/> <text x="348" y="10">Cytosine (C)</text>
    </g>

    <!-- LEFT STRAND (5' -> 3') -->
    <g id="left-strand">
        <!-- 5' Label -->
        <text x="240" y="115" class="font-mono label-n1" font-size="16">5'</text>

        <!-- Nucleotide 1 (A) -->
        <g id="n1">
            <!-- Phosphate -->
            <g class="n1-phos">
                <circle cx="275" cy="130" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
                <text x="275" y="134" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
                <line x1="287" y1="136" x2="295" y2="140" stroke="#2C3E50" stroke-width="2"/>
            </g>
            <!-- Sugar -->
            <g class="n1-sugar">
                <line x1="295" y1="140" x2="310" y2="150" stroke="#2C3E50" stroke-width="2"/>
                <polygon points="330,135 350,150 342,175 318,175 310,150" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
                <circle cx="330" cy="135" r="3" fill="#E74C3C"/> <!-- Oxygen -->
                <!-- Carbon Indicators -->
                <circle cx="350" cy="150" r="1.5" fill="#ffffff"/>
                <circle cx="342" cy="175" r="1.5" fill="#ffffff"/>
                <circle cx="295" cy="140" r="1.5" fill="#2C3E50"/>
                <text x="355" y="145" font-size="9" font-weight="600" fill="#2C3E50">1'</text>
                <text x="328" y="188" font-size="9" font-weight="600" fill="#2C3E50">3'</text>
                <text x="285" y="135" font-size="9" font-weight="600" fill="#2C3E50">5'</text>
            </g>
            <!-- Base A -->
            <g class="n1-base">
                <path d="M 350,125 L 450,125 L 450,135 L 465,140 L 450,145 L 450,155 L 465,160 L 450,165 L 450,175 L 350,175 Z" fill="#2ECC71" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
                <text x="390" y="155" font-size="16" font-weight="700" fill="#ffffff">A</text>
            </g>
        </g>

        <!-- Phosphodiester Bond 1-2 -->
        <line x1="342" y1="175" x2="275" y2="230" stroke="#2C3E50" stroke-width="3" class="bond-left-2"/>

        <!-- Nucleotide 2 (C) -->
        <g id="n2" class="n2-group">
            <circle cx="275" cy="230" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="275" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="287" y1="236" x2="295" y2="240" stroke="#2C3E50" stroke-width="2"/>
            <line x1="295" y1="240" x2="310" y2="250" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="330,235 350,250 342,275 318,275 310,250" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="330" cy="235" r="3" fill="#E74C3C"/>
            <path d="M 350,225 L 440,225 L 440,230 L 425,235 L 440,240 L 440,245 L 425,250 L 440,255 L 440,260 L 425,265 L 440,270 L 440,275 L 350,275 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="390" y="255" font-size="16" font-weight="700" fill="#ffffff">C</text>
        </g>

        <!-- Phosphodiester Bond 2-3 -->
        <line x1="342" y1="275" x2="275" y2="330" stroke="#2C3E50" stroke-width="3" class="bond-left-3"/>

        <!-- Nucleotide 3 (G) -->
        <g id="n3" class="n3-group">
            <circle cx="275" cy="330" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="275" y="334" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="287" y1="336" x2="295" y2="340" stroke="#2C3E50" stroke-width="2"/>
            <line x1="295" y1="340" x2="310" y2="350" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="330,335 350,350 342,375 318,375 310,350" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="330" cy="335" r="3" fill="#E74C3C"/>
            <path d="M 350,325 L 460,325 L 460,330 L 475,335 L 460,340 L 460,345 L 475,350 L 460,355 L 460,360 L 475,365 L 460,370 L 460,375 L 350,375 Z" fill="#3498DB" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="390" y="355" font-size="16" font-weight="700" fill="#ffffff">G</text>
        </g>

        <!-- Phosphodiester Bond 3-4 -->
        <line x1="342" y1="375" x2="275" y2="430" stroke="#2C3E50" stroke-width="3" class="bond-left-4"/>

        <!-- Nucleotide 4 (T) -->
        <g id="n4" class="n4-group">
            <circle cx="275" cy="430" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="275" y="434" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="287" y1="436" x2="295" y2="440" stroke="#2C3E50" stroke-width="2"/>
            <line x1="295" y1="440" x2="310" y2="450" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="330,435 350,450 342,475 318,475 310,450" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="330" cy="435" r="3" fill="#E74C3C"/>
            <path d="M 350,425 L 450,425 L 450,435 L 435,440 L 450,445 L 450,455 L 435,460 L 450,465 L 450,475 L 350,475 Z" fill="#E74C3C" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="390" y="455" font-size="16" font-weight="700" fill="#ffffff">T</text>
            
            <!-- 3' Label -->
            <text x="335" y="505" class="font-mono" font-size="16">3'</text>
        </g>
    </g>

    <!-- RIGHT STRAND (3' -> 5' Antiparallel) -->
    <g id="right-strand" class="right-strand">
        <!-- 3' Label -->
        <text x="650" y="115" class="font-mono" font-size="16">3'</text>

        <!-- Nucleotide 1 (T) -->
        <g id="rn1">
            <circle cx="725" cy="170" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="725" y="174" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="713" y1="164" x2="705" y2="160" stroke="#2C3E50" stroke-width="2"/>
            <line x1="705" y1="160" x2="690" y2="150" stroke="#2C3E50" stroke-width="2"/>
            <!-- Inverted Sugar -->
            <polygon points="670,165 650,150 658,125 682,125 690,150" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="670" cy="165" r="3" fill="#E74C3C"/> <!-- Oxygen pointing DOWN -->
            <path d="M 650,125 L 550,125 L 550,135 L 565,140 L 550,145 L 550,155 L 565,160 L 550,165 L 550,175 L 650,175 Z" fill="#E74C3C" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="610" y="155" font-size="16" font-weight="700" fill="#ffffff">T</text>
        </g>

        <!-- Phosphodiester Bond R1-R2 -->
        <line x1="725" y1="170" x2="658" y2="225" stroke="#2C3E50" stroke-width="3"/>

        <!-- Nucleotide 2 (G) -->
        <g id="rn2">
            <circle cx="725" cy="270" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="725" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="713" y1="264" x2="705" y2="260" stroke="#2C3E50" stroke-width="2"/>
            <line x1="705" y1="260" x2="690" y2="250" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="670,265 650,250 658,225 682,225 690,250" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="670" cy="265" r="3" fill="#E74C3C"/>
            <path d="M 650,225 L 540,225 L 540,230 L 525,235 L 540,240 L 540,245 L 525,250 L 540,255 L 540,260 L 525,265 L 540,270 L 540,275 L 650,275 Z" fill="#3498DB" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="610" y="255" font-size="16" font-weight="700" fill="#ffffff">G</text>
        </g>

        <!-- Phosphodiester Bond R2-R3 -->
        <line x1="725" y1="270" x2="658" y2="325" stroke="#2C3E50" stroke-width="3"/>

        <!-- Nucleotide 3 (C) -->
        <g id="rn3">
            <circle cx="725" cy="370" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="725" y="374" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="713" y1="364" x2="705" y2="360" stroke="#2C3E50" stroke-width="2"/>
            <line x1="705" y1="360" x2="690" y2="350" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="670,365 650,350 658,325 682,325 690,350" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="670" cy="365" r="3" fill="#E74C3C"/>
            <path d="M 650,325 L 560,325 L 560,330 L 575,335 L 560,340 L 560,345 L 575,350 L 560,355 L 560,360 L 575,365 L 560,370 L 560,375 L 650,375 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="610" y="355" font-size="16" font-weight="700" fill="#ffffff">C</text>
        </g>

        <!-- Phosphodiester Bond R3-R4 -->
        <line x1="725" y1="370" x2="658" y2="425" stroke="#2C3E50" stroke-width="3"/>

        <!-- Nucleotide 4 (A) -->
        <g id="rn4">
            <circle cx="725" cy="470" r="14" fill="#FFD93D" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="725" y="474" font-size="12" font-weight="700" text-anchor="middle" fill="#2C3E50">P</text>
            <line x1="713" y1="464" x2="705" y2="460" stroke="#2C3E50" stroke-width="2"/>
            <line x1="705" y1="460" x2="690" y2="450" stroke="#2C3E50" stroke-width="2"/>
            <polygon points="670,465 650,450 658,425 682,425 690,450" fill="#4A90D9" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <circle cx="670" cy="465" r="3" fill="#E74C3C"/>
            <path d="M 650,425 L 550,425 L 550,435 L 535,440 L 550,445 L 550,455 L 535,460 L 550,465 L 550,475 L 650,475 Z" fill="#2ECC71" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
            <text x="610" y="455" font-size="16" font-weight="700" fill="#ffffff">A</text>
            
            <!-- 5' Label -->
            <text x="745" y="505" class="font-mono" font-size="16">5'</text>
        </g>
    </g>

    <!-- HYDROGEN BONDS -->
    <g clip-path="url(#h-bond-clip)">
        <!-- Pair 1: A-T (2 bonds) -->
        <line x1="465" y1="140" x2="565" y2="140" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="465" y1="160" x2="565" y2="160" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        
        <!-- Pair 2: C-G (3 bonds) -->
        <line x1="425" y1="235" x2="525" y2="235" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="425" y1="250" x2="525" y2="250" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="425" y1="265" x2="525" y2="265" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>

        <!-- Pair 3: G-C (3 bonds) -->
        <line x1="475" y1="335" x2="575" y2="335" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="475" y1="350" x2="575" y2="350" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="475" y1="365" x2="575" y2="365" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>

        <!-- Pair 4: T-A (2 bonds) -->
        <line x1="435" y1="440" x2="535" y2="440" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
        <line x1="435" y1="460" x2="535" y2="460" stroke="#95A5A6" stroke-width="2" stroke-dasharray="6,4"/>
    </g>

    <!-- ANNOTATIONS & LABELS -->
    <g font-size="12" font-weight="600" fill="#7F8C8D">
        <!-- N1 Labels -->
        <g class="label-n1">
            <text x="140" y="110">Phosphate Group</text>
            <path d="M 140,115 Q 200,115 255,125" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
            
            <text x="140" y="155">Deoxyribose Sugar</text>
            <path d="M 140,160 Q 220,160 300,155" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
            
            <text x="140" y="200">Nitrogenous Base (Purine)</text>
            <path d="M 140,195 Q 250,195 360,170" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>

        <!-- Polymerization Label -->
        <g class="label-poly">
            <text x="140" y="260">Phosphodiester Bond</text>
            <path d="M 140,255 Q 220,255 295,210" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>

        <!-- Antiparallel Label -->
        <g class="label-anti">
            <text x="860" y="150" text-anchor="end">Antiparallel Strand (3' → 5')</text>
            <text x="860" y="165" text-anchor="end" font-size="10" font-weight="400">Inverted Sugar Orientation</text>
            <path d="M 860,155 Q 800,155 745,155" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>

        <!-- Hydrogen Bonds Label -->
        <g class="label-hbond">
            <text x="860" y="250" text-anchor="end">Hydrogen Bonds</text>
            <text x="860" y="265" text-anchor="end" font-size="10" font-weight="400">A=T (2 bonds), G≡C (3 bonds)</text>
            <path d="M 860,255 Q 700,255 540,250" fill="none" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>
    </g>

</svg>

</body>
</html>
