<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Great Oxygenation Event</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Animations (20s continuous loop) */
        .sky-blue {
            animation: sky-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .reducing-element {
            animation: reducing-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .oxidizing-element {
            animation: oxidizing-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .ozone-layer {
            animation: ozone-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .uv-long {
            animation: uv-long-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite, dash-move 2s linear infinite;
        }
        .uv-short {
            animation: uv-short-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite, dash-move 2s linear infinite;
        }
        .light-ray {
            animation: light-ray-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite, dash-move-reverse 2s linear infinite;
        }
        .cyano-glow {
            animation: cyano-pulse 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .h2o-split {
            animation: h2o-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        .o2-rise-1 { animation: o2-rise-anim-1 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .o2-rise-2 { animation: o2-rise-anim-2 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .o2-rise-3 { animation: o2-rise-anim-3 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .o3-form { animation: o3-anim 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .title-card { animation: title-fade 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .float-1 { animation: float-anim-1 4s ease-in-out infinite; }
        .float-2 { animation: float-anim-2 5s ease-in-out infinite; }
        .float-3 { animation: float-anim-3 6s ease-in-out infinite; }

        /* Keyframes */
        @keyframes sky-fade {
            0%, 40% { opacity: 0; }
            60%, 90% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes reducing-fade {
            0%, 25% { opacity: 1; }
            40%, 90% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes oxidizing-fade {
            0%, 50% { opacity: 0; }
            70%, 90% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes ozone-fade {
            0%, 50% { opacity: 0; }
            70%, 90% { opacity: 0.7; }
            100% { opacity: 0; }
        }
        @keyframes uv-long-fade {
            0%, 45% { opacity: 0.8; }
            55%, 90% { opacity: 0; }
            100% { opacity: 0.8; }
        }
        @keyframes uv-short-fade {
            0%, 45% { opacity: 0; }
            55%, 90% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        @keyframes light-ray-fade {
            0%, 20% { opacity: 0; }
            25%, 90% { opacity: 0.8; }
            100% { opacity: 0; }
        }
        @keyframes cyano-pulse {
            0%, 20% { filter: drop-shadow(0 0 0px #2ECC71); }
            25%, 90% { filter: drop-shadow(0 0 12px #2ECC71); }
            100% { filter: drop-shadow(0 0 0px #2ECC71); }
        }
        @keyframes h2o-fade {
            0%, 20% { opacity: 1; transform: scale(1); }
            25%, 90% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes o2-rise-anim-1 {
            0%, 25% { opacity: 0; transform: translate(0, 0); }
            35% { opacity: 1; transform: translate(-10px, -80px); }
            50%, 90% { opacity: 1; transform: translate(-20px, -220px); }
            100% { opacity: 0; transform: translate(-20px, -220px); }
        }
        @keyframes o2-rise-anim-2 {
            0%, 30% { opacity: 0; transform: translate(0, 0); }
            40% { opacity: 1; transform: translate(15px, -100px); }
            55%, 90% { opacity: 1; transform: translate(30px, -250px); }
            100% { opacity: 0; transform: translate(30px, -250px); }
        }
        @keyframes o2-rise-anim-3 {
            0%, 35% { opacity: 0; transform: translate(0, 0); }
            45% { opacity: 1; transform: translate(-5px, -120px); }
            60%, 90% { opacity: 1; transform: translate(-10px, -280px); }
            100% { opacity: 0; transform: translate(-10px, -280px); }
        }
        @keyframes o3-anim {
            0%, 50% { opacity: 0; transform: translateY(20px); }
            70%, 90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(0); }
        }
        @keyframes title-fade {
            0%, 75% { opacity: 0; transform: translateY(10px); }
            80%, 90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes dash-move {
            to { stroke-dashoffset: -20; }
        }
        @keyframes dash-move-reverse {
            to { stroke-dashoffset: 20; }
        }
        @keyframes float-anim-1 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes float-anim-2 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(12px); }
        }
        @keyframes float-anim-3 {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <h1 style="color: #2C3E50; text-align: center; margin-top: 20px; font-size: 28px;">The Great Oxygenation Event</h1>
    <p style="color: #7f8c8d; text-align: center; margin-top: -10px; margin-bottom: 20px; font-size: 16px;">From a Reducing to an Oxidizing Atmosphere</p>

    <div class="container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram showing the evolution of Earth's atmosphere from reducing to oxidizing via cyanobacteria photosynthesis.">
            <title>Evolution of the Atmosphere</title>
            <desc>A 20-second looping animation showing cyanobacteria producing oxygen, which rises to form the ozone layer, shifting the sky from orange to blue and blocking UV radiation.</desc>

            <defs>
                <!-- Ocean Gradient -->
                <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#1ABC9C" />
                    <stop offset="100%" stop-color="#2C3E50" />
                </linearGradient>

                <!-- Molecules -->
                <g id="mol-ch4">
                    <line x1="0" y1="0" x2="0" y2="-12" stroke="#333" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="0" y2="12" stroke="#333" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="-12" y2="0" stroke="#333" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="12" y2="0" stroke="#333" stroke-width="1.5"/>
                    <circle cx="0" cy="0" r="8" fill="#7f8c8d"/>
                    <circle cx="0" cy="-12" r="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
                    <circle cx="0" cy="12" r="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
                    <circle cx="-12" cy="0" r="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
                    <circle cx="12" cy="0" r="4" fill="#ffffff" stroke="#7f8c8d" stroke-width="1"/>
                    <text x="16" y="4" font-family="'Roboto Mono', monospace" font-size="12" fill="#333" font-weight="bold" pointer-events="none">CH₄</text>
                </g>

                <g id="mol-nh3">
                    <line x1="0" y1="0" x2="0" y2="12" stroke="#333" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="-10" y2="8" stroke="#333" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="10" y2="8" stroke="#333" stroke-width="1.5"/>
                    <circle cx="0" cy="0" r="8" fill="#707B7C"/>
                    <circle cx="0" cy="12" r="4" fill="#ffffff" stroke="#707B7C" stroke-width="1"/>
                    <circle cx="-10" cy="8" r="4" fill="#ffffff" stroke="#707B7C" stroke-width="1"/>
                    <circle cx="10" cy="8" r="4" fill="#ffffff" stroke="#707B7C" stroke-width="1"/>
                    <text x="16" y="4" font-family="'Roboto Mono', monospace" font-size="12" fill="#333" font-weight="bold" pointer-events="none">NH₃</text>
                </g>

                <g id="mol-h2o">
                    <line x1="0" y1="0" x2="-10" y2="-8" stroke="#C0392B" stroke-width="1.5"/>
                    <line x1="0" y1="0" x2="10" y2="-8" stroke="#C0392B" stroke-width="1.5"/>
                    <circle cx="0" cy="0" r="8" fill="#E74C3C"/>
                    <circle cx="-10" cy="-8" r="4" fill="#ffffff" stroke="#C0392B" stroke-width="1"/>
                    <circle cx="10" cy="-8" r="4" fill="#ffffff" stroke="#C0392B" stroke-width="1"/>
                    <text x="16" y="4" font-family="'Roboto Mono', monospace" font-size="12" fill="#C0392B" font-weight="bold" pointer-events="none">H₂O</text>
                </g>

                <g id="mol-o2">
                    <line x1="-6" y1="0" x2="6" y2="0" stroke="#2980B9" stroke-width="3"/>
                    <circle cx="-6" cy="0" r="8" fill="#3498DB"/>
                    <circle cx="6" cy="0" r="8" fill="#3498DB"/>
                    <text x="16" y="4" font-family="'Roboto Mono', monospace" font-size="12" fill="#2980B9" font-weight="bold" pointer-events="none">O₂</text>
                </g>

                <g id="mol-o3">
                    <line x1="-10" y1="6" x2="0" y2="-4" stroke="#7FB3D5" stroke-width="3"/>
                    <line x1="10" y1="6" x2="0" y2="-4" stroke="#7FB3D5" stroke-width="3"/>
                    <circle cx="-10" cy="6" r="8" fill="#AED6F1"/>
                    <circle cx="0" cy="-4" r="8" fill="#AED6F1"/>
                    <circle cx="10" cy="6" r="8" fill="#AED6F1"/>
                    <text x="20" y="4" font-family="'Roboto Mono', monospace" font-size="12" fill="#2980B9" font-weight="bold" pointer-events="none">O₃</text>
                </g>

                <!-- Anaerobe Template -->
                <g id="anaerobe">
                    <circle cx="0" cy="0" r="12" fill="#F39C12" stroke="#D68910" stroke-width="2"/>
                    <path d="M-6,0 Q-3,-5 0,0 T6,0" stroke="#FF6B6B" fill="none" stroke-width="1.5"/>
                </g>
            </defs>

            <!-- Background Sky (Reducing) -->
            <rect x="0" y="0" width="800" height="350" fill="#E67E22" opacity="0.3" />
            
            <!-- Background Sky (Oxidizing - Animated) -->
            <rect x="0" y="0" width="800" height="350" fill="#87CEEB" class="sky-blue" />

            <!-- Sun -->
            <g transform="translate(80, 50)">
                <circle cx="0" cy="0" r="35" fill="#F1C40F" filter="drop-shadow(0 0 15px #F1C40F)" />
                <circle cx="0" cy="0" r="25" fill="#F9E79F" />
            </g>

            <!-- Ozone Layer (Animated) -->
            <g class="ozone-layer">
                <rect x="0" y="80" width="800" height="50" fill="#5DADE2" />
                <text x="400" y="110" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold" opacity="0.9" pointer-events="none">Ozone (O₃) Layer</text>
            </g>

            <!-- UV Rays (Long - Reducing Phase) -->
            <g class="uv-long">
                <line x1="95" y1="80" x2="250" y2="450" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="110" y1="75" x2="450" y2="450" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="120" y1="60" x2="650" y2="450" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
            </g>

            <!-- UV Rays (Short - Oxidizing Phase) -->
            <g class="uv-short">
                <line x1="95" y1="80" x2="140" y2="80" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="110" y1="75" x2="200" y2="80" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="120" y1="60" x2="300" y2="80" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <!-- Bouncing UV -->
                <line x1="140" y1="80" x2="180" y2="30" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="200" y1="80" x2="260" y2="20" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
                <line x1="300" y1="80" x2="380" y2="10" stroke="#FF00FF" stroke-width="2" stroke-dasharray="10,10" />
            </g>

            <!-- Solar Energy for Photosynthesis -->
            <line x1="100" y1="80" x2="380" y2="380" stroke="#F1C40F" stroke-width="2" stroke-dasharray="6,6" class="light-ray" />

            <!-- Ocean -->
            <rect x="0" y="350" width="800" height="150" fill="url(#oceanGrad)" />

            <!-- Anaerobic Prokaryotes (Deep Ocean) -->
            <use href="#anaerobe" x="150" y="460" class="float-1" />
            <use href="#anaerobe" x="280" y="480" class="float-2" />
            <use href="#anaerobe" x="550" y="470" class="float-3" />
            <use href="#anaerobe" x="700" y="450" class="float-1" />
            <text x="150" y="495" text-anchor="middle" font-size="12" fill="#F39C12" font-weight="600" pointer-events="none">Anaerobic Prokaryotes</text>

            <!-- Cyanobacteria (Ocean Surface) -->
            <g class="cyano-glow">
                <!-- Filament 1 -->
                <g transform="translate(350, 400)">
                    <circle cx="-44" cy="4" r="12" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <line x1="-50" y1="2" x2="-38" y2="2" stroke="#98D8C8" stroke-width="1.5"/>
                    <line x1="-50" y1="6" x2="-38" y2="6" stroke="#98D8C8" stroke-width="1.5"/>

                    <circle cx="-22" cy="0" r="12" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <line x1="-28" y1="-2" x2="-16" y2="-2" stroke="#98D8C8" stroke-width="1.5"/>
                    <line x1="-28" y1="2" x2="-16" y2="2" stroke="#98D8C8" stroke-width="1.5"/>

                    <circle cx="0" cy="-2" r="12" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <line x1="-6" y1="-4" x2="6" y2="-4" stroke="#98D8C8" stroke-width="1.5"/>
                    <line x1="-6" y1="0" x2="6" y2="0" stroke="#98D8C8" stroke-width="1.5"/>

                    <circle cx="22" cy="2" r="12" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <line x1="16" y1="0" x2="28" y2="0" stroke="#98D8C8" stroke-width="1.5"/>
                    <line x1="16" y1="4" x2="28" y2="4" stroke="#98D8C8" stroke-width="1.5"/>

                    <circle cx="44" cy="-1" r="12" fill="#27AE60" stroke="#1E8449" stroke-width="2"/>
                    <line x1="38" y1="-3" x2="50" y2="-3" stroke="#98D8C8" stroke-width="1.5"/>
                    <line x1="38" y1="1" x2="50" y2="1" stroke="#98D8C8" stroke-width="1.5"/>
                </g>
                <text x="350" y="435" text-anchor="middle" font-size="12" fill="#27AE60" font-weight="600" pointer-events="none">Cyanobacteria (Oxygenic Photosynthesis)</text>
            </g>

            <!-- Reducing Atmosphere Molecules (CH4, NH3) -->
            <g class="reducing-element">
                <g class="float-1"><use href="#mol-ch4" x="250" y="150" /></g>
                <g class="float-2"><use href="#mol-ch4" x="600" y="120" /></g>
                <g class="float-3"><use href="#mol-ch4" x="150" y="250" /></g>
                <g class="float-2"><use href="#mol-nh3" x="450" y="200" /></g>
                <g class="float-1"><use href="#mol-nh3" x="700" y="220" /></g>
            </g>

            <!-- H2O Molecules (Consumed by Cyanobacteria) -->
            <g class="h2o-split">
                <g class="float-2"><use href="#mol-h2o" x="280" y="370" /></g>
                <g class="float-1"><use href="#mol-h2o" x="430" y="380" /></g>
            </g>

            <!-- O2 Molecules Rising -->
            <g class="o2-rise-1"><g class="float-1"><use href="#mol-o2" x="350" y="380" /></g></g>
            <g class="o2-rise-2"><g class="float-2"><use href="#mol-o2" x="330" y="390" /></g></g>
            <g class="o2-rise-3"><g class="float-3"><use href="#mol-o2" x="370" y="385" /></g></g>
            <g class="o2-rise-1" style="animation-delay: -5s;"><g class="float-2"><use href="#mol-o2" x="360" y="380" /></g></g>
            <g class="o2-rise-2" style="animation-delay: -10s;"><g class="float-1"><use href="#mol-o2" x="340" y="390" /></g></g>

            <!-- O3 Molecules Forming -->
            <g class="o3-form">
                <g class="float-1"><use href="#mol-o3" x="250" y="105" /></g>
                <g class="float-2"><use href="#mol-o3" x="450" y="95" /></g>
                <g class="float-3"><use href="#mol-o3" x="650" y="110" /></g>
            </g>

            <!-- Atmosphere Labels -->
            <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#D35400" class="reducing-element" pointer-events="none">Primitive Atmosphere (Reducing)</text>
            <text x="400" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#2980B9" class="oxidizing-element" pointer-events="none">Modern Atmosphere (Oxidizing)</text>
            <text x="650" y="65" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C3E50" class="oxidizing-element" pointer-events="none">UV Shielding Active</text>

            <!-- Title Card (Phase 4) -->
            <g class="title-card">
                <rect x="250" y="200" width="300" height="60" rx="10" fill="#ffffff" opacity="0.95" filter="drop-shadow(0 4px 8px rgba(0,0,0,0.15))" />
                <text x="400" y="235" text-anchor="middle" font-size="18" font-weight="bold" fill="#27AE60" pointer-events="none">Oxidizing Atmosphere Established</text>
            </g>

            <!-- Legend -->
            <g transform="translate(610, 340)" font-size="11" fill="#2C3E50">
                <rect x="0" y="0" width="175" height="145" fill="#ffffff" opacity="0.9" rx="8" stroke="#BDC3C7" stroke-width="1" />
                <text x="15" y="20" font-weight="bold" font-size="12">Legend</text>
                
                <circle cx="20" cy="40" r="5" fill="#27AE60" />
                <text x="35" y="44">Cyanobacteria</text>
                
                <circle cx="20" cy="60" r="5" fill="#F39C12" />
                <text x="35" y="64">Anaerobic Prokaryote</text>
                
                <line x1="12" y1="80" x2="28" y2="80" stroke="#FF00FF" stroke-width="2" stroke-dasharray="3,3" />
                <text x="35" y="84">UV Radiation</text>
                
                <line x1="12" y1="100" x2="28" y2="100" stroke="#F1C40F" stroke-width="2" stroke-dasharray="3,3" />
                <text x="35" y="104">Solar Energy</text>
                
                <circle cx="16" cy="120" r="4" fill="#3498DB" />
                <circle cx="24" cy="120" r="4" fill="#3498DB" />
                <text x="35" y="124">Oxygen (O₂)</text>
            </g>
        </svg>
    </div>

</body>
</html>
