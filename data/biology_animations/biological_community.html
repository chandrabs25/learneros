<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biological Community Dynamics</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        @keyframes bee-fly {
            0% { transform: translate(50px, 50px) scale(0.8); opacity: 0; }
            5% { opacity: 1; transform: translate(100px, 80px) scale(0.8) rotate(10deg); }
            15% { transform: translate(240px, 140px) scale(0.8) rotate(-5deg); }
            20% { transform: translate(260px, 150px) scale(0.8) rotate(0deg); } /* At flower */
            30% { transform: translate(260px, 150px) scale(0.8) rotate(0deg); } /* Hovering */
            35% { transform: translate(280px, 120px) scale(0.8) rotate(-20deg); opacity: 1; }
            45% { transform: translate(400px, 20px) scale(0.8) rotate(-20deg); opacity: 0; }
            100% { transform: translate(400px, 20px) scale(0.8); opacity: 0; }
        }

        @keyframes flower-pulse {
            0%, 15% { transform: scale(1); transform-origin: 300px 180px; }
            20%, 25% { transform: scale(1.15); transform-origin: 300px 180px; }
            30%, 100% { transform: scale(1); transform-origin: 300px 180px; }
        }

        @keyframes label-mutualism {
            0%, 15% { opacity: 0; transform: translateY(0); }
            20% { opacity: 1; transform: translateY(-10px); }
            30% { opacity: 1; transform: translateY(-15px); }
            35%, 100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes caterpillar-move {
            0%, 25% { transform: translate(340px, 260px) rotate(15deg); opacity: 1; }
            30% { transform: translate(348px, 255px) rotate(20deg) scaleY(1.2); opacity: 1; }
            35% { transform: translate(355px, 250px) rotate(25deg) scaleY(1); opacity: 1; }
            40% { transform: translate(363px, 245px) rotate(30deg) scaleY(1.2); opacity: 1; }
            45%, 64% { transform: translate(370px, 240px) rotate(35deg) scaleY(1); opacity: 1; }
            65%, 95% { opacity: 0; transform: translate(370px, 240px) rotate(35deg); }
            100% { opacity: 1; transform: translate(340px, 260px) rotate(15deg); }
        }

        @keyframes leaf-bite {
            0%, 44% { transform: scale(0); transform-origin: 375px 245px; }
            45%, 95% { transform: scale(1); transform-origin: 375px 245px; }
            100% { transform: scale(0); transform-origin: 375px 245px; }
        }

        @keyframes label-herbivory {
            0%, 40% { opacity: 0; transform: translateY(0); }
            45% { opacity: 1; transform: translateY(-10px); }
            55% { opacity: 1; transform: translateY(-15px); }
            60%, 100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes bird-swoop {
            0%, 50% { transform: translate(850px, -50px) scale(0.8) rotate(-20deg); }
            60% { transform: translate(550px, 100px) scale(0.8) rotate(-30deg); }
            65% { transform: translate(330px, 235px) scale(0.8) rotate(0deg); } /* Swoop at caterpillar */
            75% { transform: translate(100px, 50px) scale(0.8) rotate(20deg); }
            85%, 100% { transform: translate(-150px, -100px) scale(0.8) rotate(30deg); }
        }

        @keyframes label-predation {
            0%, 60% { opacity: 0; transform: translateY(0); }
            65% { opacity: 1; transform: translateY(-10px); }
            75% { opacity: 1; transform: translateY(-15px); }
            80%, 100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes energy-flow-1 {
            0%, 80% { stroke-dashoffset: 30; opacity: 0; }
            85% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: -30; opacity: 0; }
        }

        @keyframes energy-flow-2 {
            0%, 85% { stroke-dashoffset: 30; opacity: 0; }
            90% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: -30; opacity: 0; }
        }

        /* Apply Animations */
        .bee-group { animation: bee-fly 12s infinite ease-in-out; }
        .flower-group { animation: flower-pulse 12s infinite ease-in-out; }
        .mut-label { animation: label-mutualism 12s infinite ease-in-out; }
        .caterpillar-group { animation: caterpillar-move 12s infinite ease-in-out; }
        .leaf-bite-mask { animation: leaf-bite 12s infinite ease-in-out; }
        .herb-label { animation: label-herbivory 12s infinite ease-in-out; }
        .bird-group { animation: bird-swoop 12s infinite ease-in-out; }
        .pred-label { animation: label-predation 12s infinite ease-in-out; }
        .arrow-1 { animation: energy-flow-1 12s infinite linear; }
        .arrow-2 { animation: energy-flow-2 12s infinite linear; }

        .mono { font-family: 'Roboto Mono', monospace; font-weight: 500; }
        .bold { font-weight: 700; }
        .italic { font-style: italic; }
    </style>
</head>
<body>

<div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-label="Animated Diagram of Population Interactions in a Biological Community">
        <title>Biological Community: Interspecific Interactions</title>
        
        <defs>
            <!-- Arrowhead Marker for Energy Flow -->
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFA07A" />
            </marker>
            
            <!-- Gradient for Energy Arrows -->
            <linearGradient id="energyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FFA07A" stop-opacity="0.2" />
                <stop offset="100%" stop-color="#FFA07A" stop-opacity="1" />
            </linearGradient>
        </defs>

        <!-- Background & Environment -->
        <rect width="800" height="500" fill="#f8f9fa" />
        
        <!-- Soil & Ground Line -->
        <rect x="0" y="400" width="800" height="100" fill="#E8F4FD" opacity="0.6" />
        <line x1="0" y1="400" x2="800" y2="400" stroke="#2C3E50" stroke-width="2" />

        <!-- Title -->
        <text x="400" y="40" class="bold" font-size="24" fill="#2C3E50" text-anchor="middle">Biological Community: Interspecific Interactions</text>

        <!-- COMPETITION (-/-) -->
        <g id="competition-roots">
            <!-- Plant 2 (Competitor) Roots -->
            <path d="M 480 400 Q 450 430 400 450 M 480 400 Q 500 440 520 460 M 480 400 L 480 480" stroke="#2ECC71" stroke-width="2" fill="none" opacity="0.7"/>
            <!-- Plant 1 (Main) Roots -->
            <path d="M 300 400 Q 280 430 250 450 M 300 400 Q 330 440 390 460 M 300 400 L 300 470" stroke="#2ECC71" stroke-width="2" fill="none"/>
            
            <!-- Competition Labels -->
            <text x="395" y="465" class="mono" font-size="18" fill="#E74C3C" text-anchor="middle">-/-</text>
            <text x="395" y="485" font-size="12" fill="#2C3E50" text-anchor="middle">Competition (Roots)</text>
        </g>

        <!-- PRODUCERS (Plants) -->
        <!-- Competitor Plant -->
        <g id="plant-competitor">
            <path d="M 480 400 L 480 280" stroke="#2ECC71" stroke-width="4" fill="none"/>
            <path d="M 480 340 Q 520 310 530 350 Q 500 370 480 340" fill="#2ECC71" stroke="#2C3E50" stroke-width="1"/>
            <path d="M 480 300 Q 440 280 430 320 Q 460 330 480 300" fill="#2ECC71" stroke="#2C3E50" stroke-width="1"/>
            <text x="540" y="360" class="italic" font-size="12" fill="#2C3E50">Competitor sp.</text>
        </g>

        <!-- Main Plant -->
        <g id="plant-main">
            <!-- Stem -->
            <path d="M 300 400 L 300 180" stroke="#2ECC71" stroke-width="5" fill="none"/>
            
            <!-- Left Leaf -->
            <path d="M 300 320 Q 200 280 180 350 Q 240 370 300 320" fill="#2ECC71" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Right Leaf (Herbivory Site) -->
            <path d="M 300 260 Q 390 210 410 280 Q 350 310 300 260" fill="#2ECC71" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Bite Mask (Simulates leaf being eaten) -->
            <circle class="leaf-bite-mask" cx="375" cy="245" r="20" fill="#f8f9fa" />
            
            <!-- Plant Labels -->
            <text x="170" y="380" class="italic" font-size="12" fill="#2C3E50">Angiosperm</text>
            <text x="170" y="395" class="bold" font-size="12" fill="#2C3E50">Producer</text>

            <!-- Flower (Mutualism Site) -->
            <g class="flower-group">
                <!-- Petals -->
                <circle cx="280" cy="160" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="320" cy="160" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="275" cy="200" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="325" cy="200" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="300" cy="140" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="300" cy="220" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="265" cy="180" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="335" cy="180" r="18" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1"/>
                <!-- Center -->
                <circle cx="300" cy="180" r="15" fill="#F39C12" stroke="#2C3E50" stroke-width="2"/>
            </g>
        </g>

        <!-- MUTUALIST (Bee) -->
        <g class="bee-group">
            <!-- Wings -->
            <ellipse cx="-6" cy="-12" rx="10" ry="16" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1.5" transform="rotate(-30)"/>
            <ellipse cx="6" cy="-12" rx="10" ry="16" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1.5" transform="rotate(30)"/>
            <!-- Body -->
            <ellipse cx="0" cy="0" rx="18" ry="12" fill="#F39C12" stroke="#2C3E50" stroke-width="2"/>
            <!-- Stripes -->
            <line x1="-6" y1="-11" x2="-6" y2="11" stroke="#2C3E50" stroke-width="4"/>
            <line x1="6" y1="-11" x2="6" y2="11" stroke="#2C3E50" stroke-width="4"/>
            <!-- Head -->
            <circle cx="20" cy="0" r="6" fill="#2C3E50"/>
            <!-- Stinger -->
            <polygon points="-18,0 -25,-4 -25,4" fill="#2C3E50"/>
            
            <!-- Bee Labels -->
            <text x="-35" y="-35" class="italic" font-size="12" fill="#2C3E50">Apis mellifera</text>
            <text x="-35" y="-20" class="bold" font-size="12" fill="#2C3E50">Mutualist (+/+)</text>
        </g>

        <!-- HERBIVORE (Caterpillar) -->
        <g class="caterpillar-group">
            <!-- Body Segments -->
            <circle cx="0" cy="0" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="10" cy="-3" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="20" cy="-5" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="30" cy="-3" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="40" cy="0" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Head -->
            <circle cx="50" cy="2" r="8" fill="#2ECC71" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Antennae -->
            <line x1="50" y1="-6" x2="55" y2="-14" stroke="#2C3E50" stroke-width="1.5"/>
            <line x1="50" y1="-6" x2="45" y2="-14" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Caterpillar Labels -->
            <text x="-10" y="-30" class="italic" font-size="12" fill="#2C3E50">Larva</text>
            <text x="-10" y="-15" class="bold" font-size="12" fill="#2C3E50">Primary Consumer (+/-)</text>
        </g>

        <!-- PREDATOR (Bird) -->
        <g class="bird-group">
            <!-- Tail -->
            <polygon points="-25,0 -50,-15 -45,10" fill="#F39C12" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Back Wing -->
            <path d="M -10 -5 Q -25 -40 5 -55 Q 15 -25 -5 -5" fill="#4A90D9" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Body -->
            <ellipse cx="0" cy="0" rx="30" ry="18" fill="#F39C12" stroke="#2C3E50" stroke-width="2"/>
            <!-- Head -->
            <circle cx="25" cy="-8" r="14" fill="#F39C12" stroke="#2C3E50" stroke-width="2"/>
            <!-- Beak -->
            <polygon points="38,-8 55,-4 38,0" fill="#FFD700" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Eye -->
            <circle cx="28" cy="-12" r="2.5" fill="#2C3E50"/>
            <!-- Front Wing -->
            <path d="M 0 5 Q -15 40 15 55 Q 25 25 5 5" fill="#4A90D9" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Bird Labels -->
            <text x="-30" y="-70" class="italic" font-size="14" fill="#2C3E50">Passerine</text>
            <text x="-30" y="-50" class="bold" font-size="14" fill="#2C3E50">Secondary Consumer (+/-)</text>
        </g>

        <!-- INTERACTION INDICATORS (Floating Symbols) -->
        <text x="250" y="120" class="mono mut-label" font-size="24" fill="#27AE60" font-weight="bold">+/+</text>
        <text x="420" y="220" class="mono herb-label" font-size="24" fill="#E74C3C" font-weight="bold">+/-</text>
        <text x="350" y="180" class="mono pred-label" font-size="24" fill="#E74C3C" font-weight="bold">+/-</text>

        <!-- ENERGY FLOW ARROWS -->
        <!-- Plant to Caterpillar -->
        <path class="arrow-1" d="M 320 280 Q 340 230 360 250" fill="none" stroke="url(#energyGrad)" stroke-width="4" stroke-dasharray="10, 5" marker-end="url(#arrowhead)"/>
        <!-- Caterpillar to Bird -->
        <path class="arrow-2" d="M 390 230 Q 430 150 480 160" fill="none" stroke="url(#energyGrad)" stroke-width="4" stroke-dasharray="10, 5" marker-end="url(#arrowhead)"/>

        <!-- LEGEND -->
        <g transform="translate(20, 360)">
            <rect width="210" height="120" fill="#ffffff" stroke="#2C3E50" stroke-width="1.5" rx="8" opacity="0.9"/>
            <text x="15" y="25" class="bold" font-size="14" fill="#2C3E50">Interaction Key</text>
            
            <!-- Mutualism -->
            <text x="15" y="50" class="mono" font-size="16" fill="#27AE60">+/+</text>
            <text x="55" y="49" font-size="13" fill="#2C3E50">Mutualism</text>
            
            <!-- Predation/Herbivory -->
            <text x="15" y="75" class="mono" font-size="16" fill="#E74C3C">+/-</text>
            <text x="55" y="74" font-size="13" fill="#2C3E50">Predation/Herbivory</text>
            
            <!-- Competition -->
            <text x="15" y="100" class="mono" font-size="16" fill="#E74C3C">-/-</text>
            <text x="55" y="99" font-size="13" fill="#2C3E50">Competition</text>
        </g>

        <!-- Energy Flow Legend -->
        <g transform="translate(620, 420)">
            <path d="M 0 10 L 40 10" fill="none" stroke="#FFA07A" stroke-width="3" stroke-dasharray="5, 3" marker-end="url(#arrowhead)"/>
            <text x="55" y="14" font-size="12" fill="#2C3E50" class="bold">Energy Flow</text>
        </g>

    </svg>
</div>

</body>
</html>
