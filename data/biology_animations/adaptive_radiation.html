<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Radiation: Darwin's Finches</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,600;1,400;1,600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        text {
            font-family: 'Inter', sans-serif;
        }

        .sci-name {
            font-family: 'Roboto Mono', monospace;
            font-style: italic;
            font-weight: 600;
            fill: #2C3E50;
        }

        .niche-desc {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            fill: #E74C3C;
        }

        /* Animations */
        .ancestor-pulse {
            animation: pulse 12s infinite ease-in-out;
            transform-origin: 400px 340px;
        }

        .halo {
            animation: pulse-halo 12s infinite ease-out;
            transform-origin: 400px 340px;
        }

        .rad-line {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: draw-line 12s infinite ease-in-out;
        }

        .descendant-bird {
            animation: fade-bird 12s infinite ease-out;
            transform-origin: 0 0;
        }

        .niche-element {
            animation: fade-niche 12s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 16.6% { transform: scale(1); }
            8.3% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        @keyframes pulse-halo {
            0%, 16.6% { transform: scale(1); opacity: 0.6; }
            8.3% { transform: scale(1.8); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        @keyframes draw-line {
            0%, 16.6% { stroke-dashoffset: 150; opacity: 0; }
            16.7% { opacity: 1; stroke-dashoffset: 150; }
            41.6%, 83.3% { stroke-dashoffset: 0; opacity: 1; }
            83.4%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes fade-bird {
            0%, 41.6% { opacity: 0; transform: scale(0.5); }
            54.1%, 83.3% { opacity: 1; transform: scale(1); }
            83.4%, 100% { opacity: 0; transform: scale(1); }
        }

        @keyframes fade-niche {
            0%, 66.6% { opacity: 0; transform: translateY(5px); }
            75%, 83.3% { opacity: 1; transform: translateY(0); }
            83.4%, 100% { opacity: 0; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram of Adaptive Radiation in Darwin's Finches">
        <title>Adaptive Radiation: Diversification from a Common Ancestor</title>
        
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4A90D9"/>
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Titles -->
        <text x="400" y="45" font-size="24" font-weight="700" fill="#2C3E50" text-anchor="middle">ADAPTIVE RADIATION: DARWIN'S FINCHES</text>
        <text x="400" y="70" font-size="15" font-weight="400" fill="#4A90D9" text-anchor="middle">Diversification of a single ancestral species into multiple specialized forms</text>

        <!-- Legend -->
        <g transform="translate(580, 480)">
            <rect x="0" y="0" width="200" height="100" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="6"/>
            <text x="100" y="20" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">KEY</text>
            
            <line x1="15" y1="35" x2="35" y2="35" stroke="#4A90D9" stroke-width="2" stroke-dasharray="4,2"/>
            <text x="45" y="39" font-size="11" fill="#2C3E50">Radiation Path</text>
            
            <circle cx="25" cy="55" r="5" fill="#F39C12"/>
            <text x="45" y="59" font-size="11" fill="#2C3E50">Animal Tissue (Body)</text>
            
            <path d="M 20,70 L 30,75 L 20,80 Z" fill="#2C3E50"/>
            <text x="45" y="79" font-size="11" fill="#2C3E50">Morphological Adaptation</text>
        </g>

        <!-- Radiation Lines -->
        <g stroke="#4A90D9" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)">
            <!-- To Pos 1 (Top) -->
            <line x1="400" y1="305" x2="400" y2="180" class="rad-line" />
            <!-- To Pos 2 (Top Right) -->
            <line x1="433" y1="329" x2="552" y2="290" class="rad-line" />
            <!-- To Pos 3 (Bottom Right) -->
            <line x1="420" y1="368" x2="493" y2="469" class="rad-line" />
            <!-- To Pos 4 (Bottom Left) -->
            <line x1="380" y1="368" x2="307" y2="469" class="rad-line" />
            <!-- To Pos 5 (Top Left) -->
            <line x1="367" y1="329" x2="248" y2="290" class="rad-line" />
        </g>

        <!-- Central Ancestor -->
        <g>
            <circle cx="400" cy="340" r="40" fill="#E8F4FD" class="halo"/>
            <g class="ancestor-pulse">
                <!-- Body -->
                <path d="M 400,320 C 420,320 433,333 433,353 C 433,373 413,380 387,380 C 367,380 353,360 360,340 C 367,327 380,320 400,320 Z" fill="#F39C12"/>
                <!-- Wing -->
                <path d="M 387,340 Q 407,333 420,347 Q 400,360 387,340 Z" fill="#E67E22"/>
                <!-- Eye -->
                <circle cx="413" cy="333" r="4" fill="#ffffff"/>
                <circle cx="415" cy="333" r="2" fill="#2C3E50"/>
                <!-- Medium Beak -->
                <path d="M 427,332 L 447,338 L 427,345 Z" fill="#2C3E50"/>
            </g>
            <!-- Label -->
            <text x="400" y="405" font-size="14" font-weight="700" fill="#2C3E50" text-anchor="middle">Founder Population</text>
            <text x="400" y="423" font-size="12" class="sci-name" fill="#7f8c8d" text-anchor="middle">Geospiza ancestor</text>
        </g>

        <!-- Descendants -->
        
        <!-- 1. Large Ground Finch (Top) -->
        <g transform="translate(400, 140)">
            <g class="descendant-bird">
                <!-- Bird Graphics -->
                <g>
                    <path d="M 0,-20 C 20,-20 33,-7 33,13 C 33,33 13,40 -13,40 C -33,40 -47,20 -40,0 C -33,-13 -20,-20 0,-20 Z" fill="#F39C12"/>
                    <path d="M -13,0 Q 7,-7 20,7 Q 0,20 -13,0 Z" fill="#E67E22"/>
                    <circle cx="13" cy="-7" r="4" fill="#ffffff"/>
                    <circle cx="15" cy="-7" r="2" fill="#2C3E50"/>
                    <!-- Heavy Crushing Beak -->
                    <path d="M 25,-15 L 53,-2 L 25,13 Z" fill="#2C3E50"/>
                    
                    <!-- Food: Large Seeds -->
                    <g class="niche-element">
                        <circle cx="65" cy="-2" r="5" fill="#F39C12" stroke="#2C3E50" stroke-width="1"/>
                        <circle cx="74" cy="6" r="4.5" fill="#F39C12" stroke="#2C3E50" stroke-width="1"/>
                        <circle cx="58" cy="8" r="5" fill="#F39C12" stroke="#2C3E50" stroke-width="1"/>
                    </g>
                </g>
                <!-- Labels -->
                <g class="niche-element">
                    <text x="0" y="-55" font-size="14" class="sci-name" text-anchor="middle">Geospiza magnirostris</text>
                    <text x="0" y="-38" class="niche-desc" text-anchor="middle">Large seeds (Crushing beak)</text>
                </g>
            </g>
        </g>

        <!-- 2. Cactus Finch (Top Right) -->
        <g transform="translate(590, 278)">
            <g class="descendant-bird">
                <g>
                    <path d="M 0,-18 C 18,-18 30,-6 30,12 C 30,30 12,36 -12,36 C -30,36 -42,18 -36,0 C -30,-12 -18,-18 0,-18 Z" fill="#F39C12"/>
                    <path d="M -12,0 Q 6,-6 18,6 Q 0,18 -12,0 Z" fill="#E67E22"/>
                    <circle cx="12" cy="-6" r="3.5" fill="#ffffff"/>
                    <circle cx="14" cy="-6" r="1.8" fill="#2C3E50"/>
                    <!-- Long Decurved Beak -->
                    <path d="M 24,-8 Q 45,-10 55,8 Q 38,3 24,3 Z" fill="#2C3E50"/>
                    
                    <!-- Food: Cactus Flower -->
                    <g class="niche-element">
                        <path d="M 60,20 L 60,8 L 72,8 L 72,20 Z" fill="#2ECC71"/>
                        <path d="M 55,8 Q 66,-10 77,8 Z" fill="#FF6B6B"/>
                    </g>
                </g>
                <g class="niche-element">
                    <text x="30" y="-35" font-size="14" class="sci-name" text-anchor="middle">Geospiza scandens</text>
                    <text x="30" y="-18" class="niche-desc" text-anchor="middle">Cactus flowers (Probing beak)</text>
                </g>
            </g>
        </g>

        <!-- 3. Warbler Finch (Bottom Right) -->
        <g transform="translate(517, 501)">
            <g class="descendant-bird">
                <g>
                    <path d="M 0,-15 C 15,-15 25,-5 25,10 C 25,25 10,30 -10,30 C -25,30 -35,15 -30,0 C -25,-10 -15,-15 0,-15 Z" fill="#F39C12"/>
                    <path d="M -10,0 Q 5,-5 15,5 Q 0,15 -10,0 Z" fill="#E67E22"/>
                    <circle cx="10" cy="-5" r="3" fill="#ffffff"/>
                    <circle cx="12" cy="-5" r="1.5" fill="#2C3E50"/>
                    <!-- Thin Needle Beak -->
                    <path d="M 22,-4 L 45,-1 L 22,2 Z" fill="#2C3E50"/>
                    
                    <!-- Food: Insect -->
                    <g class="niche-element">
                        <circle cx="52" cy="0" r="2" fill="#E74C3C"/>
                        <circle cx="57" cy="0" r="2.5" fill="#E74C3C"/>
                        <circle cx="63" cy="0" r="2.5" fill="#E74C3C"/>
                        <circle cx="69" cy="0" r="2" fill="#E74C3C"/>
                        <path d="M 57,2 L 55,6 M 63,2 L 65,6 M 57,-2 L 55,-6 M 63,-2 L 65,-6" stroke="#2C3E50" stroke-width="1"/>
                    </g>
                </g>
                <g class="niche-element">
                    <text x="45" y="35" font-size="14" class="sci-name" text-anchor="start">Certhidea olivacea</text>
                    <text x="45" y="52" class="niche-desc" text-anchor="start">Insects (Grasping beak)</text>
                </g>
            </g>
        </g>

        <!-- 4. Woodpecker Finch (Bottom Left) -->
        <g transform="translate(283, 501)">
            <g class="descendant-bird">
                <!-- Flipped Bird Graphics -->
                <g transform="scale(-1, 1)">
                    <path d="M 0,-18 C 18,-18 30,-6 30,12 C 30,30 12,36 -12,36 C -30,36 -42,18 -36,0 C -30,-12 -18,-18 0,-18 Z" fill="#F39C12"/>
                    <path d="M -12,0 Q 6,-6 18,6 Q 0,18 -12,0 Z" fill="#E67E22"/>
                    <circle cx="12" cy="-6" r="3.5" fill="#ffffff"/>
                    <circle cx="14" cy="-6" r="1.8" fill="#2C3E50"/>
                    <!-- Stout Beak -->
                    <path d="M 24,-8 L 40,-2 L 24,6 Z" fill="#2C3E50"/>
                    
                    <!-- Food: Tool & Grub -->
                    <g class="niche-element">
                        <line x1="30" y1="-2" x2="60" y2="15" stroke="#F5F5DC" stroke-width="2.5" stroke-linecap="round"/>
                        <path d="M 60,25 L 60,12 L 85,12 L 85,25 Z" fill="#2C3E50"/>
                        <circle cx="72" cy="9" r="3.5" fill="#E74C3C"/>
                    </g>
                </g>
                <!-- Normal Labels (Not Flipped) -->
                <g class="niche-element">
                    <text x="-45" y="35" font-size="14" class="sci-name" text-anchor="end">Camarhynchus pallidus</text>
                    <text x="-45" y="52" class="niche-desc" text-anchor="end">Grubs (Tool-using beak)</text>
                </g>
            </g>
        </g>

        <!-- 5. Small Ground Finch (Top Left) -->
        <g transform="translate(210, 278)">
            <g class="descendant-bird">
                <!-- Flipped Bird Graphics -->
                <g transform="scale(-1, 1)">
                    <path d="M 0,-15 C 15,-15 25,-5 25,10 C 25,25 10,30 -10,30 C -25,30 -35,15 -30,0 C -25,-10 -15,-15 0,-15 Z" fill="#F39C12"/>
                    <path d="M -10,0 Q 5,-5 15,5 Q 0,15 -10,0 Z" fill="#E67E22"/>
                    <circle cx="10" cy="-5" r="3" fill="#ffffff"/>
                    <circle cx="12" cy="-5" r="1.5" fill="#2C3E50"/>
                    <!-- Small Crushing Beak -->
                    <path d="M 22,-6 L 34,-2 L 22,3 Z" fill="#2C3E50"/>
                    
                    <!-- Food: Small Seeds -->
                    <g class="niche-element">
                        <circle cx="45" cy="0" r="2.5" fill="#F39C12"/>
                        <circle cx="52" cy="4" r="2" fill="#F39C12"/>
                        <circle cx="42" cy="6" r="2.5" fill="#F39C12"/>
                        <circle cx="49" cy="-3" r="1.5" fill="#F39C12"/>
                    </g>
                </g>
                <!-- Normal Labels (Not Flipped) -->
                <g class="niche-element">
                    <text x="-30" y="-35" font-size="14" class="sci-name" text-anchor="middle">Geospiza fuliginosa</text>
                    <text x="-30" y="-18" class="niche-desc" text-anchor="middle">Small seeds (Crushing beak)</text>
                </g>
            </g>
        </g>

    </svg>
</div>

</body>
</html>
