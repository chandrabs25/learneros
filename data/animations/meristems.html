<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoot Apical Meristem Animation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }
        text {
            user-select: none;
        }
        .title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 22px;
            fill: #2C3E50;
        }
        .subtitle {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
            font-size: 14px;
            fill: #7f8c8d;
        }
        .label {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            fill: #2C3E50;
        }
        .label-italic {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-style: italic;
            font-size: 14px;
            fill: #2C3E50;
        }
        .legend-text {
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            font-size: 12px;
            fill: #2C3E50;
        }

        /* Core Treadmill Animation */
        .block {
            animation: moveDown 16s infinite linear;
        }
        .block, .block * {
            animation-delay: var(--delay);
        }

        @keyframes moveDown {
            0% { transform: translateY(110px); opacity: 0; }
            12.5% { transform: translateY(130px); opacity: 1; }
            25% { transform: translateY(150px); opacity: 1; }
            37.5% { transform: translateY(170px); opacity: 1; }
            50% { transform: translateY(210px); opacity: 1; }
            62.5% { transform: translateY(270px); opacity: 1; }
            75% { transform: translateY(330px); opacity: 1; }
            87.5% { transform: translateY(390px); opacity: 1; }
            100% { transform: translateY(450px); opacity: 0; }
        }

        /* Cell Base Transformations */
        .cell-base-pro {
            animation: cellBasePro 16s infinite linear;
        }
        @keyframes cellBasePro {
            0%, 25% { height: 20px; fill: #E8F4FD; }
            37.5% { height: 40px; fill: #E8F4FD; }
            50% { height: 60px; fill: #E8F4FD; }
            62.5%, 100% { height: 60px; fill: #F39C12; }
        }

        .cell-base-ground {
            animation: cellBaseGround 16s infinite linear;
        }
        @keyframes cellBaseGround {
            0%, 25% { height: 20px; fill: #E8F4FD; }
            37.5% { height: 40px; fill: #E8F4FD; }
            50% { height: 60px; fill: #E8F4FD; }
            62.5%, 100% { height: 60px; fill: #2ECC71; }
        }

        /* Mitosis Divider */
        .divider {
            animation: dividerAnim 16s infinite linear;
        }
        @keyframes dividerAnim {
            0%, 12.4% { transform: translateY(10px); opacity: 0; }
            12.5%, 25% { transform: translateY(10px); opacity: 1; }
            37.5% { transform: translateY(20px); opacity: 1; }
            50%, 100% { transform: translateY(30px); opacity: 1; }
        }

        /* Nucleus Animations */
        .nuc1 {
            animation: nuc1Anim 16s infinite linear;
        }
        @keyframes nuc1Anim {
            0%, 12.4% { transform: translate(20px, 10px); }
            12.5% { transform: translate(20px, 5px); }
            25% { transform: translate(20px, 5px); }
            37.5% { transform: translate(8px, 10px); }
            50%, 100% { transform: translate(8px, 15px); }
        }

        .nuc2 {
            animation: nuc2Anim 16s infinite linear;
        }
        @keyframes nuc2Anim {
            0%, 12.4% { transform: translate(20px, 10px); opacity: 0; }
            12.5% { transform: translate(20px, 15px); opacity: 1; }
            25% { transform: translate(20px, 15px); opacity: 1; }
            37.5% { transform: translate(8px, 30px); opacity: 1; }
            50%, 100% { transform: translate(8px, 45px); opacity: 1; }
        }

        /* Vacuole Animations */
        .vac1 {
            animation: vac1Anim 16s infinite linear;
        }
        @keyframes vac1Anim {
            0%, 25% { transform: translateY(2px); height: 0px; opacity: 0; }
            37.5% { transform: translateY(4px); height: 12px; opacity: 1; }
            50%, 100% { transform: translateY(5px); height: 20px; opacity: 1; }
        }

        .vac2 {
            animation: vac2Anim 16s infinite linear;
        }
        @keyframes vac2Anim {
            0%, 25% { transform: translateY(12px); height: 0px; opacity: 0; }
            37.5% { transform: translateY(24px); height: 12px; opacity: 1; }
            50%, 100% { transform: translateY(35px); height: 20px; opacity: 1; }
        }

        /* Xylem Spirals */
        .spirals {
            animation: spiralsAnim 16s infinite linear;
        }
        @keyframes spiralsAnim {
            0%, 50% { opacity: 0; }
            62.5%, 100% { opacity: 1; }
        }

        /* Protoderm Flow */
        .protoderm-flow {
            animation: flowDown 4s infinite linear;
        }
        @keyframes flowDown {
            from { stroke-dashoffset: 0; }
            to { stroke-dashoffset: -40; }
        }
    </style>
</head>

        </g>

        <!-- Column 3: Ground Tissue (Central Pith) -->
