<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phylum Chordata: Diagnostic Features</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;1,400&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #2C3E50; }
        .subtitle { font-family: 'Inter', sans-serif; font-style: italic; font-size: 14px; fill: #7F8C8D; }
        .label { font-family: 'Roboto Mono', monospace; font-size: 12px; fill: #2C3E50; transition: all 0.3s ease; }
        .legend-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #2C3E50; }

        /* Animations */
        .fade-in {
            animation: fadeIn 12s infinite;
        }

        .grow-path {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: grow 12s infinite ease-in-out;
        }

        .pulse-group {
            animation: pulseFade 12s infinite;
        }

        .water-flow {
            animation: waterFade 12s infinite;
        }

        /* Highlight Animations (8s - 12s) */
        .hl-nerve { animation: highlightNerve 12s infinite; }
        .hl-noto { animation: highlightNoto 12s infinite; }
        .hl-slits { animation: highlightSlits 12s infinite; }
        .hl-tail { animation: highlightTail 12s infinite; }
        
        .lbl-nerve { animation: labelNerve 12s infinite; }
        .lbl-noto { animation: labelNoto 12s infinite; }
        .lbl-slits { animation: labelSlits 12s infinite; }
        .lbl-tail { animation: labelTail 12s infinite; }

        @keyframes fadeIn {
            0% { opacity: 0; }
            10%, 100% { opacity: 1; }
        }

        @keyframes grow {
            0%, 5% { stroke-dashoffset: 100; }
            25%, 100% { stroke-dashoffset: 0; }
        }

        @keyframes pulseFade {
            0%, 25% { opacity: 0; }
            30%, 90% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes waterFade {
            0%, 30% { opacity: 0; }
            35%, 85% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Sequential Glows */
        @keyframes highlightNerve {
            0%, 66%, 75%, 100% { filter: drop-shadow(0 0 0px rgba(74,144,217,0)); stroke-width: 14px; }
            70% { filter: drop-shadow(0 0 8px rgba(74,144,217,0.8)); stroke-width: 18px; }
        }
        @keyframes highlightNoto {
            0%, 75%, 84%, 100% { filter: drop-shadow(0 0 0px rgba(243,156,18,0)); stroke-width: 12px; }
            79% { filter: drop-shadow(0 0 8px rgba(243,156,18,0.8)); stroke-width: 16px; }
        }
        @keyframes highlightSlits {
            0%, 84%, 92%, 100% { filter: drop-shadow(0 0 0px rgba(231,76,60,0)); stroke-width: 4px; }
            88% { filter: drop-shadow(0 0 8px rgba(231,76,60,0.8)); stroke-width: 8px; }
        }
        @keyframes highlightTail {
            0%, 92%, 100% { opacity: 0; }
            96% { opacity: 0.6; }
        }

        /* Label Sync */
        @keyframes labelNerve { 70% { fill: #4A90D9; font-weight: bold; font-size: 13px; } }
        @keyframes labelNoto { 79% { fill: #F39C12; font-weight: bold; font-size: 13px; } }
        @keyframes labelSlits { 88% { fill: #E74C3C; font-weight: bold; font-size: 13px; } }
        @keyframes labelTail { 96% { fill: #F39C12; font-weight: bold; font-size: 13px; } }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated Diagram of Phylum Chordata Diagnostic Features">
        <title>Phylum Chordata: Diagnostic Features</title>
        <desc>A longitudinal section of a generalized chordate showing the dorsal hollow nerve cord, notochord, pharyngeal gill slits, and post-anal tail.</desc>

        <!-- Definitions for markers and gradients -->
        <defs>
            <marker id="arrow-venous" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 10 0 L 0 5 L 10 10 Z" fill="#3498DB" />
            </marker>
            <marker id="arrow-arterial" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#E74C3C" />
            </marker>
            <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
                <circle cx="5" cy="5" r="5" fill="#7F8C8D" />
            </marker>
        </defs>

        <!-- Title & Subtitle -->
        <text x="400" y="45" text-anchor="middle" class="title">Phylum Chordata: Diagnostic Features</text>
        <text x="400" y="70" text-anchor="middle" class="subtitle">Representative: Rana tigrina (Embryonic stage)</text>

        <!-- Legend -->
        <g transform="translate(30, 400)" class="fade-in">
            <rect x="0" y="0" width="140" height="80" rx="6" fill="#f8f9fa" stroke="#E8F4FD" stroke-width="2"/>
            <circle cx="15" cy="15" r="4" fill="#4A90D9" />
            <text x="25" y="19" class="legend-text">Neural Tissue</text>
            <circle cx="15" cy="32" r="4" fill="#F39C12" />
            <text x="25" y="36" class="legend-text">Support Tissue</text>
            <circle cx="15" cy="49" r="4" fill="#98D8C8" />
            <text x="25" y="53" class="legend-text">Digestive Tract</text>
            <circle cx="15" cy="66" r="4" fill="#E74C3C" />
            <text x="25" y="70" class="legend-text">Vascular/Respiratory</text>
        </g>

        <!-- Main Organism Group -->
        <g class="fade-in">
            
            <!-- Body Outline (with path morphing for tail wag) -->
            <path id="body-outline" fill="#E8F4FD" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round">
                <animate attributeName="d" 
                    values="
                        M 110,250 C 130,250 140,255 140,265 C 140,275 130,280 110,280 C 150,320 250,340 350,320 C 450,300 480,280 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 C 400,180 300,160 200,170 C 150,175 120,200 110,250 Z;
                        M 110,250 C 130,250 140,255 140,265 C 140,275 130,280 110,280 C 150,320 250,340 350,320 C 450,300 480,280 480,280 C 550,250 650,230 720,220 C 650,210 550,190 480,210 C 400,180 300,160 200,170 C 150,175 120,200 110,250 Z;
                        M 110,250 C 130,250 140,255 140,265 C 140,275 130,280 110,280 C 150,320 250,340 350,320 C 450,300 480,280 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 C 400,180 300,160 200,170 C 150,175 120,200 110,250 Z;
                        M 110,250 C 130,250 140,255 140,265 C 140,275 130,280 110,280 C 150,320 250,340 350,320 C 450,300 480,280 480,280 C 550,290 650,290 720,280 C 650,270 550,230 480,210 C 400,180 300,160 200,170 C 150,175 120,200 110,250 Z;
                        M 110,250 C 130,250 140,255 140,265 C 140,275 130,280 110,280 C 150,320 250,340 350,320 C 450,300 480,280 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 C 400,180 300,160 200,170 C 150,175 120,200 110,250 Z
                    " 
                    dur="3s" repeatCount="indefinite" />
            </path>

            <!-- Digestive Tract (Gut) -->
            <path d="M 140,265 L 180,265 C 220,265 240,280 280,280 L 450,280 C 470,280 480,280 480,280 C 480,285 470,285 450,285 L 280,285 C 240,285 220,300 180,300 L 140,280 Z" fill="#98D8C8" />

            <!-- Circulatory Flow (Ventral Vessel) -->
            <path d="M 160,305 C 250,325 350,315 450,295" fill="none" stroke="#E74C3C" stroke-width="2" />
            <!-- Venous Arrow (Blue) -->
            <path d="M 250,319 L 240,314 L 250,309 Z" fill="#3498DB" />
            <!-- Arterial Arrow (Red) -->
            <path d="M 350,309 L 340,304 L 350,299 Z" fill="#E74C3C" />

            <!-- Pharyngeal Gill Slits -->
            <g class="hl-slits">
                <line x1="150" y1="268" x2="145" y2="290" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
                <line x1="160" y1="268" x2="155" y2="292" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
                <line x1="170" y1="268" x2="165" y2="295" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
                <line x1="180" y1="268" x2="175" y2="298" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
                <line x1="190" y1="268" x2="185" y2="295" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" />
            </g>

            <!-- Notochord -->
            <g>
                <path id="notochord-base" class="grow-path hl-noto" stroke="#F39C12" stroke-width="12" stroke-linecap="round" fill="none" pathLength="100">
                    <animate attributeName="d" 
                        values="
                            M 180,215 C 300,195 450,215 710,248;
                            M 180,215 C 300,195 450,205 710,218;
                            M 180,215 C 300,195 450,215 710,248;
                            M 180,215 C 300,195 450,225 710,278;
                            M 180,215 C 300,195 450,215 710,248
                        " 
                        dur="3s" repeatCount="indefinite" />
                </path>
                <!-- Notochord Texture -->
                <path class="grow-path" stroke="rgba(0,0,0,0.15)" stroke-width="12" stroke-dasharray="2 4" stroke-linecap="round" fill="none" pathLength="100">
                    <animate attributeName="d" 
                        values="
                            M 180,215 C 300,195 450,215 710,248;
                            M 180,215 C 300,195 450,205 710,218;
                            M 180,215 C 300,195 450,215 710,248;
                            M 180,215 C 300,195 450,225 710,278;
                            M 180,215 C 300,195 450,215 710,248
                        " 
                        dur="3s" repeatCount="indefinite" />
                </path>
            </g>

            <!-- Dorsal Hollow Nerve Cord -->
            <g>
                <path id="nerve-cord-base" class="grow-path hl-nerve" stroke="#4A90D9" stroke-width="14" stroke-linecap="round" fill="none" pathLength="100">
                    <animate attributeName="d" 
                        values="
                            M 160,190 C 300,175 450,195 710,242;
                            M 160,190 C 300,175 450,185 710,212;
                            M 160,190 C 300,175 450,195 710,242;
                            M 160,190 C 300,175 450,205 710,272;
                            M 160,190 C 300,175 450,195 710,242
                        " 
                        dur="3s" repeatCount="indefinite" />
                </path>
                <!-- Hollow Inner Core -->
                <path class="grow-path" stroke="#E8F4FD" stroke-width="6" stroke-linecap="round" fill="none" pathLength="100">
                    <animate attributeName="d" 
                        values="
                            M 160,190 C 300,175 450,195 710,242;
                            M 160,190 C 300,175 450,185 710,212;
                            M 160,190 C 300,175 450,195 710,242;
                            M 160,190 C 300,175 450,205 710,272;
                            M 160,190 C 300,175 450,195 710,242
                        " 
                        dur="3s" repeatCount="indefinite" />
                </path>
                <!-- Brain Vesicle -->
                <ellipse cx="150" cy="190" rx="12" ry="8" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4" />
            </g>

            <!-- Eye Spot -->
            <circle cx="135" cy="215" r="3" fill="#2C3E50" />

            <!-- Tail Highlight Overlay (Fades in during highlight phase) -->
            <path class="hl-tail" fill="#F39C12" style="mix-blend-mode: multiply;">
                <animate attributeName="d" 
                    values="
                        M 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 Z;
                        M 480,280 C 550,250 650,230 720,220 C 650,210 550,190 480,210 Z;
                        M 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 Z;
                        M 480,280 C 550,290 650,290 720,280 C 650,270 550,230 480,210 Z;
                        M 480,280 C 550,270 650,260 720,250 C 650,240 550,210 480,210 Z
                    " 
                    dur="3s" repeatCount="indefinite" />
            </path>

            <!-- Neural Pulses (Action Phase) -->
            <g class="pulse-group">
                <circle r="3" fill="#FFFFFF" filter="drop-shadow(0 0 2px #FFF)">
                    <animateMotion dur="2s" repeatCount="indefinite" path="M 160,190 C 300,175 450,195 600,220" />
                </circle>
                <circle r="3" fill="#FFFFFF" filter="drop-shadow(0 0 2px #FFF)">
                    <animateMotion dur="2s" begin="0.66s" repeatCount="indefinite" path="M 160,190 C 300,175 450,195 600,220" />
                </circle>
                <circle r="3" fill="#FFFFFF" filter="drop-shadow(0 0 2px #FFF)">
                    <animateMotion dur="2s" begin="1.33s" repeatCount="indefinite" path="M 160,190 C 300,175 450,195 600,220" />
                </circle>
            </g>

            <!-- Water Flow through Slits (Action Phase) -->
            <g class="water-flow">
                <!-- Flow 1 -->
                <path d="M0,0 L-6,-4 L-6,4 Z" fill="#3498DB">
                    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 110,265 C 130,265 140,270 145,285" />
                    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.5s" repeatCount="indefinite" />
                </path>
                <!-- Flow 2 -->
                <path d="M0,0 L-6,-4 L-6,4 Z" fill="#3498DB">
                    <animateMotion dur="1.5s" begin="0.5s" repeatCount="indefinite" path="M 110,265 C 140,265 160,270 165,290" />
                    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.5s" begin="0.5s" repeatCount="indefinite" />
                </path>
                <!-- Flow 3 -->
                <path d="M0,0 L-6,-4 L-6,4 Z" fill="#3498DB">
                    <animateMotion dur="1.5s" begin="1s" repeatCount="indefinite" path="M 110,265 C 150,265 180,270 185,290" />
                    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1.5s" begin="1s" repeatCount="indefinite" />
                </path>
            </g>
        </g>

        <!-- Labels and Leader Lines -->
        <g class="fade-in">
            <!-- Dorsal Hollow Nerve Cord -->
            <polyline points="250,115 300,115 330,175" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="250" y="105" text-anchor="middle" class="label lbl-nerve">Dorsal Hollow Nerve Cord</text>

            <!-- Notochord -->
            <polyline points="550,115 500,115 450,210" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="550" y="105" text-anchor="middle" class="label lbl-noto">Notochord</text>

            <!-- Pharyngeal Gill Slits -->
            <polyline points="250,415 180,415 170,305" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="250" y="430" text-anchor="middle" class="label lbl-slits">Pharyngeal Gill Slits</text>

            <!-- Post-anal Tail -->
            <polyline points="650,415 650,260" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="650" y="430" text-anchor="middle" class="label lbl-tail">Post-anal Tail</text>

            <!-- Anus -->
            <polyline points="480,365 480,290" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="480" y="380" text-anchor="middle" class="label">Anus</text>
        </g>

    </svg>
</div>

</body>
</html>
