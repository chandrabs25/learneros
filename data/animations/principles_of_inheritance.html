<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cellular Basis of Inheritance: Mitosis</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animations */
        .cell-membrane {
            animation: cellDivide 15s infinite ease-in-out;
        }

        .daughter-cell {
            animation: daughterCells 15s infinite ease-in-out;
        }

        .nucleus-parent {
            animation: nucleusParent 15s infinite ease-in-out;
        }

        .nucleus-daughter {
            animation: nucleusDaughter 15s infinite ease-in-out;
        }

        .chrom-1 { animation: chrom1 15s infinite ease-in-out; }
        .chrom-2 { animation: chrom2 15s infinite ease-in-out; }
        .chrom-3 { animation: chrom3 15s infinite ease-in-out; }
        .chrom-4 { animation: chrom4 15s infinite ease-in-out; }

        .chromatid-left { animation: splitLeft 15s infinite ease-in-out; }
        .chromatid-right { animation: splitRight 15s infinite ease-in-out; }

        .centriole-left { animation: centrioleLeft 15s infinite ease-in-out; }
        .centriole-right { animation: centrioleRight 15s infinite ease-in-out; }

        .spindle-left {
            transform-origin: 150px 250px;
            animation: spindleLeft 15s infinite ease-in-out;
        }
        .spindle-right {
            transform-origin: 650px 250px;
            animation: spindleRight 15s infinite ease-in-out;
        }

        .text-stage {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            fill: #2C3E50;
            text-anchor: middle;
        }

        .text1 { animation: text1 15s infinite; }
        .text2 { animation: text2 15s infinite; }
        .text3 { animation: text3 15s infinite; }
        .text4 { animation: text4 15s infinite; }
        .text5 { animation: text5 15s infinite; }

        /* Keyframes */
        @keyframes cellDivide {
            0%, 20% { d: path('M 400 100 C 482.8 100 550 167.2 550 250 C 550 332.8 482.8 400 400 400 C 317.2 400 250 332.8 250 250 C 250 167.2 317.2 100 400 100 Z'); opacity: 1; }
            30%, 40% { d: path('M 400 100 C 550 100 650 167.2 650 250 C 650 332.8 550 400 400 400 C 250 400 150 332.8 150 250 C 150 167.2 250 100 400 100 Z'); opacity: 1; }
            50%, 60% { d: path('M 400 220 C 550 100 650 167.2 650 250 C 650 332.8 550 400 400 280 C 250 400 150 332.8 150 250 C 150 167.2 250 100 400 220 Z'); opacity: 1; }
            64% { d: path('M 400 220 C 550 100 650 167.2 650 250 C 650 332.8 550 400 400 280 C 250 400 150 332.8 150 250 C 150 167.2 250 100 400 220 Z'); opacity: 1; }
            66%, 95% { d: path('M 400 220 C 550 100 650 167.2 650 250 C 650 332.8 550 400 400 280 C 250 400 150 332.8 150 250 C 150 167.2 250 100 400 220 Z'); opacity: 0; }
            100% { d: path('M 400 100 C 482.8 100 550 167.2 550 250 C 550 332.8 482.8 400 400 400 C 317.2 400 250 332.8 250 250 C 250 167.2 317.2 100 400 100 Z'); opacity: 1; }
        }

        @keyframes daughterCells {
            0%, 64% { opacity: 0; transform: scale(0.9); transform-origin: center; }
            66%, 90% { opacity: 1; transform: scale(1); transform-origin: center; }
            95%, 100% { opacity: 0; transform: scale(0.9); transform-origin: center; }
        }

        @keyframes nucleusParent {
            0%, 5% { opacity: 1; }
            15%, 100% { opacity: 0; }
        }

        @keyframes nucleusDaughter {
            0%, 64% { opacity: 0; }
            66%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes chrom1 {
            0%, 5% { opacity: 0; transform: translate(360px, 190px) rotate(-30deg); }
            10%, 20% { opacity: 1; transform: translate(360px, 190px) rotate(-30deg); }
            30%, 85% { opacity: 1; transform: translate(400px, 160px) rotate(0deg); }
            90%, 100% { opacity: 0; transform: translate(400px, 160px) rotate(0deg); }
        }
        @keyframes chrom2 {
            0%, 5% { opacity: 0; transform: translate(440px, 200px) rotate(45deg); }
            10%, 20% { opacity: 1; transform: translate(440px, 200px) rotate(45deg); }
            30%, 85% { opacity: 1; transform: translate(400px, 220px) rotate(0deg); }
            90%, 100% { opacity: 0; transform: translate(400px, 220px) rotate(0deg); }
        }
        @keyframes chrom3 {
            0%, 5% { opacity: 0; transform: translate(370px, 290px) rotate(15deg) scale(0.7); }
            10%, 20% { opacity: 1; transform: translate(370px, 290px) rotate(15deg) scale(0.7); }
            30%, 85% { opacity: 1; transform: translate(400px, 280px) rotate(0deg) scale(0.7); }
            90%, 100% { opacity: 0; transform: translate(400px, 280px) rotate(0deg) scale(0.7); }
        }
        @keyframes chrom4 {
            0%, 5% { opacity: 0; transform: translate(430px, 310px) rotate(-60deg) scale(0.7); }
            10%, 20% { opacity: 1; transform: translate(430px, 310px) rotate(-60deg) scale(0.7); }
            30%, 85% { opacity: 1; transform: translate(400px, 340px) rotate(0deg) scale(0.7); }
            90%, 100% { opacity: 0; transform: translate(400px, 340px) rotate(0deg) scale(0.7); }
        }

        @keyframes splitLeft {
            0%, 40% { transform: translateX(0); }
            50%, 90% { transform: translateX(-150px); }
            95%, 100% { transform: translateX(0); }
        }
        @keyframes splitRight {
            0%, 40% { transform: translateX(0); }
            50%, 90% { transform: translateX(150px); }
            95%, 100% { transform: translateX(0); }
        }

        @keyframes centrioleLeft {
            0%, 5% { opacity: 0; transform: translate(350px, 200px); }
            10%, 15% { opacity: 1; transform: translate(350px, 200px); }
            25%, 70% { opacity: 1; transform: translate(150px, 250px); }
            75%, 100% { opacity: 0; transform: translate(150px, 250px); }
        }
        @keyframes centrioleRight {
            0%, 5% { opacity: 0; transform: translate(450px, 300px); }
            10%, 15% { opacity: 1; transform: translate(450px, 300px); }
            25%, 70% { opacity: 1; transform: translate(650px, 250px); }
            75%, 100% { opacity: 0; transform: translate(650px, 250px); }
        }

        @keyframes spindleLeft {
            0%, 25% { opacity: 0; transform: scaleX(0); }
            30%, 40% { opacity: 1; transform: scaleX(1); }
            50%, 60% { opacity: 1; transform: scaleX(0.4); }
            65%, 100% { opacity: 0; transform: scaleX(0); }
        }
        @keyframes spindleRight {
            0%, 25% { opacity: 0; transform: scaleX(0); }
            30%, 40% { opacity: 1; transform: scaleX(1); }
            50%, 60% { opacity: 1; transform: scaleX(0.4); }
            65%, 100% { opacity: 0; transform: scaleX(0); }
        }

        @keyframes text1 { 0%, 18% { opacity: 1; } 20%, 100% { opacity: 0; } }
        @keyframes text2 { 0%, 18% { opacity: 0; } 20%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }
        @keyframes text3 { 0%, 38% { opacity: 0; } 40%, 58% { opacity: 1; } 60%, 100% { opacity: 0; } }
        @keyframes text4 { 0%, 58% { opacity: 0; } 60%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
        @keyframes text5 { 0%, 78% { opacity: 0; } 80%, 98% { opacity: 1; } 100% { opacity: 0; } }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">The Cellular Basis of Inheritance: Mitosis and DNA Distribution</title>
    <desc id="svg-desc">An animated diagram showing the stages of mitosis: Prophase, Metaphase, Anaphase, and Telophase, demonstrating how a parent cell divides to form two genetically identical daughter cells.</desc>

    <defs>
        <!-- Cytoplasm Gradient -->
        <radialGradient id="cytoGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E8F4FD" />
        </radialGradient>

        <!-- Chromosome Templates -->
        <g id="chrom-maternal">
            <g class="chromatid-left">
                <!-- Left arm (Apex points left, arms point right) -->
                <path d="M 10,-25 Q -5,0 10,25" fill="none" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round" />
                <path d="M 10,-25 Q -5,0 10,25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
                <circle cx="-3" cy="0" r="4" fill="#F39C12" />
            </g>
            <g class="chromatid-right">
                <!-- Right arm (Apex points right, arms point left) -->
                <path d="M -10,-25 Q 5,0 -10,25" fill="none" stroke="#FF6B6B" stroke-width="10" stroke-linecap="round" />
                <path d="M -10,-25 Q 5,0 -10,25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
                <circle cx="3" cy="0" r="4" fill="#F39C12" />
            </g>
        </g>

        <g id="chrom-paternal">
            <g class="chromatid-left">
                <path d="M 10,-25 Q -5,0 10,25" fill="none" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" />
                <path d="M 10,-25 Q -5,0 10,25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
                <circle cx="-3" cy="0" r="4" fill="#F39C12" />
            </g>
            <g class="chromatid-right">
                <path d="M -10,-25 Q 5,0 -10,25" fill="none" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" />
                <path d="M -10,-25 Q 5,0 -10,25" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="3 3" opacity="0.8" />
                <circle cx="3" cy="0" r="4" fill="#F39C12" />
            </g>
        </g>

        <!-- Centriole Template -->
        <g id="centriole-struct">
            <rect x="-6" y="-6" width="4" height="12" fill="#98D8C8" stroke="#16A085" stroke-width="1" />
            <rect x="-2" y="-2" width="12" height="4" fill="#98D8C8" stroke="#16A085" stroke-width="1" />
        </g>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- Titles -->
    <text x="400" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#2C3E50">Principles of Inheritance: Equational Division (Mitosis)</text>
    <text x="400" y="65" font-size="14" font-weight="400" text-anchor="middle" fill="#7F8C8D">Ensuring identical genetic distribution to daughter cells (2n = 4)</text>

    <!-- Legend -->
    <g transform="translate(610, 20)">
        <rect width="170" height="110" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" />
        <text x="85" y="20" font-size="12" font-weight="600" text-anchor="middle" fill="#2C3E50">Key</text>
        
        <line x1="15" y1="35" x2="35" y2="35" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" />
        <text x="45" y="39" font-size="11" fill="#2C3E50">Maternal Chromosome</text>
        
        <line x1="15" y1="55" x2="35" y2="55" stroke="#4A90D9" stroke-width="4" stroke-linecap="round" />
        <text x="45" y="59" font-size="11" fill="#2C3E50">Paternal Chromosome</text>
        
        <circle cx="25" cy="75" r="4" fill="#F39C12" />
        <text x="45" y="79" font-size="11" fill="#2C3E50">Centromere</text>
        
        <line x1="15" y1="95" x2="35" y2="95" stroke="#98D8C8" stroke-width="2" stroke-dasharray="2 2" />
        <text x="45" y="99" font-size="11" fill="#2C3E50">Spindle Fiber</text>
    </g>

    <!-- Main Cell Group -->
    <g id="cell-container">
        
        <!-- Daughter Cells (Visible in Telophase/Reset) -->
        <circle cx="250" cy="250" r="140" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="6" class="daughter-cell" />
        <circle cx="550" cy="250" r="140" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="6" class="daughter-cell" />

        <!-- Parent Cell Membrane (Morphs and fades) -->
        <path class="cell-membrane" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="6" />

        <!-- Daughter Nuclei -->
        <circle cx="250" cy="250" r="90" fill="rgba(44, 62, 80, 0.05)" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6 4" class="nucleus-daughter" />
        <circle cx="550" cy="250" r="90" fill="rgba(44, 62, 80, 0.05)" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6 4" class="nucleus-daughter" />

        <!-- Parent Nucleus -->
        <circle cx="400" cy="250" r="100" fill="rgba(44, 62, 80, 0.05)" stroke="#2C3E50" stroke-width="2" stroke-dasharray="8 4" class="nucleus-parent" />

        <!-- Spindle Fibers Left -->
        <g class="spindle-left" stroke="#98D8C8" stroke-width="2" stroke-dasharray="4 4">
            <line x1="150" y1="250" x2="400" y2="160" />
            <line x1="150" y1="250" x2="400" y2="220" />
            <line x1="150" y1="250" x2="400" y2="280" />
            <line x1="150" y1="250" x2="400" y2="340" />
        </g>

        <!-- Spindle Fibers Right -->
        <g class="spindle-right" stroke="#98D8C8" stroke-width="2" stroke-dasharray="4 4">
            <line x1="650" y1="250" x2="400" y2="160" />
            <line x1="650" y1="250" x2="400" y2="220" />
            <line x1="650" y1="250" x2="400" y2="280" />
            <line x1="650" y1="250" x2="400" y2="340" />
        </g>

        <!-- Centrioles -->
        <use href="#centriole-struct" class="centriole-left" />
        <use href="#centriole-struct" class="centriole-right" />

        <!-- Chromosomes -->
        <!-- Pair 1: Large Maternal -->
        <g class="chrom-1">
            <use href="#chrom-maternal" />
        </g>
        
        <!-- Pair 1: Large Paternal -->
        <g class="chrom-2">
            <use href="#chrom-paternal" />
        </g>

        <!-- Pair 2: Small Maternal -->
        <g class="chrom-3">
            <use href="#chrom-maternal" />
        </g>

        <!-- Pair 2: Small Paternal -->
        <g class="chrom-4">
            <use href="#chrom-paternal" />
        </g>

    </g>

    <!-- Dynamic Stage Labels Box -->
    <rect x="150" y="420" width="500" height="50" rx="8" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" />
    
    <text x="400" y="450" class="text-stage text1">
        <tspan font-weight="700">PROPHASE:</tspan> Chromatin condenses into visible chromosomes.
    </text>
    <text x="400" y="450" class="text-stage text2">
        <tspan font-weight="700">METAPHASE:</tspan> Chromosomes align at the equatorial plate.
    </text>
    <text x="400" y="450" class="text-stage text3">
        <tspan font-weight="700">ANAPHASE:</tspan> Sister chromatids separate toward opposite poles.
    </text>
    <text x="400" y="450" class="text-stage text4">
        <tspan font-weight="700">TELOPHASE &amp; CYTOKINESIS:</tspan> Two identical daughter cells form.
    </text>
    <text x="400" y="450" class="text-stage text5">
        <tspan font-weight="700">INTERPHASE:</tspan> Cells prepare for the next division.
    </text>

</svg>

</body>
</html>
