<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Regulation of Respiration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            display: block;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; text-anchor: middle; }
        .label { font-size: 12px; fill: #2C3E50; }
        .label-bold { font-size: 12px; font-weight: 600; fill: #2C3E50; }
        .chem-text { font-family: 'Roboto Mono', monospace; font-size: 9px; fill: #ffffff; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
        .callout { font-size: 13px; font-weight: 600; fill: #E74C3C; }
        .callout-green { fill: #27AE60; }

        /* Animations */
        @keyframes lung-breathe {
            0% { transform: scale(1); }
            13.3% { transform: scale(1.1); }
            26.6% { transform: scale(1); }
            38.3% { transform: scale(1.1); }
            50% { transform: scale(1); }
            56.6% { transform: scale(1.18); }
            63.3% { transform: scale(1); }
            70% { transform: scale(1.18); }
            76.6% { transform: scale(1); }
            83.3% { transform: scale(1.18); }
            90% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @keyframes diaphragm-move {
            0% { transform: scaleY(1); }
            13.3% { transform: scaleY(0.5); }
            26.6% { transform: scaleY(1); }
            38.3% { transform: scaleY(0.5); }
            50% { transform: scaleY(1); }
            56.6% { transform: scaleY(0.2); }
            63.3% { transform: scaleY(1); }
            70% { transform: scaleY(0.2); }
            76.6% { transform: scaleY(1); }
            83.3% { transform: scaleY(0.2); }
            90% { transform: scaleY(1); }
            100% { transform: scaleY(1); }
        }

        @keyframes co2-build {
            0%, 26% { opacity: 0; transform: translateY(5px); }
            40%, 70% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-5px); }
        }

        @keyframes chemo-glow {
            0%, 26% { filter: drop-shadow(0 0 0px rgba(255,107,107,0)); fill: #FFB3B3; }
            40%, 70% { filter: drop-shadow(0 0 12px rgba(255,107,107,1)); fill: #FF6B6B; }
            90%, 100% { filter: drop-shadow(0 0 0px rgba(255,107,107,0)); fill: #FFB3B3; }
        }

        @keyframes sensory-flow {
            0%, 39% { stroke-dashoffset: 100; opacity: 0; }
            40% { opacity: 1; }
            70% { stroke-dashoffset: -50; opacity: 1; }
            71%, 100% { stroke-dashoffset: -50; opacity: 0; }
        }

        @keyframes pons-flow {
            0%, 39% { stroke-dashoffset: 50; opacity: 0; }
            40% { opacity: 1; }
            70% { stroke-dashoffset: -25; opacity: 1; }
            71%, 100% { stroke-dashoffset: -25; opacity: 0; }
        }

        @keyframes motor-flow {
            0% { stroke-dashoffset: 300; }
            50% { stroke-dashoffset: 150; }
            90% { stroke-dashoffset: -50; }
            100% { stroke-dashoffset: -80; }
        }

        @keyframes callout-pons {
            0%, 39% { opacity: 0; transform: translateX(-5px); }
            42%, 68% { opacity: 1; transform: translateX(0); }
            71%, 100% { opacity: 0; transform: translateX(5px); }
        }

        @keyframes callout-lungs {
            0%, 49% { opacity: 0; transform: translateY(5px); }
            52%, 88% { opacity: 1; transform: translateY(0); }
            91%, 100% { opacity: 0; transform: translateY(-5px); }
        }

        @keyframes co2-puff1 {
            0%, 56% { opacity: 0; transform: translateY(0) scale(0.8); }
            60% { opacity: 1; transform: translateY(-30px) scale(1.1); }
            64%, 100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        @keyframes co2-puff2 {
            0%, 69% { opacity: 0; transform: translateY(0) scale(0.8); }
            73% { opacity: 1; transform: translateY(-30px) scale(1.1); }
            77%, 100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        @keyframes co2-puff3 {
            0%, 82% { opacity: 0; transform: translateY(0) scale(0.8); }
            86% { opacity: 1; transform: translateY(-30px) scale(1.1); }
            91%, 100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        /* Application of Animations */
        .lung-group { animation: lung-breathe 15s infinite linear; transform-origin: 600px 220px; }
        .diaphragm { animation: diaphragm-move 15s infinite linear; transform-origin: 600px 350px; }
        .co2-cluster { animation: co2-build 15s infinite linear; }
        .chemo-area { animation: chemo-glow 15s infinite linear; }
        .sensory-nerve-spark { animation: sensory-flow 15s infinite linear; stroke-dasharray: 8, 8; }
        .pons-nerve-spark { animation: pons-flow 15s infinite linear; stroke-dasharray: 6, 6; }
        .motor-nerve-spark { animation: motor-flow 15s infinite linear; stroke-dasharray: 12, 12; }
        .callout-pons-anim { animation: callout-pons 15s infinite linear; }
        .callout-lungs-anim { animation: callout-lungs 15s infinite linear; }
        .puff-1 { animation: co2-puff1 15s infinite linear; }
        .puff-2 { animation: co2-puff2 15s infinite linear; }
        .puff-3 { animation: co2-puff3 15s infinite linear; }

        .vector-effect { vector-effect: non-scaling-stroke; }
    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow-sensory" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#3498DB" />
            </marker>
            <marker id="arrow-inhibitory" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C" />
            </marker>
            <marker id="arrow-motor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#27AE60" />
            </marker>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Titles -->
        <text x="400" y="35" class="title">Neural Control of Respiratory Rhythm</text>
        <text x="400" y="55" class="subtitle">Feedback mechanism maintaining homeostasis of CO₂ and H⁺</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect x="0" y="0" width="160" height="135" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="6" />
            <text x="10" y="20" class="label-bold">Legend</text>
            
            <circle cx="15" cy="40" r="5" fill="#F39C12"/>
            <text x="30" y="44" class="label">Pneumotaxic Center</text>
            
            <circle cx="15" cy="60" r="5" fill="#98D8C8"/>
            <text x="30" y="64" class="label">Rhythm Center</text>
            
            <line x1="10" y1="80" x2="25" y2="80" stroke="#3498DB" stroke-width="2" stroke-dasharray="4,4"/>
            <text x="30" y="84" class="label">Sensory Signal</text>
            
            <line x1="10" y1="100" x2="25" y2="100" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,4"/>
            <text x="30" y="104" class="label">Inhibitory Signal</text>
            
            <line x1="10" y1="120" x2="25" y2="120" stroke="#27AE60" stroke-width="2" stroke-dasharray="4,4"/>
            <text x="30" y="124" class="label">Motor Signal</text>
        </g>

        <!-- Nerve Pathways (Base Paths) -->
        <g class="vector-effect">
            <!-- Sensory: Aorta to Medulla -->
            <path d="M 315 385 C 350 300, 250 280, 215 255" fill="none" stroke="#3498DB" stroke-width="2" opacity="0.2" marker-end="url(#arrow-sensory)"/>
            <!-- Inhibitory: Pons to Medulla -->
            <path d="M 195 185 L 195 225" fill="none" stroke="#E74C3C" stroke-width="2" opacity="0.2" marker-end="url(#arrow-inhibitory)"/>
            <!-- Motor: Medulla to Diaphragm -->
            <path d="M 185 263 C 185 380, 400 380, 530 350" fill="none" stroke="#27AE60" stroke-width="2" opacity="0.2" marker-end="url(#arrow-motor)"/>
        </g>

        <!-- Nerve Pathways (Animated Sparks) -->
        <g class="vector-effect">
            <path d="M 315 385 C 350 300, 250 280, 215 255" fill="none" stroke="#3498DB" stroke-width="3" class="sensory-nerve-spark"/>
            <path d="M 195 185 L 195 225" fill="none" stroke="#E74C3C" stroke-width="3" class="pons-nerve-spark"/>
            <path d="M 185 263 C 185 380, 400 380, 530 350" fill="none" stroke="#27AE60" stroke-width="3" class="motor-nerve-spark"/>
        </g>

        <!-- Brainstem -->
        <g>
            <!-- Brainstem Outline -->
            <path d="M 140 110 
                     C 140 110, 190 110, 190 140 
                     C 190 160, 210 170, 210 190 
                     C 210 200, 190 210, 190 230 
                     C 190 250, 205 260, 205 280 
                     C 205 310, 160 330, 160 350 
                     L 120 350 L 120 110 Z" 
                  fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            
            <!-- Pons (Pneumotaxic Center) -->
            <ellipse cx="195" cy="165" rx="12" ry="20" fill="#F39C12" />
            
            <!-- Medulla (Respiratory Rhythm Center) -->
            <ellipse cx="185" cy="245" rx="10" ry="18" fill="#98D8C8" />
            
            <!-- Chemosensitive Area -->
            <ellipse cx="205" cy="245" rx="6" ry="14" class="chemo-area" />

            <!-- Brainstem Labels -->
            <polyline points="207,165 260,165" fill="none" stroke="#BDC3C7" stroke-width="1"/>
            <text x="265" y="169" class="label-bold">Pons</text>
            <text x="265" y="183" class="label">(Pneumotaxic Center)</text>

            <polyline points="195,245 260,280" fill="none" stroke="#BDC3C7" stroke-width="1"/>
            <text x="265" y="284" class="label-bold">Medulla</text>
            <text x="265" y="298" class="label">(Respiratory Rhythm Center)</text>

            <polyline points="211,245 260,245" fill="none" stroke="#BDC3C7" stroke-width="1"/>
            <text x="265" y="240" class="label-bold" fill="#E74C3C">Chemosensitive Area</text>
            <text x="265" y="254" class="label">(Highly sensitive to CO₂ & H⁺)</text>
        </g>

        <!-- Peripheral Receptors -->
        <g>
            <!-- Aortic Arch -->
            <path d="M 250 460 C 250 390, 350 390, 350 460" fill="none" stroke="#E74C3C" stroke-width="16" stroke-linecap="round"/>
            <!-- Carotid Artery -->
            <path d="M 280 405 C 280 360, 260 340, 260 310" fill="none" stroke="#E74C3C" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Receptor Nodes -->
            <circle cx="280" cy="405" r="5" fill="#2C3E50"/>
            <circle cx="315" cy="395" r="5" fill="#2C3E50"/>
            <circle cx="260" cy="340" r="5" fill="#2C3E50"/>

            <!-- Receptor Labels -->
            <polyline points="250,460 180,460" fill="none" stroke="#BDC3C7" stroke-width="1"/>
            <text x="175" y="455" class="label-bold" text-anchor="end">Aortic Arch &</text>
            <text x="175" y="469" class="label-bold" text-anchor="end">Carotid Receptors</text>
            <text x="175" y="483" class="label" text-anchor="end">(Detect changes in CO₂/H⁺)</text>
        </g>

        <!-- Lungs and Effector Organs -->
        <g>
            <!-- Trachea & Bronchi -->
            <path d="M 600 120 L 600 180" fill="none" stroke="#E67E22" stroke-width="12" stroke-linecap="round"/>
            <path d="M 600 180 L 560 210 M 600 180 L 640 210" fill="none" stroke="#E67E22" stroke-width="10" stroke-linecap="round"/>
            
            <!-- Lungs (Animated Group) -->
            <g class="lung-group">
                <!-- Left Lung -->
                <path d="M 560 200 C 510 180, 470 250, 490 330 C 500 360, 570 360, 580 310 C 590 260, 570 220, 560 200 Z" fill="#F39C12" opacity="0.3" stroke="#E67E22" stroke-width="2"/>
                <!-- Right Lung -->
                <path d="M 640 200 C 690 180, 730 250, 710 330 C 700 360, 630 360, 620 310 C 610 260, 630 220, 640 200 Z" fill="#F39C12" opacity="0.3" stroke="#E67E22" stroke-width="2"/>
            </g>

            <!-- Diaphragm (Animated) -->
            <path d="M 470 350 Q 600 300 730 350" fill="none" stroke="#4A90D9" stroke-width="8" stroke-linecap="round" class="diaphragm"/>

            <!-- Effector Labels -->
            <polyline points="720,350 750,350" fill="none" stroke="#BDC3C7" stroke-width="1"/>
            <text x="755" y="345" class="label-bold">Diaphragm &</text>
            <text x="755" y="359" class="label-bold">Intercostal Muscles</text>
            <text x="755" y="373" class="label">(Effectors)</text>
        </g>

        <!-- CO2 and H+ Molecules (Accumulation Phase) -->
        <g class="co2-cluster">
            <!-- Near Chemosensitive Area -->
            <g transform="translate(225, 220)">
                <circle cx="0" cy="0" r="10" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">CO₂</text>
            </g>
            <g transform="translate(245, 240)">
                <circle cx="0" cy="0" r="8" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">H⁺</text>
            </g>
            <g transform="translate(230, 265)">
                <circle cx="0" cy="0" r="10" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">CO₂</text>
            </g>

            <!-- Near Aortic Arch -->
            <g transform="translate(340, 420)">
                <circle cx="0" cy="0" r="10" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">CO₂</text>
            </g>
            <g transform="translate(300, 440)">
                <circle cx="0" cy="0" r="8" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">H⁺</text>
            </g>
            <g transform="translate(320, 455)">
                <circle cx="0" cy="0" r="10" fill="#FF6B6B"/><text x="0" y="0" class="chem-text">CO₂</text>
            </g>
        </g>

        <!-- Exhaled CO2 (Compensatory Phase) -->
        <g>
            <g class="puff-1" transform="translate(600, 100)">
                <circle cx="-15" cy="0" r="12" fill="#FF6B6B"/><text x="-15" y="0" class="chem-text">CO₂</text>
                <circle cx="15" cy="-10" r="12" fill="#FF6B6B"/><text x="15" y="-10" class="chem-text">CO₂</text>
            </g>
            <g class="puff-2" transform="translate(600, 100)">
                <circle cx="0" cy="-5" r="12" fill="#FF6B6B"/><text x="0" y="-5" class="chem-text">CO₂</text>
                <circle cx="-20" cy="-15" r="12" fill="#FF6B6B"/><text x="-20" y="-15" class="chem-text">CO₂</text>
            </g>
            <g class="puff-3" transform="translate(600, 100)">
                <circle cx="10" cy="0" r="12" fill="#FF6B6B"/><text x="10" y="0" class="chem-text">CO₂</text>
                <circle cx="-10" cy="-20" r="12" fill="#FF6B6B"/><text x="-10" y="-20" class="chem-text">CO₂</text>
            </g>
        </g>

        <!-- Dynamic Callouts -->
        <g class="callout-pons-anim">
            <rect x="260" y="105" width="240" height="26" fill="#FDF2E9" stroke="#F39C12" stroke-width="1" rx="4"/>
            <text x="380" y="123" class="callout" text-anchor="middle">Signal to reduce duration of inspiration</text>
        </g>

        <g class="callout-lungs-anim">
            <rect x="470" y="405" width="260" height="26" fill="#EAFBF1" stroke="#27AE60" stroke-width="1" rx="4"/>
            <text x="600" y="423" class="callout callout-green" text-anchor="middle">Increased Respiratory Rate (CO₂ Expelled)</text>
        </g>

    </svg>
</div>

</body>
</html>
