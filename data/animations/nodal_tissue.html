<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cardiac Conduction System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        :root {
            --bg-color: #f8f9fa;
            --heart-wall: #F39C12;
            --chamber-line: #2C3E50;
            --nodal-color: #FFD700;
            --arterial: #E74C3C;
            --venous: #3498DB;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: var(--text-main); text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: var(--text-muted); text-anchor: middle; }
        .label { font-size: 13px; font-weight: 600; fill: var(--text-main); }
        .label-sub { font-size: 11px; font-family: 'Roboto Mono', monospace; fill: var(--text-muted); }
        .process-text { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 500; fill: var(--text-main); }
        .legend-text { font-size: 12px; fill: var(--text-main); }

        /* Animations */
        /* 4 seconds total loop */
        
        /* Phase 1: SA Node Fires (0% - 25%) */
        @keyframes sa-pulse {
            0% { transform: scale(1); filter: brightness(1); }
            2% { transform: scale(1.6); filter: brightness(1.5); fill: #FFF; }
            10% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1); }
        }

        @keyframes internodal-spark {
            0%, 2% { stroke-dashoffset: 95; opacity: 0; }
            3% { opacity: 1; }
            15% { stroke-dashoffset: 0; opacity: 1; }
            16% { opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes atrial-squeeze {
            0%, 25%, 100% { transform: scale(1); }
            10% { transform: scale(0.96, 0.92); }
        }

        /* Phase 2: AV Delay (25% - 32.5%) */
        @keyframes av-pulse {
            0%, 15% { transform: scale(1); filter: brightness(1); }
            17% { transform: scale(1.5); filter: brightness(1.5); fill: #FFF; }
            32% { transform: scale(1.5); filter: brightness(1.5); fill: #FFF; } /* The Delay */
            35% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1); }
        }

        /* Phase 3: Ventricular Conduction (32.5% - 45%) */
        @keyframes purkinje-spark {
            0%, 32% { stroke-dashoffset: 280; opacity: 0; }
            33% { opacity: 1; }
            45% { stroke-dashoffset: 0; opacity: 1; }
            46% { opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Phase 4: Ventricular Systole (45% - 62.5%) */
        @keyframes ventricular-squeeze {
            0%, 45%, 65%, 100% { transform: scale(1); }
            52% { transform: scale(0.92, 0.85); } /* Squeezes inward and pulls apex upward */
        }

        @keyframes blood-flow {
            0%, 45%, 65%, 100% { opacity: 0; transform: translateY(15px); }
            50% { opacity: 1; transform: translateY(-25px); }
            60% { opacity: 0; transform: translateY(-45px); }
        }

        /* Process Box Text Fades */
        @keyframes step-1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes step-2 { 0%, 24% { opacity: 0; } 25%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
        @keyframes step-3 { 0%, 34% { opacity: 0; } 35%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
        @keyframes step-4 { 0%, 44% { opacity: 0; } 45%, 64% { opacity: 1; } 65%, 100% { opacity: 0; } }
        @keyframes step-5 { 0%, 64% { opacity: 0; } 65%, 100% { opacity: 1; } }

        /* Applying Animations */
        #sa-node { animation: sa-pulse 4s infinite cubic-bezier(0.25, 0.1, 0.25, 1); transform-origin: 335px 185px; }
        #av-node { animation: av-pulse 4s infinite cubic-bezier(0.25, 0.1, 0.25, 1); transform-origin: 380px 240px; }
        .internodal-spark { animation: internodal-spark 4s infinite linear; }
        .purkinje-spark { animation: purkinje-spark 4s infinite linear; }
        #atria { animation: atrial-squeeze 4s infinite ease-in-out; transform-origin: 400px 210px; }
        #ventricles { animation: ventricular-squeeze 4s infinite ease-in-out; transform-origin: 400px 260px; }
        .blood-arrow { animation: blood-flow 4s infinite ease-out; }
        
        #text-step-1 { animation: step-1 4s infinite; }
        #text-step-2 { animation: step-2 4s infinite; }
        #text-step-3 { animation: step-3 4s infinite; }
        #text-step-4 { animation: step-4 4s infinite; }
        #text-step-5 { animation: step-5 4s infinite; }

    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">The Cardiac Conduction System</title>
        <desc id="svg-desc">Animated diagram showing the myogenic regulation of the heart via nodal tissue, including the SA node, AV node, Bundle of His, and Purkinje fibers.</desc>

        <defs>
            <!-- Glow Filter for Sparks -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrowheads for Blood Flow -->
            <marker id="arrow-venous" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--venous)" />
            </marker>
            <marker id="arrow-arterial" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--arterial)" />
            </marker>
            
            <!-- Leader Line Dot -->
            <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
                <circle cx="5" cy="5" r="3" fill="var(--text-muted)" />
            </marker>
        </defs>

        <!-- TITLE -->
        <text x="400" y="40" class="title">The Cardiac Conduction System</text>
        <text x="400" y="60" class="subtitle">Myogenic Regulation via Nodal Tissue</text>

        <!-- HEART CHASSIS (Background / Static Elements) -->
        <g id="heart-chassis">
            <!-- Outer Heart Muscle Wall (Animal Tissue) -->
            <path d="M 400,160 C 340,160 290,200 300,280 C 310,360 360,420 400,440 C 440,420 490,360 500,280 C 510,200 460,160 400,160 Z" 
                  fill="var(--heart-wall)" fill-opacity="0.15" stroke="var(--heart-wall)" stroke-width="12" stroke-opacity="0.4" stroke-linejoin="round" />
            
            <!-- Septum Base -->
            <path d="M 400,160 L 400,430" stroke="var(--heart-wall)" stroke-width="16" stroke-opacity="0.3" stroke-linecap="round" />

            <!-- Superior Vena Cava & Aorta Outlines -->
            <path d="M 330,170 L 330,100 M 370,170 L 370,100" stroke="var(--chamber-line)" stroke-width="2" fill="none" opacity="0.5" />
            <path d="M 430,170 L 430,100 M 470,170 L 470,100" stroke="var(--chamber-line)" stroke-width="2" fill="none" opacity="0.5" />
        </g>

        <!-- ATRIA (Animated) -->
        <g id="atria">
            <!-- Right Atrium Outline -->
            <path d="M 390,170 C 340,170 320,210 320,250 L 390,250 Z" fill="none" stroke="var(--chamber-line)" stroke-width="2" stroke-linejoin="round" />
            <!-- Left Atrium Outline -->
            <path d="M 410,170 C 460,170 480,210 480,250 L 410,250 Z" fill="none" stroke="var(--chamber-line)" stroke-width="2" stroke-linejoin="round" />
            <!-- Tricuspid & Bicuspid Valves (Closed state base) -->
            <line x1="320" y1="250" x2="390" y2="250" stroke="var(--chamber-line)" stroke-width="3" stroke-dasharray="6 4" />
            <line x1="410" y1="250" x2="480" y2="250" stroke="var(--chamber-line)" stroke-width="3" stroke-dasharray="6 4" />
        </g>

        <!-- VENTRICLES (Animated) -->
        <g id="ventricles">
            <!-- Right Ventricle Outline -->
            <path d="M 390,250 L 320,250 C 320,320 360,390 390,410 Z" fill="none" stroke="var(--chamber-line)" stroke-width="2" stroke-linejoin="round" />
            <!-- Left Ventricle Outline -->
            <path d="M 410,250 L 480,250 C 480,320 440,390 410,410 Z" fill="none" stroke="var(--chamber-line)" stroke-width="2" stroke-linejoin="round" />
        </g>

        <!-- NODAL SYSTEM (Wiring) -->
        <g id="nodal-system">
            <!-- Base Pathways (Always visible, low opacity) -->
            <!-- Internodal Pathways -->
            <path d="M 335,185 C 350,200 370,220 380,240" fill="none" stroke="var(--nodal-color)" stroke-width="2" opacity="0.3" />
            <path d="M 335,185 C 340,210 360,230 380,240" fill="none" stroke="var(--nodal-color)" stroke-width="2" opacity="0.3" />
            <!-- Bundle of His & Right Bundle Branch & Purkinje -->
            <path d="M 380,240 C 390,250 400,260 400,280 L 400,320 C 390,350 380,390 370,400 C 350,400 330,380 325,330" fill="none" stroke="var(--nodal-color)" stroke-width="2.5" opacity="0.4" />
            <!-- Left Bundle Branch & Purkinje -->
            <path d="M 380,240 C 390,250 400,260 400,280 L 400,320 C 410,350 420,390 430,400 C 450,400 470,380 475,330" fill="none" stroke="var(--nodal-color)" stroke-width="2.5" opacity="0.4" />
            
            <!-- Small Purkinje Branches -->
            <path d="M 345,385 L 335,375 M 330,350 L 320,340 M 455,385 L 465,375 M 470,350 L 480,340" fill="none" stroke="var(--nodal-color)" stroke-width="1.5" opacity="0.4" />

            <!-- Nodes -->
            <ellipse id="sa-node" cx="335" cy="185" rx="7" ry="10" fill="var(--nodal-color)" />
            <circle id="av-node" cx="380" cy="240" r="6" fill="var(--nodal-color)" />
        </g>

        <!-- SPARKS (Animated Impulses) -->
        <g id="sparks">
            <!-- Internodal Spark -->
            <path d="M 335,185 C 350,200 370,220 380,240" fill="none" stroke="#FFF" stroke-width="3" filter="url(#glow)" stroke-dasharray="15 80" stroke-dashoffset="95" class="internodal-spark" stroke-linecap="round" />
            
            <!-- Right Purkinje Spark -->
            <path d="M 380,240 C 390,250 400,260 400,280 L 400,320 C 390,350 380,390 370,400 C 350,400 330,380 325,330" fill="none" stroke="#FFF" stroke-width="4" filter="url(#glow)" stroke-dasharray="30 250" stroke-dashoffset="280" class="purkinje-spark" stroke-linecap="round" />
            
            <!-- Left Purkinje Spark -->
            <path d="M 380,240 C 390,250 400,260 400,280 L 400,320 C 410,350 420,390 430,400 C 450,400 470,380 475,330" fill="none" stroke="#FFF" stroke-width="4" filter="url(#glow)" stroke-dasharray="30 250" stroke-dashoffset="280" class="purkinje-spark" stroke-linecap="round" />
        </g>

        <!-- BLOOD FLOW INDICATORS -->
        <g id="blood-flow">
            <!-- Right Side (Deoxygenated / Venous) -->
            <path d="M 350,330 L 350,130" fill="none" stroke="var(--venous)" stroke-width="4" marker-end="url(#arrow-venous)" class="blood-arrow" opacity="0" />
            <!-- Left Side (Oxygenated / Arterial) -->
            <path d="M 450,330 L 450,130" fill="none" stroke="var(--arterial)" stroke-width="4" marker-end="url(#arrow-arterial)" class="blood-arrow" opacity="0" />
        </g>

        <!-- LABELS & LEADER LINES -->
        <g id="labels">
            <!-- SA Node -->
            <polyline points="180,185 320,185" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="170" y="180" class="label" text-anchor="end">Sino-atrial Node</text>
            <text x="170" y="195" class="label-sub" text-anchor="end">(Pacemaker)</text>

            <!-- AV Node -->
            <polyline points="180,240 365,240" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="170" y="235" class="label" text-anchor="end">Atrio-ventricular Node</text>
            <text x="170" y="250" class="label-sub" text-anchor="end">(0.1s Delay)</text>

            <!-- Bundle of His -->
            <polyline points="620,280 410,280" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="630" y="275" class="label" text-anchor="start">AV Bundle</text>
            <text x="630" y="290" class="label-sub" text-anchor="start">(Bundle of His)</text>

            <!-- Purkinje Fibers -->
            <polyline points="620,360 485,360" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#dot)" />
            <text x="630" y="355" class="label" text-anchor="start">Purkinje Fibers</text>
            <text x="630" y="370" class="label-sub" text-anchor="start">(Ventricular Network)</text>
        </g>

        <!-- LEGEND -->
        <g id="legend" transform="translate(40, 410)">
            <rect x="0" y="0" width="160" height="70" fill="#ffffff" rx="6" stroke="#e0e0e0" stroke-width="1" />
            
            <circle cx="15" cy="15" r="4" fill="var(--nodal-color)" />
            <text x="25" y="19" class="legend-text">Nodal Tissue</text>
            
            <rect x="10" y="28" width="10" height="10" fill="var(--heart-wall)" opacity="0.4" />
            <text x="25" y="37" class="legend-text">Myocardium (Muscle)</text>
            
            <line x1="10" y1="52" x2="20" y2="52" stroke="var(--arterial)" stroke-width="3" />
            <line x1="10" y1="58" x2="20" y2="58" stroke="var(--venous)" stroke-width="3" />
            <text x="25" y="57" class="legend-text">Arterial / Venous Flow</text>
        </g>

        <!-- PROCESS TEXT BOX (Dynamic) -->
        <g id="process-box" transform="translate(540, 410)">
            <rect x="0" y="0" width="220" height="50" fill="#ffffff" rx="6" stroke="#e0e0e0" stroke-width="1" />
            <text x="110" y="30" class="process-text" text-anchor="middle" id="text-step-1">1. SA Node Fires</text>
            <text x="110" y="30" class="process-text" text-anchor="middle" id="text-step-2">2. AV Delay (0.1s)</text>
            <text x="110" y="30" class="process-text" text-anchor="middle" id="text-step-3">3. Bundle Conduction</text>
            <text x="110" y="30" class="process-text" text-anchor="middle" id="text-step-4">4. Ventricular Systole</text>
            <text x="110" y="30" class="process-text" text-anchor="middle" id="text-step-5">5. Diastole (Reset)</text>
        </g>

    </svg>

</body>
</html>
