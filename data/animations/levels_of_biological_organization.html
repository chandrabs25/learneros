<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levels of Biological Organization: The Plant Tissue System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Animations */
        .anim-g1-wrapper {
            animation: g1-wrapper 15s infinite ease-in-out;
            transform-origin: center center;
        }

        .anim-side-cells {
            animation: fade-in-20 15s infinite ease-in-out;
        }

        .anim-center-cell {
            animation: fade-out-40 15s infinite ease-in-out;
        }

        .anim-stoma-trichome {
            animation: fade-in-40 15s infinite ease-in-out;
        }

        .anim-leaf {
            animation: leaf-anim 15s infinite ease-in-out;
            transform-origin: center center;
        }

        .anim-plant {
            animation: plant-anim 15s infinite ease-in-out;
            transform-origin: center center;
        }

        .anim-nucleus {
            animation: pulse 3s infinite ease-in-out;
            transform-origin: 30px 15px;
        }

        /* Label Animations */
        .anim-label-1 { animation: label-1 15s infinite ease-in-out; }
        .anim-label-2 { animation: label-2 15s infinite ease-in-out; }
        .anim-label-3 { animation: label-3 15s infinite ease-in-out; }
        .anim-label-4 { animation: label-4 15s infinite ease-in-out; }
        .anim-label-5 { animation: label-5 15s infinite ease-in-out; }

        /* Keyframes */
        @keyframes g1-wrapper {
            0%, 15% { transform: translateY(30px) scale(2.2); opacity: 1; }
            20%, 35% { transform: translateY(30px) scale(1); opacity: 1; }
            40%, 55% { transform: translateY(30px) scale(1); opacity: 1; }
            60%, 75% { transform: translateY(-80px) scale(0.45); opacity: 1; }
            80%, 100% { transform: translateY(-80px) scale(0.45); opacity: 0; }
        }

        @keyframes fade-in-20 {
            0%, 15% { opacity: 0; }
            20%, 100% { opacity: 1; }
        }

        @keyframes fade-out-40 {
            0%, 35% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }

        @keyframes fade-in-40 {
            0%, 35% { opacity: 0; }
            40%, 100% { opacity: 1; }
        }

        @keyframes leaf-anim {
            0%, 55% { opacity: 0; transform: scale(0.9) translateY(20px); }
            60%, 75% { opacity: 1; transform: scale(1) translateY(0); }
            80%, 100% { opacity: 0; transform: scale(1.05) translateY(-10px); }
        }

        @keyframes plant-anim {
            0%, 75% { opacity: 0; transform: scale(0.9) translateY(20px); }
            80%, 95% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(1.05) translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        @keyframes label-1 { 0%, 15% { opacity: 1; } 18%, 100% { opacity: 0; } }
        @keyframes label-2 { 0%, 17% { opacity: 0; } 20%, 35% { opacity: 1; } 38%, 100% { opacity: 0; } }
        @keyframes label-3 { 0%, 37% { opacity: 0; } 40%, 55% { opacity: 1; } 58%, 100% { opacity: 0; } }
        @keyframes label-4 { 0%, 57% { opacity: 0; } 60%, 75% { opacity: 1; } 78%, 100% { opacity: 0; } }
        @keyframes label-5 { 0%, 77% { opacity: 0; } 80%, 95% { opacity: 1; } 98%, 100% { opacity: 0; } }

        /* SVG Typography */
        .title-text { font-family: 'Inter', sans-serif; font-weight: 800; font-size: 24px; fill: #2C3E50; text-anchor: middle; }
        .level-text { font-family: 'Roboto Mono', monospace; font-size: 18px; fill: #2C3E50; text-anchor: middle; font-weight: 500; }
        .pointer-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; fill: #7F8C8D; }
        .pointer-line { stroke: #BDC3C7; stroke-width: 2; stroke-dasharray: 4,4; fill: none; }
        .legend-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #7F8C8D; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" aria-label="Animated diagram showing levels of biological organization in a plant" role="img">
        <title>Levels of Biological Organization: The Plant Tissue System</title>
        <desc>An animation transitioning from a single plant epidermal cell, to an epidermal tissue layer, to a tissue system with stoma and trichome, to a leaf cross-section organ, and finally to a full plant organism.</desc>

        <!-- Definitions for Reusable Elements -->
        <defs>
            <!-- Base Epidermal Cell (Interlocking Hexagon) -->
            <g id="epi-cell-def">
                <!-- Cell Wall -->
                <path d="M -30,40 L 30,40 L 50,0 L 30,-40 L -30,-40 L -50,0 Z" fill="#ffffff" stroke="#2ECC71" stroke-width="4" stroke-linejoin="round" />
                <!-- Large Central Vacuole -->
                <path d="M -22,30 L 22,30 L 38,0 L 22,-30 L -22,-30 L -38,0 Z" fill="#E8F4FD" stroke="#98D8C8" stroke-width="1" stroke-linejoin="round" />
                <!-- Peripheral Nucleus -->
                <circle cx="30" cy="15" r="7" fill="#2C3E50" class="anim-nucleus" />
                <!-- Chloroplasts -->
                <circle cx="-32" cy="10" r="3.5" fill="#27AE60" />
                <circle cx="-28" cy="-15" r="3.5" fill="#27AE60" />
                <circle cx="5" cy="-33" r="3.5" fill="#27AE60" />
                <circle cx="20" cy="33" r="3.5" fill="#27AE60" />
            </g>

            <!-- Stoma Complex (Replaces a cell) -->
            <g id="stoma-def">
                <!-- Background to match tissue -->
                <path d="M -30,40 L 30,40 L 50,0 L 30,-40 L -30,-40 L -50,0 Z" fill="#ffffff" stroke="#2ECC71" stroke-width="4" stroke-linejoin="round" />
                <!-- Subsidiary Cell Cytoplasm/Vacuole -->
                <path d="M -22,30 L 22,30 L 38,0 L 22,-30 L -22,-30 L -38,0 Z" fill="#E8F4FD" stroke="#98D8C8" stroke-width="1" stroke-linejoin="round" />
                <!-- Left Guard Cell -->
                <path d="M -4,-22 C -24,-22 -24,22 -4,22 C -14,12 -14,-12 -4,-22 Z" fill="#27AE60" stroke="#2C3E50" stroke-width="2" />
                <!-- Right Guard Cell -->
                <path d="M 4,-22 C 24,-22 24,22 4,22 C 14,12 14,-12 4,-22 Z" fill="#27AE60" stroke="#2C3E50" stroke-width="2" />
                <!-- Stomatal Pore -->
                <ellipse cx="0" cy="0" rx="3" ry="12" fill="#2C3E50" />
            </g>

            <!-- Trichome (Hair) -->
            <g id="trichome-def">
                <path d="M -12,-40 L -8,-90 L 0,-130 L 8,-90 L 12,-40 Z" fill="#98D8C8" stroke="#27AE60" stroke-width="3" stroke-linejoin="round" />
                <line x1="-10" y1="-65" x2="10" y2="-65" stroke="#27AE60" stroke-width="2" />
                <line x1="-6" y1="-100" x2="6" y2="-100" stroke="#27AE60" stroke-width="2" />
            </g>
        </defs>

        <!-- Static Background Elements -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        
        <!-- Title -->
        <text x="400" y="40" class="title-text">Levels of Biological Organization: Plant Tissue System</text>

        <!-- Legend -->
        <g transform="translate(20, 410)">
            <rect x="0" y="0" width="12" height="12" fill="#2ECC71" rx="2"/>
            <text x="20" y="10" class="legend-text">Plant Tissue</text>
            
            <rect x="0" y="20" width="12" height="12" fill="#E74C3C" rx="2"/>
            <text x="20" y="30" class="legend-text">Xylem</text>
            
            <rect x="0" y="40" width="12" height="12" fill="#3498DB" rx="2"/>
            <text x="20" y="50" class="legend-text">Phloem</text>
            
            <rect x="0" y="60" width="12" height="12" fill="#F39C12" rx="2"/>
            <text x="20" y="70" class="legend-text">Roots</text>
        </g>

        <!-- MAIN ANIMATION CONTAINER -->
        <g transform="translate(400, 240)">
            
            <!-- GROUP 3: ORGANISM (Full Plant) -->
            <g class="anim-plant">
                <!-- Soil Line -->
                <line x1="-120" y1="110" x2="120" y2="110" stroke="#BDC3C7" stroke-width="3" stroke-dasharray="8,8" />
                
                <!-- Roots -->
                <path d="M 0,110 L 0,190 M 0,130 L -35,160 M 0,150 L 40,180 M -15,145 L -25,175 M 15,165 L 25,195" stroke="#F39C12" stroke-width="5" stroke-linecap="round" fill="none" />
                
                <!-- Stem -->
                <path d="M 0,110 L 0,-50" stroke="#2ECC71" stroke-width="10" stroke-linecap="round" fill="none" />
                
                <!-- Leaves -->
                <path d="M 0,50 C 40,50 80,10 120,30 C 80,50 40,70 0,50 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                <path d="M 0,10 C -40,10 -80,-30 -120,-10 C -80,10 -40,30 0,10 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                <path d="M 0,-20 C 30,-20 60,-50 90,-30 C 60,-20 30,0 0,-20 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                
                <!-- Flower -->
                <circle cx="0" cy="-50" r="8" fill="#27AE60" />
                <circle cx="-18" cy="-65" r="14" fill="#FF6B6B" />
                <circle cx="18" cy="-65" r="14" fill="#FF6B6B" />
                <circle cx="0" cy="-85" r="14" fill="#FF6B6B" />
                <circle cx="-12" cy="-45" r="14" fill="#FF6B6B" />
                <circle cx="12" cy="-45" r="14" fill="#FF6B6B" />
                <circle cx="0" cy="-60" r="10" fill="#F39C12" />

                <!-- Highlight Leaf -->
                <circle cx="60" cy="40" r="50" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="6,6" />
            </g>

            <!-- GROUP 2: ORGAN (Leaf Cross Section) -->
            <g class="anim-leaf">
                <!-- Palisade Mesophyll -->
                <g id="palisade">
                    <rect x="-170" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-145" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-120" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-95" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-70" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-45" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="-20" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="5" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="30" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="55" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="80" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="105" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="130" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <rect x="155" y="-55" width="20" height="45" rx="8" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                </g>

                <!-- Spongy Mesophyll -->
                <g id="spongy">
                    <circle cx="-140" cy="15" r="12" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="-110" cy="35" r="14" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="-80" cy="10" r="13" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="-50" cy="35" r="15" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="-160" cy="40" r="11" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    
                    <circle cx="60" cy="15" r="13" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="90" cy="35" r="14" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="120" cy="10" r="12" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="150" cy="35" r="15" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                    <circle cx="170" cy="15" r="11" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
                </g>

                <!-- Vascular Bundle -->
                <g id="vascular-bundle" transform="translate(0, 15)">
                    <!-- Bundle Sheath -->
                    <circle cx="0" cy="0" r="40" fill="#E8F4FD" stroke="#27AE60" stroke-width="3" />
                    <!-- Xylem -->
                    <path d="M -37,0 A 37,37 0 0,1 37,0 Z" fill="#E74C3C" />
                    <!-- Phloem -->
                    <path d="M -37,0 A 37,37 0 0,0 37,0 Z" fill="#3498DB" />
                    <!-- Xylem Vessels -->
                    <circle cx="-15" cy="-10" r="7" fill="#f8f9fa" />
                    <circle cx="15" cy="-10" r="7" fill="#f8f9fa" />
                    <circle cx="0" cy="-20" r="9" fill="#f8f9fa" />
                </g>

                <!-- Lower Epidermis -->
                <g transform="translate(0, 75) scale(0.45)">
                    <use href="#epi-cell-def" x="-320" />
                    <use href="#epi-cell-def" x="-240" />
                    <use href="#epi-cell-def" x="-160" />
                    <use href="#epi-cell-def" x="-80" />
                    <use href="#stoma-def" x="0" />
                    <use href="#epi-cell-def" x="80" />
                    <use href="#epi-cell-def" x="160" />
                    <use href="#epi-cell-def" x="240" />
                    <use href="#epi-cell-def" x="320" />
                </g>
            </g>

            <!-- GROUP 1: CELL / TISSUE / SYSTEM (Upper Epidermis) -->
            <g class="anim-g1-wrapper">
                
                <!-- Side Cells (Fade in during Tissue phase) -->
                <g class="anim-side-cells">
                    <use href="#epi-cell-def" x="-160" />
                    <use href="#epi-cell-def" x="-80" />
                    <use href="#epi-cell-def" x="80" />
                    <use href="#epi-cell-def" x="160" />
                </g>

                <!-- Center Cell (Fades out when Stoma appears) -->
                <g class="anim-center-cell">
                    <use href="#epi-cell-def" x="0" />
                </g>

                <!-- Stoma & Trichome (Fade in during System phase) -->
                <g class="anim-stoma-trichome">
                    <use href="#stoma-def" x="0" />
                    <use href="#trichome-def" x="-80" />
                </g>
                
            </g>
        </g>

        <!-- DYNAMIC LABELS & POINTERS (Fixed Position Overlays) -->
        
        <!-- Phase 1 Pointers: Cell -->
        <g class="anim-label-1">
            <!-- Vacuole Pointer -->
            <line x1="280" y1="210" x2="380" y2="270" class="pointer-line" />
            <text x="270" y="205" class="pointer-text" text-anchor="end">Large Central Vacuole</text>
            
            <!-- Nucleus Pointer -->
            <line x1="560" y1="360" x2="470" y2="310" class="pointer-line" />
            <text x="570" y="370" class="pointer-text" text-anchor="start">Peripheral Nucleus</text>
            
            <!-- Cell Wall Pointer -->
            <line x1="560" y1="180" x2="480" y2="220" class="pointer-line" />
            <text x="570" y="175" class="pointer-text" text-anchor="start">Thick Cell Wall</text>
        </g>

        <!-- Phase 3 Pointers: Tissue System -->
        <g class="anim-label-3">
            <!-- Stoma Pointer -->
            <line x1="480" y1="200" x2="410" y2="260" class="pointer-line" />
            <text x="490" y="195" class="pointer-text" text-anchor="start">Stoma (Guard Cells)</text>
            
            <!-- Trichome Pointer -->
            <line x1="240" y1="160" x2="315" y2="220" class="pointer-line" />
            <text x="230" y="155" class="pointer-text" text-anchor="end">Trichome (Epidermal Hair)</text>
        </g>

        <!-- Phase 4 Pointers: Organ -->
        <g class="anim-label-4">
            <!-- Mesophyll Pointer -->
            <line x1="220" y1="230" x2="300" y2="230" class="pointer-line" />
            <text x="210" y="235" class="pointer-text" text-anchor="end" fill="#27AE60">Mesophyll</text>
            
            <!-- Xylem Pointer -->
            <line x1="550" y1="220" x2="420" y2="245" class="pointer-line" />
            <text x="560" y="225" class="pointer-text" text-anchor="start" fill="#E74C3C">Xylem</text>
            
            <!-- Phloem Pointer -->
            <line x1="550" y1="300" x2="430" y2="270" class="pointer-line" />
            <text x="560" y="305" class="pointer-text" text-anchor="start" fill="#3498DB">Phloem</text>
        </g>

        <!-- BOTTOM LEVEL INDICATORS -->
        <text x="400" y="470" class="level-text anim-label-1">LEVEL 1: The Cell (Epidermal Cell)</text>
        <text x="400" y="470" class="level-text anim-label-2">LEVEL 2: The Tissue (Epidermis)</text>
        <text x="400" y="470" class="level-text anim-label-3">LEVEL 3: The Tissue System (Epidermal Tissue System)</text>
        <text x="400" y="470" class="level-text anim-label-4">LEVEL 4: The Organ (Leaf Cross-Section)</text>
        <text x="400" y="470" class="level-text anim-label-5">LEVEL 5: The Organism (<tspan font-style="italic">Angiosperm</tspan>)</text>

    </svg>
</div>

</body>
</html>
