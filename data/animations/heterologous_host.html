<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heterologous Host: Recombinant Protein Production</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
        }

        /* Animations */
        @keyframes fade-scene {
            0%, 95% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        @keyframes alien-dna-anim {
            0%, 5% { transform: translate(-120px, -100px); }
            20%, 100% { transform: translate(0, 0); }
        }

        @keyframes move-plasmid {
            0%, 25% { transform: translate(180px, 250px); }
            38%, 75% { transform: translate(550px, 250px); }
            88%, 100% { transform: translate(630px, 250px); }
        }

        @keyframes membrane-pulse {
            0%, 48% { stroke-width: 4px; stroke: #4A90D9; }
            50% { stroke-width: 8px; stroke: #FFD700; }
            52%, 100% { stroke-width: 4px; stroke: #4A90D9; }
        }

        @keyframes draw-mrna {
            0%, 50% { stroke-dashoffset: 60; opacity: 0; }
            55%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }

        @keyframes pop-protein {
            0%, 60% { transform: scale(0); opacity: 0; }
            65%, 100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pinch-top {
            0%, 75% { transform: translateY(0); }
            88%, 100% { transform: translateY(120px); }
        }

        @keyframes pinch-bottom {
            0%, 75% { transform: translateY(0); }
            88%, 100% { transform: translateY(-120px); }
        }

        @keyframes move-right-contents {
            0%, 75% { transform: translate(550px, 250px); }
            88%, 100% { transform: translate(630px, 250px); }
        }

        @keyframes move-left-contents {
            0%, 70% { opacity: 0; transform: translate(550px, 250px); }
            75% { opacity: 1; transform: translate(550px, 250px); }
            88%, 100% { opacity: 1; transform: translate(470px, 250px); }
        }

        /* Label Animations */
        @keyframes label-ligation {
            0%, 25% { opacity: 1; font-weight: 700; fill: #E74C3C; }
            26%, 100% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
        }

        @keyframes label-transformation {
            0%, 25% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
            30%, 50% { opacity: 1; font-weight: 700; fill: #E74C3C; }
            51%, 100% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
        }

        @keyframes label-expression {
            0%, 50% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
            55%, 75% { opacity: 1; font-weight: 700; fill: #E74C3C; }
            76%, 100% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
        }

        @keyframes label-multiplication {
            0%, 75% { opacity: 0.4; font-weight: 500; fill: #7f8c8d; }
            80%, 100% { opacity: 1; font-weight: 700; fill: #E74C3C; }
        }

        /* Apply animations */
        .scene { animation: fade-scene 12s infinite linear; }
        .alien-dna { animation: alien-dna-anim 12s infinite ease-in-out; }
        .recombinant-plasmid { animation: move-plasmid 12s infinite ease-in-out; }
        .main-cell { animation: membrane-pulse 12s infinite ease-in-out; }
        .mrna { animation: draw-mrna 12s infinite ease-in-out; stroke-dasharray: 60; }
        .protein-shape { animation: pop-protein 12s infinite ease-in-out; transform-origin: center; }
        .pinch-t { animation: pinch-top 12s infinite ease-in-out; }
        .pinch-b { animation: pinch-bottom 12s infinite ease-in-out; }
        .contents-right { animation: move-right-contents 12s infinite ease-in-out; }
        .contents-left { animation: move-left-contents 12s infinite ease-in-out; }
        
        .lbl-lig { animation: label-ligation 12s infinite ease-in-out; }
        .lbl-trans { animation: label-transformation 12s infinite ease-in-out; }
        .lbl-exp { animation: label-expression 12s infinite ease-in-out; }
        .lbl-mult { animation: label-multiplication 12s infinite ease-in-out; }

        .process-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            text-anchor: middle;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Heterologous Host: Recombinant Protein Production</title>
    <desc id="svg-desc">An animated diagram showing the process of inserting an alien DNA fragment into a plasmid, transforming an E. coli host cell, expressing the recombinant protein, and cell multiplication.</desc>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- Defs for Markers and Filters -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#bdc3c7" />
        </marker>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
        </filter>
    </defs>

    <!-- Static UI & Titles -->
    <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50">Heterologous Host: Recombinant Protein Production</text>
    
    <line x1="320" y1="80" x2="320" y2="460" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="6 6" />
    <text x="160" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#7f8c8d">IN VITRO (Test Tube)</text>
    <text x="560" y="80" text-anchor="middle" font-size="14" font-weight="600" fill="#7f8c8d">IN VIVO (Host Cell)</text>

    <!-- Process Labels -->
    <text x="160" y="340" class="process-label lbl-lig">1. LIGATION</text>
    <text x="320" y="230" class="process-label lbl-trans">2. TRANSFORMATION</text>
    <text x="550" y="140" class="process-label lbl-exp">3. TRANSCRIPTION &amp; TRANSLATION</text>
    <text x="550" y="440" class="process-label lbl-mult">4. MULTIPLICATION</text>

    <!-- Legend -->
    <g transform="translate(20, 370)">
        <rect width="160" height="110" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" filter="url(#shadow)"/>
        <text x="10" y="20" font-size="10" font-weight="700" fill="#2C3E50">KEY</text>
        
        <line x1="10" y1="35" x2="30" y2="35" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
        <text x="40" y="39" font-size="10" fill="#333">Alien DNA</text>
        
        <circle cx="20" cy="55" r="6" fill="none" stroke="#2C3E50" stroke-width="3"/>
        <text x="40" y="59" font-size="10" fill="#333">Plasmid Vector</text>
        
        <path d="M 10 75 Q 15 70 20 75 T 30 75" fill="none" stroke="#FFA07A" stroke-width="2"/>
        <text x="40" y="79" font-size="10" fill="#333">mRNA</text>
        
        <circle cx="20" cy="95" r="5" fill="#98D8C8"/>
        <text x="40" y="99" font-size="10" fill="#333">Recombinant Protein</text>
    </g>

    <!-- Main Animation Scene -->
    <g class="scene">
        
        <!-- Host Cell Base (In Vivo) -->
        <g id="host-cell">
            <!-- Main Cell Body -->
            <rect x="350" y="170" width="400" height="160" rx="80" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4" class="main-cell" />
            
            <!-- Pinch Circles (Simulate Binary Fission by overlapping the main cell) -->
            <circle cx="550" cy="50" r="80" fill="#f8f9fa" stroke="#4A90D9" stroke-width="4" class="pinch-t" />
            <circle cx="550" cy="450" r="80" fill="#f8f9fa" stroke="#4A90D9" stroke-width="4" class="pinch-b" />
            
            <!-- Cell Label -->
            <text x="550" y="360" text-anchor="middle" font-size="12" fill="#2C3E50">
                <tspan font-style="italic">Escherichia coli</tspan> (Host)
            </text>
        </g>

        <!-- Right Cell Contents (Original / Right Daughter) -->
        <g class="contents-right">
            <!-- Genomic DNA -->
            <path d="M -30 0 C -40 -30, 0 -40, 20 -20 C 40 0, 30 40, 0 30 C -30 20, -20 30, -30 0 Z M -10 -10 Q 10 -20 0 10 T -10 -10" fill="none" stroke="#bdc3c7" stroke-width="3" />
            <text x="-40" y="-40" font-size="10" fill="#7f8c8d">Genomic DNA</text>
            
            <!-- Ribosomes -->
            <circle cx="30" cy="-30" r="2.5" fill="#95a5a6" />
            <circle cx="45" cy="20" r="2.5" fill="#95a5a6" />
            <circle cx="-10" cy="40" r="2.5" fill="#95a5a6" />
            
            <!-- Expression Machinery (mRNA & Proteins) -->
            <!-- mRNA -->
            <path d="M 10 -15 Q 20 -30 30 -15 T 50 -15" fill="none" stroke="#FFA07A" stroke-width="2.5" class="mrna" />
            
            <!-- Proteins -->
            <g transform="translate(35, -35)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
            <g transform="translate(55, 10)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
            <g transform="translate(20, 35)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
        </g>

        <!-- Left Cell Contents (Left Daughter / Copied) -->
        <g class="contents-left">
            <!-- Genomic DNA Copy -->
            <path d="M -30 0 C -40 -30, 0 -40, 20 -20 C 40 0, 30 40, 0 30 C -30 20, -20 30, -30 0 Z M -10 -10 Q 10 -20 0 10 T -10 -10" fill="none" stroke="#bdc3c7" stroke-width="3" />
            
            <!-- Ribosomes -->
            <circle cx="20" cy="-25" r="2.5" fill="#95a5a6" />
            <circle cx="40" cy="15" r="2.5" fill="#95a5a6" />
            <circle cx="-15" cy="35" r="2.5" fill="#95a5a6" />

            <!-- Plasmid Copy -->
            <path d="M -21 -21 A 30 30 0 1 0 21 -21" fill="none" stroke="#2C3E50" stroke-width="6" stroke-linecap="round" />
            <path d="M -21 -21 A 30 30 0 0 1 21 -21" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" />

            <!-- Proteins Copy -->
            <g transform="translate(30, -30)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
            <g transform="translate(50, 5)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
            <g transform="translate(15, 30)"><circle cx="0" cy="0" r="5" fill="#98D8C8" class="protein-shape" filter="url(#shadow)"/></g>
        </g>

        <!-- Main Recombinant Plasmid (Moves from In Vitro to In Vivo) -->
        <g class="recombinant-plasmid" filter="url(#shadow)">
            <!-- Plasmid Vector -->
            <path d="M -21 -21 A 30 30 0 1 0 21 -21" fill="none" stroke="#2C3E50" stroke-width="6" stroke-linecap="round" />
            
            <!-- Alien DNA Fragment joining -->
            <g class="alien-dna">
                <path d="M -21 -21 A 30 30 0 0 1 21 -21" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" />
            </g>
        </g>

        <!-- Static Labels & Arrows for In Vitro Phase -->
        <g>
            <!-- Alien DNA Label -->
            <text x="60" y="130" font-size="12" fill="#FF6B6B" font-weight="600">Alien DNA</text>
            <path d="M 60 135 L 60 150" fill="none" stroke="#bdc3c7" stroke-width="2" marker-end="url(#arrow)" />

            <!-- Plasmid Label -->
            <text x="180" y="305" text-anchor="middle" font-size="12" fill="#2C3E50" font-weight="600">Cloning Vector</text>
            <text x="180" y="320" text-anchor="middle" font-size="11" fill="#7f8c8d">(Plasmid)</text>
        </g>

    </g>
</svg>

</body>
</html>
