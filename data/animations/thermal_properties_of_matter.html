<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Caloric to Kinetic: The Nature of Heat</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            background-color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }

        @keyframes flow {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        #q-arrow-path {
            animation: flow 0.8s linear infinite;
        }

        .thermometer-bg {
            fill: #e9ecef;
            stroke: #ced4da;
            stroke-width: 2;
        }

        .tick {
            stroke: #adb5bd;
            stroke-width: 1.5;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Thermal Equilibrium Animation</title>
        <desc>An animated diagram showing two chambers of gas reaching thermal equilibrium through kinetic energy transfer. Heat flows from the hot chamber to the cold chamber until particle velocities equalize.</desc>

        <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#FF3366" id="q-arrow-head" />
            </marker>
            <marker id="small-arrow" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
                <polygon points="0 0, 6 2, 0 4" fill="#FF3366" id="q-vec-head" />
            </marker>
            
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#ffffff" />

        <!-- Titles -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#212529">From Caloric to Kinetic: The Nature of Heat</text>
        <text x="400" y="65" text-anchor="middle" font-size="15" font-weight="400" fill="#6c757d">Thermal Equilibrium: Microscopic View</text>

        <!-- Thermometer Left -->
        <rect class="thermometer-bg" x="40" y="100" width="20" height="300" rx="10" />
        <g class="tick">
            <line x1="40" x2="48" y1="130" y2="130" /><line x1="40" x2="48" y1="160" y2="160" />
            <line x1="40" x2="48" y1="190" y2="190" /><line x1="40" x2="48" y1="220" y2="220" />
            <line x1="40" x2="48" y1="250" y2="250" /><line x1="40" x2="48" y1="280" y2="280" />
            <line x1="40" x2="48" y1="310" y2="310" /><line x1="40" x2="48" y1="340" y2="340" />
            <line x1="40" x2="48" y1="370" y2="370" />
        </g>
        <rect id="therm-left" x="44" y="104" width="12" height="292" rx="6" fill="#FF3366" />

        <!-- Thermometer Right -->
        <rect class="thermometer-bg" x="740" y="100" width="20" height="300" rx="10" />
        <g class="tick">
            <line x1="752" x2="760" y1="130" y2="130" /><line x1="752" x2="760" y1="160" y2="160" />
            <line x1="752" x2="760" y1="190" y2="190" /><line x1="752" x2="760" y1="220" y2="220" />
            <line x1="752" x2="760" y1="250" y2="250" /><line x1="752" x2="760" y1="280" y2="280" />
            <line x1="752" x2="760" y1="310" y2="310" /><line x1="752" x2="760" y1="340" y2="340" />
            <line x1="752" x2="760" y1="370" y2="370" />
        </g>
        <rect id="therm-right" x="744" y="366" width="12" height="30" rx="6" fill="#4361EE" />

        <!-- Chambers -->
        <rect id="chamber-left" x="100" y="100" width="250" height="300" rx="15" fill="rgba(255,51,102,0.05)" stroke="#FF3366" stroke-width="3" />
        <rect id="chamber-right" x="450" y="100" width="250" height="300" rx="15" fill="rgba(67,97,238,0.05)" stroke="#4361EE" stroke-width="3" />

        <!-- Chamber Labels -->
        <text id="label-t1" x="225" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#FF3366">T₁ (Hot)</text>
        <text id="label-t2" x="575" y="85" text-anchor="middle" font-size="18" font-weight="700" fill="#4361EE">T₂ (Cold)</text>

        <!-- Heat Flow Arrow (Q) -->
        <g id="q-group">
            <path id="q-arrow-path" d="M 365 250 L 435 250" stroke="#FF3366" stroke-width="8" stroke-dasharray="12, 12" marker-end="url(#arrowhead)" fill="none" stroke-linecap="round"/>
            <text id="q-text" x="400" y="230" text-anchor="middle" font-size="22" font-weight="700" fill="#FF3366" font-style="italic">Q</text>
            <path id="q-vec" d="M 392 212 L 408 212" stroke="#FF3366" stroke-width="2" marker-end="url(#small-arrow)" fill="none"/>
        </g>

        <!-- Equilibrium Text -->
        <text id="eq-text" x="400" y="285" text-anchor="middle" font-size="16" font-weight="700" fill="#7209B7" opacity="0">Thermal Equilibrium: T₁ = T₂</text>

        <!-- Math Equation -->
        <text x="400" y="440" text-anchor="middle" class="math-text" font-size="18" fill="#495057">
            v<tspan dy="4" font-size="12">rms</tspan><tspan dy="-4"> ∝ √T</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(230, 470)">
            <rect x="0" y="0" width="12" height="12" rx="2" fill="#FF3366" />
            <text x="18" y="11" font-size="12" fill="#495057">High KE</text>
            
            <rect x="100" y="0" width="12" height="12" rx="2" fill="#7209B7" />
            <text x="118" y="11" font-size="12" fill="#495057">Equilibrium</text>
            
            <rect x="220" y="0" width="12" height="12" rx="2" fill="#4361EE" />
            <text x="238" y="11" font-size="12" fill="#495057">Low KE</text>
        </g>

        <!-- Particles Left -->
        <g id="particles-left">
            <circle class="p-left" r="6" cx="150" cy="150" fill="#FF3366" />
            <circle class="p-left" r="6" cx="200" cy="180" fill="#FF3366" />
            <circle class="p-left" r="6" cx="280" cy="130" fill="#FF3366" />
            <circle class="p-left" r="6" cx="120" cy="250" fill="#FF3366" />
            <circle class="p-left" r="6" cx="230" cy="220" fill="#FF3366" />
            <circle class="p-left" r="6" cx="310" cy="270" fill="#FF3366" />
            <circle class="p-left" r="6" cx="170" cy="320" fill="#FF3366" />
            <circle class="p-left" r="6" cx="250" cy="350" fill="#FF3366" />
            <circle class="p-left" r="6" cx="140" cy="370" fill="#FF3366" />
            <circle class="p-left" r="6" cx="290" cy="380" fill="#FF3366" />
            <circle class="p-left" r="6" cx="210" cy="120" fill="#FF3366" />
            <circle class="p-left" r="6" cx="270" cy="200" fill="#FF3366" />
            <circle class="p-left" r="6" cx="180" cy="280" fill="#FF3366" />
            <circle class="p-left" r="6" cx="320" cy="330" fill="#FF3366" />
            <circle class="p-left" r="6" cx="130" cy="190" fill="#FF3366" />
        </g>

        <!-- Particles Right -->
        <g id="particles-right">
            <circle class="p-right" r="6" cx="500" cy="150" fill="#4361EE" />
            <circle class="p-right" r="6" cx="550" cy="180" fill="#4361EE" />
            <circle class="p-right" r="6" cx="630" cy="130" fill="#4361EE" />
            <circle class="p-right" r="6" cx="470" cy="250" fill="#4361EE" />
            <circle class="p-right" r="6" cx="580" cy="220" fill="#4361EE" />
            <circle class="p-right" r="6" cx="660" cy="270" fill="#4361EE" />
            <circle class="p-right" r="6" cx="520" cy="320" fill="#4361EE" />
            <circle class="p-right" r="6" cx="600" cy="350" fill="#4361EE" />
            <circle class="p-right" r="6" cx="490" cy="370" fill="#4361EE" />
            <circle class="p-right" r="6" cx="640" cy="380" fill="#4361EE" />
            <circle class="p-right" r="6" cx="560" cy="120" fill="#4361EE" />
            <circle class="p-right" r="6" cx="620" cy="200" fill="#4361EE" />
            <circle class="p-right" r="6" cx="530" cy="280" fill="#4361EE" />
            <circle class="p-right" r="6" cx="670" cy="330" fill="#4361EE" />
            <circle class="p-right" r="6" cx="480" cy="190" fill="#4361EE" />
        </g>
    </svg>
</div>

<script>
    // Minimal JS for physically accurate kinetic theory simulation.
    // While CSS handles the macro-state transitions and Q-arrow flow, 
    // JS is required to accurately model 2D elastic collisions and dynamic velocity 
    // scaling (v ∝ √T) without the stuttering inherent to dynamic CSS keyframe durations.

    const pLeftElements = document.querySelectorAll('.p-left');
    const pRightElements = document.querySelectorAll('.p-right');
    
    // Initialize particles with random directions
    function initParticles(elements) {
        return Array.from(elements).map(el => {
            let vx = (Math.random() - 0.5) * 2;
            let vy = (Math.random() - 0.5) * 2;
            const mag = Math.sqrt(vx*vx + vy*vy);
            return {
                el,
                x: parseFloat(el.getAttribute('cx')),
                y: parseFloat(el.getAttribute('cy')),
                vx: vx / mag,
                vy: vy / mag
            };
        });
    }

    const pLeft = initParticles(pLeftElements);
    const pRight = initParticles(pRightElements);

    // DOM Elements for state updates
    const chamberLeft = document.getElementById('chamber-left');
    const chamberRight = document.getElementById('chamber-right');
    const thermLeft = document.getElementById('therm-left');
    const thermRight = document.getElementById('therm-right');
    const labelT1 = document.getElementById('label-t1');
    const labelT2 = document.getElementById('label-t2');
    const qGroup = document.getElementById('q-group');
    const qArrowPath = document.getElementById('q-arrow-path');
    const qArrowHead = document.getElementById('q-arrow-head');
    const qText = document.getElementById('q-text');
    const qVec = document.getElementById('q-vec');
    const qVecHead = document.getElementById('q-vec-head');
    const eqText = document.getElementById('eq-text');

    // Physics Constants
    const V_MAX = 450; // Max velocity in px/s
    const RADIUS = 6;
    const BOUNDS = {
        left: { minX: 100 + RADIUS, maxX: 350 - RADIUS, minY: 100 + RADIUS, maxY: 400 - RADIUS },
        right: { minX: 450 + RADIUS, maxX: 700 - RADIUS, minY: 100 + RADIUS, maxY: 400 - RADIUS }
    };

    // Color Interpolation (Red/Blue to Purple)
    function getChamberColor(T, isLeft) {
        const red = [255, 51, 102];
        const blue = [67, 97, 238];
        const purple = [114, 9, 183];

        let startColor, endColor, p;
        if (isLeft) {
            startColor = red; endColor = purple;
            p = (1.0 - T) / 0.45; 
        } else {
            startColor = blue; endColor = purple;
            p = (T - 0.1) / 0.45;
        }
        p = Math.max(0, Math.min(1, p));

        const r = Math.round(startColor[0] + p * (endColor[0] - startColor[0]));
        const g = Math.round(startColor[1] + p * (endColor[1] - startColor[1]));
        const b = Math.round(startColor[2] + p * (endColor[2] - startColor[2]));
        return { rgb: `rgb(${r}, ${g}, ${b})`, rgba: `rgba(${r}, ${g}, ${b}, 0.05)` };
    }

    function updateDOM(T1, T2) {
        const cLeft = getChamberColor(T1, true);
        const cRight = getChamberColor(T2, false);

        // Update Chambers
        chamberLeft.setAttribute('stroke', cLeft.rgb);
        chamberLeft.setAttribute('fill', cLeft.rgba);
        chamberRight.setAttribute('stroke', cRight.rgb);
        chamberRight.setAttribute('fill', cRight.rgba);

        // Update Labels
        labelT1.setAttribute('fill', cLeft.rgb);
        labelT2.setAttribute('fill', cRight.rgb);

        // Update Thermometers (Max height 292, min height 29)
        const h1 = 29.2 + 262.8 * T1;
        const h2 = 29.2 + 262.8 * T2;
        thermLeft.setAttribute('height', h1);
        thermLeft.setAttribute('y', 104 + 292 - h1);
        thermLeft.setAttribute('fill', cLeft.rgb);
        
        thermRight.setAttribute('height', h2);
        thermRight.setAttribute('y', 104 + 292 - h2);
        thermRight.setAttribute('fill', cRight.rgb);

        // Update Particles Color
        pLeft.forEach(p => p.el.setAttribute('fill', cLeft.rgb));
        pRight.forEach(p => p.el.setAttribute('fill', cRight.rgb));

        // Update Q Arrow (Fades out as delta T approaches 0)
        const deltaT = T1 - T2;
        const qOpacity = Math.max(0, deltaT / 0.9);
        qGroup.setAttribute('opacity', qOpacity);
        
        // Color Q arrow based on left chamber
        qArrowPath.setAttribute('stroke', cLeft.rgb);
        qArrowHead.setAttribute('fill', cLeft.rgb);
        qText.setAttribute('fill', cLeft.rgb);
        qVec.setAttribute('stroke', cLeft.rgb);
        qVecHead.setAttribute('fill', cLeft.rgb);

        // Update Equilibrium Text
        const eqOpacity = T1 === T2 ? 1 : Math.max(0, 1 - deltaT * 3);
        eqText.setAttribute('opacity', eqOpacity);
    }

    function updateParticles(particles, T, bounds, dt) {
        // v_rms is proportional to sqrt(T)
        const speed = V_MAX * Math.sqrt(T);
        
        particles.forEach(p => {
            p.x += p.vx * speed * dt;
            p.y += p.vy * speed * dt;

            // Elastic collisions with walls
            if (p.x <= bounds.minX) { p.x = bounds.minX; p.vx *= -1; }
            if (p.x >= bounds.maxX) { p.x = bounds.maxX; p.vx *= -1; }
            if (p.y <= bounds.minY) { p.y = bounds.minY; p.vy *= -1; }
            if (p.y >= bounds.maxY) { p.y = bounds.maxY; p.vy *= -1; }

            p.el.setAttribute('cx', p.x);
            p.el.setAttribute('cy', p.y);
        });
    }

    let lastTime = performance.now();
    
    function animate(time) {
        const dt = Math.min((time - lastTime) / 1000, 0.05); // Cap dt to prevent tunneling
        lastTime = time;

        // 12-second animation loop
        const loopTime = time % 12000;
        let T1, T2;

        if (loopTime < 3000) {
            // Phase 1: Initial State
            T1 = 1.0; T2 = 0.1;
        } else if (loopTime < 8000) {
            // Phase 2: Energy Transfer
            const p = (loopTime - 3000) / 5000;
            const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; // easeInOutQuad
            T1 = 1.0 - 0.45 * ease;
            T2 = 0.1 + 0.45 * ease;
        } else if (loopTime < 10000) {
            // Phase 3: Equilibrium
            T1 = 0.55; T2 = 0.55;
        } else {
            // Phase 4: Reset
            const p = (loopTime - 10000) / 2000;
            const ease = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
            T1 = 0.55 + 0.45 * ease;
            T2 = 0.55 - 0.45 * ease;
        }

        updateDOM(T1, T2);
        updateParticles(pLeft, T1, BOUNDS.left, dt);
        updateParticles(pRight, T2, BOUNDS.right, dt);

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
</script>

</body>
</html>
