<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Stabilization of Phenoxide Ion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animation Classes */
        .anim-h-move { animation: moveH 12s ease-in-out infinite; }
        .anim-fade-h-plus { animation: fadeHPlus 12s ease-in-out infinite; }
        .anim-fade-oh { animation: fadeOH 12s ease-in-out infinite; }
        .anim-fade-olp3 { animation: fadeOLP3 12s ease-in-out infinite; }
        .anim-fade-ominus { animation: fadeOMinus 12s ease-in-out infinite; }
        
        .anim-fade-copi { animation: fadeCOPi 12s ease-in-out infinite; }
        .anim-fade-pi16 { animation: fadePi16 12s ease-in-out infinite; }
        .anim-fade-c6 { animation: fadeC6 12s ease-in-out infinite; }
        
        .anim-fade-pi56 { animation: fadePi56 12s ease-in-out infinite; }
        .anim-fade-pi45 { animation: fadePi45 12s ease-in-out infinite; }
        .anim-fade-c4 { animation: fadeC4 12s ease-in-out infinite; }
        
        .anim-fade-pi34 { animation: fadePi34 12s ease-in-out infinite; }
        .anim-fade-pi23 { animation: fadePi23 12s ease-in-out infinite; }
        .anim-fade-c2 { animation: fadeC2 12s ease-in-out infinite; }
        
        .anim-fade-pi12 { animation: fadePi12 12s ease-in-out infinite; }

        .arrow {
            fill: none;
            stroke: #F77F00;
            stroke-width: 2.5;
            stroke-linecap: round;
            marker-end: url(#arrowhead);
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            opacity: 0;
        }

        .anim-draw-a1 { animation: drawA1 12s ease-in-out infinite; }
        .anim-draw-a2 { animation: drawA2 12s ease-in-out infinite; }
        .anim-draw-a3 { animation: drawA3 12s ease-in-out infinite; }
        .anim-draw-a4 { animation: drawA4 12s ease-in-out infinite; }
        .anim-draw-a5 { animation: drawA5 12s ease-in-out infinite; }
        .anim-draw-a6 { animation: drawA6 12s ease-in-out infinite; }
        .anim-draw-a7 { animation: drawA7 12s ease-in-out infinite; }
        .anim-draw-a8 { animation: drawA8 12s ease-in-out infinite; }

        .anim-label-deloc { animation: fadeLabelDeloc 12s ease-in-out infinite; }
        .anim-label-ortho1 { animation: fadeLabelOrtho1 12s ease-in-out infinite; }
        .anim-label-para { animation: fadeLabelPara 12s ease-in-out infinite; }
        .anim-label-ortho2 { animation: fadeLabelOrtho2 12s ease-in-out infinite; }

        /* Keyframes */
        @keyframes moveH {
            0%, 5% { transform: translate(0, 0); }
            12.5%, 83.3% { transform: translate(108px, -36px); }
            95.8%, 100% { transform: translate(0, 0); }
        }
        @keyframes fadeHPlus {
            0%, 5% { opacity: 0; }
            12.5%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }
        @keyframes fadeOH {
            0%, 5% { opacity: 1; }
            12.5%, 83.3% { opacity: 0; }
            95.8%, 100% { opacity: 1; }
        }
        @keyframes fadeOLP3 {
            0%, 5% { opacity: 0; }
            12.5%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }
        @keyframes fadeOMinus {
            0%, 5% { opacity: 0; }
            12.5%, 16.6% { opacity: 1; }
            29.1%, 66.6% { opacity: 0; }
            79.1%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }
        
        @keyframes fadeCOPi {
            0%, 25% { opacity: 0; }
            29.1%, 66.6% { opacity: 1; }
            79.1%, 100% { opacity: 0; }
        }
        @keyframes fadePi16 {
            0%, 25% { opacity: 1; }
            29.1%, 83.3% { opacity: 0; }
            95.8%, 100% { opacity: 1; }
        }
        @keyframes fadeC6 {
            0%, 25% { opacity: 0; }
            29.1%, 33.3% { opacity: 1; }
            45.8%, 100% { opacity: 0; }
        }

        @keyframes fadePi56 {
            0%, 41.6% { opacity: 0; }
            45.8%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }
        @keyframes fadePi45 {
            0%, 41.6% { opacity: 1; }
            45.8%, 83.3% { opacity: 0; }
            95.8%, 100% { opacity: 1; }
        }
        @keyframes fadeC4 {
            0%, 41.6% { opacity: 0; }
            45.8%, 50.0% { opacity: 1; }
            62.5%, 100% { opacity: 0; }
        }

        @keyframes fadePi34 {
            0%, 58.3% { opacity: 0; }
            62.5%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }
        @keyframes fadePi23 {
            0%, 58.3% { opacity: 1; }
            62.5%, 83.3% { opacity: 0; }
            95.8%, 100% { opacity: 1; }
        }
        @keyframes fadeC2 {
            0%, 58.3% { opacity: 0; }
            62.5%, 66.6% { opacity: 1; }
            79.1%, 100% { opacity: 0; }
        }

        @keyframes fadePi12 {
            0%, 75.0% { opacity: 0; }
            79.1%, 83.3% { opacity: 1; }
            95.8%, 100% { opacity: 0; }
        }

        @keyframes drawA1 {
            0%, 16.6% { stroke-dashoffset: 100; opacity: 0; }
            16.7% { opacity: 1; }
            26.6% { stroke-dashoffset: 0; opacity: 1; }
            29.1%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA2 {
            0%, 16.6% { stroke-dashoffset: 100; opacity: 0; }
            16.7% { opacity: 1; }
            26.6% { stroke-dashoffset: 0; opacity: 1; }
            29.1%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA3 {
            0%, 33.3% { stroke-dashoffset: 100; opacity: 0; }
            33.4% { opacity: 1; }
            43.3% { stroke-dashoffset: 0; opacity: 1; }
            45.8%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA4 {
            0%, 33.3% { stroke-dashoffset: 100; opacity: 0; }
            33.4% { opacity: 1; }
            43.3% { stroke-dashoffset: 0; opacity: 1; }
            45.8%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA5 {
            0%, 50.0% { stroke-dashoffset: 100; opacity: 0; }
            50.1% { opacity: 1; }
            60.0% { stroke-dashoffset: 0; opacity: 1; }
            62.5%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA6 {
            0%, 50.0% { stroke-dashoffset: 100; opacity: 0; }
            50.1% { opacity: 1; }
            60.0% { stroke-dashoffset: 0; opacity: 1; }
            62.5%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA7 {
            0%, 66.6% { stroke-dashoffset: 100; opacity: 0; }
            66.7% { opacity: 1; }
            76.6% { stroke-dashoffset: 0; opacity: 1; }
            79.1%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes drawA8 {
            0%, 66.6% { stroke-dashoffset: 100; opacity: 0; }
            66.7% { opacity: 1; }
            76.6% { stroke-dashoffset: 0; opacity: 1; }
            79.1%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes fadeLabelDeloc {
            0%, 16.6% { opacity: 0; }
            20.0%, 75.0% { opacity: 1; }
            79.1%, 100% { opacity: 0; }
        }
        @keyframes fadeLabelOrtho1 {
            0%, 25.0% { opacity: 0; }
            29.1%, 45.8% { opacity: 1; }
            48.0%, 100% { opacity: 0; }
        }
        @keyframes fadeLabelPara {
            0%, 41.6% { opacity: 0; }
            45.8%, 62.5% { opacity: 1; }
            65.0%, 100% { opacity: 0; }
        }
        @keyframes fadeLabelOrtho2 {
            0%, 58.3% { opacity: 0; }
            62.5%, 79.1% { opacity: 1; }
            82.0%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 10 5 L 0 8 z" fill="#F77F00" />
        </marker>
    </defs>

    <!-- Title -->
    <text x="400" y="45" font-size="22" font-weight="bold" text-anchor="middle" fill="#333">Resonance Stabilization of Phenoxide Ion</text>

    <!-- Dynamic Labels -->
    <text x="400" y="90" font-size="14" fill="#F77F00" text-anchor="middle" font-style="italic" class="anim-label-deloc">Lone pair delocalization</text>
    <text x="250" y="235" font-size="14" fill="#7209B7" text-anchor="middle" font-weight="600" class="anim-label-ortho1">Ortho position</text>
    <text x="400" y="380" font-size="14" fill="#7209B7" text-anchor="middle" font-weight="600" class="anim-label-para">Para position</text>
    <text x="550" y="235" font-size="14" fill="#7209B7" text-anchor="middle" font-weight="600" class="anim-label-ortho2">Ortho position</text>

    <!-- Chemical Formulas -->
    <g font-family="'Roboto Mono', monospace" font-size="16" fill="#404040">
        <!-- Left: Phenol -->
        <text x="150" y="420" text-anchor="middle">C<tspan dy="5" font-size="12">6</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="12">5</tspan><tspan dy="-5">OH</tspan></text>
        <text x="150" y="445" font-family="Inter" font-size="14" fill="#666" text-anchor="middle">Phenol</text>
        
        <!-- Center: pKa -->
        <text x="400" y="430" text-anchor="middle" fill="#7209B7">pK<tspan dy="5" font-size="12">a</tspan><tspan dy="-5"> ≈ 10</tspan></text>

        <!-- Right: Phenoxide + H+ -->
        <text x="650" y="420" text-anchor="middle">C<tspan dy="5" font-size="12">6</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="12">5</tspan><tspan dy="-5">O</tspan><tspan dy="-8" font-size="12" fill="#FF4444">-</tspan><tspan dy="8"> + H</tspan><tspan dy="-8" font-size="12" fill="#4444FF">+</tspan></text>
        <text x="650" y="445" font-family="Inter" font-size="14" fill="#666" text-anchor="middle">Phenoxide Ion</text>
    </g>

    <!-- Legend -->
    <g transform="translate(250, 465)">
        <rect x="0" y="0" width="300" height="24" rx="4" fill="#f8f9fa" stroke="#e0e0e0"/>
        <circle cx="20" cy="12" r="5" fill="#FF4444"/> <text x="30" y="16" font-size="12" fill="#555">Oxygen</text>
        <circle cx="95" cy="12" r="5" fill="#404040"/> <text x="105" y="16" font-size="12" fill="#555">Carbon</text>
        <circle cx="170" cy="12" r="5" fill="#CCCCCC"/> <text x="180" y="16" font-size="12" fill="#555">Hydrogen</text>
        <line x1="250" y1="12" x2="270" y2="12" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
    </g>

    <!-- MOLECULE STRUCTURE -->
    <g id="molecule">
        <!-- Sigma Bonds (Benzene Ring) -->
        <polygon points="400,200 452,230 452,290 400,320 348,290 348,230" fill="none" stroke="#333333" stroke-width="3"/>
        
        <!-- C-O Sigma Bond -->
        <line x1="400" y1="200" x2="400" y2="150" stroke="#333333" stroke-width="3"/>

        <!-- O-H Sigma Bond -->
        <line id="o-h-bond" x1="408" y1="135" x2="435" y2="120" stroke="#333333" stroke-width="3" class="anim-fade-oh"/>

        <!-- Pi Bonds (Inner Lines) -->
        <g stroke="#555555" stroke-width="4" opacity="0.8">
            <!-- Initial Kekule Structure -->
            <line id="pi-c1-c6" x1="400" y1="212" x2="358.5" y2="236" class="anim-fade-pi16"/>
            <line id="pi-c2-c3" x1="441.5" y1="236" x2="441.5" y2="284" class="anim-fade-pi23"/>
            <line id="pi-c4-c5" x1="400" y1="308" x2="358.5" y2="284" class="anim-fade-pi45"/>
            
            <!-- Resonance Pi Bonds -->
            <line id="c-o-pi-bond" x1="392" y1="198" x2="392" y2="152" class="anim-fade-copi"/>
            <line id="pi-c5-c6" x1="358.5" y1="284" x2="358.5" y2="236" class="anim-fade-pi56"/>
            <line id="pi-c3-c4" x1="441.5" y1="284" x2="400" y2="308" class="anim-fade-pi34"/>
            <line id="pi-c1-c2" x1="400" y1="212" x2="441.5" y2="236" class="anim-fade-pi12"/>
        </g>

        <!-- Oxygen Atom & Lone Pairs -->
        <circle cx="400" cy="140" r="12" fill="#FF4444"/>
        <text x="400" y="145" fill="white" font-size="14" text-anchor="middle" font-weight="bold">O</text>
        
        <!-- O Lone Pairs -->
        <circle cx="386" cy="133" r="2.5" fill="#FFD700"/>
        <circle cx="386" cy="139" r="2.5" fill="#FFD700"/>
        <circle cx="397" cy="124" r="2.5" fill="#FFD700"/>
        <circle cx="403" cy="124" r="2.5" fill="#FFD700"/>
        <g class="anim-fade-olp3">
            <circle cx="414" cy="133" r="2.5" fill="#FFD700"/>
            <circle cx="414" cy="139" r="2.5" fill="#FFD700"/>
        </g>
        
        <!-- O Formal Charge (-) -->
        <g transform="translate(422, 120)" class="anim-fade-ominus">
            <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#FF4444" stroke-width="1.5"/>
            <line x1="-3" y1="0" x2="3" y2="0" stroke="#FF4444" stroke-width="2"/>
        </g>

        <!-- Hydrogen Atom (Moves) -->
        <g class="anim-h-move">
            <circle cx="442" cy="116" r="8" fill="#CCCCCC"/>
            <text x="442" y="120" fill="#333" font-size="10" text-anchor="middle" font-weight="bold">H</text>
            <!-- H+ Formal Charge -->
            <g transform="translate(452, 106)" class="anim-fade-h-plus">
                <circle cx="0" cy="0" r="6" fill="#ffffff" stroke="#4444FF" stroke-width="1.5"/>
                <line x1="-3" y1="0" x2="3" y2="0" stroke="#4444FF" stroke-width="1.5"/>
                <line x1="0" y1="-3" x2="0" y2="3" stroke="#4444FF" stroke-width="1.5"/>
            </g>
        </g>

        <!-- C6 (Ortho Left) Lone Pair & Charge -->
        <g class="anim-fade-c6">
            <circle cx="335" cy="220" r="2.5" fill="#FFD700"/>
            <circle cx="339" cy="216" r="2.5" fill="#FFD700"/>
            <g transform="translate(325, 210)">
                <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#FF4444" stroke-width="1.5"/>
                <line x1="-3" y1="0" x2="3" y2="0" stroke="#FF4444" stroke-width="2"/>
            </g>
        </g>

        <!-- C4 (Para) Lone Pair & Charge -->
        <g class="anim-fade-c4">
            <circle cx="396" cy="332" r="2.5" fill="#FFD700"/>
            <circle cx="404" cy="332" r="2.5" fill="#FFD700"/>
            <g transform="translate(400, 345)">
                <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#FF4444" stroke-width="1.5"/>
                <line x1="-3" y1="0" x2="3" y2="0" stroke="#FF4444" stroke-width="2"/>
            </g>
        </g>

        <!-- C2 (Ortho Right) Lone Pair & Charge -->
        <g class="anim-fade-c2">
            <circle cx="461" cy="216" r="2.5" fill="#FFD700"/>
            <circle cx="465" cy="220" r="2.5" fill="#FFD700"/>
            <g transform="translate(475, 210)">
                <circle cx="0" cy="0" r="7" fill="#ffffff" stroke="#FF4444" stroke-width="1.5"/>
                <line x1="-3" y1="0" x2="3" y2="0" stroke="#FF4444" stroke-width="2"/>
            </g>
        </g>
    </g>

    <!-- CURLY ARROWS (Electron Flow) -->
    <g>
        <!-- Arrow 1: O Lone Pair to C-O Bond -->
        <path d="M 416 136 C 440 136, 440 170, 408 175" pathLength="100" class="arrow anim-draw-a1"/>
        
        <!-- Arrow 2: C1=C6 Pi Bond to C6 -->
        <path d="M 380 220 C 360 200, 340 200, 335 220" pathLength="100" class="arrow anim-draw-a2"/>
        
        <!-- Arrow 3: C6 Lone Pair to C5-C6 Bond -->
        <path d="M 330 240 C 310 250, 310 280, 345 275" pathLength="100" class="arrow anim-draw-a3"/>
        
        <!-- Arrow 4: C4=C5 Pi Bond to C4 -->
        <path d="M 375 295 C 360 320, 380 340, 395 335" pathLength="100" class="arrow anim-draw-a4"/>
        
        <!-- Arrow 5: C4 Lone Pair to C3-C4 Bond -->
        <path d="M 410 335 C 430 345, 450 330, 435 305" pathLength="100" class="arrow anim-draw-a5"/>
        
        <!-- Arrow 6: C2=C3 Pi Bond to C2 -->
        <path d="M 445 265 C 465 270, 475 250, 460 230" pathLength="100" class="arrow anim-draw-a6"/>
        
        <!-- Arrow 7: C2 Lone Pair to C1-C2 Bond -->
        <path d="M 460 215 C 470 190, 440 180, 425 205" pathLength="100" class="arrow anim-draw-a7"/>
        
        <!-- Arrow 8: C=O Pi Bond to O -->
        <path d="M 392 175 C 370 175, 370 145, 385 140" pathLength="100" class="arrow anim-draw-a8"/>
    </g>

</svg>

</body>
</html>
