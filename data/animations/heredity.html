<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mechanism of Heredity: Allele Segregation and Recombination</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        .title { font-weight: 700; font-size: 24px; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-weight: 600; font-size: 14px; fill: #7F8C8D; text-anchor: middle; }
        .label { font-weight: 600; font-size: 14px; fill: #34495E; text-anchor: middle; }
        .process-label { font-weight: 600; font-size: 12px; fill: #95A5A6; text-anchor: middle; letter-spacing: 1px; text-transform: uppercase; }
        .genotype { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; }
        
        .membrane { stroke: #4A90D9; stroke-width: 3; fill: #E8F4FD; filter: drop-shadow(0px 4px 6px rgba(74, 144, 217, 0.2)); }
        .nucleus { fill: #2C3E50; opacity: 0.1; stroke: #2C3E50; stroke-width: 1.5; stroke-dasharray: 4,4; }
        
        .path-line {
            stroke: #BDC3C7;
            stroke-width: 2;
            stroke-dasharray: 8,8;
            animation: flow 1.5s linear infinite;
        }

        @keyframes flow {
            to { stroke-dashoffset: -16; }
        }

        /* 36-second Master Loop (3 cycles of 12s each to show Bb, BB, bb combinations) */
        
        .parent-cells { animation: parentFade 36s linear infinite; }
        @keyframes parentFade {
            0%, 5.55% { opacity: 1; }
            8.33%, 30.55% { opacity: 0; }
            33.33%, 38.88% { opacity: 1; }
            41.66%, 63.88% { opacity: 0; }
            66.66%, 72.22% { opacity: 1; }
            75%, 97.22% { opacity: 0; }
            100% { opacity: 1; }
        }

        .gamete-cells { animation: gameteFade 36s linear infinite; }
        @keyframes gameteFade {
            0%, 5.55% { opacity: 0; }
            8.33%, 13.88% { opacity: 1; }
            16.66%, 38.88% { opacity: 0; }
            41.66%, 47.22% { opacity: 1; }
            50%, 72.22% { opacity: 0; }
            75%, 80.55% { opacity: 1; }
            83.33%, 100% { opacity: 0; }
        }

        .zygote-cell { animation: zygoteFade 36s linear infinite; }
        @keyframes zygoteFade {
            0%, 13.88% { opacity: 0; transform: scale(0.8); transform-origin: 400px 420px; }
            16.66%, 27.77% { opacity: 1; transform: scale(1); transform-origin: 400px 420px; }
            30.55%, 47.22% { opacity: 0; transform: scale(0.8); transform-origin: 400px 420px; }
            50%, 61.11% { opacity: 1; transform: scale(1); transform-origin: 400px 420px; }
            63.88%, 80.55% { opacity: 0; transform: scale(0.8); transform-origin: 400px 420px; }
            83.33%, 94.44% { opacity: 1; transform: scale(1); transform-origin: 400px 420px; }
            97.22%, 100% { opacity: 0; transform: scale(0.8); transform-origin: 400px 420px; }
        }

        /* Chromosome Movements */
        .c1 { animation: c1-move 36s linear infinite; }
        @keyframes c1-move {
            0%, 5.55% { transform: translate(240px, 100px); opacity: 1; }
            8.33%, 13.88% { transform: translate(150px, 260px); opacity: 1; }
            16.66%, 30.55% { transform: translate(150px, 260px); opacity: 0; }
            32% { transform: translate(240px, 100px); opacity: 0; }
            33.33%, 38.88% { transform: translate(240px, 100px); opacity: 1; }
            41.66%, 47.22% { transform: translate(150px, 260px); opacity: 1; }
            50%, 61.11% { transform: translate(390px, 420px); opacity: 1; }
            63.88% { transform: translate(390px, 420px); opacity: 0; }
            65% { transform: translate(240px, 100px); opacity: 0; }
            66.66%, 72.22% { transform: translate(240px, 100px); opacity: 1; }
            75%, 80.55% { transform: translate(150px, 260px); opacity: 1; }
            83.33%, 97.22% { transform: translate(150px, 260px); opacity: 0; }
            99% { transform: translate(240px, 100px); opacity: 0; }
            100% { transform: translate(240px, 100px); opacity: 1; }
        }

        .c2 { animation: c2-move 36s linear infinite; }
        @keyframes c2-move {
            0%, 5.55% { transform: translate(260px, 100px); opacity: 1; }
            8.33%, 13.88% { transform: translate(350px, 260px); opacity: 1; }
            16.66%, 27.77% { transform: translate(390px, 420px); opacity: 1; }
            30.55% { transform: translate(390px, 420px); opacity: 0; }
            32% { transform: translate(260px, 100px); opacity: 0; }
            33.33%, 38.88% { transform: translate(260px, 100px); opacity: 1; }
            41.66%, 47.22% { transform: translate(350px, 260px); opacity: 1; }
            50%, 63.88% { transform: translate(350px, 260px); opacity: 0; }
            65% { transform: translate(260px, 100px); opacity: 0; }
            66.66%, 72.22% { transform: translate(260px, 100px); opacity: 1; }
            75%, 80.55% { transform: translate(350px, 260px); opacity: 1; }
            83.33%, 94.44% { transform: translate(390px, 420px); opacity: 1; }
            97.22% { transform: translate(390px, 420px); opacity: 0; }
            99% { transform: translate(260px, 100px); opacity: 0; }
            100% { transform: translate(260px, 100px); opacity: 1; }
        }

        .c3 { animation: c3-move 36s linear infinite; }
        @keyframes c3-move {
            0%, 5.55% { transform: translate(540px, 100px); opacity: 1; }
            8.33%, 13.88% { transform: translate(450px, 260px); opacity: 1; }
            16.66%, 27.77% { transform: translate(410px, 420px); opacity: 1; }
            30.55% { transform: translate(410px, 420px); opacity: 0; }
            32% { transform: translate(540px, 100px); opacity: 0; }
            33.33%, 38.88% { transform: translate(540px, 100px); opacity: 1; }
            41.66%, 47.22% { transform: translate(450px, 260px); opacity: 1; }
            50%, 61.11% { transform: translate(410px, 420px); opacity: 1; }
            63.88% { transform: translate(410px, 420px); opacity: 0; }
            65% { transform: translate(540px, 100px); opacity: 0; }
            66.66%, 72.22% { transform: translate(540px, 100px); opacity: 1; }
            75%, 80.55% { transform: translate(450px, 260px); opacity: 1; }
            83.33%, 97.22% { transform: translate(450px, 260px); opacity: 0; }
            99% { transform: translate(540px, 100px); opacity: 0; }
            100% { transform: translate(540px, 100px); opacity: 1; }
        }

        .c4 { animation: c4-move 36s linear infinite; }
        @keyframes c4-move {
            0%, 5.55% { transform: translate(560px, 100px); opacity: 1; }
            8.33%, 13.88% { transform: translate(650px, 260px); opacity: 1; }
            16.66%, 30.55% { transform: translate(650px, 260px); opacity: 0; }
            32% { transform: translate(560px, 100px); opacity: 0; }
            33.33%, 38.88% { transform: translate(560px, 100px); opacity: 1; }
            41.66%, 47.22% { transform: translate(650px, 260px); opacity: 1; }
            50%, 63.88% { transform: translate(650px, 260px); opacity: 0; }
            65% { transform: translate(560px, 100px); opacity: 0; }
            66.66%, 72.22% { transform: translate(560px, 100px); opacity: 1; }
            75%, 80.55% { transform: translate(650px, 260px); opacity: 1; }
            83.33%, 94.44% { transform: translate(410px, 420px); opacity: 1; }
            97.22% { transform: translate(410px, 420px); opacity: 0; }
            99% { transform: translate(560px, 100px); opacity: 0; }
            100% { transform: translate(560px, 100px); opacity: 1; }
        }

        /* Phenotype & Genotype Text Animations */
        .cycle1-text { animation: showCycle1 36s linear infinite; }
        @keyframes showCycle1 {
            0%, 19.44% { opacity: 0; transform: translateY(10px); }
            22.22%, 27.77% { opacity: 1; transform: translateY(0); }
            30.55%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        .cycle2-text { animation: showCycle2 36s linear infinite; }
        @keyframes showCycle2 {
            0%, 52.77% { opacity: 0; transform: translateY(10px); }
            55.55%, 61.11% { opacity: 1; transform: translateY(0); }
            63.88%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        .cycle3-text { animation: showCycle3 36s linear infinite; }
        @keyframes showCycle3 {
            0%, 86.11% { opacity: 0; transform: translateY(10px); }
            88.88%, 94.44% { opacity: 1; transform: translateY(0); }
            97.22%, 100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
    <title>The Mechanism of Heredity</title>
    <desc>Animated diagram showing meiosis and fertilization. Two heterozygous parents (Bb) produce haploid gametes which fuse to form an F1 zygote, demonstrating the Law of Segregation and resulting phenotypic variation.</desc>

    <defs>
        <!-- Chromosome Templates -->
        <g id="chromo-P1-B">
            <rect x="-6" y="-25" width="12" height="50" rx="6" fill="#FF6B6B" />
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
            <rect x="-6" y="-15" width="12" height="8" fill="#F1C40F" />
            <text x="-12" y="-7" class="genotype" fill="#F1C40F" text-anchor="end">B</text>
        </g>
        <g id="chromo-P1-b">
            <rect x="-6" y="-25" width="12" height="50" rx="6" fill="#FF6B6B" />
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
            <rect x="-6" y="-15" width="12" height="8" fill="#8E44AD" />
            <text x="12" y="-7" class="genotype" fill="#8E44AD" text-anchor="start">b</text>
        </g>
        <g id="chromo-P2-B">
            <rect x="-6" y="-25" width="12" height="50" rx="6" fill="#4A90D9" />
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
            <rect x="-6" y="-15" width="12" height="8" fill="#F1C40F" />
            <text x="-12" y="-7" class="genotype" fill="#F1C40F" text-anchor="end">B</text>
        </g>
        <g id="chromo-P2-b">
            <rect x="-6" y="-25" width="12" height="50" rx="6" fill="#4A90D9" />
            <circle cx="0" cy="0" r="3" fill="#ffffff" />
            <rect x="-6" y="-15" width="12" height="8" fill="#8E44AD" />
            <text x="12" y="-7" class="genotype" fill="#8E44AD" text-anchor="start">b</text>
        </g>

        <!-- Phenotype Flowers -->
        <g id="flower-yellow">
            <circle cx="0" cy="-12" r="10" fill="#F1C40F" />
            <circle cx="11" cy="-4" r="10" fill="#F1C40F" />
            <circle cx="7" cy="10" r="10" fill="#F1C40F" />
            <circle cx="-7" cy="10" r="10" fill="#F1C40F" />
            <circle cx="-11" cy="-4" r="10" fill="#F1C40F" />
            <circle cx="0" cy="0" r="7" fill="#E67E22" />
        </g>
        <g id="flower-purple">
            <circle cx="0" cy="-12" r="10" fill="#8E44AD" />
            <circle cx="11" cy="-4" r="10" fill="#8E44AD" />
            <circle cx="7" cy="10" r="10" fill="#8E44AD" />
            <circle cx="-7" cy="10" r="10" fill="#8E44AD" />
            <circle cx="-11" cy="-4" r="10" fill="#8E44AD" />
            <circle cx="0" cy="0" r="7" fill="#F1C40F" />
        </g>
    </defs>

    <!-- Static Background UI -->
    <text x="400" y="40" class="title">Heredity: Inheritance &amp; Variation</text>
    <text x="400" y="65" class="subtitle">Allele Segregation and Recombination</text>

    <!-- Legend -->
    <g transform="translate(620, 20)">
        <rect x="0" y="0" width="160" height="70" fill="#ffffff" stroke="#BDC3C7" rx="6" />
        <text x="80" y="20" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Allele Key</text>
        <rect x="15" y="30" width="12" height="12" rx="2" fill="#F1C40F" />
        <text x="35" y="41" font-size="12" fill="#34495E">Dominant (B)</text>
        <rect x="15" y="48" width="12" height="12" rx="2" fill="#8E44AD" />
        <text x="35" y="59" font-size="12" fill="#34495E">Recessive (b)</text>
    </g>

    <!-- Stage Labels -->
    <text x="100" y="105" class="label" text-anchor="end">Parental (2n)</text>
    <text x="100" y="265" class="label" text-anchor="end">Gametes (n)</text>
    <text x="100" y="425" class="label" text-anchor="end">Zygote (2n)</text>

    <!-- Process Labels -->
    <text x="400" y="180" class="process-label">Meiosis (Segregation)</text>
    <text x="400" y="340" class="process-label">Fertilization (Syngamy)</text>

    <!-- Connectors (Pathways) -->
    <g class="pathways">
        <!-- P1 to Gametes -->
        <line x1="250" y1="150" x2="150" y2="225" class="path-line" />
        <line x1="250" y1="150" x2="350" y2="225" class="path-line" />
        <!-- P2 to Gametes -->
        <line x1="550" y1="150" x2="450" y2="225" class="path-line" />
        <line x1="550" y1="150" x2="650" y2="225" class="path-line" />
        <!-- Gametes to Zygote -->
        <line x1="150" y1="295" x2="380" y2="380" class="path-line" />
        <line x1="350" y1="295" x2="390" y2="380" class="path-line" />
        <line x1="450" y1="295" x2="410" y2="380" class="path-line" />
        <line x1="650" y1="295" x2="420" y2="380" class="path-line" />
    </g>

    <!-- Cells Layer -->
    <g class="parent-cells">
        <!-- Parent 1 -->
        <circle cx="250" cy="100" r="50" class="membrane" />
        <circle cx="250" cy="100" r="30" class="nucleus" />
        <text x="250" y="170" class="genotype" fill="#34495E" text-anchor="middle">Bb</text>
        
        <!-- Parent 2 -->
        <circle cx="550" cy="100" r="50" class="membrane" />
        <circle cx="550" cy="100" r="30" class="nucleus" />
        <text x="550" y="170" class="genotype" fill="#34495E" text-anchor="middle">Bb</text>
    </g>

    <g class="gamete-cells">
        <!-- G1 -->
        <circle cx="150" cy="260" r="35" class="membrane" />
        <circle cx="150" cy="260" r="20" class="nucleus" />
        <!-- G2 -->
        <circle cx="350" cy="260" r="35" class="membrane" />
        <circle cx="350" cy="260" r="20" class="nucleus" />
        <!-- G3 -->
        <circle cx="450" cy="260" r="35" class="membrane" />
        <circle cx="450" cy="260" r="20" class="nucleus" />
        <!-- G4 -->
        <circle cx="650" cy="260" r="35" class="membrane" />
        <circle cx="650" cy="260" r="20" class="nucleus" />
    </g>

    <g class="zygote-cell">
        <!-- Zygote -->
        <circle cx="400" cy="420" r="55" class="membrane" />
        <circle cx="400" cy="420" r="35" class="nucleus" />
    </g>

    <!-- Chromosomes Layer (Animated) -->
    <use href="#chromo-P1-B" class="c1" x="0" y="0" />
    <use href="#chromo-P1-b" class="c2" x="0" y="0" />
    <use href="#chromo-P2-B" class="c3" x="0" y="0" />
    <use href="#chromo-P2-b" class="c4" x="0" y="0" />

    <!-- Dynamic Labels & Phenotypes Layer -->
    
    <!-- Cycle 1: Bb (Yellow) -->
    <g class="cycle1-text">
        <text x="400" y="505" class="genotype" font-size="18" fill="#2C3E50" text-anchor="middle">Genotype: Bb</text>
        <text x="400" y="525" font-size="14" font-weight="600" fill="#F39C12" text-anchor="middle">Phenotype: Dominant</text>
        <use href="#flower-yellow" x="480" y="420" transform="scale(1.5) translate(-160, -140)" />
    </g>

    <!-- Cycle 2: BB (Yellow) -->
    <g class="cycle2-text">
        <text x="400" y="505" class="genotype" font-size="18" fill="#2C3E50" text-anchor="middle">Genotype: BB</text>
        <text x="400" y="525" font-size="14" font-weight="600" fill="#F39C12" text-anchor="middle">Phenotype: Dominant</text>
        <use href="#flower-yellow" x="480" y="420" transform="scale(1.5) translate(-160, -140)" />
    </g>

    <!-- Cycle 3: bb (Purple) -->
    <g class="cycle3-text">
        <text x="400" y="505" class="genotype" font-size="18" fill="#2C3E50" text-anchor="middle">Genotype: bb</text>
        <text x="400" y="525" font-size="14" font-weight="600" fill="#8E44AD" text-anchor="middle">Phenotype: Recessive</text>
        <use href="#flower-purple" x="480" y="420" transform="scale(1.5) translate(-160, -140)" />
    </g>

</svg>

</body>
</html>
