<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemistry: The Central Science</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .phase-a {
            transform-origin: 400px 250px;
            animation: phaseA 15s infinite ease-in-out;
        }

        .fe-atom {
            animation: feColor 15s infinite ease-in-out;
        }

        .stone-group {
            transform-origin: 400px 250px;
            animation: pulseStone 2s infinite alternate ease-in-out;
        }

        .sparkle {
            opacity: 0;
            animation: sparkleAnim 15s infinite ease-in-out;
        }
        .s1 { transform-origin: 350px 200px; animation-delay: 0.1s; }
        .s2 { transform-origin: 450px 220px; animation-delay: 0.3s; }
        .s3 { transform-origin: 380px 280px; animation-delay: 0.2s; }
        .s4 { transform-origin: 420px 180px; animation-delay: 0.4s; }

        .ts-halo {
            transform-origin: 400px 250px;
            animation: tsHalo 15s infinite ease-out;
        }

        .molecules {
            transform-origin: 400px 250px;
            animation: moleculesAnim 15s infinite ease-in-out;
        }

        .web {
            animation: webAnim 15s infinite ease-in-out;
        }

        .clip-circle {
            transform-origin: 400px 250px;
            animation: expandClip 15s infinite ease-in-out;
        }

        .branch-content {
            animation: showBranches 15s infinite ease-in-out;
        }

        .h1-group {
            transform-origin: 400px 190px;
            animation: vibrateH1 0.6s infinite alternate ease-in-out;
        }

        .h2-group {
            transform-origin: 400px 190px;
            animation: vibrateH2 0.6s infinite alternate ease-in-out;
        }

        .o1-group {
            animation: stretchO1 0.8s infinite alternate ease-in-out;
        }

        .o2-group {
            animation: stretchO2 0.8s infinite alternate ease-in-out;
        }

        /* Keyframes */
        @keyframes phaseA {
            0%, 26.66% { opacity: 1; transform: scale(1); }
            33.33% { opacity: 0; transform: scale(1.5); }
            93.33%, 100% { opacity: 0; transform: scale(1.5); }
        }

        @keyframes feColor {
            0%, 18% { fill: #848482; }
            22%, 33.33% { fill: #FFD700; }
            34%, 100% { fill: #848482; }
        }

        @keyframes pulseStone {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        @keyframes sparkleAnim {
            0%, 18% { opacity: 0; transform: scale(0) rotate(0deg); }
            21%, 28% { opacity: 1; transform: scale(1.5) rotate(45deg); }
            31%, 100% { opacity: 0; transform: scale(0) rotate(90deg); }
        }

        @keyframes tsHalo {
            0%, 26% { r: 0; opacity: 0; stroke: #44CC44; stroke-width: 8px; }
            28% { opacity: 1; }
            35%, 100% { r: 400; opacity: 0; stroke-width: 1px; }
        }

        @keyframes moleculesAnim {
            0%, 33.33% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
            40%, 86.66% { opacity: 1; transform: scale(1) rotate(0deg); }
            93.33%, 100% { opacity: 0; transform: scale(0.8) rotate(10deg); }
        }

        @keyframes webAnim {
            0%, 40% { opacity: 0; }
            45%, 86.66% { opacity: 1; }
            93.33%, 100% { opacity: 0; }
        }

        @keyframes expandClip {
            0%, 66.66% { transform: scale(0); }
            73.33%, 90% { transform: scale(1); }
            93.33%, 100% { transform: scale(0); }
        }

        @keyframes showBranches {
            0%, 66.66% { opacity: 0; transform: translateY(15px); }
            73.33%, 90% { opacity: 1; transform: translateY(0); }
            93.33%, 100% { opacity: 0; transform: translateY(-15px); }
        }

        @keyframes vibrateH1 {
            from { transform: rotate(-3deg); }
            to { transform: rotate(3deg); }
        }

        @keyframes vibrateH2 {
            from { transform: rotate(3deg); }
            to { transform: rotate(-3deg); }
        }

        @keyframes stretchO1 {
            from { transform: translateX(0); }
            to { transform: translateX(-2px); }
        }

        @keyframes stretchO2 {
            from { transform: translateX(0); }
            to { transform: translateX(2px); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>The Evolution of Chemistry: From Alchemy to the Central Science</title>
        <desc>An animated diagram showing the transition from an alchemical iron lattice and Philosopher's Stone to modern molecular chemistry, highlighting H2O and CO2 connecting to Biology, Physics, Medicine, and Geology.</desc>

        <defs>
            <!-- Philosopher's Stone Glow -->
            <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFF5C3" stop-opacity="1" />
                <stop offset="40%" stop-color="#FFD700" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
            </radialGradient>

            <!-- Drop Shadow for Molecules -->
            <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
            </filter>

            <!-- Arrow Markers -->
            <marker id="purple-arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#7209B7" />
            </marker>
            <marker id="orange-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#F77F00" />
            </marker>

            <!-- Web Clip Path -->
            <clipPath id="web-clip">
                <circle cx="400" cy="250" r="450" class="clip-circle" />
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="45" font-family="Inter" font-size="24" font-weight="bold" text-anchor="middle" fill="#333333">Chemistry: The Central Science</text>

        <!-- Legend -->
        <g transform="translate(20, 470)" font-family="Inter" font-size="11" fill="#555">
            <circle cx="0" cy="-4" r="5" fill="#FF4444"/> <text x="10" y="0">Oxygen</text>
            <circle cx="70" cy="-4" r="5" fill="#404040"/> <text x="80" y="0">Carbon</text>
            <circle cx="140" cy="-4" r="5" fill="#CCCCCC"/> <text x="150" y="0">Hydrogen</text>
            <circle cx="225" cy="-4" r="5" fill="#848482"/> <text x="235" y="0">Iron</text>
            <circle cx="280" cy="-4" r="5" fill="#FFD700"/> <text x="290" y="0">Gold</text>
            <line x1="340" y1="-4" x2="360" y2="-4" stroke="#F77F00" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#orange-arrow)"/> <text x="370" y="0">Electron Flow</text>
            <line x1="465" y1="-4" x2="485" y2="-4" stroke="#7209B7" stroke-width="2" marker-end="url(#purple-arrow)"/> <text x="495" y="0">Reaction / Connection</text>
        </g>

        <!-- Transition State Halo -->
        <circle cx="400" cy="250" class="ts-halo" />

        <!-- PHASE A: ALCHEMY -->
        <g id="phase-a" class="phase-a">
            <!-- Iron Lattice (3x3 Grid) -->
            <g filter="url(#drop-shadow)">
                <circle cx="340" cy="190" r="15" class="fe-atom" />
                <circle cx="400" cy="190" r="15" class="fe-atom" />
                <circle cx="460" cy="190" r="15" class="fe-atom" />
                <circle cx="340" cy="250" r="15" class="fe-atom" />
                <!-- Center atom is hidden behind the stone -->
                <circle cx="460" cy="250" r="15" class="fe-atom" />
                <circle cx="340" cy="310" r="15" class="fe-atom" />
                <circle cx="400" cy="310" r="15" class="fe-atom" />
                <circle cx="460" cy="310" r="15" class="fe-atom" />
            </g>

            <!-- Transmutation Sparkles -->
            <path class="sparkle s1" d="M350,192 Q350,200 358,200 Q350,200 350,208 Q350,200 342,200 Q350,200 350,192" fill="#FFF" />
            <path class="sparkle s2" d="M450,212 Q450,220 458,220 Q450,220 450,228 Q450,220 442,220 Q450,220 450,212" fill="#FFF" />
            <path class="sparkle s3" d="M380,272 Q380,280 388,280 Q380,280 380,288 Q380,280 372,280 Q380,280 380,272" fill="#FFF" />
            <path class="sparkle s4" d="M420,172 Q420,180 428,180 Q420,180 420,188 Q420,180 412,180 Q420,180 420,172" fill="#FFF" />

            <!-- Philosopher's Stone -->
            <g class="stone-group">
                <circle cx="400" cy="250" r="70" fill="url(#goldGlow)" />
                <polygon points="400,210 425,250 400,250" fill="#FFE55C" />
                <polygon points="400,250 425,250 400,290" fill="#D4AF37" />
                <polygon points="400,250 400,290 375,250" fill="#AA8C2C" />
                <polygon points="400,210 400,250 375,250" fill="#E5C158" />
            </g>

            <!-- Alchemy Labels -->
            <text x="400" y="140" text-anchor="middle" font-family="Inter" font-size="16" font-weight="bold" fill="#D4AF37">Philosopher's Stone (Paras)</text>
            <text x="400" y="360" text-anchor="middle" font-family="Inter" font-size="16" font-weight="bold" fill="#848482">Base Metal (Fe)</text>
        </g>

        <!-- PHASE B: MODERN CHEMISTRY -->
        <g id="phase-b" class="web">
            
            <!-- Central Web Arrows (Clipped for animation) -->
            <g clip-path="url(#web-clip)">
                <line x1="400" y1="250" x2="240" y2="130" stroke="#7209B7" stroke-width="4" marker-end="url(#purple-arrow)" />
                <line x1="400" y1="250" x2="560" y2="130" stroke="#7209B7" stroke-width="4" marker-end="url(#purple-arrow)" />
                <line x1="400" y1="250" x2="240" y2="370" stroke="#7209B7" stroke-width="4" marker-end="url(#purple-arrow)" />
                <line x1="400" y1="250" x2="560" y2="370" stroke="#7209B7" stroke-width="4" marker-end="url(#purple-arrow)" />
            </g>

            <!-- Branch Icons & Labels -->
            <g class="branch-content">
                <!-- Biology -->
                <g transform="translate(200, 90)">
                    <text x="0" y="-40" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16" fill="#7209B7">Biology</text>
                    <path d="M-10,-20 C10,-5 10,5 -10,20" stroke="#7209B7" stroke-width="3" fill="none"/>
                    <path d="M10,-20 C-10,-5 -10,5 10,20" stroke="#7209B7" stroke-width="3" fill="none"/>
                    <line x1="-5" y1="-10" x2="5" y2="-10" stroke="#7209B7" stroke-width="2"/>
                    <line x1="-8" y1="0" x2="8" y2="0" stroke="#7209B7" stroke-width="2"/>
                    <line x1="-5" y1="10" x2="5" y2="10" stroke="#7209B7" stroke-width="2"/>
                </g>

                <!-- Physics -->
                <g transform="translate(600, 90)">
                    <text x="0" y="-40" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16" fill="#7209B7">Physics</text>
                    <ellipse cx="0" cy="0" rx="22" ry="8" stroke="#7209B7" stroke-width="2" fill="none" transform="rotate(30)" />
                    <ellipse cx="0" cy="0" rx="22" ry="8" stroke="#7209B7" stroke-width="2" fill="none" transform="rotate(90)" />
                    <ellipse cx="0" cy="0" rx="22" ry="8" stroke="#7209B7" stroke-width="2" fill="none" transform="rotate(150)" />
                    <circle cx="0" cy="0" r="4" fill="#7209B7" />
                </g>

                <!-- Medicine -->
                <g transform="translate(200, 410)">
                    <text x="0" y="45" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16" fill="#7209B7">Medicine</text>
                    <rect x="-6" y="-18" width="12" height="36" rx="2" fill="#7209B7" />
                    <rect x="-18" y="-6" width="36" height="12" rx="2" fill="#7209B7" />
                </g>

                <!-- Geology -->
                <g transform="translate(600, 410)">
                    <text x="0" y="45" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16" fill="#7209B7">Geology</text>
                    <polygon points="0,-20 15,10 5,20 -5,20 -15,10" fill="none" stroke="#7209B7" stroke-width="2" stroke-linejoin="round"/>
                    <line x1="0" y1="-20" x2="0" y2="20" stroke="#7209B7" stroke-width="2"/>
                    <line x1="-15" y1="10" x2="15" y2="10" stroke="#7209B7" stroke-width="2"/>
                </g>
            </g>

            <!-- Central Molecules -->
            <g class="molecules" filter="url(#drop-shadow)">
                
                <!-- Water (H2O) -->
                <g>
                    <text x="400" y="135" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#333">Water (H<tspan baseline-shift="sub" font-size="10">2</tspan>O)</text>
                    
                    <!-- H1 and Bond -->
                    <g class="h1-group">
                        <line x1="400" y1="190" x2="368" y2="214" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <circle cx="368" cy="214" r="10" fill="#CCCCCC" />
                        <!-- Electron flow dipole arrow -->
                        <line x1="375" y1="208" x2="390" y2="197" stroke="#F77F00" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#orange-arrow)" />
                    </g>
                    
                    <!-- H2 and Bond -->
                    <g class="h2-group">
                        <line x1="400" y1="190" x2="432" y2="214" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <circle cx="432" cy="214" r="10" fill="#CCCCCC" />
                        <!-- Electron flow dipole arrow -->
                        <line x1="425" y1="208" x2="410" y2="197" stroke="#F77F00" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#orange-arrow)" />
                    </g>
                    
                    <!-- Oxygen -->
                    <circle cx="400" cy="190" r="18" fill="#FF4444" />
                </g>

                <!-- Carbon Dioxide (CO2) -->
                <g>
                    <text x="400" y="365" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#333">Carbon Dioxide (CO<tspan baseline-shift="sub" font-size="10">2</tspan>)</text>
                    
                    <!-- O1 and Double Bond -->
                    <g class="o1-group">
                        <line x1="358" y1="306" x2="382" y2="306" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <line x1="358" y1="314" x2="382" y2="314" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <circle cx="340" cy="310" r="18" fill="#FF4444" />
                        <!-- Dipole arrow -->
                        <line x1="375" y1="295" x2="355" y2="295" stroke="#F77F00" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#orange-arrow)" />
                    </g>

                    <!-- O2 and Double Bond -->
                    <g class="o2-group">
                        <line x1="418" y1="306" x2="442" y2="306" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <line x1="418" y1="314" x2="442" y2="314" stroke="#333333" stroke-width="4" stroke-linecap="round" />
                        <circle cx="460" cy="310" r="18" fill="#FF4444" />
                        <!-- Dipole arrow -->
                        <line x1="425" y1="295" x2="445" y2="295" stroke="#F77F00" stroke-width="2" stroke-dasharray="2,2" marker-end="url(#orange-arrow)" />
                    </g>

                    <!-- Carbon -->
                    <circle cx="400" cy="310" r="18" fill="#404040" />
                </g>
            </g>
        </g>
    </svg>
</div>

</body>
</html>
