<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas Laws in Physiology: Boyle's Law & Ventilation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #2C3E50;
            font-size: 24px;
            margin-top: 20px;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            color: #4A90D9;
            font-size: 16px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* CSS Animations - 8 Second Loop */
        /* 0-40%: Inspiration, 40-50%: Pause, 50-90%: Expiration, 90-100%: Pause */
        
        .lung-anim {
            transform-origin: 240px 160px;
            animation: lungExpand 8s ease-in-out infinite;
        }
        @keyframes lungExpand {
            0%, 100% { transform: scale(1); }
            40%, 50% { transform: scale(1.12) translateY(5px); }
        }

        .rib-anim {
            transform-origin: 240px 240px;
            animation: ribExpand 8s ease-in-out infinite;
        }
        @keyframes ribExpand {
            0%, 100% { transform: scale(1); }
            40%, 50% { transform: scaleX(1.05) scaleY(1.02); }
        }

        .vol-bar {
            transform-origin: bottom;
            animation: volChange 8s ease-in-out infinite;
        }
        @keyframes volChange {
            0%, 100% { height: 40px; y: 160px; fill: #E74C3C; }
            40%, 50% { height: 120px; y: 80px; fill: #2ECC71; }
        }

        .pres-bar {
            transform-origin: bottom;
            animation: presChange 8s ease-in-out infinite;
        }
        @keyframes presChange {
            0%, 100% { height: 120px; y: 80px; fill: #E74C3C; }
            40%, 50% { height: 40px; y: 160px; fill: #2ECC71; }
        }

        .insp-text { animation: showInsp 8s infinite; }
        @keyframes showInsp {
            0%, 5% { opacity: 0; }
            10%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .exp-text { animation: showExp 8s infinite; }
        @keyframes showExp {
            0%, 45% { opacity: 0; }
            50%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        .flow-o2 { animation: o2Move 8s infinite; }
        @keyframes o2Move {
            0%, 5% { opacity: 0; transform: translateY(-20px); }
            10% { opacity: 1; }
            35% { opacity: 1; transform: translateY(140px); }
            40%, 100% { opacity: 0; transform: translateY(140px); }
        }

        .flow-co2 { animation: co2Move 8s infinite; }
        @keyframes co2Move {
            0%, 50% { opacity: 0; transform: translateY(140px); }
            55% { opacity: 1; transform: translateY(140px); }
            85% { opacity: 1; transform: translateY(-20px); }
            90%, 100% { opacity: 0; transform: translateY(-20px); }
        }

        .alveolar-o2 { animation: alvO2 8s infinite; }
        @keyframes alvO2 {
            0%, 5% { opacity: 0; transform: translate(0, 0); }
            10% { opacity: 1; }
            35% { opacity: 1; transform: translate(40px, 60px); }
            40%, 100% { opacity: 0; transform: translate(40px, 60px); }
        }

        .alveolar-co2 { animation: alvCO2 8s infinite; }
        @keyframes alvCO2 {
            0%, 50% { opacity: 0; transform: translate(0, 0); }
            55% { opacity: 1; }
            85% { opacity: 1; transform: translate(-40px, -60px); }
            90%, 100% { opacity: 0; transform: translate(-40px, -60px); }
        }

        .mono { font-family: 'Roboto Mono', monospace; }
        .label { font-size: 12px; fill: #2C3E50; font-weight: 600; }
        .label-line { stroke: #2C3E50; stroke-width: 1.5; stroke-dasharray: 2,2; }
    </style>
</head>
<body>

    <h1>Gas Laws in Physiology: Boyle's Law & Ventilation</h1>
    <div class="subtitle">P ∝ 1/V (Pressure is inversely proportional to Volume)</div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Animated Diagram of Pulmonary Ventilation and Boyle's Law</title>
            <desc>An animation showing the respiratory cycle. During inspiration, the diaphragm flattens, lung volume increases, and pressure decreases, drawing O2 in. During expiration, the diaphragm domes, lung volume decreases, and pressure increases, forcing CO2 out.</desc>

            <defs>
                <!-- Gradients -->
                <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFD1D9" />
                    <stop offset="100%" stop-color="#FFB6C1" />
                </linearGradient>
                
                <linearGradient id="capillaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#3498DB" />
                    <stop offset="50%" stop-color="#8E44AD" />
                    <stop offset="100%" stop-color="#E74C3C" />
                </linearGradient>

                <!-- Drop Shadow for Cards -->
                <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
                </filter>

                <!-- Arrowhead -->
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
                </marker>

                <!-- Clip Path for Alveolus Inset -->
                <clipPath id="alveolusClip">
                    <circle cx="630" cy="360" r="85" />
                </clipPath>
            </defs>

            <!-- ========================================== -->
            <!-- LEFT PANEL: MACRO ANATOMY (Thoracic Cavity) -->
            <!-- ========================================== -->

            <!-- Pleural Cavity (Dashed Outline) -->
            <path class="lung-anim" d="M 240 130 C 120 120, 60 200, 70 310 C 80 410, 200 420, 240 390 C 280 420, 400 410, 410 310 C 420 200, 360 120, 240 130 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" stroke-dasharray="6,4" />

            <!-- Lungs Group -->
            <g class="lung-anim">
                <!-- Right Lung (Anatomical Left, Viewer's Right) - Has Cardiac Notch -->
                <path d="M 265 175 C 320 160, 370 200, 370 290 C 370 360, 320 380, 260 370 C 245 365, 230 340, 250 310 C 265 285, 250 200, 265 175 Z" fill="url(#lungGrad)" stroke="#FF8DA1" stroke-width="2" />
                
                <!-- Left Lung (Anatomical Right, Viewer's Left) -->
                <path d="M 215 175 C 160 160, 110 200, 110 290 C 110 360, 160 380, 220 370 C 235 365, 240 330, 230 290 C 220 250, 230 200, 215 175 Z" fill="url(#lungGrad)" stroke="#FF8DA1" stroke-width="2" />
            </g>

            <!-- Trachea & Bronchi -->
            <g stroke="#2C3E50" stroke-width="3" fill="none" stroke-linecap="round">
                <!-- Main Trachea -->
                <path d="M 230 60 L 230 150 M 250 60 L 250 150" />
                <!-- Cartilage Rings -->
                <line x1="230" y1="70" x2="250" y2="70" stroke-width="2" />
                <line x1="230" y1="85" x2="250" y2="85" stroke-width="2" />
                <line x1="230" y1="100" x2="250" y2="100" stroke-width="2" />
                <line x1="230" y1="115" x2="250" y2="115" stroke-width="2" />
                <line x1="230" y1="130" x2="250" y2="130" stroke-width="2" />
                <line x1="230" y1="145" x2="250" y2="145" stroke-width="2" />
                <!-- Bronchi -->
                <path d="M 230 150 L 210 180 M 240 160 L 225 190" />
                <path d="M 250 150 L 270 180 M 240 160 L 255 190" />
            </g>

            <!-- Rib Cage (Stylized) -->
            <g class="rib-anim" stroke="#F5F5DC" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.9">
                <path d="M 120 210 Q 240 190 360 210" />
                <path d="M 105 250 Q 240 230 375 250" />
                <path d="M 95 290 Q 240 270 385 290" />
                <path d="M 90 330 Q 240 310 390 330" />
            </g>

            <!-- Diaphragm -->
            <!-- Uses SVG animate for smooth path morphing between dome and flat states -->
            <path fill="none" stroke="#F39C12" stroke-width="12" stroke-linecap="round">
                <animate attributeName="d" 
                         values="M 70 370 Q 240 280 410 370; 
                                 M 70 370 Q 240 390 410 370; 
                                 M 70 370 Q 240 390 410 370; 
                                 M 70 370 Q 240 280 410 370; 
                                 M 70 370 Q 240 280 410 370" 
                         keyTimes="0; 0.4; 0.5; 0.9; 1" 
                         dur="8s" 
                         repeatCount="indefinite" />
            </path>

            <!-- Airflow Particles (O2 In) -->
            <g class="flow-o2">
                <circle cx="240" cy="70" r="4" fill="#E74C3C" />
                <circle cx="235" cy="50" r="4" fill="#E74C3C" />
                <circle cx="245" cy="30" r="4" fill="#E74C3C" />
                <circle cx="220" cy="180" r="3" fill="#E74C3C" />
                <circle cx="260" cy="180" r="3" fill="#E74C3C" />
            </g>

            <!-- Airflow Particles (CO2 Out) -->
            <g class="flow-co2">
                <circle cx="240" cy="70" r="4" fill="#3498DB" />
                <circle cx="235" cy="90" r="4" fill="#3498DB" />
                <circle cx="245" cy="110" r="4" fill="#3498DB" />
                <circle cx="220" cy="180" r="3" fill="#3498DB" />
                <circle cx="260" cy="180" r="3" fill="#3498DB" />
            </g>

            <!-- Anatomical Labels -->
            <line x1="240" y1="90" x2="140" y2="70" class="label-line" />
            <text x="135" y="74" class="label" text-anchor="end">Trachea</text>

            <line x1="100" y1="250" x2="50" y2="250" class="label-line" />
            <text x="45" y="254" class="label" text-anchor="end">Pleural Cavity</text>

            <line x1="350" y1="250" x2="430" y2="250" class="label-line" />
            <text x="435" y="254" class="label" text-anchor="start">Lungs</text>

            <!-- Dynamic Diaphragm Label -->
            <line x1="340" y1="360" x2="430" y2="400" class="label-line" />
            <text x="435" y="404" class="label" text-anchor="start">Diaphragm</text>
            <text x="435" y="420" font-size="11" fill="#F39C12" font-weight="600" class="insp-text" text-anchor="start">(Contracted / Flat)</text>
            <text x="435" y="420" font-size="11" fill="#F39C12" font-weight="600" class="exp-text" text-anchor="start">(Relaxed / Domed)</text>


            <!-- ========================================== -->
            <!-- RIGHT PANEL: DASHBOARD & ALVEOLAR INSET    -->
            <!-- ========================================== -->

            <!-- Dashboard Card -->
            <rect x="490" y="40" width="280" height="190" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#E8F4FD" stroke-width="2"/>
            <text x="630" y="65" font-size="14" font-weight="700" fill="#2C3E50" text-anchor="middle">Gas Law Dashboard</text>
            
            <!-- Bar Chart Axes -->
            <line x1="530" y1="160" x2="730" y2="160" stroke="#2C3E50" stroke-width="2" />
            
            <!-- Volume Bar -->
            <rect class="vol-bar" x="560" width="40" rx="4" />
            <text x="580" y="178" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">Volume (V)</text>
            
            <!-- Pressure Bar -->
            <rect class="pres-bar" x="660" width="40" rx="4" />
            <text x="680" y="178" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">Pressure (P)</text>

            <!-- Dynamic Status Text -->
            <g class="insp-text">
                <text x="630" y="200" font-size="13" font-weight="700" fill="#2ECC71" text-anchor="middle">Inspiration: V ↑ , P ↓</text>
                <text x="630" y="218" font-size="11" fill="#7F8C8D" text-anchor="middle">Air flows IN to equalize pressure</text>
            </g>
            <g class="exp-text">
                <text x="630" y="200" font-size="13" font-weight="700" fill="#E74C3C" text-anchor="middle">Expiration: V ↓ , P ↑</text>
                <text x="630" y="218" font-size="11" fill="#7F8C8D" text-anchor="middle">Air flows OUT to equalize pressure</text>
            </g>

            <!-- Alveolar Inset Card -->
            <rect x="490" y="250" width="280" height="220" rx="12" fill="#ffffff" filter="url(#shadow)" stroke="#E8F4FD" stroke-width="2"/>
            <text x="630" y="275" font-size="14" font-weight="700" fill="#2C3E50" text-anchor="middle">Alveolar Gas Exchange</text>

            <!-- Inset Circle -->
            <circle cx="630" cy="360" r="85" fill="#f8f9fa" stroke="#4A90D9" stroke-width="3" />
            
            <g clip-path="url(#alveolusClip)">
                <!-- Alveolus Interior -->
                <path d="M 540 330 C 540 440, 720 440, 720 330 L 680 250 L 580 250 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4" />
                
                <!-- Pulmonary Capillary -->
                <path d="M 520 390 C 580 470, 680 470, 740 390" fill="none" stroke="url(#capillaryGrad)" stroke-width="24" stroke-linecap="round" />
                
                <!-- Red Blood Cells (Static representation in capillary) -->
                <circle cx="560" cy="415" r="6" fill="#8E44AD" opacity="0.6"/>
                <circle cx="630" cy="435" r="6" fill="#C0392B" opacity="0.6"/>
                <circle cx="700" cy="415" r="6" fill="#E74C3C" opacity="0.6"/>

                <!-- Gas Exchange Particles (O2 into blood) -->
                <g class="alveolar-o2">
                    <circle cx="610" cy="350" r="4" fill="#E74C3C" />
                    <circle cx="625" cy="340" r="4" fill="#E74C3C" />
                    <line x1="620" y1="355" x2="640" y2="385" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
                </g>

                <!-- Gas Exchange Particles (CO2 into alveolus) -->
                <g class="alveolar-co2">
                    <circle cx="650" cy="410" r="4" fill="#3498DB" />
                    <circle cx="665" cy="400" r="4" fill="#3498DB" />
                    <line x1="655" y1="400" x2="635" y2="370" stroke="#3498DB" stroke-width="2" marker-end="url(#arrow)" opacity="0.7"/>
                </g>
            </g>

            <!-- Inset Labels -->
            <text x="630" y="310" font-size="11" fill="#2C3E50" font-weight="600" text-anchor="middle">Alveolus</text>
            <text x="630" y="460" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle" style="text-shadow: 1px 1px 2px #000;">Capillary</text>

            <!-- Boyle's Law Scientific Notation -->
            <text x="400" y="485" class="mono" font-size="18" font-weight="700" fill="#2C3E50" text-anchor="middle">P₁V₁ = P₂V₂</text>

            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g transform="translate(20, 440)">
                <rect x="0" y="0" width="120" height="50" rx="6" fill="#ffffff" filter="url(#shadow)" />
                <circle cx="15" cy="15" r="5" fill="#E74C3C" />
                <text x="28" y="19" font-size="11" fill="#2C3E50">Oxygen (O₂)</text>
                
                <circle cx="15" cy="35" r="5" fill="#3498DB" />
                <text x="28" y="39" font-size="11" fill="#2C3E50">Carbon Dioxide (CO₂)</text>
            </g>

        </svg>
    </div>
</body>
</html>
