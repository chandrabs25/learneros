<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrastructure of Cilia and Flagella</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .sci-term {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            fill: #2C3E50;
        }
        .label-title {
            font-size: 12px;
            font-weight: 600;
        }
        .pointer {
            fill: none;
            stroke: #7F8C8D;
            stroke-width: 1.5;
            stroke-dasharray: 2 2;
        }
        
        /* Animations */
        @keyframes dynein-walk {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(15deg) scaleX(1.1); }
        }
        .dynein {
            transform-origin: 0px -95px;
            animation: dynein-walk 0.5s ease-in-out infinite;
        }
        
        @keyframes axoneme-twist {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }
        #axoneme-doublets {
            transform-origin: 0px 0px;
            animation: axoneme-twist 1s ease-in-out infinite;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Ultrastructure of Cilia and Flagella (9+2 Axoneme)</title>
    <desc>Animated diagram showing the 9+2 microtubule arrangement of an axoneme, alongside the beating patterns of a cilium and a flagellum.</desc>

    <defs>
        <!-- Peripheral Doublet Definition -->
        <g id="doublet">
            <!-- Radial Spoke -->
            <line x1="0" y1="-85" x2="0" y2="-35" stroke="#F39C12" stroke-width="2.5"/>
            <circle cx="0" cy="-35" r="3.5" fill="#F39C12"/>
            
            <!-- Nexin Linker (Connects to next doublet) -->
            <path d="M 5,-95 Q 25,-95 48,-83" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="3 2"/>
            
            <!-- Sub-tubule B (Incomplete, drawn first so A overlaps it) -->
            <circle cx="-16" cy="-95" r="10" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Sub-tubule A (Complete, 13 protofilaments) -->
            <circle cx="0" cy="-95" r="10" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            
            <!-- Dynein Arms (Motor Proteins) -->
            <path d="M 8,-102 Q 25,-108 35,-92" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" class="dynein"/>
            <path d="M 9,-90 Q 20,-90 28,-80" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" class="dynein"/>
        </g>
    </defs>

    <!-- MAIN TITLE -->
    <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700">Ultrastructure of Cilia and Flagella (9+2 Axoneme)</text>
    <line x1="250" y1="45" x2="550" y2="45" stroke="#E8F4FD" stroke-width="2"/>

    <!-- ========================================== -->
    <!-- LEFT SIDE: AXONEME CROSS-SECTION           -->
    <!-- ========================================== -->
    
    <g id="axoneme-cross-section" transform="translate(200, 270)">
        <!-- Plasma Membrane -->
        <circle cx="0" cy="0" r="140" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
        
        <!-- Central Sheath -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#F39C12" stroke-width="2" stroke-dasharray="5 3"/>
        
        <!-- Central Pair Microtubules (Singlets) -->
        <line x1="-12" y1="0" x2="12" y2="0" stroke="#2C3E50" stroke-width="1.5"/>
        <circle cx="-12" cy="0" r="10" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
        <circle cx="12" cy="0" r="10" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>

        <!-- 9 Peripheral Doublets (Animated Twist) -->
        <g id="axoneme-doublets">
            <use href="#doublet" transform="rotate(0)"/>
            <use href="#doublet" transform="rotate(40)"/>
            <use href="#doublet" transform="rotate(80)"/>
            <use href="#doublet" transform="rotate(120)"/>
            <use href="#doublet" transform="rotate(160)"/>
            <use href="#doublet" transform="rotate(200)"/>
            <use href="#doublet" transform="rotate(240)"/>
            <use href="#doublet" transform="rotate(280)"/>
            <use href="#doublet" transform="rotate(320)"/>
        </g>
    </g>

    <!-- Axoneme Labels & Pointers -->
    <g id="axoneme-labels">
        <!-- Plasma Membrane -->
        <text x="20" y="110" class="label-title">Plasma Membrane</text>
        <polyline points="70,115 100,160" class="pointer"/>
        
        <!-- Peripheral Doublet -->
        <text x="20" y="160" class="label-title">Peripheral Doublet (9)</text>
        <text x="20" y="175" class="sci-term">A &amp; B Tubules</text>
        <polyline points="70,180 115,205" class="pointer"/>
        
        <!-- Central Microtubules -->
        <text x="20" y="420" class="label-title">Central Microtubules (2)</text>
        <text x="20" y="435" class="sci-term">Singlets</text>
        <polyline points="80,410 185,280" class="pointer"/>
        
        <!-- Dynein Arms -->
        <text x="380" y="110" text-anchor="end" class="label-title">Dynein Arms</text>
        <text x="380" y="125" text-anchor="end" class="sci-term">Motor Protein</text>
        <polyline points="330,130 260,190" class="pointer"/>
        
        <!-- Radial Spoke -->
        <text x="380" y="170" text-anchor="end" class="label-title">Radial Spoke</text>
        <polyline points="330,175 240,235" class="pointer"/>
        
        <!-- Nexin Linker -->
        <text x="380" y="420" text-anchor="end" class="label-title">Nexin Linker</text>
        <polyline points="330,410 270,340" class="pointer"/>
    </g>


    <!-- ========================================== -->
    <!-- RIGHT SIDE: MOVEMENT COMPARISON            -->
    <!-- ========================================== -->
    
    <!-- Divider Line -->
    <line x1="400" y1="80" x2="400" y2="450" stroke="#E8F4FD" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- TOP RIGHT: Ciliary Movement -->
    <g id="ciliary-movement">
        <text x="600" y="70" text-anchor="middle" class="label-title" font-size="14">Ciliary Movement: Oar-like</text>
        <text x="600" y="85" text-anchor="middle" class="sci-term">Power Stroke &amp; Recovery Stroke</text>
        
        <!-- Cell Body Base -->
        <path d="M 500,220 Q 600,230 700,220 L 700,260 L 500,260 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
        <text x="600" y="245" text-anchor="middle" font-size="10" fill="#4A90D9" font-weight="600">Cell Surface</text>

        <!-- Animated Cilium -->
        <path fill="none" stroke="#98D8C8" stroke-width="6" stroke-linecap="round">
            <animate attributeName="d" 
                values="
                    M 600,220 C 600,150 600,100 600,70; 
                    M 600,220 C 635,185 670,149 706,114; 
                    M 600,220 C 680,200 680,140 650,90; 
                    M 600,220 C 640,180 640,100 600,70; 
                    M 600,220 C 600,150 600,100 600,70" 
                keyTimes="0; 0.15; 0.5; 0.8; 1" 
                dur="1.5s" 
                repeatCount="indefinite" />
        </path>
    </g>

    <!-- BOTTOM RIGHT: Flagellar Movement -->
    <g id="flagellar-movement">
        <text x="600" y="300" text-anchor="middle" class="label-title" font-size="14">Flagellar Movement: Whip-like</text>
        <text x="600" y="315" text-anchor="middle" class="sci-term">Sinusoidal Undulation</text>
        
        <!-- Cell Body Base -->
        <path d="M 450,340 Q 435,380 450,420 L 410,420 L 410,340 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
        <text x="430" y="385" text-anchor="middle" font-size="10" fill="#4A90D9" font-weight="600" transform="rotate(-90, 430, 385)">Cell</text>

        <!-- Animated Flagellum (Traveling Sine Wave) -->
        <path fill="none" stroke="#98D8C8" stroke-width="5" stroke-linecap="round">
            <animate attributeName="d" 
                values="
                    M 450,380 C 480,330 520,330 550,380 C 580,430 620,430 650,380 C 680,330 720,330 750,380;
                    M 450,380 C 480,400 500,430 550,430 C 600,430 600,330 650,330 C 700,330 720,400 750,380;
                    M 450,380 C 480,430 520,430 550,380 C 580,330 620,330 650,380 C 680,430 720,430 750,380;
                    M 450,380 C 480,360 500,330 550,330 C 600,330 600,430 650,430 C 700,430 720,360 750,380;
                    M 450,380 C 480,330 520,330 550,380 C 580,430 620,430 650,380 C 680,330 720,330 750,380" 
                keyTimes="0; 0.25; 0.5; 0.75; 1" 
                dur="1.2s" 
                repeatCount="indefinite" />
        </path>
    </g>

    <!-- ========================================== -->
    <!-- LEGEND / KEY                               -->
    <!-- ========================================== -->
    <g id="legend" transform="translate(180, 470)">
        <rect x="0" y="0" width="12" height="12" fill="#98D8C8" rx="2"/>
        <text x="18" y="10" font-size="11" font-weight="600">Microtubules</text>
        
        <rect x="110" y="0" width="12" height="12" fill="#FF6B6B" rx="2"/>
        <text x="128" y="10" font-size="11" font-weight="600">Dynein</text>
        
        <rect x="190" y="0" width="12" height="12" fill="#F39C12" rx="2"/>
        <text x="208" y="10" font-size="11" font-weight="600">Radial Spokes</text>
        
        <rect x="305" y="0" width="12" height="12" fill="#2C3E50" rx="2"/>
        <text x="323" y="10" font-size="11" font-weight="600">Nexin</text>
    </g>

</svg>

</body>
</html>
