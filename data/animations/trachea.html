<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy and Physiology of the Trachea and Thyroid Gland</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
        }
        .header h1 {
            color: #2C3E50;
            font-size: 24px;
            margin: 0 0 8px 0;
        }
        .header p {
            color: #7F8C8D;
            font-size: 14px;
            margin: 0;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            box-sizing: border-box;
            padding: 10px;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            display: block;
        }
        
        /* Animations */
        @keyframes breathe-trachea {
            0% { transform: scaleX(1); }
            10% { transform: scaleX(1.01); }
            35% { transform: scaleX(1.02); }
            41% { transform: scaleX(1.02); }
            50% { transform: scaleX(1.02); }
            85% { transform: scaleX(1); }
            91% { transform: scaleX(1); }
            100% { transform: scaleX(1); }
        }
        
        @keyframes pulse-thyroid {
            0% { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.15)) brightness(1) saturate(1); transform: scale(1); }
            35% { filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.25)) brightness(0.95) saturate(1.2); transform: scale(1.01); }
            41% { filter: drop-shadow(0px 6px 8px rgba(0,0,0,0.25)) brightness(0.95) saturate(1.2); transform: scale(1.01); }
            85% { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.15)) brightness(1) saturate(1); transform: scale(1); }
            100% { filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.15)) brightness(1) saturate(1); transform: scale(1); }
        }
        
        @keyframes flow-dash {
            0% { stroke-dashoffset: 50; opacity: 0; }
            10% { opacity: 1; }
            35% { stroke-dashoffset: -250; opacity: 1; }
            41% { stroke-dashoffset: -300; opacity: 0; }
            50% { stroke-dashoffset: -300; opacity: 0; }
            55% { opacity: 1; }
            85% { stroke-dashoffset: 0; opacity: 1; }
            91% { stroke-dashoffset: 50; opacity: 0; }
            100% { stroke-dashoffset: 50; opacity: 0; }
        }

        @keyframes muscle-contract {
            0% { transform: scaleX(1); }
            35% { transform: scaleX(1.05); }
            41% { transform: scaleX(1.05); }
            85% { transform: scaleX(0.95); }
            91% { transform: scaleX(0.95); }
            100% { transform: scaleX(1); }
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* CSS Classes for SVG Elements */
        .trachea-anim {
            animation: breathe-trachea 6s infinite ease-in-out;
            transform-origin: 400px 250px;
        }
        .thyroid-anim {
            animation: pulse-thyroid 6s infinite ease-in-out;
            transform-origin: 400px 160px;
        }
        .airflow-stream {
            fill: none;
            stroke: #3498DB;
            stroke-width: 4;
            stroke-linecap: round;
            animation: flow-dash 6s infinite ease-in-out;
        }
        .muscle-anim {
            animation: muscle-contract 6s infinite ease-in-out;
            transform-origin: 140px 348px;
        }
        .particle-pulse {
            animation: pulse-opacity 2s infinite ease-in-out;
        }
        .label-text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .label-sub {
            font-family: 'Inter', sans-serif;
            fill: #7F8C8D;
            font-size: 11px;
        }
        .leader-line {
            fill: none;
            stroke: #34495E;
            stroke-width: 1.5;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Trachea and Thyroid Gland: Anatomical Relationship</h1>
        <p>Illustrating structural support, endocrine placement, and respiratory airflow</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of the Trachea and Thyroid Gland">
            <title>Trachea and Thyroid Gland Anatomy</title>
            <desc>An animated cross-section and anterior view of the human trachea and thyroid gland, showing airflow and structural cartilage rings.</desc>

            <defs>
                <!-- Reusable Tracheal C-Ring -->
                <path id="t-ring" d="M 377 0 Q 400 8 423 0 L 423 8 Q 400 16 377 8 Z" fill="#4A90D9" stroke="#2980B9" stroke-width="1"/>
                
                <!-- Clip path for airflow to stay within trachea -->
                <clipPath id="trachea-clip">
                    <path d="M 377 110 L 377 350 L 340 390 L 360 400 L 390 365 L 400 365 L 410 365 L 440 400 L 460 390 L 423 350 L 423 110 Z"/>
                </clipPath>
            </defs>

            <!-- MAIN ANATOMY GROUP -->
            <g transform="translate(0, 20)">
                
                <!-- Larynx (Superior) -->
                <g aria-label="Larynx">
                    <!-- Epiglottis -->
                    <path d="M 385 60 C 385 30, 415 30, 415 60 Z" fill="#E8F4FD" stroke="#BDC3C7" stroke-width="2"/>
                    <!-- Thyroid Cartilage -->
                    <path d="M 370 60 L 390 60 L 400 70 L 410 60 L 430 60 L 425 90 L 400 105 L 375 90 Z" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2"/>
                    <!-- Cricoid Cartilage -->
                    <rect x="378" y="108" width="44" height="12" rx="4" fill="#BDC3C7" stroke="#95A5A6" stroke-width="2"/>
                </g>

                <!-- Trachea & Airflow -->
                <g class="trachea-anim" aria-label="Trachea">
                    <!-- Trachea Wall (Soft Tissue) -->
                    <path d="M 377 120 L 377 350 L 340 390 L 360 400 L 390 365 L 400 365 L 410 365 L 440 400 L 460 390 L 423 350 L 423 120 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1.5"/>
                    
                    <!-- Airflow Streams (Masked to Trachea) -->
                    <g clip-path="url(#trachea-clip)">
                        <path d="M 400 70 L 400 380" class="airflow-stream" style="stroke-dasharray: 0 18;" />
                        <path d="M 388 70 L 388 350 L 350 390" class="airflow-stream" style="stroke-dasharray: 0 24;" />
                        <path d="M 412 70 L 412 350 L 450 390" class="airflow-stream" style="stroke-dasharray: 0 15;" />
                    </g>

                    <!-- Cartilaginous Rings (12 visible) -->
                    <use href="#t-ring" x="0" y="125"/>
                    <use href="#t-ring" x="0" y="145"/>
                    <use href="#t-ring" x="0" y="165"/>
                    <use href="#t-ring" x="0" y="185"/>
                    <use href="#t-ring" x="0" y="205"/>
                    <use href="#t-ring" x="0" y="225"/>
                    <use href="#t-ring" x="0" y="245"/>
                    <use href="#t-ring" x="0" y="265"/>
                    <use href="#t-ring" x="0" y="285"/>
                    <use href="#t-ring" x="0" y="305"/>
                    <use href="#t-ring" x="0" y="325"/>
                    <use href="#t-ring" x="0" y="345"/>

                    <!-- Bronchi Rings (Angled) -->
                    <path d="M 375 360 L 382 368 L 375 375 L 368 367 Z" fill="#4A90D9"/>
                    <path d="M 360 375 L 367 383 L 360 390 L 353 382 Z" fill="#4A90D9"/>
                    <path d="M 425 360 L 418 368 L 425 375 L 432 367 Z" fill="#4A90D9"/>
                    <path d="M 440 375 L 433 383 L 440 390 L 447 382 Z" fill="#4A90D9"/>
                </g>

                <!-- Thyroid Gland -->
                <g class="thyroid-anim" aria-label="Thyroid Gland">
                    <!-- Main Butterfly Shape -->
                    <path d="M 380 140
                             C 375 120, 365 105, 355 110
                             C 335 130, 335 180, 345 210
                             C 360 215, 375 180, 380 160
                             L 420 160
                             C 425 180, 440 215, 455 210
                             C 465 180, 465 130, 445 110
                             C 435 105, 425 120, 420 140
                             Z" 
                          fill="#F39C12" stroke="#D68910" stroke-width="1.5"/>
                    
                    <!-- Lobular Texture Lines -->
                    <path d="M 355 130 Q 365 145 375 135" stroke="#D68910" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <path d="M 345 170 Q 360 165 370 185" stroke="#D68910" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <path d="M 445 130 Q 435 145 425 135" stroke="#D68910" stroke-width="1.5" fill="none" opacity="0.6"/>
                    <path d="M 455 170 Q 440 165 430 185" stroke="#D68910" stroke-width="1.5" fill="none" opacity="0.6"/>
                </g>

                <!-- LEADER LINES & LABELS -->
                <!-- Larynx -->
                <circle cx="400" cy="70" r="3" fill="#34495E"/>
                <polyline points="400,70 250,70" class="leader-line"/>
                <text x="240" y="66" text-anchor="end" class="label-text" font-size="14" font-weight="bold">Larynx</text>
                <text x="240" y="82" text-anchor="end" class="label-sub">Thyroid &amp; Cricoid Cartilage</text>

                <!-- Thyroid Right Lobe -->
                <circle cx="355" cy="170" r="3" fill="#34495E"/>
                <polyline points="355,170 200,170" class="leader-line"/>
                <text x="190" y="166" text-anchor="end" class="label-text" font-size="14" font-weight="bold">Thyroid Gland</text>
                <text x="190" y="182" text-anchor="end" class="label-sub">Right Lobe (Endocrine)</text>

                <!-- Isthmus -->
                <circle cx="400" cy="150" r="3" fill="#34495E"/>
                <polyline points="400,150 480,110 600,110" class="leader-line"/>
                <text x="610" y="106" text-anchor="start" class="label-text" font-size="14" font-weight="bold">Isthmus</text>
                <text x="610" y="122" text-anchor="start" class="label-sub">Overlies 2nd/3rd tracheal rings</text>

                <!-- Tracheal Rings -->
                <circle cx="423" cy="245" r="3" fill="#34495E"/>
                <polyline points="423,245 480,245 600,245" class="leader-line"/>
                <text x="610" y="241" text-anchor="start" class="label-text" font-size="14" font-weight="bold">Tracheal Rings</text>
                <text x="610" y="257" text-anchor="start" class="label-sub">Hyaline Cartilage (C-shaped)</text>

                <!-- Carina -->
                <circle cx="400" cy="365" r="3" fill="#34495E"/>
                <polyline points="400,365 480,365 600,365" class="leader-line"/>
                <text x="610" y="361" text-anchor="start" class="label-text" font-size="14" font-weight="bold">Carina</text>
                <text x="610" y="377" text-anchor="start" class="label-sub">Bifurcation into primary bronchi</text>
            </g>

            <!-- CROSS-SECTION INSET (Bottom Left) -->
            <g transform="translate(0, 0)" aria-label="Transverse Cross-Section">
                <!-- Inset Background & Border -->
                <circle cx="140" cy="360" r="75" fill="#ffffff" stroke="#BDC3C7" stroke-width="3"/>
                
                <!-- Esophagus (Posterior) -->
                <ellipse cx="140" cy="310" rx="22" ry="12" fill="#98D8C8" stroke="#76B5A6" stroke-width="1.5"/>
                <path d="M 125 310 Q 130 305 135 310 T 145 310 T 155 310" fill="none" stroke="#2C3E50" stroke-width="1"/>
                
                <!-- Trachea Lumen -->
                <circle cx="140" cy="370" r="31" fill="#E8F4FD"/>

                <!-- Airflow Particles inside Cross-Section -->
                <circle cx="130" cy="365" r="3" fill="#3498DB" class="particle-pulse"/>
                <circle cx="150" cy="380" r="4" fill="#3498DB" class="particle-pulse" style="animation-delay: 0.5s;"/>
                <circle cx="140" cy="370" r="5" fill="#3498DB" class="particle-pulse" style="animation-delay: 1s;"/>

                <!-- Trachealis Muscle (Posterior) -->
                <rect x="115" y="344" width="50" height="8" rx="3" fill="#E74C3C" stroke="#C0392B" stroke-width="1" class="muscle-anim"/>

                <!-- C-Shaped Cartilage Ring -->
                <path d="M 108 345 A 42 42 0 1 0 172 345 L 162 352 A 32 32 0 1 1 118 352 Z" fill="#4A90D9" stroke="#2980B9" stroke-width="1.5"/>

                <!-- Inset Labels -->
                <text x="140" y="455" text-anchor="middle" class="label-text" font-size="13" font-weight="bold">Transverse Cross-Section</text>
                <text x="140" y="285" text-anchor="middle" font-family="Inter" font-size="10" font-weight="bold" fill="#E74C3C">POSTERIOR</text>
                <text x="140" y="435" text-anchor="middle" font-family="Inter" font-size="10" font-weight="bold" fill="#3498DB">ANTERIOR</text>

                <!-- Inset Leader Lines -->
                <polyline points="165,310 220,310" class="leader-line" stroke-width="1"/>
                <text x="225" y="314" text-anchor="start" font-family="Inter" font-size="11" font-weight="bold" fill="#76B5A6">Esophagus</text>

                <polyline points="165,348 220,348" class="leader-line" stroke-width="1"/>
                <text x="225" y="352" text-anchor="start" font-family="Inter" font-size="11" font-weight="bold" fill="#C0392B">Trachealis Muscle</text>
            </g>

            <!-- LEGEND -->
            <g transform="translate(620, 400)" aria-label="Legend">
                <rect x="0" y="0" width="160" height="85" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" opacity="0.95"/>
                <text x="10" y="20" class="label-text" font-size="12" font-weight="bold">Legend</text>
                
                <circle cx="15" cy="35" r="5" fill="#4A90D9"/>
                <text x="25" y="39" class="label-text" font-size="11">Hyaline Cartilage</text>
                
                <circle cx="15" cy="52" r="5" fill="#F39C12"/>
                <text x="25" y="56" class="label-text" font-size="11">Thyroid Tissue</text>
                
                <circle cx="15" cy="69" r="5" fill="#3498DB"/>
                <text x="25" y="73" class="label-text" font-size="11">Airflow (O₂/CO₂)</text>
                
                <circle cx="115" cy="35" r="5" fill="#E74C3C"/>
                <text x="125" y="39" class="label-text" font-size="11">Muscle</text>
            </g>

            <!-- FOOTNOTE -->
            <text x="780" y="490" text-anchor="end" font-family="Inter" font-style="italic" font-size="12" fill="#7F8C8D">
                Note: C-shaped rings prevent tracheal collapse during pressure changes.
            </text>

        </svg>
    </div>

</body>
</html>
