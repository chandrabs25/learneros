<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Modification: Recombinant DNA Technology</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Animation Keyframes */
        .scissors-anim {
            animation: scissors-sequence 15s ease-in-out infinite;
            transform-origin: center;
        }

        .donor-left-anim {
            animation: donor-left-sequence 15s ease-in-out infinite;
        }

        .donor-right-anim {
            animation: donor-right-sequence 15s ease-in-out infinite;
        }

        .gene-anim {
            animation: gene-sequence 15s ease-in-out infinite;
        }

        .plasmid-uncut-anim {
            animation: plasmid-uncut-sequence 15s ease-in-out infinite;
        }

        .plasmid-cut-anim {
            animation: plasmid-cut-sequence 15s ease-in-out infinite;
        }

        .ligase-anim {
            animation: ligase-sequence 15s ease-in-out infinite;
            transform-origin: center;
        }

        .clone-anim {
            animation: clone-sequence 15s ease-in-out infinite;
        }

        .host-glow-anim {
            animation: host-glow-sequence 15s ease-in-out infinite;
        }

        .label-ligase {
            animation: label-ligase-sequence 15s ease-in-out infinite;
        }

        @keyframes scissors-sequence {
            0%, 5% { opacity: 0; transform: translateY(-20px); }
            10% { opacity: 1; transform: translateY(0) rotate(0deg); }
            13% { transform: translateY(0) rotate(-20deg); }
            15% { transform: translateY(0) rotate(0deg); opacity: 1; }
            20%, 100% { opacity: 0; transform: translateY(-20px); }
        }

        @keyframes donor-left-sequence {
            0%, 15% { transform: translateX(0); opacity: 1; }
            20%, 95% { transform: translateX(-40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes donor-right-sequence {
            0%, 15% { transform: translateX(0); opacity: 1; }
            20%, 95% { transform: translateX(40px); opacity: 0; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes gene-sequence {
            0%, 20% { transform: translate(0, 0); opacity: 1; }
            35%, 45% { transform: translate(0, 180px); opacity: 1; }
            65%, 95% { transform: translate(425px, 180px); opacity: 1; }
            98%, 100% { transform: translate(425px, 180px); opacity: 0; }
        }

        @keyframes plasmid-uncut-sequence {
            0%, 14% { opacity: 1; }
            15%, 100% { opacity: 0; }
        }

        @keyframes plasmid-cut-sequence {
            0%, 14% { opacity: 0; transform: translate(0, 0); }
            15%, 45% { opacity: 1; transform: translate(0, 0); }
            65%, 95% { opacity: 1; transform: translate(425px, 0); }
            98%, 100% { opacity: 0; transform: translate(425px, 0); }
        }

        @keyframes ligase-sequence {
            0%, 35% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1.2); }
            45%, 100% { opacity: 0; transform: scale(0.5); }
        }

        @keyframes label-ligase-sequence {
            0%, 35% { opacity: 0; }
            40% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }

        @keyframes clone-sequence {
            0%, 70% { opacity: 0; transform: translate(425px, 0); }
            85%, 95% { opacity: 1; transform: translate(465px, -35px); }
            98%, 100% { opacity: 0; transform: translate(465px, -35px); }
        }

        @keyframes host-glow-sequence {
            0%, 65% { filter: drop-shadow(0 0 0px rgba(46, 204, 113, 0)); }
            75%, 95% { filter: drop-shadow(0 0 15px rgba(46, 204, 113, 0.6)); }
            100% { filter: drop-shadow(0 0 0px rgba(46, 204, 113, 0)); }
        }

        .sci-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            fill: #7f8c8d;
        }

        .label-text {
            font-size: 14px;
            font-weight: 600;
            fill: #2C3E50;
        }

        .title-text {
            font-size: 24px;
            font-weight: 700;
            fill: #2C3E50;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="auto" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">The Molecular Mechanism of Genetic Modification</title>
        <desc id="svg-desc">An animated diagram showing the process of Recombinant DNA technology. Restriction enzymes cut a gene of interest from donor DNA and open a plasmid vector. The gene is inserted into the plasmid and sealed by DNA ligase. The recombinant plasmid is then introduced into a host bacterium where it duplicates.</desc>

        <defs>
            <!-- Glow Filter for Ligase -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Molecular Scissors -->
            <g id="scissors" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="-8" cy="12" r="5" />
                <circle cx="8" cy="12" r="5" />
                <line x1="-5" y1="7" x2="12" y2="-12" />
                <line x1="5" y1="7" x2="-12" y2="-12" />
                <circle cx="0" cy="0" r="2" fill="#2C3E50" />
            </g>

            <!-- Gene of Interest -->
            <g id="def-gene">
                <!-- Backbones -->
                <path d="M 125 80 L 225 80" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
                <path d="M 145 100 L 205 100" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
                <!-- Core Rungs -->
                <line x1="145" y1="80" x2="145" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="155" y1="80" x2="155" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="165" y1="80" x2="165" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="175" y1="80" x2="175" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="185" y1="80" x2="185" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="195" y1="80" x2="195" y2="100" stroke="#F39C12" stroke-width="2"/>
                <line x1="205" y1="80" x2="205" y2="100" stroke="#F39C12" stroke-width="2"/>
                <!-- Sticky End Overhangs (Top strand only) -->
                <line x1="125" y1="80" x2="125" y2="90" stroke="#F39C12" stroke-width="2"/>
                <line x1="135" y1="80" x2="135" y2="90" stroke="#F39C12" stroke-width="2"/>
                <line x1="215" y1="80" x2="215" y2="90" stroke="#F39C12" stroke-width="2"/>
                <line x1="225" y1="80" x2="225" y2="90" stroke="#F39C12" stroke-width="2"/>
            </g>

            <!-- Cut Plasmid Vector -->
            <g id="def-plasmid-cut">
                <!-- Circular Backbones -->
                <path d="M 125 260 A 60 60 0 1 0 225 260" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <path d="M 145 280 A 40 40 0 1 0 205 280" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <!-- Sticky End Overhangs (Bottom strand only) -->
                <line x1="125" y1="280" x2="145" y2="280" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <line x1="205" y1="280" x2="225" y2="280" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <!-- Overhang Rungs -->
                <line x1="125" y1="270" x2="125" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="135" y1="270" x2="135" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="215" y1="270" x2="215" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="225" y1="270" x2="225" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <!-- Main Rungs (Simulated with dasharray) -->
                <path d="M 135 270 A 50 50 0 1 0 215 270" fill="none" stroke="#FF6B6B" stroke-width="20" stroke-dasharray="2 12" opacity="0.4"/>
            </g>

            <!-- Uncut Plasmid Vector -->
            <g id="def-plasmid-uncut">
                <use href="#def-plasmid-cut" />
                <!-- Fill the gap -->
                <line x1="125" y1="260" x2="225" y2="260" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <line x1="145" y1="280" x2="205" y2="280" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <line x1="145" y1="260" x2="145" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="155" y1="260" x2="155" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="165" y1="260" x2="165" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="175" y1="260" x2="175" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="185" y1="260" x2="185" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="195" y1="260" x2="195" y2="280" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="205" y1="260" x2="205" y2="280" stroke="#FF6B6B" stroke-width="2"/>
            </g>
        </defs>

        <!-- Background grid/decorations (optional, kept minimal for clarity) -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" class="title-text" text-anchor="middle">Genetic Modification: Recombinant DNA Technology</text>

        <!-- Legend -->
        <g transform="translate(620, 20)">
            <rect x="0" y="0" width="160" height="75" rx="5" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <rect x="10" y="10" width="12" height="12" rx="2" fill="#FF6B6B" />
            <text x="30" y="20" font-size="11" fill="#2C3E50" font-family="Inter">Donor DNA / Plasmid</text>
            
            <rect x="10" y="30" width="12" height="12" rx="2" fill="#F39C12" />
            <text x="30" y="40" font-size="11" fill="#2C3E50" font-family="Inter">Gene of Interest</text>
            
            <rect x="10" y="50" width="12" height="12" rx="2" fill="#98D8C8" />
            <text x="30" y="60" font-size="11" fill="#2C3E50" font-family="Inter">DNA Ligase</text>
        </g>

        <!-- ==================== HOST CELL ==================== -->
        <g class="host-glow-anim">
            <!-- Cell Membrane & Cytoplasm -->
            <rect x="450" y="150" width="300" height="240" rx="120" fill="#E8F4FD" stroke="#4A90D9" stroke-width="6"/>
            <!-- Bacterial Nucleoid (DNA) -->
            <path d="M 500 250 Q 520 180 560 220 T 610 190 T 660 230 T 710 210 T 720 280 T 670 310 T 620 280 T 570 330 T 520 290 Z" fill="none" stroke="#2C3E50" stroke-width="3" opacity="0.3"/>
        </g>
        <text x="600" y="130" class="label-text" text-anchor="middle">Transgenic Host Cell</text>
        <line x1="600" y1="135" x2="600" y2="150" stroke="#2C3E50" stroke-width="1" stroke-dasharray="2 2"/>

        <!-- ==================== DONOR DNA (Left & Right Fragments) ==================== -->
        <g class="donor-left-anim">
            <path d="M 30 80 L 125 80" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            <path d="M 30 100 L 145 100" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            <!-- Rungs -->
            <line x1="45" y1="80" x2="45" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="55" y1="80" x2="55" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="65" y1="80" x2="65" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="75" y1="80" x2="75" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="85" y1="80" x2="85" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="95" y1="80" x2="95" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="105" y1="80" x2="105" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="115" y1="80" x2="115" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <!-- Overhang Rungs -->
            <line x1="125" y1="90" x2="125" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="135" y1="90" x2="135" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <!-- 5' and 3' Labels -->
            <text x="15" y="84" class="sci-text">5'</text>
            <text x="15" y="104" class="sci-text">3'</text>
        </g>

        <g class="donor-right-anim">
            <path d="M 225 80 L 320 80" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            <path d="M 205 100 L 320 100" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
            <!-- Rungs -->
            <line x1="235" y1="80" x2="235" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="245" y1="80" x2="245" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="255" y1="80" x2="255" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="265" y1="80" x2="265" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="275" y1="80" x2="275" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="285" y1="80" x2="285" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="295" y1="80" x2="295" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="305" y1="80" x2="305" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <!-- Overhang Rungs -->
            <line x1="215" y1="90" x2="215" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <line x1="225" y1="90" x2="225" y2="100" stroke="#FF6B6B" stroke-width="2"/>
            <!-- 5' and 3' Labels -->
            <text x="325" y="84" class="sci-text">3'</text>
            <text x="325" y="104" class="sci-text">5'</text>
        </g>

        <!-- ==================== GENE OF INTEREST ==================== -->
        <g class="gene-anim">
            <use href="#def-gene" />
            <text x="175" y="60" class="label-text" text-anchor="middle">Gene of Interest</text>
        </g>

        <!-- ==================== PLASMID VECTOR ==================== -->
        <g class="plasmid-uncut-anim">
            <use href="#def-plasmid-uncut" />
        </g>

        <g class="plasmid-cut-anim">
            <use href="#def-plasmid-cut" />
        </g>

        <text x="175" y="365" class="label-text" text-anchor="middle">Plasmid Vector</text>

        <!-- ==================== CLONED PLASMID ==================== -->
        <g class="clone-anim">
            <use href="#def-plasmid-cut" />
            <g transform="translate(0, 180)">
                <use href="#def-gene" />
            </g>
        </g>

        <!-- ==================== ENZYMES (SCISSORS) ==================== -->
        <!-- Donor Cuts -->
        <g transform="translate(125, 90)">
            <use href="#scissors" class="scissors-anim" />
        </g>
        <g transform="translate(225, 90)">
            <use href="#scissors" class="scissors-anim" />
        </g>
        <!-- Plasmid Cuts -->
        <g transform="translate(125, 270)">
            <use href="#scissors" class="scissors-anim" />
        </g>
        <g transform="translate(225, 270)">
            <use href="#scissors" class="scissors-anim" />
        </g>

        <text x="175" y="150" class="label-text" text-anchor="middle" fill="#2C3E50">Restriction Endonuclease</text>
        <path d="M 175 135 L 140 105" stroke="#2C3E50" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
        <path d="M 175 135 L 210 105" stroke="#2C3E50" stroke-width="1" stroke-dasharray="2 2" fill="none"/>

        <!-- ==================== DNA LIGASE ==================== -->
        <g class="ligase-anim">
            <circle cx="125" cy="270" r="18" fill="#98D8C8" opacity="0.8" filter="url(#glow)"/>
            <circle cx="225" cy="270" r="18" fill="#98D8C8" opacity="0.8" filter="url(#glow)"/>
        </g>
        <text x="175" y="240" class="label-text label-ligase" text-anchor="middle" fill="#27AE60">DNA Ligase</text>

    </svg>
</div>

</body>
</html>
