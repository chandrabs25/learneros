<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuroendocrine Mechanism of Parturition</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        @keyframes fetal-push {
            0% { transform: translateY(0); }
            5%, 70% { transform: translateY(12px); }
            75%, 85% { transform: translateY(20px); }
            95%, 100% { transform: translateY(0); }
        }

        @keyframes cervix-pulse {
            0% { transform: scale(1); fill: #FFD700; }
            5%, 85% { transform: scale(1.5); fill: #FF6B6B; }
            95%, 100% { transform: scale(1); fill: #FFD700; }
        }

        @keyframes nerve-flow {
            0%, 10% { stroke-dashoffset: 100; opacity: 0; }
            15% { opacity: 1; }
            35% { stroke-dashoffset: 0; opacity: 1; }
            40%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes pituitary-glow {
            0%, 30% { fill: #E8F4FD; filter: drop-shadow(0 0 0px #98D8C8); }
            35%, 55% { fill: #98D8C8; filter: drop-shadow(0 0 15px #98D8C8); }
            60%, 100% { fill: #E8F4FD; filter: drop-shadow(0 0 0px #98D8C8); }
        }

        @keyframes oxy-flow {
            0%, 45% { offset-distance: 0%; opacity: 0; transform: scale(0.5); }
            50% { opacity: 1; transform: scale(1); }
            70% { offset-distance: 100%; opacity: 1; transform: scale(1); }
            75%, 100% { offset-distance: 100%; opacity: 0; transform: scale(0.5); }
        }

        @keyframes uterine-contract {
            0%, 65% { transform: scale(1); stroke: #F39C12; }
            75%, 85% { transform: scaleY(0.95) scaleX(0.97); stroke: #E67E22; }
            95%, 100% { transform: scale(1); stroke: #F39C12; }
        }

        @keyframes feedback-pulse {
            0%, 75% { opacity: 0.2; stroke: #2C3E50; }
            80%, 90% { opacity: 1; stroke: #E74C3C; filter: drop-shadow(0 0 5px rgba(231,76,60,0.5)); }
            95%, 100% { opacity: 0.2; stroke: #2C3E50; }
        }

        /* Applying Animations */
        .fetus-group {
            animation: fetal-push 8s ease-in-out infinite;
        }
        .receptor {
            transform-origin: center;
            animation: cervix-pulse 8s ease-in-out infinite;
        }
        .nerve-impulse {
            stroke-dasharray: 100;
            pathLength: 100;
            animation: nerve-flow 8s linear infinite;
        }
        .posterior-pituitary {
            animation: pituitary-glow 8s ease-in-out infinite;
        }
        .oxytocin-cluster {
            offset-path: path('M 672 180 C 670 280, 500 250, 320 250');
            animation: oxy-flow 8s ease-in-out infinite;
        }
        .myometrium {
            transform-origin: 220px 480px;
            animation: uterine-contract 8s ease-in-out infinite;
        }
        .feedback-arrow {
            animation: feedback-pulse 8s ease-in-out infinite;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #E74C3C; }
        .label { font-size: 14px; font-weight: 400; fill: #2C3E50; }
        .label-bold { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .hormone-label { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 500; fill: #98D8C8; }
        .legend-text { font-size: 12px; fill: #2C3E50; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
        <title>Neuroendocrine Mechanism of Parturition</title>
        <desc>An animated diagram showing the positive feedback loop of the fetal ejection reflex, where cervical stretch triggers neural signals to the hypothalamus, releasing oxytocin which causes uterine contractions.</desc>

        <defs>
            <!-- Arrowheads -->
            <marker id="arrow-nerve" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FFD700"/>
            </marker>
            <marker id="arrow-blood" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C"/>
            </marker>
            <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C"/>
            </marker>
            
            <!-- Filters -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Titles -->
        <text x="30" y="40" class="title">Neuroendocrine Mechanism: Parturition</text>
        <text x="30" y="65" class="subtitle">The Fetal Ejection Reflex (Positive Feedback Loop)</text>

        <!-- ==================== UTERUS & FETUS ==================== -->
        <g id="uterus-system">
            <!-- Uterine Cavity (Background) -->
            <path d="M 200 480 C 180 450, 120 350, 120 200 C 120 100, 320 100, 320 200 C 320 350, 260 450, 240 480 Z" fill="#FFFFFF" stroke="#4A90D9" stroke-width="2"/>
            
            <!-- Placenta -->
            <path d="M 160 160 Q 220 130 280 160 Q 250 190 190 190 Z" fill="#CD5C5C"/>
            
            <!-- Fetus Group (Animated) -->
            <g class="fetus-group">
                <!-- Umbilical Cord -->
                <path d="M 220 320 Q 180 280 200 220 T 220 170" fill="none" stroke="#3498DB" stroke-width="4" stroke-linecap="round"/>
                
                <!-- Fetus Body -->
                <path d="M 195 400 C 160 380, 150 280, 220 280 C 280 280, 280 380, 245 400 Z" fill="#E8F4FD" stroke="#2C3E50" stroke-width="3"/>
                
                <!-- Fetus Head -->
                <circle cx="220" cy="420" r="30" fill="#E8F4FD" stroke="#2C3E50" stroke-width="3"/>
                
                <!-- Fetus Details (Eye, Arm, Leg) -->
                <path d="M 210 430 Q 215 425 220 430" fill="none" stroke="#2C3E50" stroke-width="2" stroke-linecap="round"/>
                <path d="M 195 340 C 170 340, 170 380, 200 390" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                <path d="M 245 320 C 270 320, 270 360, 245 380" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Myometrium (Thick Muscle Wall - Animated) -->
            <path class="myometrium" d="M 200 480 C 180 450, 120 350, 120 200 C 120 100, 320 100, 320 200 C 320 350, 260 450, 240 480" fill="none" stroke-width="24" stroke-linecap="round"/>

            <!-- Cervix Stretch Receptors (Animated) -->
            <circle cx="190" cy="460" r="6" class="receptor"/>
            <circle cx="250" cy="460" r="6" class="receptor"/>
        </g>

        <!-- ==================== BRAIN & PITUITARY ==================== -->
        <g id="brain-system">
            <!-- Brain Background Silhouette -->
            <path d="M 580 100 C 550 40, 650 10, 720 30 C 780 50, 780 120, 740 160 C 710 190, 680 180, 670 150 C 650 150, 620 160, 580 100 Z" fill="#E8F4FD" opacity="0.5"/>
            
            <!-- Hypothalamus -->
            <path d="M 620 110 C 640 80, 680 80, 700 110 C 710 130, 680 150, 660 140 C 640 130, 610 130, 620 110 Z" fill="#F5F5DC" stroke="#2C3E50" stroke-width="2"/>
            
            <!-- Pituitary Stalk -->
            <path d="M 655 138 L 655 160 L 665 160 L 665 138 Z" fill="#F5F5DC" stroke="#2C3E50" stroke-width="2"/>
            
            <!-- Anterior Pituitary -->
            <circle cx="648" cy="170" r="10" fill="#FFA07A" stroke="#2C3E50" stroke-width="2"/>
            
            <!-- Posterior Pituitary (Animated Glow) -->
            <circle cx="672" cy="170" r="10" class="posterior-pituitary" stroke="#2C3E50" stroke-width="2"/>
        </g>

        <!-- ==================== PATHWAYS ==================== -->
        
        <!-- Afferent Neural Pathway (Up) -->
        <g id="neural-pathway">
            <!-- Static Base Nerve -->
            <path d="M 250 460 C 350 460, 450 350, 650 120" fill="none" stroke="#FFD700" stroke-width="3" marker-end="url(#arrow-nerve)"/>
            <!-- Animated Nerve Impulse -->
            <path class="nerve-impulse" d="M 250 460 C 350 460, 450 350, 650 120" fill="none" stroke="#FF6B6B" stroke-width="5" stroke-dasharray="10 10" stroke-linecap="round"/>
        </g>

        <!-- Efferent Blood Vessel (Down) -->
        <g id="blood-vessel">
            <path d="M 672 180 C 670 280, 500 250, 320 250" fill="none" stroke="#E74C3C" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blood)"/>
        </g>

        <!-- Oxytocin Particles (Animated along path) -->
        <g class="oxytocin-cluster">
            <circle cx="0" cy="0" r="5" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
            <circle cx="-10" cy="-6" r="4" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
            <circle cx="-8" cy="8" r="4.5" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
        </g>

        <!-- Positive Feedback Loop Arrow -->
        <g id="feedback-loop">
            <path class="feedback-arrow" d="M 310 350 C 450 350, 450 480, 280 480" fill="none" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow-feedback)"/>
            <rect x="350" y="405" width="140" height="24" fill="#f8f9fa" rx="4"/>
            <text x="355" y="422" class="label-bold" fill="#E74C3C">Positive Feedback</text>
        </g>

        <!-- ==================== LABELS & ANNOTATIONS ==================== -->
        
        <!-- Hypothalamus Label -->
        <polyline points="720,80 680,100" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="725" y="85" class="label-bold">Hypothalamus</text>
        
        <!-- Posterior Pituitary Label -->
        <polyline points="720,190 685,175" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="725" y="195" class="label-bold">Posterior Pituitary</text>
        <text x="725" y="210" class="label" font-size="12">(Releases Oxytocin)</text>

        <!-- Oxytocin Label -->
        <polyline points="520,210 560,240" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="440" y="205" class="hormone-label">Oxytocin (OXT)</text>
        <text x="410" y="220" class="label" font-size="12">Travels via bloodstream</text>

        <!-- Myometrium Label -->
        <polyline points="80,250 110,250" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="30" y="245" class="label-bold">Myometrium</text>
        <text x="30" y="260" class="label" font-size="12">Uterine smooth muscle</text>

        <!-- Cervix Label -->
        <polyline points="100,460 180,460" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="30" y="455" class="label-bold">Cervix</text>
        <text x="30" y="470" class="label" font-size="12">Stretch receptors</text>

        <!-- Fetus Label -->
        <polyline points="100,380 180,380" fill="none" stroke="#2C3E50" stroke-width="1"/>
        <text x="30" y="375" class="label-bold">Fetus</text>
        <text x="30" y="390" class="label" font-size="12">Cephalic presentation</text>

        <!-- ==================== LEGEND ==================== -->
        <g transform="translate(600, 400)" filter="url(#shadow)">
            <rect width="170" height="120" fill="#FFFFFF" rx="8" stroke="#E8F4FD" stroke-width="2"/>
            <text x="15" y="25" class="label-bold">Legend</text>
            
            <!-- Muscle -->
            <rect x="15" y="40" width="12" height="12" fill="#F39C12" rx="2"/>
            <text x="35" y="50" class="legend-text">Muscle Tissue</text>
            
            <!-- Nerve -->
            <line x1="15" y1="65" x2="27" y2="65" stroke="#FF6B6B" stroke-width="3" stroke-dasharray="4 2"/>
            <text x="35" y="69" class="legend-text">Neural Signal</text>
            
            <!-- Blood Vessel -->
            <line x1="15" y1="85" x2="27" y2="85" stroke="#E74C3C" stroke-width="4"/>
            <text x="35" y="89" class="legend-text">Blood Vessel</text>
            
            <!-- Oxytocin -->
            <circle cx="21" cy="105" r="5" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
            <text x="35" y="109" class="legend-text">Oxytocin Molecule</text>
        </g>

    </svg>
</div>

</body>
</html>
