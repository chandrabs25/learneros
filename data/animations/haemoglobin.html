<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Dynamics of Haemoglobin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }
        
        /* Animations */
        .hb-complex {
            animation: hb-move 12s linear infinite;
        }
        .aura {
            animation: aura-pulse 12s linear infinite;
        }
        .subunit-alpha1 { animation: shift-alpha1 12s linear infinite; }
        .subunit-beta1 { animation: shift-beta1 12s linear infinite; }
        .subunit-alpha2 { animation: shift-alpha2 12s linear infinite; }
        .subunit-beta2 { animation: shift-beta2 12s linear infinite; }
        
        .heme-1 { animation: color-heme1 12s linear infinite; }
        .heme-2 { animation: color-heme2 12s linear infinite; }
        .heme-3 { animation: color-heme3 12s linear infinite; }
        .heme-4 { animation: color-heme4 12s linear infinite; }

        .o2-1 { animation: move-o2-1 12s linear infinite; }
        .o2-2 { animation: move-o2-2 12s linear infinite; }
        .o2-3 { animation: move-o2-3 12s linear infinite; }
        .o2-4 { animation: move-o2-4 12s linear infinite; }

        .label-lungs { animation: fade-lungs 12s linear infinite; }
        .label-tissues { animation: fade-tissues 12s linear infinite; }

        /* Keyframes for Hb Complex Movement */
        @keyframes hb-move {
            0%, 58.3% { transform: translateX(0); }
            75%, 83.3% { transform: translateX(200px); }
            100% { transform: translateX(0); }
        }

        /* Keyframes for Conformational Shift (T-State to R-State) */
        @keyframes shift-alpha1 {
            0%, 16.6% { transform: translate(-8px, -8px); }
            25%, 58.3% { transform: translate(0, 0); }
            75%, 100% { transform: translate(-8px, -8px); }
        }
        @keyframes shift-beta1 {
            0%, 25% { transform: translate(8px, -8px); }
            31.6%, 58.3% { transform: translate(0, 0); }
            75%, 100% { transform: translate(8px, -8px); }
        }
        @keyframes shift-alpha2 {
            0%, 31.6% { transform: translate(8px, 8px); }
            36.6%, 58.3% { transform: translate(0, 0); }
            75%, 100% { transform: translate(8px, 8px); }
        }
        @keyframes shift-beta2 {
            0%, 36.6% { transform: translate(-8px, 8px); }
            40%, 58.3% { transform: translate(0, 0); }
            75%, 100% { transform: translate(-8px, 8px); }
        }

        /* Keyframes for Heme Color Shift (Venous to Arterial) */
        @keyframes color-heme1 {
            0%, 16.6% { fill: #5B2C6F; }
            25%, 58.3% { fill: #E74C3C; }
            75%, 100% { fill: #5B2C6F; }
        }
        @keyframes color-heme2 {
            0%, 25% { fill: #5B2C6F; }
            31.6%, 58.3% { fill: #E74C3C; }
            75%, 100% { fill: #5B2C6F; }
        }
        @keyframes color-heme3 {
            0%, 31.6% { fill: #5B2C6F; }
            36.6%, 58.3% { fill: #E74C3C; }
            75%, 100% { fill: #5B2C6F; }
        }
        @keyframes color-heme4 {
            0%, 36.6% { fill: #5B2C6F; }
            40%, 58.3% { fill: #E74C3C; }
            75%, 100% { fill: #5B2C6F; }
        }

        /* Keyframes for Central Aura Pulse */
        @keyframes aura-pulse {
            0%, 16.6% { fill: #3498DB; opacity: 0.15; transform: scale(0.9); transform-origin: 400px 250px; }
            40%, 58.3% { fill: #E74C3C; opacity: 0.35; transform: scale(1.1); transform-origin: 400px 250px; }
            75%, 100% { fill: #3498DB; opacity: 0.15; transform: scale(0.9); transform-origin: 400px 250px; }
        }

        /* Keyframes for Oxygen Molecules (Cooperative Binding & Dissociation) */
        @keyframes move-o2-1 {
            0% { transform: translate(50px, 200px) rotate(0deg); opacity: 0; }
            5% { transform: translate(50px, 200px) rotate(0deg); opacity: 1; }
            16.6% { transform: translate(50px, 200px) rotate(0deg); opacity: 1; }
            25% { transform: translate(310px, 200px) rotate(360deg); opacity: 1; }
            58.3% { transform: translate(310px, 200px) rotate(360deg); opacity: 1; }
            75% { transform: translate(750px, 100px) rotate(720deg); opacity: 0; }
            100% { transform: translate(750px, 100px) rotate(720deg); opacity: 0; }
        }
        @keyframes move-o2-2 {
            0% { transform: translate(50px, 150px) rotate(0deg); opacity: 0; }
            5% { transform: translate(50px, 150px) rotate(0deg); opacity: 1; }
            25% { transform: translate(50px, 150px) rotate(0deg); opacity: 1; }
            31.6% { transform: translate(490px, 200px) rotate(360deg); opacity: 1; }
            58.3% { transform: translate(490px, 200px) rotate(360deg); opacity: 1; }
            75% { transform: translate(750px, 200px) rotate(720deg); opacity: 0; }
            100% { transform: translate(750px, 200px) rotate(720deg); opacity: 0; }
        }
        @keyframes move-o2-3 {
            0% { transform: translate(50px, 350px) rotate(0deg); opacity: 0; }
            5% { transform: translate(50px, 350px) rotate(0deg); opacity: 1; }
            31.6% { transform: translate(50px, 350px) rotate(0deg); opacity: 1; }
            36.6% { transform: translate(490px, 300px) rotate(360deg); opacity: 1; }
            58.3% { transform: translate(490px, 300px) rotate(360deg); opacity: 1; }
            75% { transform: translate(750px, 300px) rotate(720deg); opacity: 0; }
            100% { transform: translate(750px, 300px) rotate(720deg); opacity: 0; }
        }
        @keyframes move-o2-4 {
            0% { transform: translate(50px, 300px) rotate(0deg); opacity: 0; }
            5% { transform: translate(50px, 300px) rotate(0deg); opacity: 1; }
            36.6% { transform: translate(50px, 300px) rotate(0deg); opacity: 1; }
            40% { transform: translate(310px, 300px) rotate(360deg); opacity: 1; }
            58.3% { transform: translate(310px, 300px) rotate(360deg); opacity: 1; }
            75% { transform: translate(750px, 400px) rotate(720deg); opacity: 0; }
            100% { transform: translate(750px, 400px) rotate(720deg); opacity: 0; }
        }

        /* Keyframes for Text Labels */
        @keyframes fade-lungs {
            0%, 5% { opacity: 0; transform: translateX(-10px); }
            10%, 40% { opacity: 1; transform: translateX(0); }
            45%, 100% { opacity: 0; transform: translateX(10px); }
        }
        @keyframes fade-tissues {
            0%, 55% { opacity: 0; transform: translateX(-10px); }
            60%, 85% { opacity: 1; transform: translateX(0); }
            90%, 100% { opacity: 0; transform: translateX(10px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing oxygen binding to haemoglobin subunits">
    <title>Haemoglobin Oxygen Transport Mechanism</title>
    <desc>An animation demonstrating the cooperative binding of oxygen to the four subunits of a haemoglobin molecule, transitioning from the tense (deoxy) state to the relaxed (oxy) state.</desc>

    <!-- Definitions for Gradients, Patterns, and Filters -->
    <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e9ecef" stroke-width="1"/>
        </pattern>
        <filter id="blur-large" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="15"/>
        </filter>
        <filter id="blur-small" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3"/>
        </filter>
        <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2C3E50" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Background Grid -->
    <rect width="100%" height="100%" fill="url(#grid)" />

    <!-- Environment Zones -->
    <rect x="0" y="0" width="200" height="500" fill="#3498DB" opacity="0.03"/>
    <rect x="600" y="0" width="200" height="500" fill="#E74C3C" opacity="0.03"/>
    <text x="100" y="480" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle" fill="#3498DB" opacity="0.5" letter-spacing="1">ALVEOLI</text>
    <text x="700" y="480" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle" fill="#E74C3C" opacity="0.5" letter-spacing="1">TISSUES</text>

    <!-- Central Glow / Aura -->
    <circle cx="400" cy="250" r="140" class="aura" filter="url(#blur-large)"/>

    <!-- Main Haemoglobin Complex -->
    <g class="hb-complex" filter="url(#drop-shadow)">
        
        <!-- Alpha 1 Subunit (Top Left) -->
        <g class="subunit-alpha1">
            <path d="M 390,240 C 340,130 230,170 260,260 C 290,350 370,290 390,250 Z" fill="#98D8C8" stroke="#76A89C" stroke-width="2" stroke-linejoin="round"/>
            <text x="280" y="240" font-family="Inter" font-size="18" font-weight="bold" fill="#2C3E50" opacity="0.7">α₁</text>
            <ellipse cx="310" cy="200" rx="18" ry="8" transform="rotate(-45, 310, 200)" class="heme-1" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="310" cy="200" r="4" fill="#F1C40F"/>
            
            <!-- Leader Line for Heme Group -->
            <polyline points="310,200 250,130 170,130" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4,4"/>
            <circle cx="310" cy="200" r="14" fill="none" stroke="#2C3E50" stroke-width="1" stroke-dasharray="2,2"/>
            <text x="165" y="125" font-family="Inter" font-size="13" font-weight="bold" text-anchor="end" fill="#2C3E50">Heme Group</text>
            <text x="165" y="142" font-family="Inter" font-size="12" text-anchor="end" fill="#C0392B">Contains Fe²⁺</text>
        </g>

        <!-- Beta 1 Subunit (Top Right) -->
        <g class="subunit-beta1">
            <path d="M 410,240 C 460,130 570,170 540,260 C 510,350 430,290 410,250 Z" fill="#76C7B7" stroke="#5A9E91" stroke-width="2" stroke-linejoin="round"/>
            <text x="505" y="240" font-family="Inter" font-size="18" font-weight="bold" fill="#2C3E50" opacity="0.7">β₁</text>
            <ellipse cx="490" cy="200" rx="18" ry="8" transform="rotate(45, 490, 200)" class="heme-2" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="490" cy="200" r="4" fill="#F1C40F"/>
        </g>

        <!-- Alpha 2 Subunit (Bottom Right) -->
        <g class="subunit-alpha2">
            <path d="M 410,260 C 460,370 570,330 540,240 C 510,150 430,210 410,250 Z" fill="#98D8C8" stroke="#76A89C" stroke-width="2" stroke-linejoin="round"/>
            <text x="505" y="275" font-family="Inter" font-size="18" font-weight="bold" fill="#2C3E50" opacity="0.7">α₂</text>
            <ellipse cx="490" cy="300" rx="18" ry="8" transform="rotate(-45, 490, 300)" class="heme-3" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="490" cy="300" r="4" fill="#F1C40F"/>
        </g>

        <!-- Beta 2 Subunit (Bottom Left) -->
        <g class="subunit-beta2">
            <path d="M 390,260 C 340,370 230,330 260,240 C 290,150 370,210 390,250 Z" fill="#76C7B7" stroke="#5A9E91" stroke-width="2" stroke-linejoin="round"/>
            <text x="280" y="275" font-family="Inter" font-size="18" font-weight="bold" fill="#2C3E50" opacity="0.7">β₂</text>
            <ellipse cx="310" cy="300" rx="18" ry="8" transform="rotate(45, 310, 300)" class="heme-4" stroke="#2C3E50" stroke-width="1.5"/>
            <circle cx="310" cy="300" r="4" fill="#F1C40F"/>
        </g>
    </g>

    <!-- Oxygen Molecules (O2) -->
    <!-- O2 #1 -->
    <g class="o2-1">
        <circle cx="0" cy="0" r="12" fill="#E74C3C" opacity="0.5" filter="url(#blur-small)"/>
        <circle cx="-4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
        <circle cx="4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
    </g>
    <!-- O2 #2 -->
    <g class="o2-2">
        <circle cx="0" cy="0" r="12" fill="#E74C3C" opacity="0.5" filter="url(#blur-small)"/>
        <circle cx="-4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
        <circle cx="4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
    </g>
    <!-- O2 #3 -->
    <g class="o2-3">
        <circle cx="0" cy="0" r="12" fill="#E74C3C" opacity="0.5" filter="url(#blur-small)"/>
        <circle cx="-4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
        <circle cx="4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
    </g>
    <!-- O2 #4 -->
    <g class="o2-4">
        <circle cx="0" cy="0" r="12" fill="#E74C3C" opacity="0.5" filter="url(#blur-small)"/>
        <circle cx="-4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
        <circle cx="4" cy="0" r="5" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
    </g>

    <!-- Dynamic Process Labels -->
    <g class="label-lungs">
        <rect x="20" y="220" width="180" height="60" rx="8" fill="#E8F4FD" stroke="#3498DB" stroke-width="2" filter="url(#drop-shadow)"/>
        <text x="110" y="245" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">High pO₂ (Lungs)</text>
        <text x="110" y="265" font-family="Inter" font-size="12" text-anchor="middle" fill="#E74C3C">→ O₂ Association</text>
    </g>

    <g class="label-tissues">
        <rect x="600" y="220" width="180" height="60" rx="8" fill="#FDF2E9" stroke="#E74C3C" stroke-width="2" filter="url(#drop-shadow)"/>
        <text x="690" y="245" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Low pO₂ (Tissues)</text>
        <text x="690" y="265" font-family="Inter" font-size="12" text-anchor="middle" fill="#3498DB">→ O₂ Dissociation</text>
    </g>

    <!-- Legend -->
    <rect x="620" y="360" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" opacity="0.95" filter="url(#drop-shadow)"/>
    <text x="635" y="385" font-family="Inter" font-size="13" font-weight="bold" fill="#2C3E50">Legend</text>
    
    <rect x="635" y="400" width="14" height="14" rx="3" fill="#98D8C8"/>
    <text x="660" y="412" font-family="Inter" font-size="12" fill="#2C3E50">α Subunits</text>
    
    <rect x="635" y="425" width="14" height="14" rx="3" fill="#76C7B7"/>
    <text x="660" y="437" font-family="Inter" font-size="12" fill="#2C3E50">β Subunits</text>
    
    <g transform="translate(642, 457)">
        <circle cx="-4" cy="0" r="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
        <circle cx="4" cy="0" r="4" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1"/>
    </g>
    <text x="660" y="462" font-family="Inter" font-size="12" fill="#2C3E50">Oxygen (O₂)</text>

    <!-- Title and Equation -->
    <text x="400" y="40" font-family="Inter" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">Haemoglobin (Hb): Oxygen Transport Mechanism</text>
    <text x="400" y="65" font-family="Inter" font-size="14" text-anchor="middle" fill="#7F8C8D">Cooperative Binding and Conformational Changes (T-State ⇌ R-State)</text>
    
    <rect x="300" y="450" width="200" height="40" rx="20" fill="#FFFFFF" stroke="#E9ECEF" stroke-width="2" filter="url(#drop-shadow)"/>
    <text x="400" y="476" font-family="Roboto Mono" font-size="18" font-weight="600" text-anchor="middle" fill="#2C3E50">Hb + 4O₂ ⇌ Hb(O₂)₄</text>

</svg>

</body>
</html>
