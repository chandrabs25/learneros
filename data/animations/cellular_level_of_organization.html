<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cellular Level of Organization: Phylum Porifera</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; }
        .label { font-size: 13px; font-weight: 600; fill: #2C3E50; }
        .label-desc { font-size: 11px; font-weight: 400; fill: #7F8C8D; }
        .sci-term { font-family: 'Roboto Mono', monospace; font-size: 12px; fill: #E74C3C; }
        .legend-text { font-size: 12px; fill: #2C3E50; }

        /* Animations */
        @keyframes phagoParticle {
            0% { transform: translate(0px, 0px); opacity: 1; }
            25% { transform: translate(250px, 0px); opacity: 1; }
            50% { transform: translate(480px, 0px); opacity: 1; }
            60% { transform: translate(535px, 55px); opacity: 1; }
            65% { opacity: 0; transform: translate(535px, 55px); }
            100% { opacity: 0; transform: translate(535px, 55px); }
        }

        @keyframes phagoVesicle {
            0%, 60% { opacity: 0; transform: translate(535px, 375px); }
            61% { opacity: 1; transform: translate(535px, 375px); }
            75% { opacity: 1; transform: translate(505px, 375px); }
            85% { opacity: 1; transform: translate(475px, 410px); }
            95% { opacity: 0; transform: translate(460px, 435px); }
            100% { opacity: 0; transform: translate(460px, 435px); }
        }

        @keyframes amoebaReceive {
            0%, 80% { transform: translate(0, 0) scale(1); }
            85% { transform: translate(10px, -15px) scale(1.05); }
            95% { transform: translate(0, 0) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        @keyframes amoebaCrawl1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(15px, -10px) rotate(3deg); }
        }

        @keyframes amoebaCrawl2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-15px, 15px) rotate(-3deg); }
        }

        .phago-particle { animation: phagoParticle 4s infinite linear; }
        .phago-vesicle { animation: phagoVesicle 4s infinite linear; }
        .amoeba-receiver { 
            animation: amoebaReceive 4s infinite ease-in-out; 
            transform-origin: 460px 435px;
        }
        .amoeba-1 { animation: amoebaCrawl1 8s infinite ease-in-out; transform-origin: 330px 165px; }
        .amoeba-2 { animation: amoebaCrawl2 10s infinite ease-in-out; transform-origin: 300px 470px; }

        /* Hover Interactions */
        .cell-group { transition: opacity 0.3s; }
        .cell-group:hover { opacity: 0.8; cursor: pointer; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
        <title>Cellular Level of Organization: Phylum Porifera</title>
        <desc>An animated cross-section of an asconoid sponge wall demonstrating how independent cells function without forming true tissues.</desc>

        <defs>
            <!-- Arrowhead Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" />
            </marker>

            <!-- Water Flow Paths -->
            <path id="flow1" d="M 0 310 L 530 310 Q 600 310 650 200 L 700 -50" />
            <path id="flow2" d="M 0 330 L 530 330 Q 650 330 700 150 L 750 -50" />
            
            <!-- Choanocyte Base Symbol -->
            <g id="choanocyte_base">
                <ellipse cx="0" cy="0" rx="12" ry="22" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                <circle cx="-2" cy="0" r="5" fill="#2C3E50"/>
                <path d="M 10 -12 L 35 -18 L 35 18 L 10 12 Z" fill="rgba(74,144,217,0.3)" stroke="#4A90D9" stroke-width="1"/>
                <!-- Microvilli -->
                <line x1="15" y1="-12" x2="30" y2="-16" stroke="#4A90D9" stroke-width="0.5"/>
                <line x1="15" y1="-6" x2="30" y2="-8" stroke="#4A90D9" stroke-width="0.5"/>
                <line x1="15" y1="0" x2="30" y2="0" stroke="#4A90D9" stroke-width="0.5"/>
                <line x1="15" y1="6" x2="30" y2="8" stroke="#4A90D9" stroke-width="0.5"/>
                <line x1="15" y1="12" x2="30" y2="16" stroke="#4A90D9" stroke-width="0.5"/>
            </g>

            <!-- Spicule Symbol -->
            <g id="spicule" stroke="#BDC3C7" stroke-width="2.5" stroke-linecap="round">
                <line x1="0" y1="0" x2="20" y2="30"/>
                <line x1="20" y1="30" x2="40" y2="0"/>
                <line x1="20" y1="30" x2="20" y2="60"/>
            </g>
        </defs>

        <!-- Background Environments -->
        <!-- Exterior Water -->
        <rect x="0" y="0" width="200" height="650" fill="#3498DB" opacity="0.05" />
        <!-- Spongocoel (Interior Water) -->
        <rect x="530" y="0" width="470" height="650" fill="#3498DB" opacity="0.08" />

        <!-- Mesohyl (Gelatinous Matrix) -->
        <path d="M 220 90 L 510 90 L 510 290 L 220 290 Z" fill="#EAECEE" />
        <path d="M 220 350 L 510 350 L 510 550 L 220 550 Z" fill="#EAECEE" />

        <!-- Spicules in Mesohyl -->
        <use href="#spicule" x="250" y="120" transform="rotate(15 270 150) scale(0.8)"/>
        <use href="#spicule" x="430" y="140" transform="rotate(-45 450 170) scale(0.9)"/>
        <use href="#spicule" x="350" y="200" transform="rotate(70 370 230) scale(0.7)"/>
        <use href="#spicule" x="260" y="400" transform="rotate(110 280 430) scale(0.85)"/>
        <use href="#spicule" x="420" y="480" transform="rotate(-20 440 510) scale(0.9)"/>
        <use href="#spicule" x="330" y="380" transform="rotate(40 350 410) scale(0.75)"/>

        <!-- Amoebocytes -->
        <!-- Amoeba 1 (Top) -->
        <g class="amoeba-1 cell-group">
            <path d="M 300 150 C 320 120, 350 130, 360 160 C 380 170, 360 200, 330 190 C 300 210, 280 180, 300 150 Z" fill="#F39C12" stroke="#E67E22" stroke-width="2"/>
            <circle cx="330" cy="165" r="6" fill="#2C3E50"/>
        </g>
        
        <!-- Amoeba 2 (Bottom - Receiver) -->
        <g class="amoeba-receiver cell-group">
            <path d="M 430 420 C 450 390, 480 400, 490 430 C 510 440, 490 470, 460 460 C 430 480, 410 450, 430 420 Z" fill="#F39C12" stroke="#E67E22" stroke-width="2"/>
            <circle cx="460" cy="435" r="6" fill="#2C3E50"/>
        </g>

        <!-- Amoeba 3 (Middle Bottom) -->
        <g class="amoeba-2 cell-group">
            <path d="M 280 450 C 300 430, 330 440, 340 470 C 350 500, 320 510, 290 490 C 260 500, 250 470, 280 450 Z" fill="#F39C12" stroke="#E67E22" stroke-width="2"/>
            <circle cx="300" cy="470" r="6" fill="#2C3E50"/>
        </g>

        <!-- Porocyte (Forms the Ostium) -->
        <g class="cell-group">
            <path d="M 200 290 L 510 290 L 510 305 L 220 305 C 215 320, 215 320, 220 335 L 510 335 L 510 350 L 200 350 C 190 320, 190 320, 200 290 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="350" cy="297" r="5" fill="#2C3E50"/>
            <circle cx="350" cy="343" r="5" fill="#2C3E50"/>
        </g>

        <!-- Pinacocytes (Outer Epidermal Layer) -->
        <g class="cell-group">
            <polygon points="200,90 220,92 218,138 200,140" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="115" r="4" fill="#2C3E50"/>
            
            <polygon points="200,140 218,138 222,188 200,190" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="165" r="4" fill="#2C3E50"/>
            
            <polygon points="200,190 222,188 218,238 200,240" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="215" r="4" fill="#2C3E50"/>
            
            <polygon points="200,240 218,238 220,288 200,290" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="265" r="4" fill="#2C3E50"/>
            
            <!-- Gap for Porocyte -->
            
            <polygon points="200,350 220,352 218,398 200,400" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="375" r="4" fill="#2C3E50"/>
            
            <polygon points="200,400 218,398 222,448 200,450" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="425" r="4" fill="#2C3E50"/>
            
            <polygon points="200,450 222,448 218,498 200,500" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="475" r="4" fill="#2C3E50"/>
            
            <polygon points="200,500 218,498 220,548 200,550" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="210" cy="525" r="4" fill="#2C3E50"/>
        </g>

        <!-- Choanocytes (Inner Collar Cells) & Animated Flagella -->
        <g class="cell-group">
            <!-- Choanocyte 1 -->
            <use href="#choanocyte_base" x="510" y="115"/>
            <path d="M 520 115 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 115 q 20 -15 40 0 t 40 0 t 40 0; M 520 115 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.0s"/>
            </path>
            
            <!-- Choanocyte 2 -->
            <use href="#choanocyte_base" x="510" y="165"/>
            <path d="M 520 165 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 165 q 20 -15 40 0 t 40 0 t 40 0; M 520 165 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.1s"/>
            </path>

            <!-- Choanocyte 3 -->
            <use href="#choanocyte_base" x="510" y="215"/>
            <path d="M 520 215 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 215 q 20 -15 40 0 t 40 0 t 40 0; M 520 215 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.2s"/>
            </path>

            <!-- Choanocyte 4 -->
            <use href="#choanocyte_base" x="510" y="265"/>
            <path d="M 520 265 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 265 q 20 -15 40 0 t 40 0 t 40 0; M 520 265 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.3s"/>
            </path>

            <!-- Gap for Porocyte Opening -->

            <!-- Choanocyte 5 (Phagocytosis Site) -->
            <use href="#choanocyte_base" x="510" y="375"/>
            <path d="M 520 375 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 375 q 20 -15 40 0 t 40 0 t 40 0; M 520 375 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.4s"/>
            </path>

            <!-- Choanocyte 6 -->
            <use href="#choanocyte_base" x="510" y="425"/>
            <path d="M 520 425 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 425 q 20 -15 40 0 t 40 0 t 40 0; M 520 425 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.5s"/>
            </path>

            <!-- Choanocyte 7 -->
            <use href="#choanocyte_base" x="510" y="475"/>
            <path d="M 520 475 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 475 q 20 -15 40 0 t 40 0 t 40 0; M 520 475 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.0s"/>
            </path>

            <!-- Choanocyte 8 -->
            <use href="#choanocyte_base" x="510" y="525"/>
            <path d="M 520 525 q 20 -15 40 0 t 40 0 t 40 0" fill="none" stroke="#98D8C8" stroke-width="1.5">
                <animate attributeName="d" values="M 520 525 q 20 -15 40 0 t 40 0 t 40 0; M 520 525 q 20 15 40 0 t 40 0 t 40 0" dur="0.6s" repeatCount="indefinite" begin="0.1s"/>
            </path>
        </g>

        <!-- Continuous Water Flow Particles -->
        <g fill="#3498DB">
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="0s"><mpath href="#flow1"/></animateMotion></circle>
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="1.3s"><mpath href="#flow1"/></animateMotion></circle>
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="2.6s"><mpath href="#flow1"/></animateMotion></circle>
            
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="0.6s"><mpath href="#flow2"/></animateMotion></circle>
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="1.9s"><mpath href="#flow2"/></animateMotion></circle>
            <circle r="3.5"><animateMotion dur="4s" repeatCount="indefinite" begin="3.2s"><mpath href="#flow2"/></animateMotion></circle>
        </g>

        <!-- Phagocytosis Animation Sequence -->
        <!-- 1. Particle entering and getting caught -->
        <circle class="phago-particle" r="4" fill="#3498DB" cy="320" />
        <!-- 2. Vesicle inside choanocyte moving to amoebocyte -->
        <circle class="phago-vesicle" r="3" fill="#3498DB" />

        <!-- Labels and Annotations -->
        <!-- Title -->
        <text x="500" y="40" class="title" text-anchor="middle">Cellular Level of Organization: Phylum Porifera</text>
        <text x="500" y="65" class="subtitle" text-anchor="middle">Asconoid Sponge Cross-Section (No True Tissues or Basement Membrane)</text>

        <!-- Pinacocyte Label -->
        <polyline points="150,115 180,115 200,115" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="140" y="110" class="label" text-anchor="end">Pinacocyte</text>
        <text x="140" y="125" class="label-desc" text-anchor="end">Outer protective layer</text>

        <!-- Ostium Label -->
        <polyline points="150,320 190,320" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="140" y="315" class="label" text-anchor="end">Ostium (Incurrent Pore)</text>
        <text x="140" y="330" class="label-desc" text-anchor="end">Formed by a single Porocyte</text>
        <text x="140" y="350" class="sci-term" text-anchor="end">Water Inflow &rarr;</text>

        <!-- Mesohyl Label -->
        <polyline points="360,70 360,110" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="360" y="50" class="label" text-anchor="middle">Mesohyl</text>
        <text x="360" y="65" class="label-desc" text-anchor="middle">Gelatinous non-cellular matrix</text>

        <!-- Spicule Label -->
        <polyline points="420,590 420,540" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="420" y="610" class="label" text-anchor="middle">Spicule</text>
        <text x="420" y="625" class="label-desc" text-anchor="middle">Skeletal support element</text>

        <!-- Amoebocyte Label -->
        <polyline points="300,590 300,500" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="300" y="610" class="label" text-anchor="middle">Amoebocyte</text>
        <text x="300" y="625" class="label-desc" text-anchor="middle">Nutrient transport & totipotency</text>

        <!-- Choanocyte Label -->
        <polyline points="800,115 750,115 540,115" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="810" y="110" class="label" text-anchor="start">Choanocyte (Collar Cell)</text>
        <text x="810" y="125" class="label-desc" text-anchor="start">Generates current & traps food</text>

        <!-- Spongocoel Label -->
        <polyline points="800,250 750,250 650,250" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="810" y="245" class="label" text-anchor="start">Spongocoel</text>
        <text x="810" y="260" class="label-desc" text-anchor="start">Central interior cavity</text>

        <!-- Intracellular Digestion Label -->
        <polyline points="800,400 750,400 550,380" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
        <text x="810" y="395" class="label" text-anchor="start">Intracellular Digestion</text>
        <text x="810" y="410" class="label-desc" text-anchor="start">Particle trapped by microvilli collar</text>
        <text x="810" y="425" class="label-desc" text-anchor="start">and passed to amoebocyte</text>

        <!-- Legend -->
        <g transform="translate(800, 520)">
            <rect x="0" y="0" width="180" height="100" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" />
            <text x="90" y="20" class="label" text-anchor="middle">Legend</text>
            
            <circle cx="20" cy="40" r="5" fill="#3498DB" />
            <text x="35" y="44" class="legend-text">Water / Nutrients</text>
            
            <rect x="15" y="55" width="10" height="10" fill="#EAECEE" stroke="#BDC3C7" stroke-width="1" />
            <text x="35" y="64" class="legend-text">Mesohyl Matrix</text>
            
            <line x1="15" y1="85" x2="25" y2="75" stroke="#BDC3C7" stroke-width="2.5" stroke-linecap="round" />
            <text x="35" y="84" class="legend-text">Structural Spicule</text>
        </g>

    </svg>
</div>

</body>
</html>
