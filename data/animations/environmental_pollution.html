<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Chemical Pollution to Bio-Sustainability: The Nitrogen Cycle Shift</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: #2C3E50;
        }

        header {
            text-align: center;
            padding: 20px 0 10px 0;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            color: #2C3E50;
            font-weight: 700;
        }

        p.subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin: 5px 0 0 0;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 10px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Typography */
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .sci-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }
        .label-bg {
            text-shadow: 2px 2px 0 #f8f9fa, -2px -2px 0 #f8f9fa, 2px -2px 0 #f8f9fa, -2px 2px 0 #f8f9fa;
        }

        /* Animations */
        
        /* Phase 1: Rain (0-3s visible) */
        .rain-container {
            animation: rain-vis 12s infinite;
        }
        @keyframes rain-vis {
            0%, 25% { opacity: 1; }
            26%, 100% { opacity: 0; }
        }
        .rain-drop {
            animation: rain-fall 0.8s linear infinite;
        }
        @keyframes rain-fall {
            0% { transform: translate(0, 0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translate(-15px, 60px); opacity: 0; }
        }

        /* Phase 2: Leaching (3-7s) */
        .leach {
            animation: leach-anim 12s infinite ease-in-out;
        }
        @keyframes leach-anim {
            0%, 25% { transform: translate(0, 0); opacity: 1; }
            45% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
            50%, 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        /* Phase 2: N2 Drift (0-7s) */
        .n2-drift {
            animation: n2-anim 12s infinite ease-in-out;
        }
        @keyframes n2-anim {
            0%, 5% { transform: translate(0, 0); opacity: 0; }
            10%, 25% { opacity: 1; }
            40% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
            45%, 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        /* Phase 2: Nutrient Pulses (3-7s) */
        .pulse-up {
            animation: pulse-anim 12s infinite ease-in-out;
        }
        @keyframes pulse-anim {
            0%, 40% { transform: translate(0, 0); opacity: 0; }
            45% { opacity: 1; }
            60% { transform: translate(var(--px), var(--py)); opacity: 0; }
            100% { transform: translate(var(--px), var(--py)); opacity: 0; }
        }

        /* Phase 3: Algal Bloom (7-10s) */
        .algae-bloom {
            animation: bloom-anim 12s infinite ease-in-out;
        }
        @keyframes bloom-anim {
            0%, 50% { opacity: 0; }
            65%, 85% { opacity: 0.85; }
            95%, 100% { opacity: 0; }
        }

        /* Phase 3: Fish Die (7-10s) */
        .fish-die {
            transform-box: fill-box;
            transform-origin: center;
            animation: fish-die-anim 12s infinite ease-in-out;
        }
        @keyframes fish-die-anim {
            0%, 50% { transform: translate(0, 0) rotate(0deg); }
            65%, 85% { transform: translate(0, 30px) rotate(180deg); }
            95%, 100% { transform: translate(0, 0) rotate(0deg); }
        }

        /* Phase 3: Plant Grow (7-10s) */
        .plant-grow {
            transform-box: fill-box;
            transform-origin: bottom center;
            animation: plant-grow-anim 12s infinite ease-in-out;
        }
        @keyframes plant-grow-anim {
            0%, 50% { transform: scale(1); }
            65%, 85% { transform: scale(1.15); }
            95%, 100% { transform: scale(1); }
        }

        /* Continuous: Healthy Fish Swim */
        .fish-swim {
            transform-box: fill-box;
            transform-origin: center;
            animation: fish-swim-anim 12s infinite linear;
        }
        @keyframes fish-swim-anim {
            0%, 100% { transform: translateX(0) scaleX(1); }
            15% { transform: translateX(30px) scaleX(1); }
            16% { transform: translateX(30px) scaleX(-1); }
            35% { transform: translateX(-20px) scaleX(-1); }
            36% { transform: translateX(-20px) scaleX(1); }
            55% { transform: translateX(40px) scaleX(1); }
            56% { transform: translateX(40px) scaleX(-1); }
            75% { transform: translateX(-10px) scaleX(-1); }
            76% { transform: translateX(-10px) scaleX(1); }
            95% { transform: translateX(0) scaleX(1); }
        }

        /* Continuous: Rhizobium Pulse */
        .rhizobium-pulse {
            transform-box: fill-box;
            transform-origin: center;
            animation: rhiz-pulse-anim 2s infinite ease-in-out;
        }
        @keyframes rhiz-pulse-anim {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.3); opacity: 1; }
        }

    </style>
</head>
<body>

    <header>
        <h1>Impact of Fertilizers on Ecosystems</h1>
        <p class="subtitle">Chemical Pollution (Eutrophication) vs. Bio-Sustainability (Nitrogen Fixation)</p>
    </header>

    <div class="svg-container">
        <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" aria-label="Comparative diagram of chemical fertilizers versus biofertilizers">
            <title>From Chemical Pollution to Bio-Sustainability</title>
            <desc>An animated comparison showing chemical fertilizer runoff causing algal blooms and fish death on the left, and Rhizobium biofertilizers fixing atmospheric nitrogen for sustainable plant growth on the right.</desc>

            <defs>
                <!-- Fish -->
                <g id="fish">
                    <path d="M20,0 Q15,-6 10,-3 Q5,0 0,-5 L0,5 Q5,0 10,3 Q15,6 20,0 Z" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="15" cy="-1" r="1" fill="#2C3E50"/>
                </g>

                <!-- Chemical Hexagon -->
                <polygon id="hex" points="5,0 10,3 10,8 5,11 0,8 0,3" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>

                <!-- Cloud -->
                <path id="cloud" d="M10,20 Q10,10 20,10 Q25,0 35,5 Q45,-5 55,5 Q65,0 70,10 Q80,10 80,20 Z" fill="#BDC3C7" opacity="0.8"/>

                <!-- Root Nodule -->
                <ellipse id="nodule" cx="0" cy="0" rx="5" ry="7" fill="#F39C12" stroke="#D68910" stroke-width="1"/>

                <!-- Rhizobium Bacterium -->
                <rect id="bacterium" width="4" height="2" rx="1" fill="#2C3E50" />

                <!-- Arrow Marker -->
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
                </marker>

                <!-- Glow Filter -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Background -->
            <rect width="800" height="550" fill="#f8f9fa" />

            <!-- Center Divider -->
            <line x1="400" y1="60" x2="400" y2="480" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6,6" opacity="0.2" />

            <!-- Subtitles -->
            <text x="200" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#E74C3C">Chemical Fertilizer Impact</text>
            <text x="600" y="40" text-anchor="middle" font-size="18" font-weight="600" fill="#27AE60">Biofertilizer Mechanism</text>

            <!-- ================= LEFT SIDE: CHEMICAL POLLUTION ================= -->
            <g aria-label="Chemical Fertilizer Impact">
                <!-- Soil -->
                <rect x="20" y="250" width="360" height="230" fill="#E8D8C8" rx="8"/>
                
                <!-- Pond Water -->
                <path d="M 40 380 Q 200 380 380 350 L 380 470 Q 200 480 40 470 Z" fill="#3498DB" />

                <!-- Algal Bloom (Animated) -->
                <path d="M 40 380 Q 200 380 380 350 L 380 470 Q 200 480 40 470 Z" fill="#1E8449" class="algae-bloom" />

                <!-- Plant (Generic Crop) -->
                <g>
                    <!-- Roots (Shallow) -->
                    <path d="M 200 250 L 180 280 M 200 250 L 220 270 M 190 265 L 170 270 M 210 260 L 230 280" stroke="#8D6E63" stroke-width="2" fill="none"/>
                    <!-- Stem -->
                    <line x1="200" y1="250" x2="200" y2="150" stroke="#2ECC71" stroke-width="6" stroke-linecap="round"/>
                    <!-- Leaves -->
                    <path d="M 200 200 Q 170 170 150 190 Q 170 210 200 200 Z" fill="#2ECC71"/>
                    <path d="M 200 180 Q 230 150 250 170 Q 230 190 200 180 Z" fill="#2ECC71"/>
                    <path d="M 200 150 Q 180 120 190 100 Q 210 120 200 150 Z" fill="#2ECC71"/>
                </g>

                <!-- Clouds & Rain -->
                <use href="#cloud" x="120" y="60"/>
                <use href="#cloud" x="180" y="50"/>
                <g class="rain-container">
                    <line x1="140" y1="80" x2="130" y2="100" stroke="#3498DB" stroke-width="2" class="rain-drop" style="animation-delay: 0.1s;"/>
                    <line x1="170" y1="70" x2="160" y2="90" stroke="#3498DB" stroke-width="2" class="rain-drop" style="animation-delay: 0.4s;"/>
                    <line x1="200" y1="85" x2="190" y2="105" stroke="#3498DB" stroke-width="2" class="rain-drop" style="animation-delay: 0.2s;"/>
                    <line x1="230" y1="75" x2="220" y2="95" stroke="#3498DB" stroke-width="2" class="rain-drop" style="animation-delay: 0.6s;"/>
                    <line x1="155" y1="95" x2="145" y2="115" stroke="#3498DB" stroke-width="2" class="rain-drop" style="animation-delay: 0.8s;"/>
                </g>

                <!-- Chemical Granules (Animated Leaching) -->
                <g>
                    <use href="#hex" x="170" y="240" style="--dx: 60px; --dy: 140px;" class="leach"/>
                    <use href="#hex" x="185" y="243" style="--dx: 50px; --dy: 130px;" class="leach" style="animation-delay: 0.1s;"/>
                    <use href="#hex" x="210" y="238" style="--dx: 70px; --dy: 150px;" class="leach" style="animation-delay: 0.2s;"/>
                    <use href="#hex" x="225" y="242" style="--dx: 40px; --dy: 135px;" class="leach" style="animation-delay: 0.15s;"/>
                    <use href="#hex" x="195" y="245" style="--dx: 55px; --dy: 145px;" class="leach" style="animation-delay: 0.05s;"/>
                </g>

                <!-- Fish (Animated Dying) -->
                <use href="#fish" x="120" y="420" class="fish-die"/>
                <use href="#fish" x="260" y="440" class="fish-die" style="animation-delay: 0.2s;"/>

                <!-- Labels Left -->
                <text x="100" y="230" font-size="14" font-weight="600" class="label-bg">Chemical Runoff (NPK)</text>
                <line x1="250" y1="280" x2="280" y2="330" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
                <text x="290" y="310" font-size="13" class="label-bg">Leaching</text>
                <text x="200" y="410" font-size="14" font-weight="600" fill="#f8f9fa" text-anchor="middle" style="text-shadow: 1px 1px 3px rgba(0,0,0,0.8);">Eutrophication / Algal Bloom</text>
            </g>


            <!-- ================= RIGHT SIDE: BIO-SUSTAINABILITY ================= -->
            <g aria-label="Biofertilizer Mechanism">
                <!-- Soil -->
                <rect x="420" y="250" width="360" height="230" fill="#E8D8C8" rx="8"/>
                
                <!-- Pond Water (Remains Clear) -->
                <path d="M 420 350 Q 600 380 760 380 L 760 470 Q 600 480 420 470 Z" fill="#3498DB" />

                <!-- Plant (Legume - Animated Growth) -->
                <g class="plant-grow">
                    <!-- Roots (Deep) -->
                    <path d="M 600 250 Q 610 320 590 400" stroke="#8D6E63" stroke-width="4" fill="none"/>
                    <path d="M 605 280 Q 630 300 640 330" stroke="#8D6E63" stroke-width="2" fill="none"/>
                    <path d="M 595 320 Q 560 340 550 370" stroke="#8D6E63" stroke-width="2" fill="none"/>
                    <path d="M 592 360 Q 620 380 630 410" stroke="#8D6E63" stroke-width="2" fill="none"/>

                    <!-- Root Nodules & Rhizobium -->
                    <g>
                        <use href="#nodule" x="615" y="290" class="rhizobium-pulse"/>
                        <use href="#bacterium" x="610" y="285" transform="rotate(45 610 285)" class="rhizobium-pulse"/>
                        <use href="#bacterium" x="622" y="288" transform="rotate(-30 622 288)" class="rhizobium-pulse"/>

                        <use href="#nodule" x="635" y="320" class="rhizobium-pulse" style="animation-delay: 0.3s;"/>
                        <use href="#bacterium" x="630" y="315" transform="rotate(15 630 315)" class="rhizobium-pulse"/>

                        <use href="#nodule" x="580" y="330" class="rhizobium-pulse" style="animation-delay: 0.6s;"/>
                        <use href="#bacterium" x="575" y="335" transform="rotate(70 575 335)" class="rhizobium-pulse"/>

                        <use href="#nodule" x="560" y="360" class="rhizobium-pulse" style="animation-delay: 0.1s;"/>
                        <use href="#bacterium" x="565" y="365" transform="rotate(-45 565 365)" class="rhizobium-pulse"/>

                        <use href="#nodule" x="610" y="375" class="rhizobium-pulse" style="animation-delay: 0.8s;"/>
                    </g>

                    <!-- Stem -->
                    <line x1="600" y1="250" x2="600" y2="90" stroke="#2ECC71" stroke-width="8" stroke-linecap="round"/>
                    
                    <!-- Leaves (Bushy) -->
                    <path d="M 600 210 Q 540 170 520 200 Q 550 230 600 210 Z" fill="#2ECC71"/>
                    <path d="M 600 180 Q 660 140 680 170 Q 650 200 600 180 Z" fill="#2ECC71"/>
                    <path d="M 600 140 Q 550 100 540 120 Q 560 150 600 140 Z" fill="#2ECC71"/>
                    <path d="M 600 110 Q 640 70 650 90 Q 630 120 600 110 Z" fill="#2ECC71"/>
                    <path d="M 600 90 Q 570 40 600 30 Q 630 40 600 90 Z" fill="#2ECC71"/>
                </g>

                <!-- Atmospheric N2 (Animated Drift) -->
                <g class="n2-drift" style="--dx: -45px; --dy: 140px;">
                    <text x="660" y="150" class="sci-text" font-size="16" fill="#2C3E50">N₂</text>
                </g>
                <g class="n2-drift" style="--dx: 60px; --dy: 210px;" style="animation-delay: 0.2s;">
                    <text x="500" y="120" class="sci-text" font-size="16" fill="#2C3E50">N₂</text>
                </g>
                <g class="n2-drift" style="--dx: -10px; --dy: 240px;" style="animation-delay: 0.4s;">
                    <text x="620" y="100" class="sci-text" font-size="16" fill="#2C3E50">N₂</text>
                </g>

                <!-- Nutrient Pulses (Animated Upward) -->
                <circle cx="615" cy="290" r="5" fill="#98D8C8" filter="url(#glow)" class="pulse-up" style="--px: -15px; --py: -140px;"/>
                <circle cx="635" cy="320" r="5" fill="#98D8C8" filter="url(#glow)" class="pulse-up" style="--px: -35px; --py: -170px;" style="animation-delay: 0.2s;"/>
                <circle cx="580" cy="330" r="5" fill="#98D8C8" filter="url(#glow)" class="pulse-up" style="--px: 20px; --py: -180px;" style="animation-delay: 0.4s;"/>
                <circle cx="560" cy="360" r="5" fill="#98D8C8" filter="url(#glow)" class="pulse-up" style="--px: 40px; --py: -210px;" style="animation-delay: 0.1s;"/>

                <!-- Fish (Animated Swimming) -->
                <use href="#fish" x="500" y="420" class="fish-swim"/>
                <use href="#fish" x="660" y="440" class="fish-swim" style="animation-delay: -3s;"/>

                <!-- Labels Right -->
                <text x="600" y="70" font-size="14" font-weight="600" text-anchor="middle" class="label-bg">Atmospheric N₂ Fixation</text>
                <line x1="600" y1="80" x2="600" y2="120" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4,4"/>
                
                <text x="680" y="280" font-size="14" font-weight="600" class="label-bg">Biofertilizers</text>
                <text x="680" y="298" font-size="13" class="label-bg">(<tspan font-style="italic">Rhizobium</tspan>)</text>
                <line x1="675" y1="290" x2="645" y2="310" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)"/>

                <text x="680" y="180" font-size="14" font-weight="600" fill="#27AE60" class="label-bg">Sustainable Growth</text>
            </g>

            <!-- ================= LEGEND ================= -->
            <g transform="translate(40, 515)" aria-label="Diagram Legend">
                <rect x="0" y="0" width="16" height="16" fill="#2ECC71" rx="2"/>
                <text x="22" y="12" font-size="12">Plant Tissue</text>

                <rect x="120" y="0" width="16" height="16" fill="#F1C40F" rx="2"/>
                <text x="142" y="12" font-size="12">Chemicals</text>

                <rect x="230" y="0" width="16" height="16" fill="#1E8449" rx="2"/>
                <text x="252" y="12" font-size="12">Algal Bloom</text>

                <rect x="350" y="0" width="16" height="16" fill="#F39C12" rx="2"/>
                <text x="372" y="12" font-size="12">Root Nodules</text>

                <rect x="480" y="0" width="16" height="16" fill="#98D8C8" rx="2"/>
                <text x="502" y="12" font-size="12">Nutrient Pulses</text>

                <rect x="620" y="0" width="16" height="16" fill="#3498DB" rx="2"/>
                <text x="642" y="12" font-size="12">Clean Water</text>
            </g>

        </svg>
    </div>

</body>
</html>
