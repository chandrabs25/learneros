<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equipartition of Energy Simulation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.75);
            --panel-border: rgba(255, 255, 255, 0.5);
            --text-main: #2B2D42;
            --text-muted: #6c757d;
            --accent: #F77F00;
            --c-monatomic: #FF3366;
            --c-diatomic: #4361EE;
            --c-polyatomic: #7209B7;
            --c-vector: #06D6A0;
            --font-ui: 'Inter', sans-serif;
            --font-math: 'Roboto Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-ui);
            overflow: hidden;
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }

        /* Glassmorphic Control Panel */
        #control-panel {
            width: 320px;
            min-width: 320px;
            height: 100%;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-left: 1px solid var(--panel-border);
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 8px;
            background: linear-gradient(45deg, var(--c-monatomic), var(--c-polyatomic));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: var(--font-math);
            color: var(--accent);
            font-weight: 700;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(247, 127, 0, 0.4);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1d8e0;
            border-radius: 2px;
        }

        select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #d1d8e0;
            background: rgba(255,255,255,0.9);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            color: var(--text-main);
            outline: none;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .info-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.4;
        }

        /* Floating Overlays */
        .overlay-card {
            position: absolute;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            pointer-events: none;
        }

        #formula-card {
            top: 24px;
            left: 24px;
            min-width: 250px;
        }

        .math-line {
            font-family: var(--font-math);
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            padding-bottom: 4px;
        }
        .math-line:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        
        .math-label { color: var(--text-muted); font-family: var(--font-ui); font-size: 0.8rem; font-weight: 600;}

        /* Bar Chart */
        #chart-card {
            bottom: 24px;
            left: 24px;
            width: 300px;
            height: 180px;
            display: flex;
            flex-direction: column;
        }

        .chart-title {
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: center;
        }

        .bars-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            flex-grow: 1;
            padding-bottom: 20px;
            position: relative;
            border-bottom: 2px solid #d1d8e0;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 30%;
            height: 100%;
            justify-content: flex-end;
        }

        .bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.3s ease;
            height: 0%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding-top: 4px;
            color: white;
            font-family: var(--font-math);
            font-size: 0.7rem;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .bar-label {
            position: absolute;
            bottom: -20px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        #bar-trans { background: linear-gradient(to top, #FF9A9E, #FECFEF); background-color: var(--c-monatomic); }
        #bar-rot { background: linear-gradient(to top, #a18cd1, #fbc2eb); background-color: var(--c-diatomic); }
        #bar-vib { background: linear-gradient(to top, #84fab0, #8fd3f4); background-color: var(--c-vector); }

    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="formula-card" class="overlay-card">
            <div style="font-weight: 800; margin-bottom: 12px; font-size: 0.9rem;">System State</div>
            <div class="math-line"><span class="math-label">E_avg per d.o.f:</span> <span>½ k_B T</span></div>
            <div class="math-line"><span class="math-label">Total Energy (U):</span> <span id="val-u">0</span> J</div>
            <div class="math-line"><span class="math-label">v_rms:</span> <span id="val-vrms">0</span> m/s</div>
            <div class="math-line"><span class="math-label">Active d.o.f (f):</span> <span id="val-dof">3</span></div>
        </div>

        <div id="chart-card" class="overlay-card">
            <div class="chart-title">Energy Partitioning</div>
            <div class="bars-container">
                <div class="bar-wrapper">
                    <div id="bar-trans" class="bar"></div>
                    <div class="bar-label">Trans</div>
                </div>
                <div class="bar-wrapper">
                    <div id="bar-rot" class="bar"></div>
                    <div class="bar-label">Rot</div>
                </div>
                <div class="bar-wrapper">
                    <div id="bar-vib" class="bar"></div>
                    <div class="bar-label">Vib</div>
                </div>
            </div>
        </div>
    </div>

    <div id="control-panel">
        <h1>Equipartition of Energy</h1>
        <p class="info-text">Energy is shared equally among all active degrees of freedom in thermal equilibrium.</p>
        
        <div class="control-group">
            <label for="temp">Temperature (T) <span class="val-display" id="lbl-temp">300 K</span></label>
            <input type="range" id="temp" min="100" max="3000" step="10" value="300">
        </div>

        <div class="control-group">
            <label for="gasType">Molecule Type</label>
            <select id="gasType">
                <option value="monatomic">Monatomic (He, Ne)</option>
                <option value="diatomic">Diatomic (O2, N2)</option>
                <option value="polyatomic">Polyatomic (H2O)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="molCount">Molecule Count (N) <span class="val-display" id="lbl-count">20</span></label>
            <input type="range" id="molCount" min="5" max="50" step="1" value="20">
        </div>

        <div class="control-group" style="margin-top: 10px;">
            <label class="checkbox-group">
                <input type="checkbox" id="vibEnabled">
                Enable Vibrational Modes
            </label>
            <p class="info-text" style="margin-top: 4px; color: #e63946;" id="vib-warning">Requires T > 1000K and Di/Polyatomic gas to activate.</p>
        </div>
    </div>

    <script>
        // --- Physics Constants & State ---
        const kB_sim = 0.01; // Scaled Boltzmann constant for visual speeds
        const m_sim = 1.0;   // Mass
        const I_sim = 2.0;   // Moment of Inertia
        const boxSize = 40;
        const halfBox = boxSize / 2;
        
        let state = {
            temp: 300,
            type: 'monatomic',
            count: 20,
            vibEnabled: false,
            v_rms: 0,
            omega_rms: 0,
            dof: { trans: 3, rot: 0, vib: 0 }
        };

        let molecules = [];
        let time = 0;

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        // Light background
        scene.background = new THREE.Color('#f0f4f8');
        scene.fog = new THREE.FogExp2('#f0f4f8', 0.005);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(40, 30, 60);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 150;
        controls.minDistance = 20;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);
        const pointLight = new THREE.PointLight(0xffffff, 0.5);
        pointLight.position.set(-10, -10, -10);
        scene.add(pointLight);

        // --- Container Box ---
        const boxGeo = new THREE.BoxGeometry(boxSize, boxSize, boxSize);
        const boxMat = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.1,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 0.5
        });
        const boxMesh = new THREE.Mesh(boxGeo, boxMat);
        scene.add(boxMesh);

        const edges = new THREE.EdgesGeometry(boxGeo);
        const lineMat = new THREE.LineBasicMaterial({ color: 0x2B2D42, transparent: true, opacity: 0.3 });
        const boxLines = new THREE.LineSegments(edges, lineMat);
        scene.add(boxLines);

        // --- Materials ---
        const matMonatomic = new THREE.MeshStandardMaterial({ color: 0xFF3366, roughness: 0.3, metalness: 0.2 });
        const matDiatomic = new THREE.MeshStandardMaterial({ color: 0x4361EE, roughness: 0.3, metalness: 0.2 });
        const matPolyatomic = new THREE.MeshStandardMaterial({ color: 0x7209B7, roughness: 0.3, metalness: 0.2 });
        const matBond = new THREE.MeshStandardMaterial({ color: 0xBDC3C7, roughness: 0.5 });
        
        const sphereGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const bondGeo = new THREE.CylinderGeometry(0.3, 0.3, 2.5, 16);
        bondGeo.translate(0, 1.25, 0); // Pivot at bottom

        // --- Molecule Generation ---
        function clearMolecules() {
            molecules.forEach(m => {
                scene.remove(m.group);
                if(m.arrow) scene.remove(m.arrow);
            });
            molecules = [];
        }

        function createMolecule() {
            const group = new THREE.Group();
            let atoms = [];
            let bonds = [];

            if (state.type === 'monatomic') {
                const atom = new THREE.Mesh(sphereGeo, matMonatomic);
                group.add(atom);
                atoms.push(atom);
            } 
            else if (state.type === 'diatomic') {
                const a1 = new THREE.Mesh(sphereGeo, matDiatomic);
                const a2 = new THREE.Mesh(sphereGeo, matDiatomic);
                a1.position.y = 1.5;
                a2.position.y = -1.5;
                
                const bond = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 3, 16), matBond);
                
                group.add(a1, a2, bond);
                atoms.push(a1, a2);
                bonds.push(bond);
            }
            else if (state.type === 'polyatomic') {
                // Non-linear (bent) like H2O
                const center = new THREE.Mesh(new THREE.SphereGeometry(1.5, 32, 32), matPolyatomic);
                const a1 = new THREE.Mesh(sphereGeo, matPolyatomic);
                const a2 = new THREE.Mesh(sphereGeo, matPolyatomic);
                
                a1.position.set(-1.8, -1.2, 0);
                a2.position.set(1.8, -1.2, 0);
                center.position.set(0, 0.8, 0);

                // Bonds
                const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.8, 16), matBond);
                b1.position.set(-0.9, -0.2, 0);
                b1.rotation.z = Math.PI / 4;

                const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 2.8, 16), matBond);
                b2.position.set(0.9, -0.2, 0);
                b2.rotation.z = -Math.PI / 4;

                group.add(center, a1, a2, b1, b2);
                atoms.push(center, a1, a2);
            }

            // Random Position inside box
            group.position.set(
                (Math.random() - 0.5) * (boxSize - 6),
                (Math.random() - 0.5) * (boxSize - 6),
                (Math.random() - 0.5) * (boxSize - 6)
            );

            // Random Velocity Direction
            const v = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize().multiplyScalar(state.v_rms);

            // Random Angular Velocity
            const omega = new THREE.Vector3(
                Math.random() - 0.5,
                Math.random() - 0.5,
                Math.random() - 0.5
            ).normalize().multiplyScalar(state.omega_rms);

            // Velocity Vector Arrow
            const arrow = new THREE.ArrowHelper(v.clone().normalize(), group.position, v.length() * 0.5, 0x06D6A0, 1, 0.5);
            scene.add(arrow);

            scene.add(group);

            molecules.push({
                group: group,
                v: v,
                omega: omega,
                atoms: atoms,
                bonds: bonds,
                arrow: arrow,
                vibPhase: Math.random() * Math.PI * 2
            });
        }

        function initMolecules() {
            clearMolecules();
            updatePhysicsParams();
            for (let i = 0; i < state.count; i++) {
                createMolecule();
            }
            updateUI();
        }

        // --- Physics & Logic ---
        function updatePhysicsParams() {
            // v_rms = sqrt(3 * kB * T / m)
            state.v_rms = Math.sqrt((3 * kB_sim * state.temp) / m_sim);
            
            // omega_rms = sqrt(2 * kB * T / I)
            state.omega_rms = Math.sqrt((2 * kB_sim * state.temp) / I_sim);

            // Determine Degrees of Freedom
            state.dof.trans = 3;
            const isVibActive = state.vibEnabled && state.temp >= 1000 && state.type !== 'monatomic';

            if (state.type === 'monatomic') {
                state.dof.rot = 0;
                state.dof.vib = 0;
            } else if (state.type === 'diatomic') {
                state.dof.rot = 2;
                state.dof.vib = isVibActive ? 2 : 0; // 1 mode, KE + PE = 2 dof
            } else if (state.type === 'polyatomic') {
                state.dof.rot = 3;
                state.dof.vib = isVibActive ? 6 : 0; // Non-linear: 3N-6 = 3 modes -> 6 dof
            }

            // Update existing velocities magnitude without changing direction
            molecules.forEach(m => {
                m.v.normalize().multiplyScalar(state.v_rms);
                m.omega.normalize().multiplyScalar(state.omega_rms);
            });

            // UI Warning
            const warning = document.getElementById('vib-warning');
            if(state.vibEnabled && !isVibActive) {
                warning.style.display = 'block';
                if(state.type === 'monatomic') warning.innerText = "Monatomic gases do not vibrate.";
                else warning.innerText = "Requires T ≥ 1000K to activate vibrational modes.";
            } else {
                warning.style.display = 'none';
            }
        }

        function updateUI() {
            // Calculate Energies
            // E = (f/2) * N * kB * T
            const baseE = 0.5 * state.count * kB_sim * state.temp;
            const eTrans = state.dof.trans * baseE;
            const eRot = state.dof.rot * baseE;
            const eVib = state.dof.vib * baseE;
            const uTotal = eTrans + eRot + eVib;
            const fTotal = state.dof.trans + state.dof.rot + state.dof.vib;

            // Update Text
            document.getElementById('val-u').innerText = uTotal.toFixed(2);
            document.getElementById('val-vrms').innerText = state.v_rms.toFixed(2);
            document.getElementById('val-dof').innerText = fTotal;

            // Update Bars
            const pTrans = (eTrans / uTotal) * 100 || 0;
            const pRot = (eRot / uTotal) * 100 || 0;
            const pVib = (eVib / uTotal) * 100 || 0;

            const bTrans = document.getElementById('bar-trans');
            const bRot = document.getElementById('bar-rot');
            const bVib = document.getElementById('bar-vib');

            bTrans.style.height = `${pTrans}%`;
            bTrans.innerText = pTrans > 5 ? `${Math.round(pTrans)}%` : '';
            
            bRot.style.height = `${pRot}%`;
            bRot.innerText = pRot > 5 ? `${Math.round(pRot)}%` : '';
            
            bVib.style.height = `${pVib}%`;
            bVib.innerText = pVib > 5 ? `${Math.round(pVib)}%` : '';
        }

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1); // Cap dt to prevent tunneling
            time += dt;

            const isVibActive = state.vibEnabled && state.temp >= 1000 && state.type !== 'monatomic';
            const vibFreq = 0.5 * Math.sqrt(state.temp);
            const vibAmp = 0.0003 * state.temp;

            molecules.forEach(m => {
                // 1. Translation
                m.group.position.addScaledVector(m.v, dt);

                // Wall Collisions (Elastic)
                const r = 1.5; // collision radius
                if (m.group.position.x > halfBox - r) { m.group.position.x = halfBox - r; m.v.x *= -1; }
                if (m.group.position.x < -halfBox + r) { m.group.position.x = -halfBox + r; m.v.x *= -1; }
                if (m.group.position.y > halfBox - r) { m.group.position.y = halfBox - r; m.v.y *= -1; }
                if (m.group.position.y < -halfBox + r) { m.group.position.y = -halfBox + r; m.v.y *= -1; }
                if (m.group.position.z > halfBox - r) { m.group.position.z = halfBox - r; m.v.z *= -1; }
                if (m.group.position.z < -halfBox + r) { m.group.position.z = -halfBox + r; m.v.z *= -1; }

                // 2. Rotation
                if (state.type === 'diatomic') {
                    // Rotate around local X and Z (assuming bond is Y)
                    m.group.rotateX(m.omega.x * dt);
                    m.group.rotateZ(m.omega.z * dt);
                } else if (state.type === 'polyatomic') {
                    // Rotate around all axes
                    m.group.rotateX(m.omega.x * dt);
                    m.group.rotateY(m.omega.y * dt);
                    m.group.rotateZ(m.omega.z * dt);
                }

                // 3. Vibration (SHM)
                if (isVibActive) {
                    const offset = Math.sin(time * vibFreq + m.vibPhase) * vibAmp;
                    if (state.type === 'diatomic') {
                        m.atoms[0].position.y = 1.5 + offset;
                        m.atoms[1].position.y = -1.5 - offset;
                        // Scale bond visually
                        const scale = (3 + offset * 2) / 3;
                        if(m.bonds[0]) m.bonds[0].scale.y = scale;
                    } else if (state.type === 'polyatomic') {
                        // Simple radial pulsing for polyatomic to signify vibration
                        m.atoms[1].position.set(-1.8 - offset, -1.2 - offset, 0);
                        m.atoms[2].position.set(1.8 + offset, -1.2 - offset, 0);
                    }
                } else {
                    // Reset positions if vibration turned off
                    if (state.type === 'diatomic') {
                        m.atoms[0].position.y = 1.5;
                        m.atoms[1].position.y = -1.5;
                        if(m.bonds[0]) m.bonds[0].scale.y = 1;
                    } else if (state.type === 'polyatomic') {
                        m.atoms[1].position.set(-1.8, -1.2, 0);
                        m.atoms[2].position.set(1.8, -1.2, 0);
                    }
                }

                // 4. Update Arrow
                m.arrow.position.copy(m.group.position);
                m.arrow.setDirection(m.v.clone().normalize());
                m.arrow.setLength(m.v.length() * 0.4 + 1, 0.8, 0.4);
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Event Listeners ---
        document.getElementById('temp').addEventListener('input', (e) => {
            state.temp = parseInt(e.target.value);
            document.getElementById('lbl-temp').innerText = `${state.temp} K`;
            updatePhysicsParams();
            updateUI();
        });

        document.getElementById('gasType').addEventListener('change', (e) => {
            state.type = e.target.value;
            initMolecules();
        });

        document.getElementById('molCount').addEventListener('input', (e) => {
            state.count = parseInt(e.target.value);
            document.getElementById('lbl-count').innerText = state.count;
            initMolecules();
        });

        document.getElementById('vibEnabled').addEventListener('change', (e) => {
            state.vibEnabled = e.target.checked;
            updatePhysicsParams();
            updateUI();
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- Initialization ---
        initMolecules();
        animate();

    </script>
</body>
</html>
