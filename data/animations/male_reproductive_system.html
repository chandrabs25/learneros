<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Male Reproductive System: Endocrine & Exocrine Function</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Typography */
        .title {
            font-size: 22px;
            font-weight: 700;
            fill: #2C3E50;
            text-anchor: middle;
        }
        .label {
            font-size: 12px;
            font-weight: 600;
            fill: #34495E;
            text-shadow: 1px 1px 2px #FFF, -1px -1px 2px #FFF, 1px -1px 2px #FFF, -1px 1px 2px #FFF;
        }
        .label-desc {
            font-size: 10px;
            font-weight: 400;
            fill: #7F8C8D;
        }
        .process-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 700;
        }

        /* Animations */
        .leydig-cell {
            transform-box: fill-box;
            transform-origin: center;
            animation: pulseLeydig 12s infinite;
        }

        .accessory-gland {
            animation: organGlow 12s infinite;
            transition: all 0.3s ease;
        }

        .androgen {
            opacity: 0;
            transform-box: fill-box;
            transform-origin: center;
        }
        .a1 { animation: androgenMove1 12s infinite; }
        .a2 { animation: androgenMove2 12s infinite; }
        .a3 { animation: androgenMove3 12s infinite; }
        .a4 { animation: androgenMove4 12s infinite; }
        .a5 { animation: androgenMove5 12s infinite; }

        .sperm-swarm {
            offset-path: path('M 250 380 Q 265 425 265 425 C 280 450, 310 440, 310 380 C 310 300, 310 200, 350 160 C 390 120, 470 140, 490 200 C 510 260, 480 290, 450 310 Q 450 360 400 390 L 300 450');
            offset-rotate: auto;
            animation: spermMove 12s linear infinite;
        }

        .endocrine-label { animation: labelFade1 12s infinite; }
        .exocrine-label { animation: labelFade2 12s infinite; }

        /* Keyframes */
        @keyframes pulseLeydig {
            0%, 100% { transform: scale(1); fill: #E8F4FD; stroke: #2C3E50; }
            15%, 25% { transform: scale(1.5); fill: #FFD700; stroke: #D35400; }
            40% { transform: scale(1); fill: #E8F4FD; stroke: #2C3E50; }
        }

        @keyframes organGlow {
            0%, 25% { filter: drop-shadow(0 0 0px rgba(255,215,0,0)); }
            35%, 60% { filter: drop-shadow(0 0 10px rgba(255,215,0,0.9)); }
            70%, 100% { filter: drop-shadow(0 0 0px rgba(255,215,0,0)); }
        }

        @keyframes androgenMove1 {
            0%, 10% { opacity: 0; transform: translate(0,0) scale(0.5); }
            15% { opacity: 1; transform: translate(10px, -10px) scale(1); }
            30% { opacity: 0.8; transform: translate(200px, -60px) scale(1.2); }
            35%, 100% { opacity: 0; transform: translate(210px, -65px) scale(1.5); }
        }
        @keyframes androgenMove2 {
            0%, 10% { opacity: 0; transform: translate(0,0) scale(0.5); }
            15% { opacity: 1; transform: translate(15px, -15px) scale(1); }
            30% { opacity: 0.8; transform: translate(230px, -90px) scale(1.2); }
            35%, 100% { opacity: 0; transform: translate(240px, -95px) scale(1.5); }
        }
        @keyframes androgenMove3 {
            0%, 10% { opacity: 0; transform: translate(0,0) scale(0.5); }
            15% { opacity: 1; transform: translate(5px, -20px) scale(1); }
            30% { opacity: 0.8; transform: translate(160px, -220px) scale(1.2); }
            35%, 100% { opacity: 0; transform: translate(170px, -230px) scale(1.5); }
        }
        @keyframes androgenMove4 {
            0%, 10% { opacity: 0; transform: translate(0,0) scale(0.5); }
            15% { opacity: 1; transform: translate(20px, -5px) scale(1); }
            30% { opacity: 0.8; transform: translate(40px, -20px) scale(1.2); }
            35%, 100% { opacity: 0; transform: translate(45px, -25px) scale(1.5); }
        }
        @keyframes androgenMove5 {
            0%, 10% { opacity: 0; transform: translate(0,0) scale(0.5); }
            15% { opacity: 1; transform: translate(-10px, -10px) scale(1); }
            30% { opacity: 0.8; transform: translate(-140px, -170px) scale(1.2); }
            35%, 100% { opacity: 0; transform: translate(-150px, -180px) scale(1.5); }
        }

        @keyframes spermMove {
            0%, 48% { offset-distance: 0%; opacity: 0; }
            50% { opacity: 1; }
            85% { offset-distance: 100%; opacity: 1; }
            87%, 100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes labelFade1 {
            0%, 5% { opacity: 0; transform: translateY(10px); }
            10%, 40% { opacity: 1; transform: translateY(0); }
            45%, 100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes labelFade2 {
            0%, 45% { opacity: 0; transform: translateY(10px); }
            50%, 85% { opacity: 1; transform: translateY(0); }
            90%, 100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Definitions -->
    <defs>
        <radialGradient id="testisGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#F5B041"/>
            <stop offset="100%" stop-color="#F39C12"/>
        </radialGradient>
        
        <g id="sperm">
            <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" filter="drop-shadow(0 0 1px #ccc)"/>
            <path d="M -2.5 0 Q -8 4 -12 0 T -22 0" stroke="#FFFFFF" fill="none" stroke-width="1.5"/>
        </g>

        <polygon id="androgen" points="4,0 2,-3.46 -2,-3.46 -4,0 -2,3.46 2,3.46" fill="#FFD700" filter="drop-shadow(0 0 3px #FFD700)"/>
    </defs>

    <!-- Title -->
    <text x="400" y="40" class="title">Male Reproductive System: Endocrine & Exocrine Function</text>

    <!-- Background Anatomy (Bladder) -->
    <circle cx="440" cy="240" r="45" fill="#E8F4FD" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
    <text x="440" y="245" font-size="12" fill="#BDC3C7" text-anchor="middle" font-weight="600">Urinary Bladder</text>

    <!-- Exocrine Ducts & Glands -->
    <!-- Urethra -->
    <path d="M 450 310 Q 450 360 400 390 L 300 450" fill="none" stroke="#4A90D9" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Prostate Gland -->
    <ellipse cx="450" cy="310" rx="28" ry="22" fill="#9B59B6" class="accessory-gland"/>
    
    <!-- Seminal Vesicle -->
    <path d="M 470 280 C 490 250, 520 220, 530 230 C 540 240, 500 290, 470 290 Z" fill="#8E44AD" class="accessory-gland"/>
    
    <!-- Vas Deferens -->
    <path d="M 265 425 C 280 450, 310 440, 310 380 C 310 300, 310 200, 350 160 C 390 120, 470 140, 490 200 C 510 260, 480 290, 450 310" fill="none" stroke="#4A90D9" stroke-width="5" stroke-linecap="round"/>

    <!-- Body Outlines (Penis & Scrotum) -->
    <path d="M 430 360 Q 390 380 290 440 C 270 450, 280 480, 310 470 L 420 410" fill="none" stroke="#BDC3C7" stroke-width="2"/>
    <path d="M 210 330 C 180 380, 190 460, 250 460 C 300 460, 320 440, 310 400" fill="none" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5 3"/>

    <!-- Primary Organ: Testis & Epididymis -->
    <!-- Epididymis -->
    <path d="M 225 345 C 240 320, 275 320, 285 350 C 295 380, 295 410, 280 430 C 265 450, 240 440, 250 420 C 260 400, 270 380, 265 355 C 255 340, 235 350, 225 345 Z" fill="#4A90D9" class="accessory-gland"/>
    
    <!-- Testis -->
    <ellipse cx="250" cy="380" rx="38" ry="52" fill="url(#testisGrad)" stroke="#D35400" stroke-width="2"/>
    
    <!-- Seminiferous Tubules -->
    <path d="M 225 350 Q 240 340 235 360 T 245 380 T 230 400 T 250 415" fill="none" stroke="#D35400" stroke-width="2"/>
    <path d="M 245 345 Q 260 350 255 370 T 265 390 T 250 410" fill="none" stroke="#D35400" stroke-width="2"/>
    <path d="M 235 370 Q 220 380 230 390 T 240 410" fill="none" stroke="#D35400" stroke-width="2"/>

    <!-- Leydig Cells (Interstitial) -->
    <g>
        <circle cx="230" cy="355" r="3.5" class="leydig-cell"/>
        <circle cx="236" cy="350" r="3.5" class="leydig-cell"/>
        <circle cx="245" cy="385" r="3.5" class="leydig-cell"/>
        <circle cx="252" cy="390" r="3.5" class="leydig-cell"/>
        <circle cx="235" cy="405" r="3.5" class="leydig-cell"/>
        <circle cx="260" cy="365" r="3.5" class="leydig-cell"/>
    </g>

    <!-- Animated Elements -->
    <!-- Androgens (Endocrine Signaling) -->
    <use href="#androgen" class="androgen a1" x="240" y="370"/>
    <use href="#androgen" class="androgen a2" x="240" y="370"/>
    <use href="#androgen" class="androgen a3" x="240" y="370"/>
    <use href="#androgen" class="androgen a4" x="240" y="370"/>
    <use href="#androgen" class="androgen a5" x="240" y="370"/>

    <!-- Spermatozoa (Exocrine Flow) -->
    <g class="sperm-swarm">
        <use href="#sperm" x="0" y="0"/>
        <use href="#sperm" x="-14" y="-5"/>
        <use href="#sperm" x="-28" y="4"/>
        <use href="#sperm" x="-42" y="-2"/>
    </g>

    <!-- Dynamic Process Labels -->
    <text class="process-label endocrine-label" x="140" y="300" fill="#D35400">1. Androgen Secretion</text>
    <text class="process-label exocrine-label" x="250" y="140" fill="#4A90D9">2. Spermatogenesis &amp; Transport</text>

    <!-- Static Labels & Pointers -->
    <g stroke="#7F8C8D" stroke-width="1.5" fill="none">
        <polyline points="212,380 120,380"/>
        <polyline points="230,355 120,340"/>
        <polyline points="285,380 360,380"/>
        <polyline points="310,250 200,250"/>
        <polyline points="510,250 600,250"/>
        <polyline points="475,310 600,310"/>
        <polyline points="350,420 450,440"/>
        <polyline points="250,460 250,480 150,480"/>
    </g>

    <g class="label">
        <text x="115" y="378" text-anchor="end">Testis</text>
        <text x="115" y="392" class="label-desc" text-anchor="end">Primary Sex Organ</text>

        <text x="115" y="338" text-anchor="end">Leydig Cells</text>
        <text x="115" y="352" class="label-desc" text-anchor="end">Testosterone Production</text>

        <text x="365" y="384" text-anchor="start">Epididymis</text>
        <text x="365" y="398" class="label-desc" text-anchor="start">Sperm Maturation</text>

        <text x="195" y="248" text-anchor="end">Vas Deferens</text>
        <text x="195" y="262" class="label-desc" text-anchor="end">Sperm Transport Duct</text>

        <text x="605" y="248" text-anchor="start">Seminal Vesicle</text>
        <text x="605" y="262" class="label-desc" text-anchor="start">Accessory Gland</text>

        <text x="605" y="308" text-anchor="start">Prostate Gland</text>
        <text x="605" y="322" class="label-desc" text-anchor="start">Accessory Gland</text>

        <text x="455" y="444" text-anchor="start">Urethra</text>
        <text x="455" y="458" class="label-desc" text-anchor="start">Common Excretory Duct</text>

        <text x="145" y="484" text-anchor="end">Scrotal Sac</text>
    </g>

    <!-- Legend -->
    <g transform="translate(610, 360)">
        <rect x="0" y="0" width="160" height="120" fill="#FFFFFF" stroke="#BDC3C7" rx="6" opacity="0.9"/>
        <text x="15" y="25" font-size="13" font-weight="700" fill="#2C3E50">Legend</text>
        
        <circle cx="20" cy="45" r="5" fill="#F39C12"/>
        <text x="35" y="49" font-size="11" fill="#34495E" font-weight="600">Primary Organ</text>
        
        <circle cx="20" cy="65" r="5" fill="#4A90D9"/>
        <text x="35" y="69" font-size="11" fill="#34495E" font-weight="600">Accessory Ducts</text>
        
        <use href="#androgen" x="20" y="85"/>
        <text x="35" y="89" font-size="11" fill="#34495E" font-weight="600">Androgens</text>
        
        <use href="#sperm" x="20" y="105"/>
        <text x="35" y="109" font-size="11" fill="#34495E" font-weight="600">Spermatozoa</text>
    </g>

</svg>

</body>
</html>
