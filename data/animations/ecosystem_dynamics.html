<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biocontrol: Mechanisms of Sustainable Ecosystem Dynamics</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #2C3E50; text-anchor: middle; }
        .label { font-size: 12px; font-weight: 400; fill: #2C3E50; }
        .label-italic { font-size: 12px; font-weight: 400; fill: #2C3E50; font-style: italic; }
        .mono { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 500; fill: #E74C3C; text-anchor: middle; }
        .legend-text { font-size: 11px; fill: #2C3E50; }

        /* Animations */
        .ladybird-anim { animation: ladybird-crawl 15s ease-in-out infinite; }
        .aphid1-anim { animation: fade-out-10 15s step-end infinite; }
        .aphid2-anim { animation: fade-out-20 15s step-end infinite; }
        .aphid3-anim { animation: fade-out-33 15s step-end infinite; }
        
        .dragonfly-anim { animation: dragonfly-fly 15s ease-in-out infinite; }
        .mosq1-anim { animation: fade-out-8 15s step-end infinite; }
        .mosq2-anim { animation: fade-out-16 15s step-end infinite; }
        .mosq3-anim { animation: fade-out-25 15s step-end infinite; }

        .caterpillar-anim { animation: caterpillar-crawl 15s ease-in-out infinite; }
        .cat-body-anim { animation: caterpillar-color 15s ease-in-out infinite; }
        
        .spore1-anim { animation: fade-out-45 15s step-end infinite; }
        .spore2-anim { animation: fade-out-55 15s step-end infinite; }
        .spore3-anim { animation: fade-out-66 15s step-end infinite; }

        .crystal1-anim { animation: crystal-fall-1 15s ease-in-out infinite; }
        .crystal2-anim { animation: crystal-fall-2 15s ease-in-out infinite; }
        
        .toxin1-anim { animation: toxin-active-1 15s ease-in-out infinite; }
        .toxin2-anim { animation: toxin-active-2 15s ease-in-out infinite; }

        .cell-intact-anim { animation: cell-hide 15s step-end infinite; }
        .cell-frag-anim { animation: cell-show 15s step-end infinite; }
        
        .frag1-anim { animation: frag-drift-left 15s ease-in-out infinite; }
        .frag2-anim { animation: frag-drift-right 15s ease-in-out infinite; }

        /* Keyframes: Phase 1 (0-33%) */
        @keyframes ladybird-crawl {
            0% { transform: translate(130px, 320px) rotate(-15deg); }
            10% { transform: translate(145px, 250px) rotate(-10deg); }
            20% { transform: translate(160px, 180px) rotate(-5deg); }
            33%, 100% { transform: translate(135px, 120px) rotate(-20deg); }
        }
        @keyframes fade-out-10 { 0%, 9% { opacity: 1; } 10%, 100% { opacity: 0; } }
        @keyframes fade-out-20 { 0%, 19% { opacity: 1; } 20%, 100% { opacity: 0; } }
        @keyframes fade-out-33 { 0%, 32% { opacity: 1; } 33%, 100% { opacity: 0; } }

        @keyframes dragonfly-fly {
            0% { transform: translate(400px, 150px); }
            8% { transform: translate(320px, 280px) rotate(-45deg); }
            16% { transform: translate(380px, 260px) rotate(45deg); }
            25% { transform: translate(350px, 230px) rotate(-20deg); }
            33%, 100% { transform: translate(450px, 100px) rotate(-45deg); }
        }
        @keyframes fade-out-8 { 0%, 7% { opacity: 1; } 8%, 100% { opacity: 0; } }
        @keyframes fade-out-16 { 0%, 15% { opacity: 1; } 16%, 100% { opacity: 0; } }
        @keyframes fade-out-25 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }

        /* Keyframes: Phase 2 (33-66%) */
        @keyframes caterpillar-crawl {
            0%, 33% { transform: translate(550px, 230px); }
            45% { transform: translate(650px, 210px); }
            55% { transform: translate(720px, 180px); }
            66%, 100% { transform: translate(800px, 190px); }
        }
        @keyframes caterpillar-color {
            0%, 66% { fill: #A2D149; }
            80%, 100% { fill: #7F8C8D; }
        }
        @keyframes fade-out-45 { 0%, 44% { opacity: 1; } 45%, 100% { opacity: 0; } }
        @keyframes fade-out-55 { 0%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
        @keyframes fade-out-66 { 0%, 65% { opacity: 1; } 66%, 100% { opacity: 0; } }

        /* Keyframes: Phase 3 (66-100%) */
        @keyframes crystal-fall-1 {
            0%, 66% { opacity: 0; transform: translate(450px, 400px); }
            67% { opacity: 1; transform: translate(450px, 400px); }
            75% { opacity: 1; transform: translate(450px, 480px); }
            76%, 100% { opacity: 0; transform: translate(450px, 480px); }
        }
        @keyframes crystal-fall-2 {
            0%, 66% { opacity: 0; transform: translate(550px, 400px); }
            67% { opacity: 1; transform: translate(550px, 400px); }
            75% { opacity: 1; transform: translate(550px, 480px); }
            76%, 100% { opacity: 0; transform: translate(550px, 480px); }
        }
        @keyframes toxin-active-1 {
            0%, 75% { opacity: 0; transform: translate(450px, 480px) scale(0.5); }
            76% { opacity: 1; transform: translate(450px, 480px) scale(1); }
            85% { opacity: 1; transform: translate(450px, 570px) scale(1.2); }
            95%, 100% { opacity: 0; transform: translate(450px, 590px) scale(1.5); }
        }
        @keyframes toxin-active-2 {
            0%, 75% { opacity: 0; transform: translate(550px, 480px) scale(0.5); }
            76% { opacity: 1; transform: translate(550px, 480px) scale(1); }
            85% { opacity: 1; transform: translate(550px, 570px) scale(1.2); }
            95%, 100% { opacity: 0; transform: translate(550px, 590px) scale(1.5); }
        }

        @keyframes cell-hide { 0%, 84% { opacity: 1; } 85%, 100% { opacity: 0; } }
        @keyframes cell-show { 0%, 84% { opacity: 0; } 85%, 100% { opacity: 1; } }
        
        @keyframes frag-drift-left {
            0%, 85% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            95%, 100% { transform: translate(-20px, 30px) rotate(-15deg); opacity: 0; }
        }
        @keyframes frag-drift-right {
            0%, 85% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            95%, 100% { transform: translate(20px, 30px) rotate(15deg); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
        <title>Biocontrol Agents in Ecosystems</title>
        <desc>Animated diagram showing predator-prey dynamics and Bacillus thuringiensis microbial control mechanism.</desc>

        <defs>
            <!-- Organisms -->
            <g id="ladybird">
                <path d="M -15 0 A 15 15 0 0 1 15 0 Z" fill="#E74C3C" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="-5" cy="-7" r="2" fill="#2C3E50"/>
                <circle cx="5" cy="-5" r="2" fill="#2C3E50"/>
                <circle cx="0" cy="-11" r="2" fill="#2C3E50"/>
                <circle cx="15" cy="0" r="4" fill="#2C3E50"/>
                <path d="M -10 0 L -15 5 M 0 0 L 0 5 M 10 0 L 15 5" stroke="#2C3E50" stroke-width="1" fill="none"/>
            </g>

            <g id="aphid">
                <ellipse cx="0" cy="0" rx="6" ry="4" fill="#27AE60" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="5" cy="0" r="2" fill="#2C3E50"/>
                <path d="M -4 -3 L -6 -6 M -4 3 L -6 6" stroke="#2C3E50" stroke-width="0.5" fill="none"/>
            </g>

            <g id="dragonfly">
                <rect x="-20" y="-2" width="40" height="4" rx="2" fill="#3498DB" stroke="#2C3E50" stroke-width="1"/>
                <circle cx="20" cy="0" r="3" fill="#2C3E50"/>
                <ellipse cx="-5" cy="-10" rx="4" ry="14" fill="#E8F4FD" stroke="#2C3E50" stroke-width="0.5" transform="rotate(30, -5, -10)"/>
                <ellipse cx="5" cy="-10" rx="4" ry="14" fill="#E8F4FD" stroke="#2C3E50" stroke-width="0.5" transform="rotate(-30, 5, -10)"/>
                <ellipse cx="-5" cy="10" rx="4" ry="14" fill="#E8F4FD" stroke="#2C3E50" stroke-width="0.5" transform="rotate(-30, -5, 10)"/>
                <ellipse cx="5" cy="10" rx="4" ry="14" fill="#E8F4FD" stroke="#2C3E50" stroke-width="0.5" transform="rotate(30, 5, 10)"/>
            </g>

            <g id="mosquito">
                <circle cx="0" cy="0" r="2" fill="#7F8C8D"/>
                <path d="M 0 0 L -4 -4 M 0 0 L 4 -4" stroke="#7F8C8D" stroke-width="1" fill="none"/>
            </g>

            <g id="caterpillar">
                <g stroke="#2C3E50" stroke-width="1">
                    <circle cx="0" cy="0" r="8" class="cat-body-anim"/>
                    <circle cx="12" cy="-2" r="8" class="cat-body-anim"/>
                    <circle cx="24" cy="-4" r="8" class="cat-body-anim"/>
                    <circle cx="36" cy="-2" r="8" class="cat-body-anim"/>
                    <circle cx="48" cy="0" r="8" class="cat-body-anim"/>
                    <circle cx="56" cy="2" r="6" fill="#2C3E50"/>
                </g>
            </g>

            <!-- Molecules -->
            <g id="spore">
                <ellipse cx="0" cy="0" rx="4" ry="2" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1"/>
            </g>

            <g id="crystal">
                <polygon points="0,-10 8,0 0,10 -8,0" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
            </g>

            <g id="toxin">
                <circle cx="0" cy="0" r="6" fill="#F1C40F" stroke="#E67E22" stroke-width="1"/>
                <circle cx="0" cy="0" r="12" fill="#F1C40F" opacity="0.4"/>
            </g>

            <!-- Epithelial Cell Template -->
            <g id="epi-cell">
                <rect width="100" height="80" fill="#E8F4FD" stroke="#F39C12" stroke-width="4"/>
                <line x1="0" y1="0" x2="100" y2="0" stroke="#4A90D9" stroke-width="6"/>
                <circle cx="50" cy="40" r="15" fill="#2C3E50"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="1000" height="700" fill="#f8f9fa"/>

        <!-- Titles -->
        <text x="500" y="40" class="title">Biocontrol: Mechanisms of Sustainable Ecosystem Dynamics</text>
        
        <!-- Dividers -->
        <line x1="500" y1="60" x2="500" y2="350" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>
        <line x1="50" y1="350" x2="950" y2="350" stroke="#2C3E50" stroke-width="2" stroke-dasharray="5,5" opacity="0.3"/>

        <!-- ========================================== -->
        <!-- PANEL A: Predator-Prey Dynamics            -->
        <!-- ========================================== -->
        <text x="250" y="80" class="subtitle">Panel A: Predator-Prey Dynamics</text>
        
        <!-- Environment -->
        <path d="M 150 350 Q 180 200 120 100" fill="none" stroke="#2ECC71" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="350" cy="320" rx="80" ry="20" fill="#D6EAF8" stroke="#3498DB" stroke-width="2"/>
        
        <!-- Labels -->
        <text x="100" y="280" class="label">Ladybird</text>
        <text x="100" y="295" class="label-italic">(Coccinella)</text>
        <text x="180" y="150" class="label">Aphids</text>
        
        <text x="420" y="200" class="label">Dragonfly</text>
        <text x="420" y="215" class="label-italic">(Anisoptera)</text>
        <text x="250" y="280" class="label">Mosquitoes</text>

        <!-- Static Aphids (Animated to disappear) -->
        <g class="aphid1-anim"><use href="#aphid" x="145" y="250"/></g>
        <g class="aphid2-anim"><use href="#aphid" x="160" y="180"/></g>
        <g class="aphid3-anim"><use href="#aphid" x="135" y="120"/></g>

        <!-- Animated Predators -->
        <g class="ladybird-anim"><use href="#ladybird"/></g>
        <g class="dragonfly-anim"><use href="#dragonfly"/></g>

        <!-- Static Mosquitoes (Animated to disappear) -->
        <g class="mosq1-anim"><use href="#mosquito" x="320" y="280"/></g>
        <g class="mosq2-anim"><use href="#mosquito" x="380" y="260"/></g>
        <g class="mosq3-anim"><use href="#mosquito" x="350" y="230"/></g>


        <!-- ========================================== -->
        <!-- PANEL B: Microbial Control                 -->
        <!-- ========================================== -->
        <text x="750" y="80" class="subtitle">Panel B: Microbial Control (Bt)</text>

        <!-- Environment -->
        <path d="M 550 250 Q 750 100 950 200 Q 750 300 550 250 Z" fill="#2ECC71" stroke="#2C3E50" stroke-width="2"/>
        <path d="M 550 250 Q 750 200 950 200" fill="none" stroke="#27AE60" stroke-width="3"/>

        <!-- Labels -->
        <text x="650" y="150" class="label">Bt Spores</text>
        <text x="650" y="165" class="label-italic">(Bacillus thuringiensis)</text>
        <text x="550" y="200" class="label">Caterpillar</text>

        <!-- Spores -->
        <g class="spore1-anim"><use href="#spore" x="650" y="210"/></g>
        <g class="spore2-anim"><use href="#spore" x="720" y="180"/></g>
        <g class="spore3-anim"><use href="#spore" x="800" y="190"/></g>

        <!-- Animated Caterpillar -->
        <g class="caterpillar-anim"><use href="#caterpillar"/></g>

        <!-- Zoom Indicator -->
        <circle cx="820" cy="190" r="40" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="4,4"/>
        <path d="M 820 230 C 820 300, 500 300, 500 380" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="4,4"/>


        <!-- ========================================== -->
        <!-- PANEL C: Cellular Mechanism (Gut Lysis)    -->
        <!-- ========================================== -->
        <text x="500" y="380" class="subtitle">Panel C: Cellular Mechanism (Midgut Epithelial Lysis)</text>

        <!-- Lumen Area -->
        <rect x="100" y="400" width="800" height="180" fill="#f8f9fa"/>
        <text x="500" y="450" class="mono">Alkaline pH &gt; 9.0</text>
        <text x="200" y="430" class="label">Gut Lumen</text>
        <text x="200" y="680" class="label">Midgut Epithelium</text>

        <!-- Intact Cells (1-3, 6-8) -->
        <use href="#epi-cell" x="100" y="580"/>
        <use href="#epi-cell" x="200" y="580"/>
        <use href="#epi-cell" x="300" y="580"/>
        <use href="#epi-cell" x="600" y="580"/>
        <use href="#epi-cell" x="700" y="580"/>
        <use href="#epi-cell" x="800" y="580"/>

        <!-- Lysing Cells (4 & 5) -->
        <g class="cell-intact-anim">
            <use href="#epi-cell" x="400" y="580"/>
            <use href="#epi-cell" x="500" y="580"/>
        </g>

        <!-- Fragments for Cell 4 -->
        <g class="cell-frag-anim">
            <g class="frag1-anim" style="transform-origin: 425px 620px;">
                <path d="M 400 580 L 450 580 L 430 660 L 400 660 Z" fill="#E8F4FD" stroke="#F39C12" stroke-width="4"/>
                <line x1="400" y1="580" x2="450" y2="580" stroke="#4A90D9" stroke-width="6"/>
                <path d="M 425 605 A 15 15 0 0 0 425 635 Z" fill="#2C3E50"/>
            </g>
            <g class="frag2-anim" style="transform-origin: 475px 620px;">
                <path d="M 450 580 L 500 580 L 500 660 L 430 660 Z" fill="#E8F4FD" stroke="#F39C12" stroke-width="4"/>
                <line x1="450" y1="580" x2="500" y2="580" stroke="#4A90D9" stroke-width="6"/>
                <path d="M 425 605 A 15 15 0 0 1 425 635 Z" fill="#2C3E50"/>
            </g>
        </g>

        <!-- Fragments for Cell 5 -->
        <g class="cell-frag-anim">
            <g class="frag1-anim" style="transform-origin: 525px 620px;">
                <path d="M 500 580 L 550 580 L 530 660 L 500 660 Z" fill="#E8F4FD" stroke="#F39C12" stroke-width="4"/>
                <line x1="500" y1="580" x2="550" y2="580" stroke="#4A90D9" stroke-width="6"/>
                <path d="M 525 605 A 15 15 0 0 0 525 635 Z" fill="#2C3E50"/>
            </g>
            <g class="frag2-anim" style="transform-origin: 575px 620px;">
                <path d="M 550 580 L 600 580 L 600 660 L 530 660 Z" fill="#E8F4FD" stroke="#F39C12" stroke-width="4"/>
                <line x1="550" y1="580" x2="600" y2="580" stroke="#4A90D9" stroke-width="6"/>
                <path d="M 525 605 A 15 15 0 0 1 525 635 Z" fill="#2C3E50"/>
            </g>
        </g>

        <!-- Animated Crystals & Toxins -->
        <g class="crystal1-anim"><use href="#crystal"/></g>
        <g class="crystal2-anim"><use href="#crystal"/></g>
        
        <g class="toxin1-anim"><use href="#toxin"/></g>
        <g class="toxin2-anim"><use href="#toxin"/></g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(800, 520)">
            <rect width="180" height="160" fill="#FFFFFF" stroke="#2C3E50" stroke-width="1" rx="5"/>
            <text x="90" y="20" class="subtitle" font-size="14">Legend</text>
            
            <line x1="15" y1="40" x2="35" y2="40" stroke="#4A90D9" stroke-width="4"/>
            <text x="45" y="44" class="legend-text">Cell Membrane</text>

            <circle cx="25" cy="65" r="6" fill="#2C3E50"/>
            <text x="45" y="69" class="legend-text">Nucleus</text>

            <rect x="15" y="85" width="20" height="10" fill="#E8F4FD" stroke="#F39C12" stroke-width="2"/>
            <text x="45" y="94" class="legend-text">Epithelial Tissue</text>

            <use href="#crystal" x="25" y="115"/>
            <text x="45" y="119" class="legend-text">Cry Protein Crystal</text>

            <use href="#toxin" x="25" y="140" transform="scale(0.8) translate(6, 35)"/>
            <text x="45" y="144" class="legend-text">Activated Toxin</text>
        </g>

    </svg>
</div>

</body>
</html>
