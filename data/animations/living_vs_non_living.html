<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cell: The Unit of Life (Living vs. Non-Living)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            display: block;
        }
        
        /* CSS Animations */
        @keyframes pulse {
            0%, 100% { 
                opacity: 0.7; 
                filter: drop-shadow(0 0 2px rgba(231,76,60,0.3)); 
            }
            50% { 
                opacity: 1; 
                filter: drop-shadow(0 0 8px rgba(231,76,60,0.8)); 
            }
        }
        
        @keyframes cyclosis {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @keyframes brownian {
            0% { transform: translate(0px, 0px) rotate(0deg); }
            25% { transform: translate(1px, -1px) rotate(0.5deg); }
            50% { transform: translate(-1px, 1px) rotate(-0.5deg); }
            75% { transform: translate(1px, 1px) rotate(0.2deg); }
            100% { transform: translate(0px, 0px) rotate(0deg); }
        }
        
        @keyframes transport {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: 1; }
            50% { transform: translate(50px, 10px); opacity: 1; }
            70% { transform: translate(70px, 15px); opacity: 0; }
            100% { transform: translate(70px, 15px); opacity: 0; }
        }

        @keyframes transport2 {
            0% { transform: translate(0, 0); opacity: 0; }
            15% { opacity: 1; }
            50% { transform: translate(60px, -5px); opacity: 1; }
            70% { transform: translate(80px, -10px); opacity: 0; }
            100% { transform: translate(80px, -10px); opacity: 0; }
        }

        .mito { 
            animation: pulse 3s infinite ease-in-out; 
        }
        
        .flow-group { 
            animation: cyclosis 18s infinite linear; 
            transform-origin: 200px 280px; 
        }
        
        .inert-group { 
            animation: brownian 0.3s infinite linear; 
            transform-origin: 600px 280px;
        }
        
        .active-transport-1 { 
            animation: transport 4s infinite ease-in-out; 
        }
        
        .active-transport-2 { 
            animation: transport2 5s infinite ease-in-out; 
            animation-delay: 2s;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram comparing a living unicellular organism to non-living sub-cellular and inorganic structures.">
        <title>The Cell: The Unit of Life (Living vs. Non-Living)</title>
        <desc>An animated comparison showing the dynamic, metabolic nature of a living cell versus the static, inert nature of viruses and minerals.</desc>

        <!-- Definitions for markers and filters -->
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" />
            </marker>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2.5" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" rx="16"/>

        <!-- Center Threshold Line -->
        <line x1="400" y1="100" x2="400" y2="460" stroke="#D1D8E0" stroke-width="2" stroke-dasharray="8,6" />
        <rect x="320" y="465" width="160" height="24" fill="#f8f9fa" rx="12" />
        <text x="400" y="482" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#7F8C8D" letter-spacing="0.5">THE CELLULAR THRESHOLD</text>

        <!-- Main Titles -->
        <text x="400" y="45" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#2C3E50">The Cell: The Unit of Life</text>
        <text x="400" y="65" text-anchor="middle" font-family="Inter" font-size="14" font-weight="400" fill="#7F8C8D">Living vs. Non-Living Entities</text>

        <text x="200" y="105" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#4A90D9">LIVING: Unicellular Organism</text>
        <text x="600" y="105" text-anchor="middle" font-family="Inter" font-size="16" font-weight="600" fill="#95A5A6">NON-LIVING: Sub-cellular / Inorganic</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: LIVING CELL                    -->
        <!-- ========================================== -->
        
        <!-- Active Transport Particles (Outside to Inside) -->
        <g class="active-transport-1">
            <circle cx="25" cy="280" r="4" fill="#F39C12" filter="url(#glow)"/>
        </g>
        <g class="active-transport-2">
            <circle cx="35" cy="220" r="4" fill="#F39C12" filter="url(#glow)"/>
        </g>

        <!-- Cell Membrane and Cytoplasm -->
        <path fill="#E8F4FD" stroke="#4A90D9" stroke-width="3">
            <animate attributeName="d" dur="5s" repeatCount="indefinite"
                values="
                    M 200 150 C 271.8 150 330 208.2 330 280 C 330 351.8 271.8 410 200 410 C 128.2 410 70 351.8 70 280 C 70 208.2 128.2 150 200 150 Z;
                    M 200 145 C 275 155 335 200 325 280 C 315 360 265 415 200 405 C 135 395 65 355 75 280 C 85 205 125 135 200 145 Z;
                    M 200 155 C 265 145 325 215 335 280 C 345 345 275 405 200 415 C 125 425 75 345 65 280 C 55 215 135 165 200 155 Z;
                    M 200 150 C 271.8 150 330 208.2 330 280 C 330 351.8 271.8 410 200 410 C 128.2 410 70 351.8 70 280 C 70 208.2 128.2 150 200 150 Z" />
        </path>

        <!-- Nucleus -->
        <circle cx="200" cy="280" r="38" fill="#2C3E50" stroke="#1A252F" stroke-width="2"/>
        <!-- Coiled DNA inside Nucleus -->
        <path d="M 172 280 C 178 255, 190 305, 196 280 C 202 255, 214 305, 220 280 C 226 255, 238 305, 232 280" stroke="#FF6B6B" fill="none" stroke-width="2.5" stroke-linecap="round"/>

        <!-- Mitochondria -->
        <g transform="translate(125, 225) rotate(45)" class="mito">
            <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#E74C3C"/>
            <path d="M -14 0 Q -7 -12 0 0 T 14 0" stroke="#f8f9fa" fill="none" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <g transform="translate(265, 340) rotate(-20)" class="mito" style="animation-delay: 1.5s;">
            <rect x="-20" y="-11" width="40" height="22" rx="11" fill="#E74C3C"/>
            <path d="M -12 0 Q -6 -10 0 0 T 12 0" stroke="#f8f9fa" fill="none" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- Cytoplasmic Streaming (Cyclosis) -->
        <g class="flow-group">
            <!-- Ribosomes -->
            <circle cx="140" cy="190" r="2.5" fill="#98D8C8"/>
            <circle cx="260" cy="210" r="2.5" fill="#98D8C8"/>
            <circle cx="290" cy="270" r="2.5" fill="#98D8C8"/>
            <circle cx="240" cy="370" r="2.5" fill="#98D8C8"/>
            <circle cx="130" cy="350" r="2.5" fill="#98D8C8"/>
            <circle cx="95" cy="290" r="2.5" fill="#98D8C8"/>
            <circle cx="170" cy="380" r="2.5" fill="#98D8C8"/>
            <circle cx="280" cy="310" r="2.5" fill="#98D8C8"/>
            
            <!-- Metabolic Particles (ATP/Nutrients) -->
            <circle cx="160" cy="170" r="4" fill="#F39C12" filter="url(#glow)"/>
            <circle cx="295" cy="330" r="4" fill="#F39C12" filter="url(#glow)"/>
            <circle cx="110" cy="320" r="4" fill="#F39C12" filter="url(#glow)"/>
            <circle cx="230" cy="180" r="4" fill="#F39C12" filter="url(#glow)"/>
        </g>

        <!-- Left Callouts -->
        <text x="130" y="130" text-anchor="end" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">Independent Existence</text>
        <polyline points="135,126 175,165" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

        <text x="110" y="430" text-anchor="end" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">Metabolic Machinery</text>
        <polyline points="115,426 125,360" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

        <text x="360" y="430" text-anchor="end" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">Homeostasis</text>
        <polyline points="365,426 310,380" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>


        <!-- ========================================== -->
        <!-- RIGHT PANEL: NON-LIVING ENTITIES           -->
        <!-- ========================================== -->
        
        <g class="inert-group">
            
            <!-- Bacteriophage (Virus) -->
            <g transform="translate(550, 210)">
                <!-- Tail -->
                <rect x="-4" y="0" width="8" height="38" fill="#BDC3C7"/>
                <!-- Baseplate -->
                <rect x="-12" y="38" width="24" height="5" fill="#2C3E50" rx="1.5"/>
                <!-- Tail Fibers -->
                <polyline points="-12,40 -28,55 -22,70" stroke="#98D8C8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="12,40 28,55 22,70" stroke="#98D8C8" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                <polyline points="-6,40 -18,60" stroke="#98D8C8" fill="none" stroke-width="2.5" stroke-linecap="round"/>
                <polyline points="6,40 18,60" stroke="#98D8C8" fill="none" stroke-width="2.5" stroke-linecap="round"/>
                <!-- Capsid Head -->
                <polygon points="0,-45 22,-25 22,0 0,12 -22,0 -22,-25" fill="#98D8C8" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                <!-- Static Viral DNA -->
                <path d="M -12 -22 Q 0 -35 12 -22 T -6 -5" stroke="#FF6B6B" fill="none" stroke-width="2.5" stroke-linecap="round"/>
            </g>
            
            <!-- Inorganic Mineral/Crystal -->
            <g transform="translate(650, 360)">
                <!-- Back/Darker facets -->
                <polygon points="0,-55 22,-12 0,45" fill="#7F8C8D" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                <polygon points="0,-55 -22,-12 0,45" fill="#95A5A6" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                <!-- Front/Lighter facets -->
                <polygon points="0,-55 22,-12 0,12" fill="#BDC3C7" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                <polygon points="0,-55 -22,-12 0,12" fill="#D1D8E0" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                
                <!-- Side Crystal Right -->
                <polygon points="18,-5 45,12 22,38 12,22" fill="#95A5A6" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                <polygon points="18,-5 45,12 28,5" fill="#BDC3C7" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                
                <!-- Side Crystal Left -->
                <polygon points="-18,0 -40,22 -18,50 -6,28" fill="#7F8C8D" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
                <polygon points="-18,0 -40,22 -22,12" fill="#95A5A6" stroke="#2C3E50" stroke-width="1" stroke-linejoin="round"/>
            </g>
            
        </g>

        <!-- Right Callouts -->
        <text x="670" y="160" text-anchor="start" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">Sub-cellular Structure</text>
        <polyline points="665,156 575,185" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

        <text x="670" y="260" text-anchor="start" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">Inert Outside Host</text>
        <polyline points="665,256 585,256" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

        <text x="670" y="430" text-anchor="start" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-weight="500">No Independent Metabolism</text>
        <polyline points="665,426 650,405" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>


        <!-- ========================================== -->
        <!-- LEGEND / KEY                               -->
        <!-- ========================================== -->
        <g transform="translate(20, 400)">
            <rect x="0" y="0" width="145" height="80" fill="#ffffff" stroke="#D1D8E0" stroke-width="1" rx="6" opacity="0.95"/>
            <text x="12" y="18" font-family="Inter" font-size="10" font-weight="700" fill="#2C3E50" letter-spacing="0.5">BIOLOGICAL KEY</text>
            
            <circle cx="15" cy="32" r="3.5" fill="#FF6B6B"/>
            <text x="28" y="35" font-family="Inter" font-size="10" fill="#34495E">Genetic Material</text>
            
            <circle cx="15" cy="48" r="3.5" fill="#F39C12"/>
            <text x="28" y="51" font-family="Inter" font-size="10" fill="#34495E">Energy / Nutrients</text>
            
            <circle cx="15" cy="64" r="3.5" fill="#E74C3C"/>
            <text x="28" y="67" font-family="Inter" font-size="10" fill="#34495E">Active Organelles</text>
        </g>

    </svg>
</div>

</body>
</html>
