<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maturation of Human Insulin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Global Animation Loop */
        #animation-container {
            animation: globalFade 12s infinite;
        }

        @keyframes globalFade {
            0%, 4% { opacity: 0; }
            8%, 92% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        /* Phase 2: Sulfur Glow */
        .sulfur {
            opacity: 0.4;
            transition: all 0.3s ease;
            animation: sulfurGlow 12s infinite;
        }

        @keyframes sulfurGlow {
            0%, 24% { opacity: 0.4; filter: none; }
            28%, 92% { opacity: 1; filter: drop-shadow(0 0 6px rgba(241, 196, 15, 0.9)); }
            96%, 100% { opacity: 0.4; filter: none; }
        }

        /* Phase 2: Disulfide Bonds */
        .bond {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            opacity: 0;
            animation: drawBond 12s infinite;
        }

        @keyframes drawBond {
            0%, 25% { stroke-dashoffset: 150; opacity: 0; stroke: #F39C12; filter: none; }
            26% { opacity: 1; stroke-dashoffset: 150; }
            32% { stroke-dashoffset: 0; stroke: #FFF; filter: drop-shadow(0 0 8px #F39C12); }
            36%, 92% { stroke-dashoffset: 0; opacity: 1; stroke: #F39C12; filter: none; }
            96%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        /* Phase 3: Enzyme Cleavage */
        .wedge-top {
            opacity: 0;
            animation: wedgeTopAnim 12s infinite;
        }
        .wedge-bot {
            opacity: 0;
            animation: wedgeBotAnim 12s infinite;
        }

        @keyframes wedgeTopAnim {
            0%, 48% { opacity: 0; transform: translateY(-15px); }
            50% { opacity: 1; transform: translateY(0); }
            55% { opacity: 1; transform: translateY(3px); }
            58%, 100% { opacity: 0; transform: translateY(-15px); }
        }

        @keyframes wedgeBotAnim {
            0%, 48% { opacity: 0; transform: translateY(15px); }
            50% { opacity: 1; transform: translateY(0); }
            55% { opacity: 1; transform: translateY(-3px); }
            58%, 100% { opacity: 0; transform: translateY(15px); }
        }

        /* Phase 3: C-peptide Drift */
        #c-peptide-group {
            animation: cPeptideDrift 12s infinite;
        }

        @keyframes cPeptideDrift {
            0%, 55% { transform: translateY(0); opacity: 1; }
            65% { transform: translateY(-25px); opacity: 1; }
            75%, 95% { transform: translateY(-70px); opacity: 0; }
            100% { transform: translateY(0); opacity: 0; }
        }

        /* Phase 4: Mature Insulin Pulse */
        #mature-insulin {
            transform-origin: 400px 290px;
            animation: maturePulse 12s infinite;
        }

        @keyframes maturePulse {
            0%, 75% { transform: scale(1); filter: none; }
            80% { transform: scale(1.03); filter: drop-shadow(0 8px 12px rgba(0,0,0,0.1)); }
            85%, 100% { transform: scale(1); filter: none; }
        }

        /* Dynamic Text States */
        .state-1 { animation: state1Anim 12s infinite; }
        .state-2 { animation: state2Anim 12s infinite; }
        .state-3 { animation: state3Anim 12s infinite; }

        @keyframes state1Anim { 0%, 24% {opacity: 1;} 25%, 100% {opacity: 0;} }
        @keyframes state2Anim { 0%, 24% {opacity: 0;} 25%, 49% {opacity: 1;} 50%, 100% {opacity: 0;} }
        @keyframes state3Anim { 0%, 49% {opacity: 0;} 50%, 95% {opacity: 1;} 96%, 100% {opacity: 0;} }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .label { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .label-small { font-size: 12px; font-weight: 400; fill: #7f8c8d; }
        .mono { font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 500; fill: #2C3E50; }
        .state-text { font-size: 16px; font-weight: 700; fill: #ffffff; }
        .term-label { font-size: 11px; font-weight: 700; fill: #2C3E50; font-family: 'Roboto Mono', monospace; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Maturation of Human Insulin: Disulfide Bond Formation</title>
        <desc>Animated diagram showing the transition from Pro-insulin to Mature Insulin, highlighting the formation of disulfide bonds and the removal of the C-peptide.</desc>

        <!-- Definitions for markers and filters -->
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" />
            </marker>
            <filter id="ribbon-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Static Header & Legend -->
        <text x="400" y="45" text-anchor="middle" class="title">Maturation of Human Insulin: Disulfide Bond Formation</text>
        
        <g transform="translate(620, 20)">
            <rect width="150" height="105" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
            <line x1="10" y1="20" x2="35" y2="20" stroke="#98D8C8" stroke-width="6" stroke-linecap="round" />
            <text x="45" y="24" class="label" font-size="12">Chain A</text>
            
            <line x1="10" y1="45" x2="35" y2="45" stroke="#4A90D9" stroke-width="6" stroke-linecap="round" />
            <text x="45" y="49" class="label" font-size="12">Chain B</text>
            
            <line x1="10" y1="70" x2="35" y2="70" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" />
            <text x="45" y="74" class="label" font-size="12">C-peptide</text>
            
            <line x1="10" y1="95" x2="35" y2="95" stroke="#F39C12" stroke-width="3" stroke-dasharray="4,2" />
            <text x="45" y="99" class="label" font-size="12">Disulfide Bond</text>
        </g>

        <!-- Main Animation Container -->
        <g id="animation-container">
            
            <!-- C-Peptide Group (Detaches and drifts) -->
            <g id="c-peptide-group">
                <!-- C-peptide Ribbon -->
                <path d="M 560 320 C 660 320 660 100 400 100 C 140 100 140 260 260 260" 
                      fill="none" stroke="#FF6B6B" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#ribbon-shadow)" />
                
                <!-- C-peptide Labels -->
                <text x="400" y="145" text-anchor="middle" class="label" fill="#E74C3C">C-peptide</text>
                <text x="400" y="162" text-anchor="middle" class="label-small">(Removed during processing)</text>
            </g>

            <!-- Mature Insulin Group (Chains A & B + Bonds) -->
            <g id="mature-insulin">
                
                <!-- Disulfide Bonds (Drawn dynamically) -->
                <g id="disulfide-bonds">
                    <!-- Intra-chain A6-A11 -->
                    <path d="M 320 240 Q 350 215 380 240" fill="none" stroke="#F39C12" stroke-width="4" class="bond" />
                    <!-- Inter-chain A7-B7 -->
                    <line x1="340" y1="260" x2="340" y2="320" stroke="#F39C12" stroke-width="4" class="bond" />
                    <!-- Inter-chain A20-B19 -->
                    <line x1="480" y1="260" x2="480" y2="320" stroke="#F39C12" stroke-width="4" class="bond" />
                </g>

                <!-- Chain B Ribbon (30 aa) -->
                <path d="M 220 320 Q 280 340 340 320 Q 410 300 480 320 Q 520 330 560 320" 
                      fill="none" stroke="#4A90D9" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#ribbon-shadow)" />
                
                <!-- Chain A Ribbon (21 aa) -->
                <path d="M 260 260 Q 290 260 320 240 Q 330 230 340 260 Q 360 290 380 240 Q 430 200 480 260 Q 500 280 520 240" 
                      fill="none" stroke="#98D8C8" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#ribbon-shadow)" />

                <!-- Sulfur Atoms (Cysteine Residues) -->
                <g id="sulfur-atoms">
                    <!-- Chain A Sulfurs -->
                    <circle cx="320" cy="240" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                    <circle cx="340" cy="260" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                    <circle cx="380" cy="240" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                    <circle cx="480" cy="260" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                    <!-- Chain B Sulfurs -->
                    <circle cx="340" cy="320" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                    <circle cx="480" cy="320" r="5" fill="#F1C40F" stroke="#2C3E50" stroke-width="1.5" class="sulfur" />
                </g>

                <!-- Chain Termini Labels -->
                <text x="190" y="324" text-anchor="end" class="term-label">NH₃⁺</text>
                <text x="535" y="244" text-anchor="start" class="term-label">COO⁻</text>

                <!-- Chain Labels -->
                <text x="160" y="265" text-anchor="end" class="label">Chain A (21 aa)</text>
                <text x="160" y="345" text-anchor="end" class="label">Chain B (30 aa)</text>
            </g>

            <!-- Proteolytic Enzymes (Cleavage Wedges) -->
            <!-- Site 1: C-peptide / Chain A Junction -->
            <g transform="translate(260, 260)">
                <polygon points="-8,-22 8,-22 0,-4" fill="#E74C3C" class="wedge-top" />
                <polygon points="-8,22 8,22 0,4" fill="#E74C3C" class="wedge-bot" />
            </g>
            <!-- Site 2: Chain B / C-peptide Junction -->
            <g transform="translate(560, 320)">
                <polygon points="-8,-22 8,-22 0,-4" fill="#E74C3C" class="wedge-top" />
                <polygon points="-8,22 8,22 0,4" fill="#E74C3C" class="wedge-bot" />
            </g>

            <!-- Bond Annotations -->
            <g id="bond-annotations">
                <text x="410" y="380" text-anchor="middle" class="mono">Disulfide Bridges (S-S)</text>
                <!-- Arrow to A7-B7 -->
                <path d="M 370 365 Q 350 350 345 330" fill="none" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)" />
                <!-- Arrow to A20-B19 -->
                <path d="M 450 365 Q 470 350 475 330" fill="none" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)" />
                <!-- Arrow to A6-A11 -->
                <path d="M 410 360 Q 410 280 385 245" fill="none" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arrow)" />
            </g>

        </g>

        <!-- Dynamic State Text Box (Bottom Center) -->
        <g transform="translate(400, 450)">
            <rect x="-160" y="-22" width="320" height="44" rx="22" fill="#2C3E50" filter="url(#ribbon-shadow)" />
            <text y="5" text-anchor="middle" class="state-text state-1">State: Pro-insulin (Inactive)</text>
            <text y="5" text-anchor="middle" class="state-text state-2">State: Folding &amp; Bond Formation</text>
            <text y="5" text-anchor="middle" class="state-text state-3">State: Mature Insulin (Active)</text>
        </g>

    </svg>
</div>

</body>
</html>
