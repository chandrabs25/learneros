<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Effect (+R and -R)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Animation Keyframes for States (Crossfading) */
        .state0 { animation: s0 12s infinite ease-in-out; }
        @keyframes s0 { 0%, 18% { opacity: 1; } 22%, 88% { opacity: 0; } 92%, 100% { opacity: 1; } }

        .state1 { animation: s1 12s infinite ease-in-out; }
        @keyframes s1 { 0%, 18% { opacity: 0; } 22%, 38% { opacity: 1; } 42%, 100% { opacity: 0; } }

        .state2 { animation: s2 12s infinite ease-in-out; }
        @keyframes s2 { 0%, 38% { opacity: 0; } 42%, 58% { opacity: 1; } 62%, 100% { opacity: 0; } }

        .state3 { animation: s3 12s infinite ease-in-out; }
        @keyframes s3 { 0%, 58% { opacity: 0; } 62%, 78% { opacity: 1; } 82%, 100% { opacity: 0; } }

        .state4 { animation: s4 12s infinite ease-in-out; }
        @keyframes s4 { 0%, 78% { opacity: 0; } 82%, 88% { opacity: 1; } 92%, 100% { opacity: 0; } }

        /* Animation Keyframes for Arrows */
        .arrow {
            fill: none;
            stroke: #F77F00;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            marker-end: url(#arrowhead);
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
        }

        .arrow1 { animation: a1 12s infinite ease-in-out; }
        @keyframes a1 {
            0%, 10% { stroke-dashoffset: 150; opacity: 0; }
            11% { opacity: 1; stroke-dashoffset: 150; }
            18% { stroke-dashoffset: 0; opacity: 1; }
            22%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        .arrow2 { animation: a2 12s infinite ease-in-out; }
        @keyframes a2 {
            0%, 30% { stroke-dashoffset: 150; opacity: 0; }
            31% { opacity: 1; stroke-dashoffset: 150; }
            38% { stroke-dashoffset: 0; opacity: 1; }
            42%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        .arrow3 { animation: a3 12s infinite ease-in-out; }
        @keyframes a3 {
            0%, 50% { stroke-dashoffset: 150; opacity: 0; }
            51% { opacity: 1; stroke-dashoffset: 150; }
            58% { stroke-dashoffset: 0; opacity: 1; }
            62%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        .arrow4 { animation: a4 12s infinite ease-in-out; }
        @keyframes a4 {
            0%, 70% { stroke-dashoffset: 150; opacity: 0; }
            71% { opacity: 1; stroke-dashoffset: 150; }
            78% { stroke-dashoffset: 0; opacity: 1; }
            82%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Charge Pulse Animation */
        .charge { animation: pulse 12s infinite ease-in-out; }
        @keyframes pulse {
            0%, 100% { transform: scale(0.95); }
            50% { transform: scale(1.05); }
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-size: 28px; font-weight: 700; fill: #2d3436; }
        .subtitle { font-family: 'Inter', sans-serif; font-size: 18px; font-weight: 600; }
        .desc { font-family: 'Inter', sans-serif; font-size: 14px; fill: #636e72; }
        .atom { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; dominant-baseline: middle; text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 16px; fill: #636e72; font-weight: 500; }
        .label { font-family: 'Inter', sans-serif; font-size: 14px; font-style: italic; fill: #adb5bd; dominant-baseline: middle; text-anchor: middle; }
        .charge-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; dominant-baseline: central; text-anchor: middle; }
        
        /* Structural Elements */
        .bond-single { stroke: #404040; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .bond-pi { stroke: #636e72; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
        .lone-pair { fill: #404040; }
    </style>
</head>
<body>

<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Arrowhead Marker -->
        <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
            <path d="M 1 1 L 6 3.5 L 1 6 Z" fill="#F77F00" />
        </marker>
        
        <!-- Drop Shadow for Charges -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.2"/>
        </filter>
    </defs>

    <!-- UI: Titles and Labels -->
    <text x="500" y="45" text-anchor="middle" class="title">Resonance Effect: Directive Influence in Benzene</text>
    
    <!-- +R Effect Header -->
    <text x="250" y="100" text-anchor="middle" class="subtitle" fill="#FF4444">+R Effect</text>
    <text x="250" y="120" text-anchor="middle" class="desc">(Activating / Ortho-Para Directing)</text>
    <text x="250" y="490" text-anchor="middle" class="formula">Phenol (C<tspan dy="4" font-size="12">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="12">5</tspan><tspan dy="-4">OH)</tspan></text>

    <!-- -R Effect Header -->
    <text x="750" y="100" text-anchor="middle" class="subtitle" fill="#4444FF">-R Effect</text>
    <text x="750" y="120" text-anchor="middle" class="desc">(Deactivating / Meta Directing)</text>
    <text x="750" y="490" text-anchor="middle" class="formula">Nitrobenzene (C<tspan dy="4" font-size="12">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="12">5</tspan><tspan dy="-4">NO</tspan><tspan dy="4" font-size="12">2</tspan><tspan dy="-4">)</tspan></text>

    <!-- ========================================== -->
    <!-- LEFT SIDE: +R EFFECT (PHENOL)              -->
    <!-- ========================================== -->
    <g transform="translate(250, 310)">
        <!-- Static Background Labels (o, m, p) -->
        <text x="-75" y="-30" class="label">o</text>
        <text x="75" y="-30" class="label">o</text>
        <text x="-75" y="30" class="label">m</text>
        <text x="75" y="30" class="label">m</text>
        <text x="0" y="85" class="label">p</text>

        <!-- Static Base Structure -->
        <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" class="bond-single"/>
        <line x1="0" y1="-60" x2="0" y2="-100" class="bond-single"/> <!-- C-O bond -->
        <line x1="12" y1="-105" x2="30" y2="-115" class="bond-single"/> <!-- O-H bond -->
        
        <circle cx="0" cy="-100" r="14" fill="#ffffff"/>
        <text x="0" y="-100" class="atom" fill="#FF4444">O</text>
        <text x="40" y="-115" class="atom" fill="#CCCCCC">H</text>

        <!-- Dynamic States for Phenol -->
        
        <!-- State 0: Neutral Phenol -->
        <g class="state0">
            <!-- Pi Bonds -->
            <path d="M -42,-24 L -8,-44 M 42,-24 L 42,24 M -8,44 L -42,24" class="bond-pi"/>
            <!-- O Lone Pairs -->
            <circle cx="-14" cy="-105" r="2" class="lone-pair"/>
            <circle cx="-18" cy="-98" r="2" class="lone-pair"/>
            <circle cx="14" cy="-90" r="2" class="lone-pair"/>
            <circle cx="18" cy="-97" r="2" class="lone-pair"/>
        </g>

        <!-- State 1: Ortho Negative -->
        <g class="state1">
            <!-- Pi Bonds & Double C=O -->
            <path d="M 42,-24 L 42,24 M -8,44 L -42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <!-- O Lone Pair -->
            <circle cx="14" cy="-90" r="2" class="lone-pair"/>
            <circle cx="18" cy="-97" r="2" class="lone-pair"/>
            <!-- Charges -->
            <g class="charge" transform="translate(18, -112)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
            <g class="charge" transform="translate(-65, -30)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <circle cx="-52" cy="-30" r="3" fill="#FF4444"/> <!-- Carbanion lone pair indicator -->
        </g>

        <!-- State 2: Para Negative -->
        <g class="state2">
            <!-- Pi Bonds & Double C=O -->
            <path d="M -42,-24 L -42,24 M 42,-24 L 42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <circle cx="14" cy="-90" r="2" class="lone-pair"/>
            <circle cx="18" cy="-97" r="2" class="lone-pair"/>
            <!-- Charges -->
            <g class="charge" transform="translate(18, -112)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
            <g class="charge" transform="translate(0, 75)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <circle cx="0" cy="60" r="3" fill="#FF4444"/>
        </g>

        <!-- State 3: Ortho Negative (Right) -->
        <g class="state3">
            <!-- Pi Bonds & Double C=O -->
            <path d="M -42,-24 L -42,24 M 8,44 L 42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <circle cx="14" cy="-90" r="2" class="lone-pair"/>
            <circle cx="18" cy="-97" r="2" class="lone-pair"/>
            <!-- Charges -->
            <g class="charge" transform="translate(18, -112)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
            <g class="charge" transform="translate(65, -30)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <circle cx="52" cy="-30" r="3" fill="#FF4444"/>
        </g>

        <!-- State 4: Neutral Phenol (Alternate Kekule) -->
        <g class="state4">
            <!-- Pi Bonds -->
            <path d="M 8,-44 L 42,-24 M 42,24 L 8,44 M -42,24 L -42,-24" class="bond-pi"/>
            <!-- O Lone Pairs -->
            <circle cx="-14" cy="-105" r="2" class="lone-pair"/>
            <circle cx="-18" cy="-98" r="2" class="lone-pair"/>
            <circle cx="14" cy="-90" r="2" class="lone-pair"/>
            <circle cx="18" cy="-97" r="2" class="lone-pair"/>
        </g>

        <!-- Animated Electron Flow Arrows (Phenol) -->
        <path d="M -16,-100 Q -30,-85 -8,-75" class="arrow arrow1"/>
        <path d="M -25,-34 Q -45,-45 -52,-35" class="arrow arrow1"/>
        
        <path d="M -55,-25 Q -75,-5 -45,0" class="arrow arrow2"/>
        <path d="M -25,34 Q -40,55 -5,58" class="arrow arrow2"/>
        
        <path d="M 5,58 Q 30,65 25,34" class="arrow arrow3"/>
        <path d="M 42,0 Q 65,-5 52,-25" class="arrow arrow3"/>
        
        <path d="M 52,-35 Q 45,-55 25,-34" class="arrow arrow4"/>
        <path d="M -6,-75 Q -25,-85 -12,-98" class="arrow arrow4"/>
    </g>


    <!-- ========================================== -->
    <!-- RIGHT SIDE: -R EFFECT (NITROBENZENE)       -->
    <!-- ========================================== -->
    <g transform="translate(750, 310)">
        <!-- Static Background Labels (o, m, p) -->
        <text x="-75" y="-30" class="label">o</text>
        <text x="75" y="-30" class="label">o</text>
        <text x="-75" y="30" class="label">m</text>
        <text x="75" y="30" class="label">m</text>
        <text x="0" y="85" class="label">p</text>

        <!-- Static Base Structure -->
        <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" class="bond-single"/>
        <line x1="0" y1="-60" x2="0" y2="-100" class="bond-single"/> <!-- C-N bond -->
        <line x1="8" y1="-105" x2="28" y2="-118" class="bond-single"/> <!-- N-O(right) single bond -->
        
        <circle cx="0" cy="-100" r="14" fill="#ffffff"/>
        <text x="0" y="-100" class="atom" fill="#4444FF">N</text>
        <text x="38" y="-122" class="atom" fill="#FF4444">O</text>

        <!-- Static Charges for Nitro Group -->
        <g transform="translate(18, -85)">
            <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
        </g>
        <g transform="translate(52, -110)">
            <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
        </g>

        <!-- Dynamic States for Nitrobenzene -->
        
        <!-- State 0: Neutral Nitrobenzene -->
        <g class="state0">
            <!-- Pi Bonds -->
            <path d="M -42,-24 L -8,-44 M 42,-24 L 42,24 M -8,44 L -42,24" class="bond-pi"/>
            <!-- N=O(left) double bond -->
            <path d="M -8,-100 L -28,-113 M -4,-106 L -24,-119" class="bond-pi"/>
            <text x="-38" y="-122" class="atom" fill="#FF4444">O</text>
        </g>

        <!-- State 1: Ortho Positive -->
        <g class="state1">
            <!-- Pi Bonds & Double C=N -->
            <path d="M 42,-24 L 42,24 M -8,44 L -42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <!-- N-O(left) single bond -->
            <line x1="-8" y1="-105" x2="-28" y2="-118" class="bond-single"/>
            <text x="-38" y="-122" class="atom" fill="#FF4444">O</text>
            <!-- Charges -->
            <g class="charge" transform="translate(-52, -110)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <g class="charge" transform="translate(-65, -30)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
        </g>

        <!-- State 2: Para Positive -->
        <g class="state2">
            <!-- Pi Bonds & Double C=N -->
            <path d="M -42,-24 L -42,24 M 42,-24 L 42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <!-- N-O(left) single bond -->
            <line x1="-8" y1="-105" x2="-28" y2="-118" class="bond-single"/>
            <text x="-38" y="-122" class="atom" fill="#FF4444">O</text>
            <!-- Charges -->
            <g class="charge" transform="translate(-52, -110)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <g class="charge" transform="translate(0, 75)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
        </g>

        <!-- State 3: Ortho Positive (Right) -->
        <g class="state3">
            <!-- Pi Bonds & Double C=N -->
            <path d="M -42,-24 L -42,24 M 8,44 L 42,24 M -6,-60 L -6,-95" class="bond-pi"/>
            <!-- N-O(left) single bond -->
            <line x1="-8" y1="-105" x2="-28" y2="-118" class="bond-single"/>
            <text x="-38" y="-122" class="atom" fill="#FF4444">O</text>
            <!-- Charges -->
            <g class="charge" transform="translate(-52, -110)">
                <circle r="9" fill="#FF4444" filter="url(#shadow)"/><text class="charge-text">-</text>
            </g>
            <g class="charge" transform="translate(65, -30)">
                <circle r="9" fill="#4444FF" filter="url(#shadow)"/><text class="charge-text">+</text>
            </g>
        </g>

        <!-- State 4: Neutral Nitrobenzene (Alternate Kekule) -->
        <g class="state4">
            <!-- Pi Bonds -->
            <path d="M 8,-44 L 42,-24 M 42,24 L 8,44 M -42,24 L -42,-24" class="bond-pi"/>
            <!-- N=O(left) double bond -->
            <path d="M -8,-100 L -28,-113 M -4,-106 L -24,-119" class="bond-pi"/>
            <text x="-38" y="-122" class="atom" fill="#FF4444">O</text>
        </g>

        <!-- Animated Electron Flow Arrows (Nitrobenzene) -->
        <path d="M -25,-34 Q -30,-60 -8,-75" class="arrow arrow1"/>
        <path d="M -16,-105 Q -25,-125 -35,-115" class="arrow arrow1"/>
        
        <path d="M -25,34 Q -15,15 -42,0" class="arrow arrow2"/>
        
        <path d="M 42,0 Q 25,15 25,34" class="arrow arrow3"/>
        
        <path d="M 6,-75 Q 25,-60 25,-34" class="arrow arrow4"/>
        <path d="M -45,-125 Q -30,-140 -18,-110" class="arrow arrow4"/>
    </g>

    <!-- ========================================== -->
    <!-- LEGEND                                     -->
    <!-- ========================================== -->
    <g transform="translate(250, 530)">
        <rect x="0" y="0" width="500" height="50" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
        
        <!-- Arrow Legend -->
        <path d="M 20,25 Q 35,15 50,25" class="arrow" style="animation: none; stroke-dasharray: none;"/>
        <text x="65" y="30" class="desc" fill="#333">Electron Pair Movement</text>
        
        <!-- Charge Legend -->
        <circle cx="270" cy="25" r="8" fill="#FF4444"/>
        <text x="270" y="25" class="charge-text">-</text>
        <circle cx="295" cy="25" r="8" fill="#4444FF"/>
        <text x="295" y="25" class="charge-text">+</text>
        <text x="315" y="30" class="desc" fill="#333">Formal Charge Shift</text>
    </g>

</svg>

</body>
</html>
