<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorsiventral Leaf Anatomy & Water Stress Response</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7f8c8d; }
        .tech-text { font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 500; fill: #2C3E50; }
        .status-text { font-size: 16px; font-weight: 700; }
        .legend-text { font-size: 12px; fill: #2C3E50; }

        /* Biological Colors & Styles */
        .membrane { stroke: #4A90D9; stroke-width: 1.5; fill: #E8F4FD; }
        .cuticle { fill: rgba(255, 255, 255, 0.6); stroke: #bdc3c7; stroke-width: 1.5; }
        .palisade { stroke: #2ECC71; stroke-width: 1.5; fill: #eafaf1; }
        .spongy { stroke: #2ECC71; stroke-width: 1.5; fill: #eafaf1; }
        .chloroplast { fill: #27AE60; }
        .xylem { stroke: #E74C3C; stroke-width: 1.5; fill: #fadbd8; }
        .phloem { stroke: #3498DB; stroke-width: 1.5; fill: #d6eaf8; }
        .bundle-sheath { stroke: #98D8C8; stroke-width: 2; fill: #e8f6f3; }
        .label-line { stroke: #2C3E50; stroke-width: 1.5; stroke-dasharray: 4 2; }
        .label-dot { fill: #2C3E50; }

        /* Animations */
        .left-flank {
            transform-origin: 360px 180px;
            animation: curlLeft 12s ease-in-out infinite;
        }

        .right-flank {
            transform-origin: 440px 180px;
            animation: curlRight 12s ease-in-out infinite;
        }

        .bulliform-group {
            transform-origin: 400px 220px;
            animation: shrinkBulliform 12s ease-in-out infinite;
        }

        .guard-l { animation: closeStomaL 12s ease-in-out infinite; }
        .guard-r { animation: closeStomaR 12s ease-in-out infinite; }

        .turgid-ui { animation: fadeOut 12s ease-in-out infinite; }
        .flaccid-ui { animation: fadeIn 12s ease-in-out infinite; opacity: 0; }

        @keyframes curlLeft {
            0%, 25% { transform: rotate(0deg); }
            50%, 75% { transform: rotate(22deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes curlRight {
            0%, 25% { transform: rotate(0deg); }
            50%, 75% { transform: rotate(-22deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes shrinkBulliform {
            0%, 25% { transform: scale(1) translateY(0); }
            50%, 75% { transform: scale(0.65) translateY(15px); }
            100% { transform: scale(1) translateY(0); }
        }

        @keyframes closeStomaL {
            0%, 25% { transform: translateX(0); }
            50%, 75% { transform: translateX(2.5px); }
            100% { transform: translateX(0); }
        }

        @keyframes closeStomaR {
            0%, 25% { transform: translateX(0); }
            50%, 75% { transform: translateX(-2.5px); }
            100% { transform: translateX(0); }
        }

        @keyframes fadeOut {
            0%, 25% { opacity: 1; }
            35%, 85% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        @keyframes fadeIn {
            0%, 25% { opacity: 0; }
            35%, 85% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
            <title>Animated Dorsiventral Leaf Anatomy</title>
            <desc>A cross-section of a dicotyledonous leaf showing the water stress response where bulliform cells shrink, causing the leaf to curl adaxially to conserve water.</desc>

            <defs>
                <!-- Palisade Cell Pattern -->
                <g id="palisade-cell">
                    <rect x="0" y="0" width="20" height="80" rx="8" class="palisade"/>
                    <circle cx="5" cy="12" r="2.5" class="chloroplast"/>
                    <circle cx="15" cy="22" r="2.5" class="chloroplast"/>
                    <circle cx="6" cy="34" r="2.5" class="chloroplast"/>
                    <circle cx="14" cy="46" r="2.5" class="chloroplast"/>
                    <circle cx="5" cy="58" r="2.5" class="chloroplast"/>
                    <circle cx="15" cy="68" r="2.5" class="chloroplast"/>
                </g>

                <!-- Epidermis Cells -->
                <g id="ad-epi-cell">
                    <rect x="0" y="0" width="35" height="30" class="membrane"/>
                </g>
                <g id="ab-epi-cell">
                    <rect x="0" y="0" width="35" height="20" class="membrane"/>
                </g>

                <!-- Spongy Mesophyll Cells -->
                <g id="spongy-1">
                    <path d="M0,15 C10,-5 35,-5 45,15 C55,35 35,50 20,45 C0,40 -10,35 0,15 Z" class="spongy"/>
                    <circle cx="10" cy="15" r="2.5" class="chloroplast"/>
                    <circle cx="30" cy="10" r="2.5" class="chloroplast"/>
                    <circle cx="35" cy="30" r="2.5" class="chloroplast"/>
                    <circle cx="15" cy="35" r="2.5" class="chloroplast"/>
                </g>
                <g id="spongy-2">
                    <path d="M15,0 C35,-10 50,10 40,30 C30,50 5,45 0,25 C-5,5 5,10 15,0 Z" class="spongy"/>
                    <circle cx="20" cy="5" r="2.5" class="chloroplast"/>
                    <circle cx="35" cy="20" r="2.5" class="chloroplast"/>
                    <circle cx="20" cy="35" r="2.5" class="chloroplast"/>
                    <circle cx="5" cy="20" r="2.5" class="chloroplast"/>
                </g>
                <g id="spongy-3">
                    <path d="M10,20 C-5,10 5,-10 25,-5 C45,0 45,25 30,35 C15,45 -5,35 10,20 Z" class="spongy"/>
                    <circle cx="15" cy="5" r="2.5" class="chloroplast"/>
                    <circle cx="30" cy="15" r="2.5" class="chloroplast"/>
                    <circle cx="20" cy="25" r="2.5" class="chloroplast"/>
                </g>

                <!-- Stoma -->
                <g id="stoma">
                    <g class="guard-l">
                        <path d="M -2 -10 C -15 -12, -18 12, -2 10 C 2 5, 2 -5, -2 -10 Z" class="membrane"/>
                        <circle cx="-8" cy="-4" r="1.5" class="chloroplast"/>
                        <circle cx="-9" cy="4" r="1.5" class="chloroplast"/>
                    </g>
                    <g class="guard-r">
                        <path d="M 2 -10 C 15 -12, 18 12, 2 10 C -2 5, -2 -5, 2 -10 Z" class="membrane"/>
                        <circle cx="8" cy="-4" r="1.5" class="chloroplast"/>
                        <circle cx="9" cy="4" r="1.5" class="chloroplast"/>
                    </g>
                </g>
            </defs>

            <!-- UI & Static Background Elements -->
            <text x="400" y="35" text-anchor="middle" class="title">Dorsiventral Leaf Anatomy &amp; Water Stress Response</text>
            <text x="400" y="55" text-anchor="middle" class="subtitle">Demonstrating Bulliform Cell Mechanism and Stomatal Closure</text>

            <!-- Dynamic Status Indicator -->
            <g transform="translate(250, 75)">
                <rect x="0" y="0" width="300" height="36" rx="18" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                <text x="150" y="23" text-anchor="middle" fill="#4A90D9" class="status-text turgid-ui">Status: Turgid (Leaf Flat)</text>
                <text x="150" y="23" text-anchor="middle" fill="#E74C3C" class="status-text flaccid-ui">Status: Flaccid (Leaf Curled)</text>
            </g>

            <!-- Legend -->
            <g transform="translate(630, 420)">
                <rect x="0" y="0" width="150" height="110" rx="6" fill="#ffffff" stroke="#bdc3c7" stroke-width="1"/>
                <text x="10" y="20" font-weight="600" class="legend-text">Legend</text>
                
                <circle cx="15" cy="35" r="4" class="chloroplast"/>
                <text x="25" y="39" class="legend-text">Chloroplast</text>
                
                <circle cx="15" cy="55" r="5" class="xylem"/>
                <text x="25" y="59" class="legend-text">Xylem (Water)</text>
                
                <circle cx="15" cy="75" r="4" class="phloem"/>
                <text x="25" y="79" class="legend-text">Phloem (Food)</text>
                
                <rect x="10" y="93" width="10" height="4" class="cuticle"/>
                <text x="25" y="99" class="legend-text">Waxy Cuticle</text>
            </g>

            <!-- MAIN LEAF STRUCTURE -->
            
            <!-- LEFT FLANK -->
            <g class="left-flank">
                <!-- Cuticle Top -->
                <path d="M 45 145 L 360 145 L 360 150 L 45 150 Z" class="cuticle"/>
                
                <!-- Adaxial Epidermis -->
                <use href="#ad-epi-cell" x="45" y="150"/>
                <use href="#ad-epi-cell" x="80" y="150"/>
                <use href="#ad-epi-cell" x="115" y="150"/>
                <use href="#ad-epi-cell" x="150" y="150"/>
                <use href="#ad-epi-cell" x="185" y="150"/>
                <!-- Adaxial Stoma -->
                <use href="#stoma" x="237" y="165"/>
                <use href="#ad-epi-cell" x="255" y="150"/>
                <use href="#ad-epi-cell" x="290" y="150"/>
                <use href="#ad-epi-cell" x="325" y="150"/>

                <!-- Palisade Mesophyll -->
                <use href="#palisade-cell" x="45" y="180"/>
                <use href="#palisade-cell" x="67" y="180"/>
                <use href="#palisade-cell" x="89" y="180"/>
                <use href="#palisade-cell" x="111" y="180"/>
                <use href="#palisade-cell" x="133" y="180"/>
                <use href="#palisade-cell" x="155" y="180"/>
                <use href="#palisade-cell" x="177" y="180"/>
                <use href="#palisade-cell" x="199" y="180"/>
                <use href="#palisade-cell" x="221" y="180"/>
                <use href="#palisade-cell" x="243" y="180"/>
                <use href="#palisade-cell" x="265" y="180"/>
                <use href="#palisade-cell" x="287" y="180"/>
                <use href="#palisade-cell" x="309" y="180"/>
                <use href="#palisade-cell" x="331" y="180"/>

                <!-- Spongy Mesophyll -->
                <use href="#spongy-1" x="50" y="270"/>
                <use href="#spongy-2" x="100" y="265"/>
                <use href="#spongy-3" x="150" y="275"/>
                <use href="#spongy-1" x="200" y="260"/>
                <use href="#spongy-2" x="250" y="270"/>
                <use href="#spongy-3" x="300" y="265"/>

                <use href="#spongy-2" x="60" y="310"/>
                <use href="#spongy-3" x="110" y="320"/>
                <!-- Sub-stomatal cavity gap around x=165 -->
                <use href="#spongy-1" x="210" y="315"/>
                <use href="#spongy-2" x="260" y="310"/>
                <use href="#spongy-3" x="310" y="320"/>

                <use href="#spongy-3" x="50" y="360"/>
                <use href="#spongy-1" x="90" y="355"/>
                <use href="#spongy-2" x="190" y="360"/>
                <use href="#spongy-1" x="240" y="350"/>
                <!-- Sub-stomatal cavity gap around x=300 -->
                <use href="#spongy-3" x="320" y="365"/>

                <!-- Abaxial Epidermis -->
                <use href="#ab-epi-cell" x="45" y="400"/>
                <use href="#ab-epi-cell" x="80" y="400"/>
                <use href="#ab-epi-cell" x="115" y="400"/>
                <use href="#stoma" x="167" y="410"/>
                <use href="#ab-epi-cell" x="185" y="400"/>
                <use href="#ab-epi-cell" x="220" y="400"/>
                <use href="#ab-epi-cell" x="255" y="400"/>
                <use href="#stoma" x="307" y="410"/>
                <use href="#ab-epi-cell" x="325" y="400"/>

                <!-- Cuticle Bottom -->
                <path d="M 45 420 L 150 420 L 150 425 L 45 425 Z" class="cuticle"/>
                <path d="M 185 420 L 290 420 L 290 425 L 185 425 Z" class="cuticle"/>
                <path d="M 325 420 L 360 420 L 360 425 L 325 425 Z" class="cuticle"/>

                <!-- Left Flank Labels -->
                <line x1="130" y1="150" x2="130" y2="120" class="label-line"/>
                <circle cx="130" cy="150" r="3" class="label-dot"/>
                <text x="130" y="110" text-anchor="middle" class="tech-text">Adaxial Epidermis</text>

                <line x1="100" y1="220" x2="60" y2="220" class="label-line"/>
                <circle cx="100" cy="220" r="3" class="label-dot"/>
                <text x="50" y="224" text-anchor="end" class="tech-text">Palisade Mesophyll</text>

                <line x1="120" y1="340" x2="60" y2="340" class="label-line"/>
                <circle cx="120" cy="340" r="3" class="label-dot"/>
                <text x="50" y="344" text-anchor="end" class="tech-text">Spongy Mesophyll</text>

                <line x1="237" y1="420" x2="237" y2="460" class="label-line"/>
                <circle cx="237" cy="420" r="3" class="label-dot"/>
                <text x="237" y="475" text-anchor="middle" class="tech-text">Abaxial Epidermis</text>
                
                <line x1="167" y1="420" x2="167" y2="490" class="label-line"/>
                <circle cx="167" cy="420" r="3" class="label-dot"/>
                <text x="167" y="505" text-anchor="middle" class="tech-text">Stoma (Pore)</text>
            </g>

            <!-- RIGHT FLANK -->
            <g class="right-flank">
                <!-- Cuticle Top -->
                <path d="M 440 145 L 755 145 L 755 150 L 440 150 Z" class="cuticle"/>
                
                <!-- Adaxial Epidermis -->
                <use href="#ad-epi-cell" x="440" y="150"/>
                <use href="#ad-epi-cell" x="475" y="150"/>
                <use href="#ad-epi-cell" x="510" y="150"/>
                <use href="#ad-epi-cell" x="545" y="150"/>
                <!-- Adaxial Stoma -->
                <use href="#stoma" x="597" y="165"/>
                <use href="#ad-epi-cell" x="615" y="150"/>
                <use href="#ad-epi-cell" x="650" y="150"/>
                <use href="#ad-epi-cell" x="685" y="150"/>
                <use href="#ad-epi-cell" x="720" y="150"/>

                <!-- Palisade Mesophyll -->
                <use href="#palisade-cell" x="445" y="180"/>
                <use href="#palisade-cell" x="467" y="180"/>
                <use href="#palisade-cell" x="489" y="180"/>
                <use href="#palisade-cell" x="511" y="180"/>
                <use href="#palisade-cell" x="533" y="180"/>
                <use href="#palisade-cell" x="555" y="180"/>
                <use href="#palisade-cell" x="577" y="180"/>
                <use href="#palisade-cell" x="599" y="180"/>
                <use href="#palisade-cell" x="621" y="180"/>
                <use href="#palisade-cell" x="643" y="180"/>
                <use href="#palisade-cell" x="665" y="180"/>
                <use href="#palisade-cell" x="687" y="180"/>
                <use href="#palisade-cell" x="709" y="180"/>
                <use href="#palisade-cell" x="731" y="180"/>

                <!-- Spongy Mesophyll -->
                <use href="#spongy-2" x="450" y="265"/>
                <use href="#spongy-3" x="500" y="275"/>
                <use href="#spongy-1" x="550" y="260"/>
                <use href="#spongy-2" x="600" y="270"/>
                <use href="#spongy-3" x="650" y="265"/>
                <use href="#spongy-1" x="700" y="270"/>

                <use href="#spongy-1" x="470" y="315"/>
                <!-- Sub-stomatal cavity gap around x=525 -->
                <use href="#spongy-3" x="570" y="320"/>
                <use href="#spongy-2" x="620" y="310"/>
                <use href="#spongy-1" x="670" y="315"/>

                <use href="#spongy-2" x="450" y="360"/>
                <use href="#spongy-3" x="500" y="365"/>
                <use href="#spongy-1" x="550" y="355"/>
                <use href="#spongy-2" x="600" y="360"/>
                <!-- Sub-stomatal cavity gap around x=660 -->
                <use href="#spongy-3" x="700" y="365"/>

                <!-- Abaxial Epidermis -->
                <use href="#ab-epi-cell" x="440" y="400"/>
                <use href="#ab-epi-cell" x="475" y="400"/>
                <use href="#stoma" x="527" y="410"/>
                <use href="#ab-epi-cell" x="545" y="400"/>
                <use href="#ab-epi-cell" x="580" y="400"/>
                <use href="#ab-epi-cell" x="615" y="400"/>
                <use href="#stoma" x="667" y="410"/>
                <use href="#ab-epi-cell" x="685" y="400"/>
                <use href="#ab-epi-cell" x="720" y="400"/>

                <!-- Cuticle Bottom -->
                <path d="M 440 420 L 510 420 L 510 425 L 440 425 Z" class="cuticle"/>
                <path d="M 545 420 L 650 420 L 650 425 L 545 425 Z" class="cuticle"/>
                <path d="M 685 420 L 755 420 L 755 425 L 685 425 Z" class="cuticle"/>
            </g>

            <!-- CENTER GROUP (Vascular Bundle & Bulliform Cells) -->
            <!-- Drawn last to seamlessly overlap the folding flanks -->
            <g class="center-group">
                <!-- Background filler to hide seam -->
                <rect x="350" y="150" width="100" height="270" fill="#eafaf1" opacity="0.9"/>
                
                <!-- Center Spongy Filler -->
                <use href="#spongy-3" x="340" y="260"/>
                <use href="#spongy-1" x="420" y="265"/>
                <use href="#spongy-2" x="350" y="350"/>
                <use href="#spongy-3" x="420" y="360"/>

                <!-- Center Abaxial Epidermis & Cuticle (Static base) -->
                <use href="#ab-epi-cell" x="360" y="400"/>
                <use href="#ab-epi-cell" x="395" y="400"/>
                <path d="M 360 420 L 430 420 L 430 425 L 360 425 Z" class="cuticle"/>

                <!-- Vascular Bundle -->
                <g class="vascular-bundle">
                    <circle cx="400" cy="300" r="60" class="bundle-sheath"/>
                    
                    <!-- Xylem (Adaxial/Top) -->
                    <circle cx="400" cy="265" r="14" class="xylem"/>
                    <circle cx="375" cy="280" r="12" class="xylem"/>
                    <circle cx="425" cy="280" r="12" class="xylem"/>
                    <circle cx="400" cy="295" r="10" class="xylem"/>
                    <circle cx="360" cy="295" r="8" class="xylem"/>
                    <circle cx="440" cy="295" r="8" class="xylem"/>

                    <!-- Phloem (Abaxial/Bottom) -->
                    <circle cx="400" cy="335" r="7" class="phloem"/>
                    <circle cx="380" cy="325" r="6" class="phloem"/>
                    <circle cx="420" cy="325" r="6" class="phloem"/>
                    <circle cx="395" cy="350" r="5" class="phloem"/>
                    <circle cx="405" cy="350" r="5" class="phloem"/>
                    <circle cx="365" cy="335" r="5" class="phloem"/>
                    <circle cx="435" cy="335" r="5" class="phloem"/>
                    <circle cx="385" cy="340" r="4" class="phloem"/>
                    <circle cx="415" cy="340" r="4" class="phloem"/>
                </g>

                <!-- Bulliform Cells (Animated Shrinking) -->
                <g class="bulliform-group">
                    <!-- Left Bulliform -->
                    <path d="M 340 150 L 375 150 L 385 220 L 355 200 Z" class="membrane"/>
                    <!-- Center Bulliform (Largest) -->
                    <path d="M 375 150 L 425 150 L 415 230 L 385 230 Z" class="membrane"/>
                    <!-- Right Bulliform -->
                    <path d="M 425 150 L 460 150 L 445 200 L 415 220 Z" class="membrane"/>
                    
                    <!-- Cuticle over Bulliform -->
                    <path d="M 340 145 L 460 145 L 460 150 L 340 150 Z" class="cuticle"/>
                </g>

                <!-- Center Labels -->
                <line x1="410" y1="180" x2="520" y2="120" class="label-line"/>
                <circle cx="410" cy="180" r="3" class="label-dot"/>
                <text x="530" y="115" class="tech-text">Bulliform Cells (Water Storage)</text>

                <line x1="420" y1="270" x2="520" y2="240" class="label-line"/>
                <circle cx="420" cy="270" r="3" class="label-dot"/>
                <text x="530" y="245" class="tech-text">Xylem</text>

                <line x1="420" y1="330" x2="520" y2="360" class="label-line"/>
                <circle cx="420" cy="330" r="3" class="label-dot"/>
                <text x="530" y="365" class="tech-text">Phloem</text>
                
                <line x1="455" y1="300" x2="520" y2="300" class="label-line"/>
                <circle cx="460" cy="300" r="3" class="label-dot"/>
                <text x="530" y="305" class="tech-text">Bundle Sheath</text>
            </g>

        </svg>
    </div>
</body>
</html>
