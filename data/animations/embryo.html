<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Embryonic Origin of the Stem</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        :root {
            --seed-coat: #8D6E63;
            --cotyledon: #F1C40F;
            --plumule: #2ECC71;
            --radicle: #D4AC0D;
            --stem: #2ECC71;
            --soil: #AAB7B8;
            --text: #2C3E50;
            --bg: #f8f9fa;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        text {
            fill: var(--text);
        }

        .sci-text {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        #main-svg {
            animation: global-fade 12s infinite ease-in-out;
        }

        @keyframes global-fade {
            0% { opacity: 0; }
            5%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        .anim-imbibe {
            transform-origin: 400px 430px;
            animation: imbibe 12s infinite ease-in-out;
        }

        @keyframes imbibe {
            0% { transform: scale(1); }
            16.6%, 91.6% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .anim-pulse {
            animation: pulse 12s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { filter: none; }
            8.3% { filter: url(#glow); }
            16.6%, 91.6% { filter: none; }
        }

        .anim-radicle {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: grow-radicle 12s infinite ease-in-out;
        }

        @keyframes grow-radicle {
            0%, 16.6% { stroke-dashoffset: 50; }
            41.6%, 91.6% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 50; }
        }

        .anim-stem {
            stroke-dasharray: 290;
            stroke-dashoffset: 290;
            animation: grow-stem 12s infinite ease-in-out;
        }

        @keyframes grow-stem {
            0%, 41.6% { stroke-dashoffset: 290; }
            55% { stroke-dashoffset: 160; } /* Spurt 1 to Node 1 */
            60% { stroke-dashoffset: 160; } /* Pause at Node 1 */
            75%, 91.6% { stroke-dashoffset: 0; } /* Spurt 2 to Top */
            100% { stroke-dashoffset: 290; }
        }

        .anim-leaves-1 {
            transform: scale(0);
            transform-origin: 400px 260px;
            animation: grow-leaves-1 12s infinite ease-out;
        }

        @keyframes grow-leaves-1 {
            0%, 55% { transform: scale(0); }
            62%, 91.6% { transform: scale(1); }
            100% { transform: scale(0); }
        }

        .anim-leaves-2 {
            transform: scale(0);
            transform-origin: 400px 160px;
            animation: grow-leaves-2 12s infinite ease-out;
        }

        @keyframes grow-leaves-2 {
            0%, 75% { transform: scale(0); }
            83%, 91.6% { transform: scale(1); }
            100% { transform: scale(0); }
        }

        .anim-dynamic-labels {
            opacity: 0;
            animation: fade-labels 12s infinite ease-in-out;
        }

        @keyframes fade-labels {
            0%, 75% { opacity: 0; }
            83%, 91.6% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <svg id="main-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <title>Embryonic Origin of the Stem</title>
        <desc>Animated diagram showing a germinating dicot seed where the plumule develops into a green stem with nodes and internodes, demonstrating positive phototropism, while the radicle grows downward demonstrating positive geotropism.</desc>

        <defs>
            <!-- Drop shadow for 3D effect on cotyledons -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.25" flood-color="#2C3E50"/>
            </filter>
            
            <!-- Glow for metabolic activation -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Background Grid -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <circle cx="20" cy="20" r="1" fill="#BDC3C7" opacity="0.4"/>
            </pattern>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700">From Embryo to Axis: Origin of the Stem</text>
        <text x="400" y="60" text-anchor="middle" font-size="14" fill="#7F8C8D">Development of the Plumule into the Ascending Axis (Dicot Germination)</text>

        <!-- Tropism Indicators -->
        <g transform="translate(50, 100)" opacity="0.7">
            <line x1="0" y1="40" x2="0" y2="0" stroke="#F39C12" stroke-width="2" stroke-dasharray="4,2"/>
            <polygon points="-4,8 4,8 0,0" fill="#F39C12"/>
            <text x="12" y="20" font-size="12" fill="#F39C12" font-weight="600">Light (Phototropism)</text>
        </g>
        
        <g transform="translate(50, 420)" opacity="0.7">
            <line x1="0" y1="0" x2="0" y2="40" stroke="#3498DB" stroke-width="2" stroke-dasharray="4,2"/>
            <polygon points="-4,32 4,32 0,40" fill="#3498DB"/>
            <text x="12" y="25" font-size="12" fill="#3498DB" font-weight="600">Gravity (Geotropism)</text>
        </g>

        <!-- Soil Line -->
        <line x1="40" y1="400" x2="760" y2="400" stroke="var(--soil)" stroke-width="2" stroke-dasharray="10,5" />
        <text x="750" y="390" text-anchor="end" font-size="12" fill="var(--soil)" font-weight="600">Soil Surface</text>

        <!-- Growing Radicle (Future Root) -->
        <path d="M400,455 Q390,475 405,495" stroke="var(--radicle)" stroke-width="6" fill="none" stroke-linecap="round" class="anim-radicle" />

        <!-- Growing Stem (Ascending Axis) -->
        <path d="M400,395 L400,105" stroke="var(--stem)" stroke-width="8" fill="none" stroke-linecap="round" class="anim-stem" />

        <!-- Node 1 & Leaves -->
        <g class="anim-leaves-1">
            <ellipse cx="400" cy="260" rx="7" ry="4" fill="var(--stem)" stroke="#27AE60" stroke-width="1.5" />
            <path d="M400,260 Q360,250 350,210 Q380,220 400,260" fill="var(--stem)" stroke="#27AE60" stroke-width="1"/>
            <path d="M400,260 Q440,250 450,210 Q420,220 400,260" fill="var(--stem)" stroke="#27AE60" stroke-width="1"/>
        </g>

        <!-- Node 2 & Leaves -->
        <g class="anim-leaves-2">
            <ellipse cx="400" cy="160" rx="7" ry="4" fill="var(--stem)" stroke="#27AE60" stroke-width="1.5" />
            <path d="M400,160 Q370,150 360,120 Q380,130 400,160" fill="var(--stem)" stroke="#27AE60" stroke-width="1"/>
            <path d="M400,160 Q430,150 440,120 Q420,130 400,160" fill="var(--stem)" stroke="#27AE60" stroke-width="1"/>
        </g>

        <!-- Seed Structure -->
        <g>
            <!-- Seed Coat (Testa) -->
            <ellipse cx="400" cy="430" rx="55" ry="38" fill="var(--seed-coat)" class="anim-imbibe" />
            
            <!-- Cotyledons -->
            <g class="anim-imbibe" filter="url(#shadow)">
                <path d="M396,425 C350,395 350,475 396,455 Z" fill="var(--cotyledon)" />
                <path d="M404,425 C450,395 450,475 404,455 Z" fill="var(--cotyledon)" />
            </g>

            <!-- Embryonal Axis -->
            <!-- Hypocotyl / Epicotyl (Middle) -->
            <line x1="400" y1="410" x2="400" y2="440" stroke="#98D8C8" stroke-width="8" stroke-linecap="round" class="anim-pulse" />
            
            <!-- Plumule (Top) -->
            <line x1="400" y1="410" x2="400" y2="395" stroke="var(--plumule)" stroke-width="8" stroke-linecap="round" class="anim-pulse" />
            
            <!-- Radicle (Bottom) -->
            <line x1="400" y1="440" x2="400" y2="455" stroke="var(--radicle)" stroke-width="8" stroke-linecap="round" class="anim-pulse" />
        </g>

        <!-- Static Labels -->
        <g>
            <!-- Plumule -->
            <polyline points="280,380 350,380 395,398" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="395" cy="398" r="3" fill="#7F8C8D" />
            <text x="275" y="375" text-anchor="end" font-size="14" font-weight="600">Plumule</text>
            <text x="275" y="390" text-anchor="end" font-size="12" fill="#7F8C8D">(Future Stem)</text>

            <!-- Radicle -->
            <polyline points="280,460 350,460 395,452" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="395" cy="452" r="3" fill="#7F8C8D" />
            <text x="275" y="455" text-anchor="end" font-size="14" font-weight="600">Radicle</text>
            <text x="275" y="470" text-anchor="end" font-size="12" fill="#7F8C8D">(Future Root)</text>

            <!-- Epicotyl -->
            <polyline points="520,400 450,400 405,415" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="405" cy="415" r="3" fill="#7F8C8D" />
            <text x="525" y="404" text-anchor="start" font-size="13" class="sci-text">Epicotyl</text>

            <!-- Cotyledon -->
            <polyline points="520,435 450,435 430,435" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="430" cy="435" r="3" fill="#7F8C8D" />
            <text x="525" y="439" text-anchor="start" font-size="14" font-weight="600">Cotyledon</text>

            <!-- Hypocotyl -->
            <polyline points="520,470 450,470 405,435" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="405" cy="435" r="3" fill="#7F8C8D" />
            <text x="525" y="474" text-anchor="start" font-size="13" class="sci-text">Hypocotyl</text>
        </g>

        <!-- Dynamic Labels (Appear during differentiation) -->
        <g class="anim-dynamic-labels">
            <!-- Node Label -->
            <polyline points="520,260 450,260 410,260" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <circle cx="410" cy="260" r="3" fill="#7F8C8D" />
            <text x="525" y="255" text-anchor="start" font-size="14" font-weight="600">Node</text>
            <text x="525" y="269" text-anchor="start" font-size="11" fill="#7F8C8D">Point of leaf attachment</text>

            <!-- Internode Bracket & Label -->
            <path d="M385,260 L375,260 L375,160 L385,160" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <polyline points="375,210 350,210 330,210" fill="none" stroke="#7F8C8D" stroke-width="1.5" />
            <text x="325" y="205" text-anchor="end" font-size="14" font-weight="600">Internode</text>
            <text x="325" y="219" text-anchor="end" font-size="11" fill="#7F8C8D">Elongated stem segment</text>
        </g>

        <!-- Legend -->
        <g transform="translate(630, 420)">
            <rect x="0" y="0" width="130" height="70" fill="#ffffff" rx="6" stroke="#E0E0E0" stroke-width="1" opacity="0.9"/>
            <rect x="10" y="10" width="12" height="12" fill="var(--cotyledon)" rx="2"/>
            <text x="30" y="20" font-size="11" fill="#7F8C8D">Nutrient Storage</text>
            
            <rect x="10" y="30" width="12" height="12" fill="var(--stem)" rx="2"/>
            <text x="30" y="40" font-size="11" fill="#7F8C8D">Shoot System</text>
            
            <rect x="10" y="50" width="12" height="12" fill="var(--radicle)" rx="2"/>
            <text x="30" y="60" font-size="11" fill="#7F8C8D">Root System</text>
        </g>

    </svg>
</body>
</html>
