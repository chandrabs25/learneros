<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blood Plasma Filtration & Lymph Formation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Animations --- */
        
        /* Blood Flow */
        .flow-1 { animation: bloodFlow 6s linear infinite; }
        .flow-2 { animation: bloodFlow 6s linear infinite -2s; }
        .flow-3 { animation: bloodFlow 6s linear infinite -4s; }
        
        @keyframes bloodFlow {
            0% { transform: translateX(-100px); }
            100% { transform: translateX(900px); }
        }

        /* Protein Bouncing (Selective Permeability) */
        .bounce-prot-1 { animation: bounceFlow1 6s linear infinite; }
        .bounce-prot-2 { animation: bounceFlow2 6s linear infinite -3s; }

        @keyframes bounceFlow1 {
            0% { transform: translate(-50px, 145px); }
            18% { transform: translate(120px, 160px); } /* Hit gap 1 */
            25% { transform: translate(180px, 135px); } /* Bounce up */
            42% { transform: translate(320px, 160px); } /* Hit gap 3 */
            50% { transform: translate(380px, 135px); }
            100% { transform: translate(850px, 145px); }
        }

        @keyframes bounceFlow2 {
            0% { transform: translate(-50px, 135px); }
            28% { transform: translate(220px, 160px); } /* Hit gap 2 */
            35% { transform: translate(280px, 130px); } 
            62% { transform: translate(520px, 160px); } /* Hit gap 4 */
            70% { transform: translate(580px, 135px); }
            100% { transform: translate(850px, 140px); }
        }

        /* Filtration (Leaking through gaps) */
        .leak-a { animation: leakA 3s ease-in-out infinite; }
        .leak-b { animation: leakB 3s ease-in-out infinite -1s; }
        .leak-c { animation: leakC 3s ease-in-out infinite -2s; }

        @keyframes leakA {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(5px, 25px); }
            100% { transform: translate(20px, 60px); opacity: 0; }
        }
        @keyframes leakB {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(-5px, 25px); }
            100% { transform: translate(-30px, 70px); opacity: 0; }
        }
        @keyframes leakC {
            0% { transform: translate(0, 0); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(10px, 25px); }
            100% { transform: translate(40px, 50px); opacity: 0; }
        }

        /* Interstitial Drift */
        .drift-1 { animation: drift 5s ease-in-out infinite alternate; }
        .drift-2 { animation: drift 6s ease-in-out infinite alternate-reverse; }
        
        @keyframes drift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(15px, 10px); }
        }

        /* Lymphatic Entry */
        .lymph-enter-1 { animation: lymphEntry1 4s ease-in infinite; }
        .lymph-enter-2 { animation: lymphEntry2 4s ease-in infinite -1.5s; }
        .lymph-enter-3 { animation: lymphEntry3 4s ease-in infinite -3s; }

        @keyframes lymphEntry1 {
            0% { transform: translate(0, 0); opacity: 0; fill: #A9CCE3; }
            20% { opacity: 1; fill: #A9CCE3; }
            45% { transform: translate(25px, 35px); fill: #FEF9E7; } /* Enter flap */
            100% { transform: translate(150px, 35px); opacity: 0; fill: #FEF9E7; } /* Flow right */
        }
        @keyframes lymphEntry2 {
            0% { transform: translate(0, 0); opacity: 0; fill: #FFD700; }
            20% { opacity: 1; fill: #FFD700; }
            45% { transform: translate(20px, 30px); fill: #FEF9E7; }
            100% { transform: translate(140px, 30px); opacity: 0; fill: #FEF9E7; }
        }
        @keyframes lymphEntry3 {
            0% { transform: translate(0, 0); opacity: 0; fill: #A9CCE3; }
            20% { opacity: 1; fill: #A9CCE3; }
            45% { transform: translate(30px, 40px); fill: #FEF9E7; }
            100% { transform: translate(160px, 40px); opacity: 0; fill: #FEF9E7; }
        }

        /* Flap Valve Pulsing */
        .flap { animation: flapPulse 2s ease-in-out infinite alternate; transform-origin: top left; }
        @keyframes flapPulse {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(3deg); }
        }

        /* Text Styles */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 600; fill: #7F8C8D; }
        .label { font-size: 12px; font-weight: 600; fill: #34495E; }
        .label-light { font-size: 11px; font-weight: 400; fill: #555; }
        .chem { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 700; fill: #2980B9; }
        .legend-text { font-size: 10px; font-weight: 400; fill: #333; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" aria-label="Animated diagram of blood plasma filtration and lymph formation" role="img">
        <title>Blood Plasma Filtration & Lymph Formation</title>
        <desc>An animated biological diagram showing blood flowing through a capillary, small solutes and water filtering through endothelial gaps into the interstitial space, and tissue fluid entering a blind-ended lymphatic vessel.</desc>

        <defs>
            <!-- Gradients -->
            <linearGradient id="bloodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#E74C3C" stop-opacity="0.15"/>
                <stop offset="50%" stop-color="#9B59B6" stop-opacity="0.1"/>
                <stop offset="100%" stop-color="#3498DB" stop-opacity="0.15"/>
            </linearGradient>
            
            <linearGradient id="arterialGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#E74C3C" />
                <stop offset="100%" stop-color="#C0392B" />
            </linearGradient>

            <linearGradient id="venousGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#2980B9" />
                <stop offset="100%" stop-color="#3498DB" />
            </linearGradient>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.15"/>
            </filter>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Markers -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7F8C8D" />
            </marker>

            <!-- Symbols -->
            <g id="rbc" filter="url(#shadow)">
                <circle cx="0" cy="0" r="12" fill="#C0392B" />
                <circle cx="0" cy="0" r="6" fill="#922B21" />
            </g>

            <g id="wbc" filter="url(#shadow)">
                <circle cx="0" cy="0" r="15" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
                <!-- Multi-lobed nucleus -->
                <path d="M-4,-4 C-8,-8 -10,-2 -6,2 C-8,6 -2,8 2,4 C6,8 10,2 6,-2 C8,-6 2,-8 -2,-4 Z" fill="#2C3E50" />
            </g>

            <g id="platelet">
                <path d="M0,-3 L3,-1 L2,3 L-2,2 L-3,-1 Z" fill="#BDC3C7" />
            </g>

            <circle id="protein" cx="0" cy="0" r="7" fill="#98D8C8" filter="url(#shadow)"/>
            <circle id="water" cx="0" cy="0" r="3" fill="#A9CCE3" />
            <circle id="solute" cx="0" cy="0" r="2" fill="#FFD700" />

            <g id="tissue-cell" filter="url(#shadow)">
                <path d="M0,-22 C18,-25 28,-10 22,8 C15,25 -8,28 -20,15 C-30,2 -22,-18 0,-22 Z" fill="#FAD7A0" stroke="#E67E22" stroke-width="1.5"/>
                <circle cx="2" cy="-2" r="6" fill="#2C3E50" opacity="0.8"/>
                <circle cx="0" cy="-4" r="2" fill="#ECF0F1" opacity="0.6"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- ==================== INTERSTITIAL SPACE ==================== -->
        <g id="tissue-cells">
            <use href="#tissue-cell" x="120" y="240" />
            <use href="#tissue-cell" x="280" y="270" />
            <use href="#tissue-cell" x="450" y="230" />
            <use href="#tissue-cell" x="620" y="260" />
            <use href="#tissue-cell" x="750" y="220" />
            
            <use href="#tissue-cell" x="180" y="320" />
            <use href="#tissue-cell" x="380" y="330" />
            <use href="#tissue-cell" x="550" y="310" />
            <use href="#tissue-cell" x="700" y="340" />
        </g>

        <!-- Static Interstitial Fluid Particles -->
        <g id="static-fluid" class="drift-1">
            <use href="#water" x="150" y="280" />
            <use href="#solute" x="160" y="290" />
            <use href="#water" x="320" y="240" />
            <use href="#water" x="420" y="280" />
            <use href="#solute" x="430" y="270" />
            <use href="#water" x="500" y="340" />
            <use href="#water" x="660" y="230" />
            <use href="#solute" x="680" y="240" />
        </g>
        <g id="static-fluid-2" class="drift-2">
            <use href="#water" x="220" y="250" />
            <use href="#solute" x="240" y="260" />
            <use href="#water" x="350" y="300" />
            <use href="#water" x="480" y="260" />
            <use href="#solute" x="580" y="280" />
            <use href="#water" x="600" y="330" />
            <use href="#water" x="720" y="290" />
        </g>

        <!-- ==================== LYMPHATIC VESSEL ==================== -->
        <g id="lymphatic-system">
            <!-- Lymph Lumen Background -->
            <path d="M 150 390 L 800 390 L 800 450 L 150 450 Q 120 420 150 390 Z" fill="#E9F7EF" />
            
            <!-- Bottom Wall -->
            <path d="M 150 450 L 800 450" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Blind End -->
            <path d="M 150 390 Q 120 420 150 450" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Top Wall with Flap Valves (One-way inward) -->
            <!-- Segment 1 -->
            <path d="M 150 390 L 300 390" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            <path d="M 300 390 L 325 405" fill="none" stroke="#27AE60" stroke-width="2" stroke-linecap="round" class="flap" transform="translate(300,390) rotate(0) translate(-300,-390)"/>
            
            <!-- Segment 2 -->
            <path d="M 310 390 L 500 390" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            <path d="M 500 390 L 525 405" fill="none" stroke="#27AE60" stroke-width="2" stroke-linecap="round" class="flap" transform="translate(500,390) rotate(0) translate(-500,-390)"/>
            
            <!-- Segment 3 -->
            <path d="M 510 390 L 700 390" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            <path d="M 700 390 L 725 405" fill="none" stroke="#27AE60" stroke-width="2" stroke-linecap="round" class="flap" transform="translate(700,390) rotate(0) translate(-700,-390)"/>
            
            <!-- Segment 4 -->
            <path d="M 710 390 L 800 390" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- ==================== BLOOD CAPILLARY ==================== -->
        <g id="blood-vessel">
            <!-- Lumen Background -->
            <rect x="0" y="90" width="800" height="70" fill="url(#bloodGrad)" />
            
            <!-- Top Endothelial Wall (Continuous for simplicity, slightly segmented) -->
            <g fill="#F39C12" stroke="#D68910" stroke-width="1.5" filter="url(#shadow)">
                <rect x="-10" y="75" width="160" height="15" rx="4" />
                <rect x="155" y="75" width="160" height="15" rx="4" />
                <rect x="320" y="75" width="160" height="15" rx="4" />
                <rect x="485" y="75" width="160" height="15" rx="4" />
                <rect x="650" y="75" width="160" height="15" rx="4" />
            </g>

            <!-- Bottom Endothelial Wall (With Intercellular Clefts / Gaps) -->
            <!-- Gap width is 10px. Protein diameter is 14px. Proteins cannot pass. -->
            <g fill="#F39C12" stroke="#D68910" stroke-width="1.5" filter="url(#shadow)">
                <rect x="-10" y="160" width="120" height="15" rx="4" />
                <!-- Gap 1 at 110-120 -->
                <rect x="120" y="160" width="140" height="15" rx="4" />
                <!-- Gap 2 at 260-270 -->
                <rect x="270" y="160" width="140" height="15" rx="4" />
                <!-- Gap 3 at 410-420 -->
                <rect x="420" y="160" width="140" height="15" rx="4" />
                <!-- Gap 4 at 560-570 -->
                <rect x="570" y="160" width="140" height="15" rx="4" />
                <!-- Gap 5 at 710-720 -->
                <rect x="720" y="160" width="90" height="15" rx="4" />
            </g>
            
            <!-- Endothelial Cell Nuclei -->
            <g fill="#2C3E50" opacity="0.6">
                <!-- Top -->
                <ellipse cx="70" cy="82.5" rx="8" ry="3" />
                <ellipse cx="235" cy="82.5" rx="8" ry="3" />
                <ellipse cx="400" cy="82.5" rx="8" ry="3" />
                <ellipse cx="565" cy="82.5" rx="8" ry="3" />
                <ellipse cx="730" cy="82.5" rx="8" ry="3" />
                <!-- Bottom -->
                <ellipse cx="50" cy="167.5" rx="8" ry="3" />
                <ellipse cx="190" cy="167.5" rx="8" ry="3" />
                <ellipse cx="340" cy="167.5" rx="8" ry="3" />
                <ellipse cx="490" cy="167.5" rx="8" ry="3" />
                <ellipse cx="640" cy="167.5" rx="8" ry="3" />
                <ellipse cx="765" cy="167.5" rx="8" ry="3" />
            </g>
        </g>

        <!-- ==================== ANIMATIONS ==================== -->
        
        <!-- 1. Intravascular Flow (Blood Components) -->
        <g id="animated-blood">
            <!-- Group 1 -->
            <g class="flow-1">
                <use href="#rbc" x="20" y="110" />
                <use href="#rbc" x="60" y="140" />
                <use href="#wbc" x="120" y="125" />
                <use href="#protein" x="40" y="100" />
                <use href="#protein" x="90" y="115" />
                <use href="#platelet" x="150" y="105" />
                <use href="#water" x="10" y="130" />
                <use href="#solute" x="30" y="120" />
                <use href="#water" x="80" y="100" />
                <use href="#solute" x="140" y="145" />
            </g>
            <!-- Group 2 -->
            <g class="flow-2">
                <use href="#rbc" x="0" y="135" />
                <use href="#rbc" x="80" y="105" />
                <use href="#protein" x="30" y="125" />
                <use href="#protein" x="110" y="140" />
                <use href="#platelet" x="50" y="110" />
                <use href="#water" x="20" y="100" />
                <use href="#solute" x="70" y="130" />
                <use href="#water" x="130" y="115" />
            </g>
            <!-- Group 3 -->
            <g class="flow-3">
                <use href="#rbc" x="40" y="120" />
                <use href="#wbc" x="100" y="135" />
                <use href="#protein" x="10" y="145" />
                <use href="#protein" x="70" y="105" />
                <use href="#platelet" x="130" y="120" />
                <use href="#water" x="50" y="140" />
                <use href="#solute" x="90" y="110" />
                <use href="#water" x="140" y="130" />
            </g>

            <!-- Bouncing Proteins (Selective Permeability Demo) -->
            <use href="#protein" class="bounce-prot-1" />
            <use href="#protein" class="bounce-prot-2" />
        </g>

        <!-- 2. Filtration (Leaking through clefts) -->
        <g id="animated-filtration">
            <!-- Gap 1 (X=115) -->
            <use href="#water" x="115" y="155" class="leak-a" />
            <use href="#solute" x="115" y="155" class="leak-b" />
            
            <!-- Gap 2 (X=265) -->
            <use href="#solute" x="265" y="155" class="leak-c" />
            <use href="#water" x="265" y="155" class="leak-a" />

            <!-- Gap 3 (X=415) -->
            <use href="#water" x="415" y="155" class="leak-b" />
            <use href="#solute" x="415" y="155" class="leak-c" />

            <!-- Gap 4 (X=565) -->
            <use href="#solute" x="565" y="155" class="leak-a" />
            <use href="#water" x="565" y="155" class="leak-b" />
        </g>

        <!-- 3. Lymphatic Entry -->
        <g id="animated-lymph-entry">
            <!-- Flap 1 (X=300) -->
            <use href="#water" x="280" y="370" class="lymph-enter-1" />
            <use href="#solute" x="290" y="365" class="lymph-enter-2" />
            
            <!-- Flap 2 (X=500) -->
            <use href="#water" x="480" y="375" class="lymph-enter-3" />
            <use href="#solute" x="490" y="360" class="lymph-enter-1" />

            <!-- Flap 3 (X=700) -->
            <use href="#water" x="680" y="370" class="lymph-enter-2" />
            <use href="#solute" x="690" y="375" class="lymph-enter-3" />
        </g>


        <!-- ==================== LABELS & ANNOTATIONS ==================== -->
        
        <!-- Title -->
        <text x="400" y="35" class="title" text-anchor="middle">Blood Plasma Filtration &amp; Lymph Formation</text>
        <text x="400" y="55" class="subtitle" text-anchor="middle">Capillary exchange, interstitial fluid dynamics, and lymphatic drainage</text>

        <!-- Arterial / Venous Indicators -->
        <g font-size="12" font-weight="bold">
            <text x="10" y="125" fill="#C0392B">Arterial End</text>
            <text x="10" y="140" fill="#E74C3C" font-size="10">(High Hydrostatic Pressure)</text>
            
            <text x="790" y="125" fill="#2980B9" text-anchor="end">Venous End</text>
            <text x="790" y="140" fill="#3498DB" font-size="10" text-anchor="end">(Low Hydrostatic Pressure)</text>
        </g>

        <!-- Vessel Labels -->
        <rect x="330" y="65" width="140" height="20" rx="4" fill="#ffffff" opacity="0.8" />
        <text x="400" y="80" class="label" text-anchor="middle">Blood Capillary</text>

        <rect x="330" y="460" width="140" height="20" rx="4" fill="#ffffff" opacity="0.8" />
        <text x="400" y="475" class="label" text-anchor="middle" fill="#27AE60">Lymphatic Vessel</text>

        <!-- Process Labels -->
        <g fill="#D35400" font-weight="bold" font-size="12">
            <text x="190" y="195">Filtration</text>
            <path d="M 190 185 L 140 165" fill="none" stroke="#D35400" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>

        <g fill="#27AE60" font-weight="bold" font-size="12">
            <text x="360" y="435">Lymphatic Drainage</text>
            <path d="M 355 430 L 320 405" fill="none" stroke="#27AE60" stroke-width="1.5" marker-end="url(#arrow)"/>
        </g>

        <!-- Component Labels -->
        <g class="label-light">
            <!-- Endothelial Cell -->
            <text x="50" y="65">Endothelial Cell</text>
            <path d="M 95 68 L 110 75" fill="none" stroke="#7F8C8D" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Intercellular Cleft -->
            <text x="265" y="200" text-anchor="middle">Intercellular Cleft (Gap)</text>
            <path d="M 265 190 L 265 175" fill="none" stroke="#7F8C8D" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Tissue Fluid -->
            <text x="400" y="270" text-anchor="middle" font-weight="bold" fill="#34495E">Tissue Fluid (Interstitial Fluid)</text>
            
            <!-- Blind End -->
            <text x="140" y="375" text-anchor="end">Blind-ended Capillary</text>
            <path d="M 145 380 L 150 395" fill="none" stroke="#7F8C8D" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Flap Valve -->
            <text x="530" y="435">One-way Flap Valve</text>
            <path d="M 525 430 L 515 405" fill="none" stroke="#7F8C8D" stroke-width="1" marker-end="url(#arrow)"/>
        </g>

        <!-- ==================== LEGEND ==================== -->
        <g transform="translate(630, 10)">
            <rect x="0" y="0" width="160" height="105" rx="6" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
            <text x="80" y="15" class="label" text-anchor="middle">Key</text>
            
            <!-- RBC -->
            <use href="#rbc" x="15" y="30" transform="scale(0.6) translate(10, 20)" />
            <text x="30" y="33" class="legend-text">Red Blood Cell</text>
            
            <!-- WBC -->
            <use href="#wbc" x="15" y="45" transform="scale(0.5) translate(15, 45)" />
            <text x="30" y="48" class="legend-text">White Blood Cell</text>
            
            <!-- Protein -->
            <use href="#protein" x="15" y="60" />
            <text x="30" y="63" class="legend-text">Large Plasma Protein</text>
            
            <!-- Solute -->
            <use href="#solute" x="15" y="75" />
            <text x="30" y="78" class="legend-text">Small Solutes (<tspan class="chem">C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">12</tspan>O<tspan baseline-shift="sub" font-size="0.7em">6</tspan></tspan>, ions)</text>
            
            <!-- Water -->
            <use href="#water" x="15" y="90" />
            <text x="30" y="93" class="legend-text">Water (<tspan class="chem">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O</tspan>)</text>
        </g>

    </svg>
</div>

</body>
</html>
