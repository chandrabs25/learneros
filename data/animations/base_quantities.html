<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimensional Constructor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            color: #333;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphic UI Base */
        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            position: absolute;
            z-index: 10;
        }

        /* Formula Card */
        #formula-card {
            top: 24px;
            left: 24px;
            padding: 20px 24px;
            min-width: 250px;
        }

        #formula-card h2 {
            margin: 0 0 8px 0;
            font-size: 1.2rem;
            color: #1a1a1a;
        }

        .math-display {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.4rem;
            font-weight: 700;
            color: #7209B7;
            margin: 10px 0;
            background: rgba(114, 9, 183, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        .calc-value {
            font-family: 'Roboto Mono', monospace;
            font-size: 1rem;
            color: #555;
        }

        /* Control Panel */
        #control-panel {
            top: 24px;
            right: 24px;
            width: 320px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: #4361EE;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            background: rgba(255, 255, 255, 0.9);
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        select:focus {
            border-color: #7209B7;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ffffff;
            border: 2px solid #4361EE;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #d1d9e6;
            border-radius: 3px;
        }

        input[type=range]:focus {
            outline: none;
        }

        /* Specific Slider Colors */
        #slider-m::-webkit-slider-thumb { border-color: #FF3366; }
        #slider-t::-webkit-slider-thumb { border-color: #06D6A0; }

        /* 3D Labels */
        .scene-label {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            padding: 4px 8px;
            border-radius: 6px;
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: bold;
            color: #1a1a1a;
            pointer-events: none;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            z-index: 5;
            transition: opacity 0.2s;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div id="formula-card" class="glass-panel">
        <h2 id="quantity-title">Length</h2>
        <div class="math-display" id="formula-display">[L]¹</div>
        <div class="calc-value" id="calc-display">Value: 2.00 m</div>
    </div>

    <div id="control-panel" class="glass-panel">
        <div class="control-group">
            <label for="quantity-select">Quantity</label>
            <select id="quantity-select">
                <option value="length">Length [L]</option>
                <option value="area">Area [L²]</option>
                <option value="volume">Volume [L³]</option>
                <option value="velocity">Velocity [LT⁻¹]</option>
                <option value="acceleration">Acceleration [LT⁻²]</option>
                <option value="force">Force [MLT⁻²]</option>
            </select>
        </div>

        <div class="control-group">
            <label for="slider-l"><span>Base Length (L)</span> <span class="val-display" id="val-l-text">2.0</span></label>
            <input type="range" id="slider-l" min="1.0" max="5.0" step="0.1" value="2.0">
        </div>

        <div class="control-group">
            <label for="slider-m"><span>Base Mass (M)</span> <span class="val-display" id="val-m-text" style="color:#FF3366;">1.0</span></label>
            <input type="range" id="slider-m" min="0.5" max="10.0" step="0.5" value="1.0">
        </div>

        <div class="control-group">
            <label for="slider-t"><span>Time Interval (T)</span> <span class="val-display" id="val-t-text" style="color:#06D6A0;">1.0</span></label>
            <input type="range" id="slider-t" min="0.5" max="5.0" step="0.1" value="1.0">
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- State Variables ---
        let state = {
            mode: 'length',
            L: 2.0,
            M: 1.0,
            T: 1.0
        };

        // --- Colors ---
        const COLORS = {
            bg: 0xf0f4f8,
            grid: 0xd1d9e6,
            length: 0x4361EE,
            mass: 0xFF3366,
            time: 0x7209B7,
            velocity: 0x06D6A0,
            force: 0xF77F00
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(COLORS.bg);
        scene.fog = new THREE.FogExp2(COLORS.bg, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(5, 4, 7);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't go too far below ground

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 5);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        scene.add(dirLight);

        // --- Grid ---
        const gridHelper = new THREE.GridHelper(20, 20, COLORS.grid, COLORS.grid);
        gridHelper.position.y = -1.5;
        scene.add(gridHelper);

        // --- Core Objects Group ---
        const mainGroup = new THREE.Group();
        scene.add(mainGroup);

        // --- Materials ---
        const matLength = new THREE.MeshStandardMaterial({ 
            color: COLORS.length, roughness: 0.2, metalness: 0.1, emissive: COLORS.length, emissiveIntensity: 0.2 
        });
        const matArea = new THREE.MeshStandardMaterial({ 
            color: COLORS.length, transparent: true, opacity: 0.3, side: THREE.DoubleSide, depthWrite: false 
        });
        const matVolume = new THREE.MeshStandardMaterial({ 
            color: COLORS.length, transparent: true, opacity: 0.15, side: THREE.DoubleSide, depthWrite: false 
        });
        const matMass = new THREE.MeshStandardMaterial({ 
            color: COLORS.mass, roughness: 0.3, metalness: 0.2, emissive: COLORS.mass, emissiveIntensity: 0.1 
        });
        const matParticle = new THREE.MeshStandardMaterial({ 
            color: COLORS.velocity, emissive: COLORS.velocity, emissiveIntensity: 0.5 
        });
        const matTimeRing = new THREE.MeshBasicMaterial({
            color: COLORS.time, transparent: true, opacity: 0.5, side: THREE.DoubleSide
        });

        // --- Reusable Geometries ---
        const geoRod = new THREE.CylinderGeometry(0.06, 0.06, 1, 16);
        geoRod.rotateZ(Math.PI / 2); // Align with X axis by default
        const geoPlane = new THREE.PlaneGeometry(1, 1);
        geoPlane.rotateX(-Math.PI / 2);
        const geoBox = new THREE.BoxGeometry(1, 1, 1);
        const geoSphere = new THREE.SphereGeometry(1, 32, 32);
        const geoRing = new THREE.RingGeometry(0.9, 1.0, 32);
        geoRing.rotateX(-Math.PI / 2);

        // --- Scene Objects ---
        let objects = {};
        let labels = [];

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'scene-label';
            div.textContent = text;
            document.body.appendChild(div);
            return div;
        }

        function clearScene() {
            while(mainGroup.children.length > 0){ 
                mainGroup.remove(mainGroup.children[0]); 
            }
            labels.forEach(l => l.element.remove());
            labels = [];
            objects = {};
        }

        function buildScene() {
            clearScene();

            // 1. Length Rod (Always present as base)
            objects.rodX = new THREE.Mesh(geoRod, matLength);
            objects.rodX.castShadow = true;
            mainGroup.add(objects.rodX);
            
            labels.push({ element: createLabel('L'), pos: new THREE.Vector3(0, 0.2, 0), ref: objects.rodX });

            // 2. Time Ring (Always present to show time flow)
            objects.timeRing = new THREE.Mesh(geoRing, matTimeRing);
            objects.timeRing.position.y = -1.4;
            mainGroup.add(objects.timeRing);

            if (state.mode === 'area' || state.mode === 'volume') {
                objects.rodZ = new THREE.Mesh(geoRod, matLength);
                objects.rodZ.rotation.y = Math.PI / 2;
                objects.rodZ.castShadow = true;
                mainGroup.add(objects.rodZ);
                
                objects.area = new THREE.Mesh(geoPlane, matArea);
                mainGroup.add(objects.area);
                labels.push({ element: createLabel('L²'), pos: new THREE.Vector3(0, 0.1, 0), ref: objects.area });
            }

            if (state.mode === 'volume') {
                objects.rodY = new THREE.Mesh(geoRod, matLength);
                objects.rodY.rotation.z = Math.PI / 2;
                objects.rodY.castShadow = true;
                mainGroup.add(objects.rodY);

                objects.volume = new THREE.Mesh(geoBox, matVolume);
                mainGroup.add(objects.volume);
                labels.push({ element: createLabel('L³'), pos: new THREE.Vector3(0, 0, 0), ref: objects.volume });
                
                // Edges for volume
                const edges = new THREE.EdgesGeometry(geoBox);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: COLORS.length, transparent: true, opacity: 0.5 }));
                objects.volumeEdges = line;
                mainGroup.add(line);
            }

            if (state.mode === 'velocity' || state.mode === 'acceleration') {
                objects.particle = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), matParticle);
                objects.particle.castShadow = true;
                mainGroup.add(objects.particle);

                objects.vector = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, COLORS.velocity, 0.3, 0.2);
                mainGroup.add(objects.vector);
                
                let lbl = state.mode === 'velocity' ? 'v' : 'a';
                labels.push({ element: createLabel(lbl), pos: new THREE.Vector3(0, 0.4, 0), ref: objects.particle });
            }

            if (state.mode === 'force') {
                objects.mass = new THREE.Mesh(geoSphere, matMass);
                objects.mass.castShadow = true;
                mainGroup.add(objects.mass);

                objects.vector = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, COLORS.force, 0.4, 0.3);
                mainGroup.add(objects.vector);

                labels.push({ element: createLabel('M'), pos: new THREE.Vector3(0, 0.5, 0), ref: objects.mass });
                labels.push({ element: createLabel('F'), pos: new THREE.Vector3(0, 0.8, 0), ref: objects.vector });
            }

            updateStaticScales();
        }

        function updateStaticScales() {
            const L = state.L;
            const M = state.M;

            if (objects.rodX) objects.rodX.scale.set(1, L, 1);
            if (objects.rodZ) objects.rodZ.scale.set(1, L, 1);
            if (objects.rodY) objects.rodY.scale.set(1, L, 1);
            
            if (objects.area) {
                objects.area.scale.set(L, L, 1);
                objects.rodX.position.set(0, 0, -L/2);
                objects.rodZ.position.set(-L/2, 0, 0);
                objects.area.position.set(0, 0, 0);
            } else if (objects.rodX) {
                objects.rodX.position.set(0,0,0);
            }

            if (objects.volume) {
                objects.volume.scale.set(L, L, L);
                objects.volumeEdges.scale.set(L, L, L);
                objects.rodX.position.set(0, -L/2, -L/2);
                objects.rodY.position.set(-L/2, 0, -L/2);
                objects.rodZ.position.set(-L/2, -L/2, 0);
                objects.volume.position.set(0,0,0);
                objects.volumeEdges.position.set(0,0,0);
            }

            if (objects.mass) {
                // Volume proportional to mass -> radius proportional to cube root of mass
                const r = 0.4 * Math.pow(M, 1/3);
                objects.mass.scale.set(r, r, r);
            }
        }

        // --- UI Logic ---
        const ui = {
            select: document.getElementById('quantity-select'),
            slL: document.getElementById('slider-l'),
            slM: document.getElementById('slider-m'),
            slT: document.getElementById('slider-t'),
            txtL: document.getElementById('val-l-text'),
            txtM: document.getElementById('val-m-text'),
            txtT: document.getElementById('val-t-text'),
            title: document.getElementById('quantity-title'),
            formula: document.getElementById('formula-display'),
            calc: document.getElementById('calc-display')
        };

        function updateUI() {
            state.mode = ui.select.value;
            state.L = parseFloat(ui.slL.value);
            state.M = parseFloat(ui.slM.value);
            state.T = parseFloat(ui.slT.value);

            ui.txtL.textContent = state.L.toFixed(1);
            ui.txtM.textContent = state.M.toFixed(1);
            ui.txtT.textContent = state.T.toFixed(1);

            // Update Formula Card
            let fText = "", cText = "", title = "";
            const L = state.L, M = state.M, T = state.T;

            switch(state.mode) {
                case 'length':
                    title = "Length"; fText = "[L]¹"; cText = `${L.toFixed(2)} m`; break;
                case 'area':
                    title = "Area"; fText = "[L]²"; cText = `${(L*L).toFixed(2)} m²`; break;
                case 'volume':
                    title = "Volume"; fText = "[L]³"; cText = `${(L*L*L).toFixed(2)} m³`; break;
                case 'velocity':
                    title = "Velocity"; fText = "[L][T]⁻¹"; cText = `${(L/T).toFixed(2)} m/s`; break;
                case 'acceleration':
                    title = "Acceleration"; fText = "[L][T]⁻²"; cText = `${(L/(T*T)).toFixed(2)} m/s²`; break;
                case 'force':
                    title = "Force"; fText = "[M][L][T]⁻²"; cText = `${(M*L/(T*T)).toFixed(2)} N`; break;
            }

            ui.title.textContent = title;
            ui.formula.textContent = fText;
            ui.calc.textContent = `Value: ${cText}`;

            // Disable irrelevant sliders visually
            ui.slM.parentElement.style.opacity = (state.mode === 'force') ? '1' : '0.3';
            ui.slM.disabled = (state.mode !== 'force');
            
            const needsTime = ['velocity', 'acceleration', 'force'].includes(state.mode);
            ui.slT.parentElement.style.opacity = needsTime ? '1' : '0.3';
            ui.slT.disabled = !needsTime;

            buildScene();
        }

        ui.select.addEventListener('change', updateUI);
        ui.slL.addEventListener('input', () => { state.L = parseFloat(ui.slL.value); ui.txtL.textContent = state.L.toFixed(1); updateStaticScales(); updateUI(); });
        ui.slM.addEventListener('input', () => { state.M = parseFloat(ui.slM.value); ui.txtM.textContent = state.M.toFixed(1); updateStaticScales(); updateUI(); });
        ui.slT.addEventListener('input', () => { state.T = parseFloat(ui.slT.value); ui.txtT.textContent = state.T.toFixed(1); updateUI(); });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const L = state.L;
            const T = state.T;
            const M = state.M;

            // Idle Hover
            mainGroup.position.y = Math.sin(time * 2) * 0.1;

            // Time Ring Pulse
            if (objects.timeRing) {
                const localT = time % T;
                const phase = localT / T;
                const scale = 1 + phase * 2;
                objects.timeRing.scale.set(scale, scale, scale);
                objects.timeRing.material.opacity = 0.6 * (1 - phase);
            }

            // Physics Animations
            if (['velocity', 'acceleration', 'force'].includes(state.mode)) {
                const localT = time % T;
                const phase = localT / T; // 0 to 1
                
                let xPos = 0;
                let vMag = 0;
                let aMag = L / (T * T); // Visual acceleration

                if (state.mode === 'velocity') {
                    // Constant velocity: crosses L in time T
                    xPos = -L/2 + L * phase;
                    vMag = L / T;
                    
                    objects.particle.position.set(xPos, 0.2, 0);
                    objects.vector.position.copy(objects.particle.position);
                    objects.vector.setLength(vMag * 0.5 + 0.1, vMag * 0.2, vMag * 0.1); // Scale vector visually
                } 
                else if (state.mode === 'acceleration') {
                    // Constant acceleration from rest: crosses L in time T
                    // x = 0.5 * a * t^2. To cross L in T: L = 0.5 * a * T^2 => a = 2L/T^2
                    // Using spec formula a_visual = L/T^2, so x = -L/2 + L * phase^2
                    xPos = -L/2 + L * (phase * phase);
                    vMag = 2 * L * phase / T; // derivative of xPos wrt time
                    
                    objects.particle.position.set(xPos, 0.2, 0);
                    objects.vector.position.copy(objects.particle.position);
                    objects.vector.setLength(vMag * 0.5 + 0.1, vMag * 0.2, vMag * 0.1);
                }
                else if (state.mode === 'force') {
                    xPos = -L/2 + L * (phase * phase);
                    const r = 0.4 * Math.pow(M, 1/3);
                    objects.mass.position.set(xPos, r, 0);
                    
                    // Force vector is constant length F = M * a_visual
                    const fMag = M * aMag;
                    
                    // Position vector behind the mass pushing it
                    objects.vector.position.set(xPos - r - 0.1, r, 0);
                    objects.vector.setLength(fMag * 0.5 + 0.5, 0.3, 0.2);
                }
            }

            // Update Labels Position
            const tempV = new THREE.Vector3();
            labels.forEach(label => {
                if(label.ref) {
                    tempV.copy(label.pos);
                    // Apply object's world matrix to local position
                    tempV.applyMatrix4(label.ref.matrixWorld);
                    // Add main group offset
                    tempV.y += mainGroup.position.y;
                    
                    tempV.project(camera);
                    
                    const x = (tempV.x *  .5 + .5) * window.innerWidth;
                    const y = (tempV.y * -.5 + .5) * window.innerHeight;
                    
                    // Only show if in front of camera
                    if (tempV.z < 1) {
                        label.element.style.display = 'block';
                        label.element.style.left = `${x}px`;
                        label.element.style.top = `${y}px`;
                    } else {
                        label.element.style.display = 'none';
                    }
                }
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // --- Resize Handler ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Init ---
        buildScene();
        updateUI();
        animate();

    </script>
</body>
</html>
