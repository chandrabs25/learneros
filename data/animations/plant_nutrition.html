<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conditions for Plant Growth: Nutrition & Turgidity</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 26px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 18px; font-weight: 600; fill: #34495E; }
        .label { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .process-label { font-size: 13px; font-weight: 700; fill: #E74C3C; font-style: italic; }
        .chem { font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 500; }
        .legend-text { font-size: 13px; fill: #34495E; }

        /* Animations */
        /* Phase 1: Absorption (0-30%) */
        @keyframes waterUptake1 {
            0% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(160px, 80px); opacity: 1; }
            30%, 100% { transform: translate(160px, 80px); opacity: 0; }
        }
        @keyframes waterUptake2 {
            0% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(110px, -70px); opacity: 1; }
            30%, 100% { transform: translate(110px, -70px); opacity: 0; }
        }
        @keyframes nutrientUptake {
            0% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(140px, 30px); opacity: 1; }
            30%, 100% { transform: translate(140px, 30px); opacity: 0; }
        }
        @keyframes oxygenUptake {
            0% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(-40px, -30px); opacity: 1; }
            30%, 100% { transform: translate(-40px, -30px); opacity: 0; }
        }

        /* Phase 2 & 3: Turgor & Enlargement (30% - 85%) */
        /* Transform origin is center of the right cell: 750px 320px */
        .anim-vacuole {
            transform-origin: 750px 320px;
            animation: vacuoleExpand 12s ease-in-out infinite;
        }
        @keyframes vacuoleExpand {
            0%, 30% { transform: scale(1); }
            55% { transform: scale(1.3); } /* Pushes membrane to wall */
            75%, 85% { transform: scale(1.43); } /* Expands with wall */
            100% { transform: scale(1); }
        }

        .anim-membrane {
            transform-origin: 750px 320px;
            animation: membraneExpand 12s ease-in-out infinite;
        }
        @keyframes membraneExpand {
            0%, 30% { transform: scale(1); }
            55% { transform: scale(1.04); } /* Hits cell wall */
            75%, 85% { transform: scale(1.144); } /* Expands with wall */
            100% { transform: scale(1); }
        }

        .anim-wall {
            transform-origin: 750px 320px;
            animation: wallExpand 12s ease-in-out infinite;
        }
        @keyframes wallExpand {
            0%, 55% { transform: scale(1); }
            75%, 85% { transform: scale(1.1); } /* Cell enlargement */
            100% { transform: scale(1); }
        }

        .anim-arrows {
            transform-origin: 750px 320px;
            animation: arrowShow 12s ease-in-out infinite;
        }
        @keyframes arrowShow {
            0%, 40% { opacity: 0; transform: scale(0.8); }
            50%, 85% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        /* Apply particle animations */
        .p-water-1 { animation: waterUptake1 12s ease-in-out infinite; }
        .p-water-2 { animation: waterUptake2 12s ease-in-out infinite; }
        .p-nutrient { animation: nutrientUptake 12s ease-in-out infinite; }
        .p-oxygen { animation: oxygenUptake 12s ease-in-out infinite; }

    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 1000 600" aria-label="Animated diagram showing plant root hair water uptake and cellular enlargement due to turgor pressure" role="img">
        <title>Conditions for Plant Growth: Nutrition & Turgidity</title>
        <desc>A two-pane animation. On the left, a root hair absorbs water and nutrients from the soil. On the right, a plant cell's vacuole expands, creating turgor pressure that pushes the cell membrane against the cell wall, ultimately causing the cell wall to expand.</desc>

        <defs>
            <!-- Gradients -->
            <radialGradient id="vacuoleGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#E8F4FD" />
                <stop offset="100%" stop-color="#AED6F1" />
            </radialGradient>
            <linearGradient id="soilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#D2B48C" />
                <stop offset="100%" stop-color="#C19A6B" />
            </linearGradient>
            
            <!-- Arrowhead Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
            </marker>
            <marker id="arrow-white" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffffff" />
            </marker>
            <marker id="arrow-process" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C" />
            </marker>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="1000" height="600" fill="#f8f9fa" />

        <!-- Header -->
        <text x="500" y="40" text-anchor="middle" class="title">Conditions for Plant Growth: Nutrition &amp; Turgidity</text>
        <line x1="200" y1="55" x2="800" y2="55" stroke="#BDC3C7" stroke-width="2" />

        <!-- ========================================== -->
        <!-- LEFT PANE: Root Hair Uptake                -->
        <!-- ========================================== -->
        <g transform="translate(0, 0)">
            <text x="250" y="90" text-anchor="middle" class="subtitle">Macro-view: Root Hair Uptake</text>
            
            <!-- Soil Background -->
            <rect x="50" y="110" width="400" height="400" rx="12" fill="url(#soilGrad)" filter="url(#shadow)" />
            
            <!-- Soil Particles -->
            <g fill="#8B4513" opacity="0.6">
                <polygon points="80,150 95,140 110,160 90,170" />
                <polygon points="150,220 170,210 180,230 160,240" />
                <polygon points="70,350 90,330 110,360 80,380" />
                <polygon points="200,450 220,430 240,460 210,480" />
                <polygon points="120,480 140,470 150,490 130,500" />
                <polygon points="280,160 300,140 320,170 290,180" />
            </g>

            <!-- Root Epidermis & Hair -->
            <!-- Base cell on the right, hair extending to the left -->
            <path d="M 350 110 L 450 110 L 450 510 L 350 510 L 350 360 C 350 360, 120 360, 100 340 C 80 320, 80 280, 100 260 C 120 240, 350 240, 350 240 Z" 
                  fill="#2ECC71" stroke="#1E8449" stroke-width="4" />
            
            <!-- Root Cell Nucleus & Vacuole (Static) -->
            <rect x="370" y="130" width="60" height="100" rx="20" fill="#AED6F1" opacity="0.8" />
            <rect x="370" y="380" width="60" height="110" rx="20" fill="#AED6F1" opacity="0.8" />
            <circle cx="400" cy="350" r="15" fill="#2C3E50" />

            <!-- Animated Particles in Soil -->
            <!-- Water Group 1 -->
            <g class="p-water-1">
                <circle cx="120" cy="180" r="6" fill="#3498DB" />
                <circle cx="135" cy="170" r="6" fill="#3498DB" />
                <circle cx="110" cy="165" r="6" fill="#3498DB" />
            </g>
            <!-- Water Group 2 -->
            <g class="p-water-2">
                <circle cx="160" cy="420" r="6" fill="#3498DB" />
                <circle cx="175" cy="430" r="6" fill="#3498DB" />
                <circle cx="150" cy="440" r="6" fill="#3498DB" />
            </g>
            <!-- Nutrient Group -->
            <g class="p-nutrient">
                <circle cx="90" cy="280" r="5" fill="#F39C12" />
                <circle cx="75" cy="295" r="5" fill="#F39C12" />
                <circle cx="100" cy="305" r="5" fill="#F39C12" />
            </g>

            <!-- Process Labels -->
            <text x="180" y="180" class="process-label">Osmosis <tspan class="chem">H₂O</tspan></text>
            <line x1="180" y1="185" x2="230" y2="230" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow-process)" stroke-dasharray="4,2"/>

            <text x="120" y="390" class="process-label">Active Transport <tspan class="chem">K⁺, NO₃⁻</tspan></text>
            <line x1="150" y1="375" x2="190" y2="330" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow-process)" stroke-dasharray="4,2"/>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT PANE: Cellular Enlargement           -->
        <!-- ========================================== -->
        <g transform="translate(0, 0)">
            <text x="750" y="90" text-anchor="middle" class="subtitle">Micro-view: Cellular Enlargement</text>

            <!-- Background Container -->
            <rect x="550" y="110" width="400" height="400" rx="12" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)" />

            <!-- The Plant Cell -->
            <!-- Grouping for transform origin -->
            <g>
                <!-- Cell Wall (Expands in Phase 3) -->
                <rect x="610" y="160" width="280" height="320" rx="20" fill="#1E8449" class="anim-wall" />
                
                <!-- Cytoplasm / Inner Cell Wall bounds -->
                <rect x="620" y="170" width="260" height="300" rx="15" fill="#E8F4FD" class="anim-wall" />

                <!-- Cell Membrane (Expands in Phase 2 to hit wall, then with wall in Phase 3) -->
                <!-- Base size is slightly smaller than inner wall to show gap initially -->
                <rect x="625" y="175" width="250" height="290" rx="12" fill="none" stroke="#4A90D9" stroke-width="4" class="anim-membrane" />
                
                <!-- Cytoplasm Fill attached to membrane -->
                <rect x="627" y="177" width="246" height="286" rx="10" fill="#E8F4FD" class="anim-membrane" />

                <!-- Organelles (Attached to membrane expansion so they move naturally) -->
                <g class="anim-membrane">
                    <!-- Chloroplasts -->
                    <ellipse cx="660" cy="210" rx="18" ry="10" fill="#27AE60" transform="rotate(-30 660 210)" />
                    <ellipse cx="830" cy="240" rx="18" ry="10" fill="#27AE60" transform="rotate(45 830 240)" />
                    <ellipse cx="670" cy="420" rx="18" ry="10" fill="#27AE60" transform="rotate(15 670 420)" />

                    <!-- Mitochondria -->
                    <g transform="translate(820, 390)">
                        <ellipse cx="0" cy="0" rx="22" ry="14" fill="#E74C3C" transform="rotate(-20)" />
                        <!-- Zig-zag inner membrane -->
                        <path d="M -15 -2 Q -10 -8 -5 -2 T 5 -2 T 15 -2" fill="none" stroke="#ffffff" stroke-width="1.5" transform="rotate(-20)" />
                    </g>

                    <!-- Nucleus -->
                    <circle cx="680" cy="370" r="28" fill="#2C3E50" />
                    <circle cx="690" cy="360" r="8" fill="#34495E" /> <!-- Nucleolus -->
                </g>

                <!-- Vacuole (Expands massively in Phase 2) -->
                <rect x="680" y="210" width="140" height="180" rx="40" fill="url(#vacuoleGrad)" stroke="#3498DB" stroke-width="2" class="anim-vacuole" />

                <!-- Turgor Pressure Arrows (Appear in Phase 2) -->
                <g class="anim-arrows">
                    <!-- Top -->
                    <line x1="750" y1="230" x2="750" y2="190" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" />
                    <!-- Bottom -->
                    <line x1="750" y1="370" x2="750" y2="410" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" />
                    <!-- Left -->
                    <line x1="700" y1="300" x2="650" y2="300" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" />
                    <!-- Right -->
                    <line x1="800" y1="300" x2="850" y2="300" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" />
                </g>
            </g>

            <!-- Oxygen Particle animating to Mitochondria -->
            <g class="p-oxygen">
                <circle cx="880" cy="440" r="4" fill="#BDC3C7" />
                <circle cx="888" cy="435" r="4" fill="#BDC3C7" />
            </g>
        </g>

        <!-- ========================================== -->
        <!-- LABELS & ANNOTATIONS                       -->
        <!-- ========================================== -->
        <g>
            <!-- Left Pane Labels -->
            <text x="250" y="270" class="label" fill="#ffffff">Root Hair</text>
            <text x="250" y="140" class="label" fill="#8B4513">Soil Environment</text>

            <!-- Right Pane Labels & Pointers -->
            <!-- Cell Wall -->
            <line x1="530" y1="180" x2="610" y2="180" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
            <text x="525" y="184" text-anchor="end" class="label">Rigid Cell Wall</text>

            <!-- Cell Membrane -->
            <line x1="530" y1="220" x2="625" y2="220" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
            <text x="525" y="224" text-anchor="end" class="label">Cell Membrane</text>

            <!-- Vacuole -->
            <line x1="900" y1="250" x2="800" y2="280" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
            <text x="905" y="250" text-anchor="start" class="label">Turgid Vacuole</text>
            <text x="905" y="268" text-anchor="start" class="legend-text" font-size="11px">(Drives expansion)</text>

            <!-- Mitochondria -->
            <line x1="900" y1="410" x2="845" y2="400" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
            <text x="905" y="410" text-anchor="start" class="label">Mitochondrion</text>
            <text x="905" y="428" text-anchor="start" class="legend-text" font-size="11px">(Consumes <tspan class="chem">O₂</tspan> for ATP)</text>
            
            <!-- Nucleus -->
            <line x1="530" y1="370" x2="650" y2="370" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
            <text x="525" y="374" text-anchor="end" class="label">Nucleus</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(200, 540)">
            <rect x="0" y="0" width="600" height="40" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" />
            
            <circle cx="30" cy="20" r="6" fill="#3498DB" />
            <text x="45" y="24" class="legend-text">Water (<tspan class="chem">H₂O</tspan>)</text>

            <circle cx="160" cy="20" r="6" fill="#F39C12" />
            <text x="175" y="24" class="legend-text">Nutrient Ions (<tspan class="chem">K⁺, NO₃⁻</tspan>)</text>

            <circle cx="350" cy="20" r="6" fill="#BDC3C7" />
            <text x="365" y="24" class="legend-text">Oxygen (<tspan class="chem">O₂</tspan>)</text>

            <line x1="470" y1="20" x2="490" y2="20" stroke="#ffffff" stroke-width="3" marker-end="url(#arrow-white)" filter="url(#shadow)" />
            <rect x="465" y="10" width="30" height="20" fill="#34495E" opacity="0.1" rx="4" />
            <text x="505" y="24" class="legend-text">Turgor Pressure</text>
        </g>

    </svg>
</div>

</body>
</html>
