<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Forebrain and Pineal Gland: Melatonin Secretion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e5ec;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            overflow: hidden;
        }

        /* 12-Second Diurnal Cycle Animations */
        
        .bg-anim {
            animation: bg-cycle 12s ease-in-out infinite;
        }
        @keyframes bg-cycle {
            0%, 41.6% { fill: #f8f9fa; } /* Day: 0-5s */
            50%, 91.6% { fill: #2C3E50; } /* Night: 6-11s */
            100% { fill: #f8f9fa; } /* Transition back to Day */
        }

        .text-anim {
            animation: text-cycle 12s ease-in-out infinite;
        }
        @keyframes text-cycle {
            0%, 41.6% { fill: #2C3E50; }
            50%, 91.6% { fill: #f8f9fa; }
            100% { fill: #2C3E50; }
        }

        .stroke-anim {
            animation: stroke-cycle 12s ease-in-out infinite;
        }
        @keyframes stroke-cycle {
            0%, 41.6% { stroke: #2C3E50; }
            50%, 91.6% { stroke: #f8f9fa; }
            100% { stroke: #2C3E50; }
        }

        .sun-icon {
            animation: sun-fade 12s ease-in-out infinite;
        }
        @keyframes sun-fade {
            0%, 41.6% { opacity: 1; transform: scale(1) rotate(0deg); }
            50%, 100% { opacity: 0; transform: scale(0.8) rotate(45deg); }
        }

        .moon-icon {
            animation: moon-fade 12s ease-in-out infinite;
            transform-origin: 700px 50px;
        }
        @keyframes moon-fade {
            0%, 41.6% { opacity: 0; transform: scale(0.8) rotate(-20deg); }
            50%, 91.6% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.8) rotate(20deg); }
        }

        .pineal-gland {
            transform-origin: 275px 255px;
            animation: pineal-pulse 12s ease-in-out infinite;
        }
        @keyframes pineal-pulse {
            0%, 41.6% { transform: scale(1); fill: #E74C3C; }
            45% { transform: scale(1.2); fill: #FF6B6B; }
            50% { transform: scale(1); fill: #E74C3C; }
            55% { transform: scale(1.2); fill: #FF6B6B; }
            60% { transform: scale(1); fill: #E74C3C; }
            65% { transform: scale(1.2); fill: #FF6B6B; }
            70% { transform: scale(1); fill: #E74C3C; }
            75% { transform: scale(1.2); fill: #FF6B6B; }
            80% { transform: scale(1); fill: #E74C3C; }
            85% { transform: scale(1.2); fill: #FF6B6B; }
            91.6%, 100% { transform: scale(1); fill: #E74C3C; }
        }

        .zoom-bg {
            animation: zoom-bg-cycle 12s ease-in-out infinite;
        }
        @keyframes zoom-bg-cycle {
            0%, 41.6% { fill: #ffffff; }
            50%, 91.6% { fill: #1A252F; }
            100% { fill: #ffffff; }
        }

        /* Melatonin Flow Animations */
        .night-layer {
            animation: night-opacity 12s ease-in-out infinite;
        }
        @keyframes night-opacity {
            0%, 41.6% { opacity: 0; }
            50%, 91.6% { opacity: 1; }
            100% { opacity: 0; }
        }

        .day-layer {
            animation: day-opacity 12s ease-in-out infinite;
        }
        @keyframes day-opacity {
            0%, 41.6% { opacity: 1; }
            50%, 91.6% { opacity: 0; }
            100% { opacity: 1; }
        }

        .night-particle {
            animation: flow-night 1.5s linear infinite;
        }
        .day-particle {
            animation: flow-night 4s linear infinite;
        }

        @keyframes flow-night {
            0% { transform: translate(0px, 0px); opacity: 0; }
            10% { transform: translate(0px, 20px); opacity: 1; }
            40% { transform: translate(0px, 170px); opacity: 1; }
            90% { transform: translate(150px, 170px); opacity: 1; }
            100% { transform: translate(180px, 170px); opacity: 0; }
        }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Forebrain and Pineal Gland: Melatonin Secretion</title>
        <desc>Animated diagram showing the location of the pineal gland in the human forebrain and the secretion of melatonin during the night cycle.</desc>

        <!-- Definitions for clipping and gradients -->
        <defs>
            <clipPath id="zoom-clip">
                <rect x="500" y="100" width="260" height="300" rx="10" />
            </clipPath>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Dynamic Background -->
        <rect width="800" height="500" class="bg-anim" />

        <!-- Titles -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" class="text-anim">Forebrain: Pineal Gland &amp; Circadian Rhythm</text>
        <text x="400" y="65" text-anchor="middle" font-size="14" font-weight="400" class="text-anim">Diurnal Rhythm Regulation &amp; Melatonin Secretion</text>

        <!-- Day/Night Indicators -->
        <g class="sun-icon">
            <circle cx="700" cy="50" r="12" fill="#F39C12" />
            <line x1="700" y1="30" x2="700" y2="22" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="700" y1="70" x2="700" y2="78" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="680" y1="50" x2="672" y2="50" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="720" y1="50" x2="728" y2="50" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="686" y1="36" x2="680" y2="30" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="714" y1="64" x2="720" y2="70" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="686" y1="64" x2="680" y2="70" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
            <line x1="714" y1="36" x2="720" y2="30" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
        </g>
        <g class="moon-icon">
            <path d="M 695 35 A 14 14 0 1 0 710 65 A 18 18 0 1 1 695 35 Z" fill="#F1C40F" filter="url(#glow)"/>
        </g>

        <!-- ========================================== -->
        <!-- LEFT SECTION: MACRO ANATOMY (FOREBRAIN)    -->
        <!-- ========================================== -->
        
        <g id="macro-anatomy">
            <!-- Cerebrum (Animal Tissue Color) -->
            <path d="M 220 90 C 140 90, 80 150, 80 230 C 80 280, 110 320, 150 330 C 170 335, 200 335, 230 335 C 260 335, 280 345, 300 355 C 330 370, 370 350, 390 310 C 410 260, 400 190, 350 130 C 310 90, 260 90, 220 90 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="2" opacity="0.9"/>
            
            <!-- Gyri/Sulci details -->
            <path d="M 120 180 Q 150 200 140 250" stroke="#D68910" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M 170 110 Q 180 170 150 210" stroke="#D68910" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M 270 110 Q 250 170 280 210" stroke="#D68910" fill="none" stroke-width="2" stroke-linecap="round"/>
            <path d="M 340 160 Q 310 200 330 250" stroke="#D68910" fill="none" stroke-width="2" stroke-linecap="round"/>

            <!-- Corpus Callosum -->
            <path d="M 180 230 C 180 200, 260 200, 280 230 C 290 240, 280 250, 270 245 C 250 235, 200 235, 190 245 C 180 250, 170 240, 180 230 Z" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1.5"/>

            <!-- Thalamus -->
            <ellipse cx="245" cy="255" rx="20" ry="15" fill="#D68910" stroke="#2C3E50" stroke-width="1.5"/>

            <!-- Hypothalamus -->
            <path d="M 235 265 L 250 268 L 240 290 L 225 285 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="1.5"/>

            <!-- Brainstem -->
            <path d="M 230 280 C 240 280, 250 300, 240 370 L 200 370 C 210 320, 210 300, 230 280 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="1.5"/>

            <!-- Cerebellum -->
            <path d="M 245 290 C 300 280, 340 310, 320 360 C 290 390, 250 360, 240 330 Z" fill="#E67E22" stroke="#2C3E50" stroke-width="1.5"/>

            <!-- Pineal Gland (Dorsal to Thalamus) -->
            <circle cx="275" cy="255" r="7" stroke="#2C3E50" stroke-width="1.5" class="pineal-gland"/>
        </g>

        <!-- Macro Labels & Pointers -->
        <g id="macro-labels">
            <polyline points="200,120 120,80 100,80" class="stroke-anim" fill="none" stroke-width="1.5"/>
            <text x="95" y="84" text-anchor="end" class="text-anim" font-size="14" font-weight="600">Cerebrum</text>

            <polyline points="245,255 140,200 120,200" class="stroke-anim" fill="none" stroke-width="1.5"/>
            <text x="115" y="204" text-anchor="end" class="text-anim" font-size="14" font-weight="600">Thalamus</text>

            <polyline points="235,280 140,320 120,320" class="stroke-anim" fill="none" stroke-width="1.5"/>
            <text x="115" y="324" text-anchor="end" class="text-anim" font-size="14" font-weight="600">Hypothalamus</text>

            <polyline points="275,255 360,200 380,200" class="stroke-anim" fill="none" stroke-width="1.5"/>
            <text x="385" y="204" text-anchor="start" class="text-anim" font-size="14" font-weight="700">Pineal Gland</text>
        </g>

        <!-- Connecting Lines to Zoom Box -->
        <path d="M 282 250 L 500 100" class="stroke-anim" stroke-dasharray="6,4" fill="none" stroke-width="1.5"/>
        <path d="M 282 260 L 500 400" class="stroke-anim" stroke-dasharray="6,4" fill="none" stroke-width="1.5"/>

        <!-- ========================================== -->
        <!-- RIGHT SECTION: MICRO ANATOMY (ZOOM BOX)    -->
        <!-- ========================================== -->

        <g id="micro-anatomy">
            <!-- Zoom Box Container -->
            <rect x="500" y="100" width="260" height="300" rx="10" class="zoom-bg" stroke="#2C3E50" stroke-width="2"/>
            
            <g clip-path="url(#zoom-clip)">
                
                <!-- Pinealocytes (Cells) -->
                <circle cx="560" cy="160" r="30" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <circle cx="630" cy="170" r="30" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <circle cx="700" cy="150" r="30" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                
                <!-- Nuclei -->
                <circle cx="560" cy="160" r="9" fill="#2C3E50"/>
                <circle cx="630" cy="170" r="9" fill="#2C3E50"/>
                <circle cx="700" cy="150" r="9" fill="#2C3E50"/>

                <!-- Blood Capillary -->
                <path d="M 490 310 Q 630 330 770 310 L 770 390 Q 630 410 490 390 Z" fill="#FDEDEC" stroke="#E74C3C" stroke-width="4"/>
                
                <!-- Red Blood Cells -->
                <ellipse cx="540" cy="340" rx="14" ry="9" fill="#E74C3C" opacity="0.7"/>
                <ellipse cx="610" cy="360" rx="14" ry="9" fill="#E74C3C" opacity="0.7"/>
                <ellipse cx="680" cy="335" rx="14" ry="9" fill="#E74C3C" opacity="0.7"/>
                <ellipse cx="740" cy="355" rx="14" ry="9" fill="#E74C3C" opacity="0.7"/>

                <!-- Melatonin Particles (Day - Minimal Flow) -->
                <g class="day-layer">
                    <circle cx="560" cy="190" r="5" fill="#98D8C8" class="day-particle" style="animation-delay: 0s;" />
                    <circle cx="630" cy="200" r="5" fill="#98D8C8" class="day-particle" style="animation-delay: 2s;" />
                </g>

                <!-- Melatonin Particles (Night - Heavy Flow) -->
                <g class="night-layer">
                    <!-- From Cell 1 -->
                    <circle cx="560" cy="190" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0s;" />
                    <circle cx="560" cy="190" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0.5s;" />
                    <circle cx="560" cy="190" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 1.0s;" />
                    <!-- From Cell 2 -->
                    <circle cx="630" cy="200" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0.2s;" />
                    <circle cx="630" cy="200" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0.7s;" />
                    <circle cx="630" cy="200" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 1.2s;" />
                    <!-- From Cell 3 -->
                    <circle cx="700" cy="180" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0.4s;" />
                    <circle cx="700" cy="180" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 0.9s;" />
                    <circle cx="700" cy="180" r="5" fill="#98D8C8" class="night-particle" style="animation-delay: 1.4s;" />
                </g>

            </g>

            <!-- Micro Labels -->
            <text x="630" y="125" text-anchor="middle" class="text-anim" font-size="12" font-weight="600">Pinealocytes (Cells)</text>
            <text x="630" y="420" text-anchor="middle" class="text-anim" font-size="12" font-weight="600">Blood Capillary</text>
            
            <!-- Dynamic Process Label -->
            <g class="night-layer">
                <rect x="540" y="240" width="180" height="24" rx="12" fill="#2C3E50" opacity="0.8"/>
                <text x="630" y="256" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="12" fill="#98D8C8" font-weight="600">Melatonin Secretion</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g id="legend" transform="translate(20, 410)">
            <rect x="0" y="0" width="170" height="70" rx="6" fill="#ffffff" stroke="#2C3E50" stroke-width="1.5" opacity="0.95"/>
            
            <circle cx="15" cy="18" r="5" fill="#E74C3C"/>
            <text x="28" y="22" font-size="11" font-weight="600" fill="#2C3E50">Pineal Gland (Active)</text>
            
            <circle cx="15" cy="35" r="5" fill="#98D8C8"/>
            <text x="28" y="39" font-size="11" font-weight="600" fill="#2C3E50">Melatonin Hormone</text>
            
            <line x1="10" y1="52" x2="20" y2="52" stroke="#E74C3C" stroke-width="3"/>
            <text x="28" y="56" font-size="11" font-weight="600" fill="#2C3E50">Arterial Capillary</text>
        </g>

    </svg>
</div>

</body>
</html>
