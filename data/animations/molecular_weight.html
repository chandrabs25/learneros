<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Molecular Weight Divide: Biomacromolecules vs. Micromolecules</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Animations */
        .fall-small {
            animation: fall-small 15s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fall-small {
            0%, 5% { transform: translate(0, 0); opacity: 0; }
            10%, 15% { transform: translate(0, 0); opacity: 1; }
            35%, 85% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
            90%, 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .fall-large {
            animation: fall-large 15s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes fall-large {
            0%, 5% { transform: translate(0, 0); opacity: 0; }
            10%, 15% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(var(--dx), calc(var(--dy) + 15px)); opacity: 1; }
            35%, 85% { transform: translate(var(--dx), var(--dy)); opacity: 1; }
            90%, 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        .lipid-single {
            animation: lipid-single 15s infinite ease-in-out;
        }
        @keyframes lipid-single {
            0%, 5% { transform: translate(0, 0); opacity: 0; }
            10%, 15% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(var(--cx), var(--cy)); opacity: 1; }
            28%, 100% { transform: translate(var(--cx), var(--cy)); opacity: 0; }
        }

        .lipid-vesicle {
            animation: lipid-vesicle 15s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes lipid-vesicle {
            0%, 24% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            28% { transform: translate(0, 0) scale(1.1); opacity: 1; }
            32% { transform: translate(var(--dx), calc(var(--dy) + 15px)) scale(1); opacity: 1; }
            38%, 85% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 1; }
            90%, 100% { transform: translate(var(--dx), var(--dy)) scale(1); opacity: 0; }
        }

        .wobble {
            animation: wobble var(--d, 2s) infinite ease-in-out alternate;
        }
        @keyframes wobble {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(var(--wx, 3px), var(--wy, 3px)) rotate(var(--wr, 10deg)); }
        }

        .fluid-rise {
            animation: fluid-rise 15s infinite cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: 400px 470px;
        }
        @keyframes fluid-rise {
            0%, 15% { transform: scaleY(0); opacity: 0; }
            20% { transform: scaleY(0); opacity: 0.8; }
            40%, 85% { transform: scaleY(1); opacity: 0.8; }
            90%, 100% { transform: scaleY(1); opacity: 0; }
        }

        .text-fade {
            animation: text-fade 15s infinite ease-in-out;
        }
        @keyframes text-fade {
            0%, 25% { opacity: 0; }
            35%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
        <title>Biomacromolecules: The Solubility &amp; Weight Divide</title>
        <desc>An animation showing the separation of biomolecules using Trichloroacetic Acid. Small molecules pass through the mesh into the filtrate, while large macromolecules and lipid vesicles are retained.</desc>

        <!-- Definitions for Molecules -->
        <defs>
            <!-- Amino Acid -->
            <circle id="amino" r="4.5" fill="#F39C12" />
            
            <!-- Monosaccharide -->
            <polygon id="sugar" points="0,-5 4.5,-2.5 4.5,2.5 0,5 -4.5,2.5 -4.5,-2.5" fill="#F39C12" />
            <polygon id="sugar-green" points="0,-5 4.5,-2.5 4.5,2.5 0,5 -4.5,2.5 -4.5,-2.5" fill="#2ECC71" />
            
            <!-- Nucleotide -->
            <polygon id="nt" points="0,-5 4,0 0,5 -4,0" fill="#4A90D9" />
            
            <!-- Protein (Polypeptide Chain) -->
            <path id="protein" d="M-15,0 C-10,-12 0,12 10,0 C20,-12 30,12 40,0" fill="none" stroke="#98D8C8" stroke-width="3.5" stroke-linecap="round"/>
            
            <!-- Polysaccharide -->
            <g id="poly">
                <use href="#sugar-green" x="-10" y="0"/>
                <line x1="-6" y1="0" x2="-4" y2="0" stroke="#2ECC71" stroke-width="2"/>
                <use href="#sugar-green" x="0" y="0"/>
                <line x1="4" y1="0" x2="6" y2="0" stroke="#2ECC71" stroke-width="2"/>
                <use href="#sugar-green" x="10" y="0"/>
                <line x1="14" y1="0" x2="16" y2="0" stroke="#2ECC71" stroke-width="2"/>
                <use href="#sugar-green" x="20" y="0"/>
            </g>
            
            <!-- Nucleic Acid (DNA/RNA) -->
            <g id="dna">
                <path d="M-15,0 Q-7.5,-10 0,0 T15,0 T30,0" fill="none" stroke="#FF6B6B" stroke-width="2"/>
                <path d="M-15,0 Q-7.5,10 0,0 T15,0 T30,0" fill="none" stroke="#FF6B6B" stroke-width="2"/>
                <line x1="-11" y1="-3" x2="-11" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="-4" y1="-3" x2="-4" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="4" y1="-3" x2="4" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="11" y1="-3" x2="11" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="19" y1="-3" x2="19" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="26" y1="-3" x2="26" y2="3" stroke="#FF6B6B" stroke-width="1"/>
            </g>
            
            <!-- Lipid (Individual) -->
            <g id="lipid">
                <circle cx="0" cy="-3" r="3" fill="#F39C12"/>
                <path d="M-1.5,0 Q-2.5,4 -1.5,8 M1.5,0 Q2.5,4 1.5,8" fill="none" stroke="#F39C12" stroke-width="1.2"/>
            </g>
            
            <!-- Lipid Vesicle -->
            <g id="vesicle">
                <circle cx="0" cy="0" r="24" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <circle cx="0" cy="0" r="18" fill="none" stroke="#F39C12" stroke-width="4" stroke-dasharray="4,2"/>
            </g>

            <!-- Beaker Clip Path -->
            <clipPath id="beaker-clip">
                <path d="M 330 320 L 330 460 A 10 10 0 0 0 340 470 L 460 470 A 10 10 0 0 0 470 460 L 470 320 Z"/>
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Titles -->
        <text x="400" y="45" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">Biomacromolecules: The Solubility &amp; Weight Divide</text>
        <text x="400" y="70" font-size="14" fill="#7F8C8D" text-anchor="middle">Extraction using Trichloroacetic Acid (Cl₃CCOOH)</text>

        <!-- Labels & Annotations -->
        <!-- Retentate -->
        <g transform="translate(230, 220)">
            <text x="0" y="0" font-size="16" font-weight="bold" fill="#E74C3C" text-anchor="end">Retentate</text>
            <text x="0" y="18" font-size="12" fill="#2C3E50" text-anchor="end">(Acid-Insoluble Fraction)</text>
            <text x="0" y="38" font-family="Roboto Mono" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="end">MW &gt; 10,000 Da</text>
            <line x1="10" y1="20" x2="130" y2="35" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="4,4"/>
        </g>

        <!-- Filtrate -->
        <g transform="translate(570, 380)">
            <text x="0" y="0" font-size="16" font-weight="bold" fill="#3498DB" text-anchor="start">Filtrate</text>
            <text x="0" y="18" font-size="12" fill="#2C3E50" text-anchor="start">(Acid-Soluble Pool)</text>
            <text x="0" y="38" font-family="Roboto Mono" font-size="13" font-weight="bold" fill="#2C3E50" text-anchor="start">MW 18–800 Da</text>
            <line x1="-10" y1="20" x2="-90" y2="40" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="4,4"/>
        </g>

        <!-- Lipid Callout -->
        <g transform="translate(580, 170)">
            <text x="0" y="0" font-size="14" font-weight="bold" fill="#F39C12" text-anchor="start">The Lipid Exception</text>
            <text x="0" y="20" font-size="12" fill="#2C3E50" text-anchor="start">Small MW (<tspan font-family="Roboto Mono" font-weight="bold">800 Da</tspan>)</text>
            <text x="0" y="38" font-size="12" fill="#2C3E50" text-anchor="start">but aggregate into large</text>
            <text x="0" y="56" font-size="12" fill="#2C3E50" text-anchor="start">vesicles, trapped by mesh.</text>
            <line x1="-10" y1="30" x2="-100" y2="60" stroke="#F39C12" stroke-width="1.5" stroke-dasharray="4,4"/>
        </g>

        <!-- Apparatus -->
        <!-- Fluid in Beaker -->
        <rect x="330" y="320" width="140" height="150" fill="#E8F4FD" class="fluid-rise" clip-path="url(#beaker-clip)" />
        
        <!-- Beaker -->
        <path d="M 330 300 L 330 460 A 10 10 0 0 0 340 470 L 460 470 A 10 10 0 0 0 470 460 L 470 300" fill="none" stroke="#95A5A6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Funnel -->
        <path d="M 250 110 L 550 110 L 430 260 L 430 360 L 370 360 L 370 260 Z" fill="rgba(255,255,255,0.6)" stroke="#95A5A6" stroke-width="3" stroke-linejoin="round"/>
        
        <!-- Cheesecloth Mesh -->
        <line x1="370" y1="260" x2="430" y2="260" stroke="#2C3E50" stroke-width="4" stroke-dasharray="6,4"/>

        <!-- Molecules Animation Groups -->
        
        <!-- Small Molecules (Filtrate) -->
        <!-- Amino Acids -->
        <g class="fall-small" style="--dx: -15px; --dy: 240px;"><g class="wobble" style="--wx: 4px; --wy: -3px; --wr: 15deg; --d: 1.5s;"><use href="#amino" x="380" y="150"/></g></g>
        <g class="fall-small" style="--dx: 25px; --dy: 260px;"><g class="wobble" style="--wx: -3px; --wy: 5px; --wr: -10deg; --d: 1.8s;"><use href="#amino" x="410" y="140"/></g></g>
        <g class="fall-small" style="--dx: -30px; --dy: 220px;"><g class="wobble" style="--wx: 5px; --wy: 2px; --wr: 20deg; --d: 1.6s;"><use href="#amino" x="450" y="180"/></g></g>
        <g class="fall-small" style="--dx: 10px; --dy: 270px;"><g class="wobble" style="--wx: -4px; --wy: -4px; --wr: -15deg; --d: 1.9s;"><use href="#amino" x="350" y="160"/></g></g>
        <g class="fall-small" style="--dx: 5px; --dy: 250px;"><g class="wobble" style="--wx: 3px; --wy: 3px; --wr: 10deg; --d: 1.7s;"><use href="#amino" x="480" y="150"/></g></g>
        
        <!-- Monosaccharides -->
        <g class="fall-small" style="--dx: -20px; --dy: 230px;"><g class="wobble" style="--wx: 2px; --wy: -5px; --wr: 25deg; --d: 2.1s;"><use href="#sugar" x="390" y="170"/></g></g>
        <g class="fall-small" style="--dx: 15px; --dy: 250px;"><g class="wobble" style="--wx: -5px; --wy: 2px; --wr: -20deg; --d: 1.8s;"><use href="#sugar" x="430" y="160"/></g></g>
        <g class="fall-small" style="--dx: -10px; --dy: 280px;"><g class="wobble" style="--wx: 4px; --wy: 4px; --wr: 15deg; --d: 2.0s;"><use href="#sugar" x="360" y="140"/></g></g>
        <g class="fall-small" style="--dx: 30px; --dy: 240px;"><g class="wobble" style="--wx: -3px; --wy: -4px; --wr: -15deg; --d: 1.7s;"><use href="#sugar" x="460" y="150"/></g></g>
        <g class="fall-small" style="--dx: 0px; --dy: 260px;"><g class="wobble" style="--wx: 5px; --wy: -2px; --wr: 10deg; --d: 1.9s;"><use href="#sugar" x="400" y="180"/></g></g>

        <!-- Nucleotides -->
        <g class="fall-small" style="--dx: 20px; --dy: 270px;"><g class="wobble" style="--wx: -4px; --wy: 3px; --wr: -25deg; --d: 1.6s;"><use href="#nt" x="370" y="150"/></g></g>
        <g class="fall-small" style="--dx: -25px; --dy: 240px;"><g class="wobble" style="--wx: 3px; --wy: -4px; --wr: 20deg; --d: 2.2s;"><use href="#nt" x="440" y="170"/></g></g>
        <g class="fall-small" style="--dx: 10px; --dy: 250px;"><g class="wobble" style="--wx: -2px; --wy: 5px; --wr: -15deg; --d: 1.8s;"><use href="#nt" x="420" y="150"/></g></g>
        <g class="fall-small" style="--dx: -15px; --dy: 260px;"><g class="wobble" style="--wx: 5px; --wy: 2px; --wr: 15deg; --d: 1.9s;"><use href="#nt" x="380" y="190"/></g></g>
        <g class="fall-small" style="--dx: 5px; --dy: 230px;"><g class="wobble" style="--wx: -3px; --wy: -3px; --wr: -10deg; --d: 2.1s;"><use href="#nt" x="470" y="160"/></g></g>

        <!-- Large Molecules (Retentate) -->
        <!-- Proteins -->
        <g class="fall-large" style="--dx: 15px; --dy: 80px;"><g class="wobble" style="--wx: 3px; --wy: -2px; --wr: 5deg; --d: 2.5s;"><use href="#protein" x="340" y="140"/></g></g>
        <g class="fall-large" style="--dx: -10px; --dy: 60px;"><g class="wobble" style="--wx: -4px; --wy: 3px; --wr: -8deg; --d: 2.8s;"><use href="#protein" x="450" y="150" transform="rotate(45 450 150)"/></g></g>
        <g class="fall-large" style="--dx: 5px; --dy: 70px;"><g class="wobble" style="--wx: 2px; --wy: 4px; --wr: 10deg; --d: 2.6s;"><use href="#protein" x="380" y="130" transform="rotate(-30 380 130)"/></g></g>

        <!-- Polysaccharides -->
        <g class="fall-large" style="--dx: -15px; --dy: 90px;"><g class="wobble" style="--wx: -3px; --wy: -4px; --wr: -12deg; --d: 2.7s;"><use href="#poly" x="480" y="140" transform="rotate(20 480 140)"/></g></g>
        <g class="fall-large" style="--dx: 20px; --dy: 75px;"><g class="wobble" style="--wx: 4px; --wy: 2px; --wr: 8deg; --d: 2.4s;"><use href="#poly" x="320" y="160" transform="rotate(-15 320 160)"/></g></g>

        <!-- Nucleic Acids -->
        <g class="fall-large" style="--dx: 10px; --dy: 65px;"><g class="wobble" style="--wx: -2px; --wy: 5px; --wr: -10deg; --d: 2.9s;"><use href="#dna" x="420" y="130" transform="rotate(60 420 130)"/></g></g>
        <g class="fall-large" style="--dx: -5px; --dy: 85px;"><g class="wobble" style="--wx: 5px; --wy: -3px; --wr: 15deg; --d: 2.5s;"><use href="#dna" x="360" y="150" transform="rotate(-45 360 150)"/></g></g>

        <!-- The Lipid Exception -->
        <!-- Center of aggregation: X=460, Y=160 -->
        
        <!-- Individual Lipids -->
        <g class="lipid-single" style="--cx: 40px; --cy: 20px;"><g class="wobble" style="--wx: 2px; --wy: -2px; --wr: 10deg; --d: 1.5s;"><use href="#lipid" x="420" y="140"/></g></g>
        <g class="lipid-single" style="--cx: 20px; --cy: 30px;"><g class="wobble" style="--wx: -3px; --wy: 3px; --wr: -15deg; --d: 1.7s;"><use href="#lipid" x="440" y="130" transform="rotate(45 440 130)"/></g></g>
        <g class="lipid-single" style="--cx: -20px; --cy: 20px;"><g class="wobble" style="--wx: 4px; --wy: 1px; --wr: 20deg; --d: 1.6s;"><use href="#lipid" x="480" y="140" transform="rotate(-30 480 140)"/></g></g>
        <g class="lipid-single" style="--cx: -40px; --cy: 0px;"><g class="wobble" style="--wx: -2px; --wy: -4px; --wr: -10deg; --d: 1.8s;"><use href="#lipid" x="500" y="160" transform="rotate(-90 500 160)"/></g></g>
        <g class="lipid-single" style="--cx: -30px; --cy: -20px;"><g class="wobble" style="--wx: 3px; --wy: 4px; --wr: 15deg; --d: 1.9s;"><use href="#lipid" x="490" y="180" transform="rotate(-135 490 180)"/></g></g>
        <g class="lipid-single" style="--cx: 10px; --cy: -30px;"><g class="wobble" style="--wx: -4px; --wy: -2px; --wr: -20deg; --d: 1.7s;"><use href="#lipid" x="450" y="190" transform="rotate(180 450 190)"/></g></g>
        <g class="lipid-single" style="--cx: 30px; --cy: -10px;"><g class="wobble" style="--wx: 2px; --wy: 5px; --wr: 10deg; --d: 1.6s;"><use href="#lipid" x="430" y="170" transform="rotate(135 430 170)"/></g></g>

        <!-- Lipid Vesicle -->
        <g class="lipid-vesicle" style="--dx: -40px; --dy: 70px;">
            <g class="wobble" style="--wx: -2px; --wy: 3px; --wr: -5deg; --d: 3s;">
                <use href="#vesicle" x="460" y="160"/>
            </g>
        </g>

        <!-- Dynamic Labels for Molecule Types -->
        <text x="310" y="130" font-size="10" fill="#98D8C8" font-weight="bold" class="text-fade">Proteins</text>
        <text x="490" y="125" font-size="10" fill="#2ECC71" font-weight="bold" class="text-fade">Polysaccharides</text>
        <text x="380" y="440" font-size="10" fill="#F39C12" font-weight="bold" class="text-fade">Amino Acids</text>
        <text x="430" y="455" font-size="10" fill="#4A90D9" font-weight="bold" class="text-fade">Nucleotides</text>

        <!-- Legend -->
        <g transform="translate(40, 340)">
            <rect x="0" y="0" width="165" height="135" rx="6" fill="#ffffff" stroke="#BDC3C7" stroke-width="1.5" opacity="0.9"/>
            <text x="15" y="20" font-size="13" font-weight="bold" fill="#2C3E50">Key</text>
            
            <!-- Proteins -->
            <path d="M15,35 Q20,30 25,35 T35,35" fill="none" stroke="#98D8C8" stroke-width="3"/>
            <text x="45" y="38" font-size="11" fill="#2C3E50">Proteins</text>
            
            <!-- Nucleic Acids -->
            <path d="M15,50 Q20,45 25,50 T35,50 M15,53 Q20,58 25,53 T35,53" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
            <text x="45" y="54" font-size="11" fill="#2C3E50">Nucleic Acids</text>
            
            <!-- Polysaccharides -->
            <use href="#sugar-green" x="20" y="68" transform="scale(0.8)"/>
            <line x1="18" y1="54.5" x2="22" y2="54.5" stroke="#2ECC71" stroke-width="1.5"/>
            <use href="#sugar-green" x="30" y="68" transform="scale(0.8)"/>
            <text x="45" y="70" font-size="11" fill="#2C3E50">Polysaccharides</text>
            
            <!-- Amino Acids & Sugars -->
            <circle cx="18" cy="85" r="3.5" fill="#F39C12"/>
            <use href="#sugar" x="30" y="85" transform="scale(0.8)"/>
            <text x="45" y="88" font-size="11" fill="#2C3E50">Amino Acids/Sugars</text>
            
            <!-- Nucleotides -->
            <use href="#nt" x="24" y="103" transform="scale(0.9)"/>
            <text x="45" y="106" font-size="11" fill="#2C3E50">Nucleotides</text>
            
            <!-- Lipids -->
            <use href="#lipid" x="24" y="120" transform="scale(0.9)"/>
            <text x="45" y="122" font-size="11" fill="#2C3E50">Lipids</text>
        </g>

    </svg>
</div>

</body>
</html>
