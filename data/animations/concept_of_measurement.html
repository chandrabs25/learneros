<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept of Measurement</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Animations */
        .fade-in-out { animation: fadeLoop 12s infinite; }
        
        /* Rod */
        .rod-anim { animation: rodAppear 12s infinite; }
        @keyframes rodAppear { 0%, 2% {opacity:0} 5%, 100% {opacity:1} }

        /* Slider U1 */
        .slider-u1 { animation: slide-u1 12s infinite; }
        @keyframes slide-u1 {
            0%, 14.9% { opacity: 0; transform: translateX(0); }
            15%, 31% { opacity: 1; transform: translateX(0); }
            32.5%, 36% { opacity: 1; transform: translateX(100px); }
            37.5%, 41% { opacity: 1; transform: translateX(200px); }
            42.5%, 46% { opacity: 1; transform: translateX(300px); }
            47.5%, 50.9% { opacity: 1; transform: translateX(400px); }
            51%, 100% { opacity: 0; transform: translateX(400px); }
        }

        /* Stamps U1 */
        .s-u1-1 { animation: a-u1-1 12s infinite; }
        .s-u1-2 { animation: a-u1-2 12s infinite; }
        .s-u1-3 { animation: a-u1-3 12s infinite; }
        .s-u1-4 { animation: a-u1-4 12s infinite; }
        .s-u1-5 { animation: a-u1-5 12s infinite; }
        @keyframes a-u1-1 { 0%, 32.4% { opacity: 0; } 32.5%, 100% { opacity: 1; } }
        @keyframes a-u1-2 { 0%, 37.4% { opacity: 0; } 37.5%, 100% { opacity: 1; } }
        @keyframes a-u1-3 { 0%, 42.4% { opacity: 0; } 42.5%, 100% { opacity: 1; } }
        @keyframes a-u1-4 { 0%, 47.4% { opacity: 0; } 47.5%, 100% { opacity: 1; } }
        @keyframes a-u1-5 { 0%, 50.9% { opacity: 0; } 51%, 100% { opacity: 1; } }

        /* Slider U2 */
        .slider-u2 { animation: slide-u2 12s infinite; }
        @keyframes slide-u2 {
            0%, 69.9% { opacity: 0; transform: translateX(0); }
            70%, 72% { opacity: 1; transform: translateX(0); }
            73%, 74% { opacity: 1; transform: translateX(50px); }
            75%, 76% { opacity: 1; transform: translateX(100px); }
            77%, 78% { opacity: 1; transform: translateX(150px); }
            79%, 80% { opacity: 1; transform: translateX(200px); }
            81%, 82% { opacity: 1; transform: translateX(250px); }
            83%, 84% { opacity: 1; transform: translateX(300px); }
            85%, 86% { opacity: 1; transform: translateX(350px); }
            87%, 88% { opacity: 1; transform: translateX(400px); }
            89%, 89.9% { opacity: 1; transform: translateX(450px); }
            90%, 100% { opacity: 0; transform: translateX(450px); }
        }

        /* Stamps U2 */
        .s-u2-1 { animation: a-u2-1 12s infinite; }
        .s-u2-2 { animation: a-u2-2 12s infinite; }
        .s-u2-3 { animation: a-u2-3 12s infinite; }
        .s-u2-4 { animation: a-u2-4 12s infinite; }
        .s-u2-5 { animation: a-u2-5 12s infinite; }
        .s-u2-6 { animation: a-u2-6 12s infinite; }
        .s-u2-7 { animation: a-u2-7 12s infinite; }
        .s-u2-8 { animation: a-u2-8 12s infinite; }
        .s-u2-9 { animation: a-u2-9 12s infinite; }
        .s-u2-10 { animation: a-u2-10 12s infinite; }
        @keyframes a-u2-1 { 0%, 72.9% { opacity: 0; } 73%, 100% { opacity: 1; } }
        @keyframes a-u2-2 { 0%, 74.9% { opacity: 0; } 75%, 100% { opacity: 1; } }
        @keyframes a-u2-3 { 0%, 76.9% { opacity: 0; } 77%, 100% { opacity: 1; } }
        @keyframes a-u2-4 { 0%, 78.9% { opacity: 0; } 79%, 100% { opacity: 1; } }
        @keyframes a-u2-5 { 0%, 80.9% { opacity: 0; } 81%, 100% { opacity: 1; } }
        @keyframes a-u2-6 { 0%, 82.9% { opacity: 0; } 83%, 100% { opacity: 1; } }
        @keyframes a-u2-7 { 0%, 84.9% { opacity: 0; } 85%, 100% { opacity: 1; } }
        @keyframes a-u2-8 { 0%, 86.9% { opacity: 0; } 87%, 100% { opacity: 1; } }
        @keyframes a-u2-9 { 0%, 88.9% { opacity: 0; } 89%, 100% { opacity: 1; } }
        @keyframes a-u2-10 { 0%, 89.9% { opacity: 0; } 90%, 100% { opacity: 1; } }

        /* Formulas */
        .form-base { animation: f-base 12s infinite; }
        .form-l1 { animation: f-l1 12s infinite; }
        .form-l2 { animation: f-l2 12s infinite; }
        .form-l3 { animation: f-l3 12s infinite; }
        @keyframes f-base { 0%, 4% {opacity:0} 5%, 52% {opacity:1} 53%, 100% {opacity:0} }
        @keyframes f-l1 { 0%, 52.9% {opacity:0} 53%, 98% {opacity:1} 99%, 100% {opacity:0} }
        @keyframes f-l2 { 0%, 89.9% {opacity:0} 90%, 98% {opacity:1} 99%, 100% {opacity:0} }
        @keyframes f-l3 { 0%, 91.9% {opacity:0} 92%, 98% {opacity:1} 99%, 100% {opacity:0} }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Concept of Measurement Animation</title>
        <desc>Animation showing a grey rod being measured by repeating a blue unit block five times, and then an orange block ten times to illustrate Q = nu and the inverse relationship between numerical value and unit size.</desc>

        <!-- Definitions -->
        <defs>
            <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
                <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#e9ecef" stroke-width="1"/>
            </pattern>
            <linearGradient id="rodGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#495057"/>
                <stop offset="100%" stop-color="#212529"/>
            </linearGradient>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7" />
            </marker>
            
            <!-- Unit Blocks -->
            <g id="u1-block">
                <rect width="100" height="30" fill="#4361EE" rx="4" stroke="#2b3a8c" stroke-width="2"/>
            </g>
            <g id="u2-block">
                <rect width="50" height="20" fill="#F77F00" rx="3" stroke="#a65500" stroke-width="2"/>
            </g>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Title & Legend -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="700" text-anchor="middle" fill="#212529">Concept of Measurement: Comparison with a Standard</text>
        
        <g transform="translate(40, 70)">
            <rect width="15" height="15" fill="#4361EE" rx="2" />
            <text x="25" y="12" font-family="Inter" font-size="14" fill="#495057">Standard Unit (u₁)</text>
            <rect x="160" width="15" height="15" fill="#F77F00" rx="2" />
            <text x="185" y="12" font-family="Inter" font-size="14" fill="#495057">Smaller Unit (u₂)</text>
        </g>

        <!-- Derived Unit Graphic (Top Right) -->
        <g transform="translate(640, 20)">
            <rect width="60" height="60" fill="#7209B7" fill-opacity="0.15" stroke="#7209B7" stroke-width="2"/>
            <line x1="0" y1="60" x2="60" y2="60" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow)"/>
            <line x1="0" y1="60" x2="0" y2="0" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow)"/>
            <text x="30" y="75" font-family="Inter" font-size="11" text-anchor="middle" fill="#7209B7">Length (L)</text>
            <text x="-10" y="30" font-family="Inter" font-size="11" text-anchor="middle" fill="#7209B7" transform="rotate(-90, -10, 30)">Length (L)</text>
            <text x="30" y="35" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle" fill="#7209B7">Area (L²)</text>
            <text x="30" y="-8" font-family="Inter" font-size="12" font-weight="700" text-anchor="middle" fill="#495057">Derived Unit</text>
        </g>

        <!-- Main Measurement Area -->
        <g class="rod-anim">
            <!-- Measurement Bounds -->
            <line x1="150" y1="110" x2="150" y2="240" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4"/>
            <line x1="650" y1="110" x2="650" y2="240" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4"/>
            <text x="150" y="100" font-family="Roboto Mono" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">0</text>
            <text x="650" y="100" font-family="Roboto Mono" font-size="16" font-weight="bold" text-anchor="middle" fill="#495057">Q</text>

            <!-- The Unknown Object (Rod) -->
            <rect x="150" y="120" width="500" height="40" fill="url(#rodGrad)" rx="4" stroke="#212529" stroke-width="2" />
            <text x="400" y="145" font-family="Inter" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">Physical Quantity (Q): Length</text>
        </g>

        <!-- U1 Stamps (Blue) -->
        <g class="s-u1-1">
            <use href="#u1-block" x="150" y="170" />
            <text x="200" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">1</text>
        </g>
        <g class="s-u1-2">
            <use href="#u1-block" x="250" y="170" />
            <text x="300" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">2</text>
        </g>
        <g class="s-u1-3">
            <use href="#u1-block" x="350" y="170" />
            <text x="400" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">3</text>
        </g>
        <g class="s-u1-4">
            <use href="#u1-block" x="450" y="170" />
            <text x="500" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">4</text>
        </g>
        <g class="s-u1-5">
            <use href="#u1-block" x="550" y="170" />
            <text x="600" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">5</text>
        </g>

        <!-- U1 Slider (Moving Block) -->
        <g class="slider-u1">
            <use href="#u1-block" x="150" y="170" filter="url(#glow)" />
            <text x="200" y="190" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="16">u₁</text>
        </g>

        <!-- U2 Stamps (Orange) -->
        <g class="s-u2-1"><use href="#u2-block" x="150" y="210" /><text x="175" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">1</text></g>
        <g class="s-u2-2"><use href="#u2-block" x="200" y="210" /><text x="225" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">2</text></g>
        <g class="s-u2-3"><use href="#u2-block" x="250" y="210" /><text x="275" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">3</text></g>
        <g class="s-u2-4"><use href="#u2-block" x="300" y="210" /><text x="325" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">4</text></g>
        <g class="s-u2-5"><use href="#u2-block" x="350" y="210" /><text x="375" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">5</text></g>
        <g class="s-u2-6"><use href="#u2-block" x="400" y="210" /><text x="425" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">6</text></g>
        <g class="s-u2-7"><use href="#u2-block" x="450" y="210" /><text x="475" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">7</text></g>
        <g class="s-u2-8"><use href="#u2-block" x="500" y="210" /><text x="525" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">8</text></g>
        <g class="s-u2-9"><use href="#u2-block" x="550" y="210" /><text x="575" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">9</text></g>
        <g class="s-u2-10"><use href="#u2-block" x="600" y="210" /><text x="625" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">10</text></g>

        <!-- U2 Slider (Moving Block) -->
        <g class="slider-u2">
            <use href="#u2-block" x="150" y="210" filter="url(#glow)" />
            <text x="175" y="225" fill="#ffffff" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" font-size="12">u₂</text>
        </g>

        <!-- Formula Box -->
        <rect x="150" y="340" width="500" height="130" fill="#ffffff" rx="8" stroke="#dee2e6" stroke-width="2" />
        
        <!-- Base Formula (0-52%) -->
        <g class="form-base">
            <text x="400" y="395" text-anchor="middle" font-family="Roboto Mono" font-size="26" font-weight="bold" fill="#212529">Q = n × u</text>
            <text x="400" y="430" text-anchor="middle" font-family="Inter" font-size="16" fill="#495057">Measurement is the ratio of the quantity to the unit</text>
        </g>

        <!-- Results & Conclusion (53-100%) -->
        <text x="400" y="375" text-anchor="middle" font-family="Roboto Mono" font-size="24" font-weight="bold" fill="#4361EE" class="form-l1">Q = 5 u₁</text>
        <text x="400" y="415" text-anchor="middle" font-family="Roboto Mono" font-size="24" font-weight="bold" fill="#F77F00" class="form-l2">Q = 10 u₂</text>
        <text x="400" y="455" text-anchor="middle" font-family="Roboto Mono" font-size="22" font-weight="bold" fill="#06D6A0" class="form-l3">5 u₁ = 10 u₂  ⇒  n ∝ 1/u</text>

    </svg>
</div>

</body>
</html>
