<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Benzene Paradox: Resonance and π-Electron Delocalization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 1000px;
            width: 100%;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #2b2b2b;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animation Classes */
        .benzene-group {
            transform-origin: 250px 260px;
            animation: benzeneTilt 12s infinite ease-in-out;
        }

        .kekule-a { animation: kekuleA 12s infinite ease-in-out; }
        .kekule-b { animation: kekuleB 12s infinite ease-in-out; }
        .arrows { animation: arrows 12s infinite ease-in-out; }
        .res-arrow { animation: resArrow 12s infinite ease-in-out; }
        .dashed-circle { animation: dashedCircle 12s infinite ease-in-out; }
        .p-orbitals { animation: pOrbitals 12s infinite ease-in-out; }
        .toroids { animation: toroids 12s infinite ease-in-out; }
        .energy-drop-line { animation: energyDrop 12s infinite ease-in-out; }
        .energy-drop-head { animation: arrowHeadDrop 12s infinite ease-in-out; }
        .energy-text { animation: energyText 12s infinite ease-in-out; }
        .hybrid-annotations { animation: hybridAnnotations 12s infinite ease-in-out; }
        .energy-level-high { animation: energyLevelHigh 12s infinite ease-in-out; }
        .energy-level-low { animation: energyLevelLow 12s infinite ease-in-out; }

        /* Keyframes */
        @keyframes kekuleA {
            0%, 12% { opacity: 1; }
            20%, 92% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes kekuleB {
            0%, 12% { opacity: 0; }
            20%, 33% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }
        @keyframes arrows {
            0%, 8% { opacity: 0; }
            12%, 20% { opacity: 1; }
            24%, 100% { opacity: 0; }
        }
        @keyframes resArrow {
            0%, 33% { opacity: 1; transform: scale(1); }
            40%, 100% { opacity: 0; transform: scale(0.8); }
        }
        @keyframes benzeneTilt {
            0%, 33% { transform: scaleY(1); }
            45%, 88% { transform: scaleY(0.55); }
            100% { transform: scaleY(1); }
        }
        @keyframes dashedCircle {
            0%, 35% { opacity: 0; }
            42%, 52% { opacity: 1; }
            58%, 100% { opacity: 0; }
        }
        @keyframes pOrbitals {
            0%, 45% { opacity: 0; }
            52%, 62% { opacity: 0.8; }
            68%, 100% { opacity: 0; }
        }
        @keyframes toroids {
            0%, 62% { opacity: 0; }
            68%, 88% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes energyDrop {
            0%, 70% { stroke-dashoffset: 140; opacity: 0; }
            71% { opacity: 1; stroke-dashoffset: 140; }
            78%, 92% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 140; opacity: 0; }
        }
        @keyframes arrowHeadDrop {
            0%, 70% { transform: translateY(0); opacity: 0; }
            71% { opacity: 1; transform: translateY(0); }
            78%, 92% { transform: translateY(140px); opacity: 1; }
            100% { transform: translateY(0); opacity: 0; }
        }
        @keyframes energyText {
            0%, 75% { opacity: 0; transform: translateY(-10px); }
            80%, 92% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes energyLevelHigh {
            0%, 70% { stroke: #FF4444; opacity: 1; }
            75%, 100% { stroke: #999; opacity: 0.4; }
        }
        @keyframes energyLevelLow {
            0%, 70% { stroke: #999; opacity: 0.4; }
            75%, 100% { stroke: #4444FF; opacity: 1; }
        }
        @keyframes hybridAnnotations {
            0%, 40% { opacity: 0; }
            48%, 88% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Resonance and Delocalization in Benzene</title>
        <desc>An animated diagram showing the transition from localized Kekulé structures to the delocalized pi-electron resonance hybrid of Benzene, including the corresponding drop in potential energy.</desc>

        <defs>
            <!-- Gradients for Atoms -->
            <radialGradient id="c-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777777"/>
                <stop offset="100%" stop-color="#404040"/>
            </radialGradient>
            <radialGradient id="h-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#CCCCCC"/>
            </radialGradient>

            <!-- Gradients for P-Orbitals -->
            <radialGradient id="p-grad-top" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#9d4edd"/>
                <stop offset="100%" stop-color="#7209B7"/>
            </radialGradient>
            <radialGradient id="p-grad-bot" cx="30%" cy="70%" r="70%">
                <stop offset="0%" stop-color="#5a0791"/>
                <stop offset="100%" stop-color="#3a045e"/>
            </radialGradient>

            <!-- Gradient for Toroids -->
            <linearGradient id="toroid-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7209B7" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#43056e" stop-opacity="0.4"/>
            </linearGradient>

            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrowhead Marker for Electron Flow -->
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
                <polygon points="0,1 10,5 0,9" fill="#F77F00" />
            </marker>
            
            <!-- Arrowhead Marker for Axis -->
            <marker id="axis-arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                <polygon points="0,10 5,0 10,10" fill="#2b2b2b" />
            </marker>
        </defs>

        <!-- Title Section -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700">Resonance and Delocalization in Benzene</text>
        <text x="400" y="65" text-anchor="middle" font-size="16" class="mono" fill="#555">C<tspan baseline-shift="sub" font-size="12">6</tspan>H<tspan baseline-shift="sub" font-size="12">6</tspan></text>

        <!-- Legend -->
        <g transform="translate(520, 460)">
            <rect x="0" y="0" width="12" height="12" rx="2" fill="#404040" />
            <text x="18" y="10" font-size="12" fill="#555">Carbon</text>
            
            <rect x="75" y="0" width="12" height="12" rx="2" fill="#CCCCCC" />
            <text x="93" y="10" font-size="12" fill="#555">Hydrogen</text>
            
            <rect x="165" y="0" width="12" height="12" rx="2" fill="#7209B7" opacity="0.6" />
            <text x="183" y="10" font-size="12" fill="#555">π-Electrons</text>
        </g>

        <!-- Energy Diagram (Right Side) -->
        <g transform="translate(0, 0)">
            <!-- Axis -->
            <line x1="550" y1="420" x2="550" y2="120" stroke="#2b2b2b" stroke-width="2" marker-end="url(#axis-arrow)" />
            <text x="550" y="100" text-anchor="middle" font-size="14" font-weight="600">Energy (E)</text>

            <!-- Energy Levels -->
            <line class="energy-level-high" x1="530" y1="180" x2="650" y2="180" stroke-width="3" />
            <text x="660" y="185" font-size="14" font-weight="600" fill="#FF4444" class="energy-level-high">Theoretical Kekulé</text>

            <line class="energy-level-low" x1="530" y1="320" x2="650" y2="320" stroke-width="3" />
            <text x="660" y="325" font-size="14" font-weight="600" fill="#4444FF" class="energy-level-low">Resonance Hybrid</text>

            <!-- Energy Drop Animation -->
            <line class="energy-drop-line" x1="610" y1="180" x2="610" y2="310" stroke="#44CC44" stroke-width="4" stroke-dasharray="140" />
            <g class="energy-drop-head" transform="translate(610, 180)">
                <polygon points="-6,-2 6,-2 0,8" fill="#44CC44" />
            </g>
            
            <text class="energy-text" x="610" y="255" text-anchor="middle" font-size="14" font-weight="700" fill="#44CC44">Resonance Energy: 152 kJ/mol</text>
        </g>

        <!-- Benzene Molecule (Left/Center) -->
        <!-- The entire group tilts to simulate 3D perspective -->
        <g class="benzene-group">
            
            <!-- Bottom Toroid (Drawn first to be behind atoms) -->
            <circle class="toroids" cx="250" cy="260" r="72" stroke="url(#toroid-grad)" stroke-width="24" fill="none" transform="translate(0, 60)" opacity="0.3" filter="url(#glow)" />

            <!-- P-Orbitals (Bottom Lobes) -->
            <g class="p-orbitals">
                <ellipse cx="250" cy="216" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C1 -->
                <ellipse cx="319.3" cy="256" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C2 -->
                <ellipse cx="319.3" cy="336" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C3 -->
                <ellipse cx="250" cy="376" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C4 -->
                <ellipse cx="180.7" cy="336" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C5 -->
                <ellipse cx="180.7" cy="256" rx="12" ry="36" fill="url(#p-grad-bot)" /> <!-- C6 -->
            </g>

            <!-- Sigma Bonds (C-C and C-H) -->
            <g stroke="#333333" stroke-width="4" stroke-linecap="round">
                <!-- C-C Bonds -->
                <line x1="250" y1="180" x2="319.3" y2="220" />
                <line x1="319.3" y1="220" x2="319.3" y2="300" />
                <line x1="319.3" y1="300" x2="250" y2="340" />
                <line x1="250" y1="340" x2="180.7" y2="300" />
                <line x1="180.7" y1="300" x2="180.7" y2="220" />
                <line x1="180.7" y1="220" x2="250" y2="180" />
                <!-- C-H Bonds -->
                <line x1="250" y1="180" x2="250" y2="130" />
                <line x1="319.3" y1="220" x2="362.6" y2="195" />
                <line x1="319.3" y1="300" x2="362.6" y2="325" />
                <line x1="250" y1="340" x2="250" y2="390" />
                <line x1="180.7" y1="300" x2="137.4" y2="325" />
                <line x1="180.7" y1="220" x2="137.4" y2="195" />
            </g>

            <!-- Pi Bonds (Kekulé A) -->
            <g class="kekule-a" stroke="#555555" stroke-width="4" stroke-linecap="round">
                <line x1="250" y1="196" x2="305.4" y2="228" />
                <line x1="305.4" y1="292" x2="250" y2="324" />
                <line x1="194.6" y1="292" x2="194.6" y2="228" />
            </g>

            <!-- Pi Bonds (Kekulé B) -->
            <g class="kekule-b" stroke="#555555" stroke-width="4" stroke-linecap="round">
                <line x1="305.4" y1="228" x2="305.4" y2="292" />
                <line x1="250" y1="324" x2="194.6" y2="292" />
                <line x1="194.6" y1="228" x2="250" y2="196" />
            </g>

            <!-- Dashed Circle (Hybrid Transition) -->
            <circle class="dashed-circle" cx="250" cy="260" r="64" stroke="#7209B7" stroke-width="4" stroke-dasharray="10,8" fill="none" />

            <!-- Atoms -->
            <g>
                <!-- Hydrogens -->
                <circle cx="250" cy="130" r="9" fill="url(#h-grad)" />
                <circle cx="362.6" cy="195" r="9" fill="url(#h-grad)" />
                <circle cx="362.6" cy="325" r="9" fill="url(#h-grad)" />
                <circle cx="250" cy="390" r="9" fill="url(#h-grad)" />
                <circle cx="137.4" cy="325" r="9" fill="url(#h-grad)" />
                <circle cx="137.4" cy="195" r="9" fill="url(#h-grad)" />

                <!-- Carbons -->
                <circle cx="250" cy="180" r="14" fill="url(#c-grad)" />
                <circle cx="319.3" cy="220" r="14" fill="url(#c-grad)" />
                <circle cx="319.3" cy="300" r="14" fill="url(#c-grad)" />
                <circle cx="250" cy="340" r="14" fill="url(#c-grad)" />
                <circle cx="180.7" cy="300" r="14" fill="url(#c-grad)" />
                <circle cx="180.7" cy="220" r="14" fill="url(#c-grad)" />
            </g>

            <!-- P-Orbitals (Top Lobes) -->
            <g class="p-orbitals">
                <ellipse cx="250" cy="144" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C1 -->
                <ellipse cx="319.3" cy="184" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C2 -->
                <ellipse cx="319.3" cy="264" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C3 -->
                <ellipse cx="250" cy="304" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C4 -->
                <ellipse cx="180.7" cy="264" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C5 -->
                <ellipse cx="180.7" cy="184" rx="12" ry="36" fill="url(#p-grad-top)" /> <!-- C6 -->
            </g>

            <!-- Top Toroid (Drawn last to be in front) -->
            <circle class="toroids" cx="250" cy="260" r="72" stroke="url(#toroid-grad)" stroke-width="24" fill="none" transform="translate(0, -60)" opacity="0.7" filter="url(#glow)" />

            <!-- Curly Arrows for Electron Flow -->
            <g class="arrows" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)">
                <path d="M 275 216.7 A 50 50 0 0 1 299.2 251.3" />
                <path d="M 275 303.3 A 50 50 0 0 1 232.9 307.0" />
                <path d="M 200 260 A 50 50 0 0 1 217.9 221.7" />
            </g>

            <!-- Resonance Arrow (Visible during flip) -->
            <text class="res-arrow" x="250" y="275" font-size="48" fill="#7209B7" text-anchor="middle" font-weight="bold">↔</text>

        </g> <!-- End Benzene Group -->

        <!-- Annotations (Outside the tilted group to remain legible) -->
        <g class="hybrid-annotations">
            <!-- Bond Length -->
            <line x1="284.6" y1="227" x2="380" y2="150" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4" />
            <circle cx="284.6" cy="227" r="3" fill="#555" />
            <text x="385" y="145" font-size="13" font-weight="600" fill="#2b2b2b">139 pm (Intermediate)</text>

            <!-- Hybridization -->
            <line x1="180.7" y1="238" x2="100" y2="180" stroke="#555" stroke-width="1.5" stroke-dasharray="4,4" />
            <circle cx="180.7" cy="238" r="3" fill="#555" />
            <text x="95" y="175" text-anchor="end" font-size="13" font-weight="600" fill="#2b2b2b">sp² hybridized, 120°</text>

            <!-- Electron Cloud Label -->
            <line x1="250" y1="300" x2="250" y2="420" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4,4" />
            <text x="250" y="440" text-anchor="middle" font-size="14" font-weight="600" fill="#7209B7">Delocalized π-electron cloud (6 e⁻)</text>
        </g>

        <!-- Formula at Bottom -->
        <text x="250" y="480" font-family="Roboto Mono" font-size="18" font-weight="700" text-anchor="middle" fill="#2b2b2b">
            C<tspan baseline-shift="sub" font-size="12">6</tspan>H<tspan baseline-shift="sub" font-size="12">6</tspan> ↔ C<tspan baseline-shift="sub" font-size="12">6</tspan>H<tspan baseline-shift="sub" font-size="12">6</tspan>
        </text>

    </svg>
</body>
</html>
