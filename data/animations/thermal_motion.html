<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermal Motion: Kinetic Theory & Paramagnetism</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            max-width: 100%;
            height: auto;
        }

        .main-title {
            font-size: 22px;
            font-weight: 700;
            fill: #212529;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 600;
            fill: #343a40;
        }

        .panel-subtitle {
            font-size: 13px;
            font-weight: 400;
            fill: #6c757d;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            fill: #212529;
        }

        .legend-text {
            font-size: 12px;
            fill: #495057;
        }

        /* Animations */
        .particle-group {
            animation: move-particle 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .velocity-vector {
            animation: rotate-velocity 12s step-end infinite;
        }

        .reveal-path-1 { animation: reveal-1 12s linear infinite; }
        .reveal-path-2 { animation: reveal-2 12s linear infinite; }
        .reveal-path-3 { animation: reveal-3 12s linear infinite; }
        .reveal-path-4 { animation: reveal-4 12s linear infinite; }

        .cylinder-anim {
            animation: show-cylinder 12s ease-in-out infinite;
        }

        .b-field-anim {
            animation: show-bfield 12s ease-in-out infinite;
        }

        .num-0 { animation: counter-0 12s step-end infinite; }
        .num-1 { animation: counter-1 12s step-end infinite; }
        .num-2 { animation: counter-2 12s step-end infinite; }
        .num-3 { animation: counter-3 12s step-end infinite; }

        .dipole-1 { animation: jiggle-1 12s linear infinite; }
        .dipole-2 { animation: jiggle-2 12s linear infinite; }
        .dipole-3 { animation: jiggle-3 12s linear infinite; }
        .dipole-4 { animation: jiggle-4 12s linear infinite; }

        /* Keyframes for Left Panel (Kinetic Theory) */
        @keyframes move-particle {
            0% { transform: translate(80px, 150px); }
            20.83% { transform: translate(140px, 310px); }
            41.66% { transform: translate(280px, 350px); }
            58.33% { transform: translate(280px, 350px); } /* Pause for cross-section */
            79.16% { transform: translate(340px, 210px); }
            100% { transform: translate(80px, 150px); }
        }

        @keyframes rotate-velocity {
            0% { transform: rotate(69.4deg); opacity: 1; }
            20.83% { transform: rotate(15.9deg); opacity: 1; }
            41.66% { transform: rotate(15.9deg); opacity: 0; }
            58.33% { transform: rotate(-66.8deg); opacity: 1; }
            79.16% { transform: rotate(-167deg); opacity: 1; }
            100% { transform: rotate(69.4deg); opacity: 1; }
        }

        @keyframes reveal-1 {
            0% { stroke-dashoffset: 0; }
            20.83%, 99.99% { stroke-dashoffset: -171; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes reveal-2 {
            0%, 20.82% { stroke-dashoffset: 0; }
            41.66%, 99.99% { stroke-dashoffset: -146; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes reveal-3 {
            0%, 58.32% { stroke-dashoffset: 0; }
            79.16%, 99.99% { stroke-dashoffset: -153; }
            100% { stroke-dashoffset: 0; }
        }
        @keyframes reveal-4 {
            0%, 79.15% { stroke-dashoffset: 0; }
            99.99% { stroke-dashoffset: -267; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes show-cylinder {
            0%, 41.65% { opacity: 0; }
            45%, 55% { opacity: 1; }
            58.33%, 100% { opacity: 0; }
        }

        @keyframes counter-0 {
            0%, 20.82% { opacity: 1; }
            20.83%, 99.99% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes counter-1 {
            0%, 20.82% { opacity: 0; }
            20.83%, 41.65% { opacity: 1; }
            41.66%, 100% { opacity: 0; }
        }
        @keyframes counter-2 {
            0%, 41.65% { opacity: 0; }
            41.66%, 79.15% { opacity: 1; }
            79.16%, 100% { opacity: 0; }
        }
        @keyframes counter-3 {
            0%, 79.15% { opacity: 0; }
            79.16%, 99.99% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Keyframes for Right Panel (Paramagnetism) */
        @keyframes show-bfield {
            0%, 50% { opacity: 0; }
            58.33%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes jiggle-1 {
            0% { transform: rotate(12deg); }
            10% { transform: rotate(145deg); }
            20% { transform: rotate(270deg); }
            30% { transform: rotate(80deg); }
            40% { transform: rotate(310deg); }
            50% { transform: rotate(190deg); }
            58.33% { transform: rotate(15deg); } /* B-field ON */
            65% { transform: rotate(-10deg); }
            75% { transform: rotate(18deg); }
            85% { transform: rotate(-5deg); }
            95% { transform: rotate(12deg); }
            100% { transform: rotate(12deg); }
        }

        @keyframes jiggle-2 {
            0% { transform: rotate(250deg); }
            10% { transform: rotate(30deg); }
            20% { transform: rotate(190deg); }
            30% { transform: rotate(340deg); }
            40% { transform: rotate(110deg); }
            50% { transform: rotate(50deg); }
            58.33% { transform: rotate(-12deg); } /* B-field ON */
            65% { transform: rotate(8deg); }
            75% { transform: rotate(-15deg); }
            85% { transform: rotate(10deg); }
            95% { transform: rotate(-8deg); }
            100% { transform: rotate(250deg); }
        }

        @keyframes jiggle-3 {
            0% { transform: rotate(80deg); }
            10% { transform: rotate(290deg); }
            20% { transform: rotate(15deg); }
            30% { transform: rotate(210deg); }
            40% { transform: rotate(75deg); }
            50% { transform: rotate(330deg); }
            58.33% { transform: rotate(5deg); } /* B-field ON */
            65% { transform: rotate(-18deg); }
            75% { transform: rotate(10deg); }
            85% { transform: rotate(-12deg); }
            95% { transform: rotate(15deg); }
            100% { transform: rotate(80deg); }
        }

        @keyframes jiggle-4 {
            0% { transform: rotate(170deg); }
            10% { transform: rotate(90deg); }
            20% { transform: rotate(310deg); }
            30% { transform: rotate(130deg); }
            40% { transform: rotate(250deg); }
            50% { transform: rotate(20deg); }
            58.33% { transform: rotate(-20deg); } /* B-field ON */
            65% { transform: rotate(15deg); }
            75% { transform: rotate(-5deg); }
            85% { transform: rotate(18deg); }
            95% { transform: rotate(-10deg); }
            100% { transform: rotate(170deg); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Thermal Motion: Kinetic Theory & Paramagnetism</title>
    <desc>An animation showing the mean free path of a gas particle on the left, and the thermal agitation versus magnetic alignment of dipoles on the right.</desc>

    <!-- Definitions for Markers -->
    <defs>
        <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 10 5 L 0 8 z" fill="#06D6A0" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 2 L 10 5 L 0 8 z" fill="#7209B7" />
        </marker>
    </defs>

    <!-- Main Title -->
    <text x="400" y="35" text-anchor="middle" class="main-title">Thermal Motion: Kinetic Theory &amp; Paramagnetism</text>

    <!-- ========================================== -->
    <!-- LEFT PANEL: Gas Kinetic Theory             -->
    <!-- ========================================== -->
    <rect x="20" y="60" width="360" height="380" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <text x="200" y="85" text-anchor="middle" class="panel-title">Gas Kinetic Theory</text>
    <text x="200" y="105" text-anchor="middle" class="panel-subtitle">Mean Free Path</text>

    <!-- Collision Counter -->
    <text x="310" y="85" class="math-text" font-size="12px" fill="#495057">Collisions: </text>
    <text x="370" y="85" class="math-text num-0" font-size="12px" fill="#FF3366" font-weight="bold">0</text>
    <text x="370" y="85" class="math-text num-1" font-size="12px" fill="#FF3366" font-weight="bold">1</text>
    <text x="370" y="85" class="math-text num-2" font-size="12px" fill="#FF3366" font-weight="bold">2</text>
    <text x="370" y="85" class="math-text num-3" font-size="12px" fill="#FF3366" font-weight="bold">3</text>

    <!-- Background Gas Particles (Blue) -->
    <g fill="#4361EE" opacity="0.6">
        <!-- Path Vertices -->
        <circle cx="80" cy="150" r="4"/>
        <circle cx="140" cy="310" r="4"/>
        <circle cx="280" cy="350" r="4"/>
        <circle cx="340" cy="210" r="4"/>
        <!-- Scattered Particles -->
        <circle cx="60" cy="220" r="4"/>
        <circle cx="100" cy="380" r="4"/>
        <circle cx="180" cy="120" r="4"/>
        <circle cx="220" cy="260" r="4"/>
        <circle cx="320" cy="100" r="4"/>
        <circle cx="360" cy="320" r="4"/>
        <circle cx="250" cy="180" r="4"/>
        <circle cx="120" cy="180" r="4"/>
        <circle cx="200" cy="320" r="4"/>
        <circle cx="300" cy="280" r="4"/>
        <circle cx="160" cy="240" r="4"/>
        <circle cx="240" cy="100" r="4"/>
    </g>

    <!-- Dashed Path (Base) -->
    <path d="M 80 150 L 140 310 L 280 350 L 340 210 Z" fill="none" stroke="#6c757d" stroke-width="2" stroke-dasharray="5, 5"/>

    <!-- Path Revealers (White covers that move away to reveal dashes) -->
    <path d="M 80 150 L 140 310" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="171" stroke-dashoffset="0" class="reveal-path-1"/>
    <path d="M 140 310 L 280 350" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="146" stroke-dashoffset="0" class="reveal-path-2"/>
    <path d="M 280 350 L 340 210" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="153" stroke-dashoffset="0" class="reveal-path-3"/>
    <path d="M 340 210 L 80 150" fill="none" stroke="#ffffff" stroke-width="4" stroke-dasharray="267" stroke-dashoffset="0" class="reveal-path-4"/>

    <!-- Collision Cylinder Highlight -->
    <g class="cylinder-anim">
        <polygon points="135.9,324.4 275.9,364.4 284.1,335.6 144.1,295.6" fill="#00B4D8" opacity="0.3"/>
        <text x="210" y="385" text-anchor="middle" class="math-text" fill="#0077b6" font-weight="bold" font-size="12px">σ = πd²</text>
    </g>

    <!-- Moving Test Particle (Red) -->
    <g class="particle-group">
        <circle r="6" fill="#FF3366"/>
        <!-- Velocity Vector -->
        <g class="velocity-vector">
            <line x1="0" y1="0" x2="25" y2="0" stroke="#06D6A0" stroke-width="2" marker-end="url(#arrow-green)"/>
            <text x="12" y="-8" class="math-text" fill="#06D6A0" font-size="12px" font-weight="bold">v</text>
            <path d="M 12 -18 L 18 -18 L 16 -20 M 18 -18 L 16 -16" stroke="#06D6A0" fill="none" stroke-width="1.5"/>
        </g>
    </g>

    <!-- Mean Free Path Formula -->
    <g transform="translate(200, 405)">
        <text x="-25" y="5" class="math-text">λ = </text>
        <text x="35" y="-5" class="math-text" text-anchor="middle">1</text>
        <line x1="0" y1="0" x2="70" y2="0" stroke="#212529" stroke-width="1"/>
        <text x="35" y="15" class="math-text" text-anchor="middle">√2 n π d²</text>
    </g>


    <!-- ========================================== -->
    <!-- RIGHT PANEL: Paramagnetism                 -->
    <!-- ========================================== -->
    <rect x="420" y="60" width="360" height="380" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
    <text x="600" y="85" text-anchor="middle" class="panel-title">Paramagnetism</text>
    <text x="600" y="105" text-anchor="middle" class="panel-subtitle">Thermal Agitation</text>

    <!-- Magnetic Field Lines (Purple) -->
    <g class="b-field-anim">
        <line x1="440" y1="160" x2="760" y2="160" stroke="#7209B7" stroke-width="2" opacity="0.4" marker-end="url(#arrow-purple)"/>
        <line x1="440" y1="230" x2="760" y2="230" stroke="#7209B7" stroke-width="2" opacity="0.4" marker-end="url(#arrow-purple)"/>
        <line x1="440" y1="300" x2="760" y2="300" stroke="#7209B7" stroke-width="2" opacity="0.4" marker-end="url(#arrow-purple)"/>
        <line x1="440" y1="370" x2="760" y2="370" stroke="#7209B7" stroke-width="2" opacity="0.4" marker-end="url(#arrow-purple)"/>
        
        <!-- B-Field Status Text -->
        <rect x="480" y="215" width="240" height="30" fill="#ffffff" opacity="0.85" rx="5"/>
        <text x="600" y="235" text-anchor="middle" class="math-text" fill="#7209B7" font-weight="bold" font-size="13px">Magnetic Field Applied</text>
    </g>

    <!-- Dipole Grid (4x4) -->
    <!-- Row 1 -->
    <g transform="translate(480, 160)"><g class="dipole-1"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(560, 160)"><g class="dipole-2"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(640, 160)"><g class="dipole-3"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(720, 160)"><g class="dipole-4"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>

    <!-- Row 2 -->
    <g transform="translate(480, 230)"><g class="dipole-3"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(560, 230)"><g class="dipole-4"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(640, 230)"><g class="dipole-1"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(720, 230)"><g class="dipole-2"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>

    <!-- Row 3 -->
    <g transform="translate(480, 300)"><g class="dipole-2"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(560, 300)"><g class="dipole-1"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(640, 300)"><g class="dipole-4"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(720, 300)"><g class="dipole-3"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>

    <!-- Row 4 -->
    <g transform="translate(480, 370)"><g class="dipole-4"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(560, 370)"><g class="dipole-3"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(640, 370)"><g class="dipole-2"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>
    <g transform="translate(720, 370)"><g class="dipole-1"><polygon points="-12,-3 4,-3 4,-7 12,0 4,7 4,3 -12,3" fill="#343a40"/></g></g>

    <!-- Energy Formula -->
    <g transform="translate(600, 415)">
        <text text-anchor="middle" class="math-text">U = -m · B</text>
        <!-- Vector over m -->
        <path d="M 2 -12 L 10 -12 L 8 -15 M 10 -12 L 8 -9" stroke="#212529" fill="none" stroke-width="1"/>
        <!-- Vector over B -->
        <path d="M 24 -12 L 32 -12 L 30 -15 M 32 -12 L 30 -9" stroke="#212529" fill="none" stroke-width="1"/>
    </g>


    <!-- ========================================== -->
    <!-- LEGEND                                     -->
    <!-- ========================================== -->
    <g transform="translate(0, 475)">
        <circle cx="100" cy="0" r="5" fill="#FF3366"/>
        <text x="110" y="4" class="legend-text">Test Particle</text>

        <circle cx="220" cy="0" r="5" fill="#4361EE" opacity="0.6"/>
        <text x="230" y="4" class="legend-text">Gas Molecule</text>

        <line x1="450" y1="0" x2="470" y2="0" stroke="#7209B7" stroke-width="2" marker-end="url(#arrow-purple)"/>
        <text x="480" y="4" class="legend-text">Magnetic Field (B)</text>

        <polygon points="620,-2 630,-2 630,-4 635,0 630,4 630,2 620,2" fill="#343a40"/>
        <text x="645" y="4" class="legend-text">Dipole Moment (m)</text>
    </g>

</svg>

</body>
</html>
