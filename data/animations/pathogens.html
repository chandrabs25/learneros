<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathogenesis of Typhoid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@1&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
        }
        
        /* Main Infection Animation */
        @keyframes invade {
            0% { transform: translate(100px, -50px) rotate(20deg); opacity: 0; }
            5% { opacity: 1; }
            25% { transform: translate(250px, 150px) rotate(45deg); }
            35% { transform: translate(370px, 275px) rotate(90deg); }
            45% { transform: translate(370px, 275px) rotate(90deg); }
            55% { transform: translate(430px, 275px) rotate(90deg); }
            65% { transform: translate(460px, 285px) rotate(135deg); }
            75% { transform: translate(487px, 300px) rotate(90deg); }
            90% { transform: translate(487px, 550px) rotate(90deg); opacity: 1; }
            95% { transform: translate(487px, 560px) rotate(90deg); opacity: 0; }
            100% { transform: translate(100px, -50px) rotate(20deg); opacity: 0; }
        }
        #invader {
            animation: invade 12s linear infinite;
        }

        /* Background Bacteria Animations */
        @keyframes float1 {
            0% { transform: translate(80px, -50px) rotate(10deg); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translate(120px, 550px) rotate(30deg); opacity: 0; }
        }
        @keyframes float2 {
            0% { transform: translate(180px, -100px) rotate(-15deg); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translate(220px, 550px) rotate(-45deg); opacity: 0; }
        }
        #bact1 { animation: float1 10s linear infinite; }
        #bact2 { animation: float2 14s linear infinite; animation-delay: -3s; }

        /* Food Particles Animation */
        @keyframes floatFood {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(550px) rotate(180deg); opacity: 0; }
        }
        .food-particle { animation: floatFood 12s linear infinite; }
        .food-delay-1 { animation-delay: -2s; }
        .food-delay-2 { animation-delay: -7s; }
        .food-delay-3 { animation-delay: -10s; }

        /* Blood Flow Animations */
        @keyframes flowUp {
            0% { transform: translateY(550px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(200px); opacity: 0; }
        }
        @keyframes flowDown {
            0% { transform: translateY(200px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(550px); opacity: 0; }
        }
        .rbc-up { animation: flowUp 3s linear infinite; }
        .rbc-down { animation: flowDown 3s linear infinite; }
        .delay-1 { animation-delay: -1s; }
        .delay-2 { animation-delay: -2s; }

        /* Process Labels Sync */
        .step-bg { fill: #E8F4FD; opacity: 0; stroke: #4A90D9; stroke-width: 2; }
        .step-text { font-family: 'Inter', sans-serif; font-size: 14px; fill: #2C3E50; opacity: 0.4; transition: all 0.3s; }
        
        @keyframes bg1 { 0%, 25% { opacity: 1; } 26%, 100% { opacity: 0; } }
        @keyframes txt1 { 0%, 25% { opacity: 1; fill: #E74C3C; font-weight: 600; } 26%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } }
        
        @keyframes bg2 { 0%, 24% { opacity: 0; } 25%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        @keyframes txt2 { 0%, 24% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } 25%, 50% { opacity: 1; fill: #E74C3C; font-weight: 600; } 51%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } }
        
        @keyframes bg3 { 0%, 49% { opacity: 0; } 50%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
        @keyframes txt3 { 0%, 49% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } 50%, 75% { opacity: 1; fill: #E74C3C; font-weight: 600; } 76%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } }
        
        @keyframes bg4 { 0%, 74% { opacity: 0; } 75%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
        @keyframes txt4 { 0%, 74% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } 75%, 95% { opacity: 1; fill: #E74C3C; font-weight: 600; } 96%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; } }

        #bg-step1 { animation: bg1 12s infinite; }
        #txt-step1 { animation: txt1 12s infinite; }
        #bg-step2 { animation: bg2 12s infinite; }
        #txt-step2 { animation: txt2 12s infinite; }
        #bg-step3 { animation: bg3 12s infinite; }
        #txt-step3 { animation: txt3 12s infinite; }
        #bg-step4 { animation: bg4 12s infinite; }
        #txt-step4 { animation: txt4 12s infinite; }

        .static-label { font-family: 'Inter', sans-serif; font-size: 13px; fill: #2C3E50; font-weight: 600; }
        .pointer-line { stroke: #2C3E50; stroke-width: 1.5; stroke-dasharray: 4; fill: none; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Pathogenesis of Typhoid Fever</title>
    <desc id="svg-desc">An animated diagram showing Salmonella typhi bacteria entering the intestinal lumen, invading the epithelial cells of the villi, and migrating into the capillary bloodstream.</desc>

    <!-- Definitions -->
    <defs>
        <!-- Capillary Gradient (Arterial Red to Venous Blue) -->
        <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#E74C3C" />
            <stop offset="40%" stop-color="#E74C3C" />
            <stop offset="60%" stop-color="#3498DB" />
            <stop offset="100%" stop-color="#3498DB" />
        </linearGradient>

        <!-- Bacterium Symbol -->
        <g id="salmonella">
            <!-- Flagella -->
            <path d="M -6,-10 Q -15,-15 -12,-20" fill="none" stroke="#27AE60" stroke-width="1"/>
            <path d="M 6,-10 Q 15,-15 12,-20" fill="none" stroke="#27AE60" stroke-width="1"/>
            <path d="M -6,10 Q -15,15 -12,20" fill="none" stroke="#27AE60" stroke-width="1"/>
            <path d="M 6,10 Q 15,15 12,20" fill="none" stroke="#27AE60" stroke-width="1"/>
            <path d="M -6,0 Q -15,-2 -18,0" fill="none" stroke="#27AE60" stroke-width="1"/>
            <path d="M 6,0 Q 15,-2 18,0" fill="none" stroke="#27AE60" stroke-width="1"/>
            <!-- Cell Body -->
            <rect x="-6" y="-14" width="12" height="28" rx="6" fill="#27AE60" stroke="#1E8449" stroke-width="1.5"/>
            <!-- DNA / Nucleoid -->
            <path d="M -2,-6 Q 3,-3 -2,0 T 2,6" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
        </g>

        <!-- Food Particle Symbol -->
        <g id="food">
            <path d="M0,0 l6,-3 l4,5 l-6,4 Z" fill="#8B7355" opacity="0.8"/>
            <path d="M2,1 l3,-1 l1,2 l-3,1 Z" fill="#5C4A3D" opacity="0.6"/>
        </g>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa"/>

    <!-- ========================================== -->
    <!-- LAYER 1: TISSUE & EPITHELIUM               -->
    <!-- ========================================== -->
    
    <!-- Lamina Propria (Inner Tissue Core) -->
    <path d="M 420,500 L 420,150 A 80,80 0 0,1 580,150 L 580,500 Z" fill="#F39C12" opacity="0.25"/>

    <!-- Macrophage (Immune Cell) -->
    <g transform="translate(445, 320)">
        <path d="M 0,0 Q 15,-10 25,5 T 20,30 Q -5,40 -10,20 Z" fill="#98D8C8" stroke="#76C0A9" stroke-width="2"/>
        <!-- Macrophage Nucleus -->
        <ellipse cx="8" cy="15" rx="6" ry="4" fill="#2C3E50" transform="rotate(30 8 15)"/>
        <!-- Phagosome / Digested Debris -->
        <circle cx="18" cy="22" r="3" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
        <circle cx="18" cy="22" r="1" fill="#27AE60"/>
    </g>

    <!-- Epithelial Layer (Columnar Cells) -->
    <path d="M 380,500 L 380,150 A 120,120 0 0,1 620,150 L 620,500 L 580,500 L 580,150 A 80,80 0 0,0 420,150 L 420,500 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
    
    <!-- Columnar Cell Dividers & Nuclei -->
    <g stroke="#4A90D9" stroke-width="1.5">
        <!-- Left Side -->
        <line x1="380" y1="450" x2="420" y2="450"/> <ellipse cx="410" cy="475" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="400" x2="420" y2="400"/> <ellipse cx="410" cy="425" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="350" x2="420" y2="350"/> <ellipse cx="410" cy="375" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="300" x2="420" y2="300"/> <ellipse cx="410" cy="325" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="250" x2="420" y2="250"/> <ellipse cx="410" cy="275" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="200" x2="420" y2="200"/> <ellipse cx="410" cy="225" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="380" y1="150" x2="420" y2="150"/> <ellipse cx="410" cy="175" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        
        <!-- Arc (Calculated approximate positions) -->
        <line x1="396" y1="90" x2="430.7" y2="110"/> <ellipse cx="420" cy="130" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(30 420 130)"/>
        <line x1="440" y1="46" x2="460" y2="80.7"/> <ellipse cx="445" cy="95" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(60 445 95)"/>
        <line x1="500" y1="30" x2="500" y2="70"/> <ellipse cx="480" cy="75" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(75 480 75)"/>
        <line x1="560" y1="46" x2="540" y2="80.7"/> <ellipse cx="520" cy="75" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(105 520 75)"/>
        <line x1="604" y1="90" x2="569.3" y2="110"/> <ellipse cx="555" cy="95" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(120 555 95)"/>
        <line x1="620" y1="150" x2="580" y2="150"/> <ellipse cx="580" cy="130" rx="4" ry="7" fill="#2C3E50" stroke="none" transform="rotate(150 580 130)"/>
        
        <!-- Right Side -->
        <line x1="580" y1="200" x2="620" y2="200"/> <ellipse cx="590" cy="175" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="580" y1="250" x2="620" y2="250"/> <ellipse cx="590" cy="225" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="580" y1="300" x2="620" y2="300"/> <ellipse cx="590" cy="275" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="580" y1="350" x2="620" y2="350"/> <ellipse cx="590" cy="325" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="580" y1="400" x2="620" y2="400"/> <ellipse cx="590" cy="375" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
        <line x1="580" y1="450" x2="620" y2="450"/> <ellipse cx="590" cy="425" rx="4" ry="7" fill="#2C3E50" stroke="none"/>
    </g>

    <!-- ========================================== -->
    <!-- LAYER 2: LUMEN CONTENTS & MAIN BACTERIUM   -->
    <!-- ========================================== -->

    <!-- Background Bacteria -->
    <use href="#salmonella" id="bact1"/>
    <use href="#salmonella" id="bact2"/>

    <!-- Food Particles -->
    <g class="food-particle"><use href="#food" x="100" y="0"/></g>
    <g class="food-particle food-delay-1"><use href="#food" x="160" y="0" transform="scale(1.2)"/></g>
    <g class="food-particle food-delay-2"><use href="#food" x="70" y="0" transform="scale(0.8)"/></g>
    <g class="food-particle food-delay-3"><use href="#food" x="200" y="0" transform="scale(1.5)"/></g>

    <!-- Main Animated Bacterium -->
    <use href="#salmonella" id="invader"/>

    <!-- ========================================== -->
    <!-- LAYER 3: CAPILLARY BED & BLOOD FLOW        -->
    <!-- ========================================== -->

    <!-- Capillary Vessel (Transparent to show bacteria inside) -->
    <path d="M 480,500 L 480,200 A 20,20 0 0,1 520,200 L 520,500 L 505,500 L 505,200 A 5,5 0 0,0 495,200 L 495,500 Z" fill="url(#capGrad)" opacity="0.8" stroke="url(#capGrad)" stroke-width="1"/>

    <!-- Red Blood Cells (Arterial - Ascending) -->
    <g class="rbc-up"><circle cx="487.5" cy="0" r="3.5" fill="#E74C3C"/></g>
    <g class="rbc-up delay-1"><circle cx="487.5" cy="0" r="3.5" fill="#E74C3C"/></g>
    <g class="rbc-up delay-2"><circle cx="487.5" cy="0" r="3.5" fill="#E74C3C"/></g>

    <!-- Red Blood Cells (Venous - Descending) -->
    <g class="rbc-down"><circle cx="512.5" cy="0" r="3.5" fill="#3498DB"/></g>
    <g class="rbc-down delay-1"><circle cx="512.5" cy="0" r="3.5" fill="#3498DB"/></g>
    <g class="rbc-down delay-2"><circle cx="512.5" cy="0" r="3.5" fill="#3498DB"/></g>

    <!-- ========================================== -->
    <!-- LAYER 4: UI, LABELS & LEGEND               -->
    <!-- ========================================== -->

    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50">
        Pathogenesis of <tspan font-family="Roboto Mono" font-style="italic">Salmonella typhi</tspan> (Typhoid Fever)
    </text>

    <!-- Legend -->
    <g transform="translate(610, 20)">
        <rect x="0" y="0" width="170" height="130" rx="5" fill="#ffffff" stroke="#ccc" opacity="0.95"/>
        <text x="85" y="20" text-anchor="middle" font-size="12" font-weight="600" fill="#2C3E50">Key</text>
        
        <rect x="10" y="32" width="8" height="16" rx="4" fill="#27AE60"/>
        <text x="25" y="44" font-size="12" fill="#2C3E50"><tspan font-family="Roboto Mono" font-style="italic">S. typhi</tspan> (Pathogen)</text>
        
        <rect x="10" y="55" width="10" height="10" fill="#E8F4FD" stroke="#4A90D9"/>
        <text x="25" y="65" font-size="12" fill="#2C3E50">Epithelial Cell</text>
        
        <circle cx="15" cy="80" r="5" fill="#98D8C8"/>
        <text x="25" y="84" font-size="12" fill="#2C3E50">Macrophage</text>
        
        <circle cx="12" cy="100" r="4" fill="#E74C3C"/>
        <circle cx="20" cy="100" r="4" fill="#3498DB"/>
        <text x="28" y="104" font-size="12" fill="#2C3E50">Capillary Blood</text>
        
        <rect x="10" y="112" width="10" height="10" fill="#F39C12" opacity="0.4"/>
        <text x="25" y="122" font-size="12" fill="#2C3E50">Lamina Propria</text>
    </g>

    <!-- Process Steps (Animated) -->
    <g transform="translate(20, 80)">
        <!-- Step 1 -->
        <rect id="bg-step1" class="step-bg" x="0" y="0" width="310" height="34" rx="6"/>
        <text id="txt-step1" class="step-text" x="15" y="22">1. Ingestion of contaminated food/water</text>
        
        <!-- Step 2 -->
        <rect id="bg-step2" class="step-bg" x="0" y="45" width="310" height="34" rx="6"/>
        <text id="txt-step2" class="step-text" x="15" y="67">2. Attachment to Intestinal Villi</text>
        
        <!-- Step 3 -->
        <rect id="bg-step3" class="step-bg" x="0" y="90" width="310" height="34" rx="6"/>
        <text id="txt-step3" class="step-text" x="15" y="112">3. Penetration of Intestinal Wall</text>
        
        <!-- Step 4 -->
        <rect id="bg-step4" class="step-bg" x="0" y="135" width="310" height="34" rx="6"/>
        <text id="txt-step4" class="step-text" x="15" y="157">4. Entry into Bloodstream (Systemic Spread)</text>
    </g>

    <!-- Static Pointers -->
    <g>
        <!-- Lumen -->
        <line x1="220" y1="350" x2="280" y2="350" class="pointer-line"/>
        <circle cx="280" cy="350" r="3" fill="#2C3E50"/>
        <text x="210" y="354" text-anchor="end" class="static-label">Intestinal Lumen</text>

        <!-- Epithelium -->
        <line x1="220" y1="400" x2="380" y2="400" class="pointer-line"/>
        <circle cx="380" cy="400" r="3" fill="#2C3E50"/>
        <text x="210" y="404" text-anchor="end" class="static-label">Intestinal Epithelium</text>

        <!-- Capillary -->
        <line x1="220" y1="450" x2="480" y2="450" class="pointer-line"/>
        <circle cx="480" cy="450" r="3" fill="#2C3E50"/>
        <text x="210" y="454" text-anchor="end" class="static-label">Capillary Bed</text>

        <!-- Macrophage -->
        <line x1="220" y1="300" x2="445" y2="320" class="pointer-line"/>
        <circle cx="445" cy="320" r="3" fill="#2C3E50"/>
        <text x="210" y="304" text-anchor="end" class="static-label">Tissue Macrophage</text>
    </g>

</svg>

</body>
</html>
