<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IUPAC Nomenclature Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        /* Base Animations */
        .fade-in { animation: fadeIn 15s infinite; }
        .draw-bond { animation: drawBond 15s infinite; }
        .draw-h-bond { animation: drawHBond 15s infinite; }

        @keyframes fadeIn {
            0%, 5% { opacity: 0; }
            10%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes drawBond {
            0%, 2% { stroke-dashoffset: 600; opacity: 0; }
            3% { opacity: 1; stroke-dashoffset: 600; }
            10%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes drawHBond {
            0%, 5% { stroke-dashoffset: 300; opacity: 0; }
            6% { opacity: 1; stroke-dashoffset: 300; }
            12%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Highlights */
        .highlight {
            fill: none;
            stroke-width: 24;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .parent-highlight {
            stroke: #4CC9F0;
            stroke-dasharray: 600;
            animation: showParent 15s infinite;
        }
        @keyframes showParent {
            0%, 12% { opacity: 0; stroke-dashoffset: 600; }
            18%, 95% { opacity: 0.5; stroke-dashoffset: 0; }
            100% { opacity: 0; }
        }

        .methyl-highlight {
            stroke: #F72585;
            stroke-dasharray: 100;
            animation: showMethyl 15s infinite;
        }
        @keyframes showMethyl {
            0%, 50% { opacity: 0; stroke-dashoffset: 100; }
            54%, 95% { opacity: 0.6; stroke-dashoffset: 0; }
            100% { opacity: 0; }
        }

        .ethyl-highlight {
            stroke: #4361EE;
            stroke-dasharray: 200;
            animation: showEthyl 15s infinite;
        }
        @keyframes showEthyl {
            0%, 60% { opacity: 0; stroke-dashoffset: 200; }
            64%, 95% { opacity: 0.6; stroke-dashoffset: 0; }
            100% { opacity: 0; }
        }

        /* Numbering */
        .correct-num { 
            animation: showCorrectNum 15s infinite; 
            transform-box: fill-box;
            transform-origin: center;
        }
        @keyframes showCorrectNum {
            0%, 30% { opacity: 0; transform: scale(0.5); }
            33%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; }
        }

        .wrong-num { animation: showWrongNum 15s infinite; }
        @keyframes showWrongNum {
            0%, 38% { opacity: 0; }
            40%, 46% { opacity: 1; }
            48%, 100% { opacity: 0; }
        }

        /* Name Builder Assembly */
        .ethyl-text { animation: flyEthyl 15s infinite; }
        @keyframes flyEthyl {
            0%, 60% { opacity: 0; transform: translate(148px, -90px); }
            64%, 72% { opacity: 1; transform: translate(148px, -90px); }
            78%, 95% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; }
        }

        .methyl-text { animation: flyMethyl 15s infinite; }
        @keyframes flyMethyl {
            0%, 50% { opacity: 0; transform: translate(-112px, -370px); }
            54%, 72% { opacity: 1; transform: translate(-112px, -370px); }
            78%, 95% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; }
        }

        .parent-text { animation: flyParent 15s infinite; }
        @keyframes flyParent {
            0%, 15% { opacity: 0; transform: translate(78px, -290px); }
            18%, 72% { opacity: 1; transform: translate(78px, -290px); }
            78%, 95% { opacity: 1; transform: translate(0, 0); }
            100% { opacity: 0; }
        }

        .final-glow { animation: finalGlow 15s infinite; }
        @keyframes finalGlow {
            0%, 85% { filter: drop-shadow(0 0 0 rgba(76, 201, 240, 0)); }
            88%, 95% { filter: drop-shadow(0 0 8px rgba(76, 201, 240, 0.8)); }
            100% { filter: drop-shadow(0 0 0 rgba(76, 201, 240, 0)); }
        }

        /* Rule Callouts */
        .rule { animation-duration: 15s; animation-iteration-count: infinite; }
        .rule1 { animation-name: rule1Anim; }
        .rule2 { animation-name: rule2Anim; }
        .rule3 { animation-name: rule3Anim; }
        
        @keyframes rule1Anim {
            0%, 12% { opacity: 0; transform: translateY(10px); }
            15%, 28% { opacity: 1; transform: translateY(0); }
            30%, 100% { opacity: 0; }
        }
        @keyframes rule2Anim {
            0%, 28% { opacity: 0; transform: translateY(10px); }
            30%, 48% { opacity: 1; transform: translateY(0); }
            50%, 100% { opacity: 0; }
        }
        @keyframes rule3Anim {
            0%, 48% { opacity: 0; transform: translateY(10px); }
            50%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }

        /* UI Elements */
        .title { font-size: 24px; font-weight: 700; fill: #2b2d42; }
        .subtitle { font-size: 14px; fill: #6c757d; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 20px; font-weight: 700; fill: #404040; }
        .rule-text { font-size: 14px; fill: #333; font-weight: 600; }
        .rule-subtext { font-size: 13px; fill: #666; }
        .legend-text { font-size: 12px; fill: #555; font-weight: 600; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" />

    <!-- UI: Title & Formula -->
    <text x="30" y="40" class="title">IUPAC Rules: Naming Branched Alkanes</text>
    <text x="30" y="60" class="subtitle">Example: 3-ethyl-2-methylhexane</text>
    
    <text x="700" y="45" class="formula">C<tspan dy="5" font-size="14">9</tspan><tspan dy="-5">H</tspan><tspan dy="5" font-size="14">20</tspan></text>

    <!-- UI: Legend -->
    <g transform="translate(630, 70)">
        <rect width="140" height="85" rx="6" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />
        <text x="10" y="20" class="legend-text" fill="#888">HIGHLIGHT KEY</text>
        <line x1="10" y1="35" x2="30" y2="35" stroke="#4CC9F0" stroke-width="6" stroke-linecap="round" />
        <text x="40" y="39" class="legend-text">Parent Chain</text>
        <line x1="10" y1="55" x2="30" y2="55" stroke="#F72585" stroke-width="6" stroke-linecap="round" />
        <text x="40" y="59" class="legend-text">Methyl Group</text>
        <line x1="10" y1="75" x2="30" y2="75" stroke="#4361EE" stroke-width="6" stroke-linecap="round" />
        <text x="40" y="79" class="legend-text">Ethyl Group</text>
    </g>

    <!-- UI: Rule Callouts -->
    <g transform="translate(30, 85)">
        <rect width="400" height="60" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />
        
        <g class="rule rule1">
            <text x="15" y="25" class="rule-text">Rule 1: Find the longest continuous carbon chain.</text>
            <text x="15" y="45" class="rule-subtext">6 carbons = <tspan fill="#4CC9F0" font-weight="bold">hexane</tspan> parent chain.</text>
        </g>
        
        <g class="rule rule2">
            <text x="15" y="25" class="rule-text">Rule 2: Number to give lowest possible locants.</text>
            <text x="15" y="45" class="rule-subtext">Left-to-right (2,3) is lower than right-to-left (4,5).</text>
        </g>
        
        <g class="rule rule3">
            <text x="15" y="25" class="rule-text">Rule 3: Name and alphabetize substituents.</text>
            <text x="15" y="45" class="rule-subtext"><tspan fill="#4361EE" font-weight="bold">Ethyl</tspan> (e) comes before <tspan fill="#F72585" font-weight="bold">Methyl</tspan> (m).</text>
        </g>
    </g>

    <!-- MOLECULE LAYER -->
    <g id="molecule">
        <!-- Highlights (Behind bonds) -->
        <polyline points="150,280 230,220 310,280 390,220 470,280 550,220" class="highlight parent-highlight" />
        <line x1="230" y1="220" x2="230" y2="140" class="highlight methyl-highlight" />
        <polyline points="310,280 310,360 390,420" class="highlight ethyl-highlight" />

        <!-- C-H Bonds -->
        <path class="draw-h-bond" stroke="#CCCCCC" stroke-width="3" stroke-linecap="round" stroke-dasharray="300" fill="none" d="
            M150,280 L110,280 M150,280 L130,250 M150,280 L130,310
            M230,220 L230,260
            M310,280 L310,240
            M390,220 L390,180 M390,220 L390,260
            M470,280 L470,240 M470,280 L470,320
            M550,220 L590,220 M550,220 L570,190 M550,220 L570,250
            M230,140 L230,100 M230,140 L200,130 M230,140 L260,130
            M310,360 L280,350 M310,360 L280,380
            M390,420 L430,420 M390,420 L410,450 M390,420 L370,450
        " />

        <!-- C-C Bonds -->
        <g class="draw-bond" stroke="#404040" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="600" fill="none">
            <polyline points="150,280 230,220 310,280 390,220 470,280 550,220" />
            <line x1="230" y1="220" x2="230" y2="140" />
            <polyline points="310,280 310,360 390,420" />
        </g>

        <!-- Hydrogen Atoms -->
        <g class="fade-in" fill="#CCCCCC">
            <circle cx="110" cy="280" r="4"/><circle cx="130" cy="250" r="4"/><circle cx="130" cy="310" r="4"/>
            <circle cx="230" cy="260" r="4"/>
            <circle cx="310" cy="240" r="4"/>
            <circle cx="390" cy="180" r="4"/><circle cx="390" cy="260" r="4"/>
            <circle cx="470" cy="240" r="4"/><circle cx="470" cy="320" r="4"/>
            <circle cx="590" cy="220" r="4"/><circle cx="570" cy="190" r="4"/><circle cx="570" cy="250" r="4"/>
            <circle cx="230" cy="100" r="4"/><circle cx="200" cy="130" r="4"/><circle cx="260" cy="130" r="4"/>
            <circle cx="280" cy="350" r="4"/><circle cx="280" cy="380" r="4"/>
            <circle cx="430" cy="420" r="4"/><circle cx="410" cy="450" r="4"/><circle cx="370" cy="450" r="4"/>
        </g>

        <!-- Carbon Atoms -->
        <g class="fade-in" fill="#404040">
            <circle cx="150" cy="280" r="8"/><circle cx="230" cy="220" r="8"/>
            <circle cx="310" cy="280" r="8"/><circle cx="390" cy="220" r="8"/>
            <circle cx="470" cy="280" r="8"/><circle cx="550" cy="220" r="8"/>
            <circle cx="230" cy="140" r="8"/>
            <circle cx="310" cy="360" r="8"/><circle cx="390" cy="420" r="8"/>
        </g>
    </g>

    <!-- NUMBERING LAYER -->
    <g font-family="Roboto Mono" font-size="14" font-weight="bold" text-anchor="middle">
        <!-- Correct Numbering (Left to Right) -->
        <g class="correct-num">
            <circle cx="150" cy="315" r="12" fill="#4BB543" />
            <text x="150" y="320" fill="white">1</text>
        </g>
        <g class="correct-num">
            <circle cx="255" cy="220" r="12" fill="#4BB543" />
            <text x="255" y="225" fill="white">2</text>
        </g>
        <g class="correct-num">
            <circle cx="285" cy="280" r="12" fill="#4BB543" />
            <text x="285" y="285" fill="white">3</text>
        </g>
        <g class="correct-num">
            <circle cx="415" cy="220" r="12" fill="#4BB543" />
            <text x="415" y="225" fill="white">4</text>
        </g>
        <g class="correct-num">
            <circle cx="495" cy="280" r="12" fill="#4BB543" />
            <text x="495" y="285" fill="white">5</text>
        </g>
        <g class="correct-num">
            <circle cx="550" cy="185" r="12" fill="#4BB543" />
            <text x="550" y="190" fill="white">6</text>
        </g>

        <!-- Wrong Numbering (Right to Left) -->
        <g class="wrong-num">
            <circle cx="550" cy="255" r="12" fill="#FF0000" />
            <text x="550" y="260" fill="white">1</text>
            
            <circle cx="445" cy="280" r="12" fill="#FF0000" />
            <text x="445" y="285" fill="white">2</text>
            
            <circle cx="365" cy="220" r="12" fill="#FF0000" />
            <text x="365" y="225" fill="white">3</text>
            
            <circle cx="335" cy="280" r="12" fill="#FF0000" />
            <text x="335" y="285" fill="white">4</text>
            
            <circle cx="205" cy="220" r="12" fill="#FF0000" />
            <text x="205" y="225" fill="white">5</text>
            
            <circle cx="150" cy="245" r="12" fill="#FF0000" />
            <text x="150" y="250" fill="white">6</text>

            <!-- Strike-through -->
            <path d="M 130 250 L 570 250" stroke="#FF0000" stroke-width="4" opacity="0.8" />
            <rect x="280" y="200" width="140" height="24" rx="4" fill="#FF0000" opacity="0.9" />
            <text x="350" y="216" fill="white" font-size="12" font-family="Inter">Incorrect (4,5)</text>
        </g>
    </g>

    <!-- NAME BUILDER LAYER -->
    <g class="final-glow" font-family="Roboto Mono" font-size="28" font-weight="bold">
        <!-- Background for Name Builder -->
        <rect x="220" y="470" width="360" height="60" rx="10" fill="#ffffff" stroke="#e9ecef" stroke-width="2" class="fade-in" />
        
        <!-- Animated Text Parts -->
        <text x="242" y="510" class="ethyl-text" fill="#4361EE">3-ethyl</text>
        <text x="342" y="510" class="methyl-text" fill="#F72585">-2-methyl</text>
        <text x="472" y="510" class="parent-text" fill="#4CC9F0">hexane</text>
    </g>

</svg>

</body>
</html>
