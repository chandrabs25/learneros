<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Patterns of Biodiversity: The Latitudinal Gradient</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

        :root {
            --membrane: #4A90D9;
            --nucleus: #2C3E50;
            --cytoplasm: #E8F4FD;
            --dna: #FF6B6B;
            --rna: #FFA07A;
            --proteins: #98D8C8;
            --chloroplast: #27AE60;
            --mitochondria: #E74C3C;
            --venous: #3498DB;
            --plant: #2ECC71;
            --animal: #F39C12;
            --bones: #F5F5DC;
            --muscles: #CD5C5C;
            --nerves: #FFD700;
            --glacier: #AED6F1;
            --sun: #F1C40F;
            --bg: #f8f9fa;
        }

        body {
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--nucleus);
            padding: 20px;
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            font-size: 14px;
            margin-bottom: 20px;
            color: #555;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            max-width: 950px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: var(--nucleus);
        }

        .sci-name {
            font-family: 'Roboto Mono', monospace;
            font-style: italic;
            font-size: 11px;
            fill: var(--nucleus);
        }

        /* Hover Interactivity */
        .hover-group { transition: all 0.3s ease; cursor: pointer; }
        .hover-group:hover .highlight-target { stroke: var(--nerves); stroke-width: 3px; filter: drop-shadow(0 0 4px var(--nerves)); }
        .hover-group:hover text.title-text { fill: var(--animal); }

        /* --- ANIMATIONS (15s Loop) --- */
        /* Phase 1: Solar Pulse (0-33%) */
        @keyframes solarPulse {
            0%, 10%, 33%, 100% { stroke-width: 2; opacity: 0.6; stroke: var(--sun); }
            15%, 25% { stroke-width: 6; opacity: 1; stroke: var(--nerves); }
        }
        
        @keyframes waveExpand {
            0%, 10% { r: 170; opacity: 0; stroke-width: 4; }
            15% { opacity: 0.8; stroke-width: 4; }
            30% { r: 260; opacity: 0; stroke-width: 1; }
            31%, 100% { r: 170; opacity: 0; }
        }

        @keyframes tropicsPulse {
            0%, 10%, 33%, 100% { fill: var(--plant); }
            15%, 25% { fill: var(--chloroplast); filter: brightness(1.2); }
        }

        /* Phase 2: Glacial Sweep (33-66%) */
        @keyframes glacierSlideN {
            0%, 33% { transform: translateY(-35px); opacity: 0; }
            40%, 60% { transform: translateY(0); opacity: 0.95; }
            66%, 100% { transform: translateY(-35px); opacity: 0; }
        }

        @keyframes glacierSlideS {
            0%, 33% { transform: translateY(35px); opacity: 0; }
            40%, 60% { transform: translateY(0); opacity: 0.95; }
            66%, 100% { transform: translateY(35px); opacity: 0; }
        }

        @keyframes temperateDie {
            0%, 33% { opacity: 1; filter: grayscale(0); }
            40%, 60% { opacity: 0.15; filter: grayscale(1); }
            66%, 100% { opacity: 1; filter: grayscale(0); }
        }

        @keyframes tropicalEvolve {
            0%, 33% { fill: var(--plant); transform: scale(1) rotate(0deg); }
            43% { fill: var(--animal); transform: scale(1.2) rotate(10deg); }
            53% { fill: var(--dna); transform: scale(1.1) rotate(-10deg); }
            66%, 100% { fill: var(--plant); transform: scale(1) rotate(0deg); }
        }

        /* Phase 3: Niche Filling (66-100%) */
        @keyframes nichePop {
            0%, 66% { opacity: 0.2; transform: scale(0.8); }
            72%, 96% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        @keyframes nicheHighlight {
            0%, 66% { stroke: var(--nucleus); stroke-width: 2; }
            72%, 96% { stroke: var(--nerves); stroke-width: 4; }
            100% { stroke: var(--nucleus); stroke-width: 2; }
        }

        /* Phase Indicators */
        @keyframes showP1 { 0%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
        @keyframes showP2 { 0%, 30% { opacity: 0; } 33%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
        @keyframes showP3 { 0%, 63% { opacity: 0; } 66%, 96% { opacity: 1; } 100% { opacity: 0; } }

        /* Apply Animations */
        .sun-ray { animation: solarPulse 15s infinite ease-in-out; }
        .prod-wave { animation: waveExpand 15s infinite ease-out; transform-origin: 240px 280px; }
        .tropics-pulse { animation: tropicsPulse 15s infinite ease-in-out; }
        .glacier-n { animation: glacierSlideN 15s infinite ease-in-out; }
        .glacier-s { animation: glacierSlideS 15s infinite ease-in-out; }
        .temp-species { animation: temperateDie 15s infinite ease-in-out; }
        .trop-species { animation: tropicalEvolve 15s infinite ease-in-out; transform-origin: center; transform-box: fill-box; }
        .niche-specialist { animation: nichePop 15s infinite cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-origin: center; transform-box: fill-box; }
        .niche-box { animation: nicheHighlight 15s infinite ease-in-out; }
        
        .phase-text { opacity: 0; fill: var(--nucleus); font-weight: 700; font-size: 16px; }
        .p1 { animation: showP1 15s infinite; fill: var(--animal); }
        .p2 { animation: showP2 15s infinite; fill: var(--membrane); }
        .p3 { animation: showP3 15s infinite; fill: var(--chloroplast); }

    </style>
</head>
<body>

    <h1>Global Patterns of Biodiversity: The Latitudinal Gradient</h1>
    <p class="subtitle">Species richness peaks at the equator and declines toward the poles. Observe the mechanisms driving this pattern.</p>

    <div class="svg-container">
        <svg viewBox="0 0 900 580" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing the latitudinal gradient of biodiversity and its three main hypotheses: Solar Energy, Glaciation Time, and Niche Specialization.">
            <title>The Latitudinal Gradient of Biodiversity</title>
            <desc>An interactive, animated diagram illustrating why biodiversity is highest at the equator. The left side shows a globe with a species richness gradient curve. The right side illustrates three hypotheses: solar energy flux, glaciation history, and niche specialization.</desc>

            <!-- Definitions for Reusable Elements -->
            <defs>
                <!-- Globe Clip Path -->
                <clipPath id="globe-clip">
                    <circle cx="240" cy="280" r="170"/>
                </clipPath>

                <!-- Species Icons -->
                <g id="pine">
                    <polygon points="0,-12 8,6 -8,6" fill="var(--chloroplast)"/>
                    <rect x="-2" y="6" width="4" height="4" fill="#8B4513"/>
                </g>
                <g id="angio">
                    <circle cx="0" cy="-5" r="5" fill="var(--plant)"/>
                    <path d="M0,-5 L0,5" stroke="var(--chloroplast)" stroke-width="2"/>
                    <circle cx="-4" cy="-2" r="3" fill="var(--rna)"/>
                    <circle cx="4" cy="-2" r="3" fill="var(--proteins)"/>
                </g>
                <g id="insect">
                    <ellipse cx="0" cy="0" rx="3" ry="6" fill="var(--animal)"/>
                    <path d="M-3,0 Q-8,-4 -3,-8 M3,0 Q8,-4 3,-8" fill="none" stroke="var(--animal)" stroke-width="1"/>
                    <line x1="-3" y1="2" x2="-7" y2="4" stroke="var(--nucleus)" stroke-width="1"/>
                    <line x1="3" y1="2" x2="7" y2="4" stroke="var(--nucleus)" stroke-width="1"/>
                </g>
                <g id="bird">
                    <path d="M-6,0 Q0,-8 6,0 Q0,-2 -6,0" fill="var(--mitochondria)"/>
                </g>
            </defs>

            <!-- Background Grid / Dividers -->
            <line x1="480" y1="200" x2="860" y2="200" stroke="#bdc3c7" stroke-dasharray="4,4"/>
            <line x1="480" y1="360" x2="860" y2="360" stroke="#bdc3c7" stroke-dasharray="4,4"/>
            <line x1="460" y1="40" x2="460" y2="520" stroke="#bdc3c7" stroke-dasharray="2,6"/>

            <!-- ========================================== -->
            <!-- LEFT PANEL: GLOBAL GRADIENT VIEW           -->
            <!-- ========================================== -->
            <text x="240" y="35" text-anchor="middle" font-weight="700" font-size="16">Global Gradient View</text>

            <!-- Productivity Waves (Animated) -->
            <circle cx="240" cy="280" r="170" fill="none" stroke="var(--plant)" stroke-width="2" class="prod-wave"/>
            <circle cx="240" cy="280" r="170" fill="none" stroke="var(--plant)" stroke-width="2" class="prod-wave" style="animation-delay: 0.5s;"/>

            <!-- The Globe -->
            <circle cx="240" cy="280" r="170" fill="var(--cytoplasm)" stroke="var(--membrane)" stroke-width="3"/>

            <!-- Latitude Lines -->
            <g stroke="var(--membrane)" stroke-dasharray="5,5" stroke-width="1.5" opacity="0.6">
                <line x1="70" y1="280" x2="410" y2="280" stroke-dasharray="none" stroke-width="2"/> <!-- Equator -->
                <line x1="84" y1="212" x2="396" y2="212"/> <!-- 23.5 N -->
                <line x1="84" y1="348" x2="396" y2="348"/> <!-- 23.5 S -->
                <line x1="135" y1="146" x2="345" y2="146"/> <!-- 66.5 N -->
                <line x1="135" y1="414" x2="345" y2="414"/> <!-- 66.5 S -->
            </g>

            <!-- Latitude Labels -->
            <g font-size="11" fill="var(--nucleus)" opacity="0.8">
                <text x="60" y="284" text-anchor="end" font-weight="600">0° (Equator)</text>
                <text x="75" y="216" text-anchor="end">23.5° N</text>
                <text x="75" y="352" text-anchor="end">23.5° S</text>
                <text x="125" y="150" text-anchor="end">66.5° N</text>
                <text x="125" y="418" text-anchor="end">66.5° S</text>
            </g>

            <!-- Species Icons on Globe -->
            <g clip-path="url(#globe-clip)">
                <!-- Polar North -->
                <use href="#pine" x="200" y="130" class="temp-species"/>
                <use href="#pine" x="260" y="120" class="temp-species"/>
                
                <!-- Temperate North -->
                <use href="#pine" x="140" y="180" class="temp-species"/>
                <use href="#pine" x="180" y="160" class="temp-species"/>
                <use href="#pine" x="230" y="190" class="temp-species"/>
                <use href="#pine" x="280" y="165" class="temp-species"/>
                <use href="#pine" x="330" y="185" class="temp-species"/>
                <use href="#pine" x="360" y="200" class="temp-species"/>

                <!-- Tropics (Dense & Diverse) -->
                <use href="#angio" x="100" y="250" class="trop-species" style="animation-delay: 0.1s;"/>
                <use href="#insect" x="130" y="230" class="trop-species" style="animation-delay: 0.3s;"/>
                <use href="#angio" x="150" y="280" class="trop-species" style="animation-delay: 0.5s;"/>
                <use href="#bird" x="170" y="240" class="trop-species" style="animation-delay: 0.2s;"/>
                <use href="#angio" x="190" y="310" class="trop-species" style="animation-delay: 0.7s;"/>
                <use href="#insect" x="210" y="260" class="trop-species" style="animation-delay: 0.4s;"/>
                <use href="#angio" x="230" y="290" class="trop-species" style="animation-delay: 0.1s;"/>
                <use href="#bird" x="250" y="230" class="trop-species" style="animation-delay: 0.6s;"/>
                <use href="#angio" x="270" y="320" class="trop-species" style="animation-delay: 0.8s;"/>
                <use href="#insect" x="290" y="250" class="trop-species" style="animation-delay: 0.3s;"/>
                <use href="#angio" x="310" y="280" class="trop-species" style="animation-delay: 0.2s;"/>
                <use href="#bird" x="330" y="310" class="trop-species" style="animation-delay: 0.9s;"/>
                <use href="#angio" x="350" y="260" class="trop-species" style="animation-delay: 0.5s;"/>
                <use href="#insect" x="370" y="290" class="trop-species" style="animation-delay: 0.4s;"/>
                <use href="#angio" x="380" y="240" class="trop-species" style="animation-delay: 0.1s;"/>
                
                <!-- Temperate South -->
                <use href="#pine" x="130" y="370" class="temp-species"/>
                <use href="#pine" x="190" y="390" class="temp-species"/>
                <use href="#pine" x="250" y="360" class="temp-species"/>
                <use href="#pine" x="300" y="385" class="temp-species"/>
                <use href="#pine" x="350" y="365" class="temp-species"/>

                <!-- Polar South -->
                <use href="#pine" x="220" y="440" class="temp-species"/>
                <use href="#pine" x="270" y="430" class="temp-species"/>
            </g>

            <!-- Scientific Labels -->
            <text x="290" y="180" class="sci-name">Pinus spp.</text>
            <text x="250" y="335" class="sci-name">Ficus spp.</text>

            <!-- Gradient Curve Overlay -->
            <path d="M 240,110 C 240,180 440,220 440,280 C 440,340 240,380 240,450" fill="var(--dna)" fill-opacity="0.15" stroke="var(--dna)" stroke-width="3"/>
            <text x="445" y="285" fill="var(--dna)" font-weight="700" font-size="13">Species Richness</text>


            <!-- ========================================== -->
            <!-- RIGHT PANEL: HYPOTHESIS MECHANISMS         -->
            <!-- ========================================== -->
            <text x="670" y="35" text-anchor="middle" font-weight="700" font-size="16">Hypothesis Mechanism Panel</text>

            <!-- 1. Solar Energy -->
            <g class="hover-group">
                <text x="490" y="75" font-weight="700" font-size="14" class="title-text">1. High Solar Energy = High Productivity</text>
                
                <!-- Earth Surface Arc -->
                <path d="M 530,90 Q 560,135 530,180" fill="none" stroke="var(--membrane)" stroke-width="4" class="highlight-target"/>
                
                <!-- Sun -->
                <circle cx="780" cy="135" r="28" fill="var(--sun)"/>
                <circle cx="780" cy="135" r="35" fill="var(--sun)" opacity="0.3"/>
                
                <!-- Solar Rays -->
                <line x1="745" y1="135" x2="555" y2="135" stroke="var(--sun)" class="sun-ray"/> <!-- Equator -->
                <line x1="755" y1="115" x2="545" y2="95" stroke="var(--sun)" class="sun-ray"/> <!-- North -->
                <line x1="755" y1="155" x2="545" y2="175" stroke="var(--sun)" class="sun-ray"/> <!-- South -->
                
                <!-- Labels -->
                <text x="640" y="128" font-size="11" text-anchor="middle">Direct (High Flux)</text>
                <text x="650" y="95" font-size="10" text-anchor="middle" opacity="0.7">Oblique (Low Flux)</text>
                <text x="650" y="175" font-size="10" text-anchor="middle" opacity="0.7">Oblique (Low Flux)</text>
            </g>

            <!-- 2. Glaciation / Time -->
            <g class="hover-group">
                <text x="490" y="230" font-weight="700" font-size="14" class="title-text">2. Speciation is a Function of Time</text>
                
                <!-- Mini Earth Bar -->
                <rect x="650" y="245" width="40" height="100" rx="20" fill="var(--cytoplasm)" stroke="var(--membrane)" stroke-width="2" class="highlight-target"/>
                
                <!-- Tropics Band -->
                <rect x="650" y="280" width="40" height="30" fill="var(--plant)" class="tropics-pulse"/>
                
                <!-- Glaciers -->
                <path d="M645,240 L695,240 L695,280 L645,280 Z" fill="var(--glacier)" class="glacier-n" opacity="0.9"/>
                <path d="M645,310 L695,310 L695,350 L645,350 Z" fill="var(--glacier)" class="glacier-s" opacity="0.9"/>
                
                <!-- Labels -->
                <text x="640" y="295" font-size="11" text-anchor="end" fill="var(--chloroplast)" font-weight="600">Tropics: Stable & Ancient</text>
                <line x1="645" y1="291" x2="650" y2="291" stroke="var(--chloroplast)"/>
                
                <text x="705" y="260" font-size="11" fill="var(--venous)">Temperate: Recently Glaciated</text>
                <line x1="695" y1="256" x2="700" y2="256" stroke="var(--venous)"/>
            </g>

            <!-- 3. Niche Specialization -->
            <g class="hover-group">
                <text x="490" y="390" font-weight="700" font-size="14" class="title-text">3. Niche Specialization</text>
                
                <!-- Temperate Box (Generalists) -->
                <rect x="520" y="410" width="110" height="110" rx="8" fill="#fff" stroke="var(--nucleus)" stroke-width="2" class="highlight-target"/>
                <text x="575" y="540" text-anchor="middle" font-size="12" font-weight="600">Temperate</text>
                <text x="575" y="555" text-anchor="middle" font-size="11" opacity="0.8">(Broad Generalists)</text>
                
                <!-- Generalist Shapes -->
                <circle cx="560" cy="445" r="24" fill="var(--venous)" opacity="0.85"/>
                <circle cx="600" cy="470" r="26" fill="var(--mitochondria)" opacity="0.85"/>
                <circle cx="550" cy="490" r="20" fill="var(--animal)" opacity="0.85"/>

                <!-- Tropical Box (Specialists) -->
                <rect x="700" y="410" width="110" height="110" rx="8" fill="#fff" stroke="var(--nucleus)" stroke-width="2" class="highlight-target niche-box"/>
                <text x="755" y="540" text-anchor="middle" font-size="12" font-weight="600">Tropics</text>
                <text x="755" y="555" text-anchor="middle" font-size="11" opacity="0.8">(Narrow Specialists)</text>
                
                <!-- Specialist Shapes (Interlocking Puzzle) -->
                <g transform="translate(715, 425)">
                    <!-- Row 1 -->
                    <polygon points="0,0 25,0 25,25 0,25" fill="var(--plant)" class="niche-specialist" style="animation-delay: 0.1s;"/>
                    <polygon points="25,0 50,0 25,25" fill="var(--rna)" class="niche-specialist" style="animation-delay: 0.2s;"/>
                    <polygon points="50,0 50,25 25,25" fill="var(--proteins)" class="niche-specialist" style="animation-delay: 0.3s;"/>
                    <polygon points="50,0 75,0 75,25 50,25" fill="var(--animal)" class="niche-specialist" style="animation-delay: 0.4s;"/>
                    
                    <!-- Row 2 -->
                    <polygon points="0,25 25,25 12.5,50" fill="var(--mitochondria)" class="niche-specialist" style="animation-delay: 0.5s;"/>
                    <polygon points="0,25 12.5,50 0,50" fill="var(--venous)" class="niche-specialist" style="animation-delay: 0.6s;"/>
                    <polygon points="25,25 50,25 50,50 25,50" fill="var(--muscles)" class="niche-specialist" style="animation-delay: 0.7s;"/>
                    <polygon points="50,25 75,25 62.5,50" fill="var(--nerves)" class="niche-specialist" style="animation-delay: 0.8s;"/>
                    <polygon points="75,25 75,50 62.5,50" fill="var(--chloroplast)" class="niche-specialist" style="animation-delay: 0.9s;"/>
                    
                    <!-- Row 3 -->
                    <polygon points="0,50 25,50 25,75 0,75" fill="var(--bones)" class="niche-specialist" style="animation-delay: 1.0s;"/>
                    <polygon points="25,50 50,50 37.5,75" fill="var(--dna)" class="niche-specialist" style="animation-delay: 1.1s;"/>
                    <polygon points="25,75 37.5,75 50,50" fill="#9B59B6" class="niche-specialist" style="animation-delay: 1.2s;"/>
                    <polygon points="50,50 75,50 75,75 50,75" fill="var(--membrane)" class="niche-specialist" style="animation-delay: 1.3s;"/>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- LEGEND & ANIMATION STATUS                  -->
            <!-- ========================================== -->
            
            <!-- Legend Box -->
            <rect x="20" y="470" width="160" height="90" fill="#fff" stroke="#bdc3c7" rx="6" opacity="0.9"/>
            <text x="30" y="488" font-size="11" font-weight="700">Legend</text>
            
            <circle cx="35" cy="502" r="5" fill="var(--plant)"/>
            <text x="48" y="506" font-size="11">Tropical Species</text>
            
            <polygon points="35,512 40,522 30,522" fill="var(--chloroplast)"/>
            <text x="48" y="520" font-size="11">Temperate Species</text>
            
            <line x1="30" y1="532" x2="40" y2="532" stroke="var(--dna)" stroke-width="3"/>
            <text x="48" y="535" font-size="11">Richness Gradient</text>
            
            <rect x="30" y="542" width="10" height="10" fill="var(--glacier)"/>
            <text x="48" y="551" font-size="11">Glacial Ice</text>

            <!-- Animation Phase Indicator -->
            <rect x="260" y="520" width="380" height="40" rx="20" fill="var(--bg)" stroke="#bdc3c7"/>
            <text x="450" y="545" text-anchor="middle" class="phase-text p1">Animation Phase 1: Solar Pulse & Productivity</text>
            <text x="450" y="545" text-anchor="middle" class="phase-text p2">Animation Phase 2: Glacial Sweep & Time</text>
            <text x="450" y="545" text-anchor="middle" class="phase-text p3">Animation Phase 3: Niche Specialization</text>

        </svg>
    </div>

</body>
</html>
