<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Work-Energy Theorem Sandbox</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-main: #2d3748;
            --color-k: #06D6A0;
            --color-u: #7209B7;
            --color-w: #FF3366;
            --color-block: #4361EE;
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
        }

        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            box-shadow: var(--shadow);
            position: absolute;
            z-index: 10;
        }

        /* Formula Card */
        #formula-card {
            top: 20px; left: 20px;
            padding: 20px;
            min-width: 300px;
        }

        #formula-card h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
        }

        .equation {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        .eq-w { color: var(--color-w); }
        .eq-k { color: var(--color-k); }
        .eq-u { color: var(--color-u); }

        .live-values {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.95rem;
        }

        .val-row {
            display: flex;
            justify-content: space-between;
        }

        /* Controls Panel */
        #controls-panel {
            top: 20px; right: 20px;
            bottom: 20px;
            width: 320px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .control-group { margin-bottom: 20px; }
        
        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: var(--color-block);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 6px;
            cursor: pointer;
            background: #cbd5e0;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 16px; width: 16px;
            border-radius: 50%;
            background: var(--color-block);
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        
        #force-slider::-webkit-slider-thumb { background: var(--color-w); }
        #k-slider::-webkit-slider-thumb { background: #718096; }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: white;
        }

        #btn-play { background: var(--color-k); }
        #btn-play:hover { background: #05b586; }
        #btn-reset { background: #a0aec0; }
        #btn-reset:hover { background: #718096; }

        /* Bar Charts */
        .chart-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            margin-top: 10px;
            border-top: 2px solid #e2e8f0;
            padding-top: 15px;
        }

        .chart-title {
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }

        .bars {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            height: 150px;
            padding-bottom: 25px;
            position: relative;
            border-bottom: 2px solid #cbd5e0;
        }

        .bar-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 40px;
            height: 100%;
            justify-content: flex-end;
            position: relative;
        }

        .bar {
            width: 100%;
            border-radius: 4px 4px 0 0;
            transition: height 0.1s linear;
            min-height: 2px;
        }

        #bar-k { background: var(--color-k); }
        #bar-u { background: var(--color-u); }
        #bar-w { background: var(--color-w); }

        .bar-label {
            position: absolute;
            bottom: -22px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .bar-value {
            position: absolute;
            top: -20px;
            font-family: 'Roboto Mono', monospace;
            font-size: 0.75rem;
            width: 100%;
            text-align: center;
        }

        /* 3D Labels */
        #labels-container {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 5;
        }
        .html-label {
            position: absolute;
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            color: #1a202c;
            background: rgba(255,255,255,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            transform: translate(-50%, -50%);
        }

    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="labels-container">
        <div id="label-m" class="html-label">m</div>
    </div>

    <!-- Formula Card -->
    <div id="formula-card" class="glass-panel">
        <h2>Work-Energy Theorem</h2>
        <div class="equation">
            <span class="eq-w">W<sub>ext</sub></span> = 
            <span class="eq-k">&Delta;K</span> + 
            <span class="eq-u">&Delta;U<sub>s</sub></span>
        </div>
        <div class="live-values">
            <div class="val-row">
                <span><span class="eq-w">W<sub>ext</sub></span> (Work Done):</span>
                <span id="val-w">0.00 J</span>
            </div>
            <div class="val-row">
                <span><span class="eq-k">&Delta;K</span> (Change in KE):</span>
                <span id="val-dk">0.00 J</span>
            </div>
            <div class="val-row">
                <span><span class="eq-u">&Delta;U<sub>s</sub></span> (Change in PE):</span>
                <span id="val-du">0.00 J</span>
            </div>
            <div class="val-row" style="margin-top: 8px; border-top: 1px dashed #cbd5e0; padding-top: 8px;">
                <span>Sum (&Delta;K + &Delta;U<sub>s</sub>):</span>
                <span id="val-sum">0.00 J</span>
            </div>
        </div>
    </div>

    <!-- Controls Panel -->
    <div id="controls-panel" class="glass-panel">
        
        <div class="control-group">
            <div class="control-header">
                <span>Mass (m)</span>
                <span class="val-display" id="disp-m">1.0 kg</span>
            </div>
            <input type="range" id="m-slider" min="0.5" max="5.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Spring Constant (k)</span>
                <span class="val-display" id="disp-k" style="color: #718096;">10 N/m</span>
            </div>
            <input type="range" id="k-slider" min="0" max="50" step="1" value="10">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Applied Force (F<sub>ext</sub>)</span>
                <span class="val-display" id="disp-f" style="color: var(--color-w);">5 N</span>
            </div>
            <input type="range" id="force-slider" min="-20" max="20" step="1" value="5">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Initial Position (x<sub>0</sub>)</span>
                <span class="val-display" id="disp-x">0.0 m</span>
            </div>
            <input type="range" id="x-slider" min="-5" max="5" step="0.1" value="0">
        </div>

        <div class="btn-group">
            <button id="btn-play">Play</button>
            <button id="btn-reset">Reset</button>
        </div>

        <div class="chart-container">
            <div class="chart-title">Energy Bar Chart</div>
            <div class="bars">
                <div class="bar-wrapper">
                    <div class="bar-value" id="bar-val-k">0</div>
                    <div class="bar" id="bar-k" style="height: 0%;"></div>
                    <div class="bar-label">K</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-value" id="bar-val-u">0</div>
                    <div class="bar" id="bar-u" style="height: 0%;"></div>
                    <div class="bar-label">U</div>
                </div>
                <div class="bar-wrapper">
                    <div class="bar-value" id="bar-val-w">0</div>
                    <div class="bar" id="bar-w" style="height: 0%;"></div>
                    <div class="bar-label">W<sub>ext</sub></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Physics State & Parameters ---
        const params = {
            m: 1.0,
            k: 10.0,
            F_ext: 5.0,
            x0: 0.0
        };

        const state = {
            x: 0.0,
            v: 0.0,
            W_ext: 0.0,
            isRunning: false,
            K_initial: 0.0,
            U_initial: 0.0
        };

        // --- Three.js Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8);
        scene.fog = new THREE.Fog(0xf0f4f8, 20, 60);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 8, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below ground
        controls.minDistance = 10;
        controls.maxDistance = 50;

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        dirLight.shadow.camera.left = -15;
        dirLight.shadow.camera.right = 15;
        dirLight.shadow.camera.top = 15;
        dirLight.shadow.camera.bottom = -15;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3D Objects ---
        
        // Track & Ground
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(60, 60, 0xcbd5e0, 0xcbd5e0);
        gridHelper.position.y = -0.99;
        scene.add(gridHelper);

        const trackGeo = new THREE.BoxGeometry(40, 0.2, 4);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0xd2d6dc, roughness: 0.5 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.y = -0.9;
        track.receiveShadow = true;
        scene.add(track);

        // Wall
        const wallX = -10;
        const wallGeo = new THREE.BoxGeometry(1, 4, 4);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xa0aec0, roughness: 0.7 });
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(wallX - 0.5, 1, 0);
        wall.castShadow = true;
        wall.receiveShadow = true;
        scene.add(wall);

        // Block
        const blockBaseSize = 1.5;
        const blockGeo = new THREE.BoxGeometry(blockBaseSize, blockBaseSize, blockBaseSize);
        const blockMat = new THREE.MeshPhysicalMaterial({ 
            color: 0x4361EE, 
            roughness: 0.2,
            metalness: 0.1,
            clearcoat: 0.5
        });
        const block = new THREE.Mesh(blockGeo, blockMat);
        block.position.y = -0.8 + blockBaseSize/2;
        block.castShadow = true;
        block.receiveShadow = true;
        scene.add(block);

        // Spring (Custom Curve for TubeGeometry)
        class HelixCurve extends THREE.Curve {
            constructor(startX, endX, radius, turns) {
                super();
                this.startX = startX;
                this.endX = endX;
                this.radius = radius;
                this.turns = turns;
            }
            getPoint(t, optionalTarget = new THREE.Vector3()) {
                const x = this.startX + (this.endX - this.startX) * t;
                const angle = t * Math.PI * 2 * this.turns;
                const y = Math.sin(angle) * this.radius;
                const z = Math.cos(angle) * this.radius;
                return optionalTarget.set(x, y, z);
            }
        }

        let springMesh;
        const springMat = new THREE.MeshPhysicalMaterial({
            color: 0xBDC3C7,
            metalness: 0.8,
            roughness: 0.3
        });

        function updateSpringGeometry() {
            if (springMesh) scene.remove(springMesh);
            
            // Visual parameters based on physics
            const springRadius = 0.4;
            const tubeRadius = 0.05 + (params.k / 50) * 0.1; // Thicker if stiffer
            const turns = 15;
            
            const path = new HelixCurve(wallX, block.position.x - block.scale.x * blockBaseSize/2, springRadius, turns);
            const tubeGeo = new THREE.TubeGeometry(path, 100, tubeRadius, 8, false);
            
            springMesh = new THREE.Mesh(tubeGeo, springMat);
            springMesh.position.y = block.position.y;
            springMesh.castShadow = true;
            scene.add(springMesh);
        }

        // Arrows
        const forceArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0xFF3366, 0.5, 0.3);
        scene.add(forceArrow);

        const velArrow = new THREE.ArrowHelper(new THREE.Vector3(1,0,0), new THREE.Vector3(0,0,0), 1, 0x06D6A0, 0.5, 0.3);
        scene.add(velArrow);

        // --- DOM Elements ---
        const elM = document.getElementById('m-slider');
        const elK = document.getElementById('k-slider');
        const elF = document.getElementById('force-slider');
        const elX = document.getElementById('x-slider');
        
        const dispM = document.getElementById('disp-m');
        const dispK = document.getElementById('disp-k');
        const dispF = document.getElementById('disp-f');
        const dispX = document.getElementById('disp-x');

        const btnPlay = document.getElementById('btn-play');
        const btnReset = document.getElementById('btn-reset');

        const valW = document.getElementById('val-w');
        const valDK = document.getElementById('val-dk');
        const valDU = document.getElementById('val-du');
        const valSum = document.getElementById('val-sum');

        const barK = document.getElementById('bar-k');
        const barU = document.getElementById('bar-u');
        const barW = document.getElementById('bar-w');
        const barValK = document.getElementById('bar-val-k');
        const barValU = document.getElementById('bar-val-u');
        const barValW = document.getElementById('bar-val-w');

        const labelM = document.getElementById('label-m');

        // --- Event Listeners ---
        function updateParamsFromUI() {
            params.m = parseFloat(elM.value);
            params.k = parseFloat(elK.value);
            params.F_ext = parseFloat(elF.value);
            
            dispM.innerText = params.m.toFixed(1) + ' kg';
            dispK.innerText = params.k.toFixed(0) + ' N/m';
            dispF.innerText = params.F_ext.toFixed(0) + ' N';

            // Visual updates
            const scale = 0.5 + (params.m / 5.0) * 0.8;
            block.scale.set(scale, scale, scale);
            block.position.y = -0.8 + (blockBaseSize * scale)/2;
            
            if (!state.isRunning) {
                params.x0 = parseFloat(elX.value);
                dispX.innerText = params.x0.toFixed(1) + ' m';
                state.x = params.x0;
                updateVisuals();
                calculateInitialEnergies();
                updateUI();
            }
        }

        elM.addEventListener('input', updateParamsFromUI);
        elK.addEventListener('input', updateParamsFromUI);
        elF.addEventListener('input', updateParamsFromUI);
        elX.addEventListener('input', () => {
            if(!state.isRunning) {
                updateParamsFromUI();
            }
        });

        btnPlay.addEventListener('click', () => {
            state.isRunning = !state.isRunning;
            if (state.isRunning) {
                btnPlay.innerText = 'Pause';
                btnPlay.style.background = '#f6ad55'; // Orange
                elX.disabled = true;
                // If starting from rest, record initial energies
                if(state.v === 0 && state.W_ext === 0) {
                    calculateInitialEnergies();
                }
            } else {
                btnPlay.innerText = 'Play';
                btnPlay.style.background = 'var(--color-k)';
                elX.disabled = false;
            }
        });

        btnReset.addEventListener('click', () => {
            state.isRunning = false;
            btnPlay.innerText = 'Play';
            btnPlay.style.background = 'var(--color-k)';
            elX.disabled = false;
            
            state.x = params.x0;
            state.v = 0;
            state.W_ext = 0;
            
            calculateInitialEnergies();
            updateVisuals();
            updateUI();
        });

        // --- Physics Engine ---
        function calculateInitialEnergies() {
            state.K_initial = 0.5 * params.m * state.v * state.v;
            state.U_initial = 0.5 * params.k * state.x * state.x;
        }

        // Semi-implicit Euler integration (very stable for springs)
        function physicsStep(dt) {
            // F_net = F_ext - k * x
            const F_spring = -params.k * state.x;
            const F_net = params.F_ext + F_spring;
            const a = F_net / params.m;

            // Update velocity
            state.v += a * dt;
            
            // Update position
            const dx = state.v * dt;
            state.x += dx;

            // Integrate Work: W = integral(F_ext * dx)
            state.W_ext += params.F_ext * dx;
        }

        // --- Visual & UI Updates ---
        function updateVisuals() {
            // Block position
            block.position.x = state.x;

            // Spring
            updateSpringGeometry();

            // Force Arrow
            if (Math.abs(params.F_ext) > 0.1) {
                forceArrow.visible = true;
                const dir = params.F_ext > 0 ? 1 : -1;
                forceArrow.setDirection(new THREE.Vector3(dir, 0, 0));
                forceArrow.setLength(Math.abs(params.F_ext) * 0.2 + 0.5, 0.4, 0.3);
                forceArrow.position.copy(block.position);
            } else {
                forceArrow.visible = false;
            }

            // Velocity Arrow
            if (Math.abs(state.v) > 0.05) {
                velArrow.visible = true;
                const dir = state.v > 0 ? 1 : -1;
                velArrow.setDirection(new THREE.Vector3(dir, 0, 0));
                velArrow.setLength(Math.abs(state.v) * 0.5 + 0.5, 0.4, 0.3);
                velArrow.position.copy(block.position);
                velArrow.position.y += (blockBaseSize * block.scale.y) / 2 + 0.2;
            } else {
                velArrow.visible = false;
            }

            // HTML Label positioning
            const vector = new THREE.Vector3(block.position.x, block.position.y + (blockBaseSize * block.scale.y)/2 + 0.8, block.position.z);
            vector.project(camera);
            const x = (vector.x * .5 + .5) * window.innerWidth;
            const y = (vector.y * -.5 + .5) * window.innerHeight;
            labelM.style.left = `${x}px`;
            labelM.style.top = `${y}px`;
        }

        function updateUI() {
            // Current Energies
            const K_current = 0.5 * params.m * state.v * state.v;
            const U_current = 0.5 * params.k * state.x * state.x;

            // Changes
            const deltaK = K_current - state.K_initial;
            const deltaU = U_current - state.U_initial;
            const sum = deltaK + deltaU;

            // Update Text
            valW.innerText = state.W_ext.toFixed(2) + ' J';
            valDK.innerText = deltaK.toFixed(2) + ' J';
            valDU.innerText = deltaU.toFixed(2) + ' J';
            valSum.innerText = sum.toFixed(2) + ' J';

            // Update Bar Charts
            // Dynamic scaling based on max expected energy
            const maxEnergy = Math.max(20, Math.abs(state.W_ext), K_current, U_current) * 1.2;
            
            const hK = Math.min(100, (K_current / maxEnergy) * 100);
            const hU = Math.min(100, (U_current / maxEnergy) * 100);
            const hW = Math.min(100, (Math.abs(state.W_ext) / maxEnergy) * 100);

            barK.style.height = `${hK}%`;
            barU.style.height = `${hU}%`;
            barW.style.height = `${hW}%`;

            barValK.innerText = K_current.toFixed(0);
            barValU.innerText = U_current.toFixed(0);
            barValW.innerText = state.W_ext.toFixed(0);

            // Color W bar based on sign
            if (state.W_ext < 0) {
                barW.style.background = '#e53e3e'; // Darker red for negative
            } else {
                barW.style.background = 'var(--color-w)';
            }
        }

        // --- Main Loop ---
        const clock = new THREE.Clock();
        const timeStep = 1 / 600; // Sub-stepping for physics accuracy

        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();

            if (state.isRunning) {
                // Fixed time step integration to prevent spiral of death and ensure accuracy
                // We do multiple small steps per frame
                const steps = 10; 
                for(let i=0; i<steps; i++) {
                    physicsStep(timeStep);
                }
            }

            controls.update();
            updateVisuals();
            updateUI();
            renderer.render(scene, camera);
        }

        // --- Initialization ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateParamsFromUI();
        calculateInitialEnergies();
        updateVisuals();
        updateUI();
        animate();

    </script>
</body>
</html>
