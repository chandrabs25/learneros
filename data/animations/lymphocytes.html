<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gene Therapy: ADA Deficiency</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        :root {
            --membrane: #4A90D9;
            --nucleus: #2C3E50;
            --cyto: #E8F4FD;
            --dna-bad: #FF6B6B;
            --dna-good: #98D8C8;
            --cdna: #FFA07A;
            --bg: #f8f9fa;
            --text: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: var(--bg);
        }

        /* Animations */
        #vector {
            animation: vector-move 20s infinite ease-in-out;
        }

        #cdna {
            animation: cdna-move 20s infinite ease-in-out;
        }

        #cdna-label {
            animation: cdna-label-anim 20s infinite ease-in-out;
        }

        #defective-dna {
            animation: dna-bad-anim 20s infinite ease-in-out;
        }

        #functional-dna {
            animation: dna-good-anim 20s infinite ease-in-out;
        }

        #enzymes {
            transform-origin: 500px 280px;
            animation: enzymes-anim 20s infinite ease-in-out;
        }

        #enzyme-label {
            animation: enzyme-label-anim 20s infinite ease-in-out;
        }

        #step1 { animation: step1-anim 20s infinite; }
        #step2 { animation: step2-anim 20s infinite; }
        #step3 { animation: step3-anim 20s infinite; }
        #step4 { animation: step4-anim 20s infinite; }

        /* Keyframes */
        @keyframes vector-move {
            0%, 15% { transform: translate(100px, 150px) rotate(0deg); opacity: 1; }
            25%, 30% { transform: translate(320px, 220px) rotate(45deg); opacity: 1; }
            35%, 85% { transform: translate(320px, 220px) rotate(45deg); opacity: 0; }
            86%, 100% { transform: translate(100px, 150px) rotate(0deg); opacity: 0; }
        }

        @keyframes cdna-move {
            0%, 15% { transform: translate(100px, 150px) scale(0.6); opacity: 1; }
            16%, 25% { transform: translate(320px, 220px) scale(0.6); opacity: 1; }
            30% { transform: translate(410px, 250px) scale(1); opacity: 1; }
            40%, 45% { transform: translate(500px, 280px) scale(1); opacity: 1; }
            46%, 100% { transform: translate(500px, 280px) scale(1); opacity: 0; }
        }

        @keyframes cdna-label-anim {
            0%, 30% { opacity: 1; }
            35%, 100% { opacity: 0; }
        }

        @keyframes dna-bad-anim {
            0%, 8% { opacity: 1; }
            9%, 10% { opacity: 0.4; }
            11%, 12% { opacity: 1; }
            13%, 14% { opacity: 0.4; }
            15%, 44% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }

        @keyframes dna-good-anim {
            0%, 44% { opacity: 0; filter: drop-shadow(0 0 0px var(--dna-good)); }
            45% { opacity: 1; filter: drop-shadow(0 0 8px var(--dna-good)); }
            65% { opacity: 1; filter: drop-shadow(0 0 16px var(--dna-good)); }
            85% { opacity: 1; filter: drop-shadow(0 0 8px var(--dna-good)); }
            86%, 100% { opacity: 0; }
        }

        @keyframes enzymes-anim {
            0%, 50% { opacity: 0; transform: translateY(10px) scale(0.8); }
            55% { opacity: 1; transform: translateY(0px) scale(1); }
            65% { opacity: 1; transform: translateY(-5px) scale(1); }
            75% { opacity: 1; transform: translateY(0px) scale(1); }
            85%, 100% { opacity: 0; }
        }

        @keyframes enzyme-label-anim {
            0%, 50% { opacity: 0; }
            55%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }

        @keyframes step1-anim { 0%, 14% { opacity: 1; } 15%, 100% { opacity: 0; } }
        @keyframes step2-anim { 0%, 14% { opacity: 0; } 15%, 34% { opacity: 1; } 35%, 100% { opacity: 0; } }
        @keyframes step3-anim { 0%, 34% { opacity: 0; } 35%, 54% { opacity: 1; } 55%, 100% { opacity: 0; } }
        @keyframes step4-anim { 0%, 54% { opacity: 0; } 55%, 85% { opacity: 1; } 86%, 100% { opacity: 0; } }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Gene Therapy for ADA Deficiency</title>
        <desc id="svg-desc">Animated diagram showing a retroviral vector delivering functional ADA cDNA into a patient's lymphocyte, integrating into the nucleus, and producing ADA enzymes.</desc>

        <defs>
            <radialGradient id="cytoGrad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="var(--cyto)" stop-opacity="1"/>
            </radialGradient>
            <radialGradient id="nucGrad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#4A6583" stop-opacity="0.3"/>
                <stop offset="100%" stop-color="var(--nucleus)" stop-opacity="0.4"/>
            </radialGradient>
            
            <g id="enzyme">
                <circle cx="0" cy="0" r="6" fill="var(--dna-good)"/>
                <circle cx="6" cy="4" r="5" fill="#7AB8A8"/>
                <circle cx="-4" cy="5" r="5" fill="#B8E8D8"/>
            </g>

            <g id="dna-segment">
                <path d="M0,10 Q15,-10 30,10 T60,10 T90,10 T120,10 T150,10 T180,10" fill="none" stroke-width="3" stroke-linecap="round"/>
                <path d="M0,10 Q15,30 30,10 T60,10 T90,10 T120,10 T150,10 T180,10" fill="none" stroke-width="3" stroke-linecap="round"/>
                <path d="M15,-5 L15,25 M45,-5 L45,25 M75,-5 L75,25 M105,-5 L105,25 M135,-5 L135,25 M165,-5 L165,25" stroke-width="2"/>
            </g>
        </defs>

        <!-- Title -->
        <text x="30" y="40" font-weight="700" font-size="22" fill="var(--text)">Gene Therapy: ADA Deficiency in Lymphocytes</text>

        <!-- Legend -->
        <g transform="translate(30, 80)" font-size="12" fill="var(--text)">
            <rect x="0" y="0" width="12" height="12" rx="2" fill="var(--membrane)"/>
            <text x="20" y="10">Cell Membrane</text>
            
            <rect x="0" y="20" width="12" height="12" rx="2" fill="var(--dna-bad)"/>
            <text x="20" y="30">Defective DNA</text>
            
            <rect x="0" y="40" width="12" height="12" rx="2" fill="var(--cdna)"/>
            <text x="20" y="50">ADA cDNA</text>
            
            <rect x="0" y="60" width="12" height="12" rx="2" fill="var(--dna-good)"/>
            <text x="20" y="70">Functional DNA / ADA Enzyme</text>
        </g>

        <!-- Lymphocyte -->
        <g id="lymphocyte" transform="translate(500, 280)">
            <!-- Cytoplasm -->
            <circle cx="0" cy="0" r="180" fill="url(#cytoGrad)" stroke="var(--membrane)" stroke-width="4"/>
            <!-- Nucleus -->
            <circle cx="0" cy="0" r="140" fill="url(#nucGrad)" stroke="var(--nucleus)" stroke-width="2" stroke-dasharray="6 4"/>
            
            <text x="0" y="-195" font-size="14" font-weight="600" fill="var(--membrane)" text-anchor="middle">Patient's Lymphocyte</text>
            <text x="0" y="-120" font-size="14" font-weight="600" fill="var(--nucleus)" text-anchor="middle">Nucleus</text>
        </g>

        <!-- Host DNA -->
        <g transform="translate(410, 270)">
            <!-- Defective DNA -->
            <g id="defective-dna" stroke="var(--dna-bad)">
                <use href="#dna-segment"/>
                <text x="90" y="-20" font-size="12" fill="var(--dna-bad)" text-anchor="middle" font-weight="600" stroke="none">Defective ADA Gene</text>
            </g>
            <!-- Functional DNA -->
            <g id="functional-dna" stroke="var(--dna-good)" opacity="0">
                <use href="#dna-segment"/>
                <text x="90" y="-20" font-size="12" fill="var(--dna-good)" text-anchor="middle" font-weight="600" stroke="none">Corrected ADA Gene</text>
            </g>
        </g>

        <!-- ADA Enzymes -->
        <g id="enzymes">
            <use href="#enzyme" x="350" y="280"/>
            <use href="#enzyme" x="650" y="280"/>
            <use href="#enzyme" x="500" y="125"/>
            <use href="#enzyme" x="390" y="180"/>
            <use href="#enzyme" x="610" y="180"/>
            <use href="#enzyme" x="390" y="380"/>
            <use href="#enzyme" x="610" y="380"/>
        </g>
        <text id="enzyme-label" x="500" y="485" font-size="14" font-weight="600" fill="var(--dna-good)" text-anchor="middle">Functional Adenosine Deaminase (ADA)</text>

        <!-- Retroviral Vector -->
        <g id="vector">
            <circle cx="0" cy="0" r="30" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
            <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#dcdcdc" stroke="#666" stroke-width="2"/>
            <path d="M0,-30 L0,-36 M0,30 L0,36 M30,0 L36,0 M-30,0 L-36,0 M21,-21 L25,-25 M-21,21 L-25,25 M21,21 L25,25 M-21,-21 L-25,-25" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
            <text x="0" y="-45" font-size="12" font-weight="600" fill="#555" text-anchor="middle">Retroviral Vector</text>
        </g>

        <!-- cDNA -->
        <g id="cdna">
            <path d="M-30,0 Q-15,-20 0,0 T30,0" fill="none" stroke="var(--cdna)" stroke-width="4" stroke-linecap="round"/>
            <text id="cdna-label" x="0" y="20" font-size="10" font-weight="600" fill="var(--cdna)" text-anchor="middle">ADA cDNA</text>
        </g>

        <!-- Process Labels Box -->
        <g transform="translate(30, 380)">
            <rect x="0" y="0" width="280" height="90" rx="8" fill="#ffffff" stroke="#ddd" stroke-width="2"/>
            <text x="15" y="25" font-size="14" font-weight="700" fill="var(--text)">Process Stage:</text>
            
            <g id="step1">
                <text x="15" y="50" font-size="14" font-weight="600" fill="var(--membrane)">1. Isolation of Lymphocytes</text>
                <text x="15" y="70" font-size="12" fill="#666">Defective ADA gene identified.</text>
            </g>
            <g id="step2" opacity="0">
                <text x="15" y="50" font-size="14" font-weight="600" fill="var(--membrane)">2. Transduction</text>
                <text x="15" y="70" font-size="12" fill="#666">Vector delivers functional ADA cDNA.</text>
                <text x="15" y="85" font-family="'Roboto Mono', monospace" font-size="9" fill="#888">Dose: 2.0 × 10<tspan dy="-3" font-size="7">8</tspan><tspan dy="3"> cells/kg</tspan></text>
            </g>
            <g id="step3" opacity="0">
                <text x="15" y="50" font-size="14" font-weight="600" fill="var(--membrane)">3. Integration</text>
                <text x="15" y="70" font-size="12" fill="#666">cDNA integrates into host genome.</text>
            </g>
            <g id="step4" opacity="0">
                <text x="15" y="50" font-size="14" font-weight="600" fill="var(--membrane)">4. Expression</text>
                <text x="15" y="70" font-size="12" fill="#666">Cell produces functional ADA enzyme.</text>
            </g>
        </g>
    </svg>
</body>
</html>
