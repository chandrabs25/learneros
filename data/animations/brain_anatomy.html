<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Forebrain Anatomy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        @keyframes pulse-thalamus {
            0%, 20%, 40%, 100% { transform: scale(1); fill: #98D8C8; }
            25%, 35% { transform: scale(1.05); fill: #B2E4D8; }
        }

        .thalamus {
            transform-origin: 395px 265px;
            animation: pulse-thalamus 10s infinite ease-in-out;
        }

        @keyframes glow-cortex {
            0%, 40%, 60%, 100% { filter: drop-shadow(0 0 0px rgba(243,156,18,0)); }
            45%, 55% { filter: drop-shadow(0 0 10px rgba(243,156,18,0.6)); }
        }

        .cortex-glow {
            animation: glow-cortex 10s infinite ease-in-out;
        }

        @keyframes pulse-hypothalamus {
            0%, 60%, 80%, 100% { transform: scale(1); fill: #E74C3C; }
            65%, 75% { transform: scale(1.1); fill: #FF6B6B; }
        }

        .hypothalamus {
            transform-origin: 390px 305px;
            animation: pulse-hypothalamus 10s infinite ease-in-out;
        }

        @keyframes fade-sensory {
            0%, 20% { opacity: 1; fill: #4A90D9; font-weight: 700; }
            25%, 100% { opacity: 0.5; fill: #2C3E50; font-weight: 500; }
        }

        .label-sensory {
            animation: fade-sensory 10s infinite;
        }

        @keyframes fade-output {
            0%, 75% { opacity: 0.5; fill: #2C3E50; font-weight: 500; }
            80%, 100% { opacity: 1; fill: #E74C3C; font-weight: 700; }
        }

        .label-output {
            animation: fade-output 10s infinite;
        }

        .signal {
            filter: drop-shadow(0 0 4px #4A90D9);
        }
        
        .signal-output {
            filter: drop-shadow(0 0 4px #E74C3C);
        }

        .leader-line {
            stroke: #BDC3C7;
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 4 2;
        }

        .leader-dot {
            fill: #7F8C8D;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of the human forebrain showing sensory relay and integration">
        <title>Forebrain Anatomy: Sensory Relay & Integration</title>
        <desc>A midsagittal section of the human brain demonstrating how sensory signals travel through the brainstem to the thalamus, radiate to the cerebrum for processing, and integrate in the hypothalamus to trigger a homeostatic response.</desc>

        <!-- Definitions for paths and filters -->
        <defs>
            <!-- Motion Paths -->
            <path id="path-sensory" d="M 380 460 L 395 275" />
            <path id="path-relay-1" d="M 395 265 Q 340 220 280 180" />
            <path id="path-relay-2" d="M 395 265 L 395 120" />
            <path id="path-relay-3" d="M 395 265 Q 460 220 500 180" />
            <path id="path-integration" d="M 280 180 Q 330 250 385 305" />
            <path id="path-output" d="M 385 305 L 370 460" />

            <!-- Drop Shadow for Cerebrum -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title and Subtitle -->
        <text x="30" y="40" font-family="Inter" font-size="22" font-weight="700" fill="#2C3E50">Forebrain Anatomy: Sensory Relay &amp; Integration</text>
        <text x="30" y="65" font-family="Inter" font-size="14" fill="#7F8C8D">Midsagittal section illustrating the pathway of neural signals</text>

        <!-- BRAIN ANATOMY GROUP -->
        <g transform="translate(-20, 0)">
            
            <!-- Cerebellum (Background Context) -->
            <path d="M 415 320 C 480 310, 520 350, 490 410 C 460 440, 410 420, 405 380 Z" fill="#BDC3C7" opacity="0.6" />
            <!-- Cerebellar Folia -->
            <path d="M 430 340 Q 460 330 480 350 M 425 360 Q 470 350 490 380 M 420 380 Q 460 380 475 410" stroke="#95A5A6" stroke-width="1.5" fill="none" opacity="0.6"/>

            <!-- Brainstem (Midbrain, Pons, Medulla) -->
            <path d="M 390 290 L 420 290 C 420 320, 430 340, 415 370 L 405 460 L 365 460 L 375 370 C 365 340, 380 320, 390 290 Z" fill="#F5F5DC" stroke="#D1D1B8" stroke-width="2" />

            <!-- Cerebrum (Cerebral Cortex) -->
            <g class="cortex-glow">
                <path d="M 240 260 C 240 180, 280 100, 380 80 C 480 80, 540 120, 560 200 C 580 260, 560 310, 520 330 C 480 350, 450 340, 430 310 C 450 280, 460 250, 440 210 C 420 180, 360 180, 340 210 C 320 240, 330 270, 310 280 C 280 290, 250 280, 240 260 Z" fill="#F39C12" stroke="#D35400" stroke-width="3" filter="url(#shadow)" stroke-linejoin="round" />
                
                <!-- Sulci (Cortical Folds) -->
                <path d="M 270 220 Q 290 180 340 150 M 310 130 Q 340 100 380 110 M 390 100 Q 420 120 440 160 M 470 110 Q 490 150 510 200 M 510 240 Q 540 260 530 290 M 480 290 Q 460 320 440 300 M 280 150 Q 260 120 300 90" stroke="#D35400" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.7" />
            </g>

            <!-- Corpus Callosum -->
            <path d="M 335 245 C 325 210, 360 190, 400 190 C 440 190, 460 210, 455 245 C 450 260, 430 260, 430 245 C 435 215, 410 205, 390 205 C 360 205, 345 220, 345 245 C 345 260, 335 260, 335 245 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" stroke-linejoin="round" />

            <!-- Thalamus -->
            <ellipse cx="395" cy="265" rx="30" ry="22" class="thalamus" stroke="#2C3E50" stroke-width="2" />

            <!-- Hypothalamus -->
            <path d="M 375 285 Q 395 285 410 290 L 395 320 Q 380 320 370 305 Z" class="hypothalamus" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round" />

            <!-- Pituitary Gland -->
            <line x1="390" y1="315" x2="385" y2="335" stroke="#FFA07A" stroke-width="2.5" />
            <ellipse cx="385" cy="335" rx="7" ry="5" fill="#FFA07A" stroke="#2C3E50" stroke-width="1.5" />

        </g>

        <!-- ANIMATED NEURAL SIGNALS -->
        <g transform="translate(-20, 0)">
            
            <!-- 1. Sensory Input Signal (0s - 2s) -->
            <circle r="4" fill="#4A90D9" class="signal">
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 380 460 L 395 275" keyTimes="0; 0.2; 1" keyPoints="0; 1; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>

            <!-- 2. Thalamic Relay Signals (2s - 4s) -->
            <circle r="4" fill="#4A90D9" class="signal">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.22; 0.38; 0.4; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 395 265 Q 340 220 280 180" keyTimes="0; 0.2; 0.4; 1" keyPoints="0; 0; 1; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#4A90D9" class="signal">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.22; 0.38; 0.4; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 395 265 L 395 120" keyTimes="0; 0.2; 0.4; 1" keyPoints="0; 0; 1; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#4A90D9" class="signal">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.22; 0.38; 0.4; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 395 265 Q 460 220 500 180" keyTimes="0; 0.2; 0.4; 1" keyPoints="0; 0; 1; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>

            <!-- 3. Cortical Processing (4s - 6s) -> Handled by CSS glow-cortex -->

            <!-- 4. Hypothalamic Integration Signal (6s - 8s) -->
            <circle r="4" fill="#4A90D9" class="signal">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.6; 0.62; 0.78; 0.8; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 280 180 Q 330 250 385 305" keyTimes="0; 0.6; 0.8; 1" keyPoints="0; 0; 1; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>

            <!-- 5. Motor/Homeostatic Output Signal (8s - 10s) -->
            <circle r="4" fill="#E74C3C" class="signal-output">
                <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.8; 0.82; 0.98; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 385 305 L 370 460" keyTimes="0; 0.8; 1" keyPoints="0; 0; 1" calcMode="linear" dur="10s" repeatCount="indefinite" />
            </circle>

        </g>

        <!-- LABELS AND LEADER LINES -->
        <g>
            <!-- Cerebrum -->
            <path d="M 460 120 L 580 80 L 600 80" class="leader-line" />
            <circle cx="460" cy="120" r="3" class="leader-dot" />
            <text x="610" y="84" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Cerebrum</text>
            <text x="610" y="100" font-family="Inter" font-size="11" fill="#7F8C8D">Higher processing &amp; integration</text>

            <!-- Corpus Callosum -->
            <path d="M 420 210 L 580 170 L 600 170" class="leader-line" />
            <circle cx="420" cy="210" r="3" class="leader-dot" />
            <text x="610" y="174" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Corpus Callosum</text>
            <text x="610" y="190" font-family="Inter" font-size="11" fill="#7F8C8D">White matter bridge</text>

            <!-- Thalamus -->
            <path d="M 405 265 L 580 265 L 600 265" class="leader-line" />
            <circle cx="405" cy="265" r="3" class="leader-dot" />
            <text x="610" y="269" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Thalamus</text>
            <text x="610" y="285" font-family="Inter" font-size="11" fill="#7F8C8D">Primary sensory relay station</text>

            <!-- Hypothalamus -->
            <path d="M 385 305 L 580 330 L 600 330" class="leader-line" />
            <circle cx="385" cy="305" r="3" class="leader-dot" />
            <text x="610" y="334" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Hypothalamus</text>
            <text x="610" y="350" font-family="Inter" font-size="11" fill="#7F8C8D">Homeostatic regulation</text>

            <!-- Pituitary Gland -->
            <path d="M 370 335 L 580 380 L 600 380" class="leader-line" />
            <circle cx="370" cy="335" r="3" class="leader-dot" />
            <text x="610" y="384" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Pituitary Gland</text>
            <text x="610" y="400" font-family="Inter" font-size="11" fill="#7F8C8D">Endocrine output</text>

            <!-- Brainstem -->
            <path d="M 395 400 L 580 430 L 600 430" class="leader-line" />
            <circle cx="395" cy="400" r="3" class="leader-dot" />
            <text x="610" y="434" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Brainstem</text>
            <text x="610" y="450" font-family="Inter" font-size="11" fill="#7F8C8D">Ascending/descending tracts</text>
        </g>

        <!-- PROCESS LABELS (Animated) -->
        <text x="350" y="450" font-family="'Roboto Mono', monospace" font-size="12" text-anchor="end" class="label-sensory">↑ Sensory Input</text>
        <text x="360" y="475" font-family="'Roboto Mono', monospace" font-size="12" text-anchor="start" class="label-output">↓ Motor/Homeostatic Output</text>

        <!-- LEGEND -->
        <g transform="translate(30, 380)">
            <rect x="0" y="0" width="200" height="95" rx="6" fill="#ffffff" stroke="#E0E0E0" stroke-width="1" />
            <text x="15" y="20" font-family="Inter" font-size="11" font-weight="700" fill="#2C3E50">TISSUE KEY</text>
            
            <circle cx="20" cy="38" r="5" fill="#F39C12" />
            <text x="35" y="42" font-family="Inter" font-size="11" fill="#2C3E50">Cerebrum (Animal Tissue)</text>
            
            <circle cx="20" cy="56" r="5" fill="#98D8C8" />
            <text x="35" y="60" font-family="Inter" font-size="11" fill="#2C3E50">Thalamus (Protein/Relay)</text>
            
            <circle cx="20" cy="74" r="5" fill="#E74C3C" />
            <text x="35" y="78" font-family="Inter" font-size="11" fill="#2C3E50">Hypothalamus (Metabolic)</text>
        </g>

    </svg>
</div>

</body>
</html>
