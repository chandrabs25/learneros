<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemiosmotic Hypothesis: Oxidative Phosphorylation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: #2C3E50;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        .diagram-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Animations */
        @keyframes float-slow {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        @keyframes float-fast {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .float-1 { animation: float-slow 4s ease-in-out infinite; }
        .float-2 { animation: float-fast 5s ease-in-out infinite 1s; }
        
        @keyframes electron-flow {
            0% { transform: translate(70px, 340px); opacity: 0; }
            5% { transform: translate(70px, 340px); opacity: 1; }
            10% { transform: translate(125px, 300px); }
            25% { transform: translate(240px, 250px); }
            40% { transform: translate(340px, 250px); }
            55% { transform: translate(450px, 170px); }
            75% { transform: translate(580px, 250px); }
            85% { transform: translate(580px, 360px); opacity: 1; }
            90%, 100% { transform: translate(580px, 360px); opacity: 0; }
        }
        .electron { animation: electron-flow 8s linear infinite; }
        .electron.delayed { animation-delay: 4s; }

        @keyframes pump1 {
            0%, 6% { transform: translate(125px, 340px); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: translate(125px, 150px); opacity: 1; }
            25%, 100% { transform: translate(125px, 150px); opacity: 0; }
        }
        @keyframes pump3 {
            0%, 37% { transform: translate(340px, 340px); opacity: 0; }
            41% { opacity: 1; }
            51% { transform: translate(340px, 150px); opacity: 1; }
            56%, 100% { transform: translate(340px, 150px); opacity: 0; }
        }
        @keyframes pump4 {
            0%, 71% { transform: translate(580px, 340px); opacity: 0; }
            75% { opacity: 1; }
            85% { transform: translate(580px, 150px); opacity: 1; }
            90%, 100% { transform: translate(580px, 150px); opacity: 0; }
        }
        .pump-1 { animation: pump1 8s linear infinite; }
        .pump-3 { animation: pump3 8s linear infinite; }
        .pump-4 { animation: pump4 8s linear infinite; }
        .pump-1.delayed, .pump-3.delayed, .pump-4.delayed { animation-delay: 4s; }

        @keyframes flow-h {
            0% { transform: translate(740px, 150px); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: translate(740px, 250px); }
            50% { transform: translate(700px, 380px); opacity: 1; }
            60%, 100% { transform: translate(700px, 380px); opacity: 0; }
        }
        .flow-h-1 { animation: flow-h 3s linear infinite 0s; }
        .flow-h-2 { animation: flow-h 3s linear infinite 1s; }
        .flow-h-3 { animation: flow-h 3s linear infinite 2s; }

        @keyframes rotate-f1 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .f1-rotor {
            transform-origin: 740px 350px;
            animation: rotate-f1 3s linear infinite;
        }

        @keyframes adp-in {
            0% { transform: translate(600px, 420px); opacity: 0; }
            10% { opacity: 1; }
            40% { transform: translate(680px, 370px); opacity: 1; }
            41%, 100% { transform: translate(680px, 370px); opacity: 0; }
        }
        @keyframes atp-out {
            0%, 40% { transform: translate(680px, 370px); opacity: 0; }
            41% { transform: translate(680px, 370px); opacity: 1; }
            70% { transform: translate(740px, 440px); opacity: 1; }
            90%, 100% { transform: translate(740px, 440px); opacity: 0; }
        }
        .adp-anim { animation: adp-in 3s ease-in-out infinite; }
        .atp-anim { animation: atp-out 3s ease-in-out infinite; }

        .pulse-text { animation: pulse 2s infinite; }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <h1>Chemiosmotic Hypothesis: Oxidative Phosphorylation</h1>
    
    <div class="diagram-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Chemiosmotic Hypothesis Animation</title>
            <desc>Diagram showing the electron transport chain and ATP synthesis across the inner mitochondrial membrane.</desc>

            <defs>
                <!-- Shadows and Glows -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" flood-color="#2C3E50"/>
                </filter>
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                    <feMerge>
                        <feMergeNode in="coloredBlur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Markers -->
                <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C"/>
                </marker>
                <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
                </marker>

                <!-- Phospholipid Pattern -->
                <pattern id="lipid" width="16" height="100" patternUnits="userSpaceOnUse">
                    <!-- Top Layer -->
                    <circle cx="8" cy="10" r="6" fill="#4A90D9"/>
                    <path d="M 5 16 L 5 40 M 11 16 L 11 40" stroke="#4A90D9" stroke-width="2" fill="none" stroke-linecap="round"/>
                    <!-- Bottom Layer -->
                    <circle cx="8" cy="90" r="6" fill="#4A90D9"/>
                    <path d="M 5 84 L 5 60 M 11 84 L 11 60" stroke="#4A90D9" stroke-width="2" fill="none" stroke-linecap="round"/>
                </pattern>

                <!-- Reusable Proton (H+) -->
                <g id="proton">
                    <circle cx="0" cy="0" r="7" fill="#FF6B6B" filter="url(#shadow)"/>
                    <text x="0" y="3.5" text-anchor="middle" font-family="Inter" font-size="10" font-weight="bold" fill="#ffffff">+</text>
                </g>

                <!-- Reusable Electron (e-) -->
                <g id="electron-spark">
                    <circle cx="0" cy="0" r="5" fill="#FFD700" filter="url(#glow)"/>
                    <text x="0" y="2.5" text-anchor="middle" font-family="Inter" font-size="8" font-weight="bold" fill="#2C3E50">-</text>
                </g>
            </defs>

            <!-- Background Compartments -->
            <rect x="0" y="0" width="800" height="200" fill="#E8F4FD" />
            <rect x="0" y="300" width="800" height="200" fill="#FDF2E9" />

            <!-- Compartment Labels -->
            <text x="20" y="40" font-family="Inter" font-size="18" font-weight="700" fill="#2C3E50">Intermembrane Space (IMS)</text>
            <text x="20" y="60" font-family="Inter" font-size="14" font-weight="600" fill="#FF6B6B" class="pulse-text">High [H⁺] Concentration</text>
            
            <text x="20" y="460" font-family="Inter" font-size="18" font-weight="700" fill="#2C3E50">Mitochondrial Matrix</text>
            <text x="20" y="480" font-family="Inter" font-size="14" font-weight="600" fill="#FF6B6B">Low [H⁺] Concentration</text>

            <!-- Proton Motive Force Arrow -->
            <line x1="30" y1="90" x2="30" y2="280" stroke="#E74C3C" stroke-width="4" marker-end="url(#arrow-down)"/>
            <text x="45" y="160" font-family="Inter" font-size="12" font-weight="700" fill="#E74C3C" letter-spacing="1">PROTON</text>
            <text x="45" y="175" font-family="Inter" font-size="12" font-weight="700" fill="#E74C3C" letter-spacing="1">MOTIVE</text>
            <text x="45" y="190" font-family="Inter" font-size="12" font-weight="700" fill="#E74C3C" letter-spacing="1">FORCE</text>

            <!-- Legend -->
            <rect x="630" y="15" width="155" height="75" fill="#ffffff" stroke="#cbd5e1" rx="6" filter="url(#shadow)"/>
            <use href="#proton" x="645" y="30"/>
            <text x="660" y="34" font-family="Inter" font-size="12" fill="#2C3E50">Proton (H⁺)</text>
            <use href="#electron-spark" x="645" y="50"/>
            <text x="660" y="54" font-family="Inter" font-size="12" fill="#2C3E50">Electron (e⁻)</text>
            <rect x="640" y="65" width="10" height="10" fill="#98D8C8" rx="2"/>
            <text x="660" y="74" font-family="Inter" font-size="12" fill="#2C3E50">Protein Complex</text>

            <!-- Inner Mitochondrial Membrane -->
            <rect x="0" y="200" width="800" height="100" fill="url(#lipid)" />

            <!-- Protein Complexes -->
            <!-- Complex I -->
            <g filter="url(#shadow)">
                <rect x="95" y="180" width="60" height="100" rx="15" fill="#98D8C8"/>
                <rect x="95" y="250" width="60" height="80" rx="15" fill="#98D8C8"/>
                <text x="125" y="245" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#2C3E50">I</text>
            </g>

            <!-- Complex III -->
            <g filter="url(#shadow)">
                <rect x="310" y="180" width="60" height="100" rx="15" fill="#98D8C8"/>
                <text x="340" y="235" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#2C3E50">III</text>
            </g>

            <!-- Complex IV -->
            <g filter="url(#shadow)">
                <rect x="550" y="180" width="60" height="100" rx="15" fill="#98D8C8"/>
                <text x="580" y="235" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="700" fill="#2C3E50">IV</text>
            </g>

            <!-- ATP Synthase -->
            <g filter="url(#shadow)">
                <!-- F0 Portion -->
                <rect x="710" y="180" width="60" height="100" rx="10" fill="#98D8C8"/>
                <text x="740" y="170" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#2C3E50">ATP Synthase</text>
                
                <!-- Stalk -->
                <rect x="730" y="270" width="20" height="50" fill="#76B5A5"/>
                
                <!-- F1 Rotor (Animated) -->
                <g class="f1-rotor">
                    <circle cx="740" cy="350" r="35" fill="#98D8C8"/>
                    <path d="M 740 315 L 740 385 M 705 350 L 775 350 M 715 325 L 765 375 M 715 375 L 765 325" stroke="#76B5A5" stroke-width="4" stroke-linecap="round"/>
                </g>
            </g>

            <!-- Mobile Carriers -->
            <g filter="url(#shadow)">
                <!-- Ubiquinone (UQ) -->
                <circle cx="240" cy="250" r="18" fill="#F39C12"/>
                <text x="240" y="254" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#ffffff">UQ</text>
                
                <!-- Cytochrome c (Cyt c) -->
                <circle cx="450" cy="170" r="18" fill="#E74C3C"/>
                <text x="450" y="174" text-anchor="middle" font-family="Inter" font-size="11" font-weight="700" fill="#ffffff">Cyt c</text>
            </g>

            <!-- Chemical Equations -->
            <!-- NADH Oxidation -->
            <text x="70" y="380" text-anchor="middle" font-family="Roboto Mono" font-size="13" font-weight="700" fill="#2C3E50">NADH</text>
            <path d="M 70 365 Q 90 330 70 305" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow-dark)"/>
            <text x="70" y="290" text-anchor="middle" font-family="Roboto Mono" font-size="13" font-weight="700" fill="#2C3E50">NAD⁺ + H⁺</text>

            <!-- Oxygen Reduction -->
            <text x="580" y="400" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#2C3E50">½ O₂ + 2H⁺ + 2e⁻ → H₂O</text>

            <!-- Static Protons (Gradient Visualization) -->
            <g class="float-1">
                <use href="#proton" x="150" y="80"/>
                <use href="#proton" x="280" y="60"/>
                <use href="#proton" x="420" y="140"/>
                <use href="#proton" x="550" y="110"/>
                <use href="#proton" x="680" y="90"/>
                <use href="#proton" x="180" y="160"/>
                <use href="#proton" x="450" y="100"/>
                <use href="#proton" x="710" y="150"/>
                <!-- Matrix Protons -->
                <use href="#proton" x="200" y="420"/>
                <use href="#proton" x="600" y="450"/>
            </g>
            <g class="float-2">
                <use href="#proton" x="220" y="120"/>
                <use href="#proton" x="350" y="100"/>
                <use href="#proton" x="490" y="70"/>
                <use href="#proton" x="620" y="150"/>
                <use href="#proton" x="750" y="130"/>
                <use href="#proton" x="310" y="150"/>
                <use href="#proton" x="580" y="80"/>
                <!-- Matrix Protons -->
                <use href="#proton" x="400" y="380"/>
            </g>

            <!-- ANIMATED ELEMENTS -->

            <!-- Electron Transport -->
            <use href="#electron-spark" class="electron"/>
            <use href="#electron-spark" class="electron delayed"/>

            <!-- Proton Pumping (Complex I, III, IV) -->
            <use href="#proton" class="pump-1"/>
            <use href="#proton" class="pump-1 delayed"/>
            
            <use href="#proton" class="pump-3"/>
            <use href="#proton" class="pump-3 delayed"/>
            
            <use href="#proton" class="pump-4"/>
            <use href="#proton" class="pump-4 delayed"/>

            <!-- Chemiosmosis (H+ Flow through ATP Synthase) -->
            <use href="#proton" class="flow-h-1"/>
            <use href="#proton" class="flow-h-2"/>
            <use href="#proton" class="flow-h-3"/>

            <!-- ATP Synthesis Animation -->
            <!-- ADP + Pi entering -->
            <g class="adp-anim">
                <rect x="-20" y="-10" width="40" height="20" rx="10" fill="#FFA07A" filter="url(#shadow)"/>
                <text x="0" y="3" text-anchor="middle" font-family="Inter" font-size="10" font-weight="700" fill="#2C3E50">ADP</text>
                <circle cx="30" cy="0" r="9" fill="#FF6B6B" filter="url(#shadow)"/>
                <text x="30" y="3" text-anchor="middle" font-family="Inter" font-size="9" font-weight="700" fill="#ffffff">Pi</text>
            </g>

            <!-- ATP exiting -->
            <g class="atp-anim" filter="url(#glow)">
                <rect x="-25" y="-12" width="50" height="24" rx="12" fill="#F39C12"/>
                <text x="0" y="4" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#ffffff">ATP</text>
            </g>

        </svg>
    </div>

</body>
</html>
