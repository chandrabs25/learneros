<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Recognition and Pollen Tube Growth</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            max-height: 100vh;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .sci-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 10px;
            fill: #7F8C8D;
        }
        
        /* Animations */
        .pollen-group {
            animation: landGroup 20s ease-out infinite;
        }
        @keyframes landGroup {
            0% { transform: translateY(-40px); opacity: 0; }
            10%, 90% { transform: translateY(0); opacity: 1; }
            95%, 100% { transform: translateY(0); opacity: 0; }
        }

        .incompatible {
            animation: pulseBad 20s infinite;
            transform-origin: 400px 68px;
        }
        @keyframes pulseBad {
            0%, 10% { transform: scale(1); fill: #E74C3C; }
            12% { transform: scale(0.9); fill: #C0392B; }
            14% { transform: scale(1.1); fill: #E74C3C; }
            16% { transform: scale(0.9); fill: #C0392B; }
            18%, 100% { transform: scale(1); fill: #E74C3C; }
        }

        #comp1 {
            animation: hydrate1 20s infinite;
            transform-origin: 380px 75px;
        }
        #comp2 {
            animation: hydrate2 20s infinite;
            transform-origin: 420px 72px;
        }
        @keyframes hydrate1 {
            0%, 10% { transform: scale(1); }
            20%, 100% { transform: scale(1.2); }
        }
        @keyframes hydrate2 {
            0%, 10% { transform: scale(1); }
            20%, 100% { transform: scale(1.15); }
        }

        .tube-bg, .tube-fg {
            stroke-dasharray: 600;
            stroke-dashoffset: 600;
            animation: growTube 20s ease-in-out infinite;
        }
        @keyframes growTube {
            0%, 20% { stroke-dashoffset: 600; opacity: 0; }
            21% { opacity: 1; }
            75%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        .gamete {
            offset-path: path('M 380 75 C 380 90, 390 120, 390 180 C 390 250, 395 280, 395 310 C 395 340, 350 340, 350 385 C 350 430, 380 445, 382 415');
        }
        .g1 { animation: moveGamete1 20s linear infinite; }
        .g2 { animation: moveGamete2 20s linear infinite; }
        
        @keyframes moveGamete1 {
            0%, 22% { offset-distance: 0%; opacity: 0; }
            23% { offset-distance: 0%; opacity: 1; }
            75% { offset-distance: 100%; opacity: 1; }
            78%, 100% { offset-distance: 100%; opacity: 0; }
        }
        @keyframes moveGamete2 {
            0%, 24% { offset-distance: 0%; opacity: 0; }
            25% { offset-distance: 0%; opacity: 1; }
            77% { offset-distance: 100%; opacity: 1; }
            80%, 100% { offset-distance: 100%; opacity: 0; }
        }

        .signal {
            transform-origin: 382px 415px;
            animation: emitSignal 20s infinite;
        }
        @keyframes emitSignal {
            0%, 59% { transform: scale(0); opacity: 0; }
            60% { transform: scale(0); opacity: 1; }
            65% { transform: scale(2.5); opacity: 0; }
            66% { transform: scale(0); opacity: 1; }
            71% { transform: scale(2.5); opacity: 0; }
            72%, 100% { transform: scale(0); opacity: 0; }
        }

        .callout1 { animation: showC1 20s infinite; }
        .callout2 { animation: showC2 20s infinite; }
        .callout3 { animation: showC3 20s infinite; }
        
        @keyframes showC1 { 0%, 9% { opacity: 0; } 10%, 25% { opacity: 1; } 26%, 100% { opacity: 0; } }
        @keyframes showC2 { 0%, 34% { opacity: 0; } 35%, 60% { opacity: 1; } 61%, 100% { opacity: 0; } }
        @keyframes showC3 { 0%, 69% { opacity: 0; } 70%, 90% { opacity: 1; } 91%, 100% { opacity: 0; } }

        .fade-reset { animation: fadeOutReset 20s infinite; }
        @keyframes fadeOutReset {
            0%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.15"/>
            </filter>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" font-size="20" font-weight="700" fill="#2C3E50">Pollen-Pistil Interaction: Recognition & Germination</text>
        <text x="400" y="55" text-anchor="middle" font-size="12" font-weight="400" fill="#7F8C8D">Longitudinal Section of Pistil showing Chemotropic Pollen Tube Growth</text>

        <g class="fade-reset">
            <!-- Pistil (Stigma, Style, Ovary) -->
            <path d="M 360 80 Q 365 75 370 80 Q 375 75 380 80 Q 385 75 390 80 Q 395 75 400 80 Q 405 75 410 80 Q 415 75 420 80 Q 425 75 430 80 Q 435 75 440 80 Q 445 90 430 100 L 415 100 L 415 280 C 460 280 480 330 480 380 C 480 440 430 470 400 470 C 370 470 320 440 320 380 C 320 330 340 280 385 280 L 385 100 Q 370 90 360 80 Z" 
                  fill="#E9F7EF" stroke="#2ECC71" stroke-width="3" filter="url(#shadow)"/>
            
            <!-- Style internal tissue lines (subtle) -->
            <path d="M 395 100 L 395 280 M 405 100 L 405 280" stroke="#27AE60" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>

            <!-- Anatropous Ovule -->
            <!-- Integuments and Funiculus -->
            <path d="M 390 330 C 340 330 340 430 375 430 L 375 420 C 355 415 355 345 390 345 C 425 345 425 415 405 420 L 405 430 C 420 430 425 450 400 465 L 415 465 C 445 440 445 330 390 330 Z" 
                  fill="#D5F5E3" stroke="#27AE60" stroke-width="2"/>
            
            <!-- Embryo Sac -->
            <ellipse cx="390" cy="380" rx="22" ry="35" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>

            <!-- Embryo Sac Contents (7-celled, 8-nucleate) -->
            <!-- Antipodals -->
            <circle cx="380" cy="355" r="4" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="380" cy="355" r="1.5" fill="#2C3E50"/>
            <circle cx="390" cy="352" r="4" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="390" cy="352" r="1.5" fill="#2C3E50"/>
            <circle cx="400" cy="355" r="4" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="400" cy="355" r="1.5" fill="#2C3E50"/>

            <!-- Central Cell Polar Nuclei -->
            <circle cx="386" cy="380" r="2.5" fill="#2C3E50"/>
            <circle cx="394" cy="380" r="2.5" fill="#2C3E50"/>

            <!-- Egg Cell -->
            <circle cx="390" cy="402" r="6" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="390" cy="400" r="2.5" fill="#2C3E50"/>

            <!-- Synergids -->
            <ellipse cx="381" cy="408" rx="4.5" ry="6.5" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="381" cy="406" r="1.5" fill="#2C3E50"/>
            <ellipse cx="399" cy="408" rx="4.5" ry="6.5" fill="#E8F4FD" stroke="#4A90D9"/>
            <circle cx="399" cy="406" r="1.5" fill="#2C3E50"/>

            <!-- Filiform Apparatus -->
            <path d="M 378 412 Q 381 408 384 412" fill="none" stroke="#98D8C8" stroke-width="1.5"/>
            <path d="M 377 414 Q 381 410 385 414" fill="none" stroke="#98D8C8" stroke-width="1.5"/>
            <path d="M 396 412 Q 399 408 402 412" fill="none" stroke="#98D8C8" stroke-width="1.5"/>
            <path d="M 395 414 Q 399 410 403 414" fill="none" stroke="#98D8C8" stroke-width="1.5"/>

            <!-- Chemical Signals (Synergid Pulses) -->
            <circle cx="382" cy="415" r="10" fill="none" stroke="#98D8C8" stroke-width="2" class="signal" />
            <circle cx="382" cy="415" r="15" fill="none" stroke="#98D8C8" stroke-width="1" class="signal" style="animation-delay: 0.2s;" />

            <!-- Pollen Tube Path -->
            <!-- Background stroke for contrast -->
            <path d="M 380 75 C 380 90, 390 120, 390 180 C 390 250, 395 280, 395 310 C 395 340, 350 340, 350 385 C 350 430, 380 445, 382 415"
                  fill="none" stroke="#27AE60" stroke-width="6" class="tube-bg" />
            <!-- Foreground tube -->
            <path d="M 380 75 C 380 90, 390 120, 390 180 C 390 250, 395 280, 395 310 C 395 340, 350 340, 350 385 C 350 430, 380 445, 382 415"
                  fill="none" stroke="#D4EFDF" stroke-width="4" class="tube-fg" />

            <!-- Male Gametes -->
            <circle class="gamete g1" cx="0" cy="0" r="2.5" fill="#2C3E50" filter="url(#glow)"/>
            <circle class="gamete g2" cx="0" cy="0" r="2.5" fill="#2C3E50" filter="url(#glow)"/>

            <!-- Pollen Grains -->
            <g class="pollen-group">
                <!-- Compatible 1 (Germinating) -->
                <circle id="comp1" cx="380" cy="75" r="7" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1" filter="url(#shadow)"/>
                <circle cx="380" cy="75" r="2" fill="#D4AC0D" opacity="0.5"/> <!-- Germ pore hint -->
                
                <!-- Compatible 2 (Hydrating only) -->
                <circle id="comp2" cx="420" cy="72" r="7" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1" filter="url(#shadow)"/>
                
                <!-- Incompatible (Shriveled/Rejected) -->
                <path class="incompatible" d="M 400 61 C 404 61, 407 64, 406 68 C 408 72, 403 75, 400 74 C 396 75, 392 72, 394 68 C 393 64, 396 61, 400 61 Z" 
                      fill="#E74C3C" stroke="#C0392B" stroke-width="1" filter="url(#shadow)"/>
            </g>
        </g>

        <!-- Labels and Annotations (Static) -->
        <g stroke="#BDC3C7" stroke-width="1.5" fill="none">
            <!-- Left Side Labels -->
            <polyline points="260,90 340,90 365,85" />
            <circle cx="365" cy="85" r="2" fill="#BDC3C7" stroke="none"/>
            
            <polyline points="260,200 360,200 385,200" />
            <circle cx="385" cy="200" r="2" fill="#BDC3C7" stroke="none"/>
            
            <polyline points="260,380 300,380 320,380" />
            <circle cx="320" cy="380" r="2" fill="#BDC3C7" stroke="none"/>

            <!-- Right Side Labels -->
            <polyline points="540,65 440,65 425,72" />
            <circle cx="425" cy="72" r="2" fill="#BDC3C7" stroke="none"/>

            <polyline points="540,95 440,95 405,68" />
            <circle cx="405" cy="68" r="2" fill="#BDC3C7" stroke="none"/>

            <polyline points="540,250 420,250 395,250" />
            <circle cx="395" cy="250" r="2" fill="#BDC3C7" stroke="none"/>

            <polyline points="540,380 440,380 415,380" />
            <circle cx="415" cy="380" r="2" fill="#BDC3C7" stroke="none"/>

            <polyline points="540,430 420,430 400,425" />
            <circle cx="400" cy="425" r="2" fill="#BDC3C7" stroke="none"/>
        </g>

        <g font-size="12" font-weight="600">
            <!-- Left Text -->
            <text x="250" y="94" text-anchor="end">Stigma</text>
            <text x="250" y="204" text-anchor="end">Style</text>
            <text x="250" y="384" text-anchor="end">Ovary</text>
            
            <!-- Right Text -->
            <text x="550" y="69" text-anchor="start">Compatible Pollen</text>
            <text x="550" y="99" text-anchor="start">Incompatible Pollen</text>
            <text x="550" y="254" text-anchor="start">Pollen Tube</text>
            <text x="550" y="384" text-anchor="start">Embryo Sac <tspan class="sci-text">(7-celled, 8-nucleate)</tspan></text>
            <text x="550" y="434" text-anchor="start">Micropyle</text>
        </g>

        <!-- Dynamic Process Callouts -->
        <g class="callout1">
            <rect x="540" y="125" width="165" height="28" rx="4" fill="#FFFFFF" stroke="#F1C40F" stroke-width="2" filter="url(#shadow)"/>
            <text x="622.5" y="144" text-anchor="middle" font-size="11" font-weight="700" fill="#2C3E50">Chemical Recognition</text>
        </g>

        <g class="callout2">
            <rect x="110" y="240" width="140" height="28" rx="4" fill="#FFFFFF" stroke="#27AE60" stroke-width="2" filter="url(#shadow)"/>
            <text x="180" y="259" text-anchor="middle" font-size="11" font-weight="700" fill="#2C3E50">Chemotropic Growth</text>
        </g>

        <g class="callout3">
            <rect x="110" y="430" width="190" height="28" rx="4" fill="#FFFFFF" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
            <text x="205" y="449" text-anchor="middle" font-size="11" font-weight="700" fill="#2C3E50">Entry via Filiform Apparatus</text>
        </g>

        <!-- Legend -->
        <g transform="translate(40, 370)">
            <rect x="0" y="0" width="160" height="105" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1" filter="url(#shadow)"/>
            <text x="80" y="20" text-anchor="middle" font-size="12" font-weight="700">Legend</text>
            
            <circle cx="15" cy="35" r="5" fill="#F1C40F" />
            <text x="30" y="39" font-size="11">Compatible Pollen</text>
            
            <circle cx="15" cy="55" r="5" fill="#E74C3C" />
            <text x="30" y="59" font-size="11">Incompatible Pollen</text>
            
            <line x1="10" y1="75" x2="20" y2="75" stroke="#D4EFDF" stroke-width="4" />
            <text x="30" y="79" font-size="11">Pollen Tube</text>

            <circle cx="15" cy="95" r="3" fill="#2C3E50" />
            <text x="30" y="99" font-size="11">Male Gametes (n)</text>
        </g>
    </svg>
</body>
</html>
