<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aerobic Respiration & Respiratory Quotient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Animations */
        .glucose-mol {
            animation: glucose-enter 12s linear infinite;
        }
        .pyruvate-mol.p1 {
            animation: pyr1 12s linear infinite;
        }
        .pyruvate-mol.p2 {
            animation: pyr2 12s linear infinite;
        }
        .o2-mol {
            animation: o2-enter 12s ease-in-out infinite;
        }
        .co2-mol {
            animation: co2-exit 12s ease-in-out infinite;
        }
        .h2o-mol {
            animation: h2o-appear 12s ease-in-out infinite;
        }
        .atp-mol {
            animation: atp-radiate 12s ease-out infinite;
        }
        .mito-glow-effect {
            animation: mito-glow 12s ease-in-out infinite;
            transform-origin: 300px 250px;
        }
        .scale-group {
            animation: scale-fade 12s ease-in-out infinite;
        }
        .scale-beam {
            animation: scale-balance 12s ease-in-out infinite;
            transform-origin: 660px 320px;
        }
        .rq-result {
            animation: rq-pop 12s ease-in-out infinite;
            transform-origin: 660px 410px;
        }

        /* Keyframes */
        @keyframes glucose-enter {
            0% { opacity: 0; transform: translate(0px, 250px); }
            5% { opacity: 1; transform: translate(20px, 250px); }
            15% { opacity: 1; transform: translate(120px, 250px); }
            20%, 100% { opacity: 0; transform: translate(120px, 250px) scale(0.5); }
        }
        @keyframes pyr1 {
            0%, 19% { opacity: 0; transform: translate(120px, 245px); }
            20% { opacity: 1; transform: translate(120px, 245px); }
            25% { opacity: 1; transform: translate(240px, 230px); }
            26%, 100% { opacity: 0; transform: translate(240px, 230px); }
        }
        @keyframes pyr2 {
            0%, 19% { opacity: 0; transform: translate(120px, 255px); }
            20% { opacity: 1; transform: translate(120px, 255px); }
            25% { opacity: 1; transform: translate(240px, 270px); }
            26%, 100% { opacity: 0; transform: translate(240px, 270px); }
        }
        @keyframes o2-enter {
            0%, 24% { opacity: 0; transform: translate(var(--sx), var(--sy)); }
            25% { opacity: 1; transform: translate(var(--sx), var(--sy)); }
            45% { opacity: 1; transform: translate(var(--tx), var(--ty)); }
            50%, 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.5); }
        }
        @keyframes co2-exit {
            0%, 49% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.5); }
            50% { opacity: 1; transform: translate(var(--sx), var(--sy)) scale(1); }
            75% { opacity: 1; transform: translate(var(--sx), var(--sy)); }
            95% { opacity: 1; transform: translate(var(--tx), var(--ty)); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)); }
        }
        @keyframes h2o-appear {
            0%, 49% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0.5); }
            50% { opacity: 1; transform: translate(var(--sx), var(--sy)) scale(1); }
            95% { opacity: 1; transform: translate(calc(var(--sx) + 15px), calc(var(--sy) + 15px)); }
            100% { opacity: 0; transform: translate(calc(var(--sx) + 15px), calc(var(--sy) + 15px)); }
        }
        @keyframes atp-radiate {
            0%, 49% { opacity: 0; transform: translate(var(--sx), var(--sy)) scale(0); }
            50% { opacity: 1; transform: translate(var(--sx), var(--sy)) scale(1.2); }
            75% { opacity: 1; transform: translate(var(--tx), var(--ty)) scale(1); }
            90%, 100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.5); }
        }
        @keyframes mito-glow {
            0%, 45% { filter: drop-shadow(0 0 0px rgba(243,156,18,0)); transform: scale(1); }
            50%, 60% { filter: drop-shadow(0 0 15px rgba(243,156,18,0.6)); transform: scale(1.02); }
            75%, 100% { filter: drop-shadow(0 0 0px rgba(243,156,18,0)); transform: scale(1); }
        }
        @keyframes scale-fade {
            0%, 74% { opacity: 0; }
            75%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes scale-balance {
            0%, 74% { transform: rotate(-15deg); }
            75% { transform: rotate(-15deg); }
            85%, 95% { transform: rotate(0deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes rq-pop {
            0%, 84% { opacity: 0; transform: scale(0.5); }
            85% { opacity: 1; transform: scale(1.2); }
            90%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" aria-label="Animated diagram of Aerobic Respiration and Respiratory Quotient">
            <title>Aerobic Respiration: Stoichiometry and the Respiratory Quotient (RQ)</title>
            <desc>An animation showing 1 molecule of glucose entering a cell, 6 molecules of oxygen entering the mitochondrion, and 6 molecules of carbon dioxide leaving, demonstrating an RQ of 1.0.</desc>
            
            <defs>
                <!-- ATP Glow Filter -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Molecules -->
                <g id="glucose">
                    <polygon points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
                    <text x="0" y="4" font-size="10" text-anchor="middle" font-family="Roboto Mono" font-weight="bold" fill="#7D6608">G</text>
                </g>
                
                <g id="o2">
                    <circle cx="-4.5" cy="0" r="4.5" fill="#3498DB"/>
                    <circle cx="4.5" cy="0" r="4.5" fill="#3498DB"/>
                </g>
                
                <g id="co2">
                    <circle cx="-5" cy="0" r="4.5" fill="#95A5A6"/>
                    <circle cx="5" cy="0" r="4.5" fill="#95A5A6"/>
                </g>
                
                <g id="h2o">
                    <circle cx="0" cy="0" r="4.5" fill="#1ABC9C"/>
                    <circle cx="-3.5" cy="-3.5" r="2.5" fill="#A3E4D7"/>
                    <circle cx="3.5" cy="-3.5" r="2.5" fill="#A3E4D7"/>
                </g>
                
                <g id="atp">
                    <path d="M0,-12 L2.5,-4 L10,-4 L4.5,2.5 L7,10 L0,5.5 L-7,10 L-4.5,2.5 L-10,-4 L-2.5,-4 Z" fill="#F39C12" filter="url(#glow)"/>
                    <text x="0" y="2" font-size="5" text-anchor="middle" font-family="Inter" font-weight="bold" fill="#FFF">ATP</text>
                </g>
            </defs>

            <!-- Background -->
            <rect width="800" height="500" fill="#f8f9fa"/>

            <!-- Main Title -->
            <text x="400" y="35" text-anchor="middle" font-family="Inter" font-size="22" font-weight="bold" fill="#2C3E50">Aerobic Respiration: Glucose Oxidation &amp; RQ</text>

            <!-- Cell Membrane & Cytoplasm -->
            <rect x="20" y="60" width="500" height="370" rx="40" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4"/>
            <text x="50" y="95" font-family="Inter" font-size="16" font-weight="bold" fill="#4A90D9">Cytoplasm</text>
            <text x="120" y="220" font-family="Inter" font-size="12" font-weight="600" fill="#7F8C8D" opacity="0.7">Glycolysis</text>

            <!-- Nucleus (Partial) -->
            <path d="M 20 120 Q 70 245 20 370 Z" fill="#2C3E50" opacity="0.9"/>
            <text x="25" y="250" font-family="Inter" font-size="12" font-weight="bold" fill="#FFF" transform="rotate(-90 25 250)">Nucleus</text>

            <!-- Mitochondrion -->
            <g class="mito-glow-effect">
                <!-- Outer Membrane -->
                <path d="M 240 200 Q 300 220 360 200 Q 390 250 360 300 Q 300 280 240 300 Q 210 250 240 200 Z" fill="#E74C3C" stroke="#C0392B" stroke-width="4"/>
                <!-- Inner Membrane (Cristae) & Matrix -->
                <path d="M 245 210 L 260 240 L 270 215 L 290 260 L 300 222 L 320 260 L 330 218 L 350 240 L 355 210 Q 380 250 355 290 L 340 260 L 330 285 L 310 240 L 300 278 L 280 240 L 270 285 L 255 260 L 245 290 Q 215 250 245 210 Z" fill="#D63031" stroke="#FAD390" stroke-width="2.5" stroke-linejoin="round"/>
            </g>
            <text x="300" y="335" text-anchor="middle" font-family="Inter" font-size="14" font-weight="bold" fill="#FFF">Mitochondrion</text>
            <text x="300" y="350" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#FAD390">Krebs Cycle &amp; ETS</text>

            <!-- Animated Molecules -->
            <!-- Glucose & Pyruvate -->
            <use href="#glucose" class="glucose-mol" />
            <circle class="pyruvate-mol p1" cx="0" cy="0" r="4" fill="#F1C40F" />
            <circle class="pyruvate-mol p2" cx="0" cy="0" r="4" fill="#F1C40F" />

            <!-- Oxygen (O2) - 6 molecules -->
            <use href="#o2" class="o2-mol" style="--sx: 100px; --sy: 20px; --tx: 260px; --ty: 220px;" />
            <use href="#o2" class="o2-mol" style="--sx: 150px; --sy: 20px; --tx: 290px; --ty: 230px;" />
            <use href="#o2" class="o2-mol" style="--sx: 200px; --sy: 20px; --tx: 320px; --ty: 220px;" />
            <use href="#o2" class="o2-mol" style="--sx: 250px; --sy: 20px; --tx: 270px; --ty: 260px;" />
            <use href="#o2" class="o2-mol" style="--sx: 300px; --sy: 20px; --tx: 300px; --ty: 270px;" />
            <use href="#o2" class="o2-mol" style="--sx: 350px; --sy: 20px; --tx: 330px; --ty: 260px;" />

            <!-- Carbon Dioxide (CO2) - 6 molecules -->
            <use href="#co2" class="co2-mol" style="--sx: 260px; --sy: 220px; --tx: 100px; --ty: 460px;" />
            <use href="#co2" class="co2-mol" style="--sx: 290px; --sy: 230px; --tx: 150px; --ty: 460px;" />
            <use href="#co2" class="co2-mol" style="--sx: 320px; --sy: 220px; --tx: 200px; --ty: 460px;" />
            <use href="#co2" class="co2-mol" style="--sx: 270px; --sy: 260px; --tx: 250px; --ty: 460px;" />
            <use href="#co2" class="co2-mol" style="--sx: 300px; --sy: 270px; --tx: 300px; --ty: 460px;" />
            <use href="#co2" class="co2-mol" style="--sx: 330px; --sy: 260px; --tx: 350px; --ty: 460px;" />

            <!-- Water (H2O) - 6 molecules -->
            <use href="#h2o" class="h2o-mol" style="--sx: 255px; --sy: 235px;" />
            <use href="#h2o" class="h2o-mol" style="--sx: 285px; --sy: 245px;" />
            <use href="#h2o" class="h2o-mol" style="--sx: 315px; --sy: 235px;" />
            <use href="#h2o" class="h2o-mol" style="--sx: 265px; --sy: 275px;" />
            <use href="#h2o" class="h2o-mol" style="--sx: 295px; --sy: 285px;" />
            <use href="#h2o" class="h2o-mol" style="--sx: 325px; --sy: 275px;" />

            <!-- ATP - Radiating outward -->
            <use href="#atp" class="atp-mol" style="--sx: 280px; --sy: 250px; --tx: 120px; --ty: 140px;" />
            <use href="#atp" class="atp-mol" style="--sx: 300px; --sy: 250px; --tx: 200px; --ty: 100px;" />
            <use href="#atp" class="atp-mol" style="--sx: 320px; --sy: 250px; --tx: 440px; --ty: 130px;" />
            <use href="#atp" class="atp-mol" style="--sx: 280px; --sy: 270px; --tx: 130px; --ty: 350px;" />
            <use href="#atp" class="atp-mol" style="--sx: 300px; --sy: 270px; --tx: 220px; --ty: 390px;" />
            <use href="#atp" class="atp-mol" style="--sx: 320px; --sy: 270px; --tx: 450px; --ty: 360px;" />

            <!-- RQ Panel (Right Side) -->
            <rect x="540" y="60" width="240" height="370" rx="12" fill="#FFF" stroke="#BDC3C7" stroke-width="2"/>
            <text x="660" y="90" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16" fill="#2C3E50">Respiratory Quotient</text>
            
            <!-- Formula Box -->
            <rect x="550" y="110" width="220" height="60" rx="6" fill="#F8F9FA" stroke="#D5D8DC" stroke-width="1"/>
            <text x="660" y="130" text-anchor="middle" font-family="Roboto Mono" font-size="11" fill="#2C3E50">RQ = Volume of CO₂ evolved</text>
            <line x1="570" y1="140" x2="750" y2="140" stroke="#2C3E50" stroke-width="1"/>
            <text x="660" y="155" text-anchor="middle" font-family="Roboto Mono" font-size="11" fill="#2C3E50">Volume of O₂ consumed</text>

            <!-- Calculation Text -->
            <text x="660" y="195" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">RQ = <tspan fill="#95A5A6">6 CO₂</tspan> / <tspan fill="#3498DB">6 O₂</tspan></text>
            <text x="660" y="215" text-anchor="middle" font-family="Inter" font-size="12" fill="#7F8C8D">(for Carbohydrates)</text>
            
            <text x="660" y="240" text-anchor="middle" font-family="Inter" font-size="11" fill="#95A5A6">Note: Fats (Tripalmitin) RQ ≈ 0.7</text>

            <!-- Animated Balance Scale -->
            <g class="scale-group">
                <!-- Base -->
                <polygon points="660,320 630,380 690,380" fill="#BDC3C7"/>
                <rect x="656" y="320" width="8" height="60" fill="#95A5A6"/>
                
                <!-- Rotating Beam & Pans -->
                <g class="scale-beam">
                    <line x1="590" y1="320" x2="730" y2="320" stroke="#34495E" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Left Pan (CO2) -->
                    <circle cx="590" cy="320" r="20" fill="#95A5A6" stroke="#7F8C8D" stroke-width="2"/>
                    <text x="590" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF" font-family="Roboto Mono">6CO₂</text>
                    
                    <!-- Right Pan (O2) -->
                    <circle cx="730" cy="320" r="20" fill="#3498DB" stroke="#2980B9" stroke-width="2"/>
                    <text x="730" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#FFF" font-family="Roboto Mono">6O₂</text>
                </g>
                
                <!-- Popping Result -->
                <text class="rq-result" x="660" y="415" text-anchor="middle" font-family="Roboto Mono" font-size="20" font-weight="bold" fill="#27AE60">RQ = 1.0</text>
            </g>

            <!-- Overall Chemical Equation -->
            <rect x="100" y="445" width="600" height="40" rx="8" fill="#FFF" stroke="#BDC3C7" stroke-width="2"/>
            <text x="400" y="470" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="bold" fill="#2C3E50">
                <tspan fill="#F1C40F">C₆H₁₂O₆</tspan> + <tspan fill="#3498DB">6O₂</tspan> → <tspan fill="#95A5A6">6CO₂</tspan> + <tspan fill="#1ABC9C">6H₂O</tspan> + <tspan fill="#F39C12">Energy (ATP)</tspan>
            </text>

        </svg>
    </div>
</body>
</html>
