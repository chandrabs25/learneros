<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Chatelier's Principle: Common Ion Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* --- Animations --- */
        
        /* Floating Brownian Motion */
        @keyframes float1 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(8px, -12px); }
            66% { transform: translate(-8px, 8px); }
        }
        @keyframes float2 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(-10px, -5px); }
            66% { transform: translate(10px, 10px); }
        }
        @keyframes float3 {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(5px, 15px); }
            66% { transform: translate(-12px, -5px); }
        }

        .f1 { animation: float1 4s ease-in-out infinite; }
        .f2 { animation: float2 5s ease-in-out infinite; }
        .f3 { animation: float3 6s ease-in-out infinite; }

        /* Dropper Droplet */
        @keyframes droplet {
            0%, 20% { opacity: 0; transform: translateY(0); }
            22% { opacity: 1; transform: translateY(0); }
            26.66% { opacity: 1; transform: translateY(40px); }
            27%, 100% { opacity: 0; transform: translateY(40px); }
        }
        .droplet-anim { animation: droplet 15s infinite; }

        /* Added Ions Drop In */
        @keyframes dropIn {
            0%, 26.66% { transform: translateY(-150px); opacity: 0; }
            26.67% { opacity: 1; transform: translateY(-150px); }
            33.33%, 100% { transform: translateY(0); opacity: 1; }
        }
        .drop-in { animation: dropIn 15s cubic-bezier(0.25, 0.8, 0.25, 1) infinite; }

        /* Purple Stress Pulse */
        @keyframes pulsePurple {
            0%, 26.66% { opacity: 0; transform: scale(0.5); }
            26.67% { opacity: 1; transform: scale(1); }
            40% { opacity: 0; transform: scale(1.6); }
            100% { opacity: 0; }
        }
        .pulse { animation: pulsePurple 15s ease-out infinite; transform-origin: center; }

        /* Reaction: H+ and CH3COO- moving together */
        @keyframes reactH {
            0%, 40% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-30px); opacity: 1; }
            53.33%, 100% { transform: translateY(-30px); opacity: 0; }
        }
        .react-h { animation: reactH 15s ease-in-out infinite; }

        @keyframes reactAc {
            0%, 26.66% { transform: translateY(-150px); opacity: 0; }
            26.67% { opacity: 1; transform: translateY(-150px); }
            33.33%, 40% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(30px); opacity: 1; }
            53.33%, 100% { transform: translateY(30px); opacity: 0; }
        }
        .react-ac { animation: reactAc 15s ease-in-out infinite; }

        /* Reaction: Product CH3COOH appearing */
        @keyframes productAcid {
            0%, 53.32% { opacity: 0; transform: scale(0.5); }
            53.33%, 100% { opacity: 1; transform: scale(1); }
        }
        .product-acid { animation: productAcid 15s ease-out infinite; transform-origin: center; }

        /* Equilibrium Arrows */
        @keyframes forwardArrow {
            0%, 40% { stroke-width: 2; transform: scaleX(1); }
            45%, 60% { stroke-width: 1; transform: scaleX(0.7); }
            66.66%, 100% { stroke-width: 2; transform: scaleX(1); }
        }
        .arrow-fwd { animation: forwardArrow 15s ease-in-out infinite; transform-origin: 370px 445px; }

        @keyframes reverseArrow {
            0%, 40% { stroke-width: 2; transform: scaleX(1); }
            45%, 60% { stroke-width: 4; transform: scaleX(1.3); }
            66.66%, 100% { stroke-width: 2; transform: scaleX(1); }
        }
        .arrow-rev { animation: reverseArrow 15s ease-in-out infinite; transform-origin: 430px 455px; }

        /* Labels */
        @keyframes showStress {
            0%, 26.66% { opacity: 0; }
            26.67%, 40% { opacity: 1; }
            41%, 100% { opacity: 0; }
        }
        .label-stress { animation: showStress 15s infinite; }

        @keyframes showShift {
            0%, 40% { opacity: 0; }
            41%, 66.66% { opacity: 1; }
            67%, 100% { opacity: 0; }
        }
        .label-shift { animation: showShift 15s infinite; }

        /* Graph Reveal */
        @keyframes revealGraph {
            0% { clip-path: inset(0 100% 0 0); }
            100% { clip-path: inset(0 0 0 0); }
        }
        .graph-mask { animation: revealGraph 15s linear infinite; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Le Chatelier's Principle: Common Ion Effect</title>
        <desc>Animation showing the addition of acetate ions to an acetic acid equilibrium, causing a shift to the left to consume the added stress, visualized with a molecular beaker and a concentration-time graph.</desc>

        <!-- Definitions for Reusable Elements -->
        <defs>
            <!-- Glow Filter for Protons -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>

            <!-- Arrowheads -->
            <marker id="arrowRight" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
                <path d="M0,0 L6,3 L0,6 Z" fill="#F77F00"/>
            </marker>
            <marker id="arrowLeft" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
                <path d="M6,0 L0,3 L6,6 Z" fill="#7209B7"/>
            </marker>

            <!-- Molecule: Acetic Acid (CH3COOH) -->
            <g id="acetic-acid" transform="scale(0.8)">
                <!-- Bonds -->
                <line x1="-20" y1="0" x2="15" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="13" y1="-2" x2="28" y2="-22" stroke="#555" stroke-width="3" stroke-linecap="round"/>
                <line x1="17" y1="2" x2="32" y2="-18" stroke="#555" stroke-width="3" stroke-linecap="round"/>
                <line x1="15" y1="0" x2="35" y2="15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="35" y1="15" x2="50" y2="25" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-35" y2="-15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-40" y2="5" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-20" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <!-- Atoms -->
                <circle cx="-20" cy="0" r="12" fill="#404040"/> <!-- Methyl C -->
                <circle cx="15" cy="0" r="12" fill="#404040"/> <!-- Carboxyl C -->
                <circle cx="30" cy="-20" r="10" fill="#FF4444"/> <!-- O double bond -->
                <circle cx="35" cy="15" r="10" fill="#FF4444"/> <!-- O single bond -->
                <circle cx="50" cy="25" r="7" fill="#CCCCCC"/> <!-- Acidic H -->
                <circle cx="-35" cy="-15" r="7" fill="#CCCCCC"/> <!-- H -->
                <circle cx="-40" cy="5" r="7" fill="#CCCCCC"/> <!-- H -->
                <circle cx="-20" cy="20" r="7" fill="#CCCCCC"/> <!-- H -->
            </g>

            <!-- Molecule: Acetate Ion (CH3COO-) -->
            <g id="acetate-ion" transform="scale(0.8)">
                <!-- Bonds -->
                <line x1="-20" y1="0" x2="15" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="15" y1="0" x2="30" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="15" y1="0" x2="35" y2="15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-35" y2="-15" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-40" y2="5" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="-20" y1="0" x2="-20" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <!-- Resonance -->
                <path d="M 30,-20 Q 45,0 35,15" fill="none" stroke="#FF4444" stroke-width="3" stroke-dasharray="4,4"/>
                <!-- Atoms -->
                <circle cx="-20" cy="0" r="12" fill="#404040"/>
                <circle cx="15" cy="0" r="12" fill="#404040"/>
                <circle cx="30" cy="-20" r="10" fill="#FF4444"/>
                <circle cx="35" cy="15" r="10" fill="#FF4444"/>
                <circle cx="-35" cy="-15" r="7" fill="#CCCCCC"/>
                <circle cx="-40" cy="5" r="7" fill="#CCCCCC"/>
                <circle cx="-20" cy="20" r="7" fill="#CCCCCC"/>
                <!-- Charge -->
                <circle cx="45" cy="-5" r="7" fill="white" stroke="#FF4444" stroke-width="1"/>
                <text x="45" y="-2" font-family="Inter" font-size="12" font-weight="bold" fill="#FF4444" text-anchor="middle">-</text>
            </g>

            <!-- Molecule: Hydronium/Proton (H+) -->
            <g id="proton">
                <circle cx="0" cy="0" r="8" fill="#00B4D8" filter="url(#glow)"/>
                <text x="0" y="3.5" font-family="Inter" font-size="10" font-weight="bold" fill="white" text-anchor="middle">+</text>
            </g>
        </defs>

        <!-- ================= HEADER ================= -->
        <text x="400" y="40" font-family="Inter" font-size="22" font-weight="bold" fill="#333" text-anchor="middle">Le Chatelier's Principle: Common Ion Effect</text>

        <!-- ================= LEFT PANEL: REACTION VESSEL ================= -->
        <g id="reaction-vessel">
            <!-- Beaker Back -->
            <path d="M 60,100 L 60,380 A 20,20 0 0 0 80,400 L 320,400 A 20,20 0 0 0 340,380 L 340,100" fill="#ffffff" stroke="#ccc" stroke-width="4" stroke-linecap="round"/>
            
            <!-- Liquid -->
            <path d="M 62,140 Q 200,145 338,140 L 338,380 A 18,18 0 0 1 320,398 L 80,398 A 18,18 0 0 1 62,380 Z" fill="#e0f7fa" opacity="0.5"/>

            <!-- Dropper (External Source) -->
            <path d="M 190,40 L 190,80 L 205,95 L 215,95 L 230,80 L 230,40 Z" fill="#f0f0f0" stroke="#999" stroke-width="2"/>
            <rect x="195" y="40" width="30" height="30" fill="#FF4444" opacity="0.2"/>
            <circle cx="210" cy="100" r="4" fill="#FF4444" class="droplet-anim"/>

            <!-- Labels -->
            <text x="200" y="125" font-family="Inter" font-size="14" font-weight="bold" fill="#7209B7" text-anchor="middle" class="label-stress">Stress: Added CH₃COO⁻</text>

            <!-- === Molecules in Beaker === -->
            
            <!-- Initial Equilibrium Molecules (Always present) -->
            <g transform="translate(120, 200)"><g class="f1"><use href="#acetic-acid"/></g></g>
            <g transform="translate(280, 240)"><g class="f2"><use href="#acetic-acid"/></g></g>
            <g transform="translate(150, 320)"><g class="f3"><use href="#acetic-acid"/></g></g>
            <g transform="translate(260, 340)"><g class="f1"><use href="#acetic-acid"/></g></g>
            
            <g transform="translate(100, 260)"><g class="f2"><use href="#acetate-ion"/></g></g>
            <g transform="translate(300, 180)"><g class="f3"><use href="#acetate-ion"/></g></g>
            
            <g transform="translate(280, 300)"><g class="f1"><use href="#proton"/></g></g>

            <!-- Reacting Proton (H+) -->
            <g transform="translate(200, 280)"><g class="react-h"><g class="f2"><use href="#proton"/></g></g></g>

            <!-- Added Stress Molecules (CH3COO-) -->
            <!-- Added 1 -->
            <g transform="translate(120, 160)">
                <g class="drop-in">
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#7209B7" stroke-width="3" class="pulse"/>
                    <g class="f1"><use href="#acetate-ion"/></g>
                </g>
            </g>
            <!-- Added 2 -->
            <g transform="translate(280, 150)">
                <g class="drop-in">
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#7209B7" stroke-width="3" class="pulse"/>
                    <g class="f2"><use href="#acetate-ion"/></g>
                </g>
            </g>
            <!-- Added 3 -->
            <g transform="translate(220, 180)">
                <g class="drop-in">
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#7209B7" stroke-width="3" class="pulse"/>
                    <g class="f3"><use href="#acetate-ion"/></g>
                </g>
            </g>
            <!-- Added 4 (Reacting Acetate) -->
            <g transform="translate(200, 220)">
                <g class="react-ac">
                    <circle cx="0" cy="0" r="25" fill="none" stroke="#7209B7" stroke-width="3" class="pulse"/>
                    <g class="f1"><use href="#acetate-ion"/></g>
                </g>
            </g>

            <!-- Product Molecule (CH3COOH formed from shift) -->
            <g transform="translate(200, 250)">
                <g class="product-acid">
                    <g class="f2"><use href="#acetic-acid"/></g>
                </g>
            </g>

            <!-- Beaker Front Highlights -->
            <path d="M 70,120 L 70,370" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
        </g>

        <!-- ================= RIGHT PANEL: GRAPH ================= -->
        <g id="concentration-graph">
            <!-- Graph Background -->
            <rect x="440" y="100" width="320" height="280" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" rx="8"/>
            
            <!-- Grid Lines -->
            <line x1="440" y1="140" x2="760" y2="140" stroke="#f0f0f0" stroke-width="1"/>
            <line x1="440" y1="180" x2="760" y2="180" stroke="#f0f0f0" stroke-width="1"/>
            <line x1="440" y1="220" x2="760" y2="220" stroke="#f0f0f0" stroke-width="1"/>
            <line x1="440" y1="260" x2="760" y2="260" stroke="#f0f0f0" stroke-width="1"/>
            <line x1="440" y1="300" x2="760" y2="300" stroke="#f0f0f0" stroke-width="1"/>
            <line x1="440" y1="340" x2="760" y2="340" stroke="#f0f0f0" stroke-width="1"/>

            <!-- Axes -->
            <line x1="440" y1="380" x2="760" y2="380" stroke="#333" stroke-width="2"/>
            <line x1="440" y1="100" x2="440" y2="380" stroke="#333" stroke-width="2"/>

            <!-- Axis Labels -->
            <text x="600" y="410" font-family="Inter" font-size="12" fill="#555" text-anchor="middle">Time</text>
            <text x="420" y="240" font-family="Inter" font-size="12" fill="#555" text-anchor="middle" transform="rotate(-90, 420, 240)">Concentration [M]</text>

            <!-- Legend -->
            <rect x="450" y="110" width="110" height="65" fill="rgba(255,255,255,0.9)" stroke="#ddd" rx="4"/>
            <line x1="460" y1="125" x2="480" y2="125" stroke="#2D6A4F" stroke-width="3"/>
            <text x="485" y="129" font-family="Roboto Mono" font-size="11" fill="#333">[CH₃COOH]</text>
            <line x1="460" y1="145" x2="480" y2="145" stroke="#C1121F" stroke-width="3"/>
            <text x="485" y="149" font-family="Roboto Mono" font-size="11" fill="#333">[CH₃COO⁻]</text>
            <line x1="460" y1="165" x2="480" y2="165" stroke="#0077B6" stroke-width="3"/>
            <text x="485" y="169" font-family="Roboto Mono" font-size="11" fill="#333">[H⁺]</text>

            <!-- Event Markers (Vertical Dashed Lines) -->
            <line x1="520" y1="100" x2="520" y2="380" stroke="#ccc" stroke-dasharray="4,4" stroke-width="1.5"/>
            <text x="520" y="92" font-family="Inter" font-size="10" font-weight="bold" fill="#7209B7" text-anchor="middle">Stress</text>
            
            <line x1="560" y1="100" x2="560" y2="380" stroke="#ccc" stroke-dasharray="4,4" stroke-width="1.5"/>
            <text x="560" y="92" font-family="Inter" font-size="10" font-weight="bold" fill="#7209B7" text-anchor="middle">Shift</text>

            <!-- Animated Graph Lines -->
            <g class="graph-mask">
                <!-- [CH3COOH] Line (Green) -->
                <!-- Starts at 200, rises to 150 between 6s(560) and 10s(640) -->
                <path d="M 440,200 L 560,200 C 600,200 600,150 640,150 L 760,150" fill="none" stroke="#2D6A4F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- [CH3COO-] Line (Red) -->
                <!-- Starts at 320, spikes to 160 at 4s(520), drops to 240 between 6s(560) and 10s(640) -->
                <path d="M 440,320 L 520,320 L 520,160 L 560,160 C 600,160 600,240 640,240 L 760,240" fill="none" stroke="#C1121F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                
                <!-- [H+] Line (Blue) -->
                <!-- Starts at 340, drops to 370 between 6s(560) and 10s(640) -->
                <path d="M 440,340 L 560,340 C 600,340 600,370 640,370 L 760,370" fill="none" stroke="#0077B6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </g>
        </g>

        <!-- ================= BOTTOM: REACTION EQUATION ================= -->
        <g id="reaction-equation">
            <!-- Left Side -->
            <text x="360" y="450" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#333" text-anchor="end">
                CH<tspan dy="4" font-size="14">3</tspan><tspan dy="-4">COOH</tspan>
            </text>

            <!-- Equilibrium Arrows -->
            <!-- Forward Arrow -->
            <line x1="370" y1="442" x2="425" y2="442" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowRight)" class="arrow-fwd"/>
            <!-- Reverse Arrow -->
            <line x1="430" y1="452" x2="375" y2="452" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowLeft)" class="arrow-rev"/>

            <!-- Right Side -->
            <text x="440" y="450" font-family="Roboto Mono" font-size="18" font-weight="bold" fill="#333" text-anchor="start">
                CH<tspan dy="4" font-size="14">3</tspan><tspan dy="-4">COO⁻ + H⁺</tspan>
            </text>

            <!-- Shift Label -->
            <text x="400" y="485" font-family="Inter" font-size="14" font-weight="bold" fill="#7209B7" text-anchor="middle" class="label-shift">Shift: Equilibrium moves LEFT to consume excess ion</text>
        </g>

    </svg>
</div>

</body>
</html>
