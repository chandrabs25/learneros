<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Engineering: Bt Cotton Development</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7f8c8d; }
        .label { font-size: 12px; font-weight: 600; fill: #2C3E50; }
        .label-italic { font-size: 12px; font-style: italic; fill: #2C3E50; }
        .gene-text { font-family: 'Roboto Mono', monospace; font-style: italic; font-weight: 600; fill: #FF6B6B; }
        .note { font-size: 10px; fill: #95a5a6; }
        .process-label { font-size: 14px; font-weight: 700; fill: #E74C3C; }
        .legend-text { font-size: 11px; fill: #2C3E50; }

        /* Hardware Acceleration */
        .anim-layer { will-change: transform, opacity, filter; }

        /* Animations */
        #source-gene {
            animation: move-gene 20s infinite ease-in-out;
            transform-origin: 110px 178px;
        }

        #integrated-gene {
            animation: show-integrated 20s infinite ease-in-out;
        }

        #plasmid-vector {
            animation: move-plasmid 20s infinite ease-in-out;
            transform-origin: 280px 185px;
        }

        #nucleus-dna {
            animation: pulse-dna 20s infinite ease-in-out;
            transform-origin: 550px 140px;
        }

        #mrna-group {
            animation: move-mrna 20s infinite ease-in-out;
        }

        #bt-toxin {
            animation: show-toxin 20s infinite ease-in-out;
            transform-origin: 650px 180px;
        }

        #bollworm-group {
            animation: pest-action 20s infinite ease-in-out;
            transform-origin: 720px 300px;
        }

        #label-recombinant { animation: fade-recombinant 20s infinite ease-in-out; }
        #label-integration { animation: fade-integration 20s infinite ease-in-out; }
        #label-expression { animation: fade-expression 20s infinite ease-in-out; }

        /* Keyframes */
        @keyframes move-gene {
            0%, 5% { transform: translate(0, 0) scale(1); opacity: 1; }
            10% { transform: translate(0, -60px) scale(1.2); opacity: 1; }
            18% { transform: translate(162px, -60px) scale(1.2); opacity: 1; }
            20% { transform: translate(162px, -32px) rotate(15deg) scale(1); opacity: 1; }
            21%, 100% { opacity: 0; transform: translate(162px, -32px) rotate(15deg) scale(1); }
        }

        @keyframes show-integrated {
            0%, 20% { opacity: 0; }
            21%, 100% { opacity: 1; }
        }

        @keyframes move-plasmid {
            0%, 20% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            25%, 35% { transform: translate(0, 0) rotate(360deg); opacity: 1; }
            40% { transform: translate(0, 0) rotate(360deg); opacity: 1; }
            48% { transform: translate(270px, -45px) rotate(720deg) scale(0.4); opacity: 1; }
            50%, 100% { transform: translate(270px, -45px) rotate(720deg) scale(0.1); opacity: 0; }
        }

        @keyframes pulse-dna {
            0%, 48% { stroke: #FF6B6B; stroke-width: 3px; filter: none; transform: scale(1); }
            50%, 55% { stroke: #4A90D9; stroke-width: 5px; filter: drop-shadow(0 0 6px #4A90D9); transform: scale(1.1); }
            60%, 100% { stroke: #FF6B6B; stroke-width: 3px; filter: none; transform: scale(1); }
        }

        @keyframes move-mrna {
            0%, 58% { opacity: 0; transform: translate(0, 0); }
            60% { opacity: 1; transform: translate(0, 0); }
            65% { opacity: 1; transform: translate(70px, 40px); }
            70%, 100% { opacity: 0; transform: translate(70px, 40px); }
        }

        @keyframes show-toxin {
            0%, 65% { opacity: 0; transform: scale(0.5); filter: none; }
            68% { opacity: 1; transform: scale(1); filter: none; }
            75%, 82% { opacity: 1; transform: scale(1.2); filter: drop-shadow(0 0 10px #E74C3C); }
            85%, 100% { opacity: 0; transform: scale(0.5); filter: none; }
        }

        @keyframes pest-action {
            0%, 75% { transform: translate(0, 0); opacity: 1; filter: none; }
            80% { transform: translate(-70px, -120px); opacity: 1; filter: none; }
            85% { transform: translate(-70px, -120px) scale(0.8); opacity: 1; filter: grayscale(100%) sepia(50%) hue-rotate(-50deg); }
            90%, 100% { transform: translate(-70px, -100px) scale(0.5) rotate(180deg); opacity: 0; }
        }

        @keyframes fade-recombinant { 0%, 20% { opacity: 0; } 25%, 35% { opacity: 1; } 40%, 100% { opacity: 0; } }
        @keyframes fade-integration { 0%, 45% { opacity: 0; } 50%, 58% { opacity: 1; } 60%, 100% { opacity: 0; } }
        @keyframes fade-expression { 0%, 65% { opacity: 0; } 70%, 82% { opacity: 1; } 85%, 100% { opacity: 0; } }

    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrow Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" />
            </marker>
            
            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#ffffff" rx="12" />
        
        <!-- Header -->
        <text x="400" y="40" class="title" text-anchor="middle">Genetic Engineering: Bt Cotton Development</text>
        <text x="400" y="60" class="subtitle" text-anchor="middle">Transferring the insecticidal <tspan class="gene-text" style="font-size: 14px;">cryIAc</tspan> gene to confer pest resistance</text>

        <!-- Legend -->
        <g transform="translate(650, 20)">
            <rect x="0" y="0" width="130" height="65" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1" rx="5" />
            <circle cx="15" cy="15" r="4" fill="#FF6B6B" />
            <text x="25" y="19" class="legend-text">DNA / cry Gene</text>
            <path d="M 11 30 Q 15 26 19 30" fill="none" stroke="#FFA07A" stroke-width="2" stroke-dasharray="2 1" />
            <text x="25" y="34" class="legend-text">mRNA</text>
            <polygon points="15,40 19,45 15,50 11,45" fill="#98D8C8" />
            <text x="25" y="49" class="legend-text">Bt Toxin Protein</text>
        </g>

        <!-- Divider Line -->
        <line x1="380" y1="90" x2="380" y2="460" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="5 5" />
        <text x="190" y="450" class="label" fill="#bdc3c7" text-anchor="middle">Microbial / Molecular Stage</text>
        <text x="590" y="450" class="label" fill="#bdc3c7" text-anchor="middle">Plant Tissue / Organism Stage</text>

        <!-- ========================================== -->
        <!-- LEFT SIDE: MICROBIAL & MOLECULAR           -->
        <!-- ========================================== -->

        <!-- Bacterium -->
        <g id="bacterium-group">
            <rect x="30" y="150" width="140" height="60" rx="30" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
            <!-- Bacterial Chromosome -->
            <path d="M 50 180 Q 60 150 70 180 T 90 170 T 110 190" fill="none" stroke="#2C3E50" stroke-width="2" opacity="0.4" />
            <!-- Source Gene (Animated) -->
            <path id="source-gene" class="anim-layer" d="M 100 185 Q 110 170 120 185" fill="none" stroke="#FF6B6B" stroke-width="5" stroke-linecap="round" />
            
            <text x="100" y="235" class="label-italic" text-anchor="middle">Bacillus thuringiensis</text>
            <text x="100" y="250" class="note" text-anchor="middle" style="font-size: 11px;">(Source of <tspan class="gene-text" style="font-size: 11px;">cry</tspan> gene)</text>
        </g>

        <!-- Ti Plasmid Vector -->
        <g id="vector-group">
            <g id="plasmid-vector" class="anim-layer">
                <!-- Plasmid Ring with Gap -->
                <path d="M 280 145 A 40 40 0 1 1 265 148" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round" />
                <!-- Integrated Gene (Appears later) -->
                <path id="integrated-gene" class="anim-layer" d="M 265 148 Q 272 140 280 145" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" />
            </g>
            <text x="280" y="245" class="label" text-anchor="middle">Ti Plasmid Vector</text>
            <text x="280" y="260" class="note" text-anchor="middle">Agrobacterium tumefaciens</text>
        </g>

        <!-- Process Labels (Animated) -->
        <text id="label-recombinant" x="280" y="110" class="process-label anim-layer" text-anchor="middle">Recombinant DNA</text>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: PLANT CELL & PEST              -->
        <!-- ========================================== -->

        <!-- Plant Cell -->
        <g id="plant-cell-group">
            <!-- Cell Wall -->
            <rect x="420" y="90" width="340" height="340" rx="15" fill="#E8F4FD" stroke="#2ECC71" stroke-width="8" />
            <text x="420" y="80" class="label" fill="#2ECC71">Plant Cell (Cotton)</text>
            
            <!-- Central Vacuole -->
            <rect x="440" y="220" width="300" height="190" rx="20" fill="#ffffff" stroke="#4A90D9" stroke-width="2" opacity="0.8" />
            <text x="590" y="320" class="label" fill="#4A90D9" opacity="0.4" text-anchor="middle">Central Vacuole</text>

            <!-- Nucleus -->
            <circle cx="550" cy="140" r="45" fill="#2C3E50" stroke="#4A90D9" stroke-width="3" />
            <!-- Plant DNA inside Nucleus -->
            <path id="nucleus-dna" class="anim-layer" d="M 520 140 Q 530 110 540 150 T 560 130 T 580 140" fill="none" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round" />
            <text x="550" y="205" class="label" fill="#2C3E50" text-anchor="middle">Nucleus</text>

            <!-- Process Label: Stable Integration -->
            <text id="label-integration" x="550" y="80" class="process-label anim-layer" text-anchor="middle">Stable Integration</text>

            <!-- mRNA (Animated) -->
            <g id="mrna-group" class="anim-layer">
                <path d="M 550 140 Q 560 155 570 140 T 590 140" fill="none" stroke="#FFA07A" stroke-width="3" stroke-dasharray="4 2" />
                <text x="595" y="135" class="label" fill="#FFA07A" style="font-size: 10px;">mRNA</text>
            </g>

            <!-- Bt Toxin Crystals (Animated) -->
            <g id="bt-toxin" class="anim-layer">
                <!-- Crystal 1 -->
                <polygon points="650,160 665,180 650,200 635,180" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5" />
                <!-- Crystal 2 -->
                <polygon points="675,170 685,185 675,200 665,185" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5" />
                <text x="660" y="215" class="label" fill="#2C3E50" text-anchor="middle" style="font-size: 10px;">Protoxin Crystals</text>
            </g>

            <!-- Process Label: Expression -->
            <text id="label-expression" x="650" y="140" class="process-label anim-layer" text-anchor="middle">Expression of Bt Toxin</text>
        </g>

        <!-- Pest (Bollworm) -->
        <g id="bollworm-group" class="anim-layer">
            <!-- Body segments -->
            <path d="M 680 300 Q 690 280 700 300 Q 710 280 720 300 Q 730 280 740 300 Q 750 280 760 300 Q 770 280 780 300" fill="none" stroke="#F39C12" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
            <!-- Legs -->
            <path d="M 690 305 L 690 315 M 710 305 L 710 315 M 730 305 L 730 315 M 750 305 L 750 315 M 770 305 L 770 315" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" />
            <!-- Head -->
            <circle cx="675" cy="300" r="10" fill="#E74C3C" stroke="#2C3E50" stroke-width="2" />
            <!-- Eye -->
            <circle cx="672" cy="297" r="2" fill="#ffffff" />
            
            <text x="730" y="335" class="label" text-anchor="middle">Lepidopteran Pest</text>
            <text x="730" y="350" class="label-italic" text-anchor="middle">(Bollworm)</text>
        </g>

        <!-- Hardy-Weinberg Note -->
        <g transform="translate(20, 475)">
            <text x="0" y="0" class="note" font-weight="600">Population Genetics Note:</text>
            <text x="0" y="14" class="note">This introduces a strong selective pressure, altering allele frequencies in the pest population (p² + 2pq + q² = 1).</text>
        </g>

    </svg>

</body>
</html>
