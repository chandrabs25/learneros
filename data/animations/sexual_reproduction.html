<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexual Reproduction: Meiosis & Fertilization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #666; }
        .label-bold { font-size: 16px; font-weight: 700; fill: #2C3E50; }
        .label-mono { font-family: 'Roboto Mono', monospace; font-size: 13px; font-weight: 700; }
        .label-small { font-size: 12px; fill: #666; }
        .legend-text { font-size: 11px; fill: #2C3E50; }

        /* Colors */
        .color-male { fill: #D32F2F; }
        .color-female { fill: #FF8A80; }
        .color-zygote { fill: #27AE60; }

        /* Animations */
        @keyframes parent-anim {
            0%, 15% { transform: scale(1); opacity: 1; }
            7% { transform: scale(1.03); opacity: 1; }
            18%, 85% { transform: scale(1); opacity: 0; }
            90%, 100% { transform: scale(1); opacity: 1; }
        }

        @keyframes sperm-body-anim {
            0%, 15% { transform: translate(200px, 160px); opacity: 0; }
            18% { transform: translate(200px, 160px); opacity: 1; animation-timing-function: ease-in-out; }
            35%, 40% { transform: translate(340px, 420px); opacity: 1; animation-timing-function: ease-in-out; }
            45%, 100% { transform: translate(365px, 420px); opacity: 0; }
        }

        @keyframes sperm-nucleus-anim {
            0%, 15% { transform: translate(200px, 160px); opacity: 0; }
            18% { transform: translate(200px, 160px); opacity: 1; animation-timing-function: ease-in-out; }
            35%, 40% { transform: translate(340px, 420px); opacity: 1; animation-timing-function: ease-in-out; }
            45% { transform: translate(380px, 420px); opacity: 1; animation-timing-function: ease-in-out; }
            50%, 100% { transform: translate(400px, 420px); opacity: 0; }
        }

        @keyframes egg-body-anim {
            0%, 15% { transform: translate(600px, 160px); opacity: 0; filter: drop-shadow(0 0 0px transparent); }
            18% { transform: translate(600px, 160px); opacity: 1; animation-timing-function: ease-in-out; filter: drop-shadow(0 0 0px transparent); }
            35%, 50% { transform: translate(400px, 420px); opacity: 1; filter: drop-shadow(0 0 0px transparent); }
            55%, 85% { transform: translate(400px, 420px); opacity: 1; filter: drop-shadow(0 0 15px rgba(243, 156, 18, 0.8)); }
            90%, 100% { transform: translate(400px, 420px); opacity: 0; filter: drop-shadow(0 0 0px transparent); }
        }

        @keyframes egg-nucleus-anim {
            0%, 15% { transform: translate(600px, 160px); opacity: 0; }
            18% { transform: translate(600px, 160px); opacity: 1; animation-timing-function: ease-in-out; }
            35%, 45% { transform: translate(400px, 420px); opacity: 1; animation-timing-function: ease-in-out; }
            50%, 100% { transform: translate(400px, 420px); opacity: 0; }
        }

        @keyframes zygote-nucleus-anim {
            0%, 45% { transform: translate(400px, 420px) scale(0.5); opacity: 0; }
            50%, 85% { transform: translate(400px, 420px) scale(1); opacity: 1; }
            90%, 100% { transform: translate(400px, 420px) scale(1); opacity: 0; }
        }

        @keyframes sperm-tip-anim {
            0%, 25% { stroke: #D32F2F; }
            30%, 100% { stroke: #FF8A80; }
        }

        @keyframes egg-tip-anim {
            0%, 25% { stroke: #FF8A80; }
            30%, 100% { stroke: #D32F2F; }
        }

        @keyframes tail-wiggle {
            0%, 100% { transform: rotate(-8deg); }
            50% { transform: rotate(8deg); }
        }

        @keyframes flow-line-anim {
            to { stroke-dashoffset: -24; }
        }

        @keyframes fade-in-out {
            0%, 15% { opacity: 0; }
            25%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes zygote-label-anim {
            0%, 50% { opacity: 0; }
            55%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        /* Apply Animations */
        .parent-male { animation: parent-anim 12s infinite; transform-origin: 200px 160px; }
        .parent-female { animation: parent-anim 12s infinite; transform-origin: 600px 160px; }
        .sperm-body { animation: sperm-body-anim 12s infinite; }
        .sperm-nucleus { animation: sperm-nucleus-anim 12s infinite; }
        .egg-body { animation: egg-body-anim 12s infinite; transform-origin: center; }
        .egg-nucleus { animation: egg-nucleus-anim 12s infinite; }
        .zygote-nucleus { animation: zygote-nucleus-anim 12s infinite; transform-origin: center; }
        
        .sperm-tip { animation: sperm-tip-anim 12s infinite; }
        .egg-tip { animation: egg-tip-anim 12s infinite; }
        .tail-wiggle { animation: tail-wiggle 0.5s ease-in-out infinite; transform-origin: -18px 0; }
        .flow-line { animation: flow-line-anim 1s linear infinite; }
        
        .gamete-label { animation: fade-in-out 12s infinite; }
        .zygote-label { animation: zygote-label-anim 12s infinite; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">The Cycle of Sexual Reproduction</title>
        <desc id="svg-desc">Animated diagram showing meiosis, gametogenesis, and syngamy. Diploid parent cells divide to form haploid gametes (sperm and egg) which then fuse to form a diploid zygote, demonstrating crossing over and genetic variation.</desc>

        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" opacity="0.5"/>
            </marker>
        </defs>

        <!-- Static Background Elements -->
        <rect width="800" height="600" fill="#ffffff" />
        
        <!-- Header -->
        <text x="400" y="45" text-anchor="middle" class="title">Sexual Reproduction: Meiosis &amp; Fertilization</text>
        <text x="400" y="70" text-anchor="middle" class="subtitle">The cycle of chromosome reduction and restoration</text>

        <!-- Legend -->
        <g transform="translate(630, 20)">
            <rect x="0" y="0" width="150" height="85" fill="#f8f9fa" stroke="#e0e0e0" rx="6" />
            <line x1="10" y1="20" x2="25" y2="20" stroke="#D32F2F" stroke-width="3" stroke-linecap="round"/>
            <text x="35" y="24" class="legend-text">Paternal DNA</text>
            
            <line x1="10" y1="45" x2="25" y2="45" stroke="#FF8A80" stroke-width="3" stroke-linecap="round"/>
            <text x="35" y="49" class="legend-text">Maternal DNA</text>
            
            <circle cx="17" cy="70" r="5" fill="#2C3E50" opacity="0.8"/>
            <text x="35" y="74" class="legend-text">Nucleus</text>
        </g>

        <!-- Flow Lines -->
        <path d="M 200 230 C 200 320, 340 320, 340 400" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="8,8" opacity="0.3" class="flow-line" marker-end="url(#arrow)"/>
        <path d="M 600 230 C 600 320, 400 320, 400 380" fill="none" stroke="#2C3E50" stroke-width="2" stroke-dasharray="8,8" opacity="0.3" class="flow-line" marker-end="url(#arrow)"/>

        <!-- Static Labels -->
        <text x="200" y="100" text-anchor="middle" class="label-bold">Male Parent</text>
        <text x="200" y="120" text-anchor="middle" class="label-mono color-male">P Generation (2n)</text>
        
        <text x="600" y="100" text-anchor="middle" class="label-bold">Female Parent</text>
        <text x="600" y="120" text-anchor="middle" class="label-mono color-female">P Generation (2n)</text>

        <text x="400" y="260" text-anchor="middle" class="label-bold">MEIOSIS</text>
        <text x="400" y="280" text-anchor="middle" class="label-mono" fill="#666">Reduction Division (2n → n)</text>

        <text x="400" y="500" text-anchor="middle" class="label-bold">SYNGAMY</text>
        <text x="400" y="520" text-anchor="middle" class="label-mono" fill="#666">Fertilization (n + n → 2n)</text>

        <!-- Animated Labels -->
        <g class="gamete-label">
            <text x="240" y="350" text-anchor="middle" class="label-bold">Sperm</text>
            <text x="240" y="370" text-anchor="middle" class="label-mono color-male">Gamete (n)</text>
            
            <text x="560" y="350" text-anchor="middle" class="label-bold">Egg</text>
            <text x="560" y="370" text-anchor="middle" class="label-mono color-female">Gamete (n)</text>
        </g>

        <g class="zygote-label">
            <text x="400" y="560" text-anchor="middle" class="label-bold">ZYGOTE</text>
            <text x="400" y="580" text-anchor="middle" class="label-mono color-zygote">Diploid (2n)</text>
        </g>

        <!-- ================= ANIMATED ELEMENTS ================= -->

        <!-- Male Parent (2n) -->
        <g class="parent-male">
            <circle cx="0" cy="0" r="45" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="0" cy="0" r="25" fill="#2C3E50" opacity="0.8"/>
            <!-- Homologous Pair -->
            <g transform="translate(-10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g transform="translate(10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
            </g>
        </g>

        <!-- Female Parent (2n) -->
        <g class="parent-female">
            <circle cx="0" cy="0" r="45" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="0" cy="0" r="25" fill="#2C3E50" opacity="0.8"/>
            <!-- Homologous Pair -->
            <g transform="translate(-10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g transform="translate(10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
            </g>
        </g>

        <!-- Sperm Body (n) -->
        <g class="sperm-body">
            <g class="tail-wiggle">
                <path d="M-18,0 Q-30,12 -45,0 T-75,0" fill="none" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>
            </g>
            <ellipse cx="0" cy="0" rx="18" ry="12" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        </g>

        <!-- Sperm Nucleus (n) -->
        <g class="sperm-nucleus">
            <circle cx="0" cy="0" r="9" fill="#2C3E50" opacity="0.8"/>
            <!-- Recombinant Chromosome -->
            <path d="M-4,-8 L4,8 M4,-8 L-4,8" stroke="#D32F2F" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M4,-8 L1,-2" stroke-width="2.5" stroke-linecap="round" class="sperm-tip"/>
        </g>

        <!-- Egg Body (n -> 2n) -->
        <g class="egg-body">
            <circle cx="0" cy="0" r="40" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        </g>

        <!-- Egg Nucleus (n) -->
        <g class="egg-nucleus">
            <circle cx="0" cy="0" r="20" fill="#2C3E50" opacity="0.8"/>
            <!-- Recombinant Chromosome -->
            <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
            <path d="M6,-12 L2,-4" stroke-width="4" stroke-linecap="round" class="egg-tip"/>
        </g>

        <!-- Zygote Nucleus (2n) -->
        <g class="zygote-nucleus">
            <circle cx="0" cy="0" r="25" fill="#2C3E50" opacity="0.8"/>
            <!-- Restored Homologous Pair (Both Recombinant) -->
            <g transform="translate(-10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
                <path d="M6,-12 L2,-4" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
            </g>
            <g transform="translate(10, 0)">
                <path d="M-6,-12 L6,12 M6,-12 L-6,12" stroke="#D32F2F" stroke-width="4" stroke-linecap="round"/>
                <path d="M4,-8 L1,-2" stroke="#FF8A80" stroke-width="4" stroke-linecap="round"/>
            </g>
        </g>

    </svg>
</div>

</body>
</html>
