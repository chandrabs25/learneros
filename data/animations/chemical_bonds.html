<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biocatalysis: Enzymatic Hydrolysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        #diagram-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #E8F4FD; /* Cytoplasm color */
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(44, 62, 80, 0.1);
            display: block;
        }

        /* CSS Animations */
        #glcA { animation: glcAMove 12s infinite ease-in-out; }
        #glcB { animation: glcBMove 12s infinite ease-in-out; }
        #bondGroup { animation: bondMove 12s infinite ease-in-out; }
        #bondVibrate { animation: vibrate 12s infinite linear; }
        #water { animation: waterMove 12s infinite ease-in-out; }
        .waterSplit { animation: splitAppear 12s infinite; }
        #pulse { animation: pulseAnim 12s infinite ease-out; }
        #inducedFitLabel { animation: inducedFitFade 12s infinite ease-in-out; }
        #bondLabelGroup { animation: bondLabelFade 12s infinite ease-in-out; }
        .productLabel { animation: productLabelFade 12s infinite ease-in-out; }
        #substrateLabel { animation: substrateLabelFade 12s infinite ease-in-out; }

        @keyframes glcAMove {
            0%, 10% { transform: translate(355px, 60px); opacity: 0; }
            15% { opacity: 1; }
            25%, 58% { transform: translate(355px, 210px); opacity: 1; }
            75%, 85% { transform: translate(200px, 360px); opacity: 1; }
            90%, 100% { transform: translate(200px, 360px); opacity: 0; }
        }

        @keyframes glcBMove {
            0%, 10% { transform: translate(445px, 60px); opacity: 0; }
            15% { opacity: 1; }
            25%, 58% { transform: translate(445px, 210px); opacity: 1; }
            75%, 85% { transform: translate(600px, 360px); opacity: 1; }
            90%, 100% { transform: translate(600px, 360px); opacity: 0; }
        }

        @keyframes bondMove {
            0%, 10% { transform: translate(400px, 60px); opacity: 0; }
            15% { opacity: 1; }
            25%, 41.5% { transform: translate(400px, 210px); opacity: 1; }
            41.6%, 100% { transform: translate(400px, 210px); opacity: 0; }
        }

        @keyframes vibrate {
            0%, 25% { transform: translateX(0) rotate(0); }
            26%, 28%, 30%, 32%, 34%, 36%, 38%, 40% { transform: translateX(-2px) rotate(-2deg); }
            27%, 29%, 31%, 33%, 35%, 37%, 39%, 41% { transform: translateX(2px) rotate(2deg); }
            42%, 100% { transform: translateX(0) rotate(0); }
        }

        @keyframes waterMove {
            0%, 20% { transform: translate(400px, 80px); opacity: 0; }
            25% { opacity: 1; }
            40%, 41.5% { transform: translate(400px, 170px); opacity: 1; }
            41.6%, 100% { transform: translate(400px, 170px); opacity: 0; }
        }

        @keyframes splitAppear {
            0%, 41.5% { opacity: 0; }
            41.6%, 100% { opacity: 1; }
        }

        @keyframes pulseAnim {
            0%, 41% { r: 0; opacity: 0; stroke-width: 8px; }
            41.6% { r: 15px; opacity: 1; stroke-width: 8px; }
            46% { r: 90px; opacity: 0; stroke-width: 1px; }
            100% { r: 90px; opacity: 0; stroke-width: 0; }
        }

        @keyframes inducedFitFade {
            0%, 15% { opacity: 0; transform: translateY(10px); }
            20%, 45% { opacity: 1; transform: translateY(0); }
            50%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        @keyframes bondLabelFade {
            0%, 15% { opacity: 0; }
            20%, 41.5% { opacity: 1; }
            41.6%, 100% { opacity: 0; }
        }

        @keyframes productLabelFade {
            0%, 57% { opacity: 0; }
            58%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes substrateLabelFade {
            0%, 10% { transform: translate(400px, 20px); opacity: 0; }
            15% { opacity: 1; }
            25%, 41.5% { transform: translate(400px, 150px); opacity: 1; }
            41.6%, 100% { transform: translate(400px, 150px); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="diagram-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing an enzyme breaking a chemical bond via hydrolysis">
        <title>Biocatalysis: The Dynamics of Bond Cleavage in Enzymatic Reactions</title>
        <desc>Animation of Maltase enzyme performing hydrolysis on Maltose to produce two Glucose molecules.</desc>

        <defs>
            <!-- Drop shadow for the enzyme -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#2C3E50" flood-opacity="0.15"/>
            </filter>
            
            <!-- Soft glow for active site / enzyme surface -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrowhead marker for reaction coordinates -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#95a5a6" />
            </marker>
        </defs>

        <!-- Background Cytoplasm Particles -->
        <g opacity="0.4">
            <circle cx="120" cy="100" r="3" fill="#3498DB"><animate attributeName="cy" values="100; 80; 100" dur="8s" repeatCount="indefinite"/></circle>
            <circle cx="700" cy="380" r="4" fill="#3498DB"><animate attributeName="cy" values="380; 410; 380" dur="10s" repeatCount="indefinite"/></circle>
            <circle cx="180" cy="420" r="2" fill="#3498DB"><animate attributeName="cy" values="420; 390; 420" dur="7s" repeatCount="indefinite"/></circle>
            <circle cx="650" cy="120" r="5" fill="#3498DB"><animate attributeName="cy" values="120; 150; 120" dur="11s" repeatCount="indefinite"/></circle>
            <circle cx="50" cy="250" r="4" fill="#3498DB"><animate attributeName="cy" values="250; 220; 250" dur="9s" repeatCount="indefinite"/></circle>
        </g>

        <!-- Static Titles and Equations -->
        <text x="400" y="45" font-family="Inter" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">Enzymatic Hydrolysis: Breaking the Glycosidic Bond</text>
        
        <text x="400" y="475" font-family="'Roboto Mono', monospace" font-size="16" text-anchor="middle" fill="#2C3E50" font-weight="500">
            <tspan fill="#F39C12">Maltose</tspan> + <tspan fill="#3498DB">H<tspan dy="4" font-size="12">2</tspan><tspan dy="-4">O</tspan></tspan> 
            <tspan fill="#2C3E50"> ── Maltase ──→ </tspan> 
            <tspan fill="#F39C12">2 Glucose</tspan>
        </text>

        <!-- Legend -->
        <g transform="translate(30, 380)">
            <rect x="0" y="0" width="160" height="95" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" opacity="0.9"/>
            <text x="80" y="20" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Legend</text>
            
            <rect x="15" y="30" width="12" height="12" rx="2" fill="#98D8C8"/>
            <text x="35" y="41" font-family="Inter" font-size="12" fill="#2C3E50">Enzyme</text>
            
            <rect x="15" y="50" width="12" height="12" rx="2" fill="#F39C12"/>
            <text x="35" y="61" font-family="Inter" font-size="12" fill="#2C3E50">Carbohydrate</text>
            
            <line x1="15" y1="76" x2="27" y2="76" stroke="#FF6B6B" stroke-width="3"/>
            <text x="35" y="81" font-family="Inter" font-size="12" fill="#2C3E50">Glycosidic Bond</text>
        </g>

        <!-- Reaction Coordinate Arrows -->
        <path d="M 400,90 Q 450,130 420,160" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
        <path d="M 340,240 Q 250,280 220,320" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)"/>
        <path d="M 460,240 Q 550,280 580,320" fill="none" stroke="#95a5a6" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow)"/>

        <!-- Enzyme (Maltase) -->
        <g filter="url(#shadow)">
            <path id="enzyme" fill="#98D8C8" stroke="#76B8A8" stroke-width="3" filter="url(#glow)">
                <!-- SMIL Animation for Induced Fit -->
                <animate attributeName="d" dur="12s" repeatCount="indefinite" keyTimes="0; 0.15; 0.25; 0.58; 0.75; 1" 
                values="
                    M 200,350 C 150,250 200,180 300,180 C 340,180 350,240 400,240 C 450,240 460,180 500,180 C 600,180 650,250 600,350 C 550,480 250,480 200,350 Z; 
                    M 200,350 C 150,250 200,180 300,180 C 340,180 350,240 400,240 C 450,240 460,180 500,180 C 600,180 650,250 600,350 C 550,480 250,480 200,350 Z; 
                    M 200,350 C 150,250 250,150 320,160 C 360,170 370,210 400,210 C 430,210 440,170 480,160 C 550,150 650,250 600,350 C 550,480 250,480 200,350 Z; 
                    M 200,350 C 150,250 250,150 320,160 C 360,170 370,210 400,210 C 430,210 440,170 480,160 C 550,150 650,250 600,350 C 550,480 250,480 200,350 Z; 
                    M 200,350 C 150,250 200,180 300,180 C 340,180 350,240 400,240 C 450,240 460,180 500,180 C 600,180 650,250 600,350 C 550,480 250,480 200,350 Z; 
                    M 200,350 C 150,250 200,180 300,180 C 340,180 350,240 400,240 C 450,240 460,180 500,180 C 600,180 650,250 600,350 C 550,480 250,480 200,350 Z" />
            </path>
        </g>
        
        <!-- Enzyme Labels -->
        <text x="400" y="380" font-family="Inter" font-size="20" text-anchor="middle" fill="#2C3E50" font-weight="bold">Enzyme (Maltase)</text>
        <text x="400" y="265" font-family="Inter" font-size="14" text-anchor="middle" fill="#2C3E50" opacity="0.6" font-weight="600">Active Site</text>
        <text id="inducedFitLabel" x="400" y="130" font-family="Inter" font-size="16" font-weight="bold" fill="#27AE60" text-anchor="middle">Induced Fit Model</text>

        <!-- Substrate Label (Moves with substrate) -->
        <text id="substrateLabel" x="400" y="20" font-family="Inter" font-size="16" text-anchor="middle" fill="#2C3E50" font-weight="bold">Substrate (Maltose)</text>

        <!-- Bond Cleavage Pulse Effect -->
        <circle id="pulse" cx="400" cy="210" r="0" fill="none" stroke="#FF6B6B" stroke-width="0" opacity="0"/>

        <!-- Glucose A (Left Monomer) -->
        <g id="glcA">
            <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#F39C12" stroke="#D68910" stroke-width="3"/>
            <text x="0" y="5" font-family="Inter" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">Glc</text>
            <text class="productLabel" x="0" y="-40" font-family="Inter" font-size="14" text-anchor="middle" fill="#2C3E50" font-weight="bold">Product (Glucose)</text>
            
            <!-- Split OH Group (Appears after cleavage) -->
            <g class="waterSplit" transform="translate(24, 0)">
                <line x1="0" y1="0" x2="14" y2="0" stroke="#3498DB" stroke-width="3"/>
                <circle cx="18" cy="0" r="6" fill="#3498DB"/>
                <circle cx="26" cy="-4" r="4" fill="#E8F4FD" stroke="#3498DB" stroke-width="1"/>
                <text x="22" y="15" font-family="Inter" font-size="10" fill="#3498DB" font-weight="bold">OH</text>
            </g>
        </g>

        <!-- Glucose B (Right Monomer) -->
        <g id="glcB">
            <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="#F39C12" stroke="#D68910" stroke-width="3"/>
            <text x="0" y="5" font-family="Inter" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">Glc</text>
            <text class="productLabel" x="0" y="-40" font-family="Inter" font-size="14" text-anchor="middle" fill="#2C3E50" font-weight="bold">Product (Glucose)</text>
            
            <!-- Split H Group (Appears after cleavage) -->
            <g class="waterSplit" transform="translate(-24, 0)">
                <line x1="0" y1="0" x2="-14" y2="0" stroke="#3498DB" stroke-width="3"/>
                <circle cx="-18" cy="0" r="4" fill="#E8F4FD" stroke="#3498DB" stroke-width="1"/>
                <text x="-22" y="15" font-family="Inter" font-size="10" fill="#3498DB" font-weight="bold">H</text>
            </g>
        </g>

        <!-- Glycosidic Bond -->
        <g id="bondGroup">
            <g id="bondVibrate">
                <line x1="-22" y1="0" x2="22" y2="0" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round"/>
                <circle cx="0" cy="0" r="9" fill="#FF6B6B"/>
                <text x="0" y="4" font-family="Inter" font-size="12" text-anchor="middle" fill="#ffffff" font-weight="bold">O</text>
            </g>
        </g>

        <!-- Dynamic Bond Label -->
        <g id="bondLabelGroup">
            <line x1="480" y1="160" x2="415" y2="200" stroke="#2C3E50" stroke-width="1" stroke-dasharray="4"/>
            <text x="485" y="155" font-family="Inter" font-size="14" fill="#E74C3C" font-weight="bold">Glycosidic Bond</text>
        </g>

        <!-- Water Molecule (H2O) -->
        <g id="water">
            <line x1="0" y1="0" x2="-12" y2="-14" stroke="#3498DB" stroke-width="3"/>
            <line x1="0" y1="0" x2="12" y2="-14" stroke="#3498DB" stroke-width="3"/>
            <circle cx="0" cy="0" r="8" fill="#3498DB"/>
            <circle cx="-12" cy="-14" r="5" fill="#E8F4FD" stroke="#3498DB" stroke-width="1"/>
            <circle cx="12" cy="-14" r="5" fill="#E8F4FD" stroke="#3498DB" stroke-width="1"/>
            <text x="20" y="5" font-family="Inter" font-size="12" fill="#3498DB" font-weight="bold">H₂O</text>
        </g>

    </svg>
</div>

</body>
</html>
