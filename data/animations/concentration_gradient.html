<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resting Membrane Potential: Concentration Gradient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 1000px;
            width: 100%;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #2C3E50; }
        .label { font-size: 14px; font-weight: 400; }
        .label-bold { font-size: 14px; font-weight: 600; }
        .ion-text { font-family: 'Roboto Mono', monospace; font-weight: 700; fill: #ffffff; }
        .charge { font-family: 'Roboto Mono', monospace; font-size: 28px; font-weight: bold; }

        /* Pump Animation */
        .pump {
            animation: pump-flip 8s infinite ease-in-out;
            transform-origin: center;
        }

        @keyframes pump-flip {
            0%, 22% { transform: scaleY(1); }
            28%, 72% { transform: scaleY(-1); }
            78%, 100% { transform: scaleY(1); }
        }

        /* Na+ Active Transport (3 Ions) */
        .anim-na-1 { animation: na1 8s infinite ease-in-out; }
        .anim-na-2 { animation: na2 8s infinite ease-in-out; }
        .anim-na-3 { animation: na3 8s infinite ease-in-out; }

        @keyframes na1 {
            0%, 5% { transform: translate(385px, 350px); opacity: 0; }
            10% { transform: translate(385px, 350px); opacity: 1; }
            18%, 22% { transform: translate(385px, 265px); opacity: 1; }
            28%, 32% { transform: translate(385px, 235px); opacity: 1; }
            40% { transform: translate(385px, 150px); opacity: 1; }
            45%, 100% { transform: translate(385px, 150px); opacity: 0; }
        }
        @keyframes na2 {
            0%, 5% { transform: translate(400px, 350px); opacity: 0; }
            10% { transform: translate(400px, 350px); opacity: 1; }
            18%, 22% { transform: translate(400px, 265px); opacity: 1; }
            28%, 32% { transform: translate(400px, 235px); opacity: 1; }
            40% { transform: translate(400px, 150px); opacity: 1; }
            45%, 100% { transform: translate(400px, 150px); opacity: 0; }
        }
        @keyframes na3 {
            0%, 5% { transform: translate(415px, 350px); opacity: 0; }
            10% { transform: translate(415px, 350px); opacity: 1; }
            18%, 22% { transform: translate(415px, 265px); opacity: 1; }
            28%, 32% { transform: translate(415px, 235px); opacity: 1; }
            40% { transform: translate(415px, 150px); opacity: 1; }
            45%, 100% { transform: translate(415px, 150px); opacity: 0; }
        }

        /* K+ Active Transport (2 Ions) */
        .anim-k-1 { animation: k1 8s infinite ease-in-out; }
        .anim-k-2 { animation: k2 8s infinite ease-in-out; }

        @keyframes k1 {
            0%, 50% { transform: translate(390px, 150px); opacity: 0; }
            55% { transform: translate(390px, 150px); opacity: 1; }
            63%, 72% { transform: translate(390px, 235px); opacity: 1; }
            78%, 82% { transform: translate(390px, 265px); opacity: 1; }
            90% { transform: translate(390px, 350px); opacity: 1; }
            95%, 100% { transform: translate(390px, 350px); opacity: 0; }
        }
        @keyframes k2 {
            0%, 50% { transform: translate(410px, 150px); opacity: 0; }
            55% { transform: translate(410px, 150px); opacity: 1; }
            63%, 72% { transform: translate(410px, 235px); opacity: 1; }
            78%, 82% { transform: translate(410px, 265px); opacity: 1; }
            90% { transform: translate(410px, 350px); opacity: 1; }
            95%, 100% { transform: translate(410px, 350px); opacity: 0; }
        }

        /* Leak Channels (Passive Transport) */
        .k-leak-1 { animation: kleak 4s infinite linear; }
        .k-leak-2 { animation: kleak 4s infinite linear 1.3s; }
        .k-leak-3 { animation: kleak 4s infinite linear 2.6s; }

        @keyframes kleak {
            0% { transform: translate(200px, 350px); opacity: 0; }
            10% { opacity: 1; }
            90% { transform: translate(200px, 150px); opacity: 1; }
            100% { transform: translate(200px, 150px); opacity: 0; }
        }

        .na-leak-1 { animation: naleak 8s infinite linear 2s; }

        @keyframes naleak {
            0% { transform: translate(600px, 150px); opacity: 0; }
            10% { opacity: 1; }
            90% { transform: translate(600px, 350px); opacity: 1; }
            100% { transform: translate(600px, 350px); opacity: 0; }
        }

        /* Charge Pulsing */
        .plus { fill: #E74C3C; animation: pulse 3s infinite alternate ease-in-out; }
        .minus { fill: #3498DB; animation: pulse 3s infinite alternate ease-in-out 1.5s; }

        @keyframes pulse {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animation of the Sodium-Potassium Pump in a Neuron">
    <title>Resting Membrane Potential and Sodium-Potassium Pump</title>
    <desc>An animated biological diagram showing the active transport of 3 Na+ ions out and 2 K+ ions into a neuron, establishing a resting membrane potential.</desc>

    <defs>
        <!-- Gradients for Ions -->
        <radialGradient id="na-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FF9E9E" />
            <stop offset="100%" stop-color="#FF6B6B" />
        </radialGradient>
        
        <radialGradient id="k-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#C4EAE0" />
            <stop offset="100%" stop-color="#98D8C8" />
        </radialGradient>

        <!-- Phospholipid Bilayer Pattern -->
        <pattern id="membrane-pattern" x="0" y="0" width="16" height="40" patternUnits="userSpaceOnUse">
            <!-- Top Layer -->
            <circle cx="8" cy="6" r="5" fill="#4A90D9" />
            <path d="M 6,11 L 5,20 M 10,11 L 11,20" stroke="#4A90D9" stroke-width="1.5" fill="none" />
            <!-- Bottom Layer -->
            <circle cx="8" cy="34" r="5" fill="#4A90D9" />
            <path d="M 6,29 L 5,20 M 10,29 L 11,20" stroke="#4A90D9" stroke-width="1.5" fill="none" />
        </pattern>

        <!-- Arrowhead Marker -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" />
        </marker>

        <!-- Ion Templates -->
        <g id="na-ion">
            <circle r="9" fill="url(#na-grad)" stroke="#C0392B" stroke-width="1" />
            <text x="0" y="3" class="ion-text" font-size="9" text-anchor="middle">Na⁺</text>
        </g>
        
        <g id="k-ion">
            <circle r="11" fill="url(#k-grad)" stroke="#2C3E50" stroke-width="1" />
            <text x="0" y="4" class="ion-text" font-size="10" fill="#2C3E50" text-anchor="middle">K⁺</text>
        </g>
    </defs>

    <!-- Background Compartments -->
    <rect x="0" y="0" width="800" height="250" fill="#FFFFFF" />
    <rect x="0" y="250" width="800" height="250" fill="#E8F4FD" />

    <!-- Static Background Ions (Context for Concentration Gradients) -->
    <g opacity="0.4">
        <!-- ECF: High Na+, Low K+ -->
        <use href="#na-ion" x="60" y="100" />
        <use href="#na-ion" x="120" y="160" />
        <use href="#na-ion" x="280" y="90" />
        <use href="#na-ion" x="350" y="130" />
        <use href="#na-ion" x="480" y="80" />
        <use href="#na-ion" x="680" y="140" />
        <use href="#na-ion" x="750" y="110" />
        <use href="#na-ion" x="550" y="160" />
        <use href="#k-ion" x="180" y="120" />
        <use href="#k-ion" x="620" y="90" />

        <!-- ICF: Low Na+, High K+ -->
        <use href="#k-ion" x="80" y="380" />
        <use href="#k-ion" x="150" y="440" />
        <use href="#k-ion" x="280" y="360" />
        <use href="#k-ion" x="450" y="460" />
        <use href="#k-ion" x="550" y="390" />
        <use href="#k-ion" x="680" y="450" />
        <use href="#k-ion" x="760" y="370" />
        <use href="#k-ion" x="320" y="420" />
        <use href="#na-ion" x="240" y="430" />
        <use href="#na-ion" x="700" y="380" />
    </g>

    <!-- Cell Membrane -->
    <rect x="0" y="230" width="800" height="40" fill="url(#membrane-pattern)" />

    <!-- Charge Indicators -->
    <text x="400" y="215" class="charge plus" text-anchor="middle" letter-spacing="35">+ + + + + + + + + + + + + + +</text>
    <text x="400" y="295" class="charge minus" text-anchor="middle" letter-spacing="35">- - - - - - - - - - - - - - -</text>

    <!-- Proteins -->
    
    <!-- K+ Leak Channel (High Permeability) -->
    <g transform="translate(200, 250)">
        <rect x="-16" y="-35" width="12" height="70" rx="4" fill="#98D8C8" stroke="#76B5A5" stroke-width="1" />
        <rect x="4" y="-35" width="12" height="70" rx="4" fill="#98D8C8" stroke="#76B5A5" stroke-width="1" />
    </g>

    <!-- Na+ Leak Channel (Low Permeability) -->
    <g transform="translate(600, 250)">
        <rect x="-12" y="-35" width="10" height="70" rx="4" fill="#98D8C8" stroke="#76B5A5" stroke-width="1" />
        <rect x="2" y="-35" width="10" height="70" rx="4" fill="#98D8C8" stroke="#76B5A5" stroke-width="1" />
    </g>

    <!-- Sodium-Potassium Pump -->
    <g transform="translate(400, 250)">
        <path class="pump" d="M -42,35 L -16,35 L -6,-15 L 6,-15 L 16,35 L 42,35 L 26,-35 L -26,-35 Z" fill="#F39C12" stroke="#D68910" stroke-width="2" stroke-linejoin="round" />
    </g>

    <!-- Animated Ions -->
    
    <!-- Active Transport (Pump) -->
    <use href="#na-ion" class="anim-na-1" />
    <use href="#na-ion" class="anim-na-2" />
    <use href="#na-ion" class="anim-na-3" />
    
    <use href="#k-ion" class="anim-k-1" />
    <use href="#k-ion" class="anim-k-2" />

    <!-- Passive Transport (Leak Channels) -->
    <use href="#k-ion" class="k-leak-1" />
    <use href="#k-ion" class="k-leak-2" />
    <use href="#k-ion" class="k-leak-3" />
    
    <use href="#na-ion" class="na-leak-1" />

    <!-- Labels and Annotations -->
    
    <!-- Title -->
    <text x="25" y="40" class="title">Resting Membrane Potential: Concentration Gradient</text>

    <!-- Compartment Labels -->
    <g transform="translate(25, 80)">
        <text x="0" y="0" class="subtitle">Extracellular Fluid (ECF)</text>
        <text x="0" y="22" class="label" fill="#E74C3C">High [Na⁺]</text>
        <text x="78" y="22" class="label" fill="#2C3E50">, </text>
        <text x="88" y="22" class="label" fill="#76B5A5">Low [K⁺]</text>
    </g>

    <g transform="translate(25, 450)">
        <text x="0" y="0" class="subtitle">Intracellular Fluid / Axoplasm (ICF)</text>
        <text x="0" y="22" class="label" fill="#E74C3C">Low [Na⁺]</text>
        <text x="73" y="22" class="label" fill="#2C3E50">, </text>
        <text x="83" y="22" class="label" fill="#76B5A5">High [K⁺]</text>
    </g>

    <!-- Protein Labels -->
    <g transform="translate(400, 100)">
        <text x="0" y="0" class="label-bold" fill="#D68910" text-anchor="middle">Sodium-Potassium Pump</text>
        <text x="0" y="18" class="label" fill="#2C3E50" text-anchor="middle" font-size="12">(Active Transport: 3 Na⁺ out, 2 K⁺ in)</text>
        <path d="M 0,25 L 0,85" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrowhead)" />
    </g>

    <text x="200" y="195" class="label-bold" fill="#76B5A5" text-anchor="middle">K⁺ Leak Channel</text>
    <text x="600" y="195" class="label-bold" fill="#76B5A5" text-anchor="middle">Na⁺ Leak Channel</text>

    <!-- Status Card -->
    <g transform="translate(560, 25)">
        <rect x="0" y="0" width="215" height="100" rx="6" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.05))" />
        <text x="15" y="25" class="label-bold" fill="#2C3E50">Net Result:</text>
        <text x="15" y="45" class="label" fill="#E74C3C">• Outer surface positive (+)</text>
        <text x="15" y="65" class="label" fill="#3498DB">• Inner surface negative (-)</text>
        <text x="15" y="85" class="label" fill="#2C3E50" font-size="12" font-style="italic">Maintains Resting Potential</text>
    </g>

</svg>

</body>
</html>
