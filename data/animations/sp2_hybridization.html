<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sp² Hybridization: Ethene (C₂H₄)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #212529;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: bold;
            fill: #404040;
        }

        /* Animations - 12 Second Loop */
        
        /* C1 Orbitals */
        .c1-sp2 {
            transform-origin: 0 0;
            animation: growSp2 12s infinite ease-in-out;
        }
        .c1-pz {
            transform-origin: 0 0;
            animation: growPz 12s infinite ease-in-out;
        }

        /* C2 Slide */
        .c2-group {
            animation: slideC2 12s infinite ease-in-out;
        }
        .c2-pz {
            transform-origin: 0 0;
            animation: shrinkPz 12s infinite ease-in-out;
        }

        /* Sigma Bond */
        .sigma-glow {
            transform-origin: 400px 250px;
            animation: glowSigma 12s infinite ease-in-out;
        }

        /* Hydrogens */
        .h1 { animation: slideH1 12s infinite ease-in-out; }
        .h2 { animation: slideH2 12s infinite ease-in-out; }
        .h3 { animation: slideH3 12s infinite ease-in-out; }
        .h4 { animation: slideH4 12s infinite ease-in-out; }

        /* Pi Bond */
        .pi-clouds {
            transform-origin: 400px 250px;
            animation: formPi 12s infinite ease-in-out;
        }

        /* Molecule Tilt & Labels */
        .molecule-group {
            transform-origin: 400px 250px;
            animation: tiltMolecule 12s infinite ease-in-out;
        }
        .label-anim {
            animation: showLabels 12s infinite ease-in-out;
        }

        /* Keyframes */
        @keyframes growSp2 {
            0% { transform: scale(0); opacity: 0; }
            5%, 95% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes growPz {
            0%, 5% { transform: scaleY(0); opacity: 0; }
            15%, 66% { transform: scaleY(1); opacity: 1; }
            75%, 95% { transform: scaleY(0.1); opacity: 0; }
            100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes shrinkPz {
            0%, 66% { transform: scaleY(1); opacity: 1; }
            75%, 95% { transform: scaleY(0.1); opacity: 0; }
            100% { transform: scaleY(1); opacity: 1; }
        }

        @keyframes slideC2 {
            0%, 25% { transform: translate(700px, 250px); opacity: 0; }
            30% { opacity: 1; }
            50%, 95% { transform: translate(500px, 250px); opacity: 1; }
            100% { transform: translate(700px, 250px); opacity: 0; }
        }

        @keyframes glowSigma {
            0%, 50% { opacity: 0; transform: scale(0.5); }
            55%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }

        @keyframes slideH1 {
            0%, 50% { transform: translate(150px, 100px); opacity: 0; }
            55% { opacity: 1; }
            66%, 95% { transform: translate(245px, 211.9px); opacity: 1; }
            100% { transform: translate(150px, 100px); opacity: 0; }
        }
        @keyframes slideH2 {
            0%, 50% { transform: translate(150px, 400px); opacity: 0; }
            55% { opacity: 1; }
            66%, 95% { transform: translate(245px, 288.1px); opacity: 1; }
            100% { transform: translate(150px, 400px); opacity: 0; }
        }
        @keyframes slideH3 {
            0%, 50% { transform: translate(650px, 100px); opacity: 0; }
            55% { opacity: 1; }
            66%, 95% { transform: translate(555px, 211.9px); opacity: 1; }
            100% { transform: translate(650px, 100px); opacity: 0; }
        }
        @keyframes slideH4 {
            0%, 50% { transform: translate(650px, 400px); opacity: 0; }
            55% { opacity: 1; }
            66%, 95% { transform: translate(555px, 288.1px); opacity: 1; }
            100% { transform: translate(650px, 400px); opacity: 0; }
        }

        @keyframes formPi {
            0%, 66% { opacity: 0; transform: scaleY(0.1); }
            75%, 95% { opacity: 1; transform: scaleY(1); }
            100% { opacity: 0; transform: scaleY(0.1); }
        }

        @keyframes tiltMolecule {
            0%, 83% { transform: rotate(0deg) scale(1); }
            88%, 95% { transform: rotate(-4deg) scale(1.03); }
            100% { transform: rotate(0deg) scale(1); }
        }

        @keyframes showLabels {
            0%, 83% { opacity: 0; transform: translateY(10px); }
            88%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>sp² Hybridization and Ethene Formation</title>
    <desc>Animation showing the sp2 hybridization of carbon atoms, the formation of a sigma bond through head-on overlap, and a pi bond through lateral overlap of pz orbitals to form ethene.</desc>

    <defs>
        <!-- Blurs and Gradients -->
        <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" />
        </filter>
        
        <radialGradient id="cGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#666" />
            <stop offset="100%" stop-color="#404040" />
        </radialGradient>

        <radialGradient id="hGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#FFF" />
            <stop offset="100%" stop-color="#CCCCCC" />
        </radialGradient>

        <radialGradient id="sigmaGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFAA" stop-opacity="1" />
            <stop offset="40%" stop-color="#FFFFAA" stop-opacity="0.8" />
            <stop offset="100%" stop-color="#FFFFAA" stop-opacity="0" />
        </radialGradient>

        <!-- Arrow Markers -->
        <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#F77F00" />
        </marker>
        <marker id="arrow-purple" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M 0,0 L 10,5 L 0,10 z" fill="#B5179E" />
        </marker>

        <!-- Base Shapes -->
        <!-- sp2 lobe (elongated for overlap, drawn flat) -->
        <path id="sp2" d="M 0,0 C 40,-45 110,-35 110,0 C 110,35 40,45 0,0 Z" fill="#00B4D8" opacity="0.75" filter="url(#blur)"/>
        
        <!-- pz lobe (vertical) -->
        <path id="pz-top" d="M 0,0 C 25,-30 25,-100 0,-100 C -25,-100 -25,-30 0,0 Z" fill="#7209B7" opacity="0.75" filter="url(#blur)"/>
        <path id="pz-bot" d="M 0,0 C 25,30 25,100 0,100 C -25,100 -25,30 0,0 Z" fill="#7209B7" opacity="0.75" filter="url(#blur)"/>
        <g id="pz">
            <use href="#pz-top"/>
            <use href="#pz-bot"/>
        </g>

        <!-- Atoms -->
        <circle id="carbon" r="16" fill="url(#cGrad)" />
        <circle id="hydrogen" r="11" fill="url(#hGrad)" />
    </defs>

    <!-- Title -->
    <text x="400" y="45" font-weight="bold" font-size="26" text-anchor="middle">sp² Hybridization: Ethene (C₂H₄)</text>

    <!-- Main Animation Group -->
    <g class="molecule-group">
        
        <!-- Pi Bond Clouds (Behind atoms) -->
        <g class="pi-clouds">
            <ellipse cx="400" cy="170" rx="120" ry="30" fill="#B5179E" opacity="0.4" filter="url(#blur)" stroke="#B5179E" stroke-width="2" stroke-dasharray="6,4" />
            <ellipse cx="400" cy="330" rx="120" ry="30" fill="#B5179E" opacity="0.4" filter="url(#blur)" stroke="#B5179E" stroke-width="2" stroke-dasharray="6,4" />
        </g>

        <!-- Sigma Bond Glow -->
        <circle cx="400" cy="250" r="45" fill="url(#sigmaGlow)" class="sigma-glow" />

        <!-- Carbon 1 (Left) -->
        <g transform="translate(300, 250)">
            <!-- sp2 plane with 3D perspective squash -->
            <g transform="scale(1, 0.4)">
                <use href="#sp2" transform="rotate(0)" class="c1-sp2" />
                <use href="#sp2" transform="rotate(120)" class="c1-sp2" />
                <use href="#sp2" transform="rotate(240)" class="c1-sp2" />
            </g>
            <use href="#pz" class="c1-pz" />
            <use href="#carbon" />
        </g>

        <!-- Carbon 2 (Right) -->
        <g class="c2-group">
            <g transform="scale(1, 0.4)">
                <use href="#sp2" transform="rotate(180)" />
                <use href="#sp2" transform="rotate(300)" />
                <use href="#sp2" transform="rotate(60)" />
            </g>
            <use href="#pz" class="c2-pz" />
            <use href="#carbon" />
        </g>

        <!-- Hydrogens -->
        <use href="#hydrogen" class="h1" />
        <use href="#hydrogen" class="h2" />
        <use href="#hydrogen" class="h3" />
        <use href="#hydrogen" class="h4" />

        <!-- Geometry Markers & Bond Labels (Fade in at the end) -->
        <g class="label-anim">
            <!-- 120 Degree Angle Marker -->
            <path d="M 265, 225 A 35 35 0 0 0 265, 275" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="3,3" />
            <text x="225" y="255" font-size="13" fill="#666" font-weight="bold">120°</text>

            <!-- Sigma Bond Label -->
            <text x="400" y="305" text-anchor="middle" font-size="14" fill="#F77F00" font-weight="bold">σ bond (head-on overlap)</text>
            <path d="M 400,290 L 400,265" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-orange)" />

            <!-- Pi Bond Label -->
            <text x="400" y="115" text-anchor="middle" font-size="14" fill="#B5179E" font-weight="bold">π bond (lateral overlap)</text>
            <path d="M 400,125 L 400,150" stroke="#B5179E" stroke-width="2" marker-end="url(#arrow-purple)" />
        </g>

    </g>

    <!-- Static UI Elements -->
    
    <!-- Legend -->
    <g transform="translate(20, 360)">
        <rect width="180" height="120" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" opacity="0.9"/>
        <text x="10" y="20" font-size="12" font-weight="bold" fill="#495057">Legend</text>
        
        <circle cx="20" cy="35" r="6" fill="#404040" />
        <text x="35" y="39" font-size="12">Carbon Atom</text>

        <circle cx="20" cy="55" r="6" fill="#CCCCCC" />
        <text x="35" y="59" font-size="12">Hydrogen Atom</text>

        <rect x="14" y="70" width="12" height="10" rx="2" fill="#00B4D8" opacity="0.7" />
        <text x="35" y="79" font-size="12">sp² Hybrid Lobe</text>

        <rect x="14" y="90" width="12" height="10" rx="2" fill="#7209B7" opacity="0.7" />
        <text x="35" y="99" font-size="12">2p_z Orbital</text>

        <rect x="14" y="110" width="12" height="10" rx="2" fill="#B5179E" opacity="0.4" stroke="#B5179E" stroke-dasharray="2,2" />
        <text x="35" y="119" font-size="12">π Electron Cloud</text>
    </g>

    <!-- Chemical Formula -->
    <text x="770" y="470" class="formula" font-size="22" text-anchor="end">
        H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>C=CH<tspan baseline-shift="sub" font-size="0.7em">2</tspan>
    </text>

</svg>

</body>
</html>
