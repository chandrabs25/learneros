<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SI Units of Chemical Measurement</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            width: 100vw;
            height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
        }

        /* UI Box Highlights */
        .ui-box { transition: all 0.3s ease; }
        .ui-box-1 { animation: box-1 15s infinite; }
        .ui-box-2 { animation: box-2 15s infinite; }
        .ui-box-3 { animation: box-3 15s infinite; }
        .ui-box-4 { animation: box-4 15s infinite; }

        @keyframes box-1 { 5%, 27% { stroke: #4444FF; stroke-width: 3px; } }
        @keyframes box-2 { 27%, 53% { stroke: #FF4444; stroke-width: 3px; } }
        @keyframes box-3 { 53%, 80% { stroke: #7209B7; stroke-width: 3px; } }
        @keyframes box-4 { 80%, 95% { stroke: #44CC44; stroke-width: 3px; } }

        /* Text Swapping Animations */
        .val-n-0 { animation: fade-out-1 15s infinite; }
        .val-n-1 { animation: fade-in-1 15s infinite; opacity: 0; }
        @keyframes fade-out-1 { 0%, 10% { opacity: 1; } 11%, 100% { opacity: 0; } }
        @keyframes fade-in-1 { 0%, 10% { opacity: 0; } 11%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }

        .val-t-0 { animation: fade-out-2 15s infinite; }
        .val-t-1 { animation: fade-in-2 15s infinite; opacity: 0; }
        @keyframes fade-out-2 { 0%, 27% { opacity: 1; } 28%, 100% { opacity: 0; } }
        @keyframes fade-in-2 { 0%, 27% { opacity: 0; } 28%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }

        .val-v-0 { animation: fade-out-3 15s infinite; }
        .val-v-1 { animation: fade-in-3 15s infinite; opacity: 0; }
        @keyframes fade-out-3 { 0%, 53% { opacity: 1; } 54%, 100% { opacity: 0; } }
        @keyframes fade-in-3 { 0%, 53% { opacity: 0; } 54%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }

        .val-m-0 { animation: fade-out-4 15s infinite; }
        .val-m-1 { animation: fade-in-4 15s infinite; opacity: 0; }
        @keyframes fade-out-4 { 0%, 80% { opacity: 1; } 81%, 100% { opacity: 0; } }
        @keyframes fade-in-4 { 0%, 80% { opacity: 0; } 81%, 98% { opacity: 1; } 99%, 100% { opacity: 0; } }

        /* Physical System Animations */
        .mercury-tube { animation: mercury 15s infinite; }
        .mercury-bulb { animation: mercury-color 15s infinite; }
        @keyframes mercury {
            0%, 27% { height: 30px; y: 310px; fill: #4444FF; }
            53%, 95% { height: 130px; y: 210px; fill: #FF4444; }
            98%, 100% { height: 30px; y: 310px; fill: #4444FF; }
        }
        @keyframes mercury-color {
            0%, 27% { fill: #4444FF; }
            53%, 95% { fill: #FF4444; }
            98%, 100% { fill: #4444FF; }
        }

        .piston-group { animation: piston 15s infinite; }
        @keyframes piston {
            0%, 53% { transform: translateY(0); }
            80%, 95% { transform: translateY(-80px); }
            98%, 100% { transform: translateY(0); }
        }

        .bracket-top { animation: piston 15s infinite; }
        .bracket-line {
            transform-origin: center top;
            animation: bracket-line 15s infinite;
        }
        @keyframes bracket-line {
            0%, 53% { transform: scaleY(1); }
            80%, 95% { transform: scaleY(1.533); }
            98%, 100% { transform: scaleY(1); }
        }

        .scanner { animation: scanner 15s infinite; }
        @keyframes scanner {
            0%, 80% { opacity: 0; transform: translateY(0); }
            82% { opacity: 0.8; transform: translateY(0); }
            90% { opacity: 0.8; transform: translateY(240px); }
            92%, 100% { opacity: 0; transform: translateY(240px); }
        }

        .scale-screen { animation: scale-flash 15s infinite; }
        @keyframes scale-flash {
            0%, 80% { fill: #222; }
            81%, 95% { fill: #1a4a1a; }
            96%, 100% { fill: #222; }
        }

        /* Molecule Animations */
        .vector {
            transform-origin: 12px 0;
            animation: vector-scale 15s infinite;
        }
        @keyframes vector-scale {
            0%, 27% { transform: scale(0.5); opacity: 0.4; }
            53%, 95% { transform: scale(1.5); opacity: 1; }
            98%, 100% { transform: scale(0.5); opacity: 0; }
        }

        .m-1 { animation: m-1 15s infinite linear; }
        .m-2 { animation: m-2 15s infinite linear; }
        .m-3 { animation: m-3 15s infinite linear; }
        .m-4 { animation: m-4 15s infinite linear; }

        @keyframes m-1 {
            0%, 5% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translate(5px, -5px) rotate(20deg); }
            27% { transform: translate(15px, -10px) rotate(45deg); }
            40% { transform: translate(25px, 0px) rotate(90deg); }
            53% { transform: translate(30px, 10px) rotate(120deg); }
            66% { transform: translate(10px, -30px) rotate(180deg); }
            80% { transform: translate(-10px, -70px) rotate(240deg); }
            88% { transform: translate(5px, -40px) rotate(300deg); }
            95% { transform: translate(20px, -50px) rotate(360deg); opacity: 1; }
            98%, 100% { transform: translate(0,0) rotate(400deg); opacity: 0; }
        }

        @keyframes m-2 {
            0%, 5% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translate(-5px, 5px) rotate(-20deg); }
            27% { transform: translate(-15px, 10px) rotate(-45deg); }
            40% { transform: translate(-20px, -5px) rotate(-90deg); }
            53% { transform: translate(-30px, -10px) rotate(-120deg); }
            66% { transform: translate(-10px, -40px) rotate(-180deg); }
            80% { transform: translate(10px, -80px) rotate(-240deg); }
            88% { transform: translate(-5px, -50px) rotate(-300deg); }
            95% { transform: translate(-20px, -60px) rotate(-360deg); opacity: 1; }
            98%, 100% { transform: translate(0,0) rotate(-400deg); opacity: 0; }
        }

        @keyframes m-3 {
            0%, 5% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translate(5px, -10px) rotate(30deg); }
            27% { transform: translate(5px, -15px) rotate(90deg); }
            40% { transform: translate(-5px, -20px) rotate(135deg); }
            53% { transform: translate(-10px, -30px) rotate(180deg); }
            66% { transform: translate(10px, -60px) rotate(225deg); }
            80% { transform: translate(20px, -90px) rotate(270deg); }
            88% { transform: translate(5px, -70px) rotate(360deg); }
            95% { transform: translate(-10px, -40px) rotate(450deg); opacity: 1; }
            98%, 100% { transform: translate(0,0) rotate(500deg); opacity: 0; }
        }

        @keyframes m-4 {
            0%, 5% { transform: translate(0,0) rotate(0deg); opacity: 0; }
            10% { opacity: 1; transform: translate(-5px, 10px) rotate(-30deg); }
            27% { transform: translate(-10px, 15px) rotate(-90deg); }
            40% { transform: translate(5px, 20px) rotate(-135deg); }
            53% { transform: translate(10px, 25px) rotate(-180deg); }
            66% { transform: translate(-5px, -20px) rotate(-225deg); }
            80% { transform: translate(-20px, -60px) rotate(-270deg); }
            88% { transform: translate(-5px, -40px) rotate(-360deg); }
            95% { transform: translate(10px, -80px) rotate(-450deg); opacity: 1; }
            98%, 100% { transform: translate(0,0) rotate(-500deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <title>The SI Units of Chemical Measurement</title>
        <desc>An animated molecular view demonstrating the relationships between the Mole, Kelvin, Meter, and Kilogram using an ideal gas model of Oxygen.</desc>

        <defs>
            <!-- Drop Shadow Filter -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.06"/>
            </filter>

            <!-- O2 Molecule Definition -->
            <g id="o2-mol">
                <!-- Covalent Bond -->
                <line x1="-8" y1="0" x2="8" y2="0" stroke="#404040" stroke-width="5"/>
                <!-- Oxygen Atoms -->
                <circle cx="-8" cy="0" r="7" fill="#FF4444"/>
                <circle cx="8" cy="0" r="7" fill="#FF4444"/>
                <!-- 3D Highlights -->
                <circle cx="-10" cy="-2" r="2.5" fill="#ffffff" opacity="0.6"/>
                <circle cx="6" cy="-2" r="2.5" fill="#ffffff" opacity="0.6"/>
                <!-- Velocity Vector -->
                <g class="vector">
                    <path d="M 12 0 L 26 0 M 22 -4 L 26 0 L 22 4" stroke="#F77F00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#2D3748">
            SI Units in Chemistry: The Molar State of O<tspan dy="4" font-size="14">2</tspan>
        </text>

        <!-- PV=nRT Formula Box -->
        <g transform="translate(600, 20)">
            <rect width="160" height="40" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
            <text x="80" y="26" text-anchor="middle" font-family="Roboto Mono" font-weight="700" font-size="18">
                <tspan fill="#2D3748">P</tspan><tspan fill="#7209B7">V</tspan>
                <tspan fill="#2D3748"> = </tspan>
                <tspan fill="#4444FF">n</tspan><tspan fill="#2D3748">R</tspan><tspan fill="#FF4444">T</tspan>
            </text>
        </g>

        <!-- ==================== DASHBOARD UI ==================== -->

        <!-- 1. Mole (Amount of Substance) -->
        <g transform="translate(40, 70)">
            <rect width="160" height="60" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" class="ui-box ui-box-1" filter="url(#shadow)"/>
            <text x="80" y="22" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#718096">Amount (Mole)</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#2D3748" class="val-n-0">n = 0.00 mol</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#4444FF" class="val-n-1">n = 1.00 mol</text>
        </g>

        <!-- 2. Kelvin (Temperature) -->
        <g transform="translate(40, 150)">
            <rect width="160" height="60" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" class="ui-box ui-box-2" filter="url(#shadow)"/>
            <text x="80" y="22" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#718096">Temperature</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#2D3748" class="val-t-0">T = 200.00 K</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#FF4444" class="val-t-1">T = 400.00 K</text>
        </g>

        <!-- 3. Meter (Volume) -->
        <g transform="translate(600, 150)">
            <rect width="160" height="60" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" class="ui-box ui-box-3" filter="url(#shadow)"/>
            <text x="80" y="22" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#718096">Volume</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#2D3748" class="val-v-0">V = 0.012 m³</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#7209B7" class="val-v-1">V = 0.024 m³</text>
        </g>

        <!-- 4. Kilogram (Mass) -->
        <g transform="translate(600, 230)">
            <rect width="160" height="60" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" class="ui-box ui-box-4" filter="url(#shadow)"/>
            <text x="80" y="22" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#718096">Mass</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#2D3748" class="val-m-0">m = ? kg</text>
            <text x="80" y="45" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#44CC44" class="val-m-1">m = 0.032 kg</text>
        </g>

        <!-- Legend -->
        <g transform="translate(40, 350)">
            <rect width="160" height="110" rx="6" fill="#ffffff" stroke="#E2E8F0" stroke-width="2" filter="url(#shadow)"/>
            <text x="80" y="22" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#2D3748">Legend</text>
            
            <circle cx="25" cy="45" r="5" fill="#FF4444"/>
            <circle cx="33" cy="45" r="5" fill="#FF4444"/>
            <text x="48" y="49" font-family="Inter" font-size="12" fill="#4A5568">O₂ Molecule</text>
            
            <path d="M 20 70 L 35 70 M 30 66 L 35 70 L 30 74" stroke="#F77F00" stroke-width="2" fill="none"/>
            <text x="48" y="74" font-family="Inter" font-size="12" fill="#4A5568">Velocity Vector</text>
            
            <rect x="20" y="88" width="16" height="10" fill="#F0F4F8" stroke="#7209B7" stroke-width="1.5"/>
            <text x="48" y="97" font-family="Inter" font-size="12" fill="#4A5568">Volume (ΔV)</text>
        </g>

        <!-- ==================== PHYSICAL SYSTEM ==================== -->

        <!-- Thermometer -->
        <g transform="translate(230, 0)">
            <!-- Glass Tube -->
            <rect x="0" y="180" width="16" height="160" rx="8" fill="#ffffff" stroke="#A0AEC0" stroke-width="2"/>
            <!-- Ticks -->
            <line x1="16" y1="210" x2="22" y2="210" stroke="#A0AEC0" stroke-width="2"/>
            <line x1="16" y1="260" x2="22" y2="260" stroke="#A0AEC0" stroke-width="2"/>
            <line x1="16" y1="310" x2="22" y2="310" stroke="#A0AEC0" stroke-width="2"/>
            <!-- Mercury Tube -->
            <rect x="4" y="310" width="8" height="30" rx="4" fill="#4444FF" class="mercury-tube"/>
            <!-- Glass Bulb -->
            <circle cx="8" cy="345" r="14" fill="#ffffff" stroke="#A0AEC0" stroke-width="2"/>
            <!-- Mercury Bulb -->
            <circle cx="8" cy="345" r="9" fill="#4444FF" class="mercury-bulb"/>
        </g>

        <!-- Ruler / Volume Bracket -->
        <g transform="translate(0, 0)">
            <line x1="490" y1="250" x2="510" y2="250" stroke="#7209B7" stroke-width="2" class="bracket-top"/>
            <rect x="499" y="250" width="2" height="150" fill="#7209B7" class="bracket-line"/>
            <line x1="490" y1="400" x2="510" y2="400" stroke="#7209B7" stroke-width="2"/>
            <text x="520" y="330" font-family="Inter" font-size="14" font-weight="600" fill="#7209B7">h</text>
        </g>

        <!-- Scale Base -->
        <g transform="translate(0, 0)">
            <rect x="280" y="405" width="240" height="45" rx="6" fill="#404040" filter="url(#shadow)"/>
            <rect x="330" y="412" width="140" height="30" rx="4" fill="#222" class="scale-screen"/>
            <text x="400" y="433" text-anchor="middle" font-family="Roboto Mono" font-size="18" class="val-m-0" fill="#44CC44" opacity="0.3">0.000 kg</text>
            <text x="400" y="433" text-anchor="middle" font-family="Roboto Mono" font-size="18" font-weight="700" class="val-m-1" fill="#88FF88">0.032 kg</text>
        </g>

        <!-- Cylinder Back Bottom -->
        <ellipse cx="400" cy="400" rx="80" ry="15" fill="#CBD5E1" stroke="#A0AEC0" stroke-width="2"/>

        <!-- Molecules (12 O2) -->
        <g id="molecules">
            <use href="#o2-mol" x="350" y="280" class="m-1"/>
            <use href="#o2-mol" x="390" y="270" class="m-2"/>
            <use href="#o2-mol" x="440" y="290" class="m-3"/>
            <use href="#o2-mol" x="360" y="320" class="m-4"/>
            <use href="#o2-mol" x="410" y="310" class="m-1"/>
            <use href="#o2-mol" x="460" y="330" class="m-2"/>
            <use href="#o2-mol" x="340" y="360" class="m-3"/>
            <use href="#o2-mol" x="380" y="350" class="m-4"/>
            <use href="#o2-mol" x="430" y="370" class="m-1"/>
            <use href="#o2-mol" x="460" y="270" class="m-2"/>
            <use href="#o2-mol" x="390" y="380" class="m-3"/>
            <use href="#o2-mol" x="350" y="390" class="m-4"/>
        </g>

        <!-- Piston -->
        <g class="piston-group">
            <rect x="395" y="80" width="10" height="170" fill="#404040"/>
            <ellipse cx="400" cy="250" rx="78" ry="14" fill="#E0E0E0" stroke="#404040" stroke-width="2"/>
            <ellipse cx="400" cy="245" rx="78" ry="14" fill="#F8FAFC" opacity="0.6"/> <!-- 3D Bevel -->
        </g>

        <!-- Cylinder Body (Front/Transparent) -->
        <path d="M 320 150 L 320 400 A 80 15 0 0 0 480 400 L 480 150 A 80 15 0 0 1 320 150 Z" fill="#F0F4F8" opacity="0.4" stroke="#A0AEC0" stroke-width="2"/>
        
        <!-- Cylinder Top Rim -->
        <ellipse cx="400" cy="150" rx="80" ry="15" fill="none" stroke="#A0AEC0" stroke-width="2"/>

        <!-- Phase 4 Scanner -->
        <rect x="320" y="150" width="160" height="12" fill="#7209B7" class="scanner"/>

    </svg>

</body>
</html>
