<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pascal's Law & Equilibrium of Forces</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --primary: #4361EE;
            --force-y: #FF3366;
            --force-z: #06D6A0;
            --force-n: #F77F00;
            --weight: #9B5DE5;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            --text-main: #2b2d42;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            color: var(--text-main);
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            border-radius: 16px;
            position: absolute;
            z-index: 10;
            padding: 24px;
        }

        #formula-card {
            top: 24px;
            left: 24px;
            width: 320px;
        }

        #control-panel {
            top: 24px;
            right: 24px;
            width: 300px;
            max-height: calc(100vh - 48px);
            overflow-y: auto;
        }

        h2 {
            margin: 0 0 16px 0;
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .math-block {
            font-family: 'Roboto Mono', monospace;
            background: rgba(255, 255, 255, 0.5);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }

        .math-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            align-items: center;
        }

        .math-line:last-child {
            margin-bottom: 0;
        }

        .highlight {
            font-weight: 700;
        }

        .c-y {
            color: var(--force-y);
        }

        .c-z {
            color: var(--force-z);
        }

        .c-n {
            color: var(--force-n);
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .val-display {
            font-family: 'Roboto Mono', monospace;
            color: var(--primary);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d1d8e0;
            border-radius: 2px;
        }

        input[type=range]:focus {
            outline: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
        }

        input[type=checkbox] {
            width: 18px;
            height: 18px;
            accent-color: var(--weight);
            cursor: pointer;
        }

        .label-3d {
            position: absolute;
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 14px;
            pointer-events: none;
            transform: translate(-50%, -50%);
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff;
            z-index: 5;
            transition: opacity 0.2s;
        }

        .divider {
            height: 1px;
            background: var(--glass-border);
            margin: 16px 0;
        }
    </style>
</head>

<body>

    <div id="canvas-container"></div>

    <div id="formula-card" class="glass-panel">
        <h2>Equilibrium Proof</h2>
        <div class="math-block">
            <div class="math-line" style="justify-content: center; margin-bottom: 12px; color: var(--primary);">
                <span class="highlight">P<sub>a</sub> = P<sub>b</sub> = P<sub>c</sub> = P</span>
            </div>
            <div class="math-line">
                <span>&Sigma; F<sub>y</sub> = <span class="c-n">F<sub>b</sub></span> cos(&theta;) - <span
                        class="c-y">F<sub>a</sub></span> = 0</span>
            </div>
            <div class="math-line">
                <span>&Sigma; F<sub>z</sub> = <span class="c-n">F<sub>b</sub></span> sin(&theta;) - <span
                        class="c-z">F<sub>c</sub></span> = 0</span>
            </div>
        </div>

        <div class="math-block">
            <div class="math-line">
                <span><span class="c-n">F<sub>b</sub></span> cos(&theta;)</span>
                <span class="highlight c-n" id="val-fb-cos">0.0 N</span>
            </div>
            <div class="math-line">
                <span><span class="c-y">F<sub>a</sub></span> (Vertical)</span>
                <span class="highlight c-y" id="val-fa-force">0.0 N</span>
            </div>
            <div class="divider" style="margin: 8px 0;"></div>
            <div class="math-line">
                <span><span class="c-n">F<sub>b</sub></span> sin(&theta;)</span>
                <span class="highlight c-n" id="val-fb-sin">0.0 N</span>
            </div>
            <div class="math-line">
                <span><span class="c-z">F<sub>c</sub></span> (Horizontal)</span>
                <span class="highlight c-z" id="val-fc-force">0.0 N</span>
            </div>
        </div>
    </div>

    <div id="control-panel" class="glass-panel">
        <h2>Parameters</h2>

        <div class="control-group">
            <div class="control-header">
                <span>Inclination Angle (&theta;)</span>
                <span class="val-display" id="val-theta">45&deg;</span>
            </div>
            <input type="range" id="slider-theta" min="10" max="80" step="1" value="45">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Fluid Pressure (P)</span>
                <span class="val-display" id="val-pressure">500 Pa</span>
            </div>
            <input type="range" id="slider-pressure" min="100" max="1000" step="10" value="500">
        </div>

        <div class="control-group">
            <div class="control-header">
                <span>Prism Depth (w)</span>
                <span class="val-display" id="val-depth">1.0 m</span>
            </div>
            <input type="range" id="slider-depth" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="divider"></div>

        <label class="checkbox-group">
            <input type="checkbox" id="toggle-gravity">
            <span>Show Gravity (mg)</span>
        </label>
    </div>

    <div id="labels-container">
        <div id="label-fa" class="label-3d c-y">F<sub>a</sub></div>
        <div id="label-fb" class="label-3d c-n">F<sub>b</sub></div>
        <div id="label-fc" class="label-3d c-z">F<sub>c</sub></div>
        <div id="label-mg" class="label-3d" style="color: var(--weight); display: none;">mg</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf0f4f8);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(4, 3, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight2.position.set(-5, -2, -5);
        scene.add(dirLight2);

        // --- Environment ---
        const envGeo = new THREE.BoxGeometry(10, 10, 10);
        const envMat = new THREE.MeshBasicMaterial({ color: 0xBDC3C7, wireframe: true, transparent: true, opacity: 0.2 });
        const envMesh = new THREE.Mesh(envGeo, envMat);
        scene.add(envMesh);

        // --- Materials ---
        const prismMat = new THREE.MeshPhysicalMaterial({
            color: 0x4361EE,
            transparent: true,
            opacity: 0.4,
            roughness: 0.1,
            transmission: 0.5,
            side: THREE.DoubleSide,
            depthWrite: false
        });

        const edgeMat = new THREE.LineBasicMaterial({ color: 0x2740a1, linewidth: 2 });

        // --- Objects ---
        const initialGeo = new THREE.BufferGeometry();
        initialGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0, 0, 0, 0, 0, 0, 0, 0, 0]), 3));
        let prismMesh = new THREE.Mesh(initialGeo, prismMat);
        let prismEdges = new THREE.LineSegments(new THREE.EdgesGeometry(prismMesh.geometry), edgeMat);
        scene.add(prismMesh);
        scene.add(prismEdges);

        const centroidSphere = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 16, 16),
            new THREE.MeshBasicMaterial({ color: 0x333333 })
        );
        scene.add(centroidSphere);

        // Forces (Arrows)
        const forceScale = 0.002;
        const arrowFa = new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), 1, 0xFF3366, 0.2, 0.1);
        const arrowFc = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(), 1, 0x06D6A0, 0.2, 0.1);
        const arrowFb = new THREE.ArrowHelper(new THREE.Vector3(), new THREE.Vector3(), 1, 0xF77F00, 0.2, 0.1);
        const arrowMg = new THREE.ArrowHelper(new THREE.Vector3(0, -1, 0), new THREE.Vector3(), 1, 0x9B5DE5, 0.15, 0.08);

        scene.add(arrowFa);
        scene.add(arrowFc);
        scene.add(arrowFb);
        scene.add(arrowMg);
        arrowMg.visible = false;

        // Dashed Lines for Components
        const dashMat = new THREE.LineDashedMaterial({ color: 0xF77F00, dashSize: 0.05, gapSize: 0.05, opacity: 0.7, transparent: true });
        let lineVertGeo = new THREE.BufferGeometry();
        let lineHorizGeo = new THREE.BufferGeometry();
        const lineVert = new THREE.Line(lineVertGeo, dashMat);
        const lineHoriz = new THREE.Line(lineHorizGeo, dashMat);
        scene.add(lineVert);
        scene.add(lineHoriz);

        // --- UI Elements ---
        const slTheta = document.getElementById('slider-theta');
        const slPressure = document.getElementById('slider-pressure');
        const slDepth = document.getElementById('slider-depth');
        const cbGravity = document.getElementById('toggle-gravity');

        const valTheta = document.getElementById('val-theta');
        const valPressure = document.getElementById('val-pressure');
        const valDepth = document.getElementById('val-depth');

        const txtFbCos = document.getElementById('val-fb-cos');
        const txtFa = document.getElementById('val-fa-force');
        const txtFbSin = document.getElementById('val-fb-sin');
        const txtFc = document.getElementById('val-fc-force');

        const lblFa = document.getElementById('label-fa');
        const lblFb = document.getElementById('label-fb');
        const lblFc = document.getElementById('label-fc');
        const lblMg = document.getElementById('label-mg');

        // State variables
        let Lhyp = 2.0; // Fixed hypotenuse length for visual stability
        let tipA = new THREE.Vector3();
        let tipB = new THREE.Vector3();
        let tipC = new THREE.Vector3();
        let tipMg = new THREE.Vector3();

        function updatePhysics() {
            const thetaDeg = parseFloat(slTheta.value);
            const P = parseFloat(slPressure.value);
            const w = parseFloat(slDepth.value);
            const showGravity = cbGravity.checked;

            const thetaRad = thetaDeg * Math.PI / 180;

            // Update UI text
            valTheta.innerHTML = `${thetaDeg}&deg;`;
            valPressure.innerText = `${P} Pa`;
            valDepth.innerText = `${w.toFixed(1)} m`;

            // Geometry calculations
            const Lz = Lhyp * Math.cos(thetaRad); // Base length
            const Ly = Lhyp * Math.sin(thetaRad); // Height

            // Centroid offsets to center the prism at origin
            const yOffset = -Ly / 3;
            const zOffset = -Lz / 3;

            const x0 = -w / 2;
            const x1 = w / 2;
            const y0 = yOffset;
            const y1 = Ly + yOffset;
            const z0 = zOffset;
            const z1 = Lz + zOffset;

            // Rebuild Geometry
            const vertices = new Float32Array([
                // Base (normal -y)
                x0, y0, z0, x1, y0, z0, x1, y0, z1,
                x1, y0, z1, x0, y0, z1, x0, y0, z0,

                // Back (normal -z)
                x0, y0, z0, x0, y1, z0, x1, y1, z0,
                x1, y1, z0, x1, y0, z0, x0, y0, z0,

                // Inclined (normal +y, +z)
                x0, y1, z0, x0, y0, z1, x1, y0, z1,
                x1, y0, z1, x1, y1, z0, x0, y1, z0,

                // Side 1 (x0) (normal -x)
                x0, y0, z0, x0, y0, z1, x0, y1, z0,

                // Side 2 (x1) (normal +x)
                x1, y0, z0, x1, y1, z0, x1, y0, z1
            ]);

            prismMesh.geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            prismMesh.geometry.computeVertexNormals();

            prismEdges.geometry.dispose();
            prismEdges.geometry = new THREE.EdgesGeometry(prismMesh.geometry);

            // Physics Calculations
            const An = w * Lhyp;
            const Ay = w * Lz;
            const Az = w * Ly;

            const Fn = P * An;
            const Fa = P * Ay;
            const Fc = P * Az;

            // Update Math UI
            txtFbCos.innerText = (Fn * Math.cos(thetaRad)).toFixed(1) + ' N';
            txtFa.innerText = Fa.toFixed(1) + ' N';
            txtFbSin.innerText = (Fn * Math.sin(thetaRad)).toFixed(1) + ' N';
            txtFc.innerText = Fc.toFixed(1) + ' N';

            // Arrow Origins (Face Centroids)
            const origA = new THREE.Vector3(0, y0, z0 + Lz / 2); // Base
            const origC = new THREE.Vector3(0, y0 + Ly / 2, z0); // Back
            const origB = new THREE.Vector3(0, y0 + Ly / 2, z0 + Lz / 2); // Inclined

            // Arrow Directions
            const dirA = new THREE.Vector3(0, 1, 0);
            const dirC = new THREE.Vector3(0, 0, 1);
            const dirB = new THREE.Vector3(0, -Math.cos(thetaRad), -Math.sin(thetaRad)); // Inward normal

            // Update Arrows
            arrowFa.position.copy(origA);
            arrowFa.setLength(Fa * forceScale, 0.2, 0.1);

            arrowFc.position.copy(origC);
            arrowFc.setLength(Fc * forceScale, 0.2, 0.1);

            arrowFb.position.copy(origB);
            arrowFb.setDirection(dirB);
            arrowFb.setLength(Fn * forceScale, 0.2, 0.1);

            // Calculate Tips for Labels and Dashed Lines
            tipA.copy(origA).add(dirA.clone().multiplyScalar(Fa * forceScale));
            tipC.copy(origC).add(dirC.clone().multiplyScalar(Fc * forceScale));
            tipB.copy(origB).add(dirB.clone().multiplyScalar(Fn * forceScale));

            // Dashed Lines (Components of Fb)
            const ptsVert = [tipB.clone(), new THREE.Vector3(0, origB.y, tipB.z)];
            const ptsHoriz = [tipB.clone(), new THREE.Vector3(0, tipB.y, origB.z)];

            lineVert.geometry.setFromPoints(ptsVert);
            lineVert.computeLineDistances();
            lineHoriz.geometry.setFromPoints(ptsHoriz);
            lineHoriz.computeLineDistances();

            // Gravity
            arrowMg.visible = showGravity;
            lblMg.style.display = showGravity ? 'block' : 'none';
            if (showGravity) {
                const vol = 0.5 * w * Ly * Lz;
                const mgLen = vol * 0.8; // Visual scale for weight
                arrowMg.setLength(mgLen, 0.15, 0.08);
                tipMg.set(0, -mgLen, 0);
            }
        }

        function updateLabels() {
            const widthHalf = window.innerWidth / 2;
            const heightHalf = window.innerHeight / 2;
            const offset = 20; // px offset for labels

            const project = (vec, el, offsetX, offsetY) => {
                const p = vec.clone().project(camera);
                if (p.z > 1) { // Behind camera
                    el.style.opacity = 0;
                    return;
                }
                el.style.opacity = 1;
                const x = (p.x * widthHalf) + widthHalf + offsetX;
                const y = -(p.y * heightHalf) + heightHalf + offsetY;
                el.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
            };

            project(tipA, lblFa, 0, -offset);
            project(tipC, lblFc, 0, -offset);
            project(tipB, lblFb, -offset, offset);

            if (cbGravity.checked) {
                project(tipMg, lblMg, offset, offset);
            }
        }

        // Event Listeners
        slTheta.addEventListener('input', updatePhysics);
        slPressure.addEventListener('input', updatePhysics);
        slDepth.addEventListener('input', updatePhysics);
        cbGravity.addEventListener('change', updatePhysics);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            updateLabels();
        }

        // Init
        updatePhysics();
        animate();

    </script>
</body>

</html>
