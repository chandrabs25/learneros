<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanism of an Acidic Buffer Solution</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            position: relative;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        .instruction {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
            text-align: center;
        }

        /* CSS Animations - 12 Second Loop */
        
        /* Phase 1: Acid Addition (0s - 6s) */
        #anim-h3o {
            animation: h3o-anim 12s infinite ease-in-out;
        }
        @keyframes h3o-anim {
            0%, 5% { transform: translate(100px, 50px); opacity: 0; }
            8% { opacity: 1; transform: translate(300px, 95px); }
            12.49% { transform: translate(645px, 175px); opacity: 1; }
            12.5%, 100% { transform: translate(645px, 175px); opacity: 0; }
        }

        #anim-h2o-acid {
            animation: h2o-acid-anim 12s infinite ease-in-out;
        }
        @keyframes h2o-acid-anim {
            0%, 12.49% { opacity: 0; transform: translate(645px, 175px); }
            12.5%, 25% { opacity: 1; transform: translate(645px, 175px); }
            33.3% { opacity: 0; transform: translate(750px, 50px); }
            100% { opacity: 0; transform: translate(750px, 50px); }
        }

        #anim-proton-acid {
            animation: proton-acid-anim 12s infinite ease-in-out;
        }
        @keyframes proton-acid-anim {
            0%, 12.49% { opacity: 0; transform: translate(645px, 200px); }
            12.5% { opacity: 1; transform: translate(645px, 200px); }
            16.59% { opacity: 1; transform: translate(645px, 270px); }
            16.6%, 100% { opacity: 0; transform: translate(645px, 270px); }
        }

        #anim-acetate-res {
            animation: acetate-res-anim 12s infinite;
        }
        @keyframes acetate-res-anim {
            0%, 16.59% { opacity: 1; }
            16.6%, 33.3% { opacity: 0; }
            33.4%, 100% { opacity: 1; }
        }

        #anim-ha-prod {
            animation: ha-prod-anim 12s infinite;
        }
        @keyframes ha-prod-anim {
            0%, 16.59% { opacity: 0; }
            16.6%, 30% { opacity: 1; }
            33.3%, 100% { opacity: 0; }
        }

        #anim-arrow-acid {
            animation: arrow-acid-anim 12s infinite;
        }
        @keyframes arrow-acid-anim {
            0%, 12.49% { opacity: 0; }
            12.5%, 16.59% { opacity: 1; }
            16.6%, 100% { opacity: 0; }
        }

        #text-acid {
            animation: text-acid-anim 12s infinite;
        }
        @keyframes text-acid-anim {
            0%, 10% { opacity: 0; }
            15%, 30% { opacity: 1; }
            35%, 100% { opacity: 0; }
        }

        /* Phase 2: Base Addition (6s - 12s) */
        #anim-oh {
            animation: oh-anim 12s infinite ease-in-out;
        }
        @keyframes oh-anim {
            0%, 50% { transform: translate(700px, 50px); opacity: 0; }
            55% { opacity: 1; transform: translate(550px, 150px); }
            62.49% { transform: translate(380px, 270px); opacity: 1; }
            66.59% { transform: translate(380px, 270px); opacity: 1; }
            66.6%, 100% { transform: translate(380px, 270px); opacity: 0; }
        }

        #anim-h2o-base {
            animation: h2o-base-anim 12s infinite ease-in-out;
        }
        @keyframes h2o-base-anim {
            0%, 66.59% { opacity: 0; transform: translate(380px, 270px); }
            66.6%, 75% { opacity: 1; transform: translate(380px, 270px); }
            83.3% { opacity: 0; transform: translate(100px, 50px); }
            100% { opacity: 0; transform: translate(100px, 50px); }
        }

        #anim-proton-base {
            animation: proton-base-anim 12s infinite ease-in-out;
        }
        @keyframes proton-base-anim {
            0%, 62.49% { opacity: 0; transform: translate(345px, 270px); }
            62.5% { opacity: 1; transform: translate(345px, 270px); }
            66.59% { opacity: 1; transform: translate(360px, 290px); }
            66.6%, 100% { opacity: 0; transform: translate(360px, 290px); }
        }

        #anim-ha-res {
            animation: ha-res-anim 12s infinite;
        }
        @keyframes ha-res-anim {
            0%, 62.49% { opacity: 1; }
            62.5%, 83.3% { opacity: 0; }
            83.4%, 100% { opacity: 1; }
        }

        #anim-acetate-prod {
            animation: acetate-prod-anim 12s infinite;
        }
        @keyframes acetate-prod-anim {
            0%, 62.49% { opacity: 0; }
            62.5%, 80% { opacity: 1; }
            83.3%, 100% { opacity: 0; }
        }

        #anim-arrow-base {
            animation: arrow-base-anim 12s infinite;
        }
        @keyframes arrow-base-anim {
            0%, 62.49% { opacity: 0; }
            62.5%, 66.59% { opacity: 1; }
            66.6%, 100% { opacity: 0; }
        }

        #text-base {
            animation: text-base-anim 12s infinite;
        }
        @keyframes text-base-anim {
            0%, 60% { opacity: 0; }
            65%, 80% { opacity: 1; }
            85%, 100% { opacity: 0; }
        }

        /* pH Scale Flicker */
        #ph-needle {
            animation: ph-needle-anim 12s infinite ease-in-out;
            transform-origin: 304px 420px;
        }
        @keyframes ph-needle-anim {
            0%, 15% { transform: rotate(0deg); }
            16.6% { transform: rotate(-4deg); }
            22% { transform: rotate(0deg); }
            50%, 65% { transform: rotate(0deg); }
            66.6% { transform: rotate(4deg); }
            72%, 100% { transform: rotate(0deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Mechanism of an Acidic Buffer Solution</title>
        <desc>An animated diagram showing how an acetic acid buffer neutralizes added hydronium (acid) and hydroxide (base) ions to maintain a stable pH.</desc>

        <!-- Definitions -->
        <defs>
            <!-- Atoms -->
            <g id="atom-C">
                <circle r="14" fill="#404040"/>
                <text y="4" fill="#fff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">C</text>
            </g>
            <g id="atom-O">
                <circle r="13" fill="#FF4444"/>
                <text y="4" fill="#fff" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle">O</text>
            </g>
            <g id="atom-H">
                <circle r="9" fill="#CCCCCC"/>
                <text y="3" fill="#333" font-family="Inter" font-size="10" font-weight="600" text-anchor="middle">H</text>
            </g>
            <g id="atom-H-acidic">
                <circle r="9" fill="#CCCCCC" stroke="#F77F00" stroke-width="2"/>
                <text y="3" fill="#333" font-family="Inter" font-size="10" font-weight="600" text-anchor="middle">H</text>
            </g>
            
            <!-- Charges -->
            <g id="charge-minus">
                <circle r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <text y="3.5" fill="#333" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">-</text>
            </g>
            <g id="charge-plus">
                <circle r="7" fill="#fff" stroke="#333" stroke-width="1.5"/>
                <text y="3.5" fill="#333" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle">+</text>
            </g>

            <!-- Molecules -->
            <g id="mol-HA">
                <!-- Bonds -->
                <line x1="0" y1="0" x2="-15" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="-25" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="-15" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="40" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="37" y1="-2" x2="52" y2="-32" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                <line x1="43" y1="2" x2="58" y2="-28" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="0" x2="65" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="65" y1="20" x2="95" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <!-- Atoms -->
                <use href="#atom-H" x="-15" y="-20"/>
                <use href="#atom-H" x="-25" y="0"/>
                <use href="#atom-H" x="-15" y="20"/>
                <use href="#atom-C" x="0" y="0"/>
                <use href="#atom-C" x="40" y="0"/>
                <use href="#atom-O" x="55" y="-30"/>
                <use href="#atom-O" x="65" y="20"/>
                <use href="#atom-H-acidic" x="95" y="20"/>
                <text x="35" y="45" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">CH₃COOH</text>
            </g>

            <g id="mol-A-minus">
                <!-- Bonds -->
                <line x1="0" y1="0" x2="-15" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="-25" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="-15" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="40" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="37" y1="-2" x2="52" y2="-32" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                <line x1="43" y1="2" x2="58" y2="-28" stroke="#555" stroke-width="4" stroke-linecap="round"/>
                <line x1="40" y1="0" x2="65" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <!-- Atoms -->
                <use href="#atom-H" x="-15" y="-20"/>
                <use href="#atom-H" x="-25" y="0"/>
                <use href="#atom-H" x="-15" y="20"/>
                <use href="#atom-C" x="0" y="0"/>
                <use href="#atom-C" x="40" y="0"/>
                <use href="#atom-O" x="55" y="-30"/>
                <use href="#atom-O" x="65" y="20"/>
                <use href="#charge-minus" x="82" y="30"/>
                <text x="35" y="45" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">CH₃COO⁻</text>
            </g>

            <g id="mol-H3O">
                <line x1="0" y1="0" x2="-20" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="20" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="0" y2="25" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <use href="#atom-H" x="-20" y="-20"/>
                <use href="#atom-H" x="20" y="-20"/>
                <use href="#atom-H-acidic" x="0" y="25"/>
                <use href="#atom-O" x="0" y="0"/>
                <use href="#charge-plus" x="18" y="-10"/>
                <text x="0" y="45" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">H₃O⁺</text>
            </g>

            <g id="mol-OH">
                <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <use href="#atom-O" x="0" y="0"/>
                <use href="#atom-H" x="30" y="0"/>
                <use href="#charge-minus" x="-15" y="-15"/>
                <text x="15" y="25" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">OH⁻</text>
            </g>

            <g id="mol-H2O">
                <line x1="0" y1="0" x2="-20" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="20" y2="-20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <use href="#atom-H" x="-20" y="-20"/>
                <use href="#atom-H" x="20" y="-20"/>
                <use href="#atom-O" x="0" y="0"/>
                <text x="0" y="20" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">H₂O</text>
            </g>

            <g id="mol-H2O-base">
                <line x1="0" y1="0" x2="30" y2="0" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <line x1="0" y1="0" x2="-20" y2="20" stroke="#333" stroke-width="4" stroke-linecap="round"/>
                <use href="#atom-O" x="0" y="0"/>
                <use href="#atom-H" x="30" y="0"/>
                <use href="#atom-H" x="-20" y="20"/>
                <text x="5" y="35" font-family="'Roboto Mono', monospace" font-size="14" fill="#555" text-anchor="middle">H₂O</text>
            </g>

            <!-- Arrowhead Marker -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00"/>
            </marker>

            <!-- pH Gradient -->
            <linearGradient id="ph-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FF0000"/>
                <stop offset="25%" stop-color="#FFA500"/>
                <stop offset="50%" stop-color="#00FF00"/>
                <stop offset="75%" stop-color="#008080"/>
                <stop offset="100%" stop-color="#0000FF"/>
            </linearGradient>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Header -->
        <text x="400" y="45" font-family="Inter" font-size="24" font-weight="700" text-anchor="middle" fill="#222">Mechanism of an Acidic Buffer Solution</text>
        <text x="400" y="75" font-family="'Roboto Mono', monospace" font-size="18" text-anchor="middle" fill="#555">CH₃COOH + H₂O ⇌ CH₃COO⁻ + H₃O⁺</text>

        <!-- Legend -->
        <rect x="650" y="15" width="130" height="85" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
        <circle cx="670" cy="32" r="6" fill="#404040"/>
        <text x="685" y="36" font-family="Inter" font-size="12" fill="#555">Carbon</text>
        <circle cx="670" cy="52" r="6" fill="#FF4444"/>
        <text x="685" y="56" font-family="Inter" font-size="12" fill="#555">Oxygen</text>
        <circle cx="670" cy="72" r="6" fill="#CCCCCC"/>
        <text x="685" y="76" font-family="Inter" font-size="12" fill="#555">Hydrogen</text>

        <!-- Background Reservoir Molecules (Faded) -->
        <use href="#mol-HA" x="120" y="160" opacity="0.15" transform="rotate(15 120 160)"/>
        <use href="#mol-A-minus" x="680" y="320" opacity="0.15" transform="rotate(-20 680 320)"/>
        <use href="#mol-HA" x="250" y="360" opacity="0.15" transform="rotate(-15 250 360)"/>
        <use href="#mol-A-minus" x="520" y="130" opacity="0.15" transform="rotate(25 520 130)"/>

        <!-- Central Equilibrium Arrow -->
        <g stroke="#7209B7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="360" y1="240" x2="440" y2="240"/>
            <polyline points="425,225 440,240" fill="none"/>
            <line x1="360" y1="260" x2="440" y2="260"/>
            <polyline points="375,275 360,260" fill="none"/>
        </g>
        <text x="400" y="220" font-family="Inter" font-size="14" fill="#7209B7" text-anchor="middle" font-style="italic" font-weight="600">Buffer Reservoir</text>

        <!-- ========================================== -->
        <!-- SCENE 1: ACID ADDITION (Right Side)        -->
        <!-- ========================================== -->
        
        <!-- Reservoir Acetate (Reacts with incoming acid) -->
        <g id="anim-acetate-res">
            <use href="#mol-A-minus" x="550" y="250"/>
        </g>

        <!-- Product Acetic Acid (Formed after reaction) -->
        <g id="anim-ha-prod">
            <use href="#mol-HA" x="550" y="250"/>
        </g>

        <!-- Incoming Hydronium -->
        <g id="anim-h3o">
            <use href="#mol-H3O" x="0" y="0"/>
        </g>

        <!-- Outgoing Water (from Hydronium) -->
        <g id="anim-h2o-acid">
            <use href="#mol-H2O" x="0" y="0"/>
        </g>

        <!-- Transferring Proton (Acid) -->
        <g id="anim-proton-acid">
            <use href="#atom-H-acidic" x="0" y="0"/>
        </g>

        <!-- Electron Flow Arrow (Acid) -->
        <path id="anim-arrow-acid" d="M 615,270 Q 570,230 635,205" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>

        <!-- Dynamic Text (Acid) -->
        <text id="text-acid" x="400" y="370" font-family="Inter" font-size="18" font-weight="700" fill="#F77F00" text-anchor="middle">Added H₃O⁺ neutralized by CH₃COO⁻</text>


        <!-- ========================================== -->
        <!-- SCENE 2: BASE ADDITION (Left Side)         -->
        <!-- ========================================== -->

        <!-- Reservoir Acetic Acid (Reacts with incoming base) -->
        <g id="anim-ha-res">
            <use href="#mol-HA" x="250" y="250"/>
        </g>

        <!-- Product Acetate (Formed after reaction) -->
        <g id="anim-acetate-prod">
            <use href="#mol-A-minus" x="250" y="250"/>
        </g>

        <!-- Incoming Hydroxide -->
        <g id="anim-oh">
            <use href="#mol-OH" x="0" y="0"/>
        </g>

        <!-- Outgoing Water (from Hydroxide) -->
        <g id="anim-h2o-base">
            <use href="#mol-H2O-base" x="0" y="0"/>
        </g>

        <!-- Transferring Proton (Base) -->
        <g id="anim-proton-base">
            <use href="#atom-H-acidic" x="0" y="0"/>
        </g>

        <!-- Electron Flow Arrow (Base) -->
        <path id="anim-arrow-base" d="M 380,280 Q 350,320 345,280" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>

        <!-- Dynamic Text (Base) -->
        <text id="text-base" x="400" y="370" font-family="Inter" font-size="18" font-weight="700" fill="#F77F00" text-anchor="middle">Added OH⁻ neutralized by CH₃COOH</text>


        <!-- ========================================== -->
        <!-- FOOTER: pH SCALE                           -->
        <!-- ========================================== -->
        
        <rect x="100" y="440" width="600" height="16" rx="8" fill="url(#ph-grad)" stroke="#ddd" stroke-width="1"/>
        <text x="100" y="475" font-family="Inter" font-size="14" font-weight="600" fill="#555" text-anchor="middle">pH 0</text>
        <text x="400" y="475" font-family="Inter" font-size="14" font-weight="600" fill="#555" text-anchor="middle">pH 7</text>
        <text x="700" y="475" font-family="Inter" font-size="14" font-weight="600" fill="#555" text-anchor="middle">pH 14</text>
        
        <!-- pH Needle (Centered at pKa = 4.76 approx x=304) -->
        <g id="ph-needle">
            <polygon points="298,420 310,420 304,442" fill="#222"/>
            <circle cx="304" cy="420" r="4" fill="#222"/>
            <text x="304" y="410" font-family="Inter" font-size="14" font-weight="700" fill="#222" text-anchor="middle">4.76</text>
        </g>

    </svg>
</div>
<div class="instruction">Animation loops every 12 seconds. Watch the pH needle remain stable during additions.</div>

</body>
</html>
