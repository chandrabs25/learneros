<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastid Differentiation & Pigment Classification</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 800px;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-size: 26px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 400; fill: #7F8C8D; }
        .label { font-family: 'Inter', sans-serif; font-size: 14px; fill: #2C3E50; }
        .sub-label { font-family: 'Inter', sans-serif; font-size: 11px; fill: #7F8C8D; }
        .sci-label { font-family: 'Roboto Mono', monospace; font-size: 10px; fill: #34495E; }
        .bold { font-weight: 700; }

        /* Animations */
        .proplastid {
            animation: pulse-pro 12s ease-in-out infinite;
            transform-origin: 150px 280px;
        }

        .flow-arrow {
            stroke-dasharray: 450;
            stroke-dashoffset: 450;
            animation: draw-arrow 12s ease-in-out infinite;
        }

        .plastid {
            animation: plastid-appear 12s ease-in-out infinite;
        }

        .leuco-sub {
            animation: leuco-sub-appear 12s ease-in-out infinite;
        }

        .grana {
            animation: grana-grow 12s ease-in-out infinite;
        }

        .crystals {
            animation: crystals-appear 12s ease-in-out infinite;
        }

        .sun {
            animation: sun-glow 12s ease-in-out infinite;
        }

        .chloro-glow-effect {
            animation: chloro-glow 12s ease-in-out infinite;
        }

        /* Keyframes */
        @keyframes pulse-pro {
            0%, 100% { transform: scale(1); }
            8% { transform: scale(1.08); }
            16%, 85% { transform: scale(1); }
        }

        @keyframes draw-arrow {
            0%, 8% { stroke-dashoffset: 450; opacity: 0; }
            10% { opacity: 1; }
            25%, 85% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: -450; opacity: 0; }
        }

        @keyframes plastid-appear {
            0%, 15% { transform: scale(0.5); opacity: 0; }
            25%, 85% { transform: scale(1); opacity: 1; }
            95%, 100% { transform: scale(0.5); opacity: 0; }
        }

        @keyframes leuco-sub-appear {
            0%, 35% { transform: scale(0.8) translateX(-20px); opacity: 0; }
            45%, 85% { transform: scale(1) translateX(0); opacity: 1; }
            95%, 100% { transform: scale(0.8) translateX(-20px); opacity: 0; }
        }

        @keyframes grana-grow {
            0%, 25% { transform: scaleY(0); opacity: 0; }
            40%, 85% { transform: scaleY(1); opacity: 1; }
            95%, 100% { transform: scaleY(0); opacity: 0; }
        }

        @keyframes crystals-appear {
            0%, 30% { transform: scale(0.5) rotate(-10deg); opacity: 0; }
            40%, 85% { transform: scale(1) rotate(0deg); opacity: 1; }
            95%, 100% { transform: scale(0.5) rotate(10deg); opacity: 0; }
        }

        @keyframes sun-glow {
            0%, 55% { transform: translateY(15px) rotate(0deg); opacity: 0; }
            65%, 80% { transform: translateY(0) rotate(45deg); opacity: 1; }
            85%, 100% { transform: translateY(-15px) rotate(90deg); opacity: 0; }
        }

        @keyframes chloro-glow {
            0%, 55% { filter: drop-shadow(0 0 0px rgba(39,174,96,0)); }
            65%, 80% { filter: drop-shadow(0 0 15px rgba(39,174,96,0.6)); }
            85%, 100% { filter: drop-shadow(0 0 0px rgba(39,174,96,0)); }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 1000 650" preserveAspectRatio="xMidYMid meet" aria-label="Animated diagram showing the differentiation of a Proplastid into Chloroplast, Chromoplast, and Leucoplast subtypes.">
        <title>Plastid Differentiation & Pigment Classification</title>
        <desc>Animation illustrating how a precursor proplastid develops into specialized double-membrane plastids: Chloroplasts for photosynthesis, Chromoplasts for pigment storage, and Leucoplasts for storing starch, oil, and proteins.</desc>

        <defs>
            <!-- Arrow Marker -->
            <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#BDC3C7" />
            </marker>
            
            <!-- Oil Droplet Gradient -->
            <radialGradient id="oil-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="40%" stop-color="#FCF3CF" />
                <stop offset="100%" stop-color="#F1C40F" />
            </radialGradient>

            <!-- Stroma Gradient -->
            <radialGradient id="stroma-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#E8F8F5" />
                <stop offset="100%" stop-color="#D4EFDF" />
            </radialGradient>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Header Titles -->
        <text x="500" y="40" text-anchor="middle" class="title">Plastid Differentiation &amp; Pigment Classification</text>
        <text x="500" y="60" text-anchor="middle" class="subtitle">Developmental pathways of double-membrane organelles in plant cells</text>

        <!-- Flow Arrows -->
        <g fill="none" stroke="#BDC3C7" stroke-width="2.5" marker-end="url(#arrowhead)">
            <!-- To Chloroplast -->
            <path d="M 200 260 Q 300 120 350 120" class="flow-arrow" />
            <!-- To Chromoplast -->
            <path d="M 200 280 Q 380 280 560 280" class="flow-arrow" />
            <!-- To Leucoplast -->
            <path d="M 200 300 Q 300 480 370 480" class="flow-arrow" />
            
            <!-- Leucoplast Subtypes -->
            <path d="M 525 460 Q 600 400 700 400" class="flow-arrow" />
            <path d="M 525 480 L 700 480" class="flow-arrow" />
            <path d="M 525 500 Q 600 560 700 560" class="flow-arrow" />
        </g>

        <!-- PROPLASTID -->
        <g id="proplastid" class="proplastid">
            <!-- Double Membrane -->
            <ellipse cx="150" cy="280" rx="45" ry="30" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <ellipse cx="150" cy="280" rx="40" ry="25" fill="#D5DBDB" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4 2"/>
            <!-- Internal simple DNA/Ribosomes -->
            <circle cx="140" cy="275" r="2" fill="#2C3E50"/>
            <circle cx="160" cy="285" r="2" fill="#2C3E50"/>
            <path d="M 135 285 Q 145 290 155 280 T 165 275" fill="none" stroke="#FF6B6B" stroke-width="1"/>
            
            <!-- Labels -->
            <text x="150" y="335" text-anchor="middle" class="label bold">Proplastid</text>
            <text x="150" y="350" text-anchor="middle" class="sub-label">Undifferentiated Precursor</text>
        </g>

        <!-- CHLOROPLAST -->
        <g id="chloroplast" class="plastid chloro-glow-effect" style="transform-origin: 450px 120px;">
            <!-- Double Membrane -->
            <ellipse cx="450" cy="120" rx="90" ry="50" fill="url(#stroma-grad)" stroke="#27AE60" stroke-width="2.5"/>
            <ellipse cx="450" cy="120" rx="84" ry="44" fill="none" stroke="#27AE60" stroke-width="1.5"/>
            
            <!-- Internal Structures (Grana & Stroma Lamellae) -->
            <g class="grana" style="transform-origin: 450px 120px;">
                <!-- Stroma Lamellae (Connecting lines) -->
                <line x1="390" y1="125" x2="510" y2="125" stroke="#1E8449" stroke-width="1.5"/>
                <line x1="400" y1="110" x2="480" y2="110" stroke="#1E8449" stroke-width="1.5"/>
                <line x1="420" y1="135" x2="500" y2="135" stroke="#1E8449" stroke-width="1.5"/>

                <!-- Stack 1 -->
                <rect x="385" y="120" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="385" y="113" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="385" y="106" width="18" height="5" rx="2" fill="#1E8449"/>
                
                <!-- Stack 2 -->
                <rect x="425" y="130" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="425" y="123" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="425" y="116" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="425" y="109" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="425" y="102" width="18" height="5" rx="2" fill="#1E8449"/>

                <!-- Stack 3 -->
                <rect x="465" y="125" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="465" y="118" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="465" y="111" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="465" y="104" width="18" height="5" rx="2" fill="#1E8449"/>

                <!-- Stack 4 -->
                <rect x="500" y="132" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="500" y="125" width="18" height="5" rx="2" fill="#1E8449"/>
                <rect x="500" y="118" width="18" height="5" rx="2" fill="#1E8449"/>
            </g>
            
            <!-- Labels -->
            <text x="450" y="195" text-anchor="middle" class="label bold">Chloroplast</text>
            <text x="450" y="210" text-anchor="middle" class="sub-label">Photosynthesis</text>
            <text x="450" y="225" text-anchor="middle" class="sci-label">Pigment: Chlorophyll</text>
        </g>

        <!-- SUNLIGHT ICON -->
        <g id="sun" class="sun" style="transform-origin: 450px 30px;">
            <circle cx="450" cy="30" r="12" fill="#F1C40F"/>
            <line x1="450" y1="8" x2="450" y2="14" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="450" y1="46" x2="450" y2="52" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="428" y1="30" x2="434" y2="30" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="466" y1="30" x2="472" y2="30" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="434" y1="14" x2="438" y2="18" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="466" y1="46" x2="462" y2="42" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="434" y1="46" x2="438" y2="42" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="466" y1="14" x2="462" y2="18" stroke="#F1C40F" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- CHROMOPLAST -->
        <g id="chromoplast" class="plastid" style="transform-origin: 650px 280px;">
            <!-- Irregular Double Membrane -->
            <path d="M 580 280 C 590 230, 630 220, 680 240 C 720 260, 740 310, 700 330 C 660 350, 600 340, 580 280 Z" fill="#FDEBD0" stroke="#E67E22" stroke-width="2.5"/>
            <path d="M 588 280 C 596 238, 632 230, 676 248 C 710 264, 728 306, 692 322 C 658 340, 606 332, 588 280 Z" fill="none" stroke="#E67E22" stroke-width="1.5"/>
            
            <!-- Internal Pigment Crystals -->
            <g class="crystals" style="transform-origin: 650px 280px;">
                <!-- Carotene Needles -->
                <polygon points="610,270 650,265 610,260" fill="#D35400" transform="rotate(15 630 265)"/>
                <polygon points="660,290 700,280 660,270" fill="#F1C40F" transform="rotate(-25 680 280)"/>
                <polygon points="630,310 660,295 625,300" fill="#E67E22" transform="rotate(45 640 305)"/>
                <polygon points="670,250 690,230 665,240" fill="#D35400" transform="rotate(-10 675 240)"/>
                
                <!-- Plastoglobuli (Lipid droplets with pigments) -->
                <circle cx="640" cy="290" r="6" fill="#E67E22"/>
                <circle cx="680" cy="260" r="4" fill="#D35400"/>
                <circle cx="620" cy="250" r="5" fill="#F1C40F"/>
            </g>
            
            <!-- Labels -->
            <text x="650" y="365" text-anchor="middle" class="label bold">Chromoplast</text>
            <text x="650" y="380" text-anchor="middle" class="sub-label">Color Pigment Storage</text>
            <text x="650" y="395" text-anchor="middle" class="sci-label">Carotenoids &amp; Xanthophylls</text>
        </g>

        <!-- LEUCOPLAST (Main Branch) -->
        <g id="leucoplast" class="plastid" style="transform-origin: 450px 480px;">
            <!-- Double Membrane -->
            <ellipse cx="450" cy="480" rx="75" ry="50" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="2.5"/>
            <ellipse cx="450" cy="480" rx="69" ry="44" fill="none" stroke="#BDC3C7" stroke-width="1.5"/>
            
            <!-- Labels -->
            <text x="450" y="555" text-anchor="middle" class="label bold">Leucoplast</text>
            <text x="450" y="570" text-anchor="middle" class="sub-label">Colorless Storage Plastid</text>
        </g>

        <!-- LEUCOPLAST SUBTYPES -->
        
        <!-- Amyloplast -->
        <g id="amyloplast" class="leuco-sub" style="transform-origin: 750px 400px;">
            <ellipse cx="750" cy="400" rx="45" ry="35" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="2"/>
            <!-- Starch grains with concentric rings -->
            <g class="crystals">
                <!-- Grain 1 -->
                <ellipse cx="735" cy="395" rx="14" ry="18" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="1.5"/>
                <ellipse cx="735" cy="395" rx="10" ry="13" fill="none" stroke="#D5DBDB" stroke-width="1"/>
                <ellipse cx="735" cy="395" rx="6" ry="8" fill="none" stroke="#D5DBDB" stroke-width="1"/>
                <circle cx="735" cy="395" r="2" fill="#BDC3C7"/> <!-- Hilum -->
                
                <!-- Grain 2 -->
                <ellipse cx="765" cy="405" rx="12" ry="15" fill="#F8F9FA" stroke="#D5DBDB" stroke-width="1.5"/>
                <ellipse cx="765" cy="405" rx="8" ry="10" fill="none" stroke="#D5DBDB" stroke-width="1"/>
                <ellipse cx="765" cy="405" rx="4" ry="5" fill="none" stroke="#D5DBDB" stroke-width="1"/>
                <circle cx="765" cy="405" r="1.5" fill="#BDC3C7"/>
            </g>
            <text x="810" y="400" text-anchor="start" class="label bold">Amyloplast</text>
            <text x="810" y="415" text-anchor="start" class="sub-label">Stores Starch</text>
        </g>

        <!-- Elaioplast -->
        <g id="elaioplast" class="leuco-sub" style="transform-origin: 750px 480px;">
            <ellipse cx="750" cy="480" rx="45" ry="35" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="2"/>
            <!-- Oil droplets -->
            <g class="crystals">
                <circle cx="735" cy="475" r="14" fill="url(#oil-grad)"/>
                <circle cx="765" cy="485" r="10" fill="url(#oil-grad)"/>
                <circle cx="755" cy="460" r="8" fill="url(#oil-grad)"/>
                <circle cx="730" cy="495" r="6" fill="url(#oil-grad)"/>
            </g>
            <text x="810" y="480" text-anchor="start" class="label bold">Elaioplast</text>
            <text x="810" y="495" text-anchor="start" class="sub-label">Stores Fats &amp; Oils</text>
        </g>

        <!-- Aleuroplast -->
        <g id="aleuroplast" class="leuco-sub" style="transform-origin: 750px 560px;">
            <ellipse cx="750" cy="560" rx="45" ry="35" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="2"/>
            <!-- Protein crystals -->
            <g class="crystals">
                <rect x="730" y="545" width="14" height="14" fill="#98D8C8" stroke="#76C7B3" stroke-width="1" transform="rotate(45 737 552)"/>
                <polygon points="760,540 775,555 765,570 750,555" fill="#98D8C8" stroke="#76C7B3" stroke-width="1"/>
                <rect x="725" y="565" width="10" height="10" fill="#98D8C8" stroke="#76C7B3" stroke-width="1" transform="rotate(15 730 570)"/>
                <polygon points="745,575 755,565 765,575 755,585" fill="#98D8C8" stroke="#76C7B3" stroke-width="1"/>
            </g>
            <text x="810" y="560" text-anchor="start" class="label bold">Aleuroplast</text>
            <text x="810" y="575" text-anchor="start" class="sub-label">Stores Proteins</text>
        </g>

        <!-- Legend -->
        <g id="legend" transform="translate(40, 500)">
            <rect x="0" y="0" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" opacity="0.9"/>
            <text x="15" y="25" class="label bold">Legend / Key</text>
            
            <!-- Chlorophyll -->
            <rect x="15" y="40" width="12" height="12" rx="2" fill="#27AE60"/>
            <text x="35" y="50" class="sub-label">Chlorophyll (Green)</text>
            
            <!-- Carotenoids -->
            <rect x="15" y="60" width="12" height="12" rx="2" fill="#E67E22"/>
            <text x="35" y="70" class="sub-label">Carotenoids (Orange/Red)</text>
            
            <!-- Storage -->
            <rect x="15" y="80" width="12" height="12" rx="2" fill="#F8F9FA" stroke="#BDC3C7" stroke-width="1"/>
            <text x="35" y="90" class="sub-label">Colorless Storage</text>
        </g>

    </svg>

</body>
</html>
