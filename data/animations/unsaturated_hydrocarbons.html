<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formation of the Alkyne Triple Bond</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        
        /* Hardware Acceleration */
        .anim-c1, .anim-c2, .anim-h1, .anim-h2, .sigma-glow, .pi-y-cloud, .pi-z-cloud, .final-label, .molecule-wrapper, .label-fade-1, .label-fade-2, .label-fade-3, .arrow-l, .arrow-r {
            will-change: transform, opacity;
        }

        /* Phase 1: Approach (0-3s) -> 0% to 25% */
        @keyframes moveC1 {
            0%, 5% { transform: translateX(-120px); opacity: 0; }
            10% { opacity: 1; }
            25%, 91.6% { transform: translateX(0); opacity: 1; }
            96%, 100% { transform: translateX(0); opacity: 0; }
        }
        @keyframes moveC2 {
            0%, 5% { transform: translateX(120px); opacity: 0; }
            10% { opacity: 1; }
            25%, 91.6% { transform: translateX(0); opacity: 1; }
            96%, 100% { transform: translateX(0); opacity: 0; }
        }
        @keyframes moveH1 {
            0%, 5% { transform: translateX(-180px); opacity: 0; }
            10% { opacity: 1; }
            25%, 91.6% { transform: translateX(0); opacity: 1; }
            96%, 100% { transform: translateX(0); opacity: 0; }
        }
        @keyframes moveH2 {
            0%, 5% { transform: translateX(180px); opacity: 0; }
            10% { opacity: 1; }
            25%, 91.6% { transform: translateX(0); opacity: 1; }
            96%, 100% { transform: translateX(0); opacity: 0; }
        }

        /* Phase 2: Sigma Bond (3-5s) -> 25% to 41.6% */
        @keyframes sigmaGlow {
            0%, 25% { opacity: 0; transform: scale(0.5); }
            30% { opacity: 1; transform: scale(1.2); }
            35%, 91.6% { opacity: 0.85; transform: scale(1); }
            96%, 100% { opacity: 0; }
        }

        /* Phase 3: First Pi Bond (5-7s) -> 41.6% to 58.3% */
        @keyframes piYCloud {
            0%, 41.6% { opacity: 0; transform: scaleY(0.5); }
            50%, 91.6% { opacity: 1; transform: scaleY(1); }
            96%, 100% { opacity: 0; }
        }

        /* Phase 4: Second Pi Bond (7-9s) -> 58.3% to 75% */
        @keyframes piZCloud {
            0%, 58.3% { opacity: 0; transform: scaleY(0.5); }
            66.6%, 91.6% { opacity: 1; transform: scaleY(1); }
            96%, 100% { opacity: 0; }
        }

        /* Phase 5: Final Structure (9-11s) -> 75% to 91.6% */
        @keyframes finalLabel {
            0%, 75% { opacity: 0; transform: translateY(10px); }
            80%, 91.6% { opacity: 1; transform: translateY(0); }
            96%, 100% { opacity: 0; }
        }
        @keyframes molPulse {
            0%, 75% { transform: scale(1); }
            83.3% { transform: scale(1.03); }
            91.6%, 100% { transform: scale(1); }
        }

        /* Label Fade-ins */
        @keyframes labelFade1 {
            0%, 5% { opacity: 0; }
            15%, 91.6% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes labelFade2 {
            0%, 25% { opacity: 0; }
            35%, 91.6% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes labelFade3 {
            0%, 58.3% { opacity: 0; }
            66.6%, 91.6% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        /* Arrows */
        @keyframes arrowMoveL {
            0%, 5% { opacity: 0; transform: translateX(-20px); }
            10%, 20% { opacity: 1; transform: translateX(0); }
            25%, 100% { opacity: 0; transform: translateX(15px); }
        }
        @keyframes arrowMoveR {
            0%, 5% { opacity: 0; transform: translateX(20px); }
            10%, 20% { opacity: 1; transform: translateX(0); }
            25%, 100% { opacity: 0; transform: translateX(-15px); }
        }

        /* Assign Animations */
        .anim-c1 { animation: moveC1 12s infinite ease-in-out; }
        .anim-c2 { animation: moveC2 12s infinite ease-in-out; }
        .anim-h1 { animation: moveH1 12s infinite ease-in-out; }
        .anim-h2 { animation: moveH2 12s infinite ease-in-out; }
        
        .sigma-glow {
            animation: sigmaGlow 12s infinite ease-in-out;
            transform-origin: center;
        }
        
        .pi-y-cloud {
            animation: piYCloud 12s infinite ease-in-out;
            transform-origin: 400px 250px;
        }
        
        .pi-z-cloud {
            animation: piZCloud 12s infinite ease-in-out;
            transform-origin: 400px 250px;
        }
        
        .final-label { animation: finalLabel 12s infinite ease-in-out; }
        .molecule-wrapper {
            animation: molPulse 12s infinite ease-in-out;
            transform-origin: 400px 250px;
        }

        .label-fade-1 { animation: labelFade1 12s infinite ease-in-out; }
        .label-fade-2 { animation: labelFade2 12s infinite ease-in-out; }
        .label-fade-3 { animation: labelFade3 12s infinite ease-in-out; }
        
        .arrow-l { animation: arrowMoveL 12s infinite ease-in-out; }
        .arrow-r { animation: arrowMoveR 12s infinite ease-in-out; }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 600; fill: #6c757d; }
        .annotation { font-size: 13px; font-weight: 600; fill: #495057; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; fill: #adb5bd; }
        .main-formula { font-family: 'Roboto Mono', monospace; font-size: 32px; font-weight: 700; fill: #F77F00; }
        .legend-text { font-size: 12px; font-weight: 400; fill: #495057; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Animated diagram showing the orbital overlap of ethyne to form a triple bond</title>
    <desc>Visualization of sp, py, and pz orbitals overlapping to form one sigma and two pi bonds in a linear C2H2 molecule.</desc>

    <!-- Definitions for Gradients, Filters, and Reusable Shapes -->
    <defs>
        <!-- Atom Gradients -->
        <radialGradient id="grad-c" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#777"/>
            <stop offset="100%" stop-color="#404040"/>
        </radialGradient>
        <radialGradient id="grad-h" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFF"/>
            <stop offset="100%" stop-color="#CCCCCC"/>
        </radialGradient>
        
        <!-- Sigma Glow Gradient -->
        <radialGradient id="grad-sigma" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
            <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>

        <!-- Cloud Blur Filter -->
        <filter id="cloud-blur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="6" />
        </filter>

        <!-- Orbital Paths -->
        <!-- sp hybrid orbital (pointing right) -->
        <g id="sp-right">
            <path d="M 0,0 C 30,-22 60,-16 75,0 C 60,16 30,22 0,0 Z" fill="rgba(168,218,220,0.6)" stroke="#A8DADC" stroke-width="1.5"/>
        </g>
        <!-- sp hybrid orbital (pointing left) -->
        <g id="sp-left">
            <path d="M 0,0 C -30,-22 -60,-16 -75,0 C -60,16 -30,22 0,0 Z" fill="rgba(168,218,220,0.6)" stroke="#A8DADC" stroke-width="1.5"/>
        </g>
        <!-- 2py orbital (vertical) -->
        <g id="py-up">
            <path d="M 0,0 C -25,-30 -20,-80 0,-95 C 20,-80 25,-30 0,0 Z" fill="rgba(155,93,229,0.35)" stroke="#9B5DE5" stroke-width="1.5" stroke-dasharray="3 2"/>
        </g>
        <g id="py-down">
            <path d="M 0,0 C -25,30 -20,80 0,95 C 20,80 25,30 0,0 Z" fill="rgba(155,93,229,0.35)" stroke="#9B5DE5" stroke-width="1.5" stroke-dasharray="3 2"/>
        </g>
        <!-- 2pz orbital (tilted for perspective) -->
        <g id="pz-front">
            <path d="M 0,0 C -25,20 -30,60 -15,75 C 5,60 15,20 0,0 Z" fill="rgba(241,91,181,0.45)" stroke="#F15BB5" stroke-width="1.5" stroke-dasharray="3 2"/>
        </g>
        <g id="pz-back">
            <path d="M 0,0 C 25,-20 30,-60 15,-75 C -5,-60 -15,-20 0,0 Z" fill="rgba(241,91,181,0.45)" stroke="#F15BB5" stroke-width="1.5" stroke-dasharray="3 2"/>
        </g>
    </defs>

    <!-- Static Background & Titles -->
    <rect width="100%" height="100%" fill="#f8f9fa" />
    <text x="400" y="45" class="title" text-anchor="middle">Formation of the Alkyne Triple Bond (C₂H₂)</text>
    <text x="400" y="475" class="subtitle" text-anchor="middle">Linear Geometry: 180°</text>
    <text x="770" y="475" class="formula" text-anchor="end">CₙH₂ₙ₋₂</text>

    <!-- Legend -->
    <g transform="translate(30, 400)">
        <rect x="0" y="0" width="12" height="12" fill="rgba(168,218,220,0.8)" stroke="#A8DADC" stroke-width="1"/>
        <text x="20" y="10" class="legend-text">sp hybrid orbital</text>
        
        <rect x="0" y="20" width="12" height="12" fill="rgba(155,93,229,0.6)" stroke="#9B5DE5" stroke-width="1"/>
        <text x="20" y="30" class="legend-text">2p_y orbital</text>
        
        <rect x="0" y="40" width="12" height="12" fill="rgba(241,91,181,0.6)" stroke="#F15BB5" stroke-width="1"/>
        <text x="20" y="50" class="legend-text">2p_z orbital</text>
        
        <rect x="0" y="60" width="12" height="12" fill="#FFFFFF" stroke="#CCC" stroke-width="1"/>
        <text x="20" y="70" class="legend-text">σ / π overlap</text>
    </g>

    <!-- Animated Labels and Pointers -->
    <!-- Top Left: p orbitals -->
    <g class="label-fade-1">
        <text x="200" y="90" class="annotation" text-anchor="middle">2p_y and 2p_z unhybridized orbitals</text>
        <path d="M 200,98 L 305,165" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
        <circle cx="305" cy="165" r="3" fill="#7209B7"/>
    </g>
    
    <!-- Bottom Left: sp orbitals -->
    <g class="label-fade-1">
        <text x="200" y="420" class="annotation" text-anchor="middle">sp hybrid orbitals</text>
        <path d="M 200,405 L 280,260" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
        <circle cx="280" cy="260" r="3" fill="#7209B7"/>
    </g>

    <!-- Bottom Right: Sigma Bond -->
    <g class="label-fade-2">
        <text x="600" y="420" class="annotation" text-anchor="middle">σ bond (head-on overlap)</text>
        <path d="M 600,405 L 420,260" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
        <circle cx="420" cy="260" r="3" fill="#7209B7"/>
    </g>

    <!-- Top Right: Pi Bonds -->
    <g class="label-fade-3">
        <text x="600" y="90" class="annotation" text-anchor="middle">2 × π bonds (lateral overlap)</text>
        <path d="M 600,98 L 450,165" stroke="#7209B7" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
        <circle cx="450" cy="165" r="3" fill="#7209B7"/>
    </g>

    <!-- Approach Arrows (Orange) -->
    <g class="arrow-l">
        <path d="M 240,210 L 290,210 M 280,200 L 290,210 L 280,220" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <g class="arrow-r">
        <path d="M 560,210 L 510,210 M 520,200 L 510,210 L 520,220" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- MOLECULE WRAPPER (Handles final pulse) -->
    <g class="molecule-wrapper">
        
        <!-- LAYER 1: Back pz orbitals and back pi-z cloud -->
        <g class="pi-z-cloud">
            <!-- Back Pi-Z Cloud -->
            <path d="M 335,205 Q 400,160 495,205 Q 400,235 335,205 Z" fill="rgba(241,91,181,0.6)" filter="url(#cloud-blur)"/>
        </g>
        <g class="anim-c1"><use href="#pz-back" x="320" y="250"/></g>
        <g class="anim-c2"><use href="#pz-back" x="480" y="250"/></g>

        <!-- LAYER 2: py orbitals and pi-y clouds -->
        <g class="pi-y-cloud">
            <!-- Top Pi-Y Cloud -->
            <path d="M 320,190 Q 400,140 480,190 Q 400,220 320,190 Z" fill="rgba(155,93,229,0.6)" filter="url(#cloud-blur)"/>
            <!-- Bottom Pi-Y Cloud -->
            <path d="M 320,310 Q 400,360 480,310 Q 400,280 320,310 Z" fill="rgba(155,93,229,0.6)" filter="url(#cloud-blur)"/>
        </g>
        <g class="anim-c1">
            <use href="#py-up" x="320" y="250"/>
            <use href="#py-down" x="320" y="250"/>
        </g>
        <g class="anim-c2">
            <use href="#py-up" x="480" y="250"/>
            <use href="#py-down" x="480" y="250"/>
        </g>

        <!-- LAYER 3: sp orbitals, Hydrogen s orbitals, and Nuclei -->
        <!-- Hydrogen 1s orbitals -->
        <g class="anim-h1">
            <circle cx="200" cy="250" r="28" fill="rgba(204,204,204,0.3)" stroke="#CCC" stroke-width="1.5" stroke-dasharray="4 2"/>
        </g>
        <g class="anim-h2">
            <circle cx="600" cy="250" r="28" fill="rgba(204,204,204,0.3)" stroke="#CCC" stroke-width="1.5" stroke-dasharray="4 2"/>
        </g>

        <!-- Carbon sp orbitals -->
        <g class="anim-c1">
            <use href="#sp-left" x="320" y="250"/>
            <use href="#sp-right" x="320" y="250"/>
        </g>
        <g class="anim-c2">
            <use href="#sp-left" x="480" y="250"/>
            <use href="#sp-right" x="480" y="250"/>
        </g>

        <!-- Nuclei -->
        <g class="anim-c1"><circle cx="320" cy="250" r="16" fill="url(#grad-c)"/></g>
        <g class="anim-c2"><circle cx="480" cy="250" r="16" fill="url(#grad-c)"/></g>
        <g class="anim-h1"><circle cx="200" cy="250" r="10" fill="url(#grad-h)"/></g>
        <g class="anim-h2"><circle cx="600" cy="250" r="10" fill="url(#grad-h)"/></g>

        <!-- LAYER 4: Sigma Bond Glows (Overlaps) -->
        <circle class="sigma-glow" cx="400" cy="250" r="22" fill="url(#grad-sigma)"/> <!-- C-C -->
        <circle class="sigma-glow" cx="255" cy="250" r="16" fill="url(#grad-sigma)"/> <!-- C-H1 -->
        <circle class="sigma-glow" cx="545" cy="250" r="16" fill="url(#grad-sigma)"/> <!-- C-H2 -->

        <!-- LAYER 5: Front pz orbitals and front pi-z cloud -->
        <g class="anim-c1"><use href="#pz-front" x="320" y="250"/></g>
        <g class="anim-c2"><use href="#pz-front" x="480" y="250"/></g>
        <g class="pi-z-cloud">
            <!-- Front Pi-Z Cloud -->
            <path d="M 305,295 Q 400,340 465,295 Q 400,265 305,295 Z" fill="rgba(241,91,181,0.6)" filter="url(#cloud-blur)"/>
        </g>

    </g> <!-- End Molecule Wrapper -->

    <!-- Final Formula Label -->
    <text x="400" y="130" class="final-label main-formula" text-anchor="middle">H-C≡C-H</text>

</svg>

</body>
</html>
