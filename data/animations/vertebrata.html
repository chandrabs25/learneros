<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparative Circulatory Pathways in Vertebrata</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1400px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #f8f9fa;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .flow {
            stroke-dasharray: 12, 12;
            animation: flowAnim 1.2s linear infinite;
        }
        @keyframes flowAnim {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }
        .heart-pulse {
            animation: pulse 1s ease-in-out infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            15% { transform: scale(1.05); }
            30% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .label {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .mono {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            fill: #ffffff;
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        .process-label {
            font-size: 11px;
            font-style: italic;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Gradients for Capillary Beds -->
                <linearGradient id="b2r" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#3498DB"/>
                    <stop offset="100%" stop-color="#E74C3C"/>
                </linearGradient>
                <linearGradient id="p2r" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#9B59B6"/>
                    <stop offset="100%" stop-color="#E74C3C"/>
                </linearGradient>
                <linearGradient id="b2p" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#3498DB"/>
                    <stop offset="100%" stop-color="#9B59B6"/>
                </linearGradient>

                <!-- Reusable Capillary Bed Structure -->
                <g id="cap-bed">
                    <path d="M 0 0 C 24 -35, 96 -35, 120 0" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 0 0 C 24 -18, 96 -18, 120 0" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 0 0 L 120 0" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 0 0 C 24 18, 96 18, 120 0" fill="none" stroke-width="4" stroke-linecap="round"/>
                    <path d="M 0 0 C 24 35, 96 35, 120 0" fill="none" stroke-width="4" stroke-linecap="round"/>
                </g>
            </defs>

            <!-- Main Title -->
            <text x="600" y="40" class="label" font-size="28" font-weight="700" text-anchor="middle">Evolution of Vertebrate Circulation</text>

            <!-- Panel Backgrounds -->
            <rect x="20" y="60" width="373" height="500" rx="15" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <rect x="413" y="60" width="373" height="500" rx="15" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
            <rect x="806" y="60" width="373" height="500" rx="15" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />

            <!-- ========================================== -->
            <!-- PANEL 1: FISH (SINGLE CIRCULATION)         -->
            <!-- ========================================== -->
            <text x="206" y="95" class="label" font-size="18" font-weight="600" text-anchor="middle">Single Circulation</text>
            <text x="206" y="115" class="label" font-size="14" text-anchor="middle">(Fishes)</text>

            <!-- Fish Vessels Background -->
            <path d="M 206 310 L 206 280 L 86 280 L 86 150 L 146 150" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 266 150 L 326 150 L 326 500 L 266 500" fill="none" stroke="#E74C3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 146 500 L 126 500 L 126 380 L 181 380" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Fish Vessels Flow -->
            <path d="M 206 310 L 206 280 L 86 280 L 86 150 L 146 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 266 150 L 326 150 L 326 500 L 266 500" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 146 500 L 126 500 L 126 380 L 181 380" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>

            <!-- Fish Capillary Beds -->
            <use href="#cap-bed" x="146" y="150" stroke="url(#b2r)" />
            <use href="#cap-bed" x="146" y="500" stroke="url(#b2r)" />
            
            <!-- Capillary Direction Arrows -->
            <path d="M 201 145 L 211 150 L 201 155" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <path d="M 211 495 L 201 500 L 211 505" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

            <!-- Fish Heart -->
            <g style="transform-origin: 206px 350px;" class="heart-pulse">
                <ellipse cx="206" cy="350" rx="35" ry="50" fill="#F39C12" stroke="#2C3E50" stroke-width="3"/>
                <circle cx="206" cy="325" r="16" fill="#3498DB" />
                <circle cx="206" cy="375" r="16" fill="#3498DB" />
                <text x="206" y="325" class="mono">V</text>
                <text x="206" y="375" class="mono">A</text>
            </g>

            <!-- Fish Labels -->
            <text x="206" y="205" class="label process-label" fill="#E74C3C" text-anchor="middle">Oxygenation &rarr;</text>
            <text x="206" y="450" class="label process-label" fill="#3498DB" text-anchor="middle">&larr; Deoxygenation</text>
            <text x="206" y="225" class="label" font-size="13" font-weight="600" text-anchor="middle">Gills</text>
            <text x="206" y="430" class="label" font-size="13" font-weight="600" text-anchor="middle">Body Tissues</text>


            <!-- ========================================== -->
            <!-- PANEL 2: AMPHIBIAN (INCOMPLETE DOUBLE)     -->
            <!-- ========================================== -->
            <text x="600" y="95" class="label" font-size="18" font-weight="600" text-anchor="middle">Incomplete Double</text>
            <text x="600" y="115" class="label" font-size="14" text-anchor="middle">(Amphibians / Reptiles)</text>

            <!-- Amphibian Vessels Background -->
            <path d="M 540 500 L 520 500 L 520 335 L 565 335" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 660 150 L 680 150 L 680 335 L 635 335" fill="none" stroke="#E74C3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 600 395 L 600 420 L 480 420 L 480 150 L 540 150" fill="none" stroke="#9B59B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 600 395 L 600 420 L 720 420 L 720 500 L 660 500" fill="none" stroke="#9B59B6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Amphibian Vessels Flow -->
            <path d="M 540 500 L 520 500 L 520 335 L 565 335" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 660 150 L 680 150 L 680 335 L 635 335" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 600 395 L 600 420 L 480 420 L 480 150 L 540 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 600 395 L 600 420 L 720 420 L 720 500 L 660 500" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>

            <!-- Amphibian Capillary Beds -->
            <use href="#cap-bed" x="540" y="150" stroke="url(#p2r)" />
            <use href="#cap-bed" x="540" y="500" stroke="url(#b2p)" />
            
            <!-- Capillary Direction Arrows -->
            <path d="M 595 145 L 605 150 L 595 155" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <path d="M 605 495 L 595 500 L 605 505" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

            <!-- Amphibian Heart -->
            <g style="transform-origin: 600px 350px;" class="heart-pulse">
                <path d="M 600 310 C 640 290, 660 330, 650 350 C 640 390, 600 410, 600 410 C 600 410, 560 390, 550 350 C 540 330, 560 290, 600 310 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="3"/>
                <line x1="600" y1="310" x2="600" y2="355" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                <circle cx="580" cy="335" r="13" fill="#3498DB" />
                <circle cx="620" cy="335" r="13" fill="#E74C3C" />
                <ellipse cx="600" cy="375" rx="22" ry="16" fill="#9B59B6" />
                <text x="580" y="335" class="mono">RA</text>
                <text x="620" y="335" class="mono">LA</text>
                <text x="600" y="375" class="mono">V</text>
            </g>

            <!-- Amphibian Labels -->
            <text x="600" y="205" class="label process-label" fill="#E74C3C" text-anchor="middle">Oxygenation &rarr;</text>
            <text x="600" y="450" class="label process-label" fill="#3498DB" text-anchor="middle">&larr; Deoxygenation</text>
            <text x="600" y="225" class="label" font-size="13" font-weight="600" text-anchor="middle">Lungs / Skin</text>
            <text x="600" y="430" class="label" font-size="13" font-weight="600" text-anchor="middle">Body Tissues</text>


            <!-- ========================================== -->
            <!-- PANEL 3: MAMMAL (COMPLETE DOUBLE)          -->
            <!-- ========================================== -->
            <text x="993" y="95" class="label" font-size="18" font-weight="600" text-anchor="middle">Complete Double</text>
            <text x="993" y="115" class="label" font-size="14" text-anchor="middle">(Mammals / Birds)</text>

            <!-- Mammal Vessels Background -->
            <path d="M 933 500 L 913 500 L 913 335 L 958 335" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 973 395 L 973 420 L 873 420 L 873 150 L 933 150" fill="none" stroke="#3498DB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 1053 150 L 1073 150 L 1073 335 L 1028 335" fill="none" stroke="#E74C3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 1013 395 L 1013 420 L 1113 420 L 1113 500 L 1053 500" fill="none" stroke="#E74C3C" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

            <!-- Mammal Vessels Flow -->
            <path d="M 933 500 L 913 500 L 913 335 L 958 335" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 973 395 L 973 420 L 873 420 L 873 150 L 933 150" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 1053 150 L 1073 150 L 1073 335 L 1028 335" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>
            <path d="M 1013 395 L 1013 420 L 1113 420 L 1113 500 L 1053 500" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="flow"/>

            <!-- Mammal Capillary Beds -->
            <use href="#cap-bed" x="933" y="150" stroke="url(#b2r)" />
            <use href="#cap-bed" x="933" y="500" stroke="url(#b2r)" />
            
            <!-- Capillary Direction Arrows -->
            <path d="M 988 145 L 998 150 L 988 155" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
            <path d="M 998 495 L 988 500 L 998 505" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

            <!-- Mammal Heart -->
            <g style="transform-origin: 993px 350px;" class="heart-pulse">
                <path d="M 993 310 C 1033 290, 1053 330, 1043 350 C 1033 390, 993 410, 993 410 C 993 410, 953 390, 943 350 C 933 330, 953 290, 993 310 Z" fill="#F39C12" stroke="#2C3E50" stroke-width="3"/>
                <line x1="993" y1="310" x2="993" y2="410" stroke="#2C3E50" stroke-width="4" stroke-linecap="round"/>
                <line x1="948" y1="355" x2="1038" y2="355" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                <circle cx="973" cy="335" r="12" fill="#3498DB" />
                <circle cx="973" cy="375" r="12" fill="#3498DB" />
                <circle cx="1013" cy="335" r="12" fill="#E74C3C" />
                <circle cx="1013" cy="375" r="12" fill="#E74C3C" />
                <text x="973" y="335" class="mono">RA</text>
                <text x="973" y="375" class="mono">RV</text>
                <text x="1013" y="335" class="mono">LA</text>
                <text x="1013" y="375" class="mono">LV</text>
            </g>

            <!-- Mammal Labels -->
            <text x="993" y="205" class="label process-label" fill="#E74C3C" text-anchor="middle">Oxygenation &rarr;</text>
            <text x="993" y="450" class="label process-label" fill="#3498DB" text-anchor="middle">&larr; Deoxygenation</text>
            <text x="993" y="225" class="label" font-size="13" font-weight="600" text-anchor="middle">Lungs</text>
            <text x="993" y="430" class="label" font-size="13" font-weight="600" text-anchor="middle">Body Tissues</text>


            <!-- ========================================== -->
            <!-- LEGEND / KEY                               -->
            <!-- ========================================== -->
            <rect x="330" y="575" width="540" height="30" rx="15" fill="#ffffff" stroke="#e9ecef" stroke-width="2"/>
            
            <rect x="350" y="582" width="16" height="16" fill="#E74C3C" rx="4"/>
            <text x="375" y="594" class="label" font-size="12" font-weight="600">Oxygenated</text>
            
            <rect x="475" y="582" width="16" height="16" fill="#3498DB" rx="4"/>
            <text x="500" y="594" class="label" font-size="12" font-weight="600">Deoxygenated</text>
            
            <rect x="615" y="582" width="16" height="16" fill="#9B59B6" rx="4"/>
            <text x="640" y="594" class="label" font-size="12" font-weight="600">Mixed Blood</text>
            
            <rect x="745" y="582" width="16" height="16" fill="#F39C12" rx="4"/>
            <text x="770" y="594" class="label" font-size="12" font-weight="600">Heart Muscle</text>

        </svg>
    </div>
</body>
</html>
