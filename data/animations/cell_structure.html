<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Eukaryotic Cell Division: The Mitotic Cycle</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            max-width: 1000px;
            width: 100vw;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-size: 22px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
        .phase-text { font-family: 'Roboto Mono', monospace; font-size: 16px; fill: #ffffff; text-anchor: middle; font-weight: 700; letter-spacing: 1px; opacity: 0; animation: 20s linear infinite; }
        .label-text { font-family: 'Inter', sans-serif; font-size: 12px; fill: #2C3E50; text-anchor: middle; font-weight: 600; }
        .legend-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #2C3E50; font-weight: 400; }

        /* Structural Elements */
        .nucleus { fill: rgba(44, 62, 80, 0.08); stroke: #2C3E50; stroke-width: 3px; }
        .chromatid { fill: none; stroke: #FF6B6B; stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
        .chromatin { fill: none; stroke: #FF6B6B; stroke-width: 2.5px; stroke-linecap: round; stroke-linejoin: round; }
        .label-line { fill: none; stroke: #2C3E50; stroke-width: 1.5; stroke-dasharray: 3 3; }

        /* Animations */
        .center-nuc { transform-origin: 400px 250px; animation: nucCenter 20s linear infinite; }
        .left-nuc { transform-origin: 280px 250px; animation: nucSides 20s linear infinite; }
        .right-nuc { transform-origin: 520px 250px; animation: nucSides 20s linear infinite; }

        .center-chrom { transform-origin: 400px 250px; animation: chromatinCenter 20s linear infinite; }
        .left-chrom { transform-origin: 400px 250px; animation: chromatinSides 20s linear infinite; }
        .right-chrom { transform-origin: 400px 250px; animation: chromatinSides 20s linear infinite; }

        .centriole-group { animation: centrioles 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .centriole.left { transform-origin: 190px 250px; }
        .centriole.right { transform-origin: 610px 250px; }

        .mito-anim { animation: float 4s ease-in-out infinite; }
        .spindle-label { animation: spindleLabel 20s linear infinite; }

        /* Phase Text Animations */
        .p-inter { animation-name: showInter; }
        .p-pro { animation-name: showPro; }
        .p-meta { animation-name: showMeta; }
        .p-ana { animation-name: showAna; }
        .p-telo { animation-name: showTelo; }

        /* Chromosome Animations */
        .left.c1 { animation: leftC1 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .left.c2 { animation: leftC2 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .left.c3 { animation: leftC3 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .left.c4 { animation: leftC4 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .right.c1 { animation: rightC1 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .right.c2 { animation: rightC2 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .right.c3 { animation: rightC3 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .right.c4 { animation: rightC4 20s cubic-bezier(0.4, 0, 0.2, 1) infinite; }

        /* Keyframes */
        @keyframes nucCenter {
            0%, 10% { opacity: 1; stroke-dasharray: 0; }
            15%, 95% { opacity: 0; stroke-dasharray: 4 4; }
            100% { opacity: 1; stroke-dasharray: 0; }
        }
        @keyframes nucSides {
            0%, 60% { opacity: 0; stroke-dasharray: 4 4; transform: scale(0.5); }
            70%, 95% { opacity: 1; stroke-dasharray: 0; transform: scale(1); }
            100% { opacity: 0; stroke-dasharray: 4 4; transform: scale(0.5); }
        }
        @keyframes chromatinCenter {
            0%, 10% { opacity: 1; transform: scale(1); }
            15%, 95% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes chromatinSides {
            0%, 60% { opacity: 0; transform: scale(0.5); }
            70%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.5); }
        }
        @keyframes centrioles {
            0%, 10% { opacity: 0; transform: scale(0); }
            15%, 80% { opacity: 1; transform: scale(1); }
            85%, 100% { opacity: 0; transform: scale(0); }
        }
        @keyframes spindleLabel {
            0%, 10% { opacity: 0; }
            15%, 80% { opacity: 1; }
            85%, 100% { opacity: 0; }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-6px) rotate(4deg); }
        }

        /* Phase Indicator Keyframes */
        @keyframes showInter { 0%, 14.9% { opacity: 1; } 15%, 94.9% { opacity: 0; } 95%, 100% { opacity: 1; } }
        @keyframes showPro { 0%, 14.9% { opacity: 0; } 15%, 34.9% { opacity: 1; } 35%, 100% { opacity: 0; } }
        @keyframes showMeta { 0%, 34.9% { opacity: 0; } 35%, 44.9% { opacity: 1; } 45%, 100% { opacity: 0; } }
        @keyframes showAna { 0%, 44.9% { opacity: 0; } 45%, 59.9% { opacity: 1; } 60%, 100% { opacity: 0; } }
        @keyframes showTelo { 0%, 59.9% { opacity: 0; } 60%, 94.9% { opacity: 1; } 95%, 100% { opacity: 0; } }

        /* Chromatid Keyframes */
        @keyframes leftC1 {
            0%, 10% { transform: translate(370px, 220px) rotate(30deg) scale(0.5); opacity: 0; }
            15% { transform: translate(370px, 220px) rotate(30deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 190px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(260px, 190px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(260px, 190px) scale(0.5); opacity: 0; }
        }
        @keyframes rightC1 {
            0%, 10% { transform: translate(370px, 220px) rotate(30deg) scale(0.5); opacity: 0; }
            15% { transform: translate(370px, 220px) rotate(30deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 190px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(540px, 190px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(540px, 190px) scale(0.5); opacity: 0; }
        }

        @keyframes leftC2 {
            0%, 10% { transform: translate(430px, 210px) rotate(-45deg) scale(0.5); opacity: 0; }
            15% { transform: translate(430px, 210px) rotate(-45deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 230px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(260px, 230px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(260px, 230px) scale(0.5); opacity: 0; }
        }
        @keyframes rightC2 {
            0%, 10% { transform: translate(430px, 210px) rotate(-45deg) scale(0.5); opacity: 0; }
            15% { transform: translate(430px, 210px) rotate(-45deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 230px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(540px, 230px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(540px, 230px) scale(0.5); opacity: 0; }
        }

        @keyframes leftC3 {
            0%, 10% { transform: translate(380px, 280px) rotate(60deg) scale(0.5); opacity: 0; }
            15% { transform: translate(380px, 280px) rotate(60deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 270px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(260px, 270px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(260px, 270px) scale(0.5); opacity: 0; }
        }
        @keyframes rightC3 {
            0%, 10% { transform: translate(380px, 280px) rotate(60deg) scale(0.5); opacity: 0; }
            15% { transform: translate(380px, 280px) rotate(60deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 270px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(540px, 270px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(540px, 270px) scale(0.5); opacity: 0; }
        }

        @keyframes leftC4 {
            0%, 10% { transform: translate(420px, 270px) rotate(-20deg) scale(0.5); opacity: 0; }
            15% { transform: translate(420px, 270px) rotate(-20deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 310px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(260px, 310px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(260px, 310px) scale(0.5); opacity: 0; }
        }
        @keyframes rightC4 {
            0%, 10% { transform: translate(420px, 270px) rotate(-20deg) scale(0.5); opacity: 0; }
            15% { transform: translate(420px, 270px) rotate(-20deg) scale(1); opacity: 1; }
            35%, 45% { transform: translate(400px, 310px) rotate(0deg) scale(1); opacity: 1; }
            60%, 65% { transform: translate(540px, 310px) rotate(0deg) scale(1); opacity: 1; }
            70%, 100% { transform: translate(540px, 310px) scale(0.5); opacity: 0; }
        }
    </style>
</head>
