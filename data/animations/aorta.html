<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Aorta and the Thymic Microenvironment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
            display: block;
        }

        /* Animations */
        @keyframes pulse-aorta {
            0% { transform: scale(1); }
            15% { transform: scale(1.03); }
            30% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        .aorta-group {
            transform-origin: 430px 450px;
            animation: pulse-aorta 2s infinite ease-in-out;
        }

        @keyframes wave-flow {
            0% { stroke-dashoffset: 650; opacity: 0; }
            10% { opacity: 0.85; }
            80% { opacity: 0.85; }
            100% { stroke-dashoffset: -50; opacity: 0; }
        }

        .pulse-wave {
            stroke-dasharray: 120 600;
            animation: wave-flow 2s infinite linear;
        }

        @keyframes cell-move {
            0% { transform: translate(350px, 480px) scale(0.6); opacity: 0; }
            10% { transform: translate(365px, 400px) scale(0.8); opacity: 1; }
            25% { transform: translate(380px, 320px) scale(1); }
            45% { transform: translate(400px, 280px) scale(1.1); }
            65% { transform: translate(420px, 250px) scale(1.2); }
            80% { transform: translate(460px, 220px) scale(1.2); opacity: 1; }
            90% { transform: translate(480px, 350px) scale(1.2); opacity: 0.8; }
            100% { transform: translate(480px, 480px) scale(1.2); opacity: 0; }
        }

        @keyframes cell-color {
            0%, 30% { fill: #E8F4FD; stroke: #4A90D9; }
            50%, 100% { fill: #98D8C8; stroke: #27AE60; }
        }

        @keyframes cell-glow {
            0%, 40% { filter: drop-shadow(0 0 0px rgba(152,216,200,0)); }
            60%, 100% { filter: drop-shadow(0 0 6px rgba(152,216,200,0.9)); }
        }

        .tcell {
            animation: cell-move 6s infinite ease-in-out, cell-glow 6s infinite;
        }

        .tcell-cyto {
            stroke-width: 1.5;
            animation: cell-color 6s infinite ease-in-out;
        }

        @keyframes secrete {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0; }
            20% { opacity: 0.9; }
            100% { transform: translate(var(--dx), var(--dy)) scale(1.8); opacity: 0; }
        }

        .thymosin {
            animation: secrete 3s infinite ease-out;
            transform-origin: center;
        }

        /* Typography & Styling */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; }
        .label { font-size: 13px; font-weight: 500; fill: #2C3E50; }
        .label-italic { font-style: italic; }
        .legend-text { font-size: 12px; fill: #34495E; }
        .leader-line { stroke: #95A5A6; stroke-width: 1.5; fill: none; stroke-dasharray: 3 3; }
        .leader-dot { fill: #95A5A6; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Diagram showing the relationship between the Aorta and the Thymus gland">
        <title>The Aorta and the Thymic Microenvironment</title>
        <desc>Animated diagram showing T-lymphocytes maturing in the thymus gland, located ventral to the aortic arch.</desc>

        <!-- Background Context: Lungs & Sternum (Ghosted) -->
        <g id="context-layer">
            <!-- Left Lung (Anatomical Right) -->
            <path d="M 160 480 C 130 300, 180 150, 280 120 C 320 150, 320 250, 290 300 C 260 350, 280 480, 160 480 Z" fill="#CAD3C8" opacity="0.25"/>
            <!-- Right Lung (Anatomical Left) -->
            <path d="M 640 480 C 670 300, 620 150, 520 120 C 480 150, 480 250, 510 300 C 540 350, 520 480, 640 480 Z" fill="#CAD3C8" opacity="0.25"/>
            
            <!-- Sternum -->
            <rect x="375" y="70" width="50" height="410" rx="12" fill="#D1D8E0" opacity="0.3"/>
            <!-- Rib Attachments -->
            <path d="M 375 110 L 310 90 M 425 110 L 490 90 M 375 170 L 290 150 M 425 170 L 510 150 M 375 230 L 280 220 M 425 230 L 520 220 M 375 290 L 280 290 M 425 290 L 520 290 M 375 350 L 290 360 M 425 350 L 510 360" stroke="#D1D8E0" stroke-width="16" stroke-linecap="round" opacity="0.25"/>
        </g>

        <!-- Heart Base & Aorta -->
        <g id="aorta-layer" class="aorta-group">
            <!-- Left Ventricle Base -->
            <path d="M 330 480 C 330 380, 430 380, 430 480 Z" fill="#E74C3C"/>
            
            <!-- Aortic Arch -->
            <path d="M 380 480 L 380 250 C 380 130, 480 130, 480 250 L 480 480" fill="none" stroke="#E74C3C" stroke-width="46" stroke-linecap="round"/>
            <!-- Aorta 3D Highlight -->
            <path d="M 372 480 L 372 250 C 372 122, 472 122, 472 250 L 472 480" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
            
            <!-- Aortic Branches (Brachiocephalic, Common Carotid, Subclavian) -->
            <path d="M 395 145 L 380 80" fill="none" stroke="#E74C3C" stroke-width="14" stroke-linecap="round"/>
            <path d="M 430 132 L 430 70" fill="none" stroke="#E74C3C" stroke-width="12" stroke-linecap="round"/>
            <path d="M 465 145 L 480 80" fill="none" stroke="#E74C3C" stroke-width="12" stroke-linecap="round"/>

            <!-- Pulse Wave Animation -->
            <path d="M 380 480 L 380 250 C 380 130, 480 130, 480 250 L 480 480" fill="none" stroke="#FFD700" stroke-width="18" stroke-linecap="round" class="pulse-wave"/>
        </g>

        <!-- Thymus Gland (Ventral/In Front) -->
        <g id="thymus-layer">
            <!-- Main Lobular Body -->
            <path d="M 400 230 
                     C 360 180, 310 230, 340 290 
                     C 350 330, 390 340, 400 310 
                     C 410 340, 450 330, 460 290 
                     C 490 230, 440 180, 400 230 Z" 
                  fill="#F39C12" stroke="#E67E22" stroke-width="3"/>
            
            <!-- Internal Lobule Textures -->
            <path d="M 340 290 Q 370 280 380 250" fill="none" stroke="#E67E22" stroke-width="2.5" opacity="0.7"/>
            <path d="M 460 290 Q 430 280 420 250" fill="none" stroke="#E67E22" stroke-width="2.5" opacity="0.7"/>
            <path d="M 365 320 Q 385 295 400 310" fill="none" stroke="#E67E22" stroke-width="2.5" opacity="0.7"/>
            <path d="M 435 320 Q 415 295 400 310" fill="none" stroke="#E67E22" stroke-width="2.5" opacity="0.7"/>
            <path d="M 400 230 Q 400 270 400 310" fill="none" stroke="#E67E22" stroke-width="2.5" opacity="0.5"/>
        </g>

        <!-- Hormonal Secretion (Thymosins) -->
        <g id="secretion-layer">
            <g class="thymosin" style="--dx: -40px; --dy: -50px; animation-delay: 0s;">
                <path d="M 360 210 l 3 -8 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 z" fill="#F1C40F"/>
            </g>
            <g class="thymosin" style="--dx: 50px; --dy: -40px; animation-delay: 1s;">
                <path d="M 440 220 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 z" fill="#F1C40F"/>
            </g>
            <g class="thymosin" style="--dx: -50px; --dy: 30px; animation-delay: 2s;">
                <path d="M 340 280 l 2.5 -7 l 2.5 7 l 7 2.5 l -7 2.5 l -2.5 7 l -2.5 -7 l -7 -2.5 z" fill="#F1C40F"/>
            </g>
            <g class="thymosin" style="--dx: 45px; --dy: 45px; animation-delay: 1.5s;">
                <path d="M 450 300 l 2 -6 l 2 6 l 6 2 l -6 2 l -2 6 l -2 -6 l -6 -2 z" fill="#F1C40F"/>
            </g>
        </g>

        <!-- T-Lymphocytes (Animated Flow) -->
        <g id="tcells-layer">
            <!-- Cell 1 -->
            <g class="tcell" style="animation-delay: 0s;">
                <circle class="tcell-cyto" cx="0" cy="0" r="7" style="animation-delay: 0s;" />
                <circle cx="0" cy="0" r="3" fill="#2C3E50" />
            </g>
            <!-- Cell 2 -->
            <g class="tcell" style="animation-delay: 1.5s;">
                <circle class="tcell-cyto" cx="0" cy="0" r="7" style="animation-delay: 1.5s;" />
                <circle cx="0" cy="0" r="3" fill="#2C3E50" />
            </g>
            <!-- Cell 3 -->
            <g class="tcell" style="animation-delay: 3s;">
                <circle class="tcell-cyto" cx="0" cy="0" r="7" style="animation-delay: 3s;" />
                <circle cx="0" cy="0" r="3" fill="#2C3E50" />
            </g>
            <!-- Cell 4 -->
            <g class="tcell" style="animation-delay: 4.5s;">
                <circle class="tcell-cyto" cx="0" cy="0" r="7" style="animation-delay: 4.5s;" />
                <circle cx="0" cy="0" r="3" fill="#2C3E50" />
            </g>
        </g>

        <!-- Labels and Annotations -->
        <g id="labels-layer">
            <!-- Title -->
            <text x="400" y="40" class="title" text-anchor="middle">The Aorta and the Thymic Microenvironment</text>
            <text x="400" y="65" class="subtitle" text-anchor="middle">T-Lymphocyte Maturation & Anatomical Relationship</text>

            <!-- Aortic Arch Label -->
            <polyline points="430,132 530,90 550,90" class="leader-line"/>
            <circle cx="430" cy="132" r="3" class="leader-dot"/>
            <text x="560" y="94" class="label"><tspan class="label-italic">Aortic</tspan> Arch</text>

            <!-- Thymus Gland Label -->
            <polyline points="450,260 530,260 550,260" class="leader-line"/>
            <circle cx="450" cy="260" r="3" class="leader-dot"/>
            <text x="560" y="258" class="label"><tspan class="label-italic">Thymus</tspan> Gland</text>
            <text x="560" y="276" class="subtitle" style="font-size: 11px;">(Ventral to Aorta)</text>

            <!-- Left Ventricle Label -->
            <polyline points="360,440 260,440 240,440" class="leader-line"/>
            <circle cx="360" cy="440" r="3" class="leader-dot"/>
            <text x="230" y="444" class="label" text-anchor="end">Heart Base (Left Ventricle)</text>

            <!-- T-lymphocyte Differentiation Label -->
            <polyline points="380,280 260,280 240,280" class="leader-line"/>
            <circle cx="380" cy="280" r="3" class="leader-dot"/>
            <text x="230" y="284" class="label" text-anchor="end">T-lymphocyte Differentiation</text>

            <!-- Thymosin Secretion Label -->
            <polyline points="350,210 260,180 240,180" class="leader-line"/>
            <circle cx="350" cy="210" r="3" class="leader-dot"/>
            <text x="230" y="184" class="label" text-anchor="end">Thymosin Secretion</text>
        </g>

        <!-- Legend -->
        <g id="legend-layer" transform="translate(30, 360)">
            <rect x="0" y="0" width="190" height="115" rx="8" fill="#ffffff" stroke="#E0E0E0" stroke-width="1"/>
            <text x="15" y="22" class="label" style="font-weight: 600;">Key</text>
            
            <!-- Arterial Blood -->
            <circle cx="20" cy="40" r="5" fill="#E74C3C"/>
            <text x="35" y="44" class="legend-text">Oxygenated Blood</text>
            
            <!-- Thymic Tissue -->
            <circle cx="20" cy="60" r="5" fill="#F39C12" stroke="#E67E22" stroke-width="1"/>
            <text x="35" y="64" class="legend-text">Thymic Tissue</text>
            
            <!-- Immature T-Cell -->
            <circle cx="20" cy="80" r="5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
            <circle cx="20" cy="80" r="2" fill="#2C3E50"/>
            <text x="35" y="84" class="legend-text">Pro-T Cell (Immature)</text>
            
            <!-- Mature T-Cell -->
            <circle cx="20" cy="100" r="5" fill="#98D8C8" stroke="#27AE60" stroke-width="1"/>
            <circle cx="20" cy="100" r="2" fill="#2C3E50"/>
            <text x="35" y="104" class="legend-text">Mature T-Lymphocyte</text>
        </g>

    </svg>
</div>

</body>
</html>
