<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grignard Reagent Mechanism</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  svg {
    width: 100%;
    max-width: 1000px;
    height: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    background-color: #ffffff;
    border-radius: 12px;
  }

  /* Global Animation Container */
  .reaction-container {
    animation: global-fade 12s infinite linear;
  }

  /* Atom & Group Movements */
  .ch3-group {
    animation: ch3-move 12s infinite ease-in-out;
  }
  .mg-group {
    animation: mg-move 12s infinite ease-in-out;
  }
  .br-group {
    animation: br-move 12s infinite ease-in-out;
  }
  .h1-group {
    transform-origin: 600px 250px;
    animation: h1-swing 12s infinite ease-in-out;
  }
  .h2-group {
    transform-origin: 600px 250px;
    animation: h2-swing 12s infinite ease-in-out;
  }

  /* Bond Animations */
  .c-br-bond {
    animation: fade-out-early 12s infinite ease-in-out;
  }
  .c-mg-bond {
    animation: c-mg-bond-fade 12s infinite ease-in-out;
  }
  .mg-br-bond {
    animation: fade-in-mid 12s infinite ease-in-out;
  }
  .new-c-c-bond {
    animation: fade-in-late 12s infinite ease-in-out;
  }
  .co-bond-2 {
    animation: fade-out-late 12s infinite ease-in-out;
  }
  .co-bond-1 {
    animation: co-bond-shift 12s infinite ease-in-out;
  }
  .o-mg-bond {
    animation: fade-in-late 12s infinite ease-in-out;
  }

  /* Arrow Animations */
  .arrow1 {
    stroke-dasharray: 150;
    stroke-dashoffset: 150;
    animation: draw-arrow1 12s infinite ease-in-out;
  }
  .arrow2 {
    stroke-dasharray: 80;
    stroke-dashoffset: 80;
    animation: draw-arrow2 12s infinite ease-in-out;
  }

  /* Label Animations */
  .polarity-label {
    animation: polarity-labels 12s infinite ease-in-out;
  }
  .attack-label {
    animation: attack-label 12s infinite ease-in-out;
  }
  .o-charge {
    animation: fade-in-late 12s infinite ease-in-out;
  }
  .bond-glow {
    animation: bond-glow-anim 12s infinite ease-in-out;
  }

  /* Keyframes */
  @keyframes global-fade {
    0%, 92% { opacity: 1; }
    96%, 99% { opacity: 0; }
    100% { opacity: 1; }
  }

  @keyframes ch3-move {
    0%, 41.6% { transform: translate(150px, 250px) rotate(0deg); }
    50%, 96% { transform: translate(530px, 250px) rotate(180deg); }
    100% { transform: translate(150px, 250px) rotate(0deg); }
  }

  @keyframes mg-move {
    0%, 15% { transform: translate(210px, 100px) rotate(0deg); }
    25%, 41.6% { transform: translate(210px, 250px) rotate(0deg); }
    50%, 75% { transform: translate(470px, 250px) rotate(180deg); }
    85%, 96% { transform: translate(650px, 130px) rotate(300deg); }
    100% { transform: translate(210px, 100px) rotate(0deg); }
  }

  @keyframes br-move {
    0%, 41.6% { transform: translate(270px, 250px); }
    50%, 75% { transform: translate(410px, 250px); }
    85%, 96% { transform: translate(680px, 78px); }
    100% { transform: translate(270px, 250px); }
  }

  @keyframes h1-swing {
    0%, 75% { transform: rotate(0deg); }
    85%, 96% { transform: rotate(-19deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes h2-swing {
    0%, 75% { transform: rotate(0deg); }
    85%, 96% { transform: rotate(18deg); }
    100% { transform: rotate(0deg); }
  }

  @keyframes fade-out-early {
    0%, 20% { opacity: 1; }
    25%, 100% { opacity: 0; }
  }

  @keyframes c-mg-bond-fade {
    0%, 20% { opacity: 0; }
    25%, 74% { opacity: 1; }
    75%, 100% { opacity: 0; }
  }

  @keyframes fade-in-mid {
    0%, 20% { opacity: 0; }
    25%, 96% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes fade-in-late {
    0%, 75% { opacity: 0; }
    85%, 96% { opacity: 1; }
    100% { opacity: 0; }
  }

  @keyframes fade-out-late {
    0%, 75% { opacity: 1; }
    85%, 100% { opacity: 0; }
  }

  @keyframes co-bond-shift {
    0%, 75% { transform: translateX(0); }
    85%, 96% { transform: translateX(4px); }
    100% { transform: translateX(0); }
  }

  @keyframes draw-arrow1 {
    0%, 50% { stroke-dashoffset: 150; opacity: 0; }
    51% { opacity: 1; }
    55%, 70% { stroke-dashoffset: 0; opacity: 1; }
    75%, 100% { opacity: 0; }
  }

  @keyframes draw-arrow2 {
    0%, 55% { stroke-dashoffset: 80; opacity: 0; }
    56% { opacity: 1; }
    60%, 70% { stroke-dashoffset: 0; opacity: 1; }
    75%, 100% { opacity: 0; }
  }

  @keyframes polarity-labels {
    0%, 25% { opacity: 0; }
    30%, 41.6% { opacity: 1; }
    45%, 100% { opacity: 0; }
  }

  @keyframes attack-label {
    0%, 50% { opacity: 0; }
    55%, 70% { opacity: 1; }
    75%, 100% { opacity: 0; }
  }

  @keyframes bond-glow-anim {
    0%, 25% { stroke: #555; stroke-width: 6; }
    30%, 41.6% { stroke: #F77F00; stroke-width: 10; }
    45%, 100% { stroke: #555; stroke-width: 6; }
  }

</style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <title>Grignard Reagent: Formation and Nucleophilic Addition</title>
  <desc>Animated mechanism showing the formation of a Grignard reagent (Methylmagnesium Bromide) and its nucleophilic addition to formaldehyde.</desc>

  <defs>
    <!-- Atom Gradients -->
    <radialGradient id="grad-c" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#777777"/>
      <stop offset="100%" stop-color="#404040"/>
    </radialGradient>
    <radialGradient id="grad-o" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FF8888"/>
      <stop offset="100%" stop-color="#FF4444"/>
    </radialGradient>
    <radialGradient id="grad-h" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CCCCCC"/>
    </radialGradient>
    <radialGradient id="grad-mg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D0D0FF"/>
      <stop offset="100%" stop-color="#A0A0FF"/>
    </radialGradient>
    <radialGradient id="grad-br" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D26969"/>
      <stop offset="100%" stop-color="#A52A2A"/>
    </radialGradient>

    <!-- Arrowhead -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00"/>
    </marker>
  </defs>

  <!-- Title & Static UI -->
  <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#333">Grignard Reagent: Formation &amp; Nucleophilic Addition</text>
  
  <!-- Reaction Equation -->
  <g transform="translate(40, 440)">
    <text x="0" y="0" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#404040">
      CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan>Br + Mg 
      <tspan fill="#7209B7"> ⟶ </tspan> 
      CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan>MgBr
    </text>
    <text x="110" y="-15" font-size="11" fill="#7209B7" font-weight="600">dry ether</text>
  </g>

  <!-- Legend -->
  <g transform="translate(620, 410)" font-size="12" fill="#555">
    <rect x="0" y="0" width="150" height="70" rx="6" fill="#fff" stroke="#eee" stroke-width="1"/>
    <circle cx="15" cy="15" r="5" fill="url(#grad-c)"/><text x="28" y="19">Carbon</text>
    <circle cx="85" cy="15" r="5" fill="url(#grad-o)"/><text x="98" y="19">Oxygen</text>
    <circle cx="15" cy="35" r="5" fill="url(#grad-mg)"/><text x="28" y="39">Magnesium</text>
    <circle cx="85" cy="35" r="5" fill="url(#grad-br)"/><text x="98" y="39">Bromine</text>
    <circle cx="15" cy="55" r="5" fill="url(#grad-h)"/><text x="28" y="59">Hydrogen</text>
  </g>

  <!-- Main Reaction Animation Container -->
  <g class="reaction-container">

    <!-- Formaldehyde (Target) -->
    <g id="formaldehyde">
      <!-- New C-C Bond (Fades in late) -->
      <line class="new-c-c-bond" x1="600" y1="250" x2="530" y2="250" stroke="#555" stroke-width="6" opacity="0"/>
      
      <!-- O-Mg Ionic Association -->
      <line class="o-mg-bond" x1="600" y1="170" x2="650" y2="130" stroke="#999" stroke-width="4" stroke-dasharray="6,4" opacity="0"/>

      <!-- C=O Double Bond -->
      <line class="co-bond-1" x1="596" y1="250" x2="596" y2="170" stroke="#555" stroke-width="6"/>
      <line class="co-bond-2" x1="604" y1="250" x2="604" y2="170" stroke="#555" stroke-width="6"/>

      <!-- H1 Group (Left) -->
      <g class="h1-group">
        <line x1="600" y1="250" x2="550" y2="300" stroke="#555" stroke-width="6"/>
        <circle cx="550" cy="300" r="10" fill="url(#grad-h)"/>
      </g>

      <!-- H2 Group (Right) -->
      <g class="h2-group">
        <line x1="600" y1="250" x2="650" y2="300" stroke="#555" stroke-width="6"/>
        <circle cx="650" cy="300" r="10" fill="url(#grad-h)"/>
      </g>

      <!-- Central Carbon -->
      <circle cx="600" cy="250" r="15" fill="url(#grad-c)"/>
      <text x="620" y="270" font-family="Roboto Mono" font-size="14" fill="#555" font-weight="600" opacity="0.5">C</text>

      <!-- Oxygen -->
      <circle cx="600" cy="170" r="16" fill="url(#grad-o)"/>
      <!-- Oxygen Lone Pairs -->
      <circle cx="585" cy="155" r="2" fill="#333"/>
      <circle cx="592" cy="150" r="2" fill="#333"/>
      <circle cx="608" cy="150" r="2" fill="#333"/>
      <circle cx="615" cy="155" r="2" fill="#333"/>
      
      <!-- Oxygen Negative Charge -->
      <g class="o-charge" opacity="0">
        <circle cx="622" cy="155" r="8" fill="#fff" stroke="#FF4444" stroke-width="1"/>
        <text x="622" y="159" font-family="Roboto Mono" font-size="14" fill="#FF4444" text-anchor="middle" font-weight="bold">-</text>
      </g>
    </g>

    <!-- Grignard Reagent Parts -->

    <!-- CH3 Group -->
    <g class="ch3-group">
      <!-- Initial C-Br Bond -->
      <line class="c-br-bond" x1="0" y1="0" x2="120" y2="0" stroke="#555" stroke-width="6"/>
      <!-- C-Mg Bond -->
      <line class="c-mg-bond bond-glow" x1="0" y1="0" x2="60" y2="0" stroke="#555" stroke-width="6" opacity="0"/>
      
      <!-- Carbon Atom -->
      <circle cx="0" cy="0" r="15" fill="url(#grad-c)"/>
      
      <!-- 3 Hydrogens -->
      <line x1="0" y1="0" x2="-20" y2="-25" stroke="#555" stroke-width="6"/>
      <circle cx="-20" cy="-25" r="10" fill="url(#grad-h)"/>
      
      <line x1="0" y1="0" x2="-20" y2="25" stroke="#555" stroke-width="6"/>
      <circle cx="-20" cy="25" r="10" fill="url(#grad-h)"/>
      
      <line x1="0" y1="0" x2="-35" y2="0" stroke="#555" stroke-width="6"/>
      <circle cx="-35" cy="0" r="10" fill="url(#grad-h)"/>

      <!-- Polarity Label -->
      <text x="-10" y="-40" font-size="18" fill="#FF4444" font-weight="bold" class="polarity-label" opacity="0">δ⁻</text>
    </g>

    <!-- Magnesium Atom -->
    <g class="mg-group">
      <!-- Mg-Br Bond -->
      <line class="mg-br-bond" x1="0" y1="0" x2="60" y2="0" stroke="#555" stroke-width="6" opacity="0"/>
      
      <circle cx="0" cy="0" r="18" fill="url(#grad-mg)"/>
      <text x="-8" y="5" font-family="Roboto Mono" font-size="14" fill="#333" font-weight="700">Mg</text>
      
      <!-- Polarity Label -->
      <text x="-10" y="-30" font-size="18" fill="#4444FF" font-weight="bold" class="polarity-label" opacity="0">δ⁺</text>
    </g>

    <!-- Bromine Atom -->
    <g class="br-group">
      <circle cx="0" cy="0" r="20" fill="url(#grad-br)"/>
      <text x="-8" y="5" font-family="Roboto Mono" font-size="14" fill="#fff" font-weight="700">Br</text>
    </g>

    <!-- Electron Flow Arrows -->
    <!-- Arrow 1: C-Mg bond to Carbonyl C -->
    <path class="arrow1" d="M 500 250 Q 550 180 590 235" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow 2: C=O bond to Oxygen -->
    <path class="arrow2" d="M 590 215 Q 550 190 585 175" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)"/>

    <!-- Text Annotations -->
    <text x="210" y="320" font-size="15" font-weight="600" fill="#F77F00" class="polarity-label" opacity="0" text-anchor="middle">Nucleophilic Carbon Center</text>
    <text x="500" y="150" font-size="15" font-weight="600" fill="#F77F00" class="attack-label" opacity="0" text-anchor="middle">Nucleophilic Attack</text>

  </g>
</svg>

</body>
</html>
