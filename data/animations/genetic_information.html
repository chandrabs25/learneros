<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Information: From Genome to Data</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        text {
            font-family: 'Inter', sans-serif;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* --- CSS Animations (14s Loop) --- */

        /* 1. Cell & Nucleus */
        @keyframes fade-membrane {
            0%, 14% { opacity: 1; }
            28%, 85% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }
        .cell-membrane, .cell-label {
            animation: fade-membrane 14s infinite ease-in-out;
        }

        @keyframes zoom-nucleus {
            0%, 14% { transform: scale(1); }
            28%, 85% { transform: scale(3.5); }
            95%, 100% { transform: scale(1); }
        }
        .nucleus-group {
            animation: zoom-nucleus 14s infinite ease-in-out;
            transform-origin: 150px 320px;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 2px #4A90D9); }
            7% { filter: drop-shadow(0 0 12px #4A90D9); transform: scale(1.02); }
            14% { filter: drop-shadow(0 0 2px #4A90D9); transform: scale(1); }
        }
        .nucleus-circle {
            animation: pulse-glow 14s infinite ease-in-out;
            transform-origin: 150px 320px;
        }

        @keyframes fade-chromosome {
            0%, 14% { opacity: 0; }
            28%, 85% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        .chromosome, .dna-label {
            animation: fade-chromosome 14s infinite ease-in-out;
        }

        /* 2. DNA Uncoiling */
        .dna-strand {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: uncoil-dna 14s infinite ease-in-out;
        }
        @keyframes uncoil-dna {
            0%, 28% { stroke-dashoffset: 100; }
            50%, 85% { stroke-dashoffset: 0; }
            95%, 100% { stroke-dashoffset: 100; }
        }

        .rung-reveal {
            width: 0;
            animation: reveal-rungs 14s infinite ease-in-out;
        }
        @keyframes reveal-rungs {
            0%, 28% { width: 0; }
            50%, 85% { width: 260px; }
            95%, 100% { width: 0; }
        }

        /* 3. Sequencer */
        .scroll-text {
            transform: translateX(0);
            opacity: 0;
            animation: scroll-seq 14s infinite linear;
        }
        @keyframes scroll-seq {
            0%, 45% { transform: translateX(0); opacity: 0; }
            50% { opacity: 1; }
            71% { transform: translateX(-160px); opacity: 1; }
            75%, 100% { transform: translateX(-160px); opacity: 0; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        .blink-1 { animation: blink 1s infinite; }
        .blink-2 { animation: blink 1.5s infinite; }
        .blink-3 { animation: blink 0.8s infinite; }

        /* 4. Data Stream & Database */
        .stream-letters {
            transform: translateX(0);
            opacity: 0;
            animation: stream-let 14s infinite linear;
        }
        @keyframes stream-let {
            0%, 65% { transform: translateX(0); opacity: 0; }
            71% { opacity: 1; }
            78% { transform: translateX(60px); opacity: 0; }
            100% { transform: translateX(60px); opacity: 0; }
        }

        .stream-binary {
            transform: translateX(0);
            opacity: 0;
            animation: stream-bin 14s infinite linear;
        }
        @keyframes stream-bin {
            0%, 75% { transform: translateX(0); opacity: 0; }
            78% { opacity: 1; }
            85% { transform: translateX(60px); opacity: 1; }
            90%, 100% { transform: translateX(80px); opacity: 0; }
        }

        .db-pulse {
            transform-origin: 0px 30px;
            animation: db-pulse-anim 14s infinite ease-in-out;
        }
        @keyframes db-pulse-anim {
            0%, 78% { transform: scale(1); opacity: 0.1; }
            82% { transform: scale(1.5); opacity: 0.6; }
            86%, 100% { transform: scale(1); opacity: 0.1; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Genetic Information: From Genome to Data</title>
            <desc id="svg-desc">An animated diagram showing the flow of genetic information from a human cell, zooming into the nucleus and chromosome, uncoiling the DNA double helix, sequencing the base pairs, and storing the sequence as digital bioinformatics data.</desc>

            <defs>
                <!-- Gradients -->
                <radialGradient id="cellGrad" cx="40%" cy="40%" r="60%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                    <stop offset="70%" stop-color="#E8F4FD" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#4A90D9" stop-opacity="0.4"/>
                </radialGradient>
                <radialGradient id="nucGrad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#34495E"/>
                    <stop offset="100%" stop-color="#2C3E50"/>
                </radialGradient>
                
                <!-- Filters -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Markers -->
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#34495E" />
                </marker>

                <!-- Clip Paths -->
                <clipPath id="rungClip">
                    <rect x="240" y="240" height="160" class="rung-reveal" />
                </clipPath>
                <clipPath id="seqClip">
                    <rect x="490" y="280" width="120" height="60" rx="4" />
                </clipPath>
                <clipPath id="streamClip">
                    <rect x="620" y="280" width="100" height="60" />
                </clipPath>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f8f9fa" />

            <!-- Header & Title -->
            <text x="40" y="50" font-size="26" font-weight="700" fill="#2C3E50">Genetic Information &amp; Bioinformatics (HGP)</text>
            <text x="40" y="75" font-size="14" fill="#7F8C8D">Visualizing the transition from biological structures to digital data storage and analysis.</text>

            <!-- Legend -->
            <g transform="translate(40, 540)" font-size="12" font-weight="600" fill="#34495E">
                <rect x="0" y="0" width="16" height="16" fill="#4A90D9" rx="4"/> <text x="24" y="12">Cell Membrane</text>
                <rect x="140" y="0" width="16" height="16" fill="#2C3E50" rx="4"/> <text x="164" y="12">Nucleus</text>
                <rect x="240" y="0" width="16" height="16" fill="#FF6B6B" rx="4"/> <text x="264" y="12">DNA</text>
                <rect x="320" y="0" width="16" height="16" fill="#98D8C8" rx="4"/> <text x="344" y="12">Histone Proteins</text>
                <rect x="470" y="0" width="16" height="16" fill="#2ECC71" rx="4"/> <text x="494" y="12">Sequence Data</text>
            </g>

            <!-- ========================================== -->
            <!-- STAGE 1 & 2: CELL, NUCLEUS, CHROMOSOME     -->
            <!-- ========================================== -->
            <g id="stage-macro">
                <!-- Cell Membrane & Cytoplasm -->
                <circle cx="150" cy="320" r="110" fill="url(#cellGrad)" stroke="#4A90D9" stroke-width="3" class="cell-membrane" />
                <text x="150" y="190" text-anchor="middle" font-size="14" font-weight="700" fill="#4A90D9" class="cell-label">Human Cell</text>
                
                <!-- Nucleus Group (Scales up during zoom) -->
                <g class="nucleus-group">
                    <circle cx="150" cy="320" r="35" fill="url(#nucGrad)" stroke="#34495E" stroke-width="2" class="nucleus-circle" />
                    <text x="150" y="275" text-anchor="middle" font-size="8" font-weight="600" fill="#E8F4FD" class="nuc-label">Nucleus</text>
                    
                    <!-- Chromosome (Fades in during zoom) -->
                    <g class="chromosome">
                        <!-- Histone Protein Scaffold -->
                        <path d="M 135 295 Q 150 320, 165 345" stroke="#98D8C8" stroke-width="8" stroke-linecap="round" fill="none" />
                        <path d="M 165 295 Q 150 320, 135 345" stroke="#98D8C8" stroke-width="8" stroke-linecap="round" fill="none" />
                        <!-- Centromere -->
                        <circle cx="150" cy="320" r="4" fill="#2C3E50" />
                        <!-- DNA Wrap (Red dashed line) -->
                        <path d="M 135 295 Q 150 320, 165 345" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="2 2" fill="none" />
                        <path d="M 165 295 Q 150 320, 135 345" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="2 2" fill="none" />
                        
                        <text x="150" y="365" text-anchor="middle" font-size="6" fill="#E8F4FD" font-weight="700">Chromosome</text>
                    </g>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- STAGE 3: DNA UNCOILING                     -->
            <!-- ========================================== -->
            <g id="stage-molecular">
                <!-- Back Strand (Darker Red) -->
                <path d="M 250 320 Q 265 380, 280 320 T 310 320 T 340 320 T 370 320 T 400 320 T 430 320 T 460 320 T 490 320" 
                      fill="none" stroke="#D9534F" stroke-width="4" stroke-linecap="round" pathLength="100" class="dna-strand" />
                
                <!-- Base Pair Rungs -->
                <g clip-path="url(#rungClip)" stroke-width="2.5" opacity="0.8">
                    <!-- Alternating colors for A-T, C-G -->
                    <line x1="258" y1="285" x2="258" y2="355" stroke="#98D8C8" />
                    <line x1="265" y1="305" x2="265" y2="335" stroke="#F39C12" />
                    <line x1="272" y1="315" x2="272" y2="325" stroke="#98D8C8" />
                    
                    <line x1="288" y1="315" x2="288" y2="325" stroke="#F39C12" />
                    <line x1="295" y1="305" x2="295" y2="335" stroke="#98D8C8" />
                    <line x1="302" y1="285" x2="302" y2="355" stroke="#F39C12" />
                    
                    <line x1="318" y1="285" x2="318" y2="355" stroke="#98D8C8" />
                    <line x1="325" y1="305" x2="325" y2="335" stroke="#F39C12" />
                    <line x1="332" y1="315" x2="332" y2="325" stroke="#98D8C8" />
                    
                    <line x1="348" y1="315" x2="348" y2="325" stroke="#F39C12" />
                    <line x1="355" y1="305" x2="355" y2="335" stroke="#98D8C8" />
                    <line x1="362" y1="285" x2="362" y2="355" stroke="#F39C12" />
                    
                    <line x1="378" y1="285" x2="378" y2="355" stroke="#98D8C8" />
                    <line x1="385" y1="305" x2="385" y2="335" stroke="#F39C12" />
                    <line x1="392" y1="315" x2="392" y2="325" stroke="#98D8C8" />
                    
                    <line x1="408" y1="315" x2="408" y2="325" stroke="#F39C12" />
                    <line x1="415" y1="305" x2="415" y2="335" stroke="#98D8C8" />
                    <line x1="422" y1="285" x2="422" y2="355" stroke="#F39C12" />
                    
                    <line x1="438" y1="285" x2="438" y2="355" stroke="#98D8C8" />
                    <line x1="445" y1="305" x2="445" y2="335" stroke="#F39C12" />
                    <line x1="452" y1="315" x2="452" y2="325" stroke="#98D8C8" />
                    
                    <line x1="468" y1="315" x2="468" y2="325" stroke="#F39C12" />
                    <line x1="475" y1="305" x2="475" y2="335" stroke="#98D8C8" />
                    <line x1="482" y1="285" x2="482" y2="355" stroke="#F39C12" />
                </g>

                <!-- Front Strand (Bright Red) -->
                <path d="M 250 320 Q 265 260, 280 320 T 310 320 T 340 320 T 370 320 T 400 320 T 430 320 T 460 320 T 490 320" 
                      fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" pathLength="100" class="dna-strand" />
                
                <!-- DNA Labels -->
                <text x="240" y="255" font-size="12" font-weight="700" fill="#FF6B6B" class="dna-label">5'</text>
                <text x="240" y="395" font-size="12" font-weight="700" fill="#D9534F" class="dna-label">3'</text>
                <text x="360" y="230" text-anchor="middle" font-size="14" font-weight="700" fill="#FF6B6B" class="dna-label">DNA Double Helix</text>
                <text x="360" y="410" text-anchor="middle" font-size="14" font-weight="600" fill="#34495E" class="dna-label mono">3 × 10<tspan dy="-6" font-size="10">9</tspan><tspan dy="6"> base pairs</tspan></text>
            </g>

            <!-- ========================================== -->
            <!-- STAGE 4: SEQUENCING BOX                    -->
            <!-- ========================================== -->
            <g id="stage-sequencing">
                <!-- Outer Machine -->
                <rect x="480" y="250" width="140" height="140" rx="12" fill="#2C3E50" stroke="#34495E" stroke-width="4"/>
                <!-- Inner Screen -->
                <rect x="490" y="280" width="120" height="60" rx="6" fill="#1A252F" stroke="#000" stroke-width="2" />
                
                <!-- Machine Details -->
                <text x="550" y="375" text-anchor="middle" font-size="12" font-weight="700" fill="#98D8C8" letter-spacing="2">SEQUENCER</text>
                <line x1="490" y1="265" x2="610" y2="265" stroke="#34495E" stroke-width="4" stroke-linecap="round" />
                
                <!-- Blinking Lights -->
                <circle cx="500" cy="365" r="4" fill="#E74C3C" class="blink-1" />
                <circle cx="515" cy="365" r="4" fill="#F39C12" class="blink-2" />
                <circle cx="530" cy="365" r="4" fill="#2ECC71" class="blink-3" />

                <!-- Scrolling Sequence Text -->
                <g clip-path="url(#seqClip)">
                    <text x="620" y="318" font-size="22" font-weight="700" fill="#2ECC71" class="mono scroll-text" letter-spacing="4">A T C G G T A C A T G C</text>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- STAGE 5: BIOINFORMATICS & DATA             -->
            <!-- ========================================== -->
            <g id="stage-data">
                <!-- Labels -->
                <text x="820" y="190" text-anchor="middle" font-size="16" font-weight="700" fill="#2C3E50">Bioinformatics</text>
                <text x="820" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#7F8C8D">Data Storage &amp; Analysis</text>
                
                <!-- Data Stream (Letters to Binary) -->
                <g clip-path="url(#streamClip)">
                    <text x="620" y="315" font-size="16" font-weight="700" fill="#2ECC71" class="mono stream-letters" letter-spacing="2">A T C G G T</text>
                    
                    <text x="620" y="305" font-size="12" font-weight="700" fill="#4A90D9" class="mono stream-binary" letter-spacing="1">01001011</text>
                    <text x="620" y="325" font-size="12" font-weight="700" fill="#4A90D9" class="mono stream-binary" letter-spacing="1">11010010</text>
                </g>

                <!-- Database Icon -->
                <g transform="translate(820, 280)">
                    <!-- Server Rack / DB Cylinders -->
                    <path d="M -45 0 C -45 -15, 45 -15, 45 0 L 45 60 C 45 75, -45 75, -45 60 Z" fill="#E8F4FD" stroke="#3498DB" stroke-width="4" />
                    <ellipse cx="0" cy="0" rx="45" ry="14" fill="#E8F4FD" stroke="#3498DB" stroke-width="4" />
                    <ellipse cx="0" cy="20" rx="45" ry="14" fill="none" stroke="#3498DB" stroke-width="4" />
                    <ellipse cx="0" cy="40" rx="45" ry="14" fill="none" stroke="#3498DB" stroke-width="4" />
                    
                    <!-- Data Pulse Effect -->
                    <circle cx="0" cy="30" r="30" fill="#3498DB" opacity="0.1" class="db-pulse" />
                    
                    <!-- DB Lights -->
                    <rect x="-10" y="5" width="4" height="4" fill="#2ECC71" rx="1" class="blink-2" />
                    <rect x="-10" y="25" width="4" height="4" fill="#2ECC71" rx="1" class="blink-1" />
                    <rect x="-10" y="45" width="4" height="4" fill="#2ECC71" rx="1" class="blink-3" />
                </g>
            </g>

            <!-- ========================================== -->
            <!-- PROCESS FLOW ARROWS                        -->
            <!-- ========================================== -->
            <g id="process-flow">
                <path d="M 150 480 L 820 480" stroke="#34495E" stroke-width="3" stroke-dasharray="8 8" fill="none" marker-end="url(#arrow)" />
                
                <!-- Flow Labels -->
                <text x="150" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#34495E">Biological Structure</text>
                <text x="480" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#34495E">Molecular Sequence</text>
                <text x="820" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#34495E">Digital Data</text>
                
                <!-- Vertical Connectors -->
                <line x1="150" y1="440" x2="150" y2="480" stroke="#34495E" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
                <line x1="480" y1="400" x2="480" y2="480" stroke="#34495E" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
                <line x1="820" y1="370" x2="820" y2="480" stroke="#34495E" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />
            </g>

        </svg>
    </div>
</body>
</html>
