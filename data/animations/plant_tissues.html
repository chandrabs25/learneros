<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Tissue Systems - Dicot Stem</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }
        
        /* Animations */
        .epi-draw {
            stroke-dasharray: 1006;
            stroke-dashoffset: 1006;
            animation: drawEpi 2s ease-in-out forwards;
        }
        .fade-in-1 {
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out 0.5s forwards;
        }
        .fade-in-2 {
            opacity: 0;
            animation: fadeIn 1.5s ease-in-out 1.5s forwards;
        }
        .pop-in {
            opacity: 0;
            transform: scale(0);
            transform-origin: 400px 280px;
            animation: popIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2.5s forwards;
        }
        .labels-fade {
            opacity: 0;
            animation: fadeIn 1s ease-in-out 4s forwards;
        }
        .cambium {
            animation: pulseCambium 1.5s infinite alternate 4s;
        }

        /* Keyframes */
        @keyframes drawEpi {
            to { stroke-dashoffset: 0; }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            60% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes pulseCambium {
            0% { fill: #98D8C8; }
            100% { fill: #C0EBE0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" aria-label="Transverse section of a dicot stem showing tissue systems" role="img">
        <title>Anatomy of Flowering Plants: Dicot Stem Tissue Systems</title>
        <desc>Animated diagram illustrating the Epidermal, Ground, and Vascular tissue systems in a dicot stem, featuring water and sucrose transport.</desc>

        <!-- Definitions for reusable elements and patterns -->
        <defs>
            <!-- Parenchyma Cell Pattern (Ground Tissue) -->
            <pattern id="parenchyma" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                <circle cx="10" cy="10" r="9" fill="none" stroke="#2ECC71" stroke-width="0.6" opacity="0.4"/>
            </pattern>

            <!-- Single Trichome -->
            <path id="trichome" d="M 400 120 Q 385 100 405 85 Q 410 80 415 85" fill="none" stroke="#BDC3C7" stroke-width="3" stroke-linecap="round"/>

            <!-- Single Stoma (Guard Cells & Gap) -->
            <g id="stoma">
                <rect x="396" y="117" width="8" height="6" fill="#E8F4FD" />
                <ellipse cx="397.5" cy="120" rx="2" ry="3.5" fill="#2ECC71" />
                <ellipse cx="402.5" cy="120" rx="2" ry="3.5" fill="#2ECC71" />
            </g>

            <!-- Single Vascular Bundle -->
            <g id="bundle">
                <!-- Phloem (Outer) -->
                <path d="M 380 140 L 420 140 L 417.8 155 L 382.2 155 Z" fill="#F39C12" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
                <!-- Sieve tubes in Phloem -->
                <circle cx="390" cy="147" r="2" fill="#ffffff" opacity="0.4"/>
                <circle cx="400" cy="145" r="3" fill="#ffffff" opacity="0.4"/>
                <circle cx="410" cy="147" r="2" fill="#ffffff" opacity="0.4"/>
                
                <!-- Sucrose Particles (Moving Down/Scaling Down) -->
                <circle cx="400" cy="145" r="3" fill="#F39C12" opacity="0">
                    <animate attributeName="r" values="3.5; 0.5" begin="4s" dur="1.5s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0; 1; 0" begin="4s" dur="1.5s" repeatCount="indefinite" />
                </circle>
                <circle cx="390" cy="147" r="2" fill="#F39C12" opacity="0">
                    <animate attributeName="r" values="2.5; 0.5" begin="4.7s" dur="1.5s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0; 1; 0" begin="4.7s" dur="1.5s" repeatCount="indefinite" />
                </circle>

                <!-- Vascular Cambium (Middle) -->
                <path class="cambium" d="M 382.2 155 L 417.8 155 L 417.1 160 L 382.9 160 Z" fill="#98D8C8" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>

                <!-- Xylem (Inner, Endarch) -->
                <path d="M 382.9 160 L 417.1 160 L 411.4 200 L 388.6 200 Z" fill="#4A90D9" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
                
                <!-- Metaxylem Vessels -->
                <circle cx="393" cy="172" r="4.5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
                <circle cx="407" cy="172" r="4.5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
                <circle cx="400" cy="184" r="3.5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
                
                <!-- Protoxylem Vessels -->
                <circle cx="396" cy="194" r="2" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>
                <circle cx="404" cy="194" r="2" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1"/>

                <!-- Water Particles (Moving Up/Scaling Up) -->
                <circle cx="393" cy="172" r="0" fill="#4A90D9" opacity="0">
                    <animate attributeName="r" values="0; 5" begin="4s" dur="1.2s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0; 1; 0" begin="4s" dur="1.2s" repeatCount="indefinite" />
                </circle>
                <circle cx="407" cy="172" r="0" fill="#4A90D9" opacity="0">
                    <animate attributeName="r" values="0; 5" begin="4.6s" dur="1.2s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0; 1; 0" begin="4.6s" dur="1.2s" repeatCount="indefinite" />
                </circle>
                <circle cx="400" cy="184" r="0" fill="#4A90D9" opacity="0">
                    <animate attributeName="r" values="0; 4" begin="4.3s" dur="1.2s" repeatCount="indefinite" />
                    <animate attributeName="opacity" values="0; 1; 0" begin="4.3s" dur="1.2s" repeatCount="indefinite" />
                </circle>
            </g>
        </defs>

        <!-- Title -->
        <g class="fade-in-1">
            <text x="400" y="45" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#2C3E50">Anatomy of Flowering Plants: Dicot Stem Tissue Systems</text>
            <text x="400" y="65" text-anchor="middle" font-family="Inter" font-weight="400" font-size="13" fill="#7F8C8D">Transverse Section (T.S.) showing spatial arrangement and transport dynamics</text>
        </g>

        <!-- ================= STRUCTURAL ELEMENTS ================= -->
        
        <!-- Ground Tissue System (Cortex & Pith Base) -->
        <g class="fade-in-2">
            <circle cx="400" cy="280" r="158" fill="#E8F4FD" />
            <circle cx="400" cy="280" r="158" fill="url(#parenchyma)" />
            <!-- Pith Center Highlight -->
            <circle cx="400" cy="280" r="75" fill="#F8F9FA" opacity="0.8" />
            <text x="400" y="284" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#BDC3C7" letter-spacing="2">PITH</text>
        </g>

        <!-- Epidermal Tissue System -->
        <!-- Base Epidermis Line -->
        <circle cx="400" cy="280" r="160" fill="none" stroke="#27AE60" stroke-width="4" class="epi-draw" />
        <!-- Cell Dividers (Dashed overlay to simulate rectangular cells) -->
        <circle cx="400" cy="280" r="160" fill="none" stroke="#27AE60" stroke-width="8" stroke-dasharray="2 12" class="fade-in-2" />

        <!-- Trichomes & Stomata -->
        <g class="fade-in-2">
            <use href="#trichome" transform="rotate(20 400 280)" />
            <use href="#trichome" transform="rotate(80 400 280)" />
            <use href="#trichome" transform="rotate(150 400 280)" />
            <use href="#trichome" transform="rotate(210 400 280)" />
            <use href="#trichome" transform="rotate(290 400 280)" />
            <use href="#trichome" transform="rotate(340 400 280)" />

            <use href="#stoma" transform="rotate(50 400 280)" />
            <use href="#stoma" transform="rotate(170 400 280)" />
            <use href="#stoma" transform="rotate(250 400 280)" />
        </g>

        <!-- Vascular Tissue System (Ring of Bundles) -->
        <g id="all-bundles" class="pop-in">
            <use href="#bundle" />
            <use href="#bundle" transform="rotate(45 400 280)" />
            <use href="#bundle" transform="rotate(90 400 280)" />
            <use href="#bundle" transform="rotate(135 400 280)" />
            <use href="#bundle" transform="rotate(180 400 280)" />
            <use href="#bundle" transform="rotate(225 400 280)" />
            <use href="#bundle" transform="rotate(270 400 280)" />
            <use href="#bundle" transform="rotate(315 400 280)" />
        </g>

        <!-- ================= LABELS & ANNOTATIONS ================= -->
        <g class="labels-fade">
            
            <!-- Left Side: Epidermal & Ground Systems -->
            <g>
                <text x="200" y="150" text-anchor="end" font-family="Inter" font-size="14" font-weight="700" fill="#27AE60">Epidermal Tissue System</text>
                <text x="200" y="168" text-anchor="end" font-family="Inter" font-size="11" fill="#2C3E50">Epidermis, Trichomes, Stomata</text>
                <polyline points="210,155 230,155 260,175" fill="none" stroke="#BDC3C7" stroke-width="1.5" />
                <circle cx="260" cy="175" r="3" fill="#27AE60" />

                <text x="200" y="380" text-anchor="end" font-family="Inter" font-size="14" font-weight="700" fill="#2ECC71">Ground Tissue System</text>
                <text x="200" y="398" text-anchor="end" font-family="Inter" font-size="11" fill="#2C3E50">Cortex &amp; Pith (Parenchyma)</text>
                <polyline points="210,385 230,385 280,340" fill="none" stroke="#BDC3C7" stroke-width="1.5" />
                <circle cx="280" cy="340" r="3" fill="#2ECC71" />
            </g>

            <!-- Right Side: Vascular System -->
            <g>
                <!-- Phloem -->
                <text x="590" y="160" text-anchor="start" font-family="Inter" font-size="14" font-weight="700" fill="#F39C12">Phloem</text>
                <text x="590" y="178" text-anchor="start" font-family="Inter" font-size="11" fill="#2C3E50">Transports Photosynthates</text>
                <text x="590" y="196" text-anchor="start" font-family="Roboto Mono" font-size="10" fill="#F39C12">● Sucrose Flow (Down)</text>
                <polyline points="580,165 560,165 500,195" fill="none" stroke="#BDC3C7" stroke-width="1.5" />
                <circle cx="500" cy="195" r="3" fill="#F39C12" />

                <!-- Vascular Cambium -->
                <text x="590" y="240" text-anchor="start" font-family="Inter" font-size="14" font-weight="700" fill="#16A085">Vascular Cambium</text>
                <text x="590" y="258" text-anchor="start" font-family="Inter" font-size="11" fill="#2C3E50">Lateral Meristem (Growth)</text>
                <polyline points="580,245 560,245 485,210" fill="none" stroke="#BDC3C7" stroke-width="1.5" />
                <circle cx="485" cy="210" r="3" fill="#16A085" />

                <!-- Xylem -->
                <text x="590" y="310" text-anchor="start" font-family="Inter" font-size="14" font-weight="700" fill="#4A90D9">Xylem</text>
                <text x="590" y="328" text-anchor="start" font-family="Inter" font-size="11" fill="#2C3E50">Transports Water &amp; Minerals</text>
                <text x="590" y="346" text-anchor="start" font-family="Roboto Mono" font-size="10" fill="#4A90D9">● H₂O Flow (Up)</text>
                <polyline points="580,315 560,315 465,230" fill="none" stroke="#BDC3C7" stroke-width="1.5" />
                <circle cx="465" cy="230" r="3" fill="#4A90D9" />
            </g>

        </g>
    </svg>

</body>
</html>
