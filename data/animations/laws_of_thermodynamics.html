<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thermodynamics in Ecosystems</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Continuous Animations */
        .continuous-flow {
            animation: flow-dash 1s linear infinite;
            opacity: 0.5;
        }
        @keyframes flow-dash {
            to { stroke-dashoffset: -24; }
        }

        .heat-wave {
            animation: heat-rise 2s infinite;
        }
        .wave1 { animation-delay: 0s; }
        .wave2 { animation-delay: 0.6s; }
        .wave3 { animation-delay: 1.2s; }
        @keyframes heat-rise {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-30px); opacity: 0; }
        }

        /* 12-Second Narrative Cycle Animations */
        .sun-pulse {
            animation: sun-pulse-anim 12s infinite;
            transform-origin: 100px 100px;
        }
        @keyframes sun-pulse-anim {
            0%, 20% { transform: scale(1.05); opacity: 1; }
            5%, 15% { transform: scale(1); opacity: 0.8; }
            25%, 100% { transform: scale(1); opacity: 0.6; }
        }

        .photon {
            offset-path: path('M 110 130 L 140 280');
            animation: photon-anim 12s infinite;
            opacity: 0;
        }
        @keyframes photon-anim {
            0% { offset-distance: 0%; opacity: 0; }
            2% { opacity: 1; }
            20% { offset-distance: 100%; opacity: 1; }
            22%, 100% { offset-distance: 100%; opacity: 0; }
        }

        .chloro-pulse {
            animation: chloro-anim 12s infinite;
            transform-origin: 175px 310px;
        }
        @keyframes chloro-anim {
            0%, 24% { transform: scale(1); filter: brightness(1); }
            25%, 45% { transform: scale(1.3); filter: brightness(1.2); }
            46%, 100% { transform: scale(1); filter: brightness(1); }
        }

        .glucose {
            offset-path: path('M 175 310 L 150 360');
            animation: glucose-anim 12s infinite;
            opacity: 0;
        }
        @keyframes glucose-anim {
            0%, 24% { opacity: 0; offset-distance: 0%; transform: scale(0.5); }
            25% { opacity: 1; offset-distance: 0%; transform: scale(1); }
            45% { opacity: 1; offset-distance: 100%; transform: scale(1); }
            46%, 100% { opacity: 0; offset-distance: 100%; transform: scale(0.5); }
        }

        .pulse-1 {
            offset-path: path('M 180 360 L 360 360');
            animation: pulse1-anim 12s infinite;
            opacity: 0;
        }
        @keyframes pulse1-anim {
            0%, 49% { opacity: 0; offset-distance: 0%; }
            50% { opacity: 1; offset-distance: 0%; }
            65% { opacity: 1; offset-distance: 100%; }
            66%, 100% { opacity: 0; offset-distance: 100%; }
        }

        .pulse-2 {
            offset-path: path('M 440 360 L 610 360');
            animation: pulse2-anim 12s infinite;
            opacity: 0;
        }
        @keyframes pulse2-anim {
            0%, 64% { opacity: 0; offset-distance: 0%; }
            65% { opacity: 1; offset-distance: 0%; }
            80% { opacity: 1; offset-distance: 100%; }
            81%, 100% { opacity: 0; offset-distance: 100%; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" aria-label="Animated diagram of the Laws of Thermodynamics in Ecosystem Energy Flow" role="img">
        <title>Thermodynamics in Ecosystems: Energy Flow & Entropy</title>
        <desc>An animated linear trophic chain demonstrating the 10% rule of energy transfer, heat loss (entropy), and energy transformation from solar to chemical energy.</desc>

        <defs>
            <!-- Gradients -->
            <radialGradient id="sunGlow">
                <stop offset="0%" stop-color="#FFF" />
                <stop offset="30%" stop-color="#F1C40F" />
                <stop offset="100%" stop-color="#F1C40F" stop-opacity="0" />
            </radialGradient>
            
            <linearGradient id="leak1" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#2ECC71"/>
                <stop offset="100%" stop-color="#E74C3C"/>
            </linearGradient>
            
            <linearGradient id="leak2" x1="0" y1="1" x2="0" y2="0">
                <stop offset="0%" stop-color="#F39C12"/>
                <stop offset="100%" stop-color="#E74C3C"/>
            </linearGradient>

            <!-- Markers -->
            <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <polygon points="0,0 10,5 0,10" fill="#2C3E50"/>
            </marker>
            <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto">
                <polygon points="0,0 10,5 0,10" fill="#2ECC71"/>
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
                <polygon points="0,0 10,5 0,10" fill="#F39C12"/>
            </marker>

            <!-- Filters -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15"/>
            </filter>

            <!-- Reusable Heat Waves -->
            <g id="heat-waves">
                <path d="M-12,0 Q-6,-10 -12,-20 T-12,-40" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" class="heat-wave wave1"/>
                <path d="M0,0 Q6,-10 0,-20 T0,-40" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" class="heat-wave wave2"/>
                <path d="M12,0 Q18,-10 12,-20 T12,-40" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" class="heat-wave wave3"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Title & Headers -->
        <text x="400" y="40" font-family="Inter" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">Thermodynamics in Ecosystems: Energy Flow &amp; Entropy</text>
        
        <text x="400" y="140" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Metabolic Heat Loss (Entropy)</text>
        <path d="M 250 150 Q 400 170 650 150" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

        <!-- Legend -->
        <g transform="translate(660, 60)">
            <rect x="0" y="0" width="120" height="65" fill="#FFF" stroke="#DDD" rx="4" filter="url(#shadow)"/>
            <text x="60" y="15" font-family="Inter" font-size="10" font-weight="bold" text-anchor="middle" fill="#2C3E50">Legend</text>
            
            <polygon points="15,22 20,26 20,32 15,36 10,32 10,26" fill="#98D8C8" stroke="#2C3E50" stroke-width="0.5"/>
            <text x="28" y="32" font-family="Inter" font-size="10" fill="#2C3E50">Glucose</text>
            
            <circle cx="15" cy="48" r="6" fill="#FF6B6B"/>
            <text x="15" y="51" font-family="Inter" font-size="8" font-weight="bold" text-anchor="middle" fill="#FFF">P</text>
            <text x="28" y="51" font-family="Inter" font-size="10" fill="#2C3E50">ATP</text>
            
            <path d="M80,35 Q85,30 80,25 T80,15" fill="none" stroke="#E74C3C" stroke-width="2"/>
            <text x="90" y="32" font-family="Inter" font-size="10" fill="#2C3E50">Heat</text>
        </g>

        <!-- ==================== ENERGY FLOW ARROWS ==================== -->
        
        <!-- Sun to Plant -->
        <line x1="110" y1="130" x2="140" y2="280" stroke="#F1C40F" stroke-width="15" stroke-linecap="round"/>
        <line x1="110" y1="130" x2="135" y2="260" stroke="#FFF" stroke-width="3" stroke-dasharray="8 12" class="continuous-flow"/>
        <polygon points="125,270 155,270 140,295" fill="#F1C40F"/>

        <!-- Plant to Herbivore -->
        <line x1="180" y1="360" x2="360" y2="360" stroke="#2ECC71" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-green)"/>
        <line x1="180" y1="360" x2="350" y2="360" stroke="#FFF" stroke-width="2" stroke-dasharray="6 10" class="continuous-flow"/>
        
        <!-- Plant Heat Leak (10% Rule) -->
        <path d="M 220 360 Q 250 360 250 280" fill="none" stroke="url(#leak1)" stroke-width="8" stroke-linecap="round"/>

        <!-- Herbivore to Carnivore -->
        <line x1="440" y1="360" x2="610" y2="360" stroke="#F39C12" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
        <line x1="440" y1="360" x2="600" y2="360" stroke="#FFF" stroke-width="1" stroke-dasharray="4 6" class="continuous-flow"/>
        
        <!-- Herbivore Heat Leak (10% Rule) -->
        <path d="M 470 360 Q 490 360 490 280" fill="none" stroke="url(#leak2)" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Carnivore Heat Leak -->
        <path d="M 650 330 Q 650 300 650 280" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>


        <!-- ==================== ORGANISMS & STRUCTURES ==================== -->

        <!-- Sun -->
        <g transform="translate(100, 100)">
            <circle cx="0" cy="0" r="50" fill="url(#sunGlow)" class="sun-pulse"/>
            <circle cx="0" cy="0" r="25" fill="#F1C40F"/>
            <g stroke="#F1C40F" stroke-width="3" stroke-linecap="round" class="sun-pulse">
                <line x1="0" y1="-40" x2="0" y2="-60"/>
                <line x1="0" y1="40" x2="0" y2="60"/>
                <line x1="-40" y1="0" x2="-60" y2="0"/>
                <line x1="40" y1="0" x2="60" y2="0"/>
                <line x1="-28" y1="-28" x2="-42" y2="-42"/>
                <line x1="28" y1="28" x2="42" y2="42"/>
                <line x1="-28" y1="28" x2="-42" y2="42"/>
                <line x1="28" y1="-28" x2="42" y2="-42"/>
            </g>
        </g>

        <!-- Producer (Plant) -->
        <g transform="translate(150, 360)" filter="url(#shadow)">
            <path d="M0,30 L0,-60" stroke="#2ECC71" stroke-width="6" stroke-linecap="round"/>
            <path d="M0,-20 Q-40,-20 -50,-50 Q-20,-60 0,-20" fill="#2ECC71"/>
            <path d="M0,-40 Q50,-20 60,-70 Q20,-80 0,-40" fill="#2ECC71"/>
            <!-- Chloroplast -->
            <ellipse cx="25" cy="-50" rx="12" ry="6" fill="#27AE60" class="chloro-pulse"/>
        </g>

        <!-- Primary Consumer (Herbivore/Rabbit) -->
        <g transform="translate(400, 360)" filter="url(#shadow)">
            <path d="M-15,30 Q-15,0 10,0 Q30,0 30,30 Z" fill="#F39C12"/>
            <circle cx="10" cy="-5" r="12" fill="#F39C12"/>
            <ellipse cx="5" cy="-20" rx="4" ry="15" fill="#F39C12" transform="rotate(-15 5 -20)"/>
            <ellipse cx="15" cy="-18" rx="4" ry="15" fill="#F39C12" transform="rotate(15 15 -18)"/>
            <circle cx="-15" cy="25" r="6" fill="#F39C12"/>
            <!-- Internal ATP -->
            <circle cx="10" cy="15" r="6" fill="#FF6B6B"/>
            <text x="10" y="18" font-family="Inter" font-size="8" font-weight="bold" text-anchor="middle" fill="#FFF">P</text>
        </g>

        <!-- Secondary Consumer (Carnivore/Wolf) -->
        <g transform="translate(650, 360)" filter="url(#shadow)">
            <path d="M-25,30 Q-25,-10 15,-10 Q35,-10 35,30 Z" fill="#D35400"/>
            <polygon points="15,-10 40,-5 25,10" fill="#D35400"/>
            <polygon points="15,-10 10,-25 25,-10" fill="#D35400"/>
            <polygon points="25,-10 30,-25 35,-5" fill="#D35400"/>
            <ellipse cx="-25" cy="15" rx="20" ry="6" fill="#D35400" transform="rotate(-30 -25 15)"/>
            <!-- Internal ATP -->
            <circle cx="5" cy="15" r="6" fill="#FF6B6B"/>
            <text x="5" y="18" font-family="Inter" font-size="8" font-weight="bold" text-anchor="middle" fill="#FFF">P</text>
        </g>


        <!-- ==================== ANIMATED ELEMENTS (12s Cycle) ==================== -->
        
        <!-- Photons -->
        <circle r="4" fill="#F1C40F" class="photon"/>
        <circle r="4" fill="#F1C40F" class="photon" style="animation-delay: 0.4s"/>
        <circle r="4" fill="#F1C40F" class="photon" style="animation-delay: 0.8s"/>
        <circle r="4" fill="#F1C40F" class="photon" style="animation-delay: 1.2s"/>

        <!-- Glucose Molecule -->
        <polygon points="0,-6 5,-3 5,3 0,6 -5,3 -5,-3" fill="#98D8C8" stroke="#2C3E50" stroke-width="1" class="glucose"/>

        <!-- Energy Pulses -->
        <circle r="6" fill="#FFF" filter="url(#shadow)" class="pulse-1"/>
        <circle r="4" fill="#FFF" filter="url(#shadow)" class="pulse-2"/>

        <!-- Heat Waves (Entropy) -->
        <use href="#heat-waves" x="250" y="270"/>
        <use href="#heat-waves" x="490" y="270"/>
        <use href="#heat-waves" x="650" y="270"/>


        <!-- ==================== LABELS & ANNOTATIONS ==================== -->

        <!-- Sun Labels -->
        <text x="100" y="210" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Incident Solar Radiation</text>
        <text x="100" y="225" font-family="Inter" font-size="11" text-anchor="middle" fill="#555">(&lt; 50% PAR)</text>
        <text x="100" y="180" font-family="'Roboto Mono'" font-size="16" font-weight="bold" text-anchor="middle" fill="#F1C40F" filter="url(#shadow)">10,000 J</text>

        <!-- Producer Labels -->
        <text x="150" y="420" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Producer</text>
        <text x="150" y="435" font-family="Inter" font-size="11" text-anchor="middle" fill="#555">Photosynthesis</text>
        <text x="150" y="455" font-family="'Roboto Mono'" font-size="16" font-weight="bold" text-anchor="middle" fill="#2ECC71">1,000 J</text>

        <!-- Primary Consumer Labels -->
        <text x="400" y="420" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Primary Consumer</text>
        <text x="400" y="435" font-family="Inter" font-size="11" text-anchor="middle" fill="#555">Herbivore</text>
        <text x="400" y="455" font-family="'Roboto Mono'" font-size="16" font-weight="bold" text-anchor="middle" fill="#F39C12">100 J</text>

        <!-- Secondary Consumer Labels -->
        <text x="650" y="420" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle" fill="#2C3E50">Secondary Consumer</text>
        <text x="650" y="435" font-family="Inter" font-size="11" text-anchor="middle" fill="#555">Carnivore</text>
        <text x="650" y="455" font-family="'Roboto Mono'" font-size="16" font-weight="bold" text-anchor="middle" fill="#D35400">10 J</text>

        <!-- Heat Loss Labels (10% Rule Math) -->
        <text x="265" y="300" font-family="'Roboto Mono'" font-size="12" font-weight="bold" fill="#E74C3C">-900 J</text>
        <text x="505" y="300" font-family="'Roboto Mono'" font-size="12" font-weight="bold" fill="#E74C3C">-90 J</text>
        <text x="665" y="300" font-family="'Roboto Mono'" font-size="12" font-weight="bold" fill="#E74C3C">-9 J</text>

        <!-- Unidirectional Flow Indicator -->
        <line x1="150" y1="480" x2="650" y2="480" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow-dark)"/>
        <text x="400" y="472" font-family="Inter" font-size="12" font-weight="bold" text-anchor="middle" fill="#2C3E50">Unidirectional Energy Flow</text>

    </svg>
</div>

</body>
</html>
