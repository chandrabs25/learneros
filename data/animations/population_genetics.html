<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Population Genetics: The Genetic Bottleneck Effect</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            height: 100%;
            max-width: 1000px;
            max-height: 625px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border-radius: 12px;
        }

        /* --- Animations --- */
        
        /* 1. Brownian Motion (Wiggle) */
        @keyframes wiggle {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(2px, -2px) rotate(8deg); }
            50% { transform: translate(-2px, 1px) rotate(-5deg); }
            75% { transform: translate(1px, 3px) rotate(4deg); }
        }
        .wiggle {
            animation: wiggle 2.5s infinite ease-in-out;
            transform-origin: center;
        }

        /* 2. Doomed Beetles (Fade out during catastrophe) */
        @keyframes doomed-fade {
            0%, 26.6% { opacity: 1; transform: scale(1); }
            30%, 93.3% { opacity: 0; transform: scale(0.8); }
            96.6%, 100% { opacity: 1; transform: scale(1); }
        }
        .doomed {
            animation: doomed-fade 15s infinite ease-in-out;
        }

        /* 3. Survivor Beetles (Move to center, then back) */
        @keyframes survivor-move {
            0%, 26.6% { transform: translate(var(--orig-x), var(--orig-y)); }
            33.3%, 86.6% { transform: translate(var(--center-x), var(--center-y)); }
            93.3%, 100% { transform: translate(var(--orig-x), var(--orig-y)); }
        }
        .survivor {
            animation: survivor-move 15s infinite ease-in-out;
        }

        /* 4. Offspring Beetles (Spawn at center, move to final positions) */
        @keyframes offspring-spawn {
            0%, 40% { transform: translate(var(--center-x), var(--center-y)) scale(0); opacity: 0; }
            46.6% { transform: translate(var(--center-x), var(--center-y)) scale(1); opacity: 1; }
            53.3%, 86.6% { transform: translate(var(--final-x), var(--final-y)) scale(1); opacity: 1; }
            93.3%, 100% { transform: translate(var(--final-x), var(--final-y)) scale(0); opacity: 0; }
        }
        .offspring {
            animation: offspring-spawn 15s infinite ease-in-out;
        }

        /* 5. Catastrophe Event (Drops from top) */
        @keyframes catastrophe-drop {
            0%, 20% { transform: translateY(-500px); opacity: 0; }
            26.6%, 40% { transform: translateY(0); opacity: 1; }
            46.6%, 100% { transform: translateY(0); opacity: 0; }
        }
        .catastrophe-group {
            animation: catastrophe-drop 15s infinite ease-in-out;
        }

        /* 6. Time Ring (Slow rotation) */
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
        .time-ring {
            transform-origin: 400px 270px;
            animation: spin 40s linear infinite;
        }

        /* 7. Process Labels */
        .label { opacity: 0; animation: label-seq 15s infinite ease-in-out; }
        @keyframes show-l1 { 0%, 25% { opacity: 1; } 26.6%, 100% { opacity: 0; } }
        @keyframes show-l2 { 0%, 25% { opacity: 0; } 26.6%, 40% { opacity: 1; } 41.6%, 100% { opacity: 0; } }
        @keyframes show-l3 { 0%, 40% { opacity: 0; } 41.6%, 65% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
        @keyframes show-l4 { 0%, 65% { opacity: 0; } 66.6%, 93.3% { opacity: 1; } 95%, 100% { opacity: 0; } }
        
        .l1 { animation-name: show-l1; }
        .l2 { animation-name: show-l2; }
        .l3 { animation-name: show-l3; }
        .l4 { animation-name: show-l4; }

        /* 8. Frequency Tracker */
        .freq { opacity: 0; animation: freq-seq 15s infinite ease-in-out; }
        @keyframes show-f1 { 0%, 28% { opacity: 1; } 30%, 100% { opacity: 0; } }
        @keyframes show-f2 { 0%, 28% { opacity: 0; } 30%, 93.3% { opacity: 1; } 95%, 100% { opacity: 0; } }
        
        .f1 { animation-name: show-f1; }
        .f2 { animation-name: show-f2; }

    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Population Genetics: The Genetic Bottleneck Effect</title>
        <desc>Animated diagram showing a population of beetles undergoing a genetic bottleneck, resulting in a change in allele frequency due to a random catastrophic event.</desc>

        <defs>
            <!-- Beetle Symbol -->
            <g id="beetle">
                <!-- Legs -->
                <path d="M -5 -2 L -12 -8 M 5 -2 L 12 -8 M -6 0 L -14 0 M 6 0 L 14 0 M -5 2 L -12 8 M 5 2 L 12 8" stroke="#2C3E50" stroke-width="2" stroke-linecap="round" fill="none"/>
                <!-- Antennae -->
                <path d="M -3 -8 Q -6 -14 -10 -12 M 3 -8 Q 6 -14 10 -12" stroke="#2C3E50" stroke-width="1.5" stroke-linecap="round" fill="none"/>
                <!-- Body -->
                <ellipse cx="0" cy="0" rx="7" ry="11" fill="currentColor" stroke="#2C3E50" stroke-width="1.5"/>
                <!-- Head -->
                <circle cx="0" cy="-9" r="3.5" fill="#2C3E50" />
                <!-- Wing split -->
                <line x1="0" y1="-4" x2="0" y2="11" stroke="#2C3E50" stroke-width="1.5"/>
            </g>

            <!-- Arrowhead for Time Ring -->
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#D4E6F1" />
            </marker>

            <!-- Catastrophe Gradient -->
            <linearGradient id="catastrophe-grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#7F8C8D" stop-opacity="0.95"/>
                <stop offset="100%" stop-color="#BDC3C7" stop-opacity="0.85"/>
            </linearGradient>
        </defs>

        <!-- Background Time Flow Ring -->
        <g class="time-ring">
            <path d="M 170 270 A 230 230 0 0 1 630 270" fill="none" stroke="#D4E6F1" stroke-width="8" marker-end="url(#arrow)" />
            <path d="M 630 270 A 230 230 0 0 1 170 270" fill="none" stroke="#D4E6F1" stroke-width="8" marker-end="url(#arrow)" />
        </g>

        <!-- Gene Pool Boundary -->
        <circle cx="400" cy="270" r="180" stroke="#2C3E50" stroke-width="2.5" stroke-dasharray="12,8" fill="#FFFFFF" fill-opacity="0.4" />

        <!-- ================= BEETLES ================= -->
        
        <!-- DOOMED BEETLES (Die during catastrophe) -->
        <!-- 9 Red (A), 6 Teal (a) -->
        <g class="doomed">
            <!-- Red Doomed -->
            <g transform="translate(250, 200)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(280, 260)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(320, 150)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(350, 220)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(380, 180)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(260, 320)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(310, 360)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(360, 300)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <g transform="translate(400, 380)"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
            <!-- Teal Doomed -->
            <g transform="translate(290, 180)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
            <g transform="translate(340, 260)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
            <g transform="translate(390, 230)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
            <g transform="translate(270, 380)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
            <g transform="translate(330, 400)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
            <g transform="translate(420, 140)"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        </g>

        <!-- SURVIVOR BEETLES (Move to center, survive) -->
        <!-- 1 Red (A), 4 Teal (a) -->
        <g class="survivor" style="--orig-x: 480px; --orig-y: 200px; --center-x: 400px; --center-y: 270px;">
            <use href="#beetle" class="wiggle" color="#FF6B6B" />
        </g>
        <g class="survivor" style="--orig-x: 460px; --orig-y: 260px; --center-x: 360px; --center-y: 240px;">
            <use href="#beetle" class="wiggle" color="#98D8C8" />
        </g>
        <g class="survivor" style="--orig-x: 520px; --orig-y: 280px; --center-x: 440px; --center-y: 240px;">
            <use href="#beetle" class="wiggle" color="#98D8C8" />
        </g>
        <g class="survivor" style="--orig-x: 490px; --orig-y: 340px; --center-x: 370px; --center-y: 300px;">
            <use href="#beetle" class="wiggle" color="#98D8C8" />
        </g>
        <g class="survivor" style="--orig-x: 450px; --orig-y: 390px; --center-x: 430px; --center-y: 300px;">
            <use href="#beetle" class="wiggle" color="#98D8C8" />
        </g>

        <!-- OFFSPRING BEETLES (Spawn at center, move to fill empty space) -->
        <!-- 3 Red (A), 12 Teal (a) -->
        <!-- Red Offspring -->
        <g class="offspring" style="--center-x: 400px; --center-y: 270px; --final-x: 250px; --final-y: 200px;"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
        <g class="offspring" style="--center-x: 400px; --center-y: 270px; --final-x: 320px; --final-y: 150px;"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
        <g class="offspring" style="--center-x: 400px; --center-y: 270px; --final-x: 400px; --final-y: 380px;"><use href="#beetle" class="wiggle" color="#FF6B6B" /></g>
        <!-- Teal Offspring -->
        <g class="offspring" style="--center-x: 360px; --center-y: 240px; --final-x: 280px; --final-y: 260px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 360px; --center-y: 240px; --final-x: 350px; --final-y: 220px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 360px; --center-y: 240px; --final-x: 380px; --final-y: 180px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 440px; --center-y: 240px; --final-x: 260px; --final-y: 320px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 440px; --center-y: 240px; --final-x: 310px; --final-y: 360px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 440px; --center-y: 240px; --final-x: 360px; --final-y: 300px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 370px; --center-y: 300px; --final-x: 290px; --final-y: 180px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 370px; --center-y: 300px; --final-x: 340px; --final-y: 260px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 370px; --center-y: 300px; --final-x: 390px; --final-y: 230px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 430px; --center-y: 300px; --final-x: 270px; --final-y: 380px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 430px; --center-y: 300px; --final-x: 330px; --final-y: 400px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>
        <g class="offspring" style="--center-x: 430px; --center-y: 300px; --final-x: 420px; --final-y: 140px;"><use href="#beetle" class="wiggle" color="#98D8C8" /></g>

        <!-- ================= CATASTROPHE EVENT ================= -->
        <g class="catastrophe-group">
            <rect x="200" y="70" width="240" height="400" fill="url(#catastrophe-grad)" rx="12" />
            <text x="320" y="270" font-family="Inter" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90, 320, 270)" letter-spacing="6" opacity="0.9">CATASTROPHE</text>
            <!-- Debris/Impact marks -->
            <path d="M 230 150 L 260 120 M 380 350 L 410 380 M 250 400 L 220 370 M 390 130 L 360 160" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
        </g>

        <!-- ================= LABELS & UI ================= -->
        
        <!-- Main Title -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="700" fill="#2C3E50" text-anchor="middle">Population Genetics: Genetic Bottleneck</text>

        <!-- Dynamic Process Labels -->
        <text class="label l1" x="400" y="70" font-family="Inter" font-size="16" font-weight="600" fill="#2C3E50" text-anchor="middle">Stage 1: Original Population (High Genetic Diversity)</text>
        <text class="label l2" x="400" y="70" font-family="Inter" font-size="16" font-weight="600" fill="#E74C3C" text-anchor="middle">Stage 2: Random Catastrophic Event (Non-selective)</text>
        <text class="label l3" x="400" y="70" font-family="Inter" font-size="16" font-weight="600" fill="#F39C12" text-anchor="middle">Stage 3: Surviving Founders (Altered Gene Pool)</text>
        <text class="label l4" x="400" y="70" font-family="Inter" font-size="16" font-weight="600" fill="#27AE60" text-anchor="middle">Stage 4: Post-Bottleneck Population (Reduced Diversity)</text>

        <!-- Legend -->
        <g transform="translate(20, 410)">
            <rect x="0" y="0" width="160" height="70" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5" rx="6" />
            <circle cx="20" cy="22" r="7" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1" />
            <text x="38" y="27" font-family="Inter" font-size="13" font-weight="600" fill="#2C3E50">Allele A (Red)</text>
            <circle cx="20" cy="48" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1" />
            <text x="38" y="53" font-family="Inter" font-size="13" font-weight="600" fill="#2C3E50">Allele a (Teal)</text>
        </g>

        <!-- Allele Frequency Tracker -->
        <g transform="translate(540, 410)">
            <rect x="0" y="0" width="240" height="70" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1.5" rx="6" />
            <text x="120" y="25" font-family="Inter" font-size="14" font-weight="700" fill="#2C3E50" text-anchor="middle">Allele Frequency</text>
            
            <!-- Frequency 1 (Original) -->
            <text class="freq f1" x="120" y="50" font-family="'Roboto Mono', monospace" font-size="15" font-weight="700" fill="#2C3E50" text-anchor="middle">
                p(A)=<tspan fill="#E74C3C">0.50</tspan>, q(a)=<tspan fill="#27AE60">0.50</tspan>
            </text>
            
            <!-- Frequency 2 (Post-Bottleneck) -->
            <text class="freq f2" x="120" y="50" font-family="'Roboto Mono', monospace" font-size="15" font-weight="700" fill="#2C3E50" text-anchor="middle">
                p(A)=<tspan fill="#E74C3C">0.20</tspan>, q(a)=<tspan fill="#27AE60">0.80</tspan>
            </text>
        </g>

    </svg>

</body>
</html>
