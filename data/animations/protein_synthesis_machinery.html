<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Molecular Dance: Translation and Ribosomal Function</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .trna-enter {
            animation: trna-enter-anim 12s infinite;
        }

        .trna-exit {
            animation: trna-exit-anim 12s infinite;
        }

        .main-chain {
            animation: main-chain-anim 12s infinite;
        }

        .new-bond {
            animation: new-bond-anim 12s infinite;
        }

        .mrna-strand {
            animation: mrna-anim 12s infinite;
        }

        .fade-top {
            animation: fade-top-anim 12s infinite;
        }

        @keyframes trna-enter-anim {
            0% { transform: translate(150px, -150px); opacity: 0; }
            10% { transform: translate(150px, -150px); opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            25% { transform: translate(80px, 0); opacity: 1; }
            41.66% { transform: translate(80px, 0); opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            66.66% { transform: translate(0px, 0); opacity: 1; }
            99.9% { transform: translate(0px, 0); opacity: 1; }
            100% { transform: translate(150px, -150px); opacity: 0; }
        }

        @keyframes trna-exit-anim {
            0% { transform: translate(0px, 0); opacity: 1; }
            41.66% { transform: translate(0px, 0); opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            66.66% { transform: translate(-80px, 0); opacity: 1; }
            75% { transform: translate(-80px, 0); opacity: 1; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            85% { transform: translate(-150px, -100px); opacity: 0; }
            100% { transform: translate(-150px, -100px); opacity: 0; }
        }

        @keyframes main-chain-anim {
            0% { transform: translate(0px, 0px); }
            25% { transform: translate(0px, 0px); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            41.66% { transform: translate(80px, -30px); }
            66.66% { transform: translate(0px, -30px); }
            99.9% { transform: translate(0px, -30px); }
            100% { transform: translate(0px, 0px); }
        }

        @keyframes new-bond-anim {
            0% { opacity: 0; transform: translate(80px, 0); }
            24.9% { opacity: 0; transform: translate(80px, 0); }
            25% { opacity: 1; transform: translate(80px, 0); }
            41.66% { opacity: 1; transform: translate(80px, 0); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            66.66% { opacity: 1; transform: translate(0px, 0); }
            99.9% { opacity: 1; transform: translate(0px, 0); }
            100% { opacity: 0; transform: translate(80px, 0); }
        }

        @keyframes mrna-anim {
            0% { transform: translateX(0px); }
            41.66% { transform: translateX(0px); animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }
            66.66% { transform: translateX(-80px); }
            99.9% { transform: translateX(-80px); }
            100% { transform: translateX(0px); }
        }

        @keyframes fade-top-anim {
            0% { opacity: 1; }
            25% { opacity: 1; }
            41.66% { opacity: 0; }
            99.9% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" aria-label="Animated diagram of a ribosome synthesizing a protein" role="img">
        <title>Protein Synthesis: Translation at the Ribosome</title>
        <desc>An animation showing the elongation phase of translation. A tRNA enters the A-site, the polypeptide chain transfers to it, and the ribosome translocates along the mRNA, moving the tRNAs to the P and E sites.</desc>

        <defs>
            <!-- Drop Shadow Filter -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2C3E50" flood-opacity="0.15"/>
            </filter>
            
            <filter id="light-shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#2C3E50" flood-opacity="0.1"/>
            </filter>

            <!-- Gradients -->
            <linearGradient id="grad-60s" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#5A769A" />
                <stop offset="100%" stop-color="#4B6584" />
            </linearGradient>

            <linearGradient id="grad-40s" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#B8C4D5" />
                <stop offset="100%" stop-color="#A5B1C2" />
            </linearGradient>

            <!-- Arrow Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7f8c8d" />
            </marker>

            <!-- Amino Acid Symbol -->
            <circle id="aa-symbol" r="12" fill="#98D8C8" stroke="#16a085" stroke-width="2" filter="url(#light-shadow)"/>

            <!-- tRNA Symbol -->
            <g id="trna-symbol" filter="url(#light-shadow)">
                <path d="M -8 -20 C -20 -5, 20 -5, 8 -20 C 35 -20, 35 -55, 8 -55 L 8 -90 L -8 -90 L -8 -55 C -35 -55, -35 -20, -8 -20 Z" fill="#D980FA" stroke="#9b59b6" stroke-width="2"/>
                <text x="0" y="-6" font-family="'Roboto Mono', monospace" font-size="11" font-weight="700" fill="#2C3E50" text-anchor="middle">GAC</text>
            </g>

            <!-- Codon Group -->
            <g id="codon">
                <line x1="0" y1="282" x2="0" y2="290" stroke="#FFA07A" stroke-width="4" stroke-linecap="round"/>
                <line x1="26.66" y1="282" x2="26.66" y2="290" stroke="#FFA07A" stroke-width="4" stroke-linecap="round"/>
                <line x1="53.33" y1="282" x2="53.33" y2="290" stroke="#FFA07A" stroke-width="4" stroke-linecap="round"/>
            </g>
        </defs>

        <!-- Background (Handled by CSS, but added here for safety) -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="400" y="45" font-family="'Inter', sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#2C3E50">Protein Synthesis: Translation at the Ribosome</text>

        <!-- mRNA Strand (Animated) -->
        <g class="mrna-strand">
            <line x1="-200" y1="290" x2="1000" y2="290" stroke="#FFA07A" stroke-width="5" stroke-linecap="round"/>
            <!-- Repeating Codons -->
            <use href="#codon" x="-80"/>
            <use href="#codon" x="0"/>
            <use href="#codon" x="80"/>
            <use href="#codon" x="160"/>
            <use href="#codon" x="240"/>
            <use href="#codon" x="320"/>
            <use href="#codon" x="400"/>
            <use href="#codon" x="480"/>
            <use href="#codon" x="560"/>
            <use href="#codon" x="640"/>
            <use href="#codon" x="720"/>
            <use href="#codon" x="800"/>
            <use href="#codon" x="880"/>
        </g>

        <!-- Ribosome Large Subunit (60S) -->
        <g filter="url(#shadow)">
            <!-- Main Dome -->
            <path d="M 230 280 C 230 80, 570 80, 570 280 Z" fill="url(#grad-60s)"/>
            <!-- A-site Pocket -->
            <path d="M 450 280 L 450 200 A 30 30 0 0 1 510 200 L 510 280 Z" fill="#ffffff"/>
            <!-- P-site Pocket -->
            <path d="M 370 280 L 370 200 A 30 30 0 0 1 430 200 L 430 280 Z" fill="#ffffff"/>
            <!-- E-site Pocket -->
            <path d="M 290 280 L 290 200 A 30 30 0 0 1 350 200 L 350 280 Z" fill="#ffffff"/>
            <!-- Exit Tunnel -->
            <path d="M 385 200 L 385 60 L 415 60 L 415 200 Z" fill="#ffffff"/>
        </g>

        <!-- Site Labels -->
        <text x="320" y="270" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#A5B1C2">E</text>
        <text x="400" y="270" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#A5B1C2">P</text>
        <text x="480" y="270" font-family="'Inter', sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#A5B1C2">A</text>

        <!-- tRNAs and Polypeptide Chain -->
        <g transform="translate(400, 280)">
            
            <!-- Exiting tRNA (Starts in P-site, moves to E-site, then exits) -->
            <g class="trna-exit">
                <use href="#trna-symbol"/>
            </g>

            <!-- Entering tRNA (Starts offscreen, moves to A-site, then P-site) -->
            <g class="trna-enter">
                <use href="#trna-symbol"/>
                <!-- Single Amino Acid brought by new tRNA -->
                <use href="#aa-symbol" y="-102"/>
            </g>

            <!-- New Peptide Bond (Forms between chain and new AA) -->
            <line class="new-bond" x1="0" y1="-132" x2="80" y2="-102" stroke="#2C3E50" stroke-width="3"/>

            <!-- Main Polypeptide Chain -->
            <g class="main-chain">
                <!-- Connecting lines -->
                <line x1="0" y1="-222" x2="0" y2="-192" class="fade-top" stroke="#2C3E50" stroke-width="3"/>
                <line x1="0" y1="-192" x2="0" y2="-102" stroke="#2C3E50" stroke-width="3"/>
                
                <!-- Amino Acids -->
                <use href="#aa-symbol" y="-222" class="fade-top"/>
                <use href="#aa-symbol" y="-192"/>
                <use href="#aa-symbol" y="-162"/>
                <use href="#aa-symbol" y="-132"/>
                <use href="#aa-symbol" y="-102"/>
            </g>

        </g>

        <!-- Ribosome Small Subunit (40S) -->
        <path d="M 230 290 Q 400 305 570 290 A 40 40 0 0 1 530 360 L 270 360 A 40 40 0 0 1 230 290 Z" fill="url(#grad-40s)" filter="url(#shadow)"/>

        <!-- Static Annotations & Labels -->
        
        <!-- mRNA Polarity -->
        <text x="60" y="285" font-family="'Roboto Mono', monospace" font-size="16" font-weight="700" fill="#E74C3C">5'</text>
        <text x="720" y="285" font-family="'Roboto Mono', monospace" font-size="16" font-weight="700" fill="#E74C3C">3'</text>

        <!-- Subunit Labels -->
        <text x="590" y="160" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#4B6584">Large Subunit (60S)</text>
        <text x="590" y="340" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#A5B1C2">Small Subunit (40S)</text>

        <!-- Molecule Labels & Leader Lines -->
        <text x="120" y="335" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#E74C3C">mRNA Strand</text>
        <path d="M 170 320 L 200 295" fill="none" stroke="#E74C3C" stroke-width="1.5" marker-end="url(#arrow)"/>

        <text x="630" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#9b59b6">tRNA (charged)</text>
        <path d="M 620 100 L 560 100 L 520 130" fill="none" stroke="#9b59b6" stroke-width="1.5" marker-end="url(#arrow)"/>

        <text x="230" y="95" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#16a085">Growing Polypeptide</text>
        <path d="M 300 105 L 350 105 L 380 130" fill="none" stroke="#16a085" stroke-width="1.5" marker-end="url(#arrow)"/>

        <!-- Footer Caption -->
        <text x="400" y="460" font-family="'Inter', sans-serif" font-size="13" fill="#7f8c8d" text-anchor="middle">Ribosomes are ribonucleoprotein complexes that synthesize proteins by translating messenger RNA.</text>

    </svg>
</div>

</body>
</html>
