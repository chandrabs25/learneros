<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laminar Flow & Viscosity Simulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            height: 100vh;
            background-color: #f0f4f8;
            font-family: 'Inter', sans-serif;
            color: #333;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            height: 100%;
        }

        /* Glassmorphic Controls Panel */
        #controls {
            width: 320px;
            min-width: 320px;
            height: 100%;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: -5px 0 25px rgba(0, 0, 0, 0.05);
            padding: 25px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h2 {
            margin: 0 0 10px 0;
            font-size: 1.4rem;
            color: #1d3557;
            font-weight: 600;
            border-bottom: 2px solid #4361EE;
            padding-bottom: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #4A4E69;
        }

        .value-display {
            font-family: 'Roboto Mono', monospace;
            background: rgba(67, 97, 238, 0.1);
            color: #4361EE;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        /* Custom Sliders */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]:focus {
            outline: none;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #d1d8e0;
            border-radius: 3px;
        }
        input[type=range]::-webkit-slider-thumb {
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #4361EE;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
        
        /* Specific slider colors */
        #force::-webkit-slider-thumb { background: #06D6A0; }
        #separation::-webkit-slider-thumb { background: #FCA311; }
        #particles::-webkit-slider-thumb { background: #FF3366; }

        /* Formula Card */
        #formula-card {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 1);
            font-family: 'Inter', sans-serif;
            z-index: 10;
            pointer-events: none;
        }

        .formula-title {
            font-weight: 600;
            color: #1d3557;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .math {
            font-family: 'Roboto Mono', monospace;
            font-size: 1.1rem;
            color: #333;
            background: #f8f9fa;
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 12px;
            border: 1px solid #e9ecef;
        }

        .math i {
            font-style: italic;
        }

        .live-stats {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.85rem;
            color: #4A4E69;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }

        .stat-val {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            color: #06D6A0;
        }
        .stat-val.vtop { color: #FF3366; }

        .legend {
            margin-top: auto;
            background: rgba(255,255,255,0.5);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.8rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

    </style>
</head>
<body>

    <div id="canvas-container">
        <div id="formula-card">
            <div class="formula-title">Couette Flow (Laminar)</div>
            <div class="math">
                <i>v(y)</i> = (<i>F</i> · <i>y</i>) / (<i>η</i> · <i>A</i>)
            </div>
            <div class="live-stats">
                <div class="stat-row">
                    <span>Shear Rate (dv/dy):</span>
                    <span class="stat-val" id="stat-shear">0.00 s⁻¹</span>
                </div>
                <div class="stat-row">
                    <span>Max Velocity (v_top):</span>
                    <span class="stat-val vtop" id="stat-vtop">0.00 m/s</span>
                </div>
            </div>
        </div>
    </div>

    <div id="controls">
        <h2>Simulation Controls</h2>

        <div class="control-group">
            <div class="control-header">
                <label for="viscosity">Fluid Viscosity (η)</label>
                <span class="value-display" id="val-viscosity">1.0 Pa·s</span>
            </div>
            <input type="range" id="viscosity" min="0.1" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label for="force">Applied Force (F)</label>
                <span class="value-display" id="val-force">5.0 N</span>
            </div>
            <input type="range" id="force" min="1.0" max="10.0" step="0.5" value="5.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label for="separation">Plate Distance (L)</label>
                <span class="value-display" id="val-separation">3.0 m</span>
            </div>
            <input type="range" id="separation" min="2.0" max="5.0" step="0.2" value="3.0">
        </div>

        <div class="control-group">
            <div class="control-header">
                <label for="particles">Tracer Particles</label>
                <span class="value-display" id="val-particles">200</span>
            </div>
            <input type="range" id="particles" min="50" max="500" step="50" value="200">
        </div>

        <div class="legend">
            <div class="legend-item"><div class="color-box" style="background: #4A4E69;"></div> Boundary Plates</div>
            <div class="legend-item"><div class="color-box" style="background: #4361EE; opacity: 0.5;"></div> Fluid Layers</div>
            <div class="legend-item"><div class="color-box" style="background: #06D6A0;"></div> Velocity Vectors</div>
            <div class="legend-item"><div class="color-box" style="background: #FF3366;"></div> Tracer Particles</div>
            <div class="legend-item"><div class="color-box" style="background: #FCA311;"></div> Deformation Grid (Dye)</div>
        </div>
    </div>

    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // --- Configuration & State ---
        const config = {
            area: 10.0, // Fixed area for formula
            plateWidth: 20,
            plateDepth: 10,
            plateThickness: 0.4,
            visualSpeedScale: 0.2, // Scales down movement for better visualization
            arrowScale: 0.5,       // Scales arrow lengths
        };

        const state = {
            viscosity: 1.0,
            force: 5.0,
            separation: 3.0,
            particleCount: 200,
            shearRate: 0,
            vTop: 0
        };

        // --- DOM Elements ---
        const container = document.getElementById('canvas-container');
        const inputs = {
            viscosity: document.getElementById('viscosity'),
            force: document.getElementById('force'),
            separation: document.getElementById('separation'),
            particles: document.getElementById('particles')
        };
        const displays = {
            viscosity: document.getElementById('val-viscosity'),
            force: document.getElementById('val-force'),
            separation: document.getElementById('val-separation'),
            particles: document.getElementById('val-particles'),
            shear: document.getElementById('stat-shear'),
            vtop: document.getElementById('stat-vtop')
        };

        // --- Three.js Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#f0f4f8');

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 5, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; // Don't go too far below ground

        // --- Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(10, 15, 10);
        scene.add(dirLight);

        // --- Materials ---
        const matPlate = new THREE.MeshPhongMaterial({ color: 0x4A4E69, shininess: 30 });
        const matFluid = new THREE.MeshBasicMaterial({ 
            color: 0x4361EE, 
            transparent: true, 
            opacity: 0.15, 
            side: THREE.DoubleSide,
            depthWrite: false 
        });
        const matParticle = new THREE.MeshPhongMaterial({ color: 0xFF3366, shininess: 50 });
        const matDye = new THREE.MeshPhongMaterial({ color: 0xFCA311, shininess: 50 });

        // --- Scene Objects ---
        
        // 1. Plates
        const plateGeo = new THREE.BoxGeometry(config.plateWidth, config.plateThickness, config.plateDepth);
        
        const bottomPlate = new THREE.Mesh(plateGeo, matPlate);
        bottomPlate.position.y = -config.plateThickness / 2; // Top surface at y=0
        scene.add(bottomPlate);

        const topPlate = new THREE.Mesh(plateGeo, matPlate);
        scene.add(topPlate);

        // Grid helper on bottom plate for perspective
        const gridHelper = new THREE.GridHelper(config.plateWidth, 20, 0xffffff, 0xffffff);
        gridHelper.position.y = 0.01;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        // 2. Fluid Layers
        const fluidLayers = [];
        const numLayers = 10;
        const planeGeo = new THREE.PlaneGeometry(config.plateWidth, config.plateDepth);
        for(let i=1; i<numLayers; i++) {
            const plane = new THREE.Mesh(planeGeo, matFluid);
            plane.rotation.x = -Math.PI / 2;
            scene.add(plane);
            fluidLayers.push(plane);
        }

        // 3. Velocity Arrows
        const arrows = [];
        const arrowDir = new THREE.Vector3(1, 0, 0);
        const arrowColor = 0x06D6A0;
        for(let i=0; i<=10; i++) {
            const arrow = new THREE.ArrowHelper(arrowDir, new THREE.Vector3(0,0,0), 1, arrowColor, 0.3, 0.2);
            // Position arrows slightly forward in Z to avoid clipping with dye line
            arrow.position.z = 2; 
            scene.add(arrow);
            arrows.push(arrow);
        }

        // 4. Tracer Particles
        let particles = [];
        const particleGeo = new THREE.SphereGeometry(0.1, 16, 16);
        
        function initParticles() {
            // Remove old particles
            particles.forEach(p => scene.remove(p));
            particles = [];

            for(let i=0; i<state.particleCount; i++) {
                const mesh = new THREE.Mesh(particleGeo, matParticle);
                // Random position within fluid volume
                mesh.position.x = (Math.random() - 0.5) * config.plateWidth;
                mesh.position.y = Math.random() * state.separation;
                mesh.position.z = (Math.random() - 0.5) * config.plateDepth;
                
                // Store normalized height (0 to 1) to easily adjust when separation changes
                mesh.userData.normY = mesh.position.y / state.separation;
                
                scene.add(mesh);
                particles.push(mesh);
            }
        }

        // 5. Deformation Grid (Dye Line)
        const dyeParticles = [];
        const numDye = 20;
        for(let i=0; i<=numDye; i++) {
            const mesh = new THREE.Mesh(particleGeo, matDye);
            mesh.userData.normY = i / numDye;
            mesh.position.z = 0;
            scene.add(mesh);
            dyeParticles.push(mesh);
        }
        let dyeTime = 0;

        // --- Physics & Update Logic ---

        function calculatePhysics() {
            // dv/dy = F / (eta * A)
            state.shearRate = state.force / (state.viscosity * config.area);
            // v_top = (dv/dy) * L
            state.vTop = state.shearRate * state.separation;

            // Update UI Stats
            displays.shear.innerText = state.shearRate.toFixed(2) + " s⁻¹";
            displays.vtop.innerText = state.vTop.toFixed(2) + " m/s";
        }

        function updateSceneGeometry() {
            // Update Top Plate
            topPlate.position.y = state.separation + config.plateThickness / 2;

            // Update Fluid Layers
            fluidLayers.forEach((layer, index) => {
                const fraction = (index + 1) / numLayers;
                layer.position.y = state.separation * fraction;
            });

            // Update Arrows Base Positions
            arrows.forEach((arrow, index) => {
                const fraction = index / 10;
                const yPos = state.separation * fraction;
                arrow.position.y = yPos;
                
                // Length = velocity at this height * scale
                const v = state.shearRate * yPos;
                // Avoid 0 length error in Three.js ArrowHelper
                const length = Math.max(v * config.arrowScale, 0.001); 
                arrow.setLength(length, length * 0.2, length * 0.2);
            });

            // Update Particle Heights based on their normalized Y
            particles.forEach(p => {
                p.position.y = p.userData.normY * state.separation;
            });

            // Update Dye Heights
            dyeParticles.forEach(p => {
                p.position.y = p.userData.normY * state.separation;
            });
        }

        // --- Event Listeners ---

        function handleInput() {
            state.viscosity = parseFloat(inputs.viscosity.value);
            state.force = parseFloat(inputs.force.value);
            state.separation = parseFloat(inputs.separation.value);
            
            const newParticleCount = parseInt(inputs.particles.value);

            // Update UI labels
            displays.viscosity.innerText = state.viscosity.toFixed(1) + " Pa·s";
            displays.force.innerText = state.force.toFixed(1) + " N";
            displays.separation.innerText = state.separation.toFixed(1) + " m";
            displays.particles.innerText = newParticleCount;

            if(newParticleCount !== state.particleCount) {
                state.particleCount = newParticleCount;
                initParticles();
            }

            calculatePhysics();
            updateSceneGeometry();
        }

        Object.values(inputs).forEach(input => {
            input.addEventListener('input', handleInput);
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            const dt = clock.getDelta();
            controls.update();

            // 1. Move Tracer Particles
            particles.forEach(p => {
                // v(y) = shearRate * y
                const velocity = state.shearRate * p.position.y * config.visualSpeedScale;
                p.position.x += velocity * dt;

                // Wrap around logic
                const halfWidth = config.plateWidth / 2;
                if (p.position.x > halfWidth) {
                    p.position.x = -halfWidth;
                }
            });

            // 2. Animate Dye Line (Deformation)
            dyeTime += dt * config.visualSpeedScale;
            // Reset dye line when it stretches too far
            if (dyeTime * state.vTop > config.plateWidth * 0.8) {
                dyeTime = 0;
            }

            dyeParticles.forEach(p => {
                const velocity = state.shearRate * p.position.y;
                p.position.x = velocity * dyeTime; // Displacement = v * t
            });

            // 3. Animate Fluid Layers (Subtle texture shift effect via position)
            fluidLayers.forEach((layer) => {
                const velocity = state.shearRate * layer.position.y * config.visualSpeedScale;
                layer.position.x += velocity * dt;
                // Wrap planes slightly to create continuous flow illusion
                if(layer.position.x > 2) layer.position.x -= 2; 
            });

            renderer.render(scene, camera);
        }

        // Initialize
        initParticles();
        handleInput(); // Sets initial physics and geometry
        animate();

    </script>
</body>
</html>
