<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Ketose to Disaccharide: The Journey of Fructose</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #222; text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #666; text-anchor: middle; }
        .label { font-size: 14px; font-weight: 600; fill: #404040; text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 12px; fill: #666; }
        .atom { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; dominant-baseline: middle; }
        .atom-sm { font-size: 10px; }
        .numbering { font-family: 'Roboto Mono', monospace; font-size: 10px; fill: #aaa; }

        /* Colors */
        .c-atom { fill: #404040; }
        .o-atom { fill: #FF4444; }
        .h-atom { fill: #CCCCCC; }
        .bond { stroke: #333333; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .bond-thick { stroke: #333333; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
        .bond-double { stroke: #555555; stroke-width: 2; }
        
        /* Animations */
        .fischer {
            animation: fischer-anim 15s infinite ease-in-out;
        }
        .attack-arrow {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: arrow-anim 15s infinite ease-in-out;
        }
        .furanose {
            animation: furanose-anim 15s infinite ease-in-out;
        }
        .glucose {
            animation: glucose-anim 15s infinite ease-in-out;
        }
        .leaving-oh {
            animation: leaving-oh-anim 15s infinite ease-in-out;
        }
        .water-molecule {
            animation: water-anim 15s infinite ease-in-out;
        }
        .glycosidic-bond {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: bond-anim 15s infinite ease-in-out;
        }
        .sucrose-label {
            animation: sucrose-label-anim 15s infinite ease-in-out;
        }
        .pulse-circle {
            animation: pulse-anim 15s infinite ease-in-out;
            transform-origin: center;
        }
        .highlight-ring {
            animation: highlight-anim 15s infinite ease-in-out;
            transform-origin: center;
        }

        /* Keyframes */
        @keyframes fischer-anim {
            0%, 20% { opacity: 1; transform: scale(1) translateY(0); }
            25%, 100% { opacity: 0; transform: scale(0.9) translateY(-20px); }
        }

        @keyframes pulse-anim {
            0%, 5% { opacity: 0; transform: scale(0.5); }
            10%, 15% { opacity: 0.3; transform: scale(1.5); }
            20%, 100% { opacity: 0; transform: scale(1); }
        }

        @keyframes arrow-anim {
            0%, 15% { opacity: 0; stroke-dashoffset: 400; }
            20%, 23% { opacity: 1; stroke-dashoffset: 0; }
            25%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        @keyframes furanose-anim {
            0%, 20% { opacity: 0; transform: translate(500px, 320px) scale(0.8); }
            25%, 35% { opacity: 1; transform: translate(500px, 320px) scale(1); }
            45%, 95% { opacity: 1; transform: translate(640px, 320px) scale(1); }
            100% { opacity: 0; transform: translate(640px, 320px) scale(1); }
        }

        @keyframes glucose-anim {
            0%, 35% { opacity: 0; transform: translate(150px, 320px); }
            45%, 95% { opacity: 1; transform: translate(360px, 320px); }
            100% { opacity: 0; transform: translate(360px, 320px); }
        }

        @keyframes highlight-anim {
            0%, 48% { opacity: 0; transform: scale(0.5); }
            52%, 58% { opacity: 1; transform: scale(1); }
            62%, 100% { opacity: 0; transform: scale(1.2); }
        }

        @keyframes leaving-oh-anim {
            0%, 58% { opacity: 1; }
            62%, 100% { opacity: 0; }
        }

        @keyframes water-anim {
            0%, 58% { opacity: 0; transform: translate(500px, 380px) scale(0.8); }
            62% { opacity: 1; transform: translate(500px, 380px) scale(1); }
            75%, 100% { opacity: 0; transform: translate(500px, 200px) scale(1.2); }
        }

        @keyframes bond-anim {
            0%, 60% { opacity: 0; stroke-dashoffset: 200; }
            65%, 95% { opacity: 1; stroke-dashoffset: 0; }
            100% { opacity: 0; }
        }

        @keyframes sucrose-label-anim {
            0%, 70% { opacity: 0; transform: translateY(10px); }
            75%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Background Grid Pattern -->
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f0f0f0" stroke-width="1"/>
            </pattern>

            <!-- Arrowhead for Mechanism -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>

            <!-- Drop Shadow for Haworth Rings -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Header -->
        <text x="500" y="40" class="title">Monosaccharides: Cyclization & Glycosidic Linkage</text>
        <text x="500" y="65" class="subtitle">The structural transition of D-Fructose and formation of Sucrose</text>

        <!-- Legend -->
        <g transform="translate(30, 530)">
            <rect x="0" y="0" width="180" height="50" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <circle cx="20" cy="15" r="6" fill="#404040"/> <text x="35" y="19" class="formula" font-size="11">Carbon</text>
            <circle cx="95" cy="15" r="6" fill="#FF4444"/> <text x="110" y="19" class="formula" font-size="11">Oxygen</text>
            <circle cx="20" cy="35" r="6" fill="#CCCCCC"/> <text x="35" y="39" class="formula" font-size="11">Hydrogen</text>
            <line x1="90" y1="35" x2="105" y2="35" stroke="#7209B7" stroke-width="3"/> <text x="110" y="39" class="formula" font-size="11">Glycosidic</text>
        </g>

        <!-- ========================================== -->
        <!-- PHASE 1 & 2: FISCHER PROJECTION & MECHANISM -->
        <!-- ========================================== -->
        <g class="fischer">
            <!-- Backbone -->
            <line x1="500" y1="140" x2="500" y2="390" class="bond"/>
            
            <!-- Pulse Effects for Mechanism -->
            <circle cx="500" cy="190" r="20" fill="#F77F00" class="pulse-circle" style="transform-origin: 500px 190px;"/>
            <circle cx="540" cy="340" r="20" fill="#F77F00" class="pulse-circle" style="transform-origin: 540px 340px;"/>

            <!-- C1 -->
            <text x="500" y="120" text-anchor="middle" class="atom c-atom">CH<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">OH</tspan></text>
            <text x="480" y="140" class="numbering">1</text>

            <!-- C2 (Ketone) -->
            <line x1="500" y1="186" x2="540" y2="186" class="bond-double"/>
            <line x1="500" y1="194" x2="540" y2="194" class="bond-double"/>
            <text x="550" y="190" class="atom o-atom">O</text>
            <text x="480" y="190" class="numbering">2</text>

            <!-- C3 -->
            <line x1="460" y1="240" x2="540" y2="240" class="bond"/>
            <text x="450" y="240" text-anchor="end" class="atom o-atom">HO</text>
            <text x="550" y="240" class="atom h-atom">H</text>
            <text x="480" y="240" class="numbering">3</text>

            <!-- C4 -->
            <line x1="460" y1="290" x2="540" y2="290" class="bond"/>
            <text x="450" y="290" text-anchor="end" class="atom h-atom">H</text>
            <text x="550" y="290" class="atom o-atom">OH</text>
            <text x="480" y="290" class="numbering">4</text>

            <!-- C5 -->
            <line x1="460" y1="340" x2="540" y2="340" class="bond"/>
            <text x="450" y="340" text-anchor="end" class="atom h-atom">H</text>
            <text x="550" y="340" class="atom o-atom">OH</text>
            <text x="480" y="340" class="numbering">5</text>

            <!-- C6 -->
            <text x="500" y="410" text-anchor="middle" class="atom c-atom">CH<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">OH</tspan></text>
            <text x="480" y="390" class="numbering">6</text>

            <text x="500" y="460" class="label">D-Fructose (Open Chain)</text>
            <text x="500" y="480" class="formula">C<tspan dy="3" font-size="9">6</tspan><tspan dy="-3">H</tspan><tspan dy="3" font-size="9">12</tspan><tspan dy="-3">O</tspan><tspan dy="3" font-size="9">6</tspan></text>
        </g>

        <!-- Nucleophilic Attack Arrow -->
        <path d="M 565,340 C 640,340 640,190 570,190" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="attack-arrow"/>


        <!-- ========================================== -->
        <!-- PHASE 3-5: HAWORTH RINGS & CONDENSATION    -->
        <!-- ========================================== -->

        <!-- GLUCOSE (Enters from Left) -->
        <g class="glucose">
            <g filter="url(#shadow)">
                <!-- Ring Bonds (Back/Thin) -->
                <polyline points="-40,10 -20,-30 10,-30 40,10" fill="none" class="bond"/>
                <!-- Ring Bonds (Front/Thick) -->
                <polyline points="40,10 20,50 -20,50 -40,10" fill="none" class="bond-thick"/>
                <!-- Ring Oxygen -->
                <circle cx="10" cy="-30" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
                <text x="10" y="-30" text-anchor="middle" class="atom o-atom">O</text>

                <!-- Substituents -->
                <!-- C1 (Anomeric, Right) -->
                <line x1="40" y1="10" x2="40" y2="-15" class="bond"/>
                <line x1="40" y1="10" x2="40" y2="40" class="bond"/>
                <text x="40" y="-25" text-anchor="middle" class="atom h-atom">H</text>
                <text x="40" y="50" text-anchor="middle" class="atom o-atom leaving-oh">OH</text>
                <text x="55" y="5" class="numbering">1</text>

                <!-- C2 -->
                <line x1="20" y1="50" x2="20" y2="25" class="bond"/>
                <line x1="20" y1="50" x2="20" y2="80" class="bond"/>
                <text x="20" y="15" text-anchor="middle" class="atom h-atom">H</text>
                <text x="20" y="90" text-anchor="middle" class="atom o-atom">OH</text>
                <text x="35" y="65" class="numbering">2</text>

                <!-- C3 -->
                <line x1="-20" y1="50" x2="-20" y2="25" class="bond"/>
                <line x1="-20" y1="50" x2="-20" y2="80" class="bond"/>
                <text x="-20" y="15" text-anchor="middle" class="atom o-atom">OH</text>
                <text x="-20" y="90" text-anchor="middle" class="atom h-atom">H</text>
                <text x="-35" y="65" class="numbering">3</text>

                <!-- C4 -->
                <line x1="-40" y1="10" x2="-40" y2="-15" class="bond"/>
                <line x1="-40" y1="10" x2="-40" y2="40" class="bond"/>
                <text x="-40" y="-25" text-anchor="middle" class="atom h-atom">H</text>
                <text x="-40" y="50" text-anchor="middle" class="atom o-atom">HO</text>
                <text x="-55" y="5" class="numbering">4</text>

                <!-- C5 & C6 -->
                <line x1="-20" y1="-30" x2="-20" y2="-65" class="bond"/>
                <line x1="-20" y1="-30" x2="-20" y2="-5" class="bond"/>
                <text x="-20" y="-75" text-anchor="middle" class="atom c-atom">CH<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">OH</tspan></text>
                <text x="-20" y="5" text-anchor="middle" class="atom h-atom">H</text>
                <text x="-35" y="-40" class="numbering">5</text>
                <text x="-45" y="-75" class="numbering">6</text>
            </g>
            <text x="0" y="140" class="label">α-D-Glucopyranose</text>
        </g>


        <!-- FRUCTOSE (Morphs from Fischer, shifts right) -->
        <g class="furanose">
            <g filter="url(#shadow)">
                <!-- Ring Bonds (Back/Thin) -->
                <polyline points="-40,0 0,-30 40,0" fill="none" class="bond"/>
                <!-- Ring Bonds (Front/Thick) -->
                <polyline points="-40,0 -25,40 25,40 40,0" fill="none" class="bond-thick"/>
                <!-- Ring Oxygen -->
                <circle cx="0" cy="-30" r="12" fill="#ffffff" stroke="#333" stroke-width="2"/>
                <text x="0" y="-30" text-anchor="middle" class="atom o-atom">O</text>

                <!-- Substituents -->
                <!-- C2 (Anomeric, Left) -->
                <line x1="-40" y1="0" x2="-40" y2="-35" class="bond"/>
                <line x1="-40" y1="0" x2="-40" y2="35" class="bond"/>
                <text x="-40" y="-45" text-anchor="middle" class="atom c-atom">HOH<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">C</tspan></text>
                <text x="-40" y="45" text-anchor="middle" class="atom o-atom leaving-oh">HO</text>
                <text x="-55" y="-5" class="numbering">2</text>
                <text x="-65" y="-45" class="numbering">1</text>

                <!-- C3 -->
                <line x1="-25" y1="40" x2="-25" y2="15" class="bond"/>
                <line x1="-25" y1="40" x2="-25" y2="70" class="bond"/>
                <text x="-25" y="5" text-anchor="middle" class="atom o-atom">OH</text>
                <text x="-25" y="80" text-anchor="middle" class="atom h-atom">H</text>
                <text x="-40" y="55" class="numbering">3</text>

                <!-- C4 -->
                <line x1="25" y1="40" x2="25" y2="15" class="bond"/>
                <line x1="25" y1="40" x2="25" y2="70" class="bond"/>
                <text x="25" y="80" text-anchor="middle" class="atom o-atom">OH</text>
                <text x="25" y="5" text-anchor="middle" class="atom h-atom">H</text>
                <text x="40" y="55" class="numbering">4</text>

                <!-- C5 & C6 -->
                <line x1="40" y1="0" x2="40" y2="-35" class="bond"/>
                <line x1="40" y1="0" x2="40" y2="30" class="bond"/>
                <text x="40" y="-45" text-anchor="middle" class="atom c-atom">CH<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">OH</tspan></text>
                <text x="40" y="40" text-anchor="middle" class="atom h-atom">H</text>
                <text x="55" y="-5" class="numbering">5</text>
                <text x="65" y="-45" class="numbering">6</text>
            </g>
            <text x="0" y="140" class="label">α-D-Fructofuranose</text>
        </g>

        <!-- Condensation Highlights -->
        <circle cx="400" cy="370" r="25" fill="none" stroke="#7209B7" stroke-width="3" stroke-dasharray="5,5" class="highlight-ring" style="transform-origin: 400px 370px;"/>
        <circle cx="600" cy="365" r="25" fill="none" stroke="#7209B7" stroke-width="3" stroke-dasharray="5,5" class="highlight-ring" style="transform-origin: 600px 365px;"/>

        <!-- Leaving Water Molecule -->
        <g class="water-molecule">
            <circle cx="0" cy="0" r="18" fill="#e3f2fd" stroke="#4444FF" stroke-width="2"/>
            <text x="0" y="0" text-anchor="middle" class="atom o-atom" fill="#4444FF">H<tspan class="atom-sm" dy="4">2</tspan><tspan dy="-4">O</tspan></text>
        </g>

        <!-- Glycosidic Bond Formation -->
        <g class="glycosidic-bond">
            <!-- V-shaped bond -->
            <path d="M 400,360 L 500,410 L 600,355" fill="none" stroke="#7209B7" stroke-width="4" stroke-linejoin="round"/>
            <!-- Bridging Oxygen -->
            <circle cx="500" cy="410" r="14" fill="#ffffff" stroke="#7209B7" stroke-width="3"/>
            <text x="500" y="410" text-anchor="middle" class="atom o-atom">O</text>
        </g>

        <!-- Final Sucrose Label -->
        <g class="sucrose-label">
            <text x="500" y="500" class="title" fill="#7209B7">Sucrose</text>
            <text x="500" y="520" class="formula">C<tspan dy="3" font-size="9">12</tspan><tspan dy="-3">H</tspan><tspan dy="3" font-size="9">22</tspan><tspan dy="-3">O</tspan><tspan dy="3" font-size="9">11</tspan></text>
            
            <!-- Annotation Arrow -->
            <path d="M 500,470 L 500,435" fill="none" stroke="#7209B7" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="500" y="485" class="subtitle" fill="#7209B7">Glycosidic Bond (α-1,2-linkage)</text>
        </g>

    </svg>

</body>
</html>
