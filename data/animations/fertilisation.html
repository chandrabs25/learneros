<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Fertilisation in Angiosperms</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            padding-top: 20px;
        }

        .header h1 {
            color: #2C3E50;
            font-size: 24px;
            margin: 0 0 5px 0;
            font-weight: 700;
        }

        .header p {
            color: #555;
            font-size: 14px;
            margin: 0;
            max-width: 600px;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Scientific Notation Font */
        .sci-mono {
            font-family: 'Roboto Mono', monospace;
            font-size: 0.85em;
        }

        .italic {
            font-style: italic;
        }

        /* Animations (12s Loop) */
        
        /* Phase 1: Pollen Tube Growth (Macro) */
        #macro-tube {
            stroke-dasharray: 350;
            stroke-dashoffset: 350;
            animation: growMacro 12s infinite linear;
        }
        @keyframes growMacro {
            0% { stroke-dashoffset: 350; opacity: 1; }
            25%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Phase 2: Pollen Tube Entry (Micro) */
        #micro-tube {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: growMicro 12s infinite linear;
        }
        @keyframes growMicro {
            0%, 20% { stroke-dashoffset: 200; opacity: 1; }
            41.6%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Phase 2 & 3: Male Gametes Movement */
        #gamete1 {
            animation: moveGamete1 12s infinite linear;
        }
        @keyframes moveGamete1 {
            0%, 25% { transform: translate(420px, 450px); opacity: 0; }
            26% { opacity: 1; }
            33% { transform: translate(500px, 440px); }
            38% { transform: translate(540px, 420px); }
            41.6% { transform: translate(550px, 380px); }
            50% { transform: translate(550px, 360px); }
            58.3% { transform: translate(550px, 340px); opacity: 1; }
            60%, 100% { transform: translate(550px, 340px); opacity: 0; }
        }

        #gamete2 {
            animation: moveGamete2 12s infinite linear;
        }
        @keyframes moveGamete2 {
            0%, 28% { transform: translate(420px, 450px); opacity: 0; }
            29% { opacity: 1; }
            36% { transform: translate(500px, 440px); }
            41% { transform: translate(540px, 420px); }
            44.6% { transform: translate(550px, 380px); }
            50% { transform: translate(550px, 310px); }
            58.3% { transform: translate(550px, 240px); opacity: 1; }
            60%, 100% { transform: translate(550px, 240px); opacity: 0; }
        }

        /* Phase 4: Double Fertilisation Pulses */
        #egg-nucleus {
            transform-origin: 550px 340px;
            animation: eggPulse 12s infinite ease-in-out;
        }
        @keyframes eggPulse {
            0%, 58% { transform: scale(1); fill: #2C3E50; }
            65%, 90% { transform: scale(1.5); fill: #8E44AD; }
            95%, 100% { transform: scale(1); fill: #2C3E50; opacity: 0; }
        }

        #polar-nuclei {
            transform-origin: 550px 240px;
            animation: polarFade 12s infinite ease-in-out;
        }
        @keyframes polarFade {
            0%, 58% { opacity: 1; transform: scale(1); }
            65%, 100% { opacity: 0; transform: scale(1.2); }
        }

        #pen-nucleus {
            transform-origin: 550px 240px;
            animation: penPulse 12s infinite ease-in-out;
        }
        @keyframes penPulse {
            0%, 58% { opacity: 0; transform: scale(0.5); }
            65%, 90% { opacity: 1; transform: scale(1.5); fill: #E74C3C; }
            95%, 100% { opacity: 0; transform: scale(1); }
        }

        /* Dynamic Labels Animations */
        #lbl-macro-tube { animation: showMacroTube 12s infinite linear; }
        @keyframes showMacroTube {
            0%, 10% { opacity: 0; }
            15%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        #lbl-gametes-travel { animation: showTravel 12s infinite linear; }
        @keyframes showTravel {
            0%, 25% { opacity: 0; }
            30%, 55% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }

        #lbl-syngamy { animation: showSyngamy 12s infinite linear; }
        @keyframes showSyngamy {
            0%, 45% { opacity: 0; }
            50%, 62% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }

        #lbl-zygote { animation: showZygote 12s infinite linear; }
        @keyframes showZygote {
            0%, 62% { opacity: 0; }
            65%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        #lbl-triple { animation: showTriple 12s infinite linear; }
        @keyframes showTriple {
            0%, 45% { opacity: 0; }
            50%, 62% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }

        #lbl-pen { animation: showPen 12s infinite linear; }
        @keyframes showPen {
            0%, 62% { opacity: 0; }
            65%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* Reset Fade for entire inner contents */
        #reset-group {
            animation: resetFade 12s infinite linear;
        }
        @keyframes resetFade {
            0%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Double Fertilisation in Angiosperms</h1>
        <p>Observe the pollen tube delivering two male gametes into the embryo sac. One fuses with the egg cell (Syngamy), and the other fuses with the polar nuclei (Triple Fusion).</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" aria-labelledby="svg-title svg-desc" role="img">
            <title id="svg-title">Animated Diagram of Double Fertilisation</title>
            <desc id="svg-desc">This animation shows the growth of the pollen tube, entry into the embryo sac, and the two fertilisation events: syngamy forming the diploid zygote and triple fusion forming the triploid primary endosperm nucleus.</desc>
            
            <defs>
                <!-- Filters & Gradients -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.15" />
                </filter>
                
                <linearGradient id="pistilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#2ECC71" />
                    <stop offset="50%" stop-color="#A9DFBF" />
                    <stop offset="100%" stop-color="#2ECC71" />
                </linearGradient>

                <radialGradient id="eggGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="70%" stop-color="#4A90D9" />
                    <stop offset="100%" stop-color="#2980B9" />
                </radialGradient>

                <radialGradient id="centralGrad" cx="50%" cy="50%" r="50%">
                    <stop offset="80%" stop-color="#E8F4FD" />
                    <stop offset="100%" stop-color="#D6EAF8" />
                </radialGradient>
            </defs>

            <!-- ================= BACKGROUND & CONNECTORS ================= -->
            <rect width="800" height="500" fill="#ffffff" />
            
            <!-- Zoom Cone Connector Lines -->
            <polygon points="170,320 370,70 370,430 170,400" fill="#BDC3C7" opacity="0.15" />
            <path d="M 170 320 L 370 70" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6 6" fill="none" />
            <path d="M 170 400 L 370 430" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6 6" fill="none" />

            <!-- ================= MACRO VIEW (LEFT: PISTIL) ================= -->
            <g id="macro-view">
                <!-- Ovary Background -->
                <circle cx="150" cy="360" r="45" fill="#2ECC71" opacity="0.3" />
                
                <!-- Pistil Outline (Stigma, Style, Ovary) -->
                <path d="M 130 80 C 130 60, 170 60, 170 80 C 170 100, 160 110, 160 150 L 160 280 C 120 300, 100 350, 110 390 C 120 430, 180 430, 190 390 C 200 350, 180 300, 140 280 L 140 150 C 140 110, 130 100, 130 80 Z" fill="url(#pistilGrad)" stroke="#27AE60" stroke-width="2" />
                
                <!-- Ovule -->
                <ellipse cx="150" cy="360" rx="25" ry="35" fill="#E8F4FD" stroke="#2C3E50" stroke-dasharray="3 3" stroke-width="1.5" />
                
                <!-- Pollen Grains on Stigma -->
                <circle cx="135" cy="72" r="4" fill="#F1C40F" />
                <circle cx="165" cy="75" r="4" fill="#F1C40F" />
                <circle cx="150" cy="70" r="5" fill="#E67E22" /> <!-- Germinating Grain -->

                <!-- Pollen Tube (Macro) -->
                <path id="macro-tube" d="M 150 75 Q 150 150 150 280 Q 150 350 120 360 Q 110 370 150 395" fill="none" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" />
                
                <!-- Dynamic Label for Macro Tube -->
                <text id="lbl-macro-tube" x="175" y="240" font-size="13" fill="#D4AC0D" font-weight="600">Pollen Tube</text>

                <!-- Static Labels for Macro View -->
                <text x="75" y="85" font-size="12" fill="#2C3E50" font-weight="600">Stigma</text>
                <path d="M 115 80 L 125 80" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="85" y="200" font-size="12" fill="#2C3E50" font-weight="600">Style</text>
                <path d="M 115 195 L 135 195" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="75" y="365" font-size="12" fill="#2C3E50" font-weight="600">Ovary</text>
                <path d="M 115 360 L 125 360" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="150" y="470" font-size="15" fill="#2C3E50" font-weight="700" text-anchor="middle">Carpel <tspan font-weight="400" font-size="13">(Macro View)</tspan></text>
            </g>

            <!-- ================= MICRO VIEW (RIGHT: EMBRYO SAC) ================= -->
            <g id="micro-view">
                <!-- Zoom Window Background -->
                <circle cx="550" cy="250" r="180" fill="#ffffff" stroke="#2C3E50" stroke-width="3" filter="url(#shadow)" />
                
                <g id="reset-group">
                    <!-- Embryo Sac Boundary -->
                    <ellipse cx="550" cy="250" rx="110" ry="150" fill="url(#centralGrad)" stroke="#2C3E50" stroke-dasharray="6 6" stroke-width="2" />
                    
                    <!-- Antipodal Cells (Chalazal End - Top) -->
                    <g id="antipodals">
                        <circle cx="515" cy="130" r="22" fill="#F39C12" stroke="#E67E22" stroke-width="2" />
                        <circle cx="550" cy="120" r="22" fill="#F39C12" stroke="#E67E22" stroke-width="2" />
                        <circle cx="585" cy="130" r="22" fill="#F39C12" stroke="#E67E22" stroke-width="2" />
                        <!-- Nuclei -->
                        <circle cx="515" cy="130" r="5" fill="#2C3E50" />
                        <circle cx="550" cy="120" r="5" fill="#2C3E50" />
                        <circle cx="585" cy="130" r="5" fill="#2C3E50" />
                    </g>

                    <!-- Central Cell / Polar Nuclei -->
                    <g id="polar-nuclei">
                        <circle cx="535" cy="240" r="16" fill="#FFA07A" stroke="#E74C3C" stroke-width="2" opacity="0.8" />
                        <circle cx="565" cy="240" r="16" fill="#FFA07A" stroke="#E74C3C" stroke-width="2" opacity="0.8" />
                        <circle cx="535" cy="240" r="5" fill="#2C3E50" />
                        <circle cx="565" cy="240" r="5" fill="#2C3E50" />
                    </g>
                    <!-- Post-Fusion PEN Nucleus (Hidden Initially) -->
                    <circle id="pen-nucleus" cx="550" cy="240" r="12" fill="#E74C3C" />

                    <!-- Synergids (Micropylar End - Bottom) -->
                    <g id="synergids">
                        <!-- Left Synergid -->
                        <path d="M 545 350 C 505 350, 475 380, 495 400 C 515 420, 545 400, 545 350 Z" fill="#98D8C8" stroke="#16A085" stroke-width="2" />
                        <!-- Right Synergid -->
                        <path d="M 555 350 C 595 350, 625 380, 605 400 C 585 420, 555 400, 555 350 Z" fill="#98D8C8" stroke="#16A085" stroke-width="2" />
                        <!-- Synergid Nuclei -->
                        <circle cx="515" cy="375" r="5" fill="#2C3E50" />
                        <circle cx="585" cy="375" r="5" fill="#2C3E50" />
                        <!-- Filiform Apparatus (Wavy lines at base) -->
                        <path d="M 505 405 Q 515 395 525 405 T 540 400" stroke="#16A085" stroke-width="2" fill="none" />
                        <path d="M 595 405 Q 585 395 575 405 T 560 400" stroke="#16A085" stroke-width="2" fill="none" />
                    </g>

                    <!-- Egg Cell -->
                    <g id="egg-cell">
                        <ellipse cx="550" cy="340" rx="28" ry="32" fill="url(#eggGrad)" stroke="#2980B9" stroke-width="2" />
                        <!-- Egg Nucleus -->
                        <circle id="egg-nucleus" cx="550" cy="340" r="7" fill="#2C3E50" />
                    </g>

                    <!-- Pollen Tube Entry (Micro) -->
                    <path id="micro-tube" d="M 420 450 Q 500 450 540 420 Q 550 410 550 380" fill="none" stroke="#F1C40F" stroke-width="14" stroke-linecap="round" />

                    <!-- Male Gametes (Animated) -->
                    <circle id="gamete1" cx="0" cy="0" r="7" fill="#E67E22" stroke="#D35400" stroke-width="1" />
                    <circle id="gamete2" cx="0" cy="0" r="7" fill="#E67E22" stroke="#D35400" stroke-width="1" />
                </g>

                <!-- Static Labels for Micro View -->
                <text x="680" y="125" font-size="13" fill="#2C3E50" font-weight="600">Antipodal Cells</text>
                <path d="M 675 120 L 610 125" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="680" y="245" font-size="13" fill="#2C3E50" font-weight="600">Polar Nuclei</text>
                <path d="M 675 240 L 585 240" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="680" y="345" font-size="13" fill="#2C3E50" font-weight="600">Egg Cell</text>
                <path d="M 675 340 L 582 340" stroke="#7F8C8D" stroke-width="1" />
                
                <text x="680" y="385" font-size="13" fill="#2C3E50" font-weight="600">Synergids</text>
                <path d="M 675 380 L 610 375" stroke="#7F8C8D" stroke-width="1" />

                <text x="550" y="455" font-size="13" fill="#2C3E50" font-weight="600" text-anchor="middle" class="italic">Micropyle</text>

                <text x="550" y="470" font-size="15" fill="#2C3E50" font-weight="700" text-anchor="middle">Embryo Sac <tspan font-weight="400" font-size="13">(Micro View)</tspan></text>

                <!-- Dynamic Labels (Micro View) -->
                <text id="lbl-gametes-travel" x="430" y="475" font-size="13" fill="#D35400" font-weight="700">Male Gametes <tspan class="sci-mono">(n)</tspan></text>
                
                <!-- Syngamy / Zygote Labels -->
                <text id="lbl-syngamy" x="460" y="345" font-size="14" fill="#E74C3C" font-weight="700" text-anchor="end">Syngamy</text>
                <text id="lbl-zygote" x="460" y="345" font-size="14" fill="#8E44AD" font-weight="700" text-anchor="end">Zygote <tspan class="sci-mono">(2n)</tspan></text>
                
                <!-- Triple Fusion / PEN Labels -->
                <text id="lbl-triple" x="460" y="245" font-size="14" fill="#E74C3C" font-weight="700" text-anchor="end">Triple Fusion</text>
                <text id="lbl-pen" x="460" y="245" font-size="14" fill="#E74C3C" font-weight="700" text-anchor="end">PEN <tspan class="sci-mono">(3n)</tspan></text>
            </g>

            <!-- ================= LEGEND ================= -->
            <g id="legend" transform="translate(20, 410)">
                <rect x="0" y="0" width="160" height="75" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" />
                <text x="80" y="18" font-size="11" fill="#2C3E50" font-weight="700" text-anchor="middle">KEY</text>
                
                <circle cx="15" cy="35" r="5" fill="#E67E22" />
                <text x="28" y="39" font-size="11" fill="#2C3E50">Male Gamete <tspan class="sci-mono">(n)</tspan></text>
                
                <circle cx="15" cy="55" r="5" fill="#4A90D9" />
                <text x="28" y="59" font-size="11" fill="#2C3E50">Egg Cell <tspan class="sci-mono">(n)</tspan></text>
            </g>

        </svg>
    </div>

</body>
</html>
