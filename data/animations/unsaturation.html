<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsaturation and Resonance Stability in Benzene</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        text {
            fill: #333333;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            fill: #7209B7;
        }

        /* Master Scene Fade */
        .scene-fade {
            animation: sceneFade 12s infinite ease-in-out;
        }

        @keyframes sceneFade {
            0%, 5% { opacity: 0; }
            10%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* Cyclohexene Addition Animations */
        .br-left-top {
            animation: brLeftTop 12s infinite ease-in-out;
        }
        .br-left-bottom {
            animation: brLeftBottom 12s infinite ease-in-out;
        }
        .br-left-bond {
            animation: brLeftBond 12s infinite ease-in-out;
        }
        .pi-bond-left {
            animation: piBondLeft 12s infinite ease-in-out;
        }
        .h-swing-top {
            transform-origin: 252px 230px;
            animation: hSwingTop 12s infinite ease-in-out;
        }
        .h-swing-bottom {
            transform-origin: 252px 290px;
            animation: hSwingBottom 12s infinite ease-in-out;
        }
        .new-bond {
            animation: newBondFade 12s infinite ease-in-out;
        }

        @keyframes brLeftTop {
            0%, 25% { transform: translate(0, 0); opacity: 0; fill: #A52A2A; stroke: none; }
            26%, 30% { opacity: 1; fill: #A52A2A; stroke: none; }
            40% { transform: translate(2px, 175px); fill: #A52A2A; stroke: none; }
            45%, 90% { transform: translate(2px, 175px); fill: #f8f9fa; stroke: #A52A2A; stroke-width: 2px; }
            95%, 100% { opacity: 0; }
        }

        @keyframes brLeftBottom {
            0%, 25% { transform: translate(0, 0); opacity: 0; fill: #A52A2A; stroke: none; }
            26%, 30% { opacity: 1; fill: #A52A2A; stroke: none; }
            40% { transform: translate(2px, 245px); fill: #A52A2A; stroke: none; }
            45%, 90% { transform: translate(2px, 245px); fill: #f8f9fa; stroke: #A52A2A; stroke-width: 2px; }
            95%, 100% { opacity: 0; }
        }

        @keyframes brLeftBond {
            0%, 25% { opacity: 0; }
            26%, 35% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }

        @keyframes piBondLeft {
            0%, 10% { opacity: 0; }
            10%, 40% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }

        @keyframes hSwingTop {
            0%, 39% { transform: rotate(0deg); }
            42%, 100% { transform: rotate(50deg); }
        }

        @keyframes hSwingBottom {
            0%, 39% { transform: rotate(0deg); }
            42%, 100% { transform: rotate(-50deg); }
        }

        @keyframes newBondFade {
            0%, 39% { opacity: 0; }
            42%, 100% { opacity: 1; }
        }

        /* Benzene Resonance Animations */
        .br-right-group {
            animation: brRightGroup 12s infinite ease-in-out;
        }
        .red-x {
            transform-origin: 660px 240px;
            animation: redX 12s infinite ease-in-out;
        }
        .benzene-zoom {
            transform-origin: 600px 260px;
            animation: benzeneZoom 12s infinite ease-in-out;
        }
        .kekule-a {
            animation: kekuleA 12s infinite ease-in-out;
        }
        .kekule-b {
            animation: kekuleB 12s infinite ease-in-out;
        }
        .res-circle {
            animation: resCircle 12s infinite ease-in-out;
        }
        .curly-arrows {
            animation: curlyArrows 12s infinite ease-in-out;
        }
        .stability-text {
            animation: stabilityText 12s infinite ease-in-out;
        }
        .status-text {
            animation: statusText 12s infinite ease-in-out;
        }

        @keyframes brRightGroup {
            0%, 25% { transform: translate(0, 0); opacity: 0; }
            26%, 30% { opacity: 1; }
            40% { transform: translate(-20px, 170px); }
            50% { transform: translate(40px, 280px) rotate(45deg); opacity: 1; }
            55%, 100% { opacity: 0; }
        }

        @keyframes redX {
            0%, 39% { opacity: 0; transform: scale(0.5); }
            41% { opacity: 1; transform: scale(1.2); }
            43%, 48% { opacity: 1; transform: scale(1); }
            50%, 100% { opacity: 0; }
        }

        @keyframes benzeneZoom {
            0%, 48% { transform: scale(1); }
            52%, 88% { transform: scale(1.15); }
            92%, 100% { transform: scale(1); }
        }

        @keyframes kekuleA {
            0%, 55% { opacity: 1; }
            56%, 59% { opacity: 0; }
            60%, 63% { opacity: 1; }
            64%, 67% { opacity: 0; }
            68%, 100% { opacity: 0; }
        }

        @keyframes kekuleB {
            0%, 55% { opacity: 0; }
            56%, 59% { opacity: 1; }
            60%, 63% { opacity: 0; }
            64%, 67% { opacity: 1; }
            68%, 100% { opacity: 0; }
        }

        @keyframes resCircle {
            0%, 67% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }

        @keyframes curlyArrows {
            0%, 54% { opacity: 0; }
            55%, 67% { opacity: 1; }
            68%, 100% { opacity: 0; }
        }

        @keyframes stabilityText {
            0%, 68% { opacity: 0; transform: translateY(10px); }
            72%, 88% { opacity: 1; transform: translateY(0); }
            92%, 100% { opacity: 0; }
        }

        @keyframes statusText {
            0%, 42% { opacity: 0; transform: translateY(5px); }
            45%, 88% { opacity: 1; transform: translateY(0); }
            92%, 100% { opacity: 0; }
        }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Unsaturation in Benzene vs Cyclohexene</title>
    <desc>Animation showing why benzene, despite being unsaturated, does not react like a typical alkene due to resonance.</desc>

    <defs>
        <!-- Arrowhead for electron flow -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00" />
        </marker>
        
        <!-- Drop shadow for text -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" rx="12" />

    <!-- Title and Headers -->
    <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#333">Unsaturation: Typical Alkene vs. Benzene</text>
    
    <!-- Divider -->
    <line x1="400" y1="70" x2="400" y2="460" stroke="#e0e0e0" stroke-width="2" stroke-dasharray="8,8" />

    <!-- Legend -->
    <g transform="translate(620, 15)" font-size="11" fill="#555">
        <rect x="-10" y="-5" width="180" height="45" fill="#f8f9fa" rx="6" stroke="#eee" />
        <circle cx="0" cy="5" r="5" fill="#404040"/> <text x="10" y="9">Carbon</text>
        <circle cx="70" cy="5" r="4" fill="#CCCCCC"/> <text x="80" y="9">Hydrogen</text>
        <circle cx="0" cy="25" r="5" fill="#A52A2A"/> <text x="10" y="29">Bromine</text>
        <line x1="70" y1="25" x2="80" y2="25" stroke="#7209B7" stroke-width="3"/> <text x="85" y="29">π-bond</text>
    </g>

    <!-- ========================================== -->
    <!-- LEFT SIDE: CYCLOHEXENE (Typical Alkene)    -->
    <!-- ========================================== -->
    <g class="scene-fade">
        <!-- Labels -->
        <text x="200" y="390" text-anchor="middle" font-size="16" font-weight="600">Cyclohexene <tspan class="formula">(C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">10</tspan>)</tspan></text>
        <text x="200" y="415" text-anchor="middle" font-size="13" fill="#555">sp² carbons, localized π bond.</text>
        <text x="200" y="435" text-anchor="middle" font-size="13" fill="#555">Undergoes Addition Reaction.</text>
        
        <text x="200" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#44CC44" class="status-text">Addition Successful!</text>

        <!-- Cyclohexene Molecule -->
        <g stroke-linejoin="round" stroke-linecap="round">
            <!-- Sigma Bonds (Ring) -->
            <polygon points="200,200 252,230 252,290 200,320 148,290 148,230" fill="none" stroke="#333" stroke-width="4" />
            
            <!-- Pi Bond -->
            <line class="pi-bond-left" x1="244" y1="235" x2="244" y2="285" stroke="#7209B7" stroke-width="4" />

            <!-- New Bonds (Appear during addition) -->
            <line class="new-bond" x1="252" y1="230" x2="282" y2="215" stroke="#333" stroke-width="4" />
            <line class="new-bond" x1="252" y1="290" x2="282" y2="305" stroke="#333" stroke-width="4" />

            <!-- Explicit C-H Bonds & Atoms on sp2 Carbons -->
            <g class="h-swing-top">
                <line x1="252" y1="230" x2="282" y2="230" stroke="#333" stroke-width="3" />
                <circle cx="282" cy="230" r="5" fill="#CCCCCC" />
            </g>
            <g class="h-swing-bottom">
                <line x1="252" y1="290" x2="282" y2="290" stroke="#333" stroke-width="3" />
                <circle cx="282" cy="290" r="5" fill="#CCCCCC" />
            </g>

            <!-- Carbon Atoms -->
            <circle cx="200" cy="200" r="8" fill="#404040" />
            <circle cx="252" cy="230" r="8" fill="#404040" />
            <circle cx="252" cy="290" r="8" fill="#404040" />
            <circle cx="200" cy="320" r="8" fill="#404040" />
            <circle cx="148" cy="290" r="8" fill="#404040" />
            <circle cx="148" cy="230" r="8" fill="#404040" />
        </g>

        <!-- Bromine Molecule (Left) -->
        <g>
            <line class="br-left-bond" x1="280" y1="40" x2="280" y2="60" stroke="#333" stroke-width="3" />
            <circle class="br-left-top" cx="280" cy="40" r="9" />
            <circle class="br-left-bottom" cx="280" cy="60" r="9" />
        </g>
    </g>


    <!-- ========================================== -->
    <!-- RIGHT SIDE: BENZENE (Aromatic)             -->
    <!-- ========================================== -->
    <g class="scene-fade">
        <!-- Labels -->
        <text x="600" y="390" text-anchor="middle" font-size="16" font-weight="600">Benzene <tspan class="formula">(C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">6</tspan>)</tspan></text>
        <text x="600" y="415" text-anchor="middle" font-size="13" fill="#555">sp² carbons, delocalized π system.</text>
        <text x="600" y="435" text-anchor="middle" font-size="13" fill="#555">Resists Addition Reaction.</text>
        
        <text x="600" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#FF4444" class="status-text">Reaction Resisted!</text>
        <text x="600" y="465" text-anchor="middle" font-size="14" font-weight="700" fill="#F77F00" class="stability-text" filter="url(#shadow)">Resonance Energy provides exceptional stability.</text>

        <!-- Benzene Group (Zooms during resonance phase) -->
        <g class="benzene-zoom">
            <!-- Sigma Bonds (Ring) -->
            <polygon points="600,200 652,230 652,290 600,320 548,290 548,230" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round" />
            
            <!-- Explicit C-H Bonds & Atoms (All 6 for symmetry) -->
            <g stroke="#333" stroke-width="3">
                <line x1="600" y1="200" x2="600" y2="170" />
                <line x1="652" y1="230" x2="678" y2="215" />
                <line x1="652" y1="290" x2="678" y2="305" />
                <line x1="600" y1="320" x2="600" y2="350" />
                <line x1="548" y1="290" x2="522" y2="305" />
                <line x1="548" y1="230" x2="522" y2="215" />
            </g>
            <g fill="#CCCCCC">
                <circle cx="600" cy="170" r="5" />
                <circle cx="678" cy="215" r="5" />
                <circle cx="678" cy="305" r="5" />
                <circle cx="600" cy="350" r="5" />
                <circle cx="522" cy="305" r="5" />
                <circle cx="522" cy="215" r="5" />
            </g>

            <!-- Pi Bonds: Kekule Structure A -->
            <g class="kekule-a" stroke="#7209B7" stroke-width="4" stroke-linecap="round">
                <line x1="644" y1="235" x2="644" y2="285" />
                <line x1="596" y1="311" x2="556" y2="288" />
                <line x1="556" y1="232" x2="596" y2="209" />
            </g>

            <!-- Pi Bonds: Kekule Structure B -->
            <g class="kekule-b" stroke="#7209B7" stroke-width="4" stroke-linecap="round">
                <line x1="604" y1="209" x2="644" y2="232" />
                <line x1="644" y1="288" x2="604" y2="311" />
                <line x1="556" y1="235" x2="556" y2="285" />
            </g>

            <!-- Resonance Circle (Delocalized Cloud) -->
            <circle class="res-circle" cx="600" cy="260" r="36" fill="none" stroke="#7209B7" stroke-width="4" stroke-dasharray="8,6" />

            <!-- Curly Arrows for Electron Movement -->
            <path class="curly-arrows" d="M 648,260 Q 665,285 635,305 M 570,305 Q 535,285 540,250 M 565,215 Q 600,185 635,215" fill="none" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrow)" />

            <!-- Carbon Atoms -->
            <circle cx="600" cy="200" r="8" fill="#404040" />
            <circle cx="652" cy="230" r="8" fill="#404040" />
            <circle cx="652" cy="290" r="8" fill="#404040" />
            <circle cx="600" cy="320" r="8" fill="#404040" />
            <circle cx="548" cy="290" r="8" fill="#404040" />
            <circle cx="548" cy="230" r="8" fill="#404040" />
        </g>

        <!-- Bromine Molecule (Right) -->
        <g class="br-right-group">
            <line x1="680" y1="40" x2="680" y2="60" stroke="#333" stroke-width="3" />
            <circle cx="680" cy="40" r="9" fill="#A52A2A" />
            <circle cx="680" cy="60" r="9" fill="#A52A2A" />
        </g>

        <!-- Red 'X' for No Reaction -->
        <g class="red-x" stroke="#FF4444" stroke-width="8" stroke-linecap="round">
            <line x1="640" y1="220" x2="680" y2="260" />
            <line x1="680" y1="220" x2="640" y2="260" />
        </g>
    </g>

</svg>

</body>
</html>
