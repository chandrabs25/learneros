<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>From Ovary to Fruit: The Morphological Transformation of a Drupe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anim-duration: 12s;
            --bg-color: #f8f9fa;
            --text-main: #2C3E50;
            --text-muted: #7F8C8D;
            --plant-green: #2ECC71;
            --epicarp: #27AE60;
            --mesocarp: #F1C40F;
            --endocarp: #D35400;
            --seed-pre: #F39C12;
            --seed-post: #8B4513;
            --stigma: #A5D6A7;
            --thalamus: #95A5A6;
            --pollen-tube: #FF6B6B;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: var(--text-main); text-anchor: middle; }
        .subtitle { font-size: 14px; font-style: italic; fill: var(--text-muted); text-anchor: middle; }
        .label { font-size: 14px; font-weight: 600; fill: var(--text-main); }
        .stage-text { font-family: 'Roboto Mono', monospace; font-size: 15px; font-weight: 500; fill: var(--text-main); text-anchor: middle; }
        
        /* Lines */
        .leader-line {
            stroke: var(--text-muted);
            stroke-width: 1.5;
            stroke-dasharray: 4, 4;
            fill: none;
        }

        /* Animations */
        .pollen-tube {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: growPollen var(--anim-duration) ease-in-out infinite;
        }

        @keyframes growPollen {
            0%, 5% { stroke-dashoffset: 200; opacity: 1; }
            25% { stroke-dashoffset: 0; opacity: 1; }
            33% { opacity: 1; }
            38%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .flash {
            transform-origin: 400px 336px;
            animation: flashFert var(--anim-duration) ease-out infinite;
        }

        @keyframes flashFert {
            0%, 24% { opacity: 0; transform: scale(0.5); }
            26% { opacity: 0.9; transform: scale(1.5); }
            33%, 100% { opacity: 0; transform: scale(3); }
        }

        .fruit-complex {
            transform-origin: 400px 395px;
            animation: expandOvary var(--anim-duration) ease-in-out infinite;
        }

        @keyframes expandOvary {
            0%, 33% { transform: scale(0.4); }
            58%, 100% { transform: scale(1); }
        }

        .style-stigma {
            animation: fadeOutStyle var(--anim-duration) ease-in-out infinite;
        }

        @keyframes fadeOutStyle {
            0%, 33% { opacity: 1; }
            41%, 100% { opacity: 0; }
        }

        .mesocarp {
            animation: diffMesocarp var(--anim-duration) ease-in-out infinite;
        }

        @keyframes diffMesocarp {
            0%, 58% { opacity: 0; }
            83%, 100% { opacity: 1; }
        }

        .endocarp {
            animation: diffEndocarp var(--anim-duration) ease-in-out infinite;
        }

        @keyframes diffEndocarp {
            0%, 58% { opacity: 0; }
            83%, 100% { opacity: 1; }
        }

        .seed {
            animation: colorSeed var(--anim-duration) ease-in-out infinite;
        }

        @keyframes colorSeed {
            0%, 58% { fill: var(--seed-pre); }
            83%, 100% { fill: var(--seed-post); }
        }

        .epicarp {
            animation: colorEpicarp var(--anim-duration) ease-in-out infinite;
        }

        @keyframes colorEpicarp {
            0%, 58% { fill: var(--plant-green); }
            83%, 100% { fill: var(--epicarp); }
        }

        .initial-label {
            animation: fadeOutLabel var(--anim-duration) ease-in-out infinite;
        }

        @keyframes fadeOutLabel {
            0%, 33% { opacity: 1; }
            41%, 100% { opacity: 0; }
        }

        .final-label {
            animation: fadeInLabel var(--anim-duration) ease-in-out infinite;
        }

        @keyframes fadeInLabel {
            0%, 58% { opacity: 0; }
            83%, 100% { opacity: 1; }
        }

        .progress-bar {
            animation: progress var(--anim-duration) linear infinite;
        }

        @keyframes progress {
            0% { width: 0; }
            100% { width: 400px; }
        }

        /* Stage Text Animations */
        .stage-1 { animation: s1 var(--anim-duration) infinite; }
        .stage-2 { animation: s2 var(--anim-duration) infinite; }
        .stage-3 { animation: s3 var(--anim-duration) infinite; }
        .stage-4 { animation: s4 var(--anim-duration) infinite; }
        .stage-5 { animation: s5 var(--anim-duration) infinite; }

        @keyframes s1 { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes s2 { 0%, 24% { opacity: 0; } 25%, 33% { opacity: 1; } 34%, 100% { opacity: 0; } }
        @keyframes s3 { 0%, 33% { opacity: 0; } 34%, 58% { opacity: 1; } 59%, 100% { opacity: 0; } }
        @keyframes s4 { 0%, 58% { opacity: 0; } 59%, 83% { opacity: 1; } 84%, 100% { opacity: 0; } }
        @keyframes s5 { 0%, 83% { opacity: 0; } 84%, 100% { opacity: 1; } }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        
        <!-- Definitions -->
        <defs>
            <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.15"/>
            </filter>
            <radialGradient id="mesoGrad" cx="45%" cy="45%" r="60%">
                <stop offset="0%" stop-color="#FFC300" />
                <stop offset="100%" stop-color="#F39C12" />
            </radialGradient>
        </defs>

        <!-- Header Texts -->
        <text x="400" y="40" class="title">Morphology of a Drupe: Ovary to Fruit</text>
        <text x="400" y="65" class="subtitle">Mangifera indica (Mango) - Monocarpellary Superior Ovary</text>

        <!-- Base / Pedicel & Thalamus (Static) -->
        <g id="base-structures">
            <!-- Pedicel -->
            <path d="M 396 460 L 404 460 L 404 500 L 396 500 Z" fill="#7F8C8D" />
            <!-- Thalamus (Receptacle) -->
            <path d="M 360 385 Q 400 410 440 385 L 420 460 L 380 460 Z" fill="var(--thalamus)" />
        </g>

        <!-- Stigma & Style (Fades out) -->
        <g class="style-stigma">
            <!-- Pollen Grain -->
            <circle cx="400" cy="138" r="4" fill="#F1C40F" />
            <!-- Style and Stigma -->
            <path d="M 396 150 C 380 130, 420 130, 404 150 L 404 289 L 396 289 Z" fill="var(--stigma)" />
        </g>

        <!-- Pollen Tube (Grows then fades) -->
        <path d="M 400 142 Q 405 200 400 289 Q 395 310 400 336" 
              fill="none" stroke="var(--pollen-tube)" stroke-width="2.5" 
              class="pollen-tube" />

        <!-- Fertilization Flash -->
        <circle cx="400" cy="336" r="15" fill="#FFFFFF" filter="blur(3px)" class="flash" />

        <!-- Main Ovary / Fruit Complex (Scales up) -->
        <g class="fruit-complex" filter="url(#drop-shadow)">
            
            <!-- Epicarp (Ovary Wall -> Outer Skin) -->
            <path class="epicarp" 
                  d="M 400 130 C 490 140, 510 280, 430 370 C 410 390, 380 390, 340 360 C 270 300, 310 140, 400 130 Z" 
                  vector-effect="non-scaling-stroke" />
            
            <!-- Mesocarp (Fleshy Middle Layer - Fades in) -->
            <path class="mesocarp" 
                  d="M 400 136 C 483 146, 502 278, 425 364 C 406 382, 380 382, 344 354 C 278 298, 316 146, 400 136 Z" 
                  fill="url(#mesoGrad)" 
                  vector-effect="non-scaling-stroke" />
            
            <!-- Endocarp (Stony Inner Layer - Fades in) -->
            <path class="endocarp" 
                  d="M 400 180 C 440 185, 450 270, 415 320 C 405 335, 390 335, 370 310 C 340 270, 350 185, 400 180 Z" 
                  fill="var(--endocarp)" 
                  vector-effect="non-scaling-stroke" />
            
            <!-- Seed (Ovule -> Seed) -->
            <path class="seed" 
                  d="M 400 195 C 425 200, 430 260, 410 300 C 400 310, 390 310, 375 290 C 355 260, 365 200, 400 195 Z" 
                  vector-effect="non-scaling-stroke" />
                  
        </g>

        <!-- Initial Labels (Left Side - Fade out) -->
        <g class="initial-label">
            <!-- Stigma -->
            <polyline points="250,145 390,145" class="leader-line" />
            <text x="240" y="150" class="label" text-anchor="end">Stigma</text>
            
            <!-- Style -->
            <polyline points="250,220 396,220" class="leader-line" />
            <text x="240" y="225" class="label" text-anchor="end">Style</text>
            
            <!-- Ovary -->
            <polyline points="250,330 348,330" class="leader-line" />
            <text x="240" y="335" class="label" text-anchor="end">Ovary Wall</text>
            
            <!-- Ovule -->
            <polyline points="250,360 390,336" class="leader-line" />
            <text x="240" y="365" class="label" text-anchor="end">Ovule</text>
        </g>

        <!-- Final Labels (Right Side - Fade in) -->
        <g class="final-label">
            <!-- Epicarp -->
            <polyline points="505,200 600,200" class="leader-line" />
            <text x="610" y="205" class="label" text-anchor="start">Epicarp (Skin)</text>
            
            <!-- Mesocarp -->
            <polyline points="460,250 600,250" class="leader-line" />
            <text x="610" y="255" class="label" text-anchor="start">Mesocarp (Flesh)</text>
            
            <!-- Endocarp -->
            <polyline points="425,300 600,300" class="leader-line" />
            <text x="610" y="305" class="label" text-anchor="start">Endocarp (Stony)</text>
            
            <!-- Seed -->
            <polyline points="400,260 600,350" class="leader-line" />
            <text x="610" y="355" class="label" text-anchor="start">Seed</text>

            <!-- Pericarp Bracket -->
            <path d="M 735 195 L 745 195 L 745 310 L 735 310" fill="none" stroke="var(--text-muted)" stroke-width="2" />
            <text x="755" y="258" class="label" fill="var(--text-muted)" text-anchor="start">Pericarp</text>
        </g>

        <!-- Bottom Progress & Stage Indicators -->
        <g id="progress-section">
            <text x="400" y="455" class="stage-text stage-1">1. Pollination & Pollen Tube Growth</text>
            <text x="400" y="455" class="stage-text stage-2">2. Fertilization (Syngamy)</text>
            <text x="400" y="455" class="stage-text stage-3">3. Ovary Expansion & Style Abscission</text>
            <text x="400" y="455" class="stage-text stage-4">4. Pericarp Differentiation</text>
            <text x="400" y="455" class="stage-text stage-5">5. Mature Drupe (Ripened Fruit)</text>

            <!-- Progress Track -->
            <rect x="200" y="475" width="400" height="6" fill="#E8F4FD" rx="3" />
            <!-- Progress Fill -->
            <rect x="200" y="475" width="0" height="6" fill="#4A90D9" rx="3" class="progress-bar" />
        </g>

    </svg>
</div>

</body>
</html>
