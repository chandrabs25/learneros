<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mitosis & Arithmetic Growth</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #2C3E50;
            margin: 0 0 5px 0;
            text-align: center;
            font-size: 24px;
        }

        .subtitle {
            color: #F39C12;
            font-family: 'Roboto Mono', monospace;
            margin: 0 0 20px 0;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .main-cell {
            animation: mainCellAnim 15s infinite linear;
        }
        @keyframes mainCellAnim {
            0%, 66.5% { opacity: 1; }
            66.6%, 100% { opacity: 0; }
        }

        .cell-left {
            transform-origin: 250px 250px;
            animation: leftCellAnim 15s infinite linear;
        }
        @keyframes leftCellAnim {
            0%, 66.5% { opacity: 0; transform: translateX(0) scale(1); }
            66.6%, 86.6% { opacity: 1; transform: translateX(0) scale(1); }
            96.6%, 99.5% { opacity: 1; transform: translateX(150px) scale(1.25); }
            100% { opacity: 0; transform: translateX(150px) scale(1.25); }
        }

        .cell-right {
            animation: rightCellAnim 15s infinite linear;
        }
        @keyframes rightCellAnim {
            0%, 66.5% { opacity: 0; }
            66.6%, 86.6% { opacity: 1; }
            96.6%, 100% { opacity: 0; }
        }

        .membrane-right-circle {
            animation: rightCircleAnim 15s infinite linear;
        }
        @keyframes rightCircleAnim {
            0%, 66.6% { opacity: 1; }
            73.3%, 100% { opacity: 0; }
        }

        .membrane-right-hex {
            animation: rightHexAnim 15s infinite linear;
        }
        @keyframes rightHexAnim {
            0%, 66.6% { opacity: 0; }
            73.3%, 100% { opacity: 1; }
        }

        .main-nucleus {
            animation: mainNucleusAnim 15s infinite linear;
        }
        @keyframes mainNucleusAnim {
            0%, 10% { opacity: 1; }
            13.3%, 100% { opacity: 0; }
        }

        .main-chromatin {
            animation: mainChromatinAnim 15s infinite linear;
        }
        @keyframes mainChromatinAnim {
            0%, 3% { opacity: 1; }
            6.6%, 100% { opacity: 0; }
        }

        .left-contents {
            transform-origin: 250px 250px;
            animation: leftContentsAnim 15s infinite linear;
        }
        @keyframes leftContentsAnim {
            0%, 46.6% { opacity: 0; transform: translateX(0) scale(1); }
            53.3%, 86.6% { opacity: 1; transform: translateX(0) scale(1); }
            96.6%, 99.5% { opacity: 1; transform: translateX(150px) scale(1.25); }
            100% { opacity: 0; transform: translateX(150px) scale(1.25); }
        }

        .right-contents {
            animation: rightContentsAnim 15s infinite linear;
        }
        @keyframes rightContentsAnim {
            0%, 46.6% { opacity: 0; }
            53.3%, 86.6% { opacity: 1; }
            96.6%, 100% { opacity: 0; }
        }

        .nucleus-dash {
            animation: nucleusDashAnim 15s infinite linear;
        }
        @keyframes nucleusDashAnim {
            0%, 60% { stroke-dasharray: 6,6; }
            66.6%, 100% { stroke-dasharray: 0; }
        }

        /* Chromosomes */
        .chr1-left { animation: chr1LeftAnim 15s infinite linear; }
        @keyframes chr1LeftAnim {
            0% { transform: translate(370px, 210px) rotate(30deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(370px, 210px) rotate(30deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 160px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(250px, 160px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(250px, 160px) rotate(0deg); opacity: 0; }
        }
        .chr1-right { animation: chr1RightAnim 15s infinite linear; }
        @keyframes chr1RightAnim {
            0% { transform: translate(370px, 210px) rotate(30deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(370px, 210px) rotate(30deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 160px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(550px, 160px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(550px, 160px) rotate(0deg); opacity: 0; }
        }

        .chr2-left { animation: chr2LeftAnim 15s infinite linear; }
        @keyframes chr2LeftAnim {
            0% { transform: translate(430px, 230px) rotate(-20deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(430px, 230px) rotate(-20deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 220px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(250px, 220px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(250px, 220px) rotate(0deg); opacity: 0; }
        }
        .chr2-right { animation: chr2RightAnim 15s infinite linear; }
        @keyframes chr2RightAnim {
            0% { transform: translate(430px, 230px) rotate(-20deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(430px, 230px) rotate(-20deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 220px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(550px, 220px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(550px, 220px) rotate(0deg); opacity: 0; }
        }

        .chr3-left { animation: chr3LeftAnim 15s infinite linear; }
        @keyframes chr3LeftAnim {
            0% { transform: translate(380px, 270px) rotate(60deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(380px, 270px) rotate(60deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 280px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(250px, 280px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(250px, 280px) rotate(0deg); opacity: 0; }
        }
        .chr3-right { animation: chr3RightAnim 15s infinite linear; }
        @keyframes chr3RightAnim {
            0% { transform: translate(380px, 270px) rotate(60deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(380px, 270px) rotate(60deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 280px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(550px, 280px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(550px, 280px) rotate(0deg); opacity: 0; }
        }

        .chr4-left { animation: chr4LeftAnim 15s infinite linear; }
        @keyframes chr4LeftAnim {
            0% { transform: translate(420px, 290px) rotate(-45deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(420px, 290px) rotate(-45deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 340px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(250px, 340px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(250px, 340px) rotate(0deg); opacity: 0; }
        }
        .chr4-right { animation: chr4RightAnim 15s infinite linear; }
        @keyframes chr4RightAnim {
            0% { transform: translate(420px, 290px) rotate(-45deg); opacity: 0; }
            6.6%, 13.3% { transform: translate(420px, 290px) rotate(-45deg); opacity: 1; }
            26.6%, 40% { transform: translate(400px, 340px) rotate(0deg); opacity: 1; }
            53.3% { transform: translate(550px, 340px) rotate(0deg); opacity: 1; }
            60%, 100% { transform: translate(550px, 340px) rotate(0deg); opacity: 0; }
        }

        /* Centrioles & Spindles */
        .centriole-left { animation: centLeftAnim 15s infinite linear; }
        @keyframes centLeftAnim {
            0%, 13.3% { transform: translate(380px, 120px) rotate(0deg); opacity: 1; }
            26.6%, 60% { transform: translate(200px, 250px) rotate(-90deg); opacity: 1; }
            66.6%, 99% { opacity: 0; transform: translate(200px, 250px) rotate(-90deg); }
            100% { opacity: 0; transform: translate(380px, 120px) rotate(0deg); }
        }

        .centriole-right { animation: centRightAnim 15s infinite linear; }
        @keyframes centRightAnim {
            0%, 13.3% { transform: translate(420px, 120px) rotate(0deg); opacity: 1; }
            26.6%, 60% { transform: translate(600px, 250px) rotate(90deg); opacity: 1; }
            66.6%, 99% { opacity: 0; transform: translate(600px, 250px) rotate(90deg); }
            100% { opacity: 0; transform: translate(420px, 120px) rotate(0deg); }
        }

        .spindles { animation: spindlesAnim 15s infinite linear; }
        @keyframes spindlesAnim {
            0%, 13.3% { opacity: 0; }
            20%, 53.3% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }

        /* Labels */
        .l1 { animation: showL1 15s infinite linear; opacity: 0; }
        @keyframes showL1 { 0%, 13.2% { opacity: 1; } 13.3%, 100% { opacity: 0; } }
        
        .l2 { animation: showL2 15s infinite linear; opacity: 0; }
        @keyframes showL2 { 0%, 13.2% { opacity: 0; } 13.3%, 26.5% { opacity: 1; } 26.6%, 100% { opacity: 0; } }
        
        .l3 { animation: showL3 15s infinite linear; opacity: 0; }
        @keyframes showL3 { 0%, 26.5% { opacity: 0; } 26.6%, 39.9% { opacity: 1; } 40%, 100% { opacity: 0; } }
        
        .l4 { animation: showL4 15s infinite linear; opacity: 0; }
        @keyframes showL4 { 0%, 39.9% { opacity: 0; } 40%, 53.2% { opacity: 1; } 53.3%, 100% { opacity: 0; } }
        
        .l5 { animation: showL5 15s infinite linear; opacity: 0; }
        @keyframes showL5 { 0%, 53.2% { opacity: 0; } 53.3%, 66.5% { opacity: 1; } 66.6%, 100% { opacity: 0; } }
        
        .l6 { animation: showL6 15s infinite linear; opacity: 0; }
        @keyframes showL6 { 0%, 66.5% { opacity: 0; } 66.6%, 96.5% { opacity: 1; } 96.6%, 100% { opacity: 0; } }

        /* Pointers */
        .p-centromere { animation: showL3 15s infinite linear; opacity: 0; }
        .p-spindle { animation: pSpindleAnim 15s infinite linear; opacity: 0; }
        @keyframes pSpindleAnim { 0%, 26.5% { opacity: 0; } 26.6%, 53.2% { opacity: 1; } 53.3%, 100% { opacity: 0; } }
        .p-furrow { animation: showL5 15s infinite linear; opacity: 0; }
        .p-cells { animation: showL6 15s infinite linear; opacity: 0; }

    </style>
</head>
<body>

    <h1>Mitosis: Somatic Cell Division & Arithmetic Growth</h1>
    <p class="subtitle">Arithmetic Growth: 1 Divides, 1 Differentiates</p>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of Mitosis and Arithmetic Growth">
            <defs>
                <!-- Grid Pattern -->
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                </pattern>

                <!-- Arrow Marker -->
                <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
                </marker>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="url(#grid)" />

            <!-- Legend -->
            <g transform="translate(620, 20)">
                <rect x="0" y="0" width="160" height="85" fill="rgba(255,255,255,0.9)" stroke="#e0e0e0" rx="6"/>
                <circle cx="15" cy="18" r="5" fill="#FF6B6B"/>
                <text x="30" y="22" font-size="11" fill="#2C3E50" font-weight="600">DNA (Chromosomes)</text>
                <circle cx="15" cy="42" r="5" fill="#98D8C8"/>
                <text x="30" y="46" font-size="11" fill="#2C3E50" font-weight="600">Proteins (Spindles)</text>
                <polygon points="15,58 20,62 20,68 15,72 10,68 10,62" fill="#F39C12"/>
                <text x="30" y="70" font-size="11" fill="#2C3E50" font-weight="600">Differentiated Tissue</text>
            </g>

            <!-- Spindle Fibers (SMIL Animated) -->
            <g class="spindles" stroke="#98D8C8" stroke-width="1.5" stroke-dasharray="4,4">
                <!-- Left Spindles -->
                <line x1="200" y1="250" x2="200" y2="250">
                    <animate attributeName="x2" values="200; 200; 400; 400; 250; 250; 250" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 160; 160; 160; 160; 160" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="200" y1="250" x2="200" y2="250">
                    <animate attributeName="x2" values="200; 200; 400; 400; 250; 250; 250" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 220; 220; 220; 220; 220" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="200" y1="250" x2="200" y2="250">
                    <animate attributeName="x2" values="200; 200; 400; 400; 250; 250; 250" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 280; 280; 280; 280; 280" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="200" y1="250" x2="200" y2="250">
                    <animate attributeName="x2" values="200; 200; 400; 400; 250; 250; 250" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 340; 340; 340; 340; 340" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <!-- Right Spindles -->
                <line x1="600" y1="250" x2="600" y2="250">
                    <animate attributeName="x2" values="600; 600; 400; 400; 550; 550; 550" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 160; 160; 160; 160; 160" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="600" y1="250" x2="600" y2="250">
                    <animate attributeName="x2" values="600; 600; 400; 400; 550; 550; 550" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 220; 220; 220; 220; 220" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="600" y1="250" x2="600" y2="250">
                    <animate attributeName="x2" values="600; 600; 400; 400; 550; 550; 550" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 280; 280; 280; 280; 280" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
                <line x1="600" y1="250" x2="600" y2="250">
                    <animate attributeName="x2" values="600; 600; 400; 400; 550; 550; 550" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                    <animate attributeName="y2" values="250; 250; 340; 340; 340; 340; 340" keyTimes="0; 0.133; 0.266; 0.4; 0.533; 0.666; 1" dur="15s" repeatCount="indefinite"/>
                </line>
            </g>

            <!-- Main Cell Membrane (Morphs during division) -->
            <path class="main-cell" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" d="M 400,100 C 482.8,100 550,167.2 550,250 C 550,332.8 482.8,400 400,400 C 317.2,400 250,332.8 250,250 C 250,167.2 317.2,100 400,100 Z">
                <animate attributeName="d" 
                    values="
                        M 400,100 C 482.8,100 550,167.2 550,250 C 550,332.8 482.8,400 400,400 C 317.2,400 250,332.8 250,250 C 250,167.2 317.2,100 400,100 Z;
                        M 400,100 C 482.8,100 550,167.2 550,250 C 550,332.8 482.8,400 400,400 C 317.2,400 250,332.8 250,250 C 250,167.2 317.2,100 400,100 Z;
                        M 400,100 C 550,100 650,167.2 650,250 C 650,332.8 550,400 400,400 C 250,400 150,332.8 150,250 C 150,167.2 250,100 400,100 Z;
                        M 400,180 C 550,100 650,150 650,250 C 650,350 550,400 400,320 C 250,400 150,350 150,250 C 150,150 250,100 400,180 Z;
                        M 400,245 C 500,100 650,150 650,250 C 650,350 500,400 400,255 C 300,400 150,350 150,250 C 150,150 300,100 400,245 Z;
                        M 400,245 C 500,100 650,150 650,250 C 650,350 500,400 400,255 C 300,400 150,350 150,250 C 150,150 300,100 400,245 Z"
                    keyTimes="0; 0.266; 0.4; 0.533; 0.666; 1" 
                    dur="15s" 
                    repeatCount="indefinite"/>
            </path>

            <!-- Left Cell (Meristematic) -->
            <g class="cell-left">
                <circle cx="250" cy="250" r="120" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" />
            </g>

            <!-- Right Cell (Differentiated) -->
            <g class="cell-right">
                <circle cx="550" cy="250" r="120" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" class="membrane-right-circle" />
                <polygon points="550,130 654,190 654,310 550,370 446,310 446,190" fill="rgba(243,156,18,0.15)" stroke="#F39C12" stroke-width="3" class="membrane-right-hex" />
            </g>

            <!-- Centrioles -->
            <g class="centriole-left">
                <rect x="-4" y="-10" width="8" height="20" fill="#98D8C8" rx="2"/>
                <rect x="-10" y="-4" width="20" height="8" fill="#98D8C8" rx="2"/>
            </g>
            <g class="centriole-right">
                <rect x="-4" y="-10" width="8" height="20" fill="#98D8C8" rx="2"/>
                <rect x="-10" y="-4" width="20" height="8" fill="#98D8C8" rx="2"/>
            </g>

            <!-- Main Nucleus & Chromatin -->
            <circle cx="400" cy="250" r="80" class="main-nucleus" stroke="#2C3E50" stroke-dasharray="6,6" fill="none" stroke-width="2.5"/>
            <path class="main-chromatin" d="M380,250 C380,220 410,210 420,240 C430,270 400,280 390,260 C380,240 410,230 400,250 C390,270 370,260 380,250 M370,230 C390,200 430,220 410,260 C390,280 360,250 370,230" fill="none" stroke="#FF6B6B" stroke-width="3"/>

            <!-- Left Contents (Nucleus & Chromatin) -->
            <g class="left-contents">
                <circle cx="250" cy="250" r="64" class="nucleus-dash" stroke="#2C3E50" fill="none" stroke-width="2.5"/>
                <path d="M230,250 C230,220 260,210 270,240 C280,270 250,280 240,260 C230,240 260,230 250,250 C240,270 220,260 230,250" fill="none" stroke="#FF6B6B" stroke-width="2.5"/>
            </g>

            <!-- Right Contents (Nucleus & Chromatin) -->
            <g class="right-contents">
                <circle cx="550" cy="250" r="64" class="nucleus-dash" stroke="#2C3E50" fill="none" stroke-width="2.5"/>
                <path d="M530,250 C530,220 560,210 570,240 C580,270 550,280 540,260 C530,240 560,230 550,250 C540,270 520,260 530,250" fill="none" stroke="#FF6B6B" stroke-width="2.5"/>
            </g>

            <!-- Chromosomes -->
            <g id="chromosomes">
                <!-- Chr 1 -->
                <g class="chr1-left">
                    <path d="M 12,-18 L 0,0 L 12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <g class="chr1-right">
                    <path d="M -12,-18 L 0,0 L -12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <!-- Chr 2 -->
                <g class="chr2-left">
                    <path d="M 12,-18 L 0,0 L 12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <g class="chr2-right">
                    <path d="M -12,-18 L 0,0 L -12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <!-- Chr 3 -->
                <g class="chr3-left">
                    <path d="M 12,-18 L 0,0 L 12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <g class="chr3-right">
                    <path d="M -12,-18 L 0,0 L -12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <!-- Chr 4 -->
                <g class="chr4-left">
                    <path d="M 12,-18 L 0,0 L 12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
                <g class="chr4-right">
                    <path d="M -12,-18 L 0,0 L -12,18" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
            </g>

            <!-- Pointers & Structural Labels -->
            <g class="p-centromere">
                <line x1="480" y1="160" x2="415" y2="160" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="488" y="164" font-size="13" fill="#2C3E50" font-weight="600">Kinetochore / Centromere</text>
            </g>
            <g class="p-spindle">
                <line x1="200" y1="320" x2="250" y2="260" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="200" y="338" font-size="13" fill="#2C3E50" font-weight="600" text-anchor="middle">Spindle Apparatus</text>
            </g>
            <g class="p-furrow">
                <line x1="400" y1="80" x2="400" y2="165" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="400" y="70" font-size="13" fill="#2C3E50" font-weight="600" text-anchor="middle">Cleavage Furrow</text>
            </g>
            <g class="p-cells">
                <text x="250" y="400" font-size="14" font-weight="bold" fill="#4A90D9" text-anchor="middle">Meristematic Cell</text>
                <text x="250" y="418" font-size="12" fill="#2C3E50" text-anchor="middle">(Continues Cycle)</text>
                
                <text x="550" y="400" font-size="14" font-weight="bold" fill="#F39C12" text-anchor="middle">Differentiated Cell</text>
                <text x="550" y="418" font-size="12" fill="#2C3E50" text-anchor="middle">(Stops Dividing)</text>
            </g>

            <!-- Dynamic Stage Labels -->
            <g transform="translate(400, 470)" font-size="18" font-weight="bold" fill="#2C3E50" text-anchor="middle">
                <text class="l1">Interphase &amp; Early Prophase (2n=4)</text>
                <text class="l2">Prometaphase: Envelope breaks, spindles form</text>
                <text class="l3">Metaphase: Chromosomes align at equator</text>
                <text class="l4">Anaphase: Sister chromatids separate to poles</text>
                <text class="l5">Telophase &amp; Cytokinesis: Cell divides</text>
                <text class="l6" fill="#F39C12">Arithmetic Growth: Differentiation</text>
            </g>

        </svg>
    </div>
