<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Endomembrane System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@1&display=swap');

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            border-radius: 16px;
            overflow: hidden;
            background-color: #E8F4FD;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .label { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .process-label { font-family: 'Roboto Mono', monospace; font-size: 12px; font-style: italic; fill: #555; }
        .legend-text { font-size: 12px; font-weight: 400; fill: #2C3E50; }

        /* Animations */
        .anim-protein-sec {
            animation: protein-sec 12s linear infinite;
        }
        .anim-vesicle-1 {
            animation: vesicle-1 12s linear infinite;
        }
        .anim-vesicle-2 {
            animation: vesicle-2 12s linear infinite;
        }
        .anim-protein-lyso {
            animation: protein-lyso 12s linear infinite;
        }
        .anim-vesicle-3 {
            animation: vesicle-3 12s linear infinite;
        }

        /* Secretory Protein Pathway */
        @keyframes protein-sec {
            0%   { transform: translate(250px, 250px); opacity: 0; }
            5%   { transform: translate(250px, 250px); opacity: 1; }
            10%  { transform: translate(292px, 250px); opacity: 1; }
            15%  { transform: translate(292px, 250px); opacity: 1; }
            25%  { transform: translate(340px, 250px); opacity: 1; }
            30%  { transform: translate(350px, 250px); opacity: 1; }
            40%  { transform: translate(390px, 250px); opacity: 1; }
            50%  { transform: translate(430px, 250px); opacity: 1; }
            60%  { transform: translate(470px, 250px); opacity: 1; }
            65%  { transform: translate(510px, 250px); opacity: 1; }
            70%  { transform: translate(520px, 250px); opacity: 1; }
            80%  { transform: translate(730px, 250px); opacity: 1; }
            85%  { transform: translate(750px, 250px); opacity: 1; }
            90%  { transform: translate(780px, 250px); opacity: 1; }
            95%  { transform: translate(790px, 250px); opacity: 0; }
            100% { transform: translate(790px, 250px); opacity: 0; }
        }

        /* ER to Golgi Vesicle */
        @keyframes vesicle-1 {
            0%, 10% { transform: translate(292px, 250px) scale(0); opacity: 1; }
            15%     { transform: translate(292px, 250px) scale(1); opacity: 1; }
            25%     { transform: translate(340px, 250px) scale(1); opacity: 1; }
            30%     { transform: translate(340px, 250px) scale(0); opacity: 1; }
            100%    { transform: translate(340px, 250px) scale(0); opacity: 0; }
        }

        /* Golgi to Plasma Membrane Vesicle */
        @keyframes vesicle-2 {
            0%, 65% { transform: translate(520px, 250px) scale(0); opacity: 1; }
            70%     { transform: translate(520px, 250px) scale(1); opacity: 1; }
            80%     { transform: translate(730px, 250px) scale(1); opacity: 1; }
            85%     { transform: translate(730px, 250px) scale(0); opacity: 1; }
            100%    { transform: translate(730px, 250px) scale(0); opacity: 0; }
        }

        /* Lysosomal Enzyme Pathway */
        @keyframes protein-lyso {
            0%, 35% { transform: translate(430px, 280px); opacity: 0; }
            40%     { transform: translate(430px, 280px); opacity: 1; }
            50%     { transform: translate(470px, 300px); opacity: 1; }
            60%     { transform: translate(510px, 320px); opacity: 1; }
            65%     { transform: translate(520px, 340px); opacity: 1; }
            75%     { transform: translate(580px, 400px); opacity: 1; }
            80%     { transform: translate(580px, 420px); opacity: 1; }
            95%     { transform: translate(580px, 420px); opacity: 1; }
            100%    { transform: translate(580px, 420px); opacity: 0; }
        }

        /* Golgi to Lysosome Vesicle */
        @keyframes vesicle-3 {
            0%, 60% { transform: translate(520px, 340px) scale(0); opacity: 1; }
            65%     { transform: translate(520px, 340px) scale(1); opacity: 1; }
            75%     { transform: translate(580px, 400px) scale(1); opacity: 1; }
            80%     { transform: translate(580px, 400px) scale(0); opacity: 1; }
            100%    { transform: translate(580px, 400px) scale(0); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container" aria-label="Animated diagram of the eukaryotic endomembrane system showing protein synthesis and the secretory pathway.">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
            </filter>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background Cytoplasm -->
        <rect width="800" height="500" fill="#E8F4FD" />

        <!-- NUCLEUS -->
        <g id="nucleus" filter="url(#shadow)">
            <!-- Nucleoplasm -->
            <circle cx="0" cy="250" r="170" fill="#D6EAF8" />
            <!-- Nucleolus -->
            <circle cx="40" cy="250" r="45" fill="#2C3E50" />
            <!-- Chromatin -->
            <path d="M 20 150 Q 50 120 80 160 T 120 140 T 100 200 T 140 220" stroke="#FF6B6B" stroke-width="2" fill="none" opacity="0.7"/>
            <path d="M 20 350 Q 50 380 80 340 T 120 360 T 100 300 T 140 280" stroke="#FF6B6B" stroke-width="2" fill="none" opacity="0.7"/>
            <!-- Inner Membrane -->
            <circle cx="0" cy="250" r="160" stroke="#2C3E50" stroke-width="4" fill="none" stroke-dasharray="80 8" />
            <!-- Outer Membrane -->
            <circle cx="0" cy="250" r="170" stroke="#4A90D9" stroke-width="4" fill="none" stroke-dasharray="80 8" />
        </g>

        <!-- ROUGH ENDOPLASMIC RETICULUM -->
        <g id="rough-er" filter="url(#shadow)">
            <!-- RER Body (Continuous folded sac) -->
            <path d="M 160 138 L 240 138 A 32 32 0 0 1 272 170 A 32 32 0 0 1 240 202 L 180 202 A 8 8 0 0 0 172 210 A 8 8 0 0 0 180 218 L 260 218 A 32 32 0 0 1 292 250 A 32 32 0 0 1 260 282 L 180 282 A 8 8 0 0 0 172 290 A 8 8 0 0 0 180 298 L 250 298 A 32 32 0 0 1 282 330 A 32 32 0 0 1 250 362 L 160 362 L 160 338 L 250 338 A 8 8 0 0 0 258 330 A 8 8 0 0 0 250 322 L 180 322 A 32 32 0 0 1 148 290 A 32 32 0 0 1 180 258 L 260 258 A 8 8 0 0 0 268 250 A 8 8 0 0 0 260 242 L 180 242 A 32 32 0 0 1 148 210 A 32 32 0 0 1 180 178 L 240 178 A 8 8 0 0 0 248 170 A 8 8 0 0 0 240 162 L 160 162 Z" fill="#FFFFFF" stroke="#4A90D9" stroke-width="4" stroke-linejoin="round"/>
            
            <!-- Ribosomes (Studded on outer membrane) -->
            <g fill="#FF6B6B">
                <circle cx="200" cy="138" r="2.5"/><circle cx="220" cy="138" r="2.5"/><circle cx="240" cy="138" r="2.5"/><circle cx="255" cy="142" r="2.5"/><circle cx="268" cy="152" r="2.5"/><circle cx="274" cy="165" r="2.5"/><circle cx="270" cy="180" r="2.5"/><circle cx="260" cy="192" r="2.5"/><circle cx="245" cy="202" r="2.5"/><circle cx="225" cy="202" r="2.5"/>
                <circle cx="210" cy="218" r="2.5"/><circle cx="230" cy="218" r="2.5"/><circle cx="250" cy="218" r="2.5"/><circle cx="270" cy="222" r="2.5"/><circle cx="285" cy="232" r="2.5"/><circle cx="294" cy="250" r="2.5"/><circle cx="288" cy="268" r="2.5"/><circle cx="275" cy="278" r="2.5"/><circle cx="255" cy="282" r="2.5"/><circle cx="235" cy="282" r="2.5"/>
                <circle cx="215" cy="298" r="2.5"/><circle cx="235" cy="298" r="2.5"/><circle cx="255" cy="302" r="2.5"/><circle cx="272" cy="312" r="2.5"/><circle cx="284" cy="328" r="2.5"/><circle cx="278" cy="345" r="2.5"/><circle cx="265" cy="356" r="2.5"/><circle cx="245" cy="362" r="2.5"/><circle cx="225" cy="362" r="2.5"/><circle cx="205" cy="362" r="2.5"/>
            </g>
        </g>

        <!-- SMOOTH ENDOPLASMIC RETICULUM -->
        <g id="smooth-er" filter="url(#shadow)">
            <path d="M 200 362 L 200 400 L 240 420 M 200 400 L 160 430 M 240 420 L 260 400 M 240 420 L 250 460 M 260 400 L 290 410" stroke="#4A90D9" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M 200 362 L 200 400 L 240 420 M 200 400 L 160 430 M 240 420 L 260 400 M 240 420 L 250 460 M 260 400 L 290 410" stroke="#FFFFFF" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- GOLGI APPARATUS -->
        <g id="golgi" filter="url(#shadow)">
            <!-- Cisternae Outlines -->
            <path d="M 380 150 Q 320 250 380 350" stroke="#F39C12" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M 420 150 Q 360 250 420 350" stroke="#F39C12" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M 460 150 Q 400 250 460 350" stroke="#F39C12" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M 500 150 Q 440 250 500 350" stroke="#F39C12" stroke-width="16" fill="none" stroke-linecap="round"/>
            <path d="M 540 150 Q 480 250 540 350" stroke="#F39C12" stroke-width="16" fill="none" stroke-linecap="round"/>
            
            <!-- Cisternae Lumen -->
            <path d="M 380 150 Q 320 250 380 350" stroke="#FDF3E1" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M 420 150 Q 360 250 420 350" stroke="#FDF3E1" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M 460 150 Q 400 250 460 350" stroke="#FDF3E1" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M 500 150 Q 440 250 500 350" stroke="#FDF3E1" stroke-width="8" fill="none" stroke-linecap="round"/>
            <path d="M 540 150 Q 480 250 540 350" stroke="#FDF3E1" stroke-width="8" fill="none" stroke-linecap="round"/>

            <!-- Swollen Ends (Vesicle Budding Sites) -->
            <g fill="#FDF3E1" stroke="#F39C12" stroke-width="4">
                <circle cx="380" cy="150" r="8"/><circle cx="380" cy="350" r="8"/>
                <circle cx="420" cy="150" r="8"/><circle cx="420" cy="350" r="8"/>
                <circle cx="460" cy="150" r="8"/><circle cx="460" cy="350" r="8"/>
                <circle cx="500" cy="150" r="8"/><circle cx="500" cy="350" r="8"/>
                <circle cx="540" cy="150" r="8"/><circle cx="540" cy="350" r="8"/>
            </g>
        </g>

        <!-- LYSOSOME -->
        <g id="lysosome" filter="url(#shadow)">
            <circle cx="580" cy="420" r="35" fill="#FDEDEC" stroke="#E74C3C" stroke-width="4" />
            <!-- Existing Hydrolase Enzymes -->
            <polygon points="570,405 575,415 565,415" fill="#E74C3C"/>
            <polygon points="590,410 595,420 585,420" fill="#E74C3C"/>
            <polygon points="575,430 580,440 570,440" fill="#E74C3C"/>
            <polygon points="595,425 600,435 590,435" fill="#E74C3C"/>
        </g>

        <!-- PLASMA MEMBRANE & EXTRACELLULAR MATRIX -->
        <g id="plasma-membrane">
            <!-- Extracellular Space -->
            <path d="M 760 0 L 760 210 C 760 230, 730 230, 730 250 C 730 270, 760 270, 760 290 L 760 500 L 800 500 L 800 0 Z" fill="#F2F4F4" />
            <!-- Membrane Line -->
            <path d="M 760 0 L 760 210 C 760 230, 730 230, 730 250 C 730 270, 760 270, 760 290 L 760 500" stroke="#4A90D9" stroke-width="6" fill="none" filter="url(#shadow)"/>
        </g>

        <!-- ========================================== -->
        <!-- ANIMATED ELEMENTS (VESICLES & PROTEINS)    -->
        <!-- ========================================== -->

        <!-- Vesicle 1: ER to Golgi -->
        <circle class="anim-vesicle-1" cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#4A90D9" stroke-width="3" filter="url(#shadow)"/>
        
        <!-- Vesicle 2: Golgi to Plasma Membrane -->
        <circle class="anim-vesicle-2" cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#4A90D9" stroke-width="3" filter="url(#shadow)"/>
        
        <!-- Vesicle 3: Golgi to Lysosome -->
        <circle class="anim-vesicle-3" cx="0" cy="0" r="12" fill="#FFFFFF" stroke="#4A90D9" stroke-width="3" filter="url(#shadow)"/>

        <!-- Secretory Protein (Main Pathway) -->
        <circle class="anim-protein-sec" cx="0" cy="0" r="5" fill="#98D8C8" filter="url(#glow)"/>

        <!-- Lysosomal Enzyme (Parallel Pathway) -->
        <polygon class="anim-protein-lyso" points="0,-6 5,4 -5,4" fill="#E74C3C" filter="url(#glow)"/>


        <!-- ========================================== -->
        <!-- LABELS, POINTERS & LEGEND                  -->
        <!-- ========================================== -->

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" class="title">The Endomembrane System: Secretory Pathway</text>

        <!-- Pointers -->
        <g stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="2 2">
            <line x1="120" y1="100" x2="160" y2="150" />
            <line x1="280" y1="440" x2="240" y2="420" />
            <line x1="480" y1="100" x2="460" y2="140" />
            <line x1="650" y1="450" x2="610" y2="430" />
            <line x1="700" y1="100" x2="750" y2="150" />
            <line x1="100" y1="360" x2="140" y2="280" />
        </g>

        <!-- Organelle Labels -->
        <text x="120" y="90" text-anchor="middle" class="label">Rough ER</text>
        <text x="120" y="108" text-anchor="middle" class="legend-text">(Protein Synthesis)</text>

        <text x="280" y="455" text-anchor="middle" class="label">Smooth ER</text>
        <text x="280" y="473" text-anchor="middle" class="legend-text">(Lipid Synthesis)</text>

        <text x="480" y="80" text-anchor="middle" class="label">Golgi Apparatus</text>
        <text x="480" y="98" text-anchor="middle" class="legend-text">(Packaging & Modification)</text>

        <text x="660" y="465" text-anchor="middle" class="label">Lysosome</text>

        <text x="700" y="90" text-anchor="middle" class="label">Plasma Membrane</text>

        <text x="80" y="375" text-anchor="middle" class="label">Nucleus</text>

        <!-- Process Labels -->
        <text x="340" y="140" text-anchor="end" class="process-label">cis face</text>
        <text x="560" y="140" text-anchor="start" class="process-label">trans face</text>
        <text x="700" y="240" text-anchor="end" class="process-label">Exocytosis</text>
        <text x="200" y="255" text-anchor="middle" class="process-label" fill="#4A90D9">Luminal</text>
        <text x="200" y="270" text-anchor="middle" class="process-label" fill="#4A90D9">Space</text>

        <!-- Legend -->
        <g transform="translate(20, 390)">
            <rect x="0" y="0" width="180" height="90" fill="#ffffff" stroke="#BDC3C7" rx="8" filter="url(#shadow)"/>
            <text x="90" y="20" text-anchor="middle" class="label" font-size="12">Key</text>
            
            <circle cx="20" cy="40" r="5" fill="#98D8C8"/>
            <text x="35" y="44" class="legend-text">Secretory Protein</text>
            
            <polygon points="20,54 25,64 15,64" fill="#E74C3C"/>
            <text x="35" y="64" class="legend-text">Lysosomal Enzyme</text>
            
            <circle cx="20" cy="78" r="3" fill="#FF6B6B"/>
            <text x="35" y="82" class="legend-text">Ribosome</text>
        </g>

    </svg>
</div>

</body>
</html>
