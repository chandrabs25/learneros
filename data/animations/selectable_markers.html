<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Selection: The Role of Selectable Markers</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
        }

        /* Animations */
        .plasmid-anim {
            animation: movePlasmid 18s infinite ease-in-out;
        }

        @keyframes movePlasmid {
            0%, 2% { transform: translateX(0); opacity: 0; }
            5% { opacity: 1; }
            15%, 100% { transform: translateX(145px); opacity: 1; }
        }

        .cell-a-anim {
            animation: cellDeath 18s infinite;
        }

        @keyframes cellDeath {
            0%, 25% { opacity: 1; stroke: #4A90D9; fill: #E8F4FD; }
            28% { stroke: #E74C3C; fill: #FADBD8; }
            35%, 100% { opacity: 0.15; stroke: #E74C3C; fill: #FADBD8; }
        }

        .colony-a-anim {
            animation: colonyADeath 18s infinite;
            transform-origin: center;
        }

        @keyframes colonyADeath {
            0%, 15% { transform: scale(0); opacity: 0; }
            20% { transform: scale(1); opacity: 1; fill: #E74C3C; }
            25%, 100% { transform: scale(0); opacity: 0; }
        }

        .colony-appear-dish1 {
            animation: appearDish1 18s infinite;
            transform-origin: center;
        }

        @keyframes appearDish1 {
            0%, 15% { transform: scale(0); opacity: 0; }
            25%, 100% { transform: scale(1); opacity: 1; }
        }

        .colony-appear-dish2 {
            animation: appearDish2 18s infinite;
            transform-origin: center;
        }

        @keyframes appearDish2 {
            0%, 40% { transform: scale(0); opacity: 0; }
            50%, 100% { transform: scale(1); opacity: 1; }
        }

        .colony-color-blue {
            animation: turnBlue 18s infinite;
        }

        @keyframes turnBlue {
            0%, 50% { fill: #FBFCFC; stroke: #D5DBDB; }
            65%, 100% { fill: #3498DB; stroke: #2980B9; }
        }

        .arrow-1 {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: drawArrow1 18s infinite ease-in-out;
        }

        @keyframes drawArrow1 {
            0%, 15% { stroke-dashoffset: 400; }
            20%, 100% { stroke-dashoffset: 0; }
        }

        .arrow-2 {
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawArrow2 18s infinite ease-in-out;
        }

        @keyframes drawArrow2 {
            0%, 40% { stroke-dashoffset: 100; }
            45%, 100% { stroke-dashoffset: 0; }
        }

        .text-fade-amp {
            animation: fadeAmp 18s infinite;
        }

        @keyframes fadeAmp {
            0%, 20% { opacity: 0; }
            25%, 100% { opacity: 1; }
        }

        .text-fade-xgal {
            animation: fadeXgal 18s infinite;
        }

        @keyframes fadeXgal {
            0%, 45% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }

        text {
            user-select: none;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Drop Shadow Filter for 3D effect -->
        <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
        </filter>

        <!-- Arrowhead Marker -->
        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#BDC3C7"/>
        </marker>

        <!-- Plasmids -->
        <g id="plasmid-non-rec">
            <circle cx="0" cy="0" r="16" fill="none" stroke="#FF6B6B" stroke-width="2"/>
            <!-- ampR: 180 to 270 degrees -->
            <path d="M -16 0 A 16 16 0 0 1 0 -16" fill="none" stroke="#98D8C8" stroke-width="4"/>
            <!-- lacZ': 270 to 360 degrees -->
            <path d="M 0 -16 A 16 16 0 0 1 16 0" fill="none" stroke="#F39C12" stroke-width="4"/>
        </g>

        <g id="plasmid-rec">
            <circle cx="0" cy="0" r="16" fill="none" stroke="#FF6B6B" stroke-width="2"/>
            <!-- ampR: 180 to 270 degrees -->
            <path d="M -16 0 A 16 16 0 0 1 0 -16" fill="none" stroke="#98D8C8" stroke-width="4"/>
            <!-- lacZ' part 1: 270 to 300 degrees -->
            <path d="M 0 -16 A 16 16 0 0 1 8 -13.86" fill="none" stroke="#F39C12" stroke-width="4"/>
            <!-- Insert (Gene of Interest): 300 to 330 degrees -->
            <path d="M 8 -13.86 A 16 16 0 0 1 13.86 -8" fill="none" stroke="#2ECC71" stroke-width="6"/>
            <!-- lacZ' part 2: 330 to 360 degrees -->
            <path d="M 13.86 -8 A 16 16 0 0 1 16 0" fill="none" stroke="#F39C12" stroke-width="4"/>
        </g>

        <!-- Bacterial Nucleoid -->
        <g id="nucleoid">
            <path d="M -20 0 C -10 -15, 0 15, 10 0 C 20 -15, 30 15, 35 0" fill="none" stroke="#2C3E50" stroke-width="1.5" opacity="0.3"/>
        </g>
    </defs>

    <!-- Header -->
    <text x="400" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50">Selectable Markers: Identification of Recombinants</text>
    <text x="400" y="55" text-anchor="middle" font-size="14" fill="#7F8C8D">Dual-selection using antibiotic resistance and insertional inactivation</text>

    <!-- ================= LEFT PANEL: TRANSFORMATION ================= -->
    <text x="180" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#2C3E50">1. Transformation</text>

    <!-- Cell A: Non-transformed -->
    <g transform="translate(180, 140)">
        <g class="cell-a-anim">
            <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <use href="#nucleoid"/>
        </g>
        <text x="0" y="35" text-anchor="middle" font-size="12" fill="#34495E">Non-transformed</text>
        <text x="0" y="50" text-anchor="middle" font-size="10" font-style="italic" fill="#7F8C8D">E. coli</text>
    </g>

    <!-- Cell B: Transformed (Non-recombinant) -->
    <g transform="translate(180, 260)">
        <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        <use href="#nucleoid"/>
        <text x="0" y="35" text-anchor="middle" font-size="12" fill="#34495E">Non-recombinant</text>
        <text x="0" y="50" text-anchor="middle" font-size="10" fill="#7F8C8D">(Intact <tspan font-style="italic">lacZ'</tspan>)</text>
    </g>
    <!-- Plasmid B -->
    <g transform="translate(50, 260)">
        <g class="plasmid-anim">
            <use href="#plasmid-non-rec"/>
        </g>
    </g>

    <!-- Cell C: Transformed (Recombinant) -->
    <g transform="translate(180, 380)">
        <rect x="-40" y="-18" width="80" height="36" rx="18" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        <use href="#nucleoid"/>
        <text x="0" y="35" text-anchor="middle" font-size="12" fill="#34495E">Recombinant</text>
        <text x="0" y="50" text-anchor="middle" font-size="10" fill="#7F8C8D">(Disrupted <tspan font-style="italic">lacZ'</tspan>)</text>
    </g>
    <!-- Plasmid C -->
    <g transform="translate(50, 380)">
        <g class="plasmid-anim">
            <use href="#plasmid-rec"/>
        </g>
    </g>

    <!-- ================= MIDDLE PANEL: ARROWS ================= -->
    <!-- Arrows to Dish 1 -->
    <path class="arrow-1" d="M 240 140 Q 360 140 500 160" fill="none" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path class="arrow-1" d="M 240 260 Q 360 260 500 180" fill="none" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrowhead)"/>
    <path class="arrow-1" d="M 240 380 Q 360 380 500 200" fill="none" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- Arrow to Dish 2 -->
    <path class="arrow-2" d="M 600 250 L 600 285" fill="none" stroke="#BDC3C7" stroke-width="2" marker-end="url(#arrowhead)"/>

    <!-- ================= RIGHT PANEL: PETRI DISHES ================= -->
    
    <!-- Dish 1: Ampicillin Selection -->
    <g transform="translate(600, 160)">
        <circle r="80" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="4" filter="url(#shadow)"/>
        <circle r="72" fill="none" stroke="#E5E8E8" stroke-width="1"/>
        <text x="0" y="-95" text-anchor="middle" font-size="14" font-weight="600" fill="#2C3E50">2. Antibiotic Selection</text>
        <text x="0" y="-10" text-anchor="middle" font-size="12" font-weight="600" fill="#E74C3C" class="text-fade-amp" opacity="0">+ Ampicillin</text>
        <text x="0" y="5" text-anchor="middle" font-size="10" fill="#7F8C8D" class="text-fade-amp" opacity="0">(Kills non-transformed)</text>

        <!-- Colonies in Dish 1 -->
        <!-- Colony A (Dies) -->
        <g transform="translate(-40, -30)">
            <g class="colony-a-anim"><circle r="5" fill="#E74C3C"/></g>
        </g>
        <g transform="translate(-20, -50)">
            <g class="colony-a-anim" style="animation-delay: 0.2s;"><circle r="4" fill="#E74C3C"/></g>
        </g>

        <!-- Colony B (Survives) -->
        <g transform="translate(30, -20)">
            <g class="colony-appear-dish1"><circle r="6" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
        <g transform="translate(10, -40)">
            <g class="colony-appear-dish1" style="animation-delay: 0.1s;"><circle r="5" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>

        <!-- Colony C (Survives) -->
        <g transform="translate(-10, 30)">
            <g class="colony-appear-dish1" style="animation-delay: 0.3s;"><circle r="6" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
        <g transform="translate(20, 40)">
            <g class="colony-appear-dish1" style="animation-delay: 0.2s;"><circle r="5" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
    </g>

    <!-- Dish 2: Color Screening -->
    <g transform="translate(600, 380)">
        <circle r="80" fill="#FFFFFF" stroke="#D5DBDB" stroke-width="4" filter="url(#shadow)"/>
        <circle r="72" fill="none" stroke="#E5E8E8" stroke-width="1"/>
        <text x="0" y="-95" text-anchor="middle" font-size="14" font-weight="600" fill="#2C3E50">3. Color Screening</text>
        <text x="0" y="-10" text-anchor="middle" font-size="12" font-weight="600" fill="#3498DB" class="text-fade-xgal" opacity="0">+ X-gal</text>
        <text x="0" y="5" text-anchor="middle" font-size="10" fill="#7F8C8D" class="text-fade-xgal" opacity="0">(Identifies recombinants)</text>

        <!-- Colonies in Dish 2 -->
        <!-- Colony B (Turns Blue) -->
        <g transform="translate(30, -20)">
            <g class="colony-appear-dish2"><circle class="colony-color-blue" r="6" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
        <g transform="translate(10, -40)">
            <g class="colony-appear-dish2" style="animation-delay: 0.1s;"><circle class="colony-color-blue" r="5" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>

        <!-- Colony C (Stays White) -->
        <g transform="translate(-10, 30)">
            <g class="colony-appear-dish2" style="animation-delay: 0.3s;"><circle r="6" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
        <g transform="translate(20, 40)">
            <g class="colony-appear-dish2" style="animation-delay: 0.2s;"><circle r="5" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/></g>
        </g>
    </g>

    <!-- ================= LEGENDS & KEYS ================= -->
    
    <!-- Plasmid Key -->
    <g transform="translate(20, 410)">
        <rect x="0" y="0" width="200" height="85" fill="#FFFFFF" stroke="#BDC3C7" rx="5" filter="url(#shadow)"/>
        <text x="100" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">Plasmid Components</text>
        
        <line x1="15" y1="30" x2="35" y2="30" stroke="#FF6B6B" stroke-width="3"/>
        <text x="45" y="34" font-size="11" fill="#34495E">Plasmid Backbone</text>
        
        <line x1="15" y1="48" x2="35" y2="48" stroke="#98D8C8" stroke-width="3"/>
        <text x="45" y="52" font-size="11" fill="#34495E"><tspan font-style="italic">ampR</tspan> (Amp Resistance)</text>
        
        <line x1="15" y1="66" x2="25" y2="66" stroke="#F39C12" stroke-width="3"/>
        <line x1="25" y1="66" x2="35" y2="66" stroke="#2ECC71" stroke-width="3"/>
        <text x="45" y="70" font-size="11" fill="#34495E"><tspan font-style="italic">lacZ'</tspan> + Insert (Green)</text>
    </g>

    <!-- Colony Key -->
    <g transform="translate(240, 425)">
        <rect x="0" y="0" width="210" height="70" fill="#FFFFFF" stroke="#BDC3C7" rx="5" filter="url(#shadow)"/>
        <text x="105" y="16" text-anchor="middle" font-size="11" font-weight="600" fill="#2C3E50">Colony Phenotypes</text>
        
        <circle cx="20" cy="34" r="6" fill="#3498DB" stroke="#2980B9" stroke-width="1"/>
        <text x="35" y="38" font-size="11" fill="#34495E">Functional <tspan font-style="italic">lacZ'</tspan> (Blue)</text>
        
        <circle cx="20" cy="54" r="6" fill="#FBFCFC" stroke="#D5DBDB" stroke-width="1"/>
        <text x="35" y="58" font-size="11" fill="#34495E">Inactivated <tspan font-style="italic">lacZ'</tspan> (White)</text>
    </g>

</svg>

</body>
</html>
