<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Dynamic Hallmarks of Life</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Animations */
        .cell-shift {
            animation: cellShift 15s ease-in-out infinite;
        }

        .cell-scale {
            animation: cellScale 15s ease-in-out infinite;
        }

        .membrane {
            animation: membranePinch 15s ease-in-out infinite, cytoPulse 15s ease-in-out infinite;
        }

        .nucleus-1 {
            animation: nuc1Move 15s ease-in-out infinite;
        }

        .nucleus-2 {
            animation: nuc2Move 15s ease-in-out infinite;
        }

        .nucleus-body {
            animation: nucFlash 15s ease-in-out infinite;
        }

        .mito {
            animation: mitoPulse 15s ease-in-out infinite;
            transform-origin: center;
        }

        .nutrient {
            animation: nutrientFlow 15s ease-in-out infinite;
        }

        .atp {
            animation: atpFlow 15s ease-in-out infinite;
        }

        .waste {
            animation: wasteFlow 15s ease-in-out infinite;
        }

        .signal {
            animation: signalMove 15s ease-in-out infinite;
        }

        .label-metabolism { animation: labelMetabolism 15s ease-in-out infinite; }
        .label-response { animation: labelResponse 15s ease-in-out infinite; }
        .label-growth { animation: labelGrowth 15s ease-in-out infinite; }

        /* Keyframes */
        @keyframes cellShift {
            0%, 35% { transform: translate(400px, 250px); }
            40%, 46% { transform: translate(420px, 230px); }
            50%, 100% { transform: translate(400px, 250px); }
        }

        @keyframes cellScale {
            0%, 46% { transform: scale(1); }
            55%, 85% { transform: scale(1.15); }
            86.6%, 100% { transform: scale(1); }
        }

        @keyframes membranePinch {
            0%, 60% { d: path('M -140,-100 C -70,-100 70,-100 140,-100 C 200,-100 200,100 140,100 C 70,100 -70,100 -140,100 C -200,100 -200,-100 -140,-100 Z'); }
            75%, 85% { d: path('M -140,-100 C -70,-15 70,-15 140,-100 C 200,-100 200,100 140,100 C 70,15 -70,15 -140,100 C -200,100 -200,-100 -140,-100 Z'); }
            86.6%, 100% { d: path('M -140,-100 C -70,-100 70,-100 140,-100 C 200,-100 200,100 140,100 C 70,100 -70,100 -140,100 C -200,100 -200,-100 -140,-100 Z'); }
        }

        @keyframes cytoPulse {
            0%, 100% { fill: #E8F4FD; }
            50% { fill: #D6EAF8; }
        }

        @keyframes nuc1Move {
            0%, 60% { transform: translate(0px, 0px); }
            70%, 85% { transform: translate(-70px, 0px); }
            86.6%, 100% { transform: translate(0px, 0px); }
        }

        @keyframes nuc2Move {
            0%, 55% { opacity: 0; transform: translate(0px, 0px); }
            60% { opacity: 1; transform: translate(0px, 0px); }
            70%, 85% { opacity: 1; transform: translate(70px, 0px); }
            86.6%, 100% { opacity: 0; transform: translate(0px, 0px); }
        }

        @keyframes nucFlash {
            0%, 36% { fill: #2C3E50; }
            38%, 40% { fill: #ffffff; }
            42%, 100% { fill: #2C3E50; }
        }

        @keyframes mitoPulse {
            0%, 12% { transform: scale(1); }
            15%, 18% { transform: scale(1.15); }
            22%, 100% { transform: scale(1); }
        }

        @keyframes nutrientFlow {
            0% { opacity: 0; transform: translate(100px, 290px); }
            5% { opacity: 1; transform: translate(150px, 290px); }
            15% { opacity: 1; transform: translate(320px, 290px); }
            20%, 100% { opacity: 0; transform: translate(320px, 290px); }
        }

        @keyframes atpFlow {
            0%, 15% { opacity: 0; transform: translate(340px, 290px) scale(0.5); }
            18% { opacity: 1; transform: translate(360px, 310px) scale(1); }
            24% { opacity: 0; transform: translate(420px, 330px) scale(1.2); }
            25%, 100% { opacity: 0; }
        }

        @keyframes wasteFlow {
            0%, 18% { opacity: 0; transform: translate(340px, 290px); }
            20% { opacity: 1; transform: translate(300px, 320px); }
            26% { opacity: 0; transform: translate(100px, 400px); }
            27%, 100% { opacity: 0; }
        }

        @keyframes signalMove {
            0%, 25% { opacity: 0; transform: translate(650px, 50px); }
            30% { opacity: 1; transform: translate(580px, 90px); }
            38% { opacity: 1; transform: translate(500px, 150px); }
            40%, 45% { opacity: 1; transform: translate(520px, 130px); }
            48%, 100% { opacity: 0; transform: translate(520px, 130px); }
        }

        @keyframes labelMetabolism {
            0%, 5% { opacity: 0; }
            10%, 25% { opacity: 1; }
            28%, 100% { opacity: 0; }
        }

        @keyframes labelResponse {
            0%, 26% { opacity: 0; }
            30%, 45% { opacity: 1; }
            48%, 100% { opacity: 0; }
        }

        @keyframes labelGrowth {
            0%, 46% { opacity: 0; }
            50%, 85% { opacity: 1; }
            88%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Animated diagram showing metabolism, growth, and response to stimuli in a living cell</title>
        <desc>A eukaryotic cell demonstrating the dynamic hallmarks of life: metabolism (nutrient to ATP), response to stimuli (signal processing), and growth/reproduction (cell division).</desc>

        <defs>
            <!-- Drop Shadow for Cell -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#2C3E50" flood-opacity="0.15"/>
            </filter>

            <!-- Mitochondrion Symbol -->
            <g id="mitochondrion">
                <path d="M -25,-12 C -12,-25 25,-25 30,0 C 35,25 12,30 -12,25 C -30,20 -35,-5 -25,-12 Z" fill="#E74C3C" stroke="#c0392b" stroke-width="2"/>
                <path d="M -18,-6 L -8,6 L 0,-3 L 12,6 L 18,-3" fill="none" stroke="#f8f9fa" stroke-width="2" opacity="0.8"/>
            </g>

            <!-- DNA Symbol -->
            <g id="dna-strand">
                <path d="M -20,10 Q -10,-15 0,0 T 20,-10" fill="none" stroke="#FF6B6B" stroke-width="3"/>
                <path d="M -20,-10 Q -10,15 0,0 T 20,10" fill="none" stroke="#FF6B6B" stroke-width="3"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Header / Title -->
        <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="bold" fill="#2C3E50">The Dynamic Hallmarks of Life</text>
        <text x="400" y="65" text-anchor="middle" font-size="14" fill="#7f8c8d">Characteristics of Life (Class 11 Biology)</text>

        <!-- Dynamic Labels -->
        <g class="label-metabolism" transform="translate(150, 420)">
            <rect x="-110" y="-16" width="220" height="26" rx="13" fill="#F39C12" opacity="0.15"/>
            <text x="0" y="2" font-size="13" font-weight="bold" fill="#D68910" text-anchor="middle" dominant-baseline="middle">Metabolism: Glucose → ATP</text>
        </g>

        <g class="label-response" transform="translate(620, 100)">
            <rect x="-100" y="-16" width="200" height="26" rx="13" fill="#9B59B6" opacity="0.15"/>
            <text x="0" y="2" font-size="13" font-weight="bold" fill="#8E44AD" text-anchor="middle" dominant-baseline="middle">Irritability &amp; Response</text>
        </g>

        <g class="label-growth" transform="translate(400, 110)">
            <rect x="-110" y="-16" width="220" height="26" rx="13" fill="#2ECC71" opacity="0.15"/>
            <text x="0" y="2" font-size="13" font-weight="bold" fill="#27AE60" text-anchor="middle" dominant-baseline="middle">Growth &amp; Reproduction</text>
        </g>

        <!-- External Animated Elements -->
        <!-- Nutrients -->
        <g class="nutrient">
            <circle cx="-6" cy="-6" r="4" fill="#F39C12"/>
            <circle cx="6" cy="-4" r="4" fill="#F39C12"/>
            <circle cx="0" cy="6" r="4" fill="#F39C12"/>
            <text x="0" y="-12" font-family="Roboto Mono" font-size="10" font-weight="bold" fill="#F39C12" text-anchor="middle">C₆H₁₂O₆</text>
        </g>

        <!-- ATP -->
        <g class="atp">
            <polygon points="0,-14 4,-5 14,-5 6,3 9,14 0,7 -9,14 -6,3 -14,-5 -4,-5" fill="#FFD700"/>
            <text x="0" y="2" font-family="Roboto Mono" font-size="9" font-weight="bold" fill="#2C3E50" text-anchor="middle" dominant-baseline="middle">ATP</text>
        </g>

        <!-- Waste -->
        <g class="waste">
            <circle cx="-4" cy="-4" r="3" fill="#95A5A6"/>
            <circle cx="5" cy="3" r="3" fill="#95A5A6"/>
            <circle cx="-2" cy="6" r="3" fill="#95A5A6"/>
            <text x="0" y="-10" font-family="Roboto Mono" font-size="10" font-weight="bold" fill="#95A5A6" text-anchor="middle">CO₂</text>
        </g>

        <!-- Signal Molecule -->
        <g class="signal">
            <polygon points="0,-12 12,0 0,12 -12,0" fill="#9B59B6"/>
        </g>

        <!-- Main Cell Container -->
        <g class="cell-shift">
            <g class="cell-scale">
                
                <!-- Cell Membrane & Cytoplasm -->
                <path class="membrane" filter="url(#shadow)" stroke="#4A90D9" stroke-width="5" stroke-dasharray="10 5" />

                <!-- Receptor -->
                <path d="M 80,-100 C 90,-120 110,-120 120,-100" fill="none" stroke="#9B59B6" stroke-width="4" stroke-linecap="round"/>

                <!-- Mitochondria -->
                <g transform="translate(-60, 40)">
                    <use href="#mitochondrion" class="mito" />
                </g>
                <g transform="translate(60, -40)">
                    <use href="#mitochondrion" class="mito" />
                </g>

                <!-- Nucleus 1 (Original) -->
                <g class="nucleus-1">
                    <circle cx="0" cy="0" r="35" class="nucleus-body" stroke="#1A252F" stroke-width="2"/>
                    <use href="#dna-strand" />
                </g>

                <!-- Nucleus 2 (Copy for Reproduction) -->
                <g class="nucleus-2">
                    <circle cx="0" cy="0" r="35" class="nucleus-body" stroke="#1A252F" stroke-width="2"/>
                    <use href="#dna-strand" />
                </g>

                <!-- Static Label inside cell -->
                <text x="0" y="85" font-size="11" fill="#4A90D9" text-anchor="middle" font-weight="bold" opacity="0.7">Cellular Organization</text>

            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(630, 320)">
            <rect x="0" y="0" width="150" height="160" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" opacity="0.9"/>
            <text x="75" y="20" font-size="12" font-weight="bold" fill="#2C3E50" text-anchor="middle">Legend</text>
            
            <rect x="15" y="35" width="12" height="12" rx="2" fill="#4A90D9"/>
            <text x="35" y="45" font-size="11" fill="#2C3E50">Cell Membrane</text>

            <rect x="15" y="55" width="12" height="12" rx="2" fill="#2C3E50"/>
            <text x="35" y="65" font-size="11" fill="#2C3E50">Nucleus &amp; DNA</text>

            <rect x="15" y="75" width="12" height="12" rx="2" fill="#E74C3C"/>
            <text x="35" y="85" font-size="11" fill="#2C3E50">Mitochondria</text>

            <circle cx="21" cy="101" r="6" fill="#F39C12"/>
            <text x="35" y="105" font-size="11" fill="#2C3E50">Nutrients</text>

            <polygon points="21,-3 24,3 30,3 25,7 27,13 21,9 15,13 17,7 12,3 18,3" transform="translate(0, 98)" fill="#FFD700"/>
            <text x="35" y="125" font-size="11" fill="#2C3E50">Energy (ATP)</text>

            <polygon points="21,-6 27,0 21,6 15,0" transform="translate(0, 140)" fill="#9B59B6"/>
            <text x="35" y="145" font-size="11" fill="#2C3E50">Signal Molecule</text>
        </g>

    </svg>
</div>

</body>
</html>
