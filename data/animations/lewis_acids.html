<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lewis Acid Catalysis Animation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            aspect-ratio: 8 / 5;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: 100%;
        }
        
        /* --- Animations (10s Loop) --- */
        
        /* Global Scene Fade for looping */
        @keyframes scene-fade {
            0%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* Cl2 Approach and Cleavage */
        @keyframes cl-a-move {
            0%, 20% { transform: translate(300px, 50px); }
            35%, 70% { transform: translate(300px, 150px); }
            70%, 85% { transform: translate(250px, 150px); }
            85%, 100% { transform: translate(250px, 150px); }
        }
        @keyframes cl-b-move {
            0%, 20% { transform: translate(400px, 50px); }
            35%, 50% { transform: translate(400px, 150px); }
            50%, 70% { transform: translate(450px, 150px); }
            70%, 85% { transform: translate(550px, 150px); }
            85%, 100% { transform: translate(550px, 150px); }
        }

        /* Cl-Cl Bonds */
        @keyframes cl-cl-solid {
            0%, 20% { d: path("M 320 50 L 380 50"); opacity: 1; }
            35%, 49% { d: path("M 320 150 L 380 150"); opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes cl-cl-dashed {
            0%, 49% { opacity: 0; }
            50% { opacity: 1; d: path("M 320 150 L 380 150"); }
            70% { opacity: 1; d: path("M 320 150 L 430 150"); }
            71%, 100% { opacity: 0; }
        }

        /* AlCl3 Complex Movement */
        @keyframes alcl3-group-move {
            0%, 70% { transform: translate(0px, 0px); }
            70%, 85% { transform: translate(-50px, 0px); }
            85%, 100% { transform: translate(-50px, 0px); }
        }

        /* AlCl3 Geometry Shift (Planar to Tetrahedral) */
        @keyframes cl1-move {
            0%, 50% { transform: translate(180px, 270px); }
            70%, 100% { transform: translate(200px, 330px); }
        }
        @keyframes cl2-move {
            0%, 50% { transform: translate(370px, 310px); }
            70%, 100% { transform: translate(360px, 350px); }
        }
        @keyframes cl3-move {
            0%, 50% { transform: translate(370px, 230px); }
            70%, 100% { transform: translate(360px, 260px); }
        }
        @keyframes bond1-anim {
            0%, 50% { d: path("M 300 270 L 180 270"); }
            70%, 100% { d: path("M 300 270 L 200 330"); }
        }
        @keyframes bond2-anim {
            0%, 50% { d: path("M 300 270 L 360 305 L 365 315 Z"); }
            70%, 100% { d: path("M 300 270 L 350 340 L 360 350 Z"); }
        }
        @keyframes bond3-anim {
            0%, 50% { d: path("M 300 270 L 370 230"); }
            70%, 100% { d: path("M 300 270 L 360 260"); }
        }
        @keyframes al-cla-bond {
            0%, 49% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }

        /* Vacant p-orbital */
        @keyframes orbital-anim {
            0% { opacity: 0.1; }
            10% { opacity: 0.4; }
            20% { opacity: 0.1; }
            30% { opacity: 0.4; }
            40% { opacity: 0.1; }
            45% { opacity: 0.4; }
            50%, 100% { opacity: 0; }
        }

        /* Curly Arrow */
        @keyframes arrow-draw {
            0%, 35% { stroke-dashoffset: 200; opacity: 0; }
            36% { opacity: 1; stroke-dashoffset: 200; }
            45%, 49% { stroke-dashoffset: 0; opacity: 1; }
            50%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        /* Lone Pairs */
        @keyframes donate-lp {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Formal Charges */
        @keyframes delta-plus {
            0%, 49% { opacity: 0; }
            50%, 69% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }
        @keyframes full-plus {
            0%, 69% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }
        @keyframes delta-minus {
            0%, 49% { opacity: 0; }
            50%, 69% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }
        @keyframes full-minus {
            0%, 69% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }

        /* Dynamic Text Labels */
        @keyframes text1 {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes text2 {
            0%, 49% { opacity: 0; }
            50%, 69% { opacity: 1; }
            70%, 100% { opacity: 0; }
        }
        @keyframes text3 {
            0%, 69% { opacity: 0; }
            70%, 100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Atom Gradients -->
                <radialGradient id="al-grad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#E8E8E8"/>
                    <stop offset="100%" stop-color="#A0A0A0"/>
                </radialGradient>
                <radialGradient id="cl-grad" cx="35%" cy="35%" r="65%">
                    <stop offset="0%" stop-color="#88EE88"/>
                    <stop offset="100%" stop-color="#22AA22"/>
                </radialGradient>
                
                <!-- Drop Shadow -->
                <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.25"/>
                </filter>
                
                <!-- Arrowhead -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00"/>
                </marker>
            </defs>

            <!-- Static Header -->
            <text x="400" y="45" text-anchor="middle" font-size="26" font-weight="700" fill="#2b2d42">Lewis Acid: Electron Pair Acceptor</text>
            <line x1="250" y1="60" x2="550" y2="60" stroke="#e0e0e0" stroke-width="2"/>

            <!-- Legend -->
            <g transform="translate(20, 20)">
                <rect x="0" y="0" width="160" height="95" fill="#ffffff" stroke="#e9ecef" stroke-width="2" rx="6" filter="url(#shadow)"/>
                <circle cx="20" cy="25" r="8" fill="url(#al-grad)"/>
                <text x="38" y="30" font-size="12" font-weight="600" fill="#495057">Aluminum (Al)</text>
                <circle cx="20" cy="50" r="8" fill="url(#cl-grad)"/>
                <text x="38" y="55" font-size="12" font-weight="600" fill="#495057">Chlorine (Cl)</text>
                <path d="M 12 75 L 30 75" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
                <text x="38" y="80" font-size="12" font-weight="600" fill="#495057">Electron Flow</text>
            </g>

            <!-- Main Animation Scene -->
            <g style="animation: scene-fade 10s infinite;">
                
                <!-- AlCl3 Group -->
                <g style="animation: alcl3-group-move 10s infinite;">
                    
                    <!-- Vacant p-orbital -->
                    <g style="animation: orbital-anim 10s infinite;">
                        <ellipse cx="300" cy="210" rx="22" ry="55" fill="#7209B7" opacity="0.2"/>
                        <ellipse cx="300" cy="330" rx="22" ry="55" fill="#7209B7" opacity="0.2"/>
                        <text x="250" y="170" font-size="13" font-weight="600" fill="#7209B7" opacity="0.8">Vacant p-orbital</text>
                        <path d="M 250 175 L 280 190" stroke="#7209B7" stroke-width="1.5" opacity="0.8"/>
                    </g>

                    <!-- Al-Cl Bonds -->
                    <path style="animation: bond1-anim 10s infinite;" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
                    <path style="animation: bond2-anim 10s infinite;" fill="#404040"/>
                    <path style="animation: bond3-anim 10s infinite;" stroke="#404040" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>
                    <path d="M 300 270 L 300 170" stroke="#404040" stroke-width="4" stroke-linecap="round" style="animation: al-cla-bond 10s infinite;"/>

                    <!-- Al Atom -->
                    <circle cx="300" cy="270" r="24" fill="url(#al-grad)" filter="url(#shadow)"/>
                    <text x="300" y="275" text-anchor="middle" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#333">Al</text>

                    <!-- Cl Atoms in AlCl3 -->
                    <g style="animation: cl1-move 10s infinite;">
                        <circle cx="0" cy="0" r="20" fill="url(#cl-grad)" filter="url(#shadow)"/>
                        <text x="0" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff">Cl</text>
                    </g>
                    <g style="animation: cl2-move 10s infinite;">
                        <circle cx="0" cy="0" r="20" fill="url(#cl-grad)" filter="url(#shadow)"/>
                        <text x="0" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff">Cl</text>
                    </g>
                    <g style="animation: cl3-move 10s infinite;">
                        <circle cx="0" cy="0" r="20" fill="url(#cl-grad)" filter="url(#shadow)"/>
                        <text x="0" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff">Cl</text>
                    </g>

                    <!-- Formal Charges on Al -->
                    <g style="animation: delta-minus 10s infinite;" transform="translate(330, 250)">
                        <text font-size="20" font-weight="700" fill="#4444FF">&#948;&#8722;</text>
                    </g>
                    <g style="animation: full-minus 10s infinite;" transform="translate(335, 245)">
                        <circle cx="0" cy="-5" r="11" fill="#fff" stroke="#4444FF" stroke-width="2" filter="url(#shadow)"/>
                        <text x="0" y="1" text-anchor="middle" font-size="18" font-weight="700" fill="#4444FF">&#8722;</text>
                    </g>
                </g>

                <!-- Cl2 Group -->
                <!-- Cl-Cl Bonds -->
                <path style="animation: cl-cl-solid 10s infinite;" stroke="#404040" stroke-width="4" stroke-linecap="round"/>
                <path style="animation: cl-cl-dashed 10s infinite;" stroke="#404040" stroke-width="4" stroke-dasharray="6,6" stroke-linecap="round"/>

                <!-- Cl_a (Donating Chlorine) -->
                <g style="animation: cl-a-move 10s infinite;">
                    <circle cx="0" cy="0" r="20" fill="url(#cl-grad)" filter="url(#shadow)"/>
                    <text x="0" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff">Cl</text>
                    <!-- Lone Pairs -->
                    <g fill="#FFD700" stroke="#856500" stroke-width="1">
                        <circle cx="-23" cy="-9" r="3.5"/><circle cx="-23" cy="9" r="3.5"/> <!-- Left -->
                        <circle cx="-9" cy="-23" r="3.5"/><circle cx="9" cy="-23" r="3.5"/> <!-- Top -->
                        <g style="animation: donate-lp 10s infinite;">
                            <circle cx="-9" cy="23" r="3.5"/><circle cx="9" cy="23" r="3.5"/> <!-- Bottom (Donating) -->
                        </g>
                    </g>
                </g>

                <!-- Cl_b (Terminal Chlorine) -->
                <g style="animation: cl-b-move 10s infinite;">
                    <circle cx="0" cy="0" r="20" fill="url(#cl-grad)" filter="url(#shadow)"/>
                    <text x="0" y="5" text-anchor="middle" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#fff">Cl</text>
                    <!-- Lone Pairs -->
                    <g fill="#FFD700" stroke="#856500" stroke-width="1">
                        <circle cx="23" cy="-9" r="3.5"/><circle cx="23" cy="9" r="3.5"/> <!-- Right -->
                        <circle cx="-9" cy="-23" r="3.5"/><circle cx="9" cy="-23" r="3.5"/> <!-- Top -->
                        <circle cx="-9" cy="23" r="3.5"/><circle cx="9" cy="23" r="3.5"/> <!-- Bottom -->
                    </g>
                    <!-- Formal Charges on Terminal Cl -->
                    <g style="animation: delta-plus 10s infinite;" transform="translate(25, -20)">
                        <text font-size="20" font-weight="700" fill="#FF4444">&#948;+</text>
                    </g>
                    <g style="animation: full-plus 10s infinite;" transform="translate(25, -20)">
                        <circle cx="0" cy="-5" r="11" fill="#fff" stroke="#FF4444" stroke-width="2" filter="url(#shadow)"/>
                        <text x="0" y="1" text-anchor="middle" font-size="16" font-weight="700" fill="#FF4444">+</text>
                    </g>
                </g>

                <!-- Curly Arrow (Electron Flow) -->
                <path d="M 295 170 C 230 170, 230 240, 285 260" fill="none" stroke="#F77F00" stroke-width="3.5" marker-end="url(#arrowhead)" style="animation: arrow-draw 10s infinite; stroke-dasharray: 200;"/>

            </g>

            <!-- Dynamic Labels -->
            <g transform="translate(400, 450)" text-anchor="middle">
                <!-- Text 1: Initial State -->
                <g style="animation: text1 10s infinite;">
                    <text y="0" font-size="20" font-weight="600" fill="#495057">
                        Lewis Acid (AlCl<tspan baseline-shift="sub" font-size="0.7em">3</tspan>) + Lewis Base (Cl<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)
                    </text>
                    <text y="25" font-size="14" fill="#6c757d">Electron Pair Acceptor approaches Electron Pair Donor</text>
                </g>
                
                <!-- Text 2: Complex Formation -->
                <g style="animation: text2 10s infinite;">
                    <text y="0" font-size="20" font-weight="600" fill="#7209B7">
                        Formation of Lewis Acid-Base Adduct
                    </text>
                    <text y="25" font-size="14" fill="#6c757d">Aluminum transitions from planar (sp²) to tetrahedral (sp³)</text>
                </g>

                <!-- Text 3: Electrophile Generation -->
                <g style="animation: text3 10s infinite;">
                    <text y="0" font-size="20" font-weight="600" fill="#D90429">
                        Generated Electrophile: Cl<tspan baseline-shift="super" font-size="0.7em">+</tspan>
                    </text>
                    <text y="25" font-size="14" fill="#6c757d">Bond cleaves to form Chloronium ion and [AlCl<tspan baseline-shift="sub" font-size="0.7em">4</tspan>]<tspan baseline-shift="super" font-size="0.7em">&#8722;</tspan> complex</text>
                </g>
            </g>
        </svg>
    </div>

</body>
</html>
