<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hydrogen Bonding in Carboxylic Acids</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
        }
        
        /* Typography */
        .title { font-size: 26px; font-weight: 700; fill: #2D3436; text-anchor: middle; }
        .subtitle { font-size: 18px; font-weight: 600; fill: #00A8E8; text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 15px; fill: #FFFFFF; text-anchor: middle; dominant-baseline: central; }
        .charge { font-size: 14px; font-weight: 600; fill: #636E72; text-anchor: middle; dominant-baseline: central; }
        .label { font-size: 13px; font-weight: 600; fill: #2D3436; }
        .hb-label { font-size: 14px; font-weight: 600; fill: #00A8E8; text-anchor: middle; }
        .dimer-text { font-size: 18px; font-weight: 700; fill: #7209B7; text-anchor: middle; dominant-baseline: central; }
        
        /* Chemical Elements */
        .bond { stroke: #2D3436; stroke-width: 4px; stroke-linecap: round; }
        .h-bond { 
            stroke: #00A8E8; 
            stroke-width: 3px; 
            stroke-dasharray: 8 6; 
            stroke-linecap: round; 
            fill: none; 
        }
        .atom-c { fill: #404040; }
        .atom-o { fill: #FF4444; }
        .atom-h { fill: #CCCCCC; }
        
        /* Animations */
        #acid-a { animation: move-acid-a 12s infinite ease-in-out; }
        #acid-b { animation: move-acid-b 12s infinite ease-in-out; }
        #water-1 { animation: move-water-1 12s infinite ease-in-out; }
        #water-2 { animation: move-water-2 12s infinite ease-in-out; }
        
        .phase1-element { animation: fade-phase1 12s infinite ease-in-out; }
        .phase3-element { animation: fade-phase3 12s infinite ease-in-out; }
        
        .h-bond-anim { animation: dash-flow 1s linear infinite; }
        .charge-pulse { animation: pulse-opacity 2s infinite ease-in-out; }

        @keyframes move-acid-a {
            0%, 35% { transform: translate(400px, 260px); }
            45%, 90% { transform: translate(280px, 260px); }
            100% { transform: translate(400px, 260px); }
        }

        @keyframes move-acid-b {
            0%, 40% { transform: translate(700px, 260px); opacity: 0; }
            48%, 90% { transform: translate(520px, 260px); opacity: 1; }
            98%, 100% { transform: translate(700px, 260px); opacity: 0; }
        }

        @keyframes move-water-1 {
            0%, 5% { transform: translateY(-40px); opacity: 0; }
            15%, 35% { transform: translateY(0); opacity: 1; }
            42%, 100% { transform: translateY(-40px); opacity: 0; }
        }

        @keyframes move-water-2 {
            0%, 5% { transform: translateX(40px); opacity: 0; }
            15%, 35% { transform: translateX(0); opacity: 1; }
            42%, 100% { transform: translateX(40px); opacity: 0; }
        }

        @keyframes fade-phase1 {
            0%, 15% { opacity: 0; }
            20%, 35% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }

        @keyframes fade-phase3 {
            0%, 50% { opacity: 0; }
            55%, 88% { opacity: 1; }
            93%, 100% { opacity: 0; }
        }

        @keyframes dash-flow {
            to { stroke-dashoffset: -14; }
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Drop Shadow for 3D effect -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.15" />
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- UI & Labels -->
    <text x="400" y="45" class="title">Hydrogen Bonding: Carboxylic Acids</text>
    
    <text x="400" y="80" class="subtitle phase1-element">Phase 1: Intermolecular H-bonding with Water</text>
    <text x="400" y="80" class="subtitle phase3-element">Phase 2: Cyclic Dimerization</text>

    <!-- Legend -->
    <g transform="translate(30, 380)">
        <rect x="0" y="0" width="160" height="100" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2"/>
        <text x="80" y="20" class="label" text-anchor="middle">Legend</text>
        
        <circle cx="20" cy="40" r="6" class="atom-c" />
        <text x="35" y="44" class="label">Carbon</text>
        
        <circle cx="90" cy="40" r="6" class="atom-o" />
        <text x="105" y="44" class="label">Oxygen</text>
        
        <circle cx="20" cy="65" r="6" class="atom-h" />
        <text x="35" y="69" class="label">Hydrogen</text>
        
        <line x1="15" y1="85" x2="35" y2="85" class="h-bond" stroke-width="2" />
        <text x="45" y="89" class="label">H-Bond</text>
    </g>

    <!-- Phase 1: Water H-Bonds -->
    <g class="phase1-element">
        <!-- H-bond to Carbonyl -->
        <line x1="435" y1="126" x2="435" y2="183" class="h-bond h-bond-anim" />
        <text x="495" y="155" class="hb-label">Hydrogen Bond</text>
        <!-- H-bond to Hydroxyl -->
        <line x1="507" y1="320.6" x2="564" y2="320.6" class="h-bond h-bond-anim" />
        <text x="535" y="345" class="hb-label">Hydrogen Bond</text>
    </g>

    <!-- Phase 3: Dimer H-Bonds -->
    <g class="phase3-element">
        <!-- Top H-bond -->
        <line x1="331" y1="199.4" x2="413" y2="199.4" class="h-bond h-bond-anim" />
        <!-- Bottom H-bond -->
        <line x1="387" y1="320.6" x2="469" y2="320.6" class="h-bond h-bond-anim" />
        
        <text x="400" y="185" class="hb-label">Hydrogen Bonds</text>
        <text x="400" y="260" class="dimer-text" filter="url(#glow)">Cyclic Dimer</text>
    </g>

    <!-- Molecules Layer -->
    <g filter="url(#shadow)">
        
        <!-- Acetic Acid A (Left/Center) -->
        <g id="acid-a">
            <!-- Covalent Bonds -->
            <line x1="-70" y1="0" x2="0" y2="0" class="bond" />
            <!-- Double Bond (C=O) -->
            <line x1="-2.5" y1="-4.3" x2="32.5" y2="-64.9" class="bond" />
            <line x1="2.5" y1="4.3" x2="37.5" y2="-56.3" class="bond" />
            <!-- Single Bond (C-O) -->
            <line x1="0" y1="0" x2="35" y2="60.6" class="bond" />
            <!-- Single Bond (O-H) -->
            <line x1="35" y1="60.6" x2="95" y2="60.6" class="bond" />

            <!-- Atoms -->
            <circle cx="-70" cy="0" r="22" class="atom-c" />
            <text x="-70" y="0" class="formula">CH<tspan dy="4" font-size="11">3</tspan></text>
            
            <circle cx="0" cy="0" r="18" class="atom-c" />
            
            <circle cx="35" cy="-60.6" r="16" class="atom-o" />
            <circle cx="35" cy="60.6" r="16" class="atom-o" />
            <circle cx="95" cy="60.6" r="12" class="atom-h" />

            <!-- Partial Charges -->
            <text x="58" y="-75" class="charge charge-pulse">δ-</text>
            <text x="18" y="85" class="charge charge-pulse">δ-</text>
            <text x="115" y="45" class="charge charge-pulse">δ+</text>
        </g>

        <!-- Acetic Acid B (Right, Phase 3) -->
        <g id="acid-b">
            <!-- Covalent Bonds -->
            <line x1="70" y1="0" x2="0" y2="0" class="bond" />
            <!-- Double Bond (C=O) -->
            <line x1="2.5" y1="4.3" x2="-32.5" y2="64.9" class="bond" />
            <line x1="-2.5" y1="-4.3" x2="-37.5" y2="56.3" class="bond" />
            <!-- Single Bond (C-O) -->
            <line x1="0" y1="0" x2="-35" y2="-60.6" class="bond" />
            <!-- Single Bond (O-H) -->
            <line x1="-35" y1="-60.6" x2="-95" y2="-60.6" class="bond" />

            <!-- Atoms -->
            <circle cx="70" cy="0" r="22" class="atom-c" />
            <text x="70" y="0" class="formula">CH<tspan dy="4" font-size="11">3</tspan></text>
            
            <circle cx="0" cy="0" r="18" class="atom-c" />
            
            <circle cx="-35" cy="60.6" r="16" class="atom-o" />
            <circle cx="-35" cy="-60.6" r="16" class="atom-o" />
            <circle cx="-95" cy="-60.6" r="12" class="atom-h" />

            <!-- Partial Charges -->
            <text x="-58" y="75" class="charge charge-pulse">δ-</text>
            <text x="-18" y="-85" class="charge charge-pulse">δ-</text>
            <text x="-115" y="-45" class="charge charge-pulse">δ+</text>
        </g>

        <!-- Water Molecule 1 (Top, Phase 1) -->
        <g id="water-1">
            <line x1="435" y1="70" x2="435" y2="110" class="bond" />
            <line x1="435" y1="70" x2="465" y2="50" class="bond" />
            
            <circle cx="435" cy="70" r="16" class="atom-o" />
            <circle cx="435" cy="110" r="12" class="atom-h" />
            <circle cx="465" cy="50" r="12" class="atom-h" />
            
            <text x="410" y="60" class="charge charge-pulse">δ-</text>
            <text x="415" y="125" class="charge charge-pulse">δ+</text>
        </g>

        <!-- Water Molecule 2 (Right, Phase 1) -->
        <g id="water-2">
            <line x1="580" y1="320.6" x2="610" y2="295" class="bond" />
            <line x1="580" y1="320.6" x2="610" y2="346" class="bond" />
            
            <circle cx="580" cy="320.6" r="16" class="atom-o" />
            <circle cx="610" cy="295" r="12" class="atom-h" />
            <circle cx="610" cy="346" r="12" class="atom-h" />
            
            <text x="580" y="295" class="charge charge-pulse">δ-</text>
            <text x="635" y="300" class="charge charge-pulse">δ+</text>
        </g>

    </g>
</svg>

</body>
</html>
