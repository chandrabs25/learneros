<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Three Pillars of Biotechnology</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Typography */
        .title { font-weight: 700; font-size: 26px; fill: #2C3E50; text-anchor: middle; }
        .stage-title { font-weight: 700; font-size: 16px; fill: #2C3E50; text-anchor: middle; }
        .stage-sub { font-weight: 400; font-size: 13px; fill: #7F8C8D; text-anchor: middle; }
        .callout { font-family: 'Roboto Mono', monospace; font-size: 12px; font-weight: 700; fill: #E74C3C; }
        .legend-text { font-size: 11px; fill: #34495E; }
        .sensor-text { font-weight: 700; font-size: 11px; fill: #ffffff; text-anchor: middle; }

        /* Animations */
        /* 1. Gene Insertion (0-4s of 15s loop) */
        .gene {
            animation: gene-insert 15s ease-in-out infinite;
        }
        @keyframes gene-insert {
            0%, 5% { transform: translate(35px, -35px); opacity: 0; }
            10% { transform: translate(35px, -35px); opacity: 1; }
            20%, 95% { transform: translate(0, 0); opacity: 1; }
            96%, 100% { transform: translate(0, 0); opacity: 0; }
        }

        /* Ligation Glow */
        .glow {
            transform-origin: 171px 120px;
            animation: ligation-glow 15s ease-in-out infinite;
        }
        @keyframes ligation-glow {
            0%, 18% { opacity: 0; transform: scale(0.5); }
            20% { opacity: 1; transform: scale(1.5); }
            24%, 100% { opacity: 0; transform: scale(1); }
        }

        /* 2. Transformation & Scaling (4-8s) */
        .recombinant-plasmid {
            animation: plasmid-enter 15s ease-in-out infinite;
        }
        @keyframes plasmid-enter {
            0%, 25% { transform: translate(0, 0) scale(1); opacity: 1; }
            35%, 95% { transform: translate(-20px, 160px) scale(0.4); opacity: 1; }
            96%, 100% { transform: translate(-20px, 160px) scale(0.4); opacity: 0; }
        }

        .extra-cell {
            animation: cell-multiply 15s ease-in-out infinite;
        }
        @keyframes cell-multiply {
            0%, 38% { opacity: 0; }
            45%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .catalyst-group {
            animation: cells-move 15s ease-in-out infinite;
        }
        @keyframes cells-move {
            0%, 45% { transform: translateX(0); opacity: 1; }
            55% { transform: translateX(240px); opacity: 0; }
            100% { transform: translateX(240px); opacity: 0; }
        }

        .cell-float {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* 3. Bioprocessing (Continuous) */
        .impeller-blade {
            animation: spin-impeller 1.5s linear infinite;
        }
        @keyframes spin-impeller {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(-1); }
            100% { transform: scaleX(1); }
        }

        .bubble {
            animation: bubble-rise 3s ease-in infinite;
        }
        .b1 { animation-delay: 0s; }
        .b2 { animation-delay: 0.7s; }
        .b3 { animation-delay: 1.4s; }
        .b4 { animation-delay: 2.1s; }
        .b5 { animation-delay: 0.4s; }
        .b6 { animation-delay: 1.8s; }
        @keyframes bubble-rise {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { opacity: 0.7; }
            80% { opacity: 0.7; }
            100% { transform: translateY(-240px) scale(1.2); opacity: 0; }
        }

        .sensor-light {
            animation: pulse-light 2s ease-in-out infinite;
        }
        @keyframes pulse-light {
            0%, 100% { fill: #E74C3C; filter: none; }
            50% { fill: #2ECC71; filter: drop-shadow(0 0 4px #2ECC71); }
        }

        /* 4. Downstream Processing (12-15s) */
        .protein {
            animation: protein-flow 15s linear infinite;
        }
        .p1 { animation-delay: 0s; }
        .p2 { animation-delay: 0.3s; }
        .p3 { animation-delay: 0.6s; }
        @keyframes protein-flow {
            0%, 75% { opacity: 0; transform: translate(600px, 200px); }
            76% { opacity: 1; transform: translate(600px, 200px); }
            80% { opacity: 1; transform: translate(790px, 200px); }
            84% { opacity: 1; transform: translate(790px, 400px); }
            86% { opacity: 1; transform: translate(850px, 400px); }
            88% { opacity: 0; transform: translate(850px, 460px); }
            100% { opacity: 0; transform: translate(850px, 460px); }
        }

        .vial-liquid {
            transform-origin: 850px 478px;
            animation: vial-fill 15s ease-in-out infinite;
        }
        @keyframes vial-fill {
            0%, 84% { transform: scaleY(0); opacity: 1; }
            94% { transform: scaleY(1); opacity: 1; }
            96%, 100% { transform: scaleY(1); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 650" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing the three pillars of biotechnology: Genetic Engineering, Bioprocessing, and Downstream Processing.">
        <title>Principles of Biotechnology: From Lab to Industry</title>
        <desc>A continuous animation showing a gene being inserted into a plasmid, the plasmid entering an E. coli cell, the cell multiplying and entering a bioreactor, and finally purified proteins flowing into a vial.</desc>

        <!-- Definitions (Gradients, Markers, Filters) -->
        <defs>
            <linearGradient id="tankGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#BDC3C7" />
                <stop offset="20%" stop-color="#ECF0F1" />
                <stop offset="80%" stop-color="#D5DBDB" />
                <stop offset="100%" stop-color="#95A5A6" />
            </linearGradient>
            <linearGradient id="colGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#E8F4FD" />
                <stop offset="50%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#BDC3C7" />
            </linearGradient>
            <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
                <stop offset="50%" stop-color="#F1C40F" stop-opacity="0.8" />
                <stop offset="100%" stop-color="#F1C40F" stop-opacity="0" />
            </radialGradient>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" />
            </marker>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background Grid (Subtle) -->
        <g stroke="#ECF0F1" stroke-width="1" opacity="0.5">
            <line x1="0" y1="150" x2="1000" y2="150" />
            <line x1="0" y1="300" x2="1000" y2="300" />
            <line x1="0" y1="450" x2="1000" y2="450" />
            <line x1="333" y1="0" x2="333" y2="650" />
            <line x1="666" y1="0" x2="666" y2="650" />
        </g>

        <!-- Title & Legend -->
        <text x="500" y="50" class="title">Principles of Biotechnology: From Lab to Industry</text>
        
        <g transform="translate(820, 20)">
            <rect x="0" y="0" width="150" height="90" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
            <text x="75" y="18" font-weight="700" font-size="11" fill="#2C3E50" text-anchor="middle">Legend</text>
            <circle cx="15" cy="35" r="5" fill="#FF6B6B"/> <text x="28" y="39" class="legend-text">Gene of Interest</text>
            <circle cx="15" cy="55" r="5" fill="#2C3E50"/> <text x="28" y="59" class="legend-text">Plasmid Vector</text>
            <circle cx="15" cy="75" r="5" fill="#98D8C8"/> <text x="28" y="79" class="legend-text">Target Protein</text>
        </g>

        <!-- Transition Arrows -->
        <path d="M 280 300 L 370 300" fill="none" stroke="#7F8C8D" stroke-width="5" marker-end="url(#arrow)"/>
        <path d="M 630 300 L 720 300" fill="none" stroke="#7F8C8D" stroke-width="5" marker-end="url(#arrow)"/>

        <!-- ==========================================
             STAGE 1: THE CATALYST (GENETIC ENGINEERING)
             ========================================== -->
        <g class="catalyst-group">
            <g class="cell-float">
                <!-- Extra Cells (Fade in during multiplication) -->
                <g class="extra-cell" opacity="0">
                    <rect x="50" y="230" width="140" height="70" rx="35" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" opacity="0.5"/>
                    <path d="M 70 265 Q 90 240 110 265 T 140 250 T 170 265" fill="none" stroke="#AAB7B8" stroke-width="2" opacity="0.5"/>
                </g>
                <g class="extra-cell" opacity="0">
                    <rect x="110" y="290" width="140" height="70" rx="35" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" opacity="0.8"/>
                    <path d="M 130 325 Q 150 300 170 325 T 200 310 T 230 325" fill="none" stroke="#AAB7B8" stroke-width="2" opacity="0.8"/>
                </g>

                <!-- Main E. coli Cell -->
                <g class="main-cell">
                    <rect x="80" y="260" width="140" height="70" rx="35" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" filter="url(#shadow)"/>
                    <!-- Chromosomal DNA -->
                    <path d="M 100 295 Q 115 270 125 295 T 145 285 T 160 305 T 180 290" fill="none" stroke="#AAB7B8" stroke-width="2.5" stroke-linecap="round"/>
                </g>
            </g>

            <!-- Recombinant Plasmid (Moves into cell) -->
            <g class="recombinant-plasmid">
                <!-- Ligation Glow Effect -->
                <circle cx="171" cy="120" r="18" fill="url(#glowGrad)" class="glow"/>
                
                <!-- Plasmid Vector (Gap at top right: -30 to 30 degrees) -->
                <!-- Center: 150, 120. Radius: 25. -->
                <path d="M 171.6 107.5 A 25 25 0 1 0 171.6 132.5" fill="none" stroke="#2C3E50" stroke-width="6" stroke-linecap="round"/>
                
                <!-- Gene of Interest (Inserts into gap) -->
                <path d="M 171.6 132.5 A 25 25 0 0 0 171.6 107.5" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" class="gene"/>
            </g>
        </g>

        <!-- Stage 1 Labels -->
        <text x="150" y="550" class="stage-title">I. Providing the Best Catalyst</text>
        <text x="150" y="570" class="stage-sub">rDNA &amp; Enzyme Optimization</text>
        
        <!-- Callout: Recombinant DNA -->
        <text x="150" y="70" class="callout">Recombinant DNA</text>
        <line x1="150" y1="75" x2="150" y2="90" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3 3"/>


        <!-- ==========================================
             STAGE 2: THE BIOREACTOR (OPTIMUM CONDITIONS)
             ========================================== -->
        <g class="bioreactor-group">
            <!-- Tank Back -->
            <rect x="400" y="150" width="200" height="300" rx="20" fill="url(#tankGrad)" stroke="#7F8C8D" stroke-width="4" filter="url(#shadow)"/>
            
            <!-- Top Cap & Motor -->
            <path d="M 400 170 Q 500 130 600 170" fill="#BDC3C7" stroke="#7F8C8D" stroke-width="4"/>
            <rect x="475" y="100" width="50" height="40" rx="4" fill="#34495E"/>
            <rect x="490" y="90" width="20" height="10" rx="2" fill="#7F8C8D"/>

            <!-- Impeller Shaft -->
            <line x1="500" y1="140" x2="500" y2="420" stroke="#2C3E50" stroke-width="6"/>

            <!-- Impeller Blades (Animated) -->
            <g style="transform-origin: 500px 220px;" class="impeller-blade">
                <path d="M 440 210 L 560 210 L 540 230 L 460 230 Z" fill="#2C3E50"/>
            </g>
            <g style="transform-origin: 500px 310px;" class="impeller-blade">
                <path d="M 440 300 L 560 300 L 540 320 L 460 320 Z" fill="#2C3E50"/>
            </g>
            <g style="transform-origin: 500px 400px;" class="impeller-blade">
                <path d="M 440 390 L 560 390 L 540 410 L 460 410 Z" fill="#2C3E50"/>
            </g>

            <!-- Sparger & Bubbles -->
            <line x1="430" y1="435" x2="570" y2="435" stroke="#7F8C8D" stroke-width="6" stroke-linecap="round"/>
            <circle cx="440" cy="435" r="2" fill="#FFFFFF"/>
            <circle cx="470" cy="435" r="2" fill="#FFFFFF"/>
            <circle cx="500" cy="435" r="2" fill="#FFFFFF"/>
            <circle cx="530" cy="435" r="2" fill="#FFFFFF"/>
            <circle cx="560" cy="435" r="2" fill="#FFFFFF"/>

            <!-- Animated Bubbles -->
            <circle cx="445" cy="430" r="5" fill="#FFFFFF" class="bubble b1"/>
            <circle cx="475" cy="430" r="4" fill="#FFFFFF" class="bubble b2"/>
            <circle cx="505" cy="430" r="6" fill="#FFFFFF" class="bubble b3"/>
            <circle cx="535" cy="430" r="4" fill="#FFFFFF" class="bubble b4"/>
            <circle cx="555" cy="430" r="5" fill="#FFFFFF" class="bubble b5"/>
            <circle cx="485" cy="430" r="3" fill="#FFFFFF" class="bubble b6"/>

            <!-- Tank Glass Overlay -->
            <rect x="410" y="170" width="180" height="270" rx="10" fill="#E8F4FD" opacity="0.25"/>
            <!-- Glass Reflection -->
            <path d="M 420 180 L 450 180 L 450 430 L 420 430 Z" fill="#FFFFFF" opacity="0.15"/>

            <!-- Sensors -->
            <!-- pH Sensor -->
            <rect x="330" y="240" width="70" height="26" rx="4" fill="#34495E" filter="url(#shadow)"/>
            <line x1="400" y1="253" x2="415" y2="253" stroke="#34495E" stroke-width="4"/>
            <text x="365" y="257" class="sensor-text">pH</text>
            <circle cx="345" cy="253" r="4" class="sensor-light"/>
            
            <!-- Temp Sensor -->
            <rect x="330" y="330" width="70" height="26" rx="4" fill="#34495E" filter="url(#shadow)"/>
            <line x1="400" y1="343" x2="415" y2="343" stroke="#34495E" stroke-width="4"/>
            <text x="365" y="347" class="sensor-text">Temp</text>
            <circle cx="345" cy="343" r="4" class="sensor-light"/>
        </g>

        <!-- Stage 2 Labels -->
        <text x="500" y="550" class="stage-title">II. Creating Optimum Conditions</text>
        <text x="500" y="570" class="stage-sub">Bioprocess Engineering</text>

        <!-- Callout: Impeller -->
        <text x="630" y="225" class="callout">Impeller</text>
        <line x1="625" y1="220" x2="570" y2="220" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3 3"/>


        <!-- ==========================================
             STAGE 3: DOWNSTREAM PROCESSING
             ========================================== -->
        <!-- Pipes -->
        <path d="M 600 200 L 760 200" fill="none" stroke="#BDC3C7" stroke-width="10"/>
        <path d="M 600 200 L 760 200" fill="none" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4 4"/>
        
        <path d="M 790 380 L 790 400 L 850 400 L 850 415" fill="none" stroke="#BDC3C7" stroke-width="10"/>
        <path d="M 790 380 L 790 400 L 850 400 L 850 415" fill="none" stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4 4"/>

        <!-- Purification Column -->
        <g class="column-group">
            <rect x="760" y="150" width="60" height="230" rx="10" fill="url(#colGrad)" stroke="#7F8C8D" stroke-width="4" filter="url(#shadow)"/>
            <!-- Resin Beds -->
            <line x1="760" y1="230" x2="820" y2="230" stroke="#95A5A6" stroke-width="3" opacity="0.6"/>
            <line x1="760" y1="260" x2="820" y2="260" stroke="#95A5A6" stroke-width="3" opacity="0.6"/>
            <line x1="760" y1="290" x2="820" y2="290" stroke="#95A5A6" stroke-width="3" opacity="0.6"/>
            <line x1="760" y1="320" x2="820" y2="320" stroke="#95A5A6" stroke-width="3" opacity="0.6"/>
            <line x1="760" y1="350" x2="820" y2="350" stroke="#95A5A6" stroke-width="3" opacity="0.6"/>
        </g>

        <!-- Product Vial -->
        <g class="vial-group">
            <!-- Liquid Fill (Animated) -->
            <rect x="832" y="422" width="36" height="56" rx="4" fill="#98D8C8" class="vial-liquid"/>
            
            <!-- Vial Glass Body -->
            <rect x="830" y="420" width="40" height="60" rx="6" fill="none" stroke="#BDC3C7" stroke-width="4" filter="url(#shadow)"/>
            
            <!-- Vial Cap -->
            <rect x="825" y="410" width="50" height="10" rx="3" fill="#E74C3C"/>
            <rect x="835" y="405" width="30" height="5" rx="2" fill="#C0392B"/>
        </g>

        <!-- Flowing Proteins (Animated) -->
        <circle cx="0" cy="0" r="6" fill="#98D8C8" class="protein p1"/>
        <circle cx="0" cy="0" r="6" fill="#98D8C8" class="protein p2"/>
        <circle cx="0" cy="0" r="6" fill="#98D8C8" class="protein p3"/>

        <!-- Stage 3 Labels -->
        <text x="850" y="550" class="stage-title">III. Downstream Processing</text>
        <text x="850" y="570" class="stage-sub">Purification &amp; Preservation</text>

        <!-- Callout: Purified Protein -->
        <text x="850" y="515" class="callout" text-anchor="middle">Purified Protein</text>
        <line x1="850" y1="500" x2="850" y2="485" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3 3"/>

    </svg>
</div>

</body>
</html>
