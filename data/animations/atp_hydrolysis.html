<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Mechanism of ATP Hydrolysis in Muscle Contraction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        /* Animations */
        .myosin-head {
            animation: myosin-anim 8s ease-in-out infinite;
            transform-origin: 0 0;
        }

        .actin-track {
            animation: slide-actin 8s ease-in-out infinite;
        }

        .atp-molecule {
            animation: atp-anim 8s ease-in-out infinite;
        }

        .adp-molecule {
            animation: adp-anim 8s ease-in-out infinite;
        }

        .pi-molecule {
            animation: pi-anim 8s ease-in-out infinite;
        }

        .label-stage-1 { animation: text-stage-1 8s infinite; }
        .label-stage-2 { animation: text-stage-2 8s infinite; }
        .label-stage-3 { animation: text-stage-3 8s infinite; }
        .label-stage-4 { animation: text-stage-4 8s infinite; }

        /* Keyframes */
        @keyframes myosin-anim {
            0% { transform: translate(400px, 370px) rotate(-27deg); }
            10% { transform: translate(400px, 370px) rotate(-27deg); }
            20% { transform: translate(400px, 400px) rotate(-27deg); }
            40% { transform: translate(400px, 400px) rotate(27deg); }
            50% { transform: translate(400px, 400px) rotate(27deg); }
            60% { transform: translate(400px, 370px) rotate(27deg); }
            75% { transform: translate(400px, 370px) rotate(27deg); }
            87.5% { transform: translate(400px, 393px) rotate(0deg); }
            100% { transform: translate(400px, 370px) rotate(-27deg); }
        }

        @keyframes slide-actin {
            0%, 75% { transform: translateX(-4px); }
            100% { transform: translateX(-206px); }
        }

        @keyframes atp-anim {
            0% { opacity: 0; transform: translate(-120px, -250px) scale(1); }
            2% { opacity: 1; transform: translate(-120px, -250px) scale(1); }
            10% { opacity: 1; transform: translate(25px, -140px) scale(1); }
            24.9% { opacity: 1; transform: translate(25px, -140px) scale(1); }
            25%, 100% { opacity: 0; transform: translate(25px, -140px) scale(1.3); }
        }

        @keyframes adp-anim {
            0%, 24.9% { opacity: 0; transform: translate(20px, -140px); }
            25% { opacity: 1; transform: translate(20px, -140px); }
            85% { opacity: 1; transform: translate(20px, -140px); }
            95%, 100% { opacity: 0; transform: translate(120px, -60px); }
        }

        @keyframes pi-anim {
            0%, 24.9% { opacity: 0; transform: translate(45px, -150px); }
            25% { opacity: 1; transform: translate(45px, -150px); }
            75% { opacity: 1; transform: translate(45px, -150px); }
            85%, 100% { opacity: 0; transform: translate(140px, -240px); }
        }

        @keyframes text-stage-1 {
            0%, 9%, 26%, 100% { opacity: 0; }
            10%, 25% { opacity: 1; }
        }
        @keyframes text-stage-2 {
            0%, 24%, 51%, 100% { opacity: 0; }
            25%, 50% { opacity: 1; }
        }
        @keyframes text-stage-3 {
            0%, 49%, 76%, 100% { opacity: 0; }
            50%, 75% { opacity: 1; }
        }
        @keyframes text-stage-4 {
            0%, 10% { opacity: 1; }
            11%, 74% { opacity: 0; }
            75%, 100% { opacity: 1; }
        }

        .sci-font {
            font-family: 'Roboto Mono', monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">ATP Hydrolysis: The Cross-Bridge Cycle</title>
        <desc id="svg-desc">Animated diagram showing the molecular mechanism of muscle contraction. ATP binds to the myosin head causing detachment from actin. ATP hydrolyzes to ADP and Pi, cocking the myosin head. The head binds to a new actin site. Pi and ADP release, causing the power stroke that slides the actin filament.</desc>

        <defs>
            <!-- Glowing effect for ATP -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Actin Repeating Unit (202px wide) -->
            <g id="actin-unit">
                <!-- Back row of actin subunits -->
                <circle cx="0" cy="140" r="20" fill="#7AB8A8"/>
                <circle cx="40.4" cy="140" r="20" fill="#7AB8A8"/>
                <circle cx="80.8" cy="140" r="20" fill="#7AB8A8"/>
                <circle cx="121.2" cy="140" r="20" fill="#7AB8A8"/>
                <circle cx="161.6" cy="140" r="20" fill="#7AB8A8"/>
                
                <!-- Front row of actin subunits -->
                <circle cx="20.2" cy="160" r="20" fill="#98D8C8"/>
                <circle cx="60.6" cy="160" r="20" fill="#98D8C8"/>
                <circle cx="101.0" cy="160" r="20" fill="#98D8C8"/>
                <circle cx="141.4" cy="160" r="20" fill="#98D8C8"/>
                <circle cx="181.8" cy="160" r="20" fill="#98D8C8"/>

                <!-- Myosin binding sites -->
                <circle cx="20.2" cy="172" r="4" fill="#2C3E50"/>
                <circle cx="60.6" cy="172" r="4" fill="#2C3E50"/>
                <circle cx="101.0" cy="172" r="4" fill="#2C3E50"/>
                <circle cx="141.4" cy="172" r="4" fill="#2C3E50"/>
                <circle cx="181.8" cy="172" r="4" fill="#2C3E50"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">ATP Hydrolysis: The Cross-Bridge Cycle</text>

        <!-- Legend -->
        <g transform="translate(20, 20)">
            <rect width="130" height="105" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" opacity="0.9"/>
            <circle cx="20" cy="25" r="6" fill="#98D8C8"/>
            <text x="35" y="29" font-size="12" fill="#2C3E50">Actin</text>
            
            <circle cx="20" cy="45" r="6" fill="#F39C12"/>
            <text x="35" y="49" font-size="12" fill="#2C3E50">Myosin</text>
            
            <circle cx="20" cy="65" r="6" fill="#FFD700"/>
            <text x="35" y="69" font-size="12" fill="#2C3E50">ATP</text>
            
            <circle cx="20" cy="85" r="6" fill="#FF6B6B"/>
            <text x="35" y="89" font-size="12" fill="#2C3E50">ADP / P<tspan dy="2" font-size="9">i</tspan></text>
        </g>

        <!-- Dynamic Status Box -->
        <g transform="translate(520, 20)">
            <rect width="260" height="70" rx="8" fill="#ffffff" stroke="#4A90D9" stroke-width="2" />
            
            <g class="label-stage-1">
                <text x="130" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Stage 1: Detachment</text>
                <text x="130" y="52" font-size="12" text-anchor="middle" fill="#2C3E50">ATP binds to Myosin Head</text>
            </g>
            
            <g class="label-stage-2">
                <text x="130" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Stage 2: Cocking</text>
                <text x="130" y="52" font-size="12" text-anchor="middle" fill="#2C3E50">ATP hydrolyzes to ADP + P<tspan dy="2" font-size="9">i</tspan></text>
            </g>
            
            <g class="label-stage-3">
                <text x="130" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Stage 3: Cross-Bridge</text>
                <text x="130" y="52" font-size="12" text-anchor="middle" fill="#2C3E50">Myosin binds to Actin</text>
            </g>
            
            <g class="label-stage-4">
                <text x="130" y="32" font-size="14" font-weight="bold" text-anchor="middle" fill="#E74C3C">Stage 4: Power Stroke</text>
                <text x="130" y="52" font-size="12" text-anchor="middle" fill="#2C3E50">P<tspan dy="2" font-size="9">i</tspan><tspan dy="-2"> and ADP release</tspan></text>
            </g>
        </g>

        <!-- Static Labels -->
        <text x="400" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">Actin Filament (Thin)</text>
        <text x="200" y="350" font-size="16" font-weight="bold" text-anchor="middle" fill="#2C3E50">Myosin Filament (Thick)</text>

        <!-- Actin Filament Group -->
        <g class="actin-track">
            <use href="#actin-unit" x="-202"/>
            <use href="#actin-unit" x="0"/>
            <use href="#actin-unit" x="202"/>
            <use href="#actin-unit" x="404"/>
            <use href="#actin-unit" x="606"/>
            <use href="#actin-unit" x="808"/>
            <use href="#actin-unit" x="1010"/>
        </g>

        <!-- Thick Filament Base -->
        <g transform="translate(0, 370)">
            <rect x="50" y="0" width="700" height="50" rx="15" fill="#E67E22" />
            <line x1="100" y1="15" x2="700" y2="15" stroke="#D35400" stroke-width="2" opacity="0.5"/>
            <line x1="100" y1="25" x2="700" y2="25" stroke="#D35400" stroke-width="2" opacity="0.5"/>
            <line x1="100" y1="35" x2="700" y2="35" stroke="#D35400" stroke-width="2" opacity="0.5"/>
        </g>

        <!-- Myosin Complex (Hinge + Neck + Head) -->
        <g class="myosin-head">
            <!-- Neck -->
            <line x1="0" y1="0" x2="0" y2="-130" stroke="#F39C12" stroke-width="16" stroke-linecap="round"/>
            
            <!-- Head -->
            <path d="M -18 -110 C -45 -150, -35 -215, -10 -223 C -5 -225, 0 -218, 5 -223 C 35 -215, 25 -150, 18 -110 Z" fill="#F39C12"/>
            
            <!-- Hinge Joint -->
            <circle cx="0" cy="0" r="10" fill="#D35400"/>
            <circle cx="0" cy="0" r="4" fill="#fff" opacity="0.5"/>

            <!-- ATP Molecule -->
            <g class="atp-molecule" filter="url(#glow)">
                <circle cx="0" cy="0" r="10" fill="#FFD700"/>
                <circle cx="18" cy="-5" r="10" fill="#FFD700"/>
                <circle cx="36" cy="0" r="10" fill="#FFD700"/>
                <text x="18" y="3" font-size="10" text-anchor="middle" fill="#000" class="sci-font">ATP</text>
            </g>

            <!-- ADP Molecule -->
            <g class="adp-molecule">
                <circle cx="0" cy="0" r="10" fill="#FFA500"/>
                <circle cx="18" cy="-5" r="10" fill="#FFA500"/>
                <text x="9" y="3" font-size="10" text-anchor="middle" fill="#000" class="sci-font">ADP</text>
            </g>

            <!-- Pi Molecule -->
            <g class="pi-molecule">
                <circle cx="0" cy="0" r="11" fill="#FF6B6B"/>
                <text x="0" y="4" font-size="12" text-anchor="middle" fill="#fff" class="sci-font">P<tspan dy="2" font-size="9">i</tspan></text>
            </g>
        </g>

    </svg>

</body>
</html>
