<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Cardiovascular System: Double Circulation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Cardiac Cycle Animations (4s Loop) */
        /* 0-1s: Atrial Systole, 1-2.5s: Ventricular Systole, 2.5-4s: Diastole */
        
        .atria {
            transform-origin: 400px 305px;
            animation: atrial-systole 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ventricles {
            transform-origin: 400px 305px;
            animation: ventricular-systole 4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes atrial-systole {
            0% { transform: scaleY(1); }
            12% { transform: scaleY(0.85); }
            25% { transform: scaleY(1); }
            100% { transform: scaleY(1); }
        }

        @keyframes ventricular-systole {
            0%, 25% { transform: scaleY(1) scaleX(1); }
            43% { transform: scaleY(0.85) scaleX(0.95); }
            62.5% { transform: scaleY(1) scaleX(1); }
            100% { transform: scaleY(1) scaleX(1); }
        }

        /* Valve Animations */
        .av-valve-left {
            transform-origin: 330px 305px;
            animation: av-left-anim 4s infinite;
        }
        .av-valve-left-2 {
            transform-origin: 390px 305px;
            animation: av-left-anim-2 4s infinite;
        }
        .av-valve-right {
            transform-origin: 410px 305px;
            animation: av-right-anim 4s infinite;
        }
        .av-valve-right-2 {
            transform-origin: 470px 305px;
            animation: av-right-anim-2 4s infinite;
        }

        @keyframes av-left-anim {
            0%, 25% { transform: rotate(45deg); }
            26%, 62.5% { transform: rotate(0deg); }
            63%, 100% { transform: rotate(45deg); }
        }
        @keyframes av-left-anim-2 {
            0%, 25% { transform: rotate(-45deg); }
            26%, 62.5% { transform: rotate(0deg); }
            63%, 100% { transform: rotate(-45deg); }
        }
        @keyframes av-right-anim {
            0%, 25% { transform: rotate(45deg); }
            26%, 62.5% { transform: rotate(0deg); }
            63%, 100% { transform: rotate(45deg); }
        }
        @keyframes av-right-anim-2 {
            0%, 25% { transform: rotate(-45deg); }
            26%, 62.5% { transform: rotate(0deg); }
            63%, 100% { transform: rotate(-45deg); }
        }

        .sl-valve-pulm-top { transform-origin: 330px 338px; animation: sl-pulm-top 4s infinite; }
        .sl-valve-pulm-bot { transform-origin: 330px 352px; animation: sl-pulm-bot 4s infinite; }
        .sl-valve-aorta-top { transform-origin: 470px 338px; animation: sl-aorta-top 4s infinite; }
        .sl-valve-aorta-bot { transform-origin: 470px 352px; animation: sl-aorta-bot 4s infinite; }

        @keyframes sl-pulm-top {
            0%, 25% { transform: rotate(0deg); }
            26%, 62.5% { transform: rotate(45deg); }
            63%, 100% { transform: rotate(0deg); }
        }
        @keyframes sl-pulm-bot {
            0%, 25% { transform: rotate(0deg); }
            26%, 62.5% { transform: rotate(-45deg); }
            63%, 100% { transform: rotate(0deg); }
        }
        @keyframes sl-aorta-top {
            0%, 25% { transform: rotate(0deg); }
            26%, 62.5% { transform: rotate(-45deg); }
            63%, 100% { transform: rotate(0deg); }
        }
        @keyframes sl-aorta-bot {
            0%, 25% { transform: rotate(0deg); }
            26%, 62.5% { transform: rotate(45deg); }
            63%, 100% { transform: rotate(0deg); }
        }

        /* Blood Flow Animation */
        .blood-flow {
            stroke-dasharray: 0 30;
            stroke-linecap: round;
            animation: flow 4s linear infinite;
        }

        @keyframes flow {
            0% { stroke-dashoffset: 0; }
            25% { stroke-dashoffset: -60; }       /* Atrial Systole: Moderate flow */
            62.5% { stroke-dashoffset: -240; }    /* Ventricular Systole: Fast flow */
            100% { stroke-dashoffset: -300; }     /* Diastole: Slow flow */
        }

        /* Lungs Breathing Animation */
        .lungs {
            transform-origin: 400px 100px;
            animation: breathe 4s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 600" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Human Cardiovascular System: Double Circulation</title>
        <desc>An animated schematic of the human heart and double circulation system, showing blood flow through the pulmonary and systemic circuits.</desc>

        <defs>
            <!-- Drop Shadow for Organs -->
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
            </filter>

            <!-- Gradient for Capillary Gas Exchange -->
            <!-- 0% is Left, 100% is Right -->
            <linearGradient id="capillaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3498DB" />
                <stop offset="50%" stop-color="#9b59b6" />
                <stop offset="100%" stop-color="#E74C3C" />
            </linearGradient>

            <!-- Hexagon Pattern for Body Tissue -->
            <polygon id="hex" points="0,-12 10.4,-6 10.4,6 0,12 -10.4,6 -10.4,-6" fill="#F39C12" stroke="#ffffff" stroke-width="1.5"/>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- TITLE -->
        <text x="400" y="40" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#2C3E50">Human Cardiovascular System: Double Circulation</text>

        <!-- ================= ORGANS ================= -->
        
        <!-- Lungs (Top) -->
        <g class="lungs" filter="url(#shadow)">
            <!-- Trachea & Bronchi -->
            <path d="M 400 30 L 400 60 L 350 90 M 400 60 L 450 90" stroke="#E8F4FD" stroke-width="12" stroke-linecap="round" fill="none"/>
            <path d="M 400 30 L 400 60 L 350 90 M 400 60 L 450 90" stroke="#BDC3C7" stroke-width="4" stroke-linecap="round" fill="none"/>
            <!-- Lung Lobes -->
            <rect x="280" y="50" width="240" height="100" rx="40" fill="#FFB6C1" opacity="0.8"/>
            <text x="400" y="75" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#2C3E50">LUNGS (Pulmonary Circuit)</text>
        </g>

        <!-- Body Tissues (Bottom) -->
        <g filter="url(#shadow)">
            <rect x="300" y="490" width="200" height="80" rx="20" fill="#FAD7A1" opacity="0.4"/>
            <!-- Hexagonal Cells -->
            <use href="#hex" x="380" y="520"/>
            <use href="#hex" x="400.8" y="532"/>
            <use href="#hex" x="421.6" y="520"/>
            <use href="#hex" x="380" y="544"/>
            <use href="#hex" x="400.8" y="556"/>
            <use href="#hex" x="421.6" y="544"/>
            <use href="#hex" x="359.2" y="532"/>
            <use href="#hex" x="442.4" y="532"/>
            <text x="400" y="590" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#2C3E50">BODY TISSUES (Systemic Circuit)</text>
        </g>

        <!-- ================= VESSELS ================= -->
        
        <!-- Vessel Backgrounds (Hollow Tubes) -->
        <g stroke="#E0E0E0" stroke-width="16" fill="none" stroke-linecap="round">
            <path d="M 330 345 C 150 345 150 100 330 100" /> <!-- Pulm Artery -->
            <path d="M 470 100 C 650 100 650 275 470 275" /> <!-- Pulm Vein -->
            <path d="M 470 345 C 650 345 650 520 470 520" /> <!-- Aorta -->
            <path d="M 330 520 C 150 520 150 275 330 275" /> <!-- Vena Cava -->
            <line x1="330" y1="100" x2="470" y2="100" />     <!-- Lung Capillaries -->
            <line x1="470" y1="520" x2="330" y2="520" />     <!-- Body Capillaries -->
        </g>

        <!-- Vessel Borders -->
        <g stroke="#BDC3C7" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.3">
            <path d="M 330 345 C 150 345 150 100 330 100" />
            <path d="M 470 100 C 650 100 650 275 470 275" />
            <path d="M 470 345 C 650 345 650 520 470 520" />
            <path d="M 330 520 C 150 520 150 275 330 275" />
        </g>

        <!-- Animated Blood Flow (Particles) -->
        <g class="blood-flow" stroke-width="8" fill="none">
            <!-- Vena Cava (Blue, Deoxygenated) -->
            <path d="M 330 520 C 150 520 150 275 330 275" stroke="#3498DB" />
            <!-- Pulmonary Artery (Blue, Deoxygenated) -->
            <path d="M 330 345 C 150 345 150 100 330 100" stroke="#3498DB" />
            
            <!-- Lung Capillaries (Transition Blue -> Red) -->
            <line x1="330" y1="100" x2="470" y2="100" stroke="url(#capillaryGrad)" />
            
            <!-- Pulmonary Vein (Red, Oxygenated) -->
            <path d="M 470 100 C 650 100 650 275 470 275" stroke="#E74C3C" />
            <!-- Aorta (Red, Oxygenated) -->
            <path d="M 470 345 C 650 345 650 520 470 520" stroke="#E74C3C" />
            
            <!-- Body Capillaries (Transition Red -> Blue) -->
            <!-- Path goes Right to Left, Gradient 0% is Left(Blue), 100% is Right(Red) -->
            <line x1="470" y1="520" x2="330" y2="520" stroke="url(#capillaryGrad)" />
        </g>

        <!-- Directional Arrows -->
        <g fill="#ffffff" stroke="#BDC3C7" stroke-width="1">
            <!-- Vena Cava Arrow (Up) -->
            <polygon points="170,390 160,410 180,410" />
            <!-- Pulmonary Artery Arrow (Up) -->
            <polygon points="170,210 160,230 180,230" />
            <!-- Pulmonary Vein Arrow (Down) -->
            <polygon points="630,200 620,180 640,180" />
            <!-- Aorta Arrow (Down) -->
            <polygon points="630,440 620,420 640,420" />
        </g>

        <!-- Vessel Labels -->
        <g font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">
            <text x="170" y="435">Vena Cava</text>
            <text x="170" y="195">Pulmonary Artery</text>
            <text x="630" y="165">Pulmonary Vein</text>
            <text x="630" y="475">Aorta</text>
        </g>

        <!-- ================= HEART ================= -->
        <g filter="url(#shadow)">
            
            <!-- ATRIA (Top Half) -->
            <g class="atria">
                <!-- Right Atrium Block -->
                <rect x="325" y="245" width="70" height="60" rx="10" fill="#CD5C5C" />
                <rect x="330" y="250" width="60" height="50" rx="5" fill="#3498DB" />
                <text x="360" y="280" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">RA</text>

                <!-- Left Atrium Block -->
                <rect x="405" y="245" width="70" height="60" rx="10" fill="#CD5C5C" />
                <rect x="410" y="250" width="60" height="50" rx="5" fill="#E74C3C" />
                <text x="440" y="280" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">LA</text>
            </g>

            <!-- VENTRICLES (Bottom Half) -->
            <g class="ventricles">
                <!-- Right Ventricle Block -->
                <rect x="325" y="305" width="70" height="80" rx="10" fill="#CD5C5C" />
                <rect x="330" y="310" width="60" height="70" rx="5" fill="#3498DB" />
                <text x="360" y="350" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">RV</text>

                <!-- Left Ventricle Block (Thicker Wall) -->
                <rect x="405" y="305" width="85" height="80" rx="10" fill="#CD5C5C" />
                <rect x="410" y="310" width="60" height="70" rx="5" fill="#E74C3C" />
                <text x="440" y="350" font-family="Roboto Mono" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">LV</text>
            </g>

            <!-- VALVES -->
            <g stroke="#ffffff" stroke-width="4" stroke-linecap="round">
                <!-- Tricuspid Valve (RA -> RV) -->
                <line x1="330" y1="305" x2="360" y2="305" class="av-valve-left" />
                <line x1="390" y1="305" x2="360" y2="305" class="av-valve-left-2" />
                
                <!-- Bicuspid/Mitral Valve (LA -> LV) -->
                <line x1="410" y1="305" x2="440" y2="305" class="av-valve-right" />
                <line x1="470" y1="305" x2="440" y2="305" class="av-valve-right-2" />

                <!-- Pulmonary Semilunar Valve (RV -> Pulm Artery) -->
                <line x1="330" y1="338" x2="330" y2="345" class="sl-valve-pulm-top" />
                <line x1="330" y1="352" x2="330" y2="345" class="sl-valve-pulm-bot" />

                <!-- Aortic Semilunar Valve (LV -> Aorta) -->
                <line x1="470" y1="338" x2="470" y2="345" class="sl-valve-aorta-top" />
                <line x1="470" y1="352" x2="470" y2="345" class="sl-valve-aorta-bot" />
            </g>
        </g>

        <!-- ================= ANNOTATIONS & LEGEND ================= -->
        
        <!-- Clinical Note -->
        <g transform="translate(20, 510)">
            <rect x="0" y="0" width="260" height="70" rx="6" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <text x="15" y="20" font-family="Inter" font-size="11" fill="#2C3E50">
                <tspan x="15" dy="0" font-weight="700">Clinical Note:</tspan>
                <tspan x="15" dy="16">Opioids/Depressants decrease heart</tspan>
                <tspan x="15" dy="14">rate (Bradycardia), while Stimulants</tspan>
                <tspan x="15" dy="14">increase it (Tachycardia).</tspan>
            </text>
        </g>

        <!-- Legend -->
        <g transform="translate(610, 480)">
            <rect x="0" y="0" width="170" height="100" rx="6" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
            <text x="85" y="20" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Legend</text>
            
            <circle cx="20" cy="40" r="6" fill="#E74C3C" />
            <text x="35" y="44" font-family="Inter" font-size="11" fill="#2C3E50">Oxygenated Blood</text>
            
            <circle cx="20" cy="60" r="6" fill="#3498DB" />
            <text x="35" y="64" font-family="Inter" font-size="11" fill="#2C3E50">Deoxygenated Blood</text>

            <rect x="14" y="76" width="12" height="12" rx="2" fill="#CD5C5C" />
            <text x="35" y="86" font-family="Inter" font-size="11" fill="#2C3E50">Myocardium (Muscle)</text>
        </g>

    </svg>
</div>

</body>
</html>
