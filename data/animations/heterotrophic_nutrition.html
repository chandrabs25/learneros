<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanisms of Heterotrophic Nutrition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2C3E50;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #2C3E50;
        }
        .header p {
            margin: 0;
            font-size: 16px;
            color: #555;
            max-width: 800px;
        }
        .svg-container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        /* Phase 1: Energy Origin (0-3s / 0-25%) */
        @keyframes photonMove1 {
            0%, 25%, 100% { opacity: 0; transform: translate(0, 0); }
            2% { opacity: 1; transform: translate(10px, 15px); }
            15% { opacity: 1; transform: translate(40px, 100px); }
            20% { opacity: 0; transform: translate(50px, 120px); }
        }
        @keyframes photonMove2 {
            0%, 25%, 100% { opacity: 0; transform: translate(0, 0); }
            5% { opacity: 1; transform: translate(20px, 10px); }
            18% { opacity: 1; transform: translate(80px, 170px); }
            23% { opacity: 0; transform: translate(85px, 200px); }
        }
        @keyframes plantPulse {
            0%, 100% { transform: scale(1); transform-origin: 150px 500px; }
            12% { transform: scale(1.02); transform-origin: 150px 500px; }
            25% { transform: scale(1); transform-origin: 150px 500px; }
        }
        @keyframes plantGlucFade {
            0%, 15%, 100% { opacity: 0; }
            20%, 25% { opacity: 1; }
            26% { opacity: 0; }
        }

        /* Phase 2: Holozoic Ingestion (3-6s / 25-50%) */
        @keyframes bolusMove {
            0%, 25%, 100% { opacity: 0; transform: translate(0, 0); }
            26% { opacity: 1; transform: translate(0, 0); }
            35% { opacity: 1; transform: translate(195px, -30px); } /* To Mouth */
            45% { opacity: 1; transform: translate(245px, 60px); } /* To Stomach */
            46% { opacity: 0; transform: translate(245px, 60px); }
        }
        @keyframes gutGluc1 {
            0%, 45%, 100% { opacity: 0; transform: translate(0, 0); }
            46% { opacity: 1; transform: translate(-10px, 10px); }
            55% { opacity: 1; transform: translate(-10px, 40px); } /* Down gut */
            65% { opacity: 1; transform: translate(80px, 0px); } /* Into cell */
            75% { opacity: 0; transform: translate(80px, 0px); }
        }
        @keyframes gutGluc2 {
            0%, 45%, 100% { opacity: 0; transform: translate(0, 0); }
            46% { opacity: 1; transform: translate(10px, 10px); }
            55% { opacity: 1; transform: translate(0px, 50px); }
            65% { opacity: 1; transform: translate(100px, 20px); } /* Into cell */
            75% { opacity: 1; transform: translate(100px, 20px); } /* Wait for Phase 4 */
            80% { opacity: 1; transform: translate(120px, 30px); } /* To Mitochondria */
            82% { opacity: 0; transform: translate(120px, 30px); }
        }

        /* Phase 3: Saprophytic Secretion (6-9s / 50-75%) */
        @keyframes fungiPulse {
            0%, 50%, 100% { transform: scale(1); transform-origin: 825px 500px; }
            62% { transform: scale(1.03); transform-origin: 825px 500px; }
            75% { transform: scale(1); transform-origin: 825px 500px; }
        }
        @keyframes decayColor {
            0%, 55%, 100% { fill: #795548; }
            65%, 75% { fill: #5D4037; }
        }
        @keyframes enzMove1 {
            0%, 50%, 100% { opacity: 0; transform: translate(0, 0); }
            52% { opacity: 1; transform: translate(0, 0); }
            60% { opacity: 1; transform: translate(-35px, 40px); }
            65% { opacity: 0; transform: translate(-35px, 40px); }
        }
        @keyframes enzMove2 {
            0%, 50%, 100% { opacity: 0; transform: translate(0, 0); }
            52% { opacity: 1; transform: translate(0, 0); }
            60% { opacity: 1; transform: translate(35px, 50px); }
            65% { opacity: 0; transform: translate(35px, 50px); }
        }
        @keyframes sapGlucMove1 {
            0%, 60%, 100% { opacity: 0; transform: translate(0, 0); }
            62% { opacity: 1; transform: translate(0, 0); }
            72% { opacity: 1; transform: translate(35px, -40px); }
            75% { opacity: 0; transform: translate(35px, -40px); }
        }
        @keyframes sapGlucMove2 {
            0%, 60%, 100% { opacity: 0; transform: translate(0, 0); }
            62% { opacity: 1; transform: translate(0, 0); }
            72% { opacity: 1; transform: translate(-35px, -50px); }
            75% { opacity: 0; transform: translate(-35px, -50px); }
        }

        /* Phase 4: Cellular Utilization (9-12s / 75-100%) */
        @keyframes atpMove1 {
            0%, 82%, 100% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            84% { opacity: 1; transform: translate(10px, -10px) scale(1); }
            95% { opacity: 1; transform: translate(30px, -40px) scale(1.2); }
            98% { opacity: 0; transform: translate(40px, -50px) scale(1.5); }
        }
        @keyframes atpMove2 {
            0%, 82%, 100% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            85% { opacity: 1; transform: translate(-10px, -10px) scale(1); }
            96% { opacity: 1; transform: translate(-20px, -30px) scale(1.2); }
            99% { opacity: 0; transform: translate(-30px, -40px) scale(1.5); }
        }

        /* Utility Animations */
        @keyframes march {
            to { stroke-dashoffset: -20; }
        }

        /* Class Assignments */
        .photon1 { animation: photonMove1 12s infinite; }
        .photon2 { animation: photonMove2 12s infinite; }
        .plant-pulse { animation: plantPulse 12s infinite; }
        .plant-gluc { animation: plantGlucFade 12s infinite; }
        .bolus { animation: bolusMove 12s infinite; }
        .gut-gluc1 { animation: gutGluc1 12s infinite; }
        .gut-gluc2 { animation: gutGluc2 12s infinite; }
        .fungi-pulse { animation: fungiPulse 12s infinite; }
        .substrate-decay { animation: decayColor 12s infinite; }
        .enz1 { animation: enzMove1 12s infinite; }
        .enz2 { animation: enzMove2 12s infinite; }
        .sap-gluc1 { animation: sapGlucMove1 12s infinite; }
        .sap-gluc2 { animation: sapGlucMove2 12s infinite; }
        .atp1 { animation: atpMove1 12s infinite; }
        .atp2 { animation: atpMove2 12s infinite; }
        .flow-arrow { animation: march 1s linear infinite; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Heterotrophic Nutrition: Energy Acquisition</h1>
        <p>Comparing <strong>Holozoic</strong> (internal digestion) and <strong>Saprophytic</strong> (extracellular digestion) pathways. Both rely on autotrophs for organic carbon.</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram showing holozoic and saprophytic nutrition pathways">
            <title>Mechanisms of Heterotrophic Nutrition</title>
            <desc>An animation demonstrating how energy flows from the sun to plants, and then is consumed either internally by animals (holozoic) or externally by fungi (saprophytic).</desc>

            <defs>
                <!-- Glow Filter for Sun and ATP -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <!-- Drop Shadow for Fungi -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
                </filter>

                <!-- Arrow Marker -->
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#95A5A6" />
                </marker>

                <!-- Reusable Symbols -->
                <g id="glucose">
                    <polygon points="0,-7 6,-3.5 6,3.5 0,7 -6,3.5 -6,-3.5" fill="#FFD700" stroke="#D4AC0D" stroke-width="1.5"/>
                </g>
                <g id="enzyme">
                    <polygon points="0,-6 6,0 0,6 -6,0" fill="#98D8C8" stroke="#76A89C" stroke-width="1.5"/>
                </g>
                <g id="atp">
                    <path d="M0,-10 L2,-3 L9,-3 L4,2 L6,9 L0,5 L-6,9 L-4,2 L-9,-3 L-2,-3 Z" fill="#F1C40F" filter="url(#glow)"/>
                </g>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#ffffff"/>

            <!-- ========================================== -->
            <!-- ZONE 1: AUTOTROPH (Producer)               -->
            <!-- ========================================== -->
            <g id="autotroph">
                <!-- Sun & Photons -->
                <circle cx="100" cy="80" r="35" fill="#F1C40F" filter="url(#glow)"/>
                <circle cx="100" cy="80" r="4" fill="#F1C40F" class="photon1"/>
                <circle cx="100" cy="80" r="4" fill="#F1C40F" class="photon2"/>

                <!-- Plant Structure -->
                <g class="plant-pulse">
                    <!-- Stem -->
                    <path d="M 150 500 Q 140 350 150 200" stroke="#2ECC71" stroke-width="10" fill="none" stroke-linecap="round"/>
                    <!-- Leaves -->
                    <path d="M 150 380 C 80 380, 60 320, 150 350" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
                    <path d="M 150 280 C 240 280, 260 220, 150 250" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
                    <path d="M 150 180 C 90 150, 110 100, 150 150" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
                    <!-- Chloroplasts -->
                    <circle cx="110" cy="355" r="5" fill="#27AE60"/>
                    <circle cx="190" cy="255" r="5" fill="#27AE60"/>
                    <circle cx="130" cy="150" r="5" fill="#27AE60"/>
                </g>

                <!-- Plant Glucose (Forms during Phase 1) -->
                <g class="plant-gluc">
                    <use href="#glucose" x="175" y="275"/>
                    <use href="#glucose" x="185" y="285"/>
                    <use href="#glucose" x="195" y="275"/>
                    <use href="#glucose" x="185" y="265"/>
                </g>

                <!-- Labels -->
                <text x="150" y="50" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle" fill="#27AE60">Autotroph</text>
                <text x="150" y="70" font-family="Inter" font-size="14" text-anchor="middle" fill="#7F8C8D">(Producer)</text>
                <text x="150" y="420" font-family="Roboto Mono" font-size="13" text-anchor="middle" fill="#555">Photosynthesis</text>
            </g>

            <!-- ========================================== -->
            <!-- ZONE 2: HOLOZOIC (Animal Consumer)         -->
            <!-- ========================================== -->
            <g id="holozoic">
                <!-- Flow Arrow from Plant to Animal -->
                <path d="M 220 280 Q 300 220 370 250" fill="none" stroke="#95A5A6" stroke-width="3" stroke-dasharray="6,6" class="flow-arrow" marker-end="url(#arrow)"/>

                <!-- Animal Silhouette -->
                <path d="M 380 250 C 400 180, 480 160, 530 200 C 620 250, 650 380, 580 480 C 520 550, 400 520, 370 420 C 340 350, 350 280, 380 250 Z" fill="#F39C12" opacity="0.15" stroke="#F39C12" stroke-width="3"/>

                <!-- Digestive Tract -->
                <!-- Outer wall -->
                <path d="M 380 250 L 430 270 C 460 280, 460 320, 430 340 C 400 360, 400 420, 440 440 L 480 480" fill="none" stroke="#4A90D9" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
                <!-- Lumen (Inside) -->
                <path d="M 380 250 L 430 270 C 460 280, 460 320, 430 340 C 400 360, 400 420, 440 440 L 480 480" fill="none" stroke="#E8F4FD" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

                <!-- Animal Cell (Magnified) -->
                <g transform="translate(530, 350)">
                    <!-- Membrane -->
                    <circle cx="0" cy="0" r="55" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4"/>
                    <!-- Nucleus -->
                    <circle cx="-20" cy="-15" r="16" fill="#2C3E50"/>
                    <!-- Mitochondria -->
                    <g transform="translate(20, 20) rotate(-30)">
                        <ellipse cx="0" cy="0" rx="20" ry="12" fill="#E74C3C"/>
                        <path d="M -14 -2 Q -9 5 -4 -2 Q 1 5 6 -2 Q 11 5 16 -2" stroke="#fff" stroke-width="2" fill="none"/>
                    </g>
                </g>

                <!-- Flow Arrow from Gut to Cell -->
                <path d="M 440 380 Q 460 360 470 350" fill="none" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" class="flow-arrow" marker-end="url(#arrow)"/>

                <!-- Animated Molecules -->
                <!-- Bolus (Phase 2) -->
                <g class="bolus" transform="translate(185, 280)">
                    <use href="#glucose" x="-10" y="-5"/>
                    <use href="#glucose" x="0" y="5"/>
                    <use href="#glucose" x="10" y="-5"/>
                    <use href="#glucose" x="0" y="-15"/>
                </g>
                <!-- Digested Glucose in Gut -->
                <use href="#glucose" x="430" y="340" class="gut-gluc1"/>
                <use href="#glucose" x="430" y="340" class="gut-gluc2"/>
                <!-- ATP Generation (Phase 4) -->
                <use href="#atp" x="550" y="370" class="atp1"/>
                <use href="#atp" x="550" y="370" class="atp2"/>

                <!-- Labels -->
                <text x="500" y="50" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle" fill="#F39C12">Holozoic</text>
                <text x="500" y="70" font-family="Inter" font-size="14" text-anchor="middle" fill="#7F8C8D">(Internal Digestion)</text>
                <text x="430" y="220" font-family="Roboto Mono" font-size="13" text-anchor="middle" fill="#555">Ingestion</text>
                <text x="480" y="330" font-family="Roboto Mono" font-size="12" text-anchor="middle" fill="#555">Absorption</text>
            </g>

            <!-- ========================================== -->
            <!-- ZONE 3: SAPROPHYTIC (Fungal Consumer)      -->
            <!-- ========================================== -->
            <g id="saprophytic">
                <!-- Decaying Substrate -->
                <path d="M 680 460 Q 825 410 970 460 L 970 540 L 680 540 Z" class="substrate-decay"/>

                <!-- Fungal Hyphae -->
                <g class="fungi-pulse" filter="url(#shadow)">
                    <g stroke="#FFF8DC" stroke-width="6" stroke-linecap="round" fill="none">
                        <!-- Aerial Hyphae / Sporangiophores -->
                        <path d="M 825 440 L 825 280" />
                        <path d="M 825 360 L 760 300" />
                        <path d="M 825 330 L 890 270" />
                        <!-- Sporangia (Heads) -->
                        <circle cx="825" cy="280" r="10" fill="#FFF8DC" stroke="none"/>
                        <circle cx="760" cy="300" r="10" fill="#FFF8DC" stroke="none"/>
                        <circle cx="890" cy="270" r="10" fill="#FFF8DC" stroke="none"/>
                        <!-- Rhizoids (Root-like structures in substrate) -->
                        <path d="M 825 440 L 790 490" />
                        <path d="M 825 440 L 860 500" />
                        <path d="M 790 490 L 750 500" />
                        <path d="M 860 500 L 900 490" />
                    </g>
                </g>

                <!-- Flow Arrows for Secretion/Absorption -->
                <path d="M 780 450 L 760 470" fill="none" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" class="flow-arrow" marker-end="url(#arrow)"/>
                <path d="M 870 480 L 850 460" fill="none" stroke="#95A5A6" stroke-width="2" stroke-dasharray="4,4" class="flow-arrow" marker-end="url(#arrow)"/>

                <!-- Animated Molecules -->
                <!-- Enzymes Secreted (Phase 3) -->
                <use href="#enzyme" x="825" y="430" class="enz1"/>
                <use href="#enzyme" x="825" y="430" class="enz2"/>
                <!-- Glucose Absorbed (Phase 3) -->
                <use href="#glucose" x="790" y="470" class="sap-gluc1"/>
                <use href="#glucose" x="860" y="480" class="sap-gluc2"/>

                <!-- Labels -->
                <text x="825" y="50" font-family="Inter" font-size="18" font-weight="bold" text-anchor="middle" fill="#795548">Saprophytic</text>
                <text x="825" y="70" font-family="Inter" font-size="14" text-anchor="middle" fill="#7F8C8D">(Extracellular Digestion)</text>
                <text x="825" y="560" font-family="Roboto Mono" font-size="13" text-anchor="middle" fill="#fff">Enzyme Secretion &amp; Absorption</text>
            </g>

            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g id="legend" transform="translate(150, 540)">
                <rect x="0" y="0" width="700" height="50" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="8"/>
                
                <!-- Legend Items -->
                <use href="#glucose" x="30" y="25"/>
                <text x="45" y="29" font-family="Inter" font-size="13" fill="#2C3E50">Glucose (C<tspan dy="3" font-size="10">6</tspan><tspan dy="-3">H</tspan><tspan dy="3" font-size="10">12</tspan><tspan dy="-3">O</tspan><tspan dy="3" font-size="10">6</tspan>)</text>

                <use href="#enzyme" x="200" y="25"/>
                <text x="215" y="29" font-family="Inter" font-size="13" fill="#2C3E50">Digestive Enzymes</text>

                <use href="#atp" x="370" y="25"/>
                <text x="385" y="29" font-family="Inter" font-size="13" fill="#2C3E50">ATP (Energy)</text>

                <g transform="translate(500, 25)">
                    <ellipse cx="0" cy="0" rx="12" ry="7" fill="#E74C3C"/>
                    <path d="M -8 -1 Q -5 3 -2 -1 Q 1 3 4 -1 Q 7 3 10 -1" stroke="#fff" stroke-width="1" fill="none"/>
                </g>
                <text x="520" y="29" font-family="Inter" font-size="13" fill="#2C3E50">Mitochondria</text>
            </g>

        </svg>
    </div>

</body>
</html>
