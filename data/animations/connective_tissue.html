<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialized Connective Tissues</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        .title { font-family: 'Inter', sans-serif; font-size: 24px; font-weight: 700; fill: #2C3E50; letter-spacing: -0.5px; }
        .subtitle { font-family: 'Inter', sans-serif; font-size: 16px; font-weight: 600; fill: #2C3E50; }
        .desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #7F8C8D; }
        .label { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 500; fill: #34495E; }
        .leader-line { stroke: #95A5A6; stroke-width: 1; fill: none; stroke-dasharray: 2,2; }
        .divider { stroke: #DCDDE1; stroke-width: 1.5; stroke-dasharray: 6,4; }

        /* Animations */
        @keyframes flow-cell {
            0% { transform: translateX(-30px); }
            100% { transform: translateX(280px); }
        }

        @keyframes tumble {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulse {
            0% { r: 15px; opacity: 0.8; stroke-width: 2px; }
            100% { r: 120px; opacity: 0; stroke-width: 12px; }
        }

        @keyframes compress {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(0.97); }
        }

        .cell-flow {
            animation: flow-cell linear infinite;
        }

        .tumble {
            animation: tumble linear infinite;
            transform-origin: 0 0;
        }

        .pulse-ring {
            animation: pulse 3s ease-out infinite;
            transform-origin: 400px 250px;
        }

        .cartilage-compress {
            animation: compress 4s ease-in-out infinite;
            transform-origin: 662.5px 430px;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Filters -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity="0.05"/>
        </filter>

        <!-- Gradients -->
        <radialGradient id="rbc-grad" cx="50%" cy="50%" r="50%">
            <stop offset="30%" stop-color="#F1948A"/>
            <stop offset="90%" stop-color="#E74C3C"/>
            <stop offset="100%" stop-color="#C0392B"/>
        </radialGradient>

        <linearGradient id="cartilage-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#D6EAF8"/>
            <stop offset="100%" stop-color="#E8F4FD"/>
        </linearGradient>

        <!-- Clip Paths for Panels -->
        <clipPath id="clip-blood">
            <rect x="15" y="70" width="245" height="360" rx="8"/>
        </clipPath>
        <clipPath id="clip-cartilage">
            <rect x="540" y="70" width="245" height="360" rx="8"/>
        </clipPath>

        <!-- Reusable Biological Structures -->
        <!-- Red Blood Cell -->
        <g id="rbc">
            <circle cx="0" cy="0" r="8" fill="url(#rbc-grad)"/>
            <circle cx="-1" cy="-1" r="4" fill="none" stroke="#C0392B" stroke-width="0.5" opacity="0.4"/>
        </g>

        <!-- White Blood Cell (Neutrophil) -->
        <g id="wbc">
            <path d="M-11,-4 C-13,6 -6,13 5,11 C13,9 16,-3 9,-11 C1,-16 -8,-13 -11,-4 Z" fill="#ECF0F1" stroke="#BDC3C7" stroke-width="1"/>
            <!-- Lobed Nucleus -->
            <path d="M-5,-3 C-7,1 -3,5 1,3 C5,1 5,-5 1,-7 C-3,-9 -3,-5 -5,-3 Z" fill="#2C3E50"/>
            <path d="M1,3 C-1,7 5,9 7,5 C9,1 7,-3 5,-1 C3,1 3,1 1,3 Z" fill="#2C3E50"/>
            <path d="M-5,-3 C-9,-5 -7,-9 -3,-9 C1,-9 -1,-5 -3,-3 C-5,-1 -3,-1 -5,-3 Z" fill="#2C3E50"/>
        </g>

        <!-- Platelet -->
        <g id="platelet">
            <path d="M-2,-1 L-1,-3 L2,-2 L3,1 L1,3 L-2,2 Z" fill="#F39C12"/>
        </g>

        <!-- Osteocyte -->
        <g id="osteocyte">
            <ellipse cx="0" cy="0" rx="5" ry="2.5" fill="#2C3E50"/>
            <ellipse cx="0" cy="0" rx="7" ry="4" fill="none" stroke="#2C3E50" stroke-width="0.5" opacity="0.5"/>
        </g>

        <!-- Cartilage Isogenous Groups -->
        <g id="iso-group-2">
            <ellipse cx="0" cy="0" rx="18" ry="12" fill="#E8F4FD" stroke="#BDC3C7" stroke-width="0.5"/>
            <circle cx="-7" cy="0" r="5" fill="#4A90D9"/>
            <circle cx="7" cy="0" r="5" fill="#4A90D9"/>
            <circle cx="-7" cy="0" r="1.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="7" cy="0" r="1.5" fill="#2C3E50" opacity="0.7"/>
        </g>

        <g id="iso-group-4">
            <ellipse cx="0" cy="0" rx="20" ry="18" fill="#E8F4FD" stroke="#BDC3C7" stroke-width="0.5"/>
            <circle cx="-8" cy="-8" r="5" fill="#4A90D9"/>
            <circle cx="8" cy="-8" r="5" fill="#4A90D9"/>
            <circle cx="-8" cy="8" r="5" fill="#4A90D9"/>
            <circle cx="8" cy="8" r="5" fill="#4A90D9"/>
            <circle cx="-8" cy="-8" r="1.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="8" cy="-8" r="1.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="-8" cy="8" r="1.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="8" cy="8" r="1.5" fill="#2C3E50" opacity="0.7"/>
        </g>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff"/>

    <!-- Titles -->
    <text x="400" y="35" class="title" text-anchor="middle">Specialized Connective Tissues</text>
    
    <!-- Panel 1: Blood (Fluid Connective Tissue) -->
    <rect x="15" y="70" width="245" height="360" fill="#FFF9E6" rx="8" filter="url(#shadow)"/>
    <g clip-path="url(#clip-blood)">
        <!-- Flowing Cells -->
        <g transform="translate(0, 90)"><g class="cell-flow" style="animation-duration: 6s; animation-delay: -1s;"><use href="#rbc" class="tumble" style="animation-duration: 3s;"/></g></g>
        <g transform="translate(0, 110)"><g class="cell-flow" style="animation-duration: 5.5s; animation-delay: -4s;"><use href="#rbc" class="tumble" style="animation-duration: 4s;"/></g></g>
        <g transform="translate(0, 140)"><g class="cell-flow" style="animation-duration: 8s; animation-delay: -2s;"><use href="#wbc"/></g></g>
        <g transform="translate(0, 170)"><g class="cell-flow" style="animation-duration: 5s; animation-delay: 0s;"><use href="#rbc" class="tumble" style="animation-duration: 2.5s;"/></g></g>
        <g transform="translate(0, 190)"><g class="cell-flow" style="animation-duration: 6.5s; animation-delay: -2.5s;"><use href="#platelet" class="tumble" style="animation-duration: 5s;"/></g></g>
        <g transform="translate(0, 220)"><g class="cell-flow" style="animation-duration: 7s; animation-delay: -1s;"><use href="#rbc" class="tumble" style="animation-duration: 3.5s;"/></g></g>
        <g transform="translate(0, 240)"><g class="cell-flow" style="animation-duration: 6s; animation-delay: -4.5s;"><use href="#rbc" class="tumble" style="animation-duration: 3s;"/></g></g>
        <g transform="translate(0, 270)"><g class="cell-flow" style="animation-duration: 9s; animation-delay: -3s;"><use href="#wbc"/></g></g>
        <g transform="translate(0, 300)"><g class="cell-flow" style="animation-duration: 5.5s; animation-delay: -2s;"><use href="#rbc" class="tumble" style="animation-duration: 4s;"/></g></g>
        <g transform="translate(0, 320)"><g class="cell-flow" style="animation-duration: 7.5s; animation-delay: -5s;"><use href="#platelet" class="tumble" style="animation-duration: 4.5s;"/></g></g>
        <g transform="translate(0, 350)"><g class="cell-flow" style="animation-duration: 5s; animation-delay: -1.5s;"><use href="#rbc" class="tumble" style="animation-duration: 2.8s;"/></g></g>
        <g transform="translate(0, 380)"><g class="cell-flow" style="animation-duration: 8s; animation-delay: -6s;"><use href="#rbc" class="tumble" style="animation-duration: 3.2s;"/></g></g>
        <g transform="translate(0, 400)"><g class="cell-flow" style="animation-duration: 6.5s; animation-delay: -2s;"><use href="#platelet" class="tumble" style="animation-duration: 3.8s;"/></g></g>
    </g>
    <text x="137.5" y="460" class="subtitle" text-anchor="middle">Blood (Fluid)</text>

    <!-- Panel 2: Bone (Supportive Connective Tissue) -->
    <rect x="275" y="70" width="250" height="360" fill="#F4F6F7" rx="8" filter="url(#shadow)"/>
    <g>
        <!-- Canaliculi (Radiating Lines) -->
        <g stroke="#BDC3C7" stroke-width="0.5" opacity="0.6">
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(0 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(15 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(30 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(45 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(60 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(75 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(90 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(105 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(120 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(135 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(150 400 250)"/>
            <line x1="280" y1="250" x2="520" y2="250" transform="rotate(165 400 250)"/>
        </g>

        <!-- Lamellae (Concentric Rings) -->
        <circle cx="400" cy="250" r="30" fill="none" stroke="#BDC3C7" stroke-width="1"/>
        <circle cx="400" cy="250" r="60" fill="none" stroke="#BDC3C7" stroke-width="1"/>
        <circle cx="400" cy="250" r="90" fill="none" stroke="#BDC3C7" stroke-width="1"/>
        <circle cx="400" cy="250" r="120" fill="none" stroke="#BDC3C7" stroke-width="1"/>

        <!-- Osteocytes placement -->
        <!-- r=30 -->
        <use href="#osteocyte" x="400" y="220" transform="rotate(0 400 250)"/>
        <use href="#osteocyte" x="400" y="220" transform="rotate(90 400 250)"/>
        <use href="#osteocyte" x="400" y="220" transform="rotate(180 400 250)"/>
        <use href="#osteocyte" x="400" y="220" transform="rotate(270 400 250)"/>
        <!-- r=60 -->
        <use href="#osteocyte" x="400" y="190" transform="rotate(0 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(45 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(90 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(135 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(180 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(225 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(270 400 250)"/>
        <use href="#osteocyte" x="400" y="190" transform="rotate(315 400 250)"/>
        <!-- r=90 -->
        <use href="#osteocyte" x="400" y="160" transform="rotate(0 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(30 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(60 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(90 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(120 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(150 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(180 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(210 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(240 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(270 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(300 400 250)"/>
        <use href="#osteocyte" x="400" y="160" transform="rotate(330 400 250)"/>
        <!-- r=120 -->
        <use href="#osteocyte" x="400" y="130" transform="rotate(0 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(22.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(45 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(67.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(90 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(112.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(135 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(157.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(180 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(202.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(225 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(247.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(270 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(292.5 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(315 400 250)"/>
        <use href="#osteocyte" x="400" y="130" transform="rotate(337.5 400 250)"/>

        <!-- Nutrient Pulse Animation -->
        <circle cx="400" cy="250" fill="none" stroke="#FFFFFF" class="pulse-ring" style="animation-delay: 0s;"/>
        <circle cx="400" cy="250" fill="none" stroke="#FFFFFF" class="pulse-ring" style="animation-delay: 1.5s;"/>

        <!-- Haversian Canal -->
        <circle cx="400" cy="250" r="15" fill="#E74C3C"/>
        <circle cx="400" cy="250" r="12" fill="#C0392B"/>
        <circle cx="400" cy="250" r="16" fill="none" stroke="#2C3E50" stroke-width="1"/>
    </g>
    <text x="400" y="460" class="subtitle" text-anchor="middle">Bone (Supportive)</text>

    <!-- Panel 3: Cartilage (Skeletal Connective Tissue) -->
    <g clip-path="url(#clip-cartilage)">
        <g class="cartilage-compress">
            <rect x="540" y="50" width="245" height="400" fill="url(#cartilage-grad)" filter="url(#shadow)"/>
            
            <!-- Isogenous Groups -->
            <use href="#iso-group-2" x="600" y="120" transform="rotate(15 600 120)"/>
            <use href="#iso-group-4" x="700" y="180" transform="rotate(-20 700 180)"/>
            <use href="#iso-group-2" x="590" y="250" transform="rotate(45 590 250)"/>
            <use href="#iso-group-2" x="680" y="300" transform="rotate(-10 680 300)"/>
            <use href="#iso-group-4" x="620" y="370" transform="rotate(10 620 370)"/>
            <use href="#iso-group-2" x="730" y="100" transform="rotate(60 730 100)"/>
            <use href="#iso-group-2" x="570" y="350" transform="rotate(-30 570 350)"/>
            <use href="#iso-group-2" x="740" y="380" transform="rotate(5 740 380)"/>
            <use href="#iso-group-4" x="750" y="260" transform="rotate(35 750 260)"/>
            <use href="#iso-group-2" x="560" y="180" transform="rotate(-45 560 180)"/>
        </g>
    </g>
    <text x="662.5" y="460" class="subtitle" text-anchor="middle">Cartilage (Skeletal)</text>

    <!-- Dividers -->
    <line x1="267.5" y1="70" x2="267.5" y2="430" class="divider"/>
    <line x1="532.5" y1="70" x2="532.5" y2="430" class="divider"/>

    <!-- Labels and Annotations -->
    <!-- Blood Labels -->
    <text x="25" y="90" class="label">Erythrocytes</text>
    <path d="M 105 87 L 125 87" class="leader-line"/>
    
    <text x="25" y="110" class="label">Leukocyte</text>
    <path d="M 95 107 L 115 107" class="leader-line"/>

    <text x="25" y="415" class="label">Plasma Matrix</text>
    <path d="M 115 412 L 135 412" class="leader-line"/>

    <!-- Bone Labels -->
    <text x="285" y="90" class="label">Osteon</text>
    <path d="M 335 87 L 360 130" class="leader-line"/>

    <text x="440" y="90" class="label">Canaliculi</text>
    <path d="M 435 87 L 415 130" class="leader-line"/>

    <text x="285" y="415" class="label">Osteocyte</text>
    <path d="M 355 412 L 370 370" class="leader-line"/>

    <text x="440" y="415" class="label">Haversian Canal</text>
    <path d="M 435 412 L 410 260" class="leader-line"/>

    <!-- Cartilage Labels -->
    <text x="550" y="90" class="label">Chondrocyte</text>
    <path d="M 630 87 L 650 110" class="leader-line"/>

    <text x="700" y="90" class="label">Lacuna</text>
    <path d="M 695 87 L 675 110" class="leader-line"/>

    <text x="550" y="415" class="label">Glassy Matrix</text>
    <path d="M 645 412 L 660 390" class="leader-line"/>

    <!-- Bottom Legend / Description -->
    <text x="400" y="490" class="desc" text-anchor="middle">Animation illustrates laminar blood flow, nutrient diffusion in bone, and load-bearing elasticity in cartilage.</text>

</svg>

</body>
</html>
