<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Kingdom Classification Animated Diagram</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            margin: 20px;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: #2C3E50; }
        .subtitle { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #7F8C8D; }
        .kingdom-label { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: #2C3E50; }
        .complexity-label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; fill: #34495E; }
        .nutrition-label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; font-style: italic; fill: #7F8C8D; }
        .sci-note { font-family: 'Roboto Mono', monospace; font-size: 11px; fill: #E74C3C; font-weight: 500; }
        .legend-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #34495E; }

        /* Animation Classes */
        .monera { animation: phase1 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .arrow1 { stroke-dasharray: 180; stroke-dashoffset: 180; animation: drawArrow1 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .protista { animation: phase2 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .nucleus-assemble { animation: assembleNucleus 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-origin: 480px 460px; }
        .arrow-top { stroke-dasharray: 450; stroke-dashoffset: 450; animation: drawArrowTop 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .kingdom-top { animation: phase3 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .chloro-pulse { animation: pulseChloro 17s ease-in-out infinite; transform-origin: center; }
        .hyphae-extend { animation: extendHyphae 17s ease-in-out infinite; transform-origin: 500px 240px; }
        .animal-membrane { animation: rippleMembrane 17s ease-in-out infinite; transform-origin: 750px 200px; }
        .boundary-line { stroke-dasharray: 600; stroke-dashoffset: 600; animation: drawBoundary 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        .acellular { animation: phase5 17s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
        
        .dna-pulse { animation: pulseDNA 3s infinite ease-in-out; transform-origin: 500px 680px; }

        /* Keyframes for 17s Loop (12s animation + 5s pause) */
        /* Phase 1: 0-2s (0-11.7%) */
        @keyframes phase1 {
            0%, 2% { opacity: 0; transform: translateY(20px); }
            10%, 100% { opacity: 1; transform: translateY(0); }
        }
        
        /* Phase 2: 2-4s (11.7-23.5%) */
        @keyframes drawArrow1 {
            0%, 10% { stroke-dashoffset: 180; }
            16%, 100% { stroke-dashoffset: 0; }
        }
        @keyframes phase2 {
            0%, 15% { opacity: 0; transform: translateY(20px); }
            22%, 100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes assembleNucleus {
            0%, 18% { opacity: 0; transform: scale(0); }
            23%, 100% { opacity: 1; transform: scale(1); }
        }

        /* Phase 3: 4-7s (23.5-41.1%) */
        @keyframes drawArrowTop {
            0%, 23% { stroke-dashoffset: 450; }
            35%, 100% { stroke-dashoffset: 0; }
        }
        @keyframes phase3 {
            0%, 32% { opacity: 0; transform: translateY(20px); }
            40%, 100% { opacity: 1; transform: translateY(0); }
        }

        /* Phase 4: Functional Highlights 7-10s (41.1-58.8%) */
        @keyframes pulseChloro {
            0%, 41% { fill: #27AE60; transform: scale(1); }
            46%, 52% { fill: #2ECC71; transform: scale(1.15); }
            58%, 100% { fill: #27AE60; transform: scale(1); }
        }
        @keyframes extendHyphae {
            0%, 41% { transform: scaleY(1); }
            49% { transform: scaleY(1.08) translateY(-8px); }
            58%, 100% { transform: scaleY(1); }
        }
        @keyframes rippleMembrane {
            0%, 41% { transform: scale(1) rotate(0deg); }
            45% { transform: scale(1.04) rotate(3deg); }
            50% { transform: scale(0.96) rotate(-2deg); }
            55% { transform: scale(1.02) rotate(1deg); }
            58%, 100% { transform: scale(1) rotate(0deg); }
        }

        /* Phase 5: Exclusion 10-12s (58.8-70.5%) */
        @keyframes drawBoundary {
            0%, 58% { stroke-dashoffset: 600; }
            68%, 100% { stroke-dashoffset: 0; }
        }
        @keyframes phase5 {
            0%, 64% { opacity: 0; transform: translateX(20px); }
            70%, 100% { opacity: 1; transform: translateX(0); }
        }

        /* Continuous DNA Pulse */
        @keyframes pulseDNA {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* Hover interactivity */
        .node-group { transition: transform 0.3s ease; }
        .node-group:hover { transform: scale(1.03); }
    </style>
</head>
<body>

<svg class="svg-container" viewBox="0 0 1000 850" xmlns="http://www.w3.org/2000/svg">
    <title>Whittaker's Five Kingdom Classification System</title>
    <desc>An animated phylogenetic tree illustrating the evolutionary relationships and characteristics of Monera, Protista, Plantae, Fungi, and Animalia, while excluding acellular entities like viruses.</desc>

    <defs>
        <!-- Drop Shadow Filter -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#2C3E50" flood-opacity="0.08"/>
        </filter>

        <!-- Arrowhead Marker -->
        <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#BDC3C7" />
        </marker>
    </defs>

    <!-- TITLE & HEADER -->
    <text x="500" y="50" text-anchor="middle" class="title">Five Kingdom Classification</text>
    <text x="500" y="75" text-anchor="middle" class="subtitle">(R.H. Whittaker, 1969)</text>
    <text x="500" y="105" text-anchor="middle" class="complexity-label" fill="#E74C3C">EUKARYOTIC / MULTICELLULAR</text>
    <line x1="250" y1="115" x2="750" y2="115" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- EVOLUTIONARY PATHS (ARROWS) -->
    <!-- Arrow 1: Monera to Protista -->
    <path class="arrow1" d="M 500 630 L 500 520" fill="none" stroke="#BDC3C7" stroke-width="3" marker-end="url(#arrowhead)"/>
    
    <!-- Arrows Top: Protista to Plantae, Fungi, Animalia -->
    <g class="arrow-top">
        <!-- To Plantae -->
        <path d="M 480 430 C 350 400, 250 350, 250 280" fill="none" stroke="#BDC3C7" stroke-width="3" marker-end="url(#arrowhead)"/>
        <!-- To Fungi -->
        <path d="M 500 430 L 500 280" fill="none" stroke="#BDC3C7" stroke-width="3" marker-end="url(#arrowhead)"/>
        <!-- To Animalia -->
        <path d="M 520 430 C 650 400, 750 350, 750 280" fill="none" stroke="#BDC3C7" stroke-width="3" marker-end="url(#arrowhead)"/>
    </g>

    <!-- KINGDOM MONERA (Base) -->
    <g class="monera node-group">
        <text x="500" y="760" text-anchor="middle" class="kingdom-label">KINGDOM MONERA</text>
        <text x="500" y="780" text-anchor="middle" class="complexity-label">Prokaryotic / Unicellular</text>
        
        <g filter="url(#shadow)">
            <!-- Peptidoglycan Cell Wall (Thick Outer) -->
            <rect x="425" y="645" width="150" height="70" rx="35" fill="#E8F4FD" stroke="#3498DB" stroke-width="6"/>
            <!-- Cell Membrane (Inner) -->
            <rect x="430" y="650" width="140" height="60" rx="30" fill="none" stroke="#4A90D9" stroke-width="2" stroke-dasharray="5 3"/>
            
            <!-- Circular DNA (Genophore) -->
            <path class="dna-pulse" d="M 470 680 C 480 660, 490 690, 500 670 C 510 650, 520 690, 530 680 C 540 670, 520 660, 510 680 C 500 700, 480 690, 470 680 Z" fill="none" stroke="#FF6B6B" stroke-width="2.5"/>
            
            <!-- Ribosomes -->
            <circle cx="450" cy="670" r="2.5" fill="#98D8C8"/>
            <circle cx="455" cy="685" r="2.5" fill="#98D8C8"/>
            <circle cx="545" cy="665" r="2.5" fill="#98D8C8"/>
            <circle cx="550" cy="680" r="2.5" fill="#98D8C8"/>
            <circle cx="490" cy="695" r="2.5" fill="#98D8C8"/>
        </g>
    </g>

    <!-- KINGDOM PROTISTA (Bridge) -->
    <g class="protista node-group">
        <text x="500" y="550" text-anchor="middle" class="kingdom-label">KINGDOM PROTISTA</text>
        <text x="500" y="570" text-anchor="middle" class="complexity-label">Eukaryotic / Unicellular</text>
        
        <g filter="url(#shadow)">
            <!-- Flagellum -->
            <path d="M 560 460 C 600 440, 620 490, 660 450 C 680 430, 690 460, 710 440" fill="none" stroke="#4A90D9" stroke-width="3" stroke-linecap="round"/>
            
            <!-- Cell Body -->
            <ellipse cx="500" cy="460" rx="65" ry="45" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
            
            <!-- Nucleus (Assembles during animation) -->
            <g class="nucleus-assemble">
                <circle cx="480" cy="460" r="14" fill="#2C3E50"/>
                <circle cx="484" cy="456" r="4" fill="#E8F4FD" opacity="0.5"/> <!-- Nucleolus -->
            </g>
            
            <!-- Mitochondria -->
            <g transform="translate(515, 445) rotate(15)">
                <path d="M -10 -5 C -5 -10, 5 -10, 10 -5 C 15 0, 15 10, 10 15 C 5 20, -5 20, -10 15 C -15 10, -15 0, -10 -5 Z" fill="#E74C3C"/>
                <path d="M -8 5 L -3 2 L 2 8 L 7 3" fill="none" stroke="#FADBD8" stroke-width="1.5"/> <!-- Cristae -->
            </g>
            
            <!-- Small Vacuole/Vesicle -->
            <circle cx="520" cy="475" r="6" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1"/>
        </g>
    </g>

    <!-- KINGDOM PLANTAE (Top Left) -->
    <g class="kingdom-top node-group">
        <text x="250" y="140" text-anchor="middle" class="kingdom-label">KINGDOM PLANTAE</text>
        <text x="250" y="310" text-anchor="middle" class="nutrition-label">Phototrophic Autotrophy</text>
        
        <g filter="url(#shadow)">
            <!-- Cellulose Cell Wall -->
            <rect x="180" y="160" width="140" height="100" rx="8" fill="#EAF9F0" stroke="#2ECC71" stroke-width="6"/>
            <!-- Cell Membrane -->
            <rect x="184" y="164" width="132" height="92" rx="6" fill="none" stroke="#4A90D9" stroke-width="1.5"/>
            
            <!-- Large Central Vacuole -->
            <path d="M 195 180 C 220 170, 250 175, 255 200 C 260 230, 230 245, 205 240 C 185 235, 185 190, 195 180 Z" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1"/>
            
            <!-- Nucleus -->
            <circle cx="285" cy="230" r="12" fill="#2C3E50"/>
            
            <!-- Chloroplasts (Pulsing) -->
            <g class="chloro-pulse">
                <ellipse cx="280" cy="185" rx="12" ry="7" fill="#27AE60"/>
                <line x1="273" y1="185" x2="287" y2="185" stroke="#EAF9F0" stroke-width="1"/>
                <line x1="275" y1="182" x2="285" y2="182" stroke="#EAF9F0" stroke-width="1"/>
                <line x1="275" y1="188" x2="285" y2="188" stroke="#EAF9F0" stroke-width="1"/>
            </g>
            <g class="chloro-pulse" style="animation-delay: 0.5s;">
                <ellipse cx="220" cy="240" rx="12" ry="7" fill="#27AE60" transform="rotate(-20 220 240)"/>
                <line x1="213" y1="240" x2="227" y2="240" stroke="#EAF9F0" stroke-width="1" transform="rotate(-20 220 240)"/>
            </g>
        </g>
    </g>

    <!-- KINGDOM FUNGI (Top Center) -->
    <g class="kingdom-top node-group">
        <text x="500" y="140" text-anchor="middle" class="kingdom-label">KINGDOM FUNGI</text>
        <text x="500" y="310" text-anchor="middle" class="nutrition-label">Heterotrophic Absorption</text>
        
        <g filter="url(#shadow)" class="hyphae-extend">
            <!-- Chitinous Hyphae Structure -->
            <path d="M 490 260 L 490 210 C 490 190, 460 180, 450 160 C 440 140, 460 130, 470 130 C 480 130, 495 150, 500 170 C 505 150, 520 130, 530 130 C 540 130, 560 140, 550 160 C 540 180, 510 190, 510 210 L 510 260 Z" fill="#FDF3E7" stroke="#F39C12" stroke-width="4" stroke-linejoin="round"/>
            
            <!-- Septa (Cross-walls with pores) -->
            <line x1="490" y1="230" x2="497" y2="230" stroke="#F39C12" stroke-width="2"/>
            <line x1="503" y1="230" x2="510" y2="230" stroke="#F39C12" stroke-width="2"/>
            
            <!-- Multiple Nuclei (Coenocytic/Septate characteristics) -->
            <circle cx="500" cy="245" r="5" fill="#2C3E50"/>
            <circle cx="500" cy="215" r="5" fill="#2C3E50"/>
            <circle cx="475" cy="165" r="5" fill="#2C3E50"/>
            <circle cx="525" cy="165" r="5" fill="#2C3E50"/>
            
            <!-- Absorptive Vesicles -->
            <circle cx="450" cy="120" r="3" fill="#F39C12" opacity="0.7"/>
            <circle cx="465" cy="115" r="2" fill="#F39C12" opacity="0.7"/>
            <circle cx="535" cy="115" r="3" fill="#F39C12" opacity="0.7"/>
            <circle cx="550" cy="125" r="2" fill="#F39C12" opacity="0.7"/>
        </g>
    </g>

    <!-- KINGDOM ANIMALIA (Top Right) -->
    <g class="kingdom-top node-group">
        <text x="750" y="140" text-anchor="middle" class="kingdom-label">KINGDOM ANIMALIA</text>
        <text x="750" y="310" text-anchor="middle" class="nutrition-label">Heterotrophic Ingestion</text>
        
        <g filter="url(#shadow)">
            <!-- Cell Membrane (No Cell Wall, Complex Folding) -->
            <path class="animal-membrane" d="M 750 160 C 780 150, 810 160, 810 190 C 830 200, 820 240, 790 250 C 770 270, 730 260, 710 240 C 680 220, 690 180, 720 170 C 730 150, 740 165, 750 160 Z" fill="#FDF3E7" stroke="#4A90D9" stroke-width="4"/>
            
            <!-- Nucleus -->
            <circle cx="760" cy="205" r="14" fill="#2C3E50"/>
            <circle cx="764" cy="201" r="4" fill="#FDF3E7" opacity="0.5"/>
            
            <!-- Centrioles -->
            <g transform="translate(730, 185)">
                <rect x="0" y="0" width="4" height="10" fill="#98D8C8"/>
                <rect x="-3" y="3" width="10" height="4" fill="#98D8C8"/>
            </g>
            
            <!-- Mitochondria -->
            <g transform="translate(780, 230) rotate(-30)">
                <path d="M -8 -4 C -4 -8, 4 -8, 8 -4 C 12 0, 12 8, 8 12 C 4 16, -4 16, -8 12 C -12 8, -12 0, -8 -4 Z" fill="#E74C3C"/>
                <path d="M -6 4 L -2 2 L 2 6 L 6 2" fill="none" stroke="#FADBD8" stroke-width="1"/>
            </g>
            
            <!-- Endocytosis Vesicle -->
            <circle cx="715" cy="200" r="5" fill="#FFFFFF" stroke="#4A90D9" stroke-width="1.5"/>
        </g>
    </g>

    <!-- ACELLULAR ENTITIES (Exclusion Zone) -->
    <!-- Boundary Line -->
    <path class="boundary-line" d="M 720 820 L 1000 540" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="10 6"/>
    
    <g class="acellular">
        <text x="880" y="580" text-anchor="middle" class="sci-note">ACELLULAR ENTITIES</text>
        <text x="880" y="595" text-anchor="middle" class="sci-note" fill="#7F8C8D">Not included in 5-Kingdom System</text>
        
        <!-- "No Entry" Symbol on Boundary -->
        <g transform="translate(860, 680)">
            <circle cx="0" cy="0" r="12" fill="none" stroke="#E74C3C" stroke-width="3"/>
            <line x1="-8" y1="-8" x2="8" y2="8" stroke="#E74C3C" stroke-width="3"/>
        </g>

        <!-- Bacteriophage -->
        <g transform="translate(840, 630)">
            <!-- Capsid Head -->
            <polygon points="0,-15 10,-5 10,5 0,15 -10,5 -10,-5" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
            <!-- Viral DNA -->
            <path d="M -4 -2 Q 0 -8 4 -2 T -2 5" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
            <!-- Tail Sheath -->
            <rect x="-2" y="15" width="4" height="15" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
            <!-- Base Plate & Fibers -->
            <line x1="-6" y1="30" x2="6" y2="30" stroke="#2C3E50" stroke-width="2"/>
            <path d="M -4 30 L -12 40 M 4 30 L 12 40 M -2 30 L -6 45 M 2 30 L 6 45" fill="none" stroke="#2C3E50" stroke-width="1.5"/>
        </g>

        <!-- Viroid (Naked RNA) -->
        <g transform="translate(930, 645)">
            <path d="M -15 0 C -10 -10, -5 10, 0 0 C 5 -10, 10 10, 15 0 C 20 -10, 25 10, 20 5 C 15 15, 10 -5, 5 5 C 0 15, -5 -5, -10 5 C -15 15, -20 -5, -15 0 Z" fill="none" stroke="#FFA07A" stroke-width="2.5"/>
            <text x="0" y="25" text-anchor="middle" class="sci-note" fill="#FFA07A" style="font-size: 9px;">Viroid (RNA)</text>
        </g>
        <text x="840" y="690" text-anchor="middle" class="sci-note" fill="#98D8C8" style="font-size: 9px;">Bacteriophage</text>
    </g>

    <!-- LEGEND -->
    <g transform="translate(40, 700)">
        <rect x="0" y="0" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
        <text x="80" y="20" text-anchor="middle" class="kingdom-label" style="font-size: 12px;">Key / Legend</text>
        
        <rect x="15" y="35" width="10" height="10" rx="2" fill="#4A90D9"/>
        <text x="35" y="44" class="legend-text">Cell Membrane / Wall</text>
        
        <circle cx="20" cy="60" r="5" fill="#2C3E50"/>
        <text x="35" y="64" class="legend-text">Nucleus</text>
        
        <path d="M 15 80 Q 20 75 25 80 T 15 80" fill="none" stroke="#FF6B6B" stroke-width="2"/>
        <text x="35" y="84" class="legend-text">DNA (Genophore)</text>
        
        <rect x="15" y="95" width="10" height="10" rx="2" fill="#27AE60"/>
        <text x="35" y="104" class="legend-text">Chloroplast</text>
        
        <path d="M 100 95 C 105 90, 110 105, 115 95 Z" fill="#E74C3C"/>
        <text x="120" y="104" class="legend-text">Mitochondria</text>
    </g>

</svg>

</body>
</html>
