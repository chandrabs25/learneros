<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Measurement of Ionic Conductivity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        @keyframes needleSwing {
            0% { transform: rotate(35deg); }
            3% { transform: rotate(-35deg); }
            6% { transform: rotate(30deg); }
            9% { transform: rotate(-30deg); }
            12% { transform: rotate(35deg); }
            15% { transform: rotate(-35deg); }
            18% { transform: rotate(30deg); }
            21% { transform: rotate(-30deg); }
            24% { transform: rotate(35deg); }
            27% { transform: rotate(-35deg); }
            30% { transform: rotate(30deg); }
            33% { transform: rotate(-30deg); } /* End Phase 1 (4s) */
            38% { transform: rotate(20deg); }
            43% { transform: rotate(-15deg); }
            48% { transform: rotate(10deg); }
            53% { transform: rotate(-5deg); }
            58% { transform: rotate(2deg); }
            60% { transform: rotate(0deg); } /* Balanced at 7.2s */
            95% { transform: rotate(0deg); }
            100% { transform: rotate(35deg); } /* Reset */
        }

        @keyframes slideArrow {
            0%, 33% { transform: translateX(-15px); }
            60%, 95% { transform: translateX(15px); }
            100% { transform: translateX(-15px); }
        }

        @keyframes glowBalance {
            0%, 60% { opacity: 0; }
            65%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fadeResult {
            0%, 60% { opacity: 0; transform: translateY(10px); }
            65%, 95% { opacity: 1; transform: translateY(0px); }
            100% { opacity: 0; transform: translateY(10px); }
        }

        @keyframes pulseAC {
            0%, 100% { transform: scaleY(1); }
            50% { transform: scaleY(-1); }
        }

        @keyframes vibrateK {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(6px); }
            75% { transform: translateX(-6px); }
        }

        @keyframes vibrateCl {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        /* Applying Animations */
        .needle {
            animation: needleSwing 12s infinite linear;
            transform-origin: 250px 265px;
        }

        .r1-arrow {
            animation: slideArrow 12s infinite ease-in-out;
        }

        .bridge-glow {
            animation: glowBalance 12s infinite ease-in-out;
        }

        .result-box {
            animation: fadeResult 12s infinite ease-in-out;
        }

        .ac-wave {
            animation: pulseAC 0.15s infinite linear;
            transform-origin: 60px 250px;
        }

        .k-ion {
            animation: vibrateK 0.15s infinite ease-in-out;
        }

        .cl-ion {
            animation: vibrateCl 0.15s infinite ease-in-out;
        }

        .math-text {
            font-family: 'Roboto Mono', monospace;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Measurement of Ionic Resistance via Wheatstone Bridge</title>
        <desc>An animated diagram showing a Wheatstone bridge with an AC source used to measure the conductivity of an ionic solution without causing electrolysis.</desc>

        <defs>
            <!-- Resistor Path -->
            <path id="resistor" d="M -85,0 L -25,0 L -20,-10 L -10,10 L 0,-10 L 10,10 L 20,-10 L 25,0 L 85,0" fill="none" stroke="#555" stroke-width="2" stroke-linejoin="round"/>
            
            <!-- Arrow Markers -->
            <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#333"/>
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrow-dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#7F8C8D"/>
            </marker>

            <!-- Water Molecule Pattern -->
            <pattern id="water" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 10,10 L 15,15 L 20,10" fill="none" stroke="#B2EBF2" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M 30,30 L 35,35 L 40,30" fill="none" stroke="#B2EBF2" stroke-width="1.5" stroke-linecap="round"/>
            </pattern>

            <!-- Glow Filter -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="4" result="blur"/>
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>

            <!-- Drop Shadow Filter -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
            </filter>

            <!-- Zoom Clip Path -->
            <clipPath id="zoomClip">
                <circle cx="620" cy="240" r="130"/>
            </clipPath>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#ffffff"/>

        <!-- Title -->
        <text x="400" y="40" font-size="20" font-weight="700" fill="#333" text-anchor="middle">Measurement of Ionic Resistance via Wheatstone Bridge (AC Source)</text>

        <!-- ========================================== -->
        <!-- MACRO VIEW: WHEATSTONE BRIDGE CIRCUIT      -->
        <!-- ========================================== -->

        <!-- Bridge Glow (Active when balanced) -->
        <path class="bridge-glow" d="M 130,250 L 250,130 L 370,250 L 250,370 Z" fill="none" stroke="#44CC44" stroke-width="6" filter="url(#glow)"/>

        <!-- Outer Circuit Wires -->
        <path d="M 250,130 L 250,80 L 60,80 L 60,225" fill="none" stroke="#333" stroke-width="2"/>
        <path d="M 60,275 L 60,420 L 250,420 L 250,370" fill="none" stroke="#333" stroke-width="2"/>
        
        <!-- Inner Bridge Wires -->
        <line x1="130" y1="250" x2="225" y2="250" stroke="#333" stroke-width="2"/>
        <line x1="275" y1="250" x2="370" y2="250" stroke="#333" stroke-width="2"/>

        <!-- Resistors -->
        <use href="#resistor" x="190" y="190" transform="rotate(45, 190, 190)"/>
        <use href="#resistor" x="190" y="310" transform="rotate(-45, 190, 310)"/>
        <use href="#resistor" x="310" y="190" transform="rotate(-45, 310, 190)"/>
        
        <!-- Variable Resistor Arrow (R1) -->
        <g transform="translate(310, 190) rotate(-45)">
            <g class="r1-arrow">
                <line x1="-18" y1="18" x2="18" y2="-18" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
            </g>
        </g>

        <!-- Conductivity Cell (R2) -->
        <g transform="translate(310,310) rotate(-45)">
            <!-- Connecting wires -->
            <line x1="-85" y1="0" x2="-20" y2="0" stroke="#333" stroke-width="2"/>
            <line x1="20" y1="0" x2="85" y2="0" stroke="#333" stroke-width="2"/>
            <!-- Glass Tube -->
            <rect x="-25" y="-20" width="50" height="40" rx="4" fill="#E0F7FA" stroke="#555" stroke-width="2"/>
            <!-- Platinized Pt Electrodes -->
            <rect x="-20" y="-15" width="6" height="30" fill="#404040"/>
            <rect x="14" y="-15" width="6" height="30" fill="#404040"/>
        </g>

        <!-- Null Detector (P) -->
        <circle cx="250" cy="250" r="25" fill="white" stroke="#333" stroke-width="2"/>
        <text x="250" y="268" font-size="11" font-weight="600" fill="#777" text-anchor="middle">P</text>
        <!-- Detector Scale -->
        <path d="M 235,235 Q 250,230 265,235" fill="none" stroke="#999" stroke-width="1.5"/>
        <line x1="250" y1="233" x2="250" y2="229" stroke="#999" stroke-width="1.5"/>
        <!-- Detector Needle -->
        <line class="needle" x1="250" y1="265" x2="250" y2="232" stroke="#FF4444" stroke-width="2" stroke-linecap="round"/>
        <circle cx="250" cy="265" r="3" fill="#333"/>

        <!-- AC Source -->
        <circle cx="60" cy="250" r="25" fill="white" stroke="#333" stroke-width="2"/>
        <path class="ac-wave" d="M 40,250 Q 45,238 50,250 T 60,250 T 70,250 T 80,250" fill="none" stroke="#333" stroke-width="2"/>

        <!-- Circuit Labels -->
        <text x="350" y="150" font-size="14" font-weight="600" fill="#333">R<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-weight="400"> (Variable)</tspan></text>
        <text x="130" y="150" font-size="14" font-weight="600" fill="#333">R<tspan dy="3" font-size="10">3</tspan></text>
        <text x="130" y="360" font-size="14" font-weight="600" fill="#333">R<tspan dy="3" font-size="10">4</tspan></text>
        <text x="350" y="360" font-size="14" font-weight="600" fill="#333">R<tspan dy="3" font-size="10">2</tspan><tspan dy="-3" font-weight="400"> (Cell)</tspan></text>
        <text x="250" y="210" font-size="12" font-weight="600" fill="#555" text-anchor="middle">Null Detector</text>

        <!-- AC Source Callout -->
        <g transform="translate(15, 150)">
            <rect x="0" y="0" width="140" height="38" rx="4" fill="#FFF3CD" stroke="#FFEEBA"/>
            <text x="70" y="15" font-size="10" font-weight="600" fill="#856404" text-anchor="middle">AC source prevents</text>
            <text x="70" y="29" font-size="10" font-weight="600" fill="#856404" text-anchor="middle">electrolysis/polarization</text>
            <path d="M 45,38 L 45,70" fill="none" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
        </g>


        <!-- ========================================== -->
        <!-- MICRO VIEW: CONDUCTIVITY CELL INSET        -->
        <!-- ========================================== -->

        <!-- Zoom Lines -->
        <line x1="330" y1="290" x2="528" y2="148" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="5 5"/>
        <line x1="330" y1="330" x2="528" y2="332" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="5 5"/>

        <g id="micro-view">
            <!-- Outer Border -->
            <circle cx="620" cy="240" r="130" fill="#E0F7FA" stroke="#555" stroke-width="3"/>
            
            <g clip-path="url(#zoomClip)">
                <!-- Water Pattern Background -->
                <circle cx="620" cy="240" r="130" fill="url(#water)"/>
                
                <!-- Platinized Platinum Electrodes -->
                <rect x="490" y="100" width="25" height="280" fill="#404040"/>
                <rect x="725" y="100" width="25" height="280" fill="#404040"/>
                
                <!-- Cell Constant Dimension (l) -->
                <line x1="525" y1="340" x2="715" y2="340" stroke="#7F8C8D" stroke-width="1.5" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
                <text x="620" y="335" class="math-text" font-size="14" font-style="italic" fill="#555" text-anchor="middle">l</text>
                
                <!-- K+ Cations -->
                <g class="k-ion" transform="translate(560, 150)">
                    <circle r="14" fill="#9370DB" stroke="#333" stroke-width="1"/>
                    <text y="4" font-size="12" font-weight="700" fill="white" text-anchor="middle">K⁺</text>
                </g>
                <g class="k-ion" transform="translate(640, 280)">
                    <circle r="14" fill="#9370DB" stroke="#333" stroke-width="1"/>
                    <text y="4" font-size="12" font-weight="700" fill="white" text-anchor="middle">K⁺</text>
                </g>
                <g class="k-ion" transform="translate(680, 160)">
                    <circle r="14" fill="#9370DB" stroke="#333" stroke-width="1"/>
                    <text y="4" font-size="12" font-weight="700" fill="white" text-anchor="middle">K⁺</text>
                </g>
                <g class="k-ion" transform="translate(540, 270)">
                    <circle r="14" fill="#9370DB" stroke="#333" stroke-width="1"/>
                    <text y="4" font-size="12" font-weight="700" fill="white" text-anchor="middle">K⁺</text>
                </g>
                
                <!-- Cl- Anions -->
                <g class="cl-ion" transform="translate(600, 200)">
                    <circle r="18" fill="#44CC44" stroke="#333" stroke-width="1"/>
                    <text y="5" font-size="14" font-weight="700" fill="white" text-anchor="middle">Cl⁻</text>
                </g>
                <g class="cl-ion" transform="translate(680, 240)">
                    <circle r="18" fill="#44CC44" stroke="#333" stroke-width="1"/>
                    <text y="5" font-size="14" font-weight="700" fill="white" text-anchor="middle">Cl⁻</text>
                </g>
                <g class="cl-ion" transform="translate(535, 210)">
                    <circle r="18" fill="#44CC44" stroke="#333" stroke-width="1"/>
                    <text y="5" font-size="14" font-weight="700" fill="white" text-anchor="middle">Cl⁻</text>
                </g>
                <g class="cl-ion" transform="translate(600, 300)">
                    <circle r="18" fill="#44CC44" stroke="#333" stroke-width="1"/>
                    <text y="5" font-size="14" font-weight="700" fill="white" text-anchor="middle">Cl⁻</text>
                </g>
            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(640, 20)">
            <rect x="0" y="0" width="140" height="55" rx="4" fill="white" stroke="#DDD" filter="url(#shadow)"/>
            <circle cx="20" cy="18" r="8" fill="#9370DB" stroke="#333" stroke-width="1"/>
            <text x="35" y="22" font-size="11" fill="#333">K⁺ Cation (aq)</text>
            <circle cx="20" cy="38" r="10" fill="#44CC44" stroke="#333" stroke-width="1"/>
            <text x="35" y="42" font-size="11" fill="#333">Cl⁻ Anion (aq)</text>
        </g>


        <!-- ========================================== -->
        <!-- PHASE 3: RESULT DISPLAY FORMULAS           -->
        <!-- ========================================== -->
        <g class="result-box" transform="translate(0,0)">
            <rect x="490" y="385" width="260" height="95" rx="8" fill="white" stroke="#44CC44" stroke-width="2" filter="url(#shadow)"/>
            
            <!-- Balance Equation -->
            <text x="620" y="415" class="math-text" font-size="16" font-weight="600" fill="#333" text-anchor="middle">
                R<tspan dy="4" font-size="11">sol</tspan><tspan dy="-4"> = (R</tspan><tspan dy="4" font-size="11">1</tspan><tspan dy="-4"> × R</tspan><tspan dy="4" font-size="11">4</tspan><tspan dy="-4">) / R</tspan><tspan dy="4" font-size="11">3</tspan>
            </text>
            
            <line x1="510" y1="435" x2="730" y2="435" stroke="#EEE" stroke-width="1"/>
            
            <!-- Conductivity Relation -->
            <text x="620" y="460" class="math-text" font-size="16" font-weight="600" fill="#333" text-anchor="middle">
                κ = G* / R<tspan dy="4" font-size="11">sol</tspan>
            </text>
        </g>

    </svg>
</div>

</body>
</html>
