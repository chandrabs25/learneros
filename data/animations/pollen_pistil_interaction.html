<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Double Fertilization in Angiosperms</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        .pollen-tube {
            stroke-dasharray: 700;
            stroke-dashoffset: 700;
            animation: drawTube 12s linear infinite;
        }
        @keyframes drawTube {
            0% { stroke-dashoffset: 700; opacity: 1; }
            33% { stroke-dashoffset: 0; opacity: 1; }
            90% { stroke-dashoffset: 0; opacity: 1; }
            95% { stroke-dashoffset: 0; opacity: 0; }
            100% { stroke-dashoffset: 700; opacity: 0; }
        }
        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            fill: #2C3E50;
        }
        .label-bold {
            font-weight: 700;
        }
        .ploidy {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: 400;
        }
        .dynamic-label {
            text-shadow: 1px 1px 2px rgba(255,255,255,0.9), -1px -1px 2px rgba(255,255,255,0.9), 1px -1px 2px rgba(255,255,255,0.9), -1px 1px 2px rgba(255,255,255,0.9);
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 600" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <title>Double Fertilization in Angiosperms</title>
        <desc>Animated diagram showing the pollen tube entering the embryo sac, releasing two male gametes which fuse with the egg cell (syngamy) and polar nuclei (triple fusion).</desc>

        <defs>
            <radialGradient id="sacGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#E8F4FD"/>
            </radialGradient>
            <radialGradient id="ovuleGrad" cx="50%" cy="50%" r="50%">
                <stop offset="60%" stop-color="#eafaf1"/>
                <stop offset="100%" stop-color="#d5f5e3"/>
            </radialGradient>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="bold" text-anchor="middle" fill="#2C3E50">Double Fertilization in Angiosperms</text>
        <text x="400" y="65" font-family="Inter" font-size="14" text-anchor="middle" fill="#7f8c8d">Pollen tube journey, Syngamy, and Triple Fusion</text>

        <!-- Pistil / Style / Ovary Tissue -->
        <path d="M 320 -10 
                 C 320 150, 350 250, 380 320 
                 C 320 380, 350 560, 550 560 
                 C 750 560, 780 380, 720 320 
                 C 650 250, 420 150, 420 -10 Z" 
              fill="#eafaf1" stroke="#2ECC71" stroke-width="3" opacity="0.6"/>

        <!-- Ovule Body -->
        <path d="M 550 180 C 400 200, 400 480, 510 505 L 590 505 C 700 480, 700 200, 550 180 Z" fill="url(#ovuleGrad)" />

        <!-- Ovule Integuments (showing micropyle gap at bottom) -->
        <path d="M 510 505 C 400 480, 400 200, 550 180 C 700 200, 700 480, 590 505" fill="none" stroke="#27AE60" stroke-width="12" stroke-linecap="round"/>
        <path d="M 530 508 C 430 490, 430 220, 550 200 C 670 220, 670 490, 570 508" fill="none" stroke="#2ECC71" stroke-width="8" stroke-linecap="round"/>

        <!-- Embryo Sac (7-celled, 8-nucleate) -->
        <ellipse cx="550" cy="350" rx="90" ry="140" fill="url(#sacGrad)" stroke="#4A90D9" stroke-width="3"/>

        <!-- Antipodal Cells (Top) -->
        <g stroke="#4A90D9" stroke-width="1.5">
            <circle cx="515" cy="235" r="18" fill="#E8F4FD" />
            <circle cx="550" cy="225" r="18" fill="#E8F4FD" />
            <circle cx="585" cy="235" r="18" fill="#E8F4FD" />
            <!-- Antipodal Nuclei -->
            <circle cx="515" cy="235" r="4" fill="#2C3E50" stroke="none"/>
            <circle cx="550" cy="225" r="4" fill="#2C3E50" stroke="none"/>
            <circle cx="585" cy="235" r="4" fill="#2C3E50" stroke="none"/>
        </g>

        <!-- Synergid Cells (Bottom) -->
        <g stroke="#4A90D9" stroke-width="1.5">
            <!-- Right Synergid -->
            <circle cx="590" cy="460" r="22" fill="#E8F4FD" />
            <circle cx="590" cy="455" r="5" fill="#2C3E50" stroke="none"/>
            
            <!-- Left Synergid (Entry Point) -->
            <circle cx="510" cy="460" r="22" fill="#E8F4FD">
                <animate attributeName="fill" values="#E8F4FD; #E8F4FD; #D4E6F1; #E8F4FD; #E8F4FD" keyTimes="0; 0.33; 0.38; 0.45; 1" dur="12s" repeatCount="indefinite" />
                <animate attributeName="stroke-width" values="1.5; 1.5; 3; 1.5; 1.5" keyTimes="0; 0.33; 0.38; 0.45; 1" dur="12s" repeatCount="indefinite" />
            </circle>
            <circle cx="510" cy="455" r="5" fill="#2C3E50" stroke="none"/>
        </g>

        <!-- Filiform Apparatus -->
        <g stroke="#4A90D9" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
            <!-- Left -->
            <path d="M 500 475 Q 510 455 520 475" />
            <path d="M 495 470 Q 510 450 525 470" />
            <path d="M 505 480 Q 510 465 515 480" />
            <!-- Right -->
            <path d="M 580 475 Q 590 455 600 475" />
            <path d="M 575 470 Q 590 450 605 470" />
            <path d="M 585 480 Q 590 465 595 480" />
        </g>

        <!-- Egg Cell (Bottom Center) -->
        <circle cx="550" cy="440" r="26" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        
        <!-- Central Cell Polar Nuclei (Original) -->
        <g>
            <animate attributeName="opacity" values="1; 1; 0; 0; 1" keyTimes="0; 0.59; 0.61; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <circle cx="535" cy="330" r="10" fill="#2C3E50" />
            <circle cx="565" cy="330" r="10" fill="#2C3E50" />
        </g>

        <!-- Pollen Tube Path (Animated Drawing) -->
        <path id="tube-line" class="pollen-tube" 
              d="M 370 -10 C 370 200, 380 300, 400 400 C 420 490, 460 530, 510 530 L 510 460" 
              fill="none" stroke="#4A90D9" stroke-width="8" stroke-linecap="round" />

        <!-- Animated Gametes & Nuclei -->
        <!-- Vegetative Nucleus -->
        <circle r="7" fill="#2C3E50" opacity="0">
            <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.02; 0.30; 0.33; 1" dur="12s" repeatCount="indefinite" />
            <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                           path="M 370 -10 C 370 200, 380 300, 400 400 C 420 490, 460 530, 510 530 L 510 460"
                           keyTimes="0; 0.33; 1"
                           keyPoints="0; 1; 1" />
        </circle>

        <!-- Male Gamete 1 (Syngamy) -->
        <circle r="6" fill="#FF6B6B" opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.03; 0.05; 0.9; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                           path="M 370 -10 C 370 200, 380 300, 400 400 C 420 490, 460 530, 510 530 L 510 460 L 550 435"
                           keyTimes="0; 0.03; 0.36; 0.45; 0.55; 1"
                           keyPoints="0; 0; 0.93; 0.93; 1; 1" />
        </circle>

        <!-- Male Gamete 2 (Triple Fusion) -->
        <circle r="6" fill="#FF6B6B" opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.06; 0.08; 0.9; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <animateMotion dur="12s" repeatCount="indefinite" calcMode="linear"
                           path="M 370 -10 C 370 200, 380 300, 400 400 C 420 490, 460 530, 510 530 L 510 460 L 550 330"
                           keyTimes="0; 0.06; 0.39; 0.45; 0.60; 1"
                           keyPoints="0; 0; 0.83; 0.83; 1; 1" />
        </circle>

        <!-- Fertilization Targets (Dynamic Changes) -->
        <!-- Egg Nucleus -> Zygote -->
        <circle cx="550" cy="435" r="9" fill="#2C3E50">
            <animate attributeName="fill" values="#2C3E50; #2C3E50; #F39C12; #F39C12; #2C3E50" keyTimes="0; 0.54; 0.56; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <animate attributeName="r" values="9; 9; 13; 13; 9" keyTimes="0; 0.54; 0.56; 0.95; 1" dur="12s" repeatCount="indefinite" />
        </circle>

        <!-- Primary Endosperm Nucleus (PEN) -->
        <circle cx="550" cy="330" r="16" fill="#98D8C8" opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.59; 0.61; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <animate attributeName="r" values="12; 12; 18; 18; 12" keyTimes="0; 0.59; 0.65; 0.95; 1" dur="12s" repeatCount="indefinite" />
        </circle>


        <!-- Static Labels (Right Side) -->
        <g class="label-text">
            <line x1="605" y1="230" x2="660" y2="230" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2"/>
            <text x="665" y="235">Antipodal Cells <tspan class="ploidy">(n)</tspan></text>

            <line x1="580" y1="330" x2="660" y2="330" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2"/>
            <text x="665" y="335">Polar Nuclei <tspan class="ploidy">(n + n)</tspan></text>

            <line x1="580" y1="440" x2="660" y2="440" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2"/>
            <text x="665" y="445">Egg Cell <tspan class="ploidy">(n)</tspan></text>

            <line x1="615" y1="460" x2="660" y2="480" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2"/>
            <text x="665" y="485">Synergids <tspan class="ploidy">(n)</tspan></text>

            <line x1="600" y1="480" x2="660" y2="510" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="2"/>
            <text x="665" y="515">Filiform Apparatus</text>
        </g>

        <!-- Dynamic Labels (Left Side / Center) -->
        <!-- Pollen Tube Label -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.15; 0.85; 0.9; 1" dur="12s" repeatCount="indefinite" />
            <line x1="280" y1="345" x2="390" y2="345" stroke="#4A90D9" stroke-width="1.5" stroke-dasharray="4"/>
            <text x="270" y="350" class="label-text label-bold dynamic-label" fill="#4A90D9" text-anchor="end">Pollen Tube</text>
        </g>

        <!-- Male Gametes Label -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.20; 0.25; 0.45; 0.5; 1" dur="12s" repeatCount="indefinite" />
            <line x1="280" y1="415" x2="405" y2="415" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4"/>
            <text x="270" y="420" class="label-text label-bold dynamic-label" fill="#FF6B6B" text-anchor="end">Male Gametes <tspan class="ploidy">(n)</tspan></text>
        </g>

        <!-- Syngamy Label -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.54; 0.56; 0.9; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <text x="400" y="440" font-family="Inter" font-size="16" fill="#D35400" font-weight="bold" text-anchor="end" class="dynamic-label">Syngamy → Zygote <tspan class="ploidy">(2n)</tspan></text>
        </g>

        <!-- Triple Fusion Label -->
        <g opacity="0">
            <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.59; 0.61; 0.9; 0.95; 1" dur="12s" repeatCount="indefinite" />
            <text x="400" y="335" font-family="Inter" font-size="16" fill="#0E6655" font-weight="bold" text-anchor="end" class="dynamic-label">Triple Fusion → PEN <tspan class="ploidy">(3n)</tspan></text>
        </g>

        <!-- Legend -->
        <g transform="translate(30, 450)">
            <rect x="0" y="0" width="190" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="6" opacity="0.9"/>
            <text x="10" y="20" font-family="Inter" font-size="12" font-weight="bold" fill="#2C3E50">Key / Legend</text>
            
            <circle cx="20" cy="40" r="5" fill="#FF6B6B" />
            <text x="35" y="44" font-family="Inter" font-size="12" fill="#2C3E50">Male Gamete (n)</text>

            <circle cx="20" cy="60" r="5" fill="#2C3E50" />
            <text x="35" y="64" font-family="Inter" font-size="12" fill="#2C3E50">Vegetative / Egg Nucleus</text>

            <circle cx="20" cy="80" r="5" fill="#F39C12" />
            <text x="35" y="84" font-family="Inter" font-size="12" fill="#2C3E50">Zygote (2n)</text>

            <circle cx="20" cy="100" r="5" fill="#98D8C8" />
            <text x="35" y="104" font-family="Inter" font-size="12" fill="#2C3E50">Primary Endosperm (3n)</text>
        </g>

    </svg>
</div>

</body>
</html>
