<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electrophilic Aromatic Substitution: Nitration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Animation Keyframes (12s Loop) */
        
        /* 1. Electrophile Approach */
        @keyframes moveNO2 {
            0% { transform: translate(650px, 100px); }
            10% { transform: translate(640px, 110px); }
            15% { transform: translate(650px, 105px); }
            25%, 92% { transform: translate(485px, 165px); }
            100% { transform: translate(650px, 100px); }
        }

        /* 2. Nucleophilic Attack Arrow */
        @keyframes drawAttackArrow {
            0%, 25% { stroke-dashoffset: 200; opacity: 0; }
            26% { opacity: 1; stroke-dashoffset: 200; }
            35%, 41% { stroke-dashoffset: 0; opacity: 1; }
            42%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        /* 3. Pi Bond Fading */
        @keyframes fadeDoubleBond {
            0%, 25% { opacity: 1; }
            35%, 83% { opacity: 0; }
            85%, 100% { opacity: 1; }
        }

        /* 4. Pi Cloud Fading */
        @keyframes fadePiCloud {
            0%, 25% { opacity: 0.3; }
            35%, 83% { opacity: 0; }
            85%, 100% { opacity: 0.3; }
        }

        /* 5. C-N Bond Formation */
        @keyframes showC2NO2Bond {
            0%, 41% { opacity: 0; }
            45%, 92% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 6. N=O Bond Breaking (Octet Rule) */
        @keyframes breakNOBond {
            0%, 25% { opacity: 1; }
            35%, 92% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 7. Oxygen Negative Charge */
        @keyframes showONegative {
            0%, 25% { opacity: 0; }
            35%, 92% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* 8. Hydrogen Swing (sp2 -> sp3) */
        @keyframes swingH2 {
            0%, 41% { transform: rotate(0deg); }
            45%, 92% { transform: rotate(60deg); }
            100% { transform: rotate(0deg); }
        }

        /* 9. Sigma Complex Formation */
        @keyframes showSigmaComplex {
            0%, 41% { opacity: 0; }
            45%, 80% { opacity: 1; }
            85%, 100% { opacity: 0; }
        }

        /* 10. Deprotonation Arrow */
        @keyframes drawDeprotonationArrow {
            0%, 66% { stroke-dashoffset: 150; opacity: 0; }
            67% { opacity: 1; stroke-dashoffset: 150; }
            75%, 83% { stroke-dashoffset: 0; opacity: 1; }
            84%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        /* 11. C-H Bond Breaking */
        @keyframes fadeH2Bond {
            0%, 66% { opacity: 1; }
            70%, 92% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 12. Proton Leaving */
        @keyframes flyH2Atom {
            0%, 66% { transform: translate(0, 0); opacity: 1; }
            80%, 92% { transform: translate(80px, -40px); opacity: 0; }
            100% { transform: translate(0, 0); opacity: 1; }
        }

        /* 13. Proton Plus Charge */
        @keyframes showHPlus {
            0%, 66% { opacity: 0; }
            67%, 80% { opacity: 1; }
            81%, 100% { opacity: 0; }
        }

        /* 14. Global Reset Fade */
        @keyframes globalFade {
            0%, 92% { opacity: 1; }
            95%, 98% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Apply Animations */
        .anim-no2 { animation: moveNO2 12s infinite ease-in-out; }
        .anim-attack { animation: drawAttackArrow 12s infinite linear; stroke-dasharray: 200; }
        .anim-pi-bond { animation: fadeDoubleBond 12s infinite ease-in-out; }
        .anim-pi-cloud { animation: fadePiCloud 12s infinite ease-in-out; }
        .anim-cn-bond { animation: showC2NO2Bond 12s infinite ease-in-out; }
        .anim-no-break { animation: breakNOBond 12s infinite ease-in-out; }
        .anim-o-neg { animation: showONegative 12s infinite ease-in-out; }
        .anim-h2-swing { animation: swingH2 12s infinite ease-in-out; transform-origin: 419.3px 240px; }
        .anim-sigma { animation: showSigmaComplex 12s infinite ease-in-out; }
        .anim-deprotonation { animation: drawDeprotonationArrow 12s infinite linear; stroke-dasharray: 150; }
        .anim-h2-bond { animation: fadeH2Bond 12s infinite ease-in-out; }
        .anim-h2-fly { animation: flyH2Atom 12s infinite ease-in-out; }
        .anim-h-plus { animation: showHPlus 12s infinite ease-in-out; }
        .anim-global { animation: globalFade 12s infinite ease-in-out; }

        .atom-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            fill: white;
            text-anchor: middle;
            dominant-baseline: central;
        }
        
        .charge-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            font-weight: bold;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            fill: #333;
            text-anchor: middle;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg width="100%" height="auto" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowhead Marker -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
            <!-- Blur Filter for Pi Cloud -->
            <filter id="blur">
                <feGaussianBlur stdDeviation="6" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Title -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="600" text-anchor="middle" fill="#222">Electrophilic Aromatic Substitution: Nitration</text>
        <text x="400" y="65" font-family="Inter" font-size="14" text-anchor="middle" fill="#666">Mechanism: Nucleophilic Attack → σ-Complex Intermediate → Deprotonation</text>

        <!-- Global Animation Wrapper -->
        <g class="anim-global">
            
            <!-- Pi Electron Cloud -->
            <ellipse cx="350" cy="280" rx="75" ry="85" fill="#A9D6E5" class="anim-pi-cloud" filter="url(#blur)" />

            <!-- BENZENE RING SKELETON -->
            <g id="benzene_skeleton">
                <!-- Hexagon Single Bonds -->
                <polygon points="350,200 419.3,240 419.3,320 350,360 280.7,320 280.7,240" fill="none" stroke="#333" stroke-width="3"/>
                
                <!-- Static Double Bonds -->
                <line x1="408" y1="315" x2="354" y2="346" stroke="#555" stroke-width="3"/>
                <line x1="294" y1="312" x2="294" y2="248" stroke="#555" stroke-width="3"/>
                
                <!-- Animated Double Bond (C1-C2) -->
                <line x1="354" y1="214" x2="408" y2="245" stroke="#555" stroke-width="3" class="anim-pi-bond"/>

                <!-- Static C-H Bonds -->
                <line x1="350" y1="200" x2="350" y2="160" stroke="#333" stroke-width="3"/>
                <line x1="419.3" y1="320" x2="454" y2="340" stroke="#333" stroke-width="3"/>
                <line x1="350" y1="360" x2="350" y2="400" stroke="#333" stroke-width="3"/>
                <line x1="280.7" y1="320" x2="246" y2="340" stroke="#333" stroke-width="3"/>
                <line x1="280.7" y1="240" x2="246" y2="220" stroke="#333" stroke-width="3"/>
            </g>

            <!-- SIGMA COMPLEX (Wheland Intermediate) -->
            <g class="anim-sigma">
                <!-- Delocalized Positive Charge (Dashed Arc) -->
                <path d="M 350 215 A 65 65 0 1 0 408 315" stroke="#44CC44" stroke-width="3" fill="none" stroke-dasharray="8,5" />
                <!-- Plus Sign in Center -->
                <text x="340" y="280" fill="#44CC44" class="charge-text">+</text>
                <!-- Intermediate Label -->
                <text x="350" y="450" font-family="Inter" font-size="15" font-weight="600" text-anchor="middle" fill="#44CC44">σ-complex (High Energy Intermediate)</text>
            </g>

            <!-- C2 to NO2 Bond (Forms during intermediate) -->
            <line x1="419.3" y1="240" x2="485" y2="165" stroke="#333" stroke-width="3" class="anim-cn-bond" />

            <!-- ANIMATED H2 GROUP (Swings and Leaves) -->
            <g class="anim-h2-swing">
                <!-- C2-H2 Bond -->
                <line x1="419.3" y1="240" x2="454" y2="220" stroke="#333" stroke-width="3" class="anim-h2-bond"/>
                <!-- H2 Atom -->
                <g class="anim-h2-fly">
                    <circle cx="454" cy="220" r="8" fill="#CCCCCC" />
                    <text x="454" y="220" class="atom-text" fill="#333">H</text>
                    <!-- Proton Charge (Appears when leaving) -->
                    <text x="466" y="212" fill="#FF4444" class="charge-text anim-h-plus">+</text>
                </g>
            </g>

            <!-- BENZENE ATOMS (Static) -->
            <g id="benzene_atoms">
                <!-- Carbons -->
                <circle cx="350" cy="200" r="12" fill="#404040"/><text x="350" y="200" class="atom-text">C</text>
                <circle cx="419.3" cy="240" r="12" fill="#404040"/><text x="419.3" y="240" class="atom-text">C</text>
                <circle cx="419.3" cy="320" r="12" fill="#404040"/><text x="419.3" y="320" class="atom-text">C</text>
                <circle cx="350" cy="360" r="12" fill="#404040"/><text x="350" y="360" class="atom-text">C</text>
                <circle cx="280.7" cy="320" r="12" fill="#404040"/><text x="280.7" y="320" class="atom-text">C</text>
                <circle cx="280.7" cy="240" r="12" fill="#404040"/><text x="280.7" y="240" class="atom-text">C</text>
                
                <!-- Hydrogens -->
                <circle cx="350" cy="160" r="8" fill="#CCCCCC"/><text x="350" y="160" class="atom-text" fill="#333">H</text>
                <circle cx="454" cy="340" r="8" fill="#CCCCCC"/><text x="454" y="340" class="atom-text" fill="#333">H</text>
                <circle cx="350" cy="400" r="8" fill="#CCCCCC"/><text x="350" y="400" class="atom-text" fill="#333">H</text>
                <circle cx="246" cy="340" r="8" fill="#CCCCCC"/><text x="246" y="340" class="atom-text" fill="#333">H</text>
                <circle cx="246" cy="220" r="8" fill="#CCCCCC"/><text x="246" y="220" class="atom-text" fill="#333">H</text>
            </g>

            <!-- ELECTROPHILE (NO2+) -->
            <g class="anim-no2">
                <!-- Rotated to align bonds properly -->
                <g transform="rotate(33.7)">
                    <!-- Bonds to O1 (Left) -->
                    <line x1="-35" y1="-4" x2="0" y2="-4" stroke="#555" stroke-width="3"/>
                    <line x1="-35" y1="4" x2="0" y2="4" stroke="#555" stroke-width="3"/>
                    
                    <!-- Bonds to O2 (Right) - One breaks to satisfy octet rule -->
                    <line x1="0" y1="-4" x2="35" y2="-4" stroke="#555" stroke-width="3"/>
                    <line x1="0" y1="4" x2="35" y2="4" stroke="#555" stroke-width="3" class="anim-no-break"/>
                    
                    <!-- Atoms -->
                    <circle cx="0" cy="0" r="11" fill="#4444FF"/>
                    <text x="0" y="0" class="atom-text">N</text>
                    
                    <circle cx="-35" cy="0" r="11" fill="#FF4444"/>
                    <text x="-35" y="0" class="atom-text">O</text>
                    
                    <circle cx="35" cy="0" r="11" fill="#FF4444"/>
                    <text x="35" y="0" class="atom-text">O</text>
                    
                    <!-- Formal Charges -->
                    <text x="0" y="-18" fill="#4444FF" class="charge-text">+</text>
                    <text x="35" y="-18" fill="#FF4444" class="charge-text anim-o-neg">-</text>
                </g>
                <!-- Electrophile Label (Moves with molecule) -->
                <text x="0" y="-45" class="label-text" font-weight="600">Electrophile (NO₂⁺)</text>
            </g>

            <!-- CURLY ARROWS (Electron Flow) -->
            <!-- 1. Nucleophilic Attack Arrow (From Pi bond to N) -->
            <path d="M 381 230 Q 420 160 472 165" fill="none" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrowhead)" class="anim-attack" />
            
            <!-- 2. Deprotonation Arrow (From C-H bond to Pi system) -->
            <path d="M 432 262 Q 400 290 381 235" fill="none" stroke="#F77F00" stroke-width="2.5" marker-end="url(#arrowhead)" class="anim-deprotonation" />

            <!-- Static Labels -->
            <text x="350" y="430" class="label-text">Nucleophile (Electron Rich π-system)</text>
        </g>

        <!-- Legend -->
        <g transform="translate(610, 360)">
            <rect x="0" y="0" width="170" height="120" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" rx="6" />
            <text x="85" y="20" font-family="Inter" font-size="12" font-weight="600" text-anchor="middle" fill="#555">LEGEND</text>
            
            <circle cx="20" cy="40" r="6" fill="#404040"/>
            <text x="35" y="44" font-family="Inter" font-size="12" fill="#333">Carbon (C)</text>
            
            <circle cx="20" cy="60" r="6" fill="#4444FF"/>
            <text x="35" y="64" font-family="Inter" font-size="12" fill="#333">Nitrogen (N)</text>
            
            <circle cx="100" cy="40" r="6" fill="#FF4444"/>
            <text x="115" y="44" font-family="Inter" font-size="12" fill="#333">Oxygen (O)</text>
            
            <circle cx="100" cy="60" r="6" fill="#CCCCCC"/>
            <text x="115" y="64" font-family="Inter" font-size="12" fill="#333">Hydrogen (H)</text>
            
            <path d="M 15 85 Q 25 75 35 85" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="45" y="89" font-family="Inter" font-size="12" fill="#333">Electron Flow</text>

            <line x1="15" y1="105" x2="35" y2="105" stroke="#44CC44" stroke-width="2" stroke-dasharray="4,2"/>
            <text x="45" y="109" font-family="Inter" font-size="12" fill="#333">Intermediate State</text>
        </g>

    </svg>
</div>

</body>
</html>
