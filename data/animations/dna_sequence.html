<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Human Genome Project: From Molecule to Digital Code</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            background-color: #f8f9fa;
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .scroll-dna {
            animation: scroll-dna 10s linear infinite;
        }

        .scroll-history {
            animation: scroll-history 2s linear infinite;
        }

        .sensor-pulse {
            animation: pulse 0.2s infinite;
        }

        .falling-letter {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-weight: bold;
            opacity: 0;
            animation: drop 2s linear infinite;
        }

        .terminal-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-weight: bold;
            fill: #98D8C8;
            text-shadow: 0 0 8px rgba(152, 216, 200, 0.4);
        }

        @keyframes scroll-dna {
            from { transform: translateX(0); }
            to { transform: translateX(-1000px); }
        }

        @keyframes scroll-history {
            from { transform: translateX(0); }
            to { transform: translateX(-200px); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; filter: drop-shadow(0 0 12px #2ECC71); }
        }

        @keyframes drop {
            0% { transform: translate(400px, 200px); opacity: 1; }
            25% { transform: translate(400px, 465px); opacity: 1; }
            25.01% { opacity: 0; transform: translate(400px, 465px); }
            100% { opacity: 0; transform: translate(400px, 465px); }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowhead for annotations -->
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
                </marker>

                <!-- Terminal Grid Pattern -->
                <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#34495E" stroke-width="0.5" opacity="0.5"/>
                </pattern>

                <!-- Sensor Glow Gradient -->
                <radialGradient id="sensor-glow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#2ECC71" stop-opacity="0.8"/>
                    <stop offset="100%" stop-color="#2ECC71" stop-opacity="0"/>
                </radialGradient>

                <!-- Single DNA Turn (200px wide, 10 base pairs) -->
                <g id="dna-turn">
                    <!-- Half Turn 1 (x: 0 to 100) -->
                    <!-- Back Backbone (3' to 5') -->
                    <path d="M 0 200 C 36.4 250, 63.6 250, 100 200" stroke="#E05A5A" stroke-width="8" fill="none" stroke-linecap="round"/>
                    
                    <!-- Base Pairs 1 to 5 -->
                    <!-- bp1: A-T -->
                    <line x1="10" y1="184.5" x2="10" y2="200" stroke="#27AE60" stroke-width="6"/>
                    <line x1="10" y1="200" x2="10" y2="215.5" stroke="#E74C3C" stroke-width="6"/>
                    <!-- bp2: C-G -->
                    <line x1="30" y1="159.5" x2="30" y2="200" stroke="#3498DB" stroke-width="6"/>
                    <line x1="30" y1="200" x2="30" y2="240.5" stroke="#F1C40F" stroke-width="6"/>
                    <!-- bp3: G-C -->
                    <line x1="50" y1="150" x2="50" y2="200" stroke="#F1C40F" stroke-width="6"/>
                    <line x1="50" y1="200" x2="50" y2="250" stroke="#3498DB" stroke-width="6"/>
                    <!-- bp4: T-A -->
                    <line x1="70" y1="159.5" x2="70" y2="200" stroke="#E74C3C" stroke-width="6"/>
                    <line x1="70" y1="200" x2="70" y2="240.5" stroke="#27AE60" stroke-width="6"/>
                    <!-- bp5: A-T -->
                    <line x1="90" y1="184.5" x2="90" y2="200" stroke="#27AE60" stroke-width="6"/>
                    <line x1="90" y1="200" x2="90" y2="215.5" stroke="#E74C3C" stroke-width="6"/>
                    
                    <!-- Front Backbone (5' to 3') -->
                    <path d="M 0 200 C 36.4 150, 63.6 150, 100 200" stroke="#FF6B6B" stroke-width="8" fill="none" stroke-linecap="round"/>

                    <!-- Half Turn 2 (x: 100 to 200) -->
                    <!-- Back Backbone (5' to 3') -->
                    <path d="M 100 200 C 136.4 250, 163.6 250, 200 200" stroke="#E05A5A" stroke-width="8" fill="none" stroke-linecap="round"/>
                    
                    <!-- Base Pairs 6 to 10 -->
                    <!-- bp6: C-G -->
                    <line x1="110" y1="184.5" x2="110" y2="200" stroke="#F1C40F" stroke-width="6"/>
                    <line x1="110" y1="200" x2="110" y2="215.5" stroke="#3498DB" stroke-width="6"/>
                    <!-- bp7: A-T -->
                    <line x1="130" y1="159.5" x2="130" y2="200" stroke="#E74C3C" stroke-width="6"/>
                    <line x1="130" y1="200" x2="130" y2="240.5" stroke="#27AE60" stroke-width="6"/>
                    <!-- bp8: T-A -->
                    <line x1="150" y1="150" x2="150" y2="200" stroke="#27AE60" stroke-width="6"/>
                    <line x1="150" y1="200" x2="150" y2="250" stroke="#E74C3C" stroke-width="6"/>
                    <!-- bp9: G-C -->
                    <line x1="170" y1="159.5" x2="170" y2="200" stroke="#3498DB" stroke-width="6"/>
                    <line x1="170" y1="200" x2="170" y2="240.5" stroke="#F1C40F" stroke-width="6"/>
                    <!-- bp10: C-G -->
                    <line x1="190" y1="184.5" x2="190" y2="200" stroke="#F1C40F" stroke-width="6"/>
                    <line x1="190" y1="200" x2="190" y2="215.5" stroke="#3498DB" stroke-width="6"/>
                    
                    <!-- Front Backbone (3' to 5') -->
                    <path d="M 100 200 C 136.4 150, 163.6 150, 200 200" stroke="#FF6B6B" stroke-width="8" fill="none" stroke-linecap="round"/>
                </g>

                <!-- Terminal History Text Chunk (200px wide) -->
                <g id="history-chunk" class="terminal-text">
                    <text x="0" y="465" text-anchor="middle">A</text>
                    <text x="20" y="465" text-anchor="middle">C</text>
                    <text x="40" y="465" text-anchor="middle">G</text>
                    <text x="60" y="465" text-anchor="middle">T</text>
                    <text x="80" y="465" text-anchor="middle">A</text>
                    <text x="100" y="465" text-anchor="middle">C</text>
                    <text x="120" y="465" text-anchor="middle">A</text>
                    <text x="140" y="465" text-anchor="middle">T</text>
                    <text x="160" y="465" text-anchor="middle">G</text>
                    <text x="180" y="465" text-anchor="middle">C</text>
                </g>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f8f9fa"/>

            <!-- Title and Subtitle -->
            <text x="25" y="40" font-size="22" font-weight="700" fill="#2C3E50">The Human Genome Project: DNA Sequencing</text>
            <text x="25" y="65" font-family="Roboto Mono" font-size="14" fill="#4A90D9">Bioinformatics: Processing 3 × 10<tspan dy="-5" font-size="10">9</tspan><tspan dy="5"> base pairs</tspan></text>

            <!-- Legend -->
            <g transform="translate(630, 20)">
                <rect width="145" height="105" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="6"/>
                <text x="10" y="20" font-size="12" font-weight="700" fill="#2C3E50">Nitrogenous Bases</text>
                
                <rect x="10" y="32" width="12" height="12" fill="#27AE60" rx="2"/>
                <text x="30" y="42" font-size="11" fill="#2C3E50">Adenine (A)</text>
                
                <rect x="10" y="49" width="12" height="12" fill="#E74C3C" rx="2"/>
                <text x="30" y="59" font-size="11" fill="#2C3E50">Thymine (T)</text>
                
                <rect x="10" y="66" width="12" height="12" fill="#3498DB" rx="2"/>
                <text x="30" y="76" font-size="11" fill="#2C3E50">Cytosine (C)</text>
                
                <rect x="10" y="83" width="12" height="12" fill="#F1C40F" rx="2"/>
                <text x="30" y="93" font-size="11" fill="#2C3E50">Guanine (G)</text>
            </g>

            <!-- Annotations -->
            <g>
                <line x1="160" y1="90" x2="160" y2="140" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="160" y="80" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Sugar-Phosphate Backbone</text>

                <line x1="260" y1="320" x2="260" y2="230" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)"/>
                <text x="260" y="335" font-size="13" font-weight="600" fill="#2C3E50" text-anchor="middle">Complementary Base Pairing</text>
            </g>

            <!-- DNA Scrolling Group -->
            <g class="scroll-dna">
                <!-- 10 turns to create a seamless 10-second loop (2000px total width) -->
                <use href="#dna-turn" x="0"/>
                <use href="#dna-turn" x="200"/>
                <use href="#dna-turn" x="400"/>
                <use href="#dna-turn" x="600"/>
                <use href="#dna-turn" x="800"/>
                <use href="#dna-turn" x="1000"/>
                <use href="#dna-turn" x="1200"/>
                <use href="#dna-turn" x="1400"/>
                <use href="#dna-turn" x="1600"/>
                <use href="#dna-turn" x="1800"/>
            </g>

            <!-- Entry/Exit Pores (to frame the DNA visually) -->
            <path d="M 0 120 C 25 120, 25 280, 0 280" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round"/>
            <path d="M 800 120 C 775 120, 775 280, 800 280" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round"/>
            
            <!-- 5' and 3' Labels -->
            <text x="15" y="185" font-size="14" font-weight="700" fill="#FF6B6B">5'</text>
            <text x="15" y="225" font-size="14" font-weight="700" fill="#FF6B6B">3'</text>
            <text x="770" y="185" font-size="14" font-weight="700" fill="#FF6B6B">3'</text>
            <text x="770" y="225" font-size="14" font-weight="700" fill="#FF6B6B">5'</text>

            <!-- Sequencing Sensor -->
            <g>
                <text x="400" y="95" font-size="14" font-weight="700" fill="#27AE60" text-anchor="middle">High-Throughput Sequencing Sensor</text>
                <line x1="400" y1="105" x2="400" y2="120" stroke="#27AE60" stroke-width="2"/>
                
                <!-- Sensor Body -->
                <rect x="385" y="120" width="30" height="160" fill="rgba(232, 244, 253, 0.5)" stroke="#4A90D9" stroke-width="2" rx="4"/>
                
                <!-- Pulsing Scan Area -->
                <rect x="370" y="150" width="60" height="100" fill="url(#sensor-glow)" class="sensor-pulse"/>
                <line x1="385" y1="200" x2="415" y2="200" stroke="#2ECC71" stroke-width="2"/>
            </g>

            <!-- Bioinformatics Terminal Area -->
            <g transform="translate(0, 400)">
                <!-- Terminal Background -->
                <rect width="800" height="100" fill="#2C3E50"/>
                <rect y="20" width="800" height="80" fill="url(#grid)"/>
                
                <!-- Terminal Header -->
                <rect width="800" height="20" fill="#1A252F"/>
                <circle cx="15" cy="10" r="4" fill="#E74C3C"/>
                <circle cx="30" cy="10" r="4" fill="#F1C40F"/>
                <circle cx="45" cy="10" r="4" fill="#27AE60"/>
                <text x="65" y="14" font-family="Roboto Mono" font-size="11" fill="#98D8C8">user@hgp-server:~/bioinformatics/sequence_data$ tail -f genome.txt</text>

                <!-- Scrolling History Text -->
                <!-- The history group is shifted by +60px so that the letters perfectly align with the falling letters at x=400 -->
                <g class="scroll-history">
                    <use href="#history-chunk" x="-140"/>
                    <use href="#history-chunk" x="60"/>
                    <use href="#history-chunk" x="260"/>
                    <use href="#history-chunk" x="460"/>
                    <use href="#history-chunk" x="660"/>
                    <use href="#history-chunk" x="860"/>
                </g>

                <!-- Terminal Cover (Hides the history text until it passes the sensor at x=400) -->
                <rect x="400" y="20" width="400" height="80" fill="#2C3E50"/>
                <rect x="400" y="20" width="400" height="80" fill="url(#grid)"/>
                
                <!-- Blinking Cursor -->
                <rect x="408" y="52" width="10" height="18" fill="#98D8C8">
                    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
                </rect>
            </g>

            <!-- Falling Letters (Emitted from Sensor to Terminal) -->
            <!-- Each letter corresponds to a base pair passing the sensor. Loop duration is 2s. -->
            <g>
                <text class="falling-letter" style="animation-delay: 0.1s;" fill="#27AE60">A</text>
                <text class="falling-letter" style="animation-delay: 0.3s;" fill="#3498DB">C</text>
                <text class="falling-letter" style="animation-delay: 0.5s;" fill="#F1C40F">G</text>
                <text class="falling-letter" style="animation-delay: 0.7s;" fill="#E74C3C">T</text>
                <text class="falling-letter" style="animation-delay: 0.9s;" fill="#27AE60">A</text>
                <text class="falling-letter" style="animation-delay: 1.1s;" fill="#3498DB">C</text>
                <text class="falling-letter" style="animation-delay: 1.3s;" fill="#27AE60">A</text>
                <text class="falling-letter" style="animation-delay: 1.5s;" fill="#E74C3C">T</text>
                <text class="falling-letter" style="animation-delay: 1.7s;" fill="#F1C40F">G</text>
                <text class="falling-letter" style="animation-delay: 1.9s;" fill="#3498DB">C</text>
            </g>
        </svg>
    </div>
</body>
</html>
