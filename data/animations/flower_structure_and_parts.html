<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Structure of the Megasporangium (Anatropous Ovule)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .diagram-container {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-family: 'Roboto Mono', monospace; font-size: 14px; fill: #7f8c8d; }
        .label { font-size: 13px; fill: #2C3E50; font-weight: 600; }
        .label-desc { font-size: 11px; fill: #7f8c8d; font-weight: 400; }
        .legend-text { font-size: 12px; fill: #2C3E50; }

        /* Animation Classes */
        .micro-view {
            animation: fadeInOut 15s ease-in-out infinite;
        }
        
        .mag-box {
            animation: magBoxAnim 15s ease-in-out infinite;
            transform-origin: 200px 420px;
        }

        .label-group-1 {
            animation: labelFade1 15s ease-in-out infinite;
        }

        .label-group-2 {
            animation: labelFade2 15s ease-in-out infinite;
        }

        .embryo-sac-pulse {
            animation: pulseSac 15s ease-in-out infinite;
            transform-origin: 740px 360px;
        }

        .macro-pollen-tube {
            stroke-dasharray: 320;
            stroke-dashoffset: 320;
            animation: growMacroPollen 15s linear infinite;
        }

        .micro-pollen-tube {
            stroke-dasharray: 150;
            stroke-dashoffset: 150;
            animation: growMicroPollen 15s linear infinite;
        }

        /* Keyframes */
        @keyframes fadeInOut {
            0%, 15% { opacity: 0; transform: translateX(20px); }
            25%, 95% { opacity: 1; transform: translateX(0); }
            100% { opacity: 0; }
        }

        @keyframes magBoxAnim {
            0%, 5% { opacity: 0; transform: scale(0.8); }
            10%, 20% { opacity: 1; transform: scale(1); }
            25%, 100% { opacity: 0; }
        }

        @keyframes labelFade1 {
            0%, 25% { opacity: 0; transform: translateY(5px); }
            30%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }

        @keyframes labelFade2 {
            0%, 40% { opacity: 0; transform: translateY(5px); }
            45%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }

        @keyframes pulseSac {
            0%, 40% { filter: drop-shadow(0 0 0px rgba(241, 196, 15, 0)); transform: scale(1); }
            50%, 65% { filter: drop-shadow(0 0 12px rgba(241, 196, 15, 0.6)); transform: scale(1.02); }
            75%, 100% { filter: drop-shadow(0 0 0px rgba(241, 196, 15, 0)); transform: scale(1); }
        }

        @keyframes growMacroPollen {
            0%, 60% { stroke-dashoffset: 320; opacity: 1; }
            75%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes growMicroPollen {
            0%, 75% { stroke-dashoffset: 150; opacity: 1; }
            85%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Interactive Hover (Optional enhancement) */
        .hover-highlight:hover {
            filter: brightness(1.1);
            transition: filter 0.3s;
        }
    </style>
</head>
<body>

<div class="diagram-container">
    <svg viewBox="0 0 1000 600" role="img" aria-label="Animated diagram of the Gynoecium and Anatropous Ovule">
        <title>Structure of the Megasporangium (Anatropous Ovule)</title>
        
        <defs>
            <!-- Gradients -->
            <radialGradient id="ovaryGrad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#48D185"/>
                <stop offset="100%" stop-color="#27AE60"/>
            </radialGradient>
            
            <linearGradient id="styleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#27AE60"/>
                <stop offset="50%" stop-color="#2ECC71"/>
                <stop offset="100%" stop-color="#27AE60"/>
            </linearGradient>

            <radialGradient id="esGrad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFF9C4"/>
                <stop offset="100%" stop-color="#FFF176"/>
            </radialGradient>

            <!-- Arrowhead for labels -->
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#7f8c8d" />
            </marker>
            
            <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
                <path d="M 10 1 L 0 5 L 10 9 z" fill="#7f8c8d" />
            </marker>

            <!-- Drop Shadow -->
            <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
                <feDropShadow dx="2" dy="5" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
        </defs>

        <!-- Background / Grid -->
        <rect width="100%" height="100%" fill="#ffffff" />
        <line x1="350" y1="100" x2="350" y2="550" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="10,10" />

        <!-- Title Section -->
        <g transform="translate(40, 40)">
            <text x="0" y="0" class="title">Structure of the Megasporangium</text>
            <text x="0" y="25" class="subtitle">Anatropous Ovule • 7-celled, 8-nucleate Embryo Sac</text>
        </g>

        <!-- ========================================== -->
        <!-- MACRO VIEW: THE PISTIL (Left Side)         -->
        <!-- ========================================== -->
        <g id="macro-pistil" filter="url(#shadow)">
            <!-- Stigma, Style, Ovary Path -->
            <path d="M 170 140 
                     Q 200 120 230 140 
                     Q 245 155 230 165 
                     L 215 165 
                     L 215 365 
                     A 65 65 0 1 1 185 365 
                     L 185 165 
                     L 170 165 
                     Q 155 155 170 140 Z" 
                  fill="url(#ovaryGrad)" stroke="#1E8449" stroke-width="2" class="hover-highlight"/>
            
            <!-- Stigma Texture (Fuzzy) -->
            <path d="M 170 140 Q 180 130 190 140 Q 200 125 210 140 Q 220 130 230 140" fill="none" stroke="#1E8449" stroke-width="2" stroke-linecap="round"/>
            <path d="M 175 145 Q 185 135 195 145 Q 205 135 215 145 Q 225 135 230 145" fill="none" stroke="#1E8449" stroke-width="2" stroke-linecap="round"/>

            <!-- Mini Anatropous Ovule inside Ovary -->
            <g transform="translate(200, 420)">
                <!-- Placenta -->
                <circle cx="-15" cy="0" r="6" fill="#2C3E50" opacity="0.2"/>
                <!-- Mini Ovule Path (Inverted J shape) -->
                <path d="M -12 15 L -12 -5 A 12 12 0 1 1 12 5 A 6 6 0 1 1 0 5 L 0 15" fill="none" stroke="#E8F4FD" stroke-width="6" stroke-linecap="round"/>
                <path d="M -12 15 L -12 -5 A 12 12 0 1 1 12 5 A 6 6 0 1 1 0 5 L 0 15" fill="none" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Macro Pollen Tube (Animated) -->
            <path class="macro-pollen-tube" d="M 200 135 L 200 435" stroke="#E74C3C" stroke-width="3" fill="none" stroke-linecap="round"/>
            <!-- Pollen Grain -->
            <circle cx="200" cy="135" r="4" fill="#F39C12" stroke="#D68910" stroke-width="1"/>
            <circle cx="185" cy="138" r="3" fill="#F39C12" opacity="0.7"/>
            <circle cx="215" cy="140" r="3.5" fill="#F39C12" opacity="0.8"/>
        </g>

        <!-- Macro Labels -->
        <g id="macro-labels">
            <line x1="100" y1="150" x2="165" y2="150" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="90" y="154" class="label" text-anchor="end">Stigma</text>
            
            <line x1="100" y1="260" x2="180" y2="260" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="90" y="264" class="label" text-anchor="end">Style</text>
            
            <line x1="100" y1="420" x2="130" y2="420" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="90" y="424" class="label" text-anchor="end">Ovary</text>
        </g>

        <!-- Magnifying Box Animation -->
        <g class="mag-box">
            <rect x="120" y="340" width="160" height="160" rx="10" fill="none" stroke="#3498DB" stroke-width="2" stroke-dasharray="6,6"/>
            <line x1="280" y1="420" x2="500" y2="360" stroke="#3498DB" stroke-width="1" stroke-dasharray="4,4"/>
            <line x1="200" y1="340" x2="500" y2="150" stroke="#3498DB" stroke-width="1" stroke-dasharray="4,4"/>
        </g>

        <!-- ========================================== -->
        <!-- MICRO VIEW: ANATROPOUS OVULE (Right Side)  -->
        <!-- ========================================== -->
        <g class="micro-view" transform="translate(0, 0)">
            
            <g filter="url(#shadow)">
                <!-- Outer Integument & Funicle -->
                <path d="M 630 550 
                         L 630 300 
                         A 110 150 0 0 1 850 300 
                         L 850 480 
                         A 30 30 0 0 1 790 480 
                         L 790 300 
                         A 50 80 0 0 0 690 300 
                         L 690 480 
                         A 30 30 0 0 1 630 480 
                         L 630 550 Z" 
                      fill="#27AE60" class="hover-highlight"/>

                <!-- Inner Integument -->
                <path d="M 690 490 
                         L 690 300 
                         A 50 80 0 0 1 790 300 
                         L 790 490 
                         A 10 10 0 0 1 770 490 
                         L 770 300 
                         A 30 60 0 0 0 710 300 
                         L 710 490 
                         A 10 10 0 0 1 690 490 Z" 
                      fill="#2ECC71" class="hover-highlight"/>

                <!-- Nucellus -->
                <path d="M 710 480 
                         L 710 300 
                         A 30 60 0 0 1 770 300 
                         L 770 480 
                         A 30 15 0 0 1 710 480 Z" 
                      fill="#E8F4FD" class="hover-highlight"/>
            </g>

            <!-- Vascular Bundle in Funicle/Raphe -->
            <path d="M 660 550 L 660 300 A 80 120 0 0 1 740 180" stroke="#3498DB" stroke-width="3" fill="none" stroke-dasharray="6,4" opacity="0.8"/>

            <!-- Embryo Sac (Animated Pulse) -->
            <g class="embryo-sac-pulse">
                <rect x="718" y="250" width="44" height="210" rx="22" fill="url(#esGrad)" stroke="#F1C40F" stroke-width="1"/>
                
                <!-- Antipodals (Chalazal End - Top) -->
                <g id="antipodals">
                    <circle cx="740" cy="265" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="740" cy="265" r="1.5" fill="#2C3E50"/>
                    
                    <circle cx="729" cy="275" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="729" cy="275" r="1.5" fill="#2C3E50"/>
                    
                    <circle cx="751" cy="275" r="7" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="751" cy="275" r="1.5" fill="#2C3E50"/>
                </g>

                <!-- Central Cell & Polar Nuclei -->
                <g id="central-cell">
                    <circle cx="736" cy="350" r="4" fill="#2C3E50"/>
                    <circle cx="744" cy="350" r="4" fill="#2C3E50"/>
                    <!-- Faint vacuole indication -->
                    <ellipse cx="740" cy="315" rx="12" ry="20" fill="#ffffff" opacity="0.4"/>
                    <ellipse cx="740" cy="390" rx="12" ry="20" fill="#ffffff" opacity="0.4"/>
                </g>

                <!-- Egg Apparatus (Micropylar End - Bottom) -->
                <g id="egg-apparatus">
                    <!-- Egg Cell (Center, slightly behind synergids) -->
                    <ellipse cx="740" cy="425" rx="11" ry="15" fill="#FFA07A" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="740" cy="420" r="2.5" fill="#2C3E50"/>

                    <!-- Synergids (Sides) -->
                    <ellipse cx="727" cy="440" rx="8" ry="15" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="727" cy="435" r="2" fill="#2C3E50"/>
                    
                    <ellipse cx="753" cy="440" rx="8" ry="15" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                    <circle cx="753" cy="435" r="2" fill="#2C3E50"/>

                    <!-- Filiform Apparatus (Finger-like projections) -->
                    <path d="M 722 452 L 725 445 L 728 452 L 731 445" stroke="#2C3E50" stroke-width="1" fill="none"/>
                    <path d="M 749 452 L 752 445 L 755 452 L 758 445" stroke="#2C3E50" stroke-width="1" fill="none"/>
                </g>
            </g>

            <!-- Micro Pollen Tube Entry (Animated) -->
            <path class="micro-pollen-tube" d="M 740 580 L 740 470 C 740 460, 753 460, 753 450" stroke="#E74C3C" stroke-width="5" fill="none" stroke-linecap="round"/>

            <!-- ========================================== -->
            <!-- MICRO LABELS                               -->
            <!-- ========================================== -->
            
            <!-- Group 1: Structural Outer Parts -->
            <g class="label-group-1">
                <line x1="860" y1="150" x2="740" y2="150" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="870" y="154" class="label">Chalazal Pole</text>
                <text x="870" y="168" class="label-desc">Basal part of ovule</text>

                <line x1="880" y1="330" x2="840" y2="330" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="890" y="334" class="label">Outer Integument</text>

                <line x1="880" y1="380" x2="785" y2="380" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="890" y="384" class="label">Inner Integument</text>
                <text x="890" y="398" class="label-desc">Protective envelopes</text>

                <line x1="880" y1="500" x2="750" y2="500" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="890" y="504" class="label">Micropyle</text>
                <text x="890" y="518" class="label-desc">Pore for pollen tube entry</text>

                <line x1="500" y1="530" x2="640" y2="530" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="534" class="label" text-anchor="end">Funicle</text>
                <text x="490" y="548" class="label-desc" text-anchor="end">Stalk attaching to placenta</text>

                <line x1="500" y1="485" x2="625" y2="485" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="489" class="label" text-anchor="end">Hilum</text>
                <text x="490" y="503" class="label-desc" text-anchor="end">Junction of body & stalk</text>
                
                <line x1="880" y1="250" x2="765" y2="250" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="890" y="254" class="label">Nucellus</text>
                <text x="890" y="268" class="label-desc">Mass of parenchymatous cells</text>
            </g>

            <!-- Group 2: Embryo Sac Details -->
            <g class="label-group-2">
                <line x1="500" y1="270" x2="720" y2="270" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="274" class="label" text-anchor="end">Antipodals (3)</text>
                <text x="490" y="288" class="label-desc" text-anchor="end">Chalazal end cells</text>

                <line x1="500" y1="350" x2="725" y2="350" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="354" class="label" text-anchor="end">Polar Nuclei (2)</text>
                <text x="490" y="368" class="label-desc" text-anchor="end">Inside large Central Cell</text>

                <line x1="500" y1="415" x2="725" y2="425" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="419" class="label" text-anchor="end">Egg Cell (1)</text>
                <text x="490" y="433" class="label-desc" text-anchor="end">Female gamete</text>

                <line x1="500" y1="455" x2="715" y2="445" stroke="#7f8c8d" stroke-width="1" marker-end="url(#arrow)"/>
                <text x="490" y="459" class="label" text-anchor="end">Synergids (2)</text>
                <text x="490" y="473" class="label-desc" text-anchor="end">With Filiform Apparatus</text>
                
                <!-- Bracket for Egg Apparatus -->
                <path d="M 495 410 L 505 410 L 505 465 L 495 465" fill="none" stroke="#7f8c8d" stroke-width="1"/>
                <text x="515" y="442" class="label-desc" fill="#34495e" font-style="italic">Egg Apparatus</text>
            </g>

        </g>

        <!-- Legend -->
        <g transform="translate(40, 520)">
            <rect x="0" y="0" width="15" height="15" rx="3" fill="#27AE60"/>
            <text x="25" y="12" class="legend-text">Integuments</text>
            
            <rect x="120" y="0" width="15" height="15" rx="3" fill="#E8F4FD" stroke="#bdc3c7" stroke-width="1"/>
            <text x="145" y="12" class="legend-text">Nucellus</text>
            
            <rect x="220" y="0" width="15" height="15" rx="3" fill="#FFF9C4" stroke="#F1C40F" stroke-width="1"/>
            <text x="245" y="12" class="legend-text">Embryo Sac</text>
            
            <rect x="340" y="0" width="15" height="15" rx="3" fill="#E74C3C"/>
            <text x="365" y="12" class="legend-text">Pollen Tube</text>
        </g>

    </svg>
</div>

</body>
</html>
