<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placentation Types in Angiosperms</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Base Diagram Styling */
        .diagram {
            transform-origin: center;
            transform-box: fill-box;
            will-change: transform, filter;
        }

        /* Placenta Pulse Animation */
        .placenta {
            animation: pulse-placenta 2s ease-in-out infinite;
            transform-origin: center;
            transform-box: fill-box;
        }

        @keyframes pulse-placenta {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        /* Sequential Highlight Animations (15s Loop) */
        .marginal { animation: highlight-marg 15s infinite; }
        .axile { animation: highlight-axile 15s infinite; }
        .parietal { animation: highlight-pari 15s infinite; }
        .free-central { animation: highlight-free 15s infinite; }
        .basal { animation: highlight-basal 15s infinite; }

        @keyframes highlight-marg {
            0%, 18% { transform: scale(1.12); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.4)); }
            22%, 100% { transform: scale(1); filter: none; }
        }
        @keyframes highlight-axile {
            0%, 18% { transform: scale(1); filter: none; }
            20%, 38% { transform: scale(1.12); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.4)); }
            42%, 100% { transform: scale(1); filter: none; }
        }
        @keyframes highlight-pari {
            0%, 38% { transform: scale(1); filter: none; }
            40%, 58% { transform: scale(1.12); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.4)); }
            62%, 100% { transform: scale(1); filter: none; }
        }
        @keyframes highlight-free {
            0%, 58% { transform: scale(1); filter: none; }
            60%, 78% { transform: scale(1.12); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.4)); }
            82%, 100% { transform: scale(1); filter: none; }
        }
        @keyframes highlight-basal {
            0%, 78% { transform: scale(1); filter: none; }
            80%, 98% { transform: scale(1.12); filter: drop-shadow(0 8px 16px rgba(241, 196, 15, 0.4)); }
            100% { transform: scale(1); filter: none; }
        }

        /* Funicle Growth Animation */
        .funicle {
            stroke-dasharray: 40;
            stroke-dashoffset: 40;
            stroke-linecap: round;
        }
        
        .funicle-marg { animation: draw-marg 15s infinite; }
        .funicle-axile { animation: draw-axile 15s infinite; }
        .funicle-pari { animation: draw-pari 15s infinite; }
        .funicle-free { animation: draw-free 15s infinite; }
        .funicle-basal { animation: draw-basal 15s infinite; }

        @keyframes draw-marg {
            0% { stroke-dashoffset: 40; }
            4%, 18% { stroke-dashoffset: 0; }
            22%, 100% { stroke-dashoffset: 40; }
        }
        @keyframes draw-axile {
            0%, 18% { stroke-dashoffset: 40; }
            24%, 38% { stroke-dashoffset: 0; }
            42%, 100% { stroke-dashoffset: 40; }
        }
        @keyframes draw-pari {
            0%, 38% { stroke-dashoffset: 40; }
            44%, 58% { stroke-dashoffset: 0; }
            62%, 100% { stroke-dashoffset: 40; }
        }
        @keyframes draw-free {
            0%, 58% { stroke-dashoffset: 40; }
            64%, 78% { stroke-dashoffset: 0; }
            82%, 100% { stroke-dashoffset: 40; }
        }
        @keyframes draw-basal {
            0%, 78% { stroke-dashoffset: 40; }
            84%, 98% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 40; }
        }

        /* Basal Ovule Nodding Animation */
        .basal-ovule {
            animation: nod-basal 15s infinite;
            transform-origin: bottom center;
            transform-box: fill-box;
        }

        @keyframes nod-basal {
            0%, 78% { transform: rotate(0deg); }
            82% { transform: rotate(-12deg); }
            86% { transform: rotate(8deg); }
            90% { transform: rotate(-6deg); }
            94% { transform: rotate(4deg); }
            98%, 100% { transform: rotate(0deg); }
        }

        /* Timeline Segments */
        .time-seg { transition: fill 0.3s ease; }
        .seg-marg { animation: color-marg 15s infinite; }
        .seg-axile { animation: color-axile 15s infinite; }
        .seg-pari { animation: color-pari 15s infinite; }
        .seg-free { animation: color-free 15s infinite; }
        .seg-basal { animation: color-basal 15s infinite; }

        @keyframes color-marg { 0%, 18% { fill: #F1C40F; } 20%, 100% { fill: #E0E0E0; } }
        @keyframes color-axile { 0%, 18% { fill: #E0E0E0; } 20%, 38% { fill: #F1C40F; } 40%, 100% { fill: #E0E0E0; } }
        @keyframes color-pari { 0%, 38% { fill: #E0E0E0; } 40%, 58% { fill: #F1C40F; } 60%, 100% { fill: #E0E0E0; } }
        @keyframes color-free { 0%, 58% { fill: #E0E0E0; } 60%, 78% { fill: #F1C40F; } 80%, 100% { fill: #E0E0E0; } }
        @keyframes color-basal { 0%, 78% { fill: #E0E0E0; } 80%, 98% { fill: #F1C40F; } 100% { fill: #E0E0E0; } }

        /* Typography */
        .title { font-size: 26px; font-weight: 700; fill: #2C3E50; }
        .label-main { font-size: 16px; font-weight: 600; fill: #2C3E50; }
        .label-sci { font-size: 13px; font-style: italic; fill: #7F8C8D; }
        .callout-text { font-size: 12px; fill: #2C3E50; font-weight: 600; }
        .legend-text { font-size: 13px; fill: #2C3E50; }
    </style>
</head>
<body>

<svg viewBox="0 0 1000 720" aria-label="Animated diagram showing five types of placentation in angiosperms: Marginal, Axile, Parietal, Free Central, and Basal.">
    <title>Placentation Types in Angiosperms</title>
    <desc>A continuous looping animation highlighting the attachment points (placenta) and ovule arrangements in different ovary cross-sections.</desc>

    <!-- Definitions for reusable elements -->
    <defs>
        <!-- Standard Ovule Shape (Bean-like) -->
        <g id="ovule">
            <path d="M -6,-10 C -14,-10 -14,10 -6,10 C 2,10 12,6 12,0 C 12,-6 2,-10 -6,-10 Z" fill="#FFF9C4" stroke="#FBC02D" stroke-width="1.5"/>
        </g>
        
        <!-- Callout Line Marker -->
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
            <circle cx="5" cy="5" r="3" fill="#2C3E50"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

    <!-- Main Title -->
    <text x="500" y="50" class="title" text-anchor="middle">Placentation: Arrangement of Ovules within the Ovary</text>
    <line x1="350" y1="65" x2="650" y2="65" stroke="#E0E0E0" stroke-width="2"/>

    <!-- ========================================== -->
    <!-- 1. MARGINAL PLACENTATION (Top Left)        -->
    <!-- ========================================== -->
    <g class="diagram marginal">
        <!-- Ovary Wall (LS of Pod) -->
        <path d="M 180,120 Q 250,240 180,360 Q 110,240 180,120 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
        <!-- Locule -->
        <path d="M 180,135 Q 235,240 180,345 Q 125,240 180,135 Z" fill="#FFFFFF"/>
        <!-- Placenta (Ventral Suture) -->
        <path d="M 207,180 Q 225,240 207,300" stroke="#A2D149" stroke-width="7" fill="none" stroke-linecap="round" class="placenta"/>
        
        <!-- Funicles -->
        <path d="M 215,195 L 190,195" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-marg"/>
        <path d="M 221,240 L 195,240" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-marg"/>
        <path d="M 215,285 L 190,285" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-marg"/>
        
        <!-- Ovules -->
        <use href="#ovule" x="190" y="195" transform="rotate(-20 190 195)"/>
        <use href="#ovule" x="195" y="240" transform="rotate(0 195 240)"/>
        <use href="#ovule" x="190" y="285" transform="rotate(20 190 285)"/>
    </g>
    <!-- Labels -->
    <text x="180" y="400" class="label-main" text-anchor="middle">Marginal</text>
    <text x="180" y="420" class="label-sci" text-anchor="middle">Pisum sativum</text>


    <!-- ========================================== -->
    <!-- 2. AXILE PLACENTATION (Top Center)         -->
    <!-- ========================================== -->
    <g class="diagram axile">
        <!-- Ovary Wall -->
        <circle cx="500" cy="240" r="80" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
        <!-- Locule -->
        <circle cx="500" cy="240" r="66" fill="#FFFFFF"/>
        <!-- Septa -->
        <line x1="500" y1="240" x2="500" y2="174" stroke="#2ECC71" stroke-width="4"/>
        <line x1="500" y1="240" x2="443" y2="273" stroke="#2ECC71" stroke-width="4"/>
        <line x1="500" y1="240" x2="557" y2="273" stroke="#2ECC71" stroke-width="4"/>
        <!-- Placenta -->
        <circle cx="500" cy="240" r="16" fill="#A2D149" class="placenta"/>
        
        <!-- Funicles -->
        <path d="M 500,240 L 535,195" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>
        <path d="M 500,240 L 550,220" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>
        <path d="M 500,240 L 480,285" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>
        <path d="M 500,240 L 520,285" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>
        <path d="M 500,240 L 450,220" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>
        <path d="M 500,240 L 465,195" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-axile"/>

        <!-- Ovules -->
        <use href="#ovule" x="535" y="195" transform="rotate(140 535 195)"/>
        <use href="#ovule" x="550" y="220" transform="rotate(160 550 220)"/>
        <use href="#ovule" x="480" y="285" transform="rotate(-60 480 285)"/>
        <use href="#ovule" x="520" y="285" transform="rotate(-120 520 285)"/>
        <use href="#ovule" x="450" y="220" transform="rotate(20 450 220)"/>
        <use href="#ovule" x="465" y="195" transform="rotate(40 465 195)"/>
    </g>
    <!-- Labels -->
    <text x="500" y="400" class="label-main" text-anchor="middle">Axile</text>
    <text x="500" y="420" class="label-sci" text-anchor="middle">Hibiscus</text>


    <!-- ========================================== -->
    <!-- 3. PARIETAL PLACENTATION (Top Right)       -->
    <!-- ========================================== -->
    <g class="diagram parietal">
        <!-- Ovary Wall -->
        <circle cx="820" cy="240" r="80" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
        <!-- Locule -->
        <circle cx="820" cy="240" r="66" fill="#FFFFFF"/>
        <!-- False Septum (Replum) -->
        <line x1="754" y1="240" x2="886" y2="240" stroke="#2ECC71" stroke-width="2" stroke-dasharray="6,4"/>
        
        <!-- Placenta Pads -->
        <path d="M 810,176 Q 820,186 830,176 Z" fill="#A2D149" class="placenta"/>
        <path d="M 764,268 Q 774,260 768,250 Z" fill="#A2D149" class="placenta"/>
        <path d="M 876,268 Q 866,260 872,250 Z" fill="#A2D149" class="placenta"/>

        <!-- Funicles -->
        <path d="M 820,178 L 805,195" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>
        <path d="M 820,178 L 835,195" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>
        <path d="M 768,260 L 785,260" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>
        <path d="M 768,260 L 775,240" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>
        <path d="M 872,260 L 855,260" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>
        <path d="M 872,260 L 865,240" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-pari"/>

        <!-- Ovules -->
        <use href="#ovule" x="805" y="195" transform="rotate(-45 805 195)"/>
        <use href="#ovule" x="835" y="195" transform="rotate(-135 835 195)"/>
        <use href="#ovule" x="785" y="260" transform="rotate(0 785 260)"/>
        <use href="#ovule" x="775" y="240" transform="rotate(60 775 240)"/>
        <use href="#ovule" x="855" y="260" transform="rotate(180 855 260)"/>
        <use href="#ovule" x="865" y="240" transform="rotate(120 865 240)"/>
    </g>
    <!-- Labels -->
    <text x="820" y="400" class="label-main" text-anchor="middle">Parietal</text>
    <text x="820" y="420" class="label-sci" text-anchor="middle">Brassica</text>

    <!-- Structural Callouts (Attached to Parietal) -->
    <g stroke="#2C3E50" stroke-width="1" marker-start="url(#dot)">
        <line x1="895" y1="240" x2="930" y2="240"/>
        <text x="935" y="244" class="callout-text" stroke="none">Ovary Wall</text>
        
        <line x1="860" y1="260" x2="930" y2="270"/>
        <text x="935" y="274" class="callout-text" stroke="none">Locule</text>
        
        <line x1="870" y1="255" x2="930" y2="300"/>
        <text x="935" y="304" class="callout-text" stroke="none">Placenta</text>
        
        <line x1="865" y1="240" x2="930" y2="210"/>
        <text x="935" y="214" class="callout-text" stroke="none">Ovule</text>
    </g>


    <!-- ========================================== -->
    <!-- 4. FREE CENTRAL PLACENTATION (Bottom Left) -->
    <!-- ========================================== -->
    <g class="diagram free-central">
        <!-- Ovary Wall -->
        <circle cx="350" cy="530" r="80" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
        <!-- Locule -->
        <circle cx="350" cy="530" r="66" fill="#FFFFFF"/>
        <!-- Placenta (Central Pillar) -->
        <circle cx="350" cy="530" r="22" fill="#A2D149" class="placenta"/>
        
        <!-- Funicles -->
        <path d="M 350,530 L 350,495" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-free"/>
        <path d="M 350,530 L 383,506" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-free"/>
        <path d="M 350,530 L 370,558" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-free"/>
        <path d="M 350,530 L 330,558" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-free"/>
        <path d="M 350,530 L 317,506" stroke="#1E8449" stroke-width="2.5" class="funicle funicle-free"/>

        <!-- Ovules -->
        <use href="#ovule" x="350" y="495" transform="rotate(90 350 495)"/>
        <use href="#ovule" x="383" y="506" transform="rotate(162 383 506)"/>
        <use href="#ovule" x="370" y="558" transform="rotate(234 370 558)"/>
        <use href="#ovule" x="330" y="558" transform="rotate(306 330 558)"/>
        <use href="#ovule" x="317" y="506" transform="rotate(18 317 506)"/>
    </g>
    <!-- Labels -->
    <text x="350" y="650" class="label-main" text-anchor="middle">Free Central</text>
    <text x="350" y="670" class="label-sci" text-anchor="middle">Dianthus</text>


    <!-- ========================================== -->
    <!-- 5. BASAL PLACENTATION (Bottom Right)       -->
    <!-- ========================================== -->
    <g class="diagram basal">
        <!-- Ovary Wall (LS of Flask Shape) -->
        <path d="M 590,450 L 590,550 C 590,600 710,600 710,550 L 710,450 L 690,450 L 690,545 C 690,575 610,575 610,545 L 610,450 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2"/>
        <!-- Placenta (Base) -->
        <ellipse cx="650" cy="565" rx="25" ry="10" fill="#A2D149" class="placenta"/>
        
        <!-- Funicle -->
        <path d="M 650,560 L 650,525" stroke="#1E8449" stroke-width="3" class="funicle funicle-basal"/>
        
        <!-- Ovule (Nodding Animation applied) -->
        <g class="basal-ovule">
            <use href="#ovule" x="650" y="515" transform="rotate(-90 650 515) scale(1.2)"/>
        </g>
    </g>
    <!-- Labels -->
    <text x="650" y="650" class="label-main" text-anchor="middle">Basal</text>
    <text x="650" y="670" class="label-sci" text-anchor="middle">Helianthus</text>


    <!-- ========================================== -->
    <!-- LEGEND & TIMELINE                          -->
    <!-- ========================================== -->
    
    <!-- Legend Box -->
    <rect x="780" y="480" width="180" height="160" rx="8" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="1.5"/>
    <text x="870" y="505" class="label-main" text-anchor="middle">Legend</text>
    
    <circle cx="800" cy="525" r="6" fill="#2ECC71" stroke="#27AE60"/>
    <text x="815" y="530" class="legend-text">Ovary Wall / Septa</text>
    
    <circle cx="800" cy="545" r="6" fill="#FFFFFF" stroke="#CCCCCC"/>
    <text x="815" y="550" class="legend-text">Locule (Chamber)</text>
    
    <circle cx="800" cy="565" r="6" fill="#A2D149"/>
    <text x="815" y="570" class="legend-text">Placenta</text>
    
    <circle cx="800" cy="585" r="6" fill="#FFF9C4" stroke="#FBC02D"/>
    <text x="815" y="590" class="legend-text">Ovule</text>
    
    <line x1="794" y1="605" x2="806" y2="605" stroke="#1E8449" stroke-width="3" stroke-linecap="round"/>
    <text x="815" y="610" class="legend-text">Funicle</text>
    
    <line x1="794" y1="625" x2="806" y2="625" stroke="#2ECC71" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="815" y="630" class="legend-text">False Septum</text>

    <!-- Animation Timeline Indicator -->
    <g transform="translate(200, 700)">
        <rect x="0" y="0" width="115" height="6" rx="3" fill="#E0E0E0" class="time-seg seg-marg"/>
        <rect x="120" y="0" width="115" height="6" rx="3" fill="#E0E0E0" class="time-seg seg-axile"/>
        <rect x="240" y="0" width="115" height="6" rx="3" fill="#E0E0E0" class="time-seg seg-pari"/>
        <rect x="360" y="0" width="115" height="6" rx="3" fill="#E0E0E0" class="time-seg seg-free"/>
        <rect x="480" y="0" width="115" height="6" rx="3" fill="#E0E0E0" class="time-seg seg-basal"/>
    </g>

</svg>

</body>
</html>
