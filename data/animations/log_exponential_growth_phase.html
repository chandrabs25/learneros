<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log (Exponential) Growth Phase in Continuous Culture</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* --- Bioreactor Animations --- */
        .nutrient {
            opacity: 0;
            animation: nut-flow 3s infinite linear;
        }
        .n1 { animation-delay: 0s; }
        .n2 { animation-delay: 1s; }
        .n3 { animation-delay: 2s; }

        @keyframes nut-flow {
            0% { transform: translate(60px, 100px); opacity: 1; }
            30% { transform: translate(100px, 100px); opacity: 1; }
            50% { transform: translate(100px, 180px); opacity: 1; }
            100% { transform: translate(150px, 250px); opacity: 0; }
        }

        .waste {
            opacity: 0;
            animation: waste-flow 4s infinite linear;
        }
        .w1 { animation-delay: 0.5s; }
        .w2 { animation-delay: 2.5s; }

        @keyframes waste-flow {
            0% { transform: translate(150px, 300px); opacity: 0; }
            20% { opacity: 1; }
            60% { transform: translate(220px, 360px); opacity: 1; }
            80% { transform: translate(280px, 360px); opacity: 1; }
            100% { transform: translate(280px, 430px); opacity: 0; }
        }

        .bubble {
            opacity: 0;
            animation: bubble-rise 4s infinite ease-in;
        }
        .b1 { animation-delay: 0s; }
        .b2 { animation-delay: 1.5s; }
        .b3 { animation-delay: 3s; }

        @keyframes bubble-rise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.6; }
            80% { transform: translateY(-180px) scale(1.2); opacity: 0; }
            100% { opacity: 0; }
        }

        /* --- Cell Division Animations (15s Loop) --- */
        /* Gen 0: 1 Cell (0-3s) */
        .gen0 { animation: gen0-vis 15s infinite; }
        .gen0 .cell-body { animation: gen0-body 15s infinite; }
        .gen0 .septum { animation: gen0-septum 15s infinite; }
        .gen0 .dna-left { animation: gen0-dna-l 15s infinite; }
        .gen0 .dna-right { animation: gen0-dna-r 15s infinite; }

        @keyframes gen0-vis {
            0%, 19.9% { opacity: 1; }
            20%, 100% { opacity: 0; }
        }
        @keyframes gen0-body {
            0%, 5% { transform: scaleX(1); }
            10%, 19.9% { transform: scaleX(1.8); }
        }
        @keyframes gen0-septum {
            0%, 12% { stroke-dashoffset: 16; opacity: 0; }
            13% { opacity: 1; stroke-dashoffset: 16; }
            16.6%, 19.9% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes gen0-dna-l {
            0%, 5% { transform: translateX(0); }
            10%, 19.9% { transform: translateX(-8px); }
        }
        @keyframes gen0-dna-r {
            0%, 5% { transform: translateX(0); opacity: 0; }
            6% { opacity: 1; }
            10%, 19.9% { transform: translateX(8px); opacity: 1; }
        }

        /* Gen 1: 2 Cells (3-6s) */
        .gen1 { animation: gen1-vis 15s infinite; }
        .gen1 .cell-body { animation: gen1-body 15s infinite; }
        .gen1 .septum { animation: gen1-septum 15s infinite; }
        .gen1 .dna-left { animation: gen1-dna-l 15s infinite; }
        .gen1 .dna-right { animation: gen1-dna-r 15s infinite; }

        @keyframes gen1-vis {
            0%, 19.9% { opacity: 0; }
            20%, 39.9% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }
        @keyframes gen1-body {
            20%, 25% { transform: scaleX(1); }
            30%, 39.9% { transform: scaleX(1.8); }
        }
        @keyframes gen1-septum {
            20%, 32% { stroke-dashoffset: 16; opacity: 0; }
            33% { opacity: 1; stroke-dashoffset: 16; }
            36.6%, 39.9% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes gen1-dna-l {
            20%, 25% { transform: translateX(0); }
            30%, 39.9% { transform: translateX(-8px); }
        }
        @keyframes gen1-dna-r {
            20%, 25% { transform: translateX(0); opacity: 0; }
            26% { opacity: 1; }
            30%, 39.9% { transform: translateX(8px); opacity: 1; }
        }

        /* Gen 2: 4 Cells (6-9s) */
        .gen2 { animation: gen2-vis 15s infinite; }
        .gen2 .cell-body { animation: gen2-body 15s infinite; }
        .gen2 .septum { animation: gen2-septum 15s infinite; }
        .gen2 .dna-left { animation: gen2-dna-l 15s infinite; }
        .gen2 .dna-right { animation: gen2-dna-r 15s infinite; }

        @keyframes gen2-vis {
            0%, 39.9% { opacity: 0; }
            40%, 59.9% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }
        @keyframes gen2-body {
            40%, 45% { transform: scaleX(1); }
            50%, 59.9% { transform: scaleX(1.8); }
        }
        @keyframes gen2-septum {
            40%, 52% { stroke-dashoffset: 16; opacity: 0; }
            53% { opacity: 1; stroke-dashoffset: 16; }
            56.6%, 59.9% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes gen2-dna-l {
            40%, 45% { transform: translateX(0); }
            50%, 59.9% { transform: translateX(-8px); }
        }
        @keyframes gen2-dna-r {
            40%, 45% { transform: translateX(0); opacity: 0; }
            46% { opacity: 1; }
            50%, 59.9% { transform: translateX(8px); opacity: 1; }
        }

        /* Gen 3: 8 Cells (9-12s) */
        .gen3 { animation: gen3-vis 15s infinite; }
        .gen3 .cell-body { animation: gen3-body 15s infinite; }
        .gen3 .septum { animation: gen3-septum 15s infinite; }
        .gen3 .dna-left { animation: gen3-dna-l 15s infinite; }
        .gen3 .dna-right { animation: gen3-dna-r 15s infinite; }

        @keyframes gen3-vis {
            0%, 59.9% { opacity: 0; }
            60%, 79.9% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        @keyframes gen3-body {
            60%, 65% { transform: scaleX(1); }
            70%, 79.9% { transform: scaleX(1.8); }
        }
        @keyframes gen3-septum {
            60%, 72% { stroke-dashoffset: 16; opacity: 0; }
            73% { opacity: 1; stroke-dashoffset: 16; }
            76.6%, 79.9% { stroke-dashoffset: 0; opacity: 1; }
        }
        @keyframes gen3-dna-l {
            60%, 65% { transform: translateX(0); }
            70%, 79.9% { transform: translateX(-8px); }
        }
        @keyframes gen3-dna-r {
            60%, 65% { transform: translateX(0); opacity: 0; }
            66% { opacity: 1; }
            70%, 79.9% { transform: translateX(8px); opacity: 1; }
        }

        /* Gen 4: 16 Cells (12-15s Steady State) */
        .gen4 { animation: gen4-vis 15s infinite; }
        @keyframes gen4-vis {
            0%, 79.9% { opacity: 0; }
            80%, 98% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Exiting Cells */
        .exit1 { animation: exit1-anim 15s infinite; }
        @keyframes exit1-anim {
            0%, 79.9% { opacity: 0; }
            80% { transform: translate(215px, 350px); opacity: 1; }
            90% { transform: translate(250px, 360px); opacity: 1; }
            98%, 100% { transform: translate(280px, 420px); opacity: 0; }
        }

        .exit2 { animation: exit2-anim 15s infinite; }
        @keyframes exit2-anim {
            0%, 79.9% { opacity: 0; }
            85% { transform: translate(195px, 310px); opacity: 1; }
            95% { transform: translate(250px, 360px); opacity: 1; }
            98%, 100% { transform: translate(280px, 420px); opacity: 0; }
        }

        /* --- Graph Animations --- */
        .graph-line {
            stroke-dasharray: 410;
            stroke-dashoffset: 410;
            animation: draw-graph 15s infinite linear;
        }

        @keyframes draw-graph {
            0% { stroke-dashoffset: 410; opacity: 1; }
            20% { stroke-dashoffset: 350; opacity: 1; } /* Lag phase */
            80% { stroke-dashoffset: 106; opacity: 1; } /* Log phase */
            98% { stroke-dashoffset: 0; opacity: 1; }   /* Steady state */
            99%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        .graph-dot {
            animation: move-dot 15s infinite linear;
        }

        @keyframes move-dot {
            0% { transform: translate(450px, 380px); opacity: 1; }
            20% { transform: translate(510px, 380px); opacity: 1; }
            80% { transform: translate(650px, 180px); opacity: 1; }
            98% { transform: translate(750px, 180px); opacity: 1; }
            99%, 100% { transform: translate(750px, 180px); opacity: 0; }
        }

        .binary-label {
            animation: label-fade 15s infinite;
        }

        @keyframes label-fade {
            0%, 19.9% { opacity: 0; }
            20%, 59.9% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Log Exponential Growth Phase in Continuous Culture</title>
    <desc>An animated diagram showing bacterial cells undergoing binary fission in a bioreactor, synchronized with a log-linear growth curve demonstrating the lag, exponential (log), and steady-state phases.</desc>

    <defs>
        <!-- Bioreactor Vessel Gradient -->
        <linearGradient id="vessel-grad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#f0f0f0" stop-opacity="0.6"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#e0e0e0" stop-opacity="0.6"/>
        </linearGradient>

        <!-- Arrowhead for labels -->
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50"/>
        </marker>

        <!-- Reusable Cell Template -->
        <g id="cell-content">
            <rect class="cell-body" x="-15" y="-8" width="30" height="16" rx="8" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" vector-effect="non-scaling-stroke"/>
            <line class="septum" x1="0" y1="-8" x2="0" y2="8" stroke="#4A90D9" stroke-width="2" stroke-dasharray="16" stroke-dashoffset="16"/>
            <path class="dna dna-left" d="M -4 0 Q -2 -4, 0 0 T 4 0 Q 2 4, 0 0 T -4 0" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
            <path class="dna dna-right" d="M -4 0 Q -2 -4, 0 0 T 4 0 Q 2 4, 0 0 T -4 0" fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0"/>
        </g>
    </defs>

    <!-- Title -->
    <text x="400" y="40" font-size="22" font-weight="bold" text-anchor="middle">Log (Exponential) Growth Phase in Continuous Culture</text>

    <!-- ========================================== -->
    <!-- LEFT SIDE: BIOREACTOR                      -->
    <!-- ========================================== -->

    <!-- Inlet Pipe -->
    <path d="M 20 100 L 100 100 L 100 150" fill="none" stroke="#bdc3c7" stroke-width="14"/>
    <path d="M 20 100 L 100 100 L 100 150" fill="none" stroke="#f8f9fa" stroke-width="10"/>
    <text x="115" y="90" font-size="12" font-weight="600">Fresh Medium (Nutrients)</text>

    <!-- Outlet Pipe -->
    <path d="M 220 360 L 280 360 L 280 430" fill="none" stroke="#bdc3c7" stroke-width="14"/>
    <path d="M 220 360 L 280 360 L 280 430" fill="none" stroke="#f8f9fa" stroke-width="10"/>
    <text x="295" y="380" font-size="12" font-weight="600">Used Medium + Waste</text>

    <!-- Bioreactor Liquid -->
    <path d="M 80 180 L 220 180 L 220 400 A 70 70 0 0 1 80 400 Z" fill="#E8F4FD" opacity="0.5"/>

    <!-- Bubbles -->
    <circle class="bubble b1" cx="120" cy="380" r="4" fill="#fff"/>
    <circle class="bubble b2" cx="180" cy="360" r="3" fill="#fff"/>
    <circle class="bubble b3" cx="150" cy="390" r="5" fill="#fff"/>

    <!-- Bioreactor Vessel -->
    <path d="M 80 150 L 80 400 A 70 70 0 0 0 220 400 L 220 150 Z" fill="url(#vessel-grad)" stroke="#bdc3c7" stroke-width="4"/>
    <line x1="70" y1="150" x2="230" y2="150" stroke="#bdc3c7" stroke-width="6" stroke-linecap="round"/>

    <!-- Nutrients (Entering) -->
    <circle class="nutrient n1" cx="0" cy="0" r="4" fill="#2ECC71"/>
    <circle class="nutrient n2" cx="0" cy="0" r="4" fill="#2ECC71"/>
    <circle class="nutrient n3" cx="0" cy="0" r="4" fill="#2ECC71"/>

    <!-- Waste (Exiting) -->
    <circle class="waste w1" cx="0" cy="0" r="4" fill="#F39C12"/>
    <circle class="waste w2" cx="0" cy="0" r="4" fill="#F39C12"/>

    <!-- Cells Generation 0 (1 Cell) -->
    <g class="gen0" transform="translate(150, 280)"><use href="#cell-content"/></g>

    <!-- Cells Generation 1 (2 Cells) -->
    <g class="gen1" transform="translate(120, 260)"><use href="#cell-content"/></g>
    <g class="gen1" transform="translate(180, 300)"><use href="#cell-content"/></g>

    <!-- Cells Generation 2 (4 Cells) -->
    <g class="gen2" transform="translate(100, 230)"><use href="#cell-content"/></g>
    <g class="gen2" transform="translate(140, 290)"><use href="#cell-content"/></g>
    <g class="gen2" transform="translate(170, 250)"><use href="#cell-content"/></g>
    <g class="gen2" transform="translate(200, 320)"><use href="#cell-content"/></g>

    <!-- Cells Generation 3 (8 Cells) -->
    <g class="gen3" transform="translate(90, 260)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(110, 310)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(130, 210)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(150, 340)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(160, 280)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(180, 220)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(190, 350)"><use href="#cell-content"/></g>
    <g class="gen3" transform="translate(210, 270)"><use href="#cell-content"/></g>

    <!-- Cells Generation 4 (16 Cells - Steady State) -->
    <g class="gen4" transform="translate(85, 240)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(95, 280)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(105, 330)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(115, 200)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(125, 260)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(135, 300)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(145, 360)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(155, 230)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(165, 290)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(175, 330)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(185, 210)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(195, 260)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(205, 310)"><use href="#cell-content"/></g>
    <g class="gen4" transform="translate(220, 240)"><use href="#cell-content"/></g>
    <!-- Exiting Cells -->
    <g class="exit1"><use href="#cell-content"/></g>
    <g class="exit2"><use href="#cell-content"/></g>

    <!-- Binary Fission Label -->
    <g class="binary-label">
        <text x="30" y="265" font-size="12" font-weight="600" fill="#4A90D9">Binary Fission</text>
        <path d="M 115 260 L 140 260" stroke="#4A90D9" stroke-width="1.5" marker-end="url(#arrow)"/>
    </g>

    <!-- ========================================== -->
    <!-- RIGHT SIDE: GRAPH                          -->
    <!-- ========================================== -->

    <!-- Grid Lines -->
    <line x1="450" y1="330" x2="750" y2="330" stroke="#e0e0e0" stroke-dasharray="4"/>
    <line x1="450" y1="280" x2="750" y2="280" stroke="#e0e0e0" stroke-dasharray="4"/>
    <line x1="450" y1="230" x2="750" y2="230" stroke="#e0e0e0" stroke-dasharray="4"/>
    <line x1="450" y1="180" x2="750" y2="180" stroke="#e0e0e0" stroke-dasharray="4"/>

    <!-- Axes -->
    <path d="M 450 120 L 450 400 L 770 400" fill="none" stroke="#2C3E50" stroke-width="2"/>
    <polygon points="446,125 450,115 454,125" fill="#2C3E50"/>
    <polygon points="765,396 775,400 765,404" fill="#2C3E50"/>

    <!-- Axis Labels -->
    <text x="430" y="260" transform="rotate(-90, 430, 260)" text-anchor="middle" font-weight="600">log Cell Number</text>
    <text x="610" y="430" text-anchor="middle" font-weight="600">Time</text>

    <!-- Phase Annotations -->
    <text x="480" y="395" font-size="11" fill="#7f8c8d" text-anchor="middle">Lag</text>
    <text x="540" y="250" font-size="12" font-weight="600" fill="#FF6B6B" transform="rotate(-54, 540, 250)">Exponential (Log) Phase</text>
    <text x="700" y="170" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">Steady State</text>
    
    <!-- Phase Dividers -->
    <line x1="510" y1="400" x2="510" y2="380" stroke="#bdc3c7" stroke-dasharray="2"/>
    <line x1="650" y1="400" x2="650" y2="180" stroke="#bdc3c7" stroke-dasharray="2"/>

    <!-- The Growth Curve -->
    <path d="M 450 380 L 510 380 L 650 180 L 750 180" fill="none" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="graph-line"/>
    
    <!-- Moving Dot on Curve -->
    <circle class="graph-dot" cx="0" cy="0" r="6" fill="#FF6B6B" stroke="#fff" stroke-width="2"/>

    <!-- Equation -->
    <rect x="630" y="80" width="130" height="40" fill="#fff" stroke="#bdc3c7" rx="4" opacity="0.9"/>
    <text x="645" y="105" class="mono" font-size="14" font-weight="bold" fill="#2C3E50">
        N<tspan dy="4" font-size="10">t</tspan><tspan dy="-4"> = N</tspan><tspan dy="4" font-size="10">0</tspan><tspan dy="-4"> e</tspan><tspan dy="-6" font-size="10">rt</tspan>
    </text>

    <!-- Legend -->
    <rect x="600" y="440" width="180" height="50" fill="#fff" stroke="#bdc3c7" rx="4"/>
    <circle cx="615" cy="455" r="5" fill="#2ECC71"/>
    <text x="630" y="459" font-size="11">Fresh Nutrients</text>
    <circle cx="615" cy="475" r="5" fill="#F39C12"/>
    <text x="630" y="479" font-size="11">Waste Products</text>
    <rect x="725" y="450" width="12" height="6" rx="3" fill="#E8F4FD" stroke="#4A90D9"/>
    <text x="745" y="455" font-size="11">Cell</text>
    <path d="M 725 475 Q 728 471, 731 475 T 737 475" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="745" y="479" font-size="11">DNA</text>

</svg>

</body>
</html>
