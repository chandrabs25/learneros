<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biosynthetic Stage: Upstream Processing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.05));
        }
        
        /* Animations */
        @keyframes spin-svg {
            0% { transform: scaleX(1); }
            50% { transform: scaleX(-1); }
            100% { transform: scaleX(1); }
        }
        .impeller-blades {
            transform-origin: 500px 350px;
            animation: spin-svg 1.5s linear infinite;
        }

        @keyframes rise {
            0% { transform: translate(var(--startX), 510px) scale(0.5); opacity: 0; }
            10% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translate(var(--endX), 220px) scale(1.2); opacity: 0; }
        }
        .bubble {
            animation: rise var(--dur) ease-in infinite;
            animation-delay: var(--del);
        }

        /* 12-second Loop Keyframes */
        @keyframes cell-pop-1 {
            0%, 8% { opacity: 0; transform: scale(0); }
            12%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; transform: scale(0); }
        }
        @keyframes cell-pop-2 {
            0%, 16% { opacity: 0; transform: scale(0); }
            20%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; transform: scale(0); }
        }
        @keyframes cell-pop-3 {
            0%, 24% { opacity: 0; transform: scale(0); }
            28%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; transform: scale(0); }
        }
        
        .cell-pop-1 { animation: cell-pop-1 12s infinite; transform-origin: 0 0; }
        .cell-pop-2 { animation: cell-pop-2 12s infinite; transform-origin: 0 0; }
        .cell-pop-3 { animation: cell-pop-3 12s infinite; transform-origin: 0 0; }

        @keyframes protein-pop {
            0%, 33% { opacity: 0; transform: scale(0); }
            38%, 92% { opacity: 1; transform: scale(1); }
            96%, 100% { opacity: 0; transform: scale(0); }
        }
        .protein-molecule {
            animation: protein-pop 12s infinite;
            transform-origin: 0 0;
        }

        @keyframes swirl {
            0% { transform: rotate(0deg) translateX(var(--radius)) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(var(--radius)) rotate(-360deg); }
        }
        .swirl-container {
            animation: swirl var(--dur) linear infinite;
            animation-delay: var(--del);
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
        .status-dot {
            animation: pulse 1.5s infinite;
            transform-origin: 25px 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of the Biosynthetic Stage in a stirred-tank bioreactor">
            <title>Biosynthetic Stage: Upstream Processing</title>
            <desc>An animated biological diagram showing Escherichia coli cells proliferating and synthesizing recombinant proteins within a stirred-tank bioreactor, complete with aeration and agitation mechanisms.</desc>
            
            <defs>
                <!-- Gradients -->
                <linearGradient id="media-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9" />
                    <stop offset="50%" stop-color="#FFF176" stop-opacity="0.7" />
                    <stop offset="100%" stop-color="#FFF9C4" stop-opacity="0.9" />
                </linearGradient>
                <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
                    <stop offset="20%" stop-color="#ffffff" stop-opacity="0.1" />
                    <stop offset="80%" stop-color="#ffffff" stop-opacity="0.0" />
                    <stop offset="100%" stop-color="#ffffff" stop-opacity="0.2" />
                </linearGradient>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
                </filter>

                <!-- Reusable Biological Elements -->
                <g id="ecoli">
                    <rect x="-12" y="-5" width="24" height="10" rx="5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                    <path d="M -6 0 Q 0 -4 6 0 T 12 0" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.4"/>
                </g>
                
                <g id="protein">
                    <circle cx="0" cy="-4" r="4.5" fill="#98D8C8"/>
                    <circle cx="-4" cy="3" r="4.5" fill="#98D8C8"/>
                    <circle cx="4" cy="3" r="4.5" fill="#98D8C8"/>
                    <circle cx="0" cy="0" r="2.5" fill="#73C6B6"/>
                </g>
            </defs>

            <!-- Main Title -->
            <text x="500" y="50" text-anchor="middle" font-family="Inter" font-size="28" font-weight="700" fill="#2C3E50">Biosynthetic Stage: Upstream Processing</text>

            <!-- Legend Panel -->
            <g transform="translate(40, 90)">
                <rect width="210" height="150" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
                <text x="105" y="25" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Legend</text>
                
                <use href="#ecoli" x="25" y="50" transform="scale(0.8) translate(10, 15)"/>
                <text x="55" y="54" font-family="Roboto Mono" font-size="12" fill="#2C3E50" font-style="italic">E. coli <tspan font-family="Inter" font-style="normal" fill="#7F8C8D">(Host)</tspan></text>
                
                <use href="#protein" x="25" y="80"/>
                <text x="55" y="84" font-family="Inter" font-size="12" fill="#2C3E50">Recombinant Protein</text>
                
                <rect x="17" y="100" width="16" height="16" rx="2" fill="#FFF9C4" stroke="#F1C40F" stroke-width="1"/>
                <text x="55" y="113" font-family="Inter" font-size="12" fill="#2C3E50">Nutrient Media</text>
                
                <circle cx="25" cy="135" r="5" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1"/>
                <text x="55" y="139" font-family="Inter" font-size="12" fill="#2C3E50">Oxygen Bubbles</text>
            </g>

            <!-- BIOREACTOR VESSEL (BACK & INTERIOR) -->
            <!-- Back inner wall -->
            <path d="M 330 150 L 330 500 A 170 40 0 0 0 670 500 L 670 150 Z" fill="#f8f9fa" stroke="#2C3E50" stroke-width="2"/>
            <!-- Top back opening curve -->
            <path d="M 330 150 A 170 20 0 0 1 670 150" fill="none" stroke="#2C3E50" stroke-width="2"/>

            <!-- Nutrient Media -->
            <path d="M 330 220 L 330 500 A 170 40 0 0 0 670 500 L 670 220 Z" fill="url(#media-grad)"/>
            <ellipse cx="500" cy="220" rx="170" ry="25" fill="#FFF176" opacity="0.8"/>

            <!-- Sparger (Aeration) -->
            <rect x="400" y="510" width="200" height="12" rx="6" fill="#95A5A6" stroke="#7F8C8D" stroke-width="1"/>
            <circle cx="420" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="440" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="460" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="480" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="500" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="520" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="540" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="560" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>
            <circle cx="580" cy="516" r="2" fill="#2C3E50" opacity="0.6"/>

            <!-- Impeller Shaft -->
            <rect x="494" y="130" width="12" height="370" fill="#7F8C8D" rx="4" stroke="#2C3E50" stroke-width="1"/>

            <!-- Impeller Blades (Animated) -->
            <g class="impeller-blades">
                <rect x="420" y="275" width="160" height="14" fill="#636E72" rx="2" stroke="#2C3E50" stroke-width="1"/>
                <rect x="420" y="365" width="160" height="14" fill="#636E72" rx="2" stroke="#2C3E50" stroke-width="1"/>
                <rect x="420" y="455" width="160" height="14" fill="#636E72" rx="2" stroke="#2C3E50" stroke-width="1"/>
            </g>

            <!-- Oxygen Bubbles (Animated) -->
            <g id="bubbles">
                <circle class="bubble" r="4" fill="#FFFFFF" style="--startX: 410px; --endX: 400px; --dur: 2.5s; --del: 0s;" />
                <circle class="bubble" r="5" fill="#FFFFFF" style="--startX: 430px; --endX: 440px; --dur: 3s; --del: -0.5s;" />
                <circle class="bubble" r="3" fill="#FFFFFF" style="--startX: 450px; --endX: 445px; --dur: 2.2s; --del: -1s;" />
                <circle class="bubble" r="6" fill="#FFFFFF" style="--startX: 470px; --endX: 480px; --dur: 3.5s; --del: -1.5s;" />
                <circle class="bubble" r="4" fill="#FFFFFF" style="--startX: 490px; --endX: 485px; --dur: 2.8s; --del: -0.2s;" />
                <circle class="bubble" r="5" fill="#FFFFFF" style="--startX: 510px; --endX: 520px; --dur: 3.2s; --del: -2s;" />
                <circle class="bubble" r="3" fill="#FFFFFF" style="--startX: 530px; --endX: 525px; --dur: 2.4s; --del: -0.8s;" />
                <circle class="bubble" r="6" fill="#FFFFFF" style="--startX: 550px; --endX: 560px; --dur: 3.8s; --del: -2.5s;" />
                <circle class="bubble" r="4" fill="#FFFFFF" style="--startX: 570px; --endX: 565px; --dur: 2.6s; --del: -1.2s;" />
                <circle class="bubble" r="5" fill="#FFFFFF" style="--startX: 590px; --endX: 600px; --dur: 3.1s; --del: -0.4s;" />
                <circle class="bubble" r="4" fill="#FFFFFF" style="--startX: 420px; --endX: 430px; --dur: 2.9s; --del: -1.8s;" />
                <circle class="bubble" r="5" fill="#FFFFFF" style="--startX: 460px; --endX: 450px; --dur: 3.4s; --del: -2.2s;" />
                <circle class="bubble" r="3" fill="#FFFFFF" style="--startX: 500px; --endX: 510px; --dur: 2.1s; --del: -1.1s;" />
                <circle class="bubble" r="6" fill="#FFFFFF" style="--startX: 540px; --endX: 530px; --dur: 3.6s; --del: -0.7s;" />
                <circle class="bubble" r="4" fill="#FFFFFF" style="--startX: 580px; --endX: 590px; --dur: 2.7s; --del: -2.9s;" />
            </g>

            <!-- Recombinant Proteins (Animated Swirling) -->
            <g id="proteins">
                <!-- Top Blade Swirl -->
                <g transform="translate(500, 280)"><g class="swirl-container" style="--radius: 50px; --dur: 3s; --del: 0s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 280)"><g class="swirl-container" style="--radius: 80px; --dur: 4s; --del: -1s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 280)"><g class="swirl-container" style="--radius: 110px; --dur: 5s; --del: -2.5s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 280)"><g class="swirl-container" style="--radius: 60px; --dur: 3.5s; --del: -1.5s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 280)"><g class="swirl-container" style="--radius: 90px; --dur: 4.5s; --del: -3s;"><use href="#protein" class="protein-molecule"/></g></g>

                <!-- Middle Blade Swirl -->
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 40px; --dur: 2.5s; --del: -0.5s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 70px; --dur: 3.5s; --del: -2s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 100px; --dur: 4.5s; --del: -1s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 130px; --dur: 5.5s; --del: -3.5s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 60px; --dur: 3s; --del: -1.2s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 90px; --dur: 4s; --del: -2.8s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 370)"><g class="swirl-container" style="--radius: 120px; --dur: 5s; --del: -4s;"><use href="#protein" class="protein-molecule"/></g></g>

                <!-- Bottom Blade Swirl -->
                <g transform="translate(500, 460)"><g class="swirl-container" style="--radius: 50px; --dur: 3s; --del: -0.2s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 460)"><g class="swirl-container" style="--radius: 80px; --dur: 4s; --del: -1.8s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 460)"><g class="swirl-container" style="--radius: 110px; --dur: 5s; --del: -3.2s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 460)"><g class="swirl-container" style="--radius: 65px; --dur: 3.5s; --del: -2.5s;"><use href="#protein" class="protein-molecule"/></g></g>
                <g transform="translate(500, 460)"><g class="swirl-container" style="--radius: 95px; --dur: 4.5s; --del: -0.9s;"><use href="#protein" class="protein-molecule"/></g></g>
            </g>

            <!-- Microbial Cells (E. coli) -->
            <g id="cells">
                <!-- Base Cells (Always visible) -->
                <g transform="translate(450, 480) rotate(15)"><use href="#ecoli"/></g>
                <g transform="translate(550, 450) rotate(-20)"><use href="#ecoli"/></g>
                <g transform="translate(400, 380) rotate(45)"><use href="#ecoli"/></g>
                <g transform="translate(600, 350) rotate(-60)"><use href="#ecoli"/></g>
                <g transform="translate(480, 280) rotate(10)"><use href="#ecoli"/></g>

                <!-- Proliferation Group 1 -->
                <g transform="translate(420, 460) rotate(30)"><use href="#ecoli" class="cell-pop-1"/></g>
                <g transform="translate(580, 480) rotate(-15)"><use href="#ecoli" class="cell-pop-1"/></g>
                <g transform="translate(380, 320) rotate(75)"><use href="#ecoli" class="cell-pop-1"/></g>
                <g transform="translate(620, 390) rotate(-40)"><use href="#ecoli" class="cell-pop-1"/></g>
                <g transform="translate(520, 260) rotate(5)"><use href="#ecoli" class="cell-pop-1"/></g>

                <!-- Proliferation Group 2 -->
                <g transform="translate(470, 420) rotate(-25)"><use href="#ecoli" class="cell-pop-2"/></g>
                <g transform="translate(530, 400) rotate(50)"><use href="#ecoli" class="cell-pop-2"/></g>
                <g transform="translate(360, 440) rotate(-70)"><use href="#ecoli" class="cell-pop-2"/></g>
                <g transform="translate(640, 290) rotate(20)"><use href="#ecoli" class="cell-pop-2"/></g>
                <g transform="translate(440, 250) rotate(-10)"><use href="#ecoli" class="cell-pop-2"/></g>

                <!-- Proliferation Group 3 -->
                <g transform="translate(490, 490) rotate(80)"><use href="#ecoli" class="cell-pop-3"/></g>
                <g transform="translate(570, 320) rotate(-85)"><use href="#ecoli" class="cell-pop-3"/></g>
                <g transform="translate(390, 270) rotate(35)"><use href="#ecoli" class="cell-pop-3"/></g>
                <g transform="translate(610, 460) rotate(-5)"><use href="#ecoli" class="cell-pop-3"/></g>
                <g transform="translate(460, 310) rotate(60)"><use href="#ecoli" class="cell-pop-3"/></g>
            </g>

            <!-- BIOREACTOR VESSEL (FRONT GLASS & OUTLINE) -->
            <!-- Front top opening curve -->
            <path d="M 330 150 A 170 20 0 0 0 670 150" fill="none" stroke="#2C3E50" stroke-width="2"/>
            <!-- Glass Reflection Highlight -->
            <path d="M 340 160 L 340 480 A 150 35 0 0 0 410 495 L 410 170 Z" fill="url(#glass-grad)" pointer-events="none"/>

            <!-- LABELS & ANNOTATIONS -->
            <g id="annotations">
                <!-- Impeller Label -->
                <polyline points="260,300 400,300 420,282" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="250" y="295" text-anchor="end" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Stirrer</text>
                <text x="250" y="315" text-anchor="end" font-family="Inter" font-size="12" fill="#7F8C8D">(Oxygen Transfer &amp; Mixing)</text>

                <!-- Sparger Label -->
                <polyline points="260,520 380,520 400,516" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="250" y="515" text-anchor="end" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Sparger</text>
                <text x="250" y="535" text-anchor="end" font-family="Inter" font-size="12" fill="#7F8C8D">(Sterile Air)</text>

                <!-- Cell Label -->
                <polyline points="740,300 620,300 600,320" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="750" y="295" text-anchor="start" font-family="Roboto Mono" font-size="14" font-weight="700" font-style="italic" fill="#2C3E50">Escherichia coli</text>
                <text x="750" y="315" text-anchor="start" font-family="Inter" font-size="12" fill="#7F8C8D">(Host Cells)</text>

                <!-- Product Label -->
                <polyline points="740,450 640,450 620,430" fill="none" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="750" y="445" text-anchor="start" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Recombinant Protein</text>
                <text x="750" y="465" text-anchor="start" font-family="Inter" font-size="12" fill="#7F8C8D">(The Product)</text>
            </g>

            <!-- Status Indicator -->
            <g transform="translate(380, 580)">
                <rect width="240" height="40" rx="20" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" filter="url(#shadow)"/>
                <circle cx="25" cy="20" r="6" fill="#2ECC71" class="status-dot"/>
                <text x="45" y="25" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">Status: Active Biosynthesis</text>
            </g>

        </svg>
    </div>
</body>
</html>
