<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNA Replication: The Role of the ori in Cloning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --dna-parent: #FF6B6B;
            --dna-new: #ff8e8e;
            --rna: #FFA07A;
            --protein: #98D8C8;
            --protein-dark: #76b5a5;
            --ligase: #4A90D9;
            --ori: #F1C40F;
            --text-main: #2C3E50;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .header h1 {
            font-size: 24px;
            margin: 10px 0 5px 0;
            font-weight: 700;
        }

        .header p {
            font-size: 14px;
            margin: 0;
            color: #555;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        text {
            fill: var(--text-main);
            user-select: none;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 14px;
        }

        .label {
            font-size: 12px;
            font-weight: 600;
        }

        .enzyme-label {
            font-size: 11px;
            font-weight: 700;
            fill: #1a5c4d;
        }

        /* --- ANIMATIONS --- */
        
        /* 1. Initiation: Unzipping the DNA */
        .initial-cover {
            stroke-dasharray: 500;
            stroke-dashoffset: 0;
            animation: erase-cover 15s linear infinite;
        }
        @keyframes erase-cover {
            0%, 5% { stroke-dashoffset: 0; opacity: 1; }
            20% { stroke-dashoffset: -450; opacity: 1; }
            21%, 90% { opacity: 0; stroke-dashoffset: -450; }
            95%, 100% { stroke-dashoffset: 0; opacity: 1; }
        }

        .unzipped-strand {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: draw-unzipped 15s linear infinite;
        }
        @keyframes draw-unzipped {
            0%, 5% { stroke-dashoffset: 500; opacity: 0; }
            6% { opacity: 1; }
            20%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 500; opacity: 0; }
        }

        /* ori Glow */
        .ori-glow {
            animation: ori-pulse 15s ease-in-out infinite;
            transform-origin: 100px 250px;
        }
        @keyframes ori-pulse {
            0% { opacity: 0; transform: scale(0.8); }
            5% { opacity: 0.8; transform: scale(1.1); }
            15% { opacity: 0; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* Helicase Movement */
        .helicase-group {
            animation: helicase-move 15s linear infinite;
        }
        @keyframes helicase-move {
            0%, 5% { transform: translateX(0px); opacity: 0; }
            6% { opacity: 1; }
            20%, 90% { transform: translateX(450px); opacity: 1; }
            95%, 100% { transform: translateX(0px); opacity: 0; }
        }

        /* 2. Elongation: Leading Strand */
        .leading-strand {
            stroke-dasharray: 500;
            stroke-dashoffset: 500;
            animation: draw-leading 15s linear infinite;
        }
        @keyframes draw-leading {
            0%, 20% { stroke-dashoffset: 500; opacity: 0; }
            21% { opacity: 1; }
            66%, 85% { stroke-dashoffset: 0; opacity: 1; }
            90%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .pol3-lead {
            offset-path: path('M 50 115 C 350 115, 400 195, 500 195');
            animation: pol3-lead-move 15s linear infinite;
        }
        @keyframes pol3-lead-move {
            0%, 20% { offset-distance: 0%; opacity: 0; }
            21% { opacity: 1; }
            66% { offset-distance: 100%; opacity: 1; }
            67%, 100% { opacity: 0; offset-distance: 100%; }
        }

        /* 2. Elongation: Lagging Strand (Okazaki Fragments) */
        /* Fragment 1 */
        .frag1-rna {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: draw-f1-rna 15s linear infinite;
        }
        @keyframes draw-f1-rna {
            0%, 26% { stroke-dashoffset: 60; opacity: 0; stroke: var(--rna); }
            27% { opacity: 1; stroke: var(--rna); }
            30%, 65% { stroke-dashoffset: 0; stroke: var(--rna); opacity: 1; }
            66%, 85% { stroke-dashoffset: 0; stroke: var(--dna-new); opacity: 1; } /* Maturation */
            90%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .frag1-dna {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: draw-f1-dna 15s linear infinite;
        }
        @keyframes draw-f1-dna {
            0%, 30% { stroke-dashoffset: 200; opacity: 0; }
            31% { opacity: 1; }
            46%, 85% { stroke-dashoffset: 0; opacity: 1; }
            90%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .pol3-lag1 {
            offset-path: path('M 480 305 C 460 305, 440 312, 430 320 C 380 350, 320 385, 275 385');
            animation: pol3-lag1-move 15s linear infinite;
        }
        @keyframes pol3-lag1-move {
            0%, 26% { offset-distance: 0%; opacity: 0; }
            27% { opacity: 1; }
            46% { offset-distance: 100%; opacity: 1; }
            47%, 100% { opacity: 0; offset-distance: 100%; }
        }

        /* Fragment 2 */
        .frag2-rna {
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: draw-f2-rna 15s linear infinite;
        }
        @keyframes draw-f2-rna {
            0%, 46% { stroke-dashoffset: 50; opacity: 0; stroke: var(--rna); }
            47% { opacity: 1; stroke: var(--rna); }
            50%, 65% { stroke-dashoffset: 0; stroke: var(--rna); opacity: 1; }
            66%, 85% { stroke-dashoffset: 0; stroke: var(--dna-new); opacity: 1; } /* Maturation */
            90%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .frag2-dna {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: draw-f2-dna 15s linear infinite;
        }
        @keyframes draw-f2-dna {
            0%, 50% { stroke-dashoffset: 200; opacity: 0; }
            51% { opacity: 1; }
            66%, 85% { stroke-dashoffset: 0; opacity: 1; }
            90%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        .pol3-lag2 {
            offset-path: path('M 260 385 L 220 385 L 50 385');
            animation: pol3-lag2-move 15s linear infinite;
        }
        @keyframes pol3-lag2-move {
            0%, 46% { offset-distance: 0%; opacity: 0; }
            47% { opacity: 1; }
            66% { offset-distance: 100%; opacity: 1; }
            67%, 100% { opacity: 0; offset-distance: 100%; }
        }

        /* 3. Maturation: Ligase */
        .ligase-group {
            animation: ligase-action 15s ease-in-out infinite;
            transform-origin: 267px 385px;
        }
        @keyframes ligase-action {
            0%, 70% { opacity: 0; transform: scale(0.5); }
            72% { opacity: 1; transform: scale(1.2); }
            75% { opacity: 1; transform: scale(0.9); }
            78% { opacity: 1; transform: scale(1.1); }
            82%, 100% { opacity: 0; transform: scale(0.5); }
        }

        /* Floating Nucleotides */
        .dntp {
            animation: float-dntp 15s ease-in-out infinite;
        }
        @keyframes float-dntp {
            0% { transform: translate(0, 0); opacity: 0.2; }
            50% { transform: translate(-20px, 15px); opacity: 0.6; }
            100% { transform: translate(0, 0); opacity: 0.2; }
        }
        
        /* Dynamic Labels */
        .dynamic-label {
            animation: fade-label 15s linear infinite;
        }
        @keyframes fade-label {
            0%, 25% { opacity: 0; }
            30%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>DNA Replication: The Role of the <i>ori</i> in Cloning</h1>
        <p>Continuous leading strand and discontinuous lagging strand synthesis at the replication fork.</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">DNA Replication Animation</title>
            <desc id="svg-desc">Animated diagram showing DNA replication. Helicase unzips the double helix starting at the origin of replication. DNA Polymerase synthesizes the leading strand continuously and the lagging strand discontinuously via Okazaki fragments. Ligase seals the gaps.</desc>

            <!-- Definitions -->
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="8" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <pattern id="rungs" x="0" y="0" width="15" height="80" patternUnits="userSpaceOnUse">
                    <line x1="7.5" y1="0" x2="7.5" y2="80" stroke="var(--dna-parent)" stroke-width="3" opacity="0.4"/>
                </pattern>
            </defs>

            <!-- Background Elements (dNTPs) -->
            <g fill="var(--dna-new)" opacity="0.4">
                <circle cx="150" cy="80" r="3" class="dntp" style="animation-delay: 0s;" />
                <circle cx="250" cy="150" r="3" class="dntp" style="animation-delay: -2s;" />
                <circle cx="350" cy="60" r="3" class="dntp" style="animation-delay: -4s;" />
                <circle cx="100" cy="450" r="3" class="dntp" style="animation-delay: -1s;" />
                <circle cx="300" cy="420" r="3" class="dntp" style="animation-delay: -3s;" />
                <circle cx="450" cy="380" r="3" class="dntp" style="animation-delay: -5s;" />
            </g>

            <!-- ==================== DNA STRANDS ==================== -->
            
            <!-- STATIC RIGHT SIDE (Zipped) -->
            <g id="static-zipped">
                <path d="M 500 210 L 750 210" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M 500 290 L 750 290" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <rect x="500" y="210" width="250" height="80" fill="url(#rungs)" />
            </g>

            <!-- INITIAL LEFT SIDE (Zipped Cover - Fades out) -->
            <g id="initial-zipped" class="initial-cover">
                <path d="M 50 210 L 500 210" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M 50 290 L 500 290" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Rungs for initial cover -->
                <path d="M 60 210 L 60 290 M 75 210 L 75 290 M 90 210 L 90 290 M 105 210 L 105 290 M 120 210 L 120 290 M 135 210 L 135 290 M 150 210 L 150 290 M 165 210 L 165 290 M 180 210 L 180 290 M 195 210 L 195 290 M 210 210 L 210 290 M 225 210 L 225 290 M 240 210 L 240 290 M 255 210 L 255 290 M 270 210 L 270 290 M 285 210 L 285 290 M 300 210 L 300 290 M 315 210 L 315 290 M 330 210 L 330 290 M 345 210 L 345 290 M 360 210 L 360 290 M 375 210 L 375 290 M 390 210 L 390 290 M 405 210 L 405 290 M 420 210 L 420 290 M 435 210 L 435 290 M 450 210 L 450 290 M 465 210 L 465 290 M 480 210 L 480 290 M 495 210 L 495 290" stroke="var(--dna-parent)" stroke-width="3" opacity="0.4"/>
            </g>

            <!-- UNZIPPED LEFT SIDE (Draws in) -->
            <g id="unzipped-strands" class="unzipped-strand">
                <!-- Top Parental (Template for Leading) -->
                <path d="M 50 100 C 350 100, 400 210, 500 210" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                <!-- Bottom Parental (Template for Lagging) -->
                <path d="M 50 400 C 350 400, 400 290, 500 290" stroke="var(--dna-parent)" stroke-width="5" fill="none" stroke-linecap="round"/>
                
                <!-- Exposed bases on unzipped strands -->
                <path d="M 60 100 L 60 110 M 90 100 L 90 110 M 120 100 L 120 110 M 150 100 L 150 110 M 180 100 L 180 110 M 210 100 L 210 110 M 240 100 L 240 110 M 270 100 L 270 110 M 300 100 L 300 110 M 330 102 L 330 112 M 360 110 L 360 120 M 390 135 L 390 145 M 420 170 L 420 180 M 450 195 L 450 205 M 480 208 L 480 218" stroke="var(--dna-parent)" stroke-width="3" opacity="0.4"/>
                <path d="M 60 400 L 60 390 M 90 400 L 90 390 M 120 400 L 120 390 M 150 400 L 150 390 M 180 400 L 180 390 M 210 400 L 210 390 M 240 400 L 240 390 M 270 400 L 270 390 M 300 400 L 300 390 M 330 398 L 330 388 M 360 390 L 360 380 M 390 365 L 390 355 M 420 330 L 420 320 M 450 305 L 450 295 M 480 292 L 480 282" stroke="var(--dna-parent)" stroke-width="3" opacity="0.4"/>
            </g>

            <!-- NEW DNA SYNTHESIS -->
            <!-- Leading Strand -->
            <path d="M 50 115 C 350 115, 400 195, 500 195" stroke="var(--dna-new)" stroke-width="4" fill="none" stroke-linecap="round" class="leading-strand"/>
            
            <!-- Lagging Strand (Okazaki Fragments) -->
            <!-- Fragment 1 -->
            <path d="M 480 305 C 460 305, 440 312, 430 320" stroke-width="4" fill="none" stroke-linecap="round" class="frag1-rna"/>
            <path d="M 430 320 C 380 350, 320 385, 275 385" stroke="var(--dna-new)" stroke-width="4" fill="none" stroke-linecap="round" class="frag1-dna"/>
            
            <!-- Fragment 2 -->
            <path d="M 260 385 L 220 385" stroke-width="4" fill="none" stroke-linecap="round" class="frag2-rna"/>
            <path d="M 220 385 L 50 385" stroke="var(--dna-new)" stroke-width="4" fill="none" stroke-linecap="round" class="frag2-dna"/>


            <!-- ==================== ENZYMES & MACHINERY ==================== -->
            
            <!-- Origin of Replication (ori) Glow -->
            <g class="ori-glow">
                <rect x="70" y="190" width="60" height="120" fill="var(--ori)" opacity="0.4" filter="url(#glow)" rx="10"/>
                <text x="100" y="180" text-anchor="middle" class="label" fill="#B7950B">ori</text>
            </g>

            <!-- Helicase -->
            <g class="helicase-group">
                <polygon points="30,250 50,225 80,225 100,250 80,275 50,275" fill="var(--protein)" stroke="var(--protein-dark)" stroke-width="2"/>
                <text x="65" y="254" text-anchor="middle" class="enzyme-label">Helicase</text>
            </g>

            <!-- DNA Polymerase III (Leading) -->
            <g class="pol3-lead">
                <ellipse cx="0" cy="0" rx="25" ry="18" fill="var(--protein)" stroke="var(--protein-dark)" stroke-width="2"/>
                <text x="0" y="4" text-anchor="middle" class="enzyme-label">Pol III</text>
            </g>

            <!-- DNA Polymerase III (Lagging 1) -->
            <g class="pol3-lag1">
                <ellipse cx="0" cy="0" rx="25" ry="18" fill="var(--protein)" stroke="var(--protein-dark)" stroke-width="2"/>
                <text x="0" y="4" text-anchor="middle" class="enzyme-label">Pol III</text>
            </g>

            <!-- DNA Polymerase III (Lagging 2) -->
            <g class="pol3-lag2">
                <ellipse cx="0" cy="0" rx="25" ry="18" fill="var(--protein)" stroke="var(--protein-dark)" stroke-width="2"/>
                <text x="0" y="4" text-anchor="middle" class="enzyme-label">Pol III</text>
            </g>

            <!-- DNA Ligase -->
            <g class="ligase-group">
                <circle cx="267" cy="385" r="16" fill="var(--ligase)" stroke="#2C3E50" stroke-width="2"/>
                <text x="267" y="389" text-anchor="middle" class="enzyme-label" fill="#fff">Ligase</text>
            </g>


            <!-- ==================== LABELS & ANNOTATIONS ==================== -->
            
            <!-- 5' and 3' Ends -->
            <text x="20" y="105" class="mono">3'</text>
            <text x="20" y="405" class="mono">5'</text>
            <text x="765" y="215" class="mono">5'</text>
            <text x="765" y="295" class="mono">3'</text>
            
            <!-- New Strand Ends (Dynamic) -->
            <g class="dynamic-label">
                <text x="20" y="120" class="mono" fill="var(--dna-new)">5'</text>
                <text x="20" y="390" class="mono" fill="var(--dna-new)">3'</text>
                
                <!-- Strand Labels -->
                <text x="150" y="80" class="label" fill="var(--dna-new)">Leading Strand (Continuous)</text>
                <path d="M 150 85 L 150 110" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
                
                <text x="150" y="440" class="label" fill="var(--dna-new)">Lagging Strand (Discontinuous)</text>
                <path d="M 150 425 L 150 390" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
                
                <text x="350" y="440" class="label" fill="var(--dna-new)">Okazaki Fragment</text>
                <path d="M 350 425 L 350 380" stroke="#999" stroke-width="1" marker-end="url(#arrow)"/>
            </g>

            <!-- Arrow Marker for Annotations -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#999" />
                </marker>
            </defs>

            <!-- Legend -->
            <rect x="600" y="380" width="180" height="100" fill="#ffffff" stroke="#e0e0e0" rx="5" opacity="0.9"/>
            <text x="610" y="400" class="label" font-size="11px">Legend:</text>
            
            <line x1="610" y1="415" x2="630" y2="415" stroke="var(--dna-parent)" stroke-width="3"/>
            <text x="640" y="419" class="label" font-size="10px">Parental DNA</text>
            
            <line x1="610" y1="435" x2="630" y2="435" stroke="var(--dna-new)" stroke-width="3"/>
            <text x="640" y="439" class="label" font-size="10px">Newly Synthesized DNA</text>
            
            <line x1="610" y1="455" x2="630" y2="455" stroke="var(--rna)" stroke-width="3"/>
            <text x="640" y="459" class="label" font-size="10px">RNA Primer</text>
            
        </svg>
    </div>

</body>
</html>
