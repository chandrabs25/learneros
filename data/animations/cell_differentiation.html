<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Differentiation & Growth Regulation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f9fa;
            --membrane-normal: #4A90D9;
            --cyto-normal: #E8F4FD;
            --nucleus: #2C3E50;
            --cyto-diff: #2ECC71;
            --membrane-cancer: #E74C3C;
            --cyto-cancer: #F39C12;
            --dna: #FF6B6B;
            --protein: #98D8C8;
            --text-main: #2C3E50;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 16px;
            margin: 0;
            color: #555;
            max-width: 800px;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: var(--text-main);
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }

        /* --- Animations --- */
        
        /* Global Loop Fade */
        .loop-group {
            animation: loop-fade 12s infinite;
        }
        @keyframes loop-fade {
            0%, 92% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        /* Interphase Pulse */
        .pulse {
            animation: pulse-anim 12s infinite;
        }
        @keyframes pulse-anim {
            0% { transform: scale(1); }
            10% { transform: scale(1.08); }
            15%, 100% { transform: scale(1); }
        }

        /* Left Side: Normal Growth */
        .left-top-cell {
            animation: left-top-move 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes left-top-move {
            0%, 15% { transform: translate(0, 0); }
            30%, 100% { transform: translate(0, -45px); }
        }

        .left-bot-cell {
            animation: left-bot-move 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes left-bot-move {
            0%, 15% { transform: translate(0, 0); }
            30%, 45% { transform: translate(0, 45px); }
            65%, 100% { transform: translate(0, 100px); }
        }

        .left-bot-rect {
            animation: left-bot-shape 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes left-bot-shape {
            0%, 45% { height: 60px; fill: var(--cyto-normal); stroke: var(--membrane-normal); }
            65%, 100% { height: 140px; fill: var(--cyto-diff); stroke: #27AE60; }
        }

        .left-bot-nuc {
            animation: left-bot-nuc-anim 12s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes left-bot-nuc-anim {
            0%, 45% { opacity: 1; transform: scale(1) translate(0, 0); }
            65%, 100% { opacity: 0.4; transform: scale(0.7) translate(-15px, -15px); }
        }

        /* Right Side: Cancer Growth */
        .right-cell-a { animation: right-move-a 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes right-move-a {
            0%, 15% { transform: translate(0, 0) scale(1); }
            30%, 45% { transform: translate(-35px, -35px) scale(1); }
            50%, 60% { transform: translate(-35px, -35px) scale(1.15); }
            65%, 100% { transform: translate(-65px, -70px) scale(1); }
        }

        .right-cell-b { animation: right-move-b 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes right-move-b {
            0%, 15% { transform: translate(0, 0) scale(1); }
            30%, 45% { transform: translate(-35px, -35px) scale(1); }
            50%, 60% { transform: translate(-35px, -35px) scale(1.15); }
            65%, 100% { transform: translate(15px, -60px) scale(1); }
        }

        .right-cell-c { animation: right-move-c 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes right-move-c {
            0%, 15% { transform: translate(0, 0) scale(1); }
            30%, 45% { transform: translate(35px, 35px) scale(1); }
            50%, 60% { transform: translate(35px, 35px) scale(1.15); }
            65%, 100% { transform: translate(-25px, 65px) scale(1); }
        }

        .right-cell-d { animation: right-move-d 12s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes right-move-d {
            0%, 15% { transform: translate(0, 0) scale(1); }
            30%, 45% { transform: translate(35px, 35px) scale(1); }
            50%, 60% { transform: translate(35px, 35px) scale(1.15); }
            65%, 100% { transform: translate(55px, 45px) scale(1); }
        }

        /* Nucleus Fading during Mitosis */
        .nuc-fade-1 { animation: nuc-fade-1-anim 12s infinite; }
        @keyframes nuc-fade-1-anim {
            0%, 12% { opacity: 1; }
            16%, 26% { opacity: 0; }
            30%, 100% { opacity: 1; }
        }

        .nuc-fade-2 { animation: nuc-fade-2-anim 12s infinite; }
        @keyframes nuc-fade-2-anim {
            0%, 45% { opacity: 1; }
            48%, 62% { opacity: 0; }
            65%, 100% { opacity: 1; }
        }

        /* Spindle Fibers */
        .spindle-1 { animation: spindle-1-anim 12s infinite; opacity: 0; }
        @keyframes spindle-1-anim {
            0%, 14% { opacity: 0; transform: scale(0.5); }
            18%, 24% { opacity: 1; transform: scale(1); }
            28%, 100% { opacity: 0; transform: scale(1.2); }
        }

        .spindle-2 { animation: spindle-2-anim 12s infinite; opacity: 0; }
        @keyframes spindle-2-anim {
            0%, 48% { opacity: 0; transform: scale(0.5); }
            52%, 58% { opacity: 1; transform: scale(1); }
            62%, 100% { opacity: 0; transform: scale(1.2); }
        }

        /* Cell Plate */
        .cell-plate { animation: cell-plate-anim 12s infinite; opacity: 0; transform-origin: center; }
        @keyframes cell-plate-anim {
            0%, 18% { opacity: 0; transform: scaleX(0); }
            22%, 26% { opacity: 1; transform: scaleX(1); }
            30%, 100% { opacity: 0; }
        }

        /* Labels */
        .label-mitosis { animation: label-m-anim 12s infinite; opacity: 0; }
        @keyframes label-m-anim {
            15%, 30% { opacity: 1; transform: translateY(-5px); }
        }

        .label-diff { animation: label-d-anim 12s infinite; opacity: 0; }
        @keyframes label-d-anim {
            45%, 92% { opacity: 1; transform: translateY(-5px); }
        }

        .label-cancer { animation: label-c-anim 12s infinite; opacity: 0; }
        @keyframes label-c-anim {
            65%, 92% { opacity: 1; transform: translateY(-5px); }
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>Cell Differentiation & Growth Regulation</h1>
        <p class="subtitle">Comparing Arithmetic Growth (Normal Differentiation) with Unregulated Proliferation (Cancer)</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title" role="img">
            <title id="svg-title">Animated comparison of normal cell differentiation and cancerous proliferation</title>
            
            <defs>
                <!-- Cancer Cell Bumpy Membrane Filter -->
                <filter id="cancer-bump" x="-20%" y="-20%" width="140%" height="140%">
                    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
                    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
                </filter>

                <!-- Spindle Fiber Template -->
                <g id="spindle-structure">
                    <line x1="-20" y1="-30" x2="0" y2="30" stroke="var(--protein)" stroke-width="2" stroke-dasharray="3,3" />
                    <line x1="-10" y1="-35" x2="10" y2="35" stroke="var(--protein)" stroke-width="2" stroke-dasharray="3,3" />
                    <line x1="0" y1="-38" x2="20" y2="38" stroke="var(--protein)" stroke-width="2" stroke-dasharray="3,3" />
                    <line x1="10" y1="-35" x2="-10" y2="35" stroke="var(--protein)" stroke-width="2" stroke-dasharray="3,3" />
                    <line x1="20" y1="-30" x2="-20" y2="30" stroke="var(--protein)" stroke-width="2" stroke-dasharray="3,3" />
                </g>
            </defs>

            <!-- Background & Structure -->
            <rect width="800" height="500" fill="var(--bg-color)" />
            <line x1="400" y1="60" x2="400" y2="440" stroke="#ced4da" stroke-width="2" stroke-dasharray="6,6" />

            <!-- Static Titles -->
            <text x="200" y="45" font-size="18" font-weight="700" text-anchor="middle">Arithmetic Growth (Normal)</text>
            <text x="600" y="45" font-size="18" font-weight="700" text-anchor="middle">Unregulated Growth (Cancer)</text>

            <!-- Animated Process Labels -->
            <text class="label-mitosis" x="200" y="90" font-size="14" font-weight="600" fill="#E74C3C" text-anchor="middle">Mitosis</text>
            <text class="label-mitosis" x="600" y="90" font-size="14" font-weight="600" fill="#E74C3C" text-anchor="middle">Mitosis</text>
            
            <text class="label-diff" x="200" y="380" font-size="14" font-weight="600" fill="#27AE60" text-anchor="middle">Differentiation & Maturation</text>
            <text class="label-diff" x="200" y="400" font-size="12" font-style="italic" fill="#555" text-anchor="middle">(Enters G₀ Phase)</text>

            <text class="label-cancer" x="600" y="380" font-size="14" font-weight="600" fill="#E74C3C" text-anchor="middle">Loss of Contact Inhibition</text>
            <text class="label-cancer" x="600" y="400" font-size="12" font-style="italic" fill="#555" text-anchor="middle">(Exponential Proliferation)</text>

            <!-- MAIN ANIMATION GROUP -->
            <g class="loop-group">

                <!-- ================= LEFT SIDE (NORMAL) ================= -->
                <g transform="translate(200, 180)">
                    
                    <!-- Spindle Fibers (Mitosis 1) -->
                    <use href="#spindle-structure" class="spindle-1" />
                    
                    <!-- Cell Plate -->
                    <line class="cell-plate" x1="-35" y1="0" x2="35" y2="0" stroke="#2ECC71" stroke-width="4" />

                    <!-- Bottom Cell (Differentiating) -->
                    <g class="left-bot-cell pulse">
                        <rect class="left-bot-rect" x="-30" y="-30" width="60" height="60" rx="12" stroke-width="2" />
                        <g class="left-bot-nuc nuc-fade-1">
                            <circle cx="0" cy="0" r="10" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="3" font-size="9" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                    <!-- Top Cell (Meristematic / Stem) -->
                    <g class="left-top-cell pulse">
                        <rect x="-30" y="-30" width="60" height="60" rx="12" fill="var(--cyto-normal)" stroke="var(--membrane-normal)" stroke-width="2" />
                        <g class="nuc-fade-1">
                            <circle cx="0" cy="0" r="10" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="3" font-size="9" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                </g>

                <!-- ================= RIGHT SIDE (CANCER) ================= -->
                <g transform="translate(600, 180)">
                    
                    <!-- Spindle Fibers (Mitosis 1) -->
                    <use href="#spindle-structure" class="spindle-1" />

                    <!-- Spindle Fibers (Mitosis 2) -->
                    <use href="#spindle-structure" class="spindle-2" transform="translate(-35, -35) scale(0.8)" />
                    <use href="#spindle-structure" class="spindle-2" transform="translate(35, 35) scale(0.8)" />

                    <!-- Cancer Cell D (Bottom Right) -->
                    <g class="right-cell-d pulse">
                        <circle cx="0" cy="0" r="32" fill="var(--cyto-cancer)" stroke="var(--membrane-cancer)" stroke-width="2.5" filter="url(#cancer-bump)" />
                        <g class="nuc-fade-1 nuc-fade-2">
                            <circle cx="0" cy="0" r="16" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="4" font-size="11" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                    <!-- Cancer Cell C (Bottom Left) -->
                    <g class="right-cell-c pulse">
                        <circle cx="0" cy="0" r="32" fill="var(--cyto-cancer)" stroke="var(--membrane-cancer)" stroke-width="2.5" filter="url(#cancer-bump)" />
                        <g class="nuc-fade-1 nuc-fade-2">
                            <circle cx="0" cy="0" r="16" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="4" font-size="11" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                    <!-- Cancer Cell B (Top Right) -->
                    <g class="right-cell-b pulse">
                        <circle cx="0" cy="0" r="32" fill="var(--cyto-cancer)" stroke="var(--membrane-cancer)" stroke-width="2.5" filter="url(#cancer-bump)" />
                        <g class="nuc-fade-1 nuc-fade-2">
                            <circle cx="0" cy="0" r="16" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="4" font-size="11" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                    <!-- Cancer Cell A (Top Left) -->
                    <g class="right-cell-a pulse">
                        <circle cx="0" cy="0" r="32" fill="var(--cyto-cancer)" stroke="var(--membrane-cancer)" stroke-width="2.5" filter="url(#cancer-bump)" />
                        <g class="nuc-fade-1 nuc-fade-2">
                            <circle cx="0" cy="0" r="16" fill="var(--nucleus)" />
                            <text class="mono" x="0" y="4" font-size="11" fill="var(--dna)" text-anchor="middle">2n</text>
                        </g>
                    </g>

                </g>

            </g> <!-- End Loop Group -->

            <!-- Legend -->
            <g transform="translate(150, 460)">
                <rect x="0" y="0" width="16" height="16" rx="4" fill="var(--cyto-normal)" stroke="var(--membrane-normal)" stroke-width="1.5" />
                <text x="24" y="12" font-size="12">Meristematic/Stem Cell</text>
                
                <rect x="180" y="0" width="16" height="16" rx="4" fill="var(--cyto-diff)" stroke="#27AE60" stroke-width="1.5" />
                <text x="204" y="12" font-size="12">Differentiated Cell</text>
                
                <circle cx="360" cy="8" r="9" fill="var(--cyto-cancer)" stroke="var(--membrane-cancer)" stroke-width="1.5" filter="url(#cancer-bump)" />
                <text x="376" y="12" font-size="12">Cancer Cell (Anaplasia)</text>
            </g>

        </svg>
    </div>

</body>
</html>
