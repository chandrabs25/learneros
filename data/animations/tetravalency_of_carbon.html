<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetravalency & sp³ Hybridization of Carbon</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 800; fill: #333; text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 600; fill: #666; text-anchor: middle; }
        .axis-label { font-size: 14px; font-weight: 800; fill: #7209B7; text-anchor: middle; }
        .box-label { font-size: 14px; font-weight: 600; fill: #555; text-anchor: middle; }
        .state-text { font-size: 20px; font-weight: 800; fill: #7209B7; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 28px; font-weight: 700; fill: #333; text-anchor: end; }
        .angle-text { font-size: 14px; font-weight: 800; fill: #7209B7; text-anchor: middle; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
        .legend-text { font-size: 12px; font-weight: 600; fill: #555; }

        /* Energy Diagram Animations */
        .box-2s { animation: box-2s-move 12s infinite ease-in-out; }
        .box-2px { animation: box-2px-move 12s infinite ease-in-out; }
        .box-2py { animation: box-2py-move 12s infinite ease-in-out; }
        .box-2pz { animation: box-2pz-move 12s infinite ease-in-out; }

        .e1 { animation: e1-move 12s infinite ease-in-out; }
        .e2 { animation: e2-move 12s infinite ease-in-out; transform-origin: center; }
        .e3 { animation: e3-move 12s infinite ease-in-out; }
        .e4 { animation: e4-move 12s infinite ease-in-out; }

        .s-p-labels { animation: fade-out-early 12s infinite ease-in-out; }
        .sp3-labels { opacity: 0; animation: fade-in-mid 12s infinite ease-in-out; }
        .energy-arrow { opacity: 0; animation: energy-flash 12s infinite ease-in-out; }

        /* 3D Orbital Animations */
        .s-p-orbitals { transform-origin: 600px 280px; animation: s-p-fade 12s infinite ease-in-out; }
        .sp3-group { transform-origin: 600px 280px; animation: sp3-fade-scale 12s infinite ease-in-out; }
        
        .sp3-1 { transform-origin: 600px 280px; animation: sp3-rot1 12s infinite ease-in-out; }
        .sp3-2 { transform-origin: 600px 280px; animation: sp3-rot2 12s infinite ease-in-out; }
        .sp3-3 { transform-origin: 600px 280px; animation: sp3-rot3 12s infinite ease-in-out; }
        .sp3-4 { transform-origin: 600px 280px; animation: sp3-rot4 12s infinite ease-in-out; }

        /* Methane Formation Animations */
        .h1 { animation: h1-move 12s infinite ease-in-out; }
        .h2 { animation: h2-move 12s infinite ease-in-out; }
        .h3 { animation: h3-move 12s infinite ease-in-out; }
        .h4 { animation: h4-move 12s infinite ease-in-out; }

        .bond { stroke-dasharray: 120; stroke-dashoffset: 120; animation: bond-grow 12s infinite ease-in-out; }
        .bond-electrons, .cage { opacity: 0; animation: fade-in-late 12s infinite ease-in-out; }
        .angle-label { opacity: 0; animation: angle-fade 12s infinite ease-in-out; }
        .formula-group { opacity: 0; animation: fade-in-late 12s infinite ease-in-out; }

        /* State Text Animations */
        .t1 { animation: text1 12s infinite ease-in-out; }
        .t2 { opacity: 0; animation: text2 12s infinite ease-in-out; }
        .t3 { opacity: 0; animation: text3 12s infinite ease-in-out; }
        .t4 { opacity: 0; animation: text4 12s infinite ease-in-out; }

        /* Keyframes - Energy Boxes */
        @keyframes box-2s-move {
            0%, 33% { transform: translate(105px, 345px); }
            40%, 95% { transform: translate(150px, 265px); }
            100% { transform: translate(105px, 345px); }
        }
        @keyframes box-2px-move {
            0%, 33% { transform: translate(165px, 185px); }
            40%, 95% { transform: translate(180px, 265px); }
            100% { transform: translate(165px, 185px); }
        }
        @keyframes box-2py-move {
            0%, 33% { transform: translate(210px, 185px); }
            40%, 95% { transform: translate(210px, 265px); }
            100% { transform: translate(210px, 185px); }
        }
        @keyframes box-2pz-move {
            0%, 33% { transform: translate(255px, 185px); }
            40%, 95% { transform: translate(240px, 265px); }
            100% { transform: translate(255px, 185px); }
        }

        /* Keyframes - Electrons */
        @keyframes e1-move {
            0%, 33% { transform: translate(112px, 360px); }
            40%, 95% { transform: translate(165px, 280px); }
            100% { transform: translate(112px, 360px); }
        }
        @keyframes e2-move {
            0%, 15% { transform: translate(128px, 360px) rotate(180deg); }
            18%, 33% { transform: translate(270px, 200px) rotate(0deg); }
            40%, 95% { transform: translate(255px, 280px) rotate(0deg); }
            100% { transform: translate(128px, 360px) rotate(180deg); }
        }
        @keyframes e3-move {
            0%, 33% { transform: translate(180px, 200px); }
            40%, 95% { transform: translate(195px, 280px); }
            100% { transform: translate(180px, 200px); }
        }
        @keyframes e4-move {
            0%, 33% { transform: translate(225px, 200px); }
            40%, 95% { transform: translate(225px, 280px); }
            100% { transform: translate(225px, 200px); }
        }

        /* Keyframes - Orbitals */
        @keyframes s-p-fade {
            0%, 33% { opacity: 0.8; transform: scale(1); }
            40%, 100% { opacity: 0; transform: scale(0.5); }
        }
        @keyframes sp3-fade-scale {
            0%, 33% { opacity: 0; transform: scale(0.2); }
            40%, 75% { opacity: 0.85; transform: scale(1); }
            82%, 95% { opacity: 0.25; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.2); }
        }
        @keyframes sp3-rot1 {
            0%, 55% { transform: rotate(0deg); }
            62%, 100% { transform: rotate(-90deg); }
        }
        @keyframes sp3-rot2 {
            0%, 55% { transform: rotate(90deg); }
            62%, 100% { transform: rotate(19.5deg); }
        }
        @keyframes sp3-rot3 {
            0%, 55% { transform: rotate(180deg); }
            62%, 100% { transform: rotate(160.5deg); }
        }
        @keyframes sp3-rot4 {
            0%, 55% { transform: rotate(270deg) scale(1); }
            62%, 100% { transform: rotate(90deg) scale(0.6); }
        }

        /* Keyframes - Atoms & Bonds */
        @keyframes h1-move {
            0%, 75% { transform: translate(600px, 0px); opacity: 0; }
            82%, 95% { transform: translate(600px, 160px); opacity: 1; }
            100% { transform: translate(600px, 0px); opacity: 0; }
        }
        @keyframes h2-move {
            0%, 75% { transform: translate(800px, 380px); opacity: 0; }
            82%, 95% { transform: translate(713px, 320px); opacity: 1; }
            100% { transform: translate(800px, 380px); opacity: 0; }
        }
        @keyframes h3-move {
            0%, 75% { transform: translate(400px, 380px); opacity: 0; }
            82%, 95% { transform: translate(487px, 320px); opacity: 1; }
            100% { transform: translate(400px, 380px); opacity: 0; }
        }
        @keyframes h4-move {
            0%, 75% { transform: translate(600px, 450px) scale(0.8); opacity: 0; }
            82%, 95% { transform: translate(600px, 352px) scale(0.8); opacity: 1; }
            100% { transform: translate(600px, 450px) scale(0.8); opacity: 0; }
        }
        @keyframes bond-grow {
            0%, 75% { stroke-dashoffset: 120; opacity: 0; }
            82%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 120; opacity: 0; }
        }
        @keyframes fade-in-late {
            0%, 78% { opacity: 0; }
            85%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes angle-fade {
            0%, 60% { opacity: 0; }
            65%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Keyframes - Text & UI */
        @keyframes text1 { 0%, 15% {opacity: 1} 16%, 100% {opacity: 0} }
        @keyframes text2 { 0%, 15% {opacity: 0} 18%, 33% {opacity: 1} 34%, 100% {opacity: 0} }
        @keyframes text3 { 0%, 33% {opacity: 0} 40%, 75% {opacity: 1} 76%, 100% {opacity: 0} }
        @keyframes text4 { 0%, 75% {opacity: 0} 82%, 95% {opacity: 1} 96%, 100% {opacity: 0} }
        
        @keyframes fade-out-early { 0%, 33% {opacity: 1} 40%, 95% {opacity: 0} 100% {opacity: 1} }
        @keyframes fade-in-mid { 0%, 33% {opacity: 0} 40%, 95% {opacity: 1} 100% {opacity: 0} }
        
        @keyframes energy-flash {
            0%, 14% { opacity: 0; transform: translateY(10px); }
            15%, 18% { opacity: 1; transform: translateY(0); }
            19%, 100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Glow Filter for Electrons -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>

        <!-- Arrowhead for Energy Axis -->
        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#7209B7" />
        </marker>
        
        <!-- Arrowhead for Excitation -->
        <marker id="arrowhead-exc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#F77F00" />
        </marker>

        <!-- Orbital Shapes -->
        <path id="p-lobe" d="M 0 0 C 40 -35, 100 -25, 110 0 C 100 25, 40 35, 0 0 M 0 0 C -40 -35, -100 -25, -110 0 C -100 25, -40 35, 0 0" fill="#BDE0FE" />
        <path id="sp3-lobe" d="M 0 0 C 45 -45, 110 -35, 130 0 C 110 35, 45 45, 0 0 M 0 0 C -12 -12, -28 -6, -35 0 C -28 6, -12 12, 0 0" fill="#80FFDB" />

        <!-- Electron Graphic -->
        <g id="electron">
            <circle cx="0" cy="0" r="6" fill="#FFD700" filter="url(#glow)"/>
            <path d="M-2.5,1.5 L0,-3.5 L2.5,1.5 M0,-3.5 L0,4.5" stroke="#b8860b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- Hydrogen Atom Graphic -->
        <g id="h-atom">
            <circle cx="0" cy="0" r="16" fill="#E0E0E0" stroke="#999" stroke-width="2"/>
            <text x="0" y="5" font-family="Inter" font-size="14" font-weight="800" text-anchor="middle" fill="#555">H</text>
        </g>
    </defs>

    <!-- Background Panels -->
    <rect x="30" y="100" width="320" height="340" fill="#ffffff" rx="12" stroke="#e9ecef" stroke-width="2"/>
    <rect x="370" y="100" width="400" height="340" fill="#ffffff" rx="12" stroke="#e9ecef" stroke-width="2"/>

    <!-- Titles -->
    <text x="400" y="45" class="title">Tetravalency &amp; sp³ Hybridization of Carbon</text>
    <text x="400" y="65" class="subtitle">Watch the transition from ground state to a tetrahedral methane molecule</text>

    <!-- Dynamic State Text -->
    <text x="400" y="135" class="state-text t1">Ground State: 2s² 2p²</text>
    <text x="400" y="135" class="state-text t2">Excited State: 2s¹ 2p³</text>
    <text x="400" y="135" class="state-text t3">sp³ Hybridization</text>
    <text x="400" y="135" class="state-text t4">Methane (CH₄): Tetrahedral Geometry</text>

    <!-- ================= LEFT PANEL: ENERGY DIAGRAM ================= -->
    <g id="energy-diagram">
        <!-- Y-Axis -->
        <line x1="60" y1="410" x2="60" y2="130" stroke="#7209B7" stroke-width="3" marker-end="url(#arrowhead)"/>
        <text x="-270" y="45" transform="rotate(-90)" class="axis-label">Energy</text>

        <!-- Excitation Energy Arrow -->
        <g class="energy-arrow">
            <line x1="145" y1="320" x2="145" y2="230" stroke="#F77F00" stroke-width="3" stroke-dasharray="4,4" marker-end="url(#arrowhead-exc)"/>
            <text x="155" y="280" font-size="12" font-weight="800" fill="#F77F00">ΔE</text>
        </g>

        <!-- Energy Boxes -->
        <rect class="box-2s" width="30" height="30" fill="#f8f9fa" stroke="#7209B7" stroke-width="2" rx="4"/>
        <rect class="box-2px" width="30" height="30" fill="#f8f9fa" stroke="#7209B7" stroke-width="2" rx="4"/>
        <rect class="box-2py" width="30" height="30" fill="#f8f9fa" stroke="#7209B7" stroke-width="2" rx="4"/>
        <rect class="box-2pz" width="30" height="30" fill="#f8f9fa" stroke="#7209B7" stroke-width="2" rx="4"/>

        <!-- Box Labels -->
        <g class="s-p-labels">
            <text x="120" y="395" class="box-label">2s</text>
            <text x="210" y="235" class="box-label">2p</text>
        </g>
        <g class="sp3-labels">
            <text x="195" y="315" class="box-label">sp³ hybridized orbitals</text>
        </g>

        <!-- Electrons -->
        <use href="#electron" class="e1"/>
        <use href="#electron" class="e2"/>
        <use href="#electron" class="e3"/>
        <use href="#electron" class="e4"/>

        <!-- Legend -->
        <g transform="translate(45, 450)">
            <rect x="0" y="0" width="12" height="12" fill="#A2D2FF" rx="2"/>
            <text x="18" y="10" class="legend-text">s-orbital</text>
            
            <rect x="85" y="0" width="12" height="12" fill="#BDE0FE" rx="2"/>
            <text x="103" y="10" class="legend-text">p-orbital</text>
            
            <rect x="170" y="0" width="12" height="12" fill="#80FFDB" rx="2"/>
            <text x="188" y="10" class="legend-text">sp³-hybrid</text>
            
            <circle cx="265" cy="6" r="5" fill="#FFD700" filter="url(#glow)"/>
            <text x="275" y="10" class="legend-text">Electron</text>
        </g>
    </g>

    <!-- ================= RIGHT PANEL: 3D VISUALIZATION ================= -->
    <g id="3d-visualization">
        
        <!-- 3D Cage (Tetrahedron dashed lines) -->
        <path d="M 600 160 L 713 320 L 487 320 Z M 600 160 L 600 352 M 713 320 L 600 352 M 487 320 L 600 352" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="6,6" fill="none" class="cage"/>

        <!-- Orbitals -->
        <g class="s-p-orbitals">
            <!-- 2s Orbital -->
            <circle cx="600" cy="280" r="55" fill="#A2D2FF"/>
            <!-- 2p Orbitals -->
            <use href="#p-lobe" transform="translate(600, 280)"/>
            <use href="#p-lobe" transform="translate(600, 280) rotate(90)"/>
            <use href="#p-lobe" transform="translate(600, 280) rotate(45) scale(0.8)"/>
        </g>

        <g class="sp3-group">
            <g class="sp3-1"><use href="#sp3-lobe"/></g>
            <g class="sp3-2"><use href="#sp3-lobe"/></g>
            <g class="sp3-3"><use href="#sp3-lobe"/></g>
            <g class="sp3-4"><use href="#sp3-lobe"/></g>
        </g>

        <!-- Bonds -->
        <line x1="600" y1="280" x2="600" y2="160" stroke="#555" stroke-width="8" stroke-linecap="round" class="bond"/>
        <line x1="600" y1="280" x2="713" y2="320" stroke="#555" stroke-width="8" stroke-linecap="round" class="bond"/>
        <line x1="600" y1="280" x2="487" y2="320" stroke="#555" stroke-width="8" stroke-linecap="round" class="bond"/>
        <line x1="600" y1="280" x2="600" y2="352" stroke="#555" stroke-width="8" stroke-linecap="round" class="bond"/>

        <!-- Bond Electrons (Shared Pairs) -->
        <g class="bond-electrons">
            <!-- Top Bond -->
            <circle cx="594" cy="220" r="4" fill="#FFD700" filter="url(#glow)"/>
            <circle cx="606" cy="220" r="4" fill="#FFD700" filter="url(#glow)"/>
            <!-- Bottom Right Bond -->
            <circle cx="658" cy="295" r="4" fill="#FFD700" filter="url(#glow)"/>
            <circle cx="653" cy="305" r="4" fill="#FFD700" filter="url(#glow)"/>
            <!-- Bottom Left Bond -->
            <circle cx="542" cy="295" r="4" fill="#FFD700" filter="url(#glow)"/>
            <circle cx="547" cy="305" r="4" fill="#FFD700" filter="url(#glow)"/>
            <!-- Front/Bottom Bond -->
            <circle cx="594" cy="316" r="4" fill="#FFD700" filter="url(#glow)"/>
            <circle cx="606" cy="316" r="4" fill="#FFD700" filter="url(#glow)"/>
        </g>

        <!-- Central Carbon Atom -->
        <circle cx="600" cy="280" r="22" fill="#404040"/>
        <text x="600" y="286" font-family="Inter" font-size="18" font-weight="800" text-anchor="middle" fill="#ffffff">C</text>

        <!-- Hydrogen Atoms -->
        <use href="#h-atom" class="h1"/>
        <use href="#h-atom" class="h2"/>
        <use href="#h-atom" class="h3"/>
        <use href="#h-atom" class="h4"/>

        <!-- Angle Label -->
        <g class="angle-label">
            <path d="M 600 215 A 65 65 0 0 1 661 301" stroke="#7209B7" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
            <text x="648" y="250" class="angle-text">109.5°</text>
        </g>

        <!-- Chemical Formula -->
        <g class="formula-group">
            <text x="750" y="420" class="formula">CH<tspan baseline-shift="sub" font-size="18">4</tspan></text>
        </g>
    </g>

</svg>

</body>
</html>
