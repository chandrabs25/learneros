<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomenclature of Aromatic Compounds</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animation Classes */
        .base-benzene {
            animation: fade-benzene 16s infinite ease-in-out;
        }

        .h1-group {
            animation: fade-h1 16s infinite ease-in-out;
        }

        .ch3-group {
            animation: fade-ch3 16s infinite ease-in-out;
            opacity: 0;
        }

        .h2-group {
            animation: fade-h2 16s infinite ease-in-out;
        }

        .h3-group {
            animation: fade-h3 16s infinite ease-in-out;
        }

        .h4-group {
            animation: fade-h4 16s infinite ease-in-out;
        }

        .cl-group {
            animation: move-cl 16s infinite ease-in-out;
            opacity: 0;
        }

        .cl-bond2 { animation: fade-bond2 16s infinite ease-in-out; opacity: 0; }
        .cl-bond3 { animation: fade-bond3 16s infinite ease-in-out; opacity: 0; }
        .cl-bond4 { animation: fade-bond4 16s infinite ease-in-out; opacity: 0; }

        .arrow1 { animation: show-arrow1 16s infinite ease-in-out; opacity: 0; }
        .arrow2 { animation: show-arrow2 16s infinite ease-in-out; opacity: 0; }

        .pulse-1 { animation: pulse-c1 16s infinite ease-in-out; transform-origin: 400px 170px; }
        .pulse-2 { animation: pulse-c2 16s infinite ease-in-out; transform-origin: 469.28px 210px; }
        .pulse-3 { animation: pulse-c3 16s infinite ease-in-out; transform-origin: 469.28px 290px; }
        .pulse-4 { animation: pulse-c4 16s infinite ease-in-out; transform-origin: 400px 330px; }

        .text-benz { animation: text-benz 16s infinite ease-in-out; }
        .text-tol { animation: text-tol 16s infinite ease-in-out; opacity: 0; }
        .text-ortho { animation: text-ortho 16s infinite ease-in-out; opacity: 0; }
        .text-meta { animation: text-meta 16s infinite ease-in-out; opacity: 0; }
        .text-para { animation: text-para 16s infinite ease-in-out; opacity: 0; }

        /* Keyframes */
        @keyframes fade-benzene {
            0%, 100% { opacity: 0; }
            5%, 95% { opacity: 1; }
        }

        @keyframes fade-h1 {
            0% { opacity: 0; }
            5%, 10% { opacity: 1; }
            15%, 85% { opacity: 0; }
            90%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fade-ch3 {
            0%, 10%, 90%, 100% { opacity: 0; }
            15%, 85% { opacity: 1; }
        }

        @keyframes fade-h2 {
            0% { opacity: 0; }
            5%, 25% { opacity: 1; }
            30%, 35% { opacity: 0; }
            40%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fade-h3 {
            0% { opacity: 0; }
            5%, 35% { opacity: 1; }
            40%, 50% { opacity: 0; }
            55%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes fade-h4 {
            0% { opacity: 0; }
            5%, 50% { opacity: 1; }
            55%, 75% { opacity: 0; }
            80%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes move-cl {
            0%, 25% { opacity: 0; transform: translate(518.6px, 181.5px); }
            26%, 35% { opacity: 1; transform: translate(518.6px, 181.5px); }
            40%, 50% { opacity: 1; transform: translate(518.6px, 318.5px); }
            55%, 75% { opacity: 1; transform: translate(400px, 387px); }
            76%, 100% { opacity: 0; transform: translate(400px, 387px); }
        }

        @keyframes fade-bond2 {
            0%, 25%, 35%, 100% { opacity: 0; }
            26%, 34% { opacity: 1; }
        }

        @keyframes fade-bond3 {
            0%, 40%, 50%, 100% { opacity: 0; }
            41%, 49% { opacity: 1; }
        }

        @keyframes fade-bond4 {
            0%, 55%, 75%, 100% { opacity: 0; }
            56%, 74% { opacity: 1; }
        }

        @keyframes show-arrow1 {
            0%, 35%, 40%, 100% { opacity: 0; }
            36%, 39% { opacity: 1; }
        }

        @keyframes show-arrow2 {
            0%, 50%, 55%, 100% { opacity: 0; }
            51%, 54% { opacity: 1; }
        }

        @keyframes pulse-c1 {
            0%, 10%, 15%, 100% { opacity: 0; transform: scale(1); }
            12% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes pulse-c2 {
            0%, 25%, 30%, 100% { opacity: 0; transform: scale(1); }
            27% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes pulse-c3 {
            0%, 40%, 45%, 100% { opacity: 0; transform: scale(1); }
            42% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes pulse-c4 {
            0%, 55%, 60%, 100% { opacity: 0; transform: scale(1); }
            57% { opacity: 1; transform: scale(1.5); }
        }

        @keyframes text-benz {
            0%, 10% { opacity: 1; }
            12%, 83% { opacity: 0; }
            85%, 100% { opacity: 1; }
        }

        @keyframes text-tol {
            0%, 13% { opacity: 0; }
            15%, 25% { opacity: 1; }
            27%, 100% { opacity: 0; }
        }

        @keyframes text-ortho {
            0%, 28% { opacity: 0; }
            30%, 38% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }

        @keyframes text-meta {
            0%, 40% { opacity: 0; }
            42%, 48% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes text-para {
            0%, 50% { opacity: 0; }
            52%, 73% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        .atom-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            fill: #404040;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .label-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            fill: #212529;
            text-anchor: middle;
        }

        .sub-label {
            fill: #7209B7;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#7209B7" />
            </marker>
        </defs>

        <!-- Title -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="700" fill="#212529" text-anchor="middle">Nomenclature of Substituted Benzenes</text>
        <text x="400" y="65" font-family="Inter" font-size="14" font-weight="400" fill="#6c757d" text-anchor="middle">Positional Isomerism: Ortho, Meta, and Para</text>

        <!-- Legend -->
        <g transform="translate(620, 20)">
            <rect x="0" y="0" width="160" height="135" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1" filter="url(#shadow)"/>
            <text x="15" y="25" font-family="Inter" font-size="14" font-weight="700" fill="#212529">Legend</text>
            
            <circle cx="20" cy="45" r="6" fill="#404040"/>
            <text x="35" y="49" font-family="Inter" font-size="12" fill="#404040">Carbon (C)</text>
            
            <circle cx="20" cy="65" r="6" fill="#CCCCCC"/>
            <text x="35" y="69" font-family="Inter" font-size="12" fill="#404040">Hydrogen (H)</text>
            
            <circle cx="20" cy="85" r="6" fill="#44CC44"/>
            <text x="35" y="89" font-family="Inter" font-size="12" fill="#404040">Chlorine (Cl)</text>
            
            <line x1="12" y1="110" x2="28" y2="110" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arrowhead)"/>
            <text x="35" y="114" font-family="Inter" font-size="12" fill="#404040">Movement Path</text>
        </g>

        <!-- Main Molecule Group -->
        <g class="base-benzene">
            <!-- Numbering Path & Labels -->
            <circle cx="400" cy="250" r="100" stroke="#adb5bd" stroke-width="1" stroke-dasharray="4 4" fill="none" opacity="0.5"/>
            <g font-family="Inter" font-size="13" font-weight="600" fill="#6c757d" text-anchor="middle" dominant-baseline="central">
                <text x="425.8" y="153.4">1</text>
                <text x="496.6" y="224.1">2</text>
                <text x="470.7" y="320.7">3</text>
                <text x="374.1" y="346.6">4</text>
                <text x="303.4" y="275.9">5</text>
                <text x="329.3" y="179.3">6</text>
            </g>

            <!-- Benzene Ring -->
            <polygon points="400,170 469.28,210 469.28,290 400,330 330.72,290 330.72,210" fill="none" stroke="#404040" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="400" cy="250" r="55" fill="none" stroke="#404040" stroke-width="3"/>

            <!-- Carbon Vertices -->
            <circle cx="400" cy="170" r="5" fill="#404040"/>
            <circle cx="469.28" cy="210" r="5" fill="#404040"/>
            <circle cx="469.28" cy="290" r="5" fill="#404040"/>
            <circle cx="400" cy="330" r="5" fill="#404040"/>
            <circle cx="330.72" cy="290" r="5" fill="#404040"/>
            <circle cx="330.72" cy="210" r="5" fill="#404040"/>

            <!-- Static H Bonds & Atoms (Pos 5 & 6) -->
            <line x1="330.72" y1="290" x2="291.75" y2="312.5" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="281.4" cy="318.5" r="12" fill="#CCCCCC"/>
            <text x="281.4" y="318.5" class="atom-text" font-size="14">H</text>

            <line x1="330.72" y1="210" x2="291.75" y2="187.5" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="281.4" cy="181.5" r="12" fill="#CCCCCC"/>
            <text x="281.4" y="181.5" class="atom-text" font-size="14">H</text>
        </g>

        <!-- Animated H Atoms & Substituents -->
        
        <!-- Pos 1: H -> CH3 -->
        <g class="h1-group">
            <line x1="400" y1="170" x2="400" y2="125" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="400" cy="113" r="12" fill="#CCCCCC"/>
            <text x="400" y="113" class="atom-text" font-size="14">H</text>
        </g>
        <g class="ch3-group">
            <line x1="400" y1="170" x2="400" y2="125" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <text x="400" y="113" class="atom-text" font-size="20">CH<tspan baseline-shift="sub" font-size="14">3</tspan></text>
        </g>

        <!-- Pos 2: H -> Cl -->
        <g class="h2-group">
            <line x1="469.28" y1="210" x2="508.25" y2="187.5" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="518.6" cy="181.5" r="12" fill="#CCCCCC"/>
            <text x="518.6" y="181.5" class="atom-text" font-size="14">H</text>
        </g>
        <line x1="469.28" y1="210" x2="508.25" y2="187.5" class="cl-bond2" stroke="#404040" stroke-width="3" stroke-linecap="round"/>

        <!-- Pos 3: H -> Cl -->
        <g class="h3-group">
            <line x1="469.28" y1="290" x2="508.25" y2="312.5" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="518.6" cy="318.5" r="12" fill="#CCCCCC"/>
            <text x="518.6" y="318.5" class="atom-text" font-size="14">H</text>
        </g>
        <line x1="469.28" y1="290" x2="508.25" y2="312.5" class="cl-bond3" stroke="#404040" stroke-width="3" stroke-linecap="round"/>

        <!-- Pos 4: H -> Cl -->
        <g class="h4-group">
            <line x1="400" y1="330" x2="400" y2="375" stroke="#404040" stroke-width="3" stroke-linecap="round"/>
            <circle cx="400" cy="387" r="12" fill="#CCCCCC"/>
            <text x="400" y="387" class="atom-text" font-size="14">H</text>
        </g>
        <line x1="400" y1="330" x2="400" y2="375" class="cl-bond4" stroke="#404040" stroke-width="3" stroke-linecap="round"/>

        <!-- Highlight Pulses -->
        <circle cx="400" cy="170" r="15" class="pulse-1" fill="none" stroke="#FFD700" stroke-width="4"/>
        <circle cx="469.28" cy="210" r="15" class="pulse-2" fill="none" stroke="#FFD700" stroke-width="4"/>
        <circle cx="469.28" cy="290" r="15" class="pulse-3" fill="none" stroke="#FFD700" stroke-width="4"/>
        <circle cx="400" cy="330" r="15" class="pulse-4" fill="none" stroke="#FFD700" stroke-width="4"/>

        <!-- Movement Arrows -->
        <path d="M 535 195 Q 580 250 535 305" class="arrow1" fill="none" stroke="#7209B7" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <path d="M 520 335 Q 490 400 420 395" class="arrow2" fill="none" stroke="#7209B7" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>

        <!-- The Moving Chlorine Atom -->
        <g class="cl-group">
            <circle cx="0" cy="0" r="16" fill="#44CC44"/>
            <text x="0" y="0" font-family="Inter" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Cl</text>
        </g>

        <!-- Dynamic Labels Box -->
        <g transform="translate(150, 420)">
            <rect x="0" y="0" width="500" height="60" rx="10" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
            
            <text x="250" y="36" class="label-text text-benz">Benzene (C<tspan baseline-shift="sub" font-size="14">6</tspan>H<tspan baseline-shift="sub" font-size="14">6</tspan>)</text>
            
            <text x="250" y="36" class="label-text text-tol">Methylbenzene <tspan class="sub-label">(Toluene)</tspan></text>
            
            <text x="250" y="36" class="label-text text-ortho">1-chloro-2-methylbenzene <tspan class="sub-label">ortho (o-)</tspan></text>
            
            <text x="250" y="36" class="label-text text-meta">1-chloro-3-methylbenzene <tspan class="sub-label">meta (m-)</tspan></text>
            
            <text x="250" y="36" class="label-text text-para">1-chloro-4-methylbenzene <tspan class="sub-label">para (p-)</tspan></text>
        </g>
    </svg>
</body>
</html>
