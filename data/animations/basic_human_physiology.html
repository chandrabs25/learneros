<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolution of Physiology: Harvey vs. Hippocrates</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-size: 16px; font-weight: 600; fill: #34495E; text-anchor: middle; }
        .label { font-size: 12px; font-weight: 600; fill: #7F8C8D; }
        .footer-note { font-size: 13px; font-weight: 400; fill: #95a5a6; text-anchor: middle; }
        .thermo-text { font-family: 'Roboto Mono', monospace; font-size: 11px; font-weight: 500; fill: #E74C3C; text-anchor: middle; }
        
        /* Phase 1 Animations (0s - 4s) */
        .humor {
            transform-box: fill-box;
            transform-origin: center;
            animation: pulseHumor 12s infinite;
        }
        @keyframes pulseHumor {
            0%, 15%, 33% { transform: scale(1); }
            7%, 22% { transform: scale(1.15); }
            34%, 100% { transform: scale(1); }
        }

        .fever-text {
            font-size: 12px; font-weight: 700; fill: #E74C3C; text-anchor: middle;
            animation: feverAnim 12s infinite;
        }
        @keyframes feverAnim {
            0%, 5% { opacity: 0; transform: translateY(5px); }
            10%, 33% { opacity: 1; transform: translateY(0); }
            35%, 100% { opacity: 0; }
        }

        /* Phase 2 Animations (4s - 7s) */
        .thermometer-group {
            animation: thermoAnim 12s infinite;
        }
        @keyframes thermoAnim {
            0%, 30% { opacity: 0; transform: translateX(-20px); }
            35%, 55% { opacity: 1; transform: translateX(0); }
            60%, 100% { opacity: 0; transform: translateX(-10px); }
        }

        .mercury {
            stroke-dasharray: 35;
            stroke-dashoffset: 35;
            animation: mercuryAnim 12s infinite;
        }
        @keyframes mercuryAnim {
            0%, 36% { stroke-dashoffset: 35; }
            44%, 58% { stroke-dashoffset: 0; }
            60%, 100% { stroke-dashoffset: 35; }
        }

        .thermo-label {
            animation: thermoLabelAnim 12s infinite;
        }
        @keyframes thermoLabelAnim {
            0%, 43% { opacity: 0; }
            46%, 58% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }

        .red-x {
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: redXAnim 12s infinite;
        }
        @keyframes redXAnim {
            0%, 48% { stroke-dashoffset: 60; }
            52%, 58% { stroke-dashoffset: 0; }
            60%, 100% { stroke-dashoffset: 60; }
        }

        .disproved-text {
            animation: disprovedAnim 12s infinite;
        }
        @keyframes disprovedAnim {
            0%, 50% { opacity: 0; transform: scale(0.8); }
            53%, 58% { opacity: 1; transform: scale(1); }
            60%, 100% { opacity: 0; }
        }

        /* Phase 3 Animations (7s - 12s) */
        .right-silhouette {
            animation: rightSideAnim 12s infinite;
        }
        @keyframes rightSideAnim {
            0%, 55% { opacity: 0.15; filter: grayscale(100%); }
            60%, 95% { opacity: 1; filter: grayscale(0%); }
            100% { opacity: 0.15; filter: grayscale(100%); }
        }

        .heart-beat {
            transform-box: fill-box;
            transform-origin: center;
            animation: heartAnim 12s infinite;
        }
        @keyframes heartAnim {
            0%, 57% { transform: scale(1); }
            59%, 65%, 71%, 77%, 83%, 89%, 95% { transform: scale(1.15); }
            62%, 68%, 74%, 80%, 86%, 92% { transform: scale(1); }
            98%, 100% { transform: scale(1); }
        }

        .flow-dash {
            stroke-dasharray: 6, 14;
            animation: dashFlow 1s linear infinite, flowOpacity 12s infinite;
        }
        @keyframes dashFlow {
            from { stroke-dashoffset: 20; }
            to { stroke-dashoffset: 0; }
        }
        @keyframes flowOpacity {
            0%, 58% { opacity: 0; }
            60%, 95% { opacity: 0.9; }
            100% { opacity: 0; }
        }

        /* Subtle glow for active blood flow */
        .glow {
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.8));
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">The Shift in Physiological Paradigm: From Good Humor to Blood Circulation</title>
        <desc id="svg-desc">An animated comparison showing the ancient Good Humor hypothesis being disproved by thermometry, leading to Harvey's discovery of the closed-loop circulatory system.</desc>

        <!-- Definitions for reusable elements -->
        <defs>
            <!-- Human Body Outline -->
            <path id="body-outline" d="M 200 60 C 215 60 220 75 220 90 C 220 100 215 105 215 110 C 235 115 245 125 245 150 L 245 220 C 245 230 235 230 235 220 L 230 160 L 230 240 L 215 380 C 215 390 205 390 205 380 L 205 250 L 195 250 L 195 380 C 195 390 185 390 185 380 L 170 240 L 170 160 L 165 220 C 165 230 155 230 155 220 L 155 150 C 155 125 165 115 185 110 C 185 105 180 100 180 90 C 180 75 185 60 200 60 Z" fill="#f4f6f7" stroke="#bdc3c7" stroke-width="2" stroke-linejoin="round"/>
            
            <!-- Circulation Paths (Drawn in direction of blood flow) -->
            <!-- Arteries (Away from heart) -->
            <path id="art-head" d="M 602 135 L 602 80"/>
            <path id="art-l-arm" d="M 602 135 L 570 135 L 570 210"/>
            <path id="art-r-arm" d="M 602 135 L 630 135 L 630 210"/>
            <path id="art-l-leg" d="M 602 135 L 602 240 L 590 370"/>
            <path id="art-r-leg" d="M 602 135 L 602 240 L 610 370"/>
            
            <!-- Veins (Toward heart) -->
            <path id="vein-head" d="M 598 80 L 598 135"/>
            <path id="vein-l-arm" d="M 565 210 L 565 140 L 598 140"/>
            <path id="vein-r-arm" d="M 635 210 L 635 140 L 598 140"/>
            <path id="vein-l-leg" d="M 585 370 L 598 240 L 598 135"/>
            <path id="vein-r-leg" d="M 615 370 L 598 240 L 598 135"/>
        </defs>

        <!-- Background Elements -->
        <line x1="400" y1="80" x2="400" y2="420" stroke="#ecf0f1" stroke-width="2" stroke-dasharray="8,8"/>
        
        <!-- Header -->
        <text x="400" y="40" class="title">Evolution of Physiology: Harvey vs. Hippocrates</text>
        
        <!-- ========================================== -->
        <!-- LEFT SIDE: Good Humor Hypothesis           -->
        <!-- ========================================== -->
        <g id="left-side">
            <use href="#body-outline" x="0" y="0"/>
            <text x="200" y="440" class="subtitle">Ancient "Good Humor" Hypothesis</text>
            
            <!-- The Four Humors -->
            <g class="humors-group">
                <!-- Blood -->
                <circle cx="215" cy="140" r="14" fill="#E74C3C" class="humor"/>
                <text x="235" y="144" class="label">Blood</text>
                
                <!-- Phlegm -->
                <circle cx="185" cy="140" r="14" fill="#BDC3C7" class="humor"/>
                <text x="165" y="144" class="label" text-anchor="end">Phlegm</text>
                
                <!-- Yellow Bile -->
                <circle cx="215" cy="180" r="14" fill="#F1C40F" class="humor"/>
                <text x="235" y="184" class="label">Yellow Bile</text>
                
                <!-- Black Bile -->
                <circle cx="185" cy="180" r="14" fill="#2C3E50" class="humor"/>
                <text x="165" y="184" class="label" text-anchor="end">Black Bile</text>
            </g>

            <!-- Fever Highlight (Phase 1) -->
            <text x="185" y="155" class="fever-text">Fever?</text>

            <!-- Harvey Intervention: Thermometer (Phase 2) -->
            <g class="thermometer-group">
                <!-- Glass Tube -->
                <rect x="87" y="140" width="6" height="40" rx="3" fill="#ecf0f1" stroke="#95a5a6" stroke-width="1"/>
                <!-- Bulb -->
                <circle cx="90" cy="180" r="6" fill="#E74C3C"/>
                <!-- Mercury Line -->
                <line x1="90" y1="180" x2="90" y2="145" stroke="#E74C3C" stroke-width="2" stroke-linecap="round" class="mercury"/>
                <!-- Measurement Marks -->
                <line x1="93" y1="150" x2="96" y2="150" stroke="#95a5a6" stroke-width="1"/>
                <line x1="93" y1="160" x2="96" y2="160" stroke="#95a5a6" stroke-width="1"/>
                <line x1="93" y1="170" x2="96" y2="170" stroke="#95a5a6" stroke-width="1"/>
                
                <!-- Readout -->
                <text x="90" y="200" class="thermo-text thermo-label">37°C / Normal</text>
            </g>

            <!-- Disproved Marker (Phase 2) -->
            <g>
                <path d="M 175 170 L 195 190 M 195 170 L 175 190" stroke="#E74C3C" stroke-width="4" stroke-linecap="round" class="red-x"/>
                <text x="185" y="205" class="disproved-text" fill="#E74C3C" font-size="10" font-weight="700" text-anchor="middle">DISPROVED</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: Harvey's Circulation           -->
        <!-- ========================================== -->
        <g id="right-side" class="right-silhouette">
            <use href="#body-outline" x="400" y="0"/>
            <text x="600" y="440" class="subtitle">Harvey’s Circulatory Discovery</text>

            <!-- Anatomical Labels -->
            <text x="645" y="160" class="label" fill="#E74C3C">Arteries</text>
            <text x="555" y="160" class="label" fill="#3498DB" text-anchor="end">Veins</text>

            <!-- Capillary Beds (Purple mesh connecting arteries and veins) -->
            <g stroke="#9b59b6" stroke-width="1.5" fill="none" stroke-linecap="round">
                <!-- Head -->
                <path d="M 602 80 C 602 72, 598 72, 598 80 M 602 80 C 602 88, 598 88, 598 80"/>
                <!-- Left Arm -->
                <path d="M 570 210 C 570 218, 565 218, 565 210 M 570 210 C 570 202, 565 202, 565 210"/>
                <!-- Right Arm -->
                <path d="M 630 210 C 630 218, 635 218, 635 210 M 630 210 C 630 202, 635 202, 635 210"/>
                <!-- Left Leg -->
                <path d="M 590 370 C 590 378, 585 378, 585 370 M 590 370 C 590 362, 585 362, 585 370"/>
                <!-- Right Leg -->
                <path d="M 610 370 C 610 378, 615 378, 615 370 M 610 370 C 610 362, 615 362, 615 370"/>
            </g>

            <!-- Solid Base Vessels -->
            <g stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <!-- Arteries Base -->
                <g stroke="#E74C3C">
                    <use href="#art-head"/>
                    <use href="#art-l-arm"/>
                    <use href="#art-r-arm"/>
                    <use href="#art-l-leg"/>
                    <use href="#art-r-leg"/>
                </g>
                <!-- Veins Base -->
                <g stroke="#3498DB">
                    <use href="#vein-head"/>
                    <use href="#vein-l-arm"/>
                    <use href="#vein-r-arm"/>
                    <use href="#vein-l-leg"/>
                    <use href="#vein-r-leg"/>
                </g>
            </g>

            <!-- Animated Blood Flow (Dashed lines moving along paths) -->
            <g class="glow" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-linecap="round">
                <use href="#art-head" class="flow-dash"/>
                <use href="#art-l-arm" class="flow-dash"/>
                <use href="#art-r-arm" class="flow-dash"/>
                <use href="#art-l-leg" class="flow-dash"/>
                <use href="#art-r-leg" class="flow-dash"/>
                
                <use href="#vein-head" class="flow-dash"/>
                <use href="#vein-l-arm" class="flow-dash"/>
                <use href="#vein-r-arm" class="flow-dash"/>
                <use href="#vein-l-leg" class="flow-dash"/>
                <use href="#vein-r-leg" class="flow-dash"/>
            </g>

            <!-- The Heart (Central Pump) -->
            <path d="M 604 135 C 604 132, 600 128, 595 133 C 590 138, 595 148, 604 153 C 613 148, 618 138, 613 133 C 608 128, 604 132, 604 135 Z" fill="#E74C3C" stroke="#c0392b" stroke-width="1" class="heart-beat"/>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND & FOOTER                            -->
        <!-- ========================================== -->
        <g transform="translate(320, 390)">
            <rect x="0" y="0" width="160" height="24" rx="12" fill="#ffffff" stroke="#ecf0f1"/>
            <circle cx="15" cy="12" r="4" fill="#E74C3C"/>
            <text x="25" y="16" class="label" font-size="10">Arterial</text>
            
            <circle cx="85" cy="12" r="4" fill="#3498DB"/>
            <text x="95" y="16" class="label" font-size="10">Venous</text>
        </g>

        <text x="400" y="480" class="footer-note">Experimental Method: Thermometry disproved the Black Bile-Fever link, paving the way for circulatory mechanics.</text>

    </svg>
</div>

</body>
</html>
