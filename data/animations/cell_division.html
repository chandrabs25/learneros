<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanisms of Aneuploidy: Nondisjunction</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 {
            color: #2C3E50;
            margin-top: 30px;
            margin-bottom: 10px;
            font-size: 28px;
            text-align: center;
            font-weight: 700;
        }

        .subtitle {
            color: #4A90D9;
            margin-bottom: 30px;
            font-size: 16px;
            text-align: center;
            font-weight: 600;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(44, 62, 80, 0.1);
            overflow: hidden;
            position: relative;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- CSS Animations --- */
        :root {
            --anim-duration: 12s;
        }

        /* Cell Membrane Cytokinesis */
        @keyframes cellPinch {
            0%, 58% { d: path('M 400,50 C 550,50 550,150 550,250 C 550,350 550,450 400,450 C 250,450 250,350 250,250 C 250,150 250,50 400,50 Z'); }
            83%, 95% { d: path('M 400,50 C 550,50 430,230 400,245 C 430,260 550,450 400,450 C 250,450 370,260 400,245 C 370,230 250,50 400,50 Z'); }
            100% { d: path('M 400,50 C 550,50 550,150 550,250 C 550,350 550,450 400,450 C 250,450 250,350 250,250 C 250,150 250,50 400,50 Z'); }
        }
        .cell-membrane {
            animation: cellPinch var(--anim-duration) infinite ease-in-out;
        }

        /* Chromosome Movements */
        @keyframes moveLeftTop {
            0%, 25% { transform: translate(350px, 250px); }
            58%, 95% { transform: translate(350px, 120px); }
            100% { transform: translate(350px, 250px); }
        }
        @keyframes moveLeftBottom {
            0%, 25% { transform: translate(350px, 250px); }
            58%, 95% { transform: translate(350px, 380px); }
            100% { transform: translate(350px, 250px); }
        }
        @keyframes moveRightAbnormal {
            0%, 25% { transform: translate(450px, 250px); }
            58%, 95% { transform: translate(450px, 120px); }
            100% { transform: translate(450px, 250px); }
        }
        .chrom-left-top { animation: moveLeftTop var(--anim-duration) infinite ease-in-out; }
        .chrom-left-bottom { animation: moveLeftBottom var(--anim-duration) infinite ease-in-out; }
        .chrom-right { animation: moveRightAbnormal var(--anim-duration) infinite ease-in-out; }

        /* Spindle Fibers Morphing */
        @keyframes spindleTopLeft {
            0%, 25% { d: path('M 400,75 L 350,250'); }
            58%, 95% { d: path('M 400,75 L 350,120'); }
            100% { d: path('M 400,75 L 350,250'); }
        }
        @keyframes spindleBottomLeft {
            0%, 25% { d: path('M 400,425 L 350,250'); }
            58%, 95% { d: path('M 400,425 L 350,380'); }
            100% { d: path('M 400,425 L 350,250'); }
        }
        @keyframes spindleTopRight {
            0%, 25% { d: path('M 400,75 L 450,250'); }
            58%, 95% { d: path('M 400,75 L 450,120'); }
            100% { d: path('M 400,75 L 450,250'); }
        }
        @keyframes spindleBottomRight {
            0%, 25% { d: path('M 400,425 L 450,250'); opacity: 1; stroke-dasharray: 5,3; }
            26% { d: path('M 400,425 L 440,280'); opacity: 0.8; stroke-dasharray: 2,6; }
            30%, 95% { d: path('M 400,425 L 400,425'); opacity: 0; }
            100% { d: path('M 400,425 L 450,250'); opacity: 1; stroke-dasharray: 5,3; }
        }
        .spindle-tl { animation: spindleTopLeft var(--anim-duration) infinite ease-in-out; }
        .spindle-bl { animation: spindleBottomLeft var(--anim-duration) infinite ease-in-out; }
        .spindle-tr { animation: spindleTopRight var(--anim-duration) infinite ease-in-out; }
        .spindle-br { animation: spindleBottomRight var(--anim-duration) infinite ease-in-out; }

        /* Nucleus Reforming */
        @keyframes nucleusFade {
            0%, 65% { opacity: 0; transform: scale(0.8); }
            75%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }
        .nucleus-envelope { animation: nucleusFade var(--anim-duration) infinite ease-in-out; transform-origin: center; }
        .nucleus-top { transform-origin: 400px 120px; }
        .nucleus-bottom { transform-origin: 400px 380px; }

        /* Labels & Annotations */
        @keyframes stageMeta { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes stageAna { 0%, 24% { opacity: 0; } 25%, 57% { opacity: 1; } 58%, 100% { opacity: 0; } }
        @keyframes stageTelo { 0%, 57% { opacity: 0; } 58%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
        .stage-meta { animation: stageMeta var(--anim-duration) infinite; }
        .stage-ana { animation: stageAna var(--anim-duration) infinite; }
        .stage-telo { animation: stageTelo var(--anim-duration) infinite; }

        @keyframes pointerFade { 0%, 24% { opacity: 1; } 25%, 100% { opacity: 0; } }
        .pointers { animation: pointerFade var(--anim-duration) infinite; }

        @keyframes warningMove {
            0%, 24% { opacity: 0; transform: translate(470px, 250px); }
            25%, 30% { opacity: 1; transform: translate(470px, 250px); }
            50%, 58% { opacity: 1; transform: translate(470px, 120px); }
            59%, 100% { opacity: 0; transform: translate(470px, 120px); }
        }
        .warning-label { animation: warningMove var(--anim-duration) infinite ease-in-out; }

        @keyframes ploidyFade {
            0%, 70% { opacity: 0; transform: translateY(10px); }
            80%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(0); }
        }
        .ploidy-label { animation: ploidyFade var(--anim-duration) infinite ease-out; }

        /* Global Reset Overlay */
        @keyframes resetFade {
            0%, 92% { opacity: 0; }
            96%, 100% { opacity: 1; }
        }
        .reset-overlay { animation: resetFade var(--anim-duration) infinite; }

    </style>
</head>
<body>

    <h1>Chromosomal Disorder: Nondisjunction</h1>
    <div class="subtitle">Failure of sister chromatids to separate during Anaphase</div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" aria-label="Animated diagram showing chromosomal nondisjunction during cell division">
            <title>Mechanisms of Aneuploidy: Nondisjunction</title>
            <desc>An animation showing a cell undergoing division where one pair of chromosomes fails to separate, resulting in aneuploid daughter cells (n+1 and n-1).</desc>

            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
                </marker>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Background -->
            <rect width="800" height="500" fill="#ffffff" />

            <!-- Cell Membrane & Cytoplasm -->
            <path class="cell-membrane" fill="#E8F4FD" stroke="#4A90D9" stroke-width="4" stroke-linejoin="round" />

            <!-- Reforming Nuclei (Telophase) -->
            <circle class="nucleus-envelope nucleus-top" cx="400" cy="120" r="65" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6,4" fill="#f8f9fa" fill-opacity="0.5" />
            <circle class="nucleus-envelope nucleus-bottom" cx="400" cy="380" r="65" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6,4" fill="#f8f9fa" fill-opacity="0.5" />

            <!-- Centrioles -->
            <g class="centriole-top" stroke="#2C3E50" stroke-width="5" stroke-linecap="round">
                <line x1="388" y1="60" x2="412" y2="60" />
                <line x1="400" y1="60" x2="400" y2="75" />
            </g>
            <g class="centriole-bottom" stroke="#2C3E50" stroke-width="5" stroke-linecap="round">
                <line x1="388" y1="440" x2="412" y2="440" />
                <line x1="400" y1="440" x2="400" y2="425" />
            </g>

            <!-- Spindle Fibers -->
            <path class="spindle-tl" stroke="#98D8C8" stroke-width="2" stroke-dasharray="5,3" fill="none" />
            <path class="spindle-bl" stroke="#98D8C8" stroke-width="2" stroke-dasharray="5,3" fill="none" />
            <path class="spindle-tr" stroke="#98D8C8" stroke-width="2" stroke-dasharray="5,3" fill="none" />
            <path class="spindle-br" stroke="#98D8C8" stroke-width="2" stroke-dasharray="5,3" fill="none" />

            <!-- Chromosomes -->
            <!-- Left Pair (Normal Segregation) -->
            <g class="chrom-left-top" filter="url(#glow)">
                <path d="M -14,20 Q 0,6 0,0 Q 0,6 14,20" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="0" cy="0" r="3.5" fill="#2C3E50" />
            </g>
            <g class="chrom-left-bottom" filter="url(#glow)">
                <path d="M -14,-20 Q 0,-6 0,0 Q 0,-6 14,-20" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="0" cy="0" r="3.5" fill="#2C3E50" />
            </g>

            <!-- Right Pair (Nondisjunction - Failure to separate) -->
            <g class="chrom-right" filter="url(#glow)">
                <path d="M -14,20 Q 0,6 0,0 Q 0,6 14,20" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M -14,-20 Q 0,-6 0,0 Q 0,-6 14,-20" fill="none" stroke="#FF6B6B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="0" cy="0" r="3.5" fill="#2C3E50" />
            </g>

            <!-- Dynamic Stage Labels -->
            <g transform="translate(30, 40)">
                <rect width="210" height="36" rx="6" fill="#2C3E50" />
                <text class="stage-meta" x="105" y="23" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Stage: Metaphase</text>
                <text class="stage-ana" x="105" y="23" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Stage: Anaphase</text>
                <text class="stage-telo" x="105" y="23" fill="#ffffff" font-size="15" font-weight="600" text-anchor="middle">Stage: Cytokinesis</text>
            </g>

            <!-- Structure Pointers (Visible only in Metaphase) -->
            <g class="pointers">
                <!-- Spindle Fiber Pointer -->
                <line x1="120" y1="160" x2="365" y2="160" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
                <text x="120" y="150" fill="#2C3E50" font-size="13" font-weight="600">Spindle Fibers</text>
                
                <!-- Centromere Pointer -->
                <line x1="120" y1="250" x2="330" y2="250" stroke="#2C3E50" stroke-width="1.5" marker-end="url(#arrow)" />
                <text x="120" y="240" fill="#2C3E50" font-size="13" font-weight="600">Centromere</text>
                <text x="120" y="265" fill="#7f8c8d" font-size="11">(Kinetochore attachment)</text>
            </g>

            <!-- Nondisjunction Warning Label -->
            <g class="warning-label">
                <rect x="0" y="-35" width="130" height="24" rx="4" fill="#E74C3C" opacity="0.1" />
                <text x="10" y="-18" fill="#E74C3C" font-size="13" font-weight="700">Nondisjunction!</text>
                <path d="M -5,0 L -25,0" stroke="#E74C3C" stroke-width="2" stroke-dasharray="2,2" />
            </g>

            <!-- Ploidy Result Labels (Visible in Telophase) -->
            <g class="ploidy-label" transform="translate(580, 100)">
                <rect width="190" height="46" rx="6" fill="#ffffff" stroke="#E74C3C" stroke-width="2" />
                <text x="95" y="20" fill="#E74C3C" font-family="'Roboto Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">n + 1</text>
                <text x="95" y="38" fill="#E74C3C" font-size="12" font-weight="600" text-anchor="middle">Trisomic / Aneuploidy</text>
            </g>

            <g class="ploidy-label" transform="translate(580, 360)">
                <rect width="190" height="46" rx="6" fill="#ffffff" stroke="#3498DB" stroke-width="2" />
                <text x="95" y="20" fill="#3498DB" font-family="'Roboto Mono', monospace" font-size="15" font-weight="600" text-anchor="middle">n - 1</text>
                <text x="95" y="38" fill="#3498DB" font-size="12" font-weight="600" text-anchor="middle">Monosomic / Aneuploidy</text>
            </g>

            <!-- Legend -->
            <g transform="translate(20, 390)">
                <rect width="160" height="90" rx="6" fill="#ffffff" stroke="#e9ecef" stroke-width="2" />
                <text x="80" y="20" fill="#2C3E50" font-size="12" font-weight="700" text-anchor="middle">Legend</text>
                
                <line x1="15" y1="40" x2="35" y2="40" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" />
                <text x="45" y="44" fill="#2C3E50" font-size="12">Chromatid / DNA</text>
                
                <line x1="15" y1="60" x2="35" y2="60" stroke="#98D8C8" stroke-width="2" stroke-dasharray="4,2" />
                <text x="45" y="64" fill="#2C3E50" font-size="12">Spindle Fiber</text>
                
                <circle cx="25" cy="80" r="4" fill="#2C3E50" />
                <text x="45" y="84" fill="#2C3E50" font-size="12">Centromere</text>
            </g>

            <!-- Reset Overlay (Fades in at the end to hide the snap back to start) -->
            <rect class="reset-overlay" width="800" height="500" fill="#ffffff" pointer-events="none" />
        </svg>
    </div>

</body>
</html>
