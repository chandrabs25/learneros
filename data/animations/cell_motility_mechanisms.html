<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Motility: Cilia & Flagella</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2C3E50;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #2C3E50;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .subtitle {
            color: #7F8C8D;
            margin-bottom: 25px;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
        }
        .svg-container {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            overflow: hidden;
            width: 100%;
            position: relative;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        
        /* Animations */
        @keyframes pulse-dynein {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(8deg); }
        }
        .dynein-arms {
            transform-origin: 0px 0px;
            transform-box: fill-box;
            animation: pulse-dynein 1s ease-in-out infinite;
        }

        @keyframes rotate-ring {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(2deg); }
        }
        .axoneme-ring {
            transform-origin: 220px 270px;
            animation: rotate-ring 2s ease-in-out infinite;
        }

        @keyframes cilium-beat {
            0%   { d: path('M 520 380 C 550 330, 570 310, 590 280'); }
            40%  { d: path('M 520 380 C 490 330, 470 310, 450 280'); }
            60%  { d: path('M 520 380 C 560 390, 580 350, 530 320'); }
            80%  { d: path('M 520 380 C 570 350, 590 320, 570 290'); }
            100% { d: path('M 520 380 C 550 330, 570 310, 590 280'); }
        }
        .cilium-path {
            animation: cilium-beat 2s linear infinite;
        }

        @keyframes flagellum-wave {
            0%   { d: path('M 700 380 C 740 350, 740 310, 700 280 C 660 250, 660 210, 700 180 C 740 150, 740 110, 700 80'); }
            25%  { d: path('M 700 380 C 680 360, 660 330, 660 295 C 660 245, 740 245, 740 195 C 740 145, 660 145, 660 95'); }
            50%  { d: path('M 700 380 C 660 350, 660 310, 700 280 C 740 250, 740 210, 700 180 C 660 150, 660 110, 700 80'); }
            75%  { d: path('M 700 380 C 720 360, 740 330, 740 295 C 740 245, 660 245, 660 195 C 660 145, 740 145, 740 95'); }
            100% { d: path('M 700 380 C 740 350, 740 310, 700 280 C 660 250, 660 210, 700 180 C 740 150, 740 110, 700 80'); }
        }
        .flagellum-path {
            animation: flagellum-wave 1.5s linear infinite;
        }

        @keyframes fade-power {
            0%, 35% { opacity: 1; transform: translateY(0); }
            40%, 100% { opacity: 0; transform: translateY(-5px); }
        }
        .power-label {
            animation: fade-power 2s infinite;
        }

        @keyframes fade-recovery {
            0%, 45% { opacity: 0; transform: translateY(5px); }
            50%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; }
        }
        .recovery-label {
            animation: fade-recovery 2s infinite;
        }

        .leader-line {
            fill: none;
            stroke: #BDC3C7;
            stroke-width: 1.5;
            stroke-linejoin: round;
        }
        .label-text {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            fill: #2C3E50;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Cell Motility: Axoneme Structure & Movement</h1>
    <p class="subtitle">The 9+2 Microtubule Arrangement in Cilia and Flagella</p>
    
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing the cross-section of an axoneme and the movement of cilia and flagella">
            <title>Axoneme Structure and Motility</title>
            <desc>Left: Cross-section of the 9+2 axoneme structure showing peripheral doublets, central microtubules, and dynein arms. Right: Longitudinal view showing the oar-like beat of a cilium and the whip-like undulation of a flagellum.</desc>

            <defs>
                <!-- Microtubule Doublet Definition -->
                <g id="doublet">
                    <!-- Sub-tubule A (Complete) -->
                    <circle cx="0" cy="0" r="12" fill="#E8F4FD" stroke="#98D8C8" stroke-width="3"/>
                    <!-- Sub-tubule B (Incomplete, attached to A) -->
                    <path d="M -8 -9 A 12 12 0 1 0 -8 9" fill="none" stroke="#98D8C8" stroke-width="3"/>
                    
                    <!-- Dynein Arms -->
                    <g class="dynein-arms">
                        <!-- Outer Arm -->
                        <path d="M 6 -10 Q 25 -25 45 -5" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
                        <!-- Inner Arm -->
                        <path d="M 10 4 Q 25 -5 40 12" fill="none" stroke="#F39C12" stroke-width="3" stroke-linecap="round"/>
                    </g>
                    
                    <!-- Radial Spoke -->
                    <line x1="0" y1="12" x2="0" y2="80" stroke="#98D8C8" stroke-width="2" opacity="0.6"/>
                </g>

                <!-- Basal Body Pattern -->
                <g id="basal-body">
                    <rect x="-10" y="0" width="20" height="30" fill="#2C3E50" rx="2"/>
                    <line x1="-5" y1="5" x2="-5" y2="25" stroke="#E8F4FD" stroke-width="1" opacity="0.4"/>
                    <line x1="0" y1="5" x2="0" y2="25" stroke="#E8F4FD" stroke-width="1" opacity="0.4"/>
                    <line x1="5" y1="5" x2="5" y2="25" stroke="#E8F4FD" stroke-width="1" opacity="0.4"/>
                </g>
            </defs>

            <!-- ========================================== -->
            <!-- LEFT SIDE: AXONEME CROSS-SECTION (9+2)     -->
            <!-- ========================================== -->
            
            <!-- Plasma Membrane -->
            <circle cx="220" cy="270" r="160" stroke="#4A90D9" stroke-width="4" fill="#E8F4FD" opacity="0.3"/>
            <circle cx="220" cy="270" r="160" stroke="#4A90D9" stroke-width="4" fill="none"/>

            <g class="axoneme-ring">
                <!-- Central Sheath -->
                <circle cx="220" cy="270" r="30" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6,4" fill="#E8F4FD" opacity="0.7"/>
                
                <!-- Central Microtubules (2) -->
                <circle cx="208" cy="270" r="12" fill="#E8F4FD" stroke="#98D8C8" stroke-width="3"/>
                <circle cx="232" cy="270" r="12" fill="#E8F4FD" stroke="#98D8C8" stroke-width="3"/>
                <!-- Central Bridge -->
                <line x1="208" y1="270" x2="232" y2="270" stroke="#98D8C8" stroke-width="3"/>

                <!-- Peripheral Doublets (9) -->
                <!-- 360 / 9 = 40 degrees spacing -->
                <use href="#doublet" transform="translate(220, 270) rotate(0) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(40) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(80) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(120) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(160) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(200) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(240) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(280) translate(0, -110)" />
                <use href="#doublet" transform="translate(220, 270) rotate(320) translate(0, -110)" />
            </g>

            <!-- Cross-Section Labels -->
            <polyline points="220,110 220,80 180,80" class="leader-line"/>
            <text x="175" y="84" class="label-text" text-anchor="end">Plasma Membrane</text>

            <polyline points="120,220 80,220" class="leader-line"/>
            <text x="75" y="224" class="label-text" text-anchor="end">Peripheral Doublets (9)</text>

            <polyline points="208,270 150,320 100,320" class="leader-line"/>
            <text x="95" y="324" class="label-text" text-anchor="end">Central Microtubules (2)</text>

            <polyline points="310,200 350,200" class="leader-line"/>
            <text x="355" y="204" class="label-text" text-anchor="start">Dynein Arms</text>

            <polyline points="260,310 320,350 360,350" class="leader-line"/>
            <text x="365" y="354" class="label-text" text-anchor="start">Radial Spoke</text>

            <polyline points="245,285 280,320 320,320" class="leader-line"/>
            <text x="325" y="324" class="label-text" text-anchor="start">Central Sheath</text>

            <!-- Section Title -->
            <text x="220" y="40" font-family="Inter" font-weight="600" font-size="16" fill="#2C3E50" text-anchor="middle">Cross-Sectional View</text>


            <!-- ========================================== -->
            <!-- DIVIDER LINE                               -->
            <!-- ========================================== -->
            <line x1="420" y1="60" x2="420" y2="460" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5,5" opacity="0.5"/>


            <!-- ========================================== -->
            <!-- RIGHT SIDE: FUNCTIONAL MOVEMENT            -->
            <!-- ========================================== -->

            <!-- Section Title -->
            <text x="610" y="40" font-family="Inter" font-weight="600" font-size="16" fill="#2C3E50" text-anchor="middle">Functional Movement View</text>

            <!-- Cell Surface Line -->
            <path d="M 450 380 L 770 380" stroke="#4A90D9" stroke-width="4" fill="none" stroke-linecap="round"/>
            <path d="M 450 380 Q 610 420 770 380" fill="#E8F4FD" opacity="0.3"/>

            <!-- Cilium Model -->
            <g transform="translate(520, 380)">
                <use href="#basal-body" />
            </g>
            <!-- Animated Cilium Path -->
            <path class="cilium-path" fill="none" stroke="#4A90D9" stroke-width="8" stroke-linecap="round"/>
            
            <!-- Cilium Labels -->
            <text x="520" y="430" font-family="Inter" font-weight="600" font-size="14" fill="#2C3E50" text-anchor="middle">Cilium</text>
            <text x="520" y="450" class="label-text" fill="#7F8C8D" text-anchor="middle">Oar-like motion</text>
            
            <!-- Dynamic Stroke Labels -->
            <text x="460" y="240" font-family="Inter" font-weight="700" font-size="12" fill="#E74C3C" class="power-label" text-anchor="middle">← Power Stroke</text>
            <text x="580" y="240" font-family="Inter" font-weight="700" font-size="12" fill="#3498DB" class="recovery-label" text-anchor="middle">Recovery Stroke →</text>


            <!-- Flagellum Model -->
            <g transform="translate(700, 380)">
                <use href="#basal-body" />
            </g>
            <!-- Animated Flagellum Path -->
            <path class="flagellum-path" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round"/>

            <!-- Flagellum Labels -->
            <text x="700" y="430" font-family="Inter" font-weight="600" font-size="14" fill="#2C3E50" text-anchor="middle">Flagellum</text>
            <text x="700" y="450" class="label-text" fill="#7F8C8D" text-anchor="middle">Whip-like undulation</text>

            <!-- Wave Direction Arrows -->
            <g opacity="0.6">
                <path d="M 760 320 L 760 280 L 755 285 M 760 280 L 765 285" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M 760 220 L 760 180 L 755 185 M 760 180 L 765 185" stroke="#2C3E50" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="770" y="255" class="label-text" fill="#2C3E50" font-size="10" transform="rotate(-90, 770, 255)">Wave Propagation</text>
            </g>


            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g transform="translate(20, 430)">
                <rect x="0" y="0" width="12" height="12" fill="#98D8C8" rx="2"/>
                <text x="20" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Microtubules (Proteins)</text>
                
                <rect x="0" y="20" width="12" height="12" fill="#F39C12" rx="2"/>
                <text x="20" y="30" font-family="Inter" font-size="11" fill="#2C3E50">Dynein Motor Arms</text>
                
                <rect x="0" y="40" width="12" height="12" fill="#4A90D9" rx="2"/>
                <text x="20" y="50" font-family="Inter" font-size="11" fill="#2C3E50">Plasma Membrane</text>
            </g>

        </svg>
    </div>
</div>

</body>
</html>
