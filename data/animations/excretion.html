<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secondary Organs of Excretion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        text {
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        .mono {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Animations */
        @keyframes co2-left {
            0% { transform: translate(70px, 350px); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(110px, 330px); }
            80% { transform: translate(140px, 180px); opacity: 1; }
            100% { transform: translate(150px, 140px); opacity: 0; }
        }
        @keyframes co2-center {
            0% { transform: translate(100px, 380px); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(166px, 280px); }
            80% { transform: translate(166px, 180px); opacity: 1; }
            100% { transform: translate(166px, 140px); opacity: 0; }
        }
        @keyframes co2-right {
            0% { transform: translate(150px, 390px); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(222px, 330px); }
            80% { transform: translate(190px, 180px); opacity: 1; }
            100% { transform: translate(180px, 140px); opacity: 0; }
        }

        @keyframes bile-left {
            0% { transform: translate(460px, 260px); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(510px, 320px); }
            80% { transform: translate(510px, 460px); opacity: 1; }
            100% { transform: translate(510px, 490px); opacity: 0; }
        }
        @keyframes bile-right {
            0% { transform: translate(580px, 260px); opacity: 0; }
            10% { opacity: 1; }
            30% { transform: translate(510px, 320px); }
            80% { transform: translate(510px, 460px); opacity: 1; }
            100% { transform: translate(510px, 490px); opacity: 0; }
        }

        @keyframes sweat-anim {
            0% { transform: translate(880px, 430px); opacity: 0; }
            10% { opacity: 1; }
            70% { transform: translate(880px, 180px); opacity: 1; }
            90% { transform: translate(880px, 150px) scale(1.5); opacity: 0; }
            100% { opacity: 0; }
        }
        @keyframes sebum-anim {
            0% { transform: translate(780px, 260px); opacity: 0; }
            10% { opacity: 1; }
            40% { transform: translate(765px, 230px); }
            70% { transform: translate(780px, 180px); opacity: 1; }
            90% { transform: translate(785px, 150px) scale(1.5); opacity: 0; }
            100% { opacity: 0; }
        }

        /* Apply Animations */
        .co2-l { animation: co2-left 3s ease-in-out infinite; }
        .co2-c { animation: co2-center 3s ease-in-out infinite; }
        .co2-r { animation: co2-right 3s ease-in-out infinite; }
        
        .bile-l { animation: bile-left 5s linear infinite; }
        .bile-r { animation: bile-right 5s linear infinite; }
        
        .sweat { animation: sweat-anim 4s ease-in infinite; }
        .sebum { animation: sebum-anim 6s ease-in infinite; }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <title>Secondary Organs of Excretion: Beyond the Kidneys</title>
        <desc>An animated diagram showing the excretory functions of the lungs (CO2 diffusion), liver (bile pigment excretion), and skin (sweat and sebum secretion).</desc>

        <defs>
            <!-- Gradients -->
            <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#3498DB" />
                <stop offset="40%" stop-color="#8E44AD" />
                <stop offset="100%" stop-color="#E74C3C" />
            </linearGradient>
            
            <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FAD7A0" />
                <stop offset="100%" stop-color="#F5CBA7" />
            </linearGradient>

            <!-- Filters -->
            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="6" stdDeviation="6" flood-opacity="0.15"/>
            </filter>
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="1000" height="600" fill="#ffffff" />

        <!-- Header -->
        <text x="500" y="45" font-size="28" font-weight="700" text-anchor="middle" fill="#2C3E50">Secondary Organs of Excretion</text>
        <text x="500" y="70" font-size="14" font-weight="400" text-anchor="middle" fill="#7F8C8D">Beyond the kidneys: How the lungs, liver, and skin help maintain physiological homeostasis</text>

        <!-- Dividers -->
        <line x1="333" y1="100" x2="333" y2="520" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 6"/>
        <line x1="666" y1="100" x2="666" y2="520" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="6 6"/>

        <!-- ========================================== -->
        <!-- PANEL A: LUNGS (Pulmonary Excretion)       -->
        <!-- ========================================== -->
        <g id="panel-lungs">
            <text x="166" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#E74C3C">LUNGS (Pulmonary)</text>
            <text x="166" y="135" font-size="12" font-weight="600" text-anchor="middle" fill="#7F8C8D">Excretes: CO₂ & H₂O vapor</text>

            <!-- Alveoli -->
            <g filter="url(#shadow)">
                <circle cx="166" cy="280" r="55" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <circle cx="110" cy="340" r="50" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <circle cx="222" cy="340" r="50" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
                <!-- Inner connecting lines to make it look like a cluster -->
                <path d="M 130 305 L 166 280 L 202 305" fill="none" stroke="#4A90D9" stroke-width="3" stroke-linecap="round"/>
                <path d="M 166 280 L 166 225" fill="none" stroke="#4A90D9" stroke-width="3" stroke-linecap="round"/>
            </g>

            <!-- Capillary Network -->
            <path d="M 40 440 C 40 340, 70 250, 166 190 C 262 250, 292 340, 292 440" fill="none" stroke="url(#capGrad)" stroke-width="22" stroke-linecap="round" filter="url(#shadow)"/>
            
            <!-- Blood Flow Arrows -->
            <polygon points="35,380 45,360 55,380" fill="#ffffff" opacity="0.8"/>
            <polygon points="277,360 287,380 297,360" fill="#ffffff" opacity="0.8"/>

            <!-- CO2 Molecules (Animated) -->
            <g>
                <circle class="co2-l" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 0s;"/>
                <circle class="co2-c" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 0.4s;"/>
                <circle class="co2-r" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 0.8s;"/>
                <circle class="co2-l" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 1.2s;"/>
                <circle class="co2-c" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 1.6s;"/>
                <circle class="co2-r" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 2.0s;"/>
                <circle class="co2-l" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 2.4s;"/>
                <circle class="co2-c" r="5" fill="#7F8C8D" stroke="#ffffff" stroke-width="1.5" style="animation-delay: 2.8s;"/>
            </g>

            <!-- Labels -->
            <text x="166" y="270" font-size="12" font-weight="600" text-anchor="middle" fill="#2C3E50">Alveoli</text>
            <text x="166" y="460" font-size="12" font-weight="600" text-anchor="middle" fill="#2C3E50">Capillary</text>
            <text x="60" y="470" font-size="11" font-weight="600" text-anchor="middle" fill="#3498DB">Venous</text>
            <text x="272" y="470" font-size="11" font-weight="600" text-anchor="middle" fill="#E74C3C">Arterial</text>
            
            <!-- Floating Formula -->
            <text x="210" y="160" class="mono" font-size="14" font-weight="700" fill="#7F8C8D">CO₂</text>
            <path d="M 190 155 Q 175 155 170 170" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="2 2"/>
        </g>


        <!-- ========================================== -->
        <!-- PANEL B: LIVER (Hepatobiliary Excretion)   -->
        <!-- ========================================== -->
        <g id="panel-liver">
            <text x="500" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#27AE60">LIVER (Hepatobiliary)</text>
            <text x="500" y="135" font-size="12" font-weight="600" text-anchor="middle" fill="#7F8C8D">Excretes: Bile pigments, Toxins, Drugs</text>

            <!-- Intestine (Duodenum) -->
            <path d="M 400 490 Q 500 530 600 490" fill="none" stroke="#E59866" stroke-width="36" stroke-linecap="round" filter="url(#shadow)"/>
            <path d="M 400 490 Q 500 530 600 490" fill="none" stroke="#FAD7A0" stroke-width="28" stroke-linecap="round"/>
            <text x="580" y="525" font-size="11" font-weight="600" text-anchor="middle" fill="#A04000">Duodenum</text>

            <!-- Liver Tissue -->
            <path d="M 420 280 C 390 190, 460 160, 530 160 C 630 160, 670 250, 640 330 C 610 410, 540 400, 500 380 C 440 350, 430 330, 420 280 Z" fill="#8B4513" stroke="#5C2E0C" stroke-width="3" filter="url(#shadow)"/>
            <!-- Liver Highlights/Lobules -->
            <path d="M 450 200 Q 510 180 580 210" fill="none" stroke="#A0522D" stroke-width="4" stroke-linecap="round"/>
            <path d="M 440 240 Q 480 230 510 260" fill="none" stroke="#A0522D" stroke-width="3" stroke-linecap="round"/>

            <!-- Bile Duct -->
            <path d="M 460 260 Q 480 300 510 320" fill="none" stroke="#27AE60" stroke-width="10" stroke-linecap="round"/>
            <path d="M 580 260 Q 540 300 510 320" fill="none" stroke="#27AE60" stroke-width="10" stroke-linecap="round"/>
            <path d="M 510 320 L 510 490" fill="none" stroke="#27AE60" stroke-width="12" stroke-linecap="round"/>
            
            <!-- Bile Pigments (Animated) -->
            <g>
                <!-- Left Branch -->
                <circle class="bile-l" r="4" fill="#F1C40F" stroke="#fff" stroke-width="1" style="animation-delay: 0s;"/>
                <circle class="bile-l" r="4" fill="#9B59B6" stroke="#fff" stroke-width="1" style="animation-delay: 1.6s;"/>
                <circle class="bile-l" r="4" fill="#F1C40F" stroke="#fff" stroke-width="1" style="animation-delay: 3.3s;"/>
                <!-- Right Branch -->
                <circle class="bile-r" r="4" fill="#9B59B6" stroke="#fff" stroke-width="1" style="animation-delay: 0.8s;"/>
                <circle class="bile-r" r="4" fill="#F1C40F" stroke="#fff" stroke-width="1" style="animation-delay: 2.5s;"/>
                <circle class="bile-r" r="4" fill="#9B59B6" stroke="#fff" stroke-width="1" style="animation-delay: 4.1s;"/>
            </g>

            <!-- Labels -->
            <text x="580" y="190" font-size="12" font-weight="600" text-anchor="middle" fill="#FAD7A0">Hepatic Tissue</text>
            <text x="440" y="380" font-size="12" font-weight="600" text-anchor="middle" fill="#27AE60">Bile Duct</text>
            <path d="M 475 375 L 500 360" fill="none" stroke="#27AE60" stroke-width="1.5"/>

            <!-- Floating Formula -->
            <text x="600" y="420" class="mono" font-size="12" font-weight="700" fill="#F1C40F" filter="url(#glow)">Bilirubin</text>
            <text x="600" y="435" class="mono" font-size="12" font-weight="700" fill="#9B59B6" filter="url(#glow)">Steroids</text>
            <path d="M 590 420 Q 550 420 520 400" fill="none" stroke="#7F8C8D" stroke-width="1.5" stroke-dasharray="2 2"/>
        </g>


        <!-- ========================================== -->
        <!-- PANEL C: SKIN (Integumentary Excretion)    -->
        <!-- ========================================== -->
        <g id="panel-skin">
            <text x="833" y="115" font-size="16" font-weight="700" text-anchor="middle" fill="#F39C12">SKIN (Integumentary)</text>
            <text x="833" y="135" font-size="12" font-weight="600" text-anchor="middle" fill="#7F8C8D">Excretes: Water, Salts, Urea, Sebum</text>

            <g filter="url(#shadow)">
                <!-- Epidermis -->
                <path d="M 700 180 Q 765 175 830 180 T 960 180 L 960 205 L 700 205 Z" fill="#E59866" />
                <!-- Dermis & Subcutis -->
                <rect x="700" y="205" width="260" height="285" fill="url(#skinGrad)" />
            </g>

            <!-- Hair Follicle -->
            <path d="M 780 180 L 750 380" stroke="#D35400" stroke-width="20" stroke-linecap="round"/>
            <path d="M 800 100 L 780 180 L 750 380" stroke="#5C2E0C" stroke-width="6" fill="none" stroke-linecap="round"/>
            
            <!-- Sebaceous Gland -->
            <path d="M 770 240 C 820 210, 830 290, 790 300 C 800 330, 760 340, 755 280 Z" fill="#F39C12" stroke="#D68910" stroke-width="2"/>

            <!-- Sweat Gland (Eccrine) -->
            <path d="M 880 450 C 840 420, 830 490, 870 500 C 910 510, 920 440, 880 420 C 850 400, 890 390, 880 450" fill="none" stroke="#3498DB" stroke-width="7" stroke-linecap="round"/>
            <path d="M 880 430 L 880 180" fill="none" stroke="#3498DB" stroke-width="7"/>
            <ellipse cx="880" cy="180" rx="8" ry="4" fill="#2874A6"/>

            <!-- Secretions (Animated) -->
            <g>
                <!-- Sweat Droplets -->
                <circle class="sweat" r="4" fill="#AED6F1" stroke="#fff" stroke-width="1" style="animation-delay: 0s;"/>
                <circle class="sweat" r="4" fill="#AED6F1" stroke="#fff" stroke-width="1" style="animation-delay: 1.3s;"/>
                <circle class="sweat" r="4" fill="#AED6F1" stroke="#fff" stroke-width="1" style="animation-delay: 2.6s;"/>
                
                <!-- Sebum Droplets -->
                <circle class="sebum" r="3.5" fill="#F4D03F" stroke="#D68910" stroke-width="1" style="animation-delay: 0s;"/>
                <circle class="sebum" r="3.5" fill="#F4D03F" stroke="#D68910" stroke-width="1" style="animation-delay: 2s;"/>
                <circle class="sebum" r="3.5" fill="#F4D03F" stroke="#D68910" stroke-width="1" style="animation-delay: 4s;"/>
            </g>

            <!-- Labels -->
            <text x="710" y="198" font-size="11" font-weight="600" fill="#7E5109">Epidermis</text>
            <text x="710" y="230" font-size="11" font-weight="600" fill="#A04000">Dermis</text>
            
            <text x="910" y="480" font-size="12" font-weight="600" fill="#2874A6">Sweat Gland</text>
            <text x="815" y="280" font-size="12" font-weight="600" fill="#D68910">Sebaceous</text>
            <text x="815" y="295" font-size="12" font-weight="600" fill="#D68910">Gland</text>

            <!-- Floating Formulas -->
            <text x="880" y="130" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#3498DB">H₂O, NaCl, Urea</text>
            <text x="780" y="130" class="mono" font-size="12" font-weight="700" text-anchor="middle" fill="#D68910">Sebum (Lipids)</text>
        </g>

        <!-- ========================================== -->
        <!-- GLOBAL LEGEND                              -->
        <!-- ========================================== -->
        <g transform="translate(50, 540)">
            <rect x="0" y="0" width="900" height="40" rx="8" fill="#F8F9FA" stroke="#E5E7EB" stroke-width="1"/>
            <text x="20" y="24" font-size="12" font-weight="700" fill="#2C3E50">KEY:</text>
            
            <!-- Lungs Key -->
            <circle cx="70" cy="20" r="6" fill="#7F8C8D" stroke="#fff" stroke-width="1"/>
            <text x="82" y="24" font-size="12" fill="#4A5568">Carbon Dioxide (CO₂)</text>
            
            <line x1="220" y1="20" x2="240" y2="20" stroke="#3498DB" stroke-width="4" stroke-linecap="round"/>
            <text x="248" y="24" font-size="12" fill="#4A5568">Venous Blood</text>
            
            <line x1="340" y1="20" x2="360" y2="20" stroke="#E74C3C" stroke-width="4" stroke-linecap="round"/>
            <text x="368" y="24" font-size="12" fill="#4A5568">Arterial Blood</text>

            <!-- Liver Key -->
            <circle cx="470" cy="20" r="6" fill="#F1C40F" stroke="#fff" stroke-width="1"/>
            <circle cx="480" cy="20" r="6" fill="#9B59B6" stroke="#fff" stroke-width="1"/>
            <text x="494" y="24" font-size="12" fill="#4A5568">Bile Pigments & Toxins</text>

            <!-- Skin Key -->
            <circle cx="650" cy="20" r="6" fill="#AED6F1" stroke="#fff" stroke-width="1"/>
            <text x="662" y="24" font-size="12" fill="#4A5568">Sweat Droplet</text>

            <circle cx="760" cy="20" r="6" fill="#F4D03F" stroke="#D68910" stroke-width="1"/>
            <text x="772" y="24" font-size="12" fill="#4A5568">Sebum (Oil)</text>
        </g>

    </svg>
</div>

</body>
</html>
