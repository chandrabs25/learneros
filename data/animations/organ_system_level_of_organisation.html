<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organ System Level: Phylum Aschelminthes</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        .pharynx-group {
            transform-origin: 150px 250px;
            animation: pharynxPulse 1.2s infinite ease-in-out;
        }

        @keyframes pharynxPulse {
            0%, 100% { transform: scaleY(1) scaleX(1); }
            50% { transform: scaleY(1.12) scaleX(0.96); }
        }

        .label-line {
            fill: none;
            stroke: #95A5A6;
            stroke-width: 1.5;
            stroke-linejoin: round;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            fill: #2C3E50;
        }

        .title-main {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 700;
            fill: #2C3E50;
        }

        .title-sub {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            font-weight: 500;
            fill: #7F8C8D;
        }

        .process-title {
            font-family: 'Inter', sans-serif;
            font-size: 18px;
            font-weight: 700;
            fill: #27AE60;
            text-anchor: middle;
        }

        .process-desc {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            fill: #7F8C8D;
            text-anchor: middle;
        }

        .directional-text {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            font-weight: 700;
            fill: #BDC3C7;
            letter-spacing: 2px;
            text-anchor: middle;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Organ System Level of Organisation: Aschelminthes</title>
        <desc>Animated diagram showing the tube-within-a-tube body plan of a roundworm, featuring a complete alimentary canal, muscular pharynx, and pseudocoelom.</desc>

        <!-- Definitions for Gradients and Filters -->
        <defs>
            <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
                <feDropShadow dx="2" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.15"/>
            </filter>
            <filter id="light-shadow" x="-10%" y="-10%" width="130%" height="130%">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.1"/>
            </filter>

            <linearGradient id="intestine-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#27AE60"/>
                <stop offset="50%" stop-color="#2ECC71"/>
                <stop offset="100%" stop-color="#229954"/>
            </linearGradient>

            <linearGradient id="pseudo-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#D6EAF8"/>
                <stop offset="15%" stop-color="#E8F4FD"/>
                <stop offset="85%" stop-color="#E8F4FD"/>
                <stop offset="100%" stop-color="#D6EAF8"/>
            </linearGradient>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Titles -->
        <text x="30" y="45" class="title-main">Organ System Level: Phylum Aschelminthes</text>
        <text x="30" y="70" class="title-sub">Body plan: Pseudocoelomate</text>

        <!-- Directional Indicators -->
        <text x="100" y="460" class="directional-text">ANTERIOR</text>
        <text x="700" y="460" class="directional-text">POSTERIOR</text>

        <!-- Main Biological Structures -->
        <g id="worm-body">
            <!-- Outer Body Wall (Cuticle & Epidermis) -->
            <path d="M 100 220 Q 410 130 720 250 Q 410 370 100 280 Z" 
                  fill="#F39C12" stroke="#D68910" stroke-width="3" filter="url(#drop-shadow)"/>
            
            <!-- Pseudocoelom (Fluid-filled cavity) -->
            <path d="M 115 235 Q 410 155 680 250 Q 410 345 115 265 Z" 
                  fill="url(#pseudo-grad)" stroke="#AED6F1" stroke-width="1.5"/>

            <!-- Excretory System -->
            <path d="M 540 287 L 200 287 L 180 325" 
                  fill="none" stroke="#3498DB" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Intestine (Midgut) -->
            <path d="M 200 235 Q 410 235 580 245 Q 605 255 615 315 L 595 315 Q 585 265 560 260 Q 410 255 200 265 Z" 
                  fill="url(#intestine-grad)" stroke="#1E8449" stroke-width="1.5"/>

            <!-- Muscular Pharynx (Foregut) -->
            <g class="pharynx-group">
                <path d="M 95 235 Q 150 210 200 235 L 200 265 Q 150 290 95 265 Z" 
                      fill="#D35400" stroke="#A04000" stroke-width="1.5"/>
                <!-- Muscle striations -->
                <path d="M 110 225 L 110 275 M 130 215 L 130 285 M 150 210 L 150 290 M 170 215 L 170 285 M 190 225 L 190 275" 
                      stroke="#A04000" stroke-width="1.5" opacity="0.6"/>
            </g>
        </g>

        <!-- Animations: Absorption (Nutrients moving into Pseudocoelom) -->
        <g id="absorption-particles">
            <!-- Upward absorption -->
            <circle cx="260" cy="240" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="240; 190" dur="2s" begin="0s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2s" begin="0s" repeatCount="indefinite"/>
            </circle>
            <circle cx="360" cy="240" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="240; 180" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2.5s" begin="0.5s" repeatCount="indefinite"/>
            </circle>
            <circle cx="460" cy="240" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="240; 190" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2.2s" begin="1.2s" repeatCount="indefinite"/>
            </circle>
            <!-- Downward absorption -->
            <circle cx="310" cy="260" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="260; 310" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2.1s" begin="0.3s" repeatCount="indefinite"/>
            </circle>
            <circle cx="410" cy="260" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="260; 320" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
            </circle>
            <circle cx="510" cy="260" r="2.5" fill="#98D8C8" opacity="0">
                <animate attributeName="cy" values="260; 300" dur="2.3s" begin="1.6s" repeatCount="indefinite"/>
                <animate attributeName="opacity" values="0; 0.8; 0" keyTimes="0; 0.3; 1" dur="2.3s" begin="1.6s" repeatCount="indefinite"/>
            </circle>
        </g>

        <!-- Animations: Nutrient Flow (Ingestion -> Digestion -> Egestion) -->
        <g id="nutrient-flow">
            <circle r="4" fill="#98D8C8">
                <animateMotion dur="8s" repeatCount="indefinite" path="M 60 250 L 150 250 L 300 250 L 500 250 Q 605 255 605 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.95; 1" dur="8s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#98D8C8">
                <animateMotion dur="8s" begin="1.6s" repeatCount="indefinite" path="M 60 250 L 150 250 L 300 250 L 500 250 Q 605 255 605 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.95; 1" dur="8s" begin="1.6s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#98D8C8">
                <animateMotion dur="8s" begin="3.2s" repeatCount="indefinite" path="M 60 250 L 150 250 L 300 250 L 500 250 Q 605 255 605 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.95; 1" dur="8s" begin="3.2s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#98D8C8">
                <animateMotion dur="8s" begin="4.8s" repeatCount="indefinite" path="M 60 250 L 150 250 L 300 250 L 500 250 Q 605 255 605 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.95; 1" dur="8s" begin="4.8s" repeatCount="indefinite" />
            </circle>
            <circle r="4" fill="#98D8C8">
                <animateMotion dur="8s" begin="6.4s" repeatCount="indefinite" path="M 60 250 L 150 250 L 300 250 L 500 250 Q 605 255 605 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.95; 1" dur="8s" begin="6.4s" repeatCount="indefinite" />
            </circle>
        </g>

        <!-- Animations: Excretion Flow -->
        <g id="excretion-flow">
            <circle r="3" fill="#2C3E50">
                <animateMotion dur="6s" repeatCount="indefinite" path="M 540 287 L 200 287 L 180 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.95; 1" dur="6s" repeatCount="indefinite" />
            </circle>
            <circle r="3" fill="#2C3E50">
                <animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M 540 287 L 200 287 L 180 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.95; 1" dur="6s" begin="2s" repeatCount="indefinite" />
            </circle>
            <circle r="3" fill="#2C3E50">
                <animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M 540 287 L 200 287 L 180 325" />
                <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.1; 0.95; 1" dur="6s" begin="4s" repeatCount="indefinite" />
            </circle>
        </g>

        <!-- Anatomical Labels & Pointers -->
        <g id="labels">
            <!-- Mouth -->
            <text x="100" y="140" text-anchor="end" class="label-text">Mouth</text>
            <polyline points="105,135 120,135 100,240" class="label-line"/>

            <!-- Muscular Pharynx -->
            <text x="190" y="100" text-anchor="end" class="label-text">Muscular Pharynx</text>
            <polyline points="195,95 210,95 160,220" class="label-line"/>

            <!-- Body Wall -->
            <text x="350" y="90" text-anchor="start" class="label-text">Body Wall (Cuticle &amp; Epidermis)</text>
            <polyline points="345,85 330,85 330,145" class="label-line"/>

            <!-- Pseudocoelom -->
            <text x="520" y="110" text-anchor="start" class="label-text">Pseudocoelom</text>
            <polyline points="515,105 500,105 480,180" class="label-line"/>

            <!-- Intestine -->
            <text x="620" y="150" text-anchor="start" class="label-text">Intestine</text>
            <polyline points="615,145 600,145 520,235" class="label-line"/>

            <!-- Anus -->
            <text x="660" y="360" text-anchor="start" class="label-text">Anus</text>
            <polyline points="655,355 640,355 610,315" class="label-line"/>

            <!-- Excretory Tube -->
            <text x="400" y="390" text-anchor="start" class="label-text">Excretory Tube</text>
            <polyline points="395,385 380,385 380,287" class="label-line"/>

            <!-- Excretory Pore -->
            <text x="150" y="390" text-anchor="end" class="label-text">Excretory Pore</text>
            <polyline points="155,385 170,385 180,325" class="label-line"/>
        </g>

        <!-- Process Labels -->
        <text x="400" y="440" class="process-title">Complete Alimentary Canal</text>
        <text x="400" y="465" class="process-desc">"Tube-within-a-tube" plan allows continuous processing of food</text>

        <!-- Legend -->
        <g transform="translate(610, 340)">
            <rect width="165" height="140" rx="6" fill="#ffffff" stroke="#BDC3C7" filter="url(#light-shadow)"/>
            <text x="12" y="22" font-family="Inter" font-size="13" font-weight="700" fill="#2C3E50">Legend</text>
            
            <rect x="12" y="35" width="14" height="14" fill="#F39C12" rx="3"/>
            <text x="35" y="46" font-family="Inter" font-size="12" fill="#2C3E50">Animal Tissue</text>
            
            <rect x="12" y="57" width="14" height="14" fill="#E8F4FD" stroke="#AED6F1" stroke-width="1.5" rx="3"/>
            <text x="35" y="68" font-family="Inter" font-size="12" fill="#2C3E50">Pseudocoelom Fluid</text>
            
            <rect x="12" y="79" width="14" height="14" fill="#2ECC71" rx="3"/>
            <text x="35" y="90" font-family="Inter" font-size="12" fill="#2C3E50">Digestive Tract</text>
            
            <circle cx="19" cy="108" r="5" fill="#98D8C8"/>
            <text x="35" y="112" font-family="Inter" font-size="12" fill="#2C3E50">Nutrients / Food</text>
            
            <circle cx="19" cy="128" r="4" fill="#2C3E50"/>
            <text x="35" y="132" font-family="Inter" font-size="12" fill="#2C3E50">Metabolic Waste</text>
        </g>
    </svg>
</div>

</body>
</html>
