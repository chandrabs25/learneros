<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EAS: Bromination of Anisole</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        /* Master Animation Class */
        .anim {
            animation-duration: 12s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        /* Group Opacity Animations */
        @keyframes fadeLeft {
            0%, 45% { opacity: 1; }
            50%, 95% { opacity: 0.25; }
            100% { opacity: 1; }
        }
        .left-group { animation-name: fadeLeft; }

        @keyframes fadeCenter {
            0%, 45% { opacity: 0.25; }
            50%, 85% { opacity: 1; }
            90%, 100% { opacity: 0.25; }
        }
        .center-group { animation-name: fadeCenter; }

        @keyframes fadeRight {
            0%, 85% { opacity: 0.25; }
            90%, 98% { opacity: 1; }
            100% { opacity: 0.25; }
        }
        .right-group { animation-name: fadeRight; }

        /* Arrow Drawing Animations */
        .mechanism-arrow {
            stroke: #F77F00;
            stroke-width: 2;
            fill: none;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            stroke-linecap: round;
        }

        @keyframes drawA1 {
            0%, 5% { stroke-dashoffset: 100; opacity: 1; }
            15%, 45% { stroke-dashoffset: 0; opacity: 1; }
            46%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow1 { animation-name: drawA1; }

        @keyframes drawA2 {
            0%, 10% { stroke-dashoffset: 100; opacity: 1; }
            20%, 45% { stroke-dashoffset: 0; opacity: 1; }
            46%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow2 { animation-name: drawA2; }

        @keyframes drawA3 {
            0%, 15% { stroke-dashoffset: 100; opacity: 1; }
            25%, 45% { stroke-dashoffset: 0; opacity: 1; }
            46%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow3 { animation-name: drawA3; }

        @keyframes showDelta {
            0%, 20% { opacity: 0; }
            25%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }
        .delta-minus { animation-name: showDelta; }

        @keyframes moveBr2 {
            0%, 25% { transform: translateY(20px); opacity: 0; }
            30%, 45% { transform: translateY(0px); opacity: 1; }
            46%, 100% { opacity: 0; transform: translateY(0px); }
        }
        .br2-molecule { animation-name: moveBr2; }

        @keyframes drawA4 {
            0%, 30% { stroke-dashoffset: 100; opacity: 0; }
            31% { opacity: 1; }
            40%, 45% { stroke-dashoffset: 0; opacity: 1; }
            46%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow4 { animation-name: drawA4; }

        @keyframes drawA5 {
            0%, 35% { stroke-dashoffset: 100; opacity: 0; }
            36% { opacity: 1; }
            45% { stroke-dashoffset: 0; opacity: 1; }
            46%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow5 { animation-name: drawA5; }

        @keyframes breakBrBond {
            0%, 40% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }
        .br-bond-break { animation-name: breakBrBond; }

        @keyframes moveBrMinusLeave {
            0%, 40% { transform: translateY(0); opacity: 1; }
            45%, 100% { transform: translateY(20px); opacity: 0; }
        }
        .br-minus-leave { animation-name: moveBrMinusLeave; }

        /* Center Group Specifics */
        @keyframes moveBrMinusApproach {
            0%, 60% { transform: translate(-20px, 20px); opacity: 0; }
            65%, 85% { transform: translate(0, 0); opacity: 1; }
            86%, 100% { opacity: 0; }
        }
        .br-minus-approach { animation-name: moveBrMinusApproach; }

        @keyframes drawA6 {
            0%, 65% { stroke-dashoffset: 100; opacity: 0; }
            66% { opacity: 1; }
            75%, 85% { stroke-dashoffset: 0; opacity: 1; }
            86%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow6 { animation-name: drawA6; }

        @keyframes drawA7 {
            0%, 75% { stroke-dashoffset: 100; opacity: 0; }
            76% { opacity: 1; }
            85% { stroke-dashoffset: 0; opacity: 1; }
            86%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        .arrow7 { animation-name: drawA7; }

        /* Right Group Specifics */
        @keyframes moveHBr {
            0%, 90% { transform: translate(0, 0); opacity: 0; }
            92%, 96% { transform: translate(0, 0); opacity: 1; }
            99%, 100% { transform: translate(30px, -20px); opacity: 0; }
        }
        .hbr-leave { animation-name: moveHBr; }

        /* Static Styles */
        .bond { stroke: #404040; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .pi-bond { stroke: #606060; stroke-width: 1.5; stroke-linecap: round; }
        .atom-text { font-family: 'Inter', sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
        .formula-text { font-family: 'Roboto Mono', monospace; font-weight: 500; text-anchor: start; dominant-baseline: central; fill: #404040; }
        .charge-circle { stroke: none; }
        .charge-text { font-family: 'Inter', sans-serif; font-weight: bold; font-size: 10px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%">
        <defs>
            <!-- Orange Arrowhead for Mechanism -->
            <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#F77F00" />
            </marker>
            <!-- Purple Arrowhead for Reaction Progress -->
            <marker id="reactionArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                <polygon points="0 0, 8 3, 0 6" fill="#7209B7" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Titles & Annotations -->
        <text x="400" y="40" font-size="22" font-weight="700" text-anchor="middle" fill="#333">Electrophilic Aromatic Substitution: Bromination of Anisole</text>
        <text x="400" y="65" font-size="13" text-anchor="middle" fill="#666">Note: No FeBr₃ catalyst is required due to the strong activation of the ring by the -OCH₃ group.</text>

        <!-- Reaction Progress Arrows -->
        <line x1="260" y1="220" x2="310" y2="220" stroke="#7209B7" stroke-width="3" marker-end="url(#reactionArrow)" />
        <line x1="510" y1="220" x2="560" y2="220" stroke="#7209B7" stroke-width="3" marker-end="url(#reactionArrow)" />

        <!-- Stage Labels -->
        <text x="150" y="420" font-size="14" font-weight="600" text-anchor="middle" fill="#333">Anisole + Br₂</text>
        <text x="400" y="420" font-size="14" font-weight="600" text-anchor="middle" fill="#333">σ-Complex (Resonance Stabilized)</text>
        <text x="650" y="420" font-size="14" font-weight="600" text-anchor="middle" fill="#333">p-Bromoanisole (Major)</text>

        <!-- Legend -->
        <g transform="translate(20, 440)">
            <rect width="320" height="40" rx="5" fill="#fff" stroke="#ddd" stroke-width="1"/>
            <text x="10" y="20" font-size="12" font-weight="600" fill="#666" dominant-baseline="central">Key:</text>
            
            <circle cx="55" cy="20" r="6" fill="#404040"/>
            <text x="65" y="20" font-size="11" fill="#333" dominant-baseline="central">Carbon</text>
            
            <circle cx="115" cy="20" r="6" fill="#FF4444"/>
            <text x="125" y="20" font-size="11" fill="#333" dominant-baseline="central">Oxygen</text>
            
            <circle cx="175" cy="20" r="6" fill="#A52A2A"/>
            <text x="185" y="20" font-size="11" fill="#333" dominant-baseline="central">Bromine</text>
            
            <circle cx="240" cy="20" r="6" fill="#CCCCCC"/>
            <text x="250" y="20" font-size="11" fill="#333" dominant-baseline="central">Hydrogen</text>
        </g>

        <!-- ========================================== -->
        <!-- LEFT GROUP: Anisole + Br2 (0s - 6s active) -->
        <!-- ========================================== -->
        <g class="left-group anim" transform="translate(150, 220)">
            <!-- Benzene Ring -->
            <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" class="bond" />
            <!-- Pi Bonds -->
            <line x1="4" y1="-33" x2="28" y2="-19" class="pi-bond" />
            <line x1="28" y1="19" x2="4" y2="33" class="pi-bond" />
            <line x1="-28" y1="19" x2="-28" y2="-19" class="pi-bond" />
            
            <!-- Methoxy Group -->
            <line x1="0" y1="-40" x2="0" y2="-65" class="bond" />
            <line x1="0" y1="-65" x2="20" y2="-80" class="bond" />
            <circle cx="0" cy="-65" r="9" fill="#f8f9fa" />
            <text x="0" y="-65" fill="#FF4444" font-size="14" class="atom-text">O</text>
            <text x="22" y="-80" font-size="14" class="formula-text">CH<tspan dy="4" font-size="10">3</tspan></text>
            
            <!-- Oxygen Lone Pairs -->
            <circle cx="-9" cy="-68" r="1.5" fill="#FF4444" />
            <circle cx="-9" cy="-62" r="1.5" fill="#FF4444" />

            <!-- Delta Minus at Para -->
            <text x="0" y="58" fill="#7209B7" font-size="14" font-style="italic" class="atom-text delta-minus anim">δ⁻</text>

            <!-- Br2 Molecule -->
            <g class="br2-molecule anim" transform="translate(0, 95)">
                <line x1="0" y1="12" x2="0" y2="23" class="bond br-bond-break anim" />
                <circle cx="0" cy="0" r="12" fill="#A52A2A" />
                <text x="0" y="0" fill="#fff" font-size="12" class="atom-text">Br</text>
                
                <g class="br-minus-leave anim">
                    <circle cx="0" cy="35" r="12" fill="#A52A2A" />
                    <text x="0" y="35" fill="#fff" font-size="12" class="atom-text">Br</text>
                </g>
            </g>

            <!-- Mechanism Arrows -->
            <path d="M -12,-65 Q -25,-50 -5,-45" class="mechanism-arrow arrow1 anim" marker-end="url(#arrowhead)" />
            <path d="M 16,-26 Q 35,-15 28,0" class="mechanism-arrow arrow2 anim" marker-end="url(#arrowhead)" />
            <path d="M 16,26 Q 30,40 5,45" class="mechanism-arrow arrow3 anim" marker-end="url(#arrowhead)" />
            <path d="M 0,45 Q -30,65 -5,82" class="mechanism-arrow arrow4 anim" marker-end="url(#arrowhead)" />
            <path d="M 5,107 Q 25,107 15,125" class="mechanism-arrow arrow5 anim" marker-end="url(#arrowhead)" />
        </g>

        <!-- ========================================== -->
        <!-- CENTER GROUP: Sigma Complex (6s - 10.5s active) -->
        <!-- ========================================== -->
        <g class="center-group anim" transform="translate(400, 220)">
            <!-- Benzene Ring (Broken Aromaticity) -->
            <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" class="bond" />
            
            <!-- Shifted Pi Bonds -->
            <line x1="28" y1="-16" x2="28" y2="16" class="pi-bond" />
            <line x1="-28" y1="-16" x2="-28" y2="16" class="pi-bond" />
            
            <!-- Methoxy Group with Double Bond (Resonance Stabilized) -->
            <line x1="-3" y1="-40" x2="-3" y2="-65" class="bond" />
            <line x1="3" y1="-40" x2="3" y2="-65" class="bond" />
            <line x1="0" y1="-65" x2="20" y2="-80" class="bond" />
            
            <circle cx="0" cy="-65" r="9" fill="#f8f9fa" />
            <text x="0" y="-65" fill="#FF4444" font-size="14" class="atom-text">O</text>
            <text x="22" y="-80" font-size="14" class="formula-text">CH<tspan dy="4" font-size="10">3</tspan></text>
            
            <!-- Formal Positive Charge on Oxygen -->
            <circle cx="12" cy="-72" r="6" fill="#FF4444" class="charge-circle" />
            <text x="12" y="-72" class="charge-text">+</text>

            <!-- Tetrahedral C4 (sp3) -->
            <line x1="0" y1="40" x2="-20" y2="65" class="bond" />
            <line x1="0" y1="40" x2="20" y2="65" class="bond" />
            
            <circle cx="-20" cy="65" r="9" fill="#f8f9fa" />
            <text x="-20" y="65" fill="#888" font-size="14" class="atom-text">H</text>
            
            <circle cx="20" cy="65" r="12" fill="#A52A2A" />
            <text x="20" y="65" fill="#fff" font-size="12" class="atom-text">Br</text>

            <!-- Approaching Br- Ion -->
            <g class="br-minus-approach anim">
                <circle cx="-50" cy="85" r="12" fill="#A52A2A" />
                <text x="-50" y="85" fill="#fff" font-size="12" class="atom-text">Br</text>
                <circle cx="-38" cy="75" r="6" fill="#4444FF" class="charge-circle" />
                <text x="-38" y="75" class="charge-text">-</text>
            </g>

            <!-- Mechanism Arrows -->
            <path d="M -45,75 Q -35,55 -25,60" class="mechanism-arrow arrow6 anim" marker-end="url(#arrowhead)" />
            <path d="M -10,52 Q 5,55 15,26" class="mechanism-arrow arrow7 anim" marker-end="url(#arrowhead)" />
        </g>

        <!-- ========================================== -->
        <!-- RIGHT GROUP: Product (10.5s - 12s active)  -->
        <!-- ========================================== -->
        <g class="right-group anim" transform="translate(650, 220)">
            <!-- Restored Benzene Ring -->
            <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="none" class="bond" />
            <!-- Restored Pi Bonds -->
            <line x1="4" y1="-33" x2="28" y2="-19" class="pi-bond" />
            <line x1="28" y1="19" x2="4" y2="33" class="pi-bond" />
            <line x1="-28" y1="19" x2="-28" y2="-19" class="pi-bond" />
            
            <!-- Methoxy Group -->
            <line x1="0" y1="-40" x2="0" y2="-65" class="bond" />
            <line x1="0" y1="-65" x2="20" y2="-80" class="bond" />
            <circle cx="0" cy="-65" r="9" fill="#f8f9fa" />
            <text x="0" y="-65" fill="#FF4444" font-size="14" class="atom-text">O</text>
            <text x="22" y="-80" font-size="14" class="formula-text">CH<tspan dy="4" font-size="10">3</tspan></text>
            
            <!-- Oxygen Lone Pairs -->
            <circle cx="-9" cy="-68" r="1.5" fill="#FF4444" />
            <circle cx="-9" cy="-62" r="1.5" fill="#FF4444" />

            <!-- Para Bromine -->
            <line x1="0" y1="40" x2="0" y2="70" class="bond" />
            <circle cx="0" cy="70" r="12" fill="#A52A2A" />
            <text x="0" y="70" fill="#fff" font-size="12" class="atom-text">Br</text>

            <!-- Leaving HBr Molecule -->
            <g class="hbr-leave anim">
                <line x1="48" y1="70" x2="58" y2="70" class="bond" />
                <circle cx="40" cy="70" r="9" fill="#f8f9fa" />
                <text x="40" y="70" fill="#888" font-size="14" class="atom-text">H</text>
                <circle cx="70" cy="70" r="12" fill="#A52A2A" />
                <text x="70" y="70" fill="#fff" font-size="12" class="atom-text">Br</text>
            </g>
        </g>

    </svg>
</div>

</body>
</html>
