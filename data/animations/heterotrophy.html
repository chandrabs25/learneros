<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heterotrophy: Kingdom Animalia</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }

        .sci-font {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }

        /* Ecological Flow Animations */
        .flow-plant-herb {
            animation: flow1 15s infinite linear;
        }

        .flow-herb-carn {
            animation: flow2 15s infinite linear;
        }

        .stomach {
            transform-origin: center;
            animation: stomachPulse 15s infinite ease-in-out;
        }

        .indirect-label {
            animation: labelFade 15s infinite ease-in-out;
        }

        /* Cellular Process Animations */
        .complex-matter {
            transform-origin: center;
            animation: breakdown 15s infinite ease-in-out;
        }

        .glucose-group {
            animation: glucoseMove 15s infinite ease-in-out;
        }

        .mito {
            transform-origin: center;
            animation: mitoPulse 15s infinite ease-in-out;
        }

        .atp1 { animation: atpMove1 15s infinite ease-out; }
        .atp2 { animation: atpMove2 15s infinite ease-out; }
        .atp3 { animation: atpMove3 15s infinite ease-out; }

        .waste {
            animation: wasteMove 15s infinite ease-out;
        }

        /* Keyframes */
        @keyframes flow1 {
            0% { transform: translate(140px, 120px); opacity: 0; }
            5% { opacity: 1; }
            20% { transform: translate(320px, 120px); opacity: 1; }
            25% { transform: translate(340px, 120px); opacity: 0; }
            100% { opacity: 0; transform: translate(340px, 120px); }
        }

        @keyframes flow2 {
            0%, 25% { opacity: 0; transform: translate(400px, 120px); }
            30% { opacity: 1; }
            40% { transform: translate(620px, 120px); opacity: 1; }
            45% { transform: translate(640px, 120px); opacity: 0; }
            100% { opacity: 0; transform: translate(640px, 120px); }
        }

        @keyframes stomachPulse {
            0%, 15% { transform: scale(1); fill: #E74C3C; }
            20% { transform: scale(1.8); fill: #2ECC71; }
            25% { transform: scale(1); fill: #E74C3C; }
            100% { transform: scale(1); fill: #E74C3C; }
        }

        @keyframes labelFade {
            0%, 26% { opacity: 0; }
            30%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes breakdown {
            0%, 40% { opacity: 0; transform: scale(0.5) translate(0, 0); }
            46% { opacity: 1; transform: scale(1) translate(0, 0); }
            53% { opacity: 1; transform: scale(1.1) translate(10px, 0); }
            56% { opacity: 0; transform: scale(1.3) translate(20px, 0); filter: blur(2px); }
            100% { opacity: 0; }
        }

        @keyframes glucoseMove {
            0%, 52% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            56% { opacity: 1; transform: translate(0, 0) scale(1.2); }
            60% { transform: translate(40px, 0) scale(1); }
            68% { transform: translate(250px, 0) scale(1); } /* At membrane */
            74% { transform: translate(380px, 20px) scale(0.6); opacity: 1; } /* Entering Mito */
            76%, 100% { opacity: 0; transform: translate(380px, 20px) scale(0); }
        }

        @keyframes mitoPulse {
            0%, 73% { transform: translate(-30px, 30px) scale(1); filter: none; }
            76% { transform: translate(-30px, 30px) scale(1.15); filter: drop-shadow(0 0 8px #E74C3C); }
            85% { transform: translate(-30px, 30px) scale(1); filter: none; }
            100% { transform: translate(-30px, 30px) scale(1); }
        }

        @keyframes atpMove1 {
            0%, 75% { opacity: 0; transform: translate(0, 0) scale(0); }
            78% { opacity: 1; transform: translate(-20px, -30px) scale(1); }
            90% { opacity: 1; transform: translate(-40px, -60px) scale(1.2); }
            95%, 100% { opacity: 0; transform: translate(-50px, -80px) scale(1.5); }
        }

        @keyframes atpMove2 {
            0%, 76% { opacity: 0; transform: translate(0, 0) scale(0); }
            79% { opacity: 1; transform: translate(30px, -20px) scale(1); }
            92% { opacity: 1; transform: translate(60px, -40px) scale(1.2); }
            97%, 100% { opacity: 0; transform: translate(80px, -60px) scale(1.5); }
        }

        @keyframes atpMove3 {
            0%, 77% { opacity: 0; transform: translate(0, 0) scale(0); }
            80% { opacity: 1; transform: translate(10px, 40px) scale(1); }
            94% { opacity: 1; transform: translate(20px, 80px) scale(1.2); }
            99%, 100% { opacity: 0; transform: translate(30px, 100px) scale(1.5); }
        }

        @keyframes wasteMove {
            0%, 75% { opacity: 0; transform: translate(0, 0); }
            82% { opacity: 1; transform: translate(-40px, 40px); }
            95% { opacity: 0; transform: translate(-120px, 120px); }
            100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Heterotrophy in Kingdom Animalia</title>
        <desc>Diagram showing the flow of energy from plants to animals and the cellular process of heterotrophic nutrition including ingestion, digestion, and cellular respiration.</desc>

        <!-- Definitions for reusable elements -->
        <defs>
            <!-- Arrowhead marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" />
            </marker>

            <!-- Dashed Arrowhead -->
            <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#BDC3C7" />
            </marker>

            <!-- Glucose Hexagon -->
            <g id="glucose-hex">
                <polygon points="0,-10 8,-5 8,5 0,10 -8,5 -8,-5" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1.5"/>
            </g>

            <!-- ATP Star -->
            <g id="atp-star">
                <path d="M0,-12 L3,-4 L12,-4 L5,2 L8,10 L0,5 L-8,10 L-5,2 L-12,-4 L-3,-4 Z" fill="#FFD700" stroke="#F39C12" stroke-width="1"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="35" text-anchor="middle" font-size="24" font-weight="700">Heterotrophy: Kingdom Animalia</text>
        <text x="400" y="55" text-anchor="middle" font-size="14" font-weight="400" fill="#7F8C8D">Energy flow from producers to consumers & cellular assimilation</text>

        <!-- Divider Line -->
        <line x1="50" y1="210" x2="750" y2="210" stroke="#E5E7EB" stroke-width="2" stroke-dasharray="5,5" />
        <text x="60" y="200" font-size="12" font-weight="600" fill="#95A5A6" letter-spacing="1">ECOLOGICAL LEVEL</text>
        <text x="60" y="225" font-size="12" font-weight="600" fill="#95A5A6" letter-spacing="1">CELLULAR LEVEL</text>

        <!-- ========================================== -->
        <!-- TOP SECTION: ECOLOGICAL FLOW (0 to 200)    -->
        <!-- ========================================== -->

        <!-- Plant (Producer) -->
        <g transform="translate(120, 130)">
            <!-- Leaves -->
            <path d="M0,30 C-15,5 -40,10 -40,-15 C-15,-15 0,5 0,30 Z" fill="#2ECC71"/>
            <path d="M0,30 C15,5 40,10 40,-15 C15,-15 0,5 0,30 Z" fill="#27AE60"/>
            <path d="M0,20 C-10,0 -20,-5 -20,-25 C-5,-20 0,0 0,20 Z" fill="#2ECC71"/>
            <!-- Stem -->
            <rect x="-2" y="10" width="4" height="35" fill="#27AE60"/>
            <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600">Autotroph</text>
            <text x="0" y="75" text-anchor="middle" font-size="11" fill="#7F8C8D">(Producer)</text>
        </g>

        <!-- Flow Arrow 1 -->
        <line x1="170" y1="120" x2="310" y2="120" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)" />
        <g class="flow-plant-herb">
            <circle cx="0" cy="0" r="4" fill="#2ECC71" />
            <circle cx="-12" cy="0" r="3" fill="#2ECC71" opacity="0.7" />
            <circle cx="-22" cy="0" r="2" fill="#2ECC71" opacity="0.4" />
        </g>

        <!-- Herbivore (Primary Consumer) -->
        <g transform="translate(360, 130)">
            <!-- Body -->
            <path d="M-25,25 C-30,-5 -10,-20 5,-20 C20,-20 30,0 25,25 Z" fill="#F39C12"/>
            <!-- Head -->
            <circle cx="20" cy="-10" r="14" fill="#F39C12"/>
            <!-- Ears -->
            <path d="M15,-20 C10,-40 15,-50 20,-50 C25,-50 25,-30 20,-20 Z" fill="#F39C12"/>
            <path d="M22,-18 C20,-35 25,-45 30,-45 C35,-45 32,-25 27,-15 Z" fill="#F39C12"/>
            <!-- Eye -->
            <circle cx="25" cy="-12" r="2.5" fill="#2C3E50"/>
            <!-- Stomach (Animated) -->
            <circle class="stomach" cx="0" cy="10" r="8" fill="#E74C3C" opacity="0.9"/>
            
            <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600">Primary Consumer</text>
            <text x="0" y="75" text-anchor="middle" font-size="11" fill="#7F8C8D">(Herbivore)</text>
        </g>

        <!-- Flow Arrow 2 -->
        <line x1="410" y1="120" x2="610" y2="120" stroke="#7F8C8D" stroke-width="2" marker-end="url(#arrow)" />
        <text class="indirect-label" x="510" y="105" text-anchor="middle" font-size="11" fill="#D35400" font-weight="600">Indirect dependence</text>
        <g class="flow-herb-carn">
            <circle cx="0" cy="0" r="4" fill="#F39C12" />
            <circle cx="-12" cy="0" r="3" fill="#F39C12" opacity="0.7" />
            <circle cx="-22" cy="0" r="2" fill="#F39C12" opacity="0.4" />
        </g>

        <!-- Carnivore (Secondary Consumer) -->
        <g transform="translate(660, 130)">
            <!-- Body -->
            <path d="M-35,30 C-40,-10 -15,-25 10,-20 C30,-15 40,5 35,30 Z" fill="#D35400"/>
            <!-- Tail -->
            <path d="M-30,15 C-50,20 -60,0 -50,-10 C-40,-20 -25,0 -20,10 Z" fill="#D35400"/>
            <!-- Head -->
            <polygon points="20,-15 45,-10 30,15" fill="#D35400"/>
            <!-- Ears -->
            <polygon points="10,-20 5,-40 20,-20" fill="#D35400"/>
            <polygon points="25,-20 35,-35 30,-15" fill="#D35400"/>
            <!-- Eye -->
            <circle cx="28" cy="-5" r="2.5" fill="#2C3E50"/>
            
            <text x="0" y="60" text-anchor="middle" font-size="12" font-weight="600">Secondary Consumer</text>
            <text x="0" y="75" text-anchor="middle" font-size="11" fill="#7F8C8D">(Carnivore)</text>
        </g>

        <!-- Contextual connection line -->
        <path d="M 360 190 Q 360 280 430 360" fill="none" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6,6" marker-end="url(#arrow-dashed)" opacity="0.5"/>


        <!-- ========================================== -->
        <!-- BOTTOM SECTION: CELLULAR PROCESS (220-500) -->
        <!-- ========================================== -->

        <!-- Animal Tissue Context (Adjacent Cells) -->
        <g transform="translate(550, 360)">
            <path d="M-150,-100 C-180,-150 -100,-220 -30,-180 C-50,-130 -100,-110 -150,-100 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" opacity="0.5"/>
            <circle cx="-100" cy="-150" r="15" fill="#2C3E50" opacity="0.3"/>
            
            <path d="M30,-180 C100,-220 180,-150 150,-100 C100,-110 50,-130 30,-180 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" opacity="0.5"/>
            <circle cx="100" cy="-150" r="15" fill="#2C3E50" opacity="0.3"/>
            
            <path d="M150,100 C180,150 100,220 30,180 C50,130 100,110 150,100 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" opacity="0.5"/>
            <circle cx="100" cy="150" r="15" fill="#2C3E50" opacity="0.3"/>
        </g>

        <!-- Main Animal Cell -->
        <g id="main-cell" transform="translate(550, 360)">
            <!-- Flexible Cell Membrane (No Cell Wall) -->
            <path d="M-140,10 C-150,-60 -90,-140 0,-140 C100,-140 150,-60 140,20 C130,100 80,150 0,140 C-80,130 -130,90 -140,10 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
            
            <!-- Cytoplasm Label -->
            <text x="60" y="110" font-size="12" fill="#4A90D9" font-weight="600">Cytoplasm</text>
            <text x="-145" y="-150" font-size="12" fill="#4A90D9" font-weight="600">Cell Membrane</text>
            <path d="M-100,-145 L-60,-120" stroke="#4A90D9" stroke-width="1" marker-end="url(#arrow)"/>

            <!-- Nucleus -->
            <g transform="translate(40, -50)">
                <circle cx="0" cy="0" r="40" fill="#2C3E50"/>
                <circle cx="-10" cy="-10" r="15" fill="#1A252F"/>
                <path d="M-20,10 Q0,30 20,10" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0.8"/>
                <path d="M-15,15 Q5,35 25,15" fill="none" stroke="#FFA07A" stroke-width="2" opacity="0.8"/>
                <text x="0" y="55" text-anchor="middle" font-size="11" fill="#2C3E50" font-weight="600">Nucleus</text>
            </g>

            <!-- Mitochondria (Site of Respiration) -->
            <g class="mito" transform="translate(-30, 30)">
                <!-- Outer Membrane -->
                <path d="M-45,0 C-45,-25 45,-25 45,0 C45,25 -45,25 -45,0 Z" fill="#E74C3C"/>
                <!-- Inner Membrane (Cristae) -->
                <path d="M-35,0 L-25,-12 L-15,12 L-5,-12 L5,12 L15,-12 L25,12 L35,0" fill="none" stroke="#F5B041" stroke-width="2.5" stroke-linejoin="round"/>
                <text x="0" y="40" text-anchor="middle" font-size="11" fill="#E74C3C" font-weight="600">Mitochondrion</text>
            </g>
        </g>

        <!-- Process 1: Ingestion & Digestion (Extracellular) -->
        <g transform="translate(120, 360)">
            <!-- Complex Organic Matter -->
            <g class="complex-matter">
                <!-- Proteins / Polysaccharides -->
                <path d="M-20,-30 L10,-15 L5,20 L-25,25 L-40,0 Z" fill="#98D8C8" stroke="#16A085" stroke-width="2"/>
                <path d="M10,-15 L40,-20 L45,10 L15,20 Z" fill="#FFA07A" stroke="#E67E22" stroke-width="2"/>
                <circle cx="-25" cy="-15" r="15" fill="#98D8C8" stroke="#16A085" stroke-width="2"/>
                <circle cx="30" cy="20" r="12" fill="#FFA07A" stroke="#E67E22" stroke-width="2"/>
                <circle cx="0" cy="0" r="18" fill="#F39C12" stroke="#D35400" stroke-width="2"/>
            </g>

            <!-- Glucose Molecules (Breakdown products) -->
            <g class="glucose-group">
                <use href="#glucose-hex" x="-15" y="-15" />
                <use href="#glucose-hex" x="15" y="-5" />
                <use href="#glucose-hex" x="0" y="15" />
                <use href="#glucose-hex" x="-20" y="10" />
                <use href="#glucose-hex" x="25" y="15" />
            </g>
        </g>

        <!-- Process Labels -->
        <g transform="translate(120, 450)">
            <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700">1. Ingestion & Digestion</text>
            <text x="0" y="15" text-anchor="middle" font-size="11" fill="#7F8C8D">Complex food broken down</text>
        </g>

        <g transform="translate(350, 450)">
            <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700">2. Absorption</text>
            <text x="0" y="15" text-anchor="middle" font-size="11" fill="#7F8C8D">Nutrients enter animal cell</text>
        </g>

        <g transform="translate(650, 450)">
            <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700">3. Cellular Respiration</text>
            <text x="0" y="15" text-anchor="middle" font-size="11" fill="#7F8C8D">Glucose converted to ATP</text>
        </g>

        <!-- ATP Production (Animated) -->
        <g transform="translate(520, 390)">
            <use href="#atp-star" class="atp1" />
            <use href="#atp-star" class="atp2" />
            <use href="#atp-star" class="atp3" />
        </g>

        <!-- Waste Products (Animated) -->
        <g transform="translate(520, 390)" class="waste">
            <circle cx="-10" cy="0" r="6" fill="#7F8C8D" opacity="0.8"/>
            <text x="-10" y="2" text-anchor="middle" font-size="8" fill="#fff" class="sci-font">CO₂</text>
            
            <circle cx="10" cy="10" r="5" fill="#3498DB" opacity="0.8"/>
            <text x="10" y="12" text-anchor="middle" font-size="6" fill="#fff" class="sci-font">H₂O</text>
        </g>

        <!-- Membrane Crossing Indicator -->
        <path d="M 320 360 L 400 360" stroke="#2ECC71" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)" opacity="0.6"/>


        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(20, 380)">
            <rect x="0" y="0" width="160" height="105" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" opacity="0.95"/>
            <text x="80" y="18" text-anchor="middle" font-size="11" font-weight="700">Key</text>
            
            <!-- Plant Tissue -->
            <rect x="10" y="28" width="12" height="12" fill="#2ECC71" rx="2"/>
            <text x="30" y="38" font-size="10">Plant Tissue</text>
            
            <!-- Animal Tissue -->
            <rect x="10" y="46" width="12" height="12" fill="#F39C12" rx="2"/>
            <text x="30" y="56" font-size="10">Animal Tissue</text>
            
            <!-- Glucose -->
            <use href="#glucose-hex" x="16" y="70" transform="scale(0.8) translate(4, 0)"/>
            <text x="30" y="74" font-size="10">Glucose <tspan class="sci-font" fill="#7F8C8D">(C₆H₁₂O₆)</tspan></text>
            
            <!-- ATP -->
            <use href="#atp-star" x="16" y="88" transform="scale(0.8) translate(4, 0)"/>
            <text x="30" y="92" font-size="10">Energy <tspan class="sci-font" fill="#7F8C8D">(ATP)</tspan></text>
        </g>

    </svg>

</body>
</html>
