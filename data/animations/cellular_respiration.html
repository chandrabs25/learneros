<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Bioenergetics of Cellular Respiration</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cell-membrane: #4A90D9;
            --cytoplasm: #E8F4FD;
            --nucleus: #2C3E50;
            --mitochondrion: #E74C3C;
            --matrix: #FADBD8;
            --glucose: #2ECC71;
            --pyruvate: #27AE60;
            --atp: #F1C40F;
            --o2: #3498DB;
            --co2: #7F8C8D;
            --h2o: #2980B9;
            --text-dark: #2C3E50;
            --arrow: #95A5A6;
        }

        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-dark);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
            text-align: center;
        }

        p.subtitle {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
        }

        /* --- ANIMATIONS --- */
        
        /* 1. Glycolysis (0-3s) */
        .anim-glucose {
            animation: moveGlucose 12s linear infinite;
        }
        @keyframes moveGlucose {
            0% { transform: translate(30px, 250px); opacity: 0; }
            5% { opacity: 1; }
            12.5% { transform: translate(180px, 250px); opacity: 1; }
            12.6%, 100% { opacity: 0; }
        }

        .anim-pyr1 { animation: movePyr1 12s linear infinite; }
        @keyframes movePyr1 {
            0%, 12.4% { opacity: 0; transform: translate(180px, 250px); }
            12.5% { opacity: 1; transform: translate(180px, 250px); }
            25% { transform: translate(260px, 210px); opacity: 1; }
            41.6% { transform: translate(550px, 260px); opacity: 1; }
            41.7%, 100% { opacity: 0; }
        }

        .anim-pyr2 { animation: movePyr2 12s linear infinite; }
        @keyframes movePyr2 {
            0%, 12.4% { opacity: 0; transform: translate(180px, 250px); }
            12.5% { opacity: 1; transform: translate(180px, 250px); }
            25% { transform: translate(260px, 290px); opacity: 1; }
            41.6% { transform: translate(550px, 340px); opacity: 1; }
            41.7%, 100% { opacity: 0; }
        }

        .anim-gly-atp { animation: glyATP 12s ease-out infinite; }
        @keyframes glyATP {
            0%, 12.4% { opacity: 0; transform: translate(180px, 250px) scale(0.5); }
            15% { opacity: 1; transform: translate(var(--endX), var(--endY)) scale(1.2); }
            25%, 100% { opacity: 0; transform: translate(var(--endX), var(--endY)) scale(1.2); }
        }

        /* 2 & 3. Krebs Cycle (5-8s) */
        .anim-krebs { animation: spinKrebs 12s ease-in-out infinite; transform-origin: 680px 300px; }
        @keyframes spinKrebs {
            0%, 41.5% { opacity: 0; transform: rotate(0deg) scale(0.5); }
            45% { opacity: 1; transform: rotate(90deg) scale(1); }
            66.6% { opacity: 1; transform: rotate(360deg) scale(1); }
            68%, 100% { opacity: 0; transform: rotate(400deg) scale(0.5); }
        }

        .anim-co2 { animation: moveCO2 12s ease-in-out infinite; }
        @keyframes moveCO2 {
            0%, 45% { opacity: 0; transform: translate(680px, 300px); }
            50% { opacity: 1; }
            66.6% { opacity: 0; transform: translate(var(--endX), var(--endY)); }
            100% { opacity: 0; }
        }

        .anim-nadh { animation: moveNADH 12s ease-in-out infinite; }
        @keyframes moveNADH {
            0%, 50% { opacity: 0; transform: translate(680px, 300px); }
            55% { opacity: 1; transform: translate(680px, 300px); }
            65% { opacity: 0; transform: translate(var(--endX), var(--endY)); }
            100% { opacity: 0; }
        }

        /* 4. ETC & Chemiosmosis (8-11s) */
        .anim-o2 { animation: moveO2 12s ease-in-out infinite; }
        @keyframes moveO2 {
            0%, 60% { opacity: 0; transform: translate(var(--startX), var(--startY)); }
            65% { opacity: 1; }
            75% { opacity: 0; transform: translate(var(--endX), var(--endY)); }
            100% { opacity: 0; }
        }

        .cristae-membrane { animation: pulseCristae 12s ease-in-out infinite; }
        @keyframes pulseCristae {
            0%, 66.5% { filter: drop-shadow(0 0 0px var(--atp)); stroke: #C0392B; stroke-width: 4; }
            70%, 80%, 90% { filter: drop-shadow(0 0 12px var(--atp)); stroke: var(--atp); stroke-width: 6; }
            75%, 85% { filter: drop-shadow(0 0 3px var(--atp)); stroke: #C0392B; stroke-width: 4; }
            95%, 100% { filter: drop-shadow(0 0 0px var(--atp)); stroke: #C0392B; stroke-width: 4; }
        }

        .anim-etc-atp { animation: etcATP 12s ease-out infinite; }
        @keyframes etcATP {
            0%, 74.9% { opacity: 0; transform: translate(var(--startX), var(--startY)) scale(0.1); }
            75% { opacity: 1; transform: translate(var(--startX), var(--startY)) scale(0.8); }
            91.6% { opacity: 0; transform: translate(var(--endX), var(--endY)) scale(1.5); }
            100% { opacity: 0; }
        }

        .anim-h2o { animation: moveH2O 12s ease-in-out infinite; }
        @keyframes moveH2O {
            0%, 75% { opacity: 0; transform: translate(var(--startX), var(--startY)); }
            80% { opacity: 1; }
            95%, 100% { opacity: 0; transform: translate(var(--endX), var(--endY)); }
        }

    </style>
</head>
<body>

    <h1>Cellular Respiration: Aerobic Catabolism</h1>
    <p class="subtitle">The Bioenergetics of converting Glucose into ATP</p>

    <div class="svg-container">
        <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
            <title id="svg-title">Animated Diagram of Cellular Respiration</title>
            <desc id="svg-desc">A biological animation showing Glycolysis in the cytoplasm, followed by the Krebs Cycle and Electron Transport Chain inside the mitochondrion, converting Glucose and Oxygen into ATP, Carbon Dioxide, and Water.</desc>

            <defs>
                <!-- Filters -->
                <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
                    <feDropShadow dx="5" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
                </filter>
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="4" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>

                <!-- Markers -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)" />
                </marker>

                <!-- Symbols -->
                <g id="glucose">
                    <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="var(--glucose)" stroke="#27AE60" stroke-width="2"/>
                    <text x="0" y="4" font-family="Inter" font-size="12" fill="#fff" text-anchor="middle" font-weight="bold">G</text>
                </g>
                
                <g id="pyruvate">
                    <polygon points="0,-14 13,-4 8,12 -8,12 -13,-4" fill="var(--pyruvate)" stroke="#1E8449" stroke-width="2"/>
                    <text x="0" y="4" font-family="Inter" font-size="10" fill="#fff" text-anchor="middle" font-weight="bold">P</text>
                </g>

                <g id="atp">
                    <path d="M0,-18 L4,-6 L17,-5 L7,4 L11,16 L0,8 L-11,16 L-7,4 L-17,-5 L-4,-6 Z" fill="var(--atp)" stroke="#F39C12" stroke-width="1" filter="url(#glow)"/>
                </g>

                <g id="o2">
                    <circle cx="-6" cy="0" r="7" fill="var(--o2)"/>
                    <circle cx="6" cy="0" r="7" fill="var(--o2)"/>
                </g>

                <g id="co2">
                    <circle cx="0" cy="0" r="8" fill="var(--co2)"/>
                </g>

                <g id="h2o">
                    <circle cx="0" cy="0" r="7" fill="var(--h2o)"/>
                    <circle cx="-6" cy="6" r="4" fill="#fff"/>
                    <circle cx="6" cy="6" r="4" fill="#fff"/>
                </g>

                <g id="nadh">
                    <circle cx="0" cy="0" r="4" fill="#00FFFF" filter="url(#glow)"/>
                </g>
            </defs>

            <!-- BACKGROUND / CELL -->
            <rect x="20" y="20" width="960" height="560" rx="40" fill="var(--cytoplasm)" stroke="var(--cell-membrane)" stroke-width="4" stroke-dasharray="15,8" />
            
            <!-- Partial Nucleus -->
            <path d="M 20 150 Q 120 300 20 450 Z" fill="var(--nucleus)" opacity="0.9"/>
            <text x="35" y="300" font-size="14" fill="#fff" font-weight="600" transform="rotate(-90 35 300)" text-anchor="middle">NUCLEUS</text>

            <!-- MITOCHONDRION -->
            <g filter="url(#shadow)">
                <!-- Outer Membrane -->
                <rect x="420" y="100" width="520" height="400" rx="140" fill="var(--mitochondrion)" stroke="#C0392B" stroke-width="4"/>
                
                <!-- Inner Membrane (Cristae) & Matrix -->
                <path class="cristae-membrane" d="
                    M 450 300 
                    Q 450 180 500 180
                    L 500 260 L 520 260 L 520 160
                    L 550 160 L 550 270 L 570 270 L 570 150
                    L 600 150 L 600 280 L 620 280 L 620 150
                    L 650 150 L 650 280 L 670 280 L 670 150
                    L 700 150 L 700 280 L 720 280 L 720 150
                    L 750 150 L 750 270 L 770 270 L 770 160
                    L 800 160 L 800 260 L 820 260 L 820 180
                    Q 910 180 910 300
                    Q 910 420 820 420
                    L 820 340 L 800 340 L 800 440
                    L 770 440 L 770 330 L 750 330 L 750 450
                    L 720 450 L 720 320 L 700 320 L 700 450
                    L 670 450 L 670 320 L 650 320 L 650 450
                    L 620 450 L 620 320 L 600 320 L 600 450
                    L 570 450 L 570 330 L 550 330 L 550 440
                    L 520 440 L 520 340 L 500 340 L 500 420
                    Q 450 420 450 300 Z" 
                    fill="var(--matrix)" stroke="#C0392B" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
            </g>

            <!-- STATIC LABELS & ARROWS -->
            <!-- Glycolysis -->
            <text x="220" y="130" font-size="20" font-weight="700" fill="var(--text-dark)" text-anchor="middle">Glycolysis</text>
            <text x="220" y="150" font-size="14" font-weight="400" fill="#555" text-anchor="middle">(Cytoplasm)</text>
            <path d="M 120 250 L 200 250" stroke="var(--arrow)" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>
            <path d="M 280 250 L 400 250" stroke="var(--arrow)" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowhead)"/>

            <!-- Krebs Cycle -->
            <text x="680" y="210" font-size="20" font-weight="700" fill="var(--text-dark)" text-anchor="middle">Krebs Cycle</text>
            <text x="680" y="230" font-size="14" font-weight="400" fill="#555" text-anchor="middle">(Matrix)</text>
            
            <!-- ETC -->
            <text x="680" y="510" font-size="20" font-weight="700" fill="var(--text-dark)" text-anchor="middle">Electron Transport Chain</text>
            <text x="680" y="530" font-size="14" font-weight="400" fill="#555" text-anchor="middle">(Inner Membrane / Cristae)</text>

            <!-- Electron Carriers Arrow -->
            <path d="M 680 340 L 680 430" stroke="var(--arrow)" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowhead)"/>
            <text x="690" y="390" font-size="12" font-weight="600" fill="#555">NADH / FADH₂</text>

            <!-- Inputs/Outputs Static Text -->
            <text x="80" y="290" class="formula" font-size="14" fill="var(--glucose)">C<tspan dy="4" font-size="10">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="10">12</tspan><tspan dy="-4">O</tspan><tspan dy="4" font-size="10">6</tspan></text>
            <text x="910" y="560" class="formula" font-size="14" fill="var(--o2)">6O<tspan dy="4" font-size="10">2</tspan> (In)</text>
            <text x="880" y="70" class="formula" font-size="14" fill="var(--co2)">6CO<tspan dy="4" font-size="10">2</tspan> (Out)</text>
            <text x="910" y="450" class="formula" font-size="14" fill="var(--h2o)">6H<tspan dy="4" font-size="10">2</tspan><tspan dy="-4">O (Out)</tspan></text>

            <!-- ANIMATED ELEMENTS -->
            <!-- Stage 1: Glycolysis -->
            <use href="#glucose" class="anim-glucose" />
            <use href="#pyruvate" class="anim-pyr1" />
            <use href="#pyruvate" class="anim-pyr2" />
            <use href="#atp" class="anim-gly-atp" style="--endX: 200px; --endY: 160px;" />
            <use href="#atp" class="anim-gly-atp" style="--endX: 240px; --endY: 180px;" />

            <!-- Stage 3: Krebs Cycle -->
            <g class="anim-krebs">
                <path d="M 0 -35 A 35 35 0 1 1 -35 0" fill="none" stroke="var(--arrow)" stroke-width="4"/>
                <polygon points="-35,-12 -25,3 -45,3" fill="var(--arrow)"/>
            </g>
            
            <!-- CO2 leaving -->
            <use href="#co2" class="anim-co2" style="--endX: 850px; --endY: 60px; animation-delay: 0s;" />
            <use href="#co2" class="anim-co2" style="--endX: 920px; --endY: 90px; animation-delay: 0.3s;" />
            <use href="#co2" class="anim-co2" style="--endX: 880px; --endY: 120px; animation-delay: 0.6s;" />

            <!-- NADH moving to ETC -->
            <use href="#nadh" class="anim-nadh" style="--endX: 620px; --endY: 450px; animation-delay: 0s;" />
            <use href="#nadh" class="anim-nadh" style="--endX: 720px; --endY: 450px; animation-delay: 0.2s;" />
            <use href="#nadh" class="anim-nadh" style="--endX: 520px; --endY: 420px; animation-delay: 0.4s;" />
            <use href="#nadh" class="anim-nadh" style="--endX: 820px; --endY: 420px; animation-delay: 0.6s;" />

            <!-- Stage 4: ETC & Chemiosmosis -->
            <!-- O2 entering -->
            <use href="#o2" class="anim-o2" style="--startX: 950px; --startY: 550px; --endX: 750px; --endY: 420px; animation-delay: 0s;" />
            <use href="#o2" class="anim-o2" style="--startX: 900px; --startY: 580px; --endX: 650px; --endY: 440px; animation-delay: 0.3s;" />
            <use href="#o2" class="anim-o2" style="--startX: 850px; --startY: 560px; --endX: 550px; --endY: 420px; animation-delay: 0.6s;" />

            <!-- H2O leaving -->
            <use href="#h2o" class="anim-h2o" style="--startX: 750px; --startY: 420px; --endX: 950px; --endY: 450px; animation-delay: 0s;" />
            <use href="#h2o" class="anim-h2o" style="--startX: 650px; --startY: 440px; --endX: 900px; --endY: 480px; animation-delay: 0.3s;" />
            <use href="#h2o" class="anim-h2o" style="--startX: 550px; --startY: 420px; --endX: 850px; --endY: 520px; animation-delay: 0.6s;" />

            <!-- Massive ATP Swarm (32-34 ATP represented by 15 starbursts) -->
            <!-- Left side of cristae -->
            <use href="#atp" class="anim-etc-atp" style="--startX: 500px; --startY: 260px; --endX: 150px; --endY: 100px; animation-delay: 0.0s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 520px; --startY: 340px; --endX: 100px; --endY: 200px; animation-delay: 0.2s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 550px; --startY: 160px; --endX: 200px; --endY: 80px;  animation-delay: 0.4s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 570px; --startY: 450px; --endX: 150px; --endY: 450px; animation-delay: 0.1s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 600px; --startY: 280px; --endX: 250px; --endY: 150px; animation-delay: 0.5s;" />
            <!-- Center of cristae -->
            <use href="#atp" class="anim-etc-atp" style="--startX: 650px; --startY: 150px; --endX: 300px; --endY: 50px;  animation-delay: 0.3s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 670px; --startY: 450px; --endX: 250px; --endY: 500px; animation-delay: 0.6s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 700px; --startY: 280px; --endX: 350px; --endY: 100px; animation-delay: 0.2s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 720px; --startY: 150px; --endX: 400px; --endY: 60px;  animation-delay: 0.7s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 750px; --startY: 450px; --endX: 350px; --endY: 520px; animation-delay: 0.4s;" />
            <!-- Right side of cristae -->
            <use href="#atp" class="anim-etc-atp" style="--startX: 770px; --startY: 270px; --endX: 450px; --endY: 150px; animation-delay: 0.1s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 800px; --startY: 160px; --endX: 500px; --endY: 80px;  animation-delay: 0.5s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 820px; --startY: 420px; --endX: 450px; --endY: 480px; animation-delay: 0.8s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 850px; --startY: 300px; --endX: 550px; --endY: 100px; animation-delay: 0.3s;" />
            <use href="#atp" class="anim-etc-atp" style="--startX: 880px; --startY: 250px; --endX: 600px; --endY: 80px;  animation-delay: 0.6s;" />

            <!-- LEGEND -->
            <rect x="40" y="530" width="920" height="50" rx="10" fill="#ffffff" stroke="#ddd" stroke-width="1" opacity="0.95"/>
            <text x="60" y="560" font-size="14" font-weight="700" fill="var(--text-dark)">Key:</text>
            
            <use href="#glucose" x="120" y="555" transform="scale(0.8) translate(30, 0)" />
            <text x="140" y="560" font-size="12" fill="#555">Glucose</text>

            <use href="#pyruvate" x="210" y="555" transform="scale(0.8) translate(50, 0)" />
            <text x="230" y="560" font-size="12" fill="#555">Pyruvate</text>

            <use href="#atp" x="300" y="555" transform="scale(0.8) translate(80, 0)" />
            <text x="320" y="560" font-size="12" fill="#555">ATP (Energy)</text>

            <use href="#o2" x="420" y="555" transform="scale(0.8) translate(110, 0)" />
            <text x="440" y="560" font-size="12" fill="#555">Oxygen (O₂)</text>

            <use href="#co2" x="530" y="555" transform="scale(0.8) translate(140, 0)" />
            <text x="550" y="560" font-size="12" fill="#555">Carbon Dioxide (CO₂)</text>

            <use href="#h2o" x="690" y="555" transform="scale(0.8) translate(170, 0)" />
            <text x="710" y="560" font-size="12" fill="#555">Water (H₂O)</text>

            <use href="#nadh" x="800" y="555" transform="scale(0.8) translate(200, 0)" />
            <text x="820" y="560" font-size="12" fill="#555">NADH/FADH₂</text>

        </svg>
    </div>

</body>
</html>
