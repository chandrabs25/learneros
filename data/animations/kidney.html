<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Adrenal-Renal Interface: Anatomy and Catecholamine Secretion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2C3E50;
        }

        .header-container {
            text-align: center;
            margin-bottom: 2rem;
            max-width: 800px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            color: #2C3E50;
        }

        p.subtitle {
            font-size: 1rem;
            color: #555;
            margin: 0;
            line-height: 1.5;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e9ecef;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- CSS Animations --- */
        
        /* Continuous Blood Flow */
        .blood-flow-vein {
            stroke-dasharray: 12 12;
            animation: flowLeft 1.5s linear infinite;
        }
        
        .blood-flow-artery {
            stroke-dasharray: 12 12;
            animation: flowRight 1.5s linear infinite;
        }

        @keyframes flowLeft {
            to { stroke-dashoffset: 24; }
        }

        @keyframes flowRight {
            to { stroke-dashoffset: -24; }
        }

        /* Neural Impulse (Lightning) */
        .neural-impulse {
            stroke-dasharray: 200;
            stroke-dashoffset: 200;
            animation: neuralFlash 8s linear infinite;
        }

        @keyframes neuralFlash {
            0%, 22% { stroke-dashoffset: 200; opacity: 1; filter: drop-shadow(0 0 0px #F1C40F); }
            26% { stroke-dashoffset: 0; opacity: 1; filter: drop-shadow(0 0 6px #F1C40F); }
            32%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }

        /* Adrenal Medulla Pulsing */
        .medulla {
            transform-origin: 460px 110px;
            animation: medullaPulse 8s ease-in-out infinite;
        }

        @keyframes medullaPulse {
            0%, 25% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,179,71,0)); }
            28%, 45% { transform: scale(1.06); filter: drop-shadow(0 0 15px rgba(255,215,0,0.8)); }
            55%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(255,179,71,0)); }
        }

        /* Hormone Label Fade In/Out */
        .hormone-label {
            animation: fadeInOut 8s ease-in-out infinite;
        }

        @keyframes fadeInOut {
            0%, 35% { opacity: 0; transform: translateY(5px); }
            42%, 85% { opacity: 1; transform: translateY(0); }
            92%, 100% { opacity: 0; transform: translateY(-5px); }
        }

        /* Interactive Hover Effects */
        .interactive-group {
            transition: opacity 0.3s ease;
        }
        .interactive-group:hover {
            opacity: 0.85;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>The Adrenal-Renal Interface</h1>
        <p class="subtitle">Anatomical relationship and the "Fight or Flight" response. Watch the sympathetic nervous system trigger the adrenal medulla to secrete catecholamines directly into the bloodstream.</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of the kidney and adrenal gland showing hormone secretion">
            
            <title>Adrenal Gland Stress Response Mechanism</title>
            <desc>An animated biological diagram showing a neural impulse triggering the adrenal medulla to release catecholamines into the renal vein.</desc>

            <!-- Definitions for Gradients, Filters, and Paths -->
            <defs>
                <!-- Kidney Gradient -->
                <radialGradient id="kidneyGrad" cx="40%" cy="40%" r="70%">
                    <stop offset="0%" stop-color="#F5B041"/>
                    <stop offset="80%" stop-color="#E67E22"/>
                    <stop offset="100%" stop-color="#D35400"/>
                </radialGradient>

                <!-- Vessel Gradients -->
                <linearGradient id="arteryGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#E74C3C"/>
                    <stop offset="100%" stop-color="#C0392B"/>
                </linearGradient>
                
                <linearGradient id="veinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3498DB"/>
                    <stop offset="100%" stop-color="#2980B9"/>
                </linearGradient>

                <!-- Adrenal Gradients -->
                <linearGradient id="cortexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E59866"/>
                    <stop offset="100%" stop-color="#D35400"/>
                </linearGradient>

                <!-- Glow Filter for Hormones -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2.5" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Pointer Marker -->
                <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5">
                    <circle cx="5" cy="5" r="3" fill="#7F8C8D"/>
                </marker>

                <!-- Hormone Animation Path -->
                <path id="hormone-path" d="M 460 130 C 460 200, 380 220, 380 330 L 80 330" fill="none" stroke="none"/>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f8f9fa" />

            <!-- ================= VASCULAR SYSTEM ================= -->
            <g id="vascular-system" class="interactive-group">
                <!-- Renal Artery (Behind Vein) -->
                <path d="M 80 250 L 410 250 C 420 250, 425 260, 425 270 C 425 280, 420 290, 410 290 L 80 290 Z" fill="url(#arteryGrad)" stroke="#A93226" stroke-width="1.5"/>
                <!-- Artery Blood Flow -->
                <path d="M 80 270 L 410 270" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" class="blood-flow-artery"/>
                
                <!-- Adrenal Artery Branch -->
                <path d="M 400 250 C 400 200, 430 180, 430 140 L 435 140 C 435 180, 405 200, 405 250 Z" fill="url(#arteryGrad)" stroke="#A93226" stroke-width="1"/>

                <!-- Renal Vein (Anterior) -->
                <path d="M 80 300 L 400 300 C 415 300, 420 320, 420 340 C 420 350, 410 360, 400 360 L 80 360 Z" fill="url(#veinGrad)" stroke="#1F618D" stroke-width="1.5"/>
                <!-- Vein Blood Flow -->
                <path d="M 400 330 L 80 330" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2" class="blood-flow-vein"/>

                <!-- Adrenal Vein (Draining Medulla) -->
                <path d="M 455 130 C 455 200, 375 220, 375 300 L 385 300 C 385 220, 465 200, 465 130 Z" fill="url(#veinGrad)" stroke="#1F618D" stroke-width="1"/>
            </g>

            <!-- ================= KIDNEY ================= -->
            <g id="kidney" class="interactive-group">
                <!-- Main Kidney Body -->
                <path d="M 450 140 C 550 140, 620 220, 620 320 C 620 420, 550 480, 450 480 C 400 480, 420 400, 420 360 C 420 320, 380 280, 420 240 C 420 200, 400 140, 450 140 Z" 
                      fill="url(#kidneyGrad)" stroke="#B9770E" stroke-width="2"/>
                
                <!-- Renal Pyramids (Internal Detail) -->
                <g opacity="0.35" fill="#A04000" stroke="#873600" stroke-width="1">
                    <path d="M 460 170 L 500 180 L 480 220 Z"/>
                    <path d="M 520 200 L 560 240 L 520 270 Z"/>
                    <path d="M 540 300 L 580 340 L 530 360 Z"/>
                    <path d="M 500 390 L 540 430 L 480 430 Z"/>
                    <path d="M 450 410 L 470 460 L 430 450 Z"/>
                </g>

                <!-- Minor Calyces (Connecting Pyramids to Hilum) -->
                <g stroke="#F5CBA7" stroke-width="3" fill="none" opacity="0.6">
                    <path d="M 480 220 L 430 280"/>
                    <path d="M 520 270 L 430 300"/>
                    <path d="M 530 360 L 430 320"/>
                    <path d="M 480 430 L 430 340"/>
                    <path d="M 450 410 L 420 350"/>
                </g>
            </g>

            <!-- ================= ADRENAL GLAND ================= -->
            <g id="adrenal-gland" class="interactive-group">
                <!-- Adrenal Cortex (Outer Layer) -->
                <path d="M 410 130 C 410 90, 440 60, 460 60 C 480 60, 510 100, 500 140 C 480 150, 430 150, 410 130 Z" 
                      fill="url(#cortexGrad)" stroke="#A04000" stroke-width="2"/>
                
                <!-- Adrenal Medulla (Inner Core) -->
                <path class="medulla" d="M 435 125 C 440 100, 455 90, 465 90 C 475 90, 485 110, 480 130 C 465 135, 445 135, 435 125 Z" 
                      fill="#FFB347" stroke="#D35400" stroke-width="1.5"/>
            </g>

            <!-- ================= ANIMATION ELEMENTS ================= -->
            
            <!-- Neural Impulse (Lightning Bolt) -->
            <path d="M 460 10 L 450 40 L 470 50 L 455 80 L 465 90 L 460 115" 
                  fill="none" stroke="#F1C40F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="neural-impulse"/>

            <!-- Catecholamine Hormones (Gold Particles) -->
            <g id="hormones">
                <!-- Particle 1 -->
                <circle r="4" fill="#FFD700" filter="url(#glow)" opacity="0">
                    <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0; 0.375; 0.625; 0.875; 1" keyPoints="0; 0; 0.4; 1; 1" calcMode="linear">
                        <mpath href="#hormone-path"/>
                    </animateMotion>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.37; 0.38; 0.82; 0.875; 1" dur="8s" repeatCount="indefinite"/>
                </circle>
                
                <!-- Particle 2 -->
                <circle r="4" fill="#FFD700" filter="url(#glow)" opacity="0">
                    <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0; 0.400; 0.650; 0.900; 1" keyPoints="0; 0; 0.4; 1; 1" calcMode="linear">
                        <mpath href="#hormone-path"/>
                    </animateMotion>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.39; 0.40; 0.85; 0.900; 1" dur="8s" repeatCount="indefinite"/>
                </circle>

                <!-- Particle 3 -->
                <circle r="4" fill="#FFD700" filter="url(#glow)" opacity="0">
                    <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0; 0.425; 0.675; 0.925; 1" keyPoints="0; 0; 0.4; 1; 1" calcMode="linear">
                        <mpath href="#hormone-path"/>
                    </animateMotion>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.41; 0.42; 0.87; 0.925; 1" dur="8s" repeatCount="indefinite"/>
                </circle>

                <!-- Particle 4 -->
                <circle r="4" fill="#FFD700" filter="url(#glow)" opacity="0">
                    <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0; 0.450; 0.700; 0.950; 1" keyPoints="0; 0; 0.4; 1; 1" calcMode="linear">
                        <mpath href="#hormone-path"/>
                    </animateMotion>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.44; 0.45; 0.90; 0.950; 1" dur="8s" repeatCount="indefinite"/>
                </circle>

                <!-- Particle 5 -->
                <circle r="4" fill="#FFD700" filter="url(#glow)" opacity="0">
                    <animateMotion dur="8s" repeatCount="indefinite" keyTimes="0; 0.475; 0.725; 0.975; 1" keyPoints="0; 0; 0.4; 1; 1" calcMode="linear">
                        <mpath href="#hormone-path"/>
                    </animateMotion>
                    <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.46; 0.47; 0.92; 0.975; 1" dur="8s" repeatCount="indefinite"/>
                </circle>
            </g>

            <!-- ================= LABELS & ANNOTATIONS ================= -->
            <g id="labels" font-family="'Inter', sans-serif" font-size="13" fill="#2C3E50">
                
                <!-- Kidney Label -->
                <polyline points="550,380 650,380" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-start="url(#dot)"/>
                <text x="658" y="375" font-weight="700" font-size="15">Kidney</text>
                <text x="658" y="392" font-style="italic" font-size="11" fill="#7F8C8D">Ren</text>

                <!-- Adrenal Cortex Label -->
                <polyline points="495,120 650,120" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-start="url(#dot)"/>
                <text x="658" y="116" font-weight="600">Adrenal Cortex</text>
                <text x="658" y="132" font-size="11" fill="#7F8C8D">Produces corticosteroids</text>

                <!-- Adrenal Medulla Label -->
                <polyline points="465,110 520,80 650,80" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-start="url(#dot)"/>
                <text x="658" y="76" font-weight="600">Adrenal Medulla</text>
                <text x="658" y="92" font-size="11" fill="#7F8C8D">Inner core; secretes hormones</text>

                <!-- Neural Impulse Label -->
                <polyline points="465,40 500,30 650,30" stroke="#7F8C8D" stroke-width="1.5" fill="none"/>
                <text x="658" y="26" font-weight="600" fill="#D4AC0D">Sympathetic Nerve</text>
                <text x="658" y="42" font-size="11" fill="#7F8C8D">Triggers stress response</text>

                <!-- Renal Artery Label -->
                <polyline points="250,270 150,220" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-start="url(#dot)"/>
                <text x="142" y="215" text-anchor="end" font-weight="600">Renal Artery</text>
                <text x="142" y="231" text-anchor="end" font-size="11" fill="#7F8C8D">Oxygenated blood</text>

                <!-- Renal Vein Label -->
                <polyline points="250,330 150,390" stroke="#7F8C8D" stroke-width="1.5" fill="none" marker-start="url(#dot)"/>
                <text x="142" y="385" text-anchor="end" font-weight="600">Renal Vein</text>
                <text x="142" y="401" text-anchor="end" font-size="11" fill="#7F8C8D">Deoxygenated blood</text>

                <!-- Dynamic Process Label (Catecholamines) -->
                <g class="hormone-label">
                    <rect x="180" y="380" width="220" height="45" rx="6" fill="rgba(255, 255, 255, 0.9)" stroke="#F1C40F" stroke-width="1.5"/>
                    <text x="290" y="400" text-anchor="middle" font-weight="700" fill="#B7950B">Catecholamines</text>
                    <text x="290" y="416" text-anchor="middle" font-family="'Roboto Mono', monospace" font-size="10" fill="#7F8C8D">Adrenaline / Noradrenaline</text>
                </g>
            </g>

            <!-- ================= LEGEND ================= -->
            <g id="legend" transform="translate(600, 410)">
                <rect width="170" height="75" rx="8" fill="#ffffff" stroke="#e9ecef" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
                <text x="15" y="20" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#2C3E50">KEY</text>
                
                <!-- Artery -->
                <rect x="15" y="30" width="12" height="12" rx="2" fill="#E74C3C"/>
                <text x="35" y="40" font-family="'Inter', sans-serif" font-size="11" fill="#555">Arterial Blood</text>
                
                <!-- Vein -->
                <rect x="15" y="50" width="12" height="12" rx="2" fill="#3498DB"/>
                <text x="35" y="60" font-family="'Inter', sans-serif" font-size="11" fill="#555">Venous Blood</text>
                
                <!-- Hormone -->
                <circle cx="125" cy="36" r="5" fill="#FFD700" filter="url(#glow)"/>
                <text x="110" y="55" font-family="'Inter', sans-serif" font-size="10" fill="#555">Hormones</text>
            </g>

        </svg>
    </div>

</body>
</html>
