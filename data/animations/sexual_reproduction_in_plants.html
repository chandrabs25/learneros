<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexual Reproduction in Angiosperms: Double Fertilization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 1000px;
            width: 100%;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }

        .mono {
            font-family: 'Roboto Mono', monospace;
        }

        /* Animations */
        .pollen-grain {
            transform-origin: 300px 75px;
            animation: pollenLand 14s infinite ease-out;
        }

        .pollen-tube {
            stroke-dasharray: 450;
            stroke-dashoffset: 450;
            animation: growTube 14s infinite ease-in-out;
        }

        .gamete1 {
            offset-path: path('M 300 75 L 300 260 C 300 310, 365 310, 365 370 C 365 430, 320 445, 300 445 C 285 445, 285 425, 300 410 L 300 392');
            animation: moveG1 14s infinite ease-in-out;
        }

        .gamete2 {
            offset-path: path('M 300 75 L 300 260 C 300 310, 365 310, 365 370 C 365 430, 320 445, 300 445 C 285 445, 285 425, 300 410 L 300 392 L 300 365');
            animation: moveG2 14s infinite ease-in-out;
        }

        .egg-cell {
            transform-origin: 300px 392px;
            animation: fertilizeEgg 14s infinite ease-in-out;
        }

        .polar-nuclei {
            transform-origin: 300px 365px;
            animation: fertilizePolar 14s infinite ease-in-out;
        }

        /* Label Animations */
        .label-pollen { animation: showLabelPollen 14s infinite ease-in-out; }
        .label-tube { animation: showLabelTube 14s infinite ease-in-out; }
        .label-gametes { animation: showLabelGametes 14s infinite ease-in-out; }
        .label-syngamy { animation: showLabelSyngamy 14s infinite ease-in-out; }
        .label-triple { animation: showLabelTriple 14s infinite ease-in-out; }

        /* Keyframes */
        @keyframes pollenLand {
            0% { opacity: 0; transform: translateY(-25px) scale(0.8); }
            5% { opacity: 1; transform: translateY(0) scale(1.2); }
            8%, 90% { opacity: 1; transform: translateY(0) scale(1); }
            95%, 100% { opacity: 0; transform: translateY(0) scale(1); }
        }

        @keyframes growTube {
            0%, 14% { stroke-dashoffset: 450; opacity: 0; }
            15% { opacity: 1; stroke-dashoffset: 450; }
            50%, 90% { stroke-dashoffset: 0; opacity: 1; }
            95%, 100% { stroke-dashoffset: 450; opacity: 0; }
        }

        @keyframes moveG1 {
            0%, 21% { offset-distance: 0%; opacity: 0; }
            22% { opacity: 1; offset-distance: 0%; }
            64% { offset-distance: 100%; opacity: 1; }
            65%, 100% { opacity: 0; offset-distance: 100%; }
        }

        @keyframes moveG2 {
            0%, 25% { offset-distance: 0%; opacity: 0; }
            26% { opacity: 1; offset-distance: 0%; }
            71% { offset-distance: 100%; opacity: 1; }
            72%, 100% { opacity: 0; offset-distance: 100%; }
        }

        @keyframes fertilizeEgg {
            0%, 63% { fill: #2C3E50; transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
            64%, 90% { fill: #FF6B6B; transform: scale(1.3); filter: drop-shadow(0 0 6px rgba(255, 107, 107, 0.6)); }
            95%, 100% { fill: #2C3E50; transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
        }

        @keyframes fertilizePolar {
            0%, 70% { fill: #2C3E50; transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
            71%, 90% { fill: #FF6B6B; transform: scale(1.3); filter: drop-shadow(0 0 6px rgba(255, 107, 107, 0.6)); }
            95%, 100% { fill: #2C3E50; transform: scale(1); filter: drop-shadow(0 0 0px transparent); }
        }

        @keyframes showLabelPollen {
            0%, 2% { opacity: 0; transform: translateX(10px); }
            5%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }

        @keyframes showLabelTube {
            0%, 14% { opacity: 0; transform: translateX(10px); }
            17%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }

        @keyframes showLabelGametes {
            0%, 21% { opacity: 0; transform: translateX(10px); }
            24%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }

        @keyframes showLabelTriple {
            0%, 70% { opacity: 0; transform: translateX(10px); }
            73%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }

        @keyframes showLabelSyngamy {
            0%, 63% { opacity: 0; transform: translateX(10px); }
            66%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" aria-label="Animated diagram of Double Fertilization in Angiosperms">
        <title>Sexual Reproduction in Angiosperms: Double Fertilization</title>
        <desc>An animation showing a pollen tube growing down the style of a carpel, delivering two male gametes to the embryo sac. One fertilizes the egg cell, and the other fertilizes the polar nuclei.</desc>

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#2C3E50">Sexual Reproduction in Angiosperms: Double Fertilization</text>

        <!-- CARPEL STRUCTURE -->
        <!-- Main Carpel Outline (Stigma, Style, Ovary) -->
        <path d="M 280 80 C 280 60, 320 60, 320 80 C 320 95, 310 105, 310 130 L 310 260 C 350 280, 380 320, 380 370 C 380 420, 340 460, 300 460 C 260 460, 220 420, 220 370 C 220 320, 250 280, 290 260 L 290 130 C 290 105, 280 95, 280 80 Z" 
              fill="#2ECC71" fill-opacity="0.15" stroke="#27AE60" stroke-width="3"/>

        <!-- Ovule (Outer Integument) -->
        <path d="M 290 430 C 250 420, 240 350, 270 320 C 300 290, 340 300, 350 340 C 360 380, 340 420, 310 430" 
              fill="#2ECC71" fill-opacity="0.25" stroke="#27AE60" stroke-width="2"/>
              
        <!-- Ovule (Inner Integument) -->
        <path d="M 293 422 C 260 415, 252 355, 275 330 C 298 305, 330 312, 340 342 C 350 372, 335 410, 307 422" 
              fill="#2ECC71" fill-opacity="0.3" stroke="#27AE60" stroke-width="1.5" stroke-dasharray="4 2"/>

        <!-- Embryo Sac -->
        <ellipse cx="300" cy="365" rx="28" ry="40" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>

        <!-- EMBRYO SAC CELLS (Unfertilized State) -->
        <!-- Antipodal Cells (Chalazal end) -->
        <circle cx="285" cy="335" r="4.5" fill="#2C3E50" opacity="0.8"/>
        <circle cx="300" cy="332" r="4.5" fill="#2C3E50" opacity="0.8"/>
        <circle cx="315" cy="335" r="4.5" fill="#2C3E50" opacity="0.8"/>

        <!-- Synergid Cells (Micropylar end) -->
        <circle cx="286" cy="394" r="5" fill="#2C3E50" opacity="0.8"/>
        <circle cx="314" cy="394" r="5" fill="#2C3E50" opacity="0.8"/>

        <!-- Polar Nuclei (Central Cell) -->
        <g class="polar-nuclei">
            <circle cx="294" cy="365" r="6" fill="#2C3E50"/>
            <circle cx="306" cy="365" r="6" fill="#2C3E50"/>
        </g>

        <!-- Egg Cell -->
        <circle cx="300" cy="392" r="7.5" fill="#2C3E50" class="egg-cell"/>

        <!-- ANIMATED ELEMENTS -->
        <!-- Pollen Tube -->
        <path d="M 300 75 L 300 260 C 300 310, 365 310, 365 370 C 365 430, 320 445, 300 445 C 285 445, 285 425, 300 410 L 300 395" 
              fill="none" stroke="#F1C40F" stroke-width="6" stroke-linecap="round" class="pollen-tube"/>

        <!-- Male Gametes (Sperm Cells) -->
        <circle cx="0" cy="0" r="4.5" fill="#2C3E50" stroke="#f8f9fa" stroke-width="1" class="gamete1"/>
        <circle cx="0" cy="0" r="4.5" fill="#2C3E50" stroke="#f8f9fa" stroke-width="1" class="gamete2"/>

        <!-- Pollen Grain -->
        <circle cx="300" cy="75" r="9" fill="#F1C40F" class="pollen-grain"/>

        <!-- STATIC LABELS (Left Side) -->
        <g font-size="14" font-weight="600" fill="#2C3E50" text-anchor="end">
            <text x="190" y="85">Stigma</text>
            <path d="M 200 80 L 270 80" stroke="#2C3E50" stroke-width="1" opacity="0.4"/>

            <text x="190" y="185">Style</text>
            <path d="M 200 180 L 290 180" stroke="#2C3E50" stroke-width="1" opacity="0.4"/>

            <text x="190" y="325">Ovary</text>
            <path d="M 200 320 L 240 320" stroke="#2C3E50" stroke-width="1" opacity="0.4"/>

            <text x="190" y="425">Ovule</text>
            <path d="M 200 420 L 260 420" stroke="#2C3E50" stroke-width="1" opacity="0.4"/>
        </g>

        <!-- DYNAMIC PROCESS LABELS (Right Side) -->
        <g font-size="14" font-weight="600" fill="#2C3E50" text-anchor="start">
            <g class="label-pollen">
                <text x="450" y="80">Pollen Grain</text>
                <path d="M 315 75 L 440 75" stroke="#F1C40F" stroke-width="1.5" stroke-dasharray="4 4"/>
            </g>
            
            <g class="label-tube">
                <text x="450" y="160">Pollen Tube Growth</text>
                <path d="M 315 155 L 440 155" stroke="#F1C40F" stroke-width="1.5" stroke-dasharray="4 4"/>
            </g>
            
            <g class="label-gametes">
                <text x="450" y="235">Male Gametes <tspan class="mono" font-size="12" fill="#3498DB">(n)</tspan></text>
                <path d="M 315 230 L 440 230" stroke="#2C3E50" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
            </g>
            
            <g class="label-triple">
                <text x="450" y="360">Triple Fusion</text>
                <text x="450" y="378" font-size="12" font-weight="400" fill="#666">Sperm + 2 Polar Nuclei → <tspan class="mono" font-weight="700" fill="#FF6B6B">3n PEN</tspan></text>
                <path d="M 320 365 L 440 365" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4 4"/>
            </g>

            <g class="label-syngamy">
                <text x="450" y="415">Syngamy</text>
                <text x="450" y="433" font-size="12" font-weight="400" fill="#666">Sperm + Egg → <tspan class="mono" font-weight="700" fill="#FF6B6B">2n Zygote</tspan></text>
                <path d="M 320 392 L 440 410" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="4 4"/>
            </g>
        </g>

        <!-- LEGEND -->
        <g transform="translate(140, 475)" font-size="12" font-weight="600" fill="#2C3E50">
            <circle cx="0" cy="-4" r="5" fill="#2C3E50"/>
            <text x="10" y="0">Haploid Nucleus (n)</text>

            <circle cx="150" cy="-4" r="5" fill="#FF6B6B"/>
            <text x="160" y="0">Fertilized (2n/3n)</text>

            <circle cx="290" cy="-4" r="5" fill="#F1C40F"/>
            <text x="300" y="0">Pollen / Tube</text>

            <circle cx="400" cy="-4" r="5" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1.5"/>
            <text x="410" y="0">Embryo Sac</text>
            
            <circle cx="505" cy="-4" r="5" fill="#2ECC71" opacity="0.4" stroke="#27AE60" stroke-width="1.5"/>
            <text x="515" y="0">Plant Tissue</text>
        </g>

    </svg>

</body>
</html>
