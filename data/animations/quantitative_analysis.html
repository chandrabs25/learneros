<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantitative Analysis: Liebig's Method</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* CSS Motion Paths */
        .path-o2 { offset-path: path('M 40 200 L 145 200'); offset-rotate: 0deg; }
        .path-h2o { offset-path: path('M 150 200 L 390 200 L 390 280'); offset-rotate: 0deg; }
        .path-co2 { offset-path: path('M 150 200 L 390 200 L 390 300 A 30 30 0 0 0 450 300 L 450 200 L 530 200 L 530 280'); offset-rotate: 0deg; }

        /* Molecule Animations */
        .mol { opacity: 0; }

        .o2-1 { animation: o2-flow 12s infinite linear; animation-delay: 0s; }
        .o2-2 { animation: o2-flow 12s infinite linear; animation-delay: 0.5s; }
        .o2-3 { animation: o2-flow 12s infinite linear; animation-delay: 1s; }

        .h2o-1 { animation: h2o-flow 12s infinite linear; animation-delay: 0s; }
        .h2o-2 { animation: h2o-flow 12s infinite linear; animation-delay: 0.5s; }
        .h2o-3 { animation: h2o-flow 12s infinite linear; animation-delay: 1s; }

        .co2-1 { animation: co2-flow 12s infinite linear; animation-delay: 0s; }
        .co2-2 { animation: co2-flow 12s infinite linear; animation-delay: 0.5s; }
        .co2-3 { animation: co2-flow 12s infinite linear; animation-delay: 1s; }

        @keyframes o2-flow {
            0% { offset-distance: 0%; opacity: 0; transform: scale(0.5); }
            2% { opacity: 1; transform: scale(1); }
            23% { opacity: 1; transform: scale(1); }
            25% { offset-distance: 100%; opacity: 0; transform: scale(0.5); }
            100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes h2o-flow {
            0%, 15% { offset-distance: 0%; opacity: 0; transform: scale(0.5); }
            17% { opacity: 1; transform: scale(1); }
            48% { opacity: 1; transform: scale(1); }
            50% { offset-distance: 100%; opacity: 0; transform: scale(0.5); }
            100% { offset-distance: 100%; opacity: 0; }
        }

        @keyframes co2-flow {
            0%, 15% { offset-distance: 0%; opacity: 0; transform: scale(0.5); }
            17% { opacity: 1; transform: scale(1); }
            73% { opacity: 1; transform: scale(1); }
            75% { offset-distance: 100%; opacity: 0; transform: scale(0.5); }
            100% { offset-distance: 100%; opacity: 0; }
        }

        /* Apparatus Animations */
        .sample-burn { animation: sample-fade 12s infinite linear; }
        @keyframes sample-fade {
            0%, 15% { opacity: 1; }
            30%, 100% { opacity: 0; }
        }

        .furnace-pulse { animation: glow-pulse 12s infinite linear; }
        @keyframes glow-pulse {
            0%, 8%, 50%, 100% { opacity: 0.1; }
            20%, 40% { opacity: 0.8; }
        }

        .mass-label { animation: label-fade 12s infinite linear; }
        @keyframes label-fade {
            0%, 70% { opacity: 0; transform: translateY(10px); }
            75%, 92% { opacity: 1; transform: translateY(0); }
            96%, 100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #1f2937; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #4b5563; }
        .label { font-size: 12px; font-weight: 600; fill: #374151; }
        .sublabel { font-size: 10px; font-weight: 400; fill: #6b7280; }
        .equation { font-family: 'Roboto Mono', monospace; font-size: 16px; fill: #111827; font-weight: 500; }
        .eq-catalyst { font-size: 12px; fill: #d90429; font-weight: 600; }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Filters -->
            <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
                <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
            </filter>
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over"/>
            </filter>

            <!-- Gradients -->
            <radialGradient id="furnace-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffea00" />
                <stop offset="50%" stop-color="#ff5400" />
                <stop offset="100%" stop-color="#9d0208" />
            </radialGradient>

            <!-- Patterns -->
            <pattern id="cuo-pattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
                <circle cx="4" cy="4" r="3.5" fill="#3e2723" stroke="#1f1311" stroke-width="0.5"/>
            </pattern>
            <pattern id="cacl2-pattern" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
                <circle cx="5" cy="5" r="4" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>
                <path d="M 3 5 L 7 5 M 5 3 L 5 7" stroke="#e5e7eb" stroke-width="0.5"/>
            </pattern>

            <!-- Markers -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7"/>
            </marker>

            <!-- Molecule Symbols -->
            <symbol id="mol-o2" viewBox="-10 -10 20 20">
                <circle cx="-3.5" cy="0" r="3.5" fill="#FF4444"/>
                <circle cx="3.5" cy="0" r="3.5" fill="#FF4444"/>
            </symbol>
            <symbol id="mol-h2o" viewBox="-10 -10 20 20">
                <circle cx="0" cy="0" r="4" fill="#FF4444"/>
                <circle cx="-3.5" cy="3.5" r="2.5" fill="#CCCCCC"/>
                <circle cx="3.5" cy="3.5" r="2.5" fill="#CCCCCC"/>
            </symbol>
            <symbol id="mol-co2" viewBox="-15 -10 30 20">
                <circle cx="0" cy="0" r="4" fill="#404040"/>
                <circle cx="-7" cy="0" r="3.5" fill="#FF4444"/>
                <circle cx="7" cy="0" r="3.5" fill="#FF4444"/>
            </symbol>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" rx="12"/>

        <!-- Header -->
        <text x="400" y="40" text-anchor="middle" class="title">Quantitative Analysis: Liebig's Method</text>
        <text x="400" y="60" text-anchor="middle" class="subtitle">Estimation of Carbon and Hydrogen in an Organic Compound</text>

        <!-- Legend -->
        <g transform="translate(640, 20)">
            <rect x="0" y="0" width="130" height="75" fill="#f8f9fa" stroke="#e5e7eb" rx="6"/>
            <text x="65" y="15" text-anchor="middle" font-size="10" font-weight="bold" fill="#4b5563">Legend</text>
            <circle cx="15" cy="30" r="4" fill="#404040"/> <text x="25" y="33" font-size="10" fill="#374151">Carbon (C)</text>
            <circle cx="15" cy="45" r="4" fill="#CCCCCC"/> <text x="25" y="48" font-size="10" fill="#374151">Hydrogen (H)</text>
            <circle cx="15" cy="60" r="4" fill="#FF4444"/> <text x="25" y="63" font-size="10" fill="#374151">Oxygen (O)</text>
        </g>

        <!-- Apparatus Background Layer (Furnace) -->
        <g id="furnace">
            <rect x="100" y="150" width="90" height="100" rx="8" fill="#2d3748"/>
            <rect x="110" y="160" width="70" height="80" rx="4" fill="url(#furnace-grad)" filter="url(#glow)"/>
            <rect x="110" y="160" width="70" height="80" rx="4" fill="#ffffff" class="furnace-pulse" style="mix-blend-mode: overlay;"/>
            <text x="145" y="265" text-anchor="middle" class="label" fill="#e53e3e">Furnace (Δ)</text>
        </g>

        <!-- Apparatus Contents Layer -->
        <g id="contents">
            <!-- Sample Boat & Compound -->
            <path d="M 135 210 L 140 216 L 160 216 L 165 210 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
            <g class="sample-burn">
                <circle cx="143" cy="213" r="2.5" fill="#404040"/>
                <circle cx="148" cy="214" r="2.5" fill="#CCCCCC"/>
                <circle cx="152" cy="212" r="2.5" fill="#404040"/>
                <circle cx="156" cy="214" r="2.5" fill="#CCCCCC"/>
                <circle cx="146" cy="210" r="2.5" fill="#CCCCCC"/>
                <circle cx="150" cy="210" r="2.5" fill="#404040"/>
                <circle cx="154" cy="210" r="2.5" fill="#CCCCCC"/>
            </g>

            <!-- CuO Pellets -->
            <rect x="230" y="182" width="100" height="36" fill="url(#cuo-pattern)"/>

            <!-- Anhydrous CaCl2 (U-Tube 1) -->
            <path d="M 382 250 L 382 300 A 38 38 0 0 0 458 300 L 458 250 L 438 250 L 438 300 A 18 18 0 0 1 402 300 L 402 250 Z" fill="url(#cacl2-pattern)"/>
            
            <!-- KOH Solution (U-Tube 2) -->
            <path d="M 522 240 L 522 300 A 38 38 0 0 0 598 300 L 598 240 L 578 240 L 578 300 A 18 18 0 0 1 542 300 L 542 240 Z" fill="rgba(135, 206, 250, 0.6)"/>
            <!-- Meniscus Lines -->
            <path d="M 522 240 Q 531 243 540 240 M 580 240 Q 589 243 598 240" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
        </g>

        <!-- Animated Molecules Layer -->
        <g id="molecules">
            <!-- O2 Entering -->
            <g class="mol path-o2 o2-1"><use href="#mol-o2"/></g>
            <g class="mol path-o2 o2-2"><use href="#mol-o2"/></g>
            <g class="mol path-o2 o2-3"><use href="#mol-o2"/></g>

            <!-- H2O Flowing to U-Tube 1 -->
            <g class="mol path-h2o h2o-1"><use href="#mol-h2o"/></g>
            <g class="mol path-h2o h2o-2"><use href="#mol-h2o"/></g>
            <g class="mol path-h2o h2o-3"><use href="#mol-h2o"/></g>

            <!-- CO2 Flowing to U-Tube 2 -->
            <g class="mol path-co2 co2-1"><use href="#mol-co2"/></g>
            <g class="mol path-co2 co2-2"><use href="#mol-co2"/></g>
            <g class="mol path-co2 co2-3"><use href="#mol-co2"/></g>
        </g>

        <!-- Glassware Front Layer (Semi-transparent to tint contents and molecules) -->
        <g id="glassware" fill="rgba(224, 242, 254, 0.25)" stroke="#9ca3af" stroke-width="2.5" stroke-linejoin="round" filter="url(#drop-shadow)">
            <!-- Connectors -->
            <rect x="40" y="190" width="50" height="20"/>
            <rect x="330" y="190" width="60" height="20"/>
            <rect x="450" y="190" width="80" height="20"/>
            <rect x="590" y="190" width="70" height="20"/>

            <!-- Main Combustion Tube -->
            <rect x="80" y="180" width="260" height="40" rx="6"/>

            <!-- U-Tube 1 (CaCl2) -->
            <path d="M 380 180 L 380 300 A 40 40 0 0 0 460 300 L 460 180 L 440 180 L 440 300 A 20 20 0 0 1 400 300 L 400 180 Z"/>

            <!-- U-Tube 2 (KOH) -->
            <path d="M 520 180 L 520 300 A 40 40 0 0 0 600 300 L 600 180 L 580 180 L 580 300 A 20 20 0 0 1 540 300 L 540 180 Z"/>
        </g>

        <!-- Stoppers -->
        <g fill="#4b5563">
            <rect x="75" y="175" width="10" height="50" rx="2"/>
            <rect x="335" y="175" width="10" height="50" rx="2"/>
            <rect x="375" y="175" width="10" height="30" rx="2"/>
            <rect x="455" y="175" width="10" height="30" rx="2"/>
            <rect x="515" y="175" width="10" height="30" rx="2"/>
            <rect x="595" y="175" width="10" height="30" rx="2"/>
        </g>

        <!-- Flow Arrows & Static Labels -->
        <g id="annotations">
            <!-- Arrows -->
            <line x1="10" y1="200" x2="30" y2="200" stroke="#7209B7" stroke-width="2.5" marker-end="url(#arrow)"/>
            <line x1="670" y1="200" x2="690" y2="200" stroke="#7209B7" stroke-width="2.5" marker-end="url(#arrow)"/>
            
            <text x="40" y="175" class="label" fill="#7209B7">Dry O₂ in</text>
            <text x="660" y="175" class="label" fill="#7209B7">To aspirator</text>

            <!-- Apparatus Pointers -->
            <line x1="150" y1="140" x2="150" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 2"/>
            <text x="150" y="130" text-anchor="middle" class="label">Organic Compound</text>

            <line x1="280" y1="140" x2="280" y2="175" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 2"/>
            <text x="280" y="130" text-anchor="middle" class="label">Copper(II) Oxide (CuO)</text>
            <text x="280" y="145" text-anchor="middle" class="sublabel">Oxidizing Agent</text>

            <line x1="420" y1="360" x2="420" y2="345" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 2"/>
            <text x="420" y="375" text-anchor="middle" class="label">Anhydrous CaCl₂</text>
            <text x="420" y="390" text-anchor="middle" class="sublabel" fill="#0284c7">Absorbs H₂O</text>

            <line x1="560" y1="360" x2="560" y2="345" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 2"/>
            <text x="560" y="375" text-anchor="middle" class="label">Potassium Hydroxide (KOH)</text>
            <text x="560" y="390" text-anchor="middle" class="sublabel" fill="#0284c7">Absorbs CO₂</text>
        </g>

        <!-- Animated Result Labels -->
        <g class="mass-label">
            <rect x="360" y="110" width="120" height="26" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="13"/>
            <text x="420" y="128" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#047857">Δ Mass = H₂O</text>
        </g>
        <g class="mass-label">
            <rect x="500" y="110" width="120" height="26" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" rx="13"/>
            <text x="560" y="128" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#047857">Δ Mass = CO₂</text>
        </g>

        <!-- Chemical Equation -->
        <g transform="translate(400, 460)">
            <rect x="-250" y="-30" width="500" height="50" fill="#f3f4f6" rx="8"/>
            <text x="0" y="0" text-anchor="middle" class="equation">
                C<tspan baseline-shift="sub" font-size="11">x</tspan>H<tspan baseline-shift="sub" font-size="11">y</tspan> + (x + y/4)O<tspan baseline-shift="sub" font-size="11">2</tspan> 
                <tspan fill="#6b7280"> ──────→ </tspan> 
                xCO<tspan baseline-shift="sub" font-size="11">2</tspan> + (y/2)H<tspan baseline-shift="sub" font-size="11">2</tspan>O
            </text>
            <text x="10" y="-12" text-anchor="middle" class="eq-catalyst">Δ, CuO</text>
        </g>
    </svg>
</body>
</html>
