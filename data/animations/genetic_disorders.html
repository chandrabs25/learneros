<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex Vivo Gene Therapy for ADA Deficiency</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }

        /* Typography */
        .title { font-size: 26px; font-weight: 700; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; text-anchor: middle; font-style: italic; }
        .label-text {
            font-size: 14px;
            font-weight: 600;
            fill: #2C3E50;
            stroke: #ffffff;
            stroke-width: 4px;
            paint-order: stroke fill;
            text-anchor: middle;
        }
        .gene-text { font-family: 'Roboto Mono', monospace; font-weight: 500; fill: #FF6B6B; }
        .static-label { font-size: 16px; font-weight: 600; fill: #2C3E50; text-anchor: middle; }
        
        /* Animations */
        .cell-cluster {
            animation: cluster-move 15s ease-in-out infinite;
        }
        
        @keyframes cluster-move {
            0%, 5% { transform: translate(200px, 350px); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: translate(750px, 350px); opacity: 1; }
            60% { transform: translate(750px, 350px); opacity: 1; }
            75% { transform: translate(200px, 350px); opacity: 1; }
            80%, 100% { transform: translate(200px, 350px); opacity: 0; }
        }

        .defective-dna-anim {
            animation: defective-dna 15s linear infinite;
        }
        @keyframes defective-dna {
            0%, 35% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }

        .functional-dna-anim {
            animation: functional-dna 15s linear infinite;
        }
        @keyframes functional-dna {
            0%, 35% { opacity: 0; transform: scale(0.5); }
            40% { opacity: 1; transform: scale(1); }
            45%, 55%, 65%, 75% { transform: scale(1.2); }
            50%, 60%, 70%, 80% { transform: scale(1); }
            80%, 100% { opacity: 1; transform: scale(1); }
        }

        .enzymes-anim {
            animation: enzymes 15s linear infinite;
        }
        @keyframes enzymes {
            0%, 45% { opacity: 0; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1); }
            55%, 65%, 75% { opacity: 0.6; transform: scale(0.9); }
            60%, 70%, 80% { opacity: 1; transform: scale(1.1); }
            80%, 100% { opacity: 1; transform: scale(1); }
        }

        .vector1-anim { animation: vector1 15s ease-in-out infinite; }
        @keyframes vector1 {
            0%, 20% { opacity: 0; transform: translate(700px, 150px); }
            25% { opacity: 1; transform: translate(700px, 200px); }
            35% { opacity: 1; transform: translate(700px, 255px); }
            40%, 100% { opacity: 0; transform: translate(700px, 255px); }
        }

        .vector2-anim { animation: vector2 15s ease-in-out infinite; }
        @keyframes vector2 {
            0%, 20% { opacity: 0; transform: translate(810px, 150px); }
            25% { opacity: 1; transform: translate(810px, 220px); }
            35% { opacity: 1; transform: translate(810px, 285px); }
            40%, 100% { opacity: 0; transform: translate(810px, 285px); }
        }

        .vector3-anim { animation: vector3 15s ease-in-out infinite; }
        @keyframes vector3 {
            0%, 20% { opacity: 0; transform: translate(880px, 410px); }
            25% { opacity: 1; transform: translate(820px, 410px); }
            35% { opacity: 1; transform: translate(785px, 410px); }
            40%, 100% { opacity: 0; transform: translate(785px, 410px); }
        }

        .patient-glow-anim {
            animation: patient-glow 15s ease-in-out infinite;
        }
        @keyframes patient-glow {
            0%, 75% { opacity: 0; }
            80%, 90% { opacity: 0.8; }
            95%, 100% { opacity: 0; }
        }

        /* Label Animations */
        .label1 { animation: l1 15s linear infinite; }
        @keyframes l1 { 0%, 4% {opacity:0;} 5%, 20% {opacity:1;} 21%, 100% {opacity:0;} }
        
        .label2 { animation: l2 15s linear infinite; }
        @keyframes l2 { 0%, 24% {opacity:0;} 25%, 40% {opacity:1;} 41%, 100% {opacity:0;} }
        
        .label3 { animation: l3 15s linear infinite; }
        @keyframes l3 { 0%, 44% {opacity:0;} 45%, 60% {opacity:1;} 61%, 100% {opacity:0;} }
        
        .label4 { animation: l4 15s linear infinite; }
        @keyframes l4 { 0%, 64% {opacity:0;} 65%, 80% {opacity:1;} 81%, 100% {opacity:0;} }

        /* Path Flow Animations */
        .path-out { animation: flow-out 1s linear infinite; }
        @keyframes flow-out { from { stroke-dashoffset: 10; } to { stroke-dashoffset: 0; } }
        
        .path-in { animation: flow-in 1s linear infinite; }
        @keyframes flow-in { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 10; } }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of Ex Vivo Gene Therapy for ADA Deficiency">
        <title>Ex Vivo Gene Therapy for ADA Deficiency</title>
        <desc>An animation showing lymphocytes extracted from a patient, treated with a retroviral vector containing functional ADA cDNA in a culture dish, and returned to the patient to restore immune function.</desc>

        <defs>
            <!-- Glow Filters -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="glow-large" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="12" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-out" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0A0A0" />
            </marker>
            <marker id="arrow-in" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#A0A0A0" />
            </marker>

            <!-- DNA Symbols -->
            <g id="defective-dna" stroke="#A0A0A0" stroke-width="2" fill="none" stroke-dasharray="2 2">
                <path d="M -12,-8 C -4,-8 4,8 12,8" />
                <path d="M -12,8 C -4,8 4,-8 12,-8" />
            </g>
            
            <g id="functional-dna">
                <path d="M -12,-8 C -4,-8 4,8 12,8" stroke="#FF6B6B" stroke-width="2" fill="none"/>
                <path d="M -12,8 C -4,8 4,-8 12,-8" stroke="#FF6B6B" stroke-width="2" fill="none"/>
                <line x1="-8" y1="-3" x2="-8" y2="3" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="0" y1="-2" x2="0" y2="2" stroke="#FF6B6B" stroke-width="1"/>
                <line x1="8" y1="-3" x2="8" y2="3" stroke="#FF6B6B" stroke-width="1"/>
            </g>

            <!-- Retroviral Vector Symbol -->
            <g id="vector-symbol">
                <polygon points="0,-12 10,-6 10,6 0,12 -10,6 -10,-6" fill="#F39C12" stroke="#D68910" stroke-width="1"/>
                <path d="M -5,0 Q 0,-5 5,0" stroke="#FF6B6B" fill="none" stroke-width="2"/>
            </g>

            <!-- Single Lymphocyte Template -->
            <g id="lymphocyte">
                <!-- Membrane & Cytoplasm -->
                <circle cx="0" cy="0" r="35" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                <!-- Nucleus -->
                <circle cx="0" cy="0" r="18" fill="#2C3E50" />
                
                <!-- Animated Components -->
                <use href="#defective-dna" class="defective-dna-anim" />
                <use href="#functional-dna" class="functional-dna-anim" />
                
                <!-- ADA Enzymes (Synthesized in Cytoplasm) -->
                <g class="enzymes-anim">
                    <circle cx="-20" cy="-15" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                    <circle cx="22" cy="-10" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                    <circle cx="-15" cy="22" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                    <circle cx="18" cy="18" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                    <circle cx="0" cy="-24" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                    <circle cx="0" cy="25" r="3.5" fill="#98D8C8" filter="url(#glow)"/>
                </g>
            </g>
        </defs>

        <!-- Background Grid / Environment -->
        <rect width="1000" height="600" fill="#ffffff" rx="12" />
        
        <!-- Header -->
        <text x="500" y="50" class="title">Ex Vivo Gene Therapy for ADA Deficiency</text>
        <text x="500" y="575" class="subtitle">Note: As lymphocytes are not immortal, periodic infusion is required unless marrow stem cells are treated.</text>

        <!-- Static Background Elements -->
        
        <!-- Culture Dish -->
        <circle cx="750" cy="350" r="160" fill="#f8f9fa" stroke="#2C3E50" stroke-width="3" stroke-dasharray="12 6" />
        <circle cx="750" cy="350" r="150" fill="#E8F4FD" opacity="0.5" />
        <text x="750" y="545" class="static-label">In Vitro Culture</text>

        <!-- Patient Base Silhouette -->
        <g transform="translate(0, 20)">
            <path d="M200,130 c-22.1,0-40,17.9-40,40 c0,22.1,17.9,40,40,40 c22.1,0,40-17.9,40-40 C240,147.9,222.1,130,200,130 z M265,230 c-15-10-35-15-65-15 c-30,0-50,5-65,15 c-20,13.3-30,35-35,60 l25,0 c5-20,15-35,35-40 l0,250 l35,0 l0-120 l10,0 l0,120 l35,0 l0-250 c20,5,30,20,35,40 l25,0 C295,265,285,243.3,265,230 z" fill="#D0D9E0" />
            <!-- Patient Glow (Systemic Recovery) -->
            <path d="M200,130 c-22.1,0-40,17.9-40,40 c0,22.1,17.9,40,40,40 c22.1,0,40-17.9,40-40 C240,147.9,222.1,130,200,130 z M265,230 c-15-10-35-15-65-15 c-30,0-50,5-65,15 c-20,13.3-30,35-35,60 l25,0 c5-20,15-35,35-40 l0,250 l35,0 l0-120 l10,0 l0,120 l35,0 l0-250 c20,5,30,20,35,40 l25,0 C295,265,285,243.3,265,230 z" fill="#2ECC71" filter="url(#glow-large)" class="patient-glow-anim" />
        </g>
        <text x="200" y="545" class="static-label">ADA Deficient Patient</text>

        <!-- Connecting Paths -->
        <!-- Extraction Path -->
        <path d="M 280 300 L 560 300" fill="none" stroke="#A0A0A0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-out)" class="path-out" />
        <!-- Return Path -->
        <path d="M 560 400 L 280 400" fill="none" stroke="#A0A0A0" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow-in)" class="path-in" />

        <!-- Animated Elements -->

        <!-- Moving Cell Cluster -->
        <g class="cell-cluster">
            <!-- Cell 1 -->
            <g transform="translate(-50, -50)">
                <use href="#lymphocyte" />
            </g>
            <!-- Cell 2 -->
            <g transform="translate(60, -20)">
                <use href="#lymphocyte" />
            </g>
            <!-- Cell 3 -->
            <g transform="translate(-10, 60)">
                <use href="#lymphocyte" />
            </g>
        </g>

        <!-- Retroviral Vectors (Targeting specific cells in the dish) -->
        <use href="#vector-symbol" class="vector1-anim" />
        <use href="#vector-symbol" class="vector2-anim" />
        <use href="#vector-symbol" class="vector3-anim" />

        <!-- Dynamic Process Labels -->
        <text x="420" y="285" class="label-text label1">1. Lymphocytes extracted from patient</text>
        <text x="750" y="160" class="label-text label2">2. Functional <tspan class="gene-text">ADA</tspan> cDNA introduced via Retroviral Vector</text>
        <text x="750" y="500" class="label-text label3">3. Corrected cells cultured &amp; synthesize ADA enzyme</text>
        <text x="420" y="435" class="label-text label4">4. Corrected cells returned to patient</text>

        <!-- Legend -->
        <g transform="translate(30, 400)">
            <rect x="0" y="0" width="200" height="130" fill="#ffffff" stroke="#E0E0E0" stroke-width="2" rx="8" />
            <text x="100" y="22" font-size="14" font-weight="700" fill="#2C3E50" text-anchor="middle">Legend</text>
            
            <!-- Lymphocyte -->
            <circle cx="25" cy="45" r="10" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
            <circle cx="25" cy="45" r="4" fill="#2C3E50" />
            <text x="45" y="50" font-size="12" fill="#2C3E50">Lymphocyte</text>
            
            <!-- Vector -->
            <polygon points="25,58 33,64 33,72 25,78 17,72 17,64" fill="#F39C12" />
            <text x="45" y="72" font-size="12" fill="#2C3E50">Retroviral Vector</text>
            
            <!-- cDNA -->
            <path d="M 18,90 C 22,86 28,94 32,90" stroke="#FF6B6B" stroke-width="2" fill="none"/>
            <path d="M 18,90 C 22,94 28,86 32,90" stroke="#FF6B6B" stroke-width="2" fill="none"/>
            <text x="45" y="94" font-size="12" fill="#2C3E50">Functional <tspan class="gene-text">ADA</tspan> cDNA</text>
            
            <!-- Enzyme -->
            <circle cx="25" cy="112" r="4" fill="#98D8C8" filter="url(#glow)"/>
            <text x="45" y="116" font-size="12" fill="#2C3E50">ADA Enzyme</text>
        </g>

    </svg>
</div>

</body>
</html>
