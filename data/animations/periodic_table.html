<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Periodic Trends: Atomic Radius & Ionization Enthalpy</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: #ffffff;
            border-bottom: 2px solid #e9ecef;
        }

        h1 {
            margin: 0;
            color: #212529;
            font-size: 24px;
            font-weight: 700;
        }

        p.subtitle {
            margin: 5px 0 0 0;
            color: #6c757d;
            font-size: 14px;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* SVG Styling */
        .orbit-path {
            stroke: #CCCCCC;
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 4 2;
        }

        .electron {
            fill: #FFFF00;
            filter: url(#glow);
            r: 3.5;
        }

        .nucleus {
            stroke: #333;
            stroke-width: 1;
        }

        .sym {
            font-family: 'Roboto Mono', monospace;
            font-size: 12px;
            font-weight: bold;
            fill: #212529;
            text-anchor: middle;
            pointer-events: none;
        }

        .scene-title {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 600;
            fill: #212529;
            text-anchor: middle;
        }

        .trend-text {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            font-weight: 600;
            fill: #404040;
            text-anchor: middle;
        }

        .config {
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            fill: #4444FF;
            text-anchor: middle;
            font-weight: 500;
        }

        .legend-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            fill: #404040;
            font-weight: 500;
        }

        .trend-arrow {
            stroke-width: 4;
            fill: none;
        }

        .trend-arrow.orange { stroke: #F77F00; }
        .trend-arrow.purple { stroke: #7209B7; }
        
        .energy-arrow {
            stroke: #FF4444;
            stroke-width: 3;
            fill: none;
        }
        .energy-arrow.large { stroke-width: 5; }

        /* Animations */
        .spin-fast { animation: spin 3s linear infinite; transform-origin: 0 0; }
        .spin-med { animation: spin 6s linear infinite; transform-origin: 0 0; }
        .spin-slow { animation: spin 10s linear infinite; transform-origin: 0 0; }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Scene Sequencing (15s Loop) */
        .scene1 { animation: scene1Fade 15s infinite; }
        .scene2 { animation: scene2Fade 15s infinite; }
        .scene3 { animation: scene3Fade 15s infinite; }

        @keyframes scene1Fade {
            0%, 30% { opacity: 1; visibility: visible; }
            33%, 97% { opacity: 0; visibility: hidden; }
            100% { opacity: 1; visibility: visible; }
        }

        @keyframes scene2Fade {
            0%, 30% { opacity: 0; visibility: hidden; }
            33%, 63% { opacity: 1; visibility: visible; }
            66%, 100% { opacity: 0; visibility: hidden; }
        }

        @keyframes scene3Fade {
            0%, 63% { opacity: 0; visibility: hidden; }
            66%, 97% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* Scene 1 Animations */
        .shrink-al { animation: shrinkAl 15s infinite; }
        .shrink-s { animation: shrinkS 15s infinite; }
        .shrink-ar { animation: shrinkAr 15s infinite; }
        .zeff-glow { opacity: 0; animation: showGlow 15s infinite; }
        .slide-text-1 { animation: slideText1 15s infinite; }

        @keyframes shrinkAl {
            0%, 5% { transform: scale(1); }
            15%, 33% { transform: scale(0.85); }
            34%, 100% { transform: scale(1); }
        }
        @keyframes shrinkS {
            0%, 5% { transform: scale(1); }
            15%, 33% { transform: scale(0.70); }
            34%, 100% { transform: scale(1); }
        }
        @keyframes shrinkAr {
            0%, 5% { transform: scale(1); }
            15%, 33% { transform: scale(0.55); }
            34%, 100% { transform: scale(1); }
        }
        @keyframes showGlow {
            0%, 5% { opacity: 0; }
            15%, 33% { opacity: 1; }
            34%, 100% { opacity: 0; }
        }
        @keyframes slideText1 {
            0%, 5% { transform: translateX(-30px); opacity: 0; }
            10%, 33% { transform: translateX(0); opacity: 1; }
            34%, 100% { transform: translateX(-30px); opacity: 0; }
        }

        /* Scene 2 Animations */
        .expand-cs { animation: expandCs 15s infinite; }
        .slide-text-2 { animation: slideText2 15s infinite; }

        @keyframes expandCs {
            0%, 35% { transform: scale(0.5); }
            45%, 66% { transform: scale(1); }
            67%, 100% { transform: scale(0.5); }
        }
        @keyframes slideText2 {
            0%, 35% { transform: translateY(-30px); opacity: 0; }
            40%, 66% { transform: translateY(0); opacity: 1; }
            67%, 100% { transform: translateY(-30px); opacity: 0; }
        }

        /* Scene 3 Animations */
        .pull-e { animation: pullE 15s infinite; }
        .vibrate-e { animation: vibrateE 15s infinite; }
        .energy-in-na { animation: energyInNa 15s infinite; }
        .energy-in-cl { animation: energyInCl 15s infinite; }

        @keyframes pullE {
            0%, 75% { transform: translate(0, 0); opacity: 1; }
            85%, 97% { transform: translate(120px, -120px); opacity: 0; }
            98%, 100% { transform: translate(0, 0); opacity: 1; }
        }
        @keyframes vibrateE {
            0%, 75% { transform: translate(0, 0); }
            76%, 78%, 80%, 82%, 84% { transform: translate(3px, -3px); }
            77%, 79%, 81%, 83%, 85% { transform: translate(-3px, 3px); }
            86%, 100% { transform: translate(0, 0); }
        }
        @keyframes energyInNa {
            0%, 70% { opacity: 0; transform: translateX(-20px); }
            75%, 85% { opacity: 1; transform: translateX(0); }
            86%, 100% { opacity: 0; }
        }
        @keyframes energyInCl {
            0%, 70% { opacity: 0; transform: translateX(20px); }
            75%, 85% { opacity: 1; transform: translateX(0); }
            86%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Periodic Trends: Atomic Radius & Ionization Enthalpy</h1>
        <p class="subtitle">A dynamic visualization of Effective Nuclear Charge (Z<sub>eff</sub>) and Principal Quantum Number (n)</p>
    </div>

    <svg viewBox="0 0 1000 650" aria-labelledby="svg-title">
        <title id="svg-title">Animated Periodic Trends Diagram</title>
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <defs>
            <!-- Filters & Gradients -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            
            <radialGradient id="zeffGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF4444" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#FF4444" stop-opacity="0"/>
            </radialGradient>

            <!-- Arrow Markers -->
            <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7"/>
            </marker>
            <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF4444"/>
            </marker>

            <!-- Shell Templates -->
            <g id="shell1">
                <circle class="orbit-path" r="20"/>
                <g class="spin-fast">
                    <circle class="electron" cx="20" cy="0" transform="rotate(0)"/>
                    <circle class="electron" cx="20" cy="0" transform="rotate(180)"/>
                </g>
            </g>
            
            <g id="shell2">
                <circle class="orbit-path" r="45"/>
                <g class="spin-med">
                    <circle class="electron" cx="45" cy="0" transform="rotate(0)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(45)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(90)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(135)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(180)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(225)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(270)"/>
                    <circle class="electron" cx="45" cy="0" transform="rotate(315)"/>
                </g>
            </g>

            <g id="core-Ne">
                <use href="#shell1"/>
                <use href="#shell2"/>
            </g>

            <!-- Valence Shells (n=3) -->
            <g id="shell3_1">
                <circle class="orbit-path" r="70"/>
                <g class="spin-slow"><circle class="electron" cx="70" cy="0" transform="rotate(-90)"/></g>
            </g>
            <g id="shell3_3">
                <circle class="orbit-path" r="70"/>
                <g class="spin-slow">
                    <circle class="electron" cx="70" cy="0" transform="rotate(-90)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(30)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(150)"/>
                </g>
            </g>
            <g id="shell3_6">
                <circle class="orbit-path" r="70"/>
                <g class="spin-slow">
                    <circle class="electron" cx="70" cy="0" transform="rotate(0)"/><circle class="electron" cx="70" cy="0" transform="rotate(60)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(120)"/><circle class="electron" cx="70" cy="0" transform="rotate(180)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(240)"/><circle class="electron" cx="70" cy="0" transform="rotate(300)"/>
                </g>
            </g>
            <g id="shell3_8">
                <circle class="orbit-path" r="70"/>
                <g class="spin-slow">
                    <circle class="electron" cx="70" cy="0" transform="rotate(0)"/><circle class="electron" cx="70" cy="0" transform="rotate(45)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(90)"/><circle class="electron" cx="70" cy="0" transform="rotate(135)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(180)"/><circle class="electron" cx="70" cy="0" transform="rotate(225)"/>
                    <circle class="electron" cx="70" cy="0" transform="rotate(270)"/><circle class="electron" cx="70" cy="0" transform="rotate(315)"/>
                </g>
            </g>

            <!-- Outer Shells for Cs -->
            <g id="shell4_18">
                <circle class="orbit-path" r="95"/>
                <g class="spin-med">
                    <!-- Representing 18 with 8 for visual clarity -->
                    <circle class="electron" cx="95" cy="0" transform="rotate(0)"/><circle class="electron" cx="95" cy="0" transform="rotate(45)"/>
                    <circle class="electron" cx="95" cy="0" transform="rotate(90)"/><circle class="electron" cx="95" cy="0" transform="rotate(135)"/>
                    <circle class="electron" cx="95" cy="0" transform="rotate(180)"/><circle class="electron" cx="95" cy="0" transform="rotate(225)"/>
                    <circle class="electron" cx="95" cy="0" transform="rotate(270)"/><circle class="electron" cx="95" cy="0" transform="rotate(315)"/>
                </g>
            </g>
            <g id="shell5_8">
                <circle class="orbit-path" r="120"/>
                <g class="spin-slow">
                    <circle class="electron" cx="120" cy="0" transform="rotate(22.5)"/><circle class="electron" cx="120" cy="0" transform="rotate(67.5)"/>
                    <circle class="electron" cx="120" cy="0" transform="rotate(112.5)"/><circle class="electron" cx="120" cy="0" transform="rotate(157.5)"/>
                    <circle class="electron" cx="120" cy="0" transform="rotate(202.5)"/><circle class="electron" cx="120" cy="0" transform="rotate(247.5)"/>
                    <circle class="electron" cx="120" cy="0" transform="rotate(292.5)"/><circle class="electron" cx="120" cy="0" transform="rotate(337.5)"/>
                </g>
            </g>
            <g id="shell6_1">
                <circle class="orbit-path" r="145"/>
                <g class="spin-slow"><circle class="electron" cx="145" cy="0" transform="rotate(-90)"/></g>
            </g>
        </defs>

        <!-- ================= SCENE 1: Period 3 Contraction ================= -->
        <g class="scene1">
            <text x="500" y="60" class="scene-title">Period 3: Atomic Radius Decreases Across a Period</text>
            
            <!-- Sodium -->
            <g transform="translate(150, 260)">
                <use href="#core-Ne"/>
                <use href="#shell3_1"/>
                <circle class="nucleus" fill="#FFD700" r="12"/><text y="4" class="sym">Na</text>
                <text y="100" class="config">[Ne] 3s<tspan dy="-5" font-size="10">1</tspan></text>
            </g>

            <!-- Aluminum -->
            <g transform="translate(380, 260)">
                <g class="shrink-al">
                    <circle class="zeff-glow" fill="url(#zeffGlow)" r="25"/>
                    <use href="#core-Ne"/>
                    <use href="#shell3_3"/>
                    <circle class="nucleus" fill="#AAAAAA" r="12"/><text y="4" class="sym">Al</text>
                </g>
                <text y="100" class="config">[Ne] 3s<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 3p</tspan><tspan dy="-5" font-size="10">1</tspan></text>
            </g>

            <!-- Sulfur -->
            <g transform="translate(610, 260)">
                <g class="shrink-s">
                    <circle class="zeff-glow" fill="url(#zeffGlow)" r="45"/>
                    <use href="#core-Ne"/>
                    <use href="#shell3_6"/>
                    <circle class="nucleus" fill="#FFCC00" r="12"/><text y="4" class="sym">S</text>
                </g>
                <text y="100" class="config">[Ne] 3s<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 3p</tspan><tspan dy="-5" font-size="10">4</tspan></text>
            </g>

            <!-- Argon -->
            <g transform="translate(840, 260)">
                <g class="shrink-ar">
                    <circle class="zeff-glow" fill="url(#zeffGlow)" r="65"/>
                    <use href="#core-Ne"/>
                    <use href="#shell3_8"/>
                    <circle class="nucleus" fill="#4444FF" r="12"/><text y="4" class="sym">Ar</text>
                </g>
                <text y="100" class="config">[Ne] 3s<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 3p</tspan><tspan dy="-5" font-size="10">6</tspan></text>
            </g>

            <!-- Trend Arrow -->
            <g class="slide-text-1">
                <line x1="200" y1="450" x2="800" y2="450" class="trend-arrow orange" marker-end="url(#arrowOrange)"/>
                <text x="500" y="480" class="trend-text">Increasing Effective Nuclear Charge (Z<tspan dy="5" font-size="11">eff</tspan><tspan dy="-5">)</tspan></text>
                <text x="500" y="505" class="trend-text" fill="#F77F00">Pulls electrons closer, shrinking the radius</text>
            </g>
        </g>

        <!-- ================= SCENE 2: Group 1 Expansion ================= -->
        <g class="scene2">
            <text x="500" y="60" class="scene-title">Group 1: Atomic Radius Increases Down a Group</text>
            
            <!-- Sodium -->
            <g transform="translate(400, 200)">
                <use href="#core-Ne"/>
                <use href="#shell3_1"/>
                <circle class="nucleus" fill="#FFD700" r="12"/><text y="4" class="sym">Na</text>
                <text x="120" y="5" class="config">[Ne] 3s<tspan dy="-5" font-size="10">1</tspan></text>
            </g>

            <!-- Cesium -->
            <g transform="translate(600, 420)">
                <g class="expand-cs">
                    <use href="#core-Ne"/>
                    <use href="#shell3_8"/> <!-- Representing full n=3 -->
                    <use href="#shell4_18"/>
                    <use href="#shell5_8"/>
                    <use href="#shell6_1"/>
                    <circle class="nucleus" fill="#FFD700" r="12"/><text y="4" class="sym">Cs</text>
                </g>
                <text x="180" y="5" class="config">[Xe] 6s<tspan dy="-5" font-size="10">1</tspan></text>
            </g>

            <!-- Trend Arrow -->
            <g class="slide-text-2">
                <line x1="250" y1="150" x2="250" y2="480" class="trend-arrow purple" marker-end="url(#arrowPurple)"/>
                <text x="220" y="315" class="trend-text" transform="rotate(-90, 220, 315)">Increasing Principal Quantum Number (n)</text>
                <text x="190" y="315" class="trend-text" fill="#7209B7" transform="rotate(-90, 190, 315)">Adding new electron shells expands radius</text>
            </g>
        </g>

        <!-- ================= SCENE 3: Ionization Enthalpy ================= -->
        <g class="scene3">
            <text x="500" y="60" class="scene-title">Ionization Enthalpy: Energy Required to Remove an Electron</text>
            
            <!-- IE Axis -->
            <g transform="translate(500, 450)">
                <line x1="0" y1="0" x2="0" y2="-280" stroke="#212529" stroke-width="2" marker-end="url(#arrowPurple)"/>
                <text x="-15" y="-140" transform="rotate(-90, -15, -140)" class="trend-text">Ionization Enthalpy (kJ/mol)</text>
                
                <!-- Na Level -->
                <line x1="-10" y1="-50" x2="10" y2="-50" stroke="#FFD700" stroke-width="3"/>
                <text x="20" y="-45" class="legend-text" fill="#FFD700" font-weight="bold">Na (496)</text>
                
                <!-- Cl Level -->
                <line x1="-10" y1="-220" x2="10" y2="-220" stroke="#44CC44" stroke-width="3"/>
                <text x="20" y="-215" class="legend-text" fill="#44CC44" font-weight="bold">Cl (1251)</text>
            </g>

            <!-- Sodium (Low IE) -->
            <g transform="translate(250, 350)">
                <use href="#core-Ne"/>
                <circle class="orbit-path" r="70"/>
                <g class="pull-e">
                    <circle class="electron" cx="0" cy="-70"/>
                </g>
                <circle class="nucleus" fill="#FFD700" r="12"/><text y="4" class="sym">Na</text>
                <text y="100" class="config">1s<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 2s</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 2p</tspan><tspan dy="-5" font-size="10">6</tspan><tspan dy="5"> 3s</tspan><tspan dy="-5" font-size="10">1</tspan></text>
                <text y="130" class="trend-text" fill="#FFD700">Low IE (Easy to remove)</text>
                
                <!-- Energy Input Arrow -->
                <g class="energy-in-na">
                    <line x1="-80" y1="-100" x2="-15" y2="-75" class="energy-arrow" marker-end="url(#arrowRed)"/>
                    <text x="-90" y="-110" class="legend-text" fill="#FF4444">Energy In</text>
                </g>
            </g>

            <!-- Chlorine (High IE) -->
            <g transform="translate(750, 350)">
                <g transform="scale(0.65)">
                    <use href="#core-Ne"/>
                    <circle class="orbit-path" r="70"/>
                    <g class="spin-slow">
                        <circle class="electron" cx="70" cy="0" transform="rotate(0)"/>
                        <circle class="electron" cx="70" cy="0" transform="rotate(51.4)"/>
                        <circle class="electron" cx="70" cy="0" transform="rotate(102.8)"/>
                        <circle class="electron" cx="70" cy="0" transform="rotate(154.2)"/>
                        <circle class="electron" cx="70" cy="0" transform="rotate(205.7)"/>
                        <circle class="electron" cx="70" cy="0" transform="rotate(257.1)"/>
                    </g>
                    <g class="vibrate-e">
                        <circle class="electron" cx="0" cy="-70"/>
                    </g>
                    <circle class="nucleus" fill="#44CC44" r="12"/><text y="4" class="sym">Cl</text>
                </g>
                <text y="100" class="config">1s<tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 2s</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 2p</tspan><tspan dy="-5" font-size="10">6</tspan><tspan dy="5"> 3s</tspan><tspan dy="-5" font-size="10">2</tspan><tspan dy="5"> 3p</tspan><tspan dy="-5" font-size="10">5</tspan></text>
                <text y="130" class="trend-text" fill="#44CC44">High IE (Hard to remove)</text>

                <!-- Energy Input Arrow -->
                <g class="energy-in-cl">
                    <line x1="80" y1="-80" x2="15" y2="-55" class="energy-arrow large" marker-end="url(#arrowRed)"/>
                    <text x="90" y="-90" class="legend-text" fill="#FF4444">Large Energy In</text>
                </g>
            </g>
        </g>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(140, 610)">
            <rect x="-20" y="-15" width="760" height="30" fill="#ffffff" rx="15" stroke="#e9ecef" stroke-width="2"/>
            
            <circle cx="0" cy="0" r="6" fill="#FFD700"/><text x="12" y="4" class="legend-text">Alkali Metal</text>
            <circle cx="110" cy="0" r="6" fill="#AAAAAA"/><text x="122" y="4" class="legend-text">Post-Transition</text>
            <circle cx="245" cy="0" r="6" fill="#FFCC00"/><text x="257" y="4" class="legend-text">Non-Metal</text>
            <circle cx="350" cy="0" r="6" fill="#44CC44"/><text x="362" y="4" class="legend-text">Halogen</text>
            <circle cx="440" cy="0" r="6" fill="#4444FF"/><text x="452" y="4" class="legend-text">Noble Gas</text>
            
            <circle cx="540" cy="0" r="4" fill="#FFFF00" filter="url(#glow)"/><text x="552" y="4" class="legend-text">Electron</text>
            
            <line x1="625" y1="0" x2="650" y2="0" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowOrange)"/>
            <text x="662" y="4" class="legend-text">Trend / Energy</text>
        </g>

    </svg>
</div>

</body>
</html>
