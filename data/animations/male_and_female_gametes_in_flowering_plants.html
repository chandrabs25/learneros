<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Male and Female Gametes in Angiosperms</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .mono {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            fill: #5D6D7E;
        }
        
        /* Animations */
        @keyframes fade-gen {
            0%, 10% { opacity: 1; }
            15%, 95% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes split-mg1 {
            0%, 10% { opacity: 0; transform: translate(0, 0); }
            15%, 95% { opacity: 1; transform: translate(-14px, -10px); }
            100% { opacity: 0; transform: translate(0, 0); }
        }
        @keyframes split-mg2 {
            0%, 10% { opacity: 0; transform: translate(0, 0); }
            15%, 95% { opacity: 1; transform: translate(14px, 10px); }
            100% { opacity: 0; transform: translate(0, 0); }
        }
        @keyframes pulse-egg {
            0%, 10%, 30%, 100% { transform: scale(1); fill: #F39C12; }
            20% { transform: scale(1.15); fill: #FF8C00; }
        }
        @keyframes fly-pollen {
            0%, 26% { offset-distance: 0%; opacity: 0; transform: scale(1); }
            27% { opacity: 1; transform: scale(1.5); }
            40% { offset-distance: 100%; opacity: 1; transform: scale(1); }
            41%, 100% { opacity: 0; offset-distance: 100%; }
        }
        @keyframes land-pollen {
            0%, 39% { opacity: 0; }
            40%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes grow-tube {
            0%, 40% { stroke-dashoffset: 400; opacity: 0; }
            41% { opacity: 1; stroke-dashoffset: 400; }
            80%, 95% { stroke-dashoffset: 0; opacity: 1; }
            96%, 100% { stroke-dashoffset: 0; opacity: 0; }
        }
        @keyframes move-gamete1 {
            0%, 53% { offset-distance: 0%; opacity: 0; }
            54% { opacity: 1; }
            86% { offset-distance: 100%; opacity: 1; }
            87%, 100% { opacity: 0; offset-distance: 100%; }
        }
        @keyframes move-gamete2 {
            0%, 55% { offset-distance: 0%; opacity: 0; }
            56% { opacity: 1; }
            88% { offset-distance: 100%; opacity: 1; }
            89%, 100% { opacity: 0; offset-distance: 100%; }
        }

        /* Applying Animations */
        #gen-cell { animation: fade-gen 15s linear infinite; transform-origin: 660px 155px; }
        #mg1 { animation: split-mg1 15s linear infinite; transform-origin: 660px 155px; }
        #mg2 { animation: split-mg2 15s linear infinite; transform-origin: 660px 155px; }
        #egg-cell { animation: pulse-egg 15s linear infinite; transform-origin: 650px 415px; }
        
        .flying-pollen {
            offset-path: path('M150,180 Q225,80 300,115');
            offset-rotate: 0deg;
            animation: fly-pollen 15s linear infinite;
        }
        .landed-pollen { animation: land-pollen 15s linear infinite; }
        
        #animated-tube {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: grow-tube 15s linear infinite;
        }
        
        .moving-gamete1 {
            offset-path: path('M300,115 L300,280 C300,310 240,320 240,370 C240,425 300,430 300,410');
            offset-rotate: 0deg;
            animation: move-gamete1 15s linear infinite;
        }
        .moving-gamete2 {
            offset-path: path('M300,115 L300,280 C300,310 240,320 240,370 C240,425 300,430 300,410');
            offset-rotate: 0deg;
            animation: move-gamete2 15s linear infinite;
        }

        .label-line {
            stroke: #7F8C8D;
            stroke-width: 1;
            stroke-dasharray: 3,3;
        }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1" flood-color="#2C3E50"/>
        </filter>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="2" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over"/>
        </filter>
        <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4">
            <circle cx="5" cy="5" r="3" fill="#7F8C8D"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" rx="12"/>

    <!-- Title & Footer -->
    <text x="400" y="40" font-size="22" font-weight="700" text-anchor="middle">Male and Female Gametes in Angiosperms: Non-Motile Delivery</text>
    <text x="400" y="480" font-size="13" text-anchor="middle" fill="#5D6D7E">Since both gametes are non-motile, the <tspan font-family="'Roboto Mono', monospace" fill="#D68910" font-weight="bold">pollen tube</tspan> acts as the delivery vector.</text>

    <!-- MACRO VIEW: FLOWER LS -->
    <g id="macro-view">
        <!-- Stamen -->
        <path d="M200,380 Q150,300 150,200" fill="none" stroke="#A9DFBF" stroke-width="3"/>
        <path d="M135,180 C125,160 175,160 165,180 C175,200 125,200 135,180 Z" fill="#F1C40F" stroke="#D4AC0D" stroke-width="2" filter="url(#shadow)"/>
        
        <!-- Pistil -->
        <path d="M280,120 C280,100 320,100 320,120 C320,130 310,135 305,140 L305,280 C305,290 340,310 340,360 C340,410 260,410 260,360 C260,310 295,290 295,280 L295,140 C290,135 280,130 280,120 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2" filter="url(#shadow)"/>
        
        <!-- Ovule (Anatropous) -->
        <path d="M300,310 C340,310 340,400 310,410 L310,400 C330,390 330,320 300,320 C270,320 270,390 290,400 L290,410 C260,400 260,310 300,310 Z" fill="#A9DFBF" stroke="#27AE60" stroke-width="1"/>
        
        <!-- Embryo Sac (Macro) -->
        <ellipse cx="300" cy="360" rx="14" ry="28" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1"/>
        <circle cx="300" cy="378" r="4" fill="#F39C12"/> <!-- Egg macro -->
    </g>

    <!-- MICRO VIEW: MALE (POLLEN GRAIN) -->
    <g id="micro-male">
        <!-- Callout Lines -->
        <line x1="165" y1="180" x2="580" y2="130" class="label-line"/>
        
        <!-- Pollen Structure -->
        <circle cx="650" cy="130" r="50" fill="#F1C40F" stroke="#D4AC0D" stroke-width="3" filter="url(#shadow)"/>
        
        <!-- Vegetative Cell -->
        <path d="M615,110 C650,85 685,115 675,150 C650,175 605,155 615,110 Z" fill="#4A90D9" opacity="0.85"/>
        <circle cx="640" cy="125" r="10" fill="#2C3E50"/>
        
        <!-- Generative Cell & Gametes -->
        <ellipse id="gen-cell" cx="660" cy="155" rx="18" ry="10" fill="#FF6B6B" stroke="#C0392B" stroke-width="1"/>
        <circle id="mg1" cx="660" cy="155" r="7" fill="#FF6B6B" stroke="#C0392B" stroke-width="1"/>
        <circle id="mg2" cx="660" cy="155" r="7" fill="#FF6B6B" stroke="#C0392B" stroke-width="1"/>
    </g>

    <!-- MICRO VIEW: FEMALE (EMBRYO SAC) -->
    <g id="micro-female">
        <!-- Callout Lines -->
        <line x1="314" y1="360" x2="580" y2="360" class="label-line"/>
        
        <!-- Embryo Sac Structure -->
        <ellipse cx="650" cy="360" rx="45" ry="80" fill="#E8F4FD" stroke="#2C3E50" stroke-width="2" filter="url(#shadow)"/>
        
        <!-- Antipodals (Chalazal end) -->
        <circle cx="625" cy="300" r="11" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
        <circle cx="650" cy="295" r="11" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
        <circle cx="675" cy="300" r="11" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
        
        <!-- Polar Nuclei (Central Cell) -->
        <circle cx="640" cy="355" r="8" fill="#2C3E50"/>
        <circle cx="660" cy="355" r="8" fill="#2C3E50"/>
        
        <!-- Egg Apparatus (Micropylar end) -->
        <circle cx="625" cy="415" r="14" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/> <!-- Synergid -->
        <circle cx="675" cy="415" r="14" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/> <!-- Synergid -->
        <circle id="egg-cell" cx="650" cy="415" r="16" fill="#F39C12" stroke="#2C3E50" stroke-width="2"/> <!-- Egg -->
        
        <!-- Filiform Apparatus -->
        <path d="M615,425 Q625,435 620,440 M630,425 Q635,435 630,440 M670,425 Q665,435 670,440 M685,425 Q675,435 680,440" fill="none" stroke="#2C3E50" stroke-width="1.5"/>
    </g>

    <!-- ANIMATION LAYER (Delivery System) -->
    <g id="animations">
        <!-- Pollen Tube Path (Animated) -->
        <path id="animated-tube" d="M300,115 L300,280 C300,310 240,320 240,370 C240,425 300,430 300,410" fill="none" stroke="#F39C12" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
        
        <!-- Static Landed Pollen Grain -->
        <circle cx="300" cy="113" r="5" fill="#F1C40F" class="landed-pollen" stroke="#D4AC0D" stroke-width="1"/>
        
        <!-- Flying Pollen Grain -->
        <circle r="4" fill="#F1C40F" class="flying-pollen" stroke="#D4AC0D" stroke-width="1"/>
        
        <!-- Moving Male Gametes inside Tube -->
        <circle r="3.5" fill="#FF6B6B" class="moving-gamete1"/>
        <circle r="3.5" fill="#FF6B6B" class="moving-gamete2"/>
    </g>

    <!-- LABELS & ANNOTATIONS -->
    <g id="labels">
        <!-- Macro Labels -->
        <text x="130" y="150" font-size="12" font-weight="600" text-anchor="end">Anther</text>
        <line x1="135" y1="147" x2="150" y2="165" class="label-line" marker-start="url(#dot)"/>
        
        <text x="230" y="125" font-size="12" font-weight="600" text-anchor="end">Stigma</text>
        <line x1="235" y1="122" x2="280" y2="122" class="label-line" marker-start="url(#dot)"/>
        
        <text x="230" y="220" font-size="12" font-weight="600" text-anchor="end">Style</text>
        <line x1="235" y1="217" x2="295" y2="217" class="label-line" marker-start="url(#dot)"/>
        
        <text x="230" y="340" font-size="12" font-weight="600" text-anchor="end">Ovary</text>
        <line x1="235" y1="337" x2="265" y2="337" class="label-line" marker-start="url(#dot)"/>

        <text x="230" y="420" font-size="12" font-weight="600" text-anchor="end">Micropyle</text>
        <line x1="235" y1="417" x2="290" y2="417" class="label-line" marker-start="url(#dot)"/>

        <!-- Micro Male Labels -->
        <text x="720" y="90" font-size="13" font-weight="700">Pollen Grain</text>
        
        <text x="720" y="115" font-size="11">Vegetative Cell</text>
        <line x1="715" y1="112" x2="670" y2="120" class="label-line" marker-start="url(#dot)"/>
        
        <text x="720" y="160" font-size="11" font-weight="600" fill="#C0392B">Male Gametes <tspan class="mono">(n)</tspan></text>
        <line x1="715" y1="157" x2="680" y2="155" class="label-line" marker-start="url(#dot)"/>

        <!-- Micro Female Labels -->
        <text x="720" y="270" font-size="13" font-weight="700">Embryo Sac</text>
        <text x="720" y="285" font-size="10" fill="#7F8C8D">(7-celled, 8-nucleate)</text>
        
        <text x="720" y="310" font-size="11">Antipodals</text>
        <line x1="715" y1="307" x2="685" y2="303" class="label-line" marker-start="url(#dot)"/>
        
        <text x="720" y="360" font-size="11">Polar Nuclei</text>
        <line x1="715" y1="357" x2="670" y2="357" class="label-line" marker-start="url(#dot)"/>
        
        <text x="720" y="405" font-size="11">Synergids</text>
        <line x1="715" y1="402" x2="685" y2="410" class="label-line" marker-start="url(#dot)"/>
        
        <text x="720" y="435" font-size="11" font-weight="600" fill="#D68910">Egg Cell <tspan class="mono">(n)</tspan></text>
        <line x1="715" y1="432" x2="665" y2="425" class="label-line" marker-start="url(#dot)"/>
    </g>

    <!-- LEGEND -->
    <g id="legend" transform="translate(30, 400)">
        <rect x="0" y="0" width="140" height="70" fill="#ffffff" stroke="#E8F4FD" rx="6" filter="url(#shadow)"/>
        
        <circle cx="15" cy="18" r="5" fill="#FF6B6B"/>
        <text x="30" y="22" font-size="11" font-weight="600">Male Gamete</text>
        
        <circle cx="15" cy="35" r="5" fill="#F39C12"/>
        <text x="30" y="39" font-size="11" font-weight="600">Female Gamete</text>
        
        <line x1="10" y1="52" x2="20" y2="52" stroke="#F39C12" stroke-width="4" stroke-linecap="round"/>
        <text x="30" y="56" font-size="11" font-weight="600">Pollen Tube</text>
    </g>

</svg>

</body>
</html>
