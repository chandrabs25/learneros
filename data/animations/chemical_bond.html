<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Spectrum of Chemical Bonding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #333333; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #666666; }
        .dynamic-label { font-size: 18px; font-weight: 600; fill: #222222; }
        .atom-label { font-family: 'Roboto Mono', monospace; font-size: 16px; font-weight: 700; fill: #333333; }
        .charge-label { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; }
        .legend-text { font-size: 12px; fill: #555555; }

        /* Global State Visibility Animations */
        .state1 { animation: fade1 20s infinite; }
        .state2 { animation: fade2 20s infinite; }
        .state3 { animation: fade3 20s infinite; }
        .state4 { animation: fade4 20s infinite; }

        @keyframes fade1 {
            0%, 20% { opacity: 1; visibility: visible; }
            25%, 95% { opacity: 0; visibility: hidden; }
            100% { opacity: 1; visibility: visible; }
        }
        @keyframes fade2 {
            0%, 20% { opacity: 0; visibility: hidden; }
            25%, 45% { opacity: 1; visibility: visible; }
            50%, 100% { opacity: 0; visibility: hidden; }
        }
        @keyframes fade3 {
            0%, 45% { opacity: 0; visibility: hidden; }
            50%, 70% { opacity: 1; visibility: visible; }
            75%, 100% { opacity: 0; visibility: hidden; }
        }
        @keyframes fade4 {
            0%, 70% { opacity: 0; visibility: hidden; }
            75%, 95% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }

        /* State 1 Specific Animations */
        .s1-h1 { animation: s1-h1-anim 20s infinite; }
        .s1-h2 { animation: s1-h2-anim 20s infinite; }
        .s1-cloud { animation: s1-cloud-anim 20s infinite; }
        
        @keyframes s1-h1-anim {
            0% { transform: translateX(-40px); }
            5%, 25% { transform: translateX(0); }
        }
        @keyframes s1-h2-anim {
            0% { transform: translateX(40px); }
            5%, 25% { transform: translateX(0); }
        }
        @keyframes s1-cloud-anim {
            0% { opacity: 0; transform: scale(0.5); transform-origin: 400px 250px; }
            5%, 25% { opacity: 1; transform: scale(1); }
        }

        /* State 2 Specific Animations */
        .s2-cloud { animation: s2-cloud-anim 20s infinite; }
        @keyframes s2-cloud-anim {
            25% { opacity: 0; transform: scale(0.8); transform-origin: 400px 250px; }
            30%, 50% { opacity: 1; transform: scale(1); }
        }

        /* State 3 Specific Animations */
        .s3-mol2 { animation: s3-mol2-anim 20s infinite; }
        .s3-hbond, .s3-hbond-text { animation: s3-hbond-anim 20s infinite; }
        
        @keyframes s3-mol2-anim {
            50% { transform: translateX(40px); }
            55%, 75% { transform: translateX(0); }
        }
        @keyframes s3-hbond-anim {
            0%, 55% { opacity: 0; }
            60%, 75% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* State 4 Specific Animations */
        .s4-arrow {
            stroke-dasharray: 250;
            stroke-dashoffset: 250;
            animation: s4-arrow-anim 20s infinite;
        }
        .s4-e-group {
            offset-path: path('M 300 200 Q 400 100 500 195');
            animation: s4-e-move 20s infinite;
        }
        .s4-na-circle { animation: s4-na-r 20s infinite; }
        .s4-cl-circle { animation: s4-cl-r 20s infinite; }
        .s4-charge { animation: s4-charge-anim 20s infinite; }
        .s4-glow { animation: s4-glow-anim 20s infinite; }

        @keyframes s4-arrow-anim {
            0%, 77% { stroke-dashoffset: 250; opacity: 1; }
            82%, 95% { stroke-dashoffset: 0; opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes s4-e-move {
            0%, 77% { offset-distance: 0%; opacity: 0; }
            77.1% { opacity: 1; }
            82%, 95% { offset-distance: 100%; opacity: 1; }
            96%, 100% { opacity: 0; }
        }
        @keyframes s4-na-r {
            0%, 82% { r: 40px; }
            85%, 100% { r: 30px; }
        }
        @keyframes s4-cl-r {
            0%, 82% { r: 45px; }
            85%, 100% { r: 55px; }
        }
        @keyframes s4-charge-anim {
            0%, 82% { opacity: 0; transform: translateY(10px); }
            85%, 100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes s4-glow-anim {
            0%, 82% { opacity: 0; transform: scale(0.8); transform-origin: 400px 250px; }
            85%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; }
        }

        /* Progress Bar */
        .progress-bar { animation: progress 20s linear infinite; }
        @keyframes progress {
            0% { width: 0; }
            100% { width: 800px; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
        <title>The Spectrum of Chemical Bonding: From Covalent to Ionic</title>
        <desc>An animated diagram showing the transition between non-polar covalent, polar covalent, hydrogen bonding, and ionic bonding, highlighting electron displacement and transfer.</desc>
        
        <defs>
            <!-- 3D Sphere Gradients -->
            <radialGradient id="h-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#CCCCCC"/>
            </radialGradient>
            <radialGradient id="f-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#C0F8C0"/>
                <stop offset="100%" stop-color="#90EE90"/>
            </radialGradient>
            <radialGradient id="na-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#D8CBEB"/>
                <stop offset="100%" stop-color="#B19CD9"/>
            </radialGradient>
            <radialGradient id="cl-grad" cx="35%" cy="35%" r="65%">
                <stop offset="0%" stop-color="#88EE88"/>
                <stop offset="100%" stop-color="#44CC44"/>
            </radialGradient>
            <radialGradient id="e-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="100%" stop-color="#FFD700"/>
            </radialGradient>

            <!-- Electron Cloud Effects -->
            <filter id="blur-cloud" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="10" />
            </filter>
            <radialGradient id="cloud-sym" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFD700" stop-opacity="0.5"/>
                <stop offset="70%" stop-color="#FFD700" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
            </radialGradient>

            <!-- Arrow Markers -->
            <marker id="fishhook" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
                <path d="M 0 2 L 10 6 L 0 6" fill="none" stroke="#F77F00" stroke-width="2" />
            </marker>
        </defs>

        <!-- Header -->
        <text x="400" y="45" text-anchor="middle" class="title">Chemical Bonding &amp; Electron Displacement</text>
        <text x="400" y="70" text-anchor="middle" class="subtitle">The Spectrum of Chemical Bonding: From Covalent to Ionic</text>

        <!-- ========================================== -->
        <!-- STATE 1: Non-polar Covalent                -->
        <!-- ========================================== -->
        <g class="state1">
            <!-- Electron Cloud -->
            <ellipse cx="400" cy="250" rx="65" ry="35" fill="url(#cloud-sym)" filter="url(#blur-cloud)" class="s1-cloud" />
            
            <!-- Atoms -->
            <g class="s1-h1">
                <circle cx="360" cy="250" r="20" fill="url(#h-grad)" />
                <text x="360" cy="255" text-anchor="middle" class="atom-label">H</text>
            </g>
            <g class="s1-h2">
                <circle cx="440" cy="250" r="20" fill="url(#h-grad)" />
                <text x="440" cy="255" text-anchor="middle" class="atom-label">H</text>
            </g>
            
            <!-- Shared Electrons -->
            <circle cx="400" cy="242" r="4" fill="url(#e-grad)" />
            <circle cx="400" cy="258" r="4" fill="url(#e-grad)" />
            
            <!-- Label -->
            <text x="400" y="390" text-anchor="middle" class="dynamic-label">Non-polar Covalent: Equal Sharing (H<tspan baseline-shift="sub" font-size="14">2</tspan>)</text>
        </g>

        <!-- ========================================== -->
        <!-- STATE 2: Polar Covalent                    -->
        <!-- ========================================== -->
        <g class="state2">
            <!-- Pear-shaped Electron Cloud -->
            <path d="M 340 250 C 340 200, 480 180, 480 250 C 480 320, 340 300, 340 250 Z" fill="url(#cloud-sym)" filter="url(#blur-cloud)" class="s2-cloud" />
            
            <!-- Atoms -->
            <g>
                <circle cx="340" cy="250" r="20" fill="url(#h-grad)" />
                <text x="340" cy="255" text-anchor="middle" class="atom-label">H</text>
                <text x="340" cy="215" text-anchor="middle" class="charge-label" fill="#FF4444">δ+</text>
            </g>
            <g>
                <circle cx="460" cy="250" r="35" fill="url(#f-grad)" />
                <text x="460" cy="255" text-anchor="middle" class="atom-label">F</text>
                <text x="460" cy="195" text-anchor="middle" class="charge-label" fill="#4444FF">δ-</text>
            </g>
            
            <!-- Shifted Electrons -->
            <circle cx="430" cy="242" r="4" fill="url(#e-grad)" />
            <circle cx="430" cy="258" r="4" fill="url(#e-grad)" />
            
            <!-- Label -->
            <text x="400" y="390" text-anchor="middle" class="dynamic-label">Polar Covalent: Inductive Effect (&#x03C7;<tspan baseline-shift="sub" font-size="14">F</tspan> &gt; &#x03C7;<tspan baseline-shift="sub" font-size="14">H</tspan>)</text>
        </g>

        <!-- ========================================== -->
        <!-- STATE 3: Hydrogen Bonding                  -->
        <!-- ========================================== -->
        <g class="state3">
            <!-- Molecule 1 -->
            <g>
                <circle cx="200" cy="250" r="20" fill="url(#h-grad)" />
                <text x="200" cy="255" text-anchor="middle" class="atom-label">H</text>
                <text x="200" cy="215" text-anchor="middle" class="charge-label" fill="#FF4444">δ+</text>
                
                <circle cx="300" cy="250" r="35" fill="url(#f-grad)" />
                <text x="300" cy="255" text-anchor="middle" class="atom-label">F</text>
                <text x="300" cy="195" text-anchor="middle" class="charge-label" fill="#4444FF">δ-</text>
                
                <!-- Covalent Bond -->
                <line x1="220" y1="250" x2="265" y2="250" stroke="#404040" stroke-width="4" />
            </g>
            
            <!-- Hydrogen Bond -->
            <line x1="335" y1="250" x2="415" y2="250" stroke="#7209B7" stroke-width="4" stroke-dasharray="8,6" class="s3-hbond" />
            <text x="375" y="235" text-anchor="middle" font-family="Inter" font-weight="600" font-size="12" fill="#7209B7" class="s3-hbond-text">H-Bond</text>

            <!-- Molecule 2 -->
            <g class="s3-mol2">
                <circle cx="435" cy="250" r="20" fill="url(#h-grad)" />
                <text x="435" cy="255" text-anchor="middle" class="atom-label">H</text>
                <text x="435" cy="215" text-anchor="middle" class="charge-label" fill="#FF4444">δ+</text>
                
                <circle cx="535" cy="250" r="35" fill="url(#f-grad)" />
                <text x="535" cy="255" text-anchor="middle" class="atom-label">F</text>
                <text x="535" cy="195" text-anchor="middle" class="charge-label" fill="#4444FF">δ-</text>
                
                <!-- Covalent Bond -->
                <line x1="455" y1="250" x2="500" y2="250" stroke="#404040" stroke-width="4" />
            </g>
            
            <!-- Label -->
            <text x="400" y="390" text-anchor="middle" class="dynamic-label">Hydrogen Bond: Intermolecular Dipole Attraction</text>
        </g>

        <!-- ========================================== -->
        <!-- STATE 4: Ionic Bond                        -->
        <!-- ========================================== -->
        <g class="state4">
            <!-- Electrostatic Glow -->
            <ellipse cx="400" cy="250" rx="120" ry="80" fill="none" stroke="#FFD700" stroke-width="3" stroke-dasharray="10,10" class="s4-glow" filter="url(#blur-cloud)" opacity="0.6" />

            <!-- Sodium Atom -->
            <g>
                <circle cx="300" cy="250" r="40" fill="url(#na-grad)" class="s4-na-circle" />
                <text x="300" cy="255" text-anchor="middle" class="atom-label">Na</text>
                <text x="300" cy="190" text-anchor="middle" class="charge-label s4-charge" fill="#FF4444">+1</text>
            </g>
            
            <!-- Chlorine Atom -->
            <g>
                <circle cx="500" cy="250" r="45" fill="url(#cl-grad)" class="s4-cl-circle" />
                <text x="500" cy="255" text-anchor="middle" class="atom-label">Cl</text>
                <text x="500" cy="175" text-anchor="middle" class="charge-label s4-charge" fill="#4444FF">-1</text>
            </g>
            
            <!-- Electron Transfer Arrow -->
            <path d="M 300 200 Q 400 100 500 195" fill="none" stroke="#F77F00" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#fishhook)" class="s4-arrow" />
            
            <!-- Moving Electron -->
            <g class="s4-e-group">
                <circle cx="0" cy="0" r="5" fill="url(#e-grad)" />
            </g>
            
            <!-- Label -->
            <text x="400" y="390" text-anchor="middle" class="dynamic-label">Ionic Bond: Complete Electron Transfer (NaCl)</text>
        </g>

        <!-- ========================================== -->
        <!-- Legend & UI Elements                       -->
        <!-- ========================================== -->
        <g transform="translate(180, 450)" class="legend-text">
            <circle cx="0" cy="0" r="6" fill="#CCCCCC"/> <text x="12" y="4">Hydrogen</text>
            <circle cx="85" cy="0" r="6" fill="#90EE90"/> <text x="97" y="4">Fluorine</text>
            <circle cx="165" cy="0" r="6" fill="#B19CD9"/> <text x="177" y="4">Sodium</text>
            <circle cx="245" cy="0" r="6" fill="#44CC44"/> <text x="257" y="4">Chlorine</text>
            <circle cx="335" cy="0" r="4" fill="#FFD700"/> <text x="345" y="4">Valence Electron</text>
        </g>

        <!-- Progress Bar -->
        <rect x="0" y="495" height="5" fill="#F77F00" class="progress-bar" />
    </svg>
</div>

</body>
</html>
