<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biological Classification: The Five Kingdoms</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

    body {
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
    }

    svg {
        width: 100%;
        height: 100%;
        max-width: 1200px;
    }

    text {
        font-family: 'Inter', sans-serif;
    }

    .mono {
        font-family: 'Roboto Mono', monospace;
    }

    /* --- Animations --- */

    /* Ancestor Pulse */
    .ancestor {
        transform-origin: 400px 550px;
        animation: pulseAncestor 2s infinite ease-in-out;
    }
    @keyframes pulseAncestor {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
    }

    /* Branch 1 (Root to Monera) */
    .branch1 {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawB1 15s infinite ease-in-out;
    }
    @keyframes drawB1 {
        0%, 5% { stroke-dashoffset: 100; }
        10%, 90% { stroke-dashoffset: 0; }
        95%, 100% { stroke-dashoffset: 100; }
    }

    /* Monera Group */
    .monera-group {
        animation: fadeMonera 15s infinite;
    }
    @keyframes fadeMonera {
        0%, 10% { opacity: 0; }
        12%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* Binary Fission */
    .monera-main {
        animation: fissionMain 15s infinite ease-in-out;
    }
    .monera-clone {
        animation: fissionClone 15s infinite ease-in-out;
    }
    @keyframes fissionMain {
        0%, 16% { transform: translateX(0); }
        20%, 90% { transform: translateX(-35px); }
        95%, 100% { transform: translateX(0); }
    }
    @keyframes fissionClone {
        0%, 15% { opacity: 0; transform: translateX(0); }
        16% { opacity: 1; transform: translateX(0); }
        20%, 90% { opacity: 1; transform: translateX(35px); }
        95%, 100% { opacity: 0; transform: translateX(0); }
    }

    /* Branch 2 (Monera to Protista) */
    .branch2 {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: drawB2 15s infinite ease-in-out;
    }
    @keyframes drawB2 {
        0%, 20% { stroke-dashoffset: 100; }
        25%, 90% { stroke-dashoffset: 0; }
        95%, 100% { stroke-dashoffset: 100; }
    }

    /* Protista Group */
    .protista-group {
        animation: fadeProtista 15s infinite;
    }
    @keyframes fadeProtista {
        0%, 25% { opacity: 0; }
        28%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* Protista Nucleus */
    .protista-nucleus {
        animation: fadeNucleus 15s infinite;
    }
    @keyframes fadeNucleus {
        0%, 30% { opacity: 0; }
        35%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* Top Branches */
    .branch-top {
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        animation: drawBTop 15s infinite ease-in-out;
    }
    @keyframes drawBTop {
        0%, 35% { stroke-dashoffset: 400; }
        42%, 90% { stroke-dashoffset: 0; }
        95%, 100% { stroke-dashoffset: 400; }
    }

    /* Top Cells */
    .top-cell {
        animation: fadeTop 15s infinite;
    }
    @keyframes fadeTop {
        0%, 42% { opacity: 0; }
        45%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* Plantae Twinkle */
    .chloroplast {
        animation: twinkle 15s infinite;
    }
    @keyframes twinkle {
        0%, 45% { opacity: 0.5; }
        50%, 60%, 70%, 80% { opacity: 1; }
        55%, 65%, 75%, 85% { opacity: 0.3; }
        90%, 100% { opacity: 0.5; }
    }

    /* Animalia Pulse */
    .energy-pulse {
        transform-origin: 600px 140px;
        animation: energyPulse 15s infinite ease-out;
    }
    @keyframes energyPulse {
        0%, 45% { transform: scale(0.8); opacity: 0; }
        50%, 65%, 80% { transform: scale(1.4); opacity: 0; }
        55%, 70%, 85% { transform: scale(1); opacity: 0.6; }
        90%, 100% { opacity: 0; }
    }

    /* Fungi Hyphae */
    .hyphae {
        stroke-dasharray: 40;
        stroke-dashoffset: 40;
        animation: growHyphae 15s infinite ease-out;
    }
    @keyframes growHyphae {
        0%, 45% { stroke-dashoffset: 40; }
        52%, 90% { stroke-dashoffset: 0; }
        95%, 100% { stroke-dashoffset: 40; }
    }

    /* Acellular Group */
    .acellular-group {
        animation: fadeAcellular 15s infinite;
    }
    @keyframes fadeAcellular {
        0%, 65% { opacity: 0; }
        68%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    /* Acellular Glitch */
    .glitch-element {
        animation: glitch 15s infinite;
    }
    @keyframes glitch {
        0%, 70% { transform: translate(0, 0); }
        71% { transform: translate(-2px, 2px); }
        72% { transform: translate(2px, -2px); }
        73% { transform: translate(0, 0); }
        81% { transform: translate(2px, 2px); }
        82% { transform: translate(-2px, -2px); }
        83% { transform: translate(0, 0); }
        100% { transform: translate(0, 0); }
    }

    /* Transition Labels */
    .transition-label1 { animation: fadeL1 15s infinite; }
    @keyframes fadeL1 {
        0%, 25% { opacity: 0; }
        30%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

    .transition-label2 { animation: fadeL2 15s infinite; }
    @keyframes fadeL2 {
        0%, 40% { opacity: 0; }
        45%, 90% { opacity: 1; }
        95%, 100% { opacity: 0; }
    }

</style>
</head>
<body>

<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <radialGradient id="cytoGrad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#E8F4FD" />
        </radialGradient>
        <linearGradient id="plantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2ECC71" />
            <stop offset="100%" stop-color="#27AE60" />
        </linearGradient>
        <linearGradient id="fungiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#F5DEB3" />
            <stop offset="100%" stop-color="#D2B48C" />
        </linearGradient>
        <radialGradient id="ancestorGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F39C12" />
            <stop offset="100%" stop-color="#E67E22" />
        </radialGradient>

        <!-- Filters -->
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2C3E50" flood-opacity="0.15"/>
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- Title -->
    <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="700" fill="#2C3E50">Biological Classification: The Five Kingdoms</text>
    <text x="400" y="65" text-anchor="middle" font-size="14" font-weight="400" fill="#7f8c8d">Whittaker's Phylogenetic Tree &amp; Acellular Microbes</text>

    <!-- Legend -->
    <g transform="translate(20, 20)">
        <rect x="0" y="0" width="130" height="140" rx="8" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" filter="url(#shadow)"/>
        <text x="10" y="20" font-size="12" font-weight="600" fill="#2C3E50">Key</text>
        
        <circle cx="15" cy="35" r="5" fill="#2C3E50"/>
        <text x="28" y="39" font-size="11" fill="#34495e">Nucleus</text>
        
        <line x1="10" y1="55" x2="20" y2="55" stroke="#FF6B6B" stroke-width="3" stroke-linecap="round"/>
        <text x="28" y="59" font-size="11" fill="#34495e">DNA</text>
        
        <line x1="10" y1="75" x2="20" y2="75" stroke="#FFA07A" stroke-width="3" stroke-linecap="round"/>
        <text x="28" y="79" font-size="11" fill="#34495e">RNA</text>
        
        <circle cx="15" cy="95" r="5" fill="#27AE60"/>
        <text x="28" y="99" font-size="11" fill="#34495e">Chloroplast</text>

        <path d="M 10 115 Q 15 110 20 115" fill="none" stroke="#E74C3C" stroke-width="2" stroke-linecap="round"/>
        <text x="28" y="119" font-size="11" fill="#34495e">Mitochondria</text>
    </g>

    <!-- ==================== PHYLOGENETIC TREE ==================== -->

    <!-- Branches -->
    <g stroke="#bdc3c7" stroke-width="3" fill="none" stroke-linecap="round">
        <path class="branch1" d="M 400 535 L 400 480" />
        <path class="branch2" d="M 400 420 L 400 350" />
        <path class="branch-top" d="M 400 270 L 400 180" /> <!-- To Plantae -->
        <path class="branch-top" d="M 390 280 Q 200 260 200 180" /> <!-- To Fungi -->
        <path class="branch-top" d="M 410 280 Q 600 260 600 180" /> <!-- To Animalia -->
    </g>

    <!-- Transition Labels -->
    <text class="transition-label1" x="415" y="390" font-size="12" font-weight="600" fill="#95a5a6">Prokaryotic → Eukaryotic</text>
    <text class="transition-label2" x="415" y="240" font-size="12" font-weight="600" fill="#95a5a6">Unicellular → Multicellular</text>

    <!-- Root (Common Ancestor) -->
    <circle class="ancestor" cx="400" cy="550" r="15" fill="url(#ancestorGrad)" filter="url(#glow)"/>
    <text x="400" y="585" text-anchor="middle" font-size="12" font-weight="600" fill="#7f8c8d">Common Ancestor</text>

    <!-- ==================== KINGDOM MONERA ==================== -->
    <g class="monera-group">
        <!-- Main Cell -->
        <g class="monera-main">
            <rect x="375" y="430" width="50" height="26" rx="13" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
            <!-- Circular DNA (Nucleoid) -->
            <path d="M 390 443 C 385 435, 395 430, 400 438 C 405 445, 415 435, 410 443 C 405 450, 395 450, 390 443 Z" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
        </g>
        <!-- Clone Cell (For Binary Fission) -->
        <g class="monera-clone">
            <rect x="375" y="430" width="50" height="26" rx="13" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
            <path d="M 390 443 C 385 435, 395 430, 400 438 C 405 445, 415 435, 410 443 C 405 450, 395 450, 390 443 Z" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
        </g>
        <text x="320" y="448" font-size="14" font-weight="700" fill="#2C3E50">Monera</text>
        <text x="320" y="463" font-size="11" fill="#7f8c8d">Bacteria</text>
    </g>

    <!-- ==================== KINGDOM PROTISTA ==================== -->
    <g class="protista-group">
        <!-- Amoeba Shape -->
        <path d="M 380 310 C 360 280, 400 270, 420 285 C 445 300, 435 330, 415 340 C 390 350, 365 340, 380 310 Z" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
        <!-- Nucleus (Fades in) -->
        <circle class="protista-nucleus" cx="405" cy="310" r="8" fill="#2C3E50"/>
        
        <text x="310" y="315" font-size="14" font-weight="700" fill="#2C3E50">Protista</text>
        <text x="310" y="330" font-size="11" fill="#7f8c8d">Amoeba</text>
    </g>

    <!-- ==================== KINGDOM PLANTAE ==================== -->
    <g class="top-cell">
        <!-- Leaf Shape -->
        <path d="M 400 100 C 440 100, 450 150, 400 180 C 350 150, 360 100, 400 100 Z" fill="url(#plantGrad)" stroke="#27AE60" stroke-width="2" filter="url(#shadow)"/>
        <!-- Cell Wall Inner Line -->
        <path d="M 400 106 C 432 106, 440 146, 400 172 C 360 146, 368 106, 400 106 Z" fill="none" stroke="#2ECC71" stroke-width="1"/>
        <!-- Chloroplasts -->
        <circle class="chloroplast" cx="390" cy="130" r="4" fill="#145A32"/>
        <circle class="chloroplast" cx="410" cy="140" r="4" fill="#145A32"/>
        <circle class="chloroplast" cx="395" cy="155" r="4" fill="#145A32"/>
        <!-- Nucleus -->
        <circle cx="400" cy="120" r="6" fill="#2C3E50"/>

        <text x="400" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">Plantae</text>
        <text x="400" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#27AE60">Autotrophic</text>
    </g>

    <!-- ==================== KINGDOM FUNGI ==================== -->
    <g class="top-cell">
        <!-- Hyphae (Growing) -->
        <path class="hyphae" d="M 200 170 L 180 190 M 200 170 L 220 185 M 180 190 L 170 200 M 220 185 L 235 190" stroke="#D2B48C" stroke-width="3" stroke-linecap="round" fill="none"/>
        
        <!-- Mushroom Stalk -->
        <rect x="192" y="140" width="16" height="35" rx="4" fill="#F5DEB3" stroke="#D2B48C" stroke-width="2"/>
        <!-- Mushroom Cap -->
        <path d="M 160 140 Q 200 90 240 140 Z" fill="url(#fungiGrad)" stroke="#8b7355" stroke-width="2" filter="url(#shadow)"/>
        <!-- Cap Spots -->
        <circle cx="185" cy="125" r="3" fill="#FFF8DC"/>
        <circle cx="215" cy="125" r="3" fill="#FFF8DC"/>
        <circle cx="200" cy="115" r="4" fill="#FFF8DC"/>

        <text x="200" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">Fungi</text>
        <text x="200" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#D2B48C">Saprophytic</text>
    </g>

    <!-- ==================== KINGDOM ANIMALIA ==================== -->
    <g class="top-cell">
        <!-- Energy Pulse -->
        <circle class="energy-pulse" cx="600" cy="140" r="35" fill="none" stroke="#E74C3C" stroke-width="2"/>
        
        <!-- Animal Cell -->
        <circle cx="600" cy="140" r="35" fill="url(#cytoGrad)" stroke="#4A90D9" stroke-width="2" filter="url(#shadow)"/>
        <!-- Nucleus -->
        <circle cx="600" cy="140" r="8" fill="#2C3E50"/>
        <!-- Mitochondria -->
        <path d="M 575 130 Q 580 125 585 130" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
        <path d="M 615 150 Q 620 155 625 150" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>
        <path d="M 590 160 Q 595 165 600 160" fill="none" stroke="#E74C3C" stroke-width="3" stroke-linecap="round"/>

        <text x="600" y="75" text-anchor="middle" font-size="14" font-weight="700" fill="#2C3E50">Animalia</text>
        <text x="600" y="90" text-anchor="middle" font-size="11" font-weight="600" fill="#E74C3C">Heterotrophic</text>
    </g>

    <!-- ==================== ACELLULAR MICROBES ==================== -->
    <g class="acellular-group">
        <!-- Box Outline -->
        <rect x="620" y="320" width="160" height="230" rx="10" fill="#ffffff" stroke="#bdc3c7" stroke-width="2" stroke-dasharray="6,4" filter="url(#shadow)"/>
        <text x="700" y="345" text-anchor="middle" font-size="14" font-weight="700" fill="#E74C3C">Acellular Agents</text>
        <text x="700" y="360" text-anchor="middle" font-size="10" fill="#7f8c8d">Not in 5-Kingdom System</text>

        <g class="glitch-element">
            <!-- Virus -->
            <g transform="translate(650, 385)">
                <!-- Icosahedral Capsid -->
                <polygon points="15,0 30,8 30,22 15,30 0,22 0,8" fill="#98D8C8" stroke="#2C3E50" stroke-width="1.5"/>
                <line x1="15" y1="0" x2="15" y2="30" stroke="#2C3E50" stroke-width="0.5"/>
                <line x1="0" y1="8" x2="30" y2="22" stroke="#2C3E50" stroke-width="0.5"/>
                <line x1="0" y1="22" x2="30" y2="8" stroke="#2C3E50" stroke-width="0.5"/>
                <!-- Viral DNA/RNA -->
                <path d="M 10 10 Q 15 15 20 10 T 25 20" fill="none" stroke="#FF6B6B" stroke-width="1.5"/>
                <text x="45" y="20" class="mono" font-size="12" font-style="italic" fill="#2C3E50">Viruses</text>
            </g>

            <!-- Viroid -->
            <g transform="translate(650, 445)">
                <!-- Naked RNA Loop -->
                <path d="M 5 15 C -5 5, 35 5, 25 15 C 15 25, -5 25, 5 15 Z" fill="none" stroke="#FFA07A" stroke-width="2"/>
                <text x="45" y="20" class="mono" font-size="12" font-style="italic" fill="#2C3E50">Viroids</text>
            </g>

            <!-- Prion -->
            <g transform="translate(650, 505)">
                <!-- Misfolded Protein -->
                <path d="M 0 15 Q 5 5 10 15 T 20 15 T 30 15" fill="none" stroke="#98D8C8" stroke-width="3" stroke-linecap="round"/>
                <text x="45" y="20" class="mono" font-size="12" font-style="italic" fill="#2C3E50">Prions</text>
            </g>
        </g>
    </g>

</svg>

</body>
</html>
