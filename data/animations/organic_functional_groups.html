<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organic Functional Groups: Acid-Soluble Pool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9fa;
            color: #2C3E50;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 30px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 10px;
            color: #2C3E50;
        }

        .subtitle {
            text-align: center;
            font-size: 16px;
            color: #7F8C8D;
            margin-bottom: 30px;
        }

        .svg-container {
            width: 100%;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .footer-note {
            text-align: center;
            font-size: 14px;
            color: #95A5A6;
            margin-top: 20px;
            font-weight: 600;
        }

        /* Typography inside SVG */
        .chem-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 16px;
            text-anchor: middle;
            dominant-baseline: central;
        }
        
        .chem-text-small {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            text-anchor: middle;
            dominant-baseline: central;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            font-size: 14px;
            text-anchor: middle;
        }

        .phase-title {
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 22px;
            text-anchor: middle;
            fill: #2C3E50;
        }

        /* Continuous Pulse Animation for Active Groups */
        @keyframes pulse {
            0% { filter: url(#glow); transform: scale(0.98); }
            100% { filter: url(#glow-strong); transform: scale(1.05); }
        }
        .pulse {
            animation: pulse 1.5s infinite alternate ease-in-out;
            transform-origin: center;
            transform-box: fill-box;
        }

        /* Bubble Animation for Beaker */
        @keyframes rise {
            0% { transform: translateY(0) scale(1); opacity: 0.6; }
            100% { transform: translateY(-180px) scale(1.5); opacity: 0; }
        }
        .bubble1 { animation: rise 5s infinite ease-in; transform-origin: center; transform-box: fill-box; }
        .bubble2 { animation: rise 7s infinite ease-in 2s; transform-origin: center; transform-box: fill-box; }
        .bubble3 { animation: rise 6s infinite ease-in 4s; transform-origin: center; transform-box: fill-box; }

        /* --- 15 Second Global Loop Keyframes --- */
        
        /* Phase 1: Amino Acid (0% - 33.33%) */
        .anim-p1-skel { animation: p1-skel 15s infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes p1-skel {
            0%, 33.33%, 100% { opacity: 0; transform: scale(0.9); }
            2%, 31.33% { opacity: 1; transform: scale(1); }
        }

        .anim-p1-amino { animation: p1-amino 15s infinite; }
        @keyframes p1-amino {
            0%, 2%, 33.33%, 100% { opacity: 0; transform: translateX(-50px); }
            5%, 31.33% { opacity: 1; transform: translateX(0); }
        }

        .anim-p1-carboxyl { animation: p1-carboxyl 15s infinite; }
        @keyframes p1-carboxyl {
            0%, 2%, 33.33%, 100% { opacity: 0; transform: translateX(50px); }
            5%, 31.33% { opacity: 1; transform: translateX(0); }
        }

        .anim-p1-methyl { animation: p1-methyl 15s infinite; }
        @keyframes p1-methyl {
            0%, 2%, 33.33%, 100% { opacity: 0; transform: translateY(50px); }
            5%, 31.33% { opacity: 1; transform: translateY(0); }
        }

        .anim-p1-h { animation: p1-h 15s infinite; }
        @keyframes p1-h {
            0%, 2%, 33.33%, 100% { opacity: 0; transform: translateY(-50px); }
            5%, 31.33% { opacity: 1; transform: translateY(0); }
        }

        /* Phase 2: Monosaccharide (33.33% - 66.66%) */
        .anim-p2-skel { animation: p2-skel 15s infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes p2-skel {
            0%, 33.33%, 66.66%, 100% { opacity: 0; transform: scale(0.9); }
            35.33%, 64.66% { opacity: 1; transform: scale(1); }
        }

        .anim-p2-oh { animation: p2-oh 15s infinite; }
        @keyframes p2-oh {
            0%, 35.33%, 66.66%, 100% { opacity: 0; transform: translateY(50px); }
            38.33%, 64.66% { opacity: 1; transform: translateY(0); }
        }

        .anim-p2-ald { animation: p2-ald 15s infinite; }
        @keyframes p2-ald {
            0%, 35.33%, 66.66%, 100% { opacity: 0; transform: translate(-30px, -30px); }
            38.33%, 64.66% { opacity: 1; transform: translate(0, 0); }
        }

        /* Phase 3: Nucleotide Precursor (66.66% - 100%) */
        .anim-p3-skel { animation: p3-skel 15s infinite; transform-origin: center; transform-box: fill-box; }
        @keyframes p3-skel {
            0%, 66.66%, 100% { opacity: 0; transform: scale(0.9); }
            68.66%, 98% { opacity: 1; transform: scale(1); }
        }

        .anim-p3-phos { animation: p3-phos 15s infinite; }
        @keyframes p3-phos {
            0%, 68.66%, 100% { opacity: 0; transform: translate(-50px, -50px); }
            71.66%, 98% { opacity: 1; transform: translate(0, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Organic Functional Groups</h1>
    <div class="subtitle">The Building Blocks of the Acid-Soluble Pool</div>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of organic functional groups forming biomolecules">
            <defs>
                <!-- Glow Filters for Active Functional Groups -->
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-strong" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="5" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                
                <!-- Drop Shadow for Beaker -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity="0.05" />
                </filter>
            </defs>

            <!-- BACKGROUND: The Acid Soluble Pool (Beaker) -->
            <g filter="url(#shadow)">
                <!-- Beaker Back/Liquid -->
                <path d="M 180 180 L 180 400 A 20 20 0 0 0 200 420 L 600 420 A 20 20 0 0 0 620 400 L 620 180 Z" fill="#E8F4FD" opacity="0.7" />
                <!-- Beaker Outline -->
                <path d="M 160 140 L 180 140 L 180 400 A 20 20 0 0 0 200 420 L 600 420 A 20 20 0 0 0 620 400 L 620 140 L 640 140" fill="none" stroke="#4A90D9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" />
                <!-- Liquid Surface Line -->
                <line x1="180" y1="180" x2="620" y2="180" stroke="#4A90D9" stroke-width="3" stroke-dasharray="8 4" opacity="0.4" />
                
                <!-- Animated Bubbles -->
                <circle cx="250" cy="380" r="6" fill="#FFFFFF" class="bubble1" />
                <circle cx="550" cy="400" r="4" fill="#FFFFFF" class="bubble2" />
                <circle cx="400" cy="360" r="8" fill="#FFFFFF" class="bubble3" />
            </g>

            <!-- ========================================== -->
            <!-- PHASE 1: AMINO ACID (ALANINE)              -->
            <!-- ========================================== -->
            <g class="phase1">
                <!-- Title -->
                <text x="400" y="80" class="phase-title anim-p1-skel">Amino Acid (Alanine)</text>

                <!-- Left: Amino Group -->
                <g class="anim-p1-amino">
                    <line x1="400" y1="260" x2="310" y2="260" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="280" cy="260" r="28" fill="#F1C40F" class="pulse" />
                    <text x="280" y="260" class="chem-text" fill="#2C3E50">NH<tspan baseline-shift="sub" font-size="0.7em">3</tspan><tspan baseline-shift="super" font-size="0.7em">⁺</tspan></text>
                    <text x="280" y="215" class="label-text" fill="#F39C12">Amino Group</text>
                </g>

                <!-- Right: Carboxyl Group -->
                <g class="anim-p1-carboxyl">
                    <line x1="400" y1="260" x2="490" y2="260" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="520" cy="260" r="28" fill="#E74C3C" class="pulse" />
                    <text x="520" y="260" class="chem-text" fill="#FFFFFF">COO<tspan baseline-shift="super" font-size="0.7em">⁻</tspan></text>
                    <text x="520" y="215" class="label-text" fill="#E74C3C">Carboxyl Group</text>
                </g>

                <!-- Bottom: Methyl Group (R-Group) -->
                <g class="anim-p1-methyl">
                    <line x1="400" y1="260" x2="400" y2="330" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="400" cy="350" r="24" fill="#2ECC71" class="pulse" />
                    <text x="400" y="350" class="chem-text" fill="#2C3E50">CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan></text>
                    <text x="400" y="395" class="label-text" fill="#27AE60">Methyl (R-Group)</text>
                </g>

                <!-- Top: Hydrogen -->
                <g class="anim-p1-h">
                    <line x1="400" y1="260" x2="400" y2="190" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="400" cy="170" r="16" fill="#BDC3C7" />
                    <text x="400" y="170" class="chem-text" fill="#2C3E50">H</text>
                </g>

                <!-- Center: Alpha Carbon (Drawn last to overlap bonds) -->
                <g class="anim-p1-skel">
                    <circle cx="400" cy="260" r="22" fill="#7F8C8D" />
                    <text x="400" y="260" class="chem-text" fill="#FFFFFF">C<tspan baseline-shift="sub" font-size="0.7em">α</tspan></text>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- PHASE 2: MONOSACCHARIDE (GLYCERALDEHYDE)   -->
            <!-- ========================================== -->
            <g class="phase2">
                <!-- Title -->
                <text x="400" y="80" class="phase-title anim-p2-skel">Monosaccharide (Glyceraldehyde)</text>

                <!-- C2 Hydroxyl -->
                <g class="anim-p2-oh">
                    <line x1="400" y1="260" x2="400" y2="330" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="400" cy="350" r="24" fill="#3498DB" class="pulse" />
                    <text x="400" y="350" class="chem-text" fill="#FFFFFF">OH</text>
                    <text x="400" y="395" class="label-text" fill="#2980B9">Hydroxyl</text>
                </g>

                <!-- C3 Hydroxyl -->
                <g class="anim-p2-oh" style="animation-delay: 0.1s;">
                    <line x1="500" y1="260" x2="500" y2="330" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="500" cy="350" r="24" fill="#3498DB" class="pulse" />
                    <text x="500" y="350" class="chem-text" fill="#FFFFFF">OH</text>
                    <text x="500" y="395" class="label-text" fill="#2980B9">Hydroxyl</text>
                </g>

                <!-- C1 Aldehyde Oxygen -->
                <g class="anim-p2-ald">
                    <line x1="294" y1="260" x2="294" y2="190" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <line x1="306" y1="260" x2="306" y2="190" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="300" cy="170" r="24" fill="#E74C3C" class="pulse" />
                    <text x="300" y="170" class="chem-text" fill="#FFFFFF">O</text>
                    <text x="300" y="130" class="label-text" fill="#C0392B">Aldehyde Group</text>
                </g>

                <!-- Carbon Skeleton & Hydrogens -->
                <g class="anim-p2-skel">
                    <!-- C-C Bonds -->
                    <line x1="300" y1="260" x2="500" y2="260" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- C1 H -->
                    <line x1="300" y1="260" x2="240" y2="260" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="220" cy="260" r="16" fill="#BDC3C7" />
                    <text x="220" y="260" class="chem-text" fill="#2C3E50">H</text>

                    <!-- C2 H -->
                    <line x1="400" y1="260" x2="400" y2="200" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="400" cy="180" r="16" fill="#BDC3C7" />
                    <text x="400" y="180" class="chem-text" fill="#2C3E50">H</text>

                    <!-- C3 H (Top) -->
                    <line x1="500" y1="260" x2="500" y2="200" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="500" cy="180" r="16" fill="#BDC3C7" />
                    <text x="500" y="180" class="chem-text" fill="#2C3E50">H</text>

                    <!-- C3 H (Right) -->
                    <line x1="500" y1="260" x2="560" y2="260" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <circle cx="580" cy="260" r="16" fill="#BDC3C7" />
                    <text x="580" y="260" class="chem-text" fill="#2C3E50">H</text>

                    <!-- Carbons -->
                    <circle cx="300" cy="260" r="20" fill="#7F8C8D" />
                    <text x="300" y="260" class="chem-text" fill="#FFFFFF">C</text>
                    
                    <circle cx="400" cy="260" r="20" fill="#7F8C8D" />
                    <text x="400" y="260" class="chem-text" fill="#FFFFFF">C</text>
                    
                    <circle cx="500" cy="260" r="20" fill="#7F8C8D" />
                    <text x="500" y="260" class="chem-text" fill="#FFFFFF">C</text>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- PHASE 3: NUCLEOTIDE PRECURSOR              -->
            <!-- ========================================== -->
            <g class="phase3">
                <!-- Title -->
                <text x="400" y="80" class="phase-title anim-p3-skel">Nucleotide Precursor (Ribose-5-Phosphate)</text>

                <!-- Phosphate Group Attaching to C5' -->
                <g class="anim-p3-phos">
                    <!-- Bond to C5' -->
                    <line x1="290" y1="220" x2="240" y2="170" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <!-- Ester Oxygen -->
                    <circle cx="240" cy="170" r="16" fill="#E74C3C" />
                    <text x="240" y="170" class="chem-text-small" fill="#FFFFFF">O</text>
                    
                    <!-- Bond O to P -->
                    <line x1="240" y1="170" x2="190" y2="130" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- Central Phosphorus -->
                    <circle cx="190" cy="130" r="28" fill="#9B59B6" class="pulse" />
                    <text x="190" y="130" class="chem-text" fill="#FFFFFF">P</text>
                    
                    <!-- Oxygen Satellites -->
                    <line x1="190" y1="130" x2="190" y2="85" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="190" cy="85" r="14" fill="#E74C3C" />
                    <text x="190" y="85" class="chem-text-small" fill="#FFFFFF">O⁻</text>

                    <line x1="190" y1="130" x2="145" y2="130" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="145" cy="130" r="14" fill="#E74C3C" />
                    <text x="145" y="130" class="chem-text-small" fill="#FFFFFF">O⁻</text>

                    <line x1="186" y1="130" x2="186" y2="175" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <line x1="194" y1="130" x2="194" y2="175" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="190" cy="175" r="14" fill="#E74C3C" />
                    <text x="190" y="175" class="chem-text-small" fill="#FFFFFF">O</text>

                    <text x="190" y="50" class="label-text" fill="#8E44AD">Phosphate Group</text>
                </g>

                <!-- Pentose Skeleton (Ribose) -->
                <g class="anim-p3-skel">
                    <!-- Ring Bonds -->
                    <line x1="400" y1="220" x2="450" y2="255" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <line x1="450" y1="255" x2="430" y2="315" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <line x1="430" y1="315" x2="370" y2="315" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <line x1="370" y1="315" x2="350" y2="255" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    <line x1="350" y1="255" x2="400" y2="220" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />
                    
                    <!-- C4' to C5' Bond -->
                    <line x1="350" y1="255" x2="290" y2="220" stroke="#95A5A6" stroke-width="6" stroke-linecap="round" />

                    <!-- Static OH Groups for Context -->
                    <line x1="450" y1="255" x2="500" y2="255" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="515" cy="255" r="14" fill="#3498DB" />
                    <text x="515" y="255" class="chem-text-small" fill="#FFFFFF">OH</text>

                    <line x1="430" y1="315" x2="450" y2="360" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="460" cy="375" r="14" fill="#3498DB" />
                    <text x="460" y="375" class="chem-text-small" fill="#FFFFFF">OH</text>

                    <line x1="370" y1="315" x2="350" y2="360" stroke="#95A5A6" stroke-width="4" stroke-linecap="round" />
                    <circle cx="340" cy="375" r="14" fill="#3498DB" />
                    <text x="340" y="375" class="chem-text-small" fill="#FFFFFF">OH</text>

                    <!-- Ring Atoms -->
                    <circle cx="400" cy="220" r="18" fill="#E74C3C" />
                    <text x="400" y="220" class="chem-text" fill="#FFFFFF">O</text>

                    <circle cx="450" cy="255" r="18" fill="#7F8C8D" />
                    <text x="450" y="255" class="chem-text" fill="#FFFFFF">C</text>

                    <circle cx="430" cy="315" r="18" fill="#7F8C8D" />
                    <text x="430" y="315" class="chem-text" fill="#FFFFFF">C</text>

                    <circle cx="370" cy="315" r="18" fill="#7F8C8D" />
                    <text x="370" y="315" class="chem-text" fill="#FFFFFF">C</text>

                    <circle cx="350" cy="255" r="18" fill="#7F8C8D" />
                    <text x="350" y="255" class="chem-text" fill="#FFFFFF">C</text>

                    <circle cx="290" cy="220" r="18" fill="#7F8C8D" />
                    <text x="290" y="220" class="chem-text" fill="#FFFFFF">C</text>
                </g>
            </g>

            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g transform="translate(0, 460)">
                <rect x="50" y="0" width="700" height="40" rx="20" fill="#FFFFFF" opacity="0.9" />
                
                <!-- Carbon -->
                <circle cx="80" cy="20" r="8" fill="#7F8C8D" />
                <text x="95" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Carbon</text>

                <!-- Amino -->
                <circle cx="180" cy="20" r="8" fill="#F1C40F" />
                <text x="195" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Amino</text>

                <!-- Carboxyl -->
                <circle cx="280" cy="20" r="8" fill="#E74C3C" />
                <text x="295" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Carboxyl/O</text>

                <!-- Hydroxyl -->
                <circle cx="410" cy="20" r="8" fill="#3498DB" />
                <text x="425" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Hydroxyl</text>

                <!-- Phosphate -->
                <circle cx="530" cy="20" r="8" fill="#9B59B6" />
                <text x="545" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Phosphate</text>

                <!-- Methyl -->
                <circle cx="650" cy="20" r="8" fill="#2ECC71" />
                <text x="665" y="20" class="label-text" dominant-baseline="central" text-anchor="start">Methyl</text>
            </g>
        </svg>
    </div>

    <div class="footer-note">
        Note: Molecules &lt; 800 Daltons found in the Trichloroacetic Acid filtrate (Acid-Soluble Pool).
    </div>
</div>

</body>
</html>
