<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chlorophyll: Molecular Excitation and the Light-Dependent Reaction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .mono {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Animations */
        .photon {
            animation: photon-flow 10s linear infinite;
        }
        .photon-wave {
            animation: wave 0.6s ease-in-out infinite alternate;
        }
        @keyframes photon-flow {
            0% { transform: translate(180px, -180px); opacity: 0; }
            5% { opacity: 1; }
            20% { transform: translate(0, 0); opacity: 1; }
            21% { opacity: 0; }
            100% { opacity: 0; transform: translate(0, 0); }
        }
        @keyframes wave {
            0% { transform: translateY(-12px); }
            100% { transform: translateY(12px); }
        }

        .glow-pulse {
            animation: pulse 10s ease-in-out infinite;
            transform-origin: 550px 230px;
        }
        @keyframes pulse {
            0%, 19% { filter: drop-shadow(0 0 0px rgba(241, 196, 15, 0)); transform: scale(1); }
            20% { filter: drop-shadow(0 0 15px rgba(241, 196, 15, 1)); transform: scale(1.05); }
            30% { filter: drop-shadow(0 0 5px rgba(241, 196, 15, 0.5)); transform: scale(1); }
            100% { filter: drop-shadow(0 0 0px rgba(241, 196, 15, 0)); transform: scale(1); }
        }

        .electron-eject {
            animation: eject 10s ease-in infinite;
        }
        @keyframes eject {
            0%, 25% { opacity: 0; transform: translate(0, 0); }
            26% { opacity: 1; transform: translate(0, 0); }
            35% { opacity: 1; transform: translate(0, -90px); }
            40% { opacity: 0; transform: translate(0, -90px); }
            100% { opacity: 0; }
        }

        .water-mol {
            animation: water-approach 10s ease-out infinite;
        }
        @keyframes water-approach {
            0%, 40% { opacity: 0; transform: translateY(40px); }
            45% { opacity: 1; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(0); }
            51% { opacity: 0; }
            100% { opacity: 0; }
        }

        .o2-bubble {
            animation: o2-float 10s ease-in infinite;
        }
        @keyframes o2-float {
            0%, 50% { opacity: 0; transform: translate(0, 0) scale(0.5); }
            51% { opacity: 1; transform: translate(0, 0) scale(1); }
            70% { opacity: 0; transform: translate(40px, -50px) scale(1.2); }
            100% { opacity: 0; }
        }

        .h-ion {
            animation: h-float 10s ease-in infinite;
        }
        @keyframes h-float {
            0%, 50% { opacity: 0; transform: translate(0, 0); }
            51% { opacity: 1; transform: translate(0, 0); }
            70% { opacity: 0; transform: translate(-40px, 30px); }
            100% { opacity: 0; }
        }

        .electron-replace {
            animation: replace 10s ease-in infinite;
        }
        @keyframes replace {
            0%, 50% { opacity: 0; transform: translate(0, 0); }
            51% { opacity: 1; transform: translate(0, 0); }
            60% { opacity: 1; transform: translate(0, -190px); }
            61% { opacity: 0; transform: translate(0, -190px); }
            100% { opacity: 0; }
        }

        .text-fade {
            animation: fade-in-out 10s ease-in-out infinite;
        }
        @keyframes fade-in-out {
            0%, 45% { opacity: 0; }
            48%, 65% { opacity: 1; }
            68%, 100% { opacity: 0; }
        }

        .text-excited {
            animation: excited-fade 10s ease-in-out infinite;
        }
        @keyframes excited-fade {
            0%, 19% { opacity: 0; }
            22%, 35% { opacity: 1; }
            38%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram of Chlorophyll light absorption and electron excitation">
            <title>Chlorophyll a: Light Absorption & Electron Excitation</title>
            <desc>An animated diagram showing a photon hitting a chlorophyll molecule in the thylakoid membrane, ejecting an electron, which is then replaced by the photolysis of water.</desc>

            <defs>
                <!-- Lipid Bilayer Patterns -->
                <pattern id="lipid-top" width="22" height="50" patternUnits="userSpaceOnUse">
                    <circle cx="11" cy="10" r="6" fill="#4A90D9"/>
                    <path d="M8,16 Q5,25 8,35 M14,16 Q17,25 14,35" stroke="#2C3E50" stroke-width="1.5" fill="none"/>
                </pattern>
                <pattern id="lipid-bottom" width="22" height="50" patternUnits="userSpaceOnUse">
                    <circle cx="11" cy="40" r="6" fill="#4A90D9"/>
                    <path d="M8,34 Q5,25 8,15 M14,34 Q17,25 14,15" stroke="#2C3E50" stroke-width="1.5" fill="none"/>
                </pattern>

                <!-- Glow Filters -->
                <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="glow-blue" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feComponentTransfer in="blur" result="glow">
                        <feFuncA type="linear" slope="2"/>
                    </feComponentTransfer>
                    <feMerge>
                        <feMergeNode in="glow"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

                <!-- Arrowhead -->
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                    <path d="M0,0 L10,5 L0,10 Z" fill="#7F8C8D" />
                </marker>
            </defs>

            <!-- Background & Layout Dividers -->
            <rect width="800" height="500" fill="#f8f9fa" />
            <line x1="240" y1="60" x2="240" y2="480" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5" />

            <!-- Title -->
            <text x="400" y="35" font-size="22" font-weight="700" text-anchor="middle" fill="#2C3E50">Chlorophyll a: Light Absorption & Electron Excitation</text>

            <!-- ========================================== -->
            <!-- LEFT PANEL: CONTEXT VIEW (MACRO TO MICRO)  -->
            <!-- ========================================== -->
            <text x="120" y="70" font-size="14" font-weight="600" text-anchor="middle" fill="#34495E">Context: Plant Cell</text>
            
            <!-- Plant Cell -->
            <g transform="translate(120, 140)">
                <polygon points="0,-50 45,-25 45,35 0,60 -45,35 -45,-25" fill="#E8F4FD" stroke="#2ECC71" stroke-width="3"/>
                <circle cx="0" cy="0" r="20" fill="#E8F4FD" opacity="0.5"/> <!-- Vacuole -->
                <circle cx="-20" cy="-10" r="8" fill="#2C3E50"/> <!-- Nucleus -->
                <!-- Chloroplasts -->
                <ellipse cx="15" cy="-20" rx="10" ry="6" fill="#27AE60" transform="rotate(30 15 -20)"/>
                <ellipse cx="20" cy="15" rx="10" ry="6" fill="#27AE60" transform="rotate(-45 20 15)"/>
                <ellipse cx="-15" cy="25" rx="10" ry="6" fill="#27AE60" transform="rotate(15 -15 25)"/>
                
                <!-- Highlight Box -->
                <rect x="5" y="-30" width="20" height="20" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3"/>
            </g>

            <!-- Zoom Lines Cell to Chloroplast -->
            <path d="M145,110 L180,250 M125,130 L60,250" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4" fill="none"/>

            <text x="120" y="240" font-size="14" font-weight="600" text-anchor="middle" fill="#34495E">Chloroplast Detail</text>

            <!-- Chloroplast -->
            <g transform="translate(120, 340)">
                <ellipse cx="0" cy="0" rx="80" ry="50" fill="#E8F4FD" stroke="#27AE60" stroke-width="3"/>
                <ellipse cx="0" cy="0" rx="72" ry="42" fill="none" stroke="#27AE60" stroke-width="1"/>
                
                <!-- Grana (Thylakoid Stacks) -->
                <!-- Stack 1 -->
                <rect x="-45" y="-20" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="-45" y="-12" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="-45" y="-4" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <!-- Stack 2 -->
                <rect x="-10" y="-10" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="-10" y="-2" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="-10" y="6" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="-10" y="14" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <!-- Stack 3 -->
                <rect x="25" y="-15" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="25" y="-7" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                <rect x="25" y="1" width="20" height="6" rx="3" fill="#2ECC71" stroke="#1E8449" stroke-width="1"/>
                
                <!-- Stroma Lamellae -->
                <line x1="-25" y1="-8" x2="-10" y2="-8" stroke="#2ECC71" stroke-width="2"/>
                <line x1="10" y1="2" x2="25" y2="-4" stroke="#2ECC71" stroke-width="2"/>

                <!-- Highlight Box -->
                <rect x="-15" y="-15" width="30" height="40" fill="none" stroke="#E74C3C" stroke-width="1.5" stroke-dasharray="3"/>
            </g>

            <!-- Zoom Lines Chloroplast to Membrane -->
            <path d="M135,325 L250,220 M135,365 L250,380" stroke="#BDC3C7" stroke-width="1" stroke-dasharray="4" fill="none"/>

            <!-- ========================================== -->
            <!-- RIGHT PANEL: MOLECULAR MECHANISM VIEW      -->
            <!-- ========================================== -->
            <text x="520" y="70" font-size="16" font-weight="600" text-anchor="middle" fill="#34495E">Molecular Mechanism: Thylakoid Membrane</text>
            
            <!-- Compartment Labels -->
            <text x="780" y="120" font-size="14" font-weight="600" text-anchor="end" fill="#7F8C8D">STROMA (Low H⁺)</text>
            <text x="780" y="460" font-size="14" font-weight="600" text-anchor="end" fill="#7F8C8D">THYLAKOID LUMEN (High H⁺)</text>

            <!-- Thylakoid Membrane Bilayer -->
            <rect x="250" y="210" width="530" height="50" fill="url(#lipid-top)" />
            <rect x="250" y="340" width="530" height="50" fill="url(#lipid-bottom)" />
            <text x="260" y="305" font-size="12" font-weight="600" fill="#2C3E50" opacity="0.6">Hydrophobic Core</text>

            <!-- Photosystem II Protein Complex -->
            <path d="M450,200 C450,160 650,160 650,200 L650,400 C650,440 450,440 450,400 Z" fill="#98D8C8" opacity="0.25" stroke="#2C3E50" stroke-width="2" stroke-dasharray="6"/>
            <text x="640" y="305" font-size="12" font-weight="600" fill="#2C3E50" transform="rotate(-90 640 305)" text-anchor="middle">Photosystem II Complex</text>

            <!-- Primary Electron Acceptor -->
            <rect x="510" y="120" width="80" height="30" rx="4" fill="#fff" stroke="#2C3E50" stroke-width="2" stroke-dasharray="4"/>
            <text x="550" y="139" font-size="10" font-weight="600" text-anchor="middle">Acceptor</text>

            <!-- Chlorophyll a Molecule -->
            <g class="glow-pulse">
                <!-- Porphyrin Ring -->
                <polygon points="550,190 585,230 550,270 515,230" fill="#1E8449" stroke="#2ECC71" stroke-width="2"/>
                <line x1="550" y1="190" x2="550" y2="270" stroke="#2ECC71" stroke-width="1"/>
                <line x1="515" y1="230" x2="585" y2="230" stroke="#2ECC71" stroke-width="1"/>
                
                <!-- Magnesium Center -->
                <circle cx="550" cy="230" r="8" fill="#D4AC0D" stroke="#F1C40F" stroke-width="1.5"/>
                <text x="550" y="234" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Mg</text>
            </g>

            <!-- Phytol Tail -->
            <polyline points="550,270 540,285 560,300 540,315 560,330 540,345 560,360 545,375" fill="none" stroke="#27AE60" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>

            <!-- Structural Labels & Pointers -->
            <line x1="430" y1="210" x2="520" y2="220" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
            <text x="425" y="205" font-size="11" text-anchor="end">Porphyrin Ring</text>
            <text x="425" y="219" font-size="10" fill="#7F8C8D" text-anchor="end">(Light Absorbing Head)</text>

            <line x1="430" y1="250" x2="535" y2="235" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
            <text x="425" y="255" font-size="11" text-anchor="end">Magnesium Center (Mg²⁺)</text>

            <line x1="430" y1="320" x2="535" y2="320" stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)"/>
            <text x="425" y="315" font-size="11" text-anchor="end">Phytol Tail</text>
            <text x="425" y="329" font-size="10" fill="#7F8C8D" text-anchor="end">(Hydrophobic Anchor)</text>

            <!-- ========================================== -->
            <!-- ANIMATED ELEMENTS                          -->
            <!-- ========================================== -->
            
            <!-- Photon -->
            <g class="photon">
                <g class="photon-wave">
                    <circle cx="550" cy="230" r="6" fill="#F1C40F" filter="url(#glow)"/>
                    <circle cx="550" cy="230" r="3" fill="#fff"/>
                    <text x="565" y="225" font-size="12" font-weight="700" fill="#F39C12" class="mono">hν</text>
                </g>
            </g>

            <!-- Ejected Electron -->
            <g class="electron-eject">
                <circle cx="550" cy="230" r="4" fill="#3498DB" filter="url(#glow-blue)"/>
                <text x="560" y="225" font-size="12" font-weight="700" fill="#3498DB" class="mono">e⁻</text>
            </g>

            <!-- Excited State Text -->
            <text x="600" y="180" font-size="14" font-weight="700" fill="#E74C3C" class="text-excited mono">Excited State!</text>

            <!-- Water Splitting (Photolysis) -->
            <!-- Approaching Water Molecule -->
            <g class="water-mol">
                <circle cx="550" cy="420" r="7" fill="#E74C3C"/> <!-- Oxygen -->
                <circle cx="543" cy="414" r="4" fill="#fff" stroke="#BDC3C7" stroke-width="0.5"/> <!-- Hydrogen -->
                <circle cx="557" cy="414" r="4" fill="#fff" stroke="#BDC3C7" stroke-width="0.5"/> <!-- Hydrogen -->
                <text x="570" y="424" font-size="12" font-weight="600" fill="#E74C3C" class="mono">H₂O</text>
            </g>

            <!-- Split Products -->
            <!-- O2 Bubble -->
            <g class="o2-bubble">
                <circle cx="550" cy="420" r="7" fill="#E74C3C"/>
                <circle cx="560" cy="420" r="7" fill="#E74C3C"/>
                <text x="575" y="424" font-size="12" font-weight="600" fill="#E74C3C" class="mono">O₂</text>
            </g>

            <!-- H+ Ions -->
            <g class="h-ion">
                <circle cx="540" cy="425" r="4" fill="#fff" stroke="#BDC3C7" stroke-width="1"/>
                <text x="535" y="440" font-size="10" font-weight="600" fill="#7F8C8D" class="mono">H⁺</text>
                <circle cx="560" cy="430" r="4" fill="#fff" stroke="#BDC3C7" stroke-width="1"/>
                <text x="565" y="445" font-size="10" font-weight="600" fill="#7F8C8D" class="mono">H⁺</text>
            </g>

            <!-- Replacement Electron -->
            <g class="electron-replace">
                <circle cx="550" cy="420" r="4" fill="#3498DB" filter="url(#glow-blue)"/>
                <text x="560" y="420" font-size="12" font-weight="700" fill="#3498DB" class="mono">e⁻</text>
            </g>

            <!-- Photolysis Equation -->
            <text x="550" y="470" font-size="13" font-weight="700" fill="#E74C3C" text-anchor="middle" class="mono text-fade">2H₂O → O₂ + 4H⁺ + 4e⁻</text>

            <!-- ========================================== -->
            <!-- LEGEND                                     -->
            <!-- ========================================== -->
            <g transform="translate(260, 395)">
                <rect x="0" y="0" width="130" height="85" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" opacity="0.9"/>
                <text x="10" y="18" font-size="11" font-weight="700" fill="#2C3E50">Legend</text>
                
                <circle cx="15" cy="35" r="4" fill="#F1C40F" filter="url(#glow)"/>
                <text x="28" y="39" font-size="10" fill="#34495E">Photon (Light)</text>
                
                <circle cx="15" cy="55" r="3" fill="#3498DB" filter="url(#glow-blue)"/>
                <text x="28" y="59" font-size="10" fill="#34495E">Electron (e⁻)</text>
                
                <circle cx="15" cy="73" r="4" fill="#E74C3C"/>
                <circle cx="11" cy="70" r="2" fill="#fff" stroke="#BDC3C7" stroke-width="0.5"/>
                <circle cx="19" cy="70" r="2" fill="#fff" stroke="#BDC3C7" stroke-width="0.5"/>
                <text x="28" y="77" font-size="10" fill="#34495E">Water (H₂O)</text>
            </g>

        </svg>
    </div>
</body>
</html>
