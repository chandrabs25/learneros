<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Pyramid of Numbers</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; }
        .label-main { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .label-sci { font-size: 13px; font-weight: 400; fill: #34495E; }
        .note { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; fill: #E74C3C; }
        .legend-text { font-size: 11px; font-weight: 500; fill: #2C3E50; }

        /* Animations */
        .tier-1 { animation: fadeTier1 12s infinite ease-out; }
        .tier-2 { animation: fadeTier2 12s infinite ease-out; }
        .tier-3 { animation: fadeTier3 12s infinite ease-out; }
        .tier-4 { animation: fadeTier4 12s infinite ease-out; }

        @keyframes fadeTier1 {
            0% { opacity: 0; transform: translateY(15px); }
            8%, 96% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes fadeTier2 {
            0%, 8% { opacity: 0; transform: translateY(15px); }
            16%, 96% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes fadeTier3 {
            0%, 16% { opacity: 0; transform: translateY(15px); }
            24%, 96% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }
        @keyframes fadeTier4 {
            0%, 24% { opacity: 0; transform: translateY(15px); }
            32%, 96% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Energy Flow Animations */
        .energy-center { animation: energyPulseCenter 12s infinite ease-in-out; }
        .energy-left { animation: energyPulseLeft 12s infinite ease-in-out; }
        .energy-right { animation: energyPulseRight 12s infinite ease-in-out; }

        @keyframes energyPulseCenter {
            0%, 33% { opacity: 0; transform: translate(400px, 430px) scale(1.5); }
            41% { opacity: 0.9; transform: translate(400px, 290px) scale(1.0); }
            49% { opacity: 0; transform: translate(400px, 150px) scale(0.4); }
            50% { opacity: 0; transform: translate(400px, 430px) scale(1.5); }
            58% { opacity: 0.9; transform: translate(400px, 290px) scale(1.0); }
            66% { opacity: 0; transform: translate(400px, 150px) scale(0.4); }
            100% { opacity: 0; }
        }
        @keyframes energyPulseLeft {
            0%, 33% { opacity: 0; transform: translate(300px, 430px) scale(1.5) rotate(12deg); }
            41% { opacity: 0.9; transform: translate(342px, 290px) scale(1.0) rotate(12deg); }
            49% { opacity: 0; transform: translate(385px, 150px) scale(0.4) rotate(12deg); }
            50% { opacity: 0; transform: translate(300px, 430px) scale(1.5) rotate(12deg); }
            58% { opacity: 0.9; transform: translate(342px, 290px) scale(1.0) rotate(12deg); }
            66% { opacity: 0; transform: translate(385px, 150px) scale(0.4) rotate(12deg); }
            100% { opacity: 0; }
        }
        @keyframes energyPulseRight {
            0%, 33% { opacity: 0; transform: translate(500px, 430px) scale(1.5) rotate(-12deg); }
            41% { opacity: 0.9; transform: translate(457px, 290px) scale(1.0) rotate(-12deg); }
            49% { opacity: 0; transform: translate(415px, 150px) scale(0.4) rotate(-12deg); }
            50% { opacity: 0; transform: translate(500px, 430px) scale(1.5) rotate(-12deg); }
            58% { opacity: 0.9; transform: translate(457px, 290px) scale(1.0) rotate(-12deg); }
            66% { opacity: 0; transform: translate(415px, 150px) scale(0.4) rotate(-12deg); }
            100% { opacity: 0; }
        }

        /* Heat Loss Animations */
        .heat-left { animation: heatEmergeLeft 12s infinite ease-out; }
        .heat-right { animation: heatEmergeRight 12s infinite ease-out; }

        @keyframes heatEmergeLeft {
            0%, 66% { opacity: 0; transform: translate(0, 0) scaleX(-1); }
            74% { opacity: 1; transform: translate(-25px, -15px) scaleX(-1) scale(1.2); }
            83% { opacity: 0; transform: translate(-50px, -30px) scaleX(-1) scale(1.4); }
            100% { opacity: 0; }
        }
        @keyframes heatEmergeRight {
            0%, 66% { opacity: 0; transform: translate(0, 0) scale(1); }
            74% { opacity: 1; transform: translate(25px, -15px) scale(1.2); }
            83% { opacity: 0; transform: translate(50px, -30px) scale(1.4); }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Ecological Pyramid of Numbers (Grassland Ecosystem)</title>
        <desc>An animated diagram showing the upright pyramid of numbers, demonstrating the 10% energy transfer law and metabolic heat loss across four trophic levels.</desc>

        <defs>
            <!-- Gradients for Tiers -->
            <linearGradient id="gradT1" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#2ECC71" />
                <stop offset="100%" stop-color="#27AE60" />
            </linearGradient>
            <linearGradient id="gradT2" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F39C12" />
                <stop offset="100%" stop-color="#D68910" />
            </linearGradient>
            <linearGradient id="gradT3" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#E67E22" />
                <stop offset="100%" stop-color="#D35400" />
            </linearGradient>
            <linearGradient id="gradT4" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#E74C3C" />
                <stop offset="100%" stop-color="#C0392B" />
            </linearGradient>

            <!-- Glow Filter for Energy -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="3" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Icons -->
            <g id="grass">
                <path d="M0,12 Q3,0 5,-12 Q7,0 10,12 Z" fill="#196F3D"/>
                <path d="M5,12 Q8,2 12,-8 Q10,4 10,12 Z" fill="#1E8449"/>
            </g>
            <g id="insect">
                <ellipse cx="0" cy="0" rx="5" ry="3" fill="#784212"/>
                <circle cx="-4" cy="-1" r="1.5" fill="#17202A"/>
                <path d="M-1,-3 Q1,-7 5,-5 M-1,3 Q1,7 5,5" fill="none" stroke="#784212" stroke-width="0.8"/>
            </g>
            <g id="frog">
                <polygon points="0,-5 5,0 0,5 -5,0" fill="#145A32"/>
                <circle cx="-2" cy="-2" r="1" fill="#000"/>
                <circle cx="2" cy="-2" r="1" fill="#000"/>
                <path d="M-5,0 Q-8,-3 -6,-5 M5,0 Q8,-3 6,-5" fill="none" stroke="#145A32" stroke-width="1"/>
            </g>
            <g id="hawk">
                <path d="M0,-10 L12,0 L3,-2 L0,6 L-3,-2 L-12,0 Z" fill="#641E16"/>
                <circle cx="-2" cy="-5" r="1" fill="#FAD7A1"/>
                <circle cx="2" cy="-5" r="1" fill="#FAD7A1"/>
            </g>

            <!-- Heat Arrow Path -->
            <path id="heatArrow" d="M0,0 Q8,-8 16,0 T32,0 L28,-4 M32,0 L28,4" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Energy Arrow Path -->
            <g id="energyArrow">
                <path d="M-6,0 L6,0 L6,-35 L14,-35 L0,-55 L-14,-35 L-6,-35 Z" fill="#FFD700" filter="url(#glow)"/>
            </g>
        </defs>

        <!-- Background Ground Line -->
        <line x1="80" y1="430" x2="720" y2="430" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="6,6"/>

        <!-- TIER 1: Producers -->
        <g class="tier-1">
            <polygon points="200,430 600,430 555,360 245,360" fill="url(#gradT1)" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
            <text x="180" y="400" text-anchor="end" class="label-main">T1: Producers</text>
            <text x="620" y="400" text-anchor="start" class="label-sci"><tspan font-style="italic">Poaceae</tspan> (Grasses)</text>
            
            <!-- Grass Icons (Dense) -->
            <use href="#grass" x="220" y="415"/> <use href="#grass" x="240" y="380"/>
            <use href="#grass" x="255" y="420"/> <use href="#grass" x="275" y="390"/>
            <use href="#grass" x="290" y="410"/> <use href="#grass" x="310" y="375"/>
            <use href="#grass" x="325" y="425"/> <use href="#grass" x="345" y="385"/>
            <use href="#grass" x="360" y="415"/> <use href="#grass" x="380" y="395"/>
            <use href="#grass" x="395" y="420"/> <use href="#grass" x="415" y="380"/>
            <use href="#grass" x="430" y="410"/> <use href="#grass" x="450" y="390"/>
            <use href="#grass" x="465" y="425"/> <use href="#grass" x="485" y="375"/>
            <use href="#grass" x="500" y="415"/> <use href="#grass" x="520" y="385"/>
            <use href="#grass" x="535" y="420"/> <use href="#grass" x="555" y="395"/>
            <use href="#grass" x="570" y="410"/> <use href="#grass" x="230" y="400"/>
            <use href="#grass" x="280" y="405"/> <use href="#grass" x="330" y="400"/>
            <use href="#grass" x="370" y="380"/> <use href="#grass" x="420" y="405"/>
            <use href="#grass" x="470" y="400"/> <use href="#grass" x="510" y="405"/>
            <use href="#grass" x="560" y="380"/> <use href="#grass" x="580" y="425"/>
        </g>

        <!-- TIER 2: Primary Consumers -->
        <g class="tier-2">
            <polygon points="245,360 555,360 510,290 290,290" fill="url(#gradT2)" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
            <text x="180" y="330" text-anchor="end" class="label-main">T2: Primary Consumers</text>
            <text x="620" y="330" text-anchor="start" class="label-sci"><tspan font-style="italic">Orthoptera</tspan> (Grasshoppers)</text>
            
            <!-- Insect Icons (Moderate) -->
            <use href="#insect" x="270" y="340"/> <use href="#insect" x="300" y="310"/>
            <use href="#insect" x="320" y="345"/> <use href="#insect" x="350" y="305"/>
            <use href="#insect" x="380" y="335"/> <use href="#insect" x="410" y="315"/>
            <use href="#insect" x="440" y="340"/> <use href="#insect" x="470" y="305"/>
            <use href="#insect" x="490" y="345"/> <use href="#insect" x="520" y="310"/>
            <use href="#insect" x="530" y="335"/> <use href="#insect" x="365" y="325"/>
            <use href="#insect" x="455" y="325"/>
        </g>

        <!-- TIER 3: Secondary Consumers -->
        <g class="tier-3">
            <polygon points="290,290 510,290 465,220 335,220" fill="url(#gradT3)" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
            <text x="180" y="260" text-anchor="end" class="label-main">T3: Secondary Consumers</text>
            <text x="620" y="260" text-anchor="start" class="label-sci"><tspan font-style="italic">Rana tigrina</tspan> (Frogs)</text>
            
            <!-- Frog Icons (Few) -->
            <use href="#frog" x="325" y="270"/>
            <use href="#frog" x="370" y="240"/>
            <use href="#frog" x="415" y="275"/>
            <use href="#frog" x="450" y="245"/>
            <use href="#frog" x="475" y="270"/>
        </g>

        <!-- TIER 4: Tertiary Consumers -->
        <g class="tier-4">
            <polygon points="335,220 465,220 420,150 380,150" fill="url(#gradT4)" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round"/>
            <text x="180" y="190" text-anchor="end" class="label-main">T4: Tertiary Consumers</text>
            <text x="620" y="190" text-anchor="start" class="label-sci"><tspan font-style="italic">Buteo</tspan> (Hawk)</text>
            
            <!-- Hawk Icon (One) -->
            <use href="#hawk" x="400" y="195"/>
        </g>

        <!-- Energy Flow Arrows (Animated) -->
        <g class="energy-arrows">
            <use href="#energyArrow" class="energy-left" />
            <use href="#energyArrow" class="energy-center" />
            <use href="#energyArrow" class="energy-right" />
        </g>

        <!-- Heat Loss Arrows (Animated) -->
        <g class="heat-arrows">
            <!-- T1 Heat -->
            <g transform="translate(222, 395)"><use href="#heatArrow" class="heat-left" /></g>
            <g transform="translate(577, 395)"><use href="#heatArrow" class="heat-right" /></g>
            <!-- T2 Heat -->
            <g transform="translate(267, 325)"><use href="#heatArrow" class="heat-left" /></g>
            <g transform="translate(532, 325)"><use href="#heatArrow" class="heat-right" /></g>
            <!-- T3 Heat -->
            <g transform="translate(312, 255)"><use href="#heatArrow" class="heat-left" /></g>
            <g transform="translate(487, 255)"><use href="#heatArrow" class="heat-right" /></g>
            <!-- T4 Heat -->
            <g transform="translate(357, 185)"><use href="#heatArrow" class="heat-left" /></g>
            <g transform="translate(442, 185)"><use href="#heatArrow" class="heat-right" /></g>
        </g>

        <!-- Title and Annotations -->
        <text x="400" y="45" text-anchor="middle" class="title">Ecological Pyramid of Numbers</text>
        <text x="400" y="70" text-anchor="middle" class="subtitle">Grassland Ecosystem</text>
        
        <text x="400" y="475" text-anchor="middle" class="note">10% LAW: Energy decreases by ~90% at each trophic level.</text>

        <!-- Legend -->
        <g transform="translate(610, 20)">
            <rect x="0" y="0" width="160" height="95" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" opacity="0.95"/>
            <text x="80" y="20" text-anchor="middle" font-weight="700" font-size="12" fill="#2C3E50">Key</text>
            
            <!-- Energy Flow -->
            <path d="M15,35 L30,35 L30,32 L38,36 L30,40 L30,37 L15,37 Z" fill="#FFD700"/>
            <text x="45" y="39" class="legend-text">Energy Flow</text>
            
            <!-- Heat Loss -->
            <path d="M15,55 Q20,50 25,55 T35,55 L33,52 M35,55 L33,58" fill="none" stroke="#E74C3C" stroke-width="2"/>
            <text x="45" y="59" class="legend-text">Heat Loss (90%)</text>
            
            <!-- Biomass/Numbers -->
            <rect x="15" y="70" width="20" height="12" fill="url(#gradT1)" stroke="#2C3E50" stroke-width="1"/>
            <text x="45" y="80" class="legend-text">Population Size</text>
        </g>

    </svg>
</div>

</body>
</html>
