<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chemical Reactions of Carbohydrates</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        text {
            user-select: none;
        }

        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: 700;
            fill: #555;
        }

        /* --- Animation Timelines (15s Loop) --- */

        /* Phase Opacities */
        .phase1 {
            animation: fadePhase1 15s infinite;
        }

        .phase2 {
            animation: fadePhase2 15s infinite;
        }

        .phase3 {
            animation: fadePhase3 15s infinite;
        }

        @keyframes fadePhase1 {

            0%,
            28% {
                opacity: 1;
                visibility: visible;
            }

            33%,
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes fadePhase2 {

            0%,
            30% {
                opacity: 0;
                visibility: hidden;
            }

            33%,
            61% {
                opacity: 1;
                visibility: visible;
            }

            66%,
            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes fadePhase3 {

            0%,
            63% {
                opacity: 0;
                visibility: hidden;
            }

            66%,
            95% {
                opacity: 1;
                visibility: visible;
            }

            100% {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Phase 1: Hydrolysis Animations */
        .water-mol {
            animation: waterMove 15s infinite ease-in-out;
        }

        .mech-arrow {
            animation: arrowDraw 15s infinite ease-in-out;
        }

        .glyco-bond {
            animation: bondBreak 15s infinite;
        }

        .ring-left {
            animation: ringLeftMove 15s infinite ease-in-out;
        }

        .ring-right {
            animation: ringRightMove 15s infinite ease-in-out;
        }

        .water-split-oh {
            animation: waterSplitOH 15s infinite;
        }

        .water-split-h {
            animation: waterSplitH 15s infinite;
        }

        .reaction-glow {
            animation: glowFlash 15s infinite;
        }

        @keyframes waterMove {

            0%,
            5% {
                transform: translate(400px, 360px);
                opacity: 0;
            }

            8%,
            15% {
                transform: translate(400px, 330px);
                opacity: 1;
            }

            16%,
            100% {
                transform: translate(400px, 330px);
                opacity: 0;
            }
        }

        @keyframes arrowDraw {

            0%,
            8% {
                stroke-dashoffset: 150;
                opacity: 0;
            }

            9% {
                opacity: 1;
            }

            12%,
            15% {
                stroke-dashoffset: 0;
                opacity: 1;
            }

            16%,
            100% {
                opacity: 0;
            }
        }

        @keyframes bondBreak {

            0%,
            15% {
                opacity: 1;
            }

            16%,
            100% {
                opacity: 0;
            }
        }

        @keyframes glowFlash {

            0%,
            14% {
                opacity: 0;
            }

            15%,
            17% {
                opacity: 1;
            }

            18%,
            100% {
                opacity: 0;
            }
        }

        @keyframes ringLeftMove {

            0%,
            18% {
                transform: translateX(0);
            }

            22%,
            100% {
                transform: translateX(-40px);
            }
        }

        @keyframes ringRightMove {

            0%,
            18% {
                transform: translateX(0);
            }

            22%,
            100% {
                transform: translateX(40px);
            }
        }

        @keyframes waterSplitOH {

            0%,
            15% {
                opacity: 0;
            }

            16%,
            100% {
                opacity: 1;
            }
        }

        @keyframes waterSplitH {

            0%,
            15% {
                opacity: 0;
            }

            16%,
            100% {
                opacity: 1;
            }
        }

        /* Phase 2: Oxidation Animations */
        .ox-o-atom {
            animation: oxOMove 15s infinite ease-in-out;
        }

        .ald-h-atom {
            animation: aldHMove 15s infinite ease-in-out;
        }

        .new-ox-bond {
            animation: newOxBond 15s infinite;
        }

        .ox-glow {
            animation: oxGlowFlash 15s infinite;
        }

        @keyframes oxOMove {

            0%,
            38% {
                transform: translate(300px, 80px);
                opacity: 0;
            }

            41%,
            48% {
                transform: translate(340px, 105px);
                opacity: 1;
            }

            50%,
            66% {
                transform: translate(360px, 120px);
                opacity: 1;
            }

            67%,
            100% {
                transform: translate(360px, 120px);
                opacity: 0;
            }
        }

        @keyframes aldHMove {

            0%,
            48% {
                transform: translate(0, 0);
            }

            50%,
            66% {
                transform: translate(-25px, -20px);
            }

            67%,
            100% {
                transform: translate(0, 0);
            }
        }

        @keyframes newOxBond {

            0%,
            49% {
                opacity: 0;
            }

            50%,
            66% {
                opacity: 1;
            }

            67%,
            100% {
                opacity: 0;
            }
        }

        @keyframes oxGlowFlash {

            0%,
            48% {
                opacity: 0;
            }

            49%,
            51% {
                opacity: 1;
            }

            52%,
            100% {
                opacity: 0;
            }
        }

        /* Phase 3: Reduction Animations */
        .red-h1-atom {
            animation: redH1Move 15s infinite ease-in-out;
        }

        .red-h2-atom {
            animation: redH2Move 15s infinite ease-in-out;
        }

        .pi-bond {
            animation: piBondBreak 15s infinite;
        }

        .new-red-bond {
            animation: newRedBond 15s infinite;
        }

        .red-glow {
            animation: redGlowFlash 15s infinite;
        }

        @keyframes redH1Move {

            0%,
            71% {
                transform: translate(490px, 60px);
                opacity: 0;
            }

            74%,
            81% {
                transform: translate(475px, 70px);
                opacity: 1;
            }

            83%,
            100% {
                transform: translate(460px, 80px);
                opacity: 1;
            }
        }

        @keyframes redH2Move {

            0%,
            71% {
                transform: translate(460px, 180px);
                opacity: 0;
            }

            74%,
            81% {
                transform: translate(445px, 170px);
                opacity: 1;
            }

            83%,
            100% {
                transform: translate(425px, 155px);
                opacity: 1;
            }
        }

        @keyframes piBondBreak {

            0%,
            81% {
                opacity: 1;
            }

            82%,
            98% {
                opacity: 0;
            }

            99%,
            100% {
                opacity: 1;
            }
        }

        @keyframes newRedBond {

            0%,
            82% {
                opacity: 0;
            }

            83%,
            100% {
                opacity: 1;
            }
        }

        @keyframes redGlowFlash {

            0%,
            80% {
                opacity: 0;
            }

            81%,
            83% {
                opacity: 1;
            }

            84%,
            100% {
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients for Atoms (CPK Colors) -->
            <radialGradient id="grad-C" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777" />
                <stop offset="100%" stop-color="#404040" />
            </radialGradient>
            <radialGradient id="grad-O" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FF8888" />
                <stop offset="100%" stop-color="#FF4444" />
            </radialGradient>
            <radialGradient id="grad-H" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#CCCCCC" />
            </radialGradient>
            <radialGradient id="grad-Green" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#88FF88" />
                <stop offset="100%" stop-color="#44CC44" />
            </radialGradient>

            <!-- Glow Filter -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
            <filter id="strong-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="8" result="blur" />
                <feComponentTransfer in="blur" result="glow">
                    <feFuncA type="linear" slope="2" />
                </feComponentTransfer>
                <feMerge>
                    <feMergeNode in="glow" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>

            <!-- Arrow Markers -->
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#F77F00" />
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6"
                orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#7209B7" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#ffffff" rx="12" />

        <!-- Static UI Elements -->
        <text x="400" y="40" text-anchor="middle" font-size="24" font-weight="800" fill="#222">Chemical Reactions of
            Carbohydrates</text>

        <!-- Legend -->
        <g transform="translate(620, 440)" font-size="12" fill="#555" font-weight="600">
            <rect x="-10" y="-15" width="170" height="60" fill="#f8f9fa" rx="6" stroke="#eee" />
            <circle cx="0" cy="0" r="6" fill="url(#grad-C)" />
            <text x="12" y="4">Carbon (C)</text>
            <circle cx="80" cy="0" r="6" fill="url(#grad-O)" />
            <text x="92" y="4">Oxygen (O)</text>
            <circle cx="0" cy="25" r="6" fill="url(#grad-H)" />
            <text x="12" y="29">Hydrogen (H)</text>
        </g>

        <!-- ========================================== -->
        <!-- PHASE 1: HYDROLYSIS (Maltose -> 2 Glucose) -->
        <!-- ========================================== -->
        <g class="phase1">
            <text x="400" y="75" text-anchor="middle" font-size="18" font-weight="600" fill="#7209B7">1. Hydrolysis:
                Maltose &rarr; 2 Glucose</text>
            <text x="400" y="460" text-anchor="middle" class="formula" font-size="16">C₁₂H₂₂O₁₁ + H₂O &rarr; 2
                C₆H₁₂O₆</text>

            <!-- Reaction Glow Flash -->
            <circle cx="400" cy="270" r="30" fill="#FFD166" class="reaction-glow" filter="url(#strong-glow)" />

            <!-- Left Ring (Glucose 1) -->
            <g class="ring-left">
                <!-- Hexagon -->
                <path d="M 340 230 L 320 190 L 270 190 L 250 230 L 270 270 L 320 270 Z" fill="none" stroke="#666"
                    stroke-width="4" stroke-linejoin="round" />
                <circle cx="320" cy="190" r="8" fill="url(#grad-O)" />
                <!-- Substituents (Simplified) -->
                <line x1="250" y1="230" x2="220" y2="230" stroke="#666" stroke-width="3" />
                <text x="195" y="235" font-size="14" font-weight="600" fill="#555">HO</text>
                <line x1="270" y1="190" x2="250" y2="150" stroke="#666" stroke-width="3" />
                <text x="230" y="145" font-size="14" font-weight="600" fill="#555">CH₂OH</text>

                <!-- Glycosidic Bond Half (Left) -->
                <line x1="340" y1="230" x2="370" y2="270" stroke="#666" stroke-width="4" class="glyco-bond"
                    stroke-linecap="round" />

                <!-- Post-Hydrolysis OH (Appears after break) -->
                <g class="water-split-oh">
                    <line x1="340" y1="230" x2="360" y2="260" stroke="#666" stroke-width="4" stroke-linecap="round" />
                    <circle cx="360" cy="260" r="8" fill="url(#grad-O)" />
                    <circle cx="375" cy="270" r="5" fill="url(#grad-H)" />
                </g>
            </g>

            <!-- Right Ring (Glucose 2) -->
            <g class="ring-right">
                <!-- Hexagon -->
                <path d="M 460 230 L 480 190 L 530 190 L 550 230 L 530 270 L 480 270 Z" fill="none" stroke="#666"
                    stroke-width="4" stroke-linejoin="round" />
                <circle cx="530" cy="190" r="8" fill="url(#grad-O)" />
                <!-- Substituents -->
                <line x1="550" y1="230" x2="580" y2="230" stroke="#666" stroke-width="3" />
                <text x="585" y="235" font-size="14" font-weight="600" fill="#555">OH</text>
                <line x1="480" y1="190" x2="460" y2="150" stroke="#666" stroke-width="3" />
                <text x="440" y="145" font-size="14" font-weight="600" fill="#555">CH₂OH</text>

                <!-- Glycosidic Bond Half (Right) -->
                <g class="glyco-bond">
                    <line x1="460" y1="230" x2="430" y2="270" stroke="#666" stroke-width="4" stroke-linecap="round" />
                    <circle cx="400" cy="270" r="8" fill="url(#grad-O)" />
                    <line x1="400" y1="270" x2="370" y2="270" stroke="#666" stroke-width="4" stroke-linecap="round" />
                </g>

                <!-- Post-Hydrolysis H (Appears after break) -->
                <g class="water-split-h">
                    <line x1="460" y1="230" x2="440" y2="260" stroke="#666" stroke-width="4" stroke-linecap="round" />
                    <circle cx="440" cy="260" r="8" fill="url(#grad-O)" />
                    <circle cx="425" cy="270" r="5" fill="url(#grad-H)" />
                </g>
            </g>

            <!-- Attacking Water Molecule -->
            <g class="water-mol" transform="translate(400, 360)">
                <line x1="0" y1="0" x2="-15" y2="15" stroke="#666" stroke-width="3" stroke-linecap="round" />
                <line x1="0" y1="0" x2="15" y2="15" stroke="#666" stroke-width="3" stroke-linecap="round" />
                <circle cx="0" cy="0" r="8" fill="url(#grad-O)" />
                <circle cx="-15" cy="15" r="5" fill="url(#grad-H)" />
                <circle cx="15" cy="15" r="5" fill="url(#grad-H)" />
            </g>

            <!-- Mechanism Arrow -->
            <path d="M 390 350 Q 350 320 345 245" fill="none" stroke="#F77F00" stroke-width="3" stroke-dasharray="150"
                stroke-dashoffset="150" class="mech-arrow" marker-end="url(#arrow-orange)" />
        </g>


        <!-- ========================================== -->
        <!-- PHASE 2: OXIDATION (Glucose -> Gluconic Acid) -->
        <!-- ========================================== -->
        <g class="phase2">
            <text x="400" y="75" text-anchor="middle" font-size="18" font-weight="600" fill="#7209B7">2. Oxidation:
                Glucose &rarr; Gluconic Acid</text>
            <text x="400" y="460" text-anchor="middle" class="formula" font-size="16">C₆H₁₂O₆ + [O] &rarr;
                C₆H₁₂O₇</text>

            <!-- Open Chain Glucose Backbone (Shared with Phase 3) -->
            <g>
                <!-- Vertical Carbon Chain -->
                <line x1="400" y1="140" x2="400" y2="340" stroke="#444" stroke-width="4" stroke-linecap="round" />

                <!-- C2 -->
                <line x1="370" y1="180" x2="430" y2="180" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="185" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="185" font-size="16" font-weight="600" fill="#FF4444">OH</text>

                <!-- C3 -->
                <line x1="370" y1="220" x2="430" y2="220" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="340" y="225" font-size="16" font-weight="600" fill="#FF4444">HO</text>
                <text x="440" y="225" font-size="16" font-weight="600" fill="#555">H</text>

                <!-- C4 -->
                <line x1="370" y1="260" x2="430" y2="260" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="265" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="265" font-size="16" font-weight="600" fill="#FF4444">OH</text>

                <!-- C5 -->
                <line x1="370" y1="300" x2="430" y2="300" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="305" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="305" font-size="16" font-weight="600" fill="#FF4444">OH</text>

                <!-- C6 -->
                <text x="400" y="365" text-anchor="middle" font-size="16" font-weight="600" fill="#555">CH₂OH</text>

                <!-- Intersections (Carbons) -->
                <circle cx="400" cy="180" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="220" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="260" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="300" r="5" fill="url(#grad-C)" />
            </g>

            <!-- C1 Aldehyde Group (Reacting Part) -->
            <g>
                <!-- C=O Double Bond -->
                <line x1="398" y1="136" x2="428" y2="106" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <line x1="404" y1="142" x2="434" y2="112" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <circle cx="440" cy="100" r="10" fill="url(#grad-O)" />

                <!-- C1 Atom -->
                <circle cx="400" cy="140" r="10" fill="url(#grad-C)" />

                <!-- C-H Bond -->
                <line x1="400" y1="140" x2="360" y2="120" stroke="#444" stroke-width="4" stroke-linecap="round" />

                <!-- Aldehyde H Atom (Moves during oxidation) -->
                <g class="ald-h-atom">
                    <circle cx="360" cy="120" r="8" fill="url(#grad-H)" />
                </g>

                <!-- New O-H Bond (Appears during oxidation) -->
                <line x1="360" y1="120" x2="335" y2="100" stroke="#444" stroke-width="4" stroke-linecap="round"
                    class="new-ox-bond" />
            </g>

            <!-- Oxidizing Agent [O] -->
            <g class="ox-o-atom" transform="translate(300, 80)">
                <circle cx="0" cy="0" r="14" fill="#e9ecef" stroke="#44CC44" stroke-width="2" stroke-dasharray="4" />
                <circle cx="0" cy="0" r="10" fill="url(#grad-O)" />
                <text x="-25" y="5" font-size="14" font-weight="bold" fill="#44CC44">[O]</text>
            </g>

            <!-- Glow Effect -->
            <circle cx="360" cy="120" r="25" fill="#FFD166" class="ox-glow" filter="url(#strong-glow)" />
        </g>


        <!-- ========================================== -->
        <!-- PHASE 3: REDUCTION (Glucose -> Sorbitol)   -->
        <!-- ========================================== -->
        <g class="phase3">
            <text x="400" y="75" text-anchor="middle" font-size="18" font-weight="600" fill="#7209B7">3. Reduction:
                Glucose &rarr; Sorbitol</text>
            <text x="400" y="460" text-anchor="middle" class="formula" font-size="16">C₆H₁₂O₆ + 2[H] &rarr;
                C₆H₁₄O₆</text>

            <!-- Open Chain Glucose Backbone (Same as Phase 2) -->
            <g>
                <line x1="400" y1="140" x2="400" y2="340" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <line x1="370" y1="180" x2="430" y2="180" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="185" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="185" font-size="16" font-weight="600" fill="#FF4444">OH</text>
                <line x1="370" y1="220" x2="430" y2="220" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="340" y="225" font-size="16" font-weight="600" fill="#FF4444">HO</text>
                <text x="440" y="225" font-size="16" font-weight="600" fill="#555">H</text>
                <line x1="370" y1="260" x2="430" y2="260" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="265" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="265" font-size="16" font-weight="600" fill="#FF4444">OH</text>
                <line x1="370" y1="300" x2="430" y2="300" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <text x="350" y="305" font-size="16" font-weight="600" fill="#555">H</text>
                <text x="440" y="305" font-size="16" font-weight="600" fill="#FF4444">OH</text>
                <text x="400" y="365" text-anchor="middle" font-size="16" font-weight="600" fill="#555">CH₂OH</text>
                <circle cx="400" cy="180" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="220" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="260" r="5" fill="url(#grad-C)" />
                <circle cx="400" cy="300" r="5" fill="url(#grad-C)" />
            </g>

            <!-- C1 Aldehyde Group (Reacting Part) -->
            <g>
                <!-- C=O Double Bond (One line breaks) -->
                <line x1="398" y1="136" x2="428" y2="106" stroke="#444" stroke-width="4" stroke-linecap="round"
                    class="pi-bond" />
                <line x1="404" y1="142" x2="434" y2="112" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <circle cx="440" cy="100" r="10" fill="url(#grad-O)" />

                <!-- C1 Atom -->
                <circle cx="400" cy="140" r="10" fill="url(#grad-C)" />

                <!-- C-H Bond -->
                <line x1="400" y1="140" x2="360" y2="120" stroke="#444" stroke-width="4" stroke-linecap="round" />
                <circle cx="360" cy="120" r="8" fill="url(#grad-H)" />

                <!-- New Bonds (Appear during reduction) -->
                <line x1="440" y1="100" x2="460" y2="80" stroke="#444" stroke-width="4" stroke-linecap="round"
                    class="new-red-bond" />
                <line x1="400" y1="140" x2="425" y2="155" stroke="#444" stroke-width="4" stroke-linecap="round"
                    class="new-red-bond" />
            </g>

            <!-- Reducing Agents [H] -->
            <g class="red-h1-atom" transform="translate(490, 60)">
                <circle cx="0" cy="0" r="12" fill="#e9ecef" stroke="#4444FF" stroke-width="2" stroke-dasharray="4" />
                <circle cx="0" cy="0" r="8" fill="url(#grad-H)" />
                <text x="15" y="5" font-size="14" font-weight="bold" fill="#4444FF">[H]</text>
            </g>
            <g class="red-h2-atom" transform="translate(460, 180)">
