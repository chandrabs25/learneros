<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Four Pillars of Electronic Effects</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
            user-select: none;
        }

        /* Master Scene Visibility (24s Loop) */
        .scene { opacity: 0; animation: 24s infinite ease-in-out; }
        .status-text { opacity: 0; animation: 24s infinite ease-in-out; }

        #scene1, .text1 { animation-name: showScene1; }
        #scene2, .text2 { animation-name: showScene2; }
        #scene3, .text3 { animation-name: showScene3; }
        #scene4, .text4 { animation-name: showScene4; }

        @keyframes showScene1 { 0%, 23% { opacity: 1; } 25%, 100% { opacity: 0; } }
        @keyframes showScene2 { 0%, 23% { opacity: 0; } 25%, 48% { opacity: 1; } 50%, 100% { opacity: 0; } }
        @keyframes showScene3 { 0%, 48% { opacity: 0; } 50%, 73% { opacity: 1; } 75%, 100% { opacity: 0; } }
        @keyframes showScene4 { 0%, 73% { opacity: 0; } 75%, 98% { opacity: 1; } 100% { opacity: 0; } }

        /* Scene 1: Inductive Effect */
        .ind-delta { animation: ind-delta 24s infinite ease-in-out; }
        .ind-arrow { animation: ind-arrow 24s infinite ease-in-out; }
        
        @keyframes ind-delta {
            0%, 5% { opacity: 0; }
            10%, 20% { opacity: 1; }
            25%, 100% { opacity: 0; }
        }
        @keyframes ind-arrow {
            0%, 5% { transform: translateX(0); opacity: 0; }
            10%, 20% { transform: translateX(8px); opacity: 1; }
            25%, 100% { transform: translateX(0); opacity: 0; }
        }

        /* Scene 2: Resonance */
        .res-curly { 
            animation: res-curly 24s infinite ease-in-out; 
            stroke-dasharray: 150; 
            stroke-dashoffset: 150; 
        }
        .res-pi-form { animation: res-pi-form 24s infinite ease-in-out; }
        .res-pi-break { animation: res-pi-break 24s infinite ease-in-out; }
        .res-charge-o { animation: res-charge-o 24s infinite ease-in-out; }
        .res-charge-c { animation: res-charge-c 24s infinite ease-in-out; }

        @keyframes res-curly {
            0%, 30% { stroke-dashoffset: 150; opacity: 0; }
            31% { opacity: 1; }
            35%, 48% { stroke-dashoffset: 0; opacity: 1; }
            50%, 100% { stroke-dashoffset: 150; opacity: 0; }
        }
        @keyframes res-pi-form {
            0%, 35% { opacity: 0; }
            38%, 48% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes res-pi-break {
            0%, 35% { opacity: 1; }
            38%, 48% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }
        @keyframes res-charge-o {
            0%, 35% { opacity: 1; }
            38%, 48% { opacity: 0; }
            50%, 100% { opacity: 1; }
        }
        @keyframes res-charge-c {
            0%, 35% { opacity: 0; }
            38%, 48% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Scene 3: Hyperconjugation */
        .hyp-bond { animation: hyp-bond 24s infinite ease-in-out; }
        .hyp-e-move { animation: hyp-e-move 24s infinite ease-in-out; }
        .hyp-pi { animation: hyp-pi 24s infinite ease-in-out; }

        @keyframes hyp-bond {
            0%, 55% { opacity: 1; stroke-dasharray: none; }
            58%, 73% { opacity: 0.3; stroke-dasharray: 6,6; }
            75%, 100% { opacity: 1; stroke-dasharray: none; }
        }
        @keyframes hyp-e-move {
            0%, 55% { transform: translate(0, 0); opacity: 1; }
            60%, 73% { transform: translate(50px, 45px); opacity: 1; }
            75%, 100% { transform: translate(0, 0); opacity: 0; }
        }
        @keyframes hyp-pi {
            0%, 60% { opacity: 0; }
            63%, 73% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        /* Scene 4: Electromeric */
        .ele-h-move { animation: ele-h-move 24s infinite ease-in-out; }
        .ele-pi-swing { 
            animation: ele-pi-swing 24s infinite ease-in-out; 
            transform-origin: 320px 240px; 
        }
        .ele-charge-h { animation: ele-charge-h 24s infinite ease-in-out; }
        .ele-charge-c { animation: ele-charge-c 24s infinite ease-in-out; }

        @keyframes ele-h-move {
            0%, 80% { transform: translateY(0); }
            85%, 98% { transform: translateY(70px); }
            100% { transform: translateY(0); }
        }
        @keyframes ele-pi-swing {
            0%, 85% { transform: rotate(0deg) scaleX(1); }
            90%, 98% { transform: rotate(-23.6deg) scaleX(1.09); }
            100% { transform: rotate(0deg) scaleX(1); }
        }
        @keyframes ele-charge-h {
            0%, 88% { opacity: 1; }
            90%, 98% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes ele-charge-c {
            0%, 88% { opacity: 0; }
            90%, 98% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Typography */
        .atom-text { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 16px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
        .atom-text-dark { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; fill: #333; text-anchor: middle; dominant-baseline: central; }
        .charge-text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px; fill: #fff; text-anchor: middle; dominant-baseline: central; }
        .delta-text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 18px; text-anchor: middle; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Arrowheads -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#F77F00" />
            </marker>
            <marker id="wedge" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
                <polygon points="0 2, 10 5, 0 8" fill="#F77F00" />
            </marker>
            
            <!-- Atom Gradients -->
            <radialGradient id="grad-c" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#666" />
                <stop offset="100%" stop-color="#404040" />
            </radialGradient>
            <radialGradient id="grad-o" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ff7777" />
                <stop offset="100%" stop-color="#FF4444" />
            </radialGradient>
            <radialGradient id="grad-cl" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#77ff77" />
                <stop offset="100%" stop-color="#44CC44" />
            </radialGradient>
            <radialGradient id="grad-h" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff" />
                <stop offset="100%" stop-color="#CCCCCC" />
            </radialGradient>
            <radialGradient id="grad-h-ion" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#7777ff" />
                <stop offset="100%" stop-color="#4444FF" />
            </radialGradient>
        </defs>

        <!-- Header -->
        <text x="400" y="45" font-size="26" font-weight="700" text-anchor="middle" fill="#222">The Four Pillars of Electronic Effects</text>
        <text x="400" y="70" font-size="14" font-weight="400" text-anchor="middle" fill="#666">Animated mechanisms of electron displacement in organic molecules</text>

        <!-- Legend -->
        <g transform="translate(630, 20)">
            <rect width="150" height="135" rx="8" fill="#fff" stroke="#e0e0e0" stroke-width="1.5" />
            <text x="75" y="22" font-size="12" font-weight="700" text-anchor="middle" fill="#333">Legend</text>
            <line x1="15" y1="32" x2="135" y2="32" stroke="#eee" stroke-width="1"/>
            
            <circle cx="25" cy="48" r="7" fill="url(#grad-c)"/><text x="40" y="52" font-size="11" fill="#555">Carbon (C)</text>
            <circle cx="25" cy="68" r="7" fill="url(#grad-o)"/><text x="40" y="72" font-size="11" fill="#555">Oxygen (O)</text>
            <circle cx="25" cy="88" r="7" fill="url(#grad-cl)"/><text x="40" y="92" font-size="11" fill="#555">Chlorine (Cl)</text>
            
            <line x1="20" y1="112" x2="40" y2="112" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="50" y="116" font-size="11" fill="#555">e⁻ Flow</text>
        </g>

        <!-- ========================================== -->
        <!-- SCENE 1: INDUCTIVE EFFECT                  -->
        <!-- ========================================== -->
        <g id="scene1" class="scene">
            <!-- Bonds -->
            <line x1="250" y1="250" x2="400" y2="250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            <line x1="400" y1="250" x2="550" y2="250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            
            <!-- C2-H Bonds -->
            <line x1="250" y1="250" x2="180" y2="250" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="250" y1="250" x2="210" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="250" y1="250" x2="210" y2="320" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            
            <!-- C1-H Bonds -->
            <line x1="400" y1="250" x2="400" y2="170" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="400" y1="250" x2="400" y2="330" stroke="#333" stroke-width="4" stroke-linecap="round"/>

            <!-- Wedge Arrows (Animated) -->
            <g class="ind-arrow">
                <path d="M 310 245 L 330 250 L 310 255 Z" fill="#F77F00" />
                <path d="M 460 245 L 480 250 L 460 255 Z" fill="#F77F00" />
            </g>

            <!-- Atoms -->
            <!-- H's on C2 -->
            <circle cx="180" cy="250" r="12" fill="url(#grad-h)"/><text x="180" y="250" class="atom-text-dark">H</text>
            <circle cx="210" cy="180" r="12" fill="url(#grad-h)"/><text x="210" y="180" class="atom-text-dark">H</text>
            <circle cx="210" cy="320" r="12" fill="url(#grad-h)"/><text x="210" y="320" class="atom-text-dark">H</text>
            <!-- H's on C1 -->
            <circle cx="400" cy="170" r="12" fill="url(#grad-h)"/><text x="400" y="170" class="atom-text-dark">H</text>
            <circle cx="400" cy="330" r="12" fill="url(#grad-h)"/><text x="400" y="330" class="atom-text-dark">H</text>
            
            <!-- Main Chain -->
            <circle cx="250" cy="250" r="18" fill="url(#grad-c)"/><text x="250" y="250" class="atom-text">C</text>
            <circle cx="400" cy="250" r="18" fill="url(#grad-c)"/><text x="400" y="250" class="atom-text">C</text>
            <circle cx="550" cy="250" r="22" fill="url(#grad-cl)"/><text x="550" y="250" class="atom-text">Cl</text>

            <!-- Delta Labels (Animated) -->
            <text x="250" y="210" class="ind-delta delta-text" fill="#FF4444">δδ⁺</text>
            <text x="400" y="210" class="ind-delta delta-text" fill="#FF4444">δ⁺</text>
            <text x="550" y="200" class="ind-delta delta-text" fill="#4444FF">δ⁻</text>
        </g>

        <!-- ========================================== -->
        <!-- SCENE 2: RESONANCE                         -->
        <!-- ========================================== -->
        <g id="scene2" class="scene">
            <!-- Benzene Ring (Center: 400, 250) -->
            <polygon points="400,180 460.6,215 460.6,285 400,320 339.4,285 339.4,215" fill="none" stroke="#333" stroke-width="6" stroke-linejoin="round"/>
            
            <!-- Double Bonds -->
            <line x1="452" y1="225" x2="452" y2="275" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <line x1="400" y1="310" x2="348" y2="280" stroke="#555" stroke-width="5" stroke-linecap="round"/>
            <line x1="348" y1="220" x2="400" y2="190" stroke="#555" stroke-width="5" stroke-linecap="round" class="res-pi-break"/>

            <!-- Oxygen & Bond -->
            <line x1="400" y1="180" x2="400" y2="100" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            <line x1="390" y1="175" x2="390" y2="105" stroke="#555" stroke-width="5" stroke-linecap="round" class="res-pi-form"/>
            
            <!-- Atoms -->
            <!-- Ring Carbons (Implicit, but let's add subtle dots for clarity) -->
            <circle cx="400" cy="180" r="6" fill="#404040"/>
            <circle cx="460.6" cy="215" r="6" fill="#404040"/>
            <circle cx="460.6" cy="285" r="6" fill="#404040"/>
            <circle cx="400" cy="320" r="6" fill="#404040"/>
            <circle cx="339.4" cy="285" r="6" fill="#404040"/>
            <circle cx="339.4" cy="215" r="6" fill="#404040"/>

            <!-- Oxygen Atom -->
            <circle cx="400" cy="100" r="18" fill="url(#grad-o)"/><text x="400" y="100" class="atom-text">O</text>

            <!-- Lone Pairs on O -->
            <circle cx="378" cy="95" r="3" fill="#333"/><circle cx="378" cy="105" r="3" fill="#333"/>
            <circle cx="395" cy="74" r="3" fill="#333"/><circle cx="405" cy="74" r="3" fill="#333"/>
            <circle cx="422" cy="95" r="3" fill="#333" class="res-charge-o"/><circle cx="422" cy="105" r="3" fill="#333" class="res-charge-o"/>

            <!-- Curly Arrows (Animated) -->
            <path d="M 428 95 C 455 95 455 150 412 160" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="res-curly"/>
            <path d="M 360 200 C 320 160 290 190 315 215" fill="none" stroke="#F77F00" stroke-width="3" marker-end="url(#arrowhead)" class="res-curly"/>

            <!-- Charges (Animated) -->
            <!-- O Charge -->
            <g class="res-charge-o">
                <circle cx="425" cy="70" r="10" fill="#FF4444"/>
                <text x="425" y="70" class="charge-text">-</text>
            </g>
            <!-- Ortho C Charge & Lone Pair -->
            <g class="res-charge-c">
                <circle cx="325" cy="205" r="3" fill="#333"/>
                <circle cx="325" cy="225" r="3" fill="#333"/>
                <circle cx="310" cy="215" r="10" fill="#FF4444"/>
                <text x="310" y="215" class="charge-text">-</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- SCENE 3: HYPERCONJUGATION                  -->
        <!-- ========================================== -->
        <g id="scene3" class="scene">
            <!-- Empty p-orbital on C1 -->
            <path d="M 500 250 C 460 140 540 140 500 250" fill="rgba(114, 9, 183, 0.2)" stroke="#7209B7" stroke-width="2"/>
            <path d="M 500 250 C 460 360 540 360 500 250" fill="rgba(114, 9, 183, 0.2)" stroke="#7209B7" stroke-width="2"/>

            <!-- Bonds -->
            <line x1="300" y1="250" x2="500" y2="250" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            
            <!-- C2-H Bonds -->
            <line x1="300" y1="250" x2="300" y2="130" stroke="#333" stroke-width="6" stroke-linecap="round" class="hyp-bond"/>
            <line x1="300" y1="250" x2="230" y2="300" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="300" y1="250" x2="330" y2="320" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            
            <!-- C1-H Bonds -->
            <line x1="500" y1="250" x2="570" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="500" y1="250" x2="570" y2="320" stroke="#333" stroke-width="4" stroke-linecap="round"/>

            <!-- Partial Pi Bond (Animated) -->
            <line x1="320" y1="235" x2="480" y2="235" stroke="#F77F00" stroke-width="4" stroke-linecap="round" class="hyp-pi"/>

            <!-- Atoms -->
            <!-- H's on C2 -->
            <circle cx="300" cy="130" r="12" fill="url(#grad-h)"/><text x="300" y="130" class="atom-text-dark">H</text>
            <circle cx="230" cy="300" r="12" fill="url(#grad-h)"/><text x="230" y="300" class="atom-text-dark">H</text>
            <circle cx="330" cy="320" r="12" fill="url(#grad-h)"/><text x="330" y="320" class="atom-text-dark">H</text>
            <!-- H's on C1 -->
            <circle cx="570" cy="180" r="12" fill="url(#grad-h)"/><text x="570" y="180" class="atom-text-dark">H</text>
            <circle cx="570" cy="320" r="12" fill="url(#grad-h)"/><text x="570" y="320" class="atom-text-dark">H</text>

            <!-- Main Carbons -->
            <circle cx="300" cy="250" r="18" fill="url(#grad-c)"/><text x="300" y="250" class="atom-text">C</text>
            <circle cx="500" cy="250" r="18" fill="url(#grad-c)"/><text x="500" y="250" class="atom-text">C</text>

            <!-- Electrons (Animated) -->
            <g class="hyp-e-move">
                <circle cx="295" cy="190" r="5" fill="#F77F00"/>
                <circle cx="305" cy="190" r="5" fill="#F77F00"/>
            </g>

            <!-- Charge on C1 -->
            <g>
                <circle cx="525" cy="225" r="10" fill="#4444FF"/>
                <text x="525" y="225" class="charge-text">+</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- SCENE 4: ELECTROMERIC EFFECT               -->
        <!-- ========================================== -->
        <g id="scene4" class="scene">
            <!-- Bonds -->
            <line x1="320" y1="260" x2="480" y2="260" stroke="#333" stroke-width="6" stroke-linecap="round"/>
            <line x1="320" y1="240" x2="480" y2="240" stroke="#555" stroke-width="6" stroke-linecap="round" class="ele-pi-swing"/>
            
            <!-- C1-H Bonds -->
            <line x1="320" y1="250" x2="250" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="320" y1="250" x2="250" y2="320" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            
            <!-- C2-H Bonds -->
            <line x1="480" y1="250" x2="550" y2="180" stroke="#333" stroke-width="4" stroke-linecap="round"/>
            <line x1="480" y1="250" x2="550" y2="320" stroke="#333" stroke-width="4" stroke-linecap="round"/>

            <!-- Atoms -->
            <!-- H's on C1 -->
            <circle cx="250" cy="180" r="12" fill="url(#grad-h)"/><text x="250" y="180" class="atom-text-dark">H</text>
            <circle cx="250" cy="320" r="12" fill="url(#grad-h)"/><text x="250" y="320" class="atom-text-dark">H</text>
            <!-- H's on C2 -->
            <circle cx="550" cy="180" r="12" fill="url(#grad-h)"/><text x="550" y="180" class="atom-text-dark">H</text>
            <circle cx="550" cy="320" r="12" fill="url(#grad-h)"/><text x="550" y="320" class="atom-text-dark">H</text>

            <!-- Main Carbons -->
            <circle cx="320" cy="250" r="18" fill="url(#grad-c)"/><text x="320" y="250" class="atom-text">C</text>
            <circle cx="480" cy="250" r="18" fill="url(#grad-c)"/><text x="480" y="250" class="atom-text">C</text>

            <!-- Attacking H+ Ion (Animated) -->
            <g class="ele-h-move">
                <circle cx="480" cy="100" r="16" fill="url(#grad-h-ion)"/>
                <text x="480" y="100" class="atom-text">H</text>
                <g class="ele-charge-h">
                    <circle cx="500" cy="85" r="10" fill="#4444FF"/>
                    <text x="500" y="85" class="charge-text">+</text>
                </g>
            </g>

            <!-- Charge on C1 (Animated) -->
            <g class="ele-charge-c">
                <circle cx="320" cy="210" r="10" fill="#4444FF"/>
                <text x="320" y="210" class="charge-text">+</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- STATUS BAR & DYNAMIC LABELS                -->
        <!-- ========================================== -->
        <g transform="translate(100, 420)">
            <rect width="600" height="50" rx="12" fill="#ffffff" stroke="#e0e0e0" stroke-width="2" />
            
            <text x="300" y="25" class="text1 status-text" font-size="16" font-weight="500" text-anchor="middle" fill="#333" dominant-baseline="central">
                <tspan font-weight="700" fill="#F77F00">Inductive Effect (-I):</tspan> Permanent σ-electron displacement towards Cl
            </text>
            
            <text x="300" y="25" class="text2 status-text" font-size="16" font-weight="500" text-anchor="middle" fill="#333" dominant-baseline="central">
                <tspan font-weight="700" fill="#F77F00">Resonance (+R):</tspan> Delocalization of π-electrons and lone pairs
            </text>
            
            <text x="300" y="25" class="text3 status-text" font-size="16" font-weight="500" text-anchor="middle" fill="#333" dominant-baseline="central">
                <tspan font-weight="700" fill="#F77F00">Hyperconjugation:</tspan> σ-electrons delocalize into an empty p-orbital
            </text>
            
            <text x="300" y="25" class="text4 status-text" font-size="16" font-weight="500" text-anchor="middle" fill="#333" dominant-baseline="central">
                <tspan font-weight="700" fill="#F77F00">Electromeric Effect (+E):</tspan> Temporary π-bond shift towards attacking H⁺
            </text>
        </g>

    </svg>
</div>

</body>
</html>
