<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monohybrid Cross Animation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        .svg-container {
            width: 100%;
            max-width: 800px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(44, 62, 80, 0.1);
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .geno {
            font-family: 'Roboto Mono', monospace;
            font-size: 16px;
            font-weight: 700;
            fill: #2C3E50;
            text-anchor: middle;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            fill: #2C3E50;
        }

        /* Animations */
        .anim-global { animation: fade-global 15s infinite ease-in-out; }
        @keyframes fade-global {
            0%, 2% { opacity: 0; }
            5%, 96% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        .anim-p-gamete-T { animation: move-p-gamete-T 15s infinite ease-in-out; }
        @keyframes move-p-gamete-T {
            0%, 20% { transform: translate(250px, 140px); opacity: 0; }
            22% { transform: translate(250px, 140px); opacity: 1; }
            28% { transform: translate(380px, 280px); opacity: 1; }
            31% { transform: translate(400px, 280px); opacity: 1; }
            33%, 100% { transform: translate(400px, 280px); opacity: 0; }
        }

        .anim-p-gamete-t { animation: move-p-gamete-t 15s infinite ease-in-out; }
        @keyframes move-p-gamete-t {
            0%, 20% { transform: translate(550px, 140px); opacity: 0; }
            22% { transform: translate(550px, 140px); opacity: 1; }
            28% { transform: translate(420px, 280px); opacity: 1; }
            31% { transform: translate(400px, 280px); opacity: 1; }
            33%, 100% { transform: translate(400px, 280px); opacity: 0; }
        }

        .anim-p-meiosis { animation: fade-p-meiosis 15s infinite ease-in-out; }
        @keyframes fade-p-meiosis {
            0%, 20% { opacity: 0; transform: translateY(-5px); }
            22%, 31% { opacity: 1; transform: translateY(0); }
            33%, 100% { opacity: 0; }
        }

        .anim-f1-plant { animation: grow-f1 15s infinite ease-in-out; }
        @keyframes grow-f1 {
            0%, 32% { transform: translate(400px, 300px) scale(0); opacity: 0; }
            35%, 96% { transform: translate(400px, 300px) scale(1); opacity: 1; }
            98%, 100% { transform: translate(400px, 300px) scale(1); opacity: 0; }
        }

        .anim-f1-meiosis { animation: fade-f1-meiosis 15s infinite ease-in-out; }
        @keyframes fade-f1-meiosis {
            0%, 46% { opacity: 0; transform: translateY(-5px); }
            48%, 56% { opacity: 1; transform: translateY(0); }
            58%, 100% { opacity: 0; }
        }

        .anim-f1-top-T { animation: move-f1-top-T 15s infinite ease-in-out; }
        @keyframes move-f1-top-T {
            0%, 46% { transform: translate(400px, 280px); opacity: 0; }
            48% { transform: translate(400px, 280px); opacity: 1; }
            54%, 96% { transform: translate(360px, 350px); opacity: 1; }
            98%, 100% { transform: translate(360px, 350px); opacity: 0; }
        }

        .anim-f1-top-t { animation: move-f1-top-t 15s infinite ease-in-out; }
        @keyframes move-f1-top-t {
            0%, 46% { transform: translate(400px, 280px); opacity: 0; }
            48% { transform: translate(400px, 280px); opacity: 1; }
            54%, 96% { transform: translate(440px, 350px); opacity: 1; }
            98%, 100% { transform: translate(440px, 350px); opacity: 0; }
        }

        .anim-f1-left-T { animation: move-f1-left-T 15s infinite ease-in-out; }
        @keyframes move-f1-left-T {
            0%, 46% { transform: translate(400px, 280px); opacity: 0; }
            48% { transform: translate(400px, 280px); opacity: 1; }
            54%, 96% { transform: translate(290px, 420px); opacity: 1; }
            98%, 100% { transform: translate(290px, 420px); opacity: 0; }
        }

        .anim-f1-left-t { animation: move-f1-left-t 15s infinite ease-in-out; }
        @keyframes move-f1-left-t {
            0%, 46% { transform: translate(400px, 280px); opacity: 0; }
            48% { transform: translate(400px, 280px); opacity: 1; }
            54%, 96% { transform: translate(290px, 500px); opacity: 1; }
            98%, 100% { transform: translate(290px, 500px); opacity: 0; }
        }

        .anim-f2-grid { animation: fade-f2-grid 15s infinite ease-in-out; }
        @keyframes fade-f2-grid {
            0%, 54% { opacity: 0; }
            56%, 96% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        .anim-cell-1 { animation: fade-cell-1 15s infinite ease-in-out; transform-origin: 360px 435px; }
        @keyframes fade-cell-1 {
            0%, 60% { opacity: 0; transform: scale(0.8); }
            62%, 96% { opacity: 1; transform: scale(1); }
            98%, 100% { opacity: 0; }
        }

        .anim-cell-2 { animation: fade-cell-2 15s infinite ease-in-out; transform-origin: 440px 435px; }
        @keyframes fade-cell-2 {
            0%, 66% { opacity: 0; transform: scale(0.8); }
            68%, 96% { opacity: 1; transform: scale(1); }
            98%, 100% { opacity: 0; }
        }

        .anim-cell-3 { animation: fade-cell-3 15s infinite ease-in-out; transform-origin: 360px 515px; }
        @keyframes fade-cell-3 {
            0%, 66% { opacity: 0; transform: scale(0.8); }
            68%, 96% { opacity: 1; transform: scale(1); }
            98%, 100% { opacity: 0; }
        }

        .anim-cell-4 { animation: fade-cell-4 15s infinite ease-in-out; transform-origin: 440px 515px; }
        @keyframes fade-cell-4 {
            0%, 73% { opacity: 0; transform: scale(0.8); }
            75%, 96% { opacity: 1; transform: scale(1); }
            98%, 100% { opacity: 0; }
        }

        .anim-results { animation: fade-results 15s infinite ease-in-out; }
        @keyframes fade-results {
            0%, 86% { opacity: 0; transform: translateY(15px); }
            88%, 96% { opacity: 1; transform: translateY(0); }
            98%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 600" aria-label="Animated diagram of a Mendelian Monohybrid Cross in Pisum sativum" role="img">
            <title>Monohybrid Cross Animation</title>
            <desc>Animation showing the P generation, gamete formation, F1 generation, and F2 Punnett square of a monohybrid cross.</desc>

            <defs>
                <!-- Tall Plant Symbol -->
                <g id="tall-plant">
                    <path d="M0,0 Q-5,-30 0,-60 T 5,-100" stroke="#2ECC71" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M-2,-20 Q-15,-25 -20,-15 Q-10,-10 -2,-20" fill="#2ECC71"/>
                    <path d="M2,-40 Q15,-45 20,-35 Q10,-30 2,-40" fill="#2ECC71"/>
                    <path d="M-2,-60 Q-15,-65 -20,-55 Q-10,-50 -2,-60" fill="#2ECC71"/>
                    <path d="M2,-80 Q15,-85 20,-75 Q10,-70 2,-80" fill="#2ECC71"/>
                </g>

                <!-- Dwarf Plant Symbol -->
                <g id="dwarf-plant">
                    <path d="M0,0 Q3,-15 0,-30 T -3,-50" stroke="#2ECC71" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <path d="M2,-15 Q15,-20 20,-10 Q10,-5 2,-15" fill="#2ECC71"/>
                    <path d="M-2,-30 Q-15,-35 -20,-25 Q-10,-20 -2,-30" fill="#2ECC71"/>
                    <path d="M2,-45 Q15,-50 20,-40 Q10,-35 2,-45" fill="#2ECC71"/>
                </g>

                <!-- Dominant Allele T -->
                <g id="allele-T">
                    <circle cx="0" cy="0" r="10" fill="#FF6B6B"/>
                    <text x="0" y="4" font-family="'Roboto Mono', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">T</text>
                </g>

                <!-- Recessive Allele t -->
                <g id="allele-t">
                    <circle cx="0" cy="0" r="10" fill="#FFA07A"/>
                    <text x="0" y="4" font-family="'Roboto Mono', monospace" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">t</text>
                </g>

                <!-- Gamete T -->
                <g id="gamete-T">
                    <circle cx="0" cy="0" r="16" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                    <use href="#allele-T"/>
                </g>

                <!-- Gamete t -->
                <g id="gamete-t">
                    <circle cx="0" cy="0" r="16" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                    <use href="#allele-t"/>
                </g>

                <!-- Arrowhead -->
                <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                    <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" />
                </marker>
            </defs>

            <!-- Title -->
            <text x="400" y="40" font-family="Inter" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">
                Monohybrid Cross: Inheritance of Height in <tspan font-style="italic">Pisum sativum</tspan>
            </text>

            <!-- Legend -->
            <g class="anim-global">
                <rect x="620" y="60" width="140" height="60" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
                <circle cx="640" cy="75" r="6" fill="#FF6B6B"/>
                <text x="655" y="79" font-family="Inter" font-size="12" fill="#2C3E50">Dominant (T)</text>
                <circle cx="640" cy="95" r="6" fill="#FFA07A"/>
                <text x="655" y="99" font-family="Inter" font-size="12" fill="#2C3E50">Recessive (t)</text>
            </g>

            <!-- ================= P GENERATION ================= -->
            <g class="anim-global">
                <text x="40" y="120" class="label">P Generation</text>
                
                <!-- Tall Parent -->
                <use href="#tall-plant" x="250" y="140"/>
                <text x="250" y="165" class="geno">TT</text>
                
                <!-- Cross Symbol -->
                <text x="400" y="100" font-family="Inter" font-size="24" font-weight="bold" fill="#2C3E50" text-anchor="middle">×</text>
                
                <!-- Dwarf Parent -->
                <use href="#dwarf-plant" x="550" y="140"/>
                <text x="550" y="165" class="geno">tt</text>

                <!-- Arrow to F1 -->
                <line x1="400" y1="170" x2="400" y2="200" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>
            </g>

            <!-- P Generation Meiosis Text -->
            <text x="400" y="180" font-family="Inter" font-size="13" font-style="italic" fill="#2C3E50" text-anchor="middle" class="anim-p-meiosis">Meiosis / Gamete Formation</text>

            <!-- P Generation Gametes (Animated) -->
            <g class="anim-p-gamete-T"><use href="#gamete-T"/></g>
            <g class="anim-p-gamete-t"><use href="#gamete-t"/></g>

            <!-- ================= F1 GENERATION ================= -->
            <g class="anim-global">
                <text x="40" y="280" class="label">F1 Generation</text>
            </g>

            <!-- F1 Plant (Animated Growth) -->
            <g class="anim-f1-plant">
                <use href="#tall-plant" x="0" y="0"/>
                <text x="0" y="25" class="geno">Tt</text>
                <text x="0" y="45" font-family="Inter" font-size="12" fill="#2C3E50" text-anchor="middle">(All Tall)</text>
            </g>

            <!-- F1 Generation Meiosis Text -->
            <text x="400" y="250" font-family="Inter" font-size="13" font-style="italic" fill="#2C3E50" text-anchor="middle" class="anim-f1-meiosis">Self-Fertilization (Tt × Tt) & Gamete Formation</text>

            <!-- F1 Generation Gametes (Animated) -->
            <g class="anim-f1-top-T"><use href="#gamete-T"/></g>
            <g class="anim-f1-top-t"><use href="#gamete-t"/></g>
            <g class="anim-f1-left-T"><use href="#gamete-T"/></g>
            <g class="anim-f1-left-t"><use href="#gamete-t"/></g>

            <!-- ================= F2 GENERATION ================= -->
            <g class="anim-f2-grid">
                <text x="40" y="460" class="label">F2 Generation</text>
                
                <!-- Arrow to F2 -->
                <line x1="400" y1="340" x2="400" y2="365" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrowhead)"/>

                <!-- Punnett Square Grid -->
                <rect x="320" y="380" width="160" height="160" fill="#ffffff" stroke="#2C3E50" stroke-width="2"/>
                <line x1="400" y1="380" x2="400" y2="540" stroke="#2C3E50" stroke-width="2"/>
                <line x1="320" y1="460" x2="480" y2="460" stroke="#2C3E50" stroke-width="2"/>
                
                <!-- Gamete Indicators (Lines) -->
                <line x1="320" y1="380" x2="280" y2="340" stroke="#2C3E50" stroke-width="1"/>
                <text x="290" y="335" font-family="Inter" font-size="12" fill="#2C3E50" text-anchor="middle">♀</text>
                <text x="270" y="355" font-family="Inter" font-size="12" fill="#2C3E50" text-anchor="middle">♂</text>
            </g>

            <!-- Punnett Square Cells (Animated) -->
            <!-- Cell 1: TT -->
            <g class="anim-cell-1">
                <g transform="translate(360, 435) scale(0.5)"><use href="#tall-plant"/></g>
                <text x="360" y="450" class="geno">TT</text>
            </g>
            
            <!-- Cell 2: Tt -->
            <g class="anim-cell-2">
                <g transform="translate(440, 435) scale(0.5)"><use href="#tall-plant"/></g>
                <text x="440" y="450" class="geno">Tt</text>
            </g>
            
            <!-- Cell 3: Tt -->
            <g class="anim-cell-3">
                <g transform="translate(360, 515) scale(0.5)"><use href="#tall-plant"/></g>
                <text x="360" y="530" class="geno">Tt</text>
            </g>
            
            <!-- Cell 4: tt -->
            <g class="anim-cell-4">
                <g transform="translate(440, 515) scale(0.5)"><use href="#dwarf-plant"/></g>
                <text x="440" y="530" class="geno">tt</text>
            </g>

            <!-- ================= RESULTS BOX ================= -->
            <g class="anim-results">
                <rect x="550" y="400" width="210" height="120" rx="8" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
                <text x="655" y="425" font-family="Inter" font-size="14" font-weight="bold" fill="#2C3E50" text-anchor="middle">Phenotypic Ratio</text>
                <text x="655" y="445" font-family="Inter" font-size="14" fill="#2C3E50" text-anchor="middle">3 Tall : 1 Dwarf</text>
                
                <line x1="570" y1="460" x2="740" y2="460" stroke="#4A90D9" stroke-width="1"/>
                
                <text x="655" y="480" font-family="Inter" font-size="14" font-weight="bold" fill="#2C3E50" text-anchor="middle">Genotypic Ratio</text>
                <text x="655" y="500" font-family="Inter" font-size="14" fill="#2C3E50" text-anchor="middle">1 TT : 2 Tt : 1 tt</text>
            </g>

        </svg>
    </div>
</body>
</html>
