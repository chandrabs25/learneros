<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functional Structure of an Ecosystem</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            position: relative;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        .label-text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }

        .chem-text {
            font-family: 'Roboto Mono', monospace;
            fill: #2C3E50;
            font-weight: 500;
        }

        .glass-panel {
            fill: rgba(255, 255, 255, 0.85);
            stroke: #BDC3C7;
            stroke-width: 1;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Functional Structure of an Ecosystem: Biotic &amp; Abiotic Interactions</title>
        <desc>An animated cross-section of a freshwater pond ecosystem showing the interaction between abiotic components like the sun, water, and soil, and biotic components like producers, consumers, and decomposers. Energy flows one-way from the sun to the plant and then to the fish. Nutrients cycle from the organisms to the soil via decomposers and back to the plant. Gases like carbon dioxide and oxygen are exchanged during photosynthesis and respiration.</desc>

        <defs>
            <!-- Arrow Markers -->
            <marker id="arrow-energy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F1C40F" />
            </marker>
            <marker id="arrow-nutrient" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#27AE60" />
            </marker>
            <marker id="arrow-organic" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#795548" />
            </marker>

            <!-- Glow Filter for Sun and Energy -->
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="4" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Plant Leaf Cluster -->
            <g id="leaf-cluster">
                <path d="M 0 0 Q -15 -5 -20 -15 Q -5 -10 0 0" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
                <path d="M 0 0 Q 15 -5 20 -15 Q 5 -10 0 0" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
                <path d="M 0 0 Q -20 5 -25 0 Q -10 10 0 0" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
                <path d="M 0 0 Q 20 5 25 0 Q 10 10 0 0" fill="#2ECC71" stroke="#27AE60" stroke-width="1"/>
            </g>

            <!-- Animation Paths -->
            <path id="co2-path" d="M 350 150 Q 250 150 160 200" fill="none" />
            <path id="o2-path" d="M 160 220 Q 300 280 440 250" fill="none" />
            <path id="energy-path-transfer" d="M 150 180 Q 300 120 440 240" fill="none" />
            <path id="organic-path-fish" d="M 500 270 Q 480 380 420 460" fill="none" />
            <path id="organic-path-plant" d="M 140 350 Q 200 400 390 460" fill="none" />
            <path id="nutrient-path" d="M 390 475 L 150 475 L 140 450" fill="none" />
        </defs>

        <!-- ================= BACKGROUNDS (ABIOTIC) ================= -->
        <!-- Sky -->
        <rect x="0" y="0" width="800" height="100" fill="#E8F4FD" />
        
        <!-- Soil / Benthic Zone -->
        <rect x="0" y="450" width="800" height="50" fill="#795548" />
        
        <!-- Soil Texture/Details -->
        <circle cx="100" cy="470" r="3" fill="#5D4037" opacity="0.5"/>
        <circle cx="250" cy="485" r="4" fill="#5D4037" opacity="0.5"/>
        <circle cx="550" cy="465" r="2" fill="#5D4037" opacity="0.5"/>
        <circle cx="700" cy="480" r="5" fill="#5D4037" opacity="0.5"/>

        <!-- Sun -->
        <g transform="translate(100, 50)">
            <!-- Sun Rays -->
            <g stroke="#F1C40F" stroke-width="3" stroke-linecap="round">
                <line x1="0" y1="-35" x2="0" y2="-45" />
                <line x1="0" y1="35" x2="0" y2="45" />
                <line x1="-35" y1="0" x2="-45" y2="0" />
                <line x1="35" y1="0" x2="45" y2="0" />
                <line x1="-25" y1="-25" x2="-32" y2="-32" />
                <line x1="25" y1="25" x2="32" y2="32" />
                <line x1="-25" y1="25" x2="-32" y2="32" />
                <line x1="25" y1="-25" x2="32" y2="-32" />
                <animate attributeName="opacity" values="0.4; 1; 0.4" dur="12s" repeatCount="indefinite" />
            </g>
            <!-- Sun Body -->
            <circle cx="0" cy="0" r="25" fill="#F1C40F" filter="url(#glow)">
                <animate attributeName="r" values="25; 27; 25" dur="12s" repeatCount="indefinite" />
            </circle>
        </g>

        <!-- ================= BIOTIC COMPONENTS ================= -->
        
        <!-- Phytoplankton & Zooplankton -->
        <g>
            <!-- Phytoplankton (Producers) -->
            <circle cx="250" cy="130" r="2.5" fill="#2ECC71"/>
            <circle cx="270" cy="145" r="2" fill="#2ECC71"/>
            <circle cx="290" cy="125" r="3" fill="#2ECC71"/>
            <circle cx="310" cy="150" r="2.5" fill="#2ECC71"/>
            <circle cx="330" cy="135" r="2" fill="#2ECC71"/>
            <!-- Zooplankton (Consumers) -->
            <circle cx="260" cy="135" r="1.5" fill="#F39C12"/>
            <circle cx="280" cy="150" r="2" fill="#F39C12"/>
            <circle cx="300" cy="130" r="1.5" fill="#F39C12"/>
        </g>

        <!-- Primary Producer: Aquatic Plant (Hydrilla) -->
        <g id="producer-plant">
            <!-- Stem -->
            <path d="M 140 450 Q 150 300 140 150" stroke="#27AE60" stroke-width="4" fill="none"/>
            <!-- Roots -->
            <path d="M 140 450 Q 130 470 120 480 M 140 450 Q 150 470 160 490 M 140 450 Q 145 465 140 485" stroke="#F5F5DC" stroke-width="2" fill="none"/>
            <!-- Leaves -->
            <use href="#leaf-cluster" x="142" y="400" transform="rotate(-5 142 400)"/>
            <use href="#leaf-cluster" x="145" y="350" transform="rotate(5 145 350)"/>
            <use href="#leaf-cluster" x="148" y="300" transform="rotate(-2 148 300)"/>
            <use href="#leaf-cluster" x="149" y="250" transform="rotate(8 149 250)"/>
            <use href="#leaf-cluster" x="146" y="200" transform="rotate(-5 146 200)"/>
            <use href="#leaf-cluster" x="140" y="150" transform="rotate(0 140 150)"/>
        </g>

        <!-- Consumer: Fish -->
        <g id="consumer-fish">
            <animateTransform attributeName="transform" type="translate" values="0,0; -20,10; 0,0" dur="12s" repeatCount="indefinite" />
            
            <!-- Tail Fin -->
            <path d="M 515 250 L 550 220 L 540 250 L 550 280 Z" fill="#E67E22">
                <animateTransform attributeName="transform" type="rotate" values="0 540 250; -15 540 250; 0 540 250; 15 540 250; 0 540 250" dur="1s" repeatCount="indefinite" />
            </path>
            
            <!-- Dorsal Fin -->
            <path d="M 470 228 Q 490 210 500 235 Z" fill="#E67E22"/>
            
            <!-- Body -->
            <path d="M 440 250 C 440 220, 480 215, 520 240 C 540 250, 540 250, 520 260 C 480 285, 440 280, 440 250 Z" fill="#F39C12"/>
            
            <!-- Pectoral Fin -->
            <path d="M 480 255 Q 500 270 490 265 Z" fill="#D35400">
                <animateTransform attributeName="transform" type="rotate" values="0 480 255; -20 480 255; 0 480 255; 20 480 255; 0 480 255" dur="0.5s" repeatCount="indefinite" />
            </path>
            
            <!-- Gills -->
            <path d="M 465 240 Q 470 250 465 260" stroke="#D35400" stroke-width="2" fill="none"/>
            
            <!-- Eye -->
            <circle cx="455" cy="242" r="4" fill="#2C3E50"/>
            <circle cx="453" cy="240" r="1.5" fill="#ffffff"/>
        </g>

        <!-- Decomposers (Fungi & Bacteria) -->
        <g id="decomposers">
            <!-- Dead Organic Matter (Leaf) -->
            <path d="M 380 470 Q 390 460 400 465 Q 390 475 380 470" fill="#A0522D"/>
            
            <!-- Fungi -->
            <path d="M 410 470 L 410 455 Q 400 455 410 445 Q 420 455 410 455" fill="#9B59B6" stroke="#8E44AD" stroke-width="1"/>
            <path d="M 425 470 L 425 460 Q 418 460 425 452 Q 432 460 425 460" fill="#9B59B6" stroke="#8E44AD" stroke-width="1"/>
            
            <!-- Bacteria -->
            <rect x="390" y="465" width="8" height="4" rx="2" fill="#8E44AD" transform="rotate(20 390 465)"/>
            <rect x="395" y="472" width="8" height="4" rx="2" fill="#8E44AD" transform="rotate(-15 395 472)"/>
            <rect x="430" y="468" width="6" height="3" rx="1.5" fill="#8E44AD" transform="rotate(45 430 468)"/>
        </g>

        <!-- ================= PATHS & ARROWS ================= -->
        
        <!-- Energy Flow (Sun to Plant) -->
        <path d="M 100 85 L 135 145" stroke="#F1C40F" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-energy)"/>
        
        <!-- Energy Flow (Plant to Fish) -->
        <path d="M 150 180 Q 300 120 430 235" stroke="#F1C40F" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrow-energy)"/>
        
        <!-- Nutrient Cycle (Decomposer to Soil to Plant) -->
        <path d="M 390 475 L 150 475 L 140 455" stroke="#27AE60" stroke-width="2" fill="none" marker-end="url(#arrow-nutrient)"/>
        
        <!-- Organic Matter (Fish to Decomposer) -->
        <path d="M 500 270 Q 480 380 420 460" stroke="#795548" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-organic)"/>
        
        <!-- Organic Matter (Plant to Decomposer) -->
        <path d="M 140 350 Q 200 400 385 460" stroke="#795548" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow-organic)"/>


        <!-- ================= WATER OVERLAY (Glassmorphism effect) ================= -->
        <!-- Submerges the biotic components slightly to show they are underwater -->
        <rect x="0" y="100" width="800" height="350" fill="#3498DB" opacity="0.2" />
        <!-- Water Surface Line -->
        <path d="M 0 100 Q 100 97 200 100 T 400 100 T 600 100 T 800 100" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>


        <!-- ================= ANIMATED PARTICLES ================= -->
        
        <!-- Phase 2: Photosynthesis & Respiration (0-6s) -->
        <!-- CO2 Molecules (Grey) -->
        <g>
            <circle r="4" fill="#95A5A6">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 1; 1" keyTimes="0; 0.166; 1" calcMode="linear"><mpath href="#co2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.15; 0.166; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="4" fill="#95A5A6">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.166; 0.333; 1" calcMode="linear"><mpath href="#co2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.166; 0.21; 0.31; 0.333; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="4" fill="#95A5A6">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.333; 0.5; 1" calcMode="linear"><mpath href="#co2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.333; 0.38; 0.48; 0.5; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
        </g>

        <!-- O2 Molecules (Light Blue) -->
        <g>
            <circle r="4" fill="#AED6F1">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 1; 1" keyTimes="0; 0.166; 1" calcMode="linear"><mpath href="#o2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.15; 0.166; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="4" fill="#AED6F1">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.166; 0.333; 1" calcMode="linear"><mpath href="#o2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.166; 0.21; 0.31; 0.333; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="4" fill="#AED6F1">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.333; 0.5; 1" calcMode="linear"><mpath href="#o2-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.333; 0.38; 0.48; 0.5; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
        </g>

        <!-- Phase 3: Trophic Transfer (3-9s) -->
        <!-- Energy Packets (Glowing Yellow) -->
        <g>
            <circle r="3" fill="#F1C40F" filter="url(#glow)">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.25; 0.416; 1" calcMode="linear"><mpath href="#energy-path-transfer"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.25; 0.3; 0.4; 0.416; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="3" fill="#F1C40F" filter="url(#glow)">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.416; 0.583; 1" calcMode="linear"><mpath href="#energy-path-transfer"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.416; 0.46; 0.56; 0.583; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="3" fill="#F1C40F" filter="url(#glow)">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.583; 0.75; 1" calcMode="linear"><mpath href="#energy-path-transfer"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.583; 0.63; 0.73; 0.75; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
        </g>

        <!-- Phase 4: Decomposition & Mineralization (6-12s) -->
        <!-- Organic Matter from Fish (Brown) -->
        <g>
            <circle r="3" fill="#5D4037">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.5; 0.666; 1" calcMode="linear"><mpath href="#organic-path-fish"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.5; 0.55; 0.65; 0.666; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="3" fill="#5D4037">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.666; 0.833; 1" calcMode="linear"><mpath href="#organic-path-fish"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.666; 0.71; 0.81; 0.833; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
        </g>

        <!-- Nutrients from Soil to Plant (White) -->
        <g>
            <circle r="2.5" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.5">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1; 1" keyTimes="0; 0.666; 0.833; 1" calcMode="linear"><mpath href="#nutrient-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.666; 0.7; 0.8; 0.833; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
            <circle r="2.5" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.5">
                <animateMotion dur="12s" repeatCount="indefinite" keyPoints="0; 0; 1" keyTimes="0; 0.833; 1" calcMode="linear"><mpath href="#nutrient-path"/></animateMotion>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.833; 0.88; 0.98; 1" dur="12s" repeatCount="indefinite"/>
            </circle>
        </g>


        <!-- ================= LABELS & ANNOTATIONS ================= -->
        
        <!-- Main Title -->
        <text x="400" y="35" text-anchor="middle" class="label-text" font-size="20" font-weight="700">Functional Structure of an Ecosystem: Biotic &amp; Abiotic Interactions</text>

        <!-- Categorical Badges -->
        <g transform="translate(20, 50)">
            <rect x="0" y="0" width="150" height="24" fill="#E8F4FD" stroke="#3498DB" rx="4"/>
            <text x="75" y="16" text-anchor="middle" class="label-text" font-size="12" font-weight="600">Non-Living (Abiotic)</text>
        </g>
        <g transform="translate(180, 50)">
            <rect x="0" y="0" width="130" height="24" fill="#E8F4FD" stroke="#2ECC71" rx="4"/>
            <text x="65" y="16" text-anchor="middle" class="label-text" font-size="12" font-weight="600">Living (Biotic)</text>
        </g>

        <!-- Specific Organism Labels -->
        <!-- Primary Producer -->
        <g transform="translate(20, 320)">
            <rect x="0" y="0" width="190" height="22" class="glass-panel" rx="4"/>
            <text x="95" y="15" text-anchor="middle" class="label-text" font-size="12" font-weight="600">Primary Producer (<tspan font-style="italic" font-weight="400">Autotroph</tspan>)</text>
        </g>

        <!-- Consumer -->
        <g transform="translate(560, 200)">
            <rect x="0" y="0" width="170" height="22" class="glass-panel" rx="4"/>
            <text x="85" y="15" text-anchor="middle" class="label-text" font-size="12" font-weight="600">Consumer (<tspan font-style="italic" font-weight="400">Heterotroph</tspan>)</text>
        </g>

        <!-- Decomposers -->
        <g transform="translate(450, 475)">
            <rect x="0" y="0" width="165" height="20" class="glass-panel" rx="4"/>
            <text x="82.5" y="14" text-anchor="middle" class="label-text" font-size="11" font-weight="600">Saprotropic Decomposers</text>
        </g>

        <!-- Environment Label -->
        <g transform="translate(10, 475)">
            <text x="0" y="14" class="label-text" font-size="11" font-weight="600" fill="#ECF0F1" style="fill: rgba(255,255,255,0.8);">Physico-chemical environment</text>
        </g>

        <!-- ================= LEGEND ================= -->
        <g transform="translate(610, 60)">
            <rect x="0" y="0" width="170" height="160" class="glass-panel" rx="6"/>
            <text x="10" y="20" class="label-text" font-size="14" font-weight="700">Legend</text>
            
            <!-- Energy Flow -->
            <line x1="10" y1="40" x2="30" y2="40" stroke="#F1C40F" stroke-width="2" stroke-dasharray="4,2"/>
            <text x="40" y="44" class="label-text" font-size="12">Energy Flow</text>
            
            <!-- Nutrient Cycle -->
            <line x1="10" y1="65" x2="30" y2="65" stroke="#27AE60" stroke-width="2"/>
            <text x="40" y="69" class="label-text" font-size="12">Nutrient Cycle</text>
            
            <!-- CO2 -->
            <circle cx="20" cy="90" r="4" fill="#95A5A6"/>
            <text x="40" y="94" class="chem-text" font-size="12">CO<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
            
            <!-- O2 -->
            <circle cx="20" cy="115" r="4" fill="#AED6F1"/>
            <text x="40" y="119" class="chem-text" font-size="12">O<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
            
            <!-- Organic Matter / Nutrients -->
            <circle cx="15" cy="140" r="3" fill="#5D4037"/>
            <circle cx="25" cy="140" r="3" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="0.5"/>
            <text x="40" y="144" class="label-text" font-size="11">Organic / Nutrients</text>
        </g>

    </svg>
</div>

</body>
</html>
