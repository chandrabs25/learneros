<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecological Levels of Organization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #2C3E50;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .svg-container {
            width: 100%;
            max-width: 900px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #2C3E50;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- Animations --- */
        
        /* Sun Pulse */
        .sun-glow {
            animation: pulse-sun 3s ease-in-out infinite;
            transform-origin: center;
        }
        @keyframes pulse-sun {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.5; }
        }

        /* Rain Fall */
        .drop {
            animation: rain-fall 1.5s linear infinite;
        }
        .d1 { animation-delay: 0s; }
        .d2 { animation-delay: 0.3s; }
        .d3 { animation-delay: 0.6s; }
        .d4 { animation-delay: 0.9s; }
        .d5 { animation-delay: 1.2s; }
        
        @keyframes rain-fall {
            0% { transform: translateY(0); opacity: 1; }
            70% { opacity: 1; }
            100% { transform: translateY(250px); opacity: 0; }
        }

        /* Stage 2: Organism */
        .anim-tree1 {
            transform-origin: 0px 0px;
            animation: tree1-anim 20s infinite;
        }
        @keyframes tree1-anim {
            0%, 5% { transform: scaleY(0); opacity: 0; }
            10%, 95% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0); opacity: 0; }
        }

        /* Stage 3: Population */
        .anim-pop {
            transform-origin: 0px 0px;
            animation: pop-anim 20s infinite;
        }
        @keyframes pop-anim {
            0%, 25% { transform: scaleY(0.5); opacity: 0; }
            30%, 95% { transform: scaleY(1); opacity: 1; }
            100% { transform: scaleY(0.5); opacity: 0; }
        }

        /* Genetic Variation Pulse */
        .pop-pulse {
            animation: genetic-pulse 20s infinite;
        }
        @keyframes genetic-pulse {
            0%, 34% { fill: #2ECC71; }
            36%, 38% { fill: #27AE60; }
            40%, 100% { fill: #2ECC71; }
        }

        /* Stage 4: Community */
        .anim-animal {
            animation: animal-anim 20s infinite;
        }
        @keyframes animal-anim {
            0%, 49% { transform: translateX(50px); opacity: 0; }
            55%, 95% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(50px); opacity: 0; }
        }

        /* Stage 5: Ecosystem Arrows */
        .anim-eco {
            animation: eco-anim 20s infinite;
        }
        @keyframes eco-anim {
            0%, 74% { opacity: 0; }
            78%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Arrow Flows */
        .flow-energy {
            stroke-dasharray: 12, 8;
            animation: flow-dash-energy 1s linear infinite;
        }
        .flow-nutrient {
            stroke-dasharray: 15, 10;
            animation: flow-dash-nutrient 1.5s linear infinite;
        }
        @keyframes flow-dash-energy {
            to { stroke-dashoffset: -20; }
        }
        @keyframes flow-dash-nutrient {
            to { stroke-dashoffset: 25; }
        }

        /* Dynamic Labels */
        .lbl-org { animation: lbl-org-anim 20s infinite; }
        .lbl-pop { animation: lbl-pop-anim 20s infinite; }
        .lbl-com { animation: lbl-com-anim 20s infinite; }
        .lbl-eco { animation: lbl-eco-anim 20s infinite; }

        @keyframes lbl-org-anim {
            0%, 4% { opacity: 0; }
            5%, 24% { opacity: 1; }
            25%, 100% { opacity: 0; }
        }
        @keyframes lbl-pop-anim {
            0%, 24% { opacity: 0; }
            25%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }
        @keyframes lbl-com-anim {
            0%, 49% { opacity: 0; }
            50%, 74% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }
        @keyframes lbl-eco-anim {
            0%, 74% { opacity: 0; }
            75%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

    </style>
</head>
<body>

    <h1>Ecological Levels of Organization & Abiotic Interactions</h1>

    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing ecological hierarchy from individual organism to ecosystem.">
            
            <!-- Background -->
            <rect width="800" height="500" fill="#f8f9fa" />

            <!-- Abiotic Foundation: Soil -->
            <rect x="0" y="400" width="800" height="20" fill="#5D4037" />
            <rect x="0" y="420" width="800" height="80" fill="#795548" />

            <!-- Abiotic Foundation: Sun -->
            <g transform="translate(100, 90)">
                <circle cx="0" cy="0" r="55" fill="#F1C40F" class="sun-glow" />
                <circle cx="0" cy="0" r="35" fill="#F1C40F" />
                <g stroke="#F1C40F" stroke-width="4" stroke-linecap="round">
                    <line x1="0" y1="-50" x2="0" y2="-70" />
                    <line x1="0" y1="50" x2="0" y2="70" />
                    <line x1="-50" y1="0" x2="-70" y2="0" />
                    <line x1="50" y1="0" x2="70" y2="0" />
                    <line x1="-35" y1="-35" x2="-50" y2="-50" />
                    <line x1="35" y1="35" x2="50" y2="50" />
                    <line x1="-35" y1="35" x2="-50" y2="50" />
                    <line x1="35" y1="-35" x2="50" y2="-50" />
                </g>
            </g>

            <!-- Abiotic Foundation: Clouds & Rain -->
            <g transform="translate(650, 70)">
                <g fill="#3498DB">
                    <circle cx="-30" cy="20" r="3" class="drop d1" />
                    <circle cx="0" cy="30" r="3" class="drop d2" />
                    <circle cx="30" cy="15" r="3" class="drop d3" />
                    <circle cx="-15" cy="40" r="3" class="drop d4" />
                    <circle cx="15" cy="25" r="3" class="drop d5" />
                </g>
                <path d="M -50 0 C -50 -30, -20 -50, 0 -50 C 30 -50, 50 -30, 60 -10 C 80 -10, 90 10, 80 30 C 70 50, -60 50, -70 30 C -80 10, -70 -10, -50 0 Z" fill="#ECF0F1" />
            </g>

            <!-- Ecosystem Arrows (Stage 5) -->
            <g class="anim-eco">
                <!-- Energy Flow (Sun to Trees) -->
                <path d="M 140 120 Q 250 150 380 220" fill="none" stroke="#F1C40F" stroke-width="3" class="flow-energy" />
                <path d="M 130 140 Q 180 200 220 250" fill="none" stroke="#F1C40F" stroke-width="3" class="flow-energy" />
                <path d="M 150 100 Q 350 100 500 220" fill="none" stroke="#F1C40F" stroke-width="3" class="flow-energy" />
                
                <!-- Nutrient Cycle (Soil -> Trees -> Animal -> Soil) -->
                <path d="M 400 450 L 400 350 Q 500 300 600 350 L 600 450 Z" fill="none" stroke="#98D8C8" stroke-width="4" class="flow-nutrient" />
                <path d="M 220 450 L 220 350 Q 300 320 400 350" fill="none" stroke="#98D8C8" stroke-width="4" class="flow-nutrient" />
                
                <!-- Component Labels -->
                <text x="180" y="100" font-family="'Roboto Mono', monospace" font-size="12" fill="#D4AC0D" font-weight="bold">Energy Input</text>
                <text x="450" y="440" font-family="'Roboto Mono', monospace" font-size="12" fill="#1ABC9C" font-weight="bold">Nutrient Cycle</text>
            </g>

            <text x="650" y="140" font-family="'Roboto Mono', monospace" font-size="12" fill="#2980B9" font-weight="bold" text-anchor="middle">Abiotic Factors</text>

            <!-- Biotic Hierarchy: Population Trees (Stage 3) -->
            <g transform="translate(220, 400)">
                <g class="anim-pop">
                    <g transform="scale(0.85)">
                        <path d="M -12 0 L -8 -90 L 8 -90 L 12 0 Z" fill="#795548" />
                        <g class="pop-pulse">
                            <circle cx="0" cy="-130" r="55" />
                            <circle cx="-40" cy="-100" r="45" />
                            <circle cx="40" cy="-100" r="45" />
                            <circle cx="-25" cy="-65" r="40" />
                            <circle cx="25" cy="-65" r="40" />
                        </g>
                    </g>
                </g>
            </g>

            <g transform="translate(520, 400)">
                <g class="anim-pop">
                    <g transform="scale(0.75)">
                        <path d="M -12 0 L -8 -90 L 8 -90 L 12 0 Z" fill="#795548" />
                        <g class="pop-pulse">
                            <circle cx="0" cy="-130" r="55" />
                            <circle cx="-40" cy="-100" r="45" />
                            <circle cx="40" cy="-100" r="45" />
                            <circle cx="-25" cy="-65" r="40" />
                            <circle cx="25" cy="-65" r="40" />
                        </g>
                    </g>
                </g>
            </g>

            <!-- Biotic Hierarchy: Organism Tree (Stage 2) -->
            <g transform="translate(400, 400)">
                <g class="anim-tree1">
                    <path d="M -14 0 L -10 -110 L 10 -110 L 14 0 Z" fill="#795548" />
                    <g fill="#2ECC71">
                        <circle cx="0" cy="-150" r="65" />
                        <circle cx="-45" cy="-115" r="55" />
                        <circle cx="45" cy="-115" r="55" />
                        <circle cx="-30" cy="-75" r="45" />
                        <circle cx="30" cy="-75" r="45" />
                    </g>
                </g>
            </g>

            <!-- Biotic Hierarchy: Community Animal (Stage 4) -->
            <g transform="translate(600, 400)">
                <g class="anim-animal" fill="#F39C12">
                    <!-- Body -->
                    <ellipse cx="0" cy="-18" rx="22" ry="14" />
                    <!-- Head -->
                    <circle cx="-18" cy="-28" r="11" />
                    <!-- Ears -->
                    <ellipse cx="-15" cy="-45" rx="3" ry="14" transform="rotate(-15 -15 -45)" />
                    <ellipse cx="-22" cy="-43" rx="3" ry="14" transform="rotate(-30 -22 -43)" />
                    <!-- Legs -->
                    <rect x="-12" y="-10" width="5" height="10" rx="2" />
                    <rect x="10" y="-10" width="5" height="10" rx="2" />
                    <!-- Tail -->
                    <circle cx="20" cy="-18" r="6" fill="#FFF" />
                </g>
            </g>

            <!-- Legend -->
            <g transform="translate(620, 160)">
                <rect x="0" y="0" width="160" height="110" fill="#FFF" stroke="#2C3E50" rx="6" opacity="0.9" />
                <text x="12" y="22" font-family="Inter" font-size="13" font-weight="bold" fill="#2C3E50">Legend</text>
                
                <circle cx="18" cy="40" r="6" fill="#2ECC71" />
                <text x="32" y="44" font-family="Inter" font-size="12" fill="#2C3E50">Plant Tissue</text>
                
                <circle cx="18" cy="62" r="6" fill="#F39C12" />
                <text x="32" y="66" font-family="Inter" font-size="12" fill="#2C3E50">Animal Tissue</text>
                
                <line x1="12" y1="84" x2="24" y2="84" stroke="#F1C40F" stroke-width="3" stroke-dasharray="4,2" />
                <text x="32" y="88" font-family="Inter" font-size="12" fill="#2C3E50">Energy Flow</text>
                
                <line x1="12" y1="100" x2="24" y2="100" stroke="#98D8C8" stroke-width="3" stroke-dasharray="4,2" />
                <text x="32" y="104" font-family="Inter" font-size="12" fill="#2C3E50">Nutrient Cycle</text>
            </g>

            <!-- Dynamic Labels (Bottom Center) -->
            <g transform="translate(400, 475)" text-anchor="middle" font-family="Inter" font-size="18" fill="#FFF">
                <text class="lbl-org">
                    <tspan font-weight="bold">Individual: </tspan>The basic unit of ecology.
                </text>
                <text class="lbl-pop">
                    <tspan font-weight="bold">Population: </tspan>Group of individuals of <tspan font-style="italic">Quercus robur</tspan>.
                </text>
                <text class="lbl-com">
                    <tspan font-weight="bold">Community: </tspan>Interacting biotic components.
                </text>
                <text class="lbl-eco">
                    <tspan font-weight="bold">Ecosystem: </tspan>Biotic + Abiotic interactions.
                </text>
            </g>

        </svg>
    </div>

</body>
</html>
