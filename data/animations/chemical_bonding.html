<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hybridization Spectrum: s-character and Bond Properties</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
        }
        
        /* Animation Keyframes */
        @keyframes fade1 {
            0%, 28% { opacity: 1; visibility: visible; }
            33%, 95% { opacity: 0; visibility: hidden; }
            100% { opacity: 1; visibility: visible; }
        }
        @keyframes fade2 {
            0%, 28% { opacity: 0; visibility: hidden; }
            33%, 61% { opacity: 1; visibility: visible; }
            66%, 100% { opacity: 0; visibility: hidden; }
        }
        @keyframes fade3 {
            0%, 61% { opacity: 0; visibility: hidden; }
            66%, 95% { opacity: 1; visibility: visible; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        @keyframes orbitalShape {
            0%, 28% { transform: scale(1, 1); }
            33%, 61% { transform: scale(0.85, 1.15); }
            66%, 95% { transform: scale(0.7, 1.35); }
            100% { transform: scale(1, 1); }
        }
        
        @keyframes moveH {
            0%, 28% { transform: translateX(0px); }
            33%, 61% { transform: translateX(-20px); }
            66%, 95% { transform: translateX(-40px); }
            100% { transform: translateX(0px); }
        }
        
        @keyframes scaleBond {
            0%, 28% { transform: scaleX(1); }
            33%, 61% { transform: scaleX(0.8666); }
            66%, 95% { transform: scaleX(0.7333); }
            100% { transform: scaleX(1); }
        }
        
        @keyframes meterFill {
            0%, 28% { stroke-dasharray: 65 260; }
            33%, 61% { stroke-dasharray: 86.6 260; }
            66%, 95% { stroke-dasharray: 130 260; }
            100% { stroke-dasharray: 65 260; }
        }

        /* Class Assignments */
        .fade1 { animation: fade1 12s infinite ease-in-out; }
        .fade2 { animation: fade2 12s infinite ease-in-out; }
        .fade3 { animation: fade3 12s infinite ease-in-out; }
        
        .orbital {
            animation: orbitalShape 12s infinite ease-in-out;
            transform-origin: 150px 250px;
        }
        .focused-h {
            animation: moveH 12s infinite ease-in-out;
        }
        .focused-bond {
            animation: scaleBond 12s infinite ease-in-out;
            transform-origin: 150px 250px;
            vector-effect: non-scaling-stroke;
        }
        .arrow-line {
            animation: scaleBond 12s infinite ease-in-out;
            transform-origin: 150px 280px;
            vector-effect: non-scaling-stroke;
        }
        .arrow-head-right {
            animation: moveH 12s infinite ease-in-out;
        }
        .meter-fill {
            animation: meterFill 12s infinite ease-in-out;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #333; }
        .subtitle { font-size: 14px; fill: #666; }
        .label { font-size: 14px; fill: #666; font-weight: 600; }
        .value { font-size: 15px; fill: #222; font-weight: 700; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; fill: #222; }
        .subscript { font-size: 12px; }
        .meter-label { font-size: 12px; fill: #888; font-weight: 600; }
        .angle-text { font-size: 13px; fill: #555; font-weight: 600; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Carbon Hybridization & Bond Properties</title>
    <desc>An animated diagram showing the transition between sp3, sp2, and sp hybridized carbon atoms, illustrating how increased s-character leads to shorter, stronger bonds and different molecular geometries.</desc>

    <!-- Definitions for Gradients and Filters -->
    <defs>
        <linearGradient id="orbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#7209B7" />
            <stop offset="100%" stop-color="#4361EE" />
        </linearGradient>
        
        <radialGradient id="carbonGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#666666" />
            <stop offset="100%" stop-color="#333333" />
        </radialGradient>
        
        <radialGradient id="hydrogenGrad" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#CCCCCC" />
        </radialGradient>

        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.06"/>
        </filter>
        
        <filter id="atomShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
        </filter>
    </defs>

    <!-- Header -->
    <text x="400" y="45" class="title" text-anchor="middle">The Hybridization Spectrum</text>
    <text x="400" y="70" class="subtitle" text-anchor="middle">Observe how increasing s-character affects orbital shape, bond length, and geometry.</text>

    <!-- Right Panel (Data & Meter) -->
    <rect x="440" y="100" width="330" height="360" rx="16" fill="#ffffff" filter="url(#shadow)" />
    
    <!-- s-character Meter -->
    <text x="480" y="135" class="label" text-anchor="middle" fill="#333">s-character</text>
    <!-- Meter Track -->
    <line x1="480" y1="420" x2="480" y2="160" stroke="#f0f0f0" stroke-width="36" stroke-linecap="round" />
    <!-- Meter Fill (Animated) -->
    <line x1="480" y1="420" x2="480" y2="160" stroke="#FFCC00" stroke-width="36" stroke-linecap="round" class="meter-fill" />
    
    <!-- Meter Ticks & Labels -->
    <line x1="462" y1="420" x2="498" y2="420" stroke="#fff" stroke-width="2" />
    <text x="510" y="424" class="meter-label">0%</text>
    
    <line x1="462" y1="355" x2="498" y2="355" stroke="#fff" stroke-width="2" />
    <text x="510" y="359" class="meter-label">25%</text>
    
    <line x1="462" y1="333.4" x2="498" y2="333.4" stroke="#fff" stroke-width="2" />
    <text x="510" y="337.4" class="meter-label">33.3%</text>
    
    <line x1="462" y1="290" x2="498" y2="290" stroke="#fff" stroke-width="2" />
    <text x="510" y="294" class="meter-label">50%</text>

    <!-- Data Labels (Static Left Column) -->
    <text x="550" y="170" class="label">Molecule:</text>
    <text x="550" y="215" class="label">Hybridization:</text>
    <text x="550" y="260" class="label">Geometry:</text>
    <text x="550" y="305" class="label">Bond Angle:</text>
    <text x="550" y="350" class="label">C-H Length:</text>
    <text x="550" y="395" class="label">Bond Strength:</text>
    <text x="550" y="440" class="label">Electronegativity:</text>

    <!-- Data Values (Animated Right Column) -->
    <!-- Phase 1: sp3 -->
    <g class="fade1">
        <text x="740" y="170" class="formula" text-anchor="end">CH<tspan class="subscript" dy="4">4</tspan></text>
        <text x="740" y="215" class="value" text-anchor="end" fill="#7209B7">sp<tspan class="subscript" dy="-6">3</tspan></text>
        <text x="740" y="260" class="value" text-anchor="end">Tetrahedral</text>
        <text x="740" y="305" class="value" text-anchor="end">109.5°</text>
        <text x="740" y="350" class="value" text-anchor="end" fill="#F77F00">109 pm (Longest)</text>
        <text x="740" y="395" class="value" text-anchor="end">Lower</text>
        <text x="740" y="440" class="value" text-anchor="end">Lowest</text>
    </g>

    <!-- Phase 2: sp2 -->
    <g class="fade2">
        <text x="740" y="170" class="formula" text-anchor="end">C<tspan class="subscript" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan class="subscript" dy="4">4</tspan></text>
        <text x="740" y="215" class="value" text-anchor="end" fill="#5A38D3">sp<tspan class="subscript" dy="-6">2</tspan></text>
        <text x="740" y="260" class="value" text-anchor="end">Trigonal Planar</text>
        <text x="740" y="305" class="value" text-anchor="end">120°</text>
        <text x="740" y="350" class="value" text-anchor="end" fill="#F77F00">107 pm</text>
        <text x="740" y="395" class="value" text-anchor="end">Medium</text>
        <text x="740" y="440" class="value" text-anchor="end">Medium</text>
    </g>

    <!-- Phase 3: sp -->
    <g class="fade3">
        <text x="740" y="170" class="formula" text-anchor="end">C<tspan class="subscript" dy="4">2</tspan><tspan dy="-4">H</tspan><tspan class="subscript" dy="4">2</tspan></text>
        <text x="740" y="215" class="value" text-anchor="end" fill="#4361EE">sp</text>
        <text x="740" y="260" class="value" text-anchor="end">Linear</text>
        <text x="740" y="305" class="value" text-anchor="end">180°</text>
        <text x="740" y="350" class="value" text-anchor="end" fill="#F77F00">106 pm (Shortest)</text>
        <text x="740" y="395" class="value" text-anchor="end">Higher</text>
        <text x="740" y="440" class="value" text-anchor="end">Highest</text>
    </g>

    <!-- Left Panel (Molecules & Orbitals) -->
    
    <!-- Phase 1: Methane (sp3) Background Bonds -->
    <g class="fade1">
        <!-- Up-Left Bond -->
        <line x1="150" y1="250" x2="116.7" y2="155.8" stroke="#666666" stroke-width="8" stroke-linecap="round" />
        <circle cx="116.7" cy="155.8" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />
        
        <!-- Down-Left Wedge Bond -->
        <polygon points="150,250 106,340 128,348" fill="#666666" />
        <circle cx="116.7" cy="344.2" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />
        
        <!-- Down-Left Dash Bond -->
        <line x1="150" y1="250" x2="88" y2="301" stroke="#666666" stroke-width="6" stroke-dasharray="6 4" stroke-linecap="round" />
        <circle cx="88" cy="301" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />

        <!-- Angle Indicator -->
        <path d="M 190 250 A 40 40 0 0 0 136.6 212.3" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2" />
        <text x="175" y="215" class="angle-text">109.5°</text>
    </g>

    <!-- Phase 2: Ethene (sp2) Background Bonds -->
    <g class="fade2">
        <!-- Unhybridized p-orbital (Vertical) -->
        <path d="M 150 250 C 120 150, 180 150, 150 250" fill="#FF4444" opacity="0.15" />
        <path d="M 150 250 C 120 350, 180 350, 150 250" fill="#4444FF" opacity="0.15" />

        <!-- Double Bond to C2 -->
        <line x1="153.4" y1="252" x2="113.4" y2="321.2" stroke="#555555" stroke-width="8" stroke-linecap="round" />
        <line x1="146.6" y1="248" x2="106.6" y2="317.2" stroke="#555555" stroke-width="8" stroke-linecap="round" />
        
        <!-- C2 Atom -->
        <circle cx="110" cy="319.2" r="26" fill="url(#carbonGrad)" filter="url(#atomShadow)" />
        
        <!-- H atoms on C2 -->
        <line x1="110" y1="319.2" x2="140" y2="371" stroke="#666666" stroke-width="8" stroke-linecap="round" />
        <circle cx="140" cy="371" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />
        <line x1="110" y1="319.2" x2="50" y2="319.2" stroke="#666666" stroke-width="8" stroke-linecap="round" />
        <circle cx="50" cy="319.2" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />

        <!-- Top-Left C-H Bond -->
        <line x1="150" y1="250" x2="100" y2="163.4" stroke="#666666" stroke-width="8" stroke-linecap="round" />
        <circle cx="100" cy="163.4" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />

        <!-- Angle Indicator -->
        <path d="M 190 250 A 40 40 0 0 0 130 215.3" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2" />
        <text x="175" y="205" class="angle-text">120°</text>
    </g>

    <!-- Phase 3: Ethyne (sp) Background Bonds -->
    <g class="fade3">
        <!-- Unhybridized p-orbitals (Vertical & Diagonal) -->
        <path d="M 150 250 C 120 150, 180 150, 150 250" fill="#FF4444" opacity="0.15" />
        <path d="M 150 250 C 120 350, 180 350, 150 250" fill="#4444FF" opacity="0.15" />
        <path d="M 150 250 C 180 190, 220 230, 150 250" fill="#FF4444" opacity="0.15" />
        <path d="M 150 250 C 120 310, 80 270, 150 250" fill="#4444FF" opacity="0.15" />

        <!-- Triple Bond to C2 -->
        <line x1="150" y1="240" x2="70" y2="240" stroke="#555555" stroke-width="7" stroke-linecap="round" />
        <line x1="150" y1="250" x2="70" y2="250" stroke="#555555" stroke-width="7" stroke-linecap="round" />
        <line x1="150" y1="260" x2="70" y2="260" stroke="#555555" stroke-width="7" stroke-linecap="round" />
        
        <!-- C2 Atom -->
        <circle cx="70" cy="250" r="26" fill="url(#carbonGrad)" filter="url(#atomShadow)" />
        
        <!-- H atom on C2 -->
        <line x1="70" y1="250" x2="20" y2="250" stroke="#666666" stroke-width="8" stroke-linecap="round" />
        <circle cx="20" cy="250" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />

        <!-- Angle Indicator -->
        <path d="M 190 250 A 40 40 0 0 0 110 250" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="4 2" />
        <text x="135" y="200" class="angle-text">180°</text>
    </g>

    <!-- Shared Elements (Animated) -->
    
    <!-- Focused Hybrid Orbital -->
    <g class="orbital">
        <!-- Back Lobe -->
        <path d="M 150 250 C 130 235, 110 240, 110 250 C 110 260, 130 265, 150 250" fill="url(#orbGrad)" opacity="0.85" />
        <!-- Front Lobe -->
        <path d="M 150 250 C 180 170, 300 190, 300 250 C 300 310, 180 330, 150 250" fill="url(#orbGrad)" opacity="0.85" />
    </g>

    <!-- Focused C-H Bond Line -->
    <line x1="150" y1="250" x2="300" y2="250" stroke="#666666" stroke-width="8" stroke-linecap="round" class="focused-bond" />

    <!-- Central Carbon Atom -->
    <circle cx="150" cy="250" r="26" fill="url(#carbonGrad)" filter="url(#atomShadow)" />
    <text x="150" y="255" font-family="Inter" font-size="16" font-weight="bold" fill="#fff" text-anchor="middle">C</text>

    <!-- Focused Hydrogen Atom -->
    <g class="focused-h">
        <circle cx="300" cy="250" r="16" fill="url(#hydrogenGrad)" filter="url(#atomShadow)" />
        <text x="300" y="254" font-family="Inter" font-size="12" font-weight="bold" fill="#555" text-anchor="middle">H</text>
    </g>

    <!-- Bond Length Indicator (Orange Arrow) -->
    <g>
        <!-- Arrow Line -->
        <line x1="150" y1="290" x2="300" y2="290" stroke="#F77F00" stroke-width="2" class="arrow-line" />
        <!-- Left Arrowhead (Static) -->
        <polygon points="150,290 158,286 158,294" fill="#F77F00" />
        <!-- Right Arrowhead (Animated) -->
        <polygon points="300,290 292,286 292,294" fill="#F77F00" class="arrow-head-right" />
        
        <!-- Dynamic Bond Length Text -->
        <text x="225" y="310" font-family="Inter" font-size="13" font-weight="600" fill="#F77F00" text-anchor="middle" class="fade1">109 pm</text>
        <text x="215" y="310" font-family="Inter" font-size="13" font-weight="600" fill="#F77F00" text-anchor="middle" class="fade2">107 pm</text>
        <text x="205" y="310" font-family="Inter" font-size="13" font-weight="600" fill="#F77F00" text-anchor="middle" class="fade3">106 pm</text>
    </g>

    <!-- Legend -->
    <g transform="translate(40, 440)">
        <rect x="0" y="0" width="12" height="12" rx="2" fill="#404040" />
        <text x="20" y="11" font-size="12" fill="#555">Carbon</text>
        
        <rect x="80" y="0" width="12" height="12" rx="2" fill="#CCCCCC" />
        <text x="100" y="11" font-size="12" fill="#555">Hydrogen</text>
        
        <rect x="165" y="0" width="12" height="12" rx="2" fill="url(#orbGrad)" />
        <text x="185" y="11" font-size="12" fill="#555">Hybrid Orbital</text>
    </g>

</svg>

</body>
</html>
