<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formation of α(1→4) Glycosidic Linkage</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        :root {
            --c-bg: #f8f9fa;
            --c-carbon: #404040;
            --c-oxygen: #FF4444;
            --c-hydrogen: #888888;
            --c-bond: #333333;
            --c-bond-thick: #222222;
            --c-arrow: #F77F00;
            --c-purple: #7209B7;
            --c-text: #2b2b2b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        .chem-text {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }

        /* Animations */
        .pulse-glow {
            animation: pulseGlow 12s infinite linear;
        }

        .mech-arrow {
            stroke-dasharray: 200;
            animation: drawArrow 12s infinite linear;
        }

        .g1-leaving-group {
            animation: moveG1OH 12s infinite linear;
        }

        .g2-leaving-h {
            animation: moveG2H 12s infinite linear;
        }

        .g2-c4-bond {
            animation: fadeOutBond 12s infinite linear;
        }

        .g2-o {
            animation: moveG2O 12s infinite linear;
        }

        .water-molecule {
            animation: floatWater 12s infinite linear;
        }

        .new-bond {
            stroke-dasharray: 100;
            animation: drawBond 12s infinite linear;
        }

        .linkage-label {
            animation: fadeLabel 12s infinite linear;
        }

        .scene {
            transform-origin: 400px 250px;
            animation: zoomOutPolymer 12s infinite linear;
        }

        .ghosts,
        .amylose-label {
            animation: fadeGhosts 12s infinite linear;
        }

        .reactant-label {
            animation: fadeReactantLabels 12s infinite linear;
        }

        .fade-reset {
            animation: fadeReset 12s infinite linear;
        }

        /* Keyframes */
        @keyframes pulseGlow {

            0%,
            15% {
                opacity: 0;
            }

            5%,
            10% {
                opacity: 0.2;
            }

            16%,
            100% {
                opacity: 0;
            }
        }

        @keyframes drawArrow {

            0%,
            15% {
                stroke-dashoffset: 200;
                opacity: 1;
            }

            25% {
                stroke-dashoffset: 0;
                opacity: 1;
            }

            26%,
            100% {
                opacity: 0;
            }
        }

        @keyframes moveG1OH {

            0%,
            25% {
                transform: translate(0, 0);
                opacity: 1;
            }

            35% {
                transform: translate(60px, -92px);
                opacity: 1;
            }

            40%,
            100% {
                transform: translate(60px, -92px);
                opacity: 0;
            }
        }

        @keyframes moveG2H {

            0%,
            25% {
                transform: translate(0, 0);
                opacity: 1;
            }

            35% {
                transform: translate(-32px, -92px);
                opacity: 1;
            }

            40%,
            100% {
                transform: translate(-32px, -92px);
                opacity: 0;
            }
        }

        @keyframes fadeOutBond {

            0%,
            25% {
                opacity: 1;
            }

            26%,
            100% {
                opacity: 0;
            }
        }

        @keyframes moveG2O {

            0%,
            25% {
                transform: translate(0, 0);
            }

            40%,
            100% {
                transform: translate(-60px, 18px);
            }
        }

        @keyframes floatWater {

            0%,
            35% {
                opacity: 0;
                transform: translate(400px, 200px);
            }

            40% {
                opacity: 1;
                transform: translate(400px, 200px);
            }

            55% {
                opacity: 0;
                transform: translate(400px, 160px);
            }

            100% {
                opacity: 0;
                transform: translate(400px, 160px);
            }
        }

        @keyframes drawBond {

            0%,
            40% {
                stroke-dashoffset: 100;
            }

            55%,
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes fadeLabel {

            0%,
            55% {
                opacity: 0;
                transform: translateY(10px);
            }

            65%,
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes zoomOutPolymer {

            0%,
            75% {
                transform: scale(1);
            }

            85%,
            100% {
                transform: scale(0.65);
            }
        }

        @keyframes fadeGhosts {

            0%,
            75% {
                opacity: 0;
            }

            85%,
            100% {
                opacity: 1;
            }
        }

        @keyframes fadeReactantLabels {

            0%,
            75% {
                opacity: 1;
            }

            85%,
            100% {
                opacity: 0;
            }
        }

        @keyframes fadeReset {

            0%,
            2% {
                opacity: 1;
            }

            5%,
            92% {
                opacity: 0;
            }

            98%,
            100% {
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
        aria-label="Animation showing two glucose molecules joining to form a disaccharide via a glycosidic bond.">
        <title>Carbohydrates: Polysaccharide Formation</title>
        <desc>Animated chemical mechanism of dehydration synthesis forming an alpha 1-4 glycosidic linkage between two
            glucose molecules.</desc>

        <defs>
            <!-- Arrowhead Marker -->
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="var(--c-arrow)" />
            </marker>

            <!-- Base Alpha-D-Glucopyranose Ring (Reusable) -->
            <g id="base-ring">
                <!-- Back/Side Edges -->
                <path d="M 60 0 L 30 52 L -30 52 L -60 0 L -30 -52 L 15 -52" fill="none" stroke="var(--c-bond)"
                    stroke-width="2" stroke-linejoin="round" />
                <!-- Thick Front Edge -->
                <path d="M 60 0 L 30 52 L -30 52 L -60 0" fill="none" stroke="var(--c-bond-thick)" stroke-width="5"
                    stroke-linejoin="round" stroke-linecap="round" />
                <!-- Ring Oxygen (O5) -->
                <text x="30" y="-52" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" font-weight="bold">O</text>
                <path d="M 40 -46 L 60 0" fill="none" stroke="var(--c-bond)" stroke-width="2" />

                <!-- C2 Substituents -->
                <line x1="30" y1="52" x2="30" y2="82" stroke="var(--c-bond)" stroke-width="2" stroke-linecap="round" />
                <line x1="30" y1="52" x2="30" y2="22" stroke="var(--c-bond)" stroke-width="2" stroke-linecap="round" />
                <text x="30" y="94" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">OH</text>
                <text x="30" y="10" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>

                <!-- C3 Substituents -->
                <line x1="-30" y1="52" x2="-30" y2="82" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <line x1="-30" y1="52" x2="-30" y2="22" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="-30" y="10" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">OH</text>
                <text x="-30" y="94" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>

                <!-- C5 Substituents -->
                <line x1="-30" y1="-52" x2="-30" y2="-82" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <line x1="-30" y1="-52" x2="-30" y2="-22" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="-30" y="-94" fill="var(--c-carbon)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">CH<tspan baseline-shift="sub" font-size="0.7em">2</tspan>OH</text>
                <text x="-30" y="-10" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>
            </g>
        </defs>

        <!-- Static UI Elements -->
        <text x="400" y="40" font-size="22" font-weight="700" fill="var(--c-text)" text-anchor="middle">Carbohydrates:
            Polysaccharide Formation</text>
        <text x="400" y="65" font-size="14" fill="#666" text-anchor="middle">Dehydration Synthesis / Condensation
            Reaction</text>

        <!-- Legend -->
        <g transform="translate(30, 460)" font-size="12" fill="#555">
            <circle cx="0" cy="0" r="6" fill="var(--c-carbon)" /> <text x="12" y="4">Carbon</text>
            <circle cx="75" cy="0" r="6" fill="var(--c-oxygen)" /> <text x="87" y="4">Oxygen</text>
            <circle cx="150" cy="0" r="6" fill="var(--c-hydrogen)" /> <text x="162" y="4">Hydrogen</text>
        </g>

        <!-- Main Animation Scene -->
        <g class="scene">

            <!-- Ghost Molecules (Polymer Extension) -->
            <g class="ghosts">
                <!-- Ghost 1 (Left) -->
                <use href="#base-ring" x="40" y="250" opacity="0.3" />
                <!-- Ghost 1 C4 bond offscreen -->
                <line x1="-20" y1="250" x2="-50" y2="280" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <line x1="-20" y1="250" x2="-20" y2="220" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="-20" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">H</text>
                <!-- Bridging Oxygen to G1 -->
                <line x1="100" y1="250" x2="160" y2="310" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <line x1="220" y1="250" x2="160" y2="310" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="160" y="325" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">O</text>
                <!-- Ghost 1 C1 H -->
                <line x1="100" y1="250" x2="100" y2="220" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="100" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">H</text>

                <!-- Ghost 2 (Right) -->
                <use href="#base-ring" x="760" y="250" opacity="0.3" />
                <!-- Ghost 2 C1 bond offscreen -->
                <line x1="820" y1="250" x2="850" y2="280" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <line x1="820" y1="250" x2="820" y2="220" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="820" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">H</text>
                <!-- Bridging Oxygen to G2 -->
                <line x1="580" y1="250" x2="640" y2="310" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <line x1="700" y1="250" x2="640" y2="310" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="640" y="325" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">O</text>
                <!-- Ghost 2 C4 H -->
                <line x1="700" y1="250" x2="700" y2="220" stroke="var(--c-bond)" stroke-width="2" opacity="0.3" />
                <text x="700" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central" opacity="0.3">H</text>
            </g>

            <!-- Glucose 1 (Left) -->
            <g id="glucose-1">
                <use href="#base-ring" x="280" y="250" />

                <!-- Carbon Numbering -->
                <g font-size="10" fill="#aaa" font-weight="600">
                    <text x="350" y="240">1</text>
                    <text x="315" y="295">2</text>
                    <text x="245" y="295">3</text>
                    <text x="205" y="240">4</text>
                    <text x="245" y="185">5</text>
                    <text x="245" y="145">6</text>
                </g>

                <!-- C4 (Static) -->
                <line x1="220" y1="250" x2="220" y2="220" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <line x1="220" y1="250" x2="220" y2="280" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="220" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>
                <text x="220" y="292" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">HO</text>

                <!-- C1 (Animated) -->
                <line x1="340" y1="250" x2="340" y2="220" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="340" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>

                <!-- Leaving Group OH -->
                <circle cx="345" cy="292" r="22" fill="var(--c-arrow)" class="pulse-glow" />
                <g class="g1-leaving-group">
                    <line x1="340" y1="250" x2="340" y2="280" stroke="var(--c-bond)" stroke-width="2"
                        stroke-linecap="round" />
                    <text x="340" y="292" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                        dominant-baseline="central">O</text>
                    <text x="355" y="292" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                        dominant-baseline="central">H</text>
                </g>
            </g>

            <!-- Glucose 2 (Right) -->
            <g id="glucose-2">
                <use href="#base-ring" x="520" y="250" />

                <!-- C1 (Static) -->
                <line x1="580" y1="250" x2="580" y2="220" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <line x1="580" y1="250" x2="580" y2="280" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="580" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>
                <text x="580" y="292" fill="var(--c-oxygen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">OH</text>

                <!-- C4 (Animated) -->
                <line x1="460" y1="250" x2="460" y2="220" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text x="460" y="208" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                    dominant-baseline="central">H</text>

                <line class="g2-c4-bond" x1="460" y1="250" x2="460" y2="280" stroke="var(--c-bond)" stroke-width="2"
                    stroke-linecap="round" />
                <text class="g2-o chem-text" x="460" y="292" fill="var(--c-oxygen)" text-anchor="middle"
                    dominant-baseline="central">O</text>

                <!-- Leaving Group H -->
                <circle cx="440" cy="292" r="16" fill="var(--c-arrow)" class="pulse-glow" />
                <g class="g2-leaving-h">
                    <line x1="453" y1="292" x2="440" y2="292" stroke="var(--c-bond)" stroke-width="2"
                        stroke-linecap="round" />
                    <text x="432" y="292" fill="var(--c-hydrogen)" class="chem-text" text-anchor="middle"
                        dominant-baseline="central">H</text>
                </g>
            </g>

            <!-- Mechanism Arrow -->
            <path class="mech-arrow" d="M 450 280 Q 400 180 345 245" fill="none" stroke="var(--c-arrow)"
                stroke-width="3" marker-end="url(#arrowhead)" />

            <!-- New Glycosidic Bonds -->
            <path class="new-bond" d="M 340 250 L 400 310" fill="none" stroke="var(--c-bond)" stroke-width="2"
                stroke-linecap="round" />
            <path class="new-bond" d="M 460 250 L 400 310" fill="none" stroke="var(--c-bond)" stroke-width="2"
                stroke-linecap="round" />

            <!-- Water Molecule -->
            <g class="water-molecule" transform="translate(400, 200)">
                <text x="0" y="0" class="chem-text" text-anchor="middle" dominant-baseline="central" font-size="18">
                    <tspan fill="var(--c-hydrogen)">H</tspan>
                    <tspan fill="var(--c-hydrogen)" font-size="0.7em" baseline-shift="sub">2</tspan>
                    <tspan fill="var(--c-oxygen)">O</tspan>
                </text>
            </g>

            <!-- Labels -->
            <text x="280" y="380" class="reactant-label" font-size="16" fill="#555"
                text-anchor="middle">α-D-Glucose</text>
            <text x="520" y="380" class="reactant-label" font-size="16" fill="#555"
                text-anchor="middle">α-D-Glucose</text>

            <g class="linkage-label" transform="translate(400, 350)">
                <rect x="-100" y="-15" width="200" height="30" fill="var(--c-bg)" rx="15" opacity="0.9" />
                <text x="0" y="0" font-size="14" font-weight="600" fill="var(--c-purple)" text-anchor="middle"
                    dominant-baseline="central">α(1→4) Glycosidic Linkage</text>
            </g>

            <text x="400" y="420" class="amylose-label" font-size="20" font-weight="700" fill="var(--c-text)"
                text-anchor="middle">Amylose (Starch Polymer)</text>
        </g>

        <!-- Seamless Loop Reset Overlay -->
        <rect width="100%" height="100%" fill="var(--c-bg)" class="fade-reset" pointer-events="none" />

    </svg>

</body>

</html>
