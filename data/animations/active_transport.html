<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Transport: The Sodium-Potassium Pump</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #2C3E50;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            font-weight: 700;
            color: #2C3E50;
        }
        .svg-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            box-shadow: 0 15px 35px rgba(44, 62, 80, 0.1);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e1e8ed;
        }
        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* --- CSS Animations --- */
        
        /* Pump Conformational Changes */
        .pump-left {
            animation: pumpLeftAnim 12s ease-in-out infinite;
        }
        .pump-right {
            animation: pumpRightAnim 12s ease-in-out infinite;
        }

        @keyframes pumpLeftAnim {
            0%, 20% { d: path("M 310,170 L 398,170 C 395,220 380,260 350,330 L 310,330 Z"); }
            30%, 65% { d: path("M 310,170 L 350,170 C 380,240 395,280 398,330 L 310,330 Z"); }
            75%, 100% { d: path("M 310,170 L 398,170 C 395,220 380,260 350,330 L 310,330 Z"); }
        }

        @keyframes pumpRightAnim {
            0%, 20% { d: path("M 402,170 L 490,170 L 490,330 L 450,330 C 420,260 405,220 402,170 Z"); }
            30%, 65% { d: path("M 450,170 L 490,170 L 490,330 L 402,330 C 405,280 420,240 450,170 Z"); }
            75%, 100% { d: path("M 402,170 L 490,170 L 490,330 L 450,330 C 420,260 405,220 402,170 Z"); }
        }

        /* Sodium (Na+) Ions */
        .na1 { animation: na1Anim 12s ease-in-out infinite; }
        .na2 { animation: na2Anim 12s ease-in-out infinite; }
        .na3 { animation: na3Anim 12s ease-in-out infinite; }

        @keyframes na1Anim {
            0%, 5% { transform: translate(350px, 450px); opacity: 0; }
            10% { transform: translate(350px, 450px); opacity: 1; }
            20%, 30% { transform: translate(370px, 290px); opacity: 1; }
            40%, 45% { transform: translate(350px, 50px); opacity: 1; }
            50%, 100% { transform: translate(350px, 50px); opacity: 0; }
        }
        @keyframes na2Anim {
            0%, 5% { transform: translate(400px, 460px); opacity: 0; }
            10% { transform: translate(400px, 460px); opacity: 1; }
            20%, 30% { transform: translate(400px, 270px); opacity: 1; }
            40%, 45% { transform: translate(400px, 40px); opacity: 1; }
            50%, 100% { transform: translate(400px, 40px); opacity: 0; }
        }
        @keyframes na3Anim {
            0%, 5% { transform: translate(450px, 450px); opacity: 0; }
            10% { transform: translate(450px, 450px); opacity: 1; }
            20%, 30% { transform: translate(430px, 290px); opacity: 1; }
            40%, 45% { transform: translate(450px, 50px); opacity: 1; }
            50%, 100% { transform: translate(450px, 50px); opacity: 0; }
        }

        /* Potassium (K+) Ions */
        .k1 { animation: k1Anim 12s ease-in-out infinite; }
        .k2 { animation: k2Anim 12s ease-in-out infinite; }

        @keyframes k1Anim {
            0%, 35% { transform: translate(370px, 50px); opacity: 0; }
            40% { transform: translate(370px, 50px); opacity: 1; }
            50%, 70% { transform: translate(380px, 210px); opacity: 1; }
            75% { transform: translate(380px, 210px); opacity: 1; }
            85%, 90% { transform: translate(370px, 450px); opacity: 1; }
            95%, 100% { transform: translate(370px, 450px); opacity: 0; }
        }
        @keyframes k2Anim {
            0%, 35% { transform: translate(430px, 50px); opacity: 0; }
            40% { transform: translate(430px, 50px); opacity: 1; }
            50%, 70% { transform: translate(420px, 210px); opacity: 1; }
            75% { transform: translate(420px, 210px); opacity: 1; }
            85%, 90% { transform: translate(430px, 450px); opacity: 1; }
            95%, 100% { transform: translate(430px, 450px); opacity: 0; }
        }

        /* Energy Molecules (ATP, ADP, Pi) */
        .atp { animation: atpAnim 12s ease-in-out infinite; }
        .adp { animation: adpAnim 12s ease-in-out infinite; }
        .pi { animation: piAnim 12s ease-in-out infinite; }

        @keyframes atpAnim {
            0%, 5% { transform: translate(200px, 420px); opacity: 0; }
            10% { transform: translate(200px, 420px); opacity: 1; }
            15%, 19% { transform: translate(310px, 300px); opacity: 1; }
            20%, 100% { transform: translate(310px, 300px); opacity: 0; }
        }
        @keyframes adpAnim {
            0%, 19% { transform: translate(310px, 300px); opacity: 0; }
            20% { transform: translate(310px, 300px); opacity: 1; }
            30%, 35% { transform: translate(150px, 350px); opacity: 1; }
            40%, 100% { transform: translate(150px, 350px); opacity: 0; }
        }
        @keyframes piAnim {
            0%, 19% { transform: translate(310px, 300px); opacity: 0; }
            20%, 65% { transform: translate(310px, 300px); opacity: 1; }
            75%, 80% { transform: translate(200px, 380px); opacity: 1; }
            85%, 100% { transform: translate(200px, 380px); opacity: 0; }
        }

        /* Floating Text Labels */
        .text-na { animation: textNaAnim 12s ease-in-out infinite; }
        .text-k { animation: textKAnim 12s ease-in-out infinite; }

        @keyframes textNaAnim {
            0%, 30% { opacity: 0; transform: translate(400px, 200px); }
            35% { opacity: 1; transform: translate(400px, 150px); }
            45% { opacity: 1; transform: translate(400px, 50px); }
            50%, 100% { opacity: 0; transform: translate(400px, 30px); }
        }
        @keyframes textKAnim {
            0%, 70% { opacity: 0; transform: translate(400px, 300px); }
            75% { opacity: 1; transform: translate(400px, 350px); }
            85% { opacity: 1; transform: translate(400px, 450px); }
            90%, 100% { opacity: 0; transform: translate(400px, 470px); }
        }
    </style>
</head>
<body>

    <h1>Active Transport: The Sodium-Potassium Pump (Na⁺/K⁺ ATPase)</h1>
    
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Sodium-Potassium Pump Animation</title>
            <desc>An animated diagram showing the cycle of the Sodium-Potassium pump moving 3 Na+ ions out of the cell and 2 K+ ions into the cell using ATP.</desc>
            
            <defs>
                <!-- Phospholipid Bilayer Pattern -->
                <pattern id="lipid" width="40" height="160" patternUnits="userSpaceOnUse">
                    <!-- Upper layer -->
                    <circle cx="20" cy="10" r="8" fill="#4A90D9" stroke="#2C3E50" stroke-width="1.5"/>
                    <path d="M16,18 Q10,45 16,75 M24,18 Q30,45 24,75" stroke="#4A90D9" stroke-width="2" fill="none" />
                    <!-- Lower layer -->
                    <circle cx="20" cy="150" r="8" fill="#4A90D9" stroke="#2C3E50" stroke-width="1.5"/>
                    <path d="M16,142 Q10,115 16,85 M24,142 Q30,115 24,85" stroke="#4A90D9" stroke-width="2" fill="none" />
                </pattern>
            </defs>

            <!-- Background Compartments -->
            <rect x="0" y="0" width="800" height="250" fill="#f8f9fa" />
            <rect x="0" y="250" width="800" height="250" fill="#E8F4FD" />

            <!-- Cell Membrane -->
            <rect x="0" y="170" width="800" height="160" fill="url(#lipid)" />

            <!-- Membrane Polarity Indicators -->
            <g font-family="Roboto Mono" font-size="24" font-weight="bold">
                <!-- Extracellular (+) -->
                <g fill="#E74C3C">
                    <text x="60" y="150">+</text>
                    <text x="160" y="150">+</text>
                    <text x="260" y="150">+</text>
                    <text x="520" y="150">+</text>
                    <text x="620" y="150">+</text>
                    <text x="720" y="150">+</text>
                </g>
                <!-- Intracellular (-) -->
                <g fill="#3498DB">
                    <text x="60" y="360">-</text>
                    <text x="160" y="360">-</text>
                    <text x="260" y="360">-</text>
                    <text x="520" y="360">-</text>
                    <text x="620" y="360">-</text>
                    <text x="720" y="360">-</text>
                </g>
            </g>

            <!-- Compartment Labels -->
            <text x="400" y="40" font-family="Inter" font-size="18" font-weight="700" fill="#2C3E50" text-anchor="middle">Extracellular Fluid (ECF)</text>
            <text x="400" y="60" font-family="Inter" font-size="14" font-weight="600" fill="#E74C3C" text-anchor="middle">High Na⁺, Low K⁺</text>
            
            <text x="400" y="460" font-family="Inter" font-size="18" font-weight="700" fill="#2C3E50" text-anchor="middle">Intracellular Fluid (ICF / Cytoplasm)</text>
            <text x="400" y="480" font-family="Inter" font-size="14" font-weight="600" fill="#3498DB" text-anchor="middle">Low Na⁺, High K⁺</text>

            <!-- Side Label -->
            <text x="30" y="250" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50" text-anchor="middle" transform="rotate(-90 30 250)">Resting Potential Maintenance</text>

            <!-- Pump Channel Background (Depth) -->
            <rect x="350" y="170" width="100" height="160" fill="#7ab8a8" />

            <!-- Pump Protein Halves -->
            <g fill="#98D8C8" stroke="#2C3E50" stroke-width="2" stroke-linejoin="round">
                <path class="pump-left" d="M 310,170 L 398,170 C 395,220 380,260 350,330 L 310,330 Z" />
                <path class="pump-right" d="M 402,170 L 490,170 L 490,330 L 450,330 C 420,260 405,220 402,170 Z" />
            </g>

            <!-- Ions -->
            <!-- Sodium (Na+) -->
            <g class="na1">
                <circle cx="0" cy="0" r="10" fill="#F39C12" stroke="#d68910" stroke-width="1"/>
                <text x="0" y="3" font-family="Roboto Mono" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text>
            </g>
            <g class="na2">
                <circle cx="0" cy="0" r="10" fill="#F39C12" stroke="#d68910" stroke-width="1"/>
                <text x="0" y="3" font-family="Roboto Mono" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text>
            </g>
            <g class="na3">
                <circle cx="0" cy="0" r="10" fill="#F39C12" stroke="#d68910" stroke-width="1"/>
                <text x="0" y="3" font-family="Roboto Mono" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Na⁺</text>
            </g>

            <!-- Potassium (K+) -->
            <g class="k1">
                <circle cx="0" cy="0" r="12" fill="#9B59B6" stroke="#8e44ad" stroke-width="1"/>
                <text x="0" y="4" font-family="Roboto Mono" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">K⁺</text>
            </g>
            <g class="k2">
                <circle cx="0" cy="0" r="12" fill="#9B59B6" stroke="#8e44ad" stroke-width="1"/>
                <text x="0" y="4" font-family="Roboto Mono" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">K⁺</text>
            </g>

            <!-- Energy Molecules -->
            <g class="atp">
                <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#F1C40F" stroke="#f39c12" stroke-width="1"/>
                <text x="0" y="4" font-family="Inter" font-size="11" font-weight="700" fill="#2C3E50" text-anchor="middle">ATP</text>
            </g>
            <g class="adp">
                <rect x="-22" y="-12" width="44" height="24" rx="12" fill="#bdc3c7" stroke="#95a5a6" stroke-width="1"/>
                <text x="0" y="4" font-family="Inter" font-size="11" font-weight="700" fill="#2C3E50" text-anchor="middle">ADP</text>
            </g>
            <g class="pi">
                <circle cx="0" cy="0" r="12" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
                <text x="0" y="3" font-family="Inter" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">P<tspan baseline-shift="sub" font-size="8">i</tspan></text>
            </g>

            <!-- Floating Action Labels -->
            <g class="text-na">
                <rect x="-45" y="-15" width="90" height="30" rx="15" fill="#F39C12" opacity="0.9"/>
                <text x="0" y="5" font-family="Inter" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3 Na⁺ Out</text>
            </g>
            <g class="text-k">
                <rect x="-40" y="-15" width="80" height="30" rx="15" fill="#9B59B6" opacity="0.9"/>
                <text x="0" y="5" font-family="Inter" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2 K⁺ In</text>
            </g>

            <!-- Static Equation Label -->
            <g transform="translate(100, 440)">
                <text x="0" y="0" font-family="Inter" font-size="14" font-weight="700" fill="#2C3E50">Energy Source:</text>
                <text x="0" y="20" font-family="Inter" font-size="14" font-weight="600" fill="#2C3E50">ATP → ADP + P<tspan baseline-shift="sub" font-size="10">i</tspan></text>
            </g>

            <!-- Legend -->
            <g transform="translate(620, 20)">
                <rect x="0" y="0" width="160" height="120" fill="#ffffff" stroke="#bdc3c7" stroke-width="1" rx="8" opacity="0.95"/>
                <text x="80" y="20" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Legend</text>
                
                <circle cx="20" cy="40" r="6" fill="#F39C12"/>
                <text x="35" y="44" font-family="Inter" font-size="12" fill="#2C3E50">Sodium (Na⁺)</text>
                
                <circle cx="20" cy="65" r="7" fill="#9B59B6"/>
                <text x="35" y="69" font-family="Inter" font-size="12" fill="#2C3E50">Potassium (K⁺)</text>
                
                <rect x="10" y="85" width="20" height="10" rx="5" fill="#F1C40F"/>
                <text x="35" y="94" font-family="Inter" font-size="12" fill="#2C3E50">ATP Molecule</text>
                
                <rect x="10" y="103" width="20" height="10" rx="2" fill="#98D8C8" stroke="#2C3E50" stroke-width="1"/>
                <text x="35" y="112" font-family="Inter" font-size="12" fill="#2C3E50">Pump Protein</text>
            </g>

        </svg>
    </div>

</body>
</html>
