<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Anatomy of a Triple Bond: sp Hybridization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        .move-c1 { animation: animC1 12s ease-in-out infinite; }
        .move-c2 { animation: animC2 12s ease-in-out infinite; }
        .move-h1 { animation: animH1 12s ease-in-out infinite; }
        .move-h2 { animation: animH2 12s ease-in-out infinite; }
        .fade-sigma { animation: animSigma 12s ease-in-out infinite; }
        .fade-pi-clouds { animation: animPiClouds 12s ease-in-out infinite; }
        .fade-p-orbitals { animation: animPOrbitals 12s ease-in-out infinite; }
        .fade-annotations { animation: animAnnotations 12s ease-in-out infinite; }
        .pulse-glow { animation: animGlow 12s ease-in-out infinite; }

        @keyframes animC1 {
            0%, 15% { transform: translateX(-100px); }
            30%, 85% { transform: translateX(0); }
            100% { transform: translateX(-100px); }
        }

        @keyframes animC2 {
            0%, 15% { transform: translateX(100px); }
            30%, 85% { transform: translateX(0); }
            100% { transform: translateX(100px); }
        }

        @keyframes animH1 {
            0%, 15% { transform: translateX(-130px); }
            30%, 85% { transform: translateX(0); }
            100% { transform: translateX(-130px); }
        }

        @keyframes animH2 {
            0%, 15% { transform: translateX(130px); }
            30%, 85% { transform: translateX(0); }
            100% { transform: translateX(130px); }
        }

        @keyframes animSigma {
            0%, 25% { opacity: 0; stroke-dasharray: 0, 200; }
            35%, 85% { opacity: 1; stroke-dasharray: 200, 0; }
            100% { opacity: 0; stroke-dasharray: 0, 200; }
        }

        @keyframes animPiClouds {
            0%, 40% { opacity: 0; transform: scale(0.9); transform-origin: 400px 250px; }
            50%, 85% { opacity: 1; transform: scale(1); transform-origin: 400px 250px; }
            100% { opacity: 0; transform: scale(0.9); transform-origin: 400px 250px; }
        }

        @keyframes animPOrbitals {
            0%, 40% { opacity: 0.85; }
            50%, 85% { opacity: 0.15; }
            100% { opacity: 0.85; }
        }

        @keyframes animAnnotations {
            0%, 55% { opacity: 0; transform: translateY(10px); }
            65%, 85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(10px); }
        }

        @keyframes animGlow {
            0%, 45% { filter: drop-shadow(0 0 0px rgba(114, 9, 183, 0)); }
            55%, 75% { filter: drop-shadow(0 0 15px rgba(114, 9, 183, 0.4)); }
            85%, 100% { filter: drop-shadow(0 0 0px rgba(114, 9, 183, 0)); }
        }

        .text-title { font-size: 24px; font-weight: 700; fill: #212529; }
        .text-formula { font-family: 'Roboto Mono', monospace; font-size: 18px; fill: #495057; font-weight: 500; }
        .text-label { font-size: 13px; fill: #495057; font-weight: 600; }
        .text-legend { font-size: 12px; fill: #6c757d; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">The Anatomy of a Triple Bond: sp Hybridization in Ethyne</title>
        <desc id="svg-desc">Animated diagram showing the formation of a triple bond in ethyne (C2H2) through sp hybridization. Carbon atoms approach, forming a sigma bond, followed by the merging of unhybridized p-orbitals to form two perpendicular pi bonds.</desc>

        <!-- Definitions for Gradients and Markers -->
        <defs>
            <!-- Atom Gradients -->
            <radialGradient id="carbon-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#6c757d"/>
                <stop offset="100%" stop-color="#343a40"/>
            </radialGradient>
            <radialGradient id="hydrogen-grad" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#ced4da"/>
            </radialGradient>

            <!-- Orbital Gradients -->
            <linearGradient id="sp-grad-right" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0.2"/>
            </linearGradient>
            <linearGradient id="sp-grad-left" x1="100%" y1="0%" x2="0%" y2="0%">
                <stop offset="0%" stop-color="#2EC4B6" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#2EC4B6" stop-opacity="0.2"/>
            </linearGradient>
            
            <radialGradient id="py-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#7209B7" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#7209B7" stop-opacity="0.3"/>
            </radialGradient>
            <radialGradient id="pz-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#F77F00" stop-opacity="0.8"/>
                <stop offset="100%" stop-color="#F77F00" stop-opacity="0.3"/>
            </radialGradient>

            <!-- Pi Cloud Gradients -->
            <radialGradient id="py-cloud-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#7209B7" stop-opacity="0.65"/>
                <stop offset="80%" stop-color="#7209B7" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#7209B7" stop-opacity="0"/>
            </radialGradient>
            <radialGradient id="pz-cloud-grad" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#F77F00" stop-opacity="0.65"/>
                <stop offset="80%" stop-color="#F77F00" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#F77F00" stop-opacity="0"/>
            </radialGradient>

            <!-- Arrow Markers -->
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#7209B7"/>
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#2EC4B6"/>
            </marker>
            <marker id="arrow-dark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 0,0 L 10,5 L 0,10 z" fill="#343a40"/>
            </marker>

            <!-- Orbital Path Templates -->
            <g id="p-lobe-up">
                <path d="M 0,0 C 22,-20 22,-55 0,-60 C -22,-55 -22,-20 0,0 Z" />
            </g>
            <g id="p-lobe-down">
                <path d="M 0,0 C 22,20 22,55 0,60 C -22,55 -22,20 0,0 Z" />
            </g>
            <g id="sp-lobe-right">
                <path d="M 0,0 C 15,14 45,14 50,0 C 45,-14 15,-14 0,0 Z" />
            </g>
            <g id="sp-lobe-left">
                <path d="M 0,0 C -15,14 -45,14 -50,0 C -45,-14 -15,-14 0,0 Z" />
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Header / Titles -->
        <text x="400" y="45" text-anchor="middle" class="text-title">Alkynes: sp Hybridization &amp; Triple Bond Structure</text>
        <text x="400" y="75" text-anchor="middle" class="text-formula">H - C ≡ C - H (Ethyne)</text>

        <!-- MAIN MOLECULE GROUP -->
        <g id="molecule" transform="translate(0, 20)">
            
            <!-- Back Pi Cloud (pz) -->
            <g class="fade-pi-clouds pulse-glow">
                <ellipse cx="415" cy="224" rx="115" ry="22" fill="url(#pz-cloud-grad)"/>
            </g>

            <!-- Sigma Bonds (Fade in) -->
            <g class="fade-sigma">
                <!-- C-C Sigma Bond -->
                <line x1="300" y1="250" x2="500" y2="250" stroke="#343a40" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
                <!-- C-H Sigma Bonds -->
                <line x1="180" y1="250" x2="300" y2="250" stroke="#343a40" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
                <line x1="500" y1="250" x2="620" y2="250" stroke="#343a40" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
            </g>

            <!-- ATOM C1 (Left) -->
            <g class="move-c1" transform="translate(300, 250)">
                <!-- Back pz orbital -->
                <use href="#p-lobe-up" transform="rotate(30)" fill="url(#pz-grad)" class="fade-p-orbitals"/>
                
                <!-- sp hybrid orbitals -->
                <use href="#sp-lobe-left" fill="url(#sp-grad-left)"/>
                <use href="#sp-lobe-right" fill="url(#sp-grad-right)"/>
                
                <!-- Carbon Sphere -->
                <circle cx="0" cy="0" r="18" fill="url(#carbon-grad)"/>
                <text x="-4" y="4" font-family="Inter" font-size="12" fill="#fff" font-weight="bold">C</text>

                <!-- py orbitals -->
                <use href="#p-lobe-up" fill="url(#py-grad)" class="fade-p-orbitals"/>
                <use href="#p-lobe-down" fill="url(#py-grad)" class="fade-p-orbitals"/>
                
                <!-- Front pz orbital -->
                <use href="#p-lobe-down" transform="rotate(30)" fill="url(#pz-grad)" class="fade-p-orbitals"/>
            </g>

            <!-- ATOM C2 (Right) -->
            <g class="move-c2" transform="translate(500, 250)">
                <!-- Back pz orbital -->
                <use href="#p-lobe-up" transform="rotate(30)" fill="url(#pz-grad)" class="fade-p-orbitals"/>
                
                <!-- sp hybrid orbitals -->
                <use href="#sp-lobe-left" fill="url(#sp-grad-left)"/>
                <use href="#sp-lobe-right" fill="url(#sp-grad-right)"/>
                
                <!-- Carbon Sphere -->
                <circle cx="0" cy="0" r="18" fill="url(#carbon-grad)"/>
                <text x="-4" y="4" font-family="Inter" font-size="12" fill="#fff" font-weight="bold">C</text>

                <!-- py orbitals -->
                <use href="#p-lobe-up" fill="url(#py-grad)" class="fade-p-orbitals"/>
                <use href="#p-lobe-down" fill="url(#py-grad)" class="fade-p-orbitals"/>
                
                <!-- Front pz orbital -->
                <use href="#p-lobe-down" transform="rotate(30)" fill="url(#pz-grad)" class="fade-p-orbitals"/>
            </g>

            <!-- ATOM H1 (Left) -->
            <g class="move-h1" transform="translate(180, 250)">
                <circle cx="0" cy="0" r="22" fill="#ced4da" opacity="0.5"/>
                <circle cx="0" cy="0" r="12" fill="url(#hydrogen-grad)"/>
                <text x="-4" y="4" font-family="Inter" font-size="11" fill="#495057" font-weight="bold">H</text>
            </g>

            <!-- ATOM H2 (Right) -->
            <g class="move-h2" transform="translate(620, 250)">
                <circle cx="0" cy="0" r="22" fill="#ced4da" opacity="0.5"/>
                <circle cx="0" cy="0" r="12" fill="url(#hydrogen-grad)"/>
                <text x="-4" y="4" font-family="Inter" font-size="11" fill="#495057" font-weight="bold">H</text>
            </g>

            <!-- Top Pi Cloud (py) -->
            <g class="fade-pi-clouds pulse-glow">
                <ellipse cx="400" cy="200" rx="115" ry="22" fill="url(#py-cloud-grad)"/>
            </g>

            <!-- Bottom Pi Cloud (py) -->
            <g class="fade-pi-clouds pulse-glow">
                <ellipse cx="400" cy="300" rx="115" ry="22" fill="url(#py-cloud-grad)"/>
            </g>

            <!-- Front Pi Cloud (pz) -->
            <g class="fade-pi-clouds pulse-glow">
                <ellipse cx="385" cy="276" rx="115" ry="22" fill="url(#pz-cloud-grad)"/>
            </g>

        </g>

        <!-- ANNOTATIONS (Fade in later) -->
        <g class="fade-annotations">
            
            <!-- 180 Degree Angle Marker -->
            <path d="M 220,270 A 80,80 0 0,1 380,270" fill="none" stroke="#343a40" stroke-width="1.5" stroke-dasharray="4,4"/>
            <text x="300" y="175" text-anchor="middle" class="text-label">180° (Linear Geometry)</text>

            <!-- Sigma Bond Label -->
            <text x="400" y="295" text-anchor="middle" class="text-label" fill="#343a40">1 × σ bond</text>
            <path d="M 400,282 L 400,272" stroke="#343a40" stroke-width="1.5" marker-end="url(#arrow-dark)"/>

            <!-- Pi Bonds Label -->
            <text x="400" y="135" text-anchor="middle" class="text-label" fill="#7209B7">2 × π bonds</text>
            <!-- Arrow to py cloud -->
            <path d="M 400,142 L 400,175" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
            <!-- Arrow to pz cloud -->
            <path d="M 415,142 L 440,205" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

            <!-- sp Hybrid Label -->
            <text x="210" y="340" text-anchor="middle" class="text-label" fill="#208b81">sp hybrid orbitals</text>
            <path d="M 210,325 L 250,280" stroke="#2EC4B6" stroke-width="1.5" marker-end="url(#arrow-teal)"/>

            <!-- Unhybridized p Orbitals Label -->
            <text x="580" y="160" text-anchor="middle" class="text-label" fill="#7209B7">unhybridized 2p orbitals</text>
            <path d="M 540,165 L 510,195" stroke="#7209B7" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
            <path d="M 560,165 L 535,215" stroke="#F77F00" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

        </g>

        <!-- LEGEND -->
        <g transform="translate(30, 410)">
            <rect x="0" y="0" width="160" height="70" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
            
            <!-- sp -->
            <rect x="10" y="10" width="12" height="12" rx="2" fill="#2EC4B6"/>
            <text x="30" y="21" class="text-legend">sp hybrid orbital</text>
            
            <!-- py -->
            <rect x="10" y="30" width="12" height="12" rx="2" fill="#7209B7"/>
            <text x="30" y="41" class="text-legend">2p_y orbital (π)</text>
            
            <!-- pz -->
            <rect x="10" y="50" width="12" height="12" rx="2" fill="#F77F00"/>
            <text x="30" y="61" class="text-legend">2p_z orbital (π)</text>
        </g>

    </svg>
</div>

</body>
</html>
