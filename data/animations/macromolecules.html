<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Molecular Basis of Biodiversity: Macromolecules</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --membrane: #4A90D9;
            --nucleus: #2C3E50;
            --cyto: #E8F4FD;
            --dna: #FF6B6B;
            --rna: #FFA07A;
            --protein: #98D8C8;
            --plant: #2ECC71;
            --animal: #F39C12;
            --bond: #27AE60;
            --bg: #f8f9fa;
            --text: #2C3E50;
            --grid: #e9ecef;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 1000px;
            width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Global Scene Loop */
        .scene {
            animation: scene-loop 12s infinite linear;
        }

        @keyframes scene-loop {
            0%, 2% { opacity: 0; }
            5%, 95% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        /* Q1: Carbohydrates Animation */
        .glucose-2 { animation: move-g2 12s infinite ease-in-out; }
        .glucose-3 { animation: move-g3 12s infinite ease-in-out; }
        .glyco-bond { animation: fade-in-bond 12s infinite ease-in-out; }
        .water-flash { animation: flash-anim 12s infinite ease-in-out; }

        @keyframes move-g2 {
            0%, 15% { transform: translateX(30px); }
            25%, 100% { transform: translateX(0); }
        }
        @keyframes move-g3 {
            0%, 15% { transform: translateX(60px); }
            25%, 100% { transform: translateX(0); }
        }
        @keyframes fade-in-bond {
            0%, 22% { opacity: 0; stroke-dasharray: 0 20; }
            28%, 100% { opacity: 1; stroke-dasharray: 20 0; }
        }
        @keyframes flash-anim {
            0%, 22% { opacity: 0; transform: scale(0.5); }
            25% { opacity: 1; transform: scale(1.2); }
            32%, 100% { opacity: 0; transform: scale(1.5); }
        }

        /* Q2: Lipids Animation */
        .tail-1 { animation: wiggle1 3s infinite ease-in-out; transform-origin: 520px 145px; }
        .tail-2 { animation: wiggle2 3.5s infinite ease-in-out; transform-origin: 520px 175px; }
        .tail-3 { animation: wiggle3 4s infinite ease-in-out; transform-origin: 520px 205px; }

        @keyframes wiggle1 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
        @keyframes wiggle2 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-3deg); } }
        @keyframes wiggle3 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(4deg); } }

        /* Q3: Proteins Animation */
        .protein-linear { animation: fade-out-linear 12s infinite ease-in-out; }
        .protein-helix { animation: fade-in-helix 12s infinite ease-in-out; transform-origin: 200px 420px; }

        @keyframes fade-out-linear {
            0%, 10% { opacity: 0; transform: translateX(-20px); }
            15%, 35% { opacity: 1; transform: translateX(0); }
            40%, 100% { opacity: 0; }
        }
        @keyframes fade-in-helix {
            0%, 35% { opacity: 0; transform: scale(0.8) translateY(20px) rotate(-10deg); }
            45%, 100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
        }

        /* Q4: Nucleic Acids Animation */
        .dna-draw {
            stroke-dasharray: 400;
            stroke-dashoffset: 400;
            animation: dna-draw-anim 12s infinite ease-in-out;
        }
        .dna-bases { animation: bases-in 12s infinite ease-in-out; }
        .dna-glow { animation: dna-glow-anim 12s infinite ease-in-out; }
        .diversity-text { animation: div-text-anim 12s infinite ease-in-out; }

        @keyframes dna-draw-anim {
            0%, 35% { stroke-dashoffset: 400; }
            50%, 100% { stroke-dashoffset: 0; }
        }
        @keyframes bases-in {
            0%, 35% { opacity: 0; transform: translateY(-15px); }
            45%, 100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes dna-glow-anim {
            0%, 60% { filter: drop-shadow(0 0 0px rgba(255,107,107,0)); }
            70%, 95% { filter: drop-shadow(0 0 10px rgba(255,107,107,0.8)); }
            100% { filter: drop-shadow(0 0 0px rgba(255,107,107,0)); }
        }
        @keyframes div-text-anim {
            0%, 60% { opacity: 0; transform: translateY(15px) scale(0.9); }
            70%, 95% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; }
        }

        /* Text Styles */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: var(--text); }
        .subtitle { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: var(--text); }
        .tech-label { font-family: 'Roboto Mono', monospace; font-size: 11px; fill: #555; }
        .annotation { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 13px; font-style: italic; fill: #7f8c8d; }
        .legend-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #555; }
    </style>
</head>
<body>

<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" aria-label="Animated diagram showing the four major biological macromolecules: Carbohydrates, Lipids, Proteins, and Nucleic Acids.">
    <defs>
        <!-- Glucose Monomer -->
        <g id="glucose">
            <polygon points="10,0 30,0 40,15 30,30 10,30 0,15" fill="#e8f8f0" stroke="var(--plant)" stroke-width="2.5" stroke-linejoin="round"/>
            <circle cx="30" cy="0" r="3" fill="var(--plant)"/> <!-- Oxygen indicator -->
            <line x1="10" y1="30" x2="5" y2="38" stroke="var(--plant)" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="30" y1="30" x2="35" y2="38" stroke="var(--plant)" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        
        <!-- Amino Acid Bead -->
        <g id="aa-bead">
            <circle cx="0" cy="0" r="12" fill="var(--protein)" stroke="#76b8a8" stroke-width="2"/>
        </g>
    </defs>

    <!-- Background & Grid -->
    <rect width="100%" height="100%" fill="var(--bg)" rx="12"/>
    <line x1="400" y1="70" x2="400" y2="500" stroke="var(--grid)" stroke-width="2" stroke-dasharray="5 5"/>
    <line x1="40" y1="285" x2="760" y2="285" stroke="var(--grid)" stroke-width="2" stroke-dasharray="5 5"/>

    <!-- Header -->
    <text x="400" y="40" class="title" text-anchor="middle">Macromolecules: The Building Blocks of Genetic Diversity</text>

    <!-- Legend -->
    <g transform="translate(40, 525)">
        <rect x="0" y="-8" width="10" height="10" fill="var(--plant)" rx="2"/>
        <text x="15" y="0" class="legend-text">Plant/Carbs</text>
        
        <rect x="90" y="-8" width="10" height="10" fill="var(--animal)" rx="2"/>
        <text x="105" y="0" class="legend-text">Animal/Lipids</text>
        
        <rect x="190" y="-8" width="10" height="10" fill="var(--protein)" rx="2"/>
        <text x="205" y="0" class="legend-text">Proteins</text>
        
        <rect x="265" y="-8" width="10" height="10" fill="var(--dna)" rx="2"/>
        <text x="280" y="0" class="legend-text">DNA</text>
    </g>

    <!-- Main Animated Scene -->
    <g class="scene">
        
        <!-- ================= QUADRANT 1: CARBOHYDRATES ================= -->
        <g id="q1-carbs" transform="translate(0, 0)">
            <text x="200" y="95" class="subtitle" text-anchor="middle">Polysaccharides (Energy/Structure)</text>
            
            <g transform="translate(90, 150)">
                <!-- Bonds (appear during animation) -->
                <line x1="40" y1="15" x2="60" y2="15" stroke="var(--bond)" stroke-width="3" class="glyco-bond"/>
                <line x1="100" y1="15" x2="120" y2="15" stroke="var(--bond)" stroke-width="3" class="glyco-bond"/>
                
                <!-- Monomers -->
                <use href="#glucose" x="0" y="0" />
                <use href="#glucose" x="60" y="0" class="glucose-2" />
                <use href="#glucose" x="120" y="0" class="glucose-3" />

                <!-- Dehydration Synthesis Flashes -->
                <g class="water-flash" transform="translate(50, 15)">
                    <circle cx="0" cy="0" r="12" fill="var(--membrane)" opacity="0.6"/>
                    <text x="0" y="3" font-family="Inter" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H₂O</text>
                </g>
                <g class="water-flash" transform="translate(110, 15)">
                    <circle cx="0" cy="0" r="12" fill="var(--membrane)" opacity="0.6"/>
                    <text x="0" y="3" font-family="Inter" font-size="9" font-weight="700" fill="#fff" text-anchor="middle">H₂O</text>
                </g>
            </g>

            <!-- Tech Label -->
            <text x="140" y="225" class="tech-label" text-anchor="middle">Glycosidic Linkage</text>
            <path d="M 140 215 L 140 180 L 145 180" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
        </g>

        <!-- ================= QUADRANT 2: LIPIDS ================= -->
        <g id="q2-lipids" transform="translate(400, 0)">
            <text x="200" y="95" class="subtitle" text-anchor="middle">Triglycerides (Storage/Membranes)</text>
            
            <g transform="translate(100, 130)">
                <!-- Glycerol Head -->
                <rect x="0" y="0" width="22" height="90" rx="6" fill="var(--animal)"/>
                <text x="11" y="50" font-family="Inter" font-size="10" font-weight="600" fill="#fff" text-anchor="middle" transform="rotate(-90 11 50)">Glycerol</text>

                <!-- Fatty Acid Tails -->
                <!-- Tail 1 (Saturated) -->
                <path d="M 22 15 L 42 5 L 62 15 L 82 5 L 102 15 L 122 5 L 142 15 L 162 5" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="tail-1"/>
                
                <!-- Tail 2 (Saturated) -->
                <path d="M 22 45 L 42 35 L 62 45 L 82 35 L 102 45 L 122 35 L 142 45 L 162 35" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="tail-2"/>
                
                <!-- Tail 3 (Unsaturated / Kinked) -->
                <path d="M 22 75 L 42 65 L 62 75 L 82 65 L 95 85 L 115 95 L 135 85 L 155 95" fill="none" stroke="#F1C40F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" class="tail-3"/>
                
                <!-- Cis-Double Bond Highlight -->
                <line x1="80" y1="68" x2="93" y2="88" stroke="var(--dna)" stroke-width="2" class="tail-3"/>
            </g>

            <!-- Tech Label -->
            <text x="120" y="245" class="tech-label" text-anchor="middle">Ester Linkage</text>
            <path d="M 120 235 L 120 145 L 125 145" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
            <text x="260" y="245" class="tech-label" text-anchor="middle">Cis-Double Bond</text>
            <path d="M 260 235 L 260 215 L 205 205" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
        </g>

        <!-- ================= QUADRANT 3: PROTEINS ================= -->
        <g id="q3-proteins" transform="translate(0, 285)">
            <text x="200" y="40" class="subtitle" text-anchor="middle">Polypeptides (Enzymes/Structure)</text>
            
            <!-- Phase 1: Linear Sequence -->
            <g class="protein-linear" transform="translate(60, 120)">
                <line x1="0" y1="0" x2="240" y2="0" stroke="#76b8a8" stroke-width="3"/>
                <use href="#aa-bead" x="0" y="0" />
                <use href="#aa-bead" x="40" y="0" />
                <use href="#aa-bead" x="80" y="0" />
                <use href="#aa-bead" x="120" y="0" />
                <use href="#aa-bead" x="160" y="0" />
                <use href="#aa-bead" x="200" y="0" />
                <use href="#aa-bead" x="240" y="0" />
                
                <!-- Tech Label for Linear -->
                <text x="60" y="-25" class="tech-label" text-anchor="middle">Peptide Bond</text>
                <path d="M 60 -20 L 60 -5" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
            </g>

            <!-- Phase 2: Alpha Helix Folding -->
            <g class="protein-helix" transform="translate(60, 120)">
                <!-- Simulated 3D Helix using thick dashed stroke -->
                <path d="M 20 0 C 60 -70, 100 70, 140 0 C 180 -70, 220 70, 260 0" 
                      fill="none" stroke="var(--protein)" stroke-width="18" 
                      stroke-dasharray="0 22" stroke-linecap="round"/>
                
                <!-- Backbone trace -->
                <path d="M 20 0 C 60 -70, 100 70, 140 0 C 180 -70, 220 70, 260 0" 
                      fill="none" stroke="#76b8a8" stroke-width="2" opacity="0.5"/>
                      
                <text x="140" y="65" class="tech-label" text-anchor="middle">Secondary Structure (α-Helix)</text>
            </g>
        </g>

        <!-- ================= QUADRANT 4: NUCLEIC ACIDS ================= -->
        <g id="q4-nucleic" transform="translate(400, 285)">
            <text x="200" y="40" class="subtitle" text-anchor="middle">Polynucleotides (Genetic Information)</text>
            
            <g transform="translate(50, 120)" class="dna-glow">
                
                <!-- Strand 1 (Template / Bottom) -->
                <path d="M 0 0 C 40 -60, 80 60, 120 0 C 160 -60, 200 60, 240 0 C 280 -60, 320 60, 360 0" 
                      fill="none" stroke="var(--dna)" stroke-width="4" stroke-linecap="round"/>
                
                <!-- 5' and 3' Labels -->
                <text x="-15" y="5" class="tech-label" font-weight="bold">3'</text>
                <text x="370" y="5" class="tech-label" font-weight="bold">5'</text>

                <!-- Base Pairs (Bottom Half - Template) -->
                <g stroke-width="3" stroke-linecap="round">
                    <line x1="20" y1="-15" x2="20" y2="0" stroke="var(--rna)"/>
                    <line x1="40" y1="-25" x2="40" y2="-10" stroke="var(--membrane)"/>
                    <line x1="60" y1="-25" x2="60" y2="-10" stroke="var(--plant)"/>
                    <line x1="80" y1="-15" x2="80" y2="0" stroke="var(--animal)"/>
                    
                    <line x1="140" y1="15" x2="140" y2="0" stroke="var(--plant)"/>
                    <line x1="160" y1="25" x2="160" y2="10" stroke="var(--rna)"/>
                    <line x1="180" y1="25" x2="180" y2="10" stroke="var(--animal)"/>
                    <line x1="200" y1="15" x2="200" y2="0" stroke="var(--membrane)"/>
                    
                    <line x1="260" y1="-15" x2="260" y2="0" stroke="var(--animal)"/>
                    <line x1="280" y1="-25" x2="280" y2="-10" stroke="var(--plant)"/>
                    <line x1="300" y1="-25" x2="300" y2="-10" stroke="var(--rna)"/>
                    <line x1="320" y1="-15" x2="320" y2="0" stroke="var(--membrane)"/>
                </g>

                <!-- Incoming Nucleotides & Strand 2 -->
                <g class="dna-bases">
                    <!-- Base Pairs (Top Half - Incoming) -->
                    <g stroke-width="3" stroke-linecap="round">
                        <line x1="20" y1="-30" x2="20" y2="-15" stroke="var(--dna)"/>
                        <line x1="40" y1="-40" x2="40" y2="-25" stroke="var(--plant)"/>
                        <line x1="60" y1="-40" x2="60" y2="-25" stroke="var(--membrane)"/>
                        <line x1="80" y1="-30" x2="80" y2="-15" stroke="var(--rna)"/>
                        
                        <line x1="140" y1="30" x2="140" y2="15" stroke="var(--membrane)"/>
                        <line x1="160" y1="40" x2="160" y2="25" stroke="var(--dna)"/>
                        <line x1="180" y1="40" x2="180" y2="25" stroke="var(--plant)"/>
                        <line x1="200" y1="30" x2="200" y2="15" stroke="var(--animal)"/>
                        
                        <line x1="260" y1="-30" x2="260" y2="-15" stroke="var(--rna)"/>
                        <line x1="280" y1="-40" x2="280" y2="-25" stroke="var(--membrane)"/>
                        <line x1="300" y1="-40" x2="300" y2="-25" stroke="var(--dna)"/>
                        <line x1="320" y1="-30" x2="320" y2="-15" stroke="var(--plant)"/>
                    </g>
                    
                    <!-- Strand 2 (Coding / Top) -->
                    <path d="M 0 0 C 40 60, 80 -60, 120 0 C 160 60, 200 -60, 240 0 C 280 60, 320 -60, 360 0" 
                          fill="none" stroke="var(--rna)" stroke-width="4" stroke-linecap="round" class="dna-draw"/>
                          
                    <text x="-15" y="-10" class="tech-label" font-weight="bold">5'</text>
                    <text x="370" y="-10" class="tech-label" font-weight="bold">3'</text>
                </g>

                <!-- Species Diversity Highlight -->
                <g class="diversity-text" transform="translate(180, -65)">
                    <rect x="-70" y="-15" width="140" height="26" rx="13" fill="var(--nucleus)"/>
                    <text x="0" y="3" font-family="Inter" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">Species Diversity!</text>
                    <polygon points="-5,11 5,11 0,18" fill="var(--nucleus)"/>
                </g>
            </g>

            <!-- Tech Label -->
            <text x="180" y="215" class="tech-label" text-anchor="middle">Phosphodiester Bond</text>
            <path d="M 180 205 L 180 145 L 165 145" fill="none" stroke="#555" stroke-width="1" marker-end="url(#arrow)"/>
        </g>
    </g>

    <!-- Footer Annotation -->
    <text x="400" y="535" class="annotation" text-anchor="middle">Variation in these sequences drives the genetic diversity of Earth's 3,00,000+ beetle species.</text>

    <!-- Arrow Marker Def -->
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#555" />
        </marker>
    </defs>
</svg>

</body>
</html>
