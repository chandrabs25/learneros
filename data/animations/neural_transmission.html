<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Transmission: The Chemical Synapse</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        :root {
            --mem: #4A90D9;
            --cyto: #E8F4FD;
            --ves: #98D8C8;
            --nt: #FF6B6B;
            --ca: #F39C12;
            --na: #E74C3C;
            --rec: #2C3E50;
            --bg: #f8f9fa;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            background-color: var(--bg);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border-radius: 10px;
        }

        /* Animations */
        .ap-glow {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: ap-glow 10s infinite ease-in-out;
        }

        .ca-left { animation: ca-influx-l 10s infinite ease-in-out; }
        .ca-right { animation: ca-influx-r 10s infinite ease-in-out; }

        .v-anim { animation: ves-move 10s infinite ease-in-out; }
        .omega { animation: omega-show 10s infinite; }
        
        .nt-anim { animation: nt-move 10s infinite ease-in-out; }

        .rec-l-half { animation: rec-open-l 10s infinite ease-in-out; }
        .rec-r-half { animation: rec-open-r 10s infinite ease-in-out; }

        .na-anim { animation: na-influx 10s infinite ease-in-out; }

        .callout {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-anchor: middle;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.9), -2px -2px 4px rgba(255,255,255,0.9);
            opacity: 0;
        }

        .c1 { animation: callout-1 10s infinite; fill: #4A90D9; }
        .c2 { animation: callout-2 10s infinite; fill: var(--ca); }
        .c3 { animation: callout-3 10s infinite; fill: #27AE60; }
        .c4 { animation: callout-4 10s infinite; fill: var(--nt); }
        .c5 { animation: callout-5 10s infinite; fill: var(--na); }

        /* Keyframes */
        @keyframes ap-glow {
            0% { stroke-dashoffset: 1000; opacity: 1; }
            10% { stroke-dashoffset: 0; opacity: 1; }
            15% { opacity: 0; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes ca-influx-l {
            0%, 10% { transform: translateX(0); opacity: 0; }
            12% { opacity: 1; }
            25% { transform: translateX(60px); opacity: 1; }
            30%, 100% { transform: translateX(60px); opacity: 0; }
        }

        @keyframes ca-influx-r {
            0%, 10% { transform: translateX(0); opacity: 0; }
            12% { opacity: 1; }
            25% { transform: translateX(-60px); opacity: 1; }
            30%, 100% { transform: translateX(-60px); opacity: 0; }
        }

        @keyframes ves-move {
            0%, 30% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(78px); opacity: 1; }
            51%, 100% { transform: translateY(78px); opacity: 0; }
        }

        @keyframes omega-show {
            0%, 50% { opacity: 0; }
            51%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        @keyframes nt-move {
            0%, 30% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(78px); opacity: 1; }
            60% { transform: translateY(110px); opacity: 1; }
            70%, 90% { transform: translateY(125px); opacity: 1; }
            95%, 100% { transform: translateY(125px); opacity: 0; }
        }

        @keyframes rec-open-l {
            0%, 70% { transform: rotate(0deg); }
            75%, 90% { transform: rotate(-20deg); }
            95%, 100% { transform: rotate(0deg); }
        }

        @keyframes rec-open-r {
            0%, 70% { transform: rotate(0deg); }
            75%, 90% { transform: rotate(20deg); }
            95%, 100% { transform: rotate(0deg); }
        }

        @keyframes na-influx {
            0%, 75% { transform: translateY(0); opacity: 0; }
            76% { opacity: 1; }
            85% { transform: translateY(60px); opacity: 1; }
            90%, 100% { transform: translateY(60px); opacity: 0; }
        }

        @keyframes callout-1 { 0%, 2% {opacity: 1;} 15%, 100% {opacity: 0;} }
        @keyframes callout-2 { 0%, 10% {opacity: 0;} 12%, 28% {opacity: 1;} 30%, 100% {opacity: 0;} }
        @keyframes callout-3 { 0%, 30% {opacity: 0;} 32%, 58% {opacity: 1;} 60%, 100% {opacity: 0;} }
        @keyframes callout-4 { 0%, 60% {opacity: 0;} 62%, 78% {opacity: 1;} 80%, 100% {opacity: 0;} }
        @keyframes callout-5 { 0%, 80% {opacity: 0;} 82%, 95% {opacity: 1;} 98%, 100% {opacity: 0;} }
    </style>
</head>
<body>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <title>Chemical Synapse: Neural Transmission</title>
    <desc>Animated diagram showing the process of neural transmission across a chemical synapse, including action potential arrival, calcium influx, vesicle exocytosis, neurotransmitter binding, and sodium influx.</desc>

    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Background -->
    <rect width="100%" height="100%" fill="var(--bg)" />

    <!-- Title -->
    <text x="30" y="40" font-family="Inter" font-size="22" font-weight="bold" fill="#2C3E50">Chemical Synapse: Neural Transmission</text>

    <!-- Legend -->
    <g transform="translate(620, 20)">
        <rect x="0" y="0" width="160" height="130" fill="#ffffff" stroke="#e0e0e0" rx="6"/>
        <text x="10" y="20" font-family="Inter" font-size="13" font-weight="bold" fill="#2C3E50">Legend</text>
        
        <circle cx="20" cy="40" r="5" fill="var(--ca)"/>
        <text x="35" y="44" font-family="Roboto Mono" font-size="12" fill="#2C3E50">Ca²⁺ Ion</text>
        
        <circle cx="20" cy="65" r="5" fill="var(--na)"/>
        <text x="35" y="69" font-family="Roboto Mono" font-size="12" fill="#2C3E50">Na⁺ Ion</text>
        
        <circle cx="20" cy="90" r="4" fill="var(--nt)"/>
        <text x="35" y="94" font-family="Inter" font-size="12" fill="#2C3E50">Neurotransmitter</text>
        
        <circle cx="20" cy="115" r="7" fill="var(--ves)"/>
        <text x="35" y="119" font-family="Inter" font-size="12" fill="#2C3E50">Synaptic Vesicle</text>
    </g>

    <!-- Postsynaptic Neuron (Bottom) -->
    <path d="M 100 510 L 100 450 C 100 400, 250 380, 400 380 C 550 380, 700 400, 700 450 L 700 510 Z" fill="var(--cyto)" stroke="var(--mem)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="480" font-family="Inter" font-size="16" font-weight="bold" fill="#2C3E50" text-anchor="middle" opacity="0.3">Postsynaptic Neuron</text>

    <!-- Presynaptic Neuron (Top) -->
    <path d="M 320 -10 L 320 60 C 320 120, 220 160, 220 240 C 220 320, 320 340, 400 340 C 480 340, 580 320, 580 240 C 580 160, 480 120, 480 60 L 480 -10" fill="var(--cyto)" stroke="var(--mem)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="400" y="60" font-family="Inter" font-size="16" font-weight="bold" fill="#2C3E50" text-anchor="middle" opacity="0.3">Presynaptic Axon Terminal</text>

    <!-- Action Potential Glow -->
    <path class="ap-glow" d="M 320 -10 L 320 60 C 320 120, 220 160, 220 240 C 220 320, 320 340, 400 340 C 480 340, 580 320, 580 240 C 580 160, 480 120, 480 60 L 480 -10" fill="none" stroke="#85C1E9" stroke-width="14" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Calcium Ions (Outside) -->
    <g class="ca-left">
        <circle cx="170" cy="210" r="4" fill="var(--ca)"/>
        <circle cx="185" cy="195" r="4" fill="var(--ca)"/>
        <circle cx="160" cy="225" r="4" fill="var(--ca)"/>
    </g>
    <g class="ca-right">
        <circle cx="630" cy="210" r="4" fill="var(--ca)"/>
        <circle cx="615" cy="195" r="4" fill="var(--ca)"/>
        <circle cx="640" cy="225" r="4" fill="var(--ca)"/>
    </g>

    <!-- Voltage-Gated Ca2+ Channels -->
    <!-- Left -->
    <rect x="210" y="190" width="20" height="40" fill="var(--rec)" rx="4"/>
    <line x1="210" y1="210" x2="230" y2="210" stroke="var(--cyto)" stroke-width="4"/>
    <!-- Right -->
    <rect x="570" y="190" width="20" height="40" fill="var(--rec)" rx="4"/>
    <line x1="570" y1="210" x2="590" y2="210" stroke="var(--cyto)" stroke-width="4"/>

    <!-- Static Synaptic Vesicles -->
    <g transform="translate(400, 120)">
        <circle cx="0" cy="0" r="18" fill="var(--ves)"/>
        <circle cx="-4" cy="-4" r="2.5" fill="var(--nt)"/>
        <circle cx="4" cy="-2" r="2.5" fill="var(--nt)"/>
        <circle cx="-2" cy="4" r="2.5" fill="var(--nt)"/>
        <circle cx="5" cy="5" r="2.5" fill="var(--nt)"/>
    </g>
    <g transform="translate(320, 160)">
        <circle cx="0" cy="0" r="18" fill="var(--ves)"/>
        <circle cx="-3" cy="-5" r="2.5" fill="var(--nt)"/>
        <circle cx="5" cy="-3" r="2.5" fill="var(--nt)"/>
        <circle cx="-4" cy="3" r="2.5" fill="var(--nt)"/>
        <circle cx="3" cy="6" r="2.5" fill="var(--nt)"/>
    </g>
    <g transform="translate(480, 160)">
        <circle cx="0" cy="0" r="18" fill="var(--ves)"/>
        <circle cx="-5" cy="-3" r="2.5" fill="var(--nt)"/>
        <circle cx="3" cy="-5" r="2.5" fill="var(--nt)"/>
        <circle cx="-2" cy="5" r="2.5" fill="var(--nt)"/>
        <circle cx="5" cy="3" r="2.5" fill="var(--nt)"/>
    </g>

    <!-- Animated Synaptic Vesicles (Membranes) -->
    <circle class="v-anim" cx="340" cy="240" r="18" fill="var(--ves)"/>
    <circle class="v-anim" cx="460" cy="240" r="18" fill="var(--ves)"/>

    <!-- Exocytosis Omega Figures (Hidden initially) -->
    <!-- Left Omega -->
    <path class="omega" d="M 322 336 A 18 18 0 1 0 358 336" fill="var(--cyto)" stroke="var(--mem)" stroke-width="6"/>
    <line class="omega" x1="322" y1="336" x2="358" y2="336" stroke="var(--cyto)" stroke-width="8" stroke-linecap="butt"/>
    <!-- Right Omega -->
    <path class="omega" d="M 442 336 A 18 18 0 1 0 478 336" fill="var(--cyto)" stroke="var(--mem)" stroke-width="6"/>
    <line class="omega" x1="442" y1="336" x2="478" y2="336" stroke="var(--cyto)" stroke-width="8" stroke-linecap="butt"/>

    <!-- Ligand-Gated Na+ Channels (Receptors) -->
    <!-- Left Receptor (X=340) -->
    <g>
        <path class="rec-l-half" d="M 325 365 L 335 380 L 335 400 L 340 400 L 340 380 L 330 365 Z" fill="var(--rec)" style="transform-origin: 335px 400px;"/>
        <path class="rec-r-half" d="M 355 365 L 345 380 L 345 400 L 340 400 L 340 380 L 350 365 Z" fill="var(--rec)" style="transform-origin: 345px 400px;"/>
    </g>
    <!-- Right Receptor (X=460) -->
    <g>
        <path class="rec-l-half" d="M 445 365 L 455 380 L 455 400 L 460 400 L 460 380 L 450 365 Z" fill="var(--rec)" style="transform-origin: 455px 400px;"/>
        <path class="rec-r-half" d="M 475 365 L 465 380 L 465 400 L 460 400 L 460 380 L 470 365 Z" fill="var(--rec)" style="transform-origin: 465px 400px;"/>
    </g>

    <!-- Animated Neurotransmitters -->
    <g class="nt-anim">
        <!-- Left group -->
        <circle cx="336" cy="236" r="2.5" fill="var(--nt)"/>
        <circle cx="344" cy="238" r="2.5" fill="var(--nt)"/>
        <circle cx="338" cy="244" r="2.5" fill="var(--nt)"/>
        <circle cx="342" cy="242" r="2.5" fill="var(--nt)"/>
        <!-- Right group -->
        <circle cx="456" cy="236" r="2.5" fill="var(--nt)"/>
        <circle cx="464" cy="238" r="2.5" fill="var(--nt)"/>
        <circle cx="458" cy="244" r="2.5" fill="var(--nt)"/>
        <circle cx="462" cy="242" r="2.5" fill="var(--nt)"/>
    </g>

    <!-- Sodium Ions (Inside Cleft, moving in) -->
    <g class="na-anim">
        <!-- Left group -->
        <circle cx="335" cy="345" r="3.5" fill="var(--na)"/>
        <circle cx="345" cy="340" r="3.5" fill="var(--na)"/>
        <circle cx="340" cy="350" r="3.5" fill="var(--na)"/>
        <!-- Right group -->
        <circle cx="455" cy="345" r="3.5" fill="var(--na)"/>
        <circle cx="465" cy="340" r="3.5" fill="var(--na)"/>
        <circle cx="460" cy="350" r="3.5" fill="var(--na)"/>
    </g>

    <!-- Static Labels and Pointers -->
    <!-- Ca Channel Label -->
    <text x="50" y="185" font-family="Inter" font-size="12" fill="#2C3E50">Voltage-gated</text>
    <text x="50" y="200" font-family="Roboto Mono" font-size="12" fill="#2C3E50">Ca²⁺ channel</text>
    <polyline points="140,190 180,190 205,200" fill="none" stroke="#2C3E50" stroke-width="1.5"/>

    <!-- Synaptic Cleft Label -->
    <text x="50" y="355" font-family="Inter" font-size="13" font-weight="bold" fill="#2C3E50">Synaptic Cleft</text>
    <polyline points="155,350 250,350" fill="none" stroke="#2C3E50" stroke-width="1.5"/>

    <!-- Na Channel Label -->
    <text x="600" y="415" font-family="Inter" font-size="12" fill="#2C3E50">Ligand-gated</text>
    <text x="600" y="430" font-family="Roboto Mono" font-size="12" fill="#2C3E50">Na⁺ channel</text>
    <polyline points="590,420 520,420 480,390" fill="none" stroke="#2C3E50" stroke-width="1.5"/>

    <!-- Dynamic Process Callouts -->
    <text class="callout c1" x="400" y="100">1. Action Potential Arrival</text>
    <text class="callout c2" x="400" y="220">2. Ca²⁺ Influx</text>
    <text class="callout c3" x="400" y="290">3. Vesicle Docking &amp; Exocytosis</text>
    <text class="callout c4" x="400" y="365">4. Neurotransmitter Binding</text>
    <text class="callout c5" x="400" y="440">5. Na⁺ Influx (Depolarization)</text>

</svg>

</body>
</html>
