<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Mechanism of Transgenic Animal Creation</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            background-color: #f8f9fa;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        /* Typography */
        .title { font-weight: 700; font-size: 22px; fill: #2C3E50; text-anchor: middle; }
        .subtitle { font-weight: 600; font-size: 14px; fill: #A0A0A0; text-anchor: middle; letter-spacing: 1px; }
        .step-label { font-weight: 600; font-size: 18px; fill: #E74C3C; text-anchor: middle; }
        .tech-label { font-family: 'Roboto Mono', monospace; font-size: 11px; fill: #4A90D9; }
        .legend-text { font-size: 11px; fill: #2C3E50; }

        /* Animations */
        .anim-element {
            animation-duration: 15s;
            animation-iteration-count: infinite;
            animation-timing-function: ease-in-out;
        }

        /* 1. Gene Isolation */
        @keyframes gene-anim {
            0%, 8% { transform: translate(0, 0); opacity: 1; }
            12%, 20% { transform: translate(0, 150px); opacity: 1; }
            21%, 100% { opacity: 0; transform: translate(0, 150px); }
        }
        .gene-target { animation-name: gene-anim; }

        @keyframes scissors-anim {
            0%, 2% { transform: translate(0, -40px); opacity: 0; }
            4% { transform: translate(0, 0); opacity: 1; }
            6% { transform: scaleY(0.6); opacity: 1; }
            8% { transform: translate(0, -40px); opacity: 0; }
            100% { opacity: 0; }
        }
        .scissors { animation-name: scissors-anim; transform-origin: 130px 100px; opacity: 0; }

        /* 2. Ligation */
        @keyframes ligase-anim {
            0%, 14% { opacity: 0; transform: scale(0.5); }
            16% { opacity: 1; transform: scale(1.2); }
            18% { opacity: 1; transform: scale(1); }
            20%, 100% { opacity: 0; transform: scale(0.5); }
        }
        .ligase { animation-name: ligase-anim; transform-origin: 130px 300px; opacity: 0; }

        @keyframes plasmid-anim {
            0%, 20% { opacity: 1; }
            21%, 100% { opacity: 0; }
        }
        .plasmid-original { animation-name: plasmid-anim; }

        @keyframes rec-plasmid-anim {
            0%, 20% { opacity: 0; transform: translate(0, 0) scale(1); }
            21%, 32% { opacity: 1; transform: translate(0, 0) scale(1); }
            36% { opacity: 0; transform: translate(720px, -100px) scale(0.1); }
            100% { opacity: 0; }
        }
        .plasmid-recombinant { animation-name: rec-plasmid-anim; transform-origin: 130px 340px; opacity: 0; }

        /* 3. Microinjection */
        @keyframes needle-anim {
            0%, 38% { transform: translateX(0); }
            42%, 55% { transform: translateX(-290px); }
            58%, 100% { transform: translateX(0); }
        }
        .needle { animation-name: needle-anim; }

        @keyframes inject-anim {
            0%, 42% { opacity: 0; transform: translate(850px, 240px) scale(0.5); }
            43% { opacity: 1; transform: translate(850px, 240px) scale(0.5); }
            48%, 55% { opacity: 1; transform: translate(560px, 240px) scale(0.5); }
            58%, 62% { opacity: 1; transform: translate(560px, 240px) scale(1.2); }
            65%, 100% { opacity: 0; transform: translate(560px, 240px) scale(1.8); }
        }
        .injected-dna { animation-name: inject-anim; opacity: 0; }

        /* 4. Integration */
        @keyframes pronucleus-anim {
            0%, 62% { fill: #2C3E50; }
            65%, 75% { fill: #FF6B6B; }
            76%, 100% { fill: #2C3E50; }
        }
        .pronucleus-male { animation-name: pronucleus-anim; }

        @keyframes zygote-anim {
            0%, 70% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }
        .zygote-group { animation-name: zygote-anim; }

        /* 5. Expression */
        @keyframes mouse-anim {
            0%, 70% { opacity: 0; }
            75%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
        .mouse-group { animation-name: mouse-anim; opacity: 0; }

        @keyframes mouse-glow-anim {
            0%, 78% { opacity: 0; }
            82% { opacity: 0.8; }
            86% { opacity: 0.3; }
            90% { opacity: 0.9; }
            95%, 100% { opacity: 0; }
        }
        .mouse-glow { animation-name: mouse-glow-anim; opacity: 0; }

        /* Step Labels */
        @keyframes label-1 { 0%, 20% { opacity: 1; } 21%, 100% { opacity: 0; } }
        @keyframes label-2 { 0%, 19% { opacity: 0; } 20%, 38% { opacity: 1; } 39%, 100% { opacity: 0; } }
        @keyframes label-3 { 0%, 37% { opacity: 0; } 38%, 58% { opacity: 1; } 59%, 100% { opacity: 0; } }
        @keyframes label-4 { 0%, 57% { opacity: 0; } 58%, 75% { opacity: 1; } 76%, 100% { opacity: 0; } }
        @keyframes label-5 { 0%, 74% { opacity: 0; } 75%, 95% { opacity: 1; } 96%, 100% { opacity: 0; } }
        
        .lbl-1 { animation-name: label-1; }
        .lbl-2 { animation-name: label-2; opacity: 0; }
        .lbl-3 { animation-name: label-3; opacity: 0; }
        .lbl-4 { animation-name: label-4; opacity: 0; }
        .lbl-5 { animation-name: label-5; opacity: 0; }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet" aria-label="Diagram showing the process of creating a transgenic animal through DNA manipulation and microinjection">
    <title>DNA Manipulation: Production of Transgenic Animals</title>
    
    <!-- Background -->
    <rect width="100%" height="100%" fill="#f8f9fa" />

    <!-- UI / Layout Elements -->
    <text x="400" y="35" class="title">DNA Manipulation: Production of Transgenic Animals</text>
    
    <!-- Dynamic Step Labels -->
    <text x="400" y="70" class="step-label anim-element lbl-1">1. Isolation of Gene of Interest</text>
    <text x="400" y="70" class="step-label anim-element lbl-2">2. Formation of Recombinant DNA</text>
    <text x="400" y="70" class="step-label anim-element lbl-3">3. Pronuclear Microinjection</text>
    <text x="400" y="70" class="step-label anim-element lbl-4">4. Genomic Integration</text>
    <text x="400" y="70" class="step-label anim-element lbl-5">5. Transgenic Expression</text>

    <!-- Section Dividers -->
    <line x1="320" y1="90" x2="320" y2="480" stroke="#D0D0D0" stroke-width="2" stroke-dasharray="6,6" />
    <text x="160" y="105" class="subtitle">IN VITRO (Gene Manipulation)</text>
    <text x="560" y="105" class="subtitle">IN VIVO (Host Organism)</text>

    <!-- ==================== IN VITRO SECTION (LEFT) ==================== -->
    
    <!-- Donor DNA (Grey Background Strands) -->
    <g id="donor-dna-bg">
        <!-- Left Flank -->
        <path d="M 40 150 C 55 120, 85 120, 100 150" fill="none" stroke="#A0A0A0" stroke-width="3"/>
        <path d="M 40 150 C 55 180, 85 180, 100 150" fill="none" stroke="#A0A0A0" stroke-width="3"/>
        <line x1="55" y1="140" x2="55" y2="160" stroke="#A0A0A0" stroke-width="2"/>
        <line x1="70" y1="135" x2="70" y2="165" stroke="#A0A0A0" stroke-width="2"/>
        <line x1="85" y1="140" x2="85" y2="160" stroke="#A0A0A0" stroke-width="2"/>
        
        <!-- Right Flank -->
        <path d="M 160 150 C 175 120, 205 120, 220 150" fill="none" stroke="#A0A0A0" stroke-width="3"/>
        <path d="M 160 150 C 175 180, 205 180, 220 150" fill="none" stroke="#A0A0A0" stroke-width="3"/>
        <line x1="175" y1="140" x2="175" y2="160" stroke="#A0A0A0" stroke-width="2"/>
        <line x1="190" y1="135" x2="190" y2="165" stroke="#A0A0A0" stroke-width="2"/>
        <line x1="205" y1="140" x2="205" y2="160" stroke="#A0A0A0" stroke-width="2"/>
    </g>

    <!-- Gene of Interest (Red, Animated) -->
    <g class="anim-element gene-target">
        <path d="M 100 150 C 115 180, 145 180, 160 150" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <path d="M 100 150 C 115 120, 145 120, 160 150" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <line x1="115" y1="140" x2="115" y2="160" stroke="#FF6B6B" stroke-width="2.5"/>
        <line x1="130" y1="135" x2="130" y2="165" stroke="#FF6B6B" stroke-width="2.5"/>
        <line x1="145" y1="140" x2="145" y2="160" stroke="#FF6B6B" stroke-width="2.5"/>
        <text x="130" y="195" class="tech-label" text-anchor="middle">Foreign DNA</text>
    </g>

    <!-- Restriction Enzyme (Scissors) -->
    <g class="anim-element scissors">
        <line x1="115" y1="85" x2="145" y2="115" stroke="#98D8C8" stroke-width="4" stroke-linecap="round"/>
        <line x1="115" y1="115" x2="145" y2="85" stroke="#98D8C8" stroke-width="4" stroke-linecap="round"/>
        <circle cx="110" cy="80" r="6" fill="none" stroke="#98D8C8" stroke-width="3"/>
        <circle cx="110" cy="120" r="6" fill="none" stroke="#98D8C8" stroke-width="3"/>
        <circle cx="130" cy="100" r="2" fill="#2C3E50"/>
        <text x="130" y="65" class="tech-label" text-anchor="middle">Restriction Endonuclease</text>
    </g>

    <!-- Original Plasmid Vector (With Gap) -->
    <g class="anim-element plasmid-original">
        <path d="M 100 300 A 50 50 0 1 0 160 300" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <text x="130" y="410" class="tech-label" text-anchor="middle">Plasmid Vector</text>
    </g>

    <!-- DNA Ligase -->
    <g class="anim-element ligase">
        <path d="M 130 285 C 145 285, 150 300, 150 310 C 150 325, 110 325, 110 310 C 110 300, 115 285, 130 285 Z" fill="#98D8C8"/>
        <text x="130" y="308" font-family="Roboto Mono" font-size="10" fill="#2C3E50" text-anchor="middle" font-weight="bold">LIG</text>
        <text x="210" y="305" class="tech-label" text-anchor="middle">DNA Ligase</text>
    </g>

    <!-- Recombinant Plasmid (Complete Circle) -->
    <g class="anim-element plasmid-recombinant">
        <path d="M 100 300 A 50 50 0 1 0 160 300" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <path d="M 100 300 C 115 330, 145 330, 160 300" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <path d="M 100 300 C 115 270, 145 270, 160 300" fill="none" stroke="#FF6B6B" stroke-width="4"/>
        <line x1="115" y1="290" x2="115" y2="310" stroke="#FF6B6B" stroke-width="2.5"/>
        <line x1="130" y1="285" x2="130" y2="315" stroke="#FF6B6B" stroke-width="2.5"/>
        <line x1="145" y1="290" x2="145" y2="310" stroke="#FF6B6B" stroke-width="2.5"/>
    </g>


    <!-- ==================== IN VIVO SECTION (RIGHT) ==================== -->

    <!-- Host Zygote -->
    <g class="anim-element zygote-group">
        <!-- Holding Pipette -->
        <path d="M 180 200 L 430 200 L 450 220 L 450 280 L 430 300 L 180 300" fill="#ffffff" stroke="#A0A0A0" stroke-width="3" opacity="0.6"/>
        <text x="380" y="190" class="tech-label" text-anchor="middle">Holding Pipette</text>

        <!-- Zona Pellucida & Membrane -->
        <circle cx="550" cy="250" r="105" fill="none" stroke="#A0C4FF" stroke-width="8" opacity="0.4"/>
        <circle cx="550" cy="250" r="95" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3"/>
        
        <!-- Polar Body -->
        <circle cx="450" cy="190" r="12" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        
        <!-- Female Pronucleus -->
        <circle cx="510" cy="270" r="22" fill="#2C3E50" opacity="0.7"/>
        
        <!-- Male Pronucleus (Target) -->
        <circle cx="560" cy="240" r="28" class="anim-element pronucleus-male"/>
        <text x="560" y="185" class="tech-label" text-anchor="middle">Host Pronucleus</text>
    </g>

    <!-- Microinjection Needle -->
    <g class="anim-element needle">
        <polygon points="1140,237 1140,243 850,240" fill="#A0A0A0" opacity="0.8"/>
        <text x="960" y="225" class="tech-label" text-anchor="middle">Microinjection Needle</text>
    </g>

    <!-- Injected DNA (Tiny Recombinant Plasmid traveling down needle) -->
    <g class="anim-element injected-dna">
        <circle cx="0" cy="0" r="12" fill="none" stroke="#FF6B6B" stroke-width="3"/>
        <path d="M -12 0 C -5 10, 5 10, 12 0" fill="none" stroke="#FF6B6B" stroke-width="3"/>
        <path d="M -12 0 C -5 -10, 5 -10, 12 0" fill="none" stroke="#FF6B6B" stroke-width="3"/>
    </g>

    <!-- Transgenic Mouse -->
    <g class="anim-element mouse-group">
        <!-- Base Mouse Body -->
        <path d="M 550 310 
                 C 470 310, 450 250, 480 210 
                 C 500 180, 550 180, 580 210 
                 C 600 220, 620 220, 625 230 
                 C 620 240, 600 240, 580 250 
                 C 570 270, 560 310, 550 310 Z" 
              fill="#F39C12" stroke="#D68910" stroke-width="2"/>
        
        <!-- Tail -->
        <path d="M 470 280 Q 400 290 410 210" fill="none" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Ear -->
        <ellipse cx="560" cy="195" rx="14" ry="20" fill="#E67E22" transform="rotate(25 560 195)"/>
        
        <!-- Eye -->
        <circle cx="595" cy="215" r="3.5" fill="#2C3E50"/>
        
        <!-- Legs -->
        <path d="M 510 300 L 510 320 M 560 300 L 560 320" stroke="#F39C12" stroke-width="6" stroke-linecap="round"/>

        <!-- Glowing Transgenic Core -->
        <path class="anim-element mouse-glow"
              d="M 550 310 
                 C 470 310, 450 250, 480 210 
                 C 500 180, 550 180, 580 210 
                 C 600 220, 620 220, 625 230 
                 C 620 240, 600 240, 580 250 
                 C 570 270, 560 310, 550 310 Z" 
              fill="#FF6B6B" stroke="#FF6B6B" stroke-width="8"/>
    </g>


    <!-- ==================== LEGEND ==================== -->
    <g transform="translate(20, 410)">
        <rect width="170" height="75" rx="6" fill="#ffffff" stroke="#D0D0D0" stroke-width="1"/>
        <text x="85" y="18" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">Legend</text>
        
        <line x1="15" y1="35" x2="35" y2="35" stroke="#FF6B6B" stroke-width="4"/>
        <text x="45" y="39" class="legend-text">Foreign DNA / Gene</text>
        
        <circle cx="25" cy="55" r="6" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2"/>
        <text x="45" y="59" class="legend-text">Host Cell / Zygote</text>
    </g>

</svg>

</body>
</html>
