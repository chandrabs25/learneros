<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudocoelomate Body Plan</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #f8f9fa;
        }
        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }
        .mono {
            font-family: 'Roboto Mono', monospace;
        }
        
        /* Phase 1: Hydrostatic Skeleton (0s - 4s) */
        @keyframes hydro-pulse {
            0% { transform: scale(1); }
            10% { transform: scale(1.03); }
            20% { transform: scale(1); }
            30% { transform: scale(1.03); }
            40% { transform: scale(1); }
            100% { transform: scale(1); }
        }
        .hydro-group {
            animation: hydro-pulse 10s infinite ease-in-out;
            transform-origin: 220px 270px;
        }

        @keyframes ripple-1 {
            0% { transform: scale(0.3); opacity: 0.8; }
            20% { transform: scale(1); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
        @keyframes ripple-2 {
            0%, 20% { transform: scale(0.3); opacity: 0; }
            21% { transform: scale(0.3); opacity: 0.8; }
            40% { transform: scale(1); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }
        .wave1 { animation: ripple-1 10s infinite ease-out; transform-origin: 220px 270px; }
        .wave2 { animation: ripple-2 10s infinite ease-out; transform-origin: 220px 270px; }

        /* Phase 2: Complete Digestive Flow (4s - 8s) */
        @keyframes bolus-move {
            0%, 35% { transform: translate(430px, 270px); opacity: 0; }
            40% { transform: translate(430px, 270px); opacity: 1; }
            45% { transform: translate(480px, 270px); }
            50% { transform: translate(510px, 270px); }
            65% { transform: translate(650px, 270px); }
            75% { transform: translate(750px, 270px); }
            80% { transform: translate(780px, 270px); opacity: 1; }
            82%, 100% { transform: translate(780px, 270px); opacity: 0; }
        }
        .bolus {
            animation: bolus-move 10s infinite linear;
        }

        @keyframes pharynx-pump {
            0%, 43% { transform: scaleY(1); }
            46% { transform: scaleY(1.15); }
            50% { transform: scaleY(1); }
            100% { transform: scaleY(1); }
        }
        .pharynx {
            animation: pharynx-pump 10s infinite ease-in-out;
            transform-origin: 485px 270px;
        }

        /* Phase 3: Mesodermal Highlighting (8s - 10s) */
        @keyframes meso-flash {
            0%, 75% { fill: #F39C12; }
            80% { fill: #FFD54F; }
            85% { fill: #F39C12; }
            90% { fill: #FFD54F; }
            95% { fill: #F39C12; }
            100% { fill: #F39C12; }
        }
        .mesoderm-anim {
            animation: meso-flash 10s infinite ease-in-out;
        }
        
        .label-line {
            fill: none;
            stroke: #2C3E50;
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .label-dot {
            fill: #2C3E50;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Animated Diagram of a Pseudocoelomate Body Plan</title>
        <desc>An educational animation showing the transverse cross-section and longitudinal view of a roundworm (Phylum Aschelminthes), highlighting the scattered mesoderm pouches, pseudocoelom, and complete digestive tract.</desc>
        
        <defs>
            <!-- Reusable Mesoderm Pouch for Cross-Section -->
            <g id="meso-pouch">
                <circle cx="0" cy="-105" r="14" />
                <circle cx="-15" cy="-108" r="10" />
                <circle cx="15" cy="-108" r="10" />
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" text-anchor="middle" font-size="22" font-weight="700">Body Plan: Pseudocoelomate (Phylum <tspan font-style="italic">Aschelminthes</tspan>)</text>
        
        <!-- Subtitles -->
        <text x="220" y="80" text-anchor="middle" font-size="15" font-weight="600">Transverse Cross-Section</text>
        <text x="600" y="80" text-anchor="middle" font-size="15" font-weight="600">Simplified Longitudinal View</text>

        <!-- ========================================== -->
        <!-- LEFT SIDE: TRANSVERSE CROSS-SECTION        -->
        <!-- ========================================== -->
        <g id="cross-section">
            <g class="hydro-group">
                <!-- Pseudocoelom (Fluid Cavity) -->
                <circle cx="220" cy="270" r="115" fill="#E8F4FD" />
                
                <!-- Hydrostatic Pressure Waves -->
                <circle cx="220" cy="270" r="115" fill="none" stroke="#4A90D9" stroke-width="2" class="wave1" />
                <circle cx="220" cy="270" r="115" fill="none" stroke="#4A90D9" stroke-width="2" class="wave2" />
                
                <!-- Ectoderm (Outer Layer) -->
                <circle cx="220" cy="270" r="120" fill="none" stroke="#4A90D9" stroke-width="10" />
                
                <!-- Mesoderm (Scattered Pouches) -->
                <use href="#meso-pouch" x="220" y="270" transform="rotate(0 220 270)" class="mesoderm-anim" />
                <use href="#meso-pouch" x="220" y="270" transform="rotate(60 220 270)" class="mesoderm-anim" />
                <use href="#meso-pouch" x="220" y="270" transform="rotate(120 220 270)" class="mesoderm-anim" />
                <use href="#meso-pouch" x="220" y="270" transform="rotate(180 220 270)" class="mesoderm-anim" />
                <use href="#meso-pouch" x="220" y="270" transform="rotate(240 220 270)" class="mesoderm-anim" />
                <use href="#meso-pouch" x="220" y="270" transform="rotate(300 220 270)" class="mesoderm-anim" />
                
                <!-- Endoderm (Inner Lining) -->
                <circle cx="220" cy="270" r="35" fill="#FFFFFF" stroke="#E74C3C" stroke-width="10" />
            </g>

            <!-- Cross-Section Labels -->
            <!-- Ectoderm -->
            <polyline points="100,270 60,270 60,255" class="label-line" />
            <circle cx="100" cy="270" r="3" class="label-dot" />
            <text x="60" y="245" text-anchor="middle" font-size="13" font-weight="600">Ectoderm</text>
            
            <!-- Mesoderm -->
            <polyline points="145,205 100,160 100,145" class="label-line" />
            <circle cx="145" cy="205" r="3" class="label-dot" />
            <text x="100" y="135" text-anchor="middle" font-size="13" font-weight="600">Mesoderm</text>
            <text x="100" y="150" text-anchor="middle" font-size="11">(Scattered Pouches)</text>
            
            <!-- Pseudocoelom -->
            <polyline points="160,320 120,360 120,375" class="label-line" />
            <circle cx="160" cy="320" r="3" class="label-dot" />
            <text x="120" y="395" text-anchor="middle" font-size="13" font-weight="600">Pseudocoelom</text>
            <text x="120" y="410" text-anchor="middle" font-size="11">(Fluid Cavity)</text>
            
            <!-- Endoderm -->
            <polyline points="220,305 220,365" class="label-line" />
            <circle cx="220" cy="305" r="3" class="label-dot" />
            <text x="220" y="385" text-anchor="middle" font-size="13" font-weight="600">Endoderm</text>
            <text x="220" y="400" text-anchor="middle" font-size="11">(Gut Wall)</text>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: LONGITUDINAL VIEW              -->
        <!-- ========================================== -->
        <g id="longitudinal-view">
            <!-- Pseudocoelom Fill -->
            <path d="M 450 220 Q 600 200 750 220 L 750 320 Q 600 340 450 320 Z" fill="#E8F4FD" />
            
            <!-- Ectoderm Strokes -->
            <path d="M 450 220 Q 600 200 750 220" fill="none" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" />
            <path d="M 450 320 Q 600 340 750 320" fill="none" stroke="#4A90D9" stroke-width="10" stroke-linecap="round" />
            
            <!-- Endoderm (Gut Tube) -->
            <path d="M 450 260 L 750 260 L 750 280 L 450 280 Z" fill="#FFFFFF" stroke="#E74C3C" stroke-width="4" />
            
            <!-- Muscular Pharynx -->
            <path d="M 450 260 C 470 260, 480 240, 500 240 C 510 240, 515 260, 520 260 L 520 280 C 515 280, 510 300, 500 300 C 480 300, 470 280, 450 280 Z" fill="#98D8C8" stroke="#E74C3C" stroke-width="4" class="pharynx" />
            
            <!-- Mesoderm Pouches (Scattered along inner ectoderm) -->
            <!-- Top Edge -->
            <path d="M 490 216 C 495 230, 505 230, 510 214 Z" class="mesoderm-anim" />
            <path d="M 550 206 C 555 220, 565 220, 570 203 Z" class="mesoderm-anim" />
            <path d="M 620 201 C 625 215, 635 215, 640 203 Z" class="mesoderm-anim" />
            <path d="M 690 213 C 695 227, 705 227, 710 216 Z" class="mesoderm-anim" />
            <!-- Bottom Edge -->
            <path d="M 520 331 C 525 315, 535 315, 540 334 Z" class="mesoderm-anim" />
            <path d="M 590 339 C 595 323, 605 323, 610 339 Z" class="mesoderm-anim" />
            <path d="M 660 334 C 665 318, 675 318, 680 331 Z" class="mesoderm-anim" />
            <path d="M 720 324 C 725 308, 735 308, 740 321 Z" class="mesoderm-anim" />

            <!-- Food Bolus (Animated) -->
            <circle r="6" fill="#98D8C8" class="bolus" />

            <!-- Longitudinal Labels -->
            <!-- Muscular Pharynx -->
            <polyline points="485,240 485,160 500,160" class="label-line" />
            <circle cx="485" cy="240" r="3" class="label-dot" />
            <text x="505" y="164" text-anchor="start" font-size="13" font-weight="600">Muscular Pharynx</text>
            
            <!-- Complete Alimentary Canal -->
            <polyline points="600,260 600,160 620,160" class="label-line" />
            <circle cx="600" cy="260" r="3" class="label-dot" />
            <text x="625" y="164" text-anchor="start" font-size="13" font-weight="600">Complete Alimentary Canal</text>
            
            <!-- Mouth -->
            <polyline points="450,270 420,270" class="label-line" />
            <circle cx="450" cy="270" r="3" class="label-dot" />
            <text x="415" y="274" text-anchor="end" font-size="13" font-weight="600">Mouth</text>
            
            <!-- Anus -->
            <polyline points="750,270 780,270" class="label-line" />
            <circle cx="750" cy="270" r="3" class="label-dot" />
            <text x="785" y="274" text-anchor="start" font-size="13" font-weight="600">Anus</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND & NOTES                             -->
        <!-- ========================================== -->
        <g id="legend">
            <rect x="510" y="390" width="270" height="80" rx="6" fill="#FFFFFF" stroke="#BDC3C7" stroke-width="1" />
            <text x="520" y="410" font-size="12" font-weight="700">Key / Structures</text>
            
            <!-- Column 1 -->
            <rect x="520" y="425" width="12" height="12" fill="#4A90D9" rx="2" />
            <text x="538" y="435" font-size="11">Ectoderm</text>
            
            <rect x="520" y="445" width="12" height="12" fill="#F39C12" rx="2" />
            <text x="538" y="455" font-size="11">Mesoderm</text>
            
            <!-- Column 2 -->
            <rect x="610" y="425" width="12" height="12" fill="#E74C3C" rx="2" />
            <text x="628" y="435" font-size="11">Endoderm</text>
            
            <rect x="610" y="445" width="12" height="12" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1" rx="2" />
            <text x="628" y="455" font-size="11">Pseudocoelom</text>

            <!-- Column 3 -->
            <rect x="710" y="425" width="12" height="12" fill="#98D8C8" rx="2" />
            <text x="728" y="435" font-size="11">Pharynx</text>
        </g>

        <!-- Scientific Note -->
        <text x="20" y="480" class="mono" font-size="11" fill="#2C3E50">Note: Mesoderm is present as scattered pouches; no mesodermal lining on the gut.</text>

    </svg>
</body>
</html>
