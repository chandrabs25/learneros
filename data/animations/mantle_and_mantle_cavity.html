<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molluscan Body Plan: Mantle & Mantle Cavity</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@1&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        text {
            font-family: 'Inter', sans-serif;
            fill: #2C3E50;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            text-anchor: middle;
        }

        .label {
            font-size: 14px;
            font-weight: 600;
        }

        .sci-term {
            font-style: italic;
            font-family: 'Roboto Mono', monospace;
            font-size: 13px;
            fill: #E74C3C;
        }

        .line {
            stroke: #2C3E50;
            stroke-width: 1.5;
            stroke-dasharray: 4 2;
        }

        /* Animations */
        .gill {
            transform-origin: 540px 240px;
            animation: gillFlutter 2.5s ease-in-out infinite;
        }

        @keyframes gillFlutter {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(3.5deg); }
        }

        .mantle {
            animation: mantlePulse 4s ease-in-out infinite;
        }

        @keyframes mantlePulse {
            0%, 100% { stroke-width: 2px; filter: brightness(1); }
            50% { stroke-width: 4px; filter: brightness(1.08); }
        }

        .particle {
            animation: particleColor 6s linear infinite;
        }

        @keyframes particleColor {
            0%, 35% { 
                fill: #3498DB; 
                filter: drop-shadow(0 0 0px transparent); 
            } /* Inflow: Venous/Water blue */
            45%, 60% { 
                fill: #FF6B6B; 
                filter: drop-shadow(0 0 6px #FF6B6B); 
            } /* Gas Exchange: Oxygen-rich red glow */
            70%, 100% { 
                fill: #5D6D7E; 
                filter: drop-shadow(0 0 0px transparent); 
            } /* Outflow: Waste/Exhalant grey-blue */
        }

        .glow {
            animation: gillGlow 2.5s ease-in-out infinite;
        }

        @keyframes gillGlow {
            0%, 100% { filter: drop-shadow(0 0 2px rgba(255,107,107,0.3)); }
            50% { filter: drop-shadow(0 0 8px rgba(255,107,107,0.8)) brightness(1.15); }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Molluscan Body Plan: Mantle & Mantle Cavity</title>
        <desc>An animated lateral cross-section of a generalized mollusc showing the flow of water through the mantle cavity and over the feather-like gills (ctenidia) for respiration.</desc>

        <defs>
            <!-- Gradients -->
            <linearGradient id="mantleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#F5B041"/>
                <stop offset="100%" stop-color="#F39C12"/>
            </linearGradient>
            
            <radialGradient id="humpGrad" cx="40%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#E67E22"/>
                <stop offset="100%" stop-color="#D35400"/>
            </radialGradient>

            <linearGradient id="footGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#F8C471"/>
                <stop offset="100%" stop-color="#E67E22"/>
            </linearGradient>

            <!-- Arrow Markers -->
            <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#3498DB" />
            </marker>
            <marker id="arrowhead-grey" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#5D6D7E" />
            </marker>

            <!-- Water Flow Path -->
            <path id="water-path" d="M 680 335 L 560 335 Q 500 335 500 300 Q 500 265 560 265 L 680 265" fill="none" stroke="none"/>
        </defs>

        <!-- Title -->
        <text x="400" y="40" class="title">Molluscan Body Plan: Mantle &amp; Mantle Cavity</text>

        <!-- Base Anatomy Group -->
        <g id="mollusc-anatomy">
            
            <!-- Muscular Foot -->
            <path d="M 150 350 C 160 350, 165 355, 165 360 C 165 365, 160 370, 150 370 L 150 380 C 150 390, 160 390, 180 390 L 580 390 C 610 390, 610 350, 580 350 Z" 
                  fill="url(#footGrad)" stroke="#BA4A00" stroke-width="2"/>
            
            <!-- Radula (Mouth detail) -->
            <path d="M 165 360 L 185 360" stroke="#C0392B" stroke-width="2" stroke-dasharray="2 1"/>

            <!-- Visceral Hump -->
            <path d="M 220 350 C 220 180, 400 180, 450 220 C 480 240, 500 280, 500 350 Z" 
                  fill="url(#humpGrad)" stroke="#BA4A00" stroke-width="2"/>

            <!-- Internal Organs (Stylized) -->
            <g id="internal-organs" opacity="0.85">
                <!-- Digestive Tract -->
                <path d="M 170 360 C 220 360, 250 250, 320 250 C 380 250, 420 300, 480 300 C 495 300, 505 280, 505 260" 
                      fill="none" stroke="#A04000" stroke-width="10" stroke-linecap="round" />
                <!-- Stomach pouch -->
                <ellipse cx="320" cy="250" rx="22" ry="16" fill="#A04000" />
                <!-- Digestive Gland -->
                <path d="M 280 240 C 260 200, 320 180, 350 210 C 380 180, 420 220, 380 260 Z" 
                      fill="#D35400" stroke="#873600" stroke-width="1.5" />
                <!-- Heart (Dorsal) -->
                <ellipse cx="450" cy="215" rx="14" ry="9" fill="#E74C3C" />
                <path d="M 450 215 L 490 240" stroke="#E74C3C" stroke-width="2.5" />
            </g>

            <!-- Mantle Cavity Background (Negative Space) -->
            <!-- The cavity is naturally formed by the gap between the Visceral Hump, Mantle, and Foot -->

            <!-- Feather-like Gills (Ctenidia) -->
            <g class="gill glow" stroke="#FF6B6B" stroke-linecap="round">
                <!-- Central Axis -->
                <path d="M 540 240 Q 550 280 540 320" stroke-width="3.5" fill="none"/>
                <!-- Filaments Left -->
                <path d="M 541 245 L 520 250 M 542 255 L 520 260 M 544 265 L 520 270 M 545 275 L 520 280 M 546 285 L 520 290 M 547 295 L 520 300 M 546 305 L 520 310 M 543 315 L 520 320" stroke-width="2"/>
                <!-- Filaments Right -->
                <path d="M 541 245 L 560 250 M 542 255 L 560 260 M 544 265 L 560 270 M 545 275 L 560 280 M 546 285 L 560 290 M 547 295 L 560 300 M 546 305 L 560 310 M 543 315 L 560 320" stroke-width="2"/>
            </g>

            <!-- Mantle (Soft, spongy layer) -->
            <path class="mantle" d="M 200 350 
                     C 180 250, 180 120, 200 120 
                     C 480 120, 560 220, 620 280 
                     C 640 290, 660 270, 640 260 
                     C 580 220, 500 220, 450 220 
                     C 400 180, 220 180, 220 350 Z" 
                  fill="url(#mantleGrad)" stroke="#D68910" stroke-width="2"/>

            <!-- Shell (Protective outer layer) -->
            <path d="M 195 350 C 170 240, 170 110, 200 110 C 490 110, 570 210, 630 275" 
                  fill="none" stroke="#BDC3C7" stroke-width="14" stroke-linecap="round" filter="drop-shadow(2px 4px 4px rgba(0,0,0,0.1))"/>
            <!-- Shell Inner Line for depth -->
            <path d="M 195 350 C 170 240, 170 110, 200 110 C 490 110, 570 210, 630 275" 
                  fill="none" stroke="#7F8C8D" stroke-width="2" stroke-linecap="round"/>
        </g>

        <!-- Water Flow Particles -->
        <g id="water-particles">
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="0s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="1s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="2s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="3s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="4s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
            <circle r="5" class="particle">
                <animateMotion dur="6s" repeatCount="indefinite" begin="5s">
                    <mpath href="#water-path"/>
                </animateMotion>
            </circle>
        </g>

        <!-- Process Arrows -->
        <g id="process-arrows">
            <!-- Inflow -->
            <path d="M 700 335 L 630 335" stroke="#3498DB" stroke-width="2.5" marker-end="url(#arrowhead-blue)" />
            <text x="710" y="340" fill="#3498DB" font-size="13" font-weight="700">Water Inflow</text>
            
            <!-- Outflow -->
            <path d="M 630 265 L 700 265" stroke="#5D6D7E" stroke-width="2.5" marker-end="url(#arrowhead-grey)" />
            <text x="710" y="269" fill="#5D6D7E" font-size="13" font-weight="700">Water Outflow</text>
        </g>

        <!-- Labels and Leader Lines -->
        <g id="labels">
            <!-- Shell -->
            <line x1="330" y1="115" x2="330" y2="70" class="line" />
            <text x="330" y="60" class="label" text-anchor="middle">Shell</text>

            <!-- Mantle -->
            <line x1="420" y1="150" x2="480" y2="90" class="line" />
            <text x="485" y="85" class="label">Mantle</text>

            <!-- Visceral Hump -->
            <line x1="350" y1="250" x2="230" y2="200" class="line" />
            <text x="220" y="195" class="label" text-anchor="end">Visceral Hump</text>

            <!-- Mantle Cavity -->
            <line x1="570" y1="290" x2="680" y2="180" class="line" />
            <text x="685" y="175" class="label">Mantle Cavity</text>

            <!-- Feather-like Gills -->
            <line x1="540" y1="280" x2="680" y2="120" class="line" />
            <text x="685" y="115" class="label">Feather-like Gills</text>
            <text x="685" y="132" class="sci-term">(Ctenidia)</text>
        </g>

        <!-- Legend / Key -->
        <g id="legend" transform="translate(30, 370)">
            <rect width="230" height="100" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>
            <text x="15" y="22" font-size="13" font-weight="700" fill="#2C3E50">Physiological Key</text>
            
            <circle cx="25" cy="45" r="5" fill="#3498DB" />
            <text x="40" y="49" font-size="12" fill="#2C3E50">Oxygen-rich Water (Inflow)</text>
            
            <circle cx="25" cy="65" r="5" fill="#FF6B6B" filter="drop-shadow(0 0 4px #FF6B6B)" />
            <text x="40" y="69" font-size="12" fill="#2C3E50">Active Gas Exchange</text>
            
            <circle cx="25" cy="85" r="5" fill="#5D6D7E" />
            <text x="40" y="89" font-size="12" fill="#2C3E50">Waste/Deoxygenated (Outflow)</text>
        </g>

    </svg>

</body>
</html>
