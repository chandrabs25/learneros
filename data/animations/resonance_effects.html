<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resonance Effects (+R) in Anisole</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #f8f9fa;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Pi Bonds Animations */
        .pi12 { animation: fadePi12 15s infinite; }
        .pi23 { animation: fadePi23 15s infinite; }
        .pi34 { animation: fadePi34 15s infinite; }
        .pi45 { animation: fadePi45 15s infinite; }
        .pi56 { animation: fadePi56 15s infinite; }
        .pi61 { animation: fadePi61 15s infinite; }
        .pi1O { animation: fadePi1O 15s infinite; }

        @keyframes fadePi12 {
            0%, 13.3% { opacity: 1; }
            20%, 93.3% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes fadePi23 {
            0%, 33.3% { opacity: 0; }
            40%, 93.3% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes fadePi34 {
            0%, 33.3% { opacity: 1; }
            40%, 93.3% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes fadePi45 {
            0%, 53.3% { opacity: 0; }
            60%, 93.3% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes fadePi56 {
            0%, 53.3% { opacity: 1; }
            60%, 93.3% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes fadePi61 {
            0%, 73.3% { opacity: 0; }
            80%, 93.3% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes fadePi1O {
            0%, 13.3% { opacity: 0; }
            20%, 73.3% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        /* Charges and Lone Pairs Animations */
        .chargeO { animation: fadeChargeO 15s infinite; }
        .lpORight { animation: fadeLpORight 15s infinite; }
        .chargeC2 { animation: fadeChargeC2 15s infinite; }
        .chargeC4 { animation: fadeChargeC4 15s infinite; }
        .chargeC6 { animation: fadeChargeC6 15s infinite; }

        @keyframes fadeChargeO {
            0%, 13.3% { opacity: 0; }
            20%, 73.3% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }
        @keyframes fadeLpORight {
            0%, 13.3% { opacity: 1; }
            20%, 73.3% { opacity: 0; }
            80%, 100% { opacity: 1; }
        }
        @keyframes fadeChargeC2 {
            0%, 13.3% { opacity: 0; }
            20%, 33.3% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }
        @keyframes fadeChargeC4 {
            0%, 33.3% { opacity: 0; }
            40%, 53.3% { opacity: 1; }
            60%, 100% { opacity: 0; }
        }
        @keyframes fadeChargeC6 {
            0%, 53.3% { opacity: 0; }
            60%, 73.3% { opacity: 1; }
            80%, 100% { opacity: 0; }
        }

        /* Arrow Animations */
        .arrow {
            fill: none;
            stroke: #F77F00;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 100;
            marker-end: url(#arrowhead);
        }

        .arrow1 { animation: drawArrow1 15s ease-in-out infinite; }
        .arrow2 { animation: drawArrow2 15s ease-in-out infinite; }
        .arrow3 { animation: drawArrow3 15s ease-in-out infinite; }
        .arrow4 { animation: drawArrow4 15s ease-in-out infinite; }

        @keyframes drawArrow1 {
            0%, 13.2% { opacity: 0; stroke-dashoffset: 100; }
            13.3% { opacity: 1; stroke-dashoffset: 100; }
            18% { opacity: 1; stroke-dashoffset: 0; }
            19.9% { opacity: 1; stroke-dashoffset: 0; }
            20%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes drawArrow2 {
            0%, 33.2% { opacity: 0; stroke-dashoffset: 100; }
            33.3% { opacity: 1; stroke-dashoffset: 100; }
            38% { opacity: 1; stroke-dashoffset: 0; }
            39.9% { opacity: 1; stroke-dashoffset: 0; }
            40%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes drawArrow3 {
            0%, 53.2% { opacity: 0; stroke-dashoffset: 100; }
            53.3% { opacity: 1; stroke-dashoffset: 100; }
            58% { opacity: 1; stroke-dashoffset: 0; }
            59.9% { opacity: 1; stroke-dashoffset: 0; }
            60%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }
        @keyframes drawArrow4 {
            0%, 73.2% { opacity: 0; stroke-dashoffset: 100; }
            73.3% { opacity: 1; stroke-dashoffset: 100; }
            78% { opacity: 1; stroke-dashoffset: 0; }
            79.9% { opacity: 1; stroke-dashoffset: 0; }
            80%, 100% { opacity: 0; stroke-dashoffset: 0; }
        }

        /* Subtitle Animations */
        .sub1 { animation: fadeSub1 15s infinite; }
        .sub2 { animation: fadeSub2 15s infinite; }
        .sub3 { animation: fadeSub3 15s infinite; }
        .sub4 { animation: fadeSub4 15s infinite; }

        @keyframes fadeSub1 {
            0%, 13.3% { opacity: 1; }
            15%, 78% { opacity: 0; }
            80%, 100% { opacity: 1; }
        }
        @keyframes fadeSub2 {
            0%, 18% { opacity: 0; }
            20%, 33.3% { opacity: 1; }
            35%, 100% { opacity: 0; }
        }
        @keyframes fadeSub3 {
            0%, 38% { opacity: 0; }
            40%, 53.3% { opacity: 1; }
            55%, 100% { opacity: 0; }
        }
        @keyframes fadeSub4 {
            0%, 58% { opacity: 0; }
            60%, 73.3% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
                <path d="M 1 1 L 7 4 L 1 7" fill="none" stroke="#F77F00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Titles -->
        <text x="400" y="40" font-size="24" font-weight="600" text-anchor="middle" fill="#333">Resonance Effects (+R) in Anisole</text>
        <text x="400" y="65" font-family="'Roboto Mono', monospace" font-size="16" text-anchor="middle" fill="#666">
            C<tspan dy="4" font-size="12">6</tspan><tspan dy="-4">H</tspan><tspan dy="4" font-size="12">5</tspan><tspan dy="-4">OCH</tspan><tspan dy="4" font-size="12">3</tspan>
        </text>

        <!-- Dynamic Subtitles -->
        <text class="sub1" x="400" y="475" font-size="18" text-anchor="middle" fill="#4361EE" font-weight="600">Neutral State: Lone pair delocalization begins</text>
        <text class="sub2" x="400" y="475" font-size="18" text-anchor="middle" fill="#E63946" font-weight="600">Ortho Attack: Increased electron density at Ortho position</text>
        <text class="sub3" x="400" y="475" font-size="18" text-anchor="middle" fill="#E63946" font-weight="600">Para Attack: Increased electron density at Para position</text>
        <text class="sub4" x="400" y="475" font-size="18" text-anchor="middle" fill="#E63946" font-weight="600">Ortho Attack: Increased electron density at alternate Ortho position</text>

        <!-- Position Labels -->
        <g font-size="12" font-style="italic" fill="#888" text-anchor="middle">
            <text x="505" y="240">ortho</text>
            <text x="505" y="350">meta</text>
            <text x="400" y="430">para</text>
            <text x="295" y="350">meta</text>
            <text x="295" y="240">ortho</text>
        </g>

        <!-- Legend -->
        <g transform="translate(600, 390)">
            <rect x="0" y="0" width="180" height="85" rx="6" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            
            <line x1="10" y1="20" x2="35" y2="20" stroke="#F77F00" stroke-width="2" marker-end="url(#arrowhead)"/>
            <text x="45" y="24" font-size="12" fill="#404040">Electron Flow</text>
            
            <circle cx="22" cy="45" r="7" fill="#E63946"/>
            <text x="22" y="49" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">+</text>
            <text x="45" y="49" font-size="12" fill="#404040">Positive Charge</text>
            
            <circle cx="22" cy="65" r="7" fill="#4361EE"/>
            <text x="22" y="68" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">-</text>
            <text x="45" y="69" font-size="12" fill="#404040">Negative Charge</text>
        </g>

        <!-- Molecule Group -->
        <g id="molecule">
            <!-- Sigma Bonds -->
            <polygon points="400,220 470,260 470,340 400,380 330,340 330,260" fill="none" stroke="#333333" stroke-width="4" stroke-linejoin="round"/>
            <line x1="400" y1="220" x2="400" y2="160" stroke="#333333" stroke-width="4" stroke-linecap="round"/>
            <line x1="412" y1="140" x2="455" y2="110" stroke="#333333" stroke-width="4" stroke-linecap="round"/>

            <!-- Pi Bonds (Animated) -->
            <g stroke="#555555" stroke-width="4" stroke-linecap="round">
                <line class="pi12" x1="404" y1="234" x2="456" y2="264"/>
                <line class="pi23" x1="460" y1="270" x2="460" y2="330"/>
                <line class="pi34" x1="456" y1="336" x2="404" y2="366"/>
                <line class="pi45" x1="396" y1="366" x2="344" y2="336"/>
                <line class="pi56" x1="340" y1="330" x2="340" y2="270"/>
                <line class="pi61" x1="344" y1="264" x2="396" y2="234"/>
                <line class="pi1O" x1="408" y1="218" x2="408" y2="157"/>
            </g>

            <!-- Atoms -->
            <text x="400" y="152" fill="#FF4444" font-family="'Roboto Mono', monospace" font-size="24" text-anchor="middle" font-weight="700">O</text>
            <text x="460" y="105" fill="#404040" font-family="'Roboto Mono', monospace" font-size="22" font-weight="700">CH<tspan dy="5" font-size="14">3</tspan></text>

            <!-- Lone Pairs -->
            <g fill="#404040">
                <!-- O Left LP (Always visible) -->
                <circle cx="380" cy="135" r="2.5"/>
                <circle cx="380" cy="145" r="2.5"/>
                
                <!-- O Right LP (Animated) -->
                <g class="lpORight">
                    <circle cx="420" cy="135" r="2.5"/>
                    <circle cx="420" cy="145" r="2.5"/>
                </g>

                <!-- C2 LP (Animated) -->
                <g class="chargeC2">
                    <circle cx="485" cy="245" r="2.5"/>
                    <circle cx="495" cy="240" r="2.5"/>
                </g>

                <!-- C4 LP (Animated) -->
                <g class="chargeC4">
                    <circle cx="390" cy="395" r="2.5"/>
                    <circle cx="410" cy="395" r="2.5"/>
                </g>

                <!-- C6 LP (Animated) -->
                <g class="chargeC6">
                    <circle cx="315" cy="245" r="2.5"/>
                    <circle cx="305" cy="240" r="2.5"/>
                </g>
            </g>

            <!-- Formal Charges -->
            <!-- O(+) -->
            <g class="chargeO">
                <circle cx="370" cy="125" r="10" fill="#E63946"/>
                <text x="370" y="129" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">+</text>
            </g>

            <!-- C2(-) -->
            <g class="chargeC2">
                <circle cx="495" cy="260" r="10" fill="#4361EE"/>
                <text x="495" y="263" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">-</text>
            </g>

            <!-- C4(-) -->
            <g class="chargeC4">
                <circle cx="400" cy="405" r="10" fill="#4361EE"/>
                <text x="400" y="408" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">-</text>
            </g>

            <!-- C6(-) -->
            <g class="chargeC6">
                <circle cx="305" cy="260" r="10" fill="#4361EE"/>
                <text x="305" y="263" fill="#ffffff" font-size="14" text-anchor="middle" font-weight="bold">-</text>
            </g>
        </g>

        <!-- Curly Arrows -->
        <g id="arrows">
            <!-- Transition 1: O LP to C1-O, C1=C2 to C2 -->
            <path class="arrow arrow1" pathLength="100" d="M 425,140 Q 445,160 415,180"/>
            <path class="arrow arrow1" pathLength="100" d="M 430,249 Q 460,220 482,242"/>

            <!-- Transition 2: C2 LP to C2-C3, C3=C4 to C4 -->
            <path class="arrow arrow2" pathLength="100" d="M 490,245 Q 510,270 475,300"/>
            <path class="arrow arrow2" pathLength="100" d="M 430,351 Q 450,380 412,392"/>

            <!-- Transition 3: C4 LP to C4-C5, C5=C6 to C6 -->
            <path class="arrow arrow3" pathLength="100" d="M 385,400 Q 350,390 365,350"/>
            <path class="arrow arrow3" pathLength="100" d="M 340,300 Q 310,280 315,245"/>

            <!-- Transition 4: C6 LP to C6-C1, C1=O to O -->
            <path class="arrow arrow4" pathLength="100" d="M 310,245 Q 330,210 355,230"/>
            <path class="arrow arrow4" pathLength="100" d="M 408,187 Q 440,170 422,142"/>
        </g>
    </svg>
</div>

</body>
</html>
