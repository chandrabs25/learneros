<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nucleotide Polymerization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono:wght@700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            padding: 20px;
            box-sizing: border-box;
        }

        svg {
            width: 100%;
            height: auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(44, 62, 80, 0.1);
        }

        /* Typography */
        .title { font-weight: 700; font-size: 22px; fill: #2C3E50; }
        .legend-text { font-size: 12px; fill: #2C3E50; }
        .label-text { font-size: 14px; fill: #2C3E50; }
        .carbon-num { font-family: 'Roboto Mono', monospace; font-size: 10px; fill: #7F8C8D; font-weight: 700; }
        .chem-symbol { font-family: 'Roboto Mono', monospace; font-size: 14px; font-weight: 700; fill: #ffffff; }

        /* Interactivity */
        .backbone-highlight {
            opacity: 0;
            stroke: #FF6B6B;
            stroke-width: 35;
            fill: none;
            pointer-events: stroke;
            transition: opacity 0.3s ease, filter 0.3s ease;
            cursor: pointer;
        }
        .backbone-highlight:hover {
            opacity: 0.3;
            filter: drop-shadow(0 0 8px #FF6B6B);
        }

        /* Animations */
        .camera { animation: cameraPan 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        
        .n1 .sugar { animation: fadeIn 11s infinite; }
        .n1 .base-purine { animation: driftLeft 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .n1 .phosphate { animation: driftRight 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .n1 .bond { stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawBond 11s infinite linear; }
        
        .sparkle { animation: sparkleAnim 11s infinite ease-in-out; transform-origin: center; }
        .s1 { transform-box: fill-box; }
        .s2 { transform-box: fill-box; }

        .h2o-1 { animation: h2oPhase1_1 11s infinite ease-in-out; }
        .h2o-2 { animation: h2oPhase1_2 11s infinite ease-in-out; }

        .labels-phase1 { animation: labels1 11s infinite ease-in-out; }

        .n2 { animation: n2Rise 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .pb1 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawPb1 11s infinite linear; }
        .h2o-p1 { animation: h2oP1 11s infinite ease-in-out; }

        .n3 { animation: n3Rise 11s infinite cubic-bezier(0.4, 0, 0.2, 1); }
        .pb2 { stroke-dasharray: 100; stroke-dashoffset: 100; animation: drawPb2 11s infinite linear; }
        .h2o-p2 { animation: h2oP2 11s infinite ease-in-out; }

        .labels-phase3 { animation: labels3 11s infinite ease-in-out; }

        /* Keyframes */
        @keyframes cameraPan {
            0% { transform: translate(400px, 250px) scale(1.5); opacity: 0; }
            3%, 50% { transform: translate(400px, 250px) scale(1.5); opacity: 1; }
            60%, 70% { transform: translate(450px, 150px) scale(1); opacity: 1; }
            80%, 95% { transform: translate(450px, 80px) scale(1); opacity: 1; }
            100% { transform: translate(450px, 80px) scale(1); opacity: 0; }
        }

        @keyframes fadeIn {
            0%, 100% { opacity: 0; }
            5%, 95% { opacity: 1; }
        }

        @keyframes driftLeft {
            0%, 5% { transform: translateX(50px); opacity: 0; }
            15%, 95% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes driftRight {
            0%, 5% { transform: translateX(-50px); opacity: 0; }
            15%, 95% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(0); opacity: 0; }
        }

        @keyframes drawBond {
            0%, 15% { stroke-dashoffset: 50; opacity: 0; }
            16% { opacity: 1; }
            20%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 0; }
        }

        @keyframes sparkleAnim {
            0%, 17% { transform: scale(0); opacity: 0; }
            19% { transform: scale(1.5); opacity: 1; }
            22%, 100% { transform: scale(0); opacity: 0; }
        }

        @keyframes h2oPhase1_1 {
            0%, 22% { transform: translate(35px, -10px); opacity: 0; }
            25% { opacity: 1; }
            35% { transform: translate(55px, -40px); opacity: 1; }
            40%, 100% { transform: translate(75px, -70px); opacity: 0; }
        }

        @keyframes h2oPhase1_2 {
            0%, 22% { transform: translate(-55px, -31px); opacity: 0; }
            25% { opacity: 1; }
            35% { transform: translate(-35px, -61px); opacity: 1; }
            40%, 100% { transform: translate(-15px, -91px); opacity: 0; }
        }

        @keyframes labels1 {
            0%, 25% { opacity: 0; }
            30%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes n2Rise {
            0%, 55% { transform: translate(0, 190px); opacity: 0; }
            65%, 95% { transform: translate(0, 140px); opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes drawPb1 {
            0%, 65% { stroke-dashoffset: 100; opacity: 0; }
            66% { opacity: 1; }
            70%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes h2oP1 {
            0%, 68% { transform: translate(-45px, 60px); opacity: 0; }
            70% { opacity: 1; }
            76% { transform: translate(-25px, 30px); opacity: 1; }
            80%, 100% { transform: translate(-5px, 0px); opacity: 0; }
        }

        @keyframes n3Rise {
            0%, 70% { transform: translate(0, 330px); opacity: 0; }
            80%, 95% { transform: translate(0, 280px); opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes drawPb2 {
            0%, 80% { stroke-dashoffset: 100; opacity: 0; }
            81% { opacity: 1; }
            85%, 95% { stroke-dashoffset: 0; opacity: 1; }
            100% { opacity: 0; }
        }

        @keyframes h2oP2 {
            0%, 83% { transform: translate(-45px, 200px); opacity: 0; }
            85% { opacity: 1; }
            91% { transform: translate(-25px, 170px); opacity: 1; }
            95%, 100% { transform: translate(-5px, 140px); opacity: 0; }
        }

        @keyframes labels3 {
            0%, 85% { opacity: 0; }
            88%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <title>Nucleotide Structure & Phosphodiester Linkage</title>
            <desc>Animation showing the assembly of a nucleotide and its polymerization into a nucleic acid chain via dehydration synthesis.</desc>

            <defs>
                <!-- Water Molecule Template -->
                <g id="water">
                    <circle cx="0" cy="0" r="6" fill="#A5D6A7" />
                    <circle cx="-5" cy="-5" r="4" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1.5"/>
                    <circle cx="5" cy="-5" r="4" fill="#E8F4FD" stroke="#2C3E50" stroke-width="1.5"/>
                </g>
                
                <!-- Sparkle Template -->
                <g id="sparkle-fx">
                    <path d="M0 -10 L2 -2 L10 0 L2 2 L0 10 L-2 2 L-10 0 L-2 -2 Z" fill="#F39C12" />
                </g>
            </defs>

            <!-- Static UI Elements -->
            <text x="30" y="40" class="title">Molecular Architecture &amp; Polymerization of Nucleotides</text>
            
            <!-- Legend -->
            <g transform="translate(30, 70)">
                <rect x="0" y="0" width="14" height="14" rx="2" fill="#FFD93D" stroke="#2C3E50" stroke-width="1.5"/>
                <text x="24" y="11" class="legend-text">Deoxyribose (Pentose)</text>
                
                <circle cx="7" cy="31" r="7" fill="#FF6B6B" stroke="#2C3E50" stroke-width="1.5"/>
                <text x="24" y="35" class="legend-text">Phosphate Group</text>
                
                <rect x="0" y="48" width="14" height="14" rx="2" fill="#4A90D9" stroke="#2C3E50" stroke-width="1.5"/>
                <text x="24" y="59" class="legend-text">Purine Base (A/G)</text>
                
                <rect x="0" y="72" width="14" height="14" rx="2" fill="#3498DB" stroke="#2C3E50" stroke-width="1.5"/>
                <text x="24" y="83" class="legend-text">Pyrimidine Base (T/C)</text>

                <use href="#water" x="7" y="103" />
                <text x="24" y="107" class="legend-text">Water (Byproduct)</text>
            </g>

            <!-- Master Camera Group -->
            <g class="camera">
                
                <!-- Backbone Hover Area -->
                <g class="backbone-group">
                    <!-- Invisible thick path for hover interaction -->
                    <path class="backbone-highlight" d="M -75 -45 L -45 -25 L -25 -5 L -15 25 L -75 95 L -45 115 L -25 135 L -15 165 L -75 235 L -45 255 L -25 275 L -15 305" />

                    <!-- Nucleotide 1 (Top) -->
                    <g class="n1">
                        <!-- Bonds -->
                        <path class="bond n-glyc" d="M 25 -5 L 45 -15" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                        <path class="bond p-ester" d="M -45 -25 L -65 -38" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

                        <!-- Phosphate -->
                        <g class="phosphate">
                            <circle cx="-75" cy="-45" r="16" fill="#FF6B6B" stroke="#2C3E50" stroke-width="2.5"/>
                            <text x="-75" y="-40" class="chem-symbol" text-anchor="middle">P</text>
                        </g>

                        <!-- Sugar -->
                        <g class="sugar">
                            <path d="M 0 -25 L 25 -5 L 15 25 L -15 25 L -25 -5 Z" fill="#FFD93D" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <circle cx="0" cy="-25" r="5" fill="#E74C3C" stroke="#2C3E50" stroke-width="1.5"/> <!-- Oxygen -->
                            <!-- Carbon Numbers -->
                            <text x="32" y="2" class="carbon-num">1'</text>
                            <text x="20" y="38" class="carbon-num">2'</text>
                            <text x="-20" y="38" class="carbon-num">3'</text>
                            <text x="-32" y="2" class="carbon-num">4'</text>
                            <text x="-52" y="-12" class="carbon-num">5'</text>
                        </g>

                        <!-- Base (Purine - Adenine) -->
                        <g class="base-purine">
                            <path d="M 45 -15 L 60 -30 L 80 -20 L 80 0 L 60 -5 Z" fill="#4A90D9" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <path d="M 80 -20 L 100 -30 L 120 -20 L 120 0 L 100 10 L 80 0" fill="#4A90D9" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <text x="85" y="-5" class="chem-symbol" text-anchor="middle">A</text>
                        </g>

                        <!-- Sparkles -->
                        <use href="#sparkle-fx" class="sparkle s1" x="35" y="-10" />
                        <use href="#sparkle-fx" class="sparkle s2" x="-55" y="-31" />
                    </g>

                    <!-- Phosphodiester Bond 1 -->
                    <path class="poly-bond pb1" d="M -15 25 C -15 60, -75 60, -75 95" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

                    <!-- Nucleotide 2 (Middle) -->
                    <g class="n2">
                        <path class="bond" d="M 25 -5 L 45 -15" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                        <path class="bond" d="M -45 -25 L -65 -38" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

                        <g class="phosphate">
                            <circle cx="-75" cy="-45" r="16" fill="#FF6B6B" stroke="#2C3E50" stroke-width="2.5"/>
                            <text x="-75" y="-40" class="chem-symbol" text-anchor="middle">P</text>
                        </g>

                        <g class="sugar">
                            <path d="M 0 -25 L 25 -5 L 15 25 L -15 25 L -25 -5 Z" fill="#FFD93D" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <circle cx="0" cy="-25" r="5" fill="#E74C3C" stroke="#2C3E50" stroke-width="1.5"/>
                            <text x="32" y="2" class="carbon-num">1'</text>
                            <text x="-20" y="38" class="carbon-num">3'</text>
                            <text x="-52" y="-12" class="carbon-num">5'</text>
                        </g>

                        <!-- Base (Pyrimidine - Thymine) -->
                        <g class="base-pyrimidine">
                            <path d="M 45 -15 L 45 -35 L 65 -45 L 85 -35 L 85 -15 L 65 -5 Z" fill="#3498DB" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <text x="65" y="-15" class="chem-symbol" text-anchor="middle">T</text>
                        </g>
                    </g>

                    <!-- Phosphodiester Bond 2 -->
                    <path class="poly-bond pb2" d="M -15 165 C -15 200, -75 200, -75 235" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

                    <!-- Nucleotide 3 (Bottom) -->
                    <g class="n3">
                        <path class="bond" d="M 25 -5 L 45 -15" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
                        <path class="bond" d="M -45 -25 L -65 -38" fill="none" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

                        <g class="phosphate">
                            <circle cx="-75" cy="-45" r="16" fill="#FF6B6B" stroke="#2C3E50" stroke-width="2.5"/>
                            <text x="-75" y="-40" class="chem-symbol" text-anchor="middle">P</text>
                        </g>

                        <g class="sugar">
                            <path d="M 0 -25 L 25 -5 L 15 25 L -15 25 L -25 -5 Z" fill="#FFD93D" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <circle cx="0" cy="-25" r="5" fill="#E74C3C" stroke="#2C3E50" stroke-width="1.5"/>
                            <text x="32" y="2" class="carbon-num">1'</text>
                            <text x="-20" y="38" class="carbon-num">3'</text>
                            <text x="-52" y="-12" class="carbon-num">5'</text>
                        </g>

                        <!-- Base (Purine - Guanine) -->
                        <g class="base-purine">
                            <path d="M 45 -15 L 60 -30 L 80 -20 L 80 0 L 60 -5 Z" fill="#4A90D9" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <path d="M 80 -20 L 100 -30 L 120 -20 L 120 0 L 100 10 L 80 0" fill="#4A90D9" stroke="#2C3E50" stroke-width="2.5" stroke-linejoin="round"/>
                            <text x="85" y="-5" class="chem-symbol" text-anchor="middle">G</text>
                        </g>
                    </g>
                </g>

                <!-- Floating Water Molecules -->
                <use href="#water" class="h2o-1" />
                <use href="#water" class="h2o-2" />
                <use href="#water" class="h2o-p1" />
                <use href="#water" class="h2o-p2" />
            </g>

            <!-- Labels Group (Phase 1) -->
            <g class="labels-phase1">
                <line x1="200" y1="120" x2="280" y2="180" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="180" y="110" class="label-text" font-weight="700">Phosphate Group</text>

                <line x1="400" y1="150" x2="400" y2="230" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="400" y="140" class="label-text" font-weight="700" text-anchor="middle">Pentose Sugar</text>

                <line x1="600" y1="150" x2="520" y2="220" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="600" y="140" class="label-text" font-weight="700">Nitrogenous Base</text>
            </g>

            <!-- Labels Group (Phase 3) -->
            <g class="labels-phase3">
                <!-- Directionality -->
                <text x="375" y="20" class="label-text" font-weight="700" fill="#E74C3C" text-anchor="middle">5' End</text>
                <line x1="375" y1="25" x2="375" y2="45" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>
                
                <text x="450" y="440" class="label-text" font-weight="700" fill="#E74C3C" text-anchor="middle">3' End</text>
                <line x1="450" y1="420" x2="450" y2="400" stroke="#E74C3C" stroke-width="2" marker-end="url(#arrow)"/>

                <!-- Bond Labels -->
                <line x1="550" y1="160" x2="420" y2="160" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="555" y="165" class="label-text" font-style="italic">Phosphodiester bond</text>

                <line x1="550" y1="75" x2="480" y2="75" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4"/>
                <text x="555" y="80" class="label-text" font-style="italic">N-glycosidic bond</text>
            </g>

            <!-- Arrow Marker for Directionality -->
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#E74C3C" />
                </marker>
            </defs>

        </svg>
    </div>
</body>
</html>
