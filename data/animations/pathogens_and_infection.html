<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanisms of Viral STI Transmission and Cellular Infection</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Animations */
        .blood-virion {
            animation: blood-flow 12s linear infinite;
        }

        .mucosa-virion {
            animation: mucosa-flow 12s linear infinite;
        }

        .infecting-envelope {
            animation: fuse-env 12s linear infinite;
        }

        .infecting-capsid {
            animation: enter-capsid 12s linear infinite;
        }

        .viral-genome {
            animation: genome-nav 12s linear infinite;
            filter: drop-shadow(0px 0px 2px rgba(255, 107, 107, 0.5));
        }

        .budding-virion {
            animation: bud-out 12s linear infinite;
        }

        .pulse-receptor {
            animation: pulse 12s linear infinite;
        }

        /* Keyframes */
        @keyframes blood-flow {
            0% { transform: translate(140px, 105px); opacity: 0; }
            5% { opacity: 1; }
            24% { transform: translate(290px, 260px); opacity: 1; }
            25%, 100% { transform: translate(290px, 260px); opacity: 0; }
        }

        @keyframes mucosa-flow {
            0% { transform: translate(140px, 395px); opacity: 0; }
            5% { opacity: 1; }
            24% { transform: translate(290px, 260px); opacity: 1; }
            25%, 100% { transform: translate(290px, 260px); opacity: 0; }
        }

        @keyframes fuse-env {
            0%, 24% { opacity: 0; transform: translate(290px, 260px) scale(1); }
            25% { opacity: 1; transform: translate(290px, 260px) scale(1); }
            32% { opacity: 0; transform: translate(310px, 260px) scale(1.6); }
            100% { opacity: 0; }
        }

        @keyframes enter-capsid {
            0%, 24% { opacity: 0; transform: translate(290px, 260px); }
            25% { opacity: 1; transform: translate(290px, 260px); }
            32% { opacity: 1; transform: translate(330px, 260px); }
            45% { opacity: 1; transform: translate(430px, 260px); }
            50% { opacity: 0; transform: translate(450px, 260px); }
            100% { opacity: 0; }
        }

        @keyframes genome-nav {
            0%, 49% { opacity: 0; transform: translate(450px, 260px) rotate(0deg); }
            50% { opacity: 1; transform: translate(450px, 260px) rotate(0deg); }
            60% { opacity: 1; transform: translate(530px, 260px) rotate(0deg); }
            70% { opacity: 1; transform: translate(530px, 260px) rotate(180deg) scale(1.2); }
            85% { opacity: 1; transform: translate(530px, 260px) rotate(360deg) scale(1); }
            90%, 100% { opacity: 0; transform: translate(530px, 260px) rotate(360deg); }
        }

        @keyframes bud-out {
            0%, 74% { opacity: 0; transform: translate(740px, 260px) scale(0); }
            75% { opacity: 1; transform: translate(740px, 260px) scale(0.2); }
            85% { opacity: 1; transform: translate(760px, 260px) scale(1); }
            95% { opacity: 1; transform: translate(790px, 260px) scale(1); }
            100% { opacity: 0; transform: translate(810px, 260px) scale(1); }
        }

        @keyframes pulse {
            0%, 20%, 35%, 100% { stroke-width: 2.5; filter: none; }
            25%, 30% { stroke-width: 4; filter: drop-shadow(0px 0px 3px #F39C12); }
        }

        .label { font-size: 14px; fill: #2C3E50; font-weight: 600; }
        .sub-label { font-size: 12px; fill: #2C3E50; }
        .sci-text { font-family: 'Roboto Mono', monospace; font-size: 11px; fill: #2C3E50; }
        .title { font-size: 22px; font-weight: 700; fill: #2C3E50; }
        .caption { font-size: 13px; fill: #2C3E50; }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" aria-label="Animated diagram showing viral STI transmission and cellular infection">
        <title>Mechanisms of Viral STI Transmission and Cellular Infection</title>
        <desc>Animation showing the 4 stages of viral infection: Transmission via blood or mucosa, Attachment and Fusion at the cell membrane, Uncoating and Integration in the nucleus, and Replication and Budding of new virions.</desc>

        <!-- Definitions for reusable elements -->
        <defs>
            <!-- Arrow Marker -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#2C3E50" />
            </marker>

            <!-- Full Virion -->
            <g id="virion-full">
                <circle cx="0" cy="0" r="14" fill="#98D8C8" opacity="0.2" stroke="#98D8C8" stroke-width="1.5"/>
                <!-- Spikes -->
                <line x1="0" y1="-14" x2="0" y2="-18" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="14" x2="0" y2="18" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="-14" y1="0" x2="-18" y2="0" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="14" y1="0" x2="18" y2="0" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="-10" y1="-10" x2="-13" y2="-13" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="10" y1="10" x2="13" y2="13" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="-10" y1="10" x2="-13" y2="13" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="10" y1="-10" x2="13" y2="-13" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <!-- Capsid -->
                <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="#98D8C8"/>
                <!-- Genome -->
                <path d="M-4,-3 Q0,-8 4,-3 T4,5" stroke="#FF6B6B" fill="none" stroke-width="1.5"/>
            </g>

            <!-- Virion Envelope Only (for fusion) -->
            <g id="virion-envelope">
                <circle cx="0" cy="0" r="14" fill="#98D8C8" opacity="0.4" stroke="#98D8C8" stroke-width="1.5"/>
                <line x1="0" y1="-14" x2="0" y2="-18" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="0" y1="14" x2="0" y2="18" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="-14" y1="0" x2="-18" y2="0" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
                <line x1="14" y1="0" x2="18" y2="0" stroke="#98D8C8" stroke-width="2" stroke-linecap="round"/>
            </g>

            <!-- Virion Capsid Only -->
            <g id="virion-capsid">
                <polygon points="0,-8 7,-4 7,4 0,8 -7,4 -7,-4" fill="#98D8C8"/>
                <path d="M-4,-3 Q0,-8 4,-3 T4,5" stroke="#FF6B6B" fill="none" stroke-width="1.5"/>
            </g>

            <!-- Viral Genome Only -->
            <g id="virion-genome">
                <path d="M-8,-4 Q0,-12 8,-4 T8,8" stroke="#FF6B6B" fill="none" stroke-width="2.5" stroke-linecap="round"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="800" height="500" fill="#f8f9fa" />

        <!-- Title and Caption -->
        <text x="400" y="35" text-anchor="middle" class="title">Pathogen Infection Cycle: Viral STIs</text>
        <text x="400" y="480" text-anchor="middle" class="caption">
            <tspan font-style="italic">Human Immunodeficiency Virus</tspan> (HIV) and <tspan font-style="italic">Hepatitis B Virus</tspan> (HBV) transmission.
        </text>

        <!-- ========================================== -->
        <!-- MACRO LEVEL: TRANSMISSION VECTORS (LEFT)   -->
        <!-- ========================================== -->

        <!-- Syringe (Blood-borne Route) -->
        <g transform="translate(40, 90)">
            <rect x="20" y="8" width="50" height="14" rx="2" fill="#ffffff" stroke="#2C3E50" stroke-width="1.5"/>
            <rect x="22" y="10" width="35" height="10" fill="#E74C3C" opacity="0.8"/>
            <line x1="70" y1="15" x2="95" y2="15" stroke="#2C3E50" stroke-width="1.5"/>
            <rect x="0" y="13" width="20" height="4" fill="#2C3E50"/>
            <rect x="-4" y="8" width="4" height="14" fill="#2C3E50" rx="1"/>
            <path d="M 95 15 L 100 18 L 95 21 Z" fill="#2C3E50"/>
            <text x="50" y="-10" text-anchor="middle" class="label">Blood-borne Route</text>
        </g>

        <!-- Mucosal Barrier (Sexual Route) -->
        <g transform="translate(40, 380)">
            <path d="M 0 0 Q 15 -5 30 0 Q 45 5 60 0 Q 75 -5 90 0 L 90 45 L 0 45 Z" fill="#F39C12" opacity="0.4" stroke="#2C3E50" stroke-width="1.5"/>
            <path d="M 0 15 Q 15 10 30 15 Q 45 20 60 15 Q 75 10 90 15" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
            <path d="M 0 30 Q 15 25 30 30 Q 45 35 60 30 Q 75 25 90 30" fill="none" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
            <!-- Epithelial Nuclei -->
            <circle cx="15" cy="8" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="45" cy="6" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="75" cy="8" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="20" cy="22" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="50" cy="24" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="80" cy="22" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="30" cy="38" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <circle cx="60" cy="36" r="2.5" fill="#2C3E50" opacity="0.7"/>
            <text x="45" y="-15" text-anchor="middle" class="label">Mucosal Route</text>
        </g>

        <!-- Transmission Flow Arrows -->
        <path d="M 150 105 Q 220 105 270 240" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)" opacity="0.5"/>
        <path d="M 150 395 Q 220 395 270 280" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arrow)" opacity="0.5"/>


        <!-- ========================================== -->
        <!-- MICRO LEVEL: HOST CELL & INFECTION (RIGHT) -->
        <!-- ========================================== -->

        <!-- Host Cell Membrane & Cytoplasm -->
        <circle cx="530" cy="260" r="210" fill="#E8F4FD" stroke="#4A90D9" stroke-width="6"/>
        <text x="530" y="80" text-anchor="middle" class="label">Host Cell (T-Lymphocyte / Hepatocyte)</text>
        <text x="530" y="100" text-anchor="middle" class="sci-text">Cytoplasm</text>

        <!-- Host Cell Nucleus -->
        <circle cx="530" cy="260" r="75" fill="#2C3E50" stroke="#4A90D9" stroke-width="2"/>
        <text x="530" y="264" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#E8F4FD">Nucleus</text>

        <!-- Receptors (CD4/CCR5) -->
        <g id="receptors">
            <!-- Main active receptor -->
            <path class="pulse-receptor" d="M320,260 L305,260 M305,260 L295,252 M305,260 L295,268" stroke="#F39C12" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Secondary receptors -->
            <path d="M325,210 L310,205 M310,205 L302,195 M310,205 L298,212" stroke="#F39C12" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M325,310 L310,315 M310,315 L298,308 M310,315 L302,325" stroke="#F39C12" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>


        <!-- ========================================== -->
        <!-- ANIMATED VIRAL PARTICLES                   -->
        <!-- ========================================== -->

        <!-- Stage 1: Transmission Virions -->
        <use href="#virion-full" class="blood-virion" />
        <use href="#virion-full" class="mucosa-virion" />

        <!-- Stage 2: Attachment & Fusion -->
        <use href="#virion-envelope" class="infecting-envelope" />
        <use href="#virion-capsid" class="infecting-capsid" />

        <!-- Stage 3: Uncoating & Integration -->
        <use href="#virion-genome" class="viral-genome" />

        <!-- Stage 4: Replication & Budding -->
        <use href="#virion-full" class="budding-virion" />


        <!-- ========================================== -->
        <!-- LABELS AND ANNOTATIONS                     -->
        <!-- ========================================== -->

        <!-- Stage 2 Label -->
        <g transform="translate(260, 180)">
            <text x="0" y="0" class="sub-label" font-weight="600">1. Attachment & Fusion</text>
            <polyline points="40,5 40,70" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.5"/>
            <circle cx="40" cy="70" r="2" fill="#2C3E50"/>
        </g>

        <!-- Receptor Label -->
        <text x="210" y="320" class="sci-text">Receptor (e.g., CD4)</text>
        <polyline points="270,310 295,270" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.5"/>

        <!-- Stage 3 Label -->
        <g transform="translate(420, 170)">
            <text x="0" y="0" class="sub-label" font-weight="600">2. Uncoating & Entry</text>
            <polyline points="40,5 40,80" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.5"/>
            <circle cx="40" cy="80" r="2" fill="#2C3E50"/>
        </g>

        <!-- Integration Label -->
        <g transform="translate(530, 360)">
            <text x="0" y="0" text-anchor="middle" class="sub-label" font-weight="600">3. Reverse Transcription</text>
            <text x="0" y="15" text-anchor="middle" class="sub-label" font-weight="600">& Integration</text>
            <polyline points="0,-15 0,-25" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.5"/>
        </g>

        <!-- Stage 4 Label -->
        <g transform="translate(680, 190)">
            <text x="0" y="0" class="sub-label" font-weight="600">4. Budding & Release</text>
            <polyline points="40,5 80,60" stroke="#2C3E50" stroke-width="1" fill="none" opacity="0.5"/>
            <circle cx="80" cy="60" r="2" fill="#2C3E50"/>
        </g>


        <!-- ========================================== -->
        <!-- LEGEND / KEY                               -->
        <!-- ========================================== -->
        <g transform="translate(630, 20)">
            <rect x="0" y="0" width="150" height="95" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="6"/>
            <text x="75" y="18" font-family="Inter" font-size="11" font-weight="700" fill="#2C3E50" text-anchor="middle">KEY</text>
            
            <!-- Viral Genome -->
            <path d="M10,32 Q15,26 20,32 T30,32" stroke="#FF6B6B" fill="none" stroke-width="2"/>
            <text x="38" y="35" font-family="Inter" font-size="11" fill="#2C3E50">Viral Genome</text>
            
            <!-- Viral Proteins -->
            <polygon points="15,46 21,50 21,56 15,60 9,56 9,50" fill="#98D8C8"/>
            <text x="38" y="56" font-family="Inter" font-size="11" fill="#2C3E50">Viral Proteins</text>
            
            <!-- Host Receptors -->
            <path d="M15,82 L15,76 M15,76 L11,71 M15,76 L19,71" stroke="#F39C12" stroke-width="2" fill="none" stroke-linecap="round"/>
            <text x="38" y="77" font-family="Inter" font-size="11" fill="#2C3E50">Host Receptors</text>
        </g>

    </svg>
</div>

</body>
</html>
