<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Basis of Mutation & DNA Polymorphism</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* CSS Animations */
        .breathing {
            animation: breathe 3s ease-in-out infinite;
        }
        @keyframes breathe {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }

        .allele-a-move {
            animation: moveA 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes moveA {
            0%, 54% { transform: translate(40px, 220px); }
            66%, 95% { transform: translate(40px, 120px); }
            96%, 100% { transform: translate(40px, 220px); }
        }

        .allele-b-move {
            animation: moveB 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes moveB {
            0%, 54% { transform: translate(40px, 220px); }
            66%, 95% { transform: translate(40px, 320px); }
            96%, 100% { transform: translate(40px, 220px); }
        }

        .fade-out-mutation {
            animation: fadeOutMut 12s linear infinite;
        }
        @keyframes fadeOutMut {
            0%, 24% { opacity: 1; }
            25%, 95% { opacity: 0; }
            96%, 100% { opacity: 1; }
        }

        .fade-in-mutation {
            animation: fadeInMut 12s linear infinite;
        }
        @keyframes fadeInMut {
            0%, 24% { opacity: 0; }
            25%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .fade-in-expansion {
            animation: fadeInExp 12s linear infinite;
        }
        @keyframes fadeInExp {
            0%, 33% { opacity: 0; }
            45%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .spark-anim {
            animation: spark 12s ease-out infinite;
            transform-origin: center;
        }
        @keyframes spark {
            0%, 24% { opacity: 0; transform: scale(0); }
            25% { opacity: 1; transform: scale(1.5); }
            30%, 100% { opacity: 0; transform: scale(0); }
        }

        .allele-label {
            animation: showLabel 12s ease-in-out infinite;
        }
        @keyframes showLabel {
            0%, 54% { opacity: 0; }
            66%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .snp-callout {
            animation: showSNP 12s ease-in-out infinite;
        }
        @keyframes showSNP {
            0%, 24% { opacity: 0; }
            25%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .band-a {
            animation: bandA 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes bandA {
            0%, 74% { opacity: 0; transform: translateY(110px); }
            75% { opacity: 1; transform: translateY(110px); }
            91%, 95% { opacity: 1; transform: translateY(380px); }
            96%, 100% { opacity: 0; transform: translateY(110px); }
        }

        .band-b {
            animation: bandB 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes bandB {
            0%, 74% { opacity: 0; transform: translateY(110px); }
            75% { opacity: 1; transform: translateY(110px); }
            91%, 95% { opacity: 1; transform: translateY(220px); }
            96%, 100% { opacity: 0; transform: translateY(110px); }
        }

        .gel-text {
            animation: showGelText 12s ease-in-out infinite;
        }
        @keyframes showGelText {
            0%, 74% { opacity: 0; }
            75%, 95% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="svg-container">
        <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated diagram showing DNA mutation leading to polymorphism and its application in DNA fingerprinting.">
            <title>Molecular Basis of Mutation & DNA Polymorphism</title>
            <desc>An animation demonstrating how a single nucleotide polymorphism (SNP) and subsequent sequence expansion create different alleles, which migrate differently during gel electrophoresis.</desc>
            
            <defs>
                <!-- Glow Filter for Gel Bands -->
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="2" result="blur" />
                    <feMerge>
                        <feMergeNode in="blur" />
                        <feMergeNode in="SourceGraphic" />
                    </feMerge>
                </filter>

                <!-- Gel Background Gradient -->
                <linearGradient id="gel-grad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#2C3E50"/>
                    <stop offset="50%" stop-color="#34495E"/>
                    <stop offset="100%" stop-color="#2C3E50"/>
                </linearGradient>

                <!-- Base Pair Definitions -->
                <!-- Adenine (A) = #FFD700, Thymine (T) = #4A90D9 -->
                <g id="bp-A-T">
                    <rect x="-4" y="0" width="8" height="18" fill="#FFD700" rx="2"/>
                    <rect x="-4" y="22" width="8" height="18" fill="#4A90D9" rx="2"/>
                    <!-- Hydrogen Bonds (2 for A-T) -->
                    <line x1="-2" y1="18" x2="-2" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="2" y1="18" x2="2" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <text x="0" y="10" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">A</text>
                    <text x="0" y="32" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="middle">T</text>
                </g>

                <g id="bp-T-A">
                    <rect x="-4" y="0" width="8" height="18" fill="#4A90D9" rx="2"/>
                    <rect x="-4" y="22" width="8" height="18" fill="#FFD700" rx="2"/>
                    <line x1="-2" y1="18" x2="-2" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="2" y1="18" x2="2" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <text x="0" y="10" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="middle">T</text>
                    <text x="0" y="32" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">A</text>
                </g>

                <!-- Cytosine (C) = #E74C3C, Guanine (G) = #2ECC71 -->
                <g id="bp-C-G">
                    <rect x="-4" y="0" width="8" height="18" fill="#E74C3C" rx="2"/>
                    <rect x="-4" y="22" width="8" height="18" fill="#2ECC71" rx="2"/>
                    <!-- Hydrogen Bonds (3 for C-G) -->
                    <line x1="-3" y1="18" x2="-3" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="0" y1="18" x2="0" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="3" y1="18" x2="3" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <text x="0" y="10" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="middle">C</text>
                    <text x="0" y="32" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">G</text>
                </g>

                <g id="bp-G-C">
                    <rect x="-4" y="0" width="8" height="18" fill="#2ECC71" rx="2"/>
                    <rect x="-4" y="22" width="8" height="18" fill="#E74C3C" rx="2"/>
                    <line x1="-3" y1="18" x2="-3" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="0" y1="18" x2="0" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <line x1="3" y1="18" x2="3" y2="22" stroke="#2C3E50" stroke-width="1" opacity="0.5"/>
                    <text x="0" y="10" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#000" text-anchor="middle" dominant-baseline="middle">G</text>
                    <text x="0" y="32" font-family="Roboto Mono" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle" dominant-baseline="middle">C</text>
                </g>

                <!-- VNTR Repeat Unit (GATA) -->
                <g id="repeat-GATA">
                    <use href="#bp-G-C" x="0" y="0"/>
                    <use href="#bp-A-T" x="20" y="0"/>
                    <use href="#bp-T-A" x="40" y="0"/>
                    <use href="#bp-A-T" x="60" y="0"/>
                </g>
            </defs>

            <!-- Background -->
            <rect width="100%" height="100%" fill="#f8f9fa"/>

            <!-- Title -->
            <text x="400" y="40" font-family="Inter" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">Molecular Basis of Mutation &amp; DNA Polymorphism</text>
            <text x="400" y="60" font-family="Inter" font-size="14" text-anchor="middle" fill="#7F8C8D">How sequence variation creates unique DNA fingerprints</text>

            <!-- Main Animation Area -->
            <g class="breathing">
                
                <!-- ALLELE A (Standard - 4 Repeats) -->
                <g class="allele-a-move">
                    <!-- VNTR Bracket -->
                    <path d="M 40 -15 L 40 -25 L 355 -25 L 355 -15" fill="none" stroke="#2C3E50" stroke-width="2"/>
                    <text x="197" y="-35" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Variable Number Tandem Repeats (VNTR)</text>
                    
                    <!-- Label -->
                    <text class="allele-label" x="-10" y="20" font-family="Inter" font-size="14" font-weight="bold" fill="#3498DB" text-anchor="end" dominant-baseline="middle">Allele A</text>
                    <text class="allele-label" x="-10" y="35" font-family="Inter" font-size="10" fill="#7F8C8D" text-anchor="end">(4 Repeats)</text>

                    <!-- Backbones -->
                    <line x1="-15" y1="0" x2="395" y2="0" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                    <line x1="-15" y1="40" x2="395" y2="40" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                    
                    <!-- Directionality Labels -->
                    <text x="-25" y="4" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B" text-anchor="end">5'</text>
                    <text x="-25" y="44" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B" text-anchor="end">3'</text>
                    <text x="405" y="4" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B">3'</text>
                    <text x="405" y="44" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B">5'</text>
                    
                    <!-- Left Flank -->
                    <use href="#bp-T-A" x="0" y="0"/>
                    <use href="#bp-C-G" x="20" y="0"/>
                    
                    <!-- 4 Repeats -->
                    <use href="#repeat-GATA" x="40" y="0"/>
                    <use href="#repeat-GATA" x="120" y="0"/>
                    <use href="#repeat-GATA" x="200" y="0"/>
                    <use href="#repeat-GATA" x="280" y="0"/>
                    
                    <!-- Right Flank -->
                    <use href="#bp-C-G" x="360" y="0"/>
                    <use href="#bp-G-C" x="380" y="0"/>
                </g>

                <!-- ALLELE B (Mutated & Expanded - 6 Repeats) -->
                <g class="allele-b-move">
                    <!-- Label -->
                    <text class="allele-label" x="-10" y="20" font-family="Inter" font-size="14" font-weight="bold" fill="#E74C3C" text-anchor="end" dominant-baseline="middle">Allele B</text>
                    <text class="allele-label" x="-10" y="35" font-family="Inter" font-size="10" fill="#7F8C8D" text-anchor="end">(6 Repeats)</text>

                    <!-- Backbones (Animated Expansion) -->
                    <line x1="-15" y1="0" x2="395" y2="0" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round">
                        <animate attributeName="x2" values="395; 395; 555; 555; 395" keyTimes="0; 0.333; 0.458; 0.958; 1" dur="12s" repeatCount="indefinite"/>
                    </line>
                    <line x1="-15" y1="40" x2="395" y2="40" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round">
                        <animate attributeName="x2" values="395; 395; 555; 555; 395" keyTimes="0; 0.333; 0.458; 0.958; 1" dur="12s" repeatCount="indefinite"/>
                    </line>
                    
                    <!-- Directionality Labels -->
                    <text x="-25" y="4" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B" text-anchor="end">5'</text>
                    <text x="-25" y="44" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B" text-anchor="end">3'</text>
                    
                    <!-- Right Flank & Labels (Animated Translation) -->
                    <g>
                        <animateTransform attributeName="transform" type="translate" values="0 0; 0 0; 160 0; 160 0; 0 0" keyTimes="0; 0.333; 0.458; 0.958; 1" dur="12s" repeatCount="indefinite"/>
                        <text x="405" y="4" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B">3'</text>
                        <text x="405" y="44" font-family="Inter" font-size="12" font-weight="bold" fill="#FF6B6B">5'</text>
                        <use href="#bp-C-G" x="360" y="0"/>
                        <use href="#bp-G-C" x="380" y="0"/>
                    </g>
                    
                    <!-- Left Flank & Repeats 1, 2, 4 (Static relative to group) -->
                    <use href="#bp-T-A" x="0" y="0"/>
                    <use href="#bp-C-G" x="20" y="0"/>
                    <use href="#repeat-GATA" x="40" y="0"/>
                    <use href="#repeat-GATA" x="120" y="0"/>
                    <use href="#repeat-GATA" x="280" y="0"/>
                    
                    <!-- Repeat 3 (Contains the SNP Mutation) -->
                    <g transform="translate(200, 0)">
                        <!-- Original G-C Base Pair -->
                        <g class="fade-out-mutation">
                            <use href="#bp-G-C" x="0" y="0"/>
                        </g>
                        <!-- Mutated T-A Base Pair -->
                        <g class="fade-in-mutation">
                            <use href="#bp-T-A" x="0" y="0"/>
                        </g>
                        <use href="#bp-A-T" x="20" y="0"/>
                        <use href="#bp-T-A" x="40" y="0"/>
                        <use href="#bp-A-T" x="60" y="0"/>
                    </g>
                    
                    <!-- Inserted Repeats 5 & 6 (Expansion) -->
                    <g class="fade-in-expansion">
                        <use href="#repeat-GATA" x="360" y="0"/>
                        <use href="#repeat-GATA" x="440" y="0"/>
                    </g>

                    <!-- Mutation Spark Effect -->
                    <g class="spark-anim" transform="translate(200, 20)">
                        <circle cx="0" cy="0" r="18" fill="#F39C12" opacity="0.6" filter="blur(2px)"/>
                        <path d="M 0 -25 L 6 -6 L 25 0 L 6 6 L 0 25 L -6 6 L -25 0 L -6 -6 Z" fill="#FFD700"/>
                        <circle cx="0" cy="0" r="8" fill="#FFF"/>
                    </g>

                    <!-- SNP Callout -->
                    <g class="snp-callout">
                        <line x1="200" y1="45" x2="160" y2="80" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4"/>
                        <text x="160" y="95" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#E74C3C">Single Nucleotide Polymorphism (SNP)</text>
                    </g>
                </g>
            </g>

            <!-- Gel Electrophoresis Panel -->
            <g id="gel-electrophoresis">
                <!-- Gel Box -->
                <rect x="620" y="80" width="140" height="360" rx="8" fill="url(#gel-grad)" stroke="#1A252F" stroke-width="4"/>
                
                <!-- Wells -->
                <rect x="640" y="95" width="40" height="12" fill="#1A252F" rx="3"/>
                <rect x="700" y="95" width="40" height="12" fill="#1A252F" rx="3"/>
                
                <!-- Electrodes / Labels -->
                <text x="690" y="70" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#2C3E50">Negative Cathode (-)</text>
                <text x="690" y="460" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#E74C3C">Positive Anode (+)</text>
                
                <!-- Lane Labels -->
                <text x="660" y="120" font-family="Inter" text-anchor="middle" font-size="11" font-weight="bold" fill="#E8F4FD">Allele A</text>
                <text x="720" y="120" font-family="Inter" text-anchor="middle" font-size="11" font-weight="bold" fill="#E8F4FD">Allele B</text>
                
                <!-- DNA Bands -->
                <rect class="band-a" x="640" y="0" width="40" height="8" fill="#98D8C8" rx="2" filter="url(#glow)"/>
                <rect class="band-b" x="700" y="0" width="40" height="8" fill="#98D8C8" rx="2" filter="url(#glow)"/>

                <!-- Educational Text -->
                <text class="gel-text" x="690" y="295" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#F39C12">Polymorphism =</text>
                <text class="gel-text" x="690" y="310" font-family="Inter" text-anchor="middle" font-size="12" font-weight="bold" fill="#F39C12">Basis of Fingerprinting</text>
                
                <!-- Migration Arrows -->
                <g class="gel-text" opacity="0.5">
                    <line x1="630" y1="140" x2="630" y2="420" stroke="#E8F4FD" stroke-width="2" stroke-dasharray="4"/>
                    <polygon points="626,415 634,415 630,425" fill="#E8F4FD"/>
                </g>
            </g>

            <!-- Legend / Key -->
            <g id="legend" transform="translate(20, 450)">
                <rect x="0" y="0" width="12" height="12" fill="#FFD700" rx="2"/>
                <text x="18" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Adenine (A)</text>
                
                <rect x="100" y="0" width="12" height="12" fill="#4A90D9" rx="2"/>
                <text x="118" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Thymine (T)</text>
                
                <rect x="200" y="0" width="12" height="12" fill="#E74C3C" rx="2"/>
                <text x="218" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Cytosine (C)</text>
                
                <rect x="300" y="0" width="12" height="12" fill="#2ECC71" rx="2"/>
                <text x="318" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Guanine (G)</text>
                
                <line x1="400" y1="6" x2="420" y2="6" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round"/>
                <text x="428" y="10" font-family="Inter" font-size="11" fill="#2C3E50">Sugar-Phosphate Backbone</text>
            </g>

        </svg>
    </div>
</body>
</html>
