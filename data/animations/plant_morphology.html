<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anatomy of Dicotyledonous Root</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 20px;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2C3E50;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-family: 'Roboto Mono', monospace;
            font-size: 24px;
            color: #2C3E50;
            margin: 0 0 8px 0;
        }

        p {
            font-size: 14px;
            color: #7F8C8D;
            margin: 0;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* CSS Animations */
        @keyframes xylemPulse {
            0%, 100% { fill: #AED6F1; stroke-width: 2px; }
            50% { fill: #85C1E9; stroke-width: 3px; }
        }

        .xylem-vessel {
            animation: xylemPulse 3s infinite ease-in-out;
        }

        @keyframes waterFade {
            0% { opacity: 0; transform: scale(0.5); }
            3% { opacity: 1; transform: scale(1); }
            80% { opacity: 1; transform: scale(1); }
            85% { opacity: 0; transform: scale(1.5); }
            100% { opacity: 0; transform: scale(1.5); }
        }

        .water-molecule {
            transform-origin: center;
            animation: waterFade 10s infinite linear;
        }

        .delay-1 { animation-delay: 3.33s; }
        .delay-2 { animation-delay: 6.66s; }

        .label-text {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            fill: #2C3E50;
        }

        .label-title {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            fill: #2C3E50;
        }
        
        .path-label-apoplast { fill: #9B59B6; font-weight: 600; }
        .path-label-symplast { fill: #2980B9; font-weight: 600; }
        .casparian-label { fill: #A93226; font-weight: 600; }

    </style>
</head>
<body>

    <header>
        <h1>Anatomy of Dicotyledonous Root (Sunflower)</h1>
        <p>Transverse Section (T.S.) showing Exarch Xylem and Radial Water Transport Pathways</p>
    </header>

    <div class="svg-container">
        <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Arrowhead for labels -->
                <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" />
                </marker>
                
                <!-- Casparian Strip Pattern -->
                <pattern id="casparian-pattern" width="4" height="4" patternUnits="userSpaceOnUse">
                    <line x1="0" y1="0" x2="0" y2="4" stroke="#A93226" stroke-width="2" />
                </pattern>
            </defs>

            <!-- BACKGROUND TISSUES -->
            <g id="tissues">
                
                <!-- Epiblema & Root Hair -->
                <g id="epiblema" fill="#E8F4FD" stroke="#2ECC71" stroke-width="2">
                    <rect x="150" y="100" width="30" height="60" />
                    <rect x="150" y="160" width="30" height="60" />
                    <rect x="150" y="220" width="30" height="40" />
                    <!-- Root Hair Cell (Unicellular extension) -->
                    <path d="M 180 260 L 150 260 L 150 275 L 20 275 A 12 12 0 0 0 20 299 L 150 299 L 150 340 L 180 340 Z" stroke-linejoin="round" />
                    <rect x="150" y="340" width="30" height="60" />
                    <rect x="150" y="400" width="30" height="60" />
                    <rect x="150" y="460" width="30" height="60" />
                </g>

                <!-- Cortex (Parenchyma cells with intercellular spaces) -->
                <g id="cortex" fill="#E8F4FD" stroke="#2ECC71" stroke-width="2">
                    <!-- Column 1 -->
                    <circle cx="220" cy="130" r="26" /><circle cx="220" cy="185" r="26" /><circle cx="220" cy="240" r="26" />
                    <circle cx="220" cy="295" r="26" /><circle cx="220" cy="350" r="26" /><circle cx="220" cy="405" r="26" /><circle cx="220" cy="460" r="26" />
                    <!-- Column 2 -->
                    <circle cx="275" cy="155" r="26" /><circle cx="275" cy="210" r="26" /><circle cx="275" cy="265" r="26" />
                    <circle cx="275" cy="320" r="26" /><circle cx="275" cy="375" r="26" /><circle cx="275" cy="430" r="26" />
                    <!-- Column 3 -->
                    <circle cx="330" cy="180" r="26" /><circle cx="330" cy="235" r="26" /><circle cx="330" cy="290" r="26" />
                    <circle cx="330" cy="345" r="26" /><circle cx="330" cy="400" r="26" />
                    <!-- Column 4 -->
                    <circle cx="385" cy="205" r="26" /><circle cx="385" cy="260" r="26" /><circle cx="385" cy="315" r="26" /><circle cx="385" cy="370" r="26" />
                    <!-- Column 5 -->
                    <circle cx="440" cy="230" r="26" /><circle cx="440" cy="285" r="26" /><circle cx="440" cy="340" r="26" />
                    <!-- Column 6 -->
                    <circle cx="495" cy="255" r="26" /><circle cx="495" cy="310" r="26" /><circle cx="495" cy="365" r="26" />
                    <!-- Column 7 -->
                    <circle cx="545" cy="280" r="26" /><circle cx="545" cy="335" r="26" />
                </g>

                <!-- Endodermis (Barrel-shaped cells) -->
                <g id="endodermis" fill="#E8F4FD" stroke="#2ECC71" stroke-width="2">
                    <rect x="580" y="160" width="30" height="40" rx="4" />
                    <rect x="580" y="200" width="30" height="40" rx="4" />
                    <rect x="580" y="240" width="30" height="40" rx="4" />
                    <rect x="580" y="280" width="30" height="40" rx="4" />
                    <rect x="580" y="320" width="30" height="40" rx="4" />
                    <rect x="580" y="360" width="30" height="40" rx="4" />
                    <rect x="580" y="400" width="30" height="40" rx="4" />
                </g>

                <!-- Casparian Strip (Red bands on radial walls) -->
                <g id="casparian-strip" stroke="#A93226" stroke-width="5" stroke-linecap="round">
                    <line x1="582" y1="200" x2="608" y2="200" />
                    <line x1="582" y1="240" x2="608" y2="240" />
                    <line x1="582" y1="280" x2="608" y2="280" />
                    <line x1="582" y1="320" x2="608" y2="320" />
                    <line x1="582" y1="360" x2="608" y2="360" />
                    <line x1="582" y1="400" x2="608" y2="400" />
                </g>

                <!-- Pericycle -->
                <g id="pericycle" fill="#D4EFDF" stroke="#2ECC71" stroke-width="2">
                    <rect x="615" y="165" width="20" height="30" rx="2" />
                    <rect x="615" y="195" width="20" height="30" rx="2" />
                    <rect x="615" y="225" width="20" height="30" rx="2" />
                    <rect x="615" y="255" width="20" height="30" rx="2" />
                    <rect x="615" y="285" width="20" height="30" rx="2" />
                    <rect x="615" y="315" width="20" height="30" rx="2" />
                    <rect x="615" y="345" width="20" height="30" rx="2" />
                    <rect x="615" y="375" width="20" height="30" rx="2" />
                    <rect x="615" y="405" width="20" height="30" rx="2" />
                </g>

                <!-- Vascular Bundle (Radial Arrangement) -->
                <g id="vascular-bundle">
                    <!-- Xylem (Exarch: Protoxylem outside, Metaxylem inside) -->
                    <g id="xylem" stroke="#2980B9">
                        <!-- Protoxylem -->
                        <circle cx="652" cy="300" r="12" class="xylem-vessel" />
                        <circle cx="682" cy="300" r="16" class="xylem-vessel" />
                        <!-- Metaxylem -->
                        <circle cx="725" cy="300" r="24" class="xylem-vessel" />
                        <circle cx="790" cy="300" r="36" class="xylem-vessel" />
                        <circle cx="880" cy="300" r="48" class="xylem-vessel" />
                    </g>

                    <!-- Phloem (Alternating with Xylem) -->
                    <g id="phloem" fill="#F39C12" stroke="#D68910" stroke-width="1.5">
                        <!-- Upper Phloem Patch -->
                        <circle cx="700" cy="220" r="9" />
                        <circle cx="715" cy="210" r="11" />
                        <circle cx="730" cy="225" r="10" />
                        <circle cx="710" cy="235" r="8" />
                        <circle cx="690" cy="235" r="7" />
                        <circle cx="725" cy="240" r="8" />
                        
                        <!-- Lower Phloem Patch -->
                        <circle cx="700" cy="380" r="9" />
                        <circle cx="715" cy="390" r="11" />
                        <circle cx="730" cy="375" r="10" />
                        <circle cx="710" cy="365" r="8" />
                        <circle cx="690" cy="365" r="7" />
                        <circle cx="725" cy="360" r="8" />
                    </g>
                </g>
            </g>

            <!-- PATHWAY LINES (Dashed visual guides) -->
            <g id="pathway-lines" fill="none" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.6">
                <!-- Apoplastic Pathway Line (Purple) -->
                <path d="M 20 278 L 150 278 L 185 267 L 220 267 L 247 292 L 275 292 L 302 317 L 330 317 L 357 287 L 385 287 L 412 312 L 440 312 L 467 282 L 495 282 L 520 307 L 545 307 L 565 280 L 580 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" stroke="#9B59B6" />
                
                <!-- Symplastic Pathway Line (Blue) -->
                <path d="M 20 300 L 165 300 L 220 295 L 275 320 L 330 290 L 385 315 L 440 285 L 495 310 L 545 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" stroke="#2980B9" />
            </g>

            <!-- ANIMATED WATER MOLECULES -->
            <g id="water-animation">
                <!-- Apoplastic Water Molecules -->
                <g fill="#3498DB">
                    <circle r="5" class="water-molecule">
                        <animateMotion dur="10s" begin="0s" repeatCount="indefinite" path="M 20 278 L 150 278 L 185 267 L 220 267 L 247 292 L 275 292 L 302 317 L 330 317 L 357 287 L 385 287 L 412 312 L 440 312 L 467 282 L 495 282 L 520 307 L 545 307 L 565 280 L 580 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                    <circle r="5" class="water-molecule delay-1">
                        <animateMotion dur="10s" begin="3.33s" repeatCount="indefinite" path="M 20 278 L 150 278 L 185 267 L 220 267 L 247 292 L 275 292 L 302 317 L 330 317 L 357 287 L 385 287 L 412 312 L 440 312 L 467 282 L 495 282 L 520 307 L 545 307 L 565 280 L 580 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                    <circle r="5" class="water-molecule delay-2">
                        <animateMotion dur="10s" begin="6.66s" repeatCount="indefinite" path="M 20 278 L 150 278 L 185 267 L 220 267 L 247 292 L 275 292 L 302 317 L 330 317 L 357 287 L 385 287 L 412 312 L 440 312 L 467 282 L 495 282 L 520 307 L 545 307 L 565 280 L 580 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                </g>

                <!-- Symplastic Water Molecules -->
                <g fill="#3498DB">
                    <circle r="5" class="water-molecule" style="animation-delay: 1.66s;">
                        <animateMotion dur="10s" begin="1.66s" repeatCount="indefinite" path="M 20 300 L 165 300 L 220 295 L 275 320 L 330 290 L 385 315 L 440 285 L 495 310 L 545 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                    <circle r="5" class="water-molecule" style="animation-delay: 5s;">
                        <animateMotion dur="10s" begin="5s" repeatCount="indefinite" path="M 20 300 L 165 300 L 220 295 L 275 320 L 330 290 L 385 315 L 440 285 L 495 310 L 545 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                    <circle r="5" class="water-molecule" style="animation-delay: 8.33s;">
                        <animateMotion dur="10s" begin="8.33s" repeatCount="indefinite" path="M 20 300 L 165 300 L 220 295 L 275 320 L 330 290 L 385 315 L 440 285 L 495 310 L 545 280 L 595 300 L 625 300 L 652 300 L 682 300 L 725 300 L 790 300 L 880 300" />
                    </circle>
                </g>
            </g>

            <!-- LABELS & POINTERS -->
            <g id="labels">
                <!-- Pointer Lines -->
                <g stroke="#7F8C8D" stroke-width="1.5" marker-end="url(#arrow)">
                    <line x1="100" y1="80" x2="160" y2="120" />
                    <line x1="60" y1="220" x2="100" y2="265" />
                    <line x1="350" y1="100" x2="350" y2="160" />
                    <line x1="595" y1="100" x2="595" y2="150" />
                    <line x1="720" y1="120" x2="610" y2="200" stroke="#A93226" />
                    <line x1="720" y1="160" x2="630" y2="200" />
                    <line x1="660" y1="480" x2="660" y2="320" />
                    <line x1="820" y1="480" x2="800" y2="345" />
                    <line x1="800" y1="200" x2="745" y2="220" />
                </g>

                <!-- Text Labels -->
                <text x="100" y="70" class="label-text" text-anchor="middle">Epiblema</text>
                <text x="50" y="210" class="label-text" text-anchor="middle">Root Hair</text>
                <text x="350" y="90" class="label-text" text-anchor="middle">Cortex</text>
                <text x="595" y="90" class="label-text" text-anchor="middle">Endodermis</text>
                <text x="725" y="115" class="label-text casparian-label" text-anchor="start">Casparian Strip</text>
                <text x="725" y="165" class="label-text" text-anchor="start">Pericycle</text>
                <text x="660" y="500" class="label-text" text-anchor="middle">Protoxylem</text>
                <text x="820" y="500" class="label-text" text-anchor="middle">Metaxylem</text>
                <text x="805" y="195" class="label-text" text-anchor="start">Phloem</text>
            </g>

            <!-- LEGEND -->
            <g id="legend" transform="translate(20, 430)">
                <rect x="0" y="0" width="240" height="140" fill="#ffffff" stroke="#BDC3C7" stroke-width="1" rx="6" opacity="0.9" />
                <text x="15" y="25" class="label-title">Key / Legend</text>
                
                <!-- Water -->
                <circle cx="25" cy="45" r="5" fill="#3498DB" />
                <text x="40" y="50" class="label-text">Water Molecule (H₂O)</text>
                
                <!-- Apoplast -->
                <line x1="15" y1="70" x2="35" y2="70" stroke="#9B59B6" stroke-width="3" stroke-dasharray="4,3" />
                <text x="40" y="75" class="label-text path-label-apoplast">Apoplastic Pathway</text>
                <text x="40" y="90" class="label-text" font-size="11" fill="#7F8C8D">(via Cell Walls)</text>
                
                <!-- Symplast -->
                <line x1="15" y1="110" x2="35" y2="110" stroke="#2980B9" stroke-width="3" stroke-dasharray="4,3" />
                <text x="40" y="115" class="label-text path-label-symplast">Symplastic Pathway</text>
                <text x="40" y="130" class="label-text" font-size="11" fill="#7F8C8D">(via Cytoplasm)</text>
            </g>

        </svg>
    </div>

</body>
</html>
