<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metamerism in Annelida</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

  body {
    margin: 0;
    padding: 0;
    background-color: #f8f9fa;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
  }

  .svg-container {
    width: 100%;
    max-width: 1000px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.08);
    background: #ffffff;
    border-radius: 16px;
    overflow: hidden;
    margin: 20px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
  }

  text {
    fill: #2C3E50;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    text-anchor: middle;
  }

  .subtitle {
    font-size: 14px;
    font-weight: 400;
    text-anchor: middle;
    fill: #7F8C8D;
  }

  .label {
    font-size: 12px;
    font-weight: 600;
  }

  .process-note {
    font-size: 13px;
    font-weight: 600;
    text-anchor: middle;
    fill: #34495E;
  }

  .sci {
    font-family: 'Roboto Mono', monospace;
    font-style: italic;
    font-size: 11px;
    fill: #7F8C8D;
  }

  .pointer {
    fill: none;
    stroke: #34495E;
    stroke-width: 1.5;
    stroke-dasharray: 4 2;
  }

  /* 
    Peristaltic Locomotion Animations
    Using exact mathematical translations and scaling to ensure zero gaps between segments.
    Conservation of volume: scaleX * scaleY ≈ 1.
  */
  #seg-1 { animation: wave1 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-origin: 200px 280px; }
  #seg-2 { animation: wave2 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-origin: 300px 280px; }
  #seg-3 { animation: wave3 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-origin: 400px 280px; }
  #seg-4 { animation: wave4 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-origin: 500px 280px; }
  #seg-5 { animation: wave5 4s cubic-bezier(0.45, 0, 0.55, 1) infinite; transform-origin: 600px 280px; }

  @keyframes wave1 {
    0%, 100% { transform: translateX(20px) scale(1, 1); }
    25%      { transform: translateX(0px) scale(1.2, 0.833); }
    50%      { transform: translateX(-20px) scale(1, 1); }
    75%      { transform: translateX(0px) scale(0.8, 1.25); }
  }
  @keyframes wave2 {
    0%, 100% { transform: translateX(10px) scale(0.8, 1.25); }
    25%      { transform: translateX(10px) scale(1, 1); }
    50%      { transform: translateX(-10px) scale(1.2, 0.833); }
    75%      { transform: translateX(-10px) scale(1, 1); }
  }
  @keyframes wave3 {
    0%, 100% { transform: translateX(0px) scale(1, 1); }
    25%      { transform: translateX(0px) scale(0.8, 1.25); }
    50%      { transform: translateX(0px) scale(1, 1); }
    75%      { transform: translateX(0px) scale(1.2, 0.833); }
  }
  @keyframes wave4 {
    0%, 100% { transform: translateX(10px) scale(1.2, 0.833); }
    25%      { transform: translateX(-10px) scale(1, 1); }
    50%      { transform: translateX(-10px) scale(0.8, 1.25); }
    75%      { transform: translateX(10px) scale(1, 1); }
  }
  @keyframes wave5 {
    0%, 100% { transform: translateX(20px) scale(1, 1); }
    25%      { transform: translateX(0px) scale(1.2, 0.833); }
    50%      { transform: translateX(-20px) scale(1, 1); }
    75%      { transform: translateX(0px) scale(0.8, 1.25); }
  }
</style>
</head>
<body>

<div class="svg-container">
  <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Metamerism: True Segmentation in Annelida</title>
    <desc id="svg-desc">An animated longitudinal cross-section of an Annelid worm demonstrating peristaltic locomotion through coordinated metameric muscle contraction.</desc>

    <defs>
      <!-- Gradients for 3D Body Wall Effect -->
      <linearGradient id="body-top" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#D68910"/>
        <stop offset="100%" stop-color="#F39C12"/>
      </linearGradient>
      <linearGradient id="body-bottom" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F39C12"/>
        <stop offset="100%" stop-color="#D68910"/>
      </linearGradient>

      <!-- Pointer Dot Marker -->
      <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
        <circle cx="5" cy="5" r="4" fill="#2C3E50"/>
      </marker>

      <!-- Reusable Base Segment (Metamere) -->
      <g id="base-segment">
        <!-- Coelom (Body Cavity) -->
        <rect x="-50" y="-60" width="100" height="120" fill="#E8F4FD" />
        
        <!-- Septum (Right wall only to prevent double-thickness overlapping) -->
        <line x1="50" y1="-60" x2="50" y2="60" stroke="#BDC3C7" stroke-width="2"/>
        
        <!-- Nephridium (Excretory Organ) -->
        <path d="M -40 10 C -20 10, -30 40, 0 35 C 20 30, 10 45, 30 40 C 40 38, 45 30, 50 30" fill="none" stroke="#9B59B6" stroke-width="2.5"/>
        <circle cx="-40" cy="10" r="2.5" fill="#8E44AD"/>
        
        <!-- Alimentary Canal (Gut) -->
        <rect x="-50" y="-20" width="100" height="40" fill="#D35400"/>
        <!-- Typhlosole / Gut folds -->
        <path d="M -50 -20 Q -25 0 0 -20 T 50 -20" fill="none" stroke="#A04000" stroke-width="2" opacity="0.4"/>
        <path d="M -50 20 Q -25 0 0 20 T 50 20" fill="none" stroke="#A04000" stroke-width="2" opacity="0.4"/>

        <!-- Dorsal Blood Vessel (Arterial) -->
        <rect x="-50" y="-30" width="100" height="8" fill="#E74C3C"/>
        
        <!-- Ventral Blood Vessel (Venous) -->
        <rect x="-50" y="22" width="100" height="8" fill="#3498DB"/>
        
        <!-- Lateral Blood Vessel (Commissural Vessel / Heart) -->
        <path d="M 0 -26 C 25 -10, 25 10, 0 26" fill="none" stroke="#E74C3C" stroke-width="3"/>
        
        <!-- Ventral Nerve Cord & Ganglion -->
        <rect x="-50" y="40" width="100" height="6" fill="#F1C40F"/>
        <ellipse cx="0" cy="43" rx="8" ry="6" fill="#F39C12"/>

        <!-- Body Wall Top (Epidermis + Muscles) -->
        <rect x="-50" y="-80" width="100" height="20" fill="url(#body-top)"/>
        <!-- Circular Muscles (Vertical Rings) -->
        <path d="M -40 -80 v20 M -20 -80 v20 M 0 -80 v20 M 20 -80 v20 M 40 -80 v20" stroke="#D68910" stroke-width="1.5" opacity="0.7"/>
        <!-- Longitudinal Muscles (Horizontal Fibers) -->
        <line x1="-50" y1="-70" x2="50" y2="-70" stroke="#A04000" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8"/>

        <!-- Body Wall Bottom -->
        <rect x="-50" y="60" width="100" height="20" fill="url(#body-bottom)"/>
        <path d="M -40 60 v20 M -20 60 v20 M 0 60 v20 M 20 60 v20 M 40 60 v20" stroke="#D68910" stroke-width="1.5" opacity="0.7"/>
        <line x1="-50" y1="70" x2="50" y2="70" stroke="#A04000" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.8"/>
      </g>
    </defs>

    <!-- Static Header Text -->
    <text x="400" y="40" class="title">Metamerism: True Segmentation in Annelida</text>
    <text x="400" y="65" class="subtitle">Peristaltic locomotion driven by coordinated metameric muscle contraction</text>

    <!-- Animated Annelid Body -->
    <g id="annelid-worm">
      
      <!-- Segment 1 (Anterior / Head) -->
      <g id="seg-1">
        <g transform="translate(200, 280)">
          <!-- Head Caps -->
          <path d="M -50 -60 C -90 -60, -90 60, -50 60 Z" fill="#E8F4FD"/>
          <path d="M -50 -20 C -70 -20, -70 20, -50 20 Z" fill="#D35400"/>
          <path d="M -50 -80 C -110 -80, -110 80, -50 80 L -50 60 C -90 60, -90 -60, -50 -60 Z" fill="#E67E22"/>
          <!-- Mouth Opening -->
          <line x1="-72" y1="0" x2="-50" y2="0" stroke="#A04000" stroke-width="2"/>
          <!-- Left Septum (Only needed for first segment) -->
          <line x1="-50" y1="-60" x2="-50" y2="60" stroke="#BDC3C7" stroke-width="2"/>
          
          <use href="#base-segment"/>
        </g>
      </g>

      <!-- Segment 2 -->
      <g id="seg-2">
        <g transform="translate(300, 280)">
          <use href="#base-segment"/>
        </g>
      </g>

      <!-- Segment 3 (Middle) -->
      <g id="seg-3">
        <g transform="translate(400, 280)">
          <use href="#base-segment"/>
        </g>
      </g>

      <!-- Segment 4 -->
      <g id="seg-4">
        <g transform="translate(500, 280)">
          <use href="#base-segment"/>
        </g>
      </g>

      <!-- Segment 5 (Posterior / Tail) -->
      <g id="seg-5">
        <g transform="translate(600, 280)">
          <use href="#base-segment"/>
          <!-- Tail Caps -->
          <path d="M 50 -60 C 90 -60, 90 60, 50 60 Z" fill="#E8F4FD"/>
          <path d="M 50 -20 C 70 -20, 70 20, 50 20 Z" fill="#D35400"/>
          <path d="M 50 -80 C 110 -80, 110 80, 50 80 L 50 60 C 90 60, 90 -60, 50 -60 Z" fill="#E67E22"/>
          <!-- Anus Opening -->
          <line x1="50" y1="0" x2="72" y2="0" stroke="#A04000" stroke-width="2"/>
        </g>
      </g>

    </g>

    <!-- Annotations and Pointer Lines -->
    <g id="annotations">
      <!-- Circular Muscles -->
      <path d="M 150 130 L 280 195" class="pointer" marker-end="url(#dot)"/>
      <text x="150" y="120" class="label" text-anchor="middle">Circular Muscles</text>
      <text x="150" y="135" class="sci" text-anchor="middle">Contraction elongates segment</text>

      <!-- Longitudinal Muscles -->
      <path d="M 400 130 L 400 205" class="pointer" marker-end="url(#dot)"/>
      <text x="400" y="120" class="label" text-anchor="middle">Longitudinal Muscles</text>
      <text x="400" y="135" class="sci" text-anchor="middle">Contraction shortens segment</text>

      <!-- Septum -->
      <path d="M 550 150 L 450 220" class="pointer" marker-end="url(#dot)"/>
      <text x="550" y="140" class="label" text-anchor="middle">Septum</text>
      <text x="550" y="155" class="sci" text-anchor="middle">Internal segment boundary</text>

      <!-- Nephridium -->
      <path d="M 650 400 L 520 320" class="pointer" marker-end="url(#dot)"/>
      <text x="650" y="415" class="label" text-anchor="middle">Nephridium</text>
      <text x="650" y="430" class="sci" text-anchor="middle">Repeating excretory organ</text>

      <!-- Ventral Nerve Cord -->
      <path d="M 400 420 L 400 325" class="pointer" marker-end="url(#dot)"/>
      <text x="400" y="435" class="label" text-anchor="middle">Ventral Nerve Cord &amp; Ganglion</text>

      <!-- Metamere Bracket -->
      <path d="M 340 370 L 340 380 L 460 380 L 460 370" fill="none" stroke="#2C3E50" stroke-width="2"/>
      <text x="400" y="398" class="label" text-anchor="middle">One Metamere (Segment)</text>
    </g>

    <!-- Legend -->
    <g transform="translate(40, 410)">
      <rect x="0" y="0" width="14" height="14" fill="#E74C3C" rx="3"/>
      <text x="22" y="11" class="label" fill="#7F8C8D">Arterial Blood</text>
      
      <rect x="0" y="24" width="14" height="14" fill="#3498DB" rx="3"/>
      <text x="22" y="35" class="label" fill="#7F8C8D">Venous Blood</text>
      
      <rect x="130" y="0" width="14" height="14" fill="#F1C40F" rx="3"/>
      <text x="152" y="11" class="label" fill="#7F8C8D">Nervous System</text>
      
      <rect x="130" y="24" width="14" height="14" fill="#9B59B6" rx="3"/>
      <text x="152" y="35" class="label" fill="#7F8C8D">Nephridia</text>

      <rect x="260" y="0" width="14" height="14" fill="#D35400" rx="3"/>
      <text x="282" y="11" class="label" fill="#7F8C8D">Alimentary Canal</text>

      <rect x="260" y="24" width="14" height="14" fill="#F39C12" rx="3"/>
      <text x="282" y="35" class="label" fill="#7F8C8D">Animal Tissue</text>
    </g>

    <!-- Footer Note -->
    <text x="400" y="485" class="process-note">Coordinated contraction of muscles allows for independent movement of segments.</text>

  </svg>
</div>

</body>
</html>
