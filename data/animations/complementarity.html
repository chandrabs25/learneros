<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Complementarity: The Logic of Genetic Information Transfer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        svg {
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        /* Animations */
        .top-strand {
            animation: top-strand-anim 12s infinite ease-in-out;
        }
        @keyframes top-strand-anim {
            0%, 10% { transform: translateY(0); opacity: 1; }
            15%, 90% { transform: translateY(-80px); opacity: 0.2; }
            95%, 100% { transform: translateY(0); opacity: 1; }
        }

        .dna-hbonds {
            animation: dna-hbonds-anim 12s infinite;
        }
        @keyframes dna-hbonds-anim {
            0%, 10% { opacity: 1; }
            15%, 90% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }

        .rna-pol {
            animation: rna-pol-anim 12s infinite linear;
        }
        @keyframes rna-pol-anim {
            0%, 15% { opacity: 0; transform: translateX(50px); }
            20% { opacity: 1; transform: translateX(100px); }
            45% { opacity: 1; transform: translateX(650px); }
            50%, 100% { opacity: 0; transform: translateX(700px); }
        }

        .mrna-strand {
            animation: mrna-strand-anim 12s infinite ease-in-out;
        }
        @keyframes mrna-strand-anim {
            0%, 50% { transform: translateY(0); opacity: 1; }
            55%, 90% { transform: translateY(150px); opacity: 1; }
            95%, 100% { transform: translateY(150px); opacity: 0; }
        }

        .mrna-backbone { animation: mbb 12s infinite linear; }
        @keyframes mbb {
            0%, 22% { width: 0; opacity: 0; }
            23% { opacity: 1; width: 50px; }
            45%, 90% { width: 450px; opacity: 1; }
            95%, 100% { width: 450px; opacity: 0; }
        }

        .mrna-label-5 { animation: ml5 12s infinite; }
        @keyframes ml5 { 0%, 22% { opacity: 0; } 23%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        
        .mrna-label-3 { animation: ml3 12s infinite; }
        @keyframes ml3 { 0%, 44% { opacity: 0; } 45%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }

        .mrna-label-text { animation: mlt 12s infinite; }
        @keyframes mlt { 0%, 22% { opacity: 0; } 23%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }

        /* Sequential appearance of mRNA bases */
        .mrna-b0 { animation: mb0 12s infinite; }
        @keyframes mb0 { 0%, 22% { opacity: 0; } 23%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b1 { animation: mb1 12s infinite; }
        @keyframes mb1 { 0%, 24% { opacity: 0; } 25%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b2 { animation: mb2 12s infinite; }
        @keyframes mb2 { 0%, 27% { opacity: 0; } 28%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b3 { animation: mb3 12s infinite; }
        @keyframes mb3 { 0%, 30% { opacity: 0; } 31%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b4 { animation: mb4 12s infinite; }
        @keyframes mb4 { 0%, 33% { opacity: 0; } 34%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b5 { animation: mb5 12s infinite; }
        @keyframes mb5 { 0%, 36% { opacity: 0; } 37%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b6 { animation: mb6 12s infinite; }
        @keyframes mb6 { 0%, 39% { opacity: 0; } 40%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b7 { animation: mb7 12s infinite; }
        @keyframes mb7 { 0%, 41% { opacity: 0; } 42%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }
        .mrna-b8 { animation: mb8 12s infinite; }
        @keyframes mb8 { 0%, 44% { opacity: 0; } 45%, 90% { opacity: 1; } 95%, 100% { opacity: 0; } }

        .trna-complex {
            animation: trna-complex-anim 12s infinite ease-in-out;
        }
        @keyframes trna-complex-anim {
            0%, 50% { opacity: 0; transform: translateY(100px); }
            55% { opacity: 1; transform: translateY(100px); }
            60%, 90% { opacity: 1; transform: translateY(0); }
            95%, 100% { opacity: 0; transform: translateY(50px); }
        }

        .trna-hbonds {
            animation: trna-hbonds-anim 12s infinite;
        }
        @keyframes trna-hbonds-anim {
            0%, 60% { opacity: 0; }
            65%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        .transcription-label {
            animation: process-label-transcription 12s infinite;
        }
        @keyframes process-label-transcription {
            0%, 15% { opacity: 0; }
            20%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .translation-label {
            animation: process-label-translation 12s infinite;
        }
        @keyframes process-label-translation {
            0%, 55% { opacity: 0; }
            60%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        text {
            user-select: none;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Gradients -->
            <linearGradient id="dna-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FF8A8A"/>
                <stop offset="100%" stop-color="#FF5252"/>
            </linearGradient>
            <linearGradient id="rna-grad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#FFBBA0"/>
                <stop offset="100%" stop-color="#FF8A5A"/>
            </linearGradient>

            <!-- Base Shapes (Top/Down pointing) -->
            <g id="A_top">
                <path d="M 0 0 L 50 0 L 50 30 L 25 50 L 0 30 Z" fill="#e74c3c" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="22" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">A</text>
            </g>
            <g id="T_top">
                <path d="M 0 0 L 50 0 L 50 50 L 25 30 L 0 50 Z" fill="#f1c40f" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="22" fill="#2C3E50" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">T</text>
            </g>
            <g id="G_top">
                <path d="M 0 0 L 50 0 L 50 30 A 25 20 0 0 1 0 30 Z" fill="#2ecc71" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="22" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">G</text>
            </g>
            <g id="C_top">
                <path d="M 0 0 L 50 0 L 50 50 A 25 20 0 0 0 0 50 Z" fill="#3498db" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="22" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">C</text>
            </g>
            <g id="U_top">
                <path d="M 0 0 L 50 0 L 50 50 L 25 30 L 0 50 Z" fill="#9b59b6" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="22" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">U</text>
            </g>

            <!-- Base Shapes (Bottom/Up pointing) -->
            <g id="A_bot">
                <path d="M 0 50 L 25 30 L 50 50 L 50 100 L 0 100 Z" fill="#e74c3c" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="82" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">A</text>
            </g>
            <g id="T_bot">
                <path d="M 0 30 L 25 50 L 50 30 L 50 100 L 0 100 Z" fill="#f1c40f" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="82" fill="#2C3E50" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">T</text>
            </g>
            <g id="G_bot">
                <path d="M 0 50 A 25 20 0 0 1 50 50 L 50 100 L 0 100 Z" fill="#2ecc71" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="82" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">G</text>
            </g>
            <g id="C_bot">
                <path d="M 0 30 A 25 20 0 0 0 50 30 L 50 100 L 0 100 Z" fill="#3498db" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="82" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">C</text>
            </g>
            <g id="U_bot">
                <path d="M 0 30 L 25 50 L 50 30 L 50 100 L 0 100 Z" fill="#9b59b6" stroke="#2C3E50" stroke-width="1" />
                <text x="25" y="82" fill="white" text-anchor="middle" font-family="Inter" font-weight="bold" font-size="16">U</text>
            </g>

            <!-- Hydrogen Bonds -->
            <g id="H_bond_2">
                <line x1="15" y1="25" x2="15" y2="55" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="35" y1="25" x2="35" y2="55" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,4" />
            </g>
            <g id="H_bond_3">
                <line x1="10" y1="25" x2="10" y2="55" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="25" y1="25" x2="25" y2="55" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,4" />
                <line x1="40" y1="25" x2="40" y2="55" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="4,4" />
            </g>
        </defs>

        <!-- Static Background & UI -->
        <rect width="100%" height="100%" fill="#f8f9fa" />
        
        <text x="400" y="40" font-family="Inter" font-size="22" font-weight="bold" fill="#2C3E50" text-anchor="middle">Molecular Complementarity: The Logic of Genetic Information Transfer</text>
        
        <!-- Process Labels -->
        <text class="process-label transcription-label" x="400" y="75" font-family="Inter" font-size="18" font-weight="bold" fill="#E74C3C" text-anchor="middle">Transcription (RNA Synthesis)</text>
        <text class="process-label translation-label" x="400" y="75" font-family="Inter" font-size="18" font-weight="bold" fill="#3498DB" text-anchor="middle">Codon-Anticodon Recognition (Translation)</text>

        <!-- Legend -->
        <g transform="translate(620, 60)">
            <rect x="0" y="0" width="160" height="70" fill="white" stroke="#bdc3c7" rx="5" />
            <text x="80" y="20" font-family="Inter" font-size="12" font-weight="bold" fill="#2C3E50" text-anchor="middle">Base Pairing Rules</text>
            <text x="15" y="40" font-family="Roboto Mono" font-size="12" fill="#2C3E50"><tspan fill="#e74c3c">A</tspan> = <tspan fill="#f1c40f">T</tspan> / <tspan fill="#9b59b6">U</tspan></text>
            <text x="15" y="58" font-family="Roboto Mono" font-size="12" fill="#2C3E50"><tspan fill="#2ecc71">G</tspan> ≡ <tspan fill="#3498db">C</tspan></text>
            <line x1="90" y1="30" x2="90" y2="60" stroke="#bdc3c7" />
            <text x="100" y="40" font-family="Inter" font-size="10" fill="#7f8c8d">2 H-Bonds</text>
            <text x="100" y="58" font-family="Inter" font-size="10" fill="#7f8c8d">3 H-Bonds</text>
        </g>

        <!-- DNA Bottom Strand (Template) -->
        <g class="bottom-strand">
            <rect x="175" y="280" width="450" height="15" fill="url(#dna-grad)" rx="5" />
            <text x="155" y="292" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">3'</text>
            <text x="635" y="292" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">5'</text>
            <text x="140" y="292" font-family="Inter" font-size="12" fill="#2C3E50" text-anchor="end" font-weight="bold">Template Strand</text>
            
            <!-- Sequence: 3'- C G T A C G A T C -5' -->
            <use href="#C_bot" x="175" y="180" />
            <use href="#G_bot" x="225" y="180" />
            <use href="#T_bot" x="275" y="180" />
            <use href="#A_bot" x="325" y="180" />
            <use href="#C_bot" x="375" y="180" />
            <use href="#G_bot" x="425" y="180" />
            <use href="#A_bot" x="475" y="180" />
            <use href="#T_bot" x="525" y="180" />
            <use href="#C_bot" x="575" y="180" />
        </g>

        <!-- DNA Hydrogen Bonds -->
        <g class="dna-hbonds">
            <use href="#H_bond_3" x="175" y="180" />
            <use href="#H_bond_3" x="225" y="180" />
            <use href="#H_bond_2" x="275" y="180" />
            <use href="#H_bond_2" x="325" y="180" />
            <use href="#H_bond_3" x="375" y="180" />
            <use href="#H_bond_3" x="425" y="180" />
            <use href="#H_bond_2" x="475" y="180" />
            <use href="#H_bond_2" x="525" y="180" />
            <use href="#H_bond_3" x="575" y="180" />
        </g>

        <!-- DNA Top Strand (Coding) -->
        <g class="top-strand">
            <rect x="175" y="165" width="450" height="15" fill="url(#dna-grad)" rx="5" />
            <text x="155" y="177" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">5'</text>
            <text x="635" y="177" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">3'</text>
            <text x="140" y="177" font-family="Inter" font-size="12" fill="#2C3E50" text-anchor="end" font-weight="bold">Coding Strand</text>

            <!-- Sequence: 5'- G C A T G C T A G -3' -->
            <use href="#G_top" x="175" y="180" />
            <use href="#C_top" x="225" y="180" />
            <use href="#A_top" x="275" y="180" />
            <use href="#T_top" x="325" y="180" />
            <use href="#G_top" x="375" y="180" />
            <use href="#C_top" x="425" y="180" />
            <use href="#T_top" x="475" y="180" />
            <use href="#A_top" x="525" y="180" />
            <use href="#G_top" x="575" y="180" />
        </g>

        <!-- RNA Polymerase Enzyme -->
        <g class="rna-pol" style="pointer-events: none;">
            <ellipse cx="0" cy="230" rx="80" ry="100" fill="rgba(200, 200, 200, 0.3)" stroke="#95a5a6" stroke-width="2" stroke-dasharray="5,5" />
            <text x="0" y="115" fill="#7f8c8d" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle">RNA Polymerase</text>
        </g>

        <!-- mRNA Strand -->
        <g class="mrna-strand">
            <rect class="mrna-backbone" x="175" y="165" width="0" height="15" fill="url(#rna-grad)" rx="5" />
            <text class="mrna-label-5" x="155" y="177" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">5'</text>
            <text class="mrna-label-3" x="635" y="177" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">3'</text>
            <text class="mrna-label-text" x="140" y="177" font-family="Inter" font-size="12" fill="#E74C3C" text-anchor="end" font-weight="bold">mRNA</text>

            <!-- Sequence: 5'- G C A U G C U A G -3' -->
            <use href="#G_top" x="175" y="180" class="mrna-b0" />
            <use href="#C_top" x="225" y="180" class="mrna-b1" />
            <use href="#A_top" x="275" y="180" class="mrna-b2" />
            <use href="#U_top" x="325" y="180" class="mrna-b3" />
            <use href="#G_top" x="375" y="180" class="mrna-b4" />
            <use href="#C_top" x="425" y="180" class="mrna-b5" />
            <use href="#U_top" x="475" y="180" class="mrna-b6" />
            <use href="#A_top" x="525" y="180" class="mrna-b7" />
            <use href="#G_top" x="575" y="180" class="mrna-b8" />
        </g>

        <!-- tRNA Complex -->
        <g class="trna-complex">
            <!-- tRNA H-Bonds -->
            <g class="trna-hbonds">
                <use href="#H_bond_2" x="275" y="330" />
                <use href="#H_bond_2" x="325" y="330" />
                <use href="#H_bond_3" x="375" y="330" />
            </g>

            <!-- Anticodon Bases: 3'- U A C -5' -->
            <use href="#U_bot" x="275" y="330" />
            <use href="#A_bot" x="325" y="330" />
            <use href="#C_bot" x="375" y="330" />

            <!-- tRNA Body -->
            <path d="M 275 430 L 425 430 C 425 460, 450 480, 400 530 C 375 560, 325 560, 300 530 C 250 480, 275 460, 275 430 Z" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
            
            <text x="260" y="420" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">3'</text>
            <text x="440" y="420" font-family="Roboto Mono" font-size="14" font-weight="bold" fill="#2C3E50">5'</text>
            <text x="350" y="480" font-family="Inter" font-size="14" font-weight="bold" fill="#2C3E50" text-anchor="middle">tRNA</text>
            <text x="350" y="500" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">(Anticodon)</text>

            <!-- Amino Acid -->
            <circle cx="350" cy="560" r="25" fill="#F39C12" stroke="#2C3E50" stroke-width="2" />
            <text x="350" y="565" fill="white" font-family="Inter" font-size="14" font-weight="bold" text-anchor="middle">Met</text>
        </g>
    </svg>
</body>
</html>
