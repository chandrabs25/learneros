<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evidence for Evolution: Paleontological Evidence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* --- ANIMATION KEYFRAMES --- */

        /* Species A (Lobe-finned fish) */
        .speciesA { animation: animA 15s infinite ease-in-out; }
        @keyframes animA {
            0% { transform: translate(375px, 110px); opacity: 1; }
            10%, 90% { transform: translate(375px, 400px); opacity: 1; }
            95%, 100% { opacity: 0; transform: translate(375px, 400px); }
        }
        .colorA { animation: colorA 15s infinite; }
        @keyframes colorA {
            0%, 20% { color: #F39C12; }
            35%, 90% { color: #CFD8DC; }
            95%, 100% { color: #CFD8DC; }
        }

        /* Layer 1 (Deepest) */
        .layer1 { animation: revealL1 15s infinite linear; }
        @keyframes revealL1 {
            0%, 20% { clip-path: inset(0 100% 0 0); opacity: 1; }
            35%, 90% { clip-path: inset(0 0 0 0); opacity: 1; }
            95%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        /* Species B (Early Tetrapod) */
        .speciesB { animation: animB 15s infinite ease-in-out; }
        @keyframes animB {
            0%, 39% { opacity: 0; transform: translate(375px, 110px); }
            40% { opacity: 1; transform: translate(375px, 110px); }
            47%, 90% { opacity: 1; transform: translate(375px, 300px); }
            95%, 100% { opacity: 0; transform: translate(375px, 300px); }
        }
        .colorB { animation: colorB 15s infinite; }
        @keyframes colorB {
            0%, 47% { color: #F39C12; }
            60%, 90% { color: #CFD8DC; }
            95%, 100% { color: #CFD8DC; }
        }

        /* Layer 2 (Intermediate) */
        .layer2 { animation: revealL2 15s infinite linear; }
        @keyframes revealL2 {
            0%, 47% { clip-path: inset(0 100% 0 0); opacity: 1; }
            60%, 90% { clip-path: inset(0 0 0 0); opacity: 1; }
            95%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        /* Species C (Teleost Fish) */
        .speciesC { animation: animC 15s infinite ease-in-out; }
        @keyframes animC {
            0%, 59% { opacity: 0; transform: translate(375px, 110px); }
            60% { opacity: 1; transform: translate(375px, 110px); }
            67%, 90% { opacity: 1; transform: translate(375px, 200px); }
            95%, 100% { opacity: 0; transform: translate(375px, 200px); }
        }
        .colorC { animation: colorC 15s infinite; }
        @keyframes colorC {
            0%, 67% { color: #F39C12; }
            80%, 90% { color: #CFD8DC; }
            95%, 100% { color: #CFD8DC; }
        }

        /* Layer 3 (Surface) */
        .layer3 { animation: revealL3 15s infinite linear; }
        @keyframes revealL3 {
            0%, 67% { clip-path: inset(0 100% 0 0); opacity: 1; }
            80%, 90% { clip-path: inset(0 0 0 0); opacity: 1; }
            95%, 100% { opacity: 0; clip-path: inset(0 0 0 0); }
        }

        /* Time Arrow & Scale */
        .timeArrow { animation: animTime 15s infinite ease-in-out; }
        @keyframes animTime {
            0%, 75% { opacity: 0; }
            80%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }

        /* Strata Labels */
        .labelL1 { animation: labelL1 15s infinite ease-out; }
        @keyframes labelL1 {
            0%, 30% { opacity: 0; transform: translateX(10px); }
            35%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }
        .labelL2 { animation: labelL2 15s infinite ease-out; }
        @keyframes labelL2 {
            0%, 55% { opacity: 0; transform: translateX(10px); }
            60%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }
        .labelL3 { animation: labelL3 15s infinite ease-out; }
        @keyframes labelL3 {
            0%, 75% { opacity: 0; transform: translateX(10px); }
            80%, 90% { opacity: 1; transform: translateX(0); }
            95%, 100% { opacity: 0; }
        }

        /* Process Labels */
        .processL1 { animation: pL1 15s infinite; }
        @keyframes pL1 { 0%, 19% { opacity: 0; } 22%, 33% { opacity: 1; } 35%, 100% { opacity: 0; } }
        .permL1 { animation: permL1 15s infinite; }
        @keyframes permL1 { 0%, 24% { opacity: 0; } 27%, 38% { opacity: 1; } 40%, 100% { opacity: 0; } }

        .processL2 { animation: pL2 15s infinite; }
        @keyframes pL2 { 0%, 46% { opacity: 0; } 49%, 58% { opacity: 1; } 60%, 100% { opacity: 0; } }
        .permL2 { animation: permL2 15s infinite; }
        @keyframes permL2 { 0%, 51% { opacity: 0; } 54%, 63% { opacity: 1; } 65%, 100% { opacity: 0; } }

        .processL3 { animation: pL3 15s infinite; }
        @keyframes pL3 { 0%, 66% { opacity: 0; } 69%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
        .permL3 { animation: permL3 15s infinite; }
        @keyframes permL3 { 0%, 71% { opacity: 0; } 74%, 83% { opacity: 1; } 85%, 100% { opacity: 0; } }

    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Animated diagram showing how organisms are buried in sediment layers over time to form fossils.</title>
        <desc>Animation of stratigraphy and permineralization. A lobe-finned fish, an early tetrapod, and a teleost fish sink to the bottom and are successively covered by layers of sediment, turning into fossils.</desc>

        <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
                <polygon points="0 0, 10 3.5, 0 7" fill="#2C3E50" />
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title & Subtitle -->
        <text x="400" y="35" font-family="Inter" font-size="22" font-weight="bold" text-anchor="middle" fill="#2C3E50">Evidence for Evolution: Paleontological Evidence</text>
        <text x="400" y="58" font-family="Inter" font-size="13" text-anchor="middle" fill="#2C3E50">Fossils: Remains of hard parts preserved in sedimentary rocks over millions of years.</text>

        <!-- Water Column -->
        <rect x="150" y="80" width="450" height="370" fill="#E8F4FD" />
        <line x1="150" y1="80" x2="600" y2="80" stroke="#4A90D9" stroke-width="3" />
        <g opacity="0.4" stroke="#4A90D9" stroke-width="2" stroke-linecap="round" fill="none">
            <path d="M 200,100 Q 220,90 240,100 T 280,100" />
            <path d="M 400,120 Q 420,110 440,120 T 480,120" />
            <path d="M 500,90 Q 520,80 540,90 T 580,90" />
        </g>

        <!-- Strata Layers -->
        <!-- Layer 1 (Oldest / Deepest) -->
        <g class="layer1">
            <rect x="150" y="350" width="450" height="100" fill="#8D6E63" stroke="#2C3E50" stroke-width="2" />
            <!-- Sediment Texture -->
            <circle cx="180" cy="370" r="1.5" fill="#5D4037" opacity="0.6"/>
            <circle cx="250" cy="420" r="2" fill="#5D4037" opacity="0.6"/>
            <circle cx="320" cy="390" r="1" fill="#5D4037" opacity="0.6"/>
            <circle cx="400" cy="430" r="2.5" fill="#5D4037" opacity="0.6"/>
            <circle cx="480" cy="360" r="1.5" fill="#5D4037" opacity="0.6"/>
            <circle cx="550" cy="410" r="2" fill="#5D4037" opacity="0.6"/>
        </g>

        <!-- Layer 2 (Intermediate) -->
        <g class="layer2">
            <rect x="150" y="250" width="450" height="100" fill="#A1887F" stroke="#2C3E50" stroke-width="2" />
            <!-- Sand Texture -->
            <circle cx="190" cy="270" r="2" fill="#795548" opacity="0.5"/>
            <circle cx="280" cy="320" r="3" fill="#795548" opacity="0.5"/>
            <circle cx="360" cy="290" r="1.5" fill="#795548" opacity="0.5"/>
            <circle cx="450" cy="330" r="2.5" fill="#795548" opacity="0.5"/>
            <circle cx="520" cy="260" r="2" fill="#795548" opacity="0.5"/>
            <circle cx="580" cy="310" r="3" fill="#795548" opacity="0.5"/>
        </g>

        <!-- Layer 3 (Youngest / Surface) -->
        <g class="layer3">
            <rect x="150" y="150" width="450" height="100" fill="#BCAAA4" stroke="#2C3E50" stroke-width="2" />
            <!-- Limestone Texture -->
            <line x1="170" y1="170" x2="190" y2="170" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
            <line x1="260" y1="220" x2="290" y2="220" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
            <line x1="340" y1="190" x2="360" y2="190" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
            <line x1="430" y1="230" x2="470" y2="230" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
            <line x1="510" y1="160" x2="530" y2="160" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
            <line x1="570" y1="210" x2="590" y2="210" stroke="#8D6E63" stroke-width="2" opacity="0.5"/>
        </g>

        <!-- Organisms / Fossils -->
        <!-- Species A: Lobe-finned fish (Tiktaalik-like) -->
        <g class="speciesA colorA">
            <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Skull -->
                <path d="M -40,0 C -40,-12 -20,-15 -5,-5 L 0,0 L -5,5 C -20,15 -40,12 -40,0 Z" fill="currentColor" />
                <circle cx="-25" cy="-3" r="2.5" fill="#2C3E50" stroke="none" />
                <!-- Spine -->
                <line x1="0" y1="0" x2="60" y2="0" stroke-width="4" stroke-dasharray="5,2" />
                <!-- Ribs -->
                <path d="M 10,0 Q 15,10 10,15 M 20,0 Q 25,10 20,15 M 30,0 Q 35,10 30,15 M 40,0 Q 45,10 40,15" />
                <!-- Pectoral Fin (Fleshy Lobe + Rays) -->
                <path d="M -5,5 L -10,15 L -2,20 L 2,10 Z" fill="currentColor" />
                <path d="M -10,15 L -15,25 M -6,18 L -8,28 M -2,20 L -2,30" />
                <!-- Pelvic Fin -->
                <path d="M 35,0 L 30,10 L 38,12 Z" fill="currentColor" />
                <path d="M 30,10 L 28,18 M 34,11 L 34,19" />
                <!-- Tail -->
                <path d="M 60,0 Q 70,-10 80,0 Q 70,10 60,0 Z" fill="currentColor" />
            </g>
        </g>

        <!-- Species B: Early Tetrapod (Ichthyostega-like) -->
        <g class="speciesB colorB">
            <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Skull -->
                <path d="M -35,0 C -35,-15 -15,-18 -5,-5 L 0,0 L -5,5 C -15,18 -35,15 -35,0 Z" fill="currentColor" />
                <circle cx="-20" cy="-4" r="2.5" fill="#2C3E50" stroke="none" />
                <!-- Spine -->
                <line x1="0" y1="0" x2="55" y2="0" stroke-width="4" stroke-dasharray="4,2" />
                <!-- Ribs (Thicker, overlapping) -->
                <path d="M 5,0 Q 15,15 5,22 M 15,0 Q 25,15 15,22 M 25,0 Q 35,15 25,22 M 35,0 Q 45,15 35,22" stroke-width="3" />
                <!-- Forelimb (Leg with digits) -->
                <polyline points="-5,5 -12,15 -5,25" stroke-width="3" />
                <path d="M -5,25 L -10,32 M -5,25 L -5,33 M -5,25 L 0,32" />
                <!-- Hindlimb -->
                <polyline points="40,0 35,12 42,22" stroke-width="3" />
                <path d="M 42,22 L 38,30 M 42,22 L 42,31 M 42,22 L 46,30" />
                <!-- Tail -->
                <path d="M 55,0 Q 65,-5 75,0 Q 65,5 55,0 Z" fill="currentColor" />
            </g>
        </g>

        <!-- Species C: Teleost Fish (Modern) -->
        <g class="speciesC colorC">
            <g stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- Skull -->
                <path d="M -30,0 C -30,-15 -10,-20 0,-5 L 0,5 C -10,20 -30,15 -30,0 Z" fill="currentColor" />
                <circle cx="-15" cy="-5" r="2.5" fill="#2C3E50" stroke="none" />
                <!-- Spine -->
                <line x1="0" y1="0" x2="50" y2="0" stroke-width="3" stroke-dasharray="3,2" />
                <!-- Ribs (Thin, angled back) -->
                <path d="M 10,0 L 5,15 M 15,0 L 10,15 M 20,0 L 15,15 M 25,0 L 20,15 M 30,0 L 25,15 M 35,0 L 30,15" stroke-width="1.5" />
                <!-- Dorsal Fin Rays -->
                <path d="M 15,0 L 10,-15 M 20,0 L 15,-15 M 25,0 L 20,-15 M 30,0 L 25,-15" stroke-width="1.5" />
                <!-- Pectoral Fin Rays -->
                <path d="M 0,5 L -5,18 M 0,5 L 0,18 M 0,5 L 5,18" stroke-width="1.5" />
                <!-- Tail (Homocercal) -->
                <path d="M 50,0 L 65,-15 L 60,0 L 65,15 Z" fill="currentColor" />
            </g>
        </g>

        <!-- Process Labels (Dynamic) -->
        <!-- Layer 1 -->
        <g class="processL1">
            <rect x="180" y="385" width="110" height="24" rx="4" fill="#2C3E50" opacity="0.85" />
            <text x="235" y="402" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Sedimentation</text>
        </g>
        <g class="permL1">
            <rect x="460" y="385" width="125" height="24" rx="4" fill="#E74C3C" opacity="0.85" />
            <text x="522.5" y="402" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Permineralization</text>
        </g>

        <!-- Layer 2 -->
        <g class="processL2">
            <rect x="180" y="285" width="110" height="24" rx="4" fill="#2C3E50" opacity="0.85" />
            <text x="235" y="302" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Sedimentation</text>
        </g>
        <g class="permL2">
            <rect x="460" y="285" width="125" height="24" rx="4" fill="#E74C3C" opacity="0.85" />
            <text x="522.5" y="302" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Permineralization</text>
        </g>

        <!-- Layer 3 -->
        <g class="processL3">
            <rect x="180" y="185" width="110" height="24" rx="4" fill="#2C3E50" opacity="0.85" />
            <text x="235" y="202" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Sedimentation</text>
        </g>
        <g class="permL3">
            <rect x="460" y="185" width="125" height="24" rx="4" fill="#E74C3C" opacity="0.85" />
            <text x="522.5" y="202" font-family="Inter" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">Permineralization</text>
        </g>

        <!-- Time Arrow & Scale -->
        <g class="timeArrow">
            <line x1="100" y1="450" x2="100" y2="150" stroke="#2C3E50" stroke-width="4" marker-end="url(#arrowhead)" />
            <text x="75" y="300" font-family="Inter" font-size="16" font-weight="bold" fill="#2C3E50" transform="rotate(-90 75 300)" text-anchor="middle">TIME</text>
            <text x="55" y="300" font-family="'Roboto Mono', monospace" font-size="11" fill="#2C3E50" transform="rotate(-90 55 300)" text-anchor="middle">Millions of Years Ago (mya)</text>
            
            <!-- Ticks -->
            <line x1="95" y1="400" x2="105" y2="400" stroke="#2C3E50" stroke-width="2" />
            <text x="90" y="404" font-family="'Roboto Mono', monospace" font-size="12" fill="#2C3E50" text-anchor="end">380</text>
            
            <line x1="95" y1="300" x2="105" y2="300" stroke="#2C3E50" stroke-width="2" />
            <text x="90" y="304" font-family="'Roboto Mono', monospace" font-size="12" fill="#2C3E50" text-anchor="end">360</text>
            
            <line x1="95" y1="200" x2="105" y2="200" stroke="#2C3E50" stroke-width="2" />
            <text x="90" y="204" font-family="'Roboto Mono', monospace" font-size="12" fill="#2C3E50" text-anchor="end">50</text>
        </g>

        <!-- Strata Labels -->
        <g class="labelL1">
            <text x="620" y="395" font-family="Inter" font-size="14" font-weight="bold" fill="#5D4037">Older Strata</text>
            <text x="620" y="415" font-family="Inter" font-size="12" fill="#2C3E50">(Deepest / Oldest)</text>
        </g>
        
        <g class="labelL2">
            <text x="620" y="295" font-family="Inter" font-size="14" font-weight="bold" fill="#5D4037">Intermediate Strata</text>
        </g>
        
        <g class="labelL3">
            <text x="620" y="195" font-family="Inter" font-size="14" font-weight="bold" fill="#5D4037">Younger Strata</text>
            <text x="620" y="215" font-family="Inter" font-size="12" fill="#2C3E50">(Surface)</text>
        </g>

    </svg>
</div>

</body>
</html>
