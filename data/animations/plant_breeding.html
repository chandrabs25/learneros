<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artificial Hybridization in Plant Breeding</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --c-bg: #f8f9fa;
            --c-membrane: #4A90D9;
            --c-nucleus: #2C3E50;
            --c-cyto: #E8F4FD;
            --c-plant: #2ECC71;
            --c-pistil: #1E8449;
            --c-petal: #F39C12;
            --c-anther: #F1C40F;
            --c-pollen: #FFD700;
            --c-forceps: #95A5A6;
            --c-bag: #F5F5DC;
            --c-trait1: #27AE60;
            --c-trait2: #3498DB;
            --c-f1: #E74C3C;
            --anim-dur: 15s;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--c-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 24px; fill: var(--c-nucleus); }
        .subtitle { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #7F8C8D; }
        .label-bold { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 16px; fill: var(--c-nucleus); }
        .label-small { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 12px; }
        .geno-text { font-family: 'Roboto Mono', monospace; font-weight: 700; font-size: 14px; fill: #7F8C8D; }
        .step-text { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; fill: var(--c-membrane); text-anchor: middle; }

        /* Animations */
        .forceps { animation: forceps-anim var(--anim-dur) infinite ease-in-out; }
        .p1-anther-l { animation: anther-l-anim var(--anim-dur) infinite; }
        .p1-anther-r { animation: anther-r-anim var(--anim-dur) infinite; }
        .bag { animation: bag-anim var(--anim-dur) infinite ease-in-out; }
        .pollen { animation: pollen-anim var(--anim-dur) infinite ease-in-out; }
        .ovary { animation: ovary-anim var(--anim-dur) infinite ease-in-out; transform-origin: 0px 0px; }
        .seed { animation: seed-anim var(--anim-dur) infinite ease-in-out; transform-origin: 0px 0px; }
        .f1-plant { animation: f1-anim var(--anim-dur) infinite ease-in-out; transform-origin: 400px 350px; }
        
        .t1 { animation: text1-anim var(--anim-dur) infinite; }
        .t2 { animation: text2-anim var(--anim-dur) infinite; }
        .t3 { animation: text3-anim var(--anim-dur) infinite; }
        .t4 { animation: text4-anim var(--anim-dur) infinite; }
        .t5 { animation: text5-anim var(--anim-dur) infinite; }

        /* Keyframes */
        @keyframes forceps-anim {
            0%, 4% { transform: translate(50px, 50px); opacity: 0; }
            7% { opacity: 1; transform: translate(120px, 100px); }
            10% { transform: translate(175px, 165px); opacity: 1; } /* Left anther */
            11% { transform: translate(175px, 165px) rotate(-5deg); opacity: 1; } /* Clip */
            13% { transform: translate(225px, 165px); opacity: 1; } /* Right anther */
            14% { transform: translate(225px, 165px) rotate(-5deg); opacity: 1; } /* Clip */
            17% { transform: translate(300px, 50px); opacity: 0; }
            100% { opacity: 0; }
        }

        @keyframes anther-l-anim { 0%, 10.5% { opacity: 1; } 11%, 100% { opacity: 0; } }
        @keyframes anther-r-anim { 0%, 13.5% { opacity: 1; } 14%, 100% { opacity: 0; } }

        @keyframes bag-anim {
            0%, 18% { transform: translate(200px, 50px); opacity: 0; }
            19% { opacity: 1; transform: translate(200px, 50px); }
            22%, 33% { transform: translate(200px, 170px); opacity: 1; } /* Bagging 1 */
            36% { transform: translate(200px, 50px); opacity: 0; }
            37%, 53% { transform: translate(200px, 50px); opacity: 0; }
            55% { opacity: 1; transform: translate(200px, 50px); }
            58%, 66% { transform: translate(200px, 170px); opacity: 1; } /* Bagging 2 */
            69%, 100% { transform: translate(200px, 50px); opacity: 0; }
        }

        @keyframes pollen-anim {
            0%, 35% { transform: translate(570px, 170px); opacity: 0; }
            36% { opacity: 1; transform: translate(570px, 170px); }
            46% { transform: translate(200px, 145px); opacity: 1; }
            49%, 100% { opacity: 0; transform: translate(200px, 145px); }
        }

        @keyframes ovary-anim {
            0%, 58% { transform: scale(1); fill: var(--c-pistil); }
            63%, 95% { transform: scale(1.5); fill: #27AE60; }
            100% { transform: scale(1); fill: var(--c-pistil); }
        }

        @keyframes seed-anim {
            0%, 60% { opacity: 0; transform: scale(0); }
            65%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0); }
        }

        @keyframes f1-anim {
            0%, 66% { transform: scale(0); opacity: 0; }
            72%, 95% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        @keyframes text1-anim { 0%, 19.9% {opacity:1} 20%, 100% {opacity:0} }
        @keyframes text2-anim { 0%, 19.9% {opacity:0} 20%, 33.2% {opacity:1} 33.3%, 100% {opacity:0} }
        @keyframes text3-anim { 0%, 33.2% {opacity:0} 33.3%, 53.2% {opacity:1} 53.3%, 100% {opacity:0} }
        @keyframes text4-anim { 0%, 53.2% {opacity:0} 53.3%, 66.5% {opacity:1} 66.6%, 100% {opacity:0} }
        @keyframes text5-anim { 0%, 66.5% {opacity:0} 66.6%, 98% {opacity:1} 98.1%, 100% {opacity:0} }

    </style>
</head>
<body>

<svg viewBox="0 0 800 500" width="100%" height="100%" aria-label="Animated diagram of Artificial Hybridization in Plant Breeding">
    <defs>
        <!-- Leaf Symbol -->
        <g id="leaf">
            <path d="M0,0 Q-25,-35 0,-70 Q25,-35 0,0 Z" fill="var(--c-plant)" stroke="var(--c-pistil)" stroke-width="2"/>
            <path d="M0,0 L0,-65" stroke="var(--c-pistil)" stroke-width="2" fill="none"/>
        </g>

        <!-- Shield Symbol (Disease Resistance) -->
        <g id="shield">
            <path d="M0,0 L15,-5 L30,0 L30,15 Q25,35 15,45 Q5,35 0,15 Z" fill="var(--c-trait2)" stroke="#2980B9" stroke-width="2"/>
            <path d="M8,20 L13,25 L22,12" stroke="#FFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Open Flower Symbol (Bisexual) -->
        <g id="open-flower">
            <!-- Petals -->
            <path d="M0,0 C-40,-20 -50,-60 -20,-70 C-10,-40 5,-20 0,0 Z" fill="var(--c-petal)" stroke="#E67E22" stroke-width="1"/>
            <path d="M0,0 C40,-20 50,-60 20,-70 C10,-40 -5,-20 0,0 Z" fill="var(--c-petal)" stroke="#E67E22" stroke-width="1"/>
            <path d="M0,0 C-20,-50 0,-90 0,-90 C0,-90 20,-50 0,0 Z" fill="var(--c-petal)" stroke="#E67E22" stroke-width="1"/>
            <!-- Pistil -->
            <line x1="0" y1="0" x2="0" y2="-50" stroke="var(--c-pistil)" stroke-width="4"/>
            <circle cx="0" cy="-50" r="4" fill="var(--c-pistil)"/>
            <circle cx="0" cy="0" r="12" fill="var(--c-pistil)"/>
            <!-- Anthers -->
            <line x1="-5" y1="-10" x2="-30" y2="-40" stroke="var(--c-plant)" stroke-width="2"/>
            <circle cx="-30" cy="-40" r="6" fill="var(--c-anther)"/>
            <line x1="5" y1="-10" x2="30" y2="-40" stroke="var(--c-plant)" stroke-width="2"/>
            <circle cx="30" cy="-40" r="6" fill="var(--c-anther)"/>
        </g>

        <!-- Glow Filter for F1 -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Header / Title -->
    <text x="400" y="35" class="title" text-anchor="middle">Plant Breeding: Artificial Hybridization</text>
    <text x="400" y="55" class="subtitle" text-anchor="middle">Creating superior recombinant varieties through controlled cross-pollination</text>

    <!-- Legend -->
    <g transform="translate(620, 15)">
        <rect x="0" y="0" width="160" height="85" rx="6" fill="#FFF" stroke="#BDC3C7" stroke-width="1"/>
        <text x="80" y="18" font-family="Inter" font-size="11" font-weight="700" text-anchor="middle" fill="var(--c-nucleus)">Key Traits</text>
        <line x1="10" y1="25" x2="150" y2="25" stroke="#ECF0F1" stroke-width="1"/>
        
        <use href="#leaf" x="20" y="45" transform="scale(0.25)"/>
        <text x="35" y="42" font-family="Inter" font-size="10" fill="var(--c-trait1)">High Yield (P1)</text>
        
        <use href="#shield" x="12" y="50" transform="scale(0.4)"/>
        <text x="35" y="62" font-family="Inter" font-size="10" fill="var(--c-trait2)">Disease Resist (P2)</text>
        
        <circle cx="18" cy="75" r="3" fill="var(--c-pollen)"/>
        <circle cx="22" cy="72" r="3" fill="var(--c-pollen)"/>
        <text x="35" y="78" font-family="Inter" font-size="10" fill="#D4AC0D">Pollen Grains</text>
    </g>

    <!-- Ground Line -->
    <path d="M40,350 Q200,355 400,350 Q600,345 760,350" stroke="#D35400" stroke-width="3" fill="none" opacity="0.5"/>
    <path d="M170,350 Q200,365 230,350 Z" fill="#A0522D" opacity="0.7"/>
    <path d="M570,350 Q600,365 630,350 Z" fill="#A0522D" opacity="0.7"/>
    <path d="M360,350 Q400,370 440,350 Z" fill="#A0522D" opacity="0.7"/>

    <!-- ========================================== -->
    <!-- PARENT A (FEMALE) - Left Side              -->
    <!-- ========================================== -->
    <g id="parent-a">
        <!-- Stem -->
        <line x1="200" y1="350" x2="200" y2="210" stroke="var(--c-plant)" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Leaves (High Yield = Large/Many) -->
        <use href="#leaf" x="200" y="330" transform="rotate(-50 200 330) scale(1.2)"/>
        <use href="#leaf" x="200" y="300" transform="rotate(50 200 300) scale(1.2)"/>
        <use href="#leaf" x="200" y="260" transform="rotate(-65 200 260) scale(1)"/>
        <use href="#leaf" x="200" y="240" transform="rotate(65 200 240) scale(1)"/>

        <!-- Flower (Emasculated Bud) -->
        <g transform="translate(200, 210)">
            <!-- Receptacle -->
            <path d="M-12,0 Q0,15 12,0 Z" fill="#27AE60"/>
            
            <!-- Back Petal -->
            <path d="M0,0 C-25,-40 0,-85 0,-85 C0,-85 25,-40 0,0 Z" fill="#E67E22" opacity="0.9"/>
            
            <!-- Pistil -->
            <g>
                <line x1="0" y1="0" x2="0" y2="-60" stroke="var(--c-pistil)" stroke-width="4"/>
                <circle cx="0" cy="-60" r="5" fill="var(--c-pistil)"/>
                <circle cx="0" cy="0" r="12" class="ovary"/>
                <ellipse cx="0" cy="0" rx="4" ry="7" fill="#F5F5DC" class="seed"/>
            </g>
            
            <!-- Anthers (Animated to disappear) -->
            <g class="p1-anther-l">
                <line x1="-5" y1="-10" x2="-25" y2="-45" stroke="var(--c-plant)" stroke-width="2"/>
                <circle cx="-25" cy="-45" r="5" fill="var(--c-anther)"/>
            </g>
            <g class="p1-anther-r">
                <line x1="5" y1="-10" x2="25" y2="-45" stroke="var(--c-plant)" stroke-width="2"/>
                <circle cx="25" cy="-45" r="5" fill="var(--c-anther)"/>
            </g>
            
            <!-- Front Petals (Semi-closed bud) -->
            <path d="M0,0 C-35,-10 -30,-55 -10,-65 C-5,-30 5,-10 0,0 Z" fill="var(--c-petal)" opacity="0.85"/>
            <path d="M0,0 C35,-10 30,-55 10,-65 C5,-30 -5,-10 0,0 Z" fill="var(--c-petal)" opacity="0.85"/>
        </g>

        <!-- Labels -->
        <text x="200" y="390" class="label-bold" text-anchor="middle">Parent P1 (♀)</text>
        <text x="200" y="410" class="label-small" fill="var(--c-trait1)" text-anchor="middle">Trait: High Yield</text>
        <text x="200" y="428" class="geno-text" text-anchor="middle">YYrr</text>
    </g>

    <!-- ========================================== -->
    <!-- PARENT B (MALE) - Right Side               -->
    <!-- ========================================== -->
    <g id="parent-b">
        <!-- Stem -->
        <line x1="600" y1="350" x2="600" y2="210" stroke="var(--c-plant)" stroke-width="5" stroke-linecap="round"/>
        
        <!-- Leaves (Normal size) -->
        <use href="#leaf" x="600" y="320" transform="rotate(-50 600 320) scale(0.8)"/>
        <use href="#leaf" x="600" y="280" transform="rotate(50 600 280) scale(0.8)"/>

        <!-- Shield Icon (Disease Resistance) -->
        <use href="#shield" x="615" y="270" transform="scale(0.8)"/>

        <!-- Flower (Fully Open) -->
        <g transform="translate(600, 210)">
            <path d="M-12,0 Q0,15 12,0 Z" fill="#27AE60"/>
            <use href="#open-flower" x="0" y="0"/>
        </g>

        <!-- Labels -->
        <text x="600" y="390" class="label-bold" text-anchor="middle">Parent P2 (♂)</text>
        <text x="600" y="410" class="label-small" fill="var(--c-trait2)" text-anchor="middle">Trait: Disease Resistance</text>
        <text x="600" y="428" class="geno-text" text-anchor="middle">yyRR</text>
    </g>

    <!-- ========================================== -->
    <!-- F1 HYBRID - Center                         -->
    <!-- ========================================== -->
    <g id="f1-hybrid" class="f1-plant">
        <!-- Stem -->
        <line x1="400" y1="350" x2="400" y2="150" stroke="var(--c-plant)" stroke-width="6" stroke-linecap="round"/>
        
        <!-- Leaves (High Yield = Large) -->
        <use href="#leaf" x="400" y="320" transform="rotate(-50 400 320) scale(1.4)"/>
        <use href="#leaf" x="400" y="280" transform="rotate(50 400 280) scale(1.4)"/>
        <use href="#leaf" x="400" y="230" transform="rotate(-65 400 230) scale(1.2)"/>
        <use href="#leaf" x="400" y="190" transform="rotate(65 400 190) scale(1.2)"/>

        <!-- Shield Icon (Disease Resistance) -->
        <use href="#shield" x="420" y="220" transform="scale(0.9)"/>

        <!-- Flower (Fully Open, Glowing) -->
        <g transform="translate(400, 150)" filter="url(#glow)">
            <path d="M-15,0 Q0,18 15,0 Z" fill="#27AE60"/>
            <use href="#open-flower" x="0" y="0" transform="scale(1.2)"/>
        </g>

        <!-- Labels -->
        <text x="400" y="390" class="label-bold" fill="var(--c-f1)" text-anchor="middle">F1 Hybrid</text>
        <text x="400" y="410" class="label-small" fill="var(--c-f1)" text-anchor="middle">Superior Recombinant</text>
        <text x="400" y="428" class="geno-text" fill="var(--c-f1)" text-anchor="middle">YyRr</text>
    </g>

    <!-- ========================================== -->
    <!-- TOOLS & ANIMATED ELEMENTS                  -->
    <!-- ========================================== -->
    
    <!-- Forceps (Emasculation) -->
    <g class="forceps">
        <path d="M0,0 L-8,-50 L-14,-50 L0,-5 Z" fill="var(--c-forceps)"/>
        <path d="M0,0 L8,-50 L14,-50 L0,-5 Z" fill="#7F8C8D"/>
        <circle cx="0" cy="-35" r="2" fill="#BDC3C7"/>
    </g>

    <!-- Butter Paper Bag -->
    <g class="bag">
        <rect x="-35" y="-90" width="70" height="90" rx="5" fill="var(--c-bag)" opacity="0.85" stroke="#D1D1A5" stroke-width="2" stroke-dasharray="4 2"/>
        <path d="M-35,-10 Q0,5 35,-10" stroke="#D1D1A5" stroke-width="2" fill="none"/>
        <path d="M-10,-5 L-20,10 M10,-5 L20,10" stroke="#D1D1A5" stroke-width="2" fill="none"/>
    </g>

    <!-- Pollen Grains -->
    <g class="pollen">
        <circle cx="0" cy="0" r="3" fill="var(--c-pollen)"/>
        <circle cx="6" cy="-4" r="3" fill="var(--c-pollen)"/>
        <circle cx="-4" cy="-6" r="3" fill="var(--c-pollen)"/>
        <circle cx="4" cy="5" r="3" fill="var(--c-pollen)"/>
        <circle cx="-5" cy="4" r="3" fill="var(--c-pollen)"/>
    </g>

    <!-- ========================================== -->
    <!-- DYNAMIC STEP LABELS (Bottom Center)        -->
    <!-- ========================================== -->
    <g transform="translate(400, 465)">
        <rect x="-220" y="-25" width="440" height="40" rx="20" fill="var(--c-cyto)" stroke="var(--c-membrane)" stroke-width="2"/>
        
        <text x="0" y="2" class="step-text t1">Step 1: Emasculation (Removal of Anthers)</text>
        <text x="0" y="2" class="step-text t2">Step 2: Bagging (Preventing Contamination)</text>
        <text x="0" y="2" class="step-text t3">Step 3: Artificial Cross-Pollination</text>
        <text x="0" y="2" class="step-text t4">Step 4: Re-bagging &amp; Seed Development</text>
        <text x="0" y="2" class="step-text t5">Step 5: Selection of Superior F1 Recombinants</text>
    </g>

</svg>

</body>
</html>
