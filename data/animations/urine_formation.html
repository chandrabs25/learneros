<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiology of Urine Formation: The Nephron</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Stage Label Animations */
        .stage-label {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            opacity: 0.3;
            fill: #2C3E50;
            transition: all 0.3s ease;
        }

        .stage-1 { animation: s1 16s infinite; }
        .stage-2 { animation: s2 16s infinite; }
        .stage-3 { animation: s3 16s infinite; }
        .stage-4 { animation: s4 16s infinite; }
        .stage-5 { animation: s5 16s infinite; }

        @keyframes s1 {
            0%, 20% { opacity: 1; fill: #E74C3C; font-weight: 700; transform: scale(1.05); }
            25%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
        }
        @keyframes s2 {
            0%, 15% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
            20%, 50% { opacity: 1; fill: #2ECC71; font-weight: 700; transform: scale(1.05); }
            55%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
        }
        @keyframes s3 {
            0%, 45% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
            50%, 70% { opacity: 1; fill: #3498DB; font-weight: 700; transform: scale(1.05); }
            75%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
        }
        @keyframes s4 {
            0%, 65% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
            70%, 90% { opacity: 1; fill: #9B59B6; font-weight: 700; transform: scale(1.05); }
            95%, 100% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
        }
        @keyframes s5 {
            0%, 85% { opacity: 0.4; fill: #2C3E50; font-weight: 400; transform: scale(1); }
            90%, 100% { opacity: 1; fill: #F1C40F; font-weight: 700; transform: scale(1.05); }
        }

        .anat-label {
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            fill: #555;
            letter-spacing: 0.5px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            fill: #2C3E50;
        }
        
        .subtitle {
            font-size: 14px;
            font-weight: 400;
            fill: #7F8C8D;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svgTitle svgDesc">
        <title id="svgTitle">Physiology of Urine Formation: The Nephron</title>
        <desc id="svgDesc">An animated biological diagram showing the process of urine formation in a human juxtamedullary nephron, including ultrafiltration, selective reabsorption, and secretion.</desc>

        <defs>
            <!-- Capillary Color Gradient (Arterial to Venous) -->
            <linearGradient id="capillaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#E74C3C" />
                <stop offset="50%" stop-color="#9B59B6" />
                <stop offset="100%" stop-color="#3498DB" />
            </linearGradient>

            <!-- Arrow Marker for Flow Direction -->
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D" opacity="0.5"/>
            </marker>

            <!-- ================= ANIMATION PATHS ================= -->
            
            <!-- 1. Filtrate / Urea Path (Yellow - Excreted) -->
            <path id="path_urea" d="M 130 160 L 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 C 290 200, 300 160, 320 160 C 340 160, 340 180, 340 200 L 340 380 C 340 420, 380 420, 380 380 L 380 200 C 380 180, 380 160, 400 160 C 420 160, 430 200, 450 160 C 470 120, 490 200, 510 160 C 530 120, 550 160, 550 180 L 550 480" fill="none"/>

            <!-- 2. Glucose Path (Green - Reabsorbed in PCT) -->
            <path id="path_glucose" d="M 130 160 L 160 160 C 180 160, 190 120, 210 160 C 220 180, 230 180, 240 160 Q 250 130, 265 130 C 270 130, 280 160, 290 190 L 300 220 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" fill="none"/>

            <!-- 3. Water Path 1 (Blue - Reabsorbed in PCT) -->
            <path id="path_water_pct" d="M 130 160 L 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 Q 280 190, 290 205 L 300 220 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" fill="none"/>

            <!-- 4. Water Path 2 (Blue - Reabsorbed in Descending Loop) -->
            <path id="path_water_loop" d="M 130 160 L 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 C 290 200, 300 160, 320 160 C 340 160, 340 180, 340 200 L 340 320 Q 320 320, 300 320 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" fill="none"/>

            <!-- 5. Ion Path 1 (Purple - Reabsorbed in Ascending Loop) -->
            <path id="path_ion_loop" d="M 130 160 L 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 C 290 200, 300 160, 320 160 C 340 160, 340 180, 340 200 L 340 380 C 340 420, 380 420, 380 380 L 380 320 Q 400 320, 420 320 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" fill="none"/>

            <!-- 6. Ion Path 2 (Purple - Secreted in DCT) -->
            <path id="path_ion_dct" d="M 40 150 L 90 150 C 120 120, 160 140, 140 160 C 120 180, 100 150, 130 140 C 160 130, 170 170, 140 180 C 110 190, 100 180, 90 170 L 120 190 L 160 110 L 250 110 C 270 110, 260 150, 240 170 C 220 190, 280 190, 300 220 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 Q 435 150, 450 160 C 470 120, 490 200, 510 160 C 530 120, 550 160, 550 180 L 550 480" fill="none"/>

            <!-- 7. Red Blood Cell Path (Red - Stays in Capillaries) -->
            <path id="path_rbc" d="M 40 150 L 90 150 C 120 120, 160 140, 140 160 C 120 180, 100 150, 130 140 C 160 130, 170 170, 140 180 C 110 190, 100 180, 90 170 L 120 190 L 160 110 L 250 110 C 270 110, 260 150, 240 170 C 220 190, 280 190, 300 220 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" fill="none"/>
            
            <!-- Branch Paths for Collecting Duct -->
            <path id="path_branch1" d="M 510 220 L 550 250 L 550 480" fill="none"/>
            <path id="path_branch2" d="M 590 320 L 550 350 L 550 480" fill="none"/>
        </defs>

        <!-- ================= TITLE & HEADERS ================= -->
        <text x="400" y="40" class="title" text-anchor="middle">Physiology of Urine Formation: The Nephron</text>
        <text x="400" y="60" class="subtitle" text-anchor="middle">Ultrafiltration, Selective Reabsorption, and Secretion</text>

        <!-- ================= BACKGROUND VASCULATURE (Peritubular Capillaries) ================= -->
        <g id="vasculature_background">
            <!-- Capillary Network -->
            <path d="M 250 110 C 270 110, 260 150, 240 170 C 220 190, 280 190, 300 220 L 300 380 C 300 430, 420 430, 420 380 L 420 220 C 420 190, 400 170, 420 140 C 440 110, 480 110, 500 140 C 520 170, 540 140, 560 110 L 620 110" 
                  stroke="url(#capillaryGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        </g>

        <!-- ================= NEPHRON TUBULES ================= -->
        <g id="nephron_tubules">
            <!-- Collecting Duct Branches (Outer Membrane) -->
            <path d="M 510 220 L 550 250 M 590 320 L 550 350 M 510 400 L 550 420" stroke="#4A90D9" stroke-width="20" fill="none" stroke-linecap="round"/>
            
            <!-- Main Tubule (Outer Membrane) -->
            <path d="M 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 C 290 200, 300 160, 320 160 C 340 160, 340 180, 340 200 L 340 380 C 340 420, 380 420, 380 380 L 380 200 C 380 180, 380 160, 400 160 C 420 160, 430 200, 450 160 C 470 120, 490 200, 510 160 C 530 120, 550 160, 550 180 L 550 460" 
                  stroke="#4A90D9" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Bowman's Capsule (Outer Membrane) -->
            <circle cx="130" cy="160" r="40" fill="#E8F4FD" stroke="#4A90D9" stroke-width="6"/>

            <!-- Collecting Duct Branches (Inner Lumen) -->
            <path d="M 510 220 L 550 250 M 590 320 L 550 350 M 510 400 L 550 420" stroke="#E8F4FD" stroke-width="14" fill="none" stroke-linecap="round"/>

            <!-- Main Tubule (Inner Lumen) -->
            <path d="M 160 160 C 180 160, 190 120, 210 160 C 230 200, 250 120, 270 160 C 290 200, 300 160, 320 160 C 340 160, 340 180, 340 200 L 340 380 C 340 420, 380 420, 380 380 L 380 200 C 380 180, 380 160, 400 160 C 420 160, 430 200, 450 160 C 470 120, 490 200, 510 160 C 530 120, 550 160, 550 180 L 550 460" 
                  stroke="#E8F4FD" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Bowman's Capsule (Inner Fill to merge with lumen) -->
            <circle cx="130" cy="160" r="34" fill="#E8F4FD" stroke="none"/>
        </g>

        <!-- ================= FOREGROUND VASCULATURE (Glomerulus & Arterioles) ================= -->
        <g id="vasculature_foreground">
            <!-- Afferent Arteriole (Wider, High Pressure) -->
            <path d="M 40 150 L 90 150" stroke="#E74C3C" stroke-width="12" fill="none" stroke-linecap="round" marker-end="url(#arrow)"/>
            
            <!-- Glomerulus (Capillary Tuft) -->
            <path d="M 90 150 C 120 120, 160 140, 140 160 C 120 180, 100 150, 130 140 C 160 130, 170 170, 140 180 C 110 190, 100 180, 90 170" 
                  stroke="#E74C3C" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Efferent Arteriole (Narrower) -->
            <path d="M 90 170 L 120 190 L 160 110 L 250 110" stroke="#E74C3C" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
        </g>

        <!-- ================= ANIMATED MOLECULES ================= -->
        <g id="molecules">
            <!-- 1. Urea / Nitrogenous Waste (Yellow) - Excreted completely -->
            <g fill="#F1C40F">
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="0s"><mpath href="#path_urea"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="4s"><mpath href="#path_urea"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="8s"><mpath href="#path_urea"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="12s"><mpath href="#path_urea"/></animateMotion></circle>
                <!-- From branches -->
                <circle r="3.5"><animateMotion dur="8s" repeatCount="indefinite" begin="2s"><mpath href="#path_branch1"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="8s" repeatCount="indefinite" begin="6s"><mpath href="#path_branch2"/></animateMotion></circle>
            </g>

            <!-- 2. Glucose / Amino Acids (Green) - 100% Reabsorbed in PCT -->
            <g fill="#2ECC71">
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="1s"><mpath href="#path_glucose"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="5s"><mpath href="#path_glucose"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="9s"><mpath href="#path_glucose"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="13s"><mpath href="#path_glucose"/></animateMotion></circle>
            </g>

            <!-- 3. Water (Blue) - Reabsorbed in PCT and Descending Loop -->
            <g fill="#3498DB">
                <!-- PCT Reabsorption -->
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="2s"><mpath href="#path_water_pct"/></animateMotion></circle>
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="10s"><mpath href="#path_water_pct"/></animateMotion></circle>
                <!-- Loop Reabsorption -->
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="3s"><mpath href="#path_water_loop"/></animateMotion></circle>
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="11s"><mpath href="#path_water_loop"/></animateMotion></circle>
                <!-- Excreted Water -->
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="6s"><mpath href="#path_urea"/></animateMotion></circle>
                <circle r="3"><animateMotion dur="16s" repeatCount="indefinite" begin="14s"><mpath href="#path_urea"/></animateMotion></circle>
            </g>

            <!-- 4. Ions Na+/K+ (Purple) - Reabsorbed in Ascending Loop, Secreted in DCT -->
            <g fill="#9B59B6">
                <!-- Loop Reabsorption -->
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="1.5s"><mpath href="#path_ion_loop"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="9.5s"><mpath href="#path_ion_loop"/></animateMotion></circle>
                <!-- DCT Secretion -->
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="3.5s"><mpath href="#path_ion_dct"/></animateMotion></circle>
                <circle r="3.5"><animateMotion dur="16s" repeatCount="indefinite" begin="11.5s"><mpath href="#path_ion_dct"/></animateMotion></circle>
            </g>

            <!-- 5. Red Blood Cells & Large Proteins (Red) - Too large to filter, stay in blood -->
            <g fill="#C0392B">
                <circle r="5.5"><animateMotion dur="16s" repeatCount="indefinite" begin="0.5s"><mpath href="#path_rbc"/></animateMotion></circle>
                <circle r="5.5"><animateMotion dur="16s" repeatCount="indefinite" begin="4.5s"><mpath href="#path_rbc"/></animateMotion></circle>
                <circle r="5.5"><animateMotion dur="16s" repeatCount="indefinite" begin="8.5s"><mpath href="#path_rbc"/></animateMotion></circle>
                <circle r="5.5"><animateMotion dur="16s" repeatCount="indefinite" begin="12.5s"><mpath href="#path_rbc"/></animateMotion></circle>
            </g>
        </g>

        <!-- ================= LABELS & ANNOTATIONS ================= -->
        <g id="labels">
            <!-- Anatomical Labels (Static) -->
            <text x="45" y="135" class="anat-label">Afferent Arteriole</text>
            <text x="45" y="195" class="anat-label">Efferent Arteriole</text>
            <text x="130" y="220" class="anat-label" text-anchor="middle">Bowman's Capsule</text>
            <text x="130" y="235" class="anat-label" text-anchor="middle">&amp; Glomerulus</text>
            
            <text x="250" y="90" class="anat-label" text-anchor="middle">Proximal Convoluted</text>
            <text x="250" y="105" class="anat-label" text-anchor="middle">Tubule (PCT)</text>
            
            <text x="480" y="90" class="anat-label" text-anchor="middle">Distal Convoluted</text>
            <text x="480" y="105" class="anat-label" text-anchor="middle">Tubule (DCT)</text>
            
            <text x="360" y="445" class="anat-label" text-anchor="middle">Loop of Henle</text>
            
            <text x="630" y="280" class="anat-label">Collecting Duct</text>
            <text x="630" y="105" class="anat-label">To Renal Vein</text>

            <!-- Process Labels (Animated Highlights) -->
            <text x="130" y="110" class="stage-label stage-1" text-anchor="middle">1. Ultrafiltration</text>
            <text x="280" y="250" class="stage-label stage-2" text-anchor="middle">2. Selective Reabsorption</text>
            <text x="360" y="320" class="stage-label stage-3" text-anchor="middle">3. Counter-Current Multiplier</text>
            <text x="480" y="190" class="stage-label stage-4" text-anchor="middle">4. Tubular Secretion</text>
            <text x="550" y="400" class="stage-label stage-5" text-anchor="end">5. Excretion (Urine) →</text>
        </g>

        <!-- ================= LEGEND ================= -->
        <g id="legend" transform="translate(620, 340)">
            <rect x="0" y="0" width="160" height="140" fill="#ffffff" stroke="#E8F4FD" stroke-width="2" rx="8" shadow="0 4px 6px rgba(0,0,0,0.1)"/>
            <text x="80" y="20" font-family="Inter" font-size="12" font-weight="600" fill="#2C3E50" text-anchor="middle">Key / Legend</text>
            
            <circle cx="20" cy="40" r="5.5" fill="#C0392B"/>
            <text x="35" y="44" class="anat-label">Blood Cells/Proteins</text>
            
            <circle cx="20" cy="60" r="4" fill="#3498DB"/>
            <text x="35" y="64" class="anat-label">Water (H₂O)</text>
            
            <circle cx="20" cy="80" r="4" fill="#2ECC71"/>
            <text x="35" y="84" class="anat-label">Glucose/Nutrients</text>
            
            <circle cx="20" cy="100" r="4" fill="#9B59B6"/>
            <text x="35" y="104" class="anat-label">Ions (Na⁺, K⁺, Cl⁻)</text>
            
            <circle cx="20" cy="120" r="4" fill="#F1C40F"/>
            <text x="35" y="124" class="anat-label">Urea/Waste</text>
        </g>

    </svg>
</div>

</body>
</html>
