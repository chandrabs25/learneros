<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autotrophic Nutrition: Photosynthesis Animated Diagram</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px 10px 10px;
            color: #2C3E50;
        }
        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .header p {
            margin: 8px 0 0;
            font-size: 16px;
            color: #555;
        }
        .svg-container {
            width: 100%;
            max-width: 1200px;
            padding: 10px;
            box-sizing: border-box;
        }
        svg {
            width: 100%;
            height: auto;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 1px solid #e9ecef;
        }
        .chem {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
        }
        .sunlight {
            animation: pulse-sun 10s infinite linear;
            transform-origin: 50px 50px;
        }
        @keyframes pulse-sun {
            0%, 20% { opacity: 0; transform: scale(0.95); }
            25%, 45% { opacity: 0.8; transform: scale(1.05); }
            50%, 100% { opacity: 0; transform: scale(0.95); }
        }
        .stoma-pulse {
            animation: breathe 10s infinite ease-in-out;
            transform-origin: 300px 630px;
        }
        @keyframes breathe {
            0%, 100% { transform: scaleX(1); }
            10% { transform: scaleX(1.05); }
            20% { transform: scaleX(1); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Autotrophic Nutrition: Photosynthesis</h1>
        <p>Cellular and Organelle Level (10-second Animation Loop)</p>
    </div>

    <div class="svg-container">
        <svg viewBox="0 0 1000 650" xmlns="http://www.w3.org/2000/svg">
            <title>Autotrophic Nutrition: Photosynthesis Animated Diagram</title>
            <desc>An animated SVG showing the light-dependent and light-independent reactions of photosynthesis inside a mesophyll cell's chloroplast.</desc>

            <defs>
                <!-- Gradients -->
                <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#F39C12" stop-opacity="0.9" />
                    <stop offset="100%" stop-color="#F1C40F" stop-opacity="0" />
                </linearGradient>
                <linearGradient id="cyto-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#E8F4FD" />
                    <stop offset="100%" stop-color="#D6EAF8" />
                </linearGradient>
                
                <!-- Filters -->
                <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.1"/>
                </filter>

                <!-- Symbols for Molecules -->
                <g id="h2o">
                    <circle cx="0" cy="0" r="8" fill="#3498DB" />
                    <circle cx="-6" cy="6" r="5" fill="#AED6F1" />
                    <circle cx="6" cy="6" r="5" fill="#AED6F1" />
                </g>
                <g id="co2">
                    <circle cx="0" cy="0" r="8" fill="#95A5A6" />
                    <circle cx="-11" cy="0" r="6" fill="#E74C3C" />
                    <circle cx="11" cy="0" r="6" fill="#E74C3C" />
                </g>
                <g id="o2">
                    <circle cx="-5" cy="0" r="8" fill="#E74C3C" />
                    <circle cx="5" cy="0" r="8" fill="#E74C3C" />
                </g>
                <g id="glucose">
                    <polygon points="0,-14 12.1,-7 12.1,7 0,14 -12.1,7 -12.1,-7" fill="#F1C40F" stroke="#D4AC0D" stroke-width="2" />
                    <text x="0" y="3" font-size="9" font-family="Inter" font-weight="bold" fill="#7D6608" text-anchor="middle">G</text>
                </g>
                <g id="atp" filter="url(#glow)">
                    <circle cx="0" cy="0" r="7" fill="#FFD700" />
                    <path d="M0,-10 L3,-3 L10,-3 L4,2 L6,9 L0,5 L-6,9 L-4,2 L-10,-3 L-3,-3 Z" fill="#FFF200" />
                </g>

                <!-- Molecule Clusters -->
                <g id="h2o-cluster">
                    <use href="#h2o" x="0" y="0" />
                    <use href="#h2o" x="-18" y="12" />
                    <use href="#h2o" x="10" y="18" />
                </g>
                <g id="co2-cluster">
                    <use href="#co2" x="0" y="0" />
                    <use href="#co2" x="-15" y="15" />
                </g>
                <g id="o2-cluster">
                    <use href="#o2" x="0" y="0" />
                    <use href="#o2" x="-15" y="12" />
                </g>
                <g id="atp-cluster">
                    <use href="#atp" x="0" y="0" />
                    <use href="#atp" x="-15" y="10" />
                    <use href="#atp" x="10" y="15" />
                </g>

                <!-- Thylakoid Granum -->
                <g id="granum">
                    <rect x="-35" y="-22" width="70" height="14" rx="7" fill="#2ECC71" stroke="#1E8449" stroke-width="1.5" />
                    <rect x="-35" y="-10" width="70" height="14" rx="7" fill="#2ECC71" stroke="#1E8449" stroke-width="1.5" />
                    <rect x="-35" y="2" width="70" height="14" rx="7" fill="#2ECC71" stroke="#1E8449" stroke-width="1.5" />
                    <rect x="-35" y="14" width="70" height="14" rx="7" fill="#2ECC71" stroke="#1E8449" stroke-width="1.5" />
                </g>
            </defs>

            <!-- ================= BACKGROUND & CELL STRUCTURE ================= -->
            
            <!-- Mesophyll Cell Wall & Membrane -->
            <path d="M 360 630 L 950 630 A 20 20 0 0 0 970 610 L 970 70 A 20 20 0 0 0 950 50 L 50 50 A 20 20 0 0 0 30 70 L 30 610 A 20 20 0 0 0 50 630 L 240 630" 
                  fill="url(#cyto-grad)" stroke="#4A90D9" stroke-width="6" filter="url(#shadow)"/>
            
            <!-- Central Vacuole (Subtle Background) -->
            <path d="M 350 80 C 600 60, 920 80, 920 250 C 920 450, 850 600, 500 600 C 250 600, 350 350, 350 200 Z" 
                  fill="#D6EAF8" opacity="0.6" stroke="#AED6F1" stroke-width="2"/>
            <text x="800" y="120" fill="#85C1E9" font-size="16" font-weight="600" text-anchor="middle">Central Vacuole</text>

            <!-- Nucleus -->
            <g transform="translate(140, 140)">
                <ellipse cx="0" cy="0" rx="65" ry="45" fill="#2C3E50" opacity="0.9" stroke="#1A252F" stroke-width="2"/>
                <path d="M -30 -10 Q -10 -30 10 -10 T 40 -10 M -40 10 Q -20 -10 0 10 T 30 10" fill="none" stroke="#FF6B6B" stroke-width="3" opacity="0.8"/>
                <text x="0" y="65" fill="#2C3E50" font-size="14" font-weight="600" text-anchor="middle">Nucleus</text>
            </g>

            <!-- Mitochondrion -->
            <g transform="translate(850, 550)">
                <ellipse cx="0" cy="0" rx="45" ry="22" fill="#E74C3C" opacity="0.9" stroke="#C0392B" stroke-width="2"/>
                <path d="M -35 0 Q -25 -15 -15 0 T 5 0 T 25 0 T 35 0" fill="none" stroke="#FADBD8" stroke-width="2.5"/>
                <text x="0" y="38" fill="#C0392B" font-size="14" font-weight="600" text-anchor="middle">Mitochondrion</text>
            </g>

            <!-- Stoma & Guard Cells -->
            <g class="stoma-pulse">
                <!-- Left Guard Cell -->
                <path d="M 240 630 C 240 580, 190 580, 190 630 C 190 680, 240 680, 240 630 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
                <!-- Right Guard Cell -->
                <path d="M 360 630 C 360 580, 410 580, 410 630 C 410 680, 360 680, 360 630 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="3"/>
                <text x="300" y="670" fill="#27AE60" font-size="14" font-weight="600" text-anchor="middle">Stoma</text>
            </g>

            <!-- ================= CHLOROPLAST ================= -->
            
            <g transform="translate(600, 340)">
                <!-- Outer Membrane -->
                <ellipse cx="0" cy="0" rx="350" ry="220" fill="#27AE60" stroke="#1E8449" stroke-width="5" filter="url(#shadow)"/>
                <!-- Inner Membrane & Stroma -->
                <ellipse cx="0" cy="0" rx="335" ry="205" fill="#F9FFF9" stroke="#2ECC71" stroke-width="2"/>
                
                <!-- Stroma Label -->
                <text x="150" y="-160" fill="#27AE60" font-size="18" font-weight="700" text-anchor="middle">Stroma</text>
                <text x="150" y="-140" fill="#27AE60" font-size="14" text-anchor="middle">(Light-Independent / Calvin Cycle)</text>

                <!-- Calvin Cycle Track -->
                <circle cx="150" cy="20" r="100" fill="none" stroke="#A9DFBF" stroke-width="4" stroke-dasharray="10,10"/>
                <!-- Cycle Arrows -->
                <path d="M 250 20 L 265 5 L 235 5 Z" fill="#A9DFBF" transform="rotate(90 250 20)"/>
                <path d="M 50 20 L 65 5 L 35 5 Z" fill="#A9DFBF" transform="rotate(-90 50 20)"/>
                <path d="M 150 -80 L 165 -95 L 135 -95 Z" fill="#A9DFBF" transform="rotate(0 150 -80)"/>
                <path d="M 150 120 L 165 105 L 135 105 Z" fill="#A9DFBF" transform="rotate(180 150 120)"/>

                <!-- Thylakoids (Grana) -->
                <g transform="translate(-180, 0)">
                    <!-- Lamellae (connecting lines) -->
                    <line x1="-20" y1="-80" x2="60" y2="-40" stroke="#2ECC71" stroke-width="5"/>
                    <line x1="0" y1="40" x2="80" y2="80" stroke="#2ECC71" stroke-width="5"/>
                    <line x1="60" y1="-40" x2="-20" y2="40" stroke="#2ECC71" stroke-width="5"/>
                    <line x1="60" y1="-40" x2="80" y2="80" stroke="#2ECC71" stroke-width="5"/>

                    <!-- Grana Stacks -->
                    <use href="#granum" x="-40" y="-80" />
                    <use href="#granum" x="60" y="-40" />
                    <use href="#granum" x="-20" y="40" />
                    <use href="#granum" x="80" y="80" />

                    <!-- Thylakoid Label -->
                    <text x="10" y="150" fill="#1E8449" font-size="18" font-weight="700" text-anchor="middle">Thylakoids</text>
                    <text x="10" y="170" fill="#1E8449" font-size="14" text-anchor="middle">(Light-Dependent Reactions)</text>
                </g>
            </g>

            <text x="600" y="100" fill="#1E8449" font-size="22" font-weight="700" text-anchor="middle" filter="url(#shadow)">CHLOROPLAST</text>

            <!-- ================= ENERGY INPUTS ================= -->
            
            <!-- Sunlight Rays -->
            <g class="sunlight">
                <path d="M 40 40 L 380 220 L 400 190 Z" fill="url(#sun-grad)"/>
                <path d="M 80 20 L 420 180 L 440 150 Z" fill="url(#sun-grad)"/>
                <path d="M 10 80 L 350 260 L 370 230 Z" fill="url(#sun-grad)"/>
                <text x="180" y="120" fill="#D35400" font-size="20" font-weight="700" transform="rotate(28 180 120)">SUNLIGHT</text>
            </g>

            <!-- ================= ANIMATIONS (10s Loop) ================= -->
            
            <!-- Phase 1: Absorption (0s - 2s) -->
            
            <!-- H2O Entering -->
            <g opacity="0">
                <use href="#h2o-cluster" />
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 50 400 C 150 400, 250 340, 400 340" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 1" keyPoints="0; 1; 1" />
            </g>
            <!-- H2O Label -->
            <g opacity="0">
                <text x="0" y="-25" class="chem" fill="#2980B9" font-size="16" font-weight="bold" text-anchor="middle">H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O</text>
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.18; 0.2; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 50 400 C 150 400, 250 340, 400 340" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 1" keyPoints="0; 1; 1" />
            </g>

            <!-- CO2 Entering (Stoma to Stroma) -->
            <g opacity="0">
                <use href="#co2-cluster" />
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.48; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 300 650 C 300 500, 500 400, 650 360" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 1" keyPoints="0; 1; 1" />
            </g>
            <!-- CO2 Label -->
            <g opacity="0">
                <text x="0" y="-25" class="chem" fill="#7F8C8D" font-size="16" font-weight="bold" text-anchor="middle">CO<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
                <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.48; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 300 650 C 300 500, 500 400, 650 360" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 1" keyPoints="0; 1; 1" />
            </g>

            <!-- Phase 2: Light Reaction (2s - 5s) -->
            
            <!-- Photolysis Label Flash -->
            <text x="350" y="260" fill="#E74C3C" font-size="18" font-weight="bold" opacity="0">
                Photolysis (H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O Split)
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.22; 0.35; 0.4; 1" dur="10s" repeatCount="indefinite" />
            </text>

            <!-- O2 Exiting -->
            <g opacity="0">
                <use href="#o2-cluster" />
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.25; 0.48; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 400 340 C 300 340, 200 200, 100 100" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 0.5; 1" keyPoints="0; 0; 1; 1" />
            </g>
            <!-- O2 Label -->
            <g opacity="0">
                <text x="0" y="-25" class="chem" fill="#C0392B" font-size="16" font-weight="bold" text-anchor="middle">O<tspan baseline-shift="sub" font-size="0.7em">2</tspan></text>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.25; 0.48; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 400 340 C 300 340, 200 200, 100 100" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 0.5; 1" keyPoints="0; 0; 1; 1" />
            </g>

            <!-- ATP/NADPH Moving to Stroma -->
            <g opacity="0">
                <use href="#atp-cluster" />
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.2; 0.25; 0.48; 0.5; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 450 340 C 500 340, 550 360, 650 360" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.2; 0.5; 1" keyPoints="0; 0; 1; 1" />
            </g>

            <!-- Phase 3: Calvin Cycle (5s - 8s) -->
            
            <!-- Carbon Fixation Label Flash -->
            <text x="750" y="220" fill="#D35400" font-size="18" font-weight="bold" text-anchor="middle" opacity="0">
                Carbon Fixation
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.5; 0.52; 0.75; 0.8; 1" dur="10s" repeatCount="indefinite" />
            </text>

            <!-- CO2 Circling in Calvin Cycle -->
            <g opacity="0">
                <use href="#co2-cluster" />
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.48; 0.5; 0.78; 0.8; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 650 360 A 100 100 0 1 1 649.9 360" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.5; 0.8; 1" keyPoints="0; 0; 1; 1" />
            </g>
            
            <!-- ATP Circling in Calvin Cycle -->
            <g opacity="0">
                <use href="#atp-cluster" />
                <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.48; 0.5; 0.78; 0.8; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 650 360 A 100 100 0 1 1 649.9 360" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.5; 0.8; 1" keyPoints="0; 0; 1; 1" />
            </g>

            <!-- Phase 4: Synthesis (8s - 10s) -->
            
            <!-- Glucose Exiting -->
            <g opacity="0">
                <use href="#glucose" transform="scale(1.5)" />
                <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.78; 0.8; 0.98; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 850 360 C 900 360, 900 250, 900 150" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.8; 1" keyPoints="0; 0; 1" />
            </g>
            <!-- Glucose Label -->
            <g opacity="0">
                <text x="0" y="-25" class="chem" fill="#B7950B" font-size="16" font-weight="bold" text-anchor="middle">C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">12</tspan>O<tspan baseline-shift="sub" font-size="0.7em">6</tspan></text>
                <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.78; 0.8; 0.98; 1" dur="10s" repeatCount="indefinite" />
                <animateMotion path="M 850 360 C 900 360, 900 250, 900 150" dur="10s" repeatCount="indefinite" calcMode="linear" keyTimes="0; 0.8; 1" keyPoints="0; 0; 1" />
            </g>

            <!-- ================= LEGEND ================= -->
            
            <g transform="translate(760, 20)">
                <rect x="0" y="0" width="220" height="160" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="1.5" opacity="0.95" filter="url(#shadow)"/>
                <text x="110" y="25" fill="#2C3E50" font-size="16" font-weight="700" text-anchor="middle">Legend</text>
                <line x1="20" y1="35" x2="200" y2="35" stroke="#E5E8E8" stroke-width="1"/>
                
                <use href="#h2o" x="30" y="55" />
                <text x="55" y="60" fill="#34495E" font-size="14">Water (H<tspan baseline-shift="sub" font-size="0.7em">2</tspan>O)</text>
                
                <use href="#co2" x="30" y="80" />
                <text x="55" y="85" fill="#34495E" font-size="14">Carbon Dioxide (CO<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)</text>
                
                <use href="#o2" x="30" y="105" />
                <text x="55" y="110" fill="#34495E" font-size="14">Oxygen (O<tspan baseline-shift="sub" font-size="0.7em">2</tspan>)</text>
                
                <use href="#glucose" x="30" y="130" />
                <text x="55" y="135" fill="#34495E" font-size="14">Glucose (Sugar)</text>
                
                <use href="#atp" x="160" y="130" />
                <text x="175" y="135" fill="#34495E" font-size="12">Energy</text>
            </g>

        </svg>
    </div>

</body>
</html>
