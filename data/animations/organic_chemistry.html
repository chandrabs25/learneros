<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Evolution: From Benzene to Pyridine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Typography */
        text {
            font-family: 'Inter', sans-serif;
            fill: #333333;
        }
        .formula {
            font-family: 'Roboto Mono', monospace;
            font-weight: 500;
            fill: #555555;
        }
        .title {
            font-size: 24px;
            font-weight: 700;
        }
        .dyn-label {
            font-size: 18px;
            font-weight: 600;
            text-anchor: middle;
        }
        .legend-text {
            font-size: 12px;
            font-weight: 400;
        }

        /* Static Elements Animation */
        .atom-static {
            animation: fadeStatic 12s ease-in-out infinite;
        }
        @keyframes fadeStatic {
            0%, 5% { opacity: 0; }
            10%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Bonds Animation */
        .bond {
            stroke: #333333;
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }
        .hex-bond {
            stroke-dasharray: 480;
            animation: drawHex 12s ease-in-out infinite;
        }
        @keyframes drawHex {
            0%, 5% { stroke-dashoffset: 480; }
            15%, 95% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 480; }
        }

        .ch-bond {
            stroke-dasharray: 60;
            animation: drawCH 12s ease-in-out infinite;
        }
        @keyframes drawCH {
            0%, 5% { stroke-dashoffset: 60; }
            15%, 95% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: 60; }
        }

        .ch-bond-bottom {
            stroke-dasharray: 60;
            animation: drawCHBottom 12s ease-in-out infinite;
        }
        @keyframes drawCHBottom {
            0%, 5% { stroke-dashoffset: 60; opacity: 1; }
            15%, 25% { stroke-dashoffset: 0; opacity: 1; }
            28%, 95% { stroke-dashoffset: 0; opacity: 0; }
            100% { stroke-dashoffset: 60; opacity: 0; }
        }

        /* Bottom C and H Substitution Animation */
        .atom-bottom {
            animation: fadeBottom 12s ease-in-out infinite;
        }
        @keyframes fadeBottom {
            0%, 5% { opacity: 0; transform: translateY(0); }
            10%, 25% { opacity: 1; transform: translateY(0); }
            28%, 95% { opacity: 0; transform: translateY(15px); }
            100% { opacity: 0; transform: translateY(0); }
        }

        /* Nitrogen Appearance Animation */
        .atom-n-group {
            animation: fadeN 12s ease-in-out infinite;
        }
        @keyframes fadeN {
            0%, 25% { opacity: 0; transform: translateY(15px); }
            30%, 95% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(15px); }
        }

        /* Pi System Animation */
        .pi-ring-group {
            transform-origin: 400px 250px;
            animation: spinPi 12s linear infinite;
        }
        @keyframes spinPi {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .pi-ring-style {
            stroke-width: 3;
            stroke-dasharray: 10 6;
            fill: none;
            animation: piStyle 12s ease-in-out infinite;
        }
        @keyframes piStyle {
            0%, 15% { opacity: 0; filter: drop-shadow(0 0 0px #7209B7); stroke: #7209B7; }
            20%, 75% { opacity: 1; filter: drop-shadow(0 0 0px #7209B7); stroke: #7209B7; }
            80%, 95% { opacity: 1; filter: drop-shadow(0 0 8px #7209B7); stroke: #9d4edd; }
            100% { opacity: 0; filter: drop-shadow(0 0 0px #7209B7); stroke: #7209B7; }
        }

        /* Lone Pair Animation */
        .lone-pair {
            transform-origin: 400px 365px;
            animation: lpAnim 12s ease-in-out infinite;
        }
        @keyframes lpAnim {
            0%, 48% { opacity: 0; transform: scale(0.8); }
            52% { opacity: 1; transform: scale(1); }
            60% { opacity: 1; transform: scale(1.15); }
            68% { opacity: 1; transform: scale(1); }
            75%, 95% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.8); }
        }

        .lp-label {
            animation: lpLabelAnim 12s ease-in-out infinite;
        }
        @keyframes lpLabelAnim {
            0%, 48% { opacity: 0; }
            52%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Resonance Arrows and Electrons */
        .res-arrows {
            animation: arrowAnim 12s ease-in-out infinite;
        }
        @keyframes arrowAnim {
            0%, 74% { opacity: 0; }
            78%, 92% { opacity: 1; }
            96%, 100% { opacity: 0; }
        }

        .electrons {
            transform-origin: 400px 250px;
            animation: elecAnim 12s linear infinite;
        }
        @keyframes elecAnim {
            0%, 74% { opacity: 0; transform: rotate(0deg); }
            78% { opacity: 1; transform: rotate(0deg); }
            92% { opacity: 1; transform: rotate(360deg); }
            96%, 100% { opacity: 0; transform: rotate(360deg); }
        }

        /* Dynamic Labels */
        .lbl-1 { animation: l1 12s infinite; }
        .lbl-2 { animation: l2 12s infinite; }
        .lbl-3 { animation: l3 12s infinite; }
        .lbl-4 { animation: l4 12s infinite; }
        
        @keyframes l1 { 0%, 2% {opacity:0} 5%, 23% {opacity:1} 26%, 100% {opacity:0} }
        @keyframes l2 { 0%, 26% {opacity:0} 29%, 48% {opacity:1} 51%, 100% {opacity:0} }
        @keyframes l3 { 0%, 51% {opacity:0} 54%, 73% {opacity:1} 76%, 100% {opacity:0} }
        @keyframes l4 { 0%, 76% {opacity:0} 79%, 95% {opacity:1} 98%, 100% {opacity:0} }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Molecular Evolution: From Benzene to Pyridine</title>
        <desc>An animated chemical diagram showing the structural and electronic transition from the homocyclic aromatic hydrocarbon Benzene to the heterocyclic compound Pyridine, highlighting the role of the nitrogen lone pair and resonance.</desc>

        <defs>
            <!-- Atom Gradients -->
            <radialGradient id="gradC" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#777777" />
                <stop offset="100%" stop-color="#222222" />
            </radialGradient>
            <radialGradient id="gradH" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#AAAAAA" />
            </radialGradient>
            <radialGradient id="gradN" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#8888FF" />
                <stop offset="100%" stop-color="#1111AA" />
            </radialGradient>
            
            <!-- Functional Group Glow -->
            <radialGradient id="nGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="rgba(68,68,255,0.4)" />
                <stop offset="100%" stop-color="rgba(68,68,255,0)" />
            </radialGradient>

            <!-- Arrow Marker for Resonance -->
            <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 2 L 8 5 L 0 8 z" fill="#F77F00" />
            </marker>
        </defs>

        <!-- Title -->
        <text x="400" y="45" class="title" text-anchor="middle">Organic Chemistry: Heterocycles &amp; Functional Groups</text>

        <!-- Legend -->
        <g transform="translate(630, 360)">
            <rect x="0" y="0" width="140" height="110" rx="6" fill="#f8f9fa" stroke="#e9ecef" stroke-width="2" />
            <circle cx="20" cy="20" r="6" fill="url(#gradC)" />
            <text x="35" y="24" class="legend-text">Carbon (C)</text>
            
            <circle cx="20" cy="40" r="6" fill="url(#gradH)" />
            <text x="35" y="44" class="legend-text">Hydrogen (H)</text>
            
            <circle cx="20" cy="60" r="6" fill="url(#gradN)" />
            <text x="35" y="64" class="legend-text">Nitrogen (N)</text>
            
            <line x1="12" y1="80" x2="28" y2="80" stroke="#7209B7" stroke-width="2" stroke-dasharray="4 2" />
            <text x="35" y="84" class="legend-text">π-System</text>

            <circle cx="20" cy="100" r="4" fill="#F77F00" />
            <text x="35" y="104" class="legend-text">Electron Flow</text>
        </g>

        <!-- MOLECULE GROUP -->
        <g id="molecule">
            
            <!-- Bonds -->
            <polygon points="400,170 469.3,210 469.3,290 400,330 330.7,290 330.7,210" class="bond hex-bond" />
            
            <line x1="400" y1="170" x2="400" y2="110" class="bond ch-bond" />
            <line x1="469.3" y1="210" x2="521.2" y2="180" class="bond ch-bond" />
            <line x1="469.3" y1="290" x2="521.2" y2="320" class="bond ch-bond" />
            <line x1="330.7" y1="290" x2="278.8" y2="320" class="bond ch-bond" />
            <line x1="330.7" y1="210" x2="278.8" y2="180" class="bond ch-bond" />
            
            <!-- Disappearing Bottom Bond -->
            <line x1="400" y1="330" x2="400" y2="390" class="bond ch-bond-bottom" />

            <!-- Pi System (Aromatic Sextet) -->
            <g class="pi-ring-group">
                <circle cx="400" cy="250" r="50" class="pi-ring-style" />
            </g>

            <!-- Resonance Arrows (Stage 4) -->
            <g class="res-arrows">
                <path d="M 400 185 A 65 65 0 0 1 456.3 217.5" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow)" />
                <path d="M 400 185 A 65 65 0 0 1 456.3 217.5" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow)" transform="rotate(120 400 250)" />
                <path d="M 400 185 A 65 65 0 0 1 456.3 217.5" fill="none" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow)" transform="rotate(240 400 250)" />
            </g>

            <!-- Electron Pulses (Stage 4) -->
            <g class="electrons">
                <circle cx="400" cy="200" r="5" fill="#F77F00" />
                <circle cx="400" cy="200" r="5" fill="#F77F00" transform="rotate(120 400 250)" />
                <circle cx="400" cy="200" r="5" fill="#F77F00" transform="rotate(240 400 250)" />
            </g>

            <!-- Static Atoms (C and H) -->
            <circle cx="400" cy="170" r="16" class="atom-static" fill="url(#gradC)" />
            <circle cx="469.3" cy="210" r="16" class="atom-static" fill="url(#gradC)" />
            <circle cx="469.3" cy="290" r="16" class="atom-static" fill="url(#gradC)" />
            <circle cx="330.7" cy="290" r="16" class="atom-static" fill="url(#gradC)" />
            <circle cx="330.7" cy="210" r="16" class="atom-static" fill="url(#gradC)" />

            <circle cx="400" cy="110" r="10" class="atom-static" fill="url(#gradH)" />
            <circle cx="521.2" cy="180" r="10" class="atom-static" fill="url(#gradH)" />
            <circle cx="521.2" cy="320" r="10" class="atom-static" fill="url(#gradH)" />
            <circle cx="278.8" cy="320" r="10" class="atom-static" fill="url(#gradH)" />
            <circle cx="278.8" cy="180" r="10" class="atom-static" fill="url(#gradH)" />

            <!-- Disappearing Bottom Atoms -->
            <circle cx="400" cy="330" r="16" class="atom-bottom" fill="url(#gradC)" />
            <circle cx="400" cy="390" r="10" class="atom-bottom" fill="url(#gradH)" />

            <!-- Appearing Nitrogen Atom -->
            <g class="atom-n-group">
                <circle cx="400" cy="330" r="45" fill="url(#nGlow)" />
                <circle cx="400" cy="330" r="18" fill="url(#gradN)" />
                <text x="400" y="335" font-family="Inter" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="bold">N</text>
            </g>

            <!-- Lone Pair (Stage 3) -->
            <g class="lone-pair">
                <ellipse cx="400" cy="365" rx="14" ry="24" fill="#4444FF" opacity="0.25" />
                <circle cx="392" cy="370" r="4" fill="#4444FF" />
                <circle cx="408" cy="370" r="4" fill="#4444FF" />
            </g>

            <!-- Lone Pair Label -->
            <g class="lp-label">
                <line x1="420" y1="370" x2="460" y2="370" stroke="#555555" stroke-width="1.5" stroke-dasharray="4 2" />
                <text x="465" y="374" font-family="Inter" font-size="14" fill="#333333" font-weight="600">Non-participating Lone Pair (sp<tspan baseline-shift="super" font-size="0.7em">2</tspan>)</text>
            </g>

        </g>

        <!-- Dynamic Labels -->
        <g id="dynamic-labels">
            <text class="dyn-label lbl-1" x="400" y="470">
                Benzene (<tspan class="formula">C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">6</tspan></tspan>): A Homocyclic Aromatic Hydrocarbon
            </text>
            <text class="dyn-label lbl-2" x="400" y="470">
                Pyridine (<tspan class="formula">C<tspan baseline-shift="sub" font-size="0.7em">5</tspan>H<tspan baseline-shift="sub" font-size="0.7em">5</tspan>N</tspan>): A Heterocyclic Compound
            </text>
            <text class="dyn-label lbl-3" x="400" y="470">
                Lone Pair (sp<tspan baseline-shift="super" font-size="0.7em">2</tspan> orbital) - Defines Chemical Reactivity (Basicity)
            </text>
            <text class="dyn-label lbl-4" x="400" y="470">
                Resonance &amp; Delocalization of the π-System
            </text>
        </g>

    </svg>
</div>

</body>
</html>
