<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molecular Architecture of the DNA Double Helix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }
        
        /* Animations */
        @keyframes rotateHelix {
            0% { transform: scaleX(1); }
            10% { transform: scaleX(-1); }
            20% { transform: scaleX(1); }
            100% { transform: scaleX(1); }
        }
        
        @keyframes showZoom {
            0%, 18% { opacity: 0; transform: translateY(10px); }
            22%, 38% { opacity: 1; transform: translateY(0); }
            42%, 100% { opacity: 0; }
        }

        @keyframes pulseBond {
            0%, 100% { stroke: #BDC3C7; stroke-width: 2; }
            50% { stroke: #3498DB; stroke-width: 4; }
        }

        @keyframes mutateLeft {
            0%, 40% { stroke: #E67E22; transform: translateX(0); }
            41%, 43%, 45% { stroke: #E74C3C; transform: translateX(-2px); }
            42%, 44% { stroke: #E74C3C; transform: translateX(2px); }
            46%, 100% { stroke: #3498DB; transform: translateX(0); }
        }

        @keyframes mutateRight {
            0%, 45% { stroke: #2ECC71; }
            46%, 100% { stroke: #F1C40F; }
        }

        @keyframes hideOldBonds {
            0%, 45% { opacity: 1; }
            46%, 100% { opacity: 0; }
        }

        @keyframes showNewBonds {
            0%, 45% { opacity: 0; }
            46%, 100% { opacity: 1; }
        }

        @keyframes showMutLabel {
            0%, 38% { opacity: 0; transform: translateX(-10px); }
            42%, 58% { opacity: 1; transform: translateX(0); }
            62%, 100% { opacity: 0; }
        }

        @keyframes showConsequence {
            0%, 58% { opacity: 0; transform: scale(0.95); }
            62%, 85% { opacity: 1; transform: scale(1); }
            89%, 100% { opacity: 0; }
        }

        /* Class Assignments */
        .helix-group {
            transform-origin: 200px 280px;
            animation: rotateHelix 20s ease-in-out infinite;
        }
        .zoom-group {
            animation: showZoom 20s ease-in-out infinite;
        }
        .pulse-bond {
            animation: pulseBond 2s infinite;
        }
        .mut-left {
            animation: mutateLeft 20s infinite;
        }
        .mut-right {
            animation: mutateRight 20s infinite;
        }
        .mut-bonds-old {
            animation: hideOldBonds 20s infinite;
        }
        .mut-bonds-new {
            animation: showNewBonds 20s infinite;
        }
        .mut-label {
            animation: showMutLabel 20s infinite;
        }
        .consequence-group {
            transform-origin: 630px 380px;
            animation: showConsequence 20s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title" role="img">
        <title id="svg-title">Animated DNA Structure and Point Mutation</title>
        <desc>Visualization of the DNA double helix, nucleotide structure, and a point mutation resulting in a phenotypic alteration.</desc>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" rx="12" />

        <!-- Main Title -->
        <text x="400" y="35" text-anchor="middle" font-family="Inter" font-size="22" font-weight="700" fill="#2C3E50">Molecular Architecture of the DNA Double Helix &amp; Point Mutation</text>

        <!-- STATIC LABELS & POINTERS -->
        <g font-family="Inter" font-size="12" font-weight="600" fill="#2C3E50">
            <!-- 5' and 3' Ends -->
            <text x="185" y="85">5'</text>
            <text x="225" y="125">3'</text>
            <text x="185" y="480">3'</text>
            <text x="225" y="520">5'</text>
            
            <!-- Structural Pointers -->
            <text x="30" y="150">Sugar-Phosphate Backbone</text>
            <line x1="100" y1="155" x2="160" y2="180" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="2 2" />
            <circle cx="160" cy="180" r="3" fill="#2C3E50" />

            <text x="30" y="350">Hydrogen Bonds (Weak)</text>
            <line x1="100" y1="340" x2="160" y2="320" stroke="#2C3E50" stroke-width="1.5" stroke-dasharray="2 2" />
            <circle cx="160" cy="320" r="3" fill="#2C3E50" />
        </g>

        <!-- LEGEND PANEL -->
        <g transform="translate(520, 50)">
            <rect x="0" y="0" width="250" height="90" rx="6" fill="#ffffff" stroke="#BDC3C7" stroke-width="1.5" />
            <text x="125" y="20" text-anchor="middle" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50">Base Pairing Rules</text>
            
            <!-- A-T -->
            <rect x="15" y="35" width="20" height="10" rx="2" fill="#3498DB" />
            <text x="40" y="44" font-family="Inter" font-size="11" font-weight="600" fill="#2C3E50">Adenine (A)</text>
            <rect x="130" y="35" width="20" height="10" rx="2" fill="#F1C40F" />
            <text x="155" y="44" font-family="Inter" font-size="11" font-weight="600" fill="#2C3E50">Thymine (T)</text>
            
            <!-- C-G -->
            <rect x="15" y="60" width="20" height="10" rx="2" fill="#E67E22" />
            <text x="40" y="69" font-family="Inter" font-size="11" font-weight="600" fill="#2C3E50">Cytosine (C)</text>
            <rect x="130" y="60" width="20" height="10" rx="2" fill="#2ECC71" />
            <text x="155" y="69" font-family="Inter" font-size="11" font-weight="600" fill="#2C3E50">Guanine (G)</text>
        </g>

        <!-- ANIMATED DNA HELIX -->
        <g class="helix-group">
            <!-- Base Pairs -->
            <g stroke-linecap="round">
                <!-- Y=120: A-T -->
                <line x1="170" y1="120" x2="195" y2="120" stroke="#F1C40F" stroke-width="6" />
                <line x1="205" y1="120" x2="230" y2="120" stroke="#3498DB" stroke-width="6" />
                <line x1="195" y1="118.5" x2="205" y2="118.5" stroke="#BDC3C7" stroke-width="1" />
                <line x1="195" y1="121.5" x2="205" y2="121.5" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=140: C-G -->
                <line x1="200" y1="140" x2="220" y2="140" stroke="#2ECC71" stroke-width="6" />
                <line x1="230" y1="140" x2="250" y2="140" stroke="#E67E22" stroke-width="6" />
                <line x1="220" y1="138" x2="230" y2="138" stroke="#BDC3C7" stroke-width="1" />
                <line x1="220" y1="140" x2="230" y2="140" stroke="#BDC3C7" stroke-width="1" />
                <line x1="220" y1="142" x2="230" y2="142" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=160: G-C -->
                <line x1="230" y1="160" x2="240" y2="160" stroke="#E67E22" stroke-width="6" />
                <line x1="250" y1="160" x2="260" y2="160" stroke="#2ECC71" stroke-width="6" />
                <line x1="240" y1="158" x2="250" y2="158" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="160" x2="250" y2="160" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="162" x2="250" y2="162" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=200: A-T -->
                <line x1="230" y1="200" x2="240" y2="200" stroke="#3498DB" stroke-width="6" />
                <line x1="250" y1="200" x2="260" y2="200" stroke="#F1C40F" stroke-width="6" />
                <line x1="240" y1="198.5" x2="250" y2="198.5" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="201.5" x2="250" y2="201.5" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=220: C-G -->
                <line x1="200" y1="220" x2="220" y2="220" stroke="#E67E22" stroke-width="6" />
                <line x1="230" y1="220" x2="250" y2="220" stroke="#2ECC71" stroke-width="6" />
                <line x1="220" y1="218" x2="230" y2="218" stroke="#BDC3C7" stroke-width="1" />
                <line x1="220" y1="220" x2="230" y2="220" stroke="#BDC3C7" stroke-width="1" />
                <line x1="220" y1="222" x2="230" y2="222" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=240: G-C -->
                <line x1="170" y1="240" x2="195" y2="240" stroke="#2ECC71" stroke-width="6" />
                <line x1="205" y1="240" x2="230" y2="240" stroke="#E67E22" stroke-width="6" />
                <line x1="195" y1="238" x2="205" y2="238" stroke="#BDC3C7" stroke-width="1" />
                <line x1="195" y1="240" x2="205" y2="240" stroke="#BDC3C7" stroke-width="1" />
                <line x1="195" y1="242" x2="205" y2="242" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=260: T-A -->
                <line x1="150" y1="260" x2="170" y2="260" stroke="#F1C40F" stroke-width="6" />
                <line x1="180" y1="260" x2="200" y2="260" stroke="#3498DB" stroke-width="6" />
                <line x1="170" y1="258.5" x2="180" y2="258.5" stroke="#BDC3C7" stroke-width="1" />
                <line x1="170" y1="261.5" x2="180" y2="261.5" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=280: MUTATION TARGET (C-G -> A-T) -->
                <line class="mut-left" x1="140" y1="280" x2="150" y2="280" stroke-width="6" />
                <line class="mut-right" x1="160" y1="280" x2="170" y2="280" stroke-width="6" />
                
                <g class="mut-bonds-old">
                    <line x1="150" y1="278" x2="160" y2="278" stroke="#BDC3C7" stroke-width="1" />
                    <line x1="150" y1="280" x2="160" y2="280" stroke="#BDC3C7" stroke-width="1" />
                    <line x1="150" y1="282" x2="160" y2="282" stroke="#BDC3C7" stroke-width="1" />
                </g>
                <g class="mut-bonds-new">
                    <line x1="150" y1="278.5" x2="160" y2="278.5" stroke="#BDC3C7" stroke-width="1" />
                    <line x1="150" y1="281.5" x2="160" y2="281.5" stroke="#BDC3C7" stroke-width="1" />
                </g>

                <!-- Y=320: G-C -->
                <line x1="140" y1="320" x2="150" y2="320" stroke="#E67E22" stroke-width="6" />
                <line x1="160" y1="320" x2="170" y2="320" stroke="#2ECC71" stroke-width="6" />
                <line x1="150" y1="318" x2="160" y2="318" stroke="#BDC3C7" stroke-width="1" />
                <line x1="150" y1="320" x2="160" y2="320" stroke="#BDC3C7" stroke-width="1" />
                <line x1="150" y1="322" x2="160" y2="322" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=340: T-A -->
                <line x1="150" y1="340" x2="170" y2="340" stroke="#3498DB" stroke-width="6" />
                <line x1="180" y1="340" x2="200" y2="340" stroke="#F1C40F" stroke-width="6" />
                <line x1="170" y1="338.5" x2="180" y2="338.5" stroke="#BDC3C7" stroke-width="1" />
                <line x1="170" y1="341.5" x2="180" y2="341.5" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=360: C-G -->
                <line x1="170" y1="360" x2="195" y2="360" stroke="#2ECC71" stroke-width="6" />
                <line x1="205" y1="360" x2="230" y2="360" stroke="#E67E22" stroke-width="6" />
                <line x1="195" y1="358" x2="205" y2="358" stroke="#BDC3C7" stroke-width="1" />
                <line x1="195" y1="360" x2="205" y2="360" stroke="#BDC3C7" stroke-width="1" />
                <line x1="195" y1="362" x2="205" y2="362" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=380: A-T -->
                <line x1="200" y1="380" x2="220" y2="380" stroke="#F1C40F" stroke-width="6" />
                <line x1="230" y1="380" x2="250" y2="380" stroke="#3498DB" stroke-width="6" />
                <line x1="220" y1="378.5" x2="230" y2="378.5" stroke="#BDC3C7" stroke-width="1" />
                <line x1="220" y1="381.5" x2="230" y2="381.5" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=400: G-C -->
                <line x1="230" y1="400" x2="240" y2="400" stroke="#E67E22" stroke-width="6" />
                <line x1="250" y1="400" x2="260" y2="400" stroke="#2ECC71" stroke-width="6" />
                <line x1="240" y1="398" x2="250" y2="398" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="400" x2="250" y2="400" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="402" x2="250" y2="402" stroke="#BDC3C7" stroke-width="1" />

                <!-- Y=440: C-G -->
                <line x1="230" y1="440" x2="240" y2="440" stroke="#E67E22" stroke-width="6" />
                <line x1="250" y1="440" x2="260" y2="440" stroke="#2ECC71" stroke-width="6" />
                <line x1="240" y1="438" x2="250" y2="438" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="440" x2="250" y2="440" stroke="#BDC3C7" stroke-width="1" />
                <line x1="240" y1="442" x2="250" y2="442" stroke="#BDC3C7" stroke-width="1" />
            </g>

            <!-- Sugar-Phosphate Backbones -->
            <path d="M 200 100 C 280 100, 280 220, 200 220 C 120 220, 120 340, 200 340 C 280 340, 280 460, 200 460" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" />
            <path d="M 200 140 C 280 140, 280 260, 200 260 C 120 260, 120 380, 200 380 C 280 380, 280 500, 200 500" fill="none" stroke="#FF6B6B" stroke-width="8" stroke-linecap="round" />
        </g>

        <!-- MUTATION LABEL -->
        <text class="mut-label" x="280" y="285" font-family="Inter" font-size="14" font-weight="700" fill="#E74C3C">Point Mutation (Substitution)</text>

        <!-- ZOOM-IN CALLOUT (Phase 2) -->
        <g class="zoom-group">
            <!-- Magnifying Glass -->
            <circle cx="215" cy="240" r="30" fill="rgba(255,255,255,0.2)" stroke="#2C3E50" stroke-width="2" stroke-dasharray="4 4" />
            <line x1="245" y1="240" x2="500" y2="200" stroke="#2C3E50" stroke-width="2" stroke-dasharray="4 4" />
            
            <!-- Zoom Box -->
            <rect x="500" y="150" width="270" height="150" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="2" />
            <text x="635" y="175" text-anchor="middle" font-family="Inter" font-size="14" font-weight="700" fill="#2C3E50">Nucleotide Highlight</text>
            
            <!-- Chemical Components -->
            <!-- Phosphate -->
            <circle cx="540" cy="215" r="16" fill="#FF6B6B" />
            <text x="540" y="220" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#ffffff">P</text>
            
            <!-- Phosphodiester Bond (Pulsing) -->
            <line class="pulse-bond" x1="556" y1="215" x2="580" y2="215" stroke="#BDC3C7" stroke-width="2" />
            
            <!-- Deoxyribose Sugar -->
            <polygon points="600,195 620,210 612,235 588,235 580,210" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
            <text x="600" y="250" text-anchor="middle" font-family="Inter" font-size="10" font-weight="600" fill="#2C3E50">Deoxyribose</text>
            
            <!-- Glycosidic Bond -->
            <line x1="620" y1="215" x2="640" y2="215" stroke="#BDC3C7" stroke-width="2" />
            
            <!-- Nitrogenous Base (Cytosine) -->
            <rect x="640" y="200" width="60" height="30" rx="4" fill="#E67E22" />
            <text x="670" y="219" text-anchor="middle" font-family="Inter" font-size="12" font-weight="600" fill="#ffffff">Cytosine</text>
            
            <!-- Hydrogen Bonds (Pulsing) -->
            <line class="pulse-bond" x1="700" y1="205" x2="730" y2="205" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="3 3" />
            <line class="pulse-bond" x1="700" y1="215" x2="730" y2="215" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="3 3" />
            <line class="pulse-bond" x1="700" y1="225" x2="730" y2="225" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="3 3" />
        </g>

        <!-- CONSEQUENCE LABEL (Phase 4) -->
        <g class="consequence-group">
            <rect x="500" y="340" width="270" height="90" rx="8" fill="#2C3E50" />
            <text x="635" y="365" text-anchor="middle" font-family="Inter" font-size="15" font-weight="700" fill="#ffffff">Genotypic Change</text>
            <text x="635" y="390" text-anchor="middle" font-family="Inter" font-size="18" font-weight="700" fill="#F39C12">↓</text>
            <text x="635" y="415" text-anchor="middle" font-family="Inter" font-size="15" font-weight="700" fill="#E74C3C">Phenotypic Alteration</text>
        </g>

    </svg>
</body>
</html>
