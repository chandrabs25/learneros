<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Vascular System - Animated Diagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,600;0,800&family=Roboto+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 1200px;
            width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        .label {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            fill: #2C3E50;
        }

        .title {
            font-family: 'Inter', sans-serif;
            font-size: 24px;
            font-weight: 800;
            fill: #2C3E50;
        }

        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            fill: #7F8C8D;
        }

        .process-text {
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 800;
        }

        /* --- Animations --- */
        
        /* Continuous Flow Movement */
        @keyframes flowDash {
            to { stroke-dashoffset: -48; }
        }

        .flow-particle {
            animation: flowDash 1.5s linear infinite;
        }

        /* Master Timeline Fades (10s Loop) */
        .flow-intake { animation: flowDash 1.5s linear infinite, fadeIntake 10s infinite; }
        @keyframes fadeIntake {
            0%, 15% { opacity: 1; }
            20%, 100% { opacity: 0; }
        }

        .flow-ring { animation: flowDash 1.5s linear infinite, fadeRing 10s infinite; }
        @keyframes fadeRing {
            0%, 15% { opacity: 0; }
            20%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .flow-radial { animation: flowDash 1.5s linear infinite, fadeRadial 10s infinite; }
        @keyframes fadeRadial {
            0%, 20% { opacity: 0; }
            25%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .flow-lateral { animation: flowDash 1.5s linear infinite, fadeLateral 10s infinite; }
        @keyframes fadeLateral {
            0%, 25% { opacity: 0; }
            30%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        .flow-ampulla { animation: flowDash 1.5s linear infinite, fadeAmpullaFlow 10s infinite; }
        @keyframes fadeAmpullaFlow {
            0%, 45% { opacity: 0; }
            50%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        .flow-hydraulic { animation: flowDash 1.5s linear infinite, fadeHydraulic 10s infinite; }
        @keyframes fadeHydraulic {
            0%, 45% { opacity: 0; }
            50%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        /* Hydraulic Physical Action */
        .ampulla-group {
            transform-origin: 750px 250px;
            animation: contractAmpulla 10s ease-in-out infinite;
        }
        @keyframes contractAmpulla {
            0%, 45% { transform: scale(1, 1); }
            55%, 75% { transform: scale(0.85, 0.85); }
            85%, 100% { transform: scale(1, 1); }
        }

        .tubefoot-group {
            transform-origin: 750px 250px;
            animation: extendTubeFoot 10s ease-in-out infinite;
        }
        @keyframes extendTubeFoot {
            0%, 45% { transform: scale(1, 1); }
            55%, 75% { transform: scale(1, 1.4); }
            85%, 100% { transform: scale(1, 1); }
        }

        /* Process Labels Visibility */
        #pt1 { animation: fadePT1 10s infinite; }
        @keyframes fadePT1 {
            0%, 15% { opacity: 1; }
            20%, 100% { opacity: 0; }
        }

        #pt2 { animation: fadePT2 10s infinite; }
        @keyframes fadePT2 {
            0%, 15% { opacity: 0; }
            20%, 45% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #pt3 { animation: fadePT3 10s infinite; }
        @keyframes fadePT3 {
            0%, 45% { opacity: 0; }
            50%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <!-- Glow Filter for Water Particles -->
            <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="2" result="blur" />
                <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>

            <!-- Radial Arm Template -->
            <g id="arm">
                <!-- Main Radial Canal -->
                <line x1="300" y1="310" x2="300" y2="100" stroke="#F39C12" stroke-width="16" stroke-linecap="round"/>
                <line x1="300" y1="310" x2="300" y2="100" stroke="#E8F4FD" stroke-width="10" stroke-linecap="round"/>
                <line x1="300" y1="310" x2="300" y2="100" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-radial" filter="url(#glow)"/>

                <!-- Ampullae Pairs along the arm -->
                <!-- Pair 1 -->
                <line x1="280" y1="280" x2="320" y2="280" stroke="#F39C12" stroke-width="6"/>
                <circle cx="275" cy="280" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <circle cx="325" cy="280" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <!-- Pair 2 -->
                <line x1="280" y1="240" x2="320" y2="240" stroke="#F39C12" stroke-width="6"/>
                <circle cx="275" cy="240" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <circle cx="325" cy="240" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <!-- Pair 3 -->
                <line x1="280" y1="200" x2="320" y2="200" stroke="#F39C12" stroke-width="6"/>
                <circle cx="275" cy="200" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <circle cx="325" cy="200" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <!-- Pair 4 -->
                <line x1="280" y1="160" x2="320" y2="160" stroke="#F39C12" stroke-width="6"/>
                <circle cx="275" cy="160" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <circle cx="325" cy="160" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <!-- Pair 5 -->
                <line x1="280" y1="120" x2="320" y2="120" stroke="#F39C12" stroke-width="6"/>
                <circle cx="275" cy="120" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
                <circle cx="325" cy="120" r="7" fill="#E67E22" stroke="#D35400" stroke-width="2"/>
            </g>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Header / Title -->
        <text x="40" y="50" class="title">Water Vascular System (Ambulacral System)</text>
        <text x="40" y="75" class="subtitle">Phylum: Echinodermata (e.g., <tspan font-style="italic">Asterias</tspan>)</text>

        <!-- Legend -->
        <rect x="780" y="20" width="190" height="90" rx="8" fill="#ffffff" stroke="#BDC3C7" stroke-width="1"/>
        <text x="790" y="40" class="label" font-size="12" fill="#7F8C8D">LEGEND</text>
        <circle cx="800" cy="55" r="6" fill="#F39C12"/>
        <text x="815" y="59" class="label">Canals / Tissue</text>
        <circle cx="800" cy="75" r="6" fill="#E67E22"/>
        <text x="815" y="79" class="label">Muscular (Ampullae)</text>
        <line x1="794" y1="95" x2="806" y2="95" stroke="#3498DB" stroke-width="4" stroke-dasharray="4 4"/>
        <text x="815" y="99" class="label">Hydraulic Fluid</text>

        <!-- ========================================== -->
        <!-- LEFT SIDE: FULL PENTARADIAL SYSTEM         -->
        <!-- ========================================== -->
        <g id="pentaradial-system">
            <!-- 5 Radial Arms -->
            <use href="#arm" />
            <use href="#arm" transform="rotate(72, 300, 350)" />
            <use href="#arm" transform="rotate(144, 300, 350)" />
            <use href="#arm" transform="rotate(216, 300, 350)" />
            <use href="#arm" transform="rotate(288, 300, 350)" />

            <!-- Ring Canal -->
            <circle cx="300" cy="350" r="40" fill="none" stroke="#F39C12" stroke-width="16"/>
            <circle cx="300" cy="350" r="40" fill="none" stroke="#E8F4FD" stroke-width="10"/>
            <circle cx="300" cy="350" r="40" fill="none" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-ring" filter="url(#glow)"/>

            <!-- Stone Canal -->
            <path d="M 335 302 C 320 310, 340 330, 325 340" fill="none" stroke="#95A5A6" stroke-width="10"/>
            <path d="M 335 302 C 320 310, 340 330, 325 340" fill="none" stroke="#E8F4FD" stroke-width="6"/>
            <path d="M 335 302 C 320 310, 340 330, 325 340" fill="none" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-intake" filter="url(#glow)"/>

            <!-- Madreporite (Inter-radial position) -->
            <circle cx="335" cy="302" r="14" fill="#BDC3C7" stroke="#7F8C8D" stroke-width="2"/>
            <!-- Sieve Pores -->
            <circle cx="332" cy="299" r="1.5" fill="#2C3E50"/>
            <circle cx="338" cy="300" r="1.5" fill="#2C3E50"/>
            <circle cx="335" cy="305" r="1.5" fill="#2C3E50"/>
            <circle cx="331" cy="304" r="1.5" fill="#2C3E50"/>
            <circle cx="339" cy="304" r="1.5" fill="#2C3E50"/>
            <circle cx="335" cy="297" r="1.5" fill="#2C3E50"/>
        </g>

        <!-- Leader Lines for Left Side -->
        <g stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4 4" fill="none">
            <polyline points="300,150 420,150"/>
            <polyline points="335,302 420,260"/>
            <polyline points="325,320 420,300"/>
            <polyline points="340,350 420,350"/>
        </g>
        <g fill="#7F8C8D">
            <circle cx="300" cy="150" r="3"/>
            <circle cx="335" cy="302" r="3"/>
            <circle cx="325" cy="320" r="3"/>
            <circle cx="340" cy="350" r="3"/>
        </g>
        <text x="430" y="154" class="label">Radial Canal</text>
        <text x="430" y="264" class="label">Madreporite</text>
        <text x="430" y="304" class="label">Stone Canal</text>
        <text x="430" y="354" class="label">Ring Canal</text>

        <!-- Divider & Zoom Indicator -->
        <polygon points="325,275 325,285 550,480 550,130" fill="#3498DB" opacity="0.05"/>
        <line x1="520" y1="120" x2="520" y2="480" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="5 5"/>

        <!-- ========================================== -->
        <!-- RIGHT SIDE: DETAIL VIEW (AMPULLA/PODIUM)   -->
        <!-- ========================================== -->
        <g id="detail-view">
            <!-- Detail Box Background -->
            <rect x="550" y="130" width="420" height="350" rx="15" fill="#ffffff" stroke="#E8F4FD" stroke-width="4"/>
            <text x="570" y="160" font-family="Inter" font-size="14" font-weight="800" fill="#95A5A6" letter-spacing="1.5">MAGNIFIED DETAIL</text>

            <!-- Base Outlines (Canals) -->
            <rect x="570" y="235" width="130" height="30" fill="#F39C12" rx="5"/>
            <rect x="680" y="240" width="50" height="20" fill="#F39C12"/>

            <!-- Inner Fluid Base (Canals) -->
            <rect x="573" y="238" width="124" height="24" fill="#E8F4FD" rx="3"/>
            <rect x="680" y="243" width="48" height="14" fill="#E8F4FD"/>

            <!-- Valve (Prevents backflow) -->
            <line x1="715" y1="243" x2="725" y2="250" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>
            <line x1="715" y1="257" x2="725" y2="250" stroke="#2C3E50" stroke-width="3" stroke-linecap="round"/>

            <!-- Flow Particles (Canals) -->
            <line x1="575" y1="250" x2="690" y2="250" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-radial" filter="url(#glow)"/>
            <line x1="680" y1="250" x2="720" y2="250" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-lateral" filter="url(#glow)"/>

            <!-- Ampulla Group (Contracts) -->
            <g class="ampulla-group">
                <!-- Outer Muscle -->
                <ellipse cx="750" cy="180" rx="45" ry="60" fill="#E67E22" stroke="#D35400" stroke-width="3"/>
                <!-- Inner Fluid Base -->
                <ellipse cx="750" cy="180" cy="180" rx="37" ry="52" fill="#E8F4FD"/>
                <!-- Internal Flow Particles -->
                <ellipse cx="750" cy="180" rx="25" ry="35" fill="none" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-ampulla" filter="url(#glow)"/>
            </g>

            <!-- Tube Foot Group (Extends) -->
            <g class="tubefoot-group">
                <!-- Outer Tissue -->
                <path d="M 725 250 L 725 380 L 710 410 Q 750 400 790 410 L 775 380 L 775 250 Z" fill="#D35400" stroke="#C0392B" stroke-width="3"/>
                <!-- Inner Fluid Base -->
                <path d="M 733 250 L 733 378 L 720 402 Q 750 394 780 402 L 767 378 L 767 250 Z" fill="#E8F4FD"/>
                <!-- Internal Flow Particles (Hydraulic push) -->
                <line x1="750" y1="260" x2="750" y2="390" stroke="#3498DB" stroke-width="4" stroke-dasharray="8 12" class="flow-hydraulic" filter="url(#glow)"/>
            </g>

            <!-- Detail View Leader Lines -->
            <g stroke="#7F8C8D" stroke-width="2" stroke-dasharray="4 4" fill="none">
                <polyline points="795,180 860,180"/>
                <polyline points="785,320 860,320"/>
                <polyline points="780,405 860,405"/>
                <polyline points="690,240 690,190 620,190"/>
            </g>
            <g fill="#7F8C8D">
                <circle cx="795" cy="180" r="3"/>
                <circle cx="785" cy="320" r="3"/>
                <circle cx="780" cy="405" r="3"/>
                <circle cx="690" cy="240" r="3"/>
            </g>
            <text x="868" y="184" class="label">Ampulla</text>
            <text x="868" y="324" class="label">Tube Foot (Podium)</text>
            <text x="868" y="409" class="label">Sucker</text>
            <text x="625" y="185" class="label" text-anchor="end">Lateral Canal &amp; Valve</text>
        </g>

        <!-- ========================================== -->
        <!-- DYNAMIC PROCESS LABELS (BOTTOM CENTER)     -->
        <!-- ========================================== -->
        <rect x="150" y="510" width="700" height="60" rx="10" fill="#ffffff" stroke="#BDC3C7" stroke-width="2" box-shadow="0 4px 6px rgba(0,0,0,0.1)"/>
        
        <text x="500" y="546" text-anchor="middle" fill="#3498DB" class="process-text" id="pt1">
            1. Water enters via Madreporite &amp; Stone Canal
        </text>
        
        <text x="500" y="546" text-anchor="middle" fill="#3498DB" class="process-text" id="pt2">
            2. Pressure distribution via Ring &amp; Radial Canals
        </text>
        
        <text x="500" y="546" text-anchor="middle" fill="#D35400" class="process-text" id="pt3">
            3. Ampulla contraction extends Tube Foot (Hydraulic Action)
        </text>

    </svg>

</body>
</html>
