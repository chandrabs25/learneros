<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reaction Enthalpy Visualization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e9ecef;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            background-color: #f8f9fa;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-radius: 12px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #212529; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #6c757d; }
        .axis-label { font-size: 14px; font-weight: 600; fill: #495057; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 700; fill: #212529; }
        .annotation { font-size: 13px; font-weight: 600; }
        
        /* Molecular Animations */
        .atom { filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.2)); }
        
        .h1 { animation: h1-move 8s infinite linear; }
        .h2 { animation: h2-move 8s infinite linear; }
        .cl1 { animation: cl1-move 8s infinite linear; }
        .cl2 { animation: cl2-move 8s infinite linear; }

        .bond { stroke: #333333; stroke-width: 4; stroke-linecap: round; }
        .bond-dashed { stroke: #999999; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 6, 5; }

        .bond-hh { animation: bond-hh 8s infinite linear; }
        .bond-clcl { animation: bond-clcl 8s infinite linear; }
        .bond-hh-ts { animation: bond-hh-ts 8s infinite linear; }
        .bond-clcl-ts { animation: bond-clcl-ts 8s infinite linear; }
        .bond-hcl1-ts { animation: bond-hcl1-ts 8s infinite linear; }
        .bond-hcl2-ts { animation: bond-hcl2-ts 8s infinite linear; }
        .bond-hcl1 { animation: bond-hcl1 8s infinite linear; }
        .bond-hcl2 { animation: bond-hcl2 8s infinite linear; }

        .system-fade { animation: reset-fade 8s infinite linear; }
        .reactant-text { animation: fade-out-half 8s infinite linear; }
        .product-text { animation: fade-in-half 8s infinite linear; }

        /* Energy Graph Animations */
        .energy-dot { animation: dot-move 8s infinite linear; filter: drop-shadow(0 0 6px rgba(255,0,0,0.6)); }
        .exo-box { animation: exo-fade 8s infinite linear; }
        .delta-h { animation: exo-fade 8s infinite linear; }

        /* Keyframes for Atoms */
        @keyframes h1-move {
            0%, 10% { transform: translate(185px, 150px); }
            25% { transform: translate(185px, 230px); }
            50% { transform: translate(160px, 250px); }
            75%, 90% { transform: translate(80px, 250px); }
            100% { transform: translate(185px, 150px); }
        }
        @keyframes h2-move {
            0%, 10% { transform: translate(215px, 150px); }
            25% { transform: translate(215px, 230px); }
            50% { transform: translate(240px, 250px); }
            75%, 90% { transform: translate(320px, 250px); }
            100% { transform: translate(215px, 150px); }
        }
        @keyframes cl1-move {
            0%, 10% { transform: translate(170px, 410px); }
            25% { transform: translate(170px, 330px); }
            50% { transform: translate(160px, 310px); }
            75%, 90% { transform: translate(80px, 310px); }
            100% { transform: translate(170px, 410px); }
        }
        @keyframes cl2-move {
            0%, 10% { transform: translate(230px, 410px); }
            25% { transform: translate(230px, 330px); }
            50% { transform: translate(240px, 310px); }
            75%, 90% { transform: translate(320px, 310px); }
            100% { transform: translate(230px, 410px); }
        }

        /* Keyframes for Bonds */
        @keyframes bond-hh {
            0%, 10% { d: path("M 185 150 L 215 150"); opacity: 1; }
            25% { d: path("M 185 230 L 215 230"); opacity: 1; }
            35% { d: path("M 177.5 236 L 222.5 236"); opacity: 0; }
            100% { d: path("M 160 250 L 240 250"); opacity: 0; }
        }
        @keyframes bond-clcl {
            0%, 10% { d: path("M 170 410 L 230 410"); opacity: 1; }
            25% { d: path("M 170 330 L 230 330"); opacity: 1; }
            35% { d: path("M 167 324 L 233 324"); opacity: 0; }
            100% { d: path("M 160 310 L 240 310"); opacity: 0; }
        }
        @keyframes bond-hh-ts {
            0%, 25% { d: path("M 185 230 L 215 230"); opacity: 0; }
            35% { d: path("M 177.5 236 L 222.5 236"); opacity: 1; }
            50% { d: path("M 160 250 L 240 250"); opacity: 1; }
            55%, 100% { d: path("M 152 250 L 248 250"); opacity: 0; }
        }
        @keyframes bond-clcl-ts {
            0%, 25% { d: path("M 170 330 L 230 330"); opacity: 0; }
            35% { d: path("M 167 324 L 233 324"); opacity: 1; }
            50% { d: path("M 160 310 L 240 310"); opacity: 1; }
            55%, 100% { d: path("M 152 310 L 248 310"); opacity: 0; }
        }
        @keyframes bond-hcl1-ts {
            0%, 25% { d: path("M 185 230 L 170 330"); opacity: 0; }
            35% { d: path("M 177.5 236 L 167 324"); opacity: 1; }
            50% { d: path("M 160 250 L 160 310"); opacity: 1; }
            55%, 100% { d: path("M 152 250 L 152 310"); opacity: 0; }
        }
        @keyframes bond-hcl2-ts {
            0%, 25% { d: path("M 215 230 L 230 330"); opacity: 0; }
            35% { d: path("M 222.5 236 L 233 324"); opacity: 1; }
            50% { d: path("M 240 250 L 240 310"); opacity: 1; }
            55%, 100% { d: path("M 248 250 L 248 310"); opacity: 0; }
        }
        @keyframes bond-hcl1 {
            0%, 45% { d: path("M 165 244 L 165 316"); opacity: 0; }
            50% { d: path("M 160 250 L 160 310"); opacity: 1; }
            75%, 90% { d: path("M 80 250 L 80 310"); opacity: 1; }
            100% { d: path("M 185 150 L 170 410"); opacity: 0; }
        }
        @keyframes bond-hcl2 {
            0%, 45% { d: path("M 235 244 L 235 316"); opacity: 0; }
            50% { d: path("M 240 250 L 240 310"); opacity: 1; }
            75%, 90% { d: path("M 320 250 L 320 310"); opacity: 1; }
            100% { d: path("M 215 150 L 230 410"); opacity: 0; }
        }

        /* Keyframes for Energy Dot (Tracking the Bezier Curve) */
        @keyframes dot-move {
            0%, 10% { transform: translate(450px, 250px); opacity: 1; }
            25% { transform: translate(520px, 250px); }
            31.25% { transform: translate(540px, 217px); }
            37.5% { transform: translate(560px, 185px); }
            43.75% { transform: translate(580px, 152px); }
            50% { transform: translate(600px, 120px); }
            56.25% { transform: translate(620px, 177px); }
            62.5% { transform: translate(640px, 235px); }
            68.75% { transform: translate(660px, 292px); }
            75% { transform: translate(680px, 350px); }
            90% { transform: translate(750px, 350px); opacity: 1; }
            92%, 100% { transform: translate(750px, 350px); opacity: 0; }
        }

        /* Visibility & Reset Keyframes */
        @keyframes reset-fade {
            0%, 90% { opacity: 1; }
            92%, 98% { opacity: 0; }
            100% { opacity: 1; }
        }
        @keyframes fade-out-half {
            0%, 40% { opacity: 1; }
            50%, 90% { opacity: 0; }
            95%, 100% { opacity: 1; }
        }
        @keyframes fade-in-half {
            0%, 40% { opacity: 0; }
            50%, 90% { opacity: 1; }
            95%, 100% { opacity: 0; }
        }
        @keyframes exo-fade {
            0%, 70% { opacity: 0; transform: translateY(-10px); }
            75%, 90% { opacity: 1; transform: translateY(0); }
            92%, 100% { opacity: 0; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for Gradients, Markers, and Filters -->
        <defs>
            <linearGradient id="energyGrad" gradientUnits="userSpaceOnUse" x1="0" y1="350" x2="0" y2="120">
                <stop offset="0%" stop-color="#4444FF"/> <!-- Low Energy: Blue -->
                <stop offset="50%" stop-color="#28a745"/> <!-- Transition: Green -->
                <stop offset="100%" stop-color="#FF4444"/> <!-- High Energy: Red -->
            </linearGradient>

            <marker id="arrow-black" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#212529"/>
            </marker>
            <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#F77F00"/>
            </marker>
            <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#7209B7"/>
            </marker>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa"/>

        <!-- Header -->
        <text x="400" y="40" text-anchor="middle" class="title">Enthalpy Change (Δ<tspan baseline-shift="sub" font-size="16">r</tspan>H) in a Chemical Reaction</text>
        <text x="400" y="65" text-anchor="middle" class="subtitle">Bond breaking absorbs energy (endothermic) • Bond forming releases energy (exothermic)</text>

        <!-- Divider Line -->
        <line x1="400" y1="90" x2="400" y2="480" stroke="#dee2e6" stroke-width="2" stroke-dasharray="8,8"/>

        <!-- ========================================== -->
        <!-- RIGHT PANEL: ENERGY COORDINATE DIAGRAM     -->
        <!-- ========================================== -->
        <g id="energy-panel">
            <!-- Axes -->
            <path d="M 430 380 L 770 380" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)"/>
            <path d="M 450 400 L 450 90" stroke="#212529" stroke-width="2" marker-end="url(#arrow-black)"/>
            
            <!-- Axis Labels -->
            <text x="600" y="415" text-anchor="middle" class="axis-label">Reaction Coordinate</text>
            <text x="-245" y="420" transform="rotate(-90)" text-anchor="middle" class="axis-label">H (Enthalpy)</text>

            <!-- Baseline Enthalpy Levels (Dashed) -->
            <path d="M 430 250 L 750 250" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4"/>
            <path d="M 660 350 L 750 350" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4,4"/>

            <!-- Energy Curve -->
            <path d="M 450 250 L 520 250 C 560 250, 560 120, 600 120 C 640 120, 640 350, 680 350 L 750 350" 
                  stroke="url(#energyGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>

            <!-- Static Labels on Graph -->
            <text x="485" y="240" text-anchor="middle" class="annotation" fill="#4444FF">H<tspan baseline-shift="sub" font-size="10">reactants</tspan></text>
            <text x="715" y="370" text-anchor="middle" class="annotation" fill="#4444FF">H<tspan baseline-shift="sub" font-size="10">products</tspan></text>
            
            <!-- Activation Energy (Ea) Annotation -->
            <path d="M 600 245 L 600 135" stroke="#F77F00" stroke-width="2" marker-end="url(#arrow-orange)" marker-start="url(#arrow-orange)"/>
            <text x="610" y="195" class="annotation" fill="#F77F00">E<tspan baseline-shift="sub" font-size="10">a</tspan></text>

            <!-- Delta H Annotation (Animated) -->
            <g class="delta-h">
                <path d="M 720 255 L 720 340" stroke="#7209B7" stroke-width="3" marker-end="url(#arrow-purple)"/>
                <text x="730" y="305" class="annotation" fill="#7209B7">Δ<tspan baseline-shift="sub" font-size="10">r</tspan>H &lt; 0</text>
            </g>

            <!-- Exothermic Result Box (Animated) -->
            <g class="exo-box" transform="translate(560, 430)">
                <rect width="200" height="36" rx="6" fill="#ffe6e6" stroke="#FF4444" stroke-width="2"/>
                <text x="100" y="23" text-anchor="middle" fill="#cc0000" font-weight="700" font-size="14">Exothermic: Heat Released</text>
            </g>

            <!-- Animated Indicator Dot -->
            <circle cx="0" cy="0" r="8" fill="#FF0000" class="energy-dot"/>
        </g>

        <!-- ========================================== -->
        <!-- LEFT PANEL: MOLECULAR ANIMATION            -->
        <!-- ========================================== -->
        <g id="molecular-panel">
            <!-- Legend -->
            <g transform="translate(20, 430)">
                <rect width="140" height="55" rx="4" fill="#ffffff" stroke="#dee2e6"/>
                <circle cx="20" cy="18" r="6" fill="#CCCCCC" stroke="#999" stroke-width="1"/>
                <text x="35" y="22" font-size="12" fill="#495057">Hydrogen (H)</text>
                <circle cx="20" cy="40" r="10" fill="#44CC44" stroke="#228B22" stroke-width="1"/>
                <text x="35" y="44" font-size="12" fill="#495057">Chlorine (Cl)</text>
            </g>

            <!-- Chemical Equation Text -->
            <text x="200" y="400" text-anchor="middle" class="formula reactant-text">H<tspan baseline-shift="sub" font-size="12">2</tspan>(g) + Cl<tspan baseline-shift="sub" font-size="12">2</tspan>(g)</text>
            <text x="200" y="400" text-anchor="middle" class="formula product-text">2HCl(g)</text>

            <!-- The Animated Molecular System -->
            <g class="system-fade">
                <!-- Bonds (Rendered behind atoms) -->
                <path class="bond bond-hh"/>
                <path class="bond bond-clcl"/>
                
                <path class="bond-dashed bond-hh-ts"/>
                <path class="bond-dashed bond-clcl-ts"/>
                <path class="bond-dashed bond-hcl1-ts"/>
                <path class="bond-dashed bond-hcl2-ts"/>
                
                <path class="bond bond-hcl1"/>
                <path class="bond bond-hcl2"/>

                <!-- Atoms -->
                <circle cx="0" cy="0" r="8" fill="#CCCCCC" stroke="#999999" stroke-width="1" class="atom h1"/>
                <circle cx="0" cy="0" r="8" fill="#CCCCCC" stroke="#999999" stroke-width="1" class="atom h2"/>
                
                <circle cx="0" cy="0" r="20" fill="#44CC44" stroke="#228B22" stroke-width="2" class="atom cl1"/>
                <circle cx="0" cy="0" r="20" fill="#44CC44" stroke="#228B22" stroke-width="2" class="atom cl2"/>
            </g>
        </g>
    </svg>
</div>

</body>
</html>
