<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physiological Effects of Phytohormones</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }
        .svg-container {
            width: 100%;
            max-width: 1000px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }
        svg {
            display: block;
            width: 100%;
            height: auto;
        }
        
        /* Main Timeline Keyframes (20s Loop) */
        .anim-sam {
            transform-origin: 400px 150px;
            animation: samGrow 20s ease-in-out infinite;
        }
        .anim-internode {
            transform-origin: 400px 300px;
            animation: internodeGrow 20s ease-in-out infinite;
        }
        .anim-upper-plant {
            transform-origin: 400px 300px;
            animation: upperPlantMove 20s ease-in-out infinite;
        }
        .anim-fruit {
            transform-origin: 450px 320px;
            animation: fruitRipen 20s ease-in-out infinite;
        }
        .anim-stomata-l {
            animation: stomataL 20s ease-in-out infinite;
        }
        .anim-stomata-r {
            animation: stomataR 20s ease-in-out infinite;
        }
        .anim-cell-1 { animation: cell1 20s ease-in-out infinite; }
        .anim-cell-2 { animation: cell2 20s ease-in-out infinite; }
        .anim-cell-4 { animation: cell4 20s ease-in-out infinite; }

        /* Phase Visibility Keyframes */
        .phase-auxin { animation: phaseAuxin 20s infinite; }
        .phase-ga { animation: phaseGa 20s infinite; }
        .phase-ck { animation: phaseCk 20s infinite; }
        .phase-aba { animation: phaseAba 20s infinite; }
        .phase-eth { animation: phaseEth 20s infinite; }

        /* Label Visibility Keyframes */
        .label-auxin { animation: labelAuxin 20s infinite; }
        .label-ga { animation: labelGa 20s infinite; }
        .label-ck { animation: labelCk 20s infinite; }
        .label-aba { animation: labelAba 20s infinite; }
        .label-eth { animation: labelEth 20s infinite; }

        /* Micro-Animations */
        .particle-auxin { animation: auxinDrop 1.5s linear infinite; }
        .particle-ga { animation: gaFloat 2s ease-in-out infinite; }
        .particle-ck { animation: ckPulse 1.5s ease-in-out infinite; }
        .particle-aba { animation: abaSwarm 3s ease-in-out infinite; }
        .particle-eth { animation: ethSwirl 3s linear infinite; }

        /* Structural Animations */
        @keyframes samGrow {
            0%, 2% { transform: scaleY(1); }
            10%, 75% { transform: scaleY(1.6); }
            85%, 100% { transform: scaleY(1); }
        }
        @keyframes internodeGrow {
            0%, 17% { transform: scaleY(1); }
            25%, 75% { transform: scaleY(1.5); }
            85%, 100% { transform: scaleY(1); }
        }
        @keyframes upperPlantMove {
            0%, 17% { transform: translateY(0); }
            25%, 75% { transform: translateY(-50px); }
            85%, 100% { transform: translateY(0); }
        }
        @keyframes fruitRipen {
            0%, 60% { fill: #2ECC71; transform: scale(1); }
            65%, 75% { fill: #E74C3C; transform: scale(1.3); }
            85%, 100% { fill: #2ECC71; transform: scale(1); }
        }
        @keyframes stomataL {
            0%, 45% { d: path("M 145 120 C 115 120, 115 180, 145 180 C 130 160, 130 140, 145 120"); }
            50%, 75% { d: path("M 148 120 C 135 120, 135 180, 148 180 C 145 160, 145 140, 148 120"); }
            85%, 100% { d: path("M 145 120 C 115 120, 115 180, 145 180 C 130 160, 130 140, 145 120"); }
        }
        @keyframes stomataR {
            0%, 45% { d: path("M 155 120 C 185 120, 185 180, 155 180 C 170 160, 170 140, 155 120"); }
            50%, 75% { d: path("M 152 120 C 165 120, 165 180, 152 180 C 155 160, 155 140, 152 120"); }
            85%, 100% { d: path("M 155 120 C 185 120, 185 180, 155 180 C 170 160, 170 140, 155 120"); }
        }
        @keyframes cell1 {
            0%, 33% { opacity: 1; }
            34%, 84% { opacity: 0; }
            85%, 100% { opacity: 1; }
        }
        @keyframes cell2 {
            0%, 33% { opacity: 0; }
            34%, 39% { opacity: 1; }
            40%, 100% { opacity: 0; }
        }
        @keyframes cell4 {
            0%, 39% { opacity: 0; }
            40%, 75% { opacity: 1; }
            85%, 100% { opacity: 0; }
        }

        /* Phase Visibility */
        @keyframes phaseAuxin { 0%, 2% {opacity:0;} 5%, 13% {opacity:1;} 15%, 100% {opacity:0;} }
        @keyframes phaseGa { 0%, 15% {opacity:0;} 18%, 28% {opacity:1;} 30%, 100% {opacity:0;} }
        @keyframes phaseCk { 0%, 30% {opacity:0;} 33%, 43% {opacity:1;} 45%, 100% {opacity:0;} }
        @keyframes phaseAba { 0%, 45% {opacity:0;} 48%, 58% {opacity:1;} 60%, 100% {opacity:0;} }
        @keyframes phaseEth { 0%, 60% {opacity:0;} 63%, 73% {opacity:1;} 75%, 100% {opacity:0;} }

        /* Label Visibility (Includes Summary Phase) */
        @keyframes labelAuxin { 0%, 2% {opacity:0;} 5%, 13% {opacity:1;} 15%, 74% {opacity:0;} 76%, 95% {opacity:1;} 100% {opacity:0;} }
        @keyframes labelGa { 0%, 15% {opacity:0;} 18%, 28% {opacity:1;} 30%, 74% {opacity:0;} 76%, 95% {opacity:1;} 100% {opacity:0;} }
        @keyframes labelCk { 0%, 30% {opacity:0;} 33%, 43% {opacity:1;} 45%, 74% {opacity:0;} 76%, 95% {opacity:1;} 100% {opacity:0;} }
        @keyframes labelAba { 0%, 45% {opacity:0;} 48%, 58% {opacity:1;} 60%, 74% {opacity:0;} 76%, 95% {opacity:1;} 100% {opacity:0;} }
        @keyframes labelEth { 0%, 60% {opacity:0;} 63%, 73% {opacity:1;} 75%, 95% {opacity:1;} 100% {opacity:0;} }

        /* Particle Micro-Animations */
        @keyframes auxinDrop {
            0% { transform: translateY(0); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(50px); opacity: 0; }
        }
        @keyframes gaFloat {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-15px) scale(1.2); }
        }
        @keyframes ckPulse {
            0%, 100% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }
        @keyframes abaSwarm {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(4px, -4px); }
            50% { transform: translate(-3px, 5px); }
            75% { transform: translate(-5px, -3px); }
        }
        @keyframes ethSwirl {
            0% { transform: rotate(0deg) translateX(25px) rotate(0deg); }
            100% { transform: rotate(360deg) translateX(25px) rotate(-360deg); }
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" aria-labelledby="svg-title svg-desc">
        <title id="svg-title">Physiological Effects of Plant Growth Regulators</title>
        <desc id="svg-desc">Animated diagram showing the effects of Auxin, Gibberellins, Cytokinins, Abscisic Acid, and Ethylene on a plant.</desc>
        
        <!-- Background -->
        <rect width="100%" height="100%" fill="#f8f9fa" />

        <!-- Title -->
        <text x="400" y="40" font-family="Inter" font-size="24" font-weight="700" fill="#2C3E50" text-anchor="middle">Physiological Effects of Phytohormones</text>
        <text x="400" y="60" font-family="Inter" font-size="14" font-weight="400" fill="#7f8c8d" text-anchor="middle">The 20-Second Hormonal Cycle</text>

        <!-- Legend -->
        <g transform="translate(20, 370)">
            <rect width="180" height="115" rx="8" fill="#ffffff" stroke="#e0e0e0" stroke-width="1" />
            <text x="15" y="20" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50">Hormone Key</text>
            
            <circle cx="20" cy="35" r="5" fill="#FFD700" />
            <text x="35" y="39" font-family="Inter" font-size="11" fill="#2C3E50">Auxin (<tspan font-family="Roboto Mono">IAA</tspan>)</text>
            
            <circle cx="20" cy="52" r="5" fill="#9B59B6" />
            <text x="35" y="56" font-family="Inter" font-size="11" fill="#2C3E50">Gibberellins (<tspan font-family="Roboto Mono">GA</tspan>)</text>
            
            <circle cx="20" cy="69" r="5" fill="#3498DB" />
            <text x="35" y="73" font-family="Inter" font-size="11" fill="#2C3E50">Cytokinins (<tspan font-family="Roboto Mono">CK</tspan>)</text>
            
            <circle cx="20" cy="86" r="5" fill="#E67E22" />
            <text x="35" y="90" font-family="Inter" font-size="11" fill="#2C3E50">Abscisic Acid (<tspan font-family="Roboto Mono">ABA</tspan>)</text>
            
            <circle cx="20" cy="103" r="5" fill="#E74C3C" />
            <text x="35" y="107" font-family="Inter" font-size="11" fill="#2C3E50">Ethylene (<tspan font-family="Roboto Mono">C₂H₄</tspan>)</text>
        </g>

        <!-- Leader Lines -->
        <g stroke="#bdc3c7" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
            <path d="M 550 120 L 410 130" class="label-auxin" />
            <path d="M 550 250 L 410 250" class="label-ga" />
            <path d="M 550 440 L 410 440" class="label-ck" />
            <path d="M 200 80 L 200 105" class="label-aba" />
            <path d="M 200 150 L 340 210" class="label-aba" />
            <path d="M 200 320 L 435 320" class="label-eth" />
            <path d="M 600 400 L 410 440" class="label-ck" />
        </g>

        <!-- ================= PLANT STRUCTURE ================= -->
        
        <!-- Roots (Static) -->
        <g id="roots" fill="none" stroke="#27AE60" stroke-width="4" stroke-linecap="round">
            <path d="M 400 350 Q 380 400 390 450" />
            <path d="M 400 350 Q 420 390 410 440" />
            <path d="M 390 380 Q 360 410 350 420" />
            <path d="M 410 390 Q 440 420 450 430" />
        </g>

        <!-- Lower Stem & Leaves (Static) -->
        <g id="lower-plant">
            <path d="M 400 350 L 400 300" stroke="#27AE60" stroke-width="8" stroke-linecap="round" fill="none" />
            <!-- Lower Left Leaf -->
            <path d="M 400 300 C 360 270, 320 290, 300 320 C 340 330, 380 320, 400 300" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            <!-- Lower Right Leaf -->
            <path d="M 400 300 C 440 270, 480 290, 500 320 C 460 330, 420 320, 400 300" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            <!-- Fruit Branch -->
            <path d="M 400 320 Q 425 310 450 320" stroke="#27AE60" stroke-width="3" fill="none" />
            <!-- Fruit -->
            <circle cx="450" cy="320" r="15" class="anim-fruit" stroke="#27AE60" stroke-width="2" />
        </g>

        <!-- Internode (Scales Y) -->
        <g class="anim-internode">
            <path d="M 400 300 L 400 200" stroke="#27AE60" stroke-width="8" stroke-linecap="round" fill="none" />
        </g>

        <!-- Upper Plant (Translates Y) -->
        <g class="anim-upper-plant">
            <!-- Upper Stem -->
            <path d="M 400 200 L 400 150" stroke="#27AE60" stroke-width="6" stroke-linecap="round" fill="none" />
            <!-- Upper Left Leaf -->
            <path d="M 400 200 C 370 180, 340 190, 330 210 C 360 220, 390 210, 400 200" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            <!-- Upper Right Leaf -->
            <path d="M 400 200 C 430 180, 460 190, 470 210 C 440 220, 410 210, 400 200" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            
            <!-- Shoot Apical Meristem (SAM) (Scales Y internally) -->
            <g class="anim-sam">
                <path d="M 392 150 C 395 130, 398 120, 400 110 C 402 120, 405 130, 408 150 Z" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            </g>

            <!-- Auxin Particles (Inside upper plant so they move with it) -->
            <g class="phase-auxin">
                <circle cx="400" cy="120" r="4" fill="#FFD700" class="particle-auxin" style="animation-delay: 0s;" />
                <circle cx="396" cy="130" r="4" fill="#FFD700" class="particle-auxin" style="animation-delay: 0.3s;" />
                <circle cx="404" cy="125" r="4" fill="#FFD700" class="particle-auxin" style="animation-delay: 0.6s;" />
                <circle cx="400" cy="135" r="4" fill="#FFD700" class="particle-auxin" style="animation-delay: 0.9s;" />
                <circle cx="398" cy="140" r="4" fill="#FFD700" class="particle-auxin" style="animation-delay: 1.2s;" />
            </g>
        </g>

        <!-- ================= CALL-OUTS ================= -->

        <!-- ABA Call-out (Stomata) -->
        <g id="callout-aba">
            <circle cx="200" cy="150" r="45" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" />
            <!-- Guard Cells -->
            <path class="anim-stomata-l" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            <path class="anim-stomata-r" fill="#2ECC71" stroke="#27AE60" stroke-width="2" />
            <!-- ABA Particles -->
            <g class="phase-aba">
                <circle cx="180" cy="130" r="3" fill="#E67E22" class="particle-aba" style="animation-delay: 0s;" />
                <circle cx="220" cy="170" r="3" fill="#E67E22" class="particle-aba" style="animation-delay: 0.5s;" />
                <circle cx="170" cy="160" r="3" fill="#E67E22" class="particle-aba" style="animation-delay: 1s;" />
                <circle cx="230" cy="140" r="3" fill="#E67E22" class="particle-aba" style="animation-delay: 1.5s;" />
                <circle cx="200" cy="120" r="3" fill="#E67E22" class="particle-aba" style="animation-delay: 2s;" />
            </g>
        </g>

        <!-- CK Call-out (Cell Division) -->
        <g id="callout-ck">
            <circle cx="600" cy="400" r="45" fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" />
            
            <!-- Cell State 1 (1 Cell) -->
            <g class="anim-cell-1">
                <rect x="580" y="380" width="40" height="40" rx="6" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="600" cy="400" r="6" fill="#2C3E50" />
            </g>
            
            <!-- Cell State 2 (2 Cells) -->
            <g class="anim-cell-2">
                <rect x="576" y="380" width="22" height="40" rx="4" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="587" cy="400" r="5" fill="#2C3E50" />
                <rect x="602" y="380" width="22" height="40" rx="4" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="613" cy="400" r="5" fill="#2C3E50" />
            </g>
            
            <!-- Cell State 3 (4 Cells) -->
            <g class="anim-cell-4">
                <rect x="576" y="376" width="22" height="22" rx="3" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="587" cy="387" r="4" fill="#2C3E50" />
                <rect x="602" y="376" width="22" height="22" rx="3" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="613" cy="387" r="4" fill="#2C3E50" />
                <rect x="576" y="402" width="22" height="22" rx="3" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="587" cy="413" r="4" fill="#2C3E50" />
                <rect x="602" y="402" width="22" height="22" rx="3" fill="#98D8C8" stroke="#2C3E50" stroke-width="2" />
                <circle cx="613" cy="413" r="4" fill="#2C3E50" />
            </g>
        </g>

        <!-- ================= HORMONE PARTICLES ================= -->

        <!-- GA Particles (Internode) -->
        <g class="phase-ga">
            <circle cx="390" cy="250" r="4" fill="#9B59B6" class="particle-ga" style="animation-delay: 0s;" />
            <circle cx="410" cy="230" r="4" fill="#9B59B6" class="particle-ga" style="animation-delay: 0.4s;" />
            <circle cx="395" cy="270" r="4" fill="#9B59B6" class="particle-ga" style="animation-delay: 0.8s;" />
            <circle cx="405" cy="260" r="4" fill="#9B59B6" class="particle-ga" style="animation-delay: 1.2s;" />
            <circle cx="385" cy="240" r="4" fill="#9B59B6" class="particle-ga" style="animation-delay: 1.6s;" />
        </g>

        <!-- CK Particles (Roots) -->
        <g class="phase-ck">
            <circle cx="390" cy="430" r="4" fill="#3498DB" class="particle-ck" style="animation-delay: 0s;" />
            <circle cx="410" cy="440" r="4" fill="#3498DB" class="particle-ck" style="animation-delay: 0.3s;" />
            <circle cx="380" cy="410" r="4" fill="#3498DB" class="particle-ck" style="animation-delay: 0.6s;" />
            <circle cx="420" cy="420" r="4" fill="#3498DB" class="particle-ck" style="animation-delay: 0.9s;" />
            <circle cx="400" cy="450" r="4" fill="#3498DB" class="particle-ck" style="animation-delay: 1.2s;" />
        </g>

        <!-- Ethylene Particles (Fruit) -->
        <g class="phase-eth">
            <g transform="translate(450, 320)">
                <circle cx="0" cy="0" r="3" fill="#E74C3C" class="particle-eth" style="animation-delay: 0s;" />
                <circle cx="0" cy="0" r="3" fill="#E74C3C" class="particle-eth" style="animation-delay: -1s;" />
                <circle cx="0" cy="0" r="3" fill="#E74C3C" class="particle-eth" style="animation-delay: -2s;" />
                <circle cx="0" cy="0" r="3" fill="#E74C3C" class="particle-eth" style="animation-delay: -0.5s;" />
                <circle cx="0" cy="0" r="3" fill="#E74C3C" class="particle-eth" style="animation-delay: -1.5s;" />
            </g>
        </g>

        <!-- ================= DYNAMIC LABELS ================= -->

        <!-- Auxin Label -->
        <g class="label-auxin">
            <rect x="550" y="100" width="230" height="40" rx="4" fill="#ffffff" stroke="#FFD700" stroke-width="2" />
            <text x="665" y="116" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Auxin (IAA)</text>
            <text x="665" y="132" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">Apical Dominance &amp; Phototropism</text>
        </g>

        <!-- GA Label -->
        <g class="label-ga">
            <rect x="550" y="230" width="230" height="40" rx="4" fill="#ffffff" stroke="#9B59B6" stroke-width="2" />
            <text x="665" y="246" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Gibberellins (GA₃)</text>
            <text x="665" y="262" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">Internode Elongation</text>
        </g>

        <!-- CK Label -->
        <g class="label-ck">
            <rect x="550" y="440" width="230" height="40" rx="4" fill="#ffffff" stroke="#3498DB" stroke-width="2" />
            <text x="665" y="456" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Cytokinins</text>
            <text x="665" y="472" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">Cell Division &amp; Delaying Senescence</text>
        </g>

        <!-- ABA Label -->
        <g class="label-aba">
            <rect x="85" y="40" width="230" height="40" rx="4" fill="#ffffff" stroke="#E67E22" stroke-width="2" />
            <text x="200" y="56" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Abscisic Acid (ABA)</text>
            <text x="200" y="72" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">Stomatal Closure (Stress Hormone)</text>
        </g>

        <!-- Ethylene Label -->
        <g class="label-eth">
            <rect x="85" y="300" width="230" height="40" rx="4" fill="#ffffff" stroke="#E74C3C" stroke-width="2" />
            <text x="200" y="316" font-family="Inter" font-size="12" font-weight="700" fill="#2C3E50" text-anchor="middle">Ethylene</text>
            <text x="200" y="332" font-family="Inter" font-size="10" fill="#2C3E50" text-anchor="middle">Fruit Ripening &amp; Abscission</text>
        </g>

    </svg>
</div>

</body>
</html>
