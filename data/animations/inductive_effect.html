<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Inductive Effect (I-Effect)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animations */
        .fade-in-label {
            animation: labelFade 8s ease-in-out infinite;
        }

        .inductive-arrow {
            animation: arrowAppear 8s ease-in-out infinite;
        }

        .mech-note {
            animation: arrowAppear 8s ease-in-out infinite;
        }

        .blue-cloud {
            animation: bluePulse 8s ease-in-out infinite;
        }

        .red-cloud {
            animation: redPulse 8s ease-in-out infinite;
        }

        .delta-charge {
            animation: chargeAppear 8s ease-in-out infinite;
        }

        @keyframes labelFade {
            0%, 5% { opacity: 0; transform: translateY(10px); }
            15%, 90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        @keyframes arrowAppear {
            0%, 25% { opacity: 0; }
            30%, 85% { opacity: 1; }
            90%, 100% { opacity: 0; }
        }

        @keyframes bluePulse {
            0%, 25% { opacity: 0; transform: translateY(-40px) scale(0.8); }
            35% { opacity: 0.6; transform: translateY(-20px) scale(1); }
            50%, 85% { opacity: 0.5; transform: translateY(20px) scale(1.4); }
            90%, 100% { opacity: 0; transform: translateY(20px) scale(1.4); }
        }

        @keyframes redPulse {
            0%, 25% { opacity: 0; transform: translateY(20px) scale(1.4); }
            35% { opacity: 0.6; transform: translateY(0px) scale(1.1); }
            50%, 85% { opacity: 0.5; transform: translateY(-40px) scale(0.8); }
            90%, 100% { opacity: 0; transform: translateY(-40px) scale(0.8); }
        }

        @keyframes chargeAppear {
            0%, 60% { opacity: 0; transform: scale(0.8); }
            65%, 85% { opacity: 1; transform: scale(1); }
            90%, 100% { opacity: 0; transform: scale(0.8); }
        }

        /* Typography Classes */
        .title { font-size: 24px; font-weight: 700; fill: #222; text-anchor: middle; }
        .mol-title { font-size: 18px; font-weight: 600; fill: #222; text-anchor: middle; }
        .mol-subtitle-plus { font-size: 14px; font-weight: 600; fill: #4444FF; text-anchor: middle; }
        .mol-subtitle-minus { font-size: 14px; font-weight: 600; fill: #FF4444; text-anchor: middle; }
        .formula { font-family: 'Roboto Mono', monospace; font-size: 14px; fill: #666; text-anchor: middle; }
        .atom-label { font-size: 14px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
        .atom-label-dark { font-size: 12px; font-weight: 700; fill: #333; text-anchor: middle; dominant-baseline: central; }
        .delta-text { font-size: 22px; font-weight: 700; }
        .delta-plus { fill: #4444FF; }
        .delta-minus { fill: #FF4444; }
        .note-text { font-size: 12px; font-weight: 600; fill: #F77F00; }
        .legend-text { font-size: 12px; fill: #444; dominant-baseline: central; }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <!-- Definitions for Gradients -->
        <defs>
            <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#4444FF" stop-opacity="0.8"/>
                <stop offset="60%" stop-color="#4444FF" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#4444FF" stop-opacity="0"/>
            </radialGradient>
            
            <radialGradient id="redGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FF4444" stop-opacity="0.8"/>
                <stop offset="60%" stop-color="#FF4444" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#FF4444" stop-opacity="0"/>
            </radialGradient>
        </defs>

        <!-- Main Title -->
        <text x="400" y="45" class="title">The Inductive Effect (I-Effect)</text>
        <line x1="250" y1="60" x2="550" y2="60" stroke="#e0e0e0" stroke-width="2" stroke-linecap="round"/>

        <!-- ========================================== -->
        <!-- LEFT MOLECULE: TOLUENE (+I EFFECT)         -->
        <!-- ========================================== -->
        <g transform="translate(220, 250)">
            
            <!-- Electron Density Cloud (Blue, entering ring) -->
            <ellipse cx="0" cy="-85" rx="30" ry="45" fill="url(#blueGlow)" class="blue-cloud"/>

            <!-- Benzene Ring -->
            <polygon points="0,-60 51.96,-30 51.96,30 0,60 -51.96,30 -51.96,-30" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
            <!-- Double Bonds -->
            <line x1="41.57" y1="-24" x2="41.57" y2="24" stroke="#555" stroke-width="3" stroke-linecap="round"/>
            <line x1="-41.57" y1="24" x2="0" y2="48" stroke="#555" stroke-width="3" stroke-linecap="round"/>
            <line x1="-41.57" y1="-24" x2="0" y2="-48" stroke="#555" stroke-width="3" stroke-linecap="round"/>

            <!-- Sigma Bond to Substituent -->
            <line x1="0" y1="-60" x2="0" y2="-110" stroke="#333" stroke-width="4"/>

            <!-- Substituent: Methyl Group (-CH3) -->
            <!-- Bonds to Hydrogens -->
            <line x1="0" y1="-110" x2="0" y2="-150" stroke="#333" stroke-width="3"/>
            <line x1="0" y1="-110" x2="-30" y2="-130" stroke="#333" stroke-width="3"/>
            <line x1="0" y1="-110" x2="30" y2="-130" stroke="#333" stroke-width="3"/>
            
            <!-- Atoms -->
            <circle cx="0" cy="-150" r="10" fill="#CCCCCC"/>
            <text x="0" y="-150" class="atom-label-dark">H</text>
            
            <circle cx="-30" cy="-130" r="10" fill="#CCCCCC"/>
            <text x="-30" y="-130" class="atom-label-dark">H</text>
            
            <circle cx="30" cy="-130" r="10" fill="#CCCCCC"/>
            <text x="30" y="-130" class="atom-label-dark">H</text>

            <circle cx="0" cy="-110" r="14" fill="#404040"/>
            <text x="0" y="-110" class="atom-label">C</text>

            <!-- Inductive Arrow (+I, pointing to ring) -->
            <g class="inductive-arrow">
                <polyline points="-8,-93 0,-83 8,-93" fill="none" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="-20" y="-80" class="note-text" text-anchor="end">σ-electron displacement</text>
            </g>

            <!-- Partial Charges -->
            <g class="delta-charge">
                <!-- delta+ on CH3 -->
                <text x="45" y="-105" class="delta-text delta-plus">δ<tspan baseline-shift="super" font-size="0.6em">+</tspan></text>
                <!-- delta- on Ring -->
                <text x="0" y="10" class="delta-text delta-minus" text-anchor="middle">δ<tspan baseline-shift="super" font-size="0.6em">-</tspan></text>
            </g>

            <!-- Labels -->
            <g class="fade-in-label">
                <text x="0" y="110" class="mol-title">Toluene</text>
                <text x="0" y="135" class="mol-subtitle-plus">+I Effect (Electron Donating)</text>
                <text x="0" y="160" class="formula">C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">5</tspan>CH<tspan baseline-shift="sub" font-size="0.7em">3</tspan></text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- RIGHT MOLECULE: CHLOROBENZENE (-I EFFECT)  -->
        <!-- ========================================== -->
        <g transform="translate(580, 250)">
            
            <!-- Electron Density Cloud (Red, leaving ring) -->
            <ellipse cx="0" cy="-85" rx="30" ry="45" fill="url(#redGlow)" class="red-cloud"/>

            <!-- Benzene Ring -->
            <polygon points="0,-60 51.96,-30 51.96,30 0,60 -51.96,30 -51.96,-30" fill="none" stroke="#333" stroke-width="4" stroke-linejoin="round"/>
            <!-- Double Bonds -->
            <line x1="41.57" y1="-24" x2="41.57" y2="24" stroke="#555" stroke-width="3" stroke-linecap="round"/>
            <line x1="-41.57" y1="24" x2="0" y2="48" stroke="#555" stroke-width="3" stroke-linecap="round"/>
            <line x1="-41.57" y1="-24" x2="0" y2="-48" stroke="#555" stroke-width="3" stroke-linecap="round"/>

            <!-- Sigma Bond to Substituent -->
            <line x1="0" y1="-60" x2="0" y2="-120" stroke="#333" stroke-width="4"/>

            <!-- Substituent: Chlorine Atom (-Cl) -->
            <circle cx="0" cy="-120" r="18" fill="#44CC44"/>
            <text x="0" y="-120" class="atom-label">Cl</text>

            <!-- Inductive Arrow (-I, pointing to Cl) -->
            <g class="inductive-arrow">
                <polyline points="-8,-83 0,-93 8,-83" fill="none" stroke="#F77F00" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <text x="20" y="-80" class="note-text" text-anchor="start">σ-electron displacement</text>
            </g>

            <!-- Partial Charges -->
            <g class="delta-charge">
                <!-- delta- on Cl -->
                <text x="40" y="-115" class="delta-text delta-minus">δ<tspan baseline-shift="super" font-size="0.6em">-</tspan></text>
                <!-- delta+ on Ring -->
                <text x="0" y="10" class="delta-text delta-plus" text-anchor="middle">δ<tspan baseline-shift="super" font-size="0.6em">+</tspan></text>
            </g>

            <!-- Labels -->
            <g class="fade-in-label">
                <text x="0" y="110" class="mol-title">Chlorobenzene</text>
                <text x="0" y="135" class="mol-subtitle-minus">-I Effect (Electron Withdrawing)</text>
                <text x="0" y="160" class="formula">C<tspan baseline-shift="sub" font-size="0.7em">6</tspan>H<tspan baseline-shift="sub" font-size="0.7em">5</tspan>Cl</text>
            </g>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(150, 440)">
            <rect x="0" y="0" width="500" height="40" rx="20" fill="#ffffff" stroke="#e0e0e0" stroke-width="2"/>
            
            <!-- Carbon -->
            <circle cx="30" cy="20" r="8" fill="#404040"/>
            <text x="45" y="20" class="legend-text">Carbon</text>
            
            <!-- Hydrogen -->
            <circle cx="120" cy="20" r="8" fill="#CCCCCC"/>
            <text x="135" y="20" class="legend-text">Hydrogen</text>
            
            <!-- Chlorine -->
            <circle cx="220" cy="20" r="8" fill="#44CC44"/>
            <text x="235" y="20" class="legend-text">Chlorine</text>
            
            <!-- Electron Flow -->
            <path d="M 315 20 L 345 20 M 335 14 L 345 20 L 335 26" stroke="#F77F00" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <text x="355" y="20" class="legend-text">Electron Flow</text>
        </g>

    </svg>

</body>
</html>
