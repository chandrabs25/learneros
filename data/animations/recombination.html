<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genetic Recombination (Crossing Over)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8f9fa;
            font-family: 'Inter', sans-serif;
        }

        svg {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Animations */
        .scene {
            animation: sceneFade 12s infinite ease-in-out;
        }

        .maternal-group {
            animation: moveMaternal 12s infinite ease-in-out;
        }

        .paternal-group {
            animation: movePaternal 12s infinite ease-in-out;
        }

        .mat-bot-orig {
            transform-origin: 380px 280px;
            animation: matBotOrigAnim 12s infinite ease-in-out;
        }

        .mat-bot-rec {
            transform-origin: 380px 280px;
            animation: matBotRecAnim 12s infinite ease-in-out;
            opacity: 0;
        }

        .pat-bot-orig {
            transform-origin: 420px 280px;
            animation: patBotOrigAnim 12s infinite ease-in-out;
        }

        .pat-bot-rec {
            transform-origin: 420px 280px;
            animation: patBotRecAnim 12s infinite ease-in-out;
            opacity: 0;
        }

        .chiasma-glow {
            animation: glowAnim 12s infinite ease-in-out;
            opacity: 0;
        }

        .static-labels {
            animation: labelsAnim 12s infinite ease-in-out;
            opacity: 0;
        }

        .text1 { animation: t1 12s infinite ease-in-out; }
        .text2 { animation: t2 12s infinite ease-in-out; opacity: 0; }
        .text3 { animation: t3 12s infinite ease-in-out; opacity: 0; }
        .text4 { animation: t4 12s infinite ease-in-out; opacity: 0; }

        /* Keyframes */
        @keyframes sceneFade {
            0%, 2% { opacity: 0; }
            5%, 95% { opacity: 1; }
            98%, 100% { opacity: 0; }
        }

        @keyframes moveMaternal {
            0%, 10% { transform: translateX(-150px); }
            25%, 75% { transform: translateX(0px); }
            85%, 95% { transform: translateX(-60px); }
            100% { transform: translateX(-150px); }
        }

        @keyframes movePaternal {
            0%, 10% { transform: translateX(150px); }
            25%, 75% { transform: translateX(0px); }
            85%, 95% { transform: translateX(60px); }
            100% { transform: translateX(150px); }
        }

        @keyframes matBotOrigAnim {
            0%, 25% { transform: rotate(0deg); opacity: 1; }
            35%, 45% { transform: rotate(22deg); opacity: 1; }
            50%, 100% { transform: rotate(22deg); opacity: 0; }
        }

        @keyframes matBotRecAnim {
            0%, 45% { transform: rotate(22deg); opacity: 0; }
            50%, 65% { transform: rotate(22deg); opacity: 1; }
            75%, 95% { transform: rotate(0deg); opacity: 1; }
            100% { transform: rotate(0deg); opacity: 0; }
        }

        @keyframes patBotOrigAnim {
            0%, 25% { transform: rotate(0deg); opacity: 1; }
            35%, 45% { transform: rotate(-22deg); opacity: 1; }
            50%, 100% { transform: rotate(-22deg); opacity: 0; }
        }

        @keyframes patBotRecAnim {
            0%, 45% { transform: rotate(-22deg); opacity: 0; }
            50%, 65% { transform: rotate(-22deg); opacity: 1; }
            75%, 95% { transform: rotate(0deg); opacity: 1; }
            100% { transform: rotate(0deg); opacity: 0; }
        }

        @keyframes glowAnim {
            0%, 25% { opacity: 0; }
            35%, 65% { opacity: 0.8; }
            75%, 100% { opacity: 0; }
        }

        @keyframes labelsAnim {
            0%, 15% { opacity: 0; }
            25%, 70% { opacity: 1; }
            75%, 100% { opacity: 0; }
        }

        @keyframes t1 {
            0%, 20% { opacity: 1; }
            25%, 100% { opacity: 0; }
        }
        @keyframes t2 {
            0%, 20% { opacity: 0; }
            25%, 40% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }
        @keyframes t3 {
            0%, 40% { opacity: 0; }
            45%, 60% { opacity: 1; }
            65%, 100% { opacity: 0; }
        }
        @keyframes t4 {
            0%, 60% { opacity: 0; }
            65%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
        <title>Molecular Mechanism of Homologous Recombination (Crossing Over)</title>
        <desc>An animated diagram showing two homologous chromosomes aligning, forming a chiasma, and exchanging genetic material between non-sister chromatids to create recombinant chromatids.</desc>

        <defs>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
            </filter>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" rx="12" />

        <!-- Title -->
        <text x="400" y="45" font-family="Inter" font-size="24" font-weight="700" fill="#2C3E50" text-anchor="middle">Genetic Recombination (Crossing Over)</text>
        <text x="400" y="65" font-family="Inter" font-size="14" font-weight="400" fill="#7F8C8D" text-anchor="middle">Prophase I of Meiosis (Pachytene Stage)</text>

        <!-- Legend -->
        <g transform="translate(620, 20)">
            <rect x="0" y="0" width="160" height="85" fill="#f8f9fa" rx="6" stroke="#E8F4FD" stroke-width="2"/>
            <rect x="15" y="15" width="14" height="14" fill="#FF6B6B" rx="3"/>
            <text x="40" y="27" font-family="Inter" font-size="12" font-weight="600" fill="#2C3E50">Maternal DNA</text>
            
            <rect x="15" y="40" width="14" height="14" fill="#4A90D9" rx="3"/>
            <text x="40" y="52" font-family="Inter" font-size="12" font-weight="600" fill="#2C3E50">Paternal DNA</text>
            
            <circle cx="22" cy="70" r="7" fill="#98D8C8"/>
            <text x="40" y="74" font-family="Inter" font-size="12" font-weight="600" fill="#2C3E50">Centromere</text>
        </g>

        <!-- Main Animation Scene -->
        <g class="scene">
            
            <!-- Static Annotations (Fade in during synapsis) -->
            <g class="static-labels">
                <!-- Sister Chromatids -->
                <text x="260" y="105" font-family="Inter" font-size="14" font-weight="600" fill="#7F8C8D" text-anchor="end">Sister Chromatids</text>
                <path d="M 270 100 L 330 120 M 270 100 L 370 120" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round"/>
                
                <!-- Centromere -->
                <text x="260" y="205" font-family="Inter" font-size="14" font-weight="600" fill="#7F8C8D" text-anchor="end">Centromere</text>
                <path d="M 270 200 L 325 200" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round"/>

                <!-- Non-sister Chromatids -->
                <text x="540" y="105" font-family="Inter" font-size="14" font-weight="600" fill="#7F8C8D" text-anchor="start">Non-sister Chromatids</text>
                <path d="M 530 100 L 390 130 M 530 100 L 410 130" stroke="#BDC3C7" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>

            <!-- Chiasma Glow Effect -->
            <circle class="chiasma-glow" cx="400" cy="335" r="18" fill="#F39C12" filter="url(#glow)" />

            <!-- Maternal Chromosome Group -->
            <g class="maternal-group" filter="url(#shadow)">
                <!-- Outer Chromatid -->
                <path d="M 340 120 L 340 400" stroke="#FF6B6B" stroke-width="22" stroke-linecap="round" />
                
                <!-- Inner Chromatid Top -->
                <path d="M 380 120 L 380 280" stroke="#FF6B6B" stroke-width="22" stroke-linecap="round" />

                <!-- Inner Chromatid Bottom (Original - Red) -->
                <g class="mat-bot-orig">
                    <path d="M 380 280 L 380 400" stroke="#FF6B6B" stroke-width="22" stroke-linecap="round" />
                    <!-- Allele B -->
                    <g transform="translate(380, 350)">
                        <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                        <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">B</text>
                    </g>
                </g>

                <!-- Inner Chromatid Bottom (Recombinant - Blue) -->
                <g class="mat-bot-rec">
                    <path d="M 380 280 L 380 400" stroke="#4A90D9" stroke-width="22" stroke-linecap="round" />
                    <!-- Allele b -->
                    <g transform="translate(380, 350)">
                        <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                        <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">b</text>
                    </g>
                </g>

                <!-- Centromere -->
                <ellipse cx="360" cy="200" rx="28" ry="14" fill="#98D8C8" />

                <!-- Alleles Top (A) -->
                <g transform="translate(340, 150)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">A</text>
                </g>
                <g transform="translate(380, 150)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">A</text>
                </g>

                <!-- Allele Bottom Outer (B) -->
                <g transform="translate(340, 350)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">B</text>
                </g>
            </g>

            <!-- Paternal Chromosome Group -->
            <g class="paternal-group" filter="url(#shadow)">
                <!-- Outer Chromatid -->
                <path d="M 460 120 L 460 400" stroke="#4A90D9" stroke-width="22" stroke-linecap="round" />
                
                <!-- Inner Chromatid Top -->
                <path d="M 420 120 L 420 280" stroke="#4A90D9" stroke-width="22" stroke-linecap="round" />

                <!-- Inner Chromatid Bottom (Original - Blue) -->
                <g class="pat-bot-orig">
                    <path d="M 420 280 L 420 400" stroke="#4A90D9" stroke-width="22" stroke-linecap="round" />
                    <!-- Allele b -->
                    <g transform="translate(420, 350)">
                        <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                        <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">b</text>
                    </g>
                </g>

                <!-- Inner Chromatid Bottom (Recombinant - Red) -->
                <g class="pat-bot-rec">
                    <path d="M 420 280 L 420 400" stroke="#FF6B6B" stroke-width="22" stroke-linecap="round" />
                    <!-- Allele B -->
                    <g transform="translate(420, 350)">
                        <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                        <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#FF6B6B" text-anchor="middle">B</text>
                    </g>
                </g>

                <!-- Centromere -->
                <ellipse cx="440" cy="200" rx="28" ry="14" fill="#98D8C8" />

                <!-- Alleles Top (a) -->
                <g transform="translate(420, 150)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">a</text>
                </g>
                <g transform="translate(460, 150)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">a</text>
                </g>

                <!-- Allele Bottom Outer (b) -->
                <g transform="translate(460, 350)">
                    <rect x="-10" y="-10" width="20" height="20" fill="#ffffff" rx="4" />
                    <text x="0" y="5" font-family="Roboto Mono" font-size="14" font-weight="700" fill="#4A90D9" text-anchor="middle">b</text>
                </g>
            </g>

        </g>

        <!-- Dynamic Stage Labels -->
        <g font-family="Inter" font-size="20" font-weight="700" fill="#2C3E50" text-anchor="middle">
            <text x="400" y="470" class="text1">1. Homologous Pair Alignment</text>
            <text x="400" y="470" class="text2">2. Synapsis &amp; Chiasma Formation</text>
            <text x="400" y="470" class="text3">3. Exchange of Genetic Material</text>
            <text x="400" y="470" class="text4">4. Recombinant Chromatids</text>
        </g>

    </svg>

</body>
</html>
