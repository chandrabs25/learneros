<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Plan of a Coelomate (Annelida)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1200px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        /* Animations */
        @keyframes peristalsis {
            0%, 100% { transform: scale(1, 1); }
            15%, 25% { transform: scale(0.88, 1.12); } /* Circular Contraction (Narrows & Elongates) */
            50% { transform: scale(1, 1); }
            65%, 75% { transform: scale(1.12, 0.88); } /* Longitudinal Contraction (Widens & Shortens) */
        }

        @keyframes circ-glow {
            0%, 100% { filter: drop-shadow(0 0 0px rgba(231,76,60,0)); stroke: #E74C3C; }
            15%, 25% { filter: drop-shadow(0 0 8px rgba(231,76,60,0.8)); stroke: #ff5e4d; }
            50% { filter: drop-shadow(0 0 0px rgba(231,76,60,0)); stroke: #E74C3C; }
        }

        @keyframes long-glow {
            0%, 50%, 100% { filter: drop-shadow(0 0 0px rgba(192,57,43,0)); stroke: #C0392B; stroke-width: 20px; }
            65%, 75% { filter: drop-shadow(0 0 8px rgba(192,57,43,0.8)); stroke: #e34332; stroke-width: 24px; }
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.25); }
            30% { transform: scale(1); }
            45% { transform: scale(1.25); }
        }

        @keyframes fluid-spin-1 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fluid-spin-2 {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        /* Applying Animations */
        .worm-body {
            animation: peristalsis 8s ease-in-out infinite;
            transform-origin: 500px 320px;
        }

        .circ-muscle {
            animation: circ-glow 8s ease-in-out infinite;
        }

        .long-muscle {
            animation: long-glow 8s ease-in-out infinite;
        }

        .dorsal-vessel {
            animation: heartbeat 0.5s infinite ease-in-out;
            transform-origin: 500px 215px; /* Center of dorsal vessel */
        }

        .fluid-layer-1 {
            animation: fluid-spin-1 24s linear infinite;
            transform-origin: 500px 320px;
        }

        .fluid-layer-2 {
            animation: fluid-spin-2 18s linear infinite;
            transform-origin: 500px 320px;
        }

        .fluid-particle {
            animation: pulse-opacity 4s ease-in-out infinite;
        }

        /* Typography & Styling */
        .title { font-size: 26px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; font-weight: 400; fill: #7F8C8D; }
        .label { font-size: 14px; font-weight: 600; fill: #2C3E50; }
        .sub-label { font-size: 12px; font-weight: 400; fill: #7F8C8D; }
        .sci-note { font-family: 'Roboto Mono', monospace; font-size: 13px; fill: #555; }
        .legend-text { font-size: 12px; font-weight: 500; fill: #34495E; }
        
        .pointer {
            stroke: #95A5A6;
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 4 2;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 1000 650" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Coelomate Body Plan (Annelida)</title>
        <desc>An animated cross-section of an annelid demonstrating the tube-within-a-tube body plan, true coelom lined by mesoderm, and hydrostatic skeleton muscle contractions.</desc>

        <!-- Defs for Gradients and Markers -->
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#95A5A6" />
            </marker>
            <marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                <path d="M 10 0 L 0 5 L 10 10 z" fill="#95A5A6" />
            </marker>
            
            <radialGradient id="gut-grad" cx="50%" cy="50%" r="50%">
                <stop offset="70%" stop-color="#F39C12" />
                <stop offset="100%" stop-color="#D68910" />
            </radialGradient>

            <radialGradient id="coelom-grad" cx="50%" cy="50%" r="50%">
                <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#E8F4FD" stop-opacity="1"/>
            </radialGradient>
        </defs>

        <!-- Header -->
        <text x="500" y="50" text-anchor="middle" class="title">Body Plan of a Coelomate (Annelida)</text>
        <text x="500" y="75" text-anchor="middle" class="subtitle">Transverse Cross-Section & Hydrostatic Skeleton Dynamics</text>

        <!-- Static Background Elements (Pointers & Labels) -->
        <g id="labels-left">
            <!-- Epidermis -->
            <polyline points="220,160 290,160 330,280" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="210" y="165" text-anchor="end" class="label">Ectoderm (Epidermis)</text>
            <text x="210" y="180" text-anchor="end" class="sub-label">Outer body wall</text>

            <!-- Circular Muscle -->
            <polyline points="220,220 290,220 340,260" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="210" y="225" text-anchor="end" class="label" fill="#E74C3C">Circular Muscle</text>
            <text x="210" y="240" text-anchor="end" class="sub-label">Contracts to elongate body</text>

            <!-- Longitudinal Muscle -->
            <polyline points="220,280 290,280 355,240" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="210" y="285" text-anchor="end" class="label" fill="#C0392B">Longitudinal Muscle</text>
            <text x="210" y="300" text-anchor="end" class="sub-label">Contracts to shorten body</text>

            <!-- Peritoneum -->
            <polyline points="220,350 290,350 365,210" class="pointer" marker-start="url(#arrow-start)"/>
            <polyline points="220,350 290,350 435,300" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="210" y="355" text-anchor="end" class="label" fill="#27AE60">Peritoneum</text>
            <text x="210" y="370" text-anchor="end" class="sub-label">Mesodermal lining</text>
        </g>

        <g id="labels-right">
            <!-- Dorsal Blood Vessel -->
            <polyline points="780,140 710,140 515,215" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="790" y="145" text-anchor="start" class="label" fill="#E74C3C">Dorsal Blood Vessel</text>
            <text x="790" y="160" text-anchor="start" class="sub-label">Main pumping organ</text>

            <!-- Coelom -->
            <polyline points="780,210 710,210 610,250" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="790" y="215" text-anchor="start" class="label" fill="#2980B9">Coelom (True Body Cavity)</text>
            <text x="790" y="230" text-anchor="start" class="sub-label">Fluid-filled hydrostatic skeleton</text>
            <text x="790" y="245" text-anchor="start" class="sub-label" font-weight="bold" fill="#27AE60">→ Entirely lined by mesoderm</text>

            <!-- Endoderm -->
            <polyline points="780,310 710,310 555,320" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="790" y="315" text-anchor="start" class="label" fill="#D68910">Endoderm (Gut Wall)</text>
            <text x="790" y="330" text-anchor="start" class="sub-label">Digestive tract</text>

            <!-- Gut Lumen -->
            <polyline points="780,380 710,380 525,330" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="790" y="385" text-anchor="start" class="label">Gut Lumen</text>
            <text x="790" y="400" text-anchor="start" class="sub-label">Central hollow space</text>

            <!-- Ventral Nerve Cord -->
            <polyline points="780,450 710,450 515,445" class="pointer" marker-start="url(#arrow-start)"/>
            <text x="790" y="455" text-anchor="start" class="label" fill="#D4AC0D">Ventral Nerve Cord</text>
            <text x="790" y="470" text-anchor="start" class="sub-label">Double solid structure</text>
        </g>

        <!-- ANIMATED WORM CROSS-SECTION -->
        <g class="worm-body">
            <!-- Center of worm is at (500, 320) -->
            <g transform="translate(500, 320)">
                
                <!-- Coelom Base -->
                <circle cx="0" cy="0" r="144" fill="url(#coelom-grad)" />

                <!-- Fluid Dynamics Particles -->
                <g class="fluid-layer-1">
                    <circle cx="80" cy="80" r="4" fill="#98D8C8" class="fluid-particle" style="animation-delay: 0s;"/>
                    <circle cx="-90" cy="40" r="3" fill="#98D8C8" class="fluid-particle" style="animation-delay: 1s;"/>
                    <circle cx="30" cy="-100" r="5" fill="#98D8C8" class="fluid-particle" style="animation-delay: 2s;"/>
                    <circle cx="-110" cy="-60" r="3" fill="#98D8C8" class="fluid-particle" style="animation-delay: 0.5s;"/>
                    <circle cx="110" cy="-30" r="4" fill="#98D8C8" class="fluid-particle" style="animation-delay: 1.5s;"/>
                    <circle cx="-40" cy="110" r="4" fill="#98D8C8" class="fluid-particle" style="animation-delay: 2.5s;"/>
                </g>
                <g class="fluid-layer-2">
                    <circle cx="60" cy="-80" r="3" fill="#4A90D9" class="fluid-particle" style="animation-delay: 0.2s;"/>
                    <circle cx="-70" cy="-90" r="4" fill="#4A90D9" class="fluid-particle" style="animation-delay: 1.2s;"/>
                    <circle cx="100" cy="60" r="3" fill="#4A90D9" class="fluid-particle" style="animation-delay: 2.2s;"/>
                    <circle cx="-80" cy="80" r="5" fill="#4A90D9" class="fluid-particle" style="animation-delay: 0.7s;"/>
                    <circle cx="120" cy="10" r="3" fill="#4A90D9" class="fluid-particle" style="animation-delay: 1.7s;"/>
                </g>

                <!-- Mesenteries (Dorsal and Ventral) -->
                <!-- These connect the inner and outer peritoneum, suspending the gut -->
                <line x1="0" y1="-66" x2="0" y2="-144" stroke="#98D8C8" stroke-width="4"/>
                <line x1="0" y1="66" x2="0" y2="144" stroke="#98D8C8" stroke-width="4"/>

                <!-- ENDODERM (Gut) -->
                <!-- Inner Peritoneum (Visceral) -->
                <circle cx="0" cy="0" r="66" fill="none" stroke="#98D8C8" stroke-width="4"/>
                <!-- Gut Wall -->
                <circle cx="0" cy="0" r="50" fill="none" stroke="url(#gut-grad)" stroke-width="28"/>
                <!-- Gut Lumen -->
                <circle cx="0" cy="0" r="36" fill="#FFFFFF"/>

                <!-- ECTODERM & MESODERM (Body Wall) -->
                <!-- Outer Peritoneum (Parietal) -->
                <circle cx="0" cy="0" r="144" fill="none" stroke="#98D8C8" stroke-width="4"/>
                
                <!-- Longitudinal Muscle (Bundles) -->
                <!-- Using stroke-dasharray to simulate bundles of muscle fibers in cross-section -->
                <circle cx="0" cy="0" r="156" fill="none" stroke="#C0392B" stroke-width="20" stroke-dasharray="12 6" class="long-muscle"/>
                
                <!-- Circular Muscle -->
                <circle cx="0" cy="0" r="171" fill="none" stroke="#E74C3C" stroke-width="10" class="circ-muscle"/>
                
                <!-- Epidermis (Ectoderm) -->
                <circle cx="0" cy="0" r="178" fill="none" stroke="#4A90D9" stroke-width="4"/>

                <!-- INTERNAL ORGANS -->
                <!-- Dorsal Blood Vessel (Pulsing) -->
                <circle cx="0" cy="-105" r="14" fill="#E74C3C" class="dorsal-vessel"/>
                <circle cx="0" cy="-105" r="6" fill="#78281F" class="dorsal-vessel" opacity="0.5"/>

                <!-- Ventral Blood Vessel -->
                <circle cx="0" cy="105" r="9" fill="#E74C3C"/>
                <circle cx="0" cy="105" r="4" fill="#78281F" opacity="0.5"/>

                <!-- Ventral Nerve Cord -->
                <g transform="translate(0, 125)">
                    <circle cx="-7" cy="0" r="7" fill="#F1C40F"/>
                    <circle cx="7" cy="0" r="7" fill="#F1C40F"/>
                    <!-- Nerve cord sheath -->
                    <path d="M -14 0 A 14 14 0 0 0 14 0 A 14 14 0 0 0 -14 0" fill="none" stroke="#D4AC0D" stroke-width="1.5"/>
                </g>

            </g>
        </g>

        <!-- Legend -->
        <g transform="translate(40, 520)">
            <rect x="0" y="0" width="180" height="100" fill="#ffffff" rx="6" stroke="#E5E7EB" stroke-width="1"/>
            <text x="10" y="20" class="label" font-size="13">Tissue Layers Key</text>
            
            <rect x="10" y="32" width="12" height="12" fill="#4A90D9" rx="2"/>
            <text x="30" y="42" class="legend-text">Ectoderm (Outer)</text>

            <rect x="10" y="52" width="12" height="12" fill="#E74C3C" rx="2"/>
            <rect x="24" y="52" width="12" height="12" fill="#98D8C8" rx="2"/>
            <text x="44" y="62" class="legend-text">Mesoderm (Muscle/Lining)</text>

            <rect x="10" y="72" width="12" height="12" fill="#F39C12" rx="2"/>
            <text x="30" y="82" class="legend-text">Endoderm (Gut)</text>
        </g>

        <!-- Scientific Note -->
        <rect x="0" y="610" width="1000" height="40" fill="#E8F4FD" opacity="0.6"/>
        <text x="500" y="635" text-anchor="middle" class="sci-note">Note: Annelids exhibit a schizocoelous coelom, where the solid mesoderm splits to form the true body cavity.</text>

    </svg>
</div>

</body>
</html>
