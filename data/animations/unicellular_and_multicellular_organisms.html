<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Levels of Biological Organization</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:ital@0;1&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        .svg-container {
            width: 100%;
            max-width: 1000px;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
        }

        text {
            fill: #2C3E50;
        }

        .scientific {
            font-family: 'Roboto Mono', monospace;
            font-style: italic;
        }

        /* --- Animations --- */
        
        /* Panel B Fade In/Out */
        @keyframes panelBFade {
            0%, 30% { opacity: 0.05; }
            40%, 92% { opacity: 1; }
            100% { opacity: 0.05; }
        }
        .panel-b {
            animation: panelBFade 12s infinite ease-in-out;
        }

        /* Amoeba Label */
        @keyframes amoebaLabel {
            0%, 35% { opacity: 1; }
            45%, 100% { opacity: 0; }
        }
        .label-amoeba {
            animation: amoebaLabel 12s infinite ease-in-out;
        }

        /* Multicellular Label */
        @keyframes multiLabel {
            0%, 65% { opacity: 0; }
            75%, 92% { opacity: 1; }
            100% { opacity: 0; }
        }
        .label-multi {
            animation: multiLabel 12s infinite ease-in-out;
        }

        /* Food Particle Move & Fade */
        @keyframes foodMove {
            0%, 12.5% { transform: translate(0, 0); opacity: 1; }
            25% { transform: translate(70px, 10px); opacity: 1; }
            33.3% { transform: translate(70px, 10px); opacity: 0; }
            100% { transform: translate(70px, 10px); opacity: 0; }
        }
        .food-particle {
            animation: foodMove 12s infinite ease-in-out;
        }

        /* Food Vacuole Appear */
        @keyframes vacuoleAppear {
            0%, 25% { opacity: 0; }
            33.3%, 83.3% { opacity: 1; }
            100% { opacity: 0; }
        }
        .food-vacuole {
            animation: vacuoleAppear 12s infinite ease-in-out;
        }

        /* Contractile Vacuole Pulse */
        @keyframes cvPulse {
            0%, 80% { transform: scale(1); }
            90% { transform: scale(0.4); }
            100% { transform: scale(1); }
        }
        .contractile-vacuole {
            transform-origin: 160px 280px;
            animation: cvPulse 3s infinite ease-in-out;
        }

        /* Tissue Cell Pulse (Coordination) */
        @keyframes tissuePulse {
            0%, 41% { transform: scale(1); fill: #E8F4FD; }
            48% { transform: scale(1.08); fill: #D6EAF8; }
            55% { transform: scale(1); fill: #E8F4FD; }
            62% { transform: scale(1.08); fill: #D6EAF8; }
            69% { transform: scale(1); fill: #E8F4FD; }
            100% { transform: scale(1); fill: #E8F4FD; }
        }
        .tissue-cell {
            transform-origin: 0 0;
            animation: tissuePulse 12s infinite ease-in-out;
        }

        /* Signal Dots */
        @keyframes signalDot {
            0%, 41% { opacity: 0; transform: translate(0,0); }
            45% { opacity: 1; }
            55% { opacity: 0; transform: translate(var(--dx), var(--dy)); }
            100% { opacity: 0; }
        }
        .signal {
            animation: signalDot 12s infinite ease-in-out;
        }

        /* Organ Pump */
        @keyframes organPump {
            0%, 75% { transform: scaleY(1); }
            80% { transform: scaleY(0.85); }
            85% { transform: scaleY(1.08); }
            90% { transform: scaleY(0.85); }
            95% { transform: scaleY(1); }
            100% { transform: scaleY(1); }
        }
        .organ {
            transform-origin: 600px 380px;
            animation: organPump 12s infinite ease-in-out;
        }

        /* Pointer Lines */
        .pointer {
            stroke: #2C3E50;
            stroke-width: 1.5;
            fill: none;
            stroke-dasharray: 3, 3;
        }
        .pointer-text {
            font-size: 11px;
            fill: #55606E;
        }
    </style>
</head>
<body>

<div class="svg-container">
    <svg viewBox="0 0 800 500" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <title>Levels of Biological Organization: Unicellular vs Multicellular</title>
        <desc>An animated diagram comparing an Amoeba, which performs all life processes as a single cell, to multicellular tissue and organs which divide labor among specialized cells.</desc>

        <!-- Definitions -->
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#2C3E50" />
            </marker>
            <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.2" />
            </filter>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#ffffff" />

        <!-- Titles -->
        <text x="400" y="40" font-size="22" font-weight="700" text-anchor="middle">Levels of Biological Organization</text>
        <text x="200" y="80" font-size="16" font-weight="600" text-anchor="middle">Unicellular (<tspan class="scientific">Amoeba</tspan>)</text>
        <text x="600" y="80" font-size="16" font-weight="600" text-anchor="middle">Multicellular (Tissue/Organ System)</text>

        <!-- Divider -->
        <line x1="400" y1="100" x2="400" y2="450" stroke="#D1D8E0" stroke-width="2" stroke-dasharray="6,6" />

        <!-- ========================================== -->
        <!-- PANEL A: UNICELLULAR (AMOEBA)              -->
        <!-- ========================================== -->
        <g id="panel-a">
            <!-- Food Particle (External) -->
            <circle class="food-particle" cx="50" cy="230" r="6" fill="#F39C12" />

            <!-- Amoeba Cell -->
            <g filter="url(#shadow)">
                <path fill="#E8F4FD" stroke="#4A90D9" stroke-width="3" stroke-linejoin="round">
                    <animate attributeName="d" dur="12s" repeatCount="indefinite"
                        values="
                            M 200,160 C 240,160 270,190 280,230 C 290,270 250,320 200,320 C 150,320 120,280 120,240 C 120,200 160,160 200,160 Z;
                            M 210,170 C 250,160 280,200 280,240 C 280,280 240,310 190,310 C 140,310 70,270 80,230 C 90,190 170,180 210,170 Z;
                            M 200,160 C 240,160 270,190 280,230 C 290,270 250,320 200,320 C 150,320 90,280 100,240 C 110,200 160,160 200,160 Z;
                            M 200,160 C 240,160 270,190 280,230 C 290,270 250,320 200,320 C 150,320 120,280 120,240 C 120,200 160,160 200,160 Z;
                            M 190,170 C 230,150 280,180 270,220 C 260,260 260,310 210,330 C 160,350 110,290 130,250 C 150,210 150,190 190,170 Z;
                            M 200,160 C 240,160 270,190 280,230 C 290,270 250,320 200,320 C 150,320 120,280 120,240 C 120,200 160,160 200,160 Z;
                            M 200,160 C 240,160 270,190 280,230 C 290,270 250,320 200,320 C 150,320 120,280 120,240 C 120,200 160,160 200,160 Z
                        "
                        keyTimes="0; 0.125; 0.25; 0.333; 0.583; 0.833; 1" />
                </path>
            </g>

            <!-- Organelles -->
            <!-- Nucleus -->
            <circle cx="210" cy="240" r="22" fill="#2C3E50" filter="url(#shadow)" />
            <circle cx="216" cy="234" r="6" fill="#1A252F" />
            
            <!-- Contractile Vacuole -->
            <circle class="contractile-vacuole" cx="160" cy="280" r="14" fill="#FFFFFF" stroke="#4A90D9" stroke-width="2" />
            
            <!-- Mitochondria -->
            <path d="M 170 190 Q 180 180 190 190 Q 180 200 170 190 Z" fill="#E74C3C" />
            <path d="M 240 280 Q 250 270 260 280 Q 250 290 240 280 Z" fill="#E74C3C" />
            <path d="M 250 200 Q 260 190 270 200 Q 260 210 250 200 Z" fill="#E74C3C" transform="rotate(45 260 200)" />

            <!-- Food Vacuole (Internal) -->
            <g class="food-vacuole">
                <circle cx="120" cy="240" r="10" fill="#E8F4FD" stroke="#4A90D9" stroke-width="1.5" />
                <circle cx="120" cy="240" r="5" fill="#F39C12" />
            </g>

            <!-- Pointers & Labels -->
            <path class="pointer" d="M 100 120 L 110 180" marker-end="url(#arrow)" />
            <text class="pointer-text" x="100" y="110" text-anchor="middle">Pseudopodium</text>

            <path class="pointer" d="M 320 180 L 235 230" marker-end="url(#arrow)" />
            <text class="pointer-text" x="320" y="170" text-anchor="middle">Nucleus</text>

            <!-- Dynamic Phase Label -->
            <rect class="label-amoeba" x="60" y="400" width="280" height="30" rx="15" fill="#E8F4FD" />
            <text class="label-amoeba" x="200" y="420" font-size="12" font-weight="600" text-anchor="middle" fill="#2C3E50">Single cell performs all life processes.</text>
        </g>

        <!-- ========================================== -->
        <!-- PANEL B: MULTICELLULAR (TISSUE/ORGAN)      -->
        <!-- ========================================== -->
        <g id="panel-b" class="panel-b">
            
            <!-- TISSUE LAYER -->
            <g id="tissue-layer">
                <!-- Intercellular Matrix (Background thick strokes) -->
                <g stroke="#D1D8E0" stroke-width="8" stroke-linejoin="round" fill="none">
                    <path d="M 600 155 L 621.65 167.5 L 621.65 192.5 L 600 205 L 578.35 192.5 L 578.35 167.5 Z" />
                    <path d="M 643.3 155 L 664.95 167.5 L 664.95 192.5 L 643.3 205 L 621.65 192.5 L 621.65 167.5 Z" />
                    <path d="M 556.7 155 L 578.35 167.5 L 578.35 192.5 L 556.7 205 L 535.05 192.5 L 535.05 167.5 Z" />
                    <path d="M 621.65 117.5 L 643.3 130 L 643.3 155 L 621.65 167.5 L 600 155 L 600 130 Z" />
                    <path d="M 578.35 117.5 L 600 130 L 600 155 L 578.35 167.5 L 556.7 155 L 556.7 130 Z" />
                    <path d="M 621.65 192.5 L 643.3 205 L 643.3 230 L 621.65 242.5 L 600 230 L 600 205 Z" />
                    <path d="M 578.35 192.5 L 600 205 L 600 230 L 578.35 242.5 L 556.7 230 L 556.7 205 Z" />
                </g>

                <!-- Cells (Hexagons) -->
                <!-- Center -->
                <g transform="translate(600, 180)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Right -->
                <g transform="translate(643.3, 180)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Left -->
                <g transform="translate(556.7, 180)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Top Right -->
                <g transform="translate(621.65, 142.5)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Top Left -->
                <g transform="translate(578.35, 142.5)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Bottom Right -->
                <g transform="translate(621.65, 217.5)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>
                <!-- Bottom Left -->
                <g transform="translate(578.35, 217.5)">
                    <path class="tissue-cell" d="M 0 -25 L 21.65 -12.5 L 21.65 12.5 L 0 25 L -21.65 12.5 L -21.65 -12.5 Z" fill="#E8F4FD" stroke="#4A90D9" stroke-width="2" />
                    <circle cx="0" cy="0" r="5" fill="#2C3E50" />
                </g>

                <!-- Signal Dots (Proteins) -->
                <circle class="signal" style="--dx: 43.3px; --dy: 0px;" cx="600" cy="180" r="3" fill="#98D8C8" />
                <circle class="signal" style="--dx: -43.3px; --dy: 0px;" cx="600" cy="180" r="3" fill="#98D8C8" />
                <circle class="signal" style="--dx: 21.65px; --dy: -37.5px;" cx="600" cy="180" r="3" fill="#98D8C8" />
                <circle class="signal" style="--dx: -21.65px; --dy: 37.5px;" cx="600" cy="180" r="3" fill="#98D8C8" />
            </g>

            <!-- ORGAN LAYER (Heart/Vessel) -->
            <g class="organ">
                <!-- Muscle Layer -->
                <path d="M 450 340 Q 600 370 750 340 L 750 420 Q 600 450 450 420 Z" fill="#F39C12" filter="url(#shadow)" />
                <!-- Muscle Striations -->
                <path d="M 470 350 L 470 365 M 520 345 L 520 360 M 570 342 L 570 357 M 620 342 L 620 357 M 670 345 L 670 360 M 720 350 L 720 365" stroke="#CD5C5C" stroke-width="2" opacity="0.6" />
                <path d="M 470 395 L 470 410 M 520 400 L 520 415 M 570 403 L 570 418 M 620 403 L 620 418 M 670 400 L 670 415 M 720 395 L 720 410" stroke="#CD5C5C" stroke-width="2" opacity="0.6" />
                
                <!-- Lumen -->
                <path d="M 450 355 Q 600 385 750 355 L 750 405 Q 600 435 450 405 Z" fill="#ffffff" />
                
                <!-- Blood Flow -->
                <circle r="5" fill="#E74C3C">
                    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 430 380 Q 600 410 770 380" begin="0s" />
                </circle>
                <circle r="5" fill="#E74C3C">
                    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 430 380 Q 600 410 770 380" begin="0.375s" />
                </circle>
                <circle r="5" fill="#E74C3C">
                    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 430 380 Q 600 410 770 380" begin="0.75s" />
                </circle>
                <circle r="5" fill="#E74C3C">
                    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 430 380 Q 600 410 770 380" begin="1.125s" />
                </circle>
            </g>

            <!-- Pointers & Labels -->
            <path class="pointer" d="M 730 130 L 635 160" marker-end="url(#arrow)" />
            <text class="pointer-text" x="730" y="120" text-anchor="middle">Intercellular Matrix</text>

            <path class="pointer" d="M 730 450 L 680 410" marker-end="url(#arrow)" />
            <text class="pointer-text" x="730" y="465" text-anchor="middle">Coordinated Contraction</text>

            <!-- Dynamic Phase Label -->
            <rect class="label-multi" x="430" y="460" width="340" height="30" rx="15" fill="#FFF3E0" />
            <text class="label-multi" x="600" y="480" font-size="12" font-weight="600" text-anchor="middle" fill="#D35400">Division of Labor: Specialized cells form tissues and organs.</text>
        </g>

        <!-- ========================================== -->
        <!-- LEGEND                                     -->
        <!-- ========================================== -->
        <g transform="translate(20, 440)">
            <rect x="0" y="0" width="140" height="50" rx="5" fill="#ffffff" stroke="#D1D8E0" stroke-width="1" />
            
            <rect x="10" y="10" width="10" height="10" fill="#4A90D9" />
            <text x="25" y="19" font-size="9">Cell Membrane</text>
            
            <rect x="10" y="30" width="10" height="10" fill="#2C3E50" />
            <text x="25" y="39" font-size="9">Nucleus</text>

            <rect x="85" y="10" width="10" height="10" fill="#98D8C8" />
            <text x="100" y="19" font-size="9">Signals</text>

            <rect x="85" y="30" width="10" height="10" fill="#E74C3C" />
            <text x="100" y="39" font-size="9">Blood/Mito.</text>
        </g>

    </svg>
</div>

</body>
</html>
