<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heterospory in Gymnosperms</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        svg {
            font-family: 'Inter', sans-serif;
            width: 100%;
            max-width: 1200px;
            height: auto;
            background-color: #f8f9fa;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .mono { font-family: 'Roboto Mono', monospace; }
        .title { font-size: 24px; font-weight: 700; fill: #2C3E50; }
        .subtitle { font-size: 14px; fill: #34495E; }
        .label { font-size: 14px; fill: #2C3E50; font-weight: 600; }
        .small-label { font-size: 12px; fill: #34495E; }
        .annotation { font-size: 11px; fill: #7F8C8D; font-style: italic; }
        .meiosis-text { font-size: 14px; font-weight: 700; fill: #E74C3C; letter-spacing: 1px; }

        /* Animations */
        @keyframes pulse-highlight {
            0%, 5% { opacity: 0; transform: scale(0.8); }
            10%, 15% { opacity: 1; transform: scale(1.1); }
            20%, 100% { opacity: 0; transform: scale(1.2); }
        }

        @keyframes mother-cell-anim {
            0%, 14% { opacity: 0; transform: translateY(-15px); }
            15%, 34% { opacity: 1; transform: translateY(0); }
            35%, 100% { opacity: 0; transform: translateY(0); }
        }

        @keyframes meiosis-text-anim {
            0%, 33% { opacity: 0; transform: translateY(-10px); }
            34%, 44% { opacity: 1; transform: translateY(0); }
            45%, 100% { opacity: 0; transform: translateY(10px); }
        }

        /* Microspores (Male) */
        @keyframes ms1 {
            0%, 34% { opacity: 0; transform: translate(250px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(250px, 350px) scale(1); }
            40%, 49% { opacity: 1; transform: translate(220px, 420px) scale(1); }
            50%, 85% { opacity: 1; transform: translate(370px, 540px) scale(1.5); }
            86%, 100% { opacity: 0; transform: translate(370px, 540px) scale(1.5); }
        }
        @keyframes ms2 {
            0%, 34% { opacity: 0; transform: translate(250px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(250px, 350px) scale(1); }
            40%, 49% { opacity: 1; transform: translate(240px, 440px) scale(1); }
            50%, 85% { opacity: 1; transform: translate(390px, 560px) scale(1.5); }
            86%, 100% { opacity: 0; transform: translate(390px, 560px) scale(1.5); }
        }
        @keyframes ms3 {
            0%, 34% { opacity: 0; transform: translate(250px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(250px, 350px) scale(1); }
            40%, 49% { opacity: 1; transform: translate(260px, 420px) scale(1); }
            50%, 85% { opacity: 1; transform: translate(410px, 540px) scale(1.5); }
            86%, 100% { opacity: 0; transform: translate(410px, 540px) scale(1.5); }
        }
        @keyframes ms4 {
            0%, 34% { opacity: 0; transform: translate(250px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(250px, 350px) scale(1); }
            40%, 49% { opacity: 1; transform: translate(280px, 440px) scale(1); }
            50%, 85% { opacity: 1; transform: translate(430px, 560px) scale(1.5); }
            86%, 100% { opacity: 0; transform: translate(430px, 560px) scale(1.5); }
        }

        /* Megaspores (Female) */
        @keyframes deg1 {
            0%, 34% { opacity: 0; transform: translate(750px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(750px, 390px) scale(1); }
            40%, 85% { opacity: 0.2; transform: translate(750px, 390px) scale(0.5); }
            86%, 100% { opacity: 0; transform: translate(750px, 390px) scale(0.5); }
        }
        @keyframes deg2 {
            0%, 34% { opacity: 0; transform: translate(750px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(750px, 405px) scale(1); }
            40%, 85% { opacity: 0.2; transform: translate(750px, 405px) scale(0.5); }
            86%, 100% { opacity: 0; transform: translate(750px, 405px) scale(0.5); }
        }
        @keyframes deg3 {
            0%, 34% { opacity: 0; transform: translate(750px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(750px, 420px) scale(1); }
            40%, 85% { opacity: 0.2; transform: translate(750px, 420px) scale(0.5); }
            86%, 100% { opacity: 0; transform: translate(750px, 420px) scale(0.5); }
        }
        @keyframes func-mega {
            0%, 34% { opacity: 0; transform: translate(750px, 350px) scale(0.5); }
            35%, 39% { opacity: 1; transform: translate(750px, 435px) scale(1); }
            40%, 49% { opacity: 1; transform: translate(750px, 435px) scale(2.5); }
            50%, 85% { opacity: 1; transform: translate(600px, 540px) scale(4); }
            86%, 100% { opacity: 0; transform: translate(600px, 540px) scale(4); }
        }

        @keyframes compare-fade {
            0%, 49% { opacity: 0; }
            55%, 85% { opacity: 1; }
            86%, 100% { opacity: 0; }
        }
    </style>
</head>
<body>

<svg viewBox="0 0 1000 700" role="img" aria-labelledby="svg-title svg-desc">
    <title id="svg-title">Heterospory in Gymnosperms</title>
    <desc id="svg-desc">Animated diagram showing the dual path of spore development. A microspore mother cell undergoes meiosis to form four small microspores, while a megaspore mother cell forms a linear tetrad where three degenerate and one becomes a large functional megaspore.</desc>

    <defs>
        <!-- Gradients -->
        <radialGradient id="micro-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#F7DC6F"/>
            <stop offset="100%" stop-color="#F1C40F"/>
        </radialGradient>
        <radialGradient id="mega-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#F0B27A"/>
            <stop offset="100%" stop-color="#E67E22"/>
        </radialGradient>
        <radialGradient id="cell-grad" cx="30%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="100%" stop-color="#E8F4FD"/>
        </radialGradient>
        
        <!-- Arrowhead -->
        <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#7F8C8D"/>
        </marker>
    </defs>

    <!-- Header -->
    <text x="500" y="40" class="title" text-anchor="middle">Heterospory: The Dual Path of Spore Development in Gymnosperms</text>
    <text x="500" y="65" class="subtitle" text-anchor="middle">Illustrating the morphological and functional differentiation between microspores and megaspores</text>

    <!-- Legend -->
    <g transform="translate(30, 620)">
        <rect x="0" y="0" width="160" height="60" rx="5" fill="#ffffff" stroke="#BDC3C7" stroke-width="1"/>
        <circle cx="15" cy="15" r="5" fill="#2ECC71"/>
        <text x="30" y="19" class="small-label">Sporophyte Tissue <tspan class="mono">(2n)</tspan></text>
        <circle cx="15" cy="30" r="5" fill="#F1C40F"/>
        <text x="30" y="34" class="small-label">Microspore <tspan class="mono">(n)</tspan></text>
        <circle cx="15" cy="45" r="5" fill="#E67E22"/>
        <text x="30" y="49" class="small-label">Megaspore <tspan class="mono">(n)</tspan></text>
    </g>

    <!-- STATIC BACKGROUND ELEMENTS -->
    <!-- Central Branch (Sporophyte 2n) -->
    <g id="sporophyte-branch">
        <path d="M 500 150 L 500 350" stroke="#2ECC71" stroke-width="10" stroke-linecap="round"/>
        <path d="M 500 250 Q 350 200 250 200" stroke="#2ECC71" stroke-width="6" fill="none"/>
        <path d="M 500 280 Q 650 220 750 220" stroke="#2ECC71" stroke-width="8" fill="none"/>
        <!-- Needles -->
        <path d="M 500 180 L 460 140 M 500 180 L 540 140 M 500 210 L 450 170 M 500 210 L 550 170 M 500 240 L 460 200 M 500 240 L 540 200" stroke="#27AE60" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Male Cone (Microstrobilus) Longitudinal Section -->
    <g id="male-cone-ls" transform="translate(250, 180)">
        <rect x="-4" y="-45" width="8" height="80" fill="#9A7D0A" rx="2"/>
        <!-- Left Scales & Sporangia -->
        <path d="M -4 -25 L -35 -35 L -35 -30 L -4 -15" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="-22" cy="-22" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
        <path d="M -4 -5 L -35 -15 L -35 -10 L -4 5" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="-22" cy="-2" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
        <path d="M -4 15 L -35 5 L -35 10 L -4 25" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="-22" cy="18" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
        <!-- Right Scales & Sporangia -->
        <path d="M 4 -25 L 35 -35 L 35 -30 L 4 -15" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="22" cy="-22" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
        <path d="M 4 -5 L 35 -15 L 35 -10 L 4 5" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="22" cy="-2" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
        <path d="M 4 15 L 35 5 L 35 10 L 4 25" fill="#D4AC0D" stroke="#9A7D0A" stroke-width="1"/>
        <ellipse cx="22" cy="18" rx="7" ry="4" fill="#F1C40F" stroke="#D4AC0D" stroke-width="1"/>
    </g>

    <!-- Female Cone (Megastrobilus) Longitudinal Section -->
    <g id="female-cone-ls" transform="translate(750, 170)">
        <rect x="-6" y="-55" width="12" height="100" fill="#6E2C00" rx="3"/>
        <!-- Left Scales & Ovules -->
        <path d="M -6 -35 L -50 -50 L -50 -40 L -6 -20" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="-28" cy="-46" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
        <path d="M -6 -5 L -50 -20 L -50 -10 L -6 10" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="-28" cy="-16" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
        <path d="M -6 25 L -50 10 L -50 20 L -6 40" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="-28" cy="14" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
        <!-- Right Scales & Ovules -->
        <path d="M 6 -35 L 50 -50 L 50 -40 L 6 -20" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="28" cy="-46" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
        <path d="M 6 -5 L 50 -20 L 50 -10 L 6 10" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="28" cy="-16" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
        <path d="M 6 25 L 50 10 L 50 20 L 6 40" fill="#A04000" stroke="#6E2C00" stroke-width="1"/>
        <circle cx="28" cy="14" r="5" fill="#E67E22" stroke="#A04000" stroke-width="1"/>
    </g>

    <!-- Static Labels -->
    <text x="250" y="100" class="label" text-anchor="middle">Microstrobilus (Male Cone)</text>
    <text x="750" y="100" class="label" text-anchor="middle">Megastrobilus (Female Cone)</text>
    
    <line x1="160" y1="160" x2="210" y2="160" stroke="#7F8C8D" stroke-width="1"/>
    <text x="155" y="164" class="small-label" text-anchor="end">Microsporophyll</text>
    
    <line x1="160" y1="180" x2="225" y2="180" stroke="#7F8C8D" stroke-width="1"/>
    <text x="155" y="184" class="small-label" text-anchor="end">Microsporangium</text>
    <text x="155" y="198" class="annotation" text-anchor="end">(abaxial surface)</text>

    <line x1="840" y1="150" x2="795" y2="150" stroke="#7F8C8D" stroke-width="1"/>
    <text x="845" y="154" class="small-label" text-anchor="start">Megasporophyll</text>
    
    <line x1="840" y1="170" x2="780" y2="170" stroke="#7F8C8D" stroke-width="1"/>
    <text x="845" y="174" class="small-label" text-anchor="start">Megasporangium / Ovule</text>
    <text x="845" y="188" class="annotation" text-anchor="start">(adaxial surface)</text>

    <!-- Pathway Arrows -->
    <path d="M 250 240 L 250 300" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
    <path d="M 750 240 L 750 300" stroke="#BDC3C7" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>


    <!-- ANIMATED ELEMENTS -->

    <!-- Highlight Pulses -->
    <g style="transform: translate(250px, 180px);">
        <circle cx="0" cy="0" r="55" fill="none" stroke="#F1C40F" stroke-width="3" stroke-dasharray="6,6" style="animation: pulse-highlight 15s infinite;"/>
    </g>
    <g style="transform: translate(750px, 170px);">
        <circle cx="0" cy="0" r="65" fill="none" stroke="#E67E22" stroke-width="3" stroke-dasharray="6,6" style="animation: pulse-highlight 15s infinite;"/>
    </g>

    <!-- Male Meiosis Pathway -->
    <g style="animation: mother-cell-anim 15s infinite;">
        <circle cx="250" cy="350" r="18" fill="url(#cell-grad)" stroke="#4A90D9" stroke-width="2"/>
        <circle cx="250" cy="350" r="5" fill="#2C3E50"/>
        <text x="250" y="385" class="small-label" text-anchor="middle">Microspore Mother Cell <tspan class="mono">(2n)</tspan></text>
    </g>

    <text x="250" y="395" class="meiosis-text" text-anchor="middle" style="animation: meiosis-text-anim 15s infinite;">MEIOSIS</text>

    <!-- Microspores (n) -->
    <g style="animation: ms1 15s infinite;">
        <circle cx="0" cy="0" r="5" fill="url(#micro-grad)" stroke="#D4AC0D" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>
    <g style="animation: ms2 15s infinite;">
        <circle cx="0" cy="0" r="5" fill="url(#micro-grad)" stroke="#D4AC0D" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>
    <g style="animation: ms3 15s infinite;">
        <circle cx="0" cy="0" r="5" fill="url(#micro-grad)" stroke="#D4AC0D" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>
    <g style="animation: ms4 15s infinite;">
        <circle cx="0" cy="0" r="5" fill="url(#micro-grad)" stroke="#D4AC0D" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>


    <!-- Female Meiosis Pathway -->
    <g style="animation: mother-cell-anim 15s infinite;">
        <circle cx="750" cy="350" r="18" fill="url(#cell-grad)" stroke="#4A90D9" stroke-width="2"/>
        <circle cx="750" cy="350" r="5" fill="#2C3E50"/>
        <text x="750" y="385" class="small-label" text-anchor="middle">Megaspore Mother Cell <tspan class="mono">(2n)</tspan></text>
    </g>

    <text x="750" y="395" class="meiosis-text" text-anchor="middle" style="animation: meiosis-text-anim 15s infinite;">MEIOSIS</text>

    <!-- Megaspore Tetrad (n) -->
    <g style="animation: deg1 15s infinite;">
        <circle cx="0" cy="0" r="6" fill="url(#mega-grad)" stroke="#A04000" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>
    <g style="animation: deg2 15s infinite;">
        <circle cx="0" cy="0" r="6" fill="url(#mega-grad)" stroke="#A04000" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>
    <g style="animation: deg3 15s infinite;">
        <circle cx="0" cy="0" r="6" fill="url(#mega-grad)" stroke="#A04000" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
        <text x="20" y="4" class="annotation" text-anchor="start">3 Degenerating Spores</text>
    </g>
    <g style="animation: func-mega 15s infinite;">
        <circle cx="0" cy="0" r="6" fill="url(#mega-grad)" stroke="#A04000" stroke-width="1"/>
        <circle cx="0" cy="0" r="1.5" fill="#2C3E50"/>
    </g>


    <!-- Comparison Zone -->
    <g style="animation: compare-fade 15s infinite;">
        <rect x="250" y="480" width="500" height="150" rx="10" fill="#ffffff" stroke="#E8F4FD" stroke-width="3"/>
        <text x="500" y="510" class="label" text-anchor="middle">Heterospory: Significant Size Disparity</text>
        
        <!-- Scale bar -->
        <line x1="350" y1="600" x2="650" y2="600" stroke="#2C3E50" stroke-width="2" stroke-dasharray="4,4"/>
        <line x1="350" y1="595" x2="350" y2="605" stroke="#2C3E50" stroke-width="2"/>
        <line x1="650" y1="595" x2="650" y2="605" stroke="#2C3E50" stroke-width="2"/>
        
        <text x="400" y="590" class="small-label" text-anchor="middle">Microspores <tspan class="mono">(n)</tspan></text>
        <text x="600" y="618" class="small-label" text-anchor="middle">Functional Megaspore <tspan class="mono">(n)</tspan></text>
        
        <text x="500" y="620" class="annotation" text-anchor="middle">Megaspore is heavily provisioned for female gametophyte development</text>
    </g>

</svg>

</body>
</html>
