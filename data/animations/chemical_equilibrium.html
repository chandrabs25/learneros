<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Equilibrium: Haber Process</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@500&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
        }

        svg {
            max-width: 100%;
            height: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            background-color: #ffffff;
            border-radius: 12px;
        }

        /* Typography */
        .title { font-size: 24px; font-weight: 700; fill: #333; text-anchor: middle; }
        .equation { font-family: 'Roboto Mono', monospace; font-size: 18px; font-weight: 500; fill: #555; text-anchor: middle; }
        .axis-label { font-size: 14px; fill: #666; text-anchor: middle; }
        .legend-text { font-size: 12px; fill: #444; }
        
        /* Graph Elements */
        .grid-line { stroke: #e0e0e0; stroke-width: 1; }
        .axis-line { stroke: #333; stroke-width: 2; fill: none; }
        .curve-forward { stroke: #F77F00; stroke-width: 3; fill: none; }
        .curve-reverse { stroke: #7209B7; stroke-width: 3; fill: none; }
        
        /* Animations */
        .graph-reveal {
            animation: reveal-graph 15s linear infinite;
        }
        
        @keyframes reveal-graph {
            0% { width: 0; }
            95% { width: 300px; }
            100% { width: 300px; }
        }

        .eq-zone {
            animation: fade-eq-zone 15s linear infinite;
        }

        @keyframes fade-eq-zone {
            0%, 49% { opacity: 0; }
            50%, 95% { opacity: 0.15; }
            100% { opacity: 0; }
        }

        .status-approaching {
            animation: text-approaching 15s linear infinite;
        }

        .status-reached {
            animation: text-reached 15s linear infinite;
        }

        @keyframes text-approaching {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        @keyframes text-reached {
            0%, 49% { opacity: 0; }
            50%, 95% { opacity: 1; }
            100% { opacity: 0; }
        }

        .reset-overlay {
            animation: reset-fade 15s linear infinite;
            pointer-events: none;
        }

        @keyframes reset-fade {
            0%, 2% { opacity: 1; }
            5%, 92% { opacity: 0; }
            96%, 100% { opacity: 1; }
        }

        /* Molecule Animations - Chain 1 */
        .c1-n2-i { animation: c1-n2-i 15s linear infinite; }
        .c1-h2-i1 { animation: c1-h2-i1 15s linear infinite; }
        .c1-h2-i2 { animation: c1-h2-i2 15s linear infinite; }
        .c1-h2-i3 { animation: c1-h2-i3 15s linear infinite; }
        
        @keyframes c1-n2-i { 0% { transform: translate(80px, 180px) rotate(0deg); opacity: 1; } 15% { transform: translate(150px, 250px) rotate(45deg); opacity: 1; } 20%, 100% { transform: translate(150px, 250px) rotate(45deg); opacity: 0; } }
        @keyframes c1-h2-i1 { 0% { transform: translate(120px, 160px) rotate(20deg); opacity: 1; } 15% { transform: translate(150px, 250px) rotate(90deg); opacity: 1; } 20%, 100% { transform: translate(150px, 250px) rotate(90deg); opacity: 0; } }
        @keyframes c1-h2-i2 { 0% { transform: translate(60px, 220px) rotate(-30deg); opacity: 1; } 15% { transform: translate(150px, 250px) rotate(10deg); opacity: 1; } 20%, 100% { transform: translate(150px, 250px) rotate(10deg); opacity: 0; } }
        @keyframes c1-h2-i3 { 0% { transform: translate(140px, 280px) rotate(60deg); opacity: 1; } 15% { transform: translate(150px, 250px) rotate(-20deg); opacity: 1; } 20%, 100% { transform: translate(150px, 250px) rotate(-20deg); opacity: 0; } }

        .c1-nh3-m1 { animation: c1-nh3-m1 15s linear infinite; }
        .c1-nh3-m2 { animation: c1-nh3-m2 15s linear infinite; }
        
        @keyframes c1-nh3-m1 { 0%, 19% { transform: translate(150px, 250px) rotate(0deg); opacity: 0; } 20% { transform: translate(150px, 250px) rotate(0deg); opacity: 1; } 45% { transform: translate(250px, 200px) rotate(120deg); opacity: 1; } 50%, 100% { transform: translate(250px, 200px) rotate(120deg); opacity: 0; } }
        @keyframes c1-nh3-m2 { 0%, 19% { transform: translate(150px, 250px) rotate(90deg); opacity: 0; } 20% { transform: translate(150px, 250px) rotate(90deg); opacity: 1; } 45% { transform: translate(250px, 200px) rotate(-45deg); opacity: 1; } 50%, 100% { transform: translate(250px, 200px) rotate(-45deg); opacity: 0; } }

        .c1-n2-l { animation: c1-n2-l 15s linear infinite; }
        .c1-h2-l1 { animation: c1-h2-l1 15s linear infinite; }
        .c1-h2-l2 { animation: c1-h2-l2 15s linear infinite; }
        .c1-h2-l3 { animation: c1-h2-l3 15s linear infinite; }

        @keyframes c1-n2-l { 0%, 49% { transform: translate(250px, 200px) rotate(0deg); opacity: 0; } 50% { transform: translate(250px, 200px) rotate(0deg); opacity: 1; } 65% { transform: translate(150px, 350px) rotate(60deg); opacity: 1; } 70%, 100% { transform: translate(150px, 350px) rotate(60deg); opacity: 0; } }
        @keyframes c1-h2-l1 { 0%, 49% { transform: translate(250px, 200px) rotate(45deg); opacity: 0; } 50% { transform: translate(250px, 200px) rotate(45deg); opacity: 1; } 65% { transform: translate(150px, 350px) rotate(-30deg); opacity: 1; } 70%, 100% { transform: translate(150px, 350px) rotate(-30deg); opacity: 0; } }
        @keyframes c1-h2-l2 { 0%, 49% { transform: translate(250px, 200px) rotate(-20deg); opacity: 0; } 50% { transform: translate(250px, 200px) rotate(-20deg); opacity: 1; } 65% { transform: translate(150px, 350px) rotate(90deg); opacity: 1; } 70%, 100% { transform: translate(150px, 350px) rotate(90deg); opacity: 0; } }
        @keyframes c1-h2-l3 { 0%, 49% { transform: translate(250px, 200px) rotate(80deg); opacity: 0; } 50% { transform: translate(250px, 200px) rotate(80deg); opacity: 1; } 65% { transform: translate(150px, 350px) rotate(-60deg); opacity: 1; } 70%, 100% { transform: translate(150px, 350px) rotate(-60deg); opacity: 0; } }

        .c1-nh3-e1 { animation: c1-nh3-e1 15s linear infinite; }
        .c1-nh3-e2 { animation: c1-nh3-e2 15s linear infinite; }

        @keyframes c1-nh3-e1 { 0%, 69% { transform: translate(150px, 350px) rotate(0deg); opacity: 0; } 70% { transform: translate(150px, 350px) rotate(0deg); opacity: 1; } 95%, 100% { transform: translate(100px, 400px) rotate(45deg); opacity: 1; } }
        @keyframes c1-nh3-e2 { 0%, 69% { transform: translate(150px, 350px) rotate(90deg); opacity: 0; } 70% { transform: translate(150px, 350px) rotate(90deg); opacity: 1; } 95%, 100% { transform: translate(200px, 420px) rotate(-30deg); opacity: 1; } }

        /* Molecule Animations - Chain 2 */
        .c2-n2-i { animation: c2-n2-i 15s linear infinite; }
        .c2-h2-i1 { animation: c2-h2-i1 15s linear infinite; }
        .c2-h2-i2 { animation: c2-h2-i2 15s linear infinite; }
        .c2-h2-i3 { animation: c2-h2-i3 15s linear infinite; }

        @keyframes c2-n2-i { 0% { transform: translate(400px, 180px) rotate(10deg); opacity: 1; } 30% { transform: translate(350px, 300px) rotate(-45deg); opacity: 1; } 35%, 100% { transform: translate(350px, 300px) rotate(-45deg); opacity: 0; } }
        @keyframes c2-h2-i1 { 0% { transform: translate(350px, 150px) rotate(40deg); opacity: 1; } 30% { transform: translate(350px, 300px) rotate(90deg); opacity: 1; } 35%, 100% { transform: translate(350px, 300px) rotate(90deg); opacity: 0; } }
        @keyframes c2-h2-i2 { 0% { transform: translate(450px, 220px) rotate(-10deg); opacity: 1; } 30% { transform: translate(350px, 300px) rotate(30deg); opacity: 1; } 35%, 100% { transform: translate(350px, 300px) rotate(30deg); opacity: 0; } }
        @keyframes c2-h2-i3 { 0% { transform: translate(380px, 260px) rotate(70deg); opacity: 1; } 30% { transform: translate(350px, 300px) rotate(-60deg); opacity: 1; } 35%, 100% { transform: translate(350px, 300px) rotate(-60deg); opacity: 0; } }

        .c2-nh3-m1 { animation: c2-nh3-m1 15s linear infinite; }
        .c2-nh3-m2 { animation: c2-nh3-m2 15s linear infinite; }

        @keyframes c2-nh3-m1 { 0%, 34% { transform: translate(350px, 300px) rotate(0deg); opacity: 0; } 35% { transform: translate(350px, 300px) rotate(0deg); opacity: 1; } 65% { transform: translate(350px, 200px) rotate(180deg); opacity: 1; } 70%, 100% { transform: translate(350px, 200px) rotate(180deg); opacity: 0; } }
        @keyframes c2-nh3-m2 { 0%, 34% { transform: translate(350px, 300px) rotate(90deg); opacity: 0; } 35% { transform: translate(350px, 300px) rotate(90deg); opacity: 1; } 65% { transform: translate(350px, 200px) rotate(-90deg); opacity: 1; } 70%, 100% { transform: translate(350px, 200px) rotate(-90deg); opacity: 0; } }

        .c2-n2-e { animation: c2-n2-e 15s linear infinite; }
        .c2-h2-e1 { animation: c2-h2-e1 15s linear infinite; }
        .c2-h2-e2 { animation: c2-h2-e2 15s linear infinite; }
        .c2-h2-e3 { animation: c2-h2-e3 15s linear infinite; }

        @keyframes c2-n2-e { 0%, 69% { transform: translate(350px, 200px) rotate(0deg); opacity: 0; } 70% { transform: translate(350px, 200px) rotate(0deg); opacity: 1; } 95%, 100% { transform: translate(420px, 150px) rotate(45deg); opacity: 1; } }
        @keyframes c2-h2-e1 { 0%, 69% { transform: translate(350px, 200px) rotate(30deg); opacity: 0; } 70% { transform: translate(350px, 200px) rotate(30deg); opacity: 1; } 95%, 100% { transform: translate(300px, 120px) rotate(-20deg); opacity: 1; } }
        @keyframes c2-h2-e2 { 0%, 69% { transform: translate(350px, 200px) rotate(-40deg); opacity: 0; } 70% { transform: translate(350px, 200px) rotate(-40deg); opacity: 1; } 95%, 100% { transform: translate(450px, 250px) rotate(80deg); opacity: 1; } }
        @keyframes c2-h2-e3 { 0%, 69% { transform: translate(350px, 200px) rotate(60deg); opacity: 0; } 70% { transform: translate(350px, 200px) rotate(60deg); opacity: 1; } 95%, 100% { transform: translate(380px, 100px) rotate(-60deg); opacity: 1; } }

        /* Background Floating Molecules */
        .bg-n2-1 { animation: float-1 15s ease-in-out infinite; }
        .bg-n2-2 { animation: float-2 15s ease-in-out infinite; }
        .bg-h2-1 { animation: float-3 15s ease-in-out infinite; }
        .bg-h2-2 { animation: float-4 15s ease-in-out infinite; }
        .bg-h2-3 { animation: float-5 15s ease-in-out infinite; }
        .bg-h2-4 { animation: float-6 15s ease-in-out infinite; }
        .bg-h2-5 { animation: float-1 15s ease-in-out infinite reverse; }
        .bg-h2-6 { animation: float-2 15s ease-in-out infinite reverse; }

        @keyframes float-1 { 0% { transform: translate(100px, 350px) rotate(0deg); } 50% { transform: translate(180px, 420px) rotate(90deg); } 100% { transform: translate(100px, 350px) rotate(0deg); } }
        @keyframes float-2 { 0% { transform: translate(420px, 380px) rotate(45deg); } 50% { transform: translate(320px, 430px) rotate(-45deg); } 100% { transform: translate(420px, 380px) rotate(45deg); } }
        @keyframes float-3 { 0% { transform: translate(200px, 120px) rotate(10deg); } 50% { transform: translate(280px, 180px) rotate(120deg); } 100% { transform: translate(200px, 120px) rotate(10deg); } }
        @keyframes float-4 { 0% { transform: translate(300px, 400px) rotate(-30deg); } 50% { transform: translate(220px, 350px) rotate(60deg); } 100% { transform: translate(300px, 400px) rotate(-30deg); } }
        @keyframes float-5 { 0% { transform: translate(80px, 280px) rotate(80deg); } 50% { transform: translate(120px, 200px) rotate(-10deg); } 100% { transform: translate(80px, 280px) rotate(80deg); } }
        @keyframes float-6 { 0% { transform: translate(450px, 150px) rotate(-70deg); } 50% { transform: translate(380px, 100px) rotate(20deg); } 100% { transform: translate(450px, 150px) rotate(-70deg); } }

    </style>
</head>
<body>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <title>Dynamic Equilibrium: Haber Process</title>
        <desc>An animated diagram showing the dynamic chemical equilibrium of the Haber Process where Nitrogen and Hydrogen react to form Ammonia, and Ammonia decomposes back, at equal rates.</desc>

        <defs>
            <!-- Gradients for 3D sphere effect -->
            <radialGradient id="grad-N" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#8888FF" />
                <stop offset="100%" stop-color="#4444FF" />
            </radialGradient>
            <radialGradient id="grad-H" cx="30%" cy="30%" r="70%">
                <stop offset="0%" stop-color="#FFFFFF" />
                <stop offset="100%" stop-color="#CCCCCC" />
            </radialGradient>

            <!-- Molecule Templates -->
            <g id="n2">
                <!-- Triple Bond -->
                <line x1="-10" y1="-4" x2="10" y2="-4" stroke="#404040" stroke-width="2"/>
                <line x1="-10" y1="0" x2="10" y2="0" stroke="#404040" stroke-width="2"/>
                <line x1="-10" y1="4" x2="10" y2="4" stroke="#404040" stroke-width="2"/>
                <!-- Atoms -->
                <circle cx="-12" cy="0" r="12" fill="url(#grad-N)"/>
                <circle cx="12" cy="0" r="12" fill="url(#grad-N)"/>
            </g>

            <g id="h2">
                <!-- Single Bond -->
                <line x1="-6" y1="0" x2="6" y2="0" stroke="#404040" stroke-width="2"/>
                <!-- Atoms -->
                <circle cx="-6" cy="0" r="6" fill="url(#grad-H)"/>
                <circle cx="6" cy="0" r="6" fill="url(#grad-H)"/>
            </g>

            <g id="nh3">
                <!-- Bonds -->
                <line x1="0" y1="0" x2="0" y2="-14" stroke="#404040" stroke-width="2"/>
                <line x1="0" y1="0" x2="-12" y2="8" stroke="#404040" stroke-width="2"/>
                <line x1="0" y1="0" x2="12" y2="8" stroke="#404040" stroke-width="2"/>
                <!-- Atoms -->
                <circle cx="0" cy="0" r="12" fill="url(#grad-N)"/>
                <circle cx="0" cy="-14" r="6" fill="url(#grad-H)"/>
                <circle cx="-12" cy="8" r="6" fill="url(#grad-H)"/>
                <circle cx="12" cy="8" r="6" fill="url(#grad-H)"/>
            </g>

            <!-- Clip Path for Graph Reveal -->
            <clipPath id="graph-clip">
                <rect x="600" y="180" height="260" class="graph-reveal" />
            </clipPath>
        </defs>

        <!-- Header -->
        <text x="500" y="45" class="title">Dynamic Equilibrium: Haber Process</text>
        <text x="500" y="75" class="equation">N₂(g) + 3H₂(g) ⇌ 2NH₃(g)</text>

        <!-- ========================================== -->
        <!-- LEFT PANEL: REACTION CHAMBER               -->
        <!-- ========================================== -->
        
        <!-- Chamber Background -->
        <rect x="50" y="120" width="450" height="350" rx="20" fill="#ffffff" stroke="#cccccc" stroke-width="3" />
        
        <!-- Large Background Equilibrium Arrow -->
        <g opacity="0.15" transform="translate(125, 270) scale(1.5)">
            <!-- Top half arrow (Forward) -->
            <path d="M 20 0 L 180 0 M 160 -10 L 180 0" stroke="#7209B7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Bottom half arrow (Reverse) -->
            <path d="M 20 20 L 180 20 M 40 30 L 20 20" stroke="#7209B7" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Molecules -->
        <!-- Background (Non-reacting) -->
        <use href="#n2" class="bg-n2-1" />
        <use href="#n2" class="bg-n2-2" />
        <use href="#h2" class="bg-h2-1" />
        <use href="#h2" class="bg-h2-2" />
        <use href="#h2" class="bg-h2-3" />
        <use href="#h2" class="bg-h2-4" />
        <use href="#h2" class="bg-h2-5" />
        <use href="#h2" class="bg-h2-6" />

        <!-- Chain 1: N2 + 3H2 -> 2NH3 -> N2 + 3H2 -> 2NH3 -->
        <use href="#n2" class="c1-n2-i" />
        <use href="#h2" class="c1-h2-i1" />
        <use href="#h2" class="c1-h2-i2" />
        <use href="#h2" class="c1-h2-i3" />
        
        <use href="#nh3" class="c1-nh3-m1" />
        <use href="#nh3" class="c1-nh3-m2" />

        <use href="#n2" class="c1-n2-l" />
        <use href="#h2" class="c1-h2-l1" />
        <use href="#h2" class="c1-h2-l2" />
        <use href="#h2" class="c1-h2-l3" />

        <use href="#nh3" class="c1-nh3-e1" />
        <use href="#nh3" class="c1-nh3-e2" />

        <!-- Chain 2: N2 + 3H2 -> 2NH3 -> N2 + 3H2 -->
        <use href="#n2" class="c2-n2-i" />
        <use href="#h2" class="c2-h2-i1" />
        <use href="#h2" class="c2-h2-i2" />
        <use href="#h2" class="c2-h2-i3" />

        <use href="#nh3" class="c2-nh3-m1" />
        <use href="#nh3" class="c2-nh3-m2" />

        <use href="#n2" class="c2-n2-e" />
        <use href="#h2" class="c2-h2-e1" />
        <use href="#h2" class="c2-h2-e2" />
        <use href="#h2" class="c2-h2-e3" />

        <!-- Chamber Legend -->
        <rect x="60" y="485" width="430" height="40" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
        <g transform="translate(80, 505)">
            <circle cx="0" cy="0" r="6" fill="url(#grad-N)"/>
            <text x="15" y="4" class="legend-text">Nitrogen (N₂)</text>
            
            <circle cx="120" cy="0" r="6" fill="url(#grad-H)"/>
            <text x="135" y="4" class="legend-text">Hydrogen (H₂)</text>
            
            <circle cx="240" cy="0" r="6" fill="url(#grad-N)"/>
            <circle cx="234" cy="4" r="3" fill="url(#grad-H)"/>
            <circle cx="246" cy="4" r="3" fill="url(#grad-H)"/>
            <circle cx="240" cy="-6" r="3" fill="url(#grad-H)"/>
            <text x="255" y="4" class="legend-text">Ammonia (NH₃)</text>
        </g>


        <!-- ========================================== -->
        <!-- RIGHT PANEL: REACTION RATE GRAPH           -->
        <!-- ========================================== -->
        
        <!-- Status Indicator -->
        <text x="750" y="150" class="status-approaching" font-weight="600" fill="#F77F00">System approaching equilibrium...</text>
        <text x="750" y="150" class="status-reached" font-weight="600" fill="#44CC44">DYNAMIC EQUILIBRIUM REACHED (R_f = R_r)</text>

        <!-- Graph Grid -->
        <g class="grid">
            <line x1="600" y1="240" x2="900" y2="240" class="grid-line" />
            <line x1="600" y1="280" x2="900" y2="280" class="grid-line" />
            <line x1="600" y1="320" x2="900" y2="320" class="grid-line" stroke-dasharray="4" /> <!-- Eq Level -->
            <line x1="600" y1="360" x2="900" y2="360" class="grid-line" />
            <line x1="600" y1="400" x2="900" y2="400" class="grid-line" />
        </g>

        <!-- Equilibrium Zone Shading -->
        <rect x="750" y="200" width="150" height="240" fill="#44CC44" class="eq-zone" />

        <!-- Axes -->
        <polyline points="600,200 600,440 920,440" class="axis-line" />
        
        <!-- Axis Labels -->
        <text x="-320" y="570" transform="rotate(-90)" class="axis-label" font-weight="600">Rate of Reaction</text>
        <text x="750" y="470" class="axis-label" font-weight="600">Time</text>

        <!-- Graph Curves (Clipped for animation) -->
        <g clip-path="url(#graph-clip)">
            <!-- Forward Rate (Orange) -->
            <path d="M 600 220 C 650 220, 700 320, 750 320 L 900 320" class="curve-forward" />
            <!-- Reverse Rate (Purple) -->
            <path d="M 600 420 C 650 420, 700 320, 750 320 L 900 320" class="curve-reverse" />
        </g>

        <!-- Graph Legend -->
        <g transform="translate(620, 500)">
            <line x1="0" y1="0" x2="30" y2="0" stroke="#F77F00" stroke-width="3" />
            <text x="40" y="4" class="legend-text">Forward Rate (R_f)</text>
            
            <line x1="160" y1="0" x2="190" y2="0" stroke="#7209B7" stroke-width="3" />
            <text x="200" y="4" class="legend-text">Reverse Rate (R_r)</text>
        </g>

        <!-- Global Reset Overlay to hide the loop snap -->
        <rect x="0" y="0" width="1000" height="600" fill="#f8f9fa" class="reset-overlay" />

    </svg>

</body>
</html>
